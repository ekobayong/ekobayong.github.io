<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose of Cells — A Voronoi Stained-Glass Window</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Georgia,'Palatino Linotype',Palatino,'Times New Roman',serif;
    color:#cdbfa4;
    display:grid;
    grid-template-rows:auto 1fr auto;
    overflow:hidden;
    background:#141210;
  }

  /* ---------- header / footer ---------- */
  header{
    position:relative;z-index:5;text-align:center;
    padding:22px 16px 10px;
  }
  header h1{
    font-size:clamp(17px,2.6vw,26px);font-weight:400;
    text-transform:uppercase;letter-spacing:.42em;color:#d7b36a;
    text-shadow:0 0 26px rgba(215,179,106,.35);
    margin-right:-.42em;
  }
  header p{font-style:italic;font-size:12.5px;color:rgba(205,191,164,.65);margin-top:7px}
  footer{
    position:relative;z-index:5;
    display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    padding:14px 16px 20px;
  }
  .btn{
    appearance:none;cursor:pointer;
    font-family:inherit;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:#cdbfa4;
    background:rgba(20,16,12,.55);
    border:1px solid rgba(215,179,106,.28);
    border-radius:999px;
    padding:8px 15px;
    display:inline-flex;align-items:center;gap:8px;
    transition:border-color .25s,color .25s,background .25s;
  }
  .btn:hover{border-color:rgba(215,179,106,.7);color:#f2e2bd;background:rgba(40,32,22,.6)}
  .btn.active{border-color:#d7b36a;color:#f6e8c6;background:rgba(64,50,28,.55);box-shadow:0 0 18px rgba(215,179,106,.2)}
  .swatches{display:inline-flex;gap:3px}
  .swatches i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
  .keyhint{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(205,191,164,.4)}

  /* ---------- scene: the wall ---------- */
  #scene{position:relative;overflow:hidden}
  #wall{
    position:absolute;inset:0;
    background:
      /* warm glow near the window */
      radial-gradient(46vw 52vh at 50% 38%, rgba(255,192,110,.10), rgba(255,192,110,0) 62%),
      /* faint diagonal grain */
      repeating-linear-gradient(122deg, rgba(255,255,255,.022) 0 2px, rgba(255,255,255,0) 2px 9px),
      /* horizontal mortar courses every 92px */
      repeating-linear-gradient(180deg, rgba(23,20,15,0) 0 90px, #17140f 90px 92px),
      /* vertical joints, row A at x ≡ 0 (220px spacing) */
      repeating-linear-gradient(90deg, rgba(23,20,15,0) 0 218px, #17140f 218px 220px),
      /* stone body */
      linear-gradient(180deg,#3a3531 0%,#2b2724 55%,#1d1a18 100%);
  }
  /* vertical joints, row B at x ≡ 110 — masked to alternating courses */
  #wall::after{
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, rgba(23,20,15,0) 0 108px, #17140f 108px 110px, rgba(23,20,15,0) 110px 220px);
    -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 92px,transparent 92px 184px);
            mask-image:repeating-linear-gradient(180deg,#000 0 92px,transparent 92px 184px);
  }
  /* heavy corner vignette */
  #scene::after{
    content:"";
    position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(120% 130% at 50% 42%, rgba(0,0,0,0) 38%, rgba(4,3,2,.55) 74%, rgba(0,0,0,.86) 100%);
  }

  /* halo of light escaping the glass */
  #halo{
    position:absolute;left:50%;top:44%;
    width:min(92vw,860px);aspect-ratio:1/1.5;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(255,205,130,.13), rgba(255,180,90,.05) 55%, transparent 72%);
    filter:blur(24px);
    pointer-events:none;
  }

  /* the window */
  #glass{
    position:absolute;left:50%;bottom:calc(26vh - 12px);
    transform:translateX(-50%);
    cursor:crosshair;
    filter:drop-shadow(0 0 34px rgba(255,200,120,.22)) drop-shadow(0 22px 44px rgba(0,0,0,.6));
  }

  /* ---------- floor + cast light ---------- */
  #floor{
    position:absolute;left:0;right:0;bottom:0;height:26vh;z-index:2;
    background:linear-gradient(180deg,#14110f 0%,#0d0b0a 100%);
  }
  #floor::before{ /* faint perspective flagstone lines */
    content:"";
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.033) 0 1px, transparent 1px 128px),
      repeating-linear-gradient(0deg,  rgba(255,255,255,.05)  0 1px, transparent 1px 46px);
    transform:perspective(420px) rotateX(52deg);
    transform-origin:top center;
    opacity:.6;
    -webkit-mask-image:linear-gradient(180deg,transparent, #000 30%);
            mask-image:linear-gradient(180deg,transparent, #000 30%);
  }
  #cast{
    position:absolute;left:50%;top:-5vh;
    width:min(72vw,560px);
    height:34vh;
    transform:translateX(-50%) perspective(500px) rotateX(62deg) scaleY(-1);
    transform-origin:50% 0%;
    filter:blur(22px) saturate(1.6);
    opacity:.55;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  #castfade{ /* darken the far end of the spill */
    position:absolute;left:0;right:0;bottom:0;height:26vh;pointer-events:none;z-index:3;
    background:linear-gradient(180deg, transparent 0%, rgba(10,8,6,.5) 82%);
  }
</style>
</head>
<body>

<header>
  <h1>Rose of Cells</h1>
  <p>a window of fortune: every pane a Voronoi cell, cut fresh each time the light returns</p>
</header>

<div id="scene">
  <div id="wall"></div>
  <div id="halo"></div>
  <canvas id="glass" aria-label="Generative Voronoi stained-glass window. Click inside the arch to set a new pane."></canvas>
  <div id="floor">
    <canvas id="cast" aria-hidden="true"></canvas>
  </div>
  <div id="castfade" aria-hidden="true"></div>
</div>

<footer>
  <button class="btn active" id="pChartres"><span class="swatches" data-sw="Chartres"></span>Chartres</button>
  <button class="btn" id="pAutumn"><span class="swatches" data-sw="Autumn"></span>Autumn</button>
  <button class="btn" id="pEmerald"><span class="swatches" data-sw="Emerald"></span>Emerald</button>
  <button class="btn" id="regen">Regenerate</button>
  <span class="keyhint">R · click the glass to set a new pane</span>
</footer>

<script>
(function(){
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = s => document.querySelector(s);

  /* ================= palettes ================= */
  const PALETTES = {
    Chartres:{
      swatch:['#1b2f8f','#a91f30','#d8b25c','#2b64c8'],
      /* weighted pool: cobalt & ultramarine dominate, ruby accents, bright few */
      colors:['#1b2f8f','#233fa8','#1a4fb5','#2b64c8','#1b2f8f','#233fa8','#1a4fb5','#2b64c8',
              '#8f1626','#a91f30','#c0392b','#d8b25c','#e8d6a2','#4b2a7a','#f1f0e8','#1d6e6b']
    },
    Autumn:{
      swatch:['#a33d13','#d9931c','#6b6a1f','#e9c98a'],
      colors:['#a33d13','#c25a1c','#d9931c','#e8b23a','#7a2a12','#6b6a1f','#8e8a2e','#4d2b1a',
              '#e9c98a','#b3471a','#a33d13','#5b3a1e','#d97c2b','#c25a1c','#7a2a12','#e8b23a']
    },
    Emerald:{
      swatch:['#0b4a2a','#158a4a','#c9a44b','#3fbf9a'],
      colors:['#0b4a2a','#0f6b3c','#158a4a','#1e8f7a','#2ea78c','#116d5a','#3fbf9a','#0d3c3a',
              '#0b4a2a','#0f6b3c','#158a4a','#c9a44b','#e6d38a','#f0ead2','#0a2f26','#2ea78c']
    }
  };
  let palette='Chartres';

  /* ================= colour helpers ================= */
  function hex2rgb(h){
    return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  }
  function mix(a,b,t){
    const A=hex2rgb(a),B=hex2rgb(b);
    return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
  }

  /* ================= geometry ================= */
  const canvas=$('#glass'), ctx=canvas.getContext('2d');
  const cast=$('#cast'), cctx=cast.getContext('2d');
  const off=document.createElement('canvas'), octx=off.getContext('2d');
  const snap=document.createElement('canvas'), sctx=snap.getContext('2d');

  let W=0,H=0,DPR=1;          /* logical size of the lancet */
  let springY=0;              /* arch springing line */
  let sites=[], cells=[], tints=[];
  let grow=null;              /* {poly,site,centro,tint,t0} */
  let castW=0,castH=0,castDpr=1;

  /* equilateral gothic arch: straight sides to the springing line,
     then two arcs of radius W centred on the opposite springing points */
  function archPath(c){
    c.beginPath();
    c.moveTo(0,H);
    c.lineTo(0,springY);
    c.arc(W,springY,W,Math.PI,4*Math.PI/3,false);   /* left arc → apex */
    c.arc(0,springY,W,-Math.PI/3,0,false);          /* apex → right springing */
    c.lineTo(W,H);
    c.closePath();
  }
  function insideArch(x,y){
    if(x<0||x>W||y<0||y>H) return false;
    if(y>=springY) return true;
    const dy=y-springY;
    const d1=(x-W)*(x-W)+dy*dy, d2=x*x+dy*dy;
    return d1<=W*W && d2<=W*W;
  }

  /* Poisson-like scatter inside the arch */
  function scatter(n){
    const minD=Math.sqrt(W*H*0.82/n)*0.88;
    const pts=[];
    let guard=0;
    while(pts.length<n && guard<n*400){
      guard++;
      const x=Math.random()*W, y=Math.random()*H;
      if(!insideArch(x,y)) continue;
      let ok=true;
      for(const p of pts){
        const dx=p.x-x, dy=p.y-y;
        if(dx*dx+dy*dy<minD*minD){ok=false;break;}
      }
      if(ok) pts.push({x,y});
    }
    return pts;
  }

  /* Sutherland–Hodgman half-plane clip: keep points nearer `s` than `o` */
  function clipBisector(poly,s,o){
    const mx=(s.x+o.x)/2, my=(s.y+o.y)/2;
    const nx=o.x-s.x, ny=o.y-s.y;    /* keep where dot(p−m, n) <= 0 */
    const out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length];
      const da=(a.x-mx)*nx+(a.y-my)*ny;
      const db=(b.x-mx)*nx+(b.y-my)*ny;
      if(da<=0) out.push(a);
      if((da<0&&db>0)||(da>0&&db<0)){
        const t=da/(da-db);
        out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
      }
    }
    return out;
  }
  function cellOf(site,all){
    let poly=[{x:-2,y:-2},{x:W+2,y:-2},{x:W+2,y:H+2},{x:-2,y:H+2}];
    for(const o of all){
      if(o===site) continue;
      poly=clipBisector(poly,site,o);
      if(poly.length<3) break;
    }
    return poly;
  }
  function centroid(poly){
    let x=0,y=0;
    for(const p of poly){x+=p.x;y+=p.y;}
    return {x:x/poly.length,y:y/poly.length};
  }
  function polyPath(c,poly){
    c.beginPath();
    c.moveTo(poly[0].x,poly[0].y);
    for(let i=1;i<poly.length;i++) c.lineTo(poly[i].x,poly[i].y);
    c.closePath();
  }

  /* ================= glass painting (offscreen layer) ================= */
  function paintPane(c,poly,site,base){
    if(poly.length<3) return;
    let rmax=0;
    for(const p of poly){
      const d=Math.hypot(p.x-site.x,p.y-site.y);
      if(d>rmax) rmax=d;
    }
    rmax=Math.max(rmax,26);
    /* highlight offset toward the site and up-left → uneven glass thickness */
    const gx=site.x-rmax*0.28, gy=site.y-rmax*0.34;
    const g=c.createRadialGradient(gx,gy,rmax*0.06, site.x,site.y,rmax);
    g.addColorStop(0, mix(base,'#ffffff',0.32));
    g.addColorStop(0.55, base);
    g.addColorStop(1, mix(base,'#000000',0.55));
    polyPath(c,poly);
    c.fillStyle=g; c.fill();
  }
  function paintLeads(c,poly){
    polyPath(c,poly);
    c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle='#17130f'; c.lineWidth=6; c.stroke();
    c.strokeStyle='rgba(240,232,214,0.22)'; c.lineWidth=1.2; c.stroke();
  }
  function drawGlassLayer(){
    octx.setTransform(DPR,0,0,DPR,0,0);
    octx.clearRect(0,0,W,H);
    octx.save();
    archPath(octx);
    octx.clip();
    octx.fillStyle='#0d0a08';
    octx.fillRect(0,0,W,H);
    const pool=PALETTES[palette].colors;
    cells.forEach((poly,i)=>paintPane(octx,poly,sites[i],pool[tints[i]%pool.length]));
    /* glass grain: faint white diagonal streaks, clipped inside the window */
    octx.strokeStyle='rgba(255,255,255,0.09)';
    octx.lineWidth=1.3;
    for(let o=-H;o<W;o+=11){
      octx.beginPath();
      octx.moveTo(o,0);
      octx.lineTo(o+H,H);
      octx.stroke();
    }
    /* lead around every pane */
    cells.forEach(poly=>paintLeads(octx,poly));
    octx.restore();
    /* outer lead frame + thin pale reveal */
    octx.lineJoin='round';
    archPath(octx);
    octx.strokeStyle='#17130f'; octx.lineWidth=8; octx.stroke();
    octx.save();
    archPath(octx);
    octx.clip();
    archPath(octx);
    octx.strokeStyle='rgba(244,236,214,0.35)'; octx.lineWidth=1.6; octx.stroke();
    octx.restore();
  }

  /* ================= layout / diagram build ================= */
  function layout(){
    const scene=$('#scene');
    const availH=scene.clientHeight*0.74;
    const availW=scene.clientWidth-32;
    let w=Math.min(640, availW, availH/1.75);
    W=Math.round(Math.max(w,180));
    H=Math.round(W*1.75);
    springY=Math.round(H*0.58);           /* sides rise through 42 % of the height */
    DPR=Math.min(2,devicePixelRatio||1);
    for(const cv of [canvas,off,snap]){
      cv.width=Math.round(W*DPR);
      cv.height=Math.round(H*DPR);
    }
    canvas.style.width=W+'px';
    canvas.style.height=H+'px';
    build(true);
  }
  function build(newSeeds){
    const n=Math.max(26,Math.min(70,Math.round(W*H*0.82/8800)));
    if(newSeeds){
      sites=scatter(n);
      tints=sites.map(()=>Math.floor(Math.random()*16));
    }
    cells=sites.map(s=>cellOf(s,sites));
    drawGlassLayer();
  }
  function layoutCast(){
    castDpr=Math.min(2,devicePixelRatio||1);
    castW=cast.offsetWidth;
    castH=cast.offsetHeight;
    cast.width=Math.max(4,Math.round(castW*castDpr));
    cast.height=Math.max(4,Math.round(castH*castDpr));
  }

  /* ================= frame loop: shimmer sweep + floor cast ================= */
  let t0=performance.now();
  function frame(now){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    if(grow){
      /* growth of a new pane over a snapshot of the previous glass */
      const t=Math.min(1,(now-grow.t0)/620);
      const e=1-Math.pow(1-t,3);                 /* cubic ease-out */
      ctx.drawImage(snap,0,0,W,H);
      const c0=grow.centro;
      ctx.save();
      archPath(ctx); ctx.clip();
      ctx.translate(c0.x,c0.y); ctx.scale(e,e); ctx.translate(-c0.x,-c0.y);
      paintPane(ctx,grow.poly,grow.site,PALETTES[palette].colors[grow.tint%16]);
      ctx.save();
      polyPath(ctx,grow.poly); ctx.clip();
      ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=1.3;
      for(let o=-H;o<W;o+=11){ctx.beginPath();ctx.moveTo(o,0);ctx.lineTo(o+H,H);ctx.stroke();}
      ctx.restore();
      paintLeads(ctx,grow.poly);
      ctx.restore();
      if(t>=1){ grow=null; build(false); }
    }else{
      ctx.drawImage(off,0,0,W,H);
      /* slow diagonal sheet of warm light sweeping across, clipped to the arch */
      if(!REDUCED){
        ctx.save();
        archPath(ctx); ctx.clip();
        const p=((now-t0)/9000)%1;
        const sweep=p*1.6-0.3;
        const lg=ctx.createLinearGradient(W*(sweep-0.22),0,W*(sweep+0.22),H);
        lg.addColorStop(0,'rgba(255,250,235,0)');
        lg.addColorStop(.5,'rgba(255,250,235,0.26)');
        lg.addColorStop(1,'rgba(255,250,235,0)');
        ctx.globalCompositeOperation='soft-light';
        ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
        ctx.globalCompositeOperation='screen';
        ctx.globalAlpha=0.4;
        ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
        ctx.restore();
      }
    }

    /* the glass spills colour onto the stone */
    cctx.setTransform(castDpr,0,0,castDpr,0,0);
    cctx.clearRect(0,0,castW,castH);
    cctx.globalAlpha=0.92;
    cctx.drawImage(off, 0,0,off.width,off.height, -castW*0.1, -castH*0.55, castW*1.2, castH*2.1);
    cctx.globalAlpha=1;

    requestAnimationFrame(frame);
  }

  /* ================= interactions ================= */
  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*W;
    const y=(e.clientY-r.top)/r.height*H;
    if(!insideArch(x,y)) return;
    const site={x,y};
    const poly=cellOf(site,sites.concat([site]));
    if(poly.length<3) return;
    sctx.setTransform(1,0,0,1,0,0);
    sctx.clearRect(0,0,snap.width,snap.height);
    sctx.drawImage(off,0,0);
    const tint=Math.floor(Math.random()*16);
    if(REDUCED){
      sites.push(site); tints.push(tint);
      grow=null; build(false);
      return;
    }
    grow={poly, site, centro:centroid(poly), tint, t0:performance.now()};
    sites.push(site); tints.push(tint);
  });

  function setPalette(name){
    palette=name;
    ['Chartres','Autumn','Emerald'].forEach(p=>
      $('#p'+p).classList.toggle('active', p===name));
    drawGlassLayer();       /* recolour existing panes; geometry untouched */
  }
  $('#pChartres').addEventListener('click',()=>setPalette('Chartres'));
  $('#pAutumn').addEventListener('click',()=>setPalette('Autumn'));
  $('#pEmerald').addEventListener('click',()=>setPalette('Emerald'));
  $('#regen').addEventListener('click',()=>{grow=null;build(true);});
  addEventListener('keydown',e=>{
    if((e.key==='r'||e.key==='R') && !e.metaKey && !e.ctrlKey && !e.altKey){
      grow=null; build(true);
    }
  });

  /* dot swatches on palette buttons */
  document.querySelectorAll('.swatches').forEach(el=>{
    PALETTES[el.dataset.sw].swatch.forEach(c=>{
      const i=document.createElement('i');
      i.style.background=c;
      el.appendChild(i);
    });
  });

  addEventListener('resize',()=>{layout();layoutCast();});

  /* ================= go ================= */
  layout();
  layoutCast();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
