<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOTMATRIX-7 // Marquee Controller</title>
<style>
  :root{
    --bg:#0c0d0f;
    --panel-a:#171a1e;
    --panel-b:#1f2328;
    --hair:#2c3238;
    --text:#c9ced4;
    --dim:#6f777f;
    --accent:#ffb000;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 32% at 50% -6%, rgba(255,176,0,.07), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px);
    color:var(--text);
    font-family:"Courier New", ui-monospace, Menlo, Consolas, monospace;
    text-transform:uppercase;
    letter-spacing:.12em;
    min-height:100vh;
    padding:28px 20px 40px;
  }
  .wrap{ max-width:1180px; margin:0 auto; }
  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:14px;
    padding-bottom:14px; border-bottom:1px solid var(--hair); margin-bottom:22px;
  }
  header h1{ font-size:15px; font-weight:bold; letter-spacing:.22em; }
  header h1 .sub{ color:var(--dim); font-weight:normal; }
  .link-led{
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #b9ffce, #39ff5a 45%, #0d7a26 90%);
    box-shadow:0 0 8px #39ff5a, 0 0 2px #39ff5a;
    animation:blink 1.4s steps(1) infinite;
    flex:none;
  }
  @keyframes blink{ 0%,55%{opacity:1} 56%,100%{opacity:.15} }
  .sys{ margin-left:auto; font-size:10px; color:var(--dim); }
  /* ---------- bezel ---------- */
  .bezel{
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,0) 18%, rgba(0,0,0,.28) 88%, rgba(0,0,0,.42)),
      repeating-linear-gradient(90deg, #3a3e44 0 5px, #2f3338 5px 10px, #34383e 10px 15px, #2b2f34 15px 20px);
    border:1px solid #14171a;
    border-radius:6px;
    padding:20px 22px;
    box-shadow:0 22px 42px rgba(0,0,0,.62), 0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .screw{
    position:absolute; width:13px; height:13px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #e2e6ea, #9aa0a8 42%, #5c626a 72%, #34383e 100%);
    box-shadow:inset 0 -1px 2px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.7);
  }
  .screw::before,.screw::after{
    content:""; position:absolute; left:50%; top:50%; width:11px; height:1.6px;
    background:#23272b; border-radius:1px;
    transform:translate(-50%,-50%) rotate(var(--sr,20deg));
  }
  .screw::after{ transform:translate(-50%,-50%) rotate(calc(var(--sr,20deg) + 90deg)); }
  .screw.tl{ left:6px;  top:6px;    --sr:24deg; }
  .screw.tr{ right:6px; top:6px;    --sr:-38deg; }
  .screw.bl{ left:6px;  bottom:6px; --sr:64deg; }
  .screw.br{ right:6px; bottom:6px; --sr:-12deg; }
  .glass{
    position:relative; overflow:hidden;
    background:#050607;
    border-radius:3px;
    box-shadow:inset 0 0 0 3px #101215, inset 0 4px 14px rgba(0,0,0,.9), inset 0 0 40px rgba(0,0,0,.75);
  }
  .glass::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.02) 22%, transparent 34%);
  }
  .glass canvas{ display:block; width:100%; }
  .plate-label{
    display:inline-block; margin:9px 2px 0;
    font-size:9.5px; color:var(--dim);
    border-top:1px solid var(--hair); padding:3px 10px 0;
    letter-spacing:.3em;
  }
  /* ---------- console ---------- */
  .console{
    margin-top:22px;
    background:linear-gradient(180deg, var(--panel-b), var(--panel-a));
    border:1px solid var(--hair); border-radius:5px;
    padding:18px;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:16px;
  }
  .card{
    background:linear-gradient(180deg,#1b1f24,#171a1e);
    border:1px solid var(--hair); border-radius:4px;
    padding:13px 14px;
    display:flex; flex-direction:column; gap:9px; min-width:0;
  }
  .card label, .card .clabel{ font-size:9.5px; color:var(--dim); letter-spacing:.26em; }
  input[type=text]{
    background:#0a0b0d; border:1px solid var(--hair); border-radius:3px;
    color:var(--text); font:inherit; text-transform:uppercase; letter-spacing:.1em;
    padding:8px 9px; outline:none; width:100%;
  }
  input[type=text]:focus{ border-color:var(--accent); box-shadow:0 0 0 1px rgba(255,176,0,.25); }
  .chcount{ font-size:9.5px; color:var(--accent); letter-spacing:.2em; }
  .seg{ display:flex; border:1px solid var(--hair); border-radius:3px; overflow:hidden; }
  .seg button{
    flex:1; background:transparent; border:0; border-right:1px solid var(--hair);
    color:var(--dim); font:inherit; font-size:10.5px; letter-spacing:.16em;
    padding:8px 4px 7px; cursor:pointer; position:relative; text-transform:uppercase;
  }
  .seg button:last-child{ border-right:0; }
  .seg button:hover{ color:var(--text); }
  .seg button.active{ color:var(--text); }
  .seg button.active::after{
    content:""; position:absolute; left:14%; right:14%; bottom:3px; height:2px;
    background:var(--accent); box-shadow:0 0 6px var(--accent);
  }
  .swatches{ display:flex; gap:12px; justify-content:center; padding:2px 0; }
  .swatch{
    width:24px; height:24px; border-radius:50%; cursor:pointer; border:1px solid #101214;
    transition:box-shadow .15s, transform .15s; position:relative;
  }
  .swatch.active{ transform:scale(1.12); }
  .ctrl-row{ display:flex; align-items:center; gap:10px; }
  .val{ font-size:10px; color:var(--accent); min-width:6ch; text-align:right; }
  input[type=range]{ -webkit-appearance:none; appearance:none; background:transparent; width:100%; height:26px; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px; border-radius:3px;
    background:linear-gradient(180deg,#0a0b0c,#141719); border:1px solid var(--hair);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.8);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:26px; margin-top:-11px;
    border-radius:3px;
    background:linear-gradient(180deg,#4a5058,#2b3036 45%,#1c2025 50%,#33383f);
    border:1px solid #0c0e10;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.6);
  }
  input[type=range]::-moz-range-track{ height:6px; border-radius:3px; background:#101215; border:1px solid var(--hair); }
  input[type=range]::-moz-range-thumb{
    width:16px; height:24px; border-radius:3px;
    background:linear-gradient(180deg,#4a5058,#2b3036 45%,#1c2025 50%,#33383f);
    border:1px solid #0c0e10;
  }
  .readout{
    background:#0a0b0d; border:1px solid var(--hair); border-radius:3px;
    padding:10px 12px; display:flex; flex-direction:column; gap:2px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.8);
  }
  .readout .big{ font-size:21px; color:var(--accent); letter-spacing:.1em; text-shadow:0 0 12px rgba(255,176,0,.35); }
  .readout .small{ font-size:9.5px; color:var(--dim); letter-spacing:.24em; }
  .clock-wrap{ margin-top:26px; }
  footer{
    margin-top:26px; padding-top:12px; border-top:1px solid var(--hair);
    font-size:9.5px; color:var(--dim); letter-spacing:.22em;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  @media (prefers-reduced-motion: reduce){
    .link-led{ animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="link-led" title="link active"></span>
    <h1>DOTMATRIX-7 <span class="sub">// Marquee Controller</span></h1>
    <span class="sys">Rev 7.3 · Unit Online</span>
  </header>

  <div class="bezel">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="glass"><canvas id="main"></canvas></div>
  </div>
  <span class="plate-label">Display A · matrix</span>

  <section class="console" aria-label="control console">
    <div class="card">
      <label for="msg">Message</label>
      <input type="text" id="msg" maxlength="120" value="WELCOME TO DOTMATRIX-7 * SEND HELP *" autocomplete="off" spellcheck="false">
      <span class="chcount" id="ch">0 CH</span>
    </div>
    <div class="card">
      <span class="clabel">Mode</span>
      <div class="seg" id="mode">
        <button data-m="scroll" class="active">Scroll</button>
        <button data-m="static">Static</button>
        <button data-m="bounce">Bounce</button>
      </div>
      <span class="clabel">LED Colour</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="card">
      <label for="speed">Speed · columns / s</label>
      <div class="ctrl-row">
        <input type="range" id="speed" min="5" max="120" value="14">
        <span class="val" id="speedVal">14</span>
      </div>
      <label for="pitch">Pixel size · pitch</label>
      <div class="ctrl-row">
        <input type="range" id="pitch" min="7" max="26" value="14">
        <span class="val" id="pitchVal">14 PX</span>
      </div>
    </div>
    <div class="card">
      <span class="clabel">Pixels</span>
      <div class="readout">
        <span class="big" id="roLit">0</span>
        <span class="small" id="roTotal">of 0 leds</span>
        <span class="small" id="roDims">0 × 11 grid</span>
      </div>
    </div>
  </section>

  <div class="clock-wrap">
    <div class="bezel">
      <span class="screw tl"></span><span class="screw tr"></span>
      <span class="screw bl"></span><span class="screw br"></span>
      <div class="glass"><canvas id="clock"></canvas></div>
    </div>
    <span class="plate-label">Display B · local time</span>
  </div>

  <footer>
    <span>DOTMATRIX-7 — serial DM7-1958-0044-B</span>
    <span>5×7 bitmap · 11 rows · Courier New service firmware</span>
  </footer>
</div>

<script>
(() => {
"use strict";
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROWS = 11;

/* ================= 5x7 bitmap font — binary row literals ================= */
const FONT = {
  ' ':[0,0,0,0,0,0,0],
  'A':[0b01110,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
  'B':[0b11110,0b10001,0b10001,0b11110,0b10001,0b10001,0b11110],
  'C':[0b01110,0b10001,0b10000,0b10000,0b10000,0b10001,0b01110],
  'D':[0b11110,0b10001,0b10001,0b10001,0b10001,0b10001,0b11110],
  'E':[0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b11111],
  'F':[0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b10000],
  'G':[0b01110,0b10001,0b10000,0b10111,0b10001,0b10001,0b01111],
  'H':[0b10001,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001],
  'I':[0b01110,0b00100,0b00100,0b00100,0b00100,0b00100,0b01110],
  'J':[0b00111,0b00010,0b00010,0b00010,0b00010,0b10010,0b01100],
  'K':[0b10001,0b10010,0b10100,0b11000,0b10100,0b10010,0b10001],
  'L':[0b10000,0b10000,0b10000,0b10000,0b10000,0b10000,0b11111],
  'M':[0b10001,0b11011,0b10101,0b10101,0b10001,0b10001,0b10001],
  'N':[0b10001,0b11001,0b10101,0b10011,0b10001,0b10001,0b10001],
  'O':[0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
  'P':[0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000],
  'Q':[0b01110,0b10001,0b10001,0b10001,0b10101,0b10010,0b01101],
  'R':[0b11110,0b10001,0b10001,0b11110,0b10100,0b10010,0b10001],
  'S':[0b01111,0b10000,0b10000,0b01110,0b00001,0b00001,0b11110],
  'T':[0b11111,0b00100,0b00100,0b00100,0b00100,0b00100,0b00100],
  'U':[0b10001,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110],
  'V':[0b10001,0b10001,0b10001,0b10001,0b10001,0b01010,0b00100],
  'W':[0b10001,0b10001,0b10001,0b10101,0b10101,0b11011,0b10001],
  'X':[0b10001,0b10001,0b01010,0b00100,0b01010,0b10001,0b10001],
  'Y':[0b10001,0b10001,0b01010,0b00100,0b00100,0b00100,0b00100],
  'Z':[0b11111,0b00001,0b00010,0b00100,0b01000,0b10000,0b11111],
  '0':[0b01110,0b10001,0b10011,0b10101,0b11001,0b10001,0b01110],
  '1':[0b00100,0b01100,0b00100,0b00100,0b00100,0b00100,0b01110],
  '2':[0b01110,0b10001,0b00001,0b00110,0b01000,0b10001,0b11111],
  '3':[0b11110,0b00001,0b00001,0b01110,0b00001,0b00001,0b11110],
  '4':[0b00010,0b00110,0b01010,0b10010,0b11111,0b00010,0b00010],
  '5':[0b11111,0b10000,0b11110,0b00001,0b00001,0b10001,0b01110],
  '6':[0b00110,0b01000,0b10000,0b11110,0b10001,0b10001,0b01110],
  '7':[0b11111,0b00001,0b00010,0b00100,0b01000,0b01000,0b01000],
  '8':[0b01110,0b10001,0b10001,0b01110,0b10001,0b10001,0b01110],
  '9':[0b01110,0b10001,0b10001,0b01111,0b00001,0b00010,0b01100],
  '.':[0,0,0,0,0,0b00100,0b00100],
  ',':[0,0,0,0,0,0b00100,0b01000],
  '!':[0b00100,0b00100,0b00100,0b00100,0b00100,0,0b00100],
  '?':[0b01110,0b10001,0b00001,0b00110,0b00100,0,0b00100],
  "'":[0b00100,0b00100,0,0,0,0,0],
  '"':[0b01010,0b01010,0,0,0,0,0],
  '-':[0,0,0,0b01110,0,0,0],
  '_':[0,0,0,0,0,0,0b11111],
  ':':[0,0b00100,0b00100,0,0b00100,0b00100,0],
  ';':[0,0b00100,0b00100,0,0b00100,0b01000,0],
  '/':[0b00001,0b00010,0b00010,0b00100,0b01000,0b01000,0b10000],
  '&':[0b01100,0b10010,0b10100,0b01000,0b10101,0b10010,0b01101],
  '+':[0,0b00100,0b00100,0b11111,0b00100,0b00100,0],
  '=':[0,0,0b11111,0,0b11111,0,0],
  '(':[0b00010,0b00100,0b01000,0b01000,0b01000,0b00100,0b00010],
  ')':[0b01000,0b00100,0b00010,0b00010,0b00010,0b00100,0b01000],
  '#':[0b01010,0b11111,0b01010,0b01010,0b11111,0b01010,0],
  '$':[0b00100,0b01111,0b10100,0b01110,0b00101,0b11110,0b00100],
  '%':[0b11001,0b11010,0b00010,0b00100,0b01000,0b01011,0b10011],
  '@':[0b01110,0b10001,0b10111,0b10101,0b10111,0b10000,0b01110],
  '*':[0,0b00100,0b10101,0b01110,0b10101,0b00100,0],
  '<':[0b00010,0b00100,0b01000,0b10000,0b01000,0b00100,0b00010],
  '>':[0b01000,0b00100,0b00010,0b00001,0b00010,0b00100,0b01000],
  '\u2665':[0,0b01010,0b11111,0b11111,0b01110,0b00100,0]   // heart
};
const BOX = [0b11111,0b10001,0b10001,0b10001,0b10001,0b10001,0b11111]; // unknown -> hollow box

/* rasterise a string into 7-bit column masks, one blank column between glyphs */
function raster(text){
  const cols = [];
  for(let i=0;i<text.length;i++){
    const rows = FONT[text[i]] || BOX;
    for(let c=0;c<5;c++){
      let m = 0;
      for(let r=0;r<7;r++) m |= ((rows[r]>>(4-c))&1) << r;
      cols.push(m);
    }
    if(i < text.length-1) cols.push(0);
  }
  return cols;
}

/* ================= state ================= */
const COLORMAP = [
  { name:'amber', hex:'#ffb000' }, { name:'red', hex:'#ff2a1a' },
  { name:'green', hex:'#39ff5a' }, { name:'cyan', hex:'#29e6ff' },
  { name:'white', hex:'#f4f4ff' }
];
let ledColor = COLORMAP[0].hex;
let mode = 'scroll';
let speed = 14;        // columns per second
let pitch = 14;        // px
let msgCols = [];
let scrollPos = 0;     // fractional source column offset (scroll/bounce)
let bounceDir = -1;

const msgInput = document.getElementById('msg');
const chEl = document.getElementById('ch');
function refreshMessage(){
  const v = msgInput.value.toUpperCase();
  msgCols = raster(v);
  chEl.textContent = v.length + ' CH';
  scrollPos = 0; bounceDir = -1;
}

/* ================= canvases ================= */
const mainC = document.getElementById('main');
const clockC = document.getElementById('clock');
const mctx = mainC.getContext('2d');
const cctx = clockC.getContext('2d');

function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function fit(canvas, cssH){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth || 600;
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(cssH*dpr);
  const c = canvas.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  return { w, h:cssH };
}
let mainW=0, mainH=0, clockW=0, clockH=0, mainCols=0;
function layout(){
  mainH = ROWS*pitch;
  const a = fit(mainC, mainH);
  mainW = a.w;
  mainCols = Math.floor(mainW/pitch);
  const cp = clockPitch();
  const b = fit(clockC, ROWS*cp);
  clockW = b.w; clockH = ROWS*cp;
}
function clockPitch(){ return Math.max(5, Math.round(pitch*0.7)); }

/* ================= led rendering ================= */
function drawLeds(ctx, cssW, rows, cols, p, bits){
  const [r,g,b2] = hexRgb(ledColor);
  ctx.clearRect(0,0,cssW,rows*p);
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const cx = x*p + p/2, cy = y*p + p/2;
      const lit = bits(x,y);
      if(lit){
        ctx.fillStyle = `rgba(${r},${g},${b2},.16)`;
        ctx.beginPath(); ctx.arc(cx,cy, p*.62, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = ledColor;
        ctx.beginPath(); ctx.arc(cx,cy, p*.30, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath(); ctx.arc(cx - p*.10, cy - p*.10, p*.075, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#171a1e';
        ctx.beginPath(); ctx.arc(cx,cy, p*.17, 0, Math.PI*2); ctx.fill();
      }
    }
  }
}

/* ================= main loop ================= */
const mainBits = new Uint8Array(4096*ROWS);
let litCount = 0;
let lastT = performance.now()/1000;
let readoutAt = 0;

function sourceCol(c){
  const n = msgCols.length;
  if(n===0) return -1;
  const strip = n + 8;
  if(mode==='scroll'){
    const src = Math.floor(scrollPos + c) % strip;
    return src < n ? src : -1;
  }
  if(mode==='static'){
    const left = Math.floor((mainCols - n)/2);
    const src = left + c;
    return (src>=0 && src<n) ? src : -1;
  }
  // bounce
  const src = Math.floor(scrollPos) + c;
  return (src>=0 && src<n) ? src : -1;
}

function frame(ts){
  const t = ts/1000;
  let dt = Math.min(.1, t - lastT); lastT = t;
  const eff = reduced ? 1/3 : 1;
  const n = msgCols.length;
  const strip = n + 8;
  if(n){
    if(mode==='scroll'){
      scrollPos = (scrollPos + speed*dt*eff) % strip;
    } else if(mode==='bounce'){
      const lo = Math.min(0, mainCols - n);
      const hi = Math.max(0, mainCols - n);
      scrollPos += bounceDir * speed*dt*eff;
      if(scrollPos <= lo){ scrollPos = lo; bounceDir = 1; }
      if(scrollPos >= hi){ scrollPos = hi; bounceDir = -1; }
    }
  }
  // sample bits into buffer (for lit-count + stable draw)
  litCount = 0;
  for(let x=0;x<mainCols;x++){
    const src = sourceCol(x);
    const m = src>=0 ? msgCols[src] : 0;
    for(let y=0;y<ROWS;y++) mainBits[y*mainCols+x] = (m>>y)&1;
    let m2 = m; while(m2){ litCount += m2 & 1; m2 >>= 1; }
  }
  drawLeds(mctx, mainW, ROWS, mainCols, pitch, (x,y)=>mainBits[y*mainCols+x]);

  /* clock display */
  const cp = clockPitch();
  const ccols = Math.floor(clockW/cp);
  const d = new Date();
  const half = reduced ? false : (d.getMilliseconds() >= 500);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  const colon = half ? ' ' : ':';
  const timeCols = raster(`${hh}${colon}${mm}${colon}${ss}`);
  const tn = timeCols.length;
  const tleft = Math.floor((ccols - tn)/2);
  drawLeds(cctx, clockW, ROWS, ccols, cp, (x,y)=>{
    const src = x - tleft;
    return (src>=0 && src<tn) ? ((timeCols[src]>>y)&1) : 0;
  });

  if(t - readoutAt > .25){
    readoutAt = t;
    document.getElementById('roLit').textContent = litCount.toLocaleString('en-US');
    document.getElementById('roTotal').textContent = 'of ' + (mainCols*ROWS).toLocaleString('en-US') + ' leds';
    document.getElementById('roDims').textContent = mainCols + ' × ' + ROWS + ' grid';
  }
  requestAnimationFrame(frame);
}

/* ================= controls ================= */
msgInput.addEventListener('input', refreshMessage);
document.querySelectorAll('#mode button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    mode = btn.dataset.m;
    scrollPos = mode==='bounce' ? Math.min(0, mainCols-msgCols.length) : 0;
    bounceDir = -1;
    document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('active', b===btn));
  });
});
const swWrap = document.getElementById('swatches');
COLORMAP.forEach((c,i)=>{
  const el = document.createElement('button');
  el.className = 'swatch' + (i===0?' active':'');
  el.title = c.name;
  el.setAttribute('aria-label', c.name + ' leds');
  el.style.background = `radial-gradient(circle at 34% 30%, rgba(255,255,255,.85), ${c.hex} 46%, ${c.hex} 70%, rgba(0,0,0,.55))`;
  el.addEventListener('click', ()=>{
    ledColor = c.hex;
    document.documentElement.style.setProperty('--accent', c.hex);
    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s===el));
    const [r,g,b] = hexRgb(c.hex);
    document.querySelectorAll('.chcount,.val').forEach(e=>e.style.color=c.hex);
    const ro = document.querySelector('.readout .big');
    ro.style.textShadow = `0 0 12px rgba(${r},${g},${b},.4)`;
    el.style.boxShadow = `0 0 12px ${c.hex}, 0 0 4px ${c.hex}`;
  });
  swWrap.appendChild(el);
});
document.querySelector('.swatch.active').style.boxShadow = '0 0 12px #ffb000, 0 0 4px #ffb000';
const speedEl = document.getElementById('speed');
const pitchEl = document.getElementById('pitch');
speedEl.addEventListener('input', ()=>{ speed = +speedEl.value; document.getElementById('speedVal').textContent = speed; });
pitchEl.addEventListener('input', ()=>{
  pitch = +pitchEl.value;
  document.getElementById('pitchVal').textContent = pitch + ' PX';
  layout();
});
addEventListener('resize', layout);

layout();
refreshMessage();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
