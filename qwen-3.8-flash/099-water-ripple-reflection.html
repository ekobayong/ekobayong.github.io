<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Water — Moonlit Ripple Reflection</title>
<style>
  :root{
    --ink:#d9dff0; --amber:#ffb35c;
    --serif:'Iowan Old Style', Palatino, Georgia, serif;
    --mono:ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:#05071a;}
  body{animation:fadein 1.6s ease both;}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  canvas#stage{position:fixed; inset:0; width:100vw; height:100vh; display:block; cursor:crosshair;}
  .panel{
    position:fixed; top:18px; right:18px; z-index:10; width:248px;
    background:rgba(12,18,54,.44);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(217,223,240,.28);
    border-radius:14px; padding:16px 16px 14px;
    color:var(--ink); font-family:var(--serif);
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .panel .tag{
    font-family:var(--serif); font-variant:small-caps; letter-spacing:.22em;
    color:var(--amber); font-size:12.5px; margin-bottom:10px;
  }
  .row{ margin-bottom:12px; }
  .row .lab{ display:flex; justify-content:space-between; font-size:12px; letter-spacing:.06em;
    color:rgba(217,223,240,.85); margin-bottom:4px; }
  .row .val{ font-family:var(--mono); font-size:11px; color:var(--amber); }
  input[type=range]{ width:100%; accent-color:#ffb35c; height:20px; cursor:pointer;}
  .btns{ display:flex; gap:8px; margin-bottom:12px; }
  .btns button{
    flex:1; font-family:var(--serif); font-size:11.5px; letter-spacing:.08em;
    color:#0d1330; background:linear-gradient(180deg,#e8edff,#b9c2de);
    border:1px solid rgba(217,223,240,.6); border-radius:8px; padding:7px 4px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .btns button:hover{ background:linear-gradient(180deg,#fff,#c5cde8); }
  .btns button:active{ transform:translateY(1px); }
  .tg{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:12.5px; margin-bottom:7px; cursor:pointer; user-select:none; }
  .tg input{ position:absolute; opacity:0; }
  .tg .sw{
    width:32px; height:16px; flex:0 0 32px; border-radius:9px; position:relative;
    background:rgba(217,223,240,.14); border:1px solid rgba(217,223,240,.4);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.5); transition:background .2s;
  }
  .tg .sw::after{
    content:""; position:absolute; top:1px; left:1px; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd9a0, #d98f2f);
    box-shadow:0 0 6px rgba(255,179,92,.8); transition:transform .2s;
  }
  .tg input:checked + .sw{ background:rgba(255,179,92,.22); }
  .tg input:checked + .sw::after{ transform:translateX(16px); }
  .hint{ font-size:11px; font-style:italic; color:rgba(217,223,240,.55); margin-top:6px; line-height:1.5; }
  .caption{
    position:fixed; left:26px; bottom:22px; z-index:9; max-width:430px;
    font-family:var(--serif); font-style:italic; color:rgba(217,223,240,.8);
    font-size:clamp(14px,1.7vw,19px); line-height:1.55;
    text-shadow:0 2px 12px rgba(0,0,0,.8); pointer-events:none;
  }
  .caption .lbl{
    display:block; font-style:normal; font-variant:small-caps; letter-spacing:.3em;
    color:var(--amber); font-size:12px; margin-bottom:6px;
  }
  @media (max-width:640px){
    .panel{ width:206px; top:10px; right:10px; padding:12px; }
    .caption{ max-width:56vw; font-size:13px; }
  }
  @media (prefers-reduced-motion: reduce){
    body{ animation:none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="panel">
  <div class="tag">The Lake at Night</div>
  <div class="row">
    <div class="lab"><span>Restlessness</span><span class="val" id="dampWord">calm</span></div>
    <input type="range" id="damp" min="0" max="100" value="38" aria-label="Water restlessness">
  </div>
  <div class="btns">
    <button id="stone" type="button">Throw a stone</button>
    <button id="settle" type="button">Let it settle</button>
  </div>
  <label class="tg"><span>Random raindrops</span><input type="checkbox" id="rain"><span class="sw"></span></label>
  <label class="tg"><span>Lanterns on the shore</span><input type="checkbox" id="lant" checked><span class="sw"></span></label>
  <div class="hint">Touch the water. Drag for a light rain of rings.</div>
</div>

<div class="caption">
  <span class="lbl">Nocturne No. 4</span>
  The lake keeps whatever the sky gives it, and gives it back a little softer.
</div>

<script>
'use strict';
/* ================= still water — moonlit ripple reflection =================
   height-field water at reduced sampling resolution; the scene above is
   painted at full device res and at 1/3–1/4 res for reflection sampling. */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function lcg(seed){ let z=seed>>>0; return ()=>{ z=(Math.imul(z,1664525)+1013904223)>>>0; return z/4294967296; }; }

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');
const sceneLow = document.createElement('canvas');       // sampling-resolution scene
const slCtx = sceneLow.getContext('2d', { willReadFrequently:true });
const waterLow = document.createElement('canvas');       // rendered water pixels
const wlCtx = waterLow.getContext('2d');

let DPR=1, cssW=0, cssH=0, skyH=0, waterH=0, low=1/3;
let LW=0, LSKY=0, LHW=0;                                  // low-res dims
let cur=null, prv=null, waterImg=null;
let moonXL=0;                                             // moon column in low res

const seededRand = lcg(20260904);
const STARS = Array.from({length:260}, ()=>({
  x:seededRand(), y:seededRand()*0.62, r:0.4+seededRand()*1.1, a:0.25+seededRand()*0.75,
  tw:seededRand()*6.28
}));
const LANTERNS = [0.09,0.21,0.34,0.47,0.62,0.78,0.92].map((fx,i)=>({
  fx, big:i===1||i===3||i===5, ph:seededRand()*6.28, sp:0.03+seededRand()*0.05, amp:0.004+seededRand()*0.01
}));
const FLIES = Array.from({length:24}, ()=>({
  x:seededRand(), y:0.86+seededRand()*0.1, ph:seededRand()*6.28,
  fr:0.4+seededRand()*0.8, dx:seededRand()*6.28, dy:seededRand()*6.28
}));

/* ================= scene painting (any scale) ================= */
function paintScene(c, W, SKY, t, lanterns, forSampling){
  /* sky */
  const g = c.createLinearGradient(0,0,0,SKY);
  g.addColorStop(0,'#05071a'); g.addColorStop(0.55,'#0c1236'); g.addColorStop(1,'#1a2352');
  c.fillStyle=g; c.fillRect(0,0,W,SKY);
  /* stars */
  for (const s of STARS){
    const twk = (forSampling||reduced) ? 1 : 0.7+0.3*Math.sin(t*1.4+s.tw*9);
    c.fillStyle = `rgba(217,223,240,${s.a*twk})`;
    c.beginPath(); c.arc(s.x*W, s.y*SKY, s.r*(W/1400), 0, 7); c.fill();
  }
  /* moon at 68% width / 32% of sky height, seven-radius glow */
  const mx = W*0.68, my = SKY*0.32, mr = W*0.026;
  const halo = c.createRadialGradient(mx,my,mr*0.4,mx,my,mr*7);
  halo.addColorStop(0,'rgba(210,220,255,0.16)'); halo.addColorStop(0.25,'rgba(210,220,255,0.09)');
  halo.addColorStop(1,'rgba(210,220,255,0)');
  c.fillStyle=halo; c.beginPath(); c.arc(mx,my,mr*7,0,7); c.fill();
  const disc = c.createRadialGradient(mx-mr*0.25,my-mr*0.25,mr*0.1,mx,my,mr);
  disc.addColorStop(0,'#ffffff'); disc.addColorStop(0.75,'#eef1fa'); disc.addColorStop(1,'#c5cde8');
  c.fillStyle=disc; c.beginPath(); c.arc(mx,my,mr,0,7); c.fill();
  /* maria */
  c.fillStyle='rgba(150,160,195,0.35)';
  c.beginPath(); c.arc(mx+mr*0.28,my-mr*0.18,mr*0.22,0,7); c.fill();
  c.beginPath(); c.arc(mx-mr*0.18,my+mr*0.3,mr*0.3,0,7); c.fill();
  c.beginPath(); c.arc(mx+mr*0.05,my+mr*0.05,mr*0.13,0,7); c.fill();
  /* far ridge from summed sines */
  c.fillStyle='#0d1338'; c.beginPath(); c.moveTo(0,SKY);
  for(let x=0;x<=W;x+=Math.max(2,W/240)){
    const u=x/W;
    const y = SKY*(0.74 - 0.055*Math.sin(u*6.2+1.2) - 0.04*Math.sin(u*13.7+4.1) - 0.02*Math.sin(u*29.3+2.4));
    c.lineTo(x,y);
  }
  c.lineTo(W,SKY); c.closePath(); c.fill();
  /* jagged treeline, alternating spike heights */
  const step = Math.max(3, W/180);
  c.fillStyle='#05071c'; c.beginPath(); c.moveTo(0,SKY);
  let up=true, x=0;
  c.lineTo(0, SKY-SKY*(0.05+0.03*Math.sin(x*0.013)));
  while(x<W+step){
    const base = SKY*(0.03+0.02*Math.sin(x*0.011+2));
    const hgt  = up ? SKY*(0.055+0.05*Math.abs(Math.sin(x*0.021))) : SKY*(0.018+0.014*Math.abs(Math.sin(x*0.03)));
    c.lineTo(x+step*0.5, SKY-base-hgt);
    c.lineTo(x+step, SKY-base*0.6);
    up=!up; x+=step;
  }
  c.lineTo(W,SKY); c.closePath(); c.fill();
  /* lanterns + streaks */
  if (lanterns){
    for (const L of LANTERNS){
      const lx = (L.fx + Math.sin(t*L.sp*2*Math.PI + L.ph)*L.amp) * W;
      const ly = SKY*(0.965) - (L.big? SKY*0.02 : SKY*0.008);
      const pulse = 0.75 + 0.25*Math.sin(t*(1.1+L.ph*0.2) + L.ph*3);
      const r = (L.big? W*0.011 : W*0.006);
      const gl = c.createRadialGradient(lx,ly,0,lx,ly,r*4.5);
      gl.addColorStop(0,`rgba(255,190,110,${0.55*pulse})`);
      gl.addColorStop(0.4,`rgba(255,190,110,${0.2*pulse})`);
      gl.addColorStop(1,'rgba(255,190,110,0)');
      c.fillStyle=gl; c.beginPath(); c.arc(lx,ly,r*4.5,0,7); c.fill();
      c.fillStyle=`rgba(255,179,92,${0.9*pulse})`;
      c.beginPath(); c.arc(lx,ly,r*0.55,0,7); c.fill();
      /* thin light streak down to the water */
      const st = c.createLinearGradient(0,ly,0,SKY);
      st.addColorStop(0,`rgba(255,190,110,${0.28*pulse})`); st.addColorStop(1,'rgba(255,190,110,0)');
      c.fillStyle=st; c.fillRect(lx-r*0.16, ly, r*0.32, SKY-ly);
    }
  }
  /* mist just above the waterline */
  const mg = c.createLinearGradient(0,SKY*0.86,0,SKY);
  mg.addColorStop(0,'rgba(180,195,235,0)'); mg.addColorStop(1,'rgba(180,195,235,0.06)');
  c.fillStyle=mg; c.fillRect(0,SKY*0.86,W,SKY*0.14);
  return {mx,my};
}

/* ================= sizing / buffers ================= */
function rebuild(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cssW = window.innerWidth; cssH = window.innerHeight;
  skyH = Math.round(cssH*0.56); waterH = cssH - skyH;
  stage.width = Math.round(cssW*DPR);
  stage.height = Math.round(cssH*DPR);
  low = cssW*DPR > 1400 ? 1/4 : 1/3;
  LW  = Math.max(120, Math.round(cssW*DPR*low));
  LSKY= Math.max(40, Math.round(skyH*DPR*low));
  LHW = Math.max(40, Math.round(waterH*DPR*low));
  sceneLow.width = LW; sceneLow.height = LSKY;
  waterLow.width = LW; waterLow.height = LHW;
  cur = new Float32Array(LW*LHW); prv = new Float32Array(LW*LHW);
  waterImg = wlCtx.createImageData(LW, LHW);
  moonXL = LW*0.68;
}
window.addEventListener('resize', rebuild);
rebuild();

/* ================= height-field simulation ================= */
function splash(cx, cy, radius, amp){
  if(!cur) return;
  cx=clamp(Math.round(cx),0,LW-1); cy=clamp(Math.round(cy),0,LHW-1);
  for(let y=Math.max(0,cy-radius); y<=Math.min(LHW-1,cy+radius); y++){
    for(let x=Math.max(0,cx-radius); x<=Math.min(LW-1,cx+radius); x++){
      const d = Math.hypot(x-cx,y-cy);
      if(d<=radius) cur[y*LW+x] += amp*(Math.cos(d/radius*Math.PI)+1)/2;
    }
  }
}
function stepField(damping){
  /* interior update; borders are grounded afterwards as absorbing walls */
  for(let y=1;y<LHW-1;y++){
    const r0=y*LW;
    for(let x=1;x<LW-1;x++){
      const i=r0+x;
      const v = ((cur[i-1]+cur[i+1]+cur[i-LW]+cur[i+LW])/2 - prv[i]) * damping;
      prv[i] = v;
    }
  }
  prv.fill(0, 0, LW); prv.fill(0, (LHW-1)*LW, LHW*LW);
  for(let y=0;y<LHW;y++){ prv[y*LW]=0; prv[y*LW+LW-1]=0; }
  const tmp = cur; cur = prv; prv = tmp;
}
function zeroField(){ cur.fill(0); prv.fill(0); }

/* ================= water shading into ImageData ================= */
function renderWater(t){
  const src = slCtx.getImageData(0,0,LW,LSKY).data;
  const out = waterImg.data;
  const k = 1.0, comp = 0.88;                       // distortion px per height-unit / mirror compression
  const shimmer = 0.62+0.38*Math.sin(t*0.7);
  const sig = LW*0.09;
  for(let y=0;y<LHW;y++){
    const mb = Math.min(LSKY-1, Math.max(0, (LSKY-1) - y*0.86));
    const dimNear = 1 - 0.5*Math.pow(y/LHW, 1.2);
    const row = y*LW, orow = y*LW*4;
    for(let x=0;x<LW;x++){
      const i = row+x;
      const l = cur[x>0?i-1:i], r = cur[x<LW-1?i+1:i];
      const u = cur[y>0?i-LW:i], d = cur[y<LHW-1?i+LW:i];
      let gx = (r-l)*0.5, gy = (d-u)*0.5;
      let sx = clamp(Math.round(x + gx*k), 0, LW-1);
      let sy = clamp(Math.round(mb + gy*1.6*k), 0, LSKY-1);
      const s = (sy*LW + sx)*4;
      let R = src[s], G = src[s+1], B = src[s+2];
      const slope = Math.min(0.45, Math.abs(gx)*0.014);
      const b = dimNear*(1-slope);
      /* tint toward indigo + dim toward near shore */
      R = (R*b)*0.68 + 8;  G = (G*b)*0.70 + 13;  B = (B*b)*0.88 + 34;
      /* silver specular, Gaussian around the moon's column */
      const dxm = sx - moonXL;
      const spec = Math.min(1, Math.abs(gy)*0.05) * Math.exp(-(dxm*dxm)/(2*sig*sig)) * shimmer * 150;
      out[orow+x*4]   = clamp(R+spec,0,255);
      out[orow+x*4+1] = clamp(G+spec*1.02,0,255);
      out[orow+x*4+2] = clamp(B+spec*1.1,0,255);
      out[orow+x*4+3] = 255;
    }
  }
  wlCtx.putImageData(waterImg,0,0);
}

/* ================= foreground flourishes ================= */
function drawShore(t){
  ctx.save();
  const g = ctx.createLinearGradient(0,cssH-cssH*0.16,0,cssH);
  g.addColorStop(0,'rgba(2,3,12,0)'); g.addColorStop(1,'rgba(2,3,12,0.85)');
  ctx.fillStyle=g; ctx.fillRect(0,cssH-cssH*0.16,cssW,cssH*0.16);
  /* swaying reeds in the corners */
  ctx.strokeStyle='#030512'; ctx.lineWidth=Math.max(1.6,cssW*0.0016); ctx.lineCap='round';
  const reeds=[[0.012,7],[0.03,5],[0.048,8],[0.988,-6],[0.97,-8],[0.951,-5]];
  for(const [fx,lean] of reeds){
    const bx=fx*cssW, by=cssH+2, hgt=cssH*0.11;
    const sway=(reduced?0:Math.sin(t*0.9+fx*40)*6)* (lean>0?1:-1);
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.quadraticCurveTo(bx+lean*2+sway*0.5, by-hgt*0.6, bx+lean*3+sway, by-hgt);
    ctx.stroke();
  }
  ctx.restore();
}
function drawFireflies(t){
  if(!lanternsOn || reduced) return;
  ctx.save();
  for(const f of FLIES){
    const fl = Math.pow(Math.max(0, Math.sin(t*f.fr+f.ph)), 3);   // cubed-sine flicker
    if(fl<=0.02) continue;
    const x=(f.x+Math.sin(t*0.13+f.dx)*0.012)*cssW;
    const y=(f.y+Math.cos(t*0.11+f.dy)*0.008)*skyH + skyH*0.045;
    ctx.fillStyle=`rgba(255,208,120,${0.65*fl})`;
    ctx.beginPath(); ctx.arc(x,y,1.7,0,7); ctx.fill();
    ctx.fillStyle=`rgba(255,190,110,${0.16*fl})`;
    ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ================= controls ================= */
const elDamp = document.getElementById('damp');
const elWord = document.getElementById('dampWord');
let lanternsOn = true;
const WORDS = [[20,'glass'],[40,'calm'],[60,'stirring'],[80,'restless'],[101,'brooding']];
function dampVal(){ const v=+elDamp.value;
  elWord.textContent = WORDS.find(w=>v<w[0])[1];
  return 0.955 + (v/100)*(0.997-0.955); }
elDamp.addEventListener('input', dampVal);
document.getElementById('stone').addEventListener('click', ()=>{
  splash(rand(LW*0.25,LW*0.75), rand(LHW*0.3,LHW*0.8), 7, 150);
});
document.getElementById('settle').addEventListener('click', zeroField);
document.getElementById('rain').addEventListener('change', e=> rainOn = e.target.checked);
document.getElementById('lant').addEventListener('change', e=> lanternsOn = e.target.checked);
let rainOn = false;
function rand(a,b){ return a+Math.random()*(b-a); }

/* pointer interaction */
let dragging = false, lastDrop = 0;
function waterPos(e){
  const r = stage.getBoundingClientRect();
  const x = e.clientX-r.left, y = e.clientY-r.top;
  if(y < skyH) return null;
  return { x: x/cssW*LW, y: (y-skyH)/waterH*LHW };
}
stage.addEventListener('pointerdown', e=>{
  const p = waterPos(e); if(!p) return;
  dragging = true; lastDrop = performance.now();
  splash(p.x, p.y, 3, 90);                      // ring: radius ~3 cells, amplitude 90
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const now = performance.now();
  if(now-lastDrop < 28) return;                  // one small ring every 28 ms
  lastDrop = now;
  const p = waterPos(e); if(!p) return;
  splash(p.x, p.y, 1.6, 34);
});
addEventListener('pointerup', ()=> dragging=false);

/* ================= main loop ================= */
let t0 = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const t = (now - t0)/1000;
  const damping = dampVal();
  const restlessness = (+elDamp.value)/100;

  /* disturbances */
  if(restlessness > 0.5 && !reduced && Math.random() < 0.35)  // barely-visible breeze
    splash(rand(0,LW), rand(0,LHW), 1, 5);
  if(rainOn){                                                  // rain scales with restlessness
    const drops = Math.round(restlessness*2.2*Math.random()* (Math.random()<0.6?2:0));
    for(let i=0;i<drops;i++) splash(rand(0,LW), rand(0,LHW), 1+Math.random()*1.6, 16+Math.random()*18);
  }
  const steps = reduced ? 1 : 2;
  for(let s=0;s<steps;s++) stepField(damping);

  /* paint: display scene + sampling scene */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#05071a'; ctx.fillRect(0,0,cssW,cssH);
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,cssW,skyH); ctx.clip();
  paintScene(ctx, cssW, skyH, t, lanternsOn, false);
  ctx.restore();
  paintScene(slCtx, LW, LSKY, t, lanternsOn, true);

  /* water */
  renderWater(t);
  ctx.imageSmoothingEnabled = true;
  if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(waterLow, 0,0,LW,LHW, 0,skyH, cssW, waterH);

  /* faint horizon seam */
  const seam = ctx.createLinearGradient(0,skyH-6,0,skyH+6);
  seam.addColorStop(0,'rgba(180,195,235,0)'); seam.addColorStop(0.5,'rgba(180,195,235,0.10)');
  seam.addColorStop(1,'rgba(180,195,235,0)');
  ctx.fillStyle=seam; ctx.fillRect(0,skyH-6,cssW,12);

  drawFireflies(t);
  drawShore(t);
}
dampVal();
requestAnimationFrame(frame);
</script>
</body>
</html>
