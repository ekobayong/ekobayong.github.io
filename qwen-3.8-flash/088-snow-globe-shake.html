<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter, Kept — A Snow Globe</title>
<style>
  :root{
    --size: min(78vw, 56vh, 520px);
    --gold:#fbe7a3; --gold-mid:#d9b25a; --gold-dark:#6f5218;
    --wal-1:#2a150e; --wal-2:#4a2a1c; --wal-3:#7a4a33; --wal-4:#8d5a40;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    color:#e9f2ef; overflow-x:hidden; min-height:100dvh; position:relative;
    background:
      radial-gradient(ellipse 80% 55% at 50% 108%, rgba(18,58,61,.9), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% -12%, #0e2a2e, #061518 70%);
  }
  body::after{ /* heavy vignette */
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:radial-gradient(ellipse 95% 85% at 50% 46%, transparent 46%, rgba(1,7,9,.72) 100%);
  }
  /* ---------------- fairy lights ---------------- */
  .string{ position:fixed; top:0; left:0; width:100vw; height:150px; z-index:1; pointer-events:none; }
  .bokeh i{
    position:absolute; border-radius:50%; filter:blur(7px);
    background:radial-gradient(circle at 42% 38%, rgba(255,214,140,.95), rgba(255,214,140,.35) 55%, transparent 72%);
    animation:drift var(--dur,9s) ease-in-out var(--del,0s) infinite alternate;
  }
  .bokeh i.aq{ background:radial-gradient(circle at 42% 38%, rgba(160,230,225,.55), rgba(160,230,225,.18) 55%, transparent 72%); }
  @keyframes drift{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(16px,12px) scale(1.14);} }
  .bokeh{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------------- page ---------------- */
  .room{
    position:relative; z-index:2;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:34px 16px 88px;
    text-align:center;
  }
  .eyebrow{
    font-family:ui-monospace, Menlo, Consolas, monospace;
    font-size:clamp(.56rem, 1.6vw, .7rem); letter-spacing:.3em; text-transform:uppercase;
    color:rgba(233,242,239,.55); margin-bottom:14px;
  }
  h1{ font-weight:400; font-size:clamp(1.9rem, 6vw, 3.4rem); color:#f4efe2; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  h1 em{ font-style:italic; color:var(--gold); }

  /* ---------------- globe assembly ---------------- */
  .assembly{
    position:relative; width:var(--size); height:calc(var(--size)*1.24);
    margin-top:clamp(22px, 5vh, 48px);
    touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
    will-change:transform;
  }
  .assembly.grabbing{ cursor:grabbing; }
  .sphere{
    position:absolute; top:0; left:0; width:var(--size); height:var(--size);
    border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 42% 36%, #1d4d63, #0d2c42 58%, #061a2b 100%);
    box-shadow:0 40px 80px rgba(0,0,0,.75), 0 12px 30px rgba(0,0,0,.6);
    transform-origin:50% 96%; will-change:transform;
  }
  .stage3d{ position:absolute; inset:0; will-change:transform; }
  .stage3d svg{ width:100%; height:100%; display:block; }
  #snow{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .glassfx{ position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(ellipse 46% 30% at 20% 14%, rgba(255,255,255,.26), transparent 70%),
      radial-gradient(ellipse 26% 16% at 76% 84%, rgba(255,255,255,.12), transparent 70%),
      linear-gradient(125deg, rgba(255,255,255,.10) 0%, transparent 40% 60%, rgba(255,255,255,.05) 100%),
      radial-gradient(circle, transparent 88%, rgba(255,255,255,.35) 99%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);
  }
  .glassfx::before{ /* inner faint ring 3.5% inside */
    content:""; position:absolute; inset:3.5%; border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
  }
  .glassfx::after{ /* small blurred bright streak */
    content:""; position:absolute; left:16%; top:21%; width:9%; height:22%;
    border-radius:50%; background:rgba(255,255,255,.7); filter:blur(5px);
    transform:rotate(-28deg);
  }
  .neck{
    position:absolute; top:calc(var(--size)*0.955); left:50%; transform:translateX(-50%);
    width:calc(var(--size)*0.36); height:calc(var(--size)*0.055); border-radius:3px;
    background:linear-gradient(90deg, var(--gold-dark), var(--gold-mid) 26%, var(--gold) 50%, var(--gold-mid) 74%, var(--gold-dark));
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  .base{
    position:absolute; top:calc(var(--size)*0.99); left:50%; transform-origin:50% 0;
    width:calc(var(--size)*0.62); height:calc(var(--size)*0.25); margin-left:calc(var(--size)*-0.31);
    will-change:transform;
  }
  .collar{ /* gold collar + fluted trim */
    position:absolute; top:0; left:6%; width:88%; height:12%;
    background:
      repeating-linear-gradient(90deg, rgba(111,82,24,.55) 0 3px, transparent 3px 9px),
      linear-gradient(90deg, var(--gold-dark), var(--gold-mid) 28%, var(--gold) 50%, var(--gold-mid) 72%, var(--gold-dark));
    border-radius:3px 3px 4px 4px;
    box-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  .plinth{
    position:absolute; top:10%; left:0; width:100%; height:90%;
    background:
      repeating-linear-gradient(2deg, rgba(0,0,0,.10) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, var(--wal-4) 0%, var(--wal-3) 30%, var(--wal-2) 70%, var(--wal-1) 100%);
    border-radius:10% 10% 34% 34% / 10% 10% 60% 60%;
    box-shadow:inset 0 8px 14px rgba(255,220,170,.14), inset 0 -14px 22px rgba(0,0,0,.55), 0 18px 34px rgba(0,0,0,.6);
  }
  .plaque{
    position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
    padding:.45em 1.1em; border-radius:3px;
    background:linear-gradient(90deg, var(--gold-dark), var(--gold-mid) 25%, var(--gold) 50%, var(--gold-mid) 75%, var(--gold-dark));
    box-shadow:inset 0 0 0 1px rgba(111,82,24,.8), 0 2px 5px rgba(0,0,0,.5);
    font-style:italic; font-size:clamp(.52rem, 1.9vw, .74rem); color:#4c3208; white-space:nowrap;
    letter-spacing:.04em; text-shadow:0 1px 0 rgba(255,245,210,.55);
  }
  .floorshadow{
    position:absolute; bottom:calc(var(--size)*-0.03); left:50%; transform:translateX(-50%);
    width:calc(var(--size)*0.85); height:calc(var(--size)*0.09);
    background:radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%);
    filter:blur(8px); border-radius:50%; z-index:-1;
  }
  .key{
    position:absolute; right:calc(var(--size)*-0.055); top:38%;
    width:calc(var(--size)*0.16); height:calc(var(--size)*0.16);
    background:none; border:none; padding:0; cursor:pointer;
    transform-origin:14% 50%;
    transition:transform 1.6s cubic-bezier(.25,.6,.3,1), filter .25s ease;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
    touch-action:manipulation;
  }
  .key:hover{ filter:drop-shadow(0 0 8px rgba(251,231,163,.6)); }
  .key svg{ width:100%; height:100%; display:block; pointer-events:none; }

  /* interior animations */
  .puff{ transform-box:fill-box; transform-origin:center; animation:puff 5.2s ease-out infinite; }
  .puff.b{ animation-delay:-2.6s; }
  @keyframes puff{
    0%{ opacity:0; transform:translate(0,0) scale(.3); }
    12%{ opacity:.5; }
    100%{ opacity:0; transform:translate(9px,-34px) scale(1.5); }
  }
  .win{ animation:flick 2.6s ease-in-out infinite alternate; }
  .win.b{ animation-delay:-1.1s; }
  @keyframes flick{ from{ opacity:.86;} 55%{ opacity:1;} to{ opacity:.8;} }
  .lampglow{ transform-box:fill-box; transform-origin:center; animation:breathe 4s ease-in-out infinite alternate; }
  @keyframes breathe{ from{ opacity:.55; transform:scale(.9);} to{ opacity:1; transform:scale(1.08);} }
  .star{ animation:st 3.2s ease-in-out infinite alternate; }
  .star.s2{ animation-delay:-1.4s;} .star.s3{ animation-delay:-2.3s;}
  @keyframes st{ from{opacity:.35;} to{opacity:1;} }

  /* ---------------- controls & footer ---------------- */
  .controls{ display:flex; gap:14px; margin-top:26px; }
  button.act{
    font-family:ui-monospace, Menlo, Consolas, monospace;
    font-size:.7rem; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold); background:rgba(18,58,61,.6);
    border:1px solid rgba(251,231,163,.5); border-radius:2px;
    padding:.8em 1.6em; cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
  }
  button.act:hover{ background:rgba(251,231,163,.14); border-color:var(--gold); transform:translateY(-1px); }
  .hint{ margin-top:14px; font-style:italic; color:rgba(233,242,239,.5); font-size:.86rem; }

  .hud{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:14px;
    font-family:ui-monospace, Menlo, Consolas, monospace;
    font-size:.58rem; letter-spacing:.3em; text-transform:uppercase; color:rgba(233,242,239,.6);
  }
  .meter{
    width:120px; height:5px; border-radius:3px; overflow:hidden;
    background:rgba(255,255,255,.12); box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
  }
  .meter i{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg, var(--gold-dark), var(--gold-mid), var(--gold));
    box-shadow:0 0 8px rgba(251,231,163,.7);
    transition:width .2s linear;
  }

  @media (prefers-reduced-motion: reduce){
    .bokeh i, .puff, .win, .lampglow, .star{ animation:none !important; }
    .key{ transition:none; }
    .assembly, .sphere, .base, .stage3d{ transition:none !important; }
  }
</style>
</head>
<body>

<!-- fairy-light string -->

<main class="room">

    <div class="neck"></div>

<script>
(function(){
  'use strict';
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = RM.matches;
  RM.addEventListener && RM.addEventListener('change', e => { reduce = e.matches; sizeCanvas(); });

  /* ---------------- bokeh fairy lights ---------------- */
  (function(){
    const box = document.getElementById('bokeh');
    const SPEC = [ // [left%, top px, size px, aqua?, dur s, delay s]
      [ 6, 26, 26, 0, 8.2, -1], [ 15, 62, 16, 1, 11.4, -4], [ 27, 20, 22, 0, 9.6, -2.2],
      [ 38, 52, 13, 0, 12.8, -6], [ 49, 16, 24, 1, 7.6, -3], [ 60, 44, 15, 0, 13.4, -7],
      [ 71, 22, 27, 0, 9.2, -1.6], [ 83, 58, 17, 1, 11.8, -5], [ 93, 24, 22, 0, 8.8, -2.8],
      [  3, 74, 14, 0, 14.0, -8], [ 96, 82, 18, 1, 7.2, -0.6]
    ];
    SPEC.forEach(s => {
      const i = document.createElement('i');
      i.style.cssText = `left:${s[0]}%; top:${s[1]}px; width:${s[2]}px; height:${s[2]}px; --dur:${s[4]}s; --del:${s[5]}s;`;
      if (s[3]) i.classList.add('aq');
      box.appendChild(i);
    });
  })();

  /* ---------------- snow physics ---------------- */
  const assembly = document.getElementById('assembly');
  const sphere = document.getElementById('sphere');
  const base = document.getElementById('base');
  const stage3d = document.getElementById('stage3d');
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  const meterFill = document.getElementById('meterFill');

  let size = 0, R = 0, cx = 0, cy = 0;   // css-px geometry
  const flakes = [];
  let energy = 0;                        // flurry energy
  const FLOOR_MIN = 0.52, FLOOR_SPAN = 0.06;

  function makeFlakes(count){
    flakes.length = 0;
    for (let i = 0; i < count; i++) flakes.push(newFlake(true));
  }
  function newFlake(spread){
    const z = Math.random();
    return {
      x: cx + (Math.random()*2-1) * R * 0.9,
      y: spread ? cy + (Math.random()*2-1) * R * 0.9 : cy - R * 0.8,
      vx: (Math.random()-0.5) * 8,
      vy: 6 + Math.random() * 12,
      z, r: 0.7 + z * 1.9,           // radius 0.7–2.6, depth-correlated
      settled: false
    };
  }
  function sizeCanvas(){
    const oldR = R;
    const dpr = window.devicePixelRatio || 1;
    size = sphere.clientWidth;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = size / 2; cy = size / 2; R = size / 2;
    if (oldR && flakes.length) {            // rescale particle positions on resize
      const k = R / oldR;
      flakes.forEach(p => { p.x = cx + (p.x - cx) * k; p.y = cy + (p.y - cy) * k; p.r *= k; if (p.settled) p.settled = false; });
    }
  }
  const COUNT_FULL = 460, COUNT_LITE = 220;

  function stepFlakes(dt, t){
    const turbScale = energy * 60;
    const drag = Math.min(0.9, dt * (0.8 + energy * 2.2));
    const sway = wobV * 2.6;
    for (const p of flakes) {
      if (p.settled) {
        if (energy > 0.55 && Math.random() < dt * 1.6 * energy) {
          p.settled = false;
          p.vy = -(16 + Math.random() * 40);
          p.vx = (Math.random() - 0.5) * 56;
        }
        continue;
      }
      p.vy += (18 + p.r * 22) * dt;                          // gravity ∝ size
      p.vx += Math.sin(p.y * 0.021 + t * 1.3 + p.z * 9) * turbScale * dt;  // sine/cosine noise
      p.vy += Math.cos(p.x * 0.019 + t * 1.1 + p.z * 5) * turbScale * 0.6 * dt;
      p.vx += sway * dt * (0.4 + p.z);                       // globe angular-velocity sway
      p.vx *= (1 - drag); p.vy *= (1 - drag);
      p.x += p.vx * dt; p.y += p.vy * dt;

      const floorY = cy + R * (FLOOR_MIN + p.z * FLOOR_SPAN);
      if (p.y >= floorY) {
        if (Math.abs(p.vy) < 26 && energy < 0.5) {           // settle once vertical speed is small
          p.y = floorY; p.settled = true; p.vx = p.vy = 0;
        } else {                                             // soft-land, bleed energy
          p.y = floorY; p.vy = -p.vy * 0.24; p.vx *= 0.85;
        }
        continue;
      }
      const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
      const limit = R - p.r - 1;
      if (d > limit) {                                       // elastic wall
        const nx = dx / d, ny = dy / d;
        const vn = p.vx * nx + p.vy * ny;
        p.vx -= 1.7 * vn * nx; p.vy -= 1.7 * vn * ny;
        p.x = cx + nx * limit; p.y = cy + ny * limit;
      }
    }
  }
  function drawFlakes(){
    ctx.clearRect(0, 0, size, size);
    for (const p of flakes) {
      ctx.globalAlpha = 0.35 + p.z * 0.6;
      ctx.fillStyle = (p.z > 0.66) ? '#cfe4f2' : '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.62 + p.z * 0.7), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- springs & wobble ---------------- */
  let offX = 0, offY = 0, offVX = 0, offVY = 0;          // clamped drag offset
  let tgtX = 0, tgtY = 0, held = false;
  const OFFSET_CLAMP = 26;
  let wobA = 0, wobV = 0;                                 // wobble spring: k 42, c 3.2
  let stagePhase = 0, stageVel = 0;                       // music-box scene spin

  function physics(dt){
    const k = 150, c = 16;
    offVX += (k * (tgtX - offX) - c * offVX) * dt;
    offVY += (k * (tgtY - offY) - c * offVY) * dt;
    offX += offVX * dt; offY += offVY * dt;

    wobV += (-42 * wobA - 3.2 * wobV) * dt;
    wobA += wobV * dt;

    energy *= Math.exp(-dt / 2.6);                         // ~10 s settle
    if (energy < 0.002) energy = 0;

    stagePhase += stageVel * dt;
    stageVel *= Math.exp(-dt / 1.55);                      // decays over ~7 s
    if (Math.abs(stageVel) < 0.05) { stageVel = 0; }
  }
  function renderTransforms(){
    assembly.style.transform = `translate(${offX.toFixed(2)}px, ${offY.toFixed(2)}px)`;
    sphere.style.transform = `rotate(${wobA.toFixed(2)}deg)`;
    base.style.transform = `rotate(${(wobA * 0.18).toFixed(2)}deg)`;
    const s = Math.sin(stagePhase * Math.PI / 180);
    stage3d.style.transform = `perspective(700px) rotateY(${(s * 9).toFixed(2)}deg) translateX(${(s * 7).toFixed(2)}px)`;
    meterFill.style.width = Math.min(100, energy / 2.2 * 100) + '%';
  }

  let last = performance.now(), clock = 0;
  function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; clock += dt;
    physics(dt);
    stepFlakes(dt, clock);
    renderTransforms();
    drawFlakes();
  }

  /* ---------------- pointer drag ---------------- */
  let pid = null, lastX = 0, lastY = 0, lastT = 0, moved = false, clampD = 0, clampY = 0;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function stir(speed){
    if (speed <= 900) return;
    energy = Math.min(2.6, energy + (speed - 900) / 2600);
    const dir = Math.sign(speed) || 1;
    wobV += dir * Math.min(80, 26 + (speed - 900) / 28);
    if (energy > 0.25) {
      for (const p of flakes) if (Math.random() < 0.06) {
        p.settled = false; p.vy -= 20 + Math.random() * 40; p.vx += dir * (10 + Math.random() * 26);
      }
    }
  }
  assembly.addEventListener('pointerdown', e => {
    pid = e.pointerId; held = true; moved = false;
    assembly.classList.add('grabbing');
    assembly.setPointerCapture(pid);
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  });
  assembly.addEventListener('pointermove', e => {
    if (e.pointerId !== pid || !held) return;
    const now = performance.now();
    const dt = Math.max(8, now - lastT) / 1000;
    const vx = (e.clientX - lastX) / dt, vy = (e.clientY - lastY) / dt;
    const speed = Math.hypot(vx, vy);
    if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 3) moved = true;
    if (speed > 900) stir(speed);
    clampD = clamp(clampD + (e.clientX - lastX) * 0.34, -OFFSET_CLAMP, OFFSET_CLAMP);
    clampY = clamp(clampY + (e.clientY - lastY) * 0.34, -OFFSET_CLAMP, OFFSET_CLAMP);
    tgtX = clampD; tgtY = clampY;
    offVX += vx * 0.02; offVY += vy * 0.02;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  function endDrag(){
    if (!held) return;
    held = false;
    assembly.classList.remove('grabbing');
    tgtX = 0; tgtY = 0; clampD = 0; clampY = 0;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* ---------------- shake button + device motion ---------------- */
  function bigShake(){
    energy = Math.min(2.6, energy + 1.7);
    wobV += (Math.random() - 0.5) * 110;
    offVX += (Math.random() - 0.5) * 700;
    offVY += (Math.random() - 0.5) * 380;
    for (const p of flakes) if (!p.settled || Math.random() < 0.7) {
      p.settled = false;
      p.vy -= 26 + Math.random() * 70;
      p.vx += (Math.random() - 0.5) * 110;
    }
  }
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let dmOn = false;
  function listenMotion(){
    if (dmOn || typeof DeviceMotionEvent === 'undefined') return;
    dmOn = true;
    let lastSpike = 0;
    window.addEventListener('devicemotion', e => {
      const a = e.accelerationIncludingGravity;
      if (!a || a.x == null) return;
      const m = Math.hypot(a.x, a.y, a.z);
      const now = performance.now();
      if (m > 13 && now - lastSpike > 1400) { lastSpike = now; bigShake(); }
    });
  }
  document.getElementById('btnShake').addEventListener('click', () => {
    if (isIOS && typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function' && !dmOn) {
      DeviceMotionEvent.requestPermission().then(s => { if (s === 'granted') listenMotion(); }).catch(() => {});
    }
    bigShake();
  });
  if (!isIOS) listenMotion();

  /* ---------------- music-box key ---------------- */
  let AC = null;
  function audio(){ return (AC = AC || new (window.AudioContext || window.webkitAudioContext)()); }
  function note(ac, t0, freq, dur){
    const g = ac.createGain();
    g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const o1 = ac.createOscillator();
    o1.type = 'sine'; o1.frequency.value = freq; o1.connect(g);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.05, t0);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.32);
    g2.connect(ac.destination);
    const o2 = ac.createOscillator();
    o2.type = 'triangle'; o2.frequency.value = freq * 2; o2.connect(g2);
    o1.start(t0); o1.stop(t0 + dur + 0.05);
    o2.start(t0); o2.stop(t0 + dur);
  }
  function playPhrase(){
    const ac = audio();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + 0.04;
    const F = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77, C6:1046.5 };
    const phrase = [ ['E5',.30],['G5',.30],['C6',.55],['B5',.30],['G5',.30],['A5',.45],['F5',.30],['A5',.30],['C6',.6],['E5',.35],['G5',.8] ];
    let t = t0;
    for (const [n, d] of phrase){ note(ac, t, F[n], d * 1.6); t += d; }
  }
  let keyRot = 0, keyBusy = false;
  const keyBtn = document.getElementById('key');
  function windKey(){
    keyRot += 720;
    keyBtn.style.transform = `rotate(${keyRot}deg)`;
    playPhrase();
    stageVel += 120;                       // angular momentum for the interior stage
  }
  keyBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (moved) return;                     // was a drag, not a click
    windKey();
  });
  document.getElementById('btnWind').addEventListener('click', windKey);

  /* ---------------- init ---------------- */
  sizeCanvas();
  makeFlakes(reduce ? COUNT_LITE : COUNT_FULL);
  requestAnimationFrame(loop);
  window.addEventListener('resize', () => { sizeCanvas(); });
})();
</script>
</body>
</html>
