<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUMPGATE — Hyperspace Warp Tunnel</title>
<style>
  :root{
    --blue:#3d8bff; --ice:#7fc4ff; --white:#f4f8ff; --violet:#8a5cff;
    --bar:6vh;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Courier New",monospace;
    color:var(--ice);
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0;background:#000}
  #shakewrap{position:absolute;inset:-12px;will-change:transform}
  canvas{display:block;width:100%;height:100%}

  /* cinematic frame */
  .bar{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:8;pointer-events:none}
  .bar.top{top:0} .bar.bottom{bottom:0}
  #vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse 72% 72% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 76%, rgba(0,0,0,.94) 100%)}
  #scan{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:overlay;opacity:.55;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0px, rgba(255,255,255,.10) 1px, transparent 1px, transparent 3px)}
  #flash{position:absolute;inset:0;z-index:7;pointer-events:none;background:var(--white);opacity:0}

  /* HUD */
  #hud{position:absolute;inset:0;z-index:6;pointer-events:none}
  #hud .txt{text-shadow:0 0 9px rgba(61,139,255,.55)}
  .corner{position:absolute;display:flex;flex-direction:column;gap:7px;font-size:11px;letter-spacing:.16em}
  .corner.tl{top:calc(var(--bar) + 20px);left:26px}
  .corner.tr{top:calc(var(--bar) + 20px);right:26px;text-align:right;align-items:flex-end}
  .corner.bl{bottom:calc(var(--bar) + 96px);left:26px}
  .corner.br{bottom:calc(var(--bar) + 96px);right:26px;text-align:right;align-items:flex-end}
  .corner i{font-style:normal;color:rgba(127,196,255,.42);margin-right:10px}
  .corner span{color:var(--ice)}
  .corner b{font-weight:600;color:var(--white)}

  header{position:absolute;top:calc(var(--bar) + 14px);left:0;right:0;text-align:center}
  #title{font-family:system-ui,sans-serif;font-weight:100;font-size:clamp(15px,2.2vw,24px);
    letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--white);
    text-shadow:0 0 18px rgba(61,139,255,.85),0 0 40px rgba(61,139,255,.4)}
  #prompt{margin-top:9px;font-size:10px;letter-spacing:.3em;color:rgba(127,196,255,.66);
    text-shadow:0 0 8px rgba(61,139,255,.5);transition:opacity 1.4s ease}
  #prompt b{color:var(--white);font-weight:600}
  #prompt.gone{opacity:0}

  /* reticle */
  #reticle{position:absolute;top:50%;left:50%;width:min(34vh,250px);height:min(34vh,250px);
    transform:translate(-50%,-50%);opacity:.6}
  #reticle .r1{animation:spin 14s linear infinite}
  #reticle .r2{animation:spin 22s linear infinite reverse}
  #reticle .dot{animation:dot 2.4s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes dot{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
  #reticle .r1,#reticle .r2{transform-origin:120px 120px}
  #reticle .dot{transform-origin:120px 120px}

  /* speed block */
  #speedblock{position:absolute;bottom:calc(var(--bar) + 16px);left:0;right:0;text-align:center}
  #speed{font-family:system-ui,sans-serif;font-weight:200;font-size:clamp(44px,9vh,88px);
    line-height:1;color:var(--white);letter-spacing:.04em;
    text-shadow:0 0 16px rgba(61,139,255,.8),0 0 46px rgba(61,139,255,.45);transition:text-shadow .2s}
  #speed.hot{text-shadow:0 0 12px #fff,0 0 34px var(--ice),0 0 70px var(--white)}
  #speed small{font-size:.32em;font-weight:400;letter-spacing:.2em;color:var(--ice);vertical-align:.85em;margin-left:.2em}
  #track{width:min(460px,62vw);height:4px;margin:10px auto 8px;background:rgba(61,139,255,.14);
    border:1px solid rgba(61,139,255,.28);position:relative;overflow:hidden}
  #fill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,var(--blue),var(--ice) 55%,var(--violet) 82%,var(--white))}
  #stageLabel{font-size:10px;letter-spacing:.42em;text-indent:.42em;text-transform:lowercase;
    color:rgba(127,196,255,.8);text-shadow:0 0 8px rgba(61,139,255,.5)}
  #stageLabel b{color:var(--white);font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div id="shakewrap"><canvas id="space"></canvas></div>
  <div id="vignette"></div>
  <div id="scan"></div>

  <div id="hud">
    <header class="txt">
      <h1 id="title">Jumpgate</h1>
      <p id="prompt">HOLD <b>MOUSE</b> · <b>TOUCH</b> · <b>SPACE</b> TO ENGAGE DRIVE</p>
    </header>

    <svg id="reticle" viewBox="0 0 240 240" fill="none" aria-hidden="true">
      <g class="r1" stroke="rgba(127,196,255,.55)" stroke-width="1">
        <circle cx="120" cy="120" r="92" stroke-dasharray="10 7 2 7"/>
        <line x1="120" y1="16" x2="120" y2="30"/><line x1="120" y1="210" x2="120" y2="224"/>
        <line x1="16" y1="120" x2="30" y2="120"/><line x1="210" y1="120" x2="224" y2="120"/>
      </g>
      <g class="r2" stroke="rgba(138,92,255,.6)" stroke-width="1">
        <circle cx="120" cy="120" r="66" stroke-dasharray="3 9"/>
        <line x1="73" y1="73" x2="83" y2="83"/><line x1="167" y1="73" x2="157" y2="83"/>
        <line x1="73" y1="167" x2="83" y2="157"/><line x1="167" y1="167" x2="157" y2="157"/>
      </g>
      <circle cx="120" cy="120" r="34" stroke="rgba(61,139,255,.4)" stroke-width="1"/>
      <circle class="dot" cx="120" cy="120" r="3.4" fill="#f4f8ff"/>
      <line x1="112" y1="120" x2="104" y2="120" stroke="#7fc4ff" stroke-width="1"/>
      <line x1="128" y1="120" x2="136" y2="120" stroke="#7fc4ff" stroke-width="1"/>
      <line x1="120" y1="112" x2="120" y2="104" stroke="#7fc4ff" stroke-width="1"/>
      <line x1="120" y1="128" x2="120" y2="136" stroke="#7fc4ff" stroke-width="1"/>
    </svg>

    <div class="corner tl txt">
      <div><i>VECTOR</i><span>044·218·067</span></div>
      <div><i>GATE</i><span id="gateId">IX-0447 / KEPLER-9</span></div>
    </div>
    <div class="corner tr txt">
      <div><i>DRIVE</i><span id="drive">IDLE</span></div>
      <div><i>FPS</i><span id="fps">—</span></div>
    </div>
    <div class="corner bl txt">
      <div><i>STARS</i><span id="stars">0</span></div>
      <div><i>DIST</i><span id="dist">0.000 ly</span></div>
      <div><i>ELAPSED</i><span id="time">00:00</span></div>
    </div>
    <div class="corner br txt">
      <div><i>SHAKE</i><span id="shake">0.0 px</span></div>
      <div><i>HULL</i><span id="hull">100.0 %</span></div>
    </div>

    <div id="speedblock" class="txt">
      <div id="speed">0.00<small>c</small></div>
      <div id="track"><div id="fill"></div></div>
      <div id="stageLabel"><b>SUBLIGHT</b> — drive cold</div>
    </div>
  </div>

  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div id="flash"></div>
</div>

<script>
(() => {
  "use strict";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cvs = document.getElementById("space");
  const ctx = cvs.getContext("2d");
  const wrap = document.getElementById("shakewrap");
  const flashEl = document.getElementById("flash");
  const $ = id => document.getElementById(id);
  const elSpeed=$("speed"), elFill=$("fill"), elStage=$("stageLabel"),
        elDrive=$("drive"), elFps=$("fps"), elStars=$("stars"),
        elDist=$("dist"), elTime=$("time"), elShake=$("shake"),
        elHull=$("hull"), elPrompt=$("prompt");

  const FOCAL = 420;
  const RING_COUNT = 14, RING_SPACING = 235, RING_R = 520;
  let W=0, H=0, CX=0, CY=0, DPR=1;
  let stars = [];
  let rings = [];
  let speed = 0, target = 0, engaged = false;
  let flash = 0, prevAbove93 = false;
  let distLY = 0, t0 = performance.now(), fpsSmooth = 60;

  function spawnStar(s, far){
    const sx = W*1.35, sy = H*1.35;
    s.x = (Math.random()*2-1)*sx;
    s.y = (Math.random()*2-1)*sy;
    s.z = far ? 2600 + Math.random()*400 : 200 + Math.random()*2800;
    const r = Math.random();
    s.col = r < 0.12 ? "v" : r < 0.67 ? "b" : "w";
    s.bri = 0.55 + Math.random()*0.45;
  }
  function build(){
    const area = W*H;
    const n = Math.round(Math.max(350, Math.min(1400, area/1550)));
    stars = new Array(n);
    for (let i=0;i<n;i++){ stars[i] = {}; spawnStar(stars[i], false); }
    elStars.textContent = n;
    rings = [];
    for (let i=0;i<RING_COUNT;i++){
      rings.push({ z: 120 + i*RING_SPACING, ang: Math.random()*Math.PI*2, dir: i%2 ? 1 : -1 });
    }
  }
  function resize(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = innerWidth + 24; H = innerHeight + 24;   // shake wrap is inset -12px
    CX = W/2; CY = H/2;
    cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
    build();
  }
  addEventListener("resize", resize, {passive:true});
  resize();

  /* ---------- input ---------- */
  function engage(){ if(!engaged){ engaged=true; target=1; elPrompt.classList.add("gone"); } }
  function release(){ if(engaged){ engaged=false; target=0; } }
  addEventListener("pointerdown", e => { e.preventDefault(); engage(); }, {passive:false});
  addEventListener("pointerup", release);
  addEventListener("pointercancel", release);
  addEventListener("keydown", e => { if(e.code==="Space" && !e.repeat){ e.preventDefault(); engage(); } });
  addEventListener("keyup",  e => { if(e.code==="Space") release(); });
  addEventListener("blur", release);

  /* ---------- helpers ---------- */
  const COL = { v:"138,92,255", b:"61,139,255", w:"244,248,255" };
  function fmtTime(ms){
    const s = Math.floor(ms/1000);
    return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }

  /* ---------- frame ---------- */
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    fpsSmooth += ((1/Math.max(dt,1e-4)) - fpsSmooth)*0.06;

    // exponential approach: fast ramp, slower decay/coast
    const rate = target > speed ? 2.6 : (engaged ? 1.2 : 0.55);
    speed += (target - speed) * (1 - Math.exp(-rate*dt));
    if (speed < 0.0005 && !engaged) speed = 0;
    distLY += speed*speed * dt * 4.31;

    // white flash on crossing 93%
    const above93 = speed >= 0.93;
    if (above93 && !prevAbove93) flash = 1;
    prevAbove93 = above93;
    if (flash > 0){ flash = Math.max(0, flash - dt*2.6); flashEl.style.opacity = (flash*0.85).toFixed(3); }

    // shake + chroma above 75%
    const over = Math.max(0, (speed-0.75)/0.25);
    let shakeMag = 0;
    if (over > 0 && !reduced){
      shakeMag = over*6;
      const rx = (Math.random()*2-1)*shakeMag, ry = (Math.random()*2-1)*shakeMag;
      wrap.style.transform = `translate(${rx.toFixed(2)}px,${ry.toFixed(2)}px)`;
    } else wrap.style.transform = "translate(0,0)";
    const chroma = over;

    render(dt, chroma);
    hud(shakeMag, dt);
    requestAnimationFrame(frame);
  }

  function render(dt, chroma){
    // fade the previous frame (trails lengthen as speed rises)
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(0,0,0,${(0.34 - 0.26*speed).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    // core glow at the vanishing point
    const gr = 40 + speed*speed*440;
    const g = ctx.createRadialGradient(CX,CY,0,CX,CY,gr);
    const a = 0.10 + speed*0.55;
    g.addColorStop(0, `rgba(244,248,255,${Math.min(0.95,a).toFixed(3)})`);
    g.addColorStop(0.35, `rgba(127,196,255,${(a*0.5).toFixed(3)})`);
    g.addColorStop(1, "rgba(61,139,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(CX-gr,CY-gr,gr*2,gr*2);

    // velocity-scaled advance
    const vz = (70 + 2350*speed*speed) * dt;
    const trail = 22 + speed*speed*680;

    for (const s of stars){
      s.z -= vz;
      if (s.z < 24){ spawnStar(s, true); continue; }
      const iz = FOCAL/s.z, iz2 = FOCAL/(s.z+trail);
      const px = CX + s.x*iz, py = CY + s.y*iz;
      if (px<-60||px>W+60||py<-60||py>H+60) continue;
      const qx = CX + s.x*iz2, qy = CY + s.y*iz2;
      const near = 1 - s.z/3000;
      const alpha = Math.min(1, (0.12+near*0.9)*s.bri);
      ctx.lineWidth = 0.6 + near*1.8;

      if (chroma > 0){
        const d = Math.hypot(px-CX,py-CY) || 1;
        const split = 6*chroma*Math.min(1, near*1.6);
        const ux = (px-CX)/d*split, uy = (py-CY)/d*split;
        ctx.strokeStyle = `rgba(255,64,96,${(alpha*0.34).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(px-ux,py-uy); ctx.lineTo(qx-ux,qy-uy); ctx.stroke();
        ctx.strokeStyle = `rgba(70,150,255,${(alpha*0.34).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(px+ux,py+uy); ctx.lineTo(qx+ux,qy+uy); ctx.stroke();
      }
      ctx.strokeStyle = `rgba(${COL[s.col]},${alpha.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(qx,qy); ctx.stroke();
    }

    drawTunnel(dt, vz);
    ctx.globalCompositeOperation = "source-over";
  }

  function drawTunnel(dt, vz){
    const proj = r => { // precompute screen ring vertices
      const pts = [];
      for (const ring of r){
        ring.z -= vz;
        if (ring.z < 26) ring.z += RING_COUNT*RING_SPACING;
        ring.ang += ring.dir * (0.10 + speed*1.15) * dt;
        const k = FOCAL/Math.max(ring.z, 26), scr = RING_R*k;
        const v = [];
        for (let i=0;i<8;i++){
          const a = ring.ang + i*Math.PI/4;
          v.push([CX + Math.cos(a)*scr, CY + Math.sin(a)*scr]);
        }
        pts.push(v);
      }
      return pts;
    };
    const pts = proj(rings);
    ctx.strokeStyle = "rgba(61,139,255,0.72)";
    ctx.lineWidth = 1.6 + speed*1.6;
    ctx.shadowColor = "#3d8bff";
    ctx.shadowBlur = 12 + speed*20;
    for (const v of pts){
      ctx.beginPath();
      ctx.moveTo(v[0][0],v[0][1]);
      for (let i=1;i<8;i++) ctx.lineTo(v[i][0],v[i][1]);
      ctx.closePath(); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // violet struts: every other ring to its neighbour
    ctx.strokeStyle = `rgba(138,92,255,${(0.30+speed*0.4).toFixed(3)})`;
    ctx.lineWidth = 1.1;
    for (let r=0; r<RING_COUNT-1; r+=2){
      const a = pts[r], b = pts[r+1];
      for (let i=0;i<8;i++){
        ctx.beginPath(); ctx.moveTo(a[i][0],a[i][1]); ctx.lineTo(b[i][0],b[i][1]); ctx.stroke();
      }
    }
  }

  function hud(shakeMag, dt){
    elSpeed.firstChild.nodeValue = (speed*9.99).toFixed(2);
    elFill.style.transform = `scaleX(${speed.toFixed(3)})`;
    elShake.textContent = shakeMag.toFixed(1)+" px";
    elFps.textContent = Math.round(fpsSmooth);
    elDist.textContent = distLY.toFixed(3)+" ly";
    elTime.textContent = fmtTime(performance.now()-t0);
    const hull = 100 - Math.max(0,(speed-0.90)/0.10)*2.6;
    elHull.textContent = hull.toFixed(1)+" %";

    const maxed = speed>=0.97;
    elSpeed.classList.toggle("hot", speed>=0.97);
    let drive = "IDLE";
    if (engaged && maxed) drive = "MAX";
    else if (engaged) drive = "BURN";
    else if (speed > 0.03) drive = "COAST";
    if (elDrive.textContent !== drive) elDrive.textContent = drive;

    let stage, note;
    if (speed < 0.25){ stage="SUBLIGHT"; note = engaged? "drive spooling":"drive cold"; }
    else if (speed < 0.60){ stage="WARP ENTRY"; note = "gate field forming"; }
    else if (speed < 0.93){ stage="HYPERSPACE"; note = "in the tunnel"; }
    else { stage="THRESHOLD"; note = "do not hold"; }
    elStage.innerHTML = `<b>${stage}</b> — ${note}`;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
