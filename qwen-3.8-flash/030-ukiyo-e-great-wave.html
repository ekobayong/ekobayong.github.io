<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nami no Yume — Animated Ukiyo-e Seascape</title>
<style>
  :root{
    --serif:'Iowan Old Style',Palatino,'Palatino Linotype',Georgia,ui-serif,serif;
    --ink:#22303f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    background:#2a231d;
    background-image:radial-gradient(ellipse 70% 55% at 50% 38%, rgba(255,222,170,.10), rgba(0,0,0,0) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    padding:5vh 4vw;font-family:var(--serif);
  }
  .print{width:min(940px,94vw)}
  .print svg{display:block;width:100%;height:auto;
    box-shadow:0 34px 70px -22px rgba(0,0,0,.85),0 10px 22px rgba(0,0,0,.55),
               inset 0 0 0 1px rgba(58,42,26,.35);
    cursor:pointer}
  /* out-of-register misprint on hover */
  #blockBlue,#blockFoam,#blockKey,#seal{transition:transform .9s cubic-bezier(.65,.05,.35,1)}
  #seal{transform-box:fill-box;transform-origin:center}
  .print:hover #blockBlue{transform:translate(5px,-3px)}
  .print:hover #blockFoam{transform:translate(-4px,2px)}
  .print:hover #blockKey{transform:translate(2px,3px)}
  .print:hover #seal{transform:translate(-3px,-2px) rotate(1deg)}

  .vt{writing-mode:vertical-rl;text-orientation:upright;
      font:bold 44px var(--serif);fill:var(--ink);letter-spacing:.08em}
  .vc{writing-mode:vertical-rl; /* text-orientation: mixed (default) — latin rotates */
      font:italic 15px var(--serif);fill:#5b5546;letter-spacing:.16em}
  .seal-txt{font:bold 15px var(--serif);fill:#efe3c6;letter-spacing:.24em;text-anchor:middle}

  .controls{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .controls button{
    font:italic 17px var(--serif);letter-spacing:.02em;
    color:#e8dcc0;background:transparent;
    border:1px solid rgba(232,220,192,.4);border-radius:2px;
    padding:.5em 1.3em;cursor:pointer;
    transition:background .35s cubic-bezier(.22,1,.36,1),color .35s cubic-bezier(.22,1,.36,1),
               border-color .35s;
  }
  .controls button:hover{background:rgba(232,220,192,.12)}
  .controls button.active{background:#e8dcc0;color:#2a231d;border-color:#e8dcc0}
  .controls button:focus-visible{outline:2px solid #b8322a;outline-offset:3px}
</style>
</head>
<body>

<div class="print" id="print">
<svg id="sheet" viewBox="0 0 1200 800" role="img" aria-label="Nami no Yume — an animated woodblock seascape: three Prussian-blue swells under a straw-to-sea-grey sky, a snow-capped mountain, foam claws, and three small boats.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e9dcb9"/>
      <stop offset=".55" stop-color="#c9c3b2"/>
      <stop offset="1"   stop-color="#9fb0b3"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f2ecd8"/>
      <stop offset=".28" stop-color="#96a6ad"/>
      <stop offset="1"   stop-color="#3f5470"/>
    </linearGradient>
    <linearGradient id="wv0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9cc2"/><stop offset=".5" stop-color="#3d6d9a"/><stop offset="1" stop-color="#1b3a5c"/>
    </linearGradient>
    <linearGradient id="wv1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7ba8"/><stop offset=".5" stop-color="#2f5a86"/><stop offset="1" stop-color="#132c47"/>
    </linearGradient>
    <linearGradient id="wv2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6b98"/><stop offset=".5" stop-color="#1b3a5c"/><stop offset="1" stop-color="#0f2540"/>
    </linearGradient>
    <pattern id="stripe" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-26)">
      <line x1="0" y1="0" x2="0" y2="11" stroke="rgba(230,238,244,0.16)" stroke-width="1.7"/>
      <line x1="5.5" y1="0" x2="5.5" y2="11" stroke="rgba(6,18,33,0.20)" stroke-width="1"/>
    </pattern>
    <!-- horizontal paper fibres: anisotropic turbulence -->
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.62" numOctaves="1" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" result="f"
        values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.20  0.62 0.28 0 0 -0.24"/>
      <feComposite in="f" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- final grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g">
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
    </filter>
    <!-- seal ink bleed -->
    <filter id="bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="0.85" in="SourceGraphic" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.75" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ================= PAPER / SKY BLOCK ================= -->
  <g id="blockPaper">
    <rect width="1200" height="800" fill="#efe3c6"/>
    <rect width="1200" height="800" fill="#efe3c6" filter="url(#fibers)" opacity=".5"/>
    <rect width="1200" height="482" fill="url(#sky)"/>
    <!-- faint sun -->
    <circle cx="992" cy="122" r="47" fill="#f8f0d6" opacity=".55"/>
    <circle cx="992" cy="122" r="47" fill="none" stroke="#d9cfa8" stroke-width="1.4" opacity=".6"/>
    <!-- wind-blown cloud strokes -->
    <g fill="none" stroke="#7e8d90" stroke-linecap="round" opacity=".7">
      <path d="M 690 214 c 60 -9 130 -7 186 3 c 22 4 8 12 -14 9 c -50 -6 -100 -5 -150 2" stroke-width="3.4"/>
      <path d="M 856 176 c 42 -6 92 -4 128 4 c 16 4 6 11 -10 8 c -36 -6 -72 -5 -108 1" stroke-width="2.6"/>
      <path d="M 250 168 c 48 -7 104 -5 148 4 c 18 4 7 11 -11 8 c -42 -6 -84 -4 -125 2" stroke-width="2.8"/>
      <path d="M 330 118 c 34 -5 74 -3 104 4 c 13 3 4 9 -8 6 c -30 -5 -58 -3 -88 2" stroke-width="2" opacity=".7"/>
    </g>
    <!-- distant mountain -->
    <path d="M 318 560 Q 520 392 585 330 Q 600 317 616 331 Q 692 396 892 560 Z" fill="url(#mtn)"/>
    <path d="M 549 362 Q 572 340 585 330 Q 600 317 616 331 Q 634 346 658 368
             c -14 10 -22 -4 -34 4 c -13 9 -20 -5 -32 2 c -13 8 -20 -6 -33 1 z" fill="#f3edda" opacity=".95"/>
  </g>

  <!-- ================= BLUE COLOUR BLOCK (three swells) ================= -->
  <g id="blockBlue">
    <path id="wave0" fill="url(#wv0)"/>
    <path id="wave0s" fill="url(#stripe)"/>
    <path id="wave1" fill="url(#wv1)"/>
    <path id="wave1s" fill="url(#stripe)"/>
    <path id="wave2" fill="url(#wv2)"/>
    <path id="wave2s" fill="url(#stripe)"/>
  </g>

  <!-- ================= FOAM BLOCK ================= -->
  <g id="blockFoam">
    <g id="claws"></g>
    <g id="flecks" fill="#f6efdc"></g>
  </g>

  <!-- ================= KEY BLOCK (edge + boats) ================= -->
  <g id="blockKey">
    <path id="keyEdge" fill="none" stroke="#0b1d33" stroke-width="2.5" stroke-linejoin="round"/>
    <g id="boats"></g>
  </g>

  <!-- ================= MARKS ================= -->
  <g id="titles">
    <text class="vt" x="1146" y="72">波の夢</text>
    <text class="vc" x="1096" y="72">波の夢 · NAMI NO YUME · 百夢の海</text>
  </g>
  <g id="seal" filter="url(#bleed)">
    <rect x="46" y="46" width="92" height="132" rx="5" fill="#b8322a"/>
    <rect x="54" y="54" width="76" height="116" rx="2" fill="none" stroke="#efe3c6" stroke-width="2"/>
    <text class="seal-txt" x="93" y="80">NAMI</text>
    <text class="seal-txt" x="93" y="105">NO</text>
    <text class="seal-txt" x="93" y="130">YUME</text>
    <text class="seal-txt" x="93" y="159" style="font-size:13px">MMXXVI</text>
  </g>

  <!-- fibres + grain laid over the whole image -->
  <rect width="1200" height="800" fill="#efe3c6" filter="url(#fibers)" opacity=".28" style="mix-blend-mode:multiply" pointer-events="none"/>
  <rect width="1200" height="800" filter="url(#grain)" style="mix-blend-mode:multiply" pointer-events="none"/>
</svg>
</div>

<div class="controls" role="group" aria-label="Print controls">
  <button id="btnCalm" type="button">Calm sea</button>
  <button id="btnStorm" type="button">Rising storm</button>
  <button id="btnHold" type="button" aria-pressed="false">Hold the block</button>
</div>

<script>
(() => {
  "use strict";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const wavePaths = [$("wave0"), $("wave1"), $("wave2")];
  const stripePaths = [$("wave0s"), $("wave1s"), $("wave2s")];
  const keyEdge = $("keyEdge");
  const clawsG = $("claws"), flecksG = $("flecks"), boatsG = $("boats");
  const btnCalm = $("btnCalm"), btnStorm = $("btnStorm"), btnHold = $("btnHold");

  const FOAM = "#f6efdc";
  const X0 = -40, X1 = 1240, STEP = 15;

  /* three sine harmonics per layer: [amplitude, wavenumber, angular speed, phase] */
  const L = [
    { base: 470, hs: [[26, 0.0088,  0.55, 1.1], [12, 0.0174, -0.92, 3.4], [ 6, 0.0325,  1.45, 0.4]], dir: 1 },
    { base: 560, hs: [[34, 0.0072, -0.46, 2.0], [18, 0.0138,  0.80, 5.1], [ 8, 0.0287, -1.22, 1.7]], dir: -1 },
    { base: 668, hs: [[46, 0.0061,  0.38, 0.7], [25, 0.0121, -0.66, 4.2], [11, 0.0262,  0.98, 2.9]], dir: 1 },
  ];
  /* the great crest: asymmetric Gaussian on the front layer, left of centre */
  const CREST_X = 300, CREST_H = 330, SIGMA_BACK = 165, SIGMA_LEAD = 54;

  let t = 6.2, amp = 1, ampTarget = 1, held = false;

  function surf(i, x) {
    const l = L[i];
    let y = l.base;
    for (const [a, k, s, p] of l.hs) y -= a * amp * Math.sin(k * x + s * t + p);
    if (i === 2) {
      const breathe = 1 + 0.05 * Math.sin(t * 0.8);
      const h = CREST_H * amp * breathe;
      const dx = x - CREST_X;
      const sig = dx < 0 ? SIGMA_BACK : SIGMA_LEAD;   // steeper on the leading edge -> curls forward
      y -= h * Math.exp(-(dx * dx) / (2 * sig * sig));
    }
    return y;
  }

  function pathD(i) {
    let d = "M " + X0 + " 812 L " + X0 + " " + surf(i, X0).toFixed(1);
    for (let x = X0 + STEP; x <= X1; x += STEP)
      d += " L " + x + " " + surf(i, x).toFixed(1);
    return d + " L " + X1 + " 812 Z";
  }

  /* deterministic pseudo-random from position (no per-frame flicker) */
  function hash(x) { const s = Math.sin(x * 12.9898) * 43758.5453; return s - Math.floor(s); }

  function clawHTML(cx, cy, prom, dir) {
    const r0 = Math.min(26, 6 + prom * 0.22);
    const nf = 3 + Math.floor(hash(cx) * 3);            // 3–5 fingers
    let out = "";
    for (let f = 0; f < nf; f++) {
      const ox = (f - (nf - 1) / 2) * r0 * 0.85;
      let px = cx + ox, py = cy - 1, a = -1.28;         // starts upward
      for (let j = 0; j < 4; j++) {
        const r = r0 * Math.pow(0.66, j);
        a += 0.62;                                       // hook over
        px += Math.cos(a) * r * 1.05 * dir;
        py += Math.sin(a) * r * 1.05;
        out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r.toFixed(1)}"/>`;
      }
    }
    /* foam rim along the crest */
    const rim = Math.max(4, Math.round(prom / 4));
    for (let j = 0; j <= rim; j++) {
      const rx = cx - 30 + j * (60 / rim);
      const ry = surf(2, rx) + 2;
      out += `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${(2.2 + hash(rx * 0.7 + cy) * 2.4).toFixed(1)}"/>`;
    }
    return out;
  }
  function crestRim(i, cx, half) {
    let out = "";
    for (let j = 0; j <= 8; j++) {
      const rx = cx - half + j * (half / 4);
      out += `<circle cx="${rx.toFixed(1)}" cy="${(surf(i, rx) + 2).toFixed(1)}" r="${(2 + hash(rx * 1.7 + i) * 2.6).toFixed(1)}"/>`;
    }
    return out;
  }

  function foamHTML() {
    let out = "";
    /* the great crest always breathes foam */
    out += clawHTML(CREST_X, surf(2, CREST_X), Math.min(60, 42 * amp + 18), L[2].dir);
    /* detected crests on middle + front layers */
    for (let i = 1; i <= 2; i++) {
      const dir = L[i].dir;
      let lastX = -999;
      for (let x = 40; x <= 1160; x += 24) {
        const y = surf(i, x);
        let prom = 999;
        for (let d = -78; d <= 78; d += 26) prom = Math.min(prom, surf(i, x + d) - y);
        if (prom > 11 * (2 - amp) * 0.6 && x - lastX > 110 && Math.abs(x - CREST_X) > 130) {
          lastX = x;
          const scale = i === 1 ? 0.55 : 0.85;
          const c = Math.min(24, 5 + prom * 0.20) * scale;
          const nf = 2 + (Math.round(x / 31) % 3);
          for (let f = 0; f < nf; f++) {
            const ox = (f - (nf - 1) / 2) * c * 0.8;
            let px = x + ox, py = y - 1, a = -1.28;
            for (let j = 0; j < 3; j++) {
              const r = c * Math.pow(0.68, j);
              a += 0.66;
              px += Math.cos(a) * r * 1.0 * dir;
              py += Math.sin(a) * r * 1.0;
              out += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r.toFixed(1)}"/>`;
            }
          }
          out += crestRim(i, x, 30 + prom * 0.5);
        }
      }
    }
    clawsG.innerHTML = `<g fill="${FOAM}">` + out + `</g>`;
  }

  /* ---- foam flecks: 46 of them, drifting up and forward ---- */
  const flecks = [];
  for (let i = 0; i < 46; i++) {
    flecks.push({ x: Math.random() * 1200, y: 500, vx: 0, vy: 0, r: 1, life: 0, max: 1 });
    respawnFleck(flecks[i]);
    flecks[i].life = Math.random();
  }
  function respawnFleck(f) {
    f.x = Math.random() * 1240 - 20;
    f.y = surf(Math.random() < 0.5 ? 1 : 2, f.x) + Math.random() * 40;
    f.vx = 9 + Math.random() * 20;
    f.vy = -(16 + Math.random() * 28);
    f.r = 0.9 + Math.random() * 1.8;
    f.max = 2.2 + Math.random() * 3.2;
    f.life = 0;
  }
  function fleckHTML(dt) {
    let out = "";
    for (const f of flecks) {
      if (!held) { f.life += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 5.5 * dt; }
      if (f.life >= f.max) respawnFleck(f);
      const a = Math.sin(Math.PI * Math.min(1, f.life / f.max));
      out += `<circle cx="${f.x.toFixed(1)}" cy="${f.y.toFixed(1)}" r="${f.r.toFixed(1)}" opacity="${(a * 0.9).toFixed(2)}"/>`;
    }
    flecksG.innerHTML = out;
  }

  /* ---- three boats, four hunched rowers each, riding the back swell ---- */
  const BOATS = [418, 615, 838];
  function boatHTML() {
    let out = "";
    BOATS.forEach((bx, i) => {
      const y = surf(0, bx) + 3;
      const slope = (surf(0, bx + 9) - surf(0, bx - 9)) / 18;
      const rot = Math.atan(slope) * 180 / Math.PI + 3 * Math.sin(t * 1.35 + i * 2.2);
      let rowers = "";
      for (let r = 0; r < 4; r++) {
        const rx = -12 + r * 8;
        rowers +=
          `<path d="M ${rx} -1 Q ${rx - 1.5} -7 ${rx + 2} -8.6" stroke="#241a10" stroke-width="2.3" fill="none" stroke-linecap="round"/>` +
          `<circle cx="${rx + 2.6}" cy="-10.6" r="2.1" fill="#241a10"/>` +
          `<line x1="${rx + 3}" y1="-7.5" x2="${rx + 9.5}" y2="1.5" stroke="#3c2c17" stroke-width="1"/>`;
      }
      out += `<g transform="translate(${bx.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(2)})">
        <path d="M -27 -2 C -19 10 19 10 27 -2 L 21 -1 C 13 5 -13 5 -21 -1 Z" fill="#6d4a2a" stroke="#241a10" stroke-width="1.2"/>
        ${rowers}</g>`;
    });
    boatsG.innerHTML = out;
  }

  function render(dt) {
    for (let i = 0; i < 3; i++) {
      const d = pathD(i);
      wavePaths[i].setAttribute("d", d);
      stripePaths[i].setAttribute("d", d);
    }
    keyEdge.setAttribute("d", pathD(2));
    foamHTML();
    fleckHTML(dt);
    boatHTML();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!held) t += dt;
    amp += (ampTarget - amp) * (1 - Math.exp(-2.2 * dt));
    render(dt);
    requestAnimationFrame(loop);
  }

  /* ---- controls ---- */
  function markActive(btn) {
    [btnCalm, btnStorm].forEach(b => b.classList.toggle("active", b === btn));
  }
  btnCalm.addEventListener("click", () => { ampTarget = 0.45; markActive(btnCalm); if (reduced) { amp = ampTarget; render(0); } });
  btnStorm.addEventListener("click", () => { ampTarget = 1.6; markActive(btnStorm); if (reduced) { amp = ampTarget; render(0); } });
  btnHold.addEventListener("click", () => {
    held = !held;
    btnHold.setAttribute("aria-pressed", String(held));
    btnHold.classList.toggle("active", held);
  });

  let last = performance.now();
  if (reduced) {
    render(0);                       // a single static frame
    btnHold.style.display = "none";  // time is already frozen
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
