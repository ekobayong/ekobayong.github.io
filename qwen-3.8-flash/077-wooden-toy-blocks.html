<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wooden Alphabet Blocks — A Tumbling Toy</title>
<style>
  :root{
    --red-a:#e85c4e; --red-b:#c33b30;
    --blue-a:#4a86d6; --blue-b:#2a5fa8;
    --yellow-a:#f6cf4a; --yellow-b:#e0ad1a;
    --green-a:#63ad70; --green-b:#3f8a4d;
    --brown:#4a3323;
    --cream:#fff8e8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Helvetica Neue", system-ui, sans-serif;
    background:#f2dfc4;
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- Stage / nursery background ---------- */
  #stage{
    position:fixed; inset:0;
    background:linear-gradient(168deg, #fff6e6 0%, #fbf3e4 48%, #f2dfc4 100%);
    perspective:1400px;
    overflow:hidden;
  }
  .peach-glow{
    position:absolute; top:-18vh; right:-12vw; width:70vw; height:70vh;
    background:radial-gradient(closest-side, rgba(255,196,150,.55), rgba(255,196,150,.18) 55%, transparent 72%);
    pointer-events:none;
  }
  .light-beam{
    position:absolute; top:-30%; height:160%; width:26vw; left:12%;
    transform:rotate(24deg);
    background:linear-gradient(90deg, transparent, rgba(255,240,205,.55) 40%, rgba(255,246,222,.75) 50%, rgba(255,240,205,.45) 62%, transparent);
    mix-blend-mode:screen; filter:blur(6px); pointer-events:none;
  }
  .light-beam.b2{ left:52%; width:15vw; transform:rotate(24deg); opacity:.7; }

  .rug{
    position:absolute; left:0; right:0; bottom:9vh; height:10vh; min-height:56px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(90deg, rgba(120,60,30,.05) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #d9a98a, #c48a6a);
    border-top:1px solid rgba(120,60,30,.25);
    pointer-events:none;
  }
  .rug::after{
    content:""; position:absolute; inset:9px 18px;
    border:2.5px dashed rgba(255,255,255,.65); border-radius:6px;
  }
  .desk{
    position:absolute; left:0; right:0; bottom:0; height:9vh; min-height:52px;
    background:
      repeating-linear-gradient(0deg, rgba(74,44,20,.10) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(90deg, rgba(255,220,170,.05) 0 3px, transparent 3px 26px),
      linear-gradient(180deg, #a8703f, #7a4b26);
    box-shadow:inset 0 14px 22px -12px rgba(40,20,5,.55), inset 0 -6px 14px rgba(30,15,0,.4);
    pointer-events:none;
  }
  .desk::before{
    content:""; position:absolute; left:0; right:0; top:-4px; height:6px;
    background:linear-gradient(180deg, #d59a60, #c88b52);
    box-shadow:0 2px 4px rgba(60,30,8,.35);
  }

  /* ---------- Header / UI ---------- */
  header{
    position:absolute; top:0; left:0; right:0; z-index:50;
    padding:clamp(10px,2.4vh,22px) clamp(14px,3vw,34px);
    display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px;
    pointer-events:none;
  }
  header > *{ pointer-events:auto; }
  h1.title{
    font-size:clamp(20px, 3.4vw, 34px);
    font-weight:800; letter-spacing:.5px; color:var(--brown);
    text-shadow:0 2px 0 rgba(255,255,255,.8);
    display:flex; align-items:baseline;
  }
  h1.title span{ display:inline-block; transition:transform .15s; }
  h1.title span:hover{ animation:wiggle .4s ease; }
  @keyframes wiggle{
    0%{transform:rotate(0) translateY(0)}
    25%{transform:rotate(-9deg) translateY(-4px)}
    55%{transform:rotate(8deg) translateY(-2px)}
    80%{transform:rotate(-4deg) translateY(-3px)}
    100%{transform:rotate(0) translateY(0)}
  }
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-left:auto; }
  #spellForm{ display:flex; gap:8px; }
  #wordInput{
    font:inherit; font-weight:800; letter-spacing:2px;
    width:clamp(130px, 20vw, 210px);
    padding:9px 14px; border:3px solid var(--brown); border-radius:12px;
    background:var(--cream); color:var(--brown);
    box-shadow:0 4px 0 var(--brown), inset 0 2px 4px rgba(74,51,35,.18);
    text-transform:uppercase; outline:none;
  }
  #wordInput::placeholder{ text-transform:none; letter-spacing:0; color:#b79a76; font-weight:700; }
  #wordInput:focus{ background:#fffdf4; }
  button.btn{
    font:inherit; font-weight:800; font-size:15px;
    padding:10px 16px 9px; border:3px solid var(--brown); border-radius:12px;
    background:linear-gradient(180deg, #f6d9a0, #eac07d);
    color:var(--brown); cursor:pointer;
    box-shadow:0 4px 0 var(--brown);
    transition:transform .06s, box-shadow .06s;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  button.btn:hover{ filter:brightness(1.05); }
  button.btn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--brown); }
  button.btn.go{ background:linear-gradient(180deg, #8fd0a0, #63ad70); }
  button.btn.shake{ background:linear-gradient(180deg, #f2a08f, #e85c4e); color:#fff8e8; text-shadow:0 1px 2px rgba(90,20,10,.4); }
  button.btn.tidy{ background:linear-gradient(180deg, #a8c8ef, #4a86d6); color:#fff8e8; text-shadow:0 1px 2px rgba(10,35,80,.4); }
  .hint{ font-size:12px; font-weight:700; color:#9c7b52; letter-spacing:.4px; flex-basis:100%; }
  kbd{
    font-family:inherit; background:#fff3da; border:1.5px solid #cfae7d; border-bottom-width:3px;
    border-radius:6px; padding:0 6px; font-size:11px; color:#7a5a33;
  }

  /* ---------- Blocks ---------- */
  #blocks{ position:absolute; inset:0; }
  .block{
    position:absolute; left:0; top:0; width:var(--s); height:var(--s);
    will-change:transform;
    perspective:1100px;
    filter:drop-shadow(0 calc(var(--s)*.09) calc(var(--s)*.08) rgba(122,75,38,.38));
    transition:opacity .45s ease;
  }
  .block.gone{ opacity:0; }
  .cube{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
  }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    background:
      repeating-linear-gradient(48deg, rgba(150,95,40,.10) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(-32deg, rgba(150,95,40,.06) 0 1px, transparent 1px 13px),
      linear-gradient(160deg, #ecc48d, #d9a86c);
    background-color:#e3b77f;
    box-shadow:
      inset 0 0 0 1px rgba(255,240,210,.5),
      inset 3px 3px 5px rgba(255,245,220,.65),
      inset -4px -4px 7px rgba(120,70,25,.30);
  }
  .f-front { transform:translateZ(calc(var(--s)/2)); }
  .f-back  { transform:rotateY(180deg) translateZ(calc(var(--s)/2)); filter:brightness(.9); }
  .f-right { transform:rotateY(90deg)  translateZ(calc(var(--s)/2)); filter:brightness(.82); }
  .f-left  { transform:rotateY(-90deg) translateZ(calc(var(--s)/2)); filter:brightness(.86); }
  .f-top   { transform:rotateX(90deg)  translateZ(calc(var(--s)/2)); filter:brightness(1.14); }
  .f-bottom{ transform:rotateX(-90deg) translateZ(calc(var(--s)/2)); filter:brightness(.7); }

  .paint{
    position:absolute; inset:11%;
    border-radius:14%;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.28), inset 0 -2px 3px rgba(255,255,255,.25), 0 1px 0 rgba(255,250,235,.4);
    display:flex; align-items:center; justify-content:center;
    background-size:cover;
  }
  .paint.c0{ background:linear-gradient(158deg, var(--red-a), var(--red-b));
             clip-path:polygon(0 0, calc(100% - 15%) 0, 100% 15%, 100% 100%, 0 100%); }
  .paint.c1{ background:linear-gradient(158deg, var(--blue-a), var(--blue-b));
             clip-path:polygon(0 13%, 14% 0, 100% 0, 100% 100%, 0 100%); }
  .paint.c2{ background:linear-gradient(158deg, var(--yellow-a), var(--yellow-b));
             clip-path:polygon(0 0, 100% 0, 100% 100%, 14% 100%, 0 calc(100% - 13%)); }
  .paint.c3{ background:linear-gradient(158deg, var(--green-a), var(--green-b));
             clip-path:polygon(0 0, 100% 0, 100% calc(100% - 14%), calc(100% - 14%) 100%, 0 100%); }
  .paint::before{ /* worn spot */
    content:""; position:absolute; right:16%; bottom:18%; width:22%; height:20%;
    border-radius:50%; background:radial-gradient(closest-side, rgba(227,183,127,.85), rgba(227,183,127,.35) 65%, transparent);
    transform:rotate(-14deg) scale(1.1,.85);
  }
  .paint b{
    font-weight:800; color:var(--cream);
    font-size:calc(var(--s)*.5); line-height:1;
    text-shadow:0 calc(var(--s)*.03) calc(var(--s)*.04) rgba(0,0,0,.30);
    transform:translateY(-4%);
  }
  .block.grabbed{ filter:drop-shadow(0 calc(var(--s)*.16) calc(var(--s)*.14) rgba(122,75,38,.45)) brightness(1.06); }

  /* ---------- Toast ---------- */
  #toast{
    position:absolute; top:clamp(66px, 13vh, 110px); left:50%;
    transform:translate(-50%,-8px); z-index:60;
    background:rgba(74,51,35,.92); color:var(--cream);
    font-weight:800; font-size:15px; letter-spacing:.4px;
    padding:10px 20px; border-radius:999px;
    box-shadow:0 6px 16px rgba(74,51,35,.35);
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:640px){
    header{ gap:8px 12px; }
    .controls{ margin-left:0; width:100%; }
    button.btn{ font-size:13px; padding:8px 12px 7px; }
    .hint{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    h1.title span:hover{ animation:none; }
    .block{ transition:opacity .2s; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="peach-glow"></div>
  <div class="light-beam"></div>
  <div class="light-beam b2"></div>
  <div class="rug"></div>
  <div class="desk"></div>
  <div id="blocks"></div>
</div>

<header>
  <h1 class="title" id="title" aria-label="Wooden Alphabet Blocks"></h1>
  <div class="controls">
    <form id="spellForm">
      <input id="wordInput" type="text" maxlength="12" placeholder="spell a word…" autocomplete="off" spellcheck="false" aria-label="spell a word">
      <button class="btn go" type="submit">Spell it!</button>
    </form>
    <button class="btn" id="addBtn" type="button">+ Block</button>
    <button class="btn shake" id="shakeBtn" type="button">Shake table</button>
    <button class="btn tidy" id="tidyBtn" type="button">Tidy up</button>
  </div>
  <p class="hint">Drag a block to move it, fling it to toss it. <kbd>Space</kbd> shakes the table.</p>
</header>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage   = document.getElementById("stage");
  const layer   = document.getElementById("blocks");
  const toastEl = document.getElementById("toast");

  /* ----- title with individually coloured, wiggling letters ----- */
  const TITLE = "Wooden Alphabet Blocks";
  const TITLE_COLORS = ["#c33b30", "#2a5fa8", "#e0ad1a", "#3f8a4d", "#c33b30", "#2a5fa8", "#e0ad1a", "#3f8a4d"];
  const h1 = document.getElementById("title");
  let ci = 0;
  for (const ch of TITLE) {
    if (ch === " ") { h1.append(document.createTextNode("\u00A0")); continue; }
    const s = document.createElement("span");
    s.textContent = ch;
    s.style.color = TITLE_COLORS[ci % TITLE_COLORS.length]; ci++;
    h1.append(s);
  }

  /* ----- layout metrics ----- */
  let W = 0, H = 0, size = 90, floorY = 0;
  function measure() {
    W = innerWidth; H = innerHeight;
    const deskH = Math.max(52, H * 0.09);
    floorY = H - deskH;
    size = Math.max(60, Math.min(122, Math.round(Math.min(W, H) * 0.105)));
    if (W <= 380) size = 60;
    for (const b of blocks) {
      b.s = size; b.el.style.setProperty("--s", size + "px");
      b.x = Math.min(Math.max(b.x, size / 2), W - size / 2);
      b.y = Math.min(b.y, floorY - size / 2);
    }
  }

  /* ----- blocks ----- */
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const blocks = [];
  const MAX_BLOCKS = 90;
  let colorCursor = Math.floor(Math.random() * 4);
  let idc = 0;

  function makeBlock(letter, x, y, vx = 0, vy = 0) {
    if (blocks.length >= MAX_BLOCKS) { const old = blocks.shift(); removeEl(old); }
    const el = document.createElement("div");
    el.className = "block";
    el.style.setProperty("--s", size + "px");
    const cube = document.createElement("div");
    cube.className = "cube";
    const tiltX = 12 + Math.random() * 10;            // 12–22°
    const tiltY = (Math.random() < 0.5 ? -1 : 1) * (10 + Math.random() * 4); // ±14°
    cube.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    const cIdx = colorCursor % 4; colorCursor++;
    for (const [face, cls] of [["", "f-front"], ["", "f-back"], ["", "f-right"], ["", "f-left"], ["", "f-top"], ["", "f-bottom"]]) {
      const f = document.createElement("div");
      f.className = "face " + cls;
      if (cls === "f-front") {
        const p = document.createElement("i");
        p.className = "paint c" + cIdx;
        const b = document.createElement("b");
        b.textContent = letter;
        p.append(b); f.append(p);
      }
      cube.append(f);
    }
    el.append(cube);
    layer.append(el);
    const b = {
      id: ++idc, letter, el, s: size,
      x, y, vx, vy,
      a: 0, av: 0,                       // visual tilt angle (wobble), angular vel
      tiltX, tiltY, cIdx,
      drag: false, restTimer: 0,
    };
    el.dataset.id = b.id;
    blocks.push(b);
    return b;
  }
  function removeEl(b){ b.el.remove(); }

  /* ----- physics constants ----- */
  const GRAV = 2200, REST = 0.32, FLOOR_FRICTION = 0.72, WALL_REST = 0.45;
  const SPRING = 26, ANG_DAMP = 4.2;

  function integrate(dt) {
    const half = size / 2;
    for (const b of blocks) {
      if (b.drag || b.dead) continue;
      b.vy += GRAV * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      // floor (desk top)
      if (b.y + half > floorY) {
        b.y = floorY - half;
        if (Math.abs(b.vy) > 120) b.av += (b.vx > 0 ? 1 : -1) * Math.min(b.vy * 0.010, 3.2) + (Math.random() - 0.5);
        b.vy = b.vy > 140 ? -b.vy * REST : 0;
        b.vx *= FLOOR_FRICTION;
      }
      // walls
      if (b.x - half < 0)  { b.x = half;      if (b.vx < 0) { b.vx = -b.vx * WALL_REST; b.av += Math.abs(b.vx) * 0.004; } }
      if (b.x + half > W)  { b.x = W - half;  if (b.vx > 0) { b.vx = -b.vx * WALL_REST; b.av -= Math.abs(b.vx) * 0.004; } }
      if (b.y - half < -H * 2) b.y = -H * 2;
      // upright spring → wobble & settle
      b.av += (-SPRING * b.a - ANG_DAMP * b.av) * dt;
      b.a  += b.av * dt;
      // air drag on horizontal slide
      b.vx *= (1 - 0.25 * dt);
    }
  }

  function collide() {
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < blocks.length; i++) {
        const a = blocks[i]; if (a.dead) continue;
        for (let j = i + 1; j < blocks.length; j++) {
          const c = blocks[j]; if (c.dead) continue;
          const dx = (a.s + c.s) / 2 - Math.abs(a.x - c.x);
          if (dx <= 0) continue;
          const dy = (a.s + c.s) / 2 - Math.abs(a.y - c.y);
          if (dy <= 0) continue;
          const aFixed = a.drag, cFixed = c.drag;
          if (dx < dy) {                       // separate along smaller overlap axis (x)
            const sgn = a.x <= c.x ? 1 : -1;
            const share = aFixed || cFixed ? dx : dx / 2;
            if (!aFixed) a.x -= sgn * (cFixed ? dx : share);
            if (!cFixed) c.x += sgn * (aFixed ? dx : share);
            const rel = a.vx - c.vx;
            if (rel * sgn > 0) {
              const imp = rel * sgn;
              if (!aFixed) { a.vx -= sgn * imp * (1 + REST) * (cFixed ? 1 : 0.5); a.av += (Math.random() - 0.5) * Math.min(imp * 0.006, 2); }
              if (!cFixed) { c.vx += sgn * imp * (1 + REST) * (aFixed ? 1 : 0.5); c.av -= (Math.random() - 0.5) * Math.min(imp * 0.006, 2); }
            }
          } else {                             // separate vertically
            const top = a.y <= c.y ? a : c, bot = a.y <= c.y ? c : a;
            if (!top.drag)    top.y -= dy * (bot.drag ? 1 : 0.5);
            if (!bot.drag)    bot.y += dy * (top.drag ? 1 : 0.5);
            const rel = bot.vy - top.vy;
            if (rel < -140) {                  // landing impact
              top.av += (Math.random() - 0.5) * Math.min(-rel * 0.008, 3);
              bot.av += (Math.random() - 0.5) * Math.min(-rel * 0.006, 2);
            }
            if (top === a && !top.drag) top.vy = Math.min(top.vy, bot.drag ? -top.vy * REST * 0.5 : (bot.vy + top.vy) / 2 - (bot.vy - top.vy) * REST / 2);
            if (!top.drag && top.vy > bot.vy) top.vy = bot.vy;
            if (!bot.drag && bot.vy < top.vy && bot.vy < 0) bot.vy = top.vy * REST;
          }
        }
      }
    }
  }

  function render() {
    for (const b of blocks) {
      if (b.dead) continue;
      const half = b.s / 2;
      const depth = Math.max(0, Math.min(1, (b.y + half) / (floorY + 1)));
      const sc = 0.88 + 0.16 * depth;          // lower → slightly larger
      b.el.style.transform =
        `translate3d(${(b.x - half).toFixed(1)}px, ${(b.y - half).toFixed(1)}px, 0) scale(${sc.toFixed(3)})`;
      b.el.children[0].style.transform =
        `rotateX(${b.tiltX}deg) rotateY(${b.tiltY}deg) rotateZ(${(b.a * 57.3).toFixed(2)}deg)`;
      b.el.style.zIndex = 10 + Math.round(b.y);
    }
  }

  /* ----- main loop ----- */
  let last = performance.now();
  function tick(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    integrate(dt);
    collide();
    render();
    requestAnimationFrame(tick);
  }

  /* ----- dragging / tossing ----- */
  const pointers = new Map();
  layer.addEventListener("pointerdown", e => {
    const el = e.target.closest(".block"); if (!el) return;
    const b = blocks.find(x => x.id == el.dataset.id); if (!b || b.dead) return;
    b.drag = true; b.grabT = performance.now();
    b.gOffX = b.x - e.clientX; b.gOffY = b.y - e.clientY;
    pointers.set(e.pointerId, { b, hist: [[performance.now(), e.clientX, e.clientY]] });
    el.setPointerCapture(e.pointerId);
    el.classList.add("grabbed");
    e.preventDefault();
  });
  window.addEventListener("pointermove", e => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const b = p.b;
    b.x = e.clientX + b.gOffX; b.y = e.clientY + b.gOffY;
    const half = b.s / 2;
    b.x = Math.min(Math.max(b.x, half), W - half);
    b.y = Math.min(Math.max(b.y, half), floorY - half);
    b.vx = 0; b.vy = 0;
    p.hist.push([performance.now(), e.clientX, e.clientY]);
    if (p.hist.length > 6) p.hist.shift();
  });
  function endDrag(e) {
    const p = pointers.get(e.pointerId); if (!p) return;
    pointers.delete(e.pointerId);
    const b = p.b; b.drag = false; b.el.classList.remove("grabbed");
    const t0 = performance.now();
    const old = p.hist.find(h => t0 - h[0] < 120) || p.hist[0];
    const lastH = p.hist[p.hist.length - 1];
    const span = Math.max(16, lastH[0] - old[0]);
    b.vx = Math.max(-2200, Math.min(2200, (lastH[1] - old[1]) / span * 1000));
    b.vy = Math.max(-2400, Math.min(2400, (lastH[2] - old[2]) / span * 1000));
    b.av += (Math.random() - 0.5) * 2 + b.vx * 0.001;
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  /* ----- actions ----- */
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1900);
  }

  const spellInput = document.getElementById("wordInput");
  spellInput.addEventListener("input", () => {
    spellInput.value = spellInput.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 12);
  });
  document.getElementById("spellForm").addEventListener("submit", e => {
    e.preventDefault();
    const word = spellInput.value.slice(0, 12);
    if (!word) { toast("Type a word first, then spell it!"); return; }
    const n = word.length;
    word.split("").forEach((ch, i) => {
      const delay = REDUCED ? 0 : i * 110;
      setTimeout(() => {
        const x = W / 2 + (i - (n - 1) / 2) * size * 1.06;
        const y = -size * (1.5 + (n - i) * 0.9);
        makeBlock(ch, Math.min(Math.max(x, size / 2), W - size / 2), y, 0, 240);
      }, delay);
    });
    toast(`Spelling “${word}” — watch them land!`);
    spellInput.value = "";
  });

  document.getElementById("addBtn").addEventListener("click", () => {
    const ch = LETTERS[Math.floor(Math.random() * 26)];
    makeBlock(ch, size / 2 + Math.random() * (W - size), -size, (Math.random() - 0.5) * 200, 150);
    toast(`A fresh “${ch}” block tumbles in!`);
  });

  function shakeTable() {
    for (const b of blocks) {
      if (b.drag) continue;
      b.vy -= 520 + Math.random() * 950;
      b.vx += (Math.random() - 0.5) * 760;
      b.av += (Math.random() - 0.5) * 7;
    }
    if (!REDUCED) {
      stage.animate(
        [
          { transform: "translate(0,0)" },
          { transform: "translate(-7px,5px)" },
          { transform: "translate(8px,-7px)" },
          { transform: "translate(-6px,6px)" },
          { transform: "translate(5px,-4px)" },
          { transform: "translate(0,0)" },
        ],
        { duration: 420, easing: "ease-in-out" }
      );
    }
    toast("Shake, rattle & tumble!");
  }
  document.getElementById("shakeBtn").addEventListener("click", shakeTable);
  window.addEventListener("keydown", e => {
    if (e.code === "Space" && document.activeElement !== spellInput) { e.preventDefault(); shakeTable(); }
  });

  document.getElementById("tidyBtn").addEventListener("click", () => {
    if (!blocks.length) { toast("Already tidy — nothing to pick up!"); return; }
    blocks.forEach((b, i) => { b.dead = true; b.el.classList.add("gone"); setTimeout(() => removeEl(b), REDUCED ? 220 : 460 + i * 20); });
    blocks.length = 0;
    toast("All blocks tucked away. Good job!");
  });

  /* ----- boot ----- */
  addEventListener("resize", measure);
  measure();
  requestAnimationFrame(tick);
  // starter tower: stack a few blocks + random scatter
  "PLAY".split("").forEach((ch, i) => {
    setTimeout(() => makeBlock(ch, W / 2, -size * (2 + i * 2), 0, 200), REDUCED ? 0 : 220 + i * 130);
  });
  setTimeout(() => {
    for (let i = 0; i < 3; i++)
      makeBlock(LETTERS[Math.floor(Math.random() * 26)], size + Math.random() * (W - 2 * size), -size * (3 + i), 0, 260);
  }, REDUCED ? 60 : 800);
})();
</script>
</body>
</html>
