<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Castellane Photograph — Typewriter Noir</title>
<style>
  :root{
    --bg:#050505;
    --ink:#17161a;
    --paper:#d9d5cc;
    --ui:#cfcbc3;
    --amber:#ffb648;
    --lh:28px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ui);
    font-family:ui-monospace,"Courier New",Courier,monospace;
    overflow:hidden;
    position:relative;
  }
  button{font:inherit;background:none;border:none;color:inherit;cursor:pointer;}

  /* ============ THE ROOM (pure CSS) ============ */
  .room{position:fixed;inset:0;pointer-events:none;overflow:hidden;}

  /* hanging lamp, upper right */
  .lamp{position:absolute;top:0;right:9%;width:200px;height:190px;}
  .lamp .cord{position:absolute;left:50%;top:0;width:2px;height:74px;background:linear-gradient(#000,#1c1b1d);}
  .lamp .shade{
    position:absolute;left:0;top:72px;width:200px;height:88px;
    background:#141317;
    clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);
    border-bottom:0;
  }
  .lamp .shade::after{ /* amber underline */
    content:"";position:absolute;left:-1px;right:-1px;bottom:-3px;height:5px;
    background:linear-gradient(90deg,transparent,var(--amber) 18%,#ffd28a 50%,var(--amber) 82%,transparent);
    filter:blur(1px);
  }
  .lamp .bulb{
    position:absolute;left:50%;top:150px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#fff3d8,var(--amber) 55%,rgba(255,182,72,0) 78%);
    filter:blur(4px);
  }
  /* huge soft amber pool over the desk */
  .pool{
    position:absolute;top:-14%;right:-38%;width:130vmax;height:120vmax;
    background:radial-gradient(closest-side,rgba(255,182,72,.16),rgba(255,166,52,.075) 42%,rgba(255,150,40,.02) 68%,transparent 76%);
    mix-blend-mode:screen;
    animation:flicker 7.5s linear infinite;
  }
  @keyframes flicker{
    0%,7.9%,8.6%,11%,49.9%,50.5%,58%,91.9%,92.5%,100%{opacity:1;}
    8%,8.4%{opacity:.55;} 8.5%{opacity:.85;}
    50%,50.3%{opacity:.62;}
    92%,92.3%{opacity:.42;} 92.4%{opacity:.8;}
  }

  /* rain-streaked window, upper left */
  .window{
    position:absolute;left:5%;top:6%;width:min(24vw,290px);aspect-ratio:3/4.2;
    background:#0b0b0f;border:3px solid #19181c;border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.9),inset 0 0 60px rgba(0,0,0,.8);
    overflow:hidden;
  }
  .window .sky{
    position:absolute;inset:0;
    background:linear-gradient(to bottom,#13151f 0%,#181a24 55%,#0d0e14 100%);
  }
  .window .skyline{
    position:absolute;left:0;right:0;bottom:0;height:58%;
    background:
      linear-gradient(#0a0a0e,#0a0a0e) 4% 100%/9% 62% no-repeat,
      linear-gradient(#0c0c10,#0c0c10) 15% 100%/11% 88% no-repeat,
      linear-gradient(#0a0a0e,#0a0a0e) 28% 100%/8% 46% no-repeat,
      linear-gradient(#0c0c10,#0c0c10) 38% 100%/13% 74% no-repeat,
      linear-gradient(#0a0a0e,#0a0a0e) 53% 100%/9% 96% no-repeat,
      linear-gradient(#0c0c10,#0c0c10) 64% 100%/12% 58% no-repeat,
      linear-gradient(#0a0a0e,#0a0a0e) 78% 100%/10% 80% no-repeat,
      linear-gradient(#0c0c10,#0c0c10) 90% 100%/8% 52% no-repeat;
  }
  .window .lights{
    position:absolute;inset:0;
    background:
      radial-gradient(1.5px 1.5px at 18% 30%,rgba(255,190,90,.95),transparent 60%),
      radial-gradient(1.5px 1.5px at 19% 46%,rgba(255,190,90,.7),transparent 60%),
      radial-gradient(1.5px 1.5px at 42% 40%,rgba(255,190,90,.85),transparent 60%),
      radial-gradient(1.5px 1.5px at 56% 18%,rgba(255,190,90,.8),transparent 60%),
      radial-gradient(1.5px 1.5px at 57% 52%,rgba(255,190,90,.6),transparent 60%),
      radial-gradient(1.5px 1.5px at 82% 34%,rgba(255,190,90,.75),transparent 60%);
    filter:blur(.4px);
  }
  .window .rain, .window .rain2{
    position:absolute;inset:-30% -10%;
    background-image:repeating-linear-gradient(104deg,
      transparent 0 22px, rgba(196,205,222,.10) 22px 23.5px, transparent 23.5px 46px,
      rgba(196,205,222,.16) 46px 47.5px, transparent 47.5px 78px);
    filter:blur(.4px);
    animation:rainfall 1.1s linear infinite;
  }
  .window .rain2{
    background-image:repeating-linear-gradient(98deg,
      transparent 0 14px, rgba(210,218,235,.09) 14px 15px, transparent 15px 40px,
      rgba(210,218,235,.13) 40px 41px, transparent 41px 63px);
    animation:rainfall .8s linear infinite;
    background-position-x:9px;
  }
  @keyframes rainfall{from{transform:translateY(0)}to{transform:translateY(46px)}}
  .window .drips i{
    position:absolute;top:-8%;width:3px;height:9px;border-radius:50%;
    background:radial-gradient(ellipse 3px 5px at 50% 50%,rgba(214,222,238,.4),rgba(214,222,238,.06) 70%,transparent);
    animation:drip 7s linear infinite;
  }
  .window .drips i:nth-child(1){left:14%;animation-delay:0s;}
  .window .drips i:nth-child(2){left:33%;animation-duration:8.6s;animation-delay:-3s;}
  .window .drips i:nth-child(3){left:52%;animation-duration:7.8s;animation-delay:-5.2s;}
  .window .drips i:nth-child(4){left:69%;animation-duration:9.4s;animation-delay:-1.4s;}
  .window .drips i:nth-child(5){left:86%;animation-duration:8.1s;animation-delay:-6.3s;}
  @keyframes drip{0%{transform:translateY(-10%);opacity:0}8%{opacity:.9}88%{opacity:.7}100%{transform:translateY(940%);opacity:0}}
  .window .mullion-v{position:absolute;left:50%;top:0;bottom:0;width:9px;margin-left:-4.5px;background:#141317;box-shadow:0 0 8px rgba(0,0,0,.8);}
  .window .mullion-h{position:absolute;top:48%;left:0;right:0;height:9px;margin-top:-4.5px;background:#141317;box-shadow:0 0 8px rgba(0,0,0,.8);}
  .window .glass-tint{position:absolute;inset:0;background:linear-gradient(115deg,rgba(120,140,170,.07),transparent 40%);}

  /* perspective-tilted desk */
  .desk{
    position:absolute;left:-30%;right:-30%;bottom:-34%;height:88%;
    transform:perspective(900px) rotateX(58deg);
    transform-origin:top center;
    background:
      repeating-linear-gradient(91deg, rgba(0,0,0,.34) 0 2px, transparent 2px 58px),
      repeating-linear-gradient(90deg, #14100c 0 90px, #100d0a 90px 172px, #13100c 172px 260px),
      linear-gradient(#171310,#0c0a08);
    border-top:2px solid #221c16;
    box-shadow:0 -30px 90px rgba(0,0,0,.9);
  }
  /* venetian-blind light bars */
  .blinds{
    position:absolute;left:-10%;top:12%;width:120%;height:70%;
    background:repeating-linear-gradient(to bottom, rgba(255,182,72,.10) 0 26px, transparent 26px 64px);
    transform:skewX(-14deg) rotate(-3deg);
    mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(120% 90% at 72% 30%, #000 24%, rgba(0,0,0,.5) 55%, transparent 78%);
    mask-image:radial-gradient(120% 90% at 72% 30%, #000 24%, rgba(0,0,0,.5) 55%, transparent 78%);
  }

  /* ashtray + cigarette + smoke */
  .ashtray{position:absolute;left:11%;bottom:19%;width:118px;height:44px;}
  .ashtray .dish{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(ellipse at 50% 38%,#2a292c,#141316 70%);
    box-shadow:0 8px 18px rgba(0,0,0,.85),inset 0 2px 4px rgba(190,180,160,.08);
  }
  .ashtray .stick{
    position:absolute;left:34px;top:16px;width:74px;height:6px;border-radius:3px;
    background:linear-gradient(#efe9dc,#c9c2b2);
    transform:rotate(-7deg);
    box-shadow:0 2px 4px rgba(0,0,0,.7);
  }
  .ashtray .ember{
    position:absolute;left:104px;top:13px;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#ffd9a0,#ff7f2e 45%,#a02103 80%);
    animation:ember 3.4s ease-in-out infinite;
  }
  @keyframes ember{0%,100%{box-shadow:0 0 6px 1px rgba(255,120,40,.5);filter:brightness(1)}50%{box-shadow:0 0 14px 4px rgba(255,140,50,.85);filter:brightness(1.35)}}
  .smoke{position:absolute;left:110px;bottom:26px;width:0;height:0;}
  .smoke i{
    position:absolute;left:0;bottom:0;width:34px;height:34px;border-radius:50%;margin-left:-17px;
    background:radial-gradient(circle,rgba(196,192,184,.11),rgba(196,192,184,.03) 55%,transparent 72%);
    filter:blur(6px);
    animation:smokeRise 7s ease-in-out infinite;
    opacity:0;
  }
  .smoke i:nth-child(1){animation-duration:6.2s;animation-delay:0s;}
  .smoke i:nth-child(2){animation-duration:7.6s;animation-delay:-1.5s;}
  .smoke i:nth-child(3){animation-duration:6.8s;animation-delay:-3.1s;}
  .smoke i:nth-child(4){animation-duration:7.2s;animation-delay:-4.6s;}
  .smoke i:nth-child(5){animation-duration:6.5s;animation-delay:-5.8s;}
  @keyframes smokeRise{
    0%{transform:translate(0,0) scale(.4);opacity:0}
    12%{opacity:.85}
    40%{transform:translate(-18px,-120px) scale(1.3)}
    68%{transform:translate(16px,-235px) scale(2.1)}
    100%{transform:translate(-12px,-340px) scale(3);opacity:0}
  }

  /* ============ TITLE CARD (top right) ============ */
  .title-card{
    position:fixed;top:24px;right:30px;text-align:right;z-index:5;pointer-events:none;
  }
  .title-card .t{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;
    font-size:clamp(16px,2vw,22px);color:var(--ui);letter-spacing:.04em;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
  }
  .title-card .s{
    margin-top:4px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#8b877f;
  }

  /* ============ TYPEWRITER STAGE ============ */
  .stage{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:4;padding:0 14px 64px;
  }
  .paper-frame{width:min(720px,94vw);}
  .sheet-window{
    position:relative;height:min(46vh,430px);overflow:hidden;
    background:var(--paper);
    border-radius:2px 2px 0 0;
    box-shadow:0 24px 60px rgba(0,0,0,.85),0 4px 14px rgba(0,0,0,.7);
    cursor:pointer;
  }
  .sheet{
    position:absolute;left:0;right:0;top:0;
    padding:34px clamp(18px,4vw,44px) 20px;
    transition:transform 180ms cubic-bezier(.3,1.4,.4,1);
    will-change:transform;
    /* ruled paper: faint 28px lines */
    background-image:repeating-linear-gradient(to bottom, transparent 0 27px, rgba(23,22,26,.07) 27px 28px);
    background-position:0 42px;
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 82%,rgba(0,0,0,.35) 95%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 0,#000 82%,rgba(0,0,0,.35) 95%,transparent 100%);
  }
  .sheet-window::before{ /* platen shadow where paper emerges */
    content:"";position:absolute;left:0;right:0;top:0;height:34px;z-index:3;pointer-events:none;
    background:linear-gradient(to bottom,rgba(10,9,8,.55),rgba(10,9,8,.18) 55%,transparent);
  }
  .jolt{animation:jolt 90ms linear;}
  @keyframes jolt{0%{transform:translateX(0)}40%{transform:translateX(-7px)}100%{transform:translateX(0)}}

  #story{
    color:var(--ink);
    font-size:clamp(13px,1.9vw,16px);
    line-height:var(--lh);
    letter-spacing:.005em;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #story .ch{display:inline;position:relative;}
  #story .ch.sticky{animation:stickyKey 200ms ease-out;}
  @keyframes stickyKey{0%{filter:blur(2px);transform:translateY(-5px);opacity:.4}100%{filter:none;transform:translateY(0);opacity:1}}
  #cursor{
    display:inline-block;width:.62em;height:1.05em;vertical-align:text-bottom;margin-left:1px;
    background:var(--ink);
    animation:blink 1.06s steps(2,start) infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  .platen{
    height:26px;border-radius:14px;margin-top:-2px;
    background:linear-gradient(#2c2a2e,#16151a 60%,#0b0a0d);
    box-shadow:0 12px 26px rgba(0,0,0,.9),inset 0 1px 0 rgba(220,210,190,.1);
  }

  /* choices as typewriter keys */
  .choices{
    display:flex;gap:clamp(20px,5vw,56px);margin-top:26px;min-height:120px;
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .45s ease,transform .45s ease;
    align-items:flex-start;justify-content:center;flex-wrap:wrap;
  }
  .choices.show{opacity:1;transform:none;pointer-events:auto;}
  .choice{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:300px;}
  .keycap{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#33323a,#1b1a1f 70%);
    border:1px solid #45434b;
    box-shadow:0 6px 0 #08070a,0 10px 22px rgba(0,0,0,.8),inset 0 2px 3px rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .12s ease,transform .12s ease,border-color .2s ease;
  }
  .keycap span{
    font-family:Georgia,"Times New Roman",serif;font-size:26px;color:#d9d5cc;
    text-shadow:0 1px 2px #000;
  }
  .choice:hover .keycap,.choice:focus-visible .keycap{
    border-color:var(--amber);
    box-shadow:0 6px 0 #08070a,0 10px 22px rgba(0,0,0,.8),0 0 18px rgba(255,182,72,.45),inset 0 0 10px rgba(255,182,72,.18);
  }
  .choice.pressed .keycap,.choice:active .keycap{transform:translateY(5px);box-shadow:0 1px 0 #08070a,0 4px 10px rgba(0,0,0,.8),0 0 18px rgba(255,182,72,.45);}
  .klabel{
    font-size:12.5px;line-height:1.5;color:var(--ui);text-align:center;letter-spacing:.03em;
    text-shadow:0 2px 6px rgba(0,0,0,.9);
  }
  .klabel b{color:var(--amber);font-weight:400;}
  .fin{font-family:Georgia,serif;font-style:italic;color:var(--amber);font-size:15px;letter-spacing:.2em;margin-top:34px;opacity:0;transition:opacity .8s ease;}
  .fin.show{opacity:.9;}

  /* ============ BOTTOM BAR ============ */
  .bar{
    position:fixed;left:0;right:0;bottom:0;height:44px;z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 20px;
    background:linear-gradient(to top,rgba(5,5,5,.95),rgba(5,5,5,.6));
    border-top:1px solid rgba(207,203,195,.12);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  }
  .bar .chapter{color:var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar .chapter em{color:var(--amber);font-style:normal;}
  .bar .hints{color:#7d7972;white-space:nowrap;}
  .bar .hints kbd{font:inherit;color:var(--ui);border:1px solid rgba(207,203,195,.25);border-radius:3px;padding:1px 5px;margin:0 2px;}
  .bar .restart{
    color:var(--ui);border:1px solid rgba(207,203,195,.3);border-radius:3px;padding:6px 12px;
    letter-spacing:.14em;transition:all .2s ease;
  }
  .bar .restart:hover{border-color:var(--amber);color:var(--amber);box-shadow:0 0 12px rgba(255,182,72,.25);}

  /* ============ VIGNETTE + GRAIN ============ */
  .vignette{
    position:fixed;inset:0;z-index:8;pointer-events:none;
    background:radial-gradient(78% 66% at 50% 46%,transparent 42%,rgba(0,0,0,.55) 74%,rgba(0,0,0,.94) 100%);
  }
  .grain{
    position:fixed;left:-50%;top:-50%;width:200%;height:200%;z-index:9;pointer-events:none;
    opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23g)'/></svg>");
    animation:grain .9s steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0) rotate(0deg)}
    16.66%{transform:translate(-14px,9px) rotate(.35deg)}
    33.33%{transform:translate(11px,-13px) rotate(-.3deg)}
    50%{transform:translate(-9px,-8px) rotate(.42deg)}
    66.66%{transform:translate(15px,6px) rotate(-.28deg)}
    83.33%{transform:translate(-6px,14px) rotate(.3deg)}
    100%{transform:translate(0,0) rotate(0deg)}
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:700px){
    .window{width:150px;top:4%;left:4%;}
    .ashtray,.smoke{display:none;}
    .lamp{right:4%;transform:scale(.8);transform-origin:top right;}
    .keycap{width:52px;height:52px;}
    .keycap span{font-size:22px;}
    .klabel{font-size:11px;}
    .bar .hints{display:none;}
    .title-card{right:16px;top:16px;}
    .sheet-window{height:min(44vh,360px);}
  }
  @media (min-width:2200px){
    .sheet-window{height:52vh;}
    #story{font-size:19px;}
    .title-card{right:56px;top:36px;}
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion:reduce){
    .grain{animation:none;}
    .window .rain,.window .rain2,.window .drips i{animation:none;}
    .pool{animation:none;}
    .smoke i{animation:none;display:none;}
    #cursor{animation:none;}
    .sheet{transition:none;}
    .jolt{animation:none;}
    #story .ch.sticky{animation:none;}
    .ashtray .ember{animation:none;}
  }
</style>
</head>
<body>

  <!-- the room -->
  <div class="room" aria-hidden="true">
    <div class="pool"></div>
    <div class="window">
      <div class="sky"></div>
      <div class="skyline"></div>
      <div class="lights"></div>
      <div class="rain"></div>
      <div class="rain2"></div>
      <div class="drips"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="mullion-v"></div>
      <div class="mullion-h"></div>
      <div class="glass-tint"></div>
    </div>
    <div class="lamp"><div class="cord"></div><div class="shade"></div><div class="bulb"></div></div>
    <div class="desk"></div>
    <div class="blinds"></div>
    <div class="ashtray">
      <div class="dish"></div><div class="stick"></div><div class="ember"></div>
    </div>
    <div class="smoke"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="title-card">
    <div class="t">The Castellane Photograph</div>
    <div class="s">a case of rain &amp; ink</div>
  </div>

  <!-- the typewriter -->
  <main class="stage">
    <div class="paper-frame">
      <div class="sheet-window" id="sheetWin" title="Click to finish the line">
        <div class="sheet" id="sheet"><span id="story"></span><span id="cursor" aria-hidden="true"></span></div>
      </div>
      <div class="platen"></div>
    </div>
    <div class="choices" id="choices" role="group" aria-label="Choices"></div>
    <div class="fin" id="fin">· fin ·</div>
  </main>

  <footer class="bar">
    <div class="chapter" id="chapter">Chapter I</div>
    <div class="hints"><kbd>Space</kbd> skip typing · <kbd>1</kbd> <kbd>2</kbd> choose</div>
    <button class="restart" id="restart">Start Over</button>
  </footer>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

<script>
(() => {
  "use strict";
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= THE STORY — 13 nodes ================= */
  const NODES = {
    intro: {
      chapter: "Chapter I — The Client",
      text:
`At 2:14 a.m. the rain was drumming on the window like it wanted in. I was on my third bourbon and a case nobody wanted when the door opened and she walked the night in with her.

Dark glasses. A coat belted tight enough to hold something in. She set a photograph on my desk the way other people set down a weapon.

The man in the picture was grinning in front of a used-car lot. Danny Castellane. Brother to Vera Castellane, who was now sitting in my client chair and would not take her glasses off.

Danny had been dead eleven months — cooked in the Meridian Cannery fire when the night shift went up. I read about it twice.

"That's a trick of the light," I said.

"Last Tuesday," she said. "He bought coffee at Bickford's Market. Paid cash. Looked straight at me and didn't know my face." She waited for the match. My matchbook was empty, so she used my cigarette. "Find out who he is now, Mr. Vale. And who's paying him to be dead."

The photo was warm, like it had been held a long time. Most dead men don't keep appointments. This one had left an address on the back in pencil. Halloran Hotel. Room 4C.`,
      choices: [
        ["Take the case. Start where the ghost sleeps — the Halloran.", "hotel"],
        ["Trust nobody first. Slip out and tail Vera instead.", "pierChoice"],
      ],
    },

    hotel: {
      chapter: "Chapter II — The Halloran",
      text:
`The Halloran squats six storeys of wet brick on Delancey Street, the kind of house that rents by the hour and forgets by morning. A neon H buzzed over the door, missing everything but its stubbornness.

The night clerk had a face like a stopped clock. "Room 4C," he said, before I said anything. "Don't know who's in it. Don't want no trouble. You're the second one asking this month. First was a lady."

A lady. Vera hadn't mentioned she'd scoped the nest. Either she'd been here before me, or there was somebody else hunting Danny's ghost. I don't care for company.

  /* ================= TYPEWRITER ENGINE ================= */
  const story = document.getElementById("story");
  const cursor = document.getElementById("cursor");
  const sheet = document.getElementById("sheet");
  const sheetWin = document.getElementById("sheetWin");
  const choicesEl = document.getElementById("choices");
  const chapterEl = document.getElementById("chapter");
  const finEl = document.getElementById("fin");

  const SENT_END = new Set([".", "!", "?"]);
  const QUOTES = new Set(['"', "\u201C", "\u201D", "'"]);
  const rnd = (a, b) => a + Math.random() * (b - a);

  let chars = [], idx = 0, timer = null, typing = false;
  let lastHeight = 0, currentNode = null, awaitingChoice = false;
  let prevCh = "";

  function delayFor(ch, prev) {
    let d = rnd(28, 74);
    if (prev === " ") d += 20;
    if (prev === ",") d += 140;
    if (prev && SENT_END.has(prev)) d += 380;
    if (QUOTES.has(ch) || QUOTES.has(prev)) d += 60;
    if (ch === "\n") d += 220;
    return d;
  }

  function emit(c) {
    if (c === "\n") {
      story.appendChild(document.createElement("br"));
      return;
    }
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = c;
    story.appendChild(s);
    const sticky = !REDUCED && Math.random() < 0.035;
    if (sticky) s.classList.add("sticky");
    return sticky;
  }

  function carriageCheck() {
    const h = story.offsetHeight;
    if (h > lastHeight) { // a new line or paragraph appeared
      lastHeight = h;
      snap();
      if (!REDUCED) {
        sheetWin.classList.remove("jolt");
        void sheetWin.offsetWidth;
        sheetWin.classList.add("jolt");
      }
    }
  }

  function snap() {
    const winH = sheetWin.clientHeight;
    const need = story.offsetHeight + 78; // top pad + keep latest line clear of platen
    const off = Math.max(0, need - winH);
    sheet.style.transform = `translateY(${-off}px)`;
  }

  function step() {
    if (idx >= chars.length) { finishTyping(); return; }
    const c = chars[idx++];
    const sticky = emit(c);
    prevCh = c;
    carriageCheck();
    story.appendChild(cursor); // keep the block cursor glued to the last character
    let d = delayFor(chars[idx] || "", c);
    if (sticky) d += rnd(260, 500);
    timer = setTimeout(step, d);
  }

  function type(text) {
    clearTimeout(timer);
    story.textContent = "";
    sheet.style.transform = "translateY(0)";
    lastHeight = 0;
    story.appendChild(cursor);
    chars = text.split("");
    idx = 0; prevCh = "";
    typing = true;
    timer = setTimeout(step, 420);
  }

  function finishTyping() {
    clearTimeout(timer);
    if (typing) {
      typing = false;
      while (idx < chars.length) emit(chars[idx++]);
      story.appendChild(cursor);
      snap();
    }
    showChoices();
  }

  function showChoices() {
    awaitingChoice = false;
    choicesEl.innerHTML = "";
    const n = NODES[currentNode];
    finEl.classList.remove("show");
    if (!n.choices) { finEl.classList.add("show"); return; }
    awaitingChoice = true;
    n.choices.forEach(([label, target], i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.setAttribute("aria-label", `Choice ${i + 1}: ${label}`);
      b.innerHTML =
        `<span class="keycap"><span>${i + 1}</span></span>` +
        `<span class="klabel">${label.replace(/^([^.:]{0,30}?)([.,])/, "<b>$1$2</b>")}</span>`;
      b.addEventListener("click", () => {
        if (!awaitingChoice) return;
        b.classList.add("pressed");
        setTimeout(() => { b.classList.remove("pressed"); goTo(target); }, 160);
      });
      choicesEl.appendChild(b);
    });
    requestAnimationFrame(() => choicesEl.classList.add("show"));
  }

  function goTo(id) {
    currentNode = id;
    const n = NODES[id];
    chapterEl.innerHTML = n.chapter.replace(/^([^—]+—)/, "<em>$1</em>");
    choicesEl.classList.remove("show");
    type(n.text);
  }

  function skip() { if (typing) finishTyping(); }

  /* interactions */
  sheetWin.addEventListener("click", skip);
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space") { e.preventDefault(); skip(); }
    else if (awaitingChoice && (e.key === "1" || e.key === "2")) {
      const btn = choicesEl.children[+e.key - 1];
      if (btn) btn.click();
    }
  });
  document.getElementById("restart").addEventListener("click", () => goTo("intro"));
  addEventListener("resize", () => { lastHeight = story.offsetHeight; snap(); });

  /* boot: the story waits at the platen */
  goTo("intro");
})();
</script>
</body>
</html>
