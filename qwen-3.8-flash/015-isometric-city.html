<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Meridian — An Isometric CSS City Block</title>
<style>
  :root{
    --night:0; --shx:0; --shy:0.5; --rainA:0;
    --sky1:#5faaff; --sky2:#e1f2ff; --s:1;
    --sans:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style",Palatino,"Book Antiqua",ui-serif,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:linear-gradient(to bottom,var(--sky1) 0%,var(--sky2) 78%);
    background-attachment:fixed;
    height:100vh;height:100dvh;
    overflow:hidden;
  }
  /* ============ sky furniture ============ */
  #stars{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    opacity:var(--night);
    transition:opacity .6s linear;
  }
  #stars i{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,#fff 0 0.5px,rgba(255,255,255,.55) 0.6px,transparent 55%);
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.35}to{opacity:1}}
  .lum{ /* sun & moon */
    position:fixed;z-index:1;border-radius:50%;
    width:64px;height:64px;pointer-events:none;
  }
  #sun{
    background:radial-gradient(circle at 42% 38%,#fffbe9,#ffe9a3 46%,#ffc75e 78%,#ff9b4d);
    box-shadow:0 0 34px 14px rgba(255,205,120,.65),0 0 120px 46px rgba(255,190,110,.32);
  }
  #moon{
    width:46px;height:46px;
    background:radial-gradient(circle at 44% 38%,#f8f4e6,#d9d3bf 55%,#a9a28c 100%);
    box-shadow:0 0 18px 6px rgba(238,232,214,.4),0 0 60px 22px rgba(238,232,214,.16);
  }
  .clouds i{
    position:fixed;z-index:2;pointer-events:none;
    width:250px;height:86px;border-radius:60px;
    background:
      radial-gradient(closest-side at 30% 60%,rgba(255,255,255,.95),transparent 92%),
      radial-gradient(closest-side at 58% 40%,rgba(255,255,255,.95),transparent 90%),
      radial-gradient(closest-side at 78% 62%,rgba(255,255,255,.95),transparent 92%);
    filter:blur(5px);
    opacity:calc((0.72 - var(--night) * 0.42) * (1 + var(--rainA) * 0.6));
  }
  .clouds .cl1{top:11%;animation:drift 90s linear infinite;animation-delay:-24s}
  .clouds .cl2{top:23%;transform:scale(1.5);animation:drift 130s linear infinite;animation-delay:-80s}
  .clouds .cl3{top:5%;transform:scale(0.7);animation:drift 105s linear infinite;animation-delay:-55s}
  @keyframes drift{from{left:-30%}to{left:115%}}
  /* ============ the block ============ */
  .scene{
    position:fixed;inset:0;z-index:5;
    display:grid;place-items:center;
    perspective:1800px;
  }
  .stage{
    position:relative;
    width:540px;height:540px;
    transform:scale(var(--s)) rotateX(60deg) rotateZ(45deg);
    transform-style:preserve-3d;
    background:
      /* dashed center lines */
      repeating-linear-gradient(90deg,rgba(244,235,210,0) 0 18px,#efe6cf 18px 34px,rgba(244,235,210,0) 34px 52px) no-repeat 0 268px/100% 4px,
      repeating-linear-gradient(0deg,rgba(244,235,210,0) 0 18px,#efe6cf 18px 34px,rgba(244,235,210,0) 34px 52px) no-repeat 268px 0/4px 100%,
      /* asphalt roads */
      linear-gradient(#5b5f6b,#5b5f6b) no-repeat 0 225px/100% 90px,
      linear-gradient(#5b5f6b,#5b5f6b) no-repeat 225px 0/90px 100%,
      /* sidewalk cross */
      linear-gradient(#d9d3c7,#d9d3c7) no-repeat 0 205px/100% 130px,
      linear-gradient(#d9d3c7,#d9d3c7) no-repeat 205px 0/130px 100%,
      /* rain + night tint */
      linear-gradient(rgba(22,32,52,calc(var(--rainA)*0.16)),rgba(22,32,52,calc(var(--rainA)*0.16))),
      linear-gradient(rgba(18,24,66,calc(var(--night)*0.42)),rgba(18,24,66,calc(var(--night)*0.42))),
      /* grass */
      linear-gradient(#b9d59a,#b9d59a);
    border-radius:14px;
    box-shadow:
      0 0 0 12px #c9c2b4,
      0 0 0 16px rgba(120,110,90,.55),
      0 46px 70px rgba(24,34,18,.30);
  }
  /* trees */
  .tree{
    position:absolute;
    transform:translateZ(10px);
    width:26px;height:26px;
  }
  .tree .can{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#8ac27a,#4f8a48 78%);
    box-shadow:inset 0 -4px 6px rgba(30,60,24,.35), 0 2px 3px rgba(30,50,20,.3);
  }
  .tree .trk{
    position:absolute;left:11px;top:24px;width:5px;height:7px;border-radius:2px;
    background:#7a5a38;
  }
  /* ground shadows of buildings */
  .gshadow{
    position:absolute;
    left:var(--x);top:var(--y);width:var(--w);height:var(--d);
    background:rgba(30,28,22,calc(0.32 - var(--night)*0.22));
    filter:blur(9px);
    transform:translate(
      calc(var(--shx) * var(--h) * 0.01px),
      calc(var(--shy) * var(--h) * 0.01px));
    border-radius:3px;
  }
  /* buildings */
  .slot{
    position:absolute;
    left:var(--x);top:var(--y);width:var(--w);height:var(--d);
    transform-style:preserve-3d;
    transform:translateZ(0);
    transition:transform .5s cubic-bezier(0.2,1.3,0.3,1);
    outline:none;
  }
  .slot:hover,.slot:focus-visible{transform:translateZ(24px)}
  .face{position:absolute;top:0;left:0;overflow:hidden}
  .top{
    width:var(--w);height:var(--d);
    transform:translateZ(var(--h));
    background:var(--c);
    border-radius:2px;
  }
  .top::before{ /* night tint */
    content:"";position:absolute;inset:0;
    background:rgba(18,24,66,calc(var(--night)*0.34));
  }
  .top::after{ /* white lighten + subtle inset rim */
    content:"";position:absolute;inset:0;
    background:linear-gradient(rgba(255,255,255,.46),rgba(255,255,255,.34));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5),inset 0 0 12px rgba(120,110,95,.14);
  }
  .south{
    width:var(--w);height:var(--h);
    transform:translateY(var(--d)) translateZ(var(--h)) rotateX(-90deg);
    transform-origin:0 0;
    background:var(--c);
    filter:brightness(.96);
    border-radius:0 0 2px 2px;
  }
  .east{
    width:var(--d);height:var(--h);
    transform:translateX(var(--w)) translateZ(var(--h)) rotateZ(90deg) rotateX(-90deg);
    transform-origin:0 0;
    background:var(--c);
    filter:brightness(.74);
    border-radius:0 0 2px 2px;
  }
  .south::before,.east::before{
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:rgba(18,24,66,calc(var(--night)*0.42));
  }
  /* windows */
  .wins{
    position:absolute;inset:0;z-index:2;
    display:grid;
    grid-template:repeat(var(--rows),1fr)/repeat(var(--cols),1fr);
    gap:9px;
    padding:16px 13px 26px;
  }
  .east .wins{padding:16px 11px 22px}
  .cell{
    position:relative;display:block;border-radius:1.5px;
    background:linear-gradient(165deg,#7d93ad 0%,#41536b 55%,#28374a 100%);
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);
  }
  .cell.on::after{
    content:"";position:absolute;inset:0;border-radius:1.5px;
    background:var(--wc,#ffd58a);
    opacity:calc(var(--night)*0.95);
    box-shadow:0 0 7px 1px rgba(255,205,125,.55);
  }
  .door{
    position:absolute;z-index:2;
    bottom:0;left:50%;transform:translateX(-50%);
    width:15px;height:22px;border-radius:3px 3px 0 0;
    background:linear-gradient(#3a332b,#241f19);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);
  }
  /* paper tag above the roof */
  .tag{
    position:absolute;z-index:20;
    width:158px;
    left:calc(var(--w)/2);top:calc(var(--d)/2);
    margin-left:-79px;margin-top:-40px;
    transform:translateZ(calc(var(--h) + 46px)) rotateZ(-45deg) rotateX(-60deg);
    background:rgba(248,244,234,.93);
    border:1px solid rgba(70,58,42,.22);
    border-radius:9px;
    padding:8px 12px 9px;
    box-shadow:0 6px 16px rgba(20,25,40,.28);
    opacity:0;pointer-events:none;
    transition:opacity .28s ease,transform .4s cubic-bezier(0.2,1.3,0.3,1);
  }
  .slot:hover .tag,.slot:focus .tag,.slot:focus-visible .tag{
    opacity:1;
    transform:translateZ(calc(var(--h) + 58px)) rotateZ(-45deg) rotateX(-60deg);
  }
  .tag b{
    display:block;font-family:var(--serif);font-weight:600;
    font-size:13.5px;color:#2c2a26;letter-spacing:.01em;line-height:1.15;
  }
  .tag span{
    display:block;margin-top:3px;
    font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:#6d675c;
  }
  /* cars */
  .car{
    position:absolute;z-index:6;
    width:36px;height:17px;border-radius:6px;
    box-shadow:0 0 12px 2px var(--cg),0 3px 6px rgba(10,15,25,.35);
  }
  .car::before{ /* cabin */
    content:"";position:absolute;left:9px;top:3.5px;width:15px;height:10px;border-radius:3px;
    background:rgba(15,20,30,.32);
  }
  .car .hl,.car .tl{
    position:absolute;top:4px;width:5px;height:9px;border-radius:50%;
    opacity:calc(0.4 + var(--night)*0.6);
  }
  .car .hl{right:0;background:#fff;box-shadow:0 0 9px 3px rgba(255,248,214,.85)}
  .car .tl{left:0;background:#ff5448;box-shadow:0 0 7px 2px rgba(255,84,72,.6)}
  .car1{background:#ff7a5c;--cg:rgba(255,122,92,.5);top:284px;animation:runE 9s linear infinite}
  .car2{background:#2fb3a7;--cg:rgba(47,179,167,.5);top:240px;animation:runW 11s linear infinite;animation-delay:-4s}
  .car3{background:#ffd24a;--cg:rgba(255,210,74,.5);left:284px;animation:runS 10s linear infinite;animation-delay:-2s}
  .car4{background:#8f9ff2;--cg:rgba(143,159,242,.5);left:240px;animation:runN 12s linear infinite;animation-delay:-7s}
  @keyframes runE{from{transform:translate3d(-60px,0,12px) rotateZ(0deg)}to{transform:translate3d(600px,0,12px) rotateZ(0deg)}}
  @keyframes runW{from{transform:translate3d(600px,0,12px) rotateZ(180deg)}to{transform:translate3d(-60px,0,12px) rotateZ(180deg)}}
  @keyframes runS{from{transform:translate3d(0,-60px,12px) rotateZ(90deg)}to{transform:translate3d(0,600px,12px) rotateZ(90deg)}}
  @keyframes runN{from{transform:translate3d(0,600px,12px) rotateZ(-90deg)}to{transform:translate3d(0,-60px,12px) rotateZ(-90deg)}}
  /* neon marquee above the Night Market */
  .marquee{
    position:absolute;z-index:15;
    left:415px;top:162px;
    transform:translate(-50%,-50%) translateZ(96px) rotateZ(-45deg) rotateX(-60deg);
    pointer-events:none;
  }
  .mq-bob{animation:bob 4.6s ease-in-out infinite alternate}
  .mq-plate{
    background:#2a2038;
    border:1px solid rgba(255,95,184,.35);
    border-radius:7px;
    padding:7px 16px 8px;
    box-shadow:0 0 22px rgba(255,95,184,.25),0 8px 18px rgba(20,10,40,.4);
    text-align:center;
    animation:flicker 5.2s steps(1,end) infinite;
  }
  .mq-plate b{
    display:block;
    font-family:var(--serif);font-style:italic;font-weight:700;
    font-size:15px;letter-spacing:.14em;
    color:#ff5fb8;
    text-shadow:0 0 5px #ff5fb8,0 0 14px #ff2f9e,0 0 34px rgba(255,47,158,.75);
  }
  .mq-plate i{display:block;margin-top:2px;font-size:7.5px;letter-spacing:.3em;color:#d7a8d7;font-style:normal}
  @keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
  @keyframes flicker{
    0%,42%,46%,52%,58%,100%{opacity:1}
    44%,55%{opacity:.55}
    48%{opacity:.3}
  }
  /* ============ rain ============ */
  .rain{
    position:fixed;inset:-12% 0;z-index:30;pointer-events:none;
    opacity:var(--rainA);
    transition:opacity .8s;
  }
  .rain i{position:absolute;inset:0;display:block}
  .rain .r1{
    background:repeating-linear-gradient(101deg,rgba(205,222,245,0) 0 26px,rgba(205,222,245,.34) 26px 27px,rgba(205,222,245,0) 27px 44px);
    animation:fall1 .7s linear infinite;
  }
  .rain .r2{
    background:repeating-linear-gradient(97deg,rgba(190,210,240,0) 0 37px,rgba(190,210,240,.2) 37px 38px,rgba(190,210,240,0) 38px 58px);
    animation:fall2 1.05s linear infinite;
  }
  @keyframes fall1{from{transform:translateY(-44px)}to{transform:translateY(0)}}
  @keyframes fall2{from{transform:translateY(-58px)}to{transform:translateY(0)}}
  /* ============ chrome ============ */
  .toolbar{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    z-index:50;
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(250,248,242,.7);
    border:1px solid rgba(90,80,60,.18);
    backdrop-filter:blur(12px) saturate(1.2);
    border-radius:999px;
    padding:7px 9px;
    box-shadow:0 10px 26px rgba(20,28,40,.25);
  }
  .toolbar button{
    font-family:var(--sans);
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:#38342c;
    background:transparent;
    border:1px solid transparent;
    border-radius:999px;
    padding:7px 13px;
    cursor:pointer;
    transition:background .2s,border-color .2s,color .2s;
  }
  .toolbar button:hover{background:rgba(255,255,255,.65)}
  .toolbar button[aria-pressed="true"]{
    background:#2c2a26;color:#f6f2e8;border-color:#2c2a26;
  }
  .clock{
    position:fixed;right:20px;top:16px;z-index:50;
    text-align:right;
    color:rgba(30,30,34,.85);
  }
  .clock time{
    font-family:var(--serif);
    font-size:30px;line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
    display:block;
  }
  .clock span{
    display:block;margin-top:4px;
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;
  }
  .caption{
    position:fixed;left:20px;bottom:22px;z-index:50;
    font-family:var(--serif);
    font-size:13px;color:rgba(28,28,32,.85);
    background:rgba(250,248,242,.55);
    backdrop-filter:blur(8px);
    padding:7px 13px;border-radius:99px;
    border:1px solid rgba(90,80,60,.15);
    max-width:44vw;
  }
  .title{
    position:fixed;left:20px;top:14px;z-index:50;
    font-family:var(--serif);
    font-size:20px;letter-spacing:.04em;
    color:rgba(30,30,34,.85);
    font-weight:400;
  }
  .title small{
    display:block;margin-top:3px;
    font-family:var(--sans);font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;opacity:.75;
  }
  /* ============ reduced motion ============ */
  @media (prefers-reduced-motion: reduce){
    .car,.mq-bob,.mq-plate,.clouds i,#stars i,.rain i{animation:none !important}
    .slot,.slot .tag{transition:none}
  }
</style>
</head>
<body>
<h1 class="title">Little Meridian<small>one block · two-minute day</small></h1>
<div class="clock"><time id="clockTime" datetime="12:00">12:00</time><span id="clockPhase">Midday</span></div>

<div id="stars" aria-hidden="true"></div>
<div class="lum" id="sun" aria-hidden="true"></div>
<div class="lum" id="moon" aria-hidden="true"></div>
<div class="clouds" aria-hidden="true"><i class="cl1"></i><i class="cl2" style="left:30%"></i><i class="cl3" style="left:60%"></i></div>

<div class="scene">
  <div class="stage" id="stage" aria-label="isometric city block"></div>
</div>

<div class="rain" id="rainLayer" aria-hidden="true"><i class="r1"></i><i class="r2"></i></div>

<div class="toolbar" role="toolbar" aria-label="city controls">
  <button id="btnPause" aria-pressed="false">Pause cycle</button>
  <button id="btnRain" aria-pressed="false">Rain</button>
  <button id="btnNight">Skip to night</button>
  <button id="btnDay">Skip to day</button>
</div>

<p class="caption" id="caption" aria-live="polite">Hover or focus a building to see what it is.</p>

<script>
'use strict';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;
const stage=document.getElementById('stage');
const caption=document.getElementById('caption');
const CYCLE=120000; // two-minute day

/* ---------------- buildings ---------------- */
const BUILDINGS=[
 {n:'Harbor Tower',      x:30, y:30, w:80, d:70, h:220,c:'#a9b7c9',f:14,u:'harbour offices'},
 {n:'Marigold Flats',    x:130,y:25, w:65, d:60, h:120,c:'#e9c1a0',f:7, u:'apartments'},
 {n:'Linden Court',      x:30, y:120,w:70, d:70, h:140,c:'#b9d4c2',f:8, u:'co-op housing'},
 {n:'The Prism',         x:115,y:105,w:75, d:85, h:170,c:'#c9bfe0',f:10,u:'gallery & studios'},
 {n:'Cobalt Works',      x:345,y:30, w:120,d:80, h:110,c:'#9fb8d8',f:5, u:'print factory'},
 {n:'Night Market',      x:340,y:130,w:150,d:65, h:55, c:'#e6a49a',f:2, u:'food hall'},
 {n:'Pillow Bank',       x:35, y:345,w:85, d:75, h:130,c:'#e8dcc4',f:7, u:'savings bank'},
 {n:'Ferris Apartments', x:35, y:440,w:75, d:70, h:180,c:'#dcb3b8',f:11,u:'apartments'},
 {n:'Saltbox Studios',   x:135,y:350,w:60, d:80, h:90, c:'#c3ccb0',f:4, u:'artist lofts'},
 {n:'Aurora Spire',      x:140,y:440,w:70, d:60, h:260,c:'#a8cfd0',f:16,u:'tallest in the ward'},
 {n:'Tin Roof Diner',    x:345,y:345,w:90, d:70, h:80, c:'#ecd9a1',f:3, u:'diner · open late'},
 {n:'Meridian House',    x:450,y:360,w:65, d:95, h:150,c:'#cfc5d6',f:9, u:'landmark tower'}
];
const TREES=[
 {x:193,y:193},{x:340,y:190},{x:190,y:340},{x:341,y:341},
 {x:62,y:258},{x:470,y:270},{x:258,y:42},{x:252,y:498}
];

/* ground shadow layer */
const shadowLayer=document.createElement('div');
shadowLayer.setAttribute('aria-hidden','true');
shadowLayer.style.cssText='position:absolute;inset:0;transform-style:preserve-3d';
stage.appendChild(shadowLayer);

function fillWindows(face,cols){
  const rows=parseInt(face.dataset.rows,10);
  face.style.setProperty('--cols',cols);
  const wrap=document.createElement('div');
  wrap.className='wins';
  for(let i=0;i<rows*cols;i++){
    const c=document.createElement('i');
    c.className='cell';
    const v=Math.random();
    if(v<0.12)c.style.setProperty('--wc','#ffe9b8');
    else if(v<0.2)c.style.setProperty('--wc','#cfe6ff');
    if(Math.random()<0.3)c.classList.add('on');
    wrap.appendChild(c);
  }
  face.appendChild(wrap);
}
function setCaption(b){caption.textContent=b.n+' — '+b.f+' floors · '+b.u;}
function resetCaption(){caption.textContent='Hover or focus a building to see what it is.';}

BUILDINGS.forEach(b=>{
  const sh=document.createElement('div');
  sh.className='gshadow';
  sh.style.cssText='--x:'+b.x+'px;--y:'+b.y+'px;--w:'+b.w+'px;--d:'+b.d+'px;--h:'+b.h+'px';
  shadowLayer.appendChild(sh);

  const slot=document.createElement('div');
  slot.className='slot';
  slot.tabIndex=0;
  slot.setAttribute('role','img');
  slot.setAttribute('aria-label',b.n+', '+b.f+' floors, '+b.u);
  slot.style.cssText='--x:'+b.x+'px;--y:'+b.y+'px;--w:'+b.w+'px;--d:'+b.d+'px;--h:'+b.h+'px;--c:'+b.c;

  const rows=Math.max(2,Math.round(b.h/30));
  const south=document.createElement('div');south.className='face south';south.dataset.rows=rows;
  const east=document.createElement('div');east.className='face east';east.dataset.rows=rows;
  fillWindows(south,Math.max(2,Math.round(b.w/26)));
  fillWindows(east,Math.max(2,Math.round(b.d/26)));

  const top=document.createElement('div');top.className='face top';
  const door=document.createElement('div');door.className='door';
  south.appendChild(door);

  const tag=document.createElement('div');tag.className='tag';
  tag.innerHTML='<b>'+b.n+'</b><span>'+b.f+' floors · '+b.u+'</span>';

  slot.append(top,south,east,tag);
  stage.appendChild(slot);
  slot.addEventListener('pointerenter',()=>setCaption(b));
  slot.addEventListener('focus',()=>setCaption(b));
  slot.addEventListener('pointerleave',resetCaption);
  slot.addEventListener('blur',resetCaption);
});

/* trees */
TREES.forEach(t=>{
  const el=document.createElement('div');
  el.className='tree';
  el.setAttribute('aria-hidden','true');
  el.style.cssText='left:'+t.x+'px;top:'+t.y+'px';
  el.innerHTML='<span class="trk"></span><span class="can"></span>';
  stage.appendChild(el);
});

/* cars */
['car1','car2','car3','car4'].forEach(cn=>{
  const c=document.createElement('div');
  c.className='car '+cn;
  c.setAttribute('aria-hidden','true');

/* ---------------- day / night cycle ---------------- */
/* nine keyframes: [cycle fraction, sky1, sky2, night, phase] */
const KEYS=[
 [0.00,'#0c1028','#1e2246',1.00,'Deep night'],
 [0.10,'#1a1c3f','#3a3060',0.92,'Late night'],
 [0.18,'#3c2f5e','#7a5578',0.62,'Violet dawn'],
 [0.26,'#ff966e','#ffd7aa',0.16,'Sunrise'],
 [0.38,'#6fb4fb','#e6f4ff',0.00,'Morning'],
 [0.52,'#5faaff','#e1f2ff',0.00,'Midday'],
 [0.68,'#78a9ee','#ffe9c4',0.00,'Golden hour'],
 [0.78,'#ff8d5e','#ffc98a',0.28,'Amber dusk'],
 [0.88,'#46285c','#8a4468',0.70,'Plum evening']
];
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function smooth(x){return x*x*(3-2*x)}
function lerp(a,b,u){return a+(b-a)*u}
const RGB=KEYS.map(k=>({t:k[0],a:hex(k[1]),b:hex(k[2]),n:k[3],p:k[4]}));
function at(T){
  let i=RGB.length-1;
  for(let k=0;k<RGB.length;k++){if(T<RGB[k].t){i=(k-1+RGB.length)%RGB.length;break}}
  const a=RGB[i],b=RGB[(i+1)%RGB.length];
  const span=b.t>a.t?b.t-a.t:1-a.t+b.t;
  let local=b.t>a.t?T-a.t:((T-a.t+1)%1);
  const u=smooth(Math.min(1,Math.max(0,local/span)));
  const mix=(x,y)=>'rgb('+x.map((v,j)=>Math.round(lerp(v,y[j],u))).join(',')+')';
  return {sky1:mix(a.a,b.a),sky2:mix(a.b,b.b),night:lerp(a.n,b.n,u),phase:u<0.5?a.p:b.p};
}
const clockTime=document.getElementById('clockTime');
const clockPhase=document.getElementById('clockPhase');
const sun=document.getElementById('sun'), moon=document.getElementById('moon');
let paused=reduce, rainOn=false;
let cycleT=reduce?0.52:0.22;            /* fraction of the day */
let lastTs=performance.now();

function step(now){
  const dt=Math.min(100,now-lastTs);lastTs=now;
  if(!paused)cycleT=(cycleT+dt/CYCLE)%1;
  render();
  requestAnimationFrame(step);
}
function render(){
  const st=at(cycleT);
  root.style.setProperty('--sky1',st.sky1);
  root.style.setProperty('--sky2',st.sky2);
  root.style.setProperty('--night',st.night.toFixed(3));
  clockPhase.textContent=st.phase;
  const h=cycleT*24;
  const disp=String(Math.floor(h)%24).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');
  clockTime.textContent=disp;clockTime.setAttribute('datetime',disp);
  /* sun arc: rises ~0.24, sets ~0.80 */
  const su=(cycleT-0.24)/0.56;
  if(su>=-0.05&&su<=1.05){
    const u=Math.min(1,Math.max(0,su));
    sun.style.display='block';
    sun.style.left=(6+u*86)+'vw';
    sun.style.top=(74-Math.sin(Math.PI*u)*62)+'vh';
    sun.style.opacity=Math.min(1,Math.sin(Math.PI*u)*3).toFixed(3);
  }else sun.style.display='none';
  /* moon: opposing arc */
  const mu=(((cycleT+0.5)%1)-0.24)/0.56;
  if(mu>=-0.05&&mu<=1.05){
    const u=Math.min(1,Math.max(0,mu));
    moon.style.display='block';
    moon.style.left=(6+u*86)+'vw';
    moon.style.top=(70-Math.sin(Math.PI*u)*56)+'vh';
    moon.style.opacity=Math.min(1,Math.sin(Math.PI*u)*3).toFixed(3);
  }else moon.style.display='none';
  /* shadows swing long at dawn/dusk, fade at night */
  const day=Math.sin(Math.PI*Math.min(1,Math.max(0,su)));
  const L=12+(1-day)*46;                    /* offset in px per 100px of height */
  root.style.setProperty('--shx',(-Math.cos(Math.PI*Math.min(1,Math.max(0,su)))*L).toFixed(3));
  root.style.setProperty('--shy',(L*0.34+4).toFixed(3));
}
requestAnimationFrame(t=>{lastTs=t;step(t)});

/* ---------------- controls ---------------- */
const btnPause=document.getElementById('btnPause');
const btnRain=document.getElementById('btnRain');
function setPaused(p){
  paused=p;
  btnPause.setAttribute('aria-pressed',String(p));
  btnPause.textContent=p?'Resume cycle':'Pause cycle';
}
btnPause.addEventListener('click',()=>setPaused(!paused));
function setRain(r){
  rainOn=r;
  btnRain.setAttribute('aria-pressed',String(r));
  root.style.setProperty('--rainA',r?'1':'0');
  document.querySelectorAll('.clouds i').forEach(c=>{
    c.style.animationDuration=r?String(parseFloat(c.classList.contains('cl2')?130:c.classList.contains('cl1')?90:105)/2)+'s':'';
  });
}
btnRain.addEventListener('click',()=>setRain(!rainOn));
document.getElementById('btnNight').addEventListener('click',()=>{cycleT=0.0;setPaused(false);render();});
document.getElementById('btnDay').addEventListener('click',()=>{cycleT=0.52;setPaused(false);render();});
addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'');
  if(tag==='BUTTON'||tag==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();setPaused(!paused);}
  else if(e.key==='r'||e.key==='R'){setRain(!rainOn);}
});

/* ---------------- fit scale ---------------- */
function fit(){
  const s=Math.min(innerWidth*0.92/810,(innerHeight*0.86)/660);
  root.style.setProperty('--s',Math.max(0.42,Math.min(1.7,s)).toFixed(3));
}
addEventListener('resize',fit);fit();
