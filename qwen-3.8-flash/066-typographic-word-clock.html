<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typographic Word Clock — a time poem</title>
<style>
  :root{
    --bg-a:#070a16; --bg-b:#0f1630; --bg-c:#241c3d;
    --cell: clamp(16px, min(5.2vw, 6.2vh), 58px);
    --sans:"Helvetica Neue","Avenir Next",Futura,"Segoe UI",system-ui,sans-serif;
    --serif:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;
    --star:1;
  }
  :root[data-theme="ember"]{ --accent:#ffd68a; --glow:rgba(255,214,138,.55); --glow2:rgba(255,214,138,.28); }
  :root[data-theme="moon"]{ --accent:#e6f0ff; --glow:rgba(230,240,255,.55); --glow2:rgba(230,240,255,.28); }
  :root[data-theme="verdigris"]{ --accent:#a8f0d4; --glow:rgba(168,240,212,.55); --glow2:rgba(168,240,212,.28); }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    color:#e8eaf2;
    overflow:hidden;
    display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  /* ---------- sky ---------- */
  .sky,.horizon,.stars,.grain{position:fixed; inset:0; pointer-events:none;}
  .sky{z-index:-4; background:linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);}
  .horizon{z-index:-3; background:radial-gradient(130% 65% at 50% 116%, var(--bg-c) 0%, transparent 68%);}
  .stars{
    z-index:-2; opacity:var(--star); transition:opacity 3s linear;
    background-image:
      radial-gradient(1px 1px at 42px 38px, rgba(255,255,255,.9), transparent 55%),
      radial-gradient(1px 1px at 128px 96px, rgba(255,255,255,.7), transparent 55%),
      radial-gradient(1.4px 1.4px at 212px 52px, rgba(255,255,255,.95), transparent 55%),
      radial-gradient(1px 1px at 296px 154px, rgba(255,255,255,.6), transparent 55%),
      radial-gradient(1.2px 1.2px at 66px 188px, rgba(255,255,255,.85), transparent 55%),
      radial-gradient(1px 1px at 180px 220px, rgba(255,255,255,.55), transparent 55%),
      radial-gradient(1.6px 1.6px at 330px 24px, rgba(255,255,255,.9), transparent 55%),
      radial-gradient(1px 1px at 250px 260px, rgba(255,255,255,.7), transparent 55%),
      radial-gradient(1px 1px at 14px 120px, rgba(255,255,255,.6), transparent 55%),
      radial-gradient(1.3px 1.3px at 100px 296px, rgba(255,255,255,.8), transparent 55%),
      radial-gradient(1px 1px at 372px 130px, rgba(255,255,255,.65), transparent 55%),
      radial-gradient(1.1px 1.1px at 224px 168px, rgba(255,255,255,.75), transparent 55%);
    background-size:400px 340px;
  }
  .stars.b{
    background-size:230px 270px; opacity:calc(var(--star)*0.55);
    filter:blur(0.4px); transform:scale(1.3);
  }
  .grain{
    z-index:40; opacity:.045; mix-blend-mode:overlay;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="240" height="240" filter="url(%23n)"/></svg>');
  }
  #rain{position:fixed; inset:0; z-index:30; pointer-events:none;}

  /* ---------- header / footer chrome ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:clamp(12px,2.4vh,22px) clamp(16px,3vw,34px) 0;
    z-index:10; flex-wrap:wrap;
  }
  .hlabel{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.28em;
    color:rgba(232,234,242,.5);
  }
  #readout{
    font-size:clamp(12px,1.4vw,15px); font-weight:600; letter-spacing:.12em;
    font-variant-numeric:tabular-nums; color:var(--accent);
    text-shadow:0 0 14px var(--glow);
    transition:color .6s;
  }
  .hgroup{display:flex; gap:14px; align-items:center;}
  .seg{
    display:flex; border:1px solid rgba(255,255,255,.16); border-radius:999px; overflow:hidden;
    background:rgba(10,14,26,.35);
  }
  .seg button{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font:800 9px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase;
    color:rgba(232,234,242,.55); padding:8px 11px; transition:background .35s,color .35s;
  }
  .seg button.on{background:rgba(255,255,255,.14); color:#fff;}
  .swatchdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px;
    box-shadow:0 0 8px currentColor;}
  .th-ember .swatchdot{color:#ffd68a; background:#ffd68a;}
  .th-moon .swatchdot{color:#e6f0ff; background:#e6f0ff;}
  .th-verdigris .swatchdot{color:#a8f0d4; background:#a8f0d4;}

  /* ---------- clock frame ---------- */
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(14px,3vh,34px); padding:10px 14px; z-index:10; min-height:0;}
  .frame{
    position:relative;
    background:rgba(8,10,20,.36);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:calc(var(--cell)*0.62);
    box-shadow:0 60px 140px -40px rgba(0,0,10,.85), 0 20px 60px rgba(0,0,10,.5);
    cursor:pointer;
  }
  .frame::before,.frame::after{
    content:""; position:absolute; width:22px; height:22px;
    border-color:var(--accent); border-style:solid; border-width:0;
    opacity:.9; transition:border-color .6s;
  }
  .frame::before{top:-4px; left:-4px; border-top-width:2px; border-left-width:2px;}
  .frame::after{bottom:-4px; right:-4px; border-bottom-width:2px; border-right-width:2px;}
  .dot{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.14); transition:background .6s, box-shadow .6s;
  }
  .dot.lit{background:var(--accent); box-shadow:0 0 10px var(--glow), 0 0 20px var(--glow);}
  .dot.d1{top:calc(var(--cell)*0.24); left:calc(var(--cell)*0.24);}
  .dot.d2{top:calc(var(--cell)*0.24); right:calc(var(--cell)*0.24);}
  .dot.d3{bottom:calc(var(--cell)*0.24); left:calc(var(--cell)*0.24);}
  .dot.d4{bottom:calc(var(--cell)*0.24); right:calc(var(--cell)*0.24);}

  #grid{
    display:grid; grid-template-columns:repeat(11, var(--cell));
    grid-auto-rows:var(--cell);
    user-select:none;
  }
  #grid span{
    display:flex; align-items:center; justify-content:center;
    font-weight:800; text-transform:uppercase;
    font-size:calc(var(--cell)*0.52);
    color:rgba(255,255,255,.10);
    transition:color 1.4s ease, text-shadow 1.4s ease;
    text-shadow:0 0 0 transparent;
  }
  #grid span.on{
    color:var(--accent);
    text-shadow:0 0 6px var(--glow), 0 0 18px var(--glow), 0 0 46px var(--glow2);
  }

  /* ---------- poem ---------- */
  .poem{position:relative; width:min(760px, 92vw); height:calc(clamp(16px, 2.2vw, 26px)*4.6); text-align:center;}
  .poem p{
    position:absolute; left:0; right:0; top:0;
    font-family:var(--serif); font-style:italic;
    font-size:clamp(16px, 2.2vw, 26px); line-height:1.5;
    color:rgba(240,242,250,.92);
    text-shadow:0 2px 18px rgba(0,0,0,.45);
    opacity:0; transform:translateY(14px); filter:blur(8px);
    transition:opacity 2.4s ease, transform 2.4s ease, filter 2.4s ease;
  }
  .poem p.show{opacity:1; transform:translateY(0); filter:blur(0);}
  .poem p.out{opacity:0; transform:translateY(-14px); filter:blur(8px);}
  .poem .period{
    position:absolute; left:0; right:0; bottom:0;
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.28em;
    font-variant:small-caps; color:rgba(255,255,255,.45);
  }
  .poem .period::before,.poem .period::after{content:"·"; margin:0 10px; color:var(--accent);}

  footer{
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
    padding:0 20px clamp(14px,2.6vh,24px); z-index:10;
  }
  footer .hlabel{white-space:nowrap;}
  #scrub{width:min(420px, 60vw);}
  input[type=range]{ -webkit-appearance:none; appearance:none; height:22px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:2px;
    background:linear-gradient(90deg, rgba(255,255,255,.28), var(--accent)); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    margin-top:-5.5px; background:var(--accent); box-shadow:0 0 12px var(--glow); border:1px solid rgba(255,255,255,.5); }
  input[type=range]::-moz-range-track{ height:3px; border-radius:2px;
    background:linear-gradient(90deg, rgba(255,255,255,.28), var(--accent)); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; background:var(--accent);
    border:1px solid rgba(255,255,255,.5); box-shadow:0 0 12px var(--glow); }
  #nowBtn{
    appearance:none; cursor:pointer; border:1px solid rgba(255,255,255,.2);
    background:rgba(10,14,26,.35); color:rgba(232,234,242,.8);
    font:800 9px/1 var(--sans); letter-spacing:.28em; text-transform:uppercase;
    padding:9px 16px; border-radius:999px; transition:background .35s, color .35s, border-color .35s;
  }
  #nowBtn:hover{border-color:var(--accent); color:#fff;}
  #nowBtn.watched{background:var(--accent); color:rgba(8,10,20,.9); border-color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    #grid span, .dot, .poem p, #readout{transition-duration:0.01s !important;}
    .poem p{filter:none !important; transform:none !important;}
    .stars{transition-duration:0.01s;}
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="horizon"></div>
<div class="stars"></div>
<div class="stars b"></div>
<canvas id="rain"></canvas>
<div class="grain"></div>

<header>
  <div class="hlabel">Word Clock — a time poem</div>
  <div id="readout">--:--</div>
  <div class="hgroup">
    <div class="seg" id="themeSeg">
      <button data-theme="ember" class="th-ember on"><span class="swatchdot"></span>Ember</button>
      <button data-theme="moon" class="th-moon"><span class="swatchdot"></span>Moon</button>
      <button data-theme="verdigris" class="th-verdigris"><span class="swatchdot"></span>Verdigris</button>
    </div>
    <div class="seg" id="fmtSeg">
      <button data-fmt="12" class="on">12h</button>
      <button data-fmt="24">24h</button>
    </div>
  </div>
</header>

<main>
  <div class="frame" id="frame" title="click the grid for a new line">
    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>
    <div id="grid"></div>
  </div>
  <div class="poem">
    <p id="lineA" class="show"></p>
    <p id="lineB"></p>
    <div class="period" id="periodName">deep night</div>
  </div>
</main>

<footer>
  <div class="hlabel">Time travel</div>
  <input type="range" id="scrub" min="0" max="1439" step="1" value="0" aria-label="Scrub through the day in minutes">
  <button id="nowBtn" class="watched">Now</button>
</footer>

<script>
'use strict';
/* =========================================================
   Typographic Word Clock & Time Poem — no assets, no libs
   ========================================================= */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the grid ---------- */
const ROWS = ['ITLISASAMPM','ACQUARTERDC','TWENTYFIVEX','HALFSTENFTO','PASTERUNINE',
              'ONESIXTHREE','FOURFIVETWO','EIGHTELEVEN','SEVENTWELVE','TENSEOCLOCK'];
const grid = document.getElementById('grid');
const cells = [];
ROWS.forEach((row,r)=>{
  [...row].forEach((ch,c)=>{
    const s=document.createElement('span');
    s.textContent=ch;
    grid.appendChild(s);
    cells[r*11+c]=s;
  });
});
const word=(r,c0,c1)=>{const a=[];for(let c=c0;c<=c1;c++)a.push(r*11+c);return a;};
const WORDS={
  ITIS:[...word(0,0,1),...word(0,3,4)],
  AS:word(0,5,6), AM:word(0,7,8), PM:word(0,9,10),
  QUARTER:word(1,2,8),
  TWENTY:word(2,0,5),
  FIVE_PAST:word(2,6,9),
  HALF:word(3,0,3),
  TEN_PAST:word(3,5,7),
  TO:word(3,9,10),
  PAST:word(4,0,3),
  NINE:word(4,7,10),
  ONE:word(5,0,2), SIX:word(5,3,5), THREE:word(5,6,10),
  FOUR:word(6,0,3), FIVE:word(6,4,7), TWO:word(6,8,10),
  EIGHT:word(7,0,4), ELEVEN:word(7,5,10),
  SEVEN:word(8,0,4), TWELVE:word(8,5,10),
  TEN:word(9,0,2), OCLOCK:word(9,5,10)
};
const HOURS={1:'ONE',2:'TWO',3:'THREE',4:'FOUR',5:'FIVE',6:'SIX',
             7:'SEVEN',8:'EIGHT',9:'NINE',10:'TEN',11:'ELEVEN',12:'TWELVE'};

function litIndices(min, fmt12){
  const h24=Math.floor(min/60), mm=min%60, m=Math.floor(mm/5)*5, extra=mm%5;
  const late=m>30;
  const hour=((h24%12)||12)+(late?1:0); const hour12=hour===13?1:hour;
  const set=new Set(WORDS.ITIS);
  if(extra>0) WORDS.AS.forEach(i=>set.add(i));
  if(m!==0){
    if(m<=30) WORDS.PAST.forEach(i=>set.add(i)); else WORDS.TO.forEach(i=>set.add(i));
  }else WORDS.OCLOCK.forEach(i=>set.add(i));
  switch(m){
    case 5: case 55: WORDS.FIVE_PAST.forEach(i=>set.add(i)); break;
    case 10: WORDS.TEN_PAST.forEach(i=>set.add(i)); break;
    case 15: case 45: WORDS.QUARTER.forEach(i=>set.add(i)); break;
    case 20: WORDS.TWENTY.forEach(i=>set.add(i)); break;
    case 25: case 35: WORDS.TWENTY.forEach(i=>set.add(i)); WORDS.FIVE_PAST.forEach(i=>set.add(i)); break;
    case 30: WORDS.HALF.forEach(i=>set.add(i)); break;
    case 40: WORDS.TWENTY.forEach(i=>set.add(i)); break;
    case 50: WORDS.TEN_PAST.forEach(i=>set.add(i)); break;
  }
  WORDS[HOURS[hour12]].forEach(i=>set.add(i));
  if(fmt12){ (h24<12?WORDS.AM:WORDS.PM).forEach(i=>set.add(i)); }
  return {set, extra};
}

/* ---------- time state ---------- */
let live=true, scrubMin=0, fmt12=true;
let lastMinuteKey=null;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const currentMin=()=>live?nowMin():scrubMin;

function renderWords(){
  const min=currentMin();
  const {set,extra}=litIndices(min,fmt12);
  for(let i=0;i<110;i++) cells[i].classList.toggle('on',set.has(i));
  document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('lit',k<extra));
}
function renderReadout(){
  const min=currentMin();
  const h24=Math.floor(min/60), m=min%60;
  const mm=String(m).padStart(2,'0');
  let txt;
  if(fmt12){ const h=((h24%12)||12); txt=`${String(h).padStart(2,'\u2007')}:${mm} ${h24<12?'AM':'PM'}`; }
  else txt=`${String(h24).padStart(2,'0')}:${mm}`;
  document.getElementById('readout').textContent=txt;
}

/* ---------- sky ---------- */
const KEYS=[
  [0,   '#070a16','#0f1630','#241c3d'],
  [240, '#0a0f22','#1b2140','#3b2a4f'],
  [360, '#2b2a55','#8d4f6d','#f2a06b'],
  [480, '#4f7fc4','#9fc3e8','#f6d9b2'],
  [720, '#4a8ad8','#8fc0ee','#dbe9f5'],
  [960, '#3e6fb0','#a9a0c8','#f0b48a'],
  [1080,'#26314f','#6b3d66','#e0693f'],
  [1200,'#0e1430','#2a2350','#5a2a4a'],
  [1440,'#070a16','#0f1630','#241c3d']
];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgbS=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function renderSky(){
  const min=currentMin();
  let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=min) i++;
  const [m0,a0,b0,c0]=KEYS[i], [m1,a1,b1,c1]=KEYS[i+1];
  const t=(min-m0)/(m1-m0);
  const A=mix(hex(a0),hex(a1),t), B=mix(hex(b0),hex(b1),t), C=mix(hex(c0),hex(c1),t);
  const root=document.documentElement.style;
  root.setProperty('--bg-a',rgbS(A));
  root.setProperty('--bg-b',rgbS(B));
  root.setProperty('--bg-c',rgbS(C));
  // star visibility from top-colour luminance
  const lum=(0.2126*A[0]+0.7152*A[1]+0.0722*A[2])/255;
  const star=Math.max(0,Math.min(1,(0.34-lum)/0.24));
  root.setProperty('--star',star.toFixed(3));
}

/* ---------- period + poem ---------- */
function periodOf(min){
  const h=Math.floor(min/60);
  if(h>=23||h<5) return 'deep night';
  if(h<8) return 'dawn';
  if(h<12) return 'morning';
  if(h<14) return 'midday';
  if(h<17) return 'afternoon';
  if(h<20) return 'dusk';
  return 'evening';
}
const POOLS={
  'deep night':{
    s:['the house','a distant siren','the moon','one stubborn star','the refrigerator','the dark','a passing truck','the ceiling'],
    v:['keeps its vigil over','turns slowly above','hums beneath','slides across','counts the hours with','leans against','drifts past'],
    o:['the long blue quiet','a street no one is walking','the last awake window','the garden\u2019s soft static','rooftops holding their breath','hours with nowhere to go','the patient cold']
  },
  'dawn':{
    s:['the first light','the blue hour','the horizon','a single bird','the mist','the kettle'],
    v:['loosens the night over','spills honey along','rehearses its colors on','lifts the fog from','tests its voice across','warms the silence of'],
    o:['the wet avenues','a thousand sleeping chimneys','the far edge of the river','the bare orchard rows','the town\u2019s heaviest hour','the window\u2019s cold glass']
  },
  'morning':{
    s:['the morning','the radio','the traffic','the sunlight','the coffee','the sidewalks'],
    v:['climbs brightly over','fills the kitchen with','picks up speed along','sharpens the shadows of','gathers the sleep from','writes its gold across'],
    o:['a schedule of small errands','the rush of open doors','the long bright avenues','the day\u2019s first promises','wet pavement turning silver','mugs and plans and pigeons']
  },
  'midday':{
    s:['the sun','noon','the heat','a white sky','the city','the light'],
    v:['stands directly over','flattens the shadows of','pours itself across','hums at the center of','bleaches the details from','holds still above'],
    o:['the hour\u2019s shortest shade','an unhurried sprawl of streets','the flat and patient concrete','the lunchtime trickle of footprints','the square bright courtyard','every window at once']
  },
  'afternoon':{
    s:['the afternoon','the wind','long shadows','a lawnmower','the light','the warm concrete'],
    v:['tilts gently through','loosens its grip on','bends the hours across','carries dust above','lengthens itself along','pours down the length of'],
    o:['the lazy side of the day','half-closed shutters','an unhurried conversation of trees','the errands not yet run','the slow slide of the park','the west wall\u2019s warm face']
  },
  'dusk':{
    s:['the light','the dusk','the streetlamps','a tide of color','the sky','the first star'],
    v:['is leaving the rooftops by','turns the windows to','leans amber against','settles rose over','rehearses its ending above','gives the keys to'],
    o:['one tile at a time','a short-lived brass','the shoulders of homeward walkers','the blue hour\u2019s soft machinery','the evening\u2019s quiet ledger','what the day agreed to keep']
  },
  'evening':{
    s:['the evening','a window\u2019s glow','the television','the cool air','the moonrise','the last light'],
    v:['folds itself quietly into','cools the stones of','keeps its small warmth in','draws its curtains over','hums low along','settles the dust of'],
    o:['the house\u2019s warmer rooms','the long table','a sky going back to black','the hush after the traffic','the silver of late streets','the hours best spent indoors']
  }
};
const lineA=document.getElementById('lineA'), lineB=document.getElementById('lineB');
const periodName=document.getElementById('periodName');
let front=lineA, lastLine='', lastPeriod='';
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function composeLine(){
  const per=periodOf(currentMin());
  const p=POOLS[per];
  let line;
  do{ line=`${pick(p.s)} ${pick(p.v)} ${pick(p.o)}.`; }while(line===lastLine);
  lastLine=line;
  front.classList.remove('show'); front.classList.add('out');
  const back=front===lineA?lineB:lineA;
  back.textContent=line;
  back.classList.remove('out');
  void back.offsetWidth;
  back.classList.add('show');
  front=back;
  periodName.textContent=per;
  lastPeriod=per;
}
setInterval(()=>{ composeLine(); }, 18000);
document.getElementById('frame').addEventListener('click',()=>composeLine());

/* ---------- letter rain ---------- */
const rain=document.getElementById('rain');
const rctx=rain.getContext('2d');
let drops=[];
function sizeRain(){
  const dpr=window.devicePixelRatio||1;
  rain.width=Math.round(innerWidth*dpr); rain.height=Math.round(innerHeight*dpr);
  rain.style.width=innerWidth+'px'; rain.style.height=innerHeight+'px';
  rctx.setTransform(dpr,0,0,dpr,0,0);
}
sizeRain(); addEventListener('resize',sizeRain);
const GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function spawnRain(){
  if(REDUCE) return;
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ffd68a';
  for(let i=0;i<90;i++){
    drops.push({
      x:Math.random()*innerWidth,
      y:-30-Math.random()*innerHeight*0.35,
      vx:(Math.random()-0.5)*46,
      vy:30+Math.random()*90,
      g:220+Math.random()*260,
      r:(Math.random()-0.5)*0.9,
      vr:(Math.random()-0.5)*3.4,
      s:13+Math.random()*22,
      ch:GLYPHS[(Math.random()*26)|0],
      accent, born:performance.now()
    });
  }
}
function stepRain(dt,now){
  if(!drops.length) return;
  rctx.clearRect(0,0,innerWidth,innerHeight);
  const mid=innerHeight/2, fadeH=innerHeight*0.36;
  rctx.textAlign='center'; rctx.textBaseline='middle';
  drops=drops.filter(d=>{
    d.vy+=d.g*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.r+=d.vr*dt;
    let a=1;
    if(d.y>mid) a=Math.max(0,1-(d.y-mid)/fadeH);
    if(a<=0||d.y>innerHeight+40) return false;
    rctx.save();
    rctx.translate(d.x,d.y); rctx.rotate(d.r);
    rctx.font=`800 ${d.s}px "Helvetica Neue","Avenir Next",Futura,"Segoe UI",system-ui,sans-serif`;
    rctx.globalAlpha=a;
    rctx.shadowColor=d.accent; rctx.shadowBlur=14*a;
    rctx.fillStyle=d.accent;
    rctx.fillText(d.ch,0,0);
    rctx.restore();
    return true;
  });
  if(!drops.length) rctx.clearRect(0,0,innerWidth,innerHeight);
}

/* ---------- controls ---------- */
document.getElementById('themeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.documentElement.dataset.theme=b.dataset.theme;
  document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('on',x===b));
});
document.getElementById('fmtSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  fmt12=b.dataset.fmt==='12';
  document.querySelectorAll('#fmtSeg button').forEach(x=>x.classList.toggle('on',x===b));
  renderWords(); renderReadout();
});
const scrub=document.getElementById('scrub');
const nowBtn=document.getElementById('nowBtn');
scrub.addEventListener('input',()=>{
  live=false; scrubMin=+scrub.value; nowBtn.classList.remove('watched');
  refresh(true);
});
nowBtn.addEventListener('click',()=>{
  live=true; scrub.value=nowMin(); nowBtn.classList.add('watched');
  refresh(true);
});

/* ---------- main tick ---------- */
function refresh(justMinute){
  const min=currentMin();
  renderWords(); renderSky(); renderReadout();
  const per=periodOf(min);
  if(per!==lastPeriod){ periodName.textContent=per; }
  if(justMinute) return;
  const minuteKey=String(min);
  if(lastMinuteKey!==null && minuteKey!==lastMinuteKey){ spawnRain(); composeLine(); }
  lastMinuteKey=minuteKey;
}
scrub.value=nowMin();
refresh(true);
composeLine();
setInterval(()=>refresh(false),1000);
let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  stepRain(dt,t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
