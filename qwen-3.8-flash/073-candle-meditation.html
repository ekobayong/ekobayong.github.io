<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Flame — Candle Breathing Guide</title>
<style>
  :root{
    --breath: .78;
    --bend: 0;
    --glow: 0;
    --parchment: #e9d8c3;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, ui-serif, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(120% 85% at 50% 118%, rgba(58,30,16,.85), transparent 60%),
      linear-gradient(180deg, #0a0503 0%, #120a07 32%, #160c08 68%, #120a07 100%);
    font-family: var(--serif);
    color: var(--parchment);
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- room ---------- */
  .wall{
    position:fixed; inset:0; pointer-events:none;
    background: linear-gradient(180deg, #241309 0%, #2a1710 46%, #201009 74%, #180b06 100%);
  }
  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(52vmax 42vmax at 50% 62%,
        rgba(255,150,60, calc(0.34 * var(--glow))) 0%,
        rgba(255,132,50, calc(0.13 * var(--glow))) 38%,
        rgba(120,60,20,  calc(0.05 * var(--glow))) 66%,
        transparent 78%),
      radial-gradient(80vmax 46vmax at 50% 96%,
        rgba(255,120,40, calc(0.10 * var(--glow))) 0%,
        transparent 62%);
    mix-blend-mode: screen;
  }
  .table{
    position:fixed; left:-50vw; right:-50vw; bottom:-22vh; height:56vh; z-index:1;
    transform: perspective(62vh) rotateX(56deg);
    transform-origin: top center;
    background:
      radial-gradient(46% 34% at 50% 12%,
        rgba(255,150,60, calc(0.30 * var(--glow))) 0%,
        rgba(255,120,45, calc(0.10 * var(--glow))) 45%,
        transparent 74%),
      linear-gradient(180deg, #221209 0%, #1c0f0a 30%, #150a06 100%);
    border-top: 1px solid rgba(233,216,195,.06);
  }
  .vignette{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(115% 95% at 50% 44%, transparent 44%, rgba(4,2,1,.62) 100%);
  }

  /* ---------- scene / candle ---------- */
  .scene{
    position:fixed; inset:0; z-index:3;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{
    position:relative;
    width: clamp(240px, 58vmin, 470px);
    height: clamp(300px, 68vmin, 560px);
  }
  .ring{ position:absolute; inset:-13%; width:126%; height:126%; pointer-events:none; }
  .r-track{ fill:none; stroke:rgba(233,216,195,.09); stroke-width:1.6; }
  .r-dash  { fill:none; stroke:rgba(233,216,195,.17); stroke-width:1; stroke-dasharray:2 6; }
  .r-prog  { fill:none; stroke:rgba(255,176,92,.55); stroke-width:3; stroke-linecap:round; }

  .candle{ position:absolute; left:50%; bottom:10%; transform:translateX(-50%); cursor:pointer; }
  .body{
    position:relative;
    width: clamp(46px, 11.5vmin, 72px);
    height: clamp(140px, 33vmin, 218px);
    background: linear-gradient(90deg,#b8977a 0%,#e3c5a6 15%,#fbe9d4 40%,#f2dcc2 55%,#c9a789 82%,#8a6c50 100%);
    border-radius: 11px 11px 5px 5px;
    box-shadow: inset 0 10px 20px rgba(255,214,160,.30), inset 0 -32px 40px rgba(58,28,10,.52), 0 16px 32px rgba(0,0,0,.55);
  }
  .body::before{
    content:""; position:absolute; left:0; right:0; top:0;
    height: clamp(13px,3.4vmin,20px); border-radius:50%;
    background: radial-gradient(60% 130% at 50% 40%, #fff2da, #eed3ae 55%, #cba87f 100%);
    box-shadow: 0 0 15px rgba(255,180,100,.30), inset 0 -2px 5px rgba(122,78,38,.42);
  }
  .drip{
    position:absolute; top:36%; border-radius:42% 42% 50% 50%;
    background: linear-gradient(90deg,#e6cba6,#f9ead2 55%,#caa880);
    box-shadow: 0 2px 4px rgba(0,0,0,.38);
    will-change: height;
  }
  .wick{
    position:absolute; left:50%; top:0;
    width:3px; height: clamp(14px,3.4vmin,20px);
    transform: translate(-50%,-97%); border-radius:2px;
    background: linear-gradient(180deg,#0c0805 0%, #2b1c11 55%, #4a3423 100%);
  }
  .wick::after{
    content:""; position:absolute; left:50%; top:-1px; width:7px; height:7px;
    border-radius:50%; transform:translate(-50%,-50%);
    background:#ff9b3d; box-shadow:0 0 10px 3px rgba(255,155,61,.85);
    opacity: var(--ember, 0); transition: opacity .12s linear;
  }
  .ember-glow{
    position:absolute; left:50%; top:0; width:26px; height:26px;
    transform:translate(-50%,-50%); border-radius:50%;
    background: radial-gradient(circle, rgba(255,155,61,.75), rgba(255,120,40,.25) 45%, transparent 70%);
    opacity: calc(var(--ember, 0) * .8); pointer-events:none;
  }

  .flame{
    position:absolute; left:50%; bottom:100%;
    width:0; height:0;
    transform-origin: 50% 100%;
    transform: translateX(-50%)
      scale(calc(var(--breath) * (1 - .45 * var(--bend))))
      skewX(calc(-28deg * var(--bend)))
      rotate(calc(-14deg * var(--bend)));
    filter: hue-rotate(0deg);
    will-change: transform, filter;
  }
  .flame.pop{ animation: pop .55s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{ 0%{ scale: .25; } 60%{ scale: 1.12; } 100%{ scale: 1; } }
  .layer{ position:absolute; left:50%; bottom:0; transform-origin:50% 100%; transform:translateX(-50%); pointer-events:none; }
  .f-glow{
    width:28vmin; height:36vmin; bottom:-8vmin;
    border-radius:50%;
    background: radial-gradient(circle at 50% 60%, rgba(255,150,55,.55), rgba(255,110,30,.18) 42%, transparent 70%);
    filter: blur(12px);
    mix-blend-mode: screen;
  }
  .f-outer{
    width:7vmin; height:18vmin;
    border-radius: 50% / 62% 62% 38% 38%;
    background: linear-gradient(180deg, #ff9a2e 0%, #ff7a1f 45%, #e84a12 78%, #b52d0e 100%);
    opacity:.92; filter: blur(2.4px);
    animation: fO var(--d1,2s) ease-in-out infinite;
  }
  .f-mid{
    width:4.4vmin; height:12.5vmin; bottom:.4vmin;
    border-radius: 50% / 62% 62% 38% 38%;
    background: linear-gradient(180deg, #ffe493 0%, #ffc44d 55%, #ff9432 100%);
    opacity:.95; filter: blur(1.1px);
    animation: fM var(--d2,1.4s) ease-in-out infinite;
  }
  .f-core{
    width:2.3vmin; height:8vmin; bottom:.3vmin;
    border-radius: 50% / 60% 60% 40% 40%;
    background: linear-gradient(180deg, #fffdf4 0%, #fff1bd 62%, #ffd873 100%);
    filter: blur(.4px);
    animation: fC var(--d3,.95s) ease-in-out infinite;
  }
  .f-base{
    width:4.2vmin; height:3.4vmin; bottom:-.2vmin;
    border-radius:50%;
    background: radial-gradient(circle at 50% 72%, rgba(160,205,255,.85), rgba(70,130,255,.4) 55%, transparent 72%);
    filter: blur(1.3px);
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:8;
    padding: clamp(16px,3.4vmin,30px) clamp(18px,4vmin,40px) 0;
    text-align:center; pointer-events:none;
  }
  h1{
    margin:0; font-weight:300; font-size: clamp(15px,2.4vmin,20px);
    letter-spacing:.32em; font-variant:small-caps; text-indent:.32em;
    color: var(--parchment);
  }
  .sub{
    margin:.55em 0 0; font-family:var(--sans); font-size:9.5px;
    letter-spacing:.22em; text-transform:uppercase; color:rgba(233,216,195,.42);
  }

  /* ---------- breathing guide ---------- */
  .guide{
    position:fixed; left:50%; top:20.5%; z-index:7;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-align:center; pointer-events:none;
  }
  .cues{ position:relative; height: clamp(30px,5.6vmin,40px); display:grid; place-items:center; }
  .cue{
    grid-area:1/1; margin:0; font-weight:300; font-size: clamp(19px,3.9vmin,30px);
    letter-spacing:.28em; text-indent:.28em; font-variant:small-caps; white-space:nowrap;
    opacity:0; transition: opacity 1s ease;
    color: var(--parchment);
  }
  .cue.on{ opacity:.95; }
  .count{
    font-family:var(--sans); font-size:12px; color:rgba(233,216,195,.5);
    font-variant-numeric: tabular-nums; letter-spacing:.14em;
  }

  /* ---------- controls ---------- */
  .controls{
    position:fixed; left:0; right:0; bottom:0; z-index:8;
    display:flex; flex-direction:column; align-items:center; gap: clamp(8px,1.6vmin,14px);
    padding: 0 16px clamp(16px,4.2vmin,36px);
  }
  .chips{ display:flex; gap:8px; }
  .chip{
    font-family:var(--sans); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(233,216,195,.58); background:rgba(233,216,195,.05);
    border:1px solid rgba(233,216,195,.14); border-radius:999px;
    padding:7px 13px; cursor:pointer; font-variant-numeric:tabular-nums;
    transition: color .25s, background .25s, border-color .25s;
  }
  .chip:hover{ color:rgba(233,216,195,.85); }
  .chip.active{ color:#1a0e07; background:#e9d8c3; border-color:#e9d8c3; }
  .begin{
    font-family:var(--serif); font-weight:300; font-size:13px;
    letter-spacing:.28em; text-indent:.28em; font-variant:small-caps;
    color:var(--parchment); background:rgba(233,216,195,.04);
    border:1px solid rgba(233,216,195,.38); border-radius:999px;
    padding:11px 34px; cursor:pointer;
    transition: background .3s, border-color .3s;
  }
  .begin:hover{ background:rgba(233,216,195,.12); }
  .begin.running{ border-color:rgba(255,176,92,.6); color:#ffd9a8; }
  .status{
    font-family:var(--sans); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(233,216,195,.42); display:flex; gap:10px; align-items:center;
    font-variant-numeric: tabular-nums;
  }
  .status .dot{ opacity:.5; }
  .hint{
    font-family:var(--sans); font-size:9px; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(233,216,195,.22); text-align:center; line-height:1.8;
  }
  .cueflash{
    position:fixed; left:50%; bottom: clamp(150px,26vmin,230px); transform:translateX(-50%);
    z-index:7; font-weight:300; font-size: clamp(15px,2.6vmin,20px);
    letter-spacing:.26em; text-indent:.26em; font-variant:small-caps; white-space:nowrap;
    color:#ffd9a8; opacity:0; transition:opacity 1s ease; pointer-events:none;
  }
  .cueflash.show{ opacity:.9; }
  #smoke{ position:fixed; inset:0; z-index:6; pointer-events:none; }

  /* ---------- short viewports ---------- */
  @media (max-height: 620px){
    .stage{ width:clamp(180px,42vmin,320px); height:clamp(200px,46vh,360px); }
    .guide{ top:17%; }
    .cue{ font-size:17px; }
    .controls{ gap:6px; padding-bottom:10px; }
    .hint{ display:none; }
    .chips .chip{ padding:5px 10px; }
    .begin{ padding:8px 24px; }
  }
  @media (prefers-reduced-motion: reduce){
    .f-outer,.f-mid,.f-core{ animation:none !important; }
    .flame{ filter:none !important; }
    .cue{ transition: opacity .3s ease; }
    .flame.pop{ animation:none; }
  }
</style>
</head>
<body>
  <div class="wall"></div>
  <div class="table"></div>
  <div class="glow"></div>

  <div class="topbar">
    <h1>Still Flame</h1>
    <p class="sub">breathe with the light</p>
  </div>

  <div class="scene">
    <div class="stage" id="stage">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="r-track" cx="50" cy="50" r="46.5"/>
        <circle class="r-dash"  cx="50" cy="50" r="42"/>
        <circle class="r-prog"  id="ringProg" cx="50" cy="50" r="46.5" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="candle" id="candle" title="click to light">
        <div class="wick"><span class="ember-glow"></span></div>
        <div class="flame" id="flame" aria-hidden="true">
          <div class="layer f-glow"></div>
          <div class="layer f-outer"></div>
          <div class="layer f-mid"></div>
          <div class="layer f-core"></div>
          <div class="layer f-base"></div>
        </div>
        <div class="body" id="cbody"></div>
      </div>
    </div>
  </div>

  <div class="guide">
    <div class="cues" id="cues" aria-live="polite">
      <p class="cue" data-k="in">Breathe in</p>
      <p class="cue" data-k="hold">Hold</p>
      <p class="cue" data-k="out">Breathe out</p>
      <p class="cue" data-k="rest">Rest</p>
    </div>
    <div class="count" id="count">&nbsp;</div>
  </div>
  <div class="cueflash" id="cueFlash"></div>

  <div class="controls">
    <div class="chips" role="group" aria-label="breathing pattern">
      <button class="chip active" data-pat="478" aria-pressed="true">4 · 7 · 8</button>
      <button class="chip" data-pat="box" aria-pressed="false">Box</button>
      <button class="chip" data-pat="calm" aria-pressed="false">Calm</button>
    </div>
    <button class="begin" id="beginBtn" aria-pressed="false">Begin</button>
    <div class="status">
      <span id="sessionT">00:00</span><span class="dot">·</span><span id="cycles">0 cycles</span>
    </div>
    <div class="hint">Hold the breath of air — press and hold anywhere, or the space bar, to blow — release to rest.</div>
  </div>

  <canvas id="smoke" aria-hidden="true"></canvas>
  <div class="vignette"></div>

<script>
(function(){
  'use strict';
  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- randomized flicker keyframes ---------- */
  function seedRng(seed){
    var s = seed >>> 0;
    return function(){ s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function flickRules(){
    if (reduce) return '';
    var rnd = seedRng(0xB10C + Math.floor(Math.random() * 65536));
    var css = '', i, k, tx, sc, sk;
    for (i = 0; i < 3; i++){
      css += '@keyframes f' + 'OMC'[i] + '{';
      for (k = 0; k <= 8; k++){
        tx = (rnd() * 2 - 1) * (2.4 + i * 0.9);
        sc = 0.94 + rnd() * 0.12;
        sk = (rnd() * 2 - 1) * 3.2;
        css += (k * 12.5) + '%{transform:translateX(-50%) translateX(' + tx.toFixed(2) +
               'vmin) scale(' + sc.toFixed(3) + ') skewX(' + sk.toFixed(2) + 'deg)}';
      }
      css += '}';
    }
    return css;
  }
  var st = document.createElement('style');
  st.textContent = flickRules();
  document.head.appendChild(st);

  var flameEl = document.getElementById('flame');
  if (!reduce){
    var d = [1.6 + Math.random()*0.9, 1.1 + Math.random()*0.55, 0.75 + Math.random()*0.4];
    root.style.setProperty('--d1', d[0].toFixed(2)+'s');
    root.style.setProperty('--d2', d[1].toFixed(2)+'s');
    root.style.setProperty('--d3', d[2].toFixed(2)+'s');
  }

  /* ---------- wax drips + geometry ---------- */
  var stage = document.getElementById('stage');
  var candleEl = document.getElementById('candle');
  var bodyEl = document.getElementById('cbody');
  var drips = [0, 1, 2].map(function(i){
    var el = document.createElement('div');
    el.className = 'drip';
    el.style.left = ['12%','44%','78%'][i];
    el.style.width = ['5px','4px','6px'][i];
    el.style.height = '8px';
    bodyEl.appendChild(el);
    return { el: el, rate: [0.28, 0.16, 0.36][i], max: [46, 30, 56][i], h: [8, 6, 9][i] };
  });

  var RING_C = 2 * Math.PI * 46.5;
  var ringProg = document.getElementById('ringProg');
  ringProg.style.strokeDasharray = RING_C;
  ringProg.style.strokeDashoffset = RING_C;

  function flameMetrics(){
    var sr = stage.getBoundingClientRect(), br = bodyEl.getBoundingClientRect();
    return {
      x: br.left + br.width/2 - sr.left,
      y: br.top - sr.top,
      s: br.width / 60
    };
  }

  /* ---------- breathing patterns ---------- */
  var PATTERNS = {
    '478': { name:'4 · 7 · 8',  phases:[['in',4],['hold',7],['out',8],['rest',0]] },
    'box': { name:'Box',        phases:[['in',4],['hold',4],['out',4],['hold',4]] },
    'calm':{ name:'Calm',       phases:[['in',5],['out',7],['rest',2]] }
  };
  var patternKey = '478';

  var BREATH_IN = 1.32, BREATH_OUT = 0.78;
  function easeIO(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }

  var running = false, phaseIdx = 0, phaseT = 0, phaseDur = 4;
  var cycles = 0, sessionT = 0, prevBreath = BREATH_OUT, breathNow = BREATH_OUT;
  var cueEls = {};
  Array.prototype.forEach.call(document.querySelectorAll('.cue'), function(el){ cueEls[el.dataset.k] = el; });
  var countEl = document.getElementById('count');
  var flashEl = document.getElementById('cueFlash');
  var beginBtn = document.getElementById('beginBtn');
  var sessionEl = document.getElementById('sessionT');
  var cyclesEl = document.getElementById('cycles');

  function flash(t){
    flashEl.textContent = t;
    flashEl.classList.add('show');
    setTimeout(function(){ flashEl.classList.remove('show'); }, 3400);
  }
  function setCue(k){
    for (var key in cueEls) cueEls[key].classList.toggle('on', key === k);
  }
  function setPattern(k){
    patternKey = k;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
      var on = c.dataset.pat === k;
      c.classList.toggle('active', on);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (running){ phaseIdx = 0; phaseT = 0; phaseDur = PATTERNS[k].phases[0][1]; setCue(PATTERNS[k].phases[0][0]); }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
    c.addEventListener('click', function(){ setPattern(c.dataset.pat); });
  });

  function toggleSession(){
    running = !running;
    beginBtn.textContent = running ? 'Rest' : 'Begin';
    beginBtn.classList.toggle('running', running);
    beginBtn.setAttribute('aria-pressed', running ? 'true' : 'false');
    if (running){
      phaseIdx = 0; phaseT = 0; phaseDur = PATTERNS[patternKey].phases[0][1];
      setCue(PATTERNS[patternKey].phases[0][0]);
      countEl.textContent = Math.ceil(phaseDur) + 's';
      flash('Begin — breathe in');
      if (!lit) light(true);
    } else {
      setCue(null); countEl.innerHTML = '&nbsp;';
      ringProg.style.strokeDashoffset = RING_C;
      flash('Return whenever you are ready');
    }
  }
  beginBtn.addEventListener('click', toggleSession);

  function stepBreath(dt){
    if (!running) return;
    var ph = PATTERNS[patternKey].phases[phaseIdx];
    phaseT += dt;
    while (phaseT >= phaseDur && phaseDur > 0){
      phaseT -= phaseDur;
      var cycleDone = (phaseIdx + 1 >= PATTERNS[patternKey].phases.length);
      phaseIdx = (phaseIdx + 1) % PATTERNS[patternKey].phases.length;
      if (cycleDone){
        cycles++;
        cyclesEl.textContent = cycles + (cycles === 1 ? ' cycle' : ' cycles');
        flash('Cycle ' + cycles + ' complete');
      }
      ph = PATTERNS[patternKey].phases[phaseIdx];
      phaseDur = ph[1];
      setCue(phaseDur > 0 ? ph[0] : null);
    }
    var frac = phaseDur > 0 ? phaseT / phaseDur : 1;
    var b;
    if (ph[0] === 'in')       b = BREATH_OUT + (BREATH_IN - BREATH_OUT) * easeIO(frac);
    else if (ph[0] === 'out') b = BREATH_IN - (BREATH_IN - BREATH_OUT) * easeIO(frac);
    else                      b = (prevBreath > 1.05) ? BREATH_IN : BREATH_OUT;
    breathNow = b;
    prevBreath = b;
    root.style.setProperty('--breath', b.toFixed(4));
    if (phaseDur > 0) countEl.textContent = String(Math.ceil(phaseDur - phaseT)).padStart(2,'0') + 's';
    ringProg.style.strokeDashoffset = (RING_C * (1 - ((phaseIdx + frac) / PATTERNS[patternKey].phases.length))).toFixed(2);
  }

  /* ---------- flame / smoke state ---------- */
  var lit = true, out = false, outT = 0, lightT = 1;
  var glow = 0, fx = 0, fy = 0, fscale = 1;
  var flick = 1, flickTarget = 1, flickTimer = 0;
  var hue = 0, bend = 0, blowing = false, blowT = 0;
  var emberTimer = 0;

  function light(instant){
    if (lit) return;
    lit = true; out = false; lightT = instant ? 1 : 0;
    flameEl.classList.remove('pop');
    void flameEl.offsetWidth;
    if (!instant && !reduce) flameEl.classList.add('pop');
    setCue(null);
    flash('The flame returns');
  }
  function extinguish(){
    if (out) return;
    out = true; outT = 0; lit = false;
    setCue(null);
    countEl.innerHTML = '&nbsp;';
    emberTimer = 1.2;
    flash('Rest in the dark — click the candle to relight');
  }
  candleEl.addEventListener('click', function(e){ e.stopPropagation(); if (!lit) light(false); });

  function startBlow(){ blowing = true; }
  function stopBlow(){ blowing = false; blowT = 0; }
  window.addEventListener('pointerdown', function(e){
    if (e.button !== 0) return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    startBlow();
  });
  window.addEventListener('pointerup', function(){ stopBlow(); });
  window.addEventListener('pointercancel', function(){ stopBlow(); });
  window.addEventListener('blur', function(){ stopBlow(); });
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space'){
      if (e.target && e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      if (!lit){ light(false); return; }
      startBlow();
    }
  });
  window.addEventListener('keyup', function(e){
    if (e.code === 'Space' && lit) stopBlow();
  });

  /* ---------- smoke ---------- */
  var smokeCanvas = document.getElementById('smoke');
  var sctx = smokeCanvas.getContext('2d');
  var particles = [], smokeTimer = 0;
  function sizeSmoke(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    smokeCanvas.width = Math.round(innerWidth * dpr);
    smokeCanvas.height = Math.round(innerHeight * dpr);
    smokeCanvas.style.width = innerWidth + 'px';
    smokeCanvas.style.height = innerHeight + 'px';
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', sizeSmoke);
  sizeSmoke();

  function spawnPuff(t){
    var m = flameMetrics();
    particles.push({
      x: m.x + (Math.random()*6 - 3),
      y: m.y - 4 * m.s,
      vx: (Math.random()*2 - 1) * 5,
      vy: -(16 + Math.random()*16),
      r: 1.8 + Math.random()*3,
      age: 0,
      life: (reduce ? 2.2 : 3.6) + Math.random()*1.6,
      sway: 0.6 + Math.random()*1.4,
      phase: Math.random()*6.28
    });
  }
  function stepSmoke(dt){
    if (out){
      smokeTimer -= dt;
      if (smokeTimer <= 0 && outT < (reduce ? 1.6 : 5)){
        smokeTimer = reduce ? 0.3 : 0.05;
        spawnPuff();
      }
    }
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life){ particles.splice(i,1); continue; }
      p.x += (p.vx + Math.sin(p.phase + p.age * p.sway) * 10) * dt;
      p.y += p.vy * dt;
      p.vy *= (1 - 0.22 * dt);
      p.r  += 6.5 * dt;
    }
  }
  function drawSmoke(){
    sctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!particles.length) return;
    sctx.globalCompositeOperation = 'source-over';
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var t = p.age / p.life;
      var alpha = 0.16 * Math.sin(Math.PI * Math.min(1, t * 1.15));
      var r = p.r * (1 + t * 2.6);
      var g = sctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      var grey = Math.round(168 - t * 46);
      g.addColorStop(0, 'rgba(' + grey + ',' + grey + ',' + (grey+6) + ',' + alpha.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(120,120,126,0)');
      sctx.fillStyle = g;
      sctx.beginPath();
      sctx.arc(p.x, p.y, r, 0, 6.2832);
      sctx.fill();
    }
  }

  /* ---------- main loop ---------- */
  function fmtTime(s){
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }
  function tick(now){
    requestAnimationFrame(tick);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;

    /* flicker target update */
    flickTimer -= dt;
    if (flickTimer <= 0){ flickTimer = 0.055; flickTarget = 0.82 + Math.random() * 0.30; }
    flick += (flickTarget - flick) * Math.min(1, dt * 9);

    /* blow */
    if (blowing && lit && !out){
      blowT += dt;
      bend += (1 - bend) * Math.min(1, dt * 3.2);
      if (blowT > 1.5) extinguish();
    } else {
      bend += (0 - bend) * Math.min(1, dt * 3.4);
    }
    root.style.setProperty('--bend', bend.toFixed(4));

    /* flame scale / glow */
    if (!lit){
      outT += dt;
    } else if (lightT < 1){
      lightT = Math.min(1, lightT + dt / 0.5);
    }
    flameEl.style.opacity = (out ? Math.max(0, 1 - outT/0.28) : 1).toFixed(3);
    var popScale = (!lit && !reduce) ? Math.max(0, 1 - outT / 0.32) : 1;
    if (popScale < 1) flameEl.style.scale = popScale;
    else if (flameEl.style.scale) flameEl.style.removeProperty('scale');

    var glowTarget = lit ? (flick * breathNow * (1 - 0.62 * bend) * lightT) : 0;
    glow += (glowTarget - glow) * Math.min(1, dt * (lit ? 7 : 3.2));
    root.style.setProperty('--glow', glow.toFixed(4));

    if (!reduce){
      hue += dt * 7;
      flameEl.style.filter = 'hue-rotate(' + (Math.sin(hue * 0.9) * 6 + Math.sin(hue * 0.23) * 4).toFixed(2) + 'deg)';
    }

    /* wax */
    if (lit){
      for (var i = 0; i < drips.length; i++){
        var d = drips[i];
        if (d.h < d.max){ d.h = Math.min(d.max, d.h + d.rate * dt); d.el.style.height = d.h.toFixed(2) + 'px'; }
      }
    }

    /* ember */
    if (emberTimer > 0){
      emberTimer -= dt;
      var pulse = Math.max(0, emberTimer / 1.2);
      var flickr = 0.55 + 0.45 * Math.sin(now / 46);
      root.style.setProperty('--ember', (pulse * flickr).toFixed(3));
    } else if (parseFloat(root.style.getPropertyValue('--ember') || '0') !== 0){
      root.style.setProperty('--ember', '0');
    }

    /* smoke */
    stepSmoke(dt);
    drawSmoke();

    /* session */
    if (running){
      sessionT += dt;
      sessionEl.textContent = fmtTime(sessionT);
    }
    stepBreath(dt);
  }
  var last = performance.now();

  /* initial room warm-up */
  glow = 0;
  requestAnimationFrame(tick);
  setCue(null);
})();
</script>
</body>
</html>
