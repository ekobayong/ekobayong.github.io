<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakura Drift — Cherry Blossom Scene</title>
<style>
  :root{
    --sky-top:#cfe3f5;
    --sky-mid:#f3dfe8;
    --sky-hor:#fbeee6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Iowan Old Style',Palatino,Georgia,'Times New Roman',serif;
    color:#2f2b52;
    background:#e9e4ee;
  }
  #sky{position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-hor) 100%);
  }
  #sun{position:fixed;z-index:1;width:190px;height:190px;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,252,240,.95) 0%, rgba(255,236,190,.65) 28%, rgba(255,220,160,.28) 48%, rgba(255,220,160,0) 70%);
  }
  #haze{position:fixed;z-index:1;left:0;right:0;bottom:17%;height:130px;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.5) 78%, rgba(255,255,255,.62) 100%);
  }
  #scene{position:fixed;inset:0;z-index:2;width:100%;height:100%;display:block}
  #petals{position:fixed;inset:0;z-index:3;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

  /* ---------- text layer ---------- */
  #haiku{
    position:fixed;z-index:4;top:34px;right:30px;
    writing-mode:vertical-rl;text-orientation:mixed;
    font-style:italic;color:#2f2b52;
    font-size:clamp(13px,1.5vw,17px);letter-spacing:.24em;
    display:flex;gap:14px;max-height:calc(100vh - 160px);
    pointer-events:none;
  }
  #haiku .hl{margin:0;opacity:.92}
  #haiku .ch{
    display:inline-block;opacity:0;transform:translateY(-10px);
    transition:opacity .5s ease, transform .5s cubic-bezier(.16,.84,.44,1);
  }
  #haiku .ch.in{opacity:1;transform:translateY(0)}
  .brand{position:fixed;z-index:4;left:34px;bottom:30px;pointer-events:none}
  .brand h1{
    font-weight:normal;font-size:clamp(26px,4.4vw,46px);letter-spacing:.02em;color:#2f2b52;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .brand h1 em{color:#e2698c}
  .brand .sub{
    margin-top:6px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(47,43,82,.62);
  }
  #sakura{
    position:fixed;z-index:4;right:26px;bottom:18px;font-size:30vh;line-height:1;
    color:rgba(47,43,82,.075);pointer-events:none;user-select:none;
  }
  #hint{
    position:fixed;z-index:5;left:50%;bottom:34px;transform:translateX(-50%);
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(47,43,82,.55);
    background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.5);
    padding:8px 18px;border-radius:999px;backdrop-filter:blur(6px);
    transition:opacity 1.2s ease;pointer-events:none;white-space:nowrap;
  }
  #hint.gone{opacity:0}
  @media (max-width:620px){
    #haiku{top:20px;right:14px;gap:9px;letter-spacing:.16em}
    .brand{left:18px;bottom:calc(17vh + 14px)}
    #sakura{right:8px;bottom:calc(17vh + 4px);font-size:22vh}
    #hint{font-size:10px;letter-spacing:.12em;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  }
</style>
</head>
<body>
<div id="sky"></div>
<div id="sun"></div>
<div id="haze"></div>

<svg id="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMinYMax slice" aria-hidden="true">
  <defs>
    <filter id="mistFar" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="mistNear" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.6"/></filter>
    <filter id="pagodaBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="bloomSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="bl1" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fff3f6"/><stop offset="52%" stop-color="#f7c8d4"/><stop offset="100%" stop-color="#e2698c"/>
    </radialGradient>
    <radialGradient id="bl2" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fbe0e8"/><stop offset="52%" stop-color="#f1b3c4"/><stop offset="100%" stop-color="#c9527a"/>
    </radialGradient>
    <radialGradient id="bl3" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="52%" stop-color="#fbd9e2"/><stop offset="100%" stop-color="#e98aa6"/>
    </radialGradient>
  </defs>

  <!-- distant mist-blurred hills -->
  <g id="hills">
    <path d="M-20 472 Q 140 420 320 452 T 660 434 T 1020 458 L 1020 610 L -20 610 Z"
          fill="#b9b3d1" opacity=".5" filter="url(#mistFar)"/>
    <path d="M-20 505 Q 210 462 420 492 T 780 478 T 1020 500 L 1020 610 L -20 610 Z"
          fill="#b9b3d1" opacity=".42" filter="url(#mistNear)"/>
  </g>

  <!-- three-tiered pagoda silhouette -->
  <g id="pagoda" fill="#8f88b3" opacity=".85" filter="url(#pagodaBlur)">
    <rect x="666" y="466" width="68" height="26"/>
    <path d="M646 468 Q672 452 700 448 Q728 452 754 468 Q700 480 646 468 Z"/>
    <rect x="674" y="428" width="52" height="26"/>
    <path d="M656 430 Q678 416 700 412 Q722 416 744 430 Q700 441 656 430 Z"/>
    <rect x="682" y="394" width="36" height="24"/>
    <path d="M666 396 Q684 382 700 378 Q716 382 734 396 Q700 406 666 396 Z"/>
    <rect x="698" y="356" width="4" height="24"/>
    <circle cx="700" cy="354" r="4"/>
    <rect x="654" y="490" width="92" height="6" opacity=".7"/>
  </g>

  <!-- trees: indigo branch work, strokes tapering 28 → 4 -->
  <g id="trees" fill="none" stroke="#2f2b52" stroke-linecap="round">
    <path d="M110 610 C116 552 94 508 126 446" stroke-width="28"/>
    <path d="M126 446 C142 410 136 384 162 350" stroke-width="20"/>
    <path d="M126 446 C100 410 68 400 40 372" stroke-width="15"/>
    <path d="M162 350 C194 322 210 312 240 292" stroke-width="12"/>
    <path d="M162 350 C200 342 244 352 294 330" stroke-width="10"/>
    <path d="M240 292 C268 268 288 258 320 238" stroke-width="8"/>
    <path d="M40 372 C28 350 20 344 10 332" stroke-width="6"/>
    <path d="M70 398 C58 366 50 352 38 322" stroke-width="7"/>
    <path d="M240 292 C252 262 258 250 264 224" stroke-width="5"/>
    <path d="M294 330 C322 318 332 300 344 278" stroke-width="6"/>
    <path d="M294 330 C314 346 334 350 358 344" stroke-width="5"/>
    <path d="M320 238 C338 226 346 214 352 198" stroke-width="4"/>
    <path d="M162 350 C158 322 162 306 172 286" stroke-width="6"/>
    <path d="M126 446 C90 440 66 444 40 456" stroke-width="8"/>
    <path d="M556 610 C556 566 546 542 562 506" stroke-width="14"/>
    <path d="M562 506 C578 482 592 472 612 458" stroke-width="7"/>
    <path d="M562 506 C546 486 540 478 528 460" stroke-width="6"/>
    <path d="M612 458 C624 440 628 432 636 416" stroke-width="4"/>
    <path d="M528 460 C516 442 512 436 504 418" stroke-width="4"/>
    <path d="M612 458 C620 462 634 466 646 462" stroke-width="4"/>
  </g>

  <!-- blossom clusters injected by script -->
  <g id="bloomBack" filter="url(#bloomSoft)"></g>
  <g id="bloomFront"></g>
</svg>

<canvas id="petals"></canvas>

<div id="haiku" aria-label="Haiku: petals let go first / the branch remembers nothing / the river keeps all">
  <p class="hl">petals let go first</p>
  <p class="hl">the branch remembers nothing</p>
  <p class="hl">the river keeps all</p>
</div>

<div class="brand">
  <h1>Sakura <em>Drift</em></h1>
  <p class="sub">A quiet Japanese spring afternoon</p>
</div>
<div id="sakura" aria-hidden="true">桜</div>
<div id="hint">Move to stir the breeze · click for a gust</div>

<script>
(function(){
  'use strict';
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';
  var skyEl = document.getElementById('sky');
  var sunEl = document.getElementById('sun');
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');

  var W = 0, H = 0, DPR = 1, RIVER = 0;

  /* svg user-space → screen mapping (xMinYMax slice) */
  var scale = 1, offY = 0;
  function mappy(){
    scale = Math.max(W/1000, H/600);
    offY = H - 600*scale;               /* yMax: bottom-anchored */
  }
  function toScreen(x, y){ return {x: x*scale, y: offY + y*scale}; }

  /* ---------- blossom clusters on the SVG ---------- */
  var ANCHORS = [
    [40,372],[10,332],[38,322],[26,352],[62,406],
    [162,350],[240,292],[320,238],[352,198],[264,224],[292,330],[344,278],[358,344],
    [172,286],[150,318],[208,318],[280,268],[310,252],[126,446],[90,440],[46,452],
    [224,338],[190,300],[140,390],
    [612,458],[636,416],[528,460],[504,418],[562,506],[646,462],[590,472],[544,470]
  ];
  function scatterBlossoms(){
    var back = document.getElementById('bloomBack');
    var front = document.getElementById('bloomFront');
    var grads = ['url(#bl1)','url(#bl2)','url(#bl3)'];
    var n = 0;
    for (var a = 0; a < ANCHORS.length; a++){
      var ax = ANCHORS[a][0], ay = ANCHORS[a][1];
      var big = ax < 400;                       /* the large tree gets denser crowns */
      var count = big ? 9 + ((a*7)%4) : 6;
      for (var c = 0; c < count; c++){
        var ang = (a*2.39996 + c*1.618) % (Math.PI*2);   /* deterministic swirl */
        var rad = 4 + (c%4)*6.2 + ((a+c)*3.77)%7;
        var x = ax + Math.cos(ang)*rad, y = ay + Math.sin(ang)*rad*0.82;
        var r = 2.6 + ((a*13 + c*7) % 37)/37 * 3.6;
        var gIdx = (a + c) % 3;
        var cir = document.createElementNS(NS, 'circle');
        cir.setAttribute('cx', x.toFixed(1));
        cir.setAttribute('cy', y.toFixed(1));
        cir.setAttribute('r', r.toFixed(1));
        cir.setAttribute('fill', grads[gIdx]);
        if (++n % 3 === 0) front.appendChild(cir); else back.appendChild(cir);
      }
    }
    /* a few white petal-shaped highlight ellipses */
    for (var e = 0; e < 26; e++){
      var p = ANCHORS[e % ANCHORS.length];
      var ell = document.createElementNS(NS, 'ellipse');
      var ex = p[0] + Math.sin(e*2.7)*14, ey = p[1] + Math.cos(e*3.3)*11;
      ell.setAttribute('cx', ex.toFixed(1));
      ell.setAttribute('cy', ey.toFixed(1));
      ell.setAttribute('rx', 4.2); ell.setAttribute('ry', 1.9);
      ell.setAttribute('fill', '#ffffff'); ell.setAttribute('opacity', '.55');
      ell.setAttribute('transform', 'rotate(' + ((e*53)%180 - 90) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ')');
      front.appendChild(ell);
    }
  }
  scatterBlossoms();

  /* ---------- canopy anchor screen points ---------- */
  var canopy = [];
  function updateCanopy(){
    canopy = ANCHORS.slice(0, 24).map(function(p){ return toScreen(p[0], p[1]); });
  }

  /* ---------- sky / sun cycle ---------- */
  var MORNING = [[0xcf,0xe3,0xf5],[0xf3,0xdf,0xe8],[0xfb,0xee,0xe6]];
  var GOLDEN  = [[0xe9,0xc9,0xa8],[0xf6,0xd9,0xb4],[0xfb,0xe5,0xc9]];
  function mix(a, b, t){ return [
    Math.round(a[0] + (b[0]-a[0])*t),
    Math.round(a[1] + (b[1]-a[1])*t),
    Math.round(a[2] + (b[2]-a[2])*t)
  ]; }
  function rgb(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  var phaseG = 0, sunX = 0.1;
  function updateSky(u){
    var g = 0.5 - 0.5*Math.cos(u*Math.PI*2);
    phaseG = g;
    skyEl.style.setProperty('--sky-top', rgb(mix(MORNING[0], GOLDEN[0], g)));
    skyEl.style.setProperty('--sky-mid', rgb(mix(MORNING[1], GOLDEN[1], g)));
    skyEl.style.setProperty('--sky-hor', rgb(mix(MORNING[2], GOLDEN[2], g)));
    /* sun along a bezier arc, lower-left → upper-right */
    var s = u;
    var inv = 1 - s;
    var px = inv*inv*6 + 2*inv*s*30 + s*s*88;
    var py = inv*inv*78 + 2*inv*s*14 + s*s*11;
    sunX = px/100;
    var edge = Math.min(1, Math.min(s, 1-s)/0.035);
    sunEl.style.left = px + '%';
    sunEl.style.top = py + '%';
    sunEl.style.opacity = (0.55 + 0.45*g) * edge;
    sunEl.style.transform = 'translate(-50%,-50%) scale(' + (0.9 + 0.25*g) + ')';
  }

  /* ---------- petals ---------- */
  var petals = [], targetN = 150;
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function newPetal(x, y){
    return {
      x: x !== undefined ? x : rnd(-40, W+40),
      y: y !== undefined ? y : rnd(-H, -10),
      z: rnd(0.28, 1),
      rot: rnd(0, Math.PI*2),
      rv: rnd(-0.9, 0.9),
      ph: rnd(0, Math.PI*2),
      sv: rnd(0.5, 1.4),
      flip: rnd(0, Math.PI*2),
      flv: rnd(1.4, 3.2),
      vx: 0, vy: 0,
      grad: Math.random() < 0.5 ? 'A' : 'B',
      state: 'fall',
      bob: rnd(0, Math.PI*2)
    };
  }
  function seedPetals(n){
    petals = [];
    for (var i=0;i<n;i++) petals.push(newPetal(rnd(0,W), rnd(-H*0.2, H*0.8)));
  }
  function spawnCanopy(k){
    if (!canopy.length) return;
    for (var j=0;j<k;j++){
      var c = canopy[(Math.random()*canopy.length)|0];
      var p = newPetal(c.x + rnd(-26,26), c.y + rnd(-18,18));
      p.z = rnd(0.5, 1);
      petals.push(p);
    }
    while (petals.length > targetN + 90) {
      var fi = -1;
      for (var q=0;q<petals.length;q++) if (petals[q].state === 'float'){ fi = q; break; }
      petals.splice(fi >= 0 ? fi : 0, 1);
    }
  }

  /* gradients in unit petal space — reused for every petal via canvas transforms */
  var gradA = null, gradB = null;
  function makeGrads(){
    gradA = ctx.createLinearGradient(0, -10, 0, 12);
    gradA.addColorStop(0, '#fbe0e8'); gradA.addColorStop(1, '#f0a3b9');
    gradB = ctx.createLinearGradient(0, -10, 0, 12);
    gradB.addColorStop(0, '#f7c8d4'); gradB.addColorStop(1, '#e2698c');
  }
  function petalPath(){
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.bezierCurveTo(6, -8, 7, -1, 3, 6);
    ctx.bezierCurveTo(1.6, 8.4, 0.6, 9.6, 0, 12);
    ctx.bezierCurveTo(-0.6, 9.6, -1.6, 8.4, -3, 6);
    ctx.bezierCurveTo(-7, -1, -6, -8, 0, -10);
    ctx.closePath();
  }

  /* ---------- pointer / gusts ---------- */
  var mx = null, my = null, pmx = 0, pmy = 0;
  var gusts = [];
  window.addEventListener('pointermove', function(e){
    if (mx !== null){ var ddx = e.clientX - mx, ddy = e.clientY - my;
      for (var i=0;i<petals.length;i++){
        var p = petals[i];
        if (p.state !== 'fall') continue;
        var d = Math.hypot(p.x - e.clientX, p.y - e.clientY);
        if (d < 180){
          var w = (1 - d/180);
          p.vx += ddx * 1.6 * w;
          p.vy += ddy * 1.6 * w - 7 * w;
        }
      }
    }
    mx = e.clientX; my = e.clientY;
  }, {passive:true});
  window.addEventListener('pointerdown', function(e){
    if (e.target.closest('#haiku, .brand')) return;
    var dir = e.clientX < W/2 ? 1 : -1;      /* blow away from the clicked side */
    gusts.push({x: e.clientX, y: e.clientY, dir: dir, age: 0});
    spawnCanopy(36);
    hint.classList.add('gone');
  });

  /* ---------- river + scene painting ---------- */
  var rip = 0;
  function drawRiver(now){
    var rt = RIVER;
    var pale = mix([0xdf,0xe7,0xef], [0xe6,0xc3,0xc4], phaseG);
    var g = ctx.createLinearGradient(0, rt, 0, H);
    g.addColorStop(0, rgb(mix(pale, [255,255,255], .25)));
    g.addColorStop(0.35, rgb(pale));
    g.addColorStop(1, '#5e628c');
    ctx.fillStyle = g;
    ctx.fillRect(0, rt, W, H - rt);
    /* pink blossom-reflection glow under the large tree */
    var rg = ctx.createRadialGradient(W*0.14, rt + 26, 8, W*0.14, rt + 26, Math.max(140, W*0.22));
    rg.addColorStop(0, 'rgba(247,200,212,' + (0.26 + 0.1*phaseG).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(247,200,212,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, rt, W*0.42, H - rt);
    /* nine drifting sine ripple lines with decreasing opacity */
    ctx.lineWidth = 1.3;
    for (var k = 0; k < 9; k++){
      var y0 = rt + (k + 0.8) / 9.6 * (H - rt);
      var alpha = 0.15 * (1 - k/9.4);
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      for (var x = -20; x <= W + 20; x += 26){
        var yy = y0 + Math.sin(x*0.016 + now*0.0007 + k*1.7 + rip*0.4) * (2.6 + k*0.5);
        if (x === -20) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    /* sun glitter dashes beneath the sun's x */
    var gx = sunX * W;
    ctx.lineWidth = 2;
    for (var m2 = 0; m2 < 8; m2++){
      var y2 = rt + 14 + m2 * (H - rt)/9;
      var a2 = (0.34 * (1 - m2/8)) * (0.35 + 0.65*phaseG);
      if (a2 <= 0.01) continue;
      ctx.strokeStyle = 'rgba(255,244,214,' + a2.toFixed(3) + ')';
      var x2 = gx + Math.sin(now*0.0012 + m2*2.2) * 18;
      ctx.beginPath();
      ctx.moveTo(x2 - 7, y2); ctx.lineTo(x2 + 7, y2);
      ctx.stroke();
    }
  }
  function drawPetal(p, now){
    var s = 0.55 + 0.75 * p.z;
    var wScale = Math.abs(Math.cos(p.flip)) + 0.14;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(s * wScale, s);
    ctx.globalAlpha = (0.34 + 0.58*p.z);
    ctx.fillStyle = p.grad === 'A' ? gradA : gradB;
    petalPath();
    ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* ---------- update ---------- */
  function step(dt, now){
    rip += dt;
    for (var gI = gusts.length - 1; gI >= 0; gI--){
      gusts[gI].age += dt;
      if (gusts[gI].age > 3.2) gusts.splice(gI, 1);
    }
    for (var i=0;i<petals.length;i++){
      var p = petals[i];
      if (p.state === 'float'){
        p.bob += dt*2.4;
        p.x += (14 + 26*p.z) * dt;
        p.y = RIVER + 6 + 3.2*p.z + Math.sin(p.bob)*2.2;
        p.rot += p.rv*0.2*dt;
        if (p.x > W + 24){ Object.assign(p, newPetal(rnd(-60, W*0.3), rnd(-90, -20))); }
        continue;
      }
      /* gusts */
      for (var gu=0; gu<gusts.length; gu++){
        var G = gusts[gu];
        var st = Math.exp(-G.age*1.35);
        var dxc = p.x - G.x;
        var pull = st / (1 + Math.abs(dxc)/260 + Math.abs(p.y - G.y)/420);
        p.vx += G.dir * 240 * pull * dt;
        p.vy -= 26 * pull * dt;
      }
      p.vx *= Math.exp(-1.5*dt);
      p.vy *= Math.exp(-1.5*dt);
      var sway = Math.sin(p.ph + now/1000 * p.sv) * (16 + 22*p.z);
      p.x += (p.vx + sway + 16*p.z) * dt;
      p.y += (p.vy + 26 + 42*p.z) * dt;
      p.rot += p.rv*dt;
      p.flip += p.flv*dt;
      if (p.y >= RIVER + 6 + 3.2*p.z - 2){
        p.state = 'float'; p.bob = rnd(0,6.28); p.vy = 0; p.vx *= 0.3;
      }
      if (p.x > W + 30) p.x = -20;
      if (p.x < -40) p.x = W + 20;
    }
  }
  function drawAll(now){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    drawRiver(now);
    for (var i=0;i<petals.length;i++){
      if (petals[i].state === 'float') continue;
      drawPetal(petals[i], now);
    }
    for (var j=0;j<petals.length;j++){
      if (petals[j].state === 'float') drawPetal(petals[j], now);
    }
  }

  /* ---------- sizing ---------- */
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    RIVER = H*0.83;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    makeGrads();
    mappy();
    updateCanopy();
    targetN = Math.max(120, Math.min(170, Math.round(W*H/11000)));
    if (!petals.length) seedPetals(targetN);
    while (petals.length < targetN) petals.push(newPetal());
    if (petals.length > targetN + 90) petals.length = targetN + 90;
    if (REDUCED) settled();
  }
  window.addEventListener('resize', resize);

  /* ---------- haiku reveal ---------- */
  function revealHaiku(){
    var lines = document.querySelectorAll('#haiku .hl');
    var spans = [];
    lines.forEach(function(l){
      var txt = l.textContent;
      l.textContent = '';
      for (var i=0;i<txt.length;i++){
        var sp = document.createElement('span');
        sp.className = 'ch';
        sp.textContent = txt[i] === ' ' ? '\u00A0' : txt[i];
        l.appendChild(sp);
        spans.push(sp);
      }
    });
    if (REDUCED){
      spans.forEach(function(s){ s.classList.add('in'); });
      return;
    }
    spans.forEach(function(s, i){
      setTimeout(function(){ s.classList.add('in'); }, 600 + i*46);
    });
  }

  /* ---------- loops ---------- */
  function settled(){
    /* a single composed frame for reduced-motion visitors */
    var now = 1400;
    updateSky(0.32);
    drawAll(now);
  }
  var lastT = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    updateSky((now/90000) % 1);
    step(dt, now);
    drawAll(now);
    requestAnimationFrame(frame);
  }

  /* ---------- go ---------- */
  resize();
  revealHaiku();
  if (REDUCED){
    /* scatter a settled distribution: some mid-air, some already afloat */
    petals.forEach(function(p, i){
      p.x = (i*97.31 % W);
      p.y = (i*61.7 % (RIVER - 40)) + 30;
      if (i % 9 === 0){ p.state = 'float'; p.bob = i; p.y = RIVER + 6 + 3.2*p.z; }
    });
    settled();
  } else {
    updateSky(performance.now()/90000 % 1);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
