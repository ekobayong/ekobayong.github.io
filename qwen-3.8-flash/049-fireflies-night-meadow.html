<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Meadow — Fireflies</title>
<style>
  :root{
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --star-min: 0.55;
    --star-max: 0.95;
    --moon-op: 1;
    --mist-op: 1;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#05081a;
    overflow:hidden;
    font-family:var(--sans);
    cursor:none;
  }
  /* ---------- scene ---------- */
  #scene{
    position:fixed; inset:0;
    background:linear-gradient(180deg,#05081a 0%,#0d1a3d 42%,#1a2f52 74%,#22344f 100%);
    transition:filter 1.4s ease;
    overflow:hidden;
  }
  body.new-moon #scene{ filter:brightness(0.66) saturate(0.68); }

  /* ---------- stars ---------- */
  .star{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 45%, transparent 72%);
    animation:twinkle var(--tw,6s) ease-in-out var(--td,0s) infinite alternate;
    transition:opacity 1.4s ease;
  }
  .star.blue{ background:radial-gradient(circle, #cfd8ff 0%, rgba(207,216,255,0.3) 45%, transparent 72%); }
  .star.warm{ background:radial-gradient(circle, #ffe9c4 0%, rgba(255,233,196,0.3) 45%, transparent 72%); }
  @keyframes twinkle{
    from{ opacity:var(--star-min); }
    to  { opacity:var(--star-max); }
  }
  body.new-moon{ --star-min:0.75; --star-max:1; }

  /* ---------- moon ---------- */
  #moonglow{
    position:absolute;
    right:-14%; top:-24%;
    width:78vmin; height:78vmin;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,220,0.16) 0%, rgba(255,246,220,0.06) 42%, transparent 70%);
    opacity:var(--moon-op);
    transition:opacity 1.4s ease;
    pointer-events:none;
  }
  #moon{
    position:absolute;
    top:8.5%; right:9%;
    width:clamp(64px, 12vmin, 130px);
    height:clamp(64px, 12vmin, 130px);
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #fffbf0 0%, #f4ecd6 55%, #d9cfb4 100%);
    box-shadow:0 0 40px 6px rgba(255,246,214,0.45), 0 0 140px 28px rgba(255,246,214,0.20);
    opacity:var(--moon-op);
    transition:opacity 1.4s ease;
  }
  .crater{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, rgba(120,106,80,0.16), rgba(120,106,80,0.28) 70%, transparent 74%);
  }

  /* ---------- hills ---------- */
  .hills{ position:absolute; left:0; right:0; bottom:0; width:100%; height:52%; pointer-events:none; }
  .hills svg{ position:absolute; bottom:0; width:100%; height:100%; display:block; }
  #hills-far{ transform:translateY(14%); }
  #hills-near{ transform:translateY(4%); }

  /* ---------- mist ---------- */
  .mist{
    position:absolute; left:-30%; width:160%; height:76px;
    filter:blur(14px);
    pointer-events:none;
    opacity:var(--mist-op);
    transition:opacity 1.4s ease;
  }
  body.new-moon{ --mist-op:0.45; }
  #mist1{
    bottom:16%;
    background:linear-gradient(90deg, transparent, rgba(186,203,226,0.20) 22%, rgba(186,203,226,0.13) 60%, transparent);
    animation:drift1 40s ease-in-out infinite alternate;
  }
  #mist2{
    bottom:24%;
    height:58px;
    background:linear-gradient(90deg, transparent, rgba(196,211,232,0.16) 40%, rgba(196,211,232,0.10) 72%, transparent);
    animation:drift2 55s ease-in-out infinite alternate;
  }
  @keyframes drift1{ from{ transform:translateX(-6%);} to{ transform:translateX(8%);} }
  @keyframes drift2{ from{ transform:translateX(7%);} to{ transform:translateX(-7%);} }

  /* ---------- grass ---------- */
  .grass-layer{ position:absolute; left:0; bottom:0; width:100%; pointer-events:none; display:block; }
  .blade{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation-name:sway;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    animation-direction:alternate;
  }
  @keyframes sway{
    from{ transform:rotate(-3.5deg) skewX(-1.6deg); }
    to  { transform:rotate( 3.5deg) skewX( 1.6deg); }
  }
  #grass-far { filter:blur(1.1px); opacity:0.55; }
  #grass-mid { opacity:0.92; }
  #grass-near{ }

  /* ---------- fireflies canvas ---------- */
  #flies{
    position:fixed; inset:0;
    pointer-events:none;
  }
  /* breeze disc */
  #breeze{
    position:fixed; left:0; top:0;
    width:120px; height:120px; margin:-60px 0 0 -60px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(200,222,255,0.07) 0%, rgba(200,222,255,0.045) 45%, transparent 70%);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.6s ease;
    z-index:5;
  }

  /* ---------- caption ---------- */
  #caption{
    position:fixed; top:7.5%; left:50%; transform:translateX(-50%);
    text-align:center;
    color:#e8ecf7;
    opacity:0;
    animation:captionIn 4s ease 1.2s forwards;
    pointer-events:none;
    z-index:6;
    text-shadow:0 1px 18px rgba(0,0,0,0.45);
    width:92vw;
  }
  #caption .line{
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(18px, 2.7vmin, 27px);
    letter-spacing:0.02em;
  }
  #caption .sub{
    margin-top:8px;
    font-family:var(--serif);
    font-variant:small-caps;
    font-size:clamp(11px, 1.5vmin, 14px);
    letter-spacing:0.34em;
    color:rgba(214,222,240,0.62);
  }
  @keyframes captionIn{ from{ opacity:0; transform:translateX(-50%) translateY(8px);} to{ opacity:1; transform:translateX(-50%) translateY(0);} }

  /* ---------- UI ---------- */
  #ui{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px;
    z-index:7;
    cursor:auto;
  }
  #moonBtn{
    display:flex; align-items:center; gap:10px;
    font-family:var(--sans);
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:#dfe6f5;
    background:rgba(10,16,36,0.55);
    border:1px solid rgba(180,196,230,0.28);
    border-radius:999px;
    padding:11px 20px 11px 16px;
    cursor:pointer;
    transition:background 0.4s, border-color 0.4s;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  #moonBtn:hover{ background:rgba(24,34,64,0.7); border-color:rgba(210,224,255,0.5); }
  #phaseDot{
    width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #fffbf0, #d9cfb4);
    box-shadow:0 0 8px 2px rgba(255,246,214,0.8);
    transition:all 1.4s ease;
  }
  body.new-moon #phaseDot{
    background:radial-gradient(circle at 68% 34%, #fffbf0 0%, #fffbf0 42%, transparent 44%);
    box-shadow:inset -7px 1px 0 0 rgba(255,251,240,0.9), 0 0 6px 1px rgba(255,246,214,0.35);
    background-color:#141d3a;
  }
  #counter{
    font-size:10.5px; letter-spacing:0.26em; text-transform:uppercase;
    color:rgba(206,216,238,0.6);
    background:rgba(8,12,28,0.4);
    border:1px solid rgba(160,178,214,0.16);
    border-radius:999px;
    padding:10px 16px;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  #counter b{ color:#d4ff6a; font-weight:600; }
  #hint{
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:9px; letter-spacing:0.3em; text-transform:uppercase;
    color:rgba(190,202,228,0.34);
    z-index:7; pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .star, .mist, .blade, #caption{ animation:none !important; }
    #caption{ opacity:1; }
    .star{ opacity:0.8; }
  }
</style>
</head>
<body>
  <div id="scene">
    <div id="moonglow"></div>
    <div id="moon">
      <span class="crater" style="left:24%; top:30%; width:16%; height:16%;"></span>
      <span class="crater" style="left:52%; top:18%; width:10%; height:10%;"></span>
      <span class="crater" style="left:60%; top:52%; width:19%; height:19%;"></span>
      <span class="crater" style="left:32%; top:63%; width:11%; height:11%;"></span>
      <span class="crater" style="left:44%; top:42%; width:7%;  height:7%;"></span>
    </div>

    <div class="hills">
      <svg id="hills-far" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="hfg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1b2c4d"/><stop offset="1" stop-color="#101c36"/>
          </linearGradient>
        </defs>
        <path fill="url(#hfg)" d="M0,400 L0,196 C120,150 240,120 392,158 C544,196 636,120 788,104 C940,88 1044,164 1188,150 C1300,140 1380,104 1440,118 L1440,400 Z"/>
      </svg>
      <svg id="hills-near" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="hng" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0f1a31"/><stop offset="1" stop-color="#080f21"/>
          </linearGradient>
        </defs>
        <path fill="url(#hng)" d="M0,400 L0,268 C150,214 260,268 420,242 C560,220 640,264 800,252 C960,240 1060,196 1220,228 C1330,250 1390,236 1440,222 L1440,400 Z"/>
      </svg>
    </div>

    <div class="mist" id="mist1"></div>
    <div class="mist" id="mist2"></div>

    <div id="grass"></div>
  </div>

  <canvas id="flies"></canvas>
  <div id="breeze"></div>

  <div id="caption">
    <div class="line">The field remembers every small light.</div>
    <div class="sub">a night meadow &middot; late june</div>
  </div>

  <div id="ui">
    <button id="moonBtn" type="button" aria-pressed="false">
      <span id="phaseDot" aria-hidden="true"></span>
      <span id="moonLabel">Full moon</span>
    </button>
    <div id="counter">fireflies drifting <b id="flyCount">0</b></div>
  </div>
  <div id="hint">click the field to scatter a swarm</div>

<script>
(function(){
  'use strict';
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= seeded LCG ================= */
  var SEED = (Date.now() ^ (Math.random()*0x7fffffff)) >>> 0;
  var _s = SEED;
  function lcg(){ _s = (Math.imul(_s, 1664525) + 1013904223) >>> 0; return _s / 4294967296; }
  function rng(a,b){ return a + lcg()*(b-a); }
  function reseed(){ _s = SEED; }

  /* ================= stars ================= */
  (function stars(){
    var scene = document.getElementById('scene');
    var kinds = ['', 'blue', 'warm'];
    for (var i=0;i<15;i++){
      var s = document.createElement('span');
      s.className = 'star ' + kinds[Math.floor(Math.random()*3)];
      var size = 2 + Math.random()*2.4;
      s.style.width = s.style.height = size.toFixed(1)+'px';
      s.style.left = (3 + Math.random()*94).toFixed(2)+'%';
      s.style.top  = (2 + Math.random()*40).toFixed(2)+'%';
      s.style.setProperty('--tw', (3.5 + Math.random()*4).toFixed(2)+'s');
      s.style.setProperty('--td', (-Math.random()*6).toFixed(2)+'s');
      scene.appendChild(s);
    }
  })();

  /* ================= grass (3 SVG layers) ================= */
  var grassHost = document.getElementById('grass');
  function bladePath(x, by, w, h, lean){
    // tapered quadratic blade: base at (x, by) width w, tip at (x+lean, by-h)
    var mx1 = x + lean*0.35, my1 = by - h*0.62;
    var t  = x + lean,       ty  = by - h;
    return 'M '+(x-w).toFixed(1)+' '+by.toFixed(1)+
           ' Q '+(mx1-w*0.55).toFixed(1)+' '+my1.toFixed(1)+' '+t.toFixed(1)+' '+ty.toFixed(1)+
           ' Q '+(mx1+w*0.55).toFixed(1)+' '+(my1+h*0.04).toFixed(1)+' '+(x+w).toFixed(1)+' '+by.toFixed(1)+' Z';
  }
  function buildGrass(){
    var W = window.innerWidth, H = window.innerHeight;
    grassHost.innerHTML = '';
    reseed();
    var layers = [
      { id:'grass-far',  n:140, color:'#0b1530', top:0.42, hMin:0.05, hMax:0.13, w:[2.2,4.2], dur:[6.5,8],   count:140 },
      { id:'grass-mid',  n:120, color:'#070f24', top:0.30, hMin:0.09, hMax:0.20, w:[2.8,5.4], dur:[5.2,7],   count:120 },
      { id:'grass-near', n:90,  color:'#03081a', top:0.22, hMin:0.14, hMax:0.30, w:[3.6,7.2], dur:[4,5.8],   count:90 }
    ];
    layers.forEach(function(L){
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','grass-layer');
      svg.setAttribute('id',L.id);
      svg.setAttribute('viewBox','0 0 '+W+' '+(H*0.36));
      svg.setAttribute('preserveAspectRatio','none');
      svg.style.height = (H*0.36)+'px';
      var vh = H*0.36;
      for (var i=0;i<L.count;i++){
        var x = rng(0, W);
        var base = vh + rng(-4, 8);
        var h = vh * rng(L.hMin/0.36, Math.min(L.hMax/0.36, 1.35));
        if (h > base*1.6) h = base*1.6;
        var lean = rng(-1,1) * h * 0.28;
        var w = rng(L.w[0], L.w[1]);
        var p = document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('class','blade');
        p.setAttribute('d', bladePath(x, base, w, h, lean));
        p.setAttribute('fill', L.color);
        var dur = rng(L.dur[0], L.dur[1]);
        p.style.animationDuration = dur.toFixed(2)+'s';
        p.style.animationDelay = (-rng(0,dur)).toFixed(2)+'s';
        svg.appendChild(p);
      }
      grassHost.appendChild(svg);
    });
  }
  buildGrass();

  /* ================= fireflies ================= */
  var canvas = document.getElementById('flies');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var flies = [], swarm = [];
  var breezeX = -9999, breezeY = -9999, breezeOn = false;
  var speedScale = REDUCED ? 0.22 : 1;
  var moonModeFull = true;

  function sizeCanvas(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(window.innerWidth  * DPR);
    canvas.height = Math.floor(window.innerHeight * DPR);
    canvas.style.width  = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
  }
  sizeCanvas();

  function makeFly(x, y, scattered){
    var H = window.innerHeight, W = window.innerWidth;
    return {
      x: x!==undefined ? x : Math.random()*W,
      y: y!==undefined ? y : H*(0.28 + Math.random()*0.62),
      vx: (Math.random()-0.5)*(scattered?3.2:0.3),
      vy: (Math.random()-0.5)*(scattered?3.2:0.3),
      heading: Math.random()*Math.PI*2,
      r: 1.1 + Math.random()*1.3,
      hue: 78 + Math.random()*12,
      phase: Math.random()*Math.PI*2,
      rate: 0.35 + Math.random()*0.75,
      life: scattered ? 17 : Infinity,
      born: 0
    };
  }
  function seedFlies(){
    flies = [];
    var area = window.innerWidth * window.innerHeight;
    var n = Math.round(Math.max(28, Math.min(90, area/24000)));
    for (var i=0;i<n;i++) flies.push(makeFly());
  }
  seedFlies();

  function stepFly(f, dt, t){
    // wander: random-walk heading
    f.heading += (Math.random()-0.5)*0.34*speedScale;
    var ax = Math.cos(f.heading)*0.045*speedScale;
    var ay = Math.sin(f.heading)*0.03*speedScale;

    var W = window.innerWidth, H = window.innerHeight;
    var topBand = H*0.28, botBand = H*0.90;
    if (f.y < topBand) ay += (topBand - f.y)*0.00006*40;
    if (f.y > botBand) ay -= (f.y - botBand)*0.00006*40;
    if (f.x < W*0.04)  ax += 0.004*speedScale + 0.002;
    if (f.x > W*0.96)  ax -= 0.004*speedScale + 0.002;

    // breeze push
    if (breezeOn){
      var dx = f.x - breezeX, dy = f.y - breezeY;
      var d = Math.sqrt(dx*dx+dy*dy);
      if (d < 150 && d > 0.001){
        var force = (1 - d/150) * 0.30;
        ax += dx/d*force; ay += dy/d*force;
      }
    }
    f.vx = (f.vx + ax) * 0.94;
    f.vy = (f.vy + ay) * 0.94;
    f.x += f.vx * dt * 60 * speedScale;
    f.y += f.vy * dt * 60 * speedScale;
  }

  function drawFly(f, t){
    var b = Math.sin(t*f.rate*2 + f.phase); b = b*b;         // squared sine
    var alpha = 0.10 + b*0.9;
    if (f.life !== Infinity){
      var age = t - f.born;
      alpha *= Math.max(0, 1 - age/17);                       // ~17 s fade
    }
    if (!moonModeFull) alpha *= 1.18;                         // read slightly brighter on new moon
    if (alpha <= 0.004) return;
    var haloR = f.r*10;
    var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, haloR);
    g.addColorStop(0,   'hsla('+f.hue+',100%,72%,'+(alpha*0.5).toFixed(3)+')');
    g.addColorStop(0.4, 'hsla('+f.hue+',100%,62%,'+(alpha*0.16).toFixed(3)+')');
    g.addColorStop(1,   'hsla('+f.hue+',100%,60%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, haloR, 0, 6.2832); ctx.fill();
    // bright core
    ctx.fillStyle = 'hsla(66,100%,'+(80+b*15).toFixed(0)+'%,'+Math.min(1,alpha+0.08).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*(0.75+b*0.35), 0, 6.2832); ctx.fill();
  }

  var last = performance.now(), tSec = 0;
  var countEl = document.getElementById('flyCount');
  var breezeEl = document.getElementById('breeze');
  var bx = -9999, by = -9999;

  function frame(now){
    var dt = Math.min(0.05, (now-last)/1000); last = now; tSec += dt;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    ctx.globalCompositeOperation = 'lighter';

    for (var i=0;i<flies.length;i++){ stepFly(flies[i], dt, tSec); drawFly(flies[i], tSec); }

    for (var j=swarm.length-1;j>=0;j--){
      var f = swarm[j];
      if (tSec - f.born > f.life){ swarm.splice(j,1); continue; }
      stepFly(f, dt, tSec); drawFly(f, tSec);
    }
    ctx.globalCompositeOperation = 'source-over';
    countEl.textContent = flies.length + swarm.length;

    // eased breeze disc
    bx += (breezeX - bx)*0.12; by += (breezeY - by)*0.12;
    breezeEl.style.transform = 'translate('+bx.toFixed(1)+'px,'+by.toFixed(1)+'px)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= pointer ================= */
  window.addEventListener('pointermove', function(e){
    if (e.target.closest && e.target.closest('#ui')){ breezeOn=false; breezeEl.style.opacity=0; return; }
    breezeX = e.clientX; breezeY = e.clientY; breezeOn = true;
    breezeEl.style.opacity = 1;
  }, {passive:true});
  window.addEventListener('pointerdown', function(e){
    if (e.target.closest && e.target.closest('#ui')) return;
    var n = 14 + Math.floor(Math.random()*10);            // 14–23
    for (var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, sp = 1.4 + Math.random()*2.2;
      var f = makeFly(e.clientX + Math.cos(a)*8, e.clientY + Math.sin(a)*8, true);
      f.vx = Math.cos(a)*sp; f.vy = Math.sin(a)*sp; f.born = tSec;
      swarm.push(f);
    }
  }, {passive:true});
  document.addEventListener('pointerleave', function(){ breezeOn=false; breezeEl.style.opacity=0; });

  /* ================= moon toggle ================= */
  var btn = document.getElementById('moonBtn');
  var label = document.getElementById('moonLabel');
  btn.addEventListener('click', function(){
    moonModeFull = !moonModeFull;
    document.body.classList.toggle('new-moon', !moonModeFull);
    label.textContent = moonModeFull ? 'Full moon' : 'New moon';
    btn.setAttribute('aria-pressed', String(!moonModeFull));
  });

  /* ================= resize ================= */
  var rT;
  window.addEventListener('resize', function(){
    sizeCanvas();
    clearTimeout(rT);
    rT = setTimeout(buildGrass, 180);
  });
})();
</script>
</body>
</html>
