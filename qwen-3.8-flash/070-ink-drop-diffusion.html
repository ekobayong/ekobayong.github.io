<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sumi — ink drops in still water</title>
<style>
:root{
  --ink:#1f2a6b;
  --serif:Georgia,"Iowan Old Style",Palatino,"Palatino Linotype",ui-serif,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#e7edf0;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh}
#bg{z-index:0}
#ink{z-index:1;mix-blend-mode:multiply}

/* ---------- title block ---------- */
.masthead{
  position:fixed;top:26px;left:30px;z-index:5;
  display:flex;align-items:stretch;gap:14px;
  pointer-events:none;
}
.vrule{position:relative;width:1px;min-height:96px;
  background:linear-gradient(to bottom,rgba(31,42,107,.55),rgba(31,42,107,0));
  background:linear-gradient(to bottom,color-mix(in srgb,var(--ink) 55%,transparent),transparent);
}
.vrule::before{
  content:"";position:absolute;top:-3px;left:-3px;width:7px;height:7px;border-radius:50%;
  background:var(--ink);box-shadow:0 0 6px color-mix(in srgb,var(--ink) 50%,transparent);
  transition:background .4s ease;
}
.masthead h1{
  font-family:var(--serif);font-weight:400;margin:0;
  font-size:clamp(22px,2.6vw,34px);line-height:1.1;color:#2a3348;
}
.masthead .sub{
  margin:6px 0 0;font-family:var(--sans);font-size:10px;letter-spacing:.28em;
  text-transform:uppercase;color:#6c7a90;
}
.vcaption{
  position:fixed;left:40px;top:170px;z-index:5;writing-mode:vertical-rl;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;color:#8b98ab;
  pointer-events:none;
}

/* ---------- hint ---------- */
.hint{
  position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;
  font-family:var(--serif);font-style:italic;font-size:clamp(15px,2vw,19px);
  color:#67748a;letter-spacing:.06em;pointer-events:none;
  animation:breathe 3.6s ease-in-out infinite;
  transition:opacity 1.2s ease;
}
@keyframes breathe{0%,100%{opacity:.22}50%{opacity:.85}}
.hint.gone{opacity:0;animation:none}

/* ---------- bottom pill ---------- */
.pill{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.85);
  border-radius:999px;padding:9px 14px;
  box-shadow:0 12px 32px -14px rgba(30,45,70,.35);
}
.swatches{display:flex;gap:14px;align-items:flex-start;padding:0 6px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px}
.swatch button{
  appearance:none;width:26px;height:26px;border-radius:50%;cursor:pointer;padding:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 42%),var(--c);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28),inset 0 -2px 4px rgba(255,255,255,.14);
  outline:1px solid transparent;outline-offset:2px;
  transition:outline-color .25s ease,transform .25s cubic-bezier(.22,1,.36,1);
}
.swatch button:hover{transform:scale(1.12)}
.swatch button[aria-pressed="true"]{outline-color:var(--c)}
.swatch span{font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#68748a;white-space:nowrap}
.sep{width:1px;align-self:stretch;background:rgba(60,80,110,.14);margin:2px 8px}
.pill .seg{display:flex;background:rgba(231,237,240,.9);border-radius:999px;padding:3px}
.pill .seg button{
  appearance:none;border:0;background:transparent;cursor:pointer;border-radius:999px;
  font-family:var(--sans);font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  color:#68748a;padding:7px 12px;transition:background .25s ease,color .25s ease;
}
.pill .seg button[aria-pressed="true"]{background:#fff;color:#2a3348;box-shadow:0 1px 4px rgba(30,45,70,.18)}
#drain{
  appearance:none;border:1px solid rgba(60,80,110,.25);background:transparent;cursor:pointer;
  border-radius:999px;font-family:var(--sans);font-size:11px;text-transform:uppercase;
  letter-spacing:.18em;color:#4c5a72;padding:8px 14px;margin-left:6px;
  transition:background .25s ease,color .25s ease;
}
#drain:hover{background:rgba(255,255,255,.7)}
#drain.draining{
  background:#2a3348;color:#eef3f6;border-color:#2a3348;
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.counter{
  position:fixed;right:22px;bottom:24px;z-index:5;
  font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:#7d8a9d;pointer-events:none;font-variant-numeric:tabular-nums;
}
@media (max-width:700px){
  .vcaption{display:none}
  .masthead{top:16px;left:18px}
  .swatch span{display:none}
  .pill{max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .hint{animation:none;opacity:.75}
  #drain.draining{animation:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="ink"></canvas>

<div class="masthead">
  <div class="vrule" aria-hidden="true"></div>
  <div>
    <h1>Sumi</h1>
    <p class="sub">ink drops in water</p>
  </div>
</div>
<div class="vcaption" aria-hidden="true">墨 · still water · slow breath</div>

<p class="hint" id="hint">touch the water</p>

<div class="pill" role="toolbar" aria-label="Ink controls">
  <div class="swatches" id="swatches"></div>
  <div class="sep" aria-hidden="true"></div>
  <div class="seg" role="group" aria-label="Medium">
    <button id="mWater" aria-pressed="true">Water</button>
    <button id="mPaper" aria-pressed="false">Paper</button>
  </div>
  <button id="drain" title="key D">Drain</button>
</div>

<div class="counter" id="counter">0 drops</div>

<script>
'use strict';
/* =============================================================
   Sumi — ink particles advected by curl noise on a never-cleared
   multiply canvas. Water swirls; paper freezes.
   ============================================================= */
const bgCanvas=document.getElementById("bg"),inkCanvas=document.getElementById("ink");
const bg=bgCanvas.getContext("2d"),ink=inkCanvas.getContext("2d");
const mqReduce=matchMedia("(prefers-reduced-motion: reduce)");

const INKS=[
  {name:"Indigo",hex:"#1f2a6b"},
  {name:"Vermilion",hex:"#c8402a"},
  {name:"Sepia",hex:"#6b4a2b"},
  {name:"Black",hex:"#14141a"},
  {name:"Teal",hex:"#157a7a"}
];
let mode="water";            // "water" | "paper"
let currentInk=0;
let dpr=1,W=0,H=0;           // CSS px
let drops=0,swarm=[],draining=false,drainT0=0;

/* ---------- 3D Perlin gradient noise ---------- */
const perm=new Uint8Array(512);
(function(){
  const p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  let seed=20260904;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
})();
function fade(t){return t*t*t*(t*(t*6-15)+10);}
function lerp(a,b,t){return a+t*(b-a);}
function grad3(h,x,y,z){
  h&=15;
  const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);
  return((h&1)===0?u:-u)+((h&2)===0?v:-v);
}
function noise3(x,y,z){
  const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
  x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
  const u=fade(x),v=fade(y),w=fade(z);
  const A=perm[X]+Y,AA=perm[A]+Z,AB=perm[A+1]+Z;
  const B=perm[X+1]+Y,BA=perm[B]+Z,BB=perm[B+1]+Z;
  return lerp(
    lerp(lerp(grad3(perm[AA],x,y,z),grad3(perm[BA],x-1,y,z),u),
         lerp(grad3(perm[AB],x,y-1,z),grad3(perm[BB],x-1,y-1,z),u),v),
    lerp(lerp(grad3(perm[AA+1],x,y,z-1),grad3(perm[BA+1],x-1,y,z-1),u),
         lerp(grad3(perm[AB+1],x,y-1,z-1),grad3(perm[BB+1],x-1,y-1,z-1),u),v),
    w);
}
/* divergence-free curl of two noise scales, central differences */
const FINE=1/42,COARSE=1/240,EP=1;
let curlX=0,curlY=0;
function curl(x,y,t){
  const dp=(noise3(x*FINE,(y+EP)*FINE,t)-noise3(x*FINE,(y-EP)*FINE,t))/(2*EP);
  const dq=(noise3((x+EP)*FINE,y*FINE,t)-noise3((x-EP)*FINE,y*FINE,t))/(2*EP);
  const cp=(noise3(x*COARSE,(y+EP)*COARSE,t*0.35+37.2)-noise3(x*COARSE,(y-EP)*COARSE,t*0.35+37.2))/(2*EP);
  const cq=(noise3((x+EP)*COARSE,y*COARSE,t*0.35+37.2)-noise3((x-EP)*COARSE,y*COARSE,t*0.35+37.2))/(2*EP);
  curlX=(dp*2600+cp*1500);
  curlY=(-dq*2600-cq*1500);
}

/* ---------- pre-baked sprites: 64px radial gradients ---------- */
const sprites=INKS.map(ink=>{
  const mk=stops=>{
    const c=document.createElement("canvas");c.width=c.height=64;
    const g=c.getContext("2d");
    const grd=g.createRadialGradient(32,32,0,32,32,32);
    for(const s of stops)grd.addColorStop(s[0],s[1]);
    g.fillStyle=grd;g.fillRect(0,0,64,64);
    return c;
  };
  const hexA=(h,a)=>h+Math.round(a*255).toString(16).padStart(2,"0");
  return{
    water:mk([[0,hexA(ink.hex,.95)],[.42,hexA(ink.hex,.8)],[.78,hexA(ink.hex,.28)],[1,hexA(ink.hex,0)]]),
    paper:mk([[0,hexA(ink.hex,.8)],[.25,hexA(ink.hex,.5)],[.55,hexA(ink.hex,.22)],[.85,hexA(ink.hex,.05)],[1,hexA(ink.hex,0)]])
  };
});

/* ---------- background painting ---------- */
function hexRGB(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function paintBackground(){
  bg.setTransform(dpr,0,0,dpr,0,0);
  if(mode==="water"){
    const g=bg.createRadialGradient(W/2,H*.42,Math.min(W,H)*.1,W/2,H/2,Math.max(W,H)*.78);
    g.addColorStop(0,"#f1f5f6");g.addColorStop(.55,"#e3eaee");g.addColorStop(1,"#cfd9df");
    bg.fillStyle=g;bg.fillRect(0,0,W,H);
    bg.strokeStyle="rgba(255,255,255,.06)";
    bg.lineWidth=1.4;
    for(let i=0;i<40;i++){
      bg.beginPath();
      bg.ellipse(W*Math.random(),H*Math.random(),30+Math.random()*160,12+Math.random()*70,Math.random()*Math.PI,0,Math.PI*2);
      bg.stroke();
    }
  }else{
    bg.fillStyle="#f3ead8";bg.fillRect(0,0,W,H);
    let seed=987654321;
    const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
    const fibres=Math.min(4500,(W*H)/340|0);
    bg.lineWidth=0.7;
    for(let i=0;i<fibres;i++){
      const x=rnd()*W,y=rnd()*H,a=rnd()*Math.PI,L=3+rnd()*9;
      bg.strokeStyle=i%3===0?"rgba(255,255,255,.35)":"rgba(120,95,60,.12)";
      bg.beginPath();bg.moveTo(x,y);bg.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);bg.stroke();
    }
    for(let i=0;i<60;i++){
      const x=rnd()*W,y=rnd()*H,r=40+rnd()*160;
      const g=bg.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,"rgba(176,141,94,.075)");g.addColorStop(1,"rgba(176,141,94,0)");
      bg.fillStyle=g;bg.beginPath();bg.arc(x,y,r,0,Math.PI*2);bg.fill();
    }
  }
}

/* ---------- resize ---------- */
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  for(const c of[bgCanvas,inkCanvas]){
    const snap=document.createElement("canvas");
    snap.width=c.width;snap.height=c.height;
    if(c.width)snap.getContext("2d").drawImage(c,0,0);
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
    if(c===inkCanvas&&snap.width)ink.drawImage(snap,0,0);
  }
  paintBackground();
}
addEventListener("resize",resize);

/* ---------- particles ---------- */
function spawn(x,y){
  drops++;
  document.getElementById("counter").textContent=drops+(drops===1?" drop":" drops");
  document.getElementById("hint").classList.add("gone");
  const water=mode==="water";
  const t=Math.min(1,(W*H)/(1600*900));
  const n=Math.max(380,Math.min(620,Math.round(380+t*240)));
  if(swarm.length>4200)swarm.splice(0,swarm.length-4200+n);
  const sprite=sprites[currentInk][water?"water":"paper"];
  const vMin=water?30:14,vMax=water?120:40;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=vMin+Math.pow(Math.random(),1.6)*(vMax-vMin);
    const jr=Math.pow(Math.random(),2)*14;
    swarm.push({
      x:x+Math.cos(a)*jr,y:y+Math.sin(a)*jr,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:4+Math.random()*6,age:0,
      r:(water?9:16)+Math.random()*(water?14:22),
      grow:(water?15:8)+Math.random()*12,
      s:sprite
    });
  }
  /* impact stamp — a few denser, slower sprites */
  ink.setTransform(dpr,0,0,dpr,0,0);
  ink.globalCompositeOperation="multiply";
  stamp(x,y,sprite,water);
  ink.globalAlpha=1;
  ink.globalCompositeOperation="source-over";
}
function stamp(x,y,sprite,water){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2,d=Math.pow(Math.random(),1.5)*10;
    const r=(water?22:32)+Math.random()*30;
    ink.globalAlpha=water?.15:.09;
    ink.drawImage(sprite,x-r/2+Math.cos(a)*d,y-r/2+Math.sin(a)*d,r,r);
  }
}

/* ---------- drain ---------- */
const drainBtn=document.getElementById("drain");
function startDrain(){
  if(draining)return;
  draining=true;drainT0=performance.now();
  drainBtn.classList.add("draining");
}
drainBtn.addEventListener("click",e=>{e.stopPropagation();startDrain();});

/* ---------- main loop ---------- */
let last=performance.now(),swirlT=0;
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  const water=mode==="water";
  const reduce=mqReduce.matches;

  /* self-swirl: redraw the ink layer onto itself (copy + tiny transform) */
  if(water&&!reduce){
    swirlT+=dt;
    ink.setTransform(1,0,0,1,0,0);
    ink.globalCompositeOperation="copy";
    const dw=inkCanvas.width,dh=inkCanvas.height;
    const wobX=Math.sin(swirlT*0.7)*0.55,wobY=Math.cos(swirlT*0.9)*0.55;
    ink.translate(dw/2+wobX,dh/2+wobY);
    ink.rotate(0.0002);
    ink.scale(1.0004,1.0004);
    ink.drawImage(inkCanvas,-dw/2,-dh/2);
    ink.globalCompositeOperation="source-over";
  }

  /* physics */
  const fr=Math.pow(water?0.965:0.90,dt*60);
  const maxA=water?0.07:0.045;
  const cx=W/2,cy=H/2,spin=(!reduce&&water)?0.02:0;   // gentle global rotation rad/s
  const t=now*0.00012;
  ink.setTransform(dpr,0,0,dpr,0,0);
  ink.globalCompositeOperation="multiply";
  let w=0;
  for(let i=0;i<swarm.length;i++){
    const p=swarm[i];
    p.age+=dt;
    if(p.age>=p.life)continue;
    curl(p.x,p.y,t);
    const rx=p.x-cx,ry=p.y-cy;
    p.vx+=(curlX-rx*spin*6)*dt;
    p.vy+=(curlY-ry*spin*6)*dt;
    p.vx*=fr;p.vy*=fr;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const k=1-p.age/p.life;
    const a=maxA*k*k;
    if(a<0.0015){swarm[w++]=p;continue;}
    const r=p.r+p.grow*(1-k);
    ink.globalAlpha=a;
    ink.drawImage(p.s,p.x-r,p.y-r,r*2,r*2);
    swarm[w++]=p;
  }
  swarm.length=w;
  ink.globalAlpha=1;
  ink.globalCompositeOperation="source-over";

  /* drain */
  if(draining){
    const dur=reduce?2500:7000;
    const k=(now-drainT0)/dur;
    ink.setTransform(1,0,0,1,0,0);
    ink.globalCompositeOperation="destination-out";
    ink.fillStyle="rgba(0,0,0,0.018)";
    ink.fillRect(0,0,inkCanvas.width,inkCanvas.height);
    ink.globalCompositeOperation="source-over";
    if(k>=1){
      ink.clearRect(0,0,inkCanvas.width,inkCanvas.height);
      draining=false;drainBtn.classList.remove("draining");
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const swWrap=document.getElementById("swatches");
INKS.forEach((ink0,i)=>{
  const cell=document.createElement("div");cell.className="swatch";
  const b=document.createElement("button");
  b.style.setProperty("--c",ink0.hex);
  b.setAttribute("aria-label",ink0.name+" ink");
  b.setAttribute("aria-pressed",i===0?"true":"false");
  b.title=ink0.name+" ("+(i+1)+")";
  b.addEventListener("click",e=>{e.stopPropagation();pickInk(i);});
  const s=document.createElement("span");s.textContent=ink0.name;
  cell.append(b,s);swWrap.appendChild(cell);
});
function pickInk(i){
  currentInk=i;
  document.documentElement.style.setProperty("--ink",INKS[i].hex);
  swWrap.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i?"true":"false"));
}
const mW=document.getElementById("mWater"),mP=document.getElementById("mPaper");
function setMode(m){
  mode=m;
  mW.setAttribute("aria-pressed",m==="water"?"true":"false");
  mP.setAttribute("aria-pressed",m==="paper"?"true":"false");
  document.getElementById("hint").textContent=m==="water"?"touch the water":"touch the paper";
  if(drops===0)document.getElementById("hint").classList.remove("gone");
  paintBackground();
}
mW.addEventListener("click",e=>{e.stopPropagation();setMode("water");});
mP.addEventListener("click",e=>{e.stopPropagation();setMode("paper");});

addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="5")pickInk(+e.key-1);
  else if(e.key==="d"||e.key==="D")startDrain();
  else if(e.key==="p"||e.key==="P")setMode(mode==="water"?"paper":"water");
});

/* pointer: tap drops ink; held drag lays a chain every 220ms */
let dragging=false,lastDrop=0;
function overUI(x,y){
  const el=document.elementFromPoint(x,y);
  return el&&(el.closest(".pill")||el.closest(".masthead")||el.closest(".vcaption"));
}
inkCanvas.addEventListener("pointerdown",e=>{
  if(overUI(e.clientX,e.clientY))return;
  dragging=true;lastDrop=performance.now();
  spawn(e.clientX,e.clientY);
  e.preventDefault();
});
addEventListener("pointermove",e=>{
  if(!dragging)return;
  const now=performance.now();
  if(now-lastDrop>=220){lastDrop=now;spawn(e.clientX,e.clientY);}
});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointercancel",()=>dragging=false);

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
