<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosace du Nord — Gothic Rose Window</title>
<style>
  :root{
    --nave:#0b0908;
    --muted:#a5937a;
    --parchment:#e8dcc4;
    --stone-line:#241f1a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--nave)}
  body{
    font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif;
    color:var(--parchment);
    min-height:100vh;
    background:
      radial-gradient(120% 70% at 50% 6%, rgba(60,48,34,.20), rgba(11,9,8,0) 60%),
      repeating-linear-gradient(90deg, rgba(255,240,210,.012) 0 2px, rgba(0,0,0,0) 2px 96px),
      var(--nave);
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(18px,4vh,44px) 16px 60px;
  }
  header{text-align:center;margin-bottom:clamp(14px,3vh,28px)}
  .kicker{
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }
  h1{
    font-size:clamp(22px,3.4vw,38px);font-weight:normal;
    text-transform:uppercase;letter-spacing:.24em;color:var(--parchment);
    text-shadow:0 0 30px rgba(255,214,150,.12);
  }
  .sub{
    margin-top:10px;font-style:italic;color:var(--muted);
    font-size:clamp(12px,1.5vw,15.5px);letter-spacing:.04em;
  }
  .seasons{
    margin-top:20px;display:inline-flex;gap:4px;
    border:1px solid rgba(165,147,122,.35);border-radius:999px;
    padding:4px;background:rgba(20,16,12,.6);
    backdrop-filter:blur(4px);
  }
  .seasons button{
    font-family:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);background:transparent;border:0;border-radius:999px;
    padding:8px 18px;cursor:pointer;transition:color .3s ease,background .3s ease;
  }
  .seasons button:hover{color:var(--parchment)}
  .seasons button[aria-checked="true"]{
    background:rgba(232,196,138,.14);color:var(--parchment);
    box-shadow:inset 0 0 0 1px rgba(232,196,138,.35);
  }
  .seasons button:focus-visible{outline:1px solid var(--muted);outline-offset:2px}
  .stage{
    position:relative;width:min(760px,96vw);
  }
  .stage svg{display:block;width:100%;height:auto;isolation:isolate}
  #motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .pane{
    transition:filter .35s ease;
    cursor:pointer;
  }
  .pane:hover,.pane:focus-visible{
    filter:brightness(1.55) saturate(1.3) drop-shadow(0 0 12px rgba(255,236,190,.9));
    outline:none;
  }
  .stone,.sunlayer,.tintlayer,.poollayer,#frameback{pointer-events:none}
  .blend-screen{mix-blend-mode:screen}
  .blend-multiply{mix-blend-mode:multiply}
  #floorPool{mix-blend-mode:screen;opacity:.55}
  .caption{
    width:min(760px,96vw);min-height:2.6em;margin-top:2px;text-align:center;
    font-size:clamp(12.5px,1.6vw,15px);color:var(--muted);font-style:italic;
    letter-spacing:.03em;
  }
  .caption b{font-style:normal;font-weight:normal;color:var(--parchment);letter-spacing:.12em;text-transform:uppercase;font-size:.86em}
  .tooltip{
    position:absolute;z-index:5;pointer-events:none;
    max-width:250px;padding:9px 12px 10px;
    background:rgba(14,11,8,.92);
    border:1px solid rgba(200,170,120,.4);border-radius:4px;
    opacity:0;transform:translateY(4px);
    transition:opacity .18s ease,transform .18s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  .tooltip.show{opacity:1;transform:translateY(0)}
  .tooltip .t-sub{
    display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:#e8c48a;margin-bottom:4px;
  }
  .tooltip .t-story{font-size:12.5px;font-style:italic;color:#cbbb9f;line-height:1.45}
  footer{
    margin-top:34px;text-align:center;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:rgba(165,147,122,.5);
  }
</style>
</head>
<body>
<header>
  <div class="kicker">Cathedral of the North Light</div>
  <h1>Rosa Septentrionalis</h1>
  <p class="sub">Rosace du Nord — set 1235 in twelve-fold stone, fired in forty-four colours of glass</p>
  <div class="seasons" role="radiogroup" aria-label="Season of daylight">
    <button type="button" role="radio" aria-checked="true"  data-season="winter">Winter</button>
    <button type="button" role="radio" aria-checked="false" data-season="summer">Summer</button>
    <button type="button" role="radio" aria-checked="false" data-season="evening">Evening</button>
  </div>
</header>

<figure class="stage" id="stage">
  <svg id="rose" viewBox="0 0 800 820" role="img" aria-label="Gothic rose window with twelve-fold tracery">
    <defs>
      <pattern id="ashlar" patternUnits="userSpaceOnUse" x="0" y="0" width="64" height="40">
        <rect width="64" height="40" fill="#2e2824"/>
        <g stroke="#463c35" stroke-width="0.8" opacity=".9">
          <path d="M1 0.9 H31 M33 0.9 H63 M17 20.9 H47 M-15 20.9 H15 M49 20.9 H79"/>
        </g>
        <g stroke="#1a1512" stroke-width="1.4">
          <path d="M0 0 H64 M0 20 H64 M0 40 H64 M0 0 V20 M32 0 V20 M64 0 V20 M16 20 V40 M48 20 V40"/>
        </g>
      </pattern>

      <radialGradient id="g-ruby" cx="45%" cy="40%" r="75%">
        <stop offset="0%"  stop-color="#ff5d70"/>
        <stop offset="50%" stop-color="#b3142a"/>
        <stop offset="100%" stop-color="#5a0812"/>
      </radialGradient>
      <radialGradient id="g-sapphire" cx="45%" cy="40%" r="75%">
        <stop offset="0%"  stop-color="#6f95ff"/>
        <stop offset="50%" stop-color="#1f3fb8"/>
        <stop offset="100%" stop-color="#0a1656"/>
      </radialGradient>
      <radialGradient id="g-emerald" cx="45%" cy="40%" r="75%">
        <stop offset="0%"  stop-color="#63e39a"/>
        <stop offset="50%" stop-color="#128a4d"/>
        <stop offset="100%" stop-color="#053c22"/>
      </radialGradient>
      <radialGradient id="g-amber" cx="45%" cy="40%" r="75%">
        <stop offset="0%"  stop-color="#ffd27a"/>
        <stop offset="50%" stop-color="#e08a12"/>
        <stop offset="100%" stop-color="#6b3a02"/>
      </radialGradient>
      <radialGradient id="g-amethyst" cx="45%" cy="40%" r="75%">
        <stop offset="0%"  stop-color="#d59bff"/>
        <stop offset="50%" stop-color="#7a2fb4"/>
        <stop offset="100%" stop-color="#32104f"/>
      </radialGradient>
      <radialGradient id="g-gold" cx="45%" cy="40%" r="75%">
        <stop offset="0%"  stop-color="#fff2b0"/>
        <stop offset="50%" stop-color="#e8b93a"/>
        <stop offset="100%" stop-color="#7a5a0a"/>
      </radialGradient>
      <radialGradient id="g-core" cx="42%" cy="38%" r="80%">
        <stop offset="0%"  stop-color="#ffffff"/>
        <stop offset="45%" stop-color="#fff6d8"/>
        <stop offset="80%" stop-color="#e8b93a"/>
        <stop offset="100%" stop-color="#7a5a0a"/>
      </radialGradient>

      <radialGradient id="sunGrad" gradientUnits="userSpaceOnUse" cx="100" cy="368" r="330">
        <stop id="sunStop0" offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
        <stop id="sunStop1" offset="55%" stop-color="#c9d8ff" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#c9d8ff" stop-opacity="0"/>
      </radialGradient>

      <filter id="antique" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="wob"/>
        <feColorMatrix in="noise" type="matrix"
          values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="lum"/>
        <feComponentTransfer in="lum" result="mottle">
          <feFuncR type="linear" slope="0.38" intercept="0.31"/>
          <feFuncG type="linear" slope="0.38" intercept="0.31"/>
          <feFuncB type="linear" slope="0.38" intercept="0.31"/>
        </feComponentTransfer>
        <feBlend in="wob" in2="mottle" mode="overlay" result="blended"/>
        <feComposite in="blended" in2="wob" operator="in"/>
      </filter>

      <filter id="poolBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>

      <clipPath id="winClip"><circle cx="400" cy="368" r="300"/></clipPath>
      <clipPath id="floorClip"><rect x="-120" y="692" width="1040" height="140"/></clipPath>

      <symbol id="spoke" overflow="visible">
        <path d="M-6 -56 L-9.5 -302 L9.5 -302 L6 -56 Z" transform="translate(1.2 1.2)" fill="#181310"/>
        <path d="M-6 -56 L-9.5 -302 L9.5 -302 L6 -56 Z" fill="#4a4038"/>
        <path d="M-6 -56 L-9.5 -302 L9.5 -302 L6 -56 Z" transform="translate(-1.4 -1.4)" fill="#7a6c60" opacity=".85"/>
        <path d="M-6 -56 L-9.5 -302 L9.5 -302 L6 -56 Z" transform="translate(1.2 1.2)" fill="none" stroke="#0d0a08" stroke-width="1"/>
      </symbol>
      <symbol id="spoke-short" overflow="visible">
        <path d="M-4.5 -268 L-6.5 -302 L6.5 -302 L4.5 -268 Z" transform="translate(1 1)" fill="#181310"/>
        <path d="M-4.5 -268 L-6.5 -302 L6.5 -302 L4.5 -268 Z" fill="#4a4038"/>
        <path d="M-4.5 -268 L-6.5 -302 L6.5 -302 L4.5 -268 Z" transform="translate(-1.2 -1.2)" fill="#7a6c60" opacity=".8"/>
      </symbol>
    </defs>

    <!-- stone frame of ashlar, drawn dark backing for glass -->
    <g id="frameback">
      <circle cx="400" cy="368" r="326" fill="#141009"/>
      <circle cx="400" cy="368" r="322" fill="url(#ashlar)"/>
      <circle cx="400" cy="368" r="300" fill="#14100c"/>
      <circle cx="400" cy="368" r="322" fill="none" stroke="#0d0a08" stroke-width="2"/>
      <circle cx="398.5" cy="366.5" r="322" fill="none" stroke="#5a4d42" stroke-width="1" opacity=".6"/>
      <circle cx="400" cy="368" r="300" fill="none" stroke="#0d0a08" stroke-width="2.4"/>
      <!-- faint gothic arch ghosting in the nave behind the window -->
      <path d="M78 500 L78 250 Q78 40 400 18 Q722 40 722 250 L722 500" fill="none" stroke="#241f1a" stroke-width="10" opacity=".55"/>
      <path d="M78 500 L78 250 Q78 40 400 18 Q722 40 722 250 L722 500" fill="none" stroke="#3a322a" stroke-width="1.5" opacity=".5"/>
    </g>

    <!-- the glass: built by script, passed through the antique filter as one layer -->
    <g id="glass" filter="url(#antique)"></g>

    <!-- chamfered stone: rings and spokes -->
    <g id="stone" class="stone"></g>

    <!-- daylight: multiply tint + screen sun bloom, clipped to the window -->
    <g clip-path="url(#winClip)">
      <rect id="tint" class="tintlayer blend-multiply" x="96" y="64" width="608" height="608" fill="#dfe9ff" opacity="0.85"/>
      <circle id="sunBloom" class="sunlayer blend-screen" cx="400" cy="368" r="300" fill="url(#sunGrad)"/>
    </g>

    <!-- coloured light pooling on the nave floor -->
    <g class="poollayer" clip-path="url(#floorClip)">
      <use id="floorPool" href="#glass"></use>
    </g>
  </svg>
  <canvas id="motes" aria-hidden="true"></canvas>
  <div class="tooltip" id="tooltip" aria-hidden="true"></div>
</figure>

<p class="caption" id="caption"><b>The rose turns</b> — hover or tab to any pane to read its subject and its story.</p>

<footer>Lux perpetua · glass and light, nine hundred years on</footer>

<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var CX = 400, CY = 368, R = 300;
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = document.getElementById('rose');
  var glass = document.getElementById('glass');
  var stone = document.getElementById('stone');
  var tooltip = document.getElementById('tooltip');
  var caption = document.getElementById('caption');
  var stage = document.getElementById('stage');

  function P(r, deg){ var a = deg*Math.PI/180; return [CX + r*Math.sin(a), CY - r*Math.cos(a)]; }
  function pt(p){ return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  function el(name, attrs){
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  /* annulus sector between radii r0<r1 and angles a0<a1 (degrees) */
  function sector(r0, r1, a0, a1){
    return 'M ' + pt(P(r1,a0)) +
      ' A ' + r1 + ' ' + r1 + ' 0 0 1 ' + pt(P(r1,a1)) +
      ' L ' + pt(P(r0,a1)) +
      ' A ' + r0 + ' ' + r0 + ' 0 0 0 ' + pt(P(r0,a0)) + ' Z';
  }
  /* lancet pane: straight-ish sides along radii, pointed Gothic apex (two quadratics) */
  function lancet(c, r0, r1, hw, tip){
    var b0 = P(r0, c - hw), b1 = P(r0, c + hw);
    var s0 = P(r1, c - hw*0.62), s1 = P(r1, c + hw*0.62);
    var cA = P(tip*0.985, c - hw*0.28), cB = P(tip*0.985, c + hw*0.28);
    var apex = P(tip, c);
    return 'M ' + pt(b0) +
      ' L ' + pt(s0) +
      ' Q ' + pt(cA) + ' ' + pt(apex) +
      ' Q ' + pt(cB) + ' ' + pt(s1) +
      ' L ' + pt(b1) +
      ' A ' + r0 + ' ' + r0 + ' 0 0 0 ' + pt(b0) + ' Z';
  }

  /* ---------- pane subjects ---------- */
  var JEWELS = ['ruby','sapphire','emerald','amber','amethyst','gold'];
  var SAINTS = [
    ['The Annunciation','ruby','A girl in Nazareth looks up from her spinning; the angel’s greeting arrives like light through glass.'],
    ['The Nativity','sapphire','A stable at Bethlehem, and the first night the shepherds count stars out loud.'],
    ['The Adoration of the Magi','gold','Three gifts for a child who will learn early what kings are for.'],
    ['The Baptism in the Jordan','sapphire','The water stands aside like a usher, and a dove comes down on business.'],
    ['The Wedding at Cana','ruby','Six jars of water went in; the steward suspects no one of the best wine.'],
    ['The Temptation in the Wild','amber','Forty days of hunger, and a clever voice offering him the map of every city.'],
    ['The Transfiguration','amethyst','One white-hot instant of the world to come — and the disciples sleep through it.'],
    ['The Raising of Lazarus','emerald','Four days dead, and still the voice at the mouth of the tomb sounds like a friend.'],
    ['The Triumphal Entry','gold','Palm branches under a borrowed colt; hosannas that will curdle by Friday.'],
    ['The Crucifixion','ruby','The centre of the window, as of the year: a black hour the glass refuses to make pretty.'],
    ['The Resurrection','sapphire','The stone rolled away like a struck bell; the gardener does not recognise him.'],
    ['Pentecost','amber','Tongues of fire, and at last everyone hears the news in their own language.']
  ];
  var MONTHS = [
    ['January · the Feast','amber','The year begins indoors: warm hands, long stories, a fire kept from going out.'],
    ['February · the Pruning Hook','emerald','Winter’s vine is cut back so it bears more — the glassmen knew that bargain well.'],
    ['March · the Plough','sapphire','The soil turns over smelling of iron; seed goes under it on faith.'],
    ['April · the Maying','ruby','Lovers walk the greenwood with blossomed staves and borrowed crowns.'],
    ['May · the Hawking','amethyst','Hawks and hoods and small talk in the camp — the noble month of the calendar.'],
    ['June · the Scythe','emerald','The first hay falls; the meadow smells of green ink drying.'],
    ['July · the Reaping','gold','Barley bends under the sickle while the steward watches the wain.'],
    ['August · the Threshing','amber','Flails beat a steady answer to the heat; the barn aces white with chaff.'],
    ['September · the Vintage','ruby','The grapes go under the press-foot; the vat hums its purple song.'],
    ['October · the Sowing','emerald','Acorns for the swine, wheat for the furrow — winter provisioned twice over.'],
    ['November · the Wood-gathering','sapphire','The axe sings at the block; every household counts its sticks against the frost.'],
    ['December · the Boar Spear','amethyst','Hunt and hazard in the cold — the year’s last long breath before the feast.']
  ];
  var DAYS = [
    ['Day I — Light divided','sapphire','“Let there be light”: the first cut the day ever made, bright from dark.'],
    ['Day II — the Firmament','emerald','A sky set up like a tent pavilion, and the waters placed above and below it.'],
    ['Day III — Earth and Seed','ruby','Dry land surfaces out of the deep, at once wearing coats of green seed.'],
    ['Day IV — Sun, Moon, Stars','amber','Lights hung to rule the day and the night — and the clockwork of the seasons with them.'],
    ['Day V — Fish and Fowl','amethyst','The waters teem and the skies are people; blessing given to be fruitful twice over.'],
    ['Day VI — Beast and Man','gold','Cattle, creeping things, and at the last a creature made in the image of the maker.']
  ];
  var PROPHETS = ['Isaiah','Jeremiah','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Habakkuk','Zephaniah','Malachi'];
  var PROPHET_STORIES = [
    'who saw the Lord high and lifted up, and called himself unclean lips',
    'who wept over the city he was ordered to build',
    'who set his face like flint, and saw wheels within wheels',
    'who kept his windows open toward Jerusalem, lions notwithstanding',
    'who was told to love a woman who would not stay loved',
    'who preached locusts, then plenty, then poured-out spirit',
    'who let justice roll down like waters, and righteousness like an ever-flowing stream',
    'who spoke for the little nations the great ones trampled',
    'the reluctant missionary who preferred a storm to a forgiveable city',
    'who stood his watch and waited till the vision overtook him',
    'who promised a God who quiets you with singing',
    'who foretold the sun of righteousness rising with healing in its wings'
  ];
  var ANGELS = ['Michael','Gabriel','Raphael','Uriel','the Six-winged','the Cherubim','the Dominions','the Virtues','the Powers','the Principalities','the Archangels','the Little Ones'];
  var ANGEL_STORIES = [
    'who carries the banner against the dragon',
    'of the Annunciation, and of the fever that broke at his word',
    'the healer who travelled disguised as a friend of the family',
    'of the flame, and of the repentance that follows it',
    'who stand round the throne crying holy, holy, holy',
    'who keeps the way of the tree of life with a turned sword',
    'who hold the orders of the cosmos in their keeping',
    'who work the signs the prophets then try to explain',
    'who keep the dark at a respectful distance',
    'set over cities — including this one, the builders liked to think',
    'stationed at the four winds like four careful doors',
    'whose angels always see the face of the Father'
  ];

  function addPane(d, jewel, title, story){
    var p = el('path', {
      d: d, class: 'pane', fill: 'url(#g-' + jewel + ')',
      stroke: '#160f0a', 'stroke-width': 2.4, 'stroke-linejoin': 'round',
      tabindex: '0', role: 'img', 'aria-label': title
    });
    p.dataset.title = title;
    p.dataset.story = story;
    glass.appendChild(p);
    return p;
  }

  /* ---------- build glass: 24 border, 12 tall, 12 month, 6 petals, core ---------- */
  var k, c, i;
  for (k = 0; k < 24; k++){                       /* border panes */
    var isGold = k % 2 === 0;
    var name = isGold ? PROPHETS[k/2] : ANGELS[(k-1)/2];
    var st   = isGold ? PROPHET_STORIES[k/2] : ANGEL_STORIES[(k-1)/2];
    addPane(sector(274, 298.5, k*15 + 1.3, (k+1)*15 - 1.3), isGold ? 'gold' : 'sapphire',
      (isGold ? 'Prophet ' : '') + name,
      name + ' — ' + st + '.');
  }
  for (i = 0; i < 12; i++){                        /* tall lancets — saints & Gospel scenes */
    c = 15 + i*30;
    addPane(lancet(c, 138, 222, 11.5, 231), SAINTS[i][1], SAINTS[i][0], SAINTS[i][2]);
  }
  for (i = 0; i < 12; i++){                        /* short lancets — Labours of the Months */
    c = 15 + i*30;
    addPane(lancet(c, 238, 260, 12, 269.5), MONTHS[i][1], MONTHS[i][0], MONTHS[i][2]);
  }
  for (i = 0; i < 6; i++){                         /* rosette petals — Six Days of Creation */
    c = 15 + i*60;
    var a = c*Math.PI/180;
    var rx = CX + 44*Math.sin(a), ry = CY - 44*Math.cos(a);
    var pe = el('ellipse', {
      cx: rx.toFixed(1), cy: ry.toFixed(1), rx: 15, ry: 17.5,
      transform: 'rotate(' + c + ' ' + rx.toFixed(1) + ' ' + ry.toFixed(1) + ')',
      class: 'pane', fill: 'url(#g-' + DAYS[i][1] + ')',
      stroke: '#160f0a', 'stroke-width': 2.2,
      tabindex: '0', role: 'img', 'aria-label': DAYS[i][0]
    });
    pe.dataset.title = DAYS[i][0];
    pe.dataset.story = DAYS[i][2];
    glass.appendChild(pe);
  }
  var core = el('circle', {                         /* the Mystic Rose */
    cx: CX, cy: CY, r: 24, class: 'pane', fill: 'url(#g-core)',
    stroke: '#160f0a', 'stroke-width': 2.2, tabindex: '0', role: 'img',
    'aria-label': 'The Mystic Rose'
  });
  core.dataset.title = 'The Mystic Rose';
  core.dataset.story = 'Flos florum — the flower of Jesse, root of David: white gold at the nave of every spoke.';
  glass.appendChild(core);
  /* small decorative stamen on the core */
  var stamen = el('path', { d:'', fill:'none', stroke:'#7a5a0a', 'stroke-width':1.4, opacity:'.8', 'pointer-events':'none' });
  (function(){
    var d = '';
    for (var s = 0; s < 8; s++){
      var e = P(9, s*45), f = P(17, s*45);
      d += 'M ' + pt(e) + ' L ' + pt(f) + ' ';
    }
    stamen.setAttribute('d', d);
  })();
  glass.appendChild(stamen);

  /* ---------- build stone: rings + instanced spokes ---------- */
  function chamferRing(r, w){
    stone.appendChild(el('circle', { cx:CX, cy:CY, r:r, fill:'none', stroke:'#181310', 'stroke-width': w }));
    stone.appendChild(el('circle', { cx:CX, cy:CY, r:r, fill:'none', stroke:'#4a4038', 'stroke-width': w*0.7 }));
    stone.appendChild(el('circle', { cx:CX-1.5, cy:CY-1.5, r:r, fill:'none', stroke:'#7a6c60', 'stroke-width': 1.5, opacity:'.9' }));
  }
  [60,136,234,272].forEach(function(r){ chamferRing(r, 10); });
  for (i = 0; i < 12; i++){
    var u = el('use', { href:'#spoke', transform: 'rotate(' + (30*i) + ' ' + CX + ' ' + CY + ')' });
    stone.appendChild(u);
  }
  for (i = 0; i < 12; i++){
    var u2 = el('use', { href:'#spoke-short', transform: 'rotate(' + (15 + 30*i) + ' ' + CX + ' ' + CY + ')' });
    stone.appendChild(u2);
  }
  /* little bosses where spokes meet the great rings */
  [136,234,272].forEach(function(r){
    for (i = 0; i < 12; i++){
      var bp = P(r, i*30);
      stone.appendChild(el('circle', { cx:bp[0].toFixed(1), cy:bp[1].toFixed(1), r:5.5, fill:'#4a4038', stroke:'#181310', 'stroke-width':1.5 }));
    }
  });

  /* ---------- seasons ---------- */
  var SEASONS = {
    winter:  { tint:'#dfe9ff', mote:[223,233,255], sun:['#ffffff','#c9d8ff'] },
    summer:  { tint:'#ffe9b8', mote:[255,233,184], sun:['#fff6dc','#ffd47a'] },
    evening: { tint:'#ffb56b', mote:[255,181,107], sun:['#ffd9a6','#ff8a3c'] }
  };
  var season = 'winter';
  var tint = document.getElementById('tint');
  var sunStop0 = document.getElementById('sunStop0');
  var sunStop1 = document.getElementById('sunStop1');
  var sunStop2 = svg.querySelector('#sunGrad stop:last-child');
  function applySeason(name){
    season = name;
    var s = SEASONS[name];
    tint.setAttribute('fill', s.tint);
    sunStop0.setAttribute('stop-color', s.sun[0]);
    sunStop1.setAttribute('stop-color', s.sun[1]);
    sunStop2.setAttribute('stop-color', s.sun[1]);
    document.querySelectorAll('.seasons button').forEach(function(b){
      b.setAttribute('aria-checked', b.dataset.season === name ? 'true' : 'false');
    });
  }
  document.querySelectorAll('.seasons button').forEach(function(b){
    b.addEventListener('click', function(){ applySeason(b.dataset.season); });
  });
  applySeason('winter');

  /* ---------- sun arc + floor pool ---------- */
  var pool = document.getElementById('floorPool');
  var sunAngle = REDUCED ? 0.62 : 0;
  function updateSky(t){
    /* t: 0..1 fraction of the 90s cycle; sun sweeps a full arc behind the window */
    var a = Math.PI * (1.12 - 2.24 * t);           /* rises left, sets right */
    sunAngle = a;
    var sx = CX + Math.cos(a) * 400, sy = CY - Math.abs(Math.sin(a)) * 300 - 40;
    var grad = svg.getElementById('sunGrad');
    grad.setAttribute('cx', sx.toFixed(1));
    grad.setAttribute('cy', sy.toFixed(1));
    /* pool slides and skews so light lands opposite the sun */
    var slide = -Math.cos(a) * 110;
    var skew = -28 - Math.cos(a) * 14;
    pool.setAttribute('transform',
      'translate(' + (400 + slide).toFixed(1) + ' 688) skewX(' + skew.toFixed(1) + ') scale(1 0.34) translate(' + (-CX) + ' ' + (-CY) + ')');
  }
  updateSky(0.5);

  /* ---------- dust motes canvas ---------- */
  var canvas = document.getElementById('motes');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var motes = [];
  function seedMotes(){
    var n = Math.max(100, Math.min(160, Math.round(W*H/11000)));
    motes = [];
    for (var m = 0; m < n; m++){
      motes.push({
        x: Math.random()*W, y: Math.random()*H,
        z: 0.25 + Math.random()*0.75,
        sp: 8 + Math.random()*20,
        ph: Math.random()*Math.PI*2,
        sw: 0.4 + Math.random()*1.1
      });
    }
  }
  function sizeCanvas(){
    var rect = stage.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = rect.width; H = rect.height;
    canvas.width = Math.max(1, Math.round(W*DPR));
    canvas.height = Math.max(1, Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    seedMotes();
  }
  function drawMotes(){
    ctx.clearRect(0,0,W,H);
    var col = SEASONS[season].mote;
    /* beam: apex at window centre, leaning away from the sun */
    var ax = CX/800*W, ay = CY/820*H;
    var tilt = -Math.cos(sunAngle) * 0.32;
    for (var m = 0; m < motes.length; m++){
      var d = motes[m];
      var v = d.y - ay;
      var u = d.x - ax;
      var f = 0;
      if (v > 0){
        var ang = Math.atan2(u, v);
        var dd = Math.abs(ang - tilt);
        f = Math.max(0, 1 - dd/0.24);
        f = f*f*(3-2*f);
      }
      var a = (0.05 + 0.22*d.z) + f*(0.5 + 0.35*d.z);
      ctx.beginPath();
      ctx.arc(d.x, d.y, 0.6 + d.z*1.5 + f*0.9, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + Math.min(0.85, a).toFixed(3) + ')';
      ctx.fill();
    }
  }
  var lastT = performance.now();
  function stepMotes(now){
    var dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    for (var m = 0; m < motes.length; m++){
      var d = motes[m];
      d.y += d.sp * (0.35 + d.z*0.85) * dt;
      d.x += Math.sin(now/1000 * d.sw + d.ph) * 14 * dt * d.z;
      if (d.y > H + 4){ d.y = -4; d.x = Math.random()*W; }
    }
  }

  /* ---------- tooltip + caption ---------- */
  var DEFAULT_CAP = caption.innerHTML;
  function showInfo(node, cx, cy){
    tooltip.innerHTML = '<span class="t-sub"></span><span class="t-story"></span>';
    tooltip.querySelector('.t-sub').textContent = node.dataset.title;
    tooltip.querySelector('.t-story').textContent = node.dataset.story;
    tooltip.classList.add('show');
    var sr = stage.getBoundingClientRect();
    var tx = cx - sr.left + 16, ty = cy - sr.top + 16;
    tx = Math.min(tx, sr.width - 262);
    ty = Math.min(ty, sr.height - 90);
    tooltip.style.left = Math.max(4, tx) + 'px';
    tooltip.style.top = Math.max(4, ty) + 'px';
    caption.innerHTML = '<b>' + node.dataset.title + '</b> &nbsp;·&nbsp; ' + node.dataset.story;
  }
  function hideInfo(){
    tooltip.classList.remove('show');
    caption.innerHTML = DEFAULT_CAP;
  }
  glass.addEventListener('pointermove', function(e){
    if (e.target.classList && e.target.classList.contains('pane')) showInfo(e.target, e.clientX, e.clientY);
  });
  glass.addEventListener('pointerover', function(e){
    if (e.target.classList && e.target.classList.contains('pane')) showInfo(e.target, e.clientX, e.clientY);
  });
  glass.addEventListener('pointerout', function(e){
    if (e.target.classList && e.target.classList.contains('pane')) hideInfo();
  });
  glass.addEventListener('focusin', function(e){
    var t = e.target;
    if (t.classList && t.classList.contains('pane')){
      var r = t.getBoundingClientRect();
      showInfo(t, r.left + r.width/2, r.top + r.height/2);
    }
  });
  glass.addEventListener('focusout', hideInfo);

  /* ---------- main loop ---------- */
  var t0 = performance.now();
  function loop(now){
    if (REDUCED){ return; }
    var t = ((now - t0) / 90000) % 1;              /* 90-second solar cycle */
    updateSky(t);
    stepMotes(now);
    drawMotes();
    requestAnimationFrame(loop);
  }
  sizeCanvas();
  window.addEventListener('resize', function(){ sizeCanvas(); if (REDUCED) drawMotes(); });
  if (REDUCED){
    updateSky(0.24);
    drawMotes();
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
