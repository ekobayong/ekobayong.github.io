<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＬＵＮＡＲ ＷＩＮＤ — Vaporwave Sunset</title>
<style>
  :root{
    --pink:#ff71ce; --cyan:#01cdfe; --mint:#05ffa1; --violet:#b967ff;
    --pale:#fffb96; --night:#12002a; --grid-speed:4s;
    --serif:Palatino,'Iowan Old Style',Georgia,ui-serif,serif;
    --mono:ui-monospace,'Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--night);
    overflow:hidden;
    font-family:var(--mono);
    color:#fff;
  }
  .world{position:fixed; inset:0; perspective:1000px; overflow:hidden}

  /* ============ sky ============ */
  .sky{
    position:absolute; left:0; right:0; top:0; height:66%;
    background:linear-gradient(to bottom,
      #0a0020 0%, #0a0020 8%, #2b0a5e 42%, #7a2a9e 58%,
      var(--pink) 64.5%, var(--pink) 100%);
    z-index:0;
  }
  .star{
    position:absolute; width:7px; height:7px; border-radius:50%;
    z-index:1; opacity:.85;
    animation:twinkle 3.4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.15; transform:scale(.8)} to{opacity:.95; transform:scale(1.15)} }
  .haze{
    position:absolute; left:-5%; right:-5%; top:60%; height:12%;
    background:linear-gradient(to bottom, transparent, rgba(255,113,206,.55) 45%, rgba(255,113,206,.6) 60%, transparent);
    filter:blur(6px);
    z-index:4; pointer-events:none;
  }

  /* ============ sun ============ */
  .sun-wrap{
    position:absolute; top:20%; left:0; right:0; height:0;
    display:flex; justify-content:center; align-items:center;
    z-index:2;
    will-change:transform;
  }
  .sun-glow{
    position:absolute; width:min(34vmin,280px); height:min(34vmin,280px);
    border-radius:50%;
    box-shadow:0 0 80px 30px rgba(255,113,206,.55),
               0 0 200px 80px rgba(255,251,150,.28);
    animation:sun-drift 40s ease-in-out infinite alternate;
  }
  .sun{
    position:absolute;
    width:min(46vmin,380px); height:min(46vmin,380px);
    border-radius:50%;
    background:linear-gradient(to bottom,
      var(--pale) 0%, #ffb347 34%, var(--pink) 68%, var(--violet) 100%);
    -webkit-mask-image:linear-gradient(to bottom,
      #000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%,
      #000 67% 73.5%, transparent 73.5% 78.5%, #000 78.5% 83%,
      transparent 83% 89%, #000 89% 92%, transparent 92% 100%);
    mask-image:linear-gradient(to bottom,
      #000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%,
      #000 67% 73.5%, transparent 73.5% 78.5%, #000 78.5% 83%,
      transparent 83% 89%, #000 89% 92%, transparent 92% 100%);
    animation:sun-drift 40s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes sun-drift{ from{transform:translateY(0)} to{transform:translateY(4vh)} }

  /* ============ ground ============ */
  .scene{
    position:absolute; left:0; right:0; top:0; bottom:0;
    perspective:520px; perspective-origin:50% 40%;
    z-index:3; pointer-events:none; overflow:hidden;
  }
  .floor{
    position:absolute; top:66%; left:-100%;
    width:300%; height:130%;
    transform-origin:50% 0; transform:rotateX(72deg);
    background-image:
      linear-gradient(to right, transparent calc(50% - 1px), rgba(1,205,254,.95) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      repeating-linear-gradient(to right, rgba(1,205,254,.55) 0 2px, transparent 2px 80px),
      repeating-linear-gradient(to bottom, rgba(255,113,206,.55) 0 2px, transparent 2px 80px);
    background-repeat:no-repeat, repeat, repeat;
    animation:grid-scroll var(--grid-speed) linear infinite;
  }
  @keyframes grid-scroll{
    from{ background-position:0 0, 0 0, 0 0; }
    to  { background-position:0 0, 0 0, 0 80px; }
  }
  .floor-fade{
    position:absolute; left:0; right:0; top:66%; bottom:0;
    background:linear-gradient(to bottom,
      rgba(255,113,206,.4) 0%, rgba(255,113,206,.08) 12%,
      rgba(18,0,42,.15) 55%, rgba(10,0,26,.85) 100%);
    z-index:4; pointer-events:none;
  }
  .checker{
    position:absolute; left:50%; bottom:-6vmin;
    width:60vmin; height:60vmin; margin-left:-30vmin;
    border-radius:50%;
    background:repeating-conic-gradient(from 0deg,
      rgba(185,103,255,.5) 0% 12%, rgba(43,10,94,.45) 12% 24%);
    opacity:.5;
    -webkit-mask-image:radial-gradient(circle, #000 25%, transparent 72%);
    mask-image:radial-gradient(circle, #000 25%, transparent 72%);
    animation:checker-spin 40s linear infinite;
    z-index:3;
  }
  @keyframes checker-spin{
    from{ transform:rotateX(74deg) rotate(0deg); }
    to  { transform:rotateX(74deg) rotate(360deg); }
  }

  /* ============ palms ============ */
  .palm{
    position:absolute; bottom:33%; width:22vw; max-width:340px;
    z-index:5; pointer-events:none;
    filter:drop-shadow(0 0 14px rgba(255,113,206,.28));
  }
  .palm.left{ left:-2.5vw }
  .palm.right{ right:-2.5vw; transform:scaleX(-1) }
  .palm svg{ display:block; width:100%; height:auto; transform-origin:50% 100%;
    animation:sway 6.5s ease-in-out infinite alternate; }
  .palm.right svg{ animation-delay:-3.1s }
  @keyframes sway{ from{transform:rotate(-1.3deg)} to{transform:rotate(1.3deg)} }

  /* ============ title ============ */
  .title-wrap{
    position:absolute; top:46%; left:0; right:0;
    text-align:center; z-index:8;
    will-change:transform;
  }
  h1.chrome{
    font-family:var(--serif); font-weight:700;
    font-size:clamp(30px, 8.5vw, 132px);
    letter-spacing:.04em;
    line-height:1;
    background:linear-gradient(to bottom,
      #ffffff 0%, var(--cyan) 36%, #063a55 49%,
      #ffffff 51%, var(--pink) 72%, var(--violet) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.45);
    animation:chrome-glow 6s ease-in-out infinite alternate;
  }
  @keyframes chrome-glow{
    from{ filter:drop-shadow(4px 4px 0 rgba(185,103,255,.95))
                  drop-shadow(8px 8px 0 rgba(50,8,80,.95))
                  drop-shadow(0 0 22px rgba(1,205,254,.85)); }
    to  { filter:drop-shadow(4px 4px 0 rgba(185,103,255,.95))
                  drop-shadow(8px 8px 0 rgba(50,8,80,.95))
                  drop-shadow(0 0 22px rgba(255,113,206,.85)); }
  }
  .side-b{
    margin-top:14px;
    color:var(--mint); font-size:clamp(11px,1.5vw,17px);
    letter-spacing:.18em;
    text-shadow:0 0 8px rgba(5,255,161,.8);
  }
  .caption{
    position:absolute; top:18px; right:22px; z-index:8;
    font-size:12px; letter-spacing:.14em;
    color:rgba(255,255,255,.75);
    text-shadow:0 0 10px rgba(185,103,255,.9);
    text-align:right; line-height:1.7;
  }

  /* ============ bust ============ */
  .bust{
    position:absolute; top:28%; left:57%;
    width:clamp(96px, 13vw, 180px);
    z-index:6; pointer-events:none;
    will-change:transform;
  }
  .bust-float{
    animation:bust-float 9s ease-in-out infinite alternate;
    filter:drop-shadow(0 0 26px rgba(185,103,255,.65));
  }
  @keyframes bust-float{
    from{ transform:translateY(-22px) rotate(-2deg); }
    to  { transform:translateY(22px) rotate(2deg); }
  }
  .bust svg{ display:block; width:100%; height:auto }

  /* ============ retro window ============ */
  .win{
    position:fixed; left:18px; bottom:18px; width:320px;
    background:#c0c0c0; color:#000;
    border:2px solid; border-color:#fff #404040 #404040 #fff;
    box-shadow:1px 1px 0 #000, 6px 6px 12px rgba(0,0,0,.5);
    font:12px/1.45 system-ui, sans-serif;
    z-index:30;
  }
  .win-bar{
    display:flex; align-items:center; gap:6px;
    background:linear-gradient(90deg,#00007b,#1084d0);
    color:#fff; font-weight:700; padding:3px 4px;
    user-select:none;
  }
  .win-icon{
    width:14px; height:14px; flex:none;
    background:linear-gradient(135deg,var(--pink),var(--cyan));
    border:1px solid #000;
  }
  .win-title{flex:1; font-size:12px; white-space:nowrap; overflow:hidden}
  .tb{
    width:18px; height:16px; flex:none;
    background:#c0c0c0; color:#000;
    border:2px solid; border-color:#fff #404040 #404040 #fff;
    font:700 10px/1 system-ui,sans-serif; cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .tb:active{border-color:#404040 #fff #fff #404040}
  .win-menu{
    display:flex; gap:14px; padding:2px 8px 3px;
    border-bottom:1px solid #808080;
    box-shadow:inset 0 -1px 0 #fff;
    background:#c0c0c0;
  }
  .mi{
    background:none; border:0; padding:1px 2px; cursor:pointer;
    font:12px system-ui,sans-serif; color:#000;
  }
  .mi:hover{background:#00007b; color:#fff}
  .mi u{text-decoration:underline}
  .lcd{
    margin:8px; padding:6px 9px;
    background:#020402; color:var(--mint);
    font:11px/1.75 var(--mono);
    border:2px solid; border-color:#404040 #fff #fff #404040;
    text-shadow:0 0 4px rgba(5,255,161,.8);
  }
  .lcd .lbl{color:var(--pink); text-shadow:0 0 4px rgba(255,113,206,.8)}
  .lcd .row{display:flex; justify-content:space-between; gap:8px}
  .lcd .val{text-align:right; white-space:nowrap; overflow:hidden; max-width:190px}
  .progress{
    height:16px; margin:0 8px;
    background:#000; position:relative; overflow:hidden;
    border:2px solid; border-color:#404040 #fff #fff #404040;
  }
  .progress .fill{
    position:absolute; left:0; top:0; bottom:0; width:0;
    background:repeating-linear-gradient(45deg, #000080 0 6px, #123c96 6px 12px);
    animation:fill 20s linear infinite;
    animation-play-state:paused;
  }
  body.playing .progress .fill{ animation-play-state:running }
  @keyframes fill{ from{width:0} to{width:100%} }
  .btnrow{display:flex; gap:6px; padding:8px}
  .wbtn{
    flex:1; background:#c0c0c0; color:#000;
    border:2px solid; border-color:#fff #404040 #404040 #fff;
    box-shadow:1px 1px 0 #000;
    padding:4px 6px; font:12px system-ui,sans-serif; cursor:pointer;
  }
  .wbtn:active, .wbtn[aria-pressed="true"]{
    border-color:#404040 #fff #fff #404040;
    box-shadow:none; padding:5px 5px 3px 7px;
  }
  .statusbar{
    display:grid; grid-template-columns:1.6fr 1fr; gap:3px;
    padding:0 6px 6px;
  }
  .sc{
    border:2px solid; border-color:#404040 #fff #fff #404040;
    padding:2px 6px; font:10px/1.5 var(--mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .restore{
    position:fixed; left:18px; bottom:18px; z-index:31;
    display:none; background:#c0c0c0;
    border:2px solid; border-color:#fff #404040 #404040 #fff;
    box-shadow:1px 1px 0 #000, 4px 4px 8px rgba(0,0,0,.5);
    font:11px var(--mono); padding:4px 9px; cursor:pointer;
  }
  body.win-closed .restore{ display:block }
  body.win-closed .win{ display:none }
  body.win-min .win-body{ display:none }
  body.win-wide .win{ width:420px }

  @media (max-width:640px){
    .caption{display:none}
    .bust{width:clamp(64px, 15vw, 104px)}
    .win{transform:scale(.9); transform-origin:left bottom}
  }
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation:none !important;
      transition:none !important;
    }
  }
</style>
</head>
<body>

  <div class="sky"></div>

  <span class="star" style="left:22%; top:21%; background:radial-gradient(circle,#fffb96 0 1.5px,rgba(255,251,150,0) 70%); animation-delay:-0.8s"></span>

  <div class="title-wrap" id="titleWrap">

      <button class="wbtn" id="btnPlay" aria-pressed="false">▶ Play</button>

      <button class="wbtn" id="btnFast">▸▸ Fast</button>
    </div>
    <div class="statusbar">
      <div class="sc" id="statusMain">Ready — press Play.</div>
      <div class="sc" id="statusRight">ＣＨ−２</div>
    </div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  // ---------- grid speed levels ----------
  const LEVELS = [
    { name:'DRIFT',  t:12,  mult:'0.3×' },
    { name:'CRUISE', t:4,   mult:'1.0×' },
    { name:'RUSH',   t:1.4, mult:'2.9×' },
    { name:'HYPER',  t:0.5, mult:'8.0×' }
  ];
  let level = 1;
  let playing = false;
  let seconds = 0;

  function setLevel(i){
    level = Math.max(0, Math.min(LEVELS.length - 1, i));
    const L = LEVELS[level];
    root.style.setProperty('--grid-speed', L.t + 's');
    $('lcdSpeed').textContent = L.mult;
    $('lcdGrid').textContent = L.name;
    $('statusMain').textContent = 'Grid ' + L.name + ' · ' + L.t + 's';
  }
  setLevel(1);

  function setPlaying(p){
    playing = p;
    document.body.classList.toggle('playing', p);
    const btn = $('btnPlay');
    btn.setAttribute('aria-pressed', String(p));
    btn.textContent = p ? '❚❚ Pause' : '▶ Play';
    setLevel(p ? 2 : 1); // RUSH when playing, back to CRUISE on pause
    $('statusMain').textContent = p ? 'Now streaming tomorrow…' : 'Paused — see you yesterday.';
  }
  $('btnPlay').addEventListener('click', () => setPlaying(!playing));
  $('btnSlow').addEventListener('click', () => setLevel(level - 1));
  $('btnFast').addEventListener('click', () => setLevel(level + 1));

  // clock runs only while playing
  const pad = n => String(n).padStart(2, '0');
  setInterval(() => {
    if (!playing) return;
    seconds++;
    $('lcdClock').textContent =
      pad(Math.floor(seconds / 3600) % 24) + ':' + pad(Math.floor(seconds / 60) % 60) + ':' + pad(seconds % 60);
  }, 1000);

  // ---------- faux-OS window chrome ----------
  $('tbMin').addEventListener('click', () => {
    document.body.classList.toggle('win-min');
    $('statusMain').textContent = document.body.classList.contains('win-min') ? 'Minimised.' : 'Restored.';
  });
  $('tbMax').addEventListener('click', () => document.body.classList.toggle('win-wide'));
  $('tbClose').addEventListener('click', () => {
    document.body.classList.add('win-closed');
    setPlaying(false);
  });
  $('btnRestore').addEventListener('click', () => {
    document.body.classList.remove('win-closed');
    $('statusMain').textContent = 'lunar.exe restarted — 1995 again.';
  });
  document.querySelectorAll('.mi').forEach(m =>
    m.addEventListener('click', () => { $('statusMain').textContent = m.dataset.msg; })
  );

  // ---------- lerped mouse parallax (fine pointers only) ----------
  const fine = window.matchMedia('(pointer:fine)').matches;
  if (fine && !reduced.matches){
    const titleWrap = $('titleWrap'), bust = $('bust'), sunWrap = $('sunWrap');
    let tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('mousemove', (e) => {
      tx = (e.clientX / window.innerWidth - 0.5) * 2;
      ty = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    (function raf(){
      cx += (tx - cx) * 0.055;
      cy += (ty - cy) * 0.055;
      titleWrap.style.transform =
        'translate3d(' + (cx * -14).toFixed(2) + 'px,' + (cy * -7).toFixed(2) + 'px,0) rotateY(' + (cx * 5).toFixed(2) + 'deg)';
      bust.style.transform =
        'translate3d(' + (cx * 26).toFixed(2) + 'px,' + (cy * 12).toFixed(2) + 'px,0)';
      sunWrap.style.transform =
        'translate3d(' + (cx * -30).toFixed(2) + 'px,' + (cy * -16).toFixed(2) + 'px,0)';
      requestAnimationFrame(raf);
    })();
  }
})();
</script>
</body>
</html>
