<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahel Meridian — Desert Dunes at Golden Hour</title>
<style>
  :root{
    /* palette — written every frame by the cycle engine */
    --sky1:#5d8fb5; --sky2:#e8b86b; --sky3:#f8dca4;
    --d1:#f1d9a8; --d2:#e4b982; --d3:#d59b62; --d4:#bd7a48; --d5:#9a5a35; --d6:#6e3b24;
    --sun:#fff6d2; --glow:#ffcf8a; --haze:#f6c98d; --caravan:#8a5230;
    --starA:0; --sunA:1;
    --sunx:66%; --suny:22%;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    background:#000;
  }

  .world{ position:fixed; inset:0; overflow:hidden; }

  /* ---------- sky / stars / sun / haze ---------- */
  .sky{
    position:absolute; inset:-6%;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 52%, var(--sky3) 78%, var(--sky3) 100%);
  }
  #stars, #stars2{ position:absolute; left:0; top:0; pointer-events:none; opacity:var(--starA); }
  .sun{
    position:absolute; left:var(--sunx); top:var(--suny);
    width:min(64vmin,620px); aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle closest-side, var(--sun) 0 11%, transparent 11.4%),
      radial-gradient(circle closest-side, var(--glow) 0 19%, transparent 52%),
      radial-gradient(circle closest-side, var(--glow) 0 30%, transparent 72%);
    filter:url(#heat) blur(7px);
    opacity:var(--sunA);
    pointer-events:none;
  }
  .shimmer{ filter:url(#heat); }   /* applied to the far dune layer; the sun chains shimmer + blur */
  .haze-band{
    position:absolute; left:-8%; right:-8%; top:44%; height:14%;
    background: linear-gradient(180deg, transparent, var(--haze) 48%, transparent);
    filter: blur(18px);
    opacity:.55; pointer-events:none;
  }

  /* ---------- dune layers (far → near) ---------- */
  .layer{ position:absolute; left:-10%; right:-10%; bottom:0; will-change:transform; }
  .layer svg.dune{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .layer svg.dune path{ transition: fill 1s linear; }
  .l1{ height:52%; } .l2{ height:44%; } .l3{ height:36%; }
  .l4{ height:29%; } .l5{ height:22%; } .l6{ height:15.5%; }
  .f1 path{ fill:var(--d1); } .f2 path{ fill:var(--d2); } .f3 path{ fill:var(--d3); }
  .f4 path{ fill:var(--d4); } .f5 path{ fill:var(--d5); } .f6 path{ fill:var(--d6); }

  /* ---------- caravan: an svg in layer 4's viewBox, so it walks the ridge ---------- */
  svg.caravan{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:2; pointer-events:none; }
  svg.caravan .g{ fill:var(--caravan); transition:fill 1s linear; }
  .cross{ animation: cross 110s linear infinite; }
  @keyframes cross{ from{ transform:translateX(-820px); } to{ transform:translateX(1780px); } }
  .bob{ animation: bob 1.4s ease-in-out infinite; }
  .bob.b2{ animation-delay:.35s; } .bob.b3{ animation-delay:.7s; } .bob.b4{ animation-delay:1.05s; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }

  /* ---------- sand ---------- */
  #sand{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---------- UI ---------- */
  .title{
    position:absolute; top: clamp(26px, 6.5vh, 64px); left:50%; transform:translateX(-50%);
    text-align:center; z-index:10; width:min(92vw, 860px);
    will-change:transform; pointer-events:none;
  }
  .title h1{
    font-weight:400; text-transform:uppercase;
    font-size: clamp(1.5rem, 4.6vw, 3.4rem);
    letter-spacing:.34em; text-indent:.34em;
    transform: scaleX(1.12);
    color:#fdf3e0;
    text-shadow: 0 2px 22px rgba(80,36,10,.55), 0 0 60px rgba(255,190,110,.35);
  }
  .title .rule{
    width:56%; height:1px; margin:16px auto 12px;
    background: linear-gradient(90deg, transparent, rgba(253,243,224,.85), transparent);
  }
  .title p{
    font-style:italic; font-size: clamp(.72rem, 1.6vw, 1rem);
    color:rgba(253,243,224,.82); text-shadow:0 1px 12px rgba(60,30,8,.6);
  }

  .wind{
    position:absolute; top: clamp(16px,3vh,26px); right: clamp(16px,3vw,30px); z-index:10;
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:.18em;
    color:rgba(253,240,215,.8);
    text-shadow:0 1px 8px rgba(40,20,5,.7);
    user-select:none; pointer-events:none;
  }

  .panel{
    position:absolute; left:50%; bottom: clamp(18px, 4.5vh, 40px); transform:translateX(-50%);
    z-index:11;
    display:flex; align-items:center; gap: clamp(12px,2.4vw,22px);
    padding: 14px clamp(16px,3vw,26px);
    border-radius:16px;
    background: rgba(74,44,22,.42);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    border:1px solid rgba(248,228,164,.4);
    box-shadow: 0 16px 44px rgba(10,5,0,.42), inset 0 1px 0 rgba(255,240,200,.28);
  }
  .panel .lbl{
    font-size:9.5px; letter-spacing:.3em; text-indent:.1em; text-transform:uppercase;
    color:rgba(250,232,190,.85); white-space:nowrap;
  }
  #scrub{ -webkit-appearance:none; appearance:none; width:clamp(140px, 30vw, 320px); height:26px; background:transparent; cursor:pointer; }
  #scrub::-webkit-slider-runnable-track{
    height:8px; border-radius:4px;
    background: linear-gradient(90deg,#f8dca4,#e8b86b 22%,#e3894e 45%,#b2496a 66%,#5a2f5a 84%,#1c1837);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.45);
  }
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%; margin-top:-6px;
    background: radial-gradient(circle at 42% 38%, #fffbe8, var(--sun) 60%);
    box-shadow: 0 0 14px 4px var(--glow), 0 1px 3px rgba(0,0,0,.4);
    border:1px solid rgba(120,70,20,.5);
  }
  #scrub::-moz-range-track{
    height:8px; border-radius:4px;
    background: linear-gradient(90deg,#f8dca4,#e8b86b 22%,#e3894e 45%,#b2496a 66%,#5a2f5a 84%,#1c1837);
  }
  #scrub::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; border:1px solid rgba(120,70,20,.5);
    background: radial-gradient(circle at 42% 38%, #fffbe8, #fff6d2 60%);
    box-shadow: 0 0 14px 4px var(--glow);
  }
  .clock{
    font-family:'Courier New',monospace; font-size:15px; letter-spacing:.1em;
    color:#fdf3e0; min-width:5.2ch; text-align:center;
    text-shadow:0 1px 8px rgba(0,0,0,.5);
  }
  #pause{
    font-family:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#fdf0d8; background:rgba(30,16,6,.4);
    border:1px solid rgba(248,228,164,.45); border-radius:99px;
    padding:8px 16px; cursor:pointer; white-space:nowrap;
    transition: background .25s;
  }
  #pause:hover{ background:rgba(60,32,12,.55); }

  @media (max-width: 640px){
    .panel{ flex-wrap:wrap; justify-content:center; width:min(94vw, 430px); }
    .title h1{ letter-spacing:.24em; }
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .cross{ animation:none; transform:translateX(120px); }
    .bob{ animation:none !important; }
    .shimmer{ filter:none !important; }
    .sun{ filter:none; }
  }
</style>
</head>
<body>

<!-- SVG heat-shimmer filter (SMIL-animated) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="heat" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" values="0.012 0.05;0.016 0.062;0.012 0.05" dur="7s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="5;9;5" dur="4.5s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>
</svg>

<div class="world" id="world">
  <div class="sky"></div>
  <div id="stars"></div>
  <div id="stars2"></div>
  <div class="sun" id="sun"></div>
  <div class="haze-band"></div>

  <!-- six smooth cubic-Bezier ridges, closed to the bottom -->
  <div class="layer l1" data-m="8">
    <svg class="dune f1 shimmer" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 250 C 210 226 420 262 630 240 C 850 217 1050 258 1270 236 C 1420 221 1530 246 1600 232 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l2" data-m="16">
    <svg class="dune f2" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 308 C 230 285 470 318 700 294 C 930 272 1140 316 1360 292 C 1470 281 1540 300 1600 290 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l3" data-m="26">
    <svg class="dune f3" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 352 C 200 340 380 370 590 350 C 800 331 970 368 1180 346 C 1350 328 1480 358 1600 344 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l4" data-m="38">
    <svg class="dune f4" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 414 C 220 398 460 428 700 408 C 940 389 1160 424 1390 404 C 1490 396 1550 410 1600 402 L1600 600 L0 600 Z"/>
    </svg>
    <!-- the caravan shares the dune's viewBox, so it walks the ridge and inherits its colour -->
    <svg class="caravan" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" role="img" aria-label="camel caravan crossing the middle dune">
      <defs>
        <g id="camel">
          <path d="M38 -46 l-5 46 h5 l6 -42 z M60 -42 l-2 42 h5 l4 -42 z M98 -42 l1 42 h5 l3 -42 z M118 -48 l4 48 h5 l0 -46 z"/>
          <ellipse cx="80" cy="-56" rx="48" ry="18"/>
          <path d="M58 -68 Q 70 -92 84 -70 Q 96 -94 110 -68 Z"/>
          <path d="M118 -62 C 132 -68 138 -86 137 -100 L 145 -104 C 152 -105 158 -102 158 -98 L 149 -95 C 150 -92 148 -89 144 -88 C 143 -74 138 -58 126 -50 Z"/>
          <path d="M33 -60 C 25 -56 22 -46 24 -38 L 28 -39 C 27 -47 29 -54 35 -56 Z"/>
        </g>
        <g id="rider">
          <path d="M76 -66 C 74 -78 78 -86 84 -90 C 82 -95 84 -100 89 -100 C 94 -100 96 -95 94 -91 C 100 -86 102 -77 98 -66 Z"/>
        </g>
      </defs>
      <g class="cross g">
        <g transform="translate(40,418) scale(.62)"><g class="bob b1"><use href="#camel"/></g></g>
        <g transform="translate(190,416) scale(.62)"><g class="bob b2"><use href="#camel"/><use href="#rider"/></g></g>
        <g transform="translate(330,422) scale(.4)"><g class="bob b3"><use href="#camel"/></g></g>
        <g transform="translate(420,418) scale(.58)"><g class="bob b4"><use href="#camel"/></g></g>
      </g>
    </svg>
  </div>
  <div class="layer l5" data-m="55">
    <svg class="dune f5" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 462 C 260 444 540 476 820 452 C 1100 430 1350 470 1600 448 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l6" data-m="80">
    <svg class="dune f6" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0 524 C 320 500 640 548 960 516 C 1220 491 1440 534 1600 512 L1600 600 L0 600 Z"/>
    </svg>
  </div>

  <canvas id="sand" aria-hidden="true"></canvas>

  <header class="title" id="title">
    <h1>Sahel Meridian</h1>
    <div class="rule"></div>
    <p>Where the ergs meet the evening — 16° 14′ N, 0° 02′ W</p>
  </header>

  <div class="wind" id="wind">WIND ESE · 14 kn</div>

  <div class="panel" role="group" aria-label="time of day controls">
    <span class="lbl">Time of&nbsp;Day</span>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="time of day scrubber">
    <span class="clock" id="clock">16:40</span>
    <button id="pause">Pause cycle</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var root = document.documentElement.style;

  /* ================= colour keyframes (smoothstep-interpolated) ================= */
  function hx(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  var K = [
    { t:0,    sky:['#5d8fb5','#e8b86b','#f8dca4'],
      d:['#f1d9a8','#e4b982','#d59b62','#bd7a48','#9a5a35','#6e3b24'],
      sun:'#fff6d2', glow:'#ffcf8a' },
    { t:0.35, sky:['#3f5e8c','#e3894e','#f6b975'],
      d:['#e2b384','#cf9566','#b9764b','#9c5c39','#7e452c','#5a3220'],
      sun:'#ffe3a6', glow:'#ffb173' },
    { t:0.62, sky:['#26305a','#b2496a','#ef8a5a'],
      d:['#b07f74','#96635f','#7c4a4d','#63373f','#4a2832','#321b24'],
      sun:'#ff9e63', glow:'#ff7d78' },
    { t:0.82, sky:['#121a3b','#5a2f5a','#c9613f'],
      d:['#7a5f5e','#644c51','#4f3a45','#3b2b38','#281d2a','#171019'],
      sun:'#ffb26a', glow:'#d4705a' },
    { t:1,    sky:['#070a1a','#1c1837','#4a2a3a'],
      d:['#5c4a4a','#4b3c40','#3b2f37','#2c232c','#1f1721','#120c10'],
      sun:'#ffb26a', glow:'#8a4a52' }
  ];
  K.forEach(function(k){
    k.sky = k.sky.map(hx); k.d = k.d.map(hx);
    k.sun = hx(k.sun); k.glow = hx(k.glow);
  });
  function smooth(x){ x = Math.max(0, Math.min(1, x)); return x*x*(3-2*x); }
  function mix(a,b,u){ return [0,1,2].map(function(i){ return Math.round(a[i] + (b[i]-a[i])*u); }); }
  function rgb(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function shade(c,f){ return [Math.round(c[0]*f), Math.round(c[1]*f), Math.round(c[2]*f)]; }

  var clock = document.getElementById('clock');
  var sandTint = 'rgb(241,217,168)';
  function applyColors(t){
    var i = 0; while (i < K.length-2 && t > K[i+1].t) i++;
    var a = K[i], b = K[i+1];
    var u = smooth((t - a.t) / (b.t - a.t));
    var sky1 = mix(a.sky[0], b.sky[0], u), sky2 = mix(a.sky[1], b.sky[1], u), sky3 = mix(a.sky[2], b.sky[2], u);
    var d = a.d.map(function(c, n){ return mix(c, b.d[n], u); });
    var sun = mix(a.sun, b.sun, u), glow = mix(a.glow, b.glow, u);
    root.setProperty('--sky1', rgb(sky1));
    root.setProperty('--sky2', rgb(sky2));
    root.setProperty('--sky3', rgb(sky3));
    d.forEach(function(c,n){ root.setProperty('--d'+(n+1), rgb(c)); });
    root.setProperty('--sun', rgb(sun));
    root.setProperty('--glow', rgb(glow));
    root.setProperty('--haze', rgb(mix(sky3, d[0], 0.45)));
    root.setProperty('--caravan', rgb(shade(d[2], 0.62)));
    root.setProperty('--starA', smooth((t - 0.56) / 0.4).toFixed(3));          /* stars begin ~62% */
    /* sun travels the diagonal (66%,22%) → (42%,70%), fading before it drops behind the far dunes */
    root.setProperty('--sunx', (66 - 24*t).toFixed(2) + '%');
    root.setProperty('--suny', (22 + 48*t).toFixed(2) + '%');
    root.setProperty('--sunA', (1 - smooth((t - 0.74) / 0.18)).toFixed(3));
    /* monospace clock, 16:40 → 20:12 */
    var mins = Math.round(1000 + t * 212);
    clock.textContent = String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins%60).padStart(2,'0');
    sandTint = rgb(mix(d[0], [255,255,255], 0.12));
  }

  /* ================= stars: seeded box-shadow dot fields ================= */
  function starField(id, n){
    var seed = n * 7919;
    function s(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var z = Math.imul(seed ^ seed >>> 15, 1 | seed);
      z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
      return ((z ^ z >>> 14) >>> 0) / 4294967296;
    }
    var sh = [];
    for (var i=0;i<n;i++){
      sh.push((s()*100).toFixed(2) + 'vw ' + (s()*72).toFixed(2) + 'vh 0 ' +
              (s()<0.12 ? 1.4 : 0.4) + 'px rgba(255,250,240,' + (0.3 + s()*0.7).toFixed(2) + ')');
    }
    var st = document.createElement('style');
    st.textContent = '#' + id + '{width:2px;height:2px;border-radius:50%;background:rgba(0,0,0,0);box-shadow:' + sh.join(',') + '}';
    document.head.appendChild(st);
  }
  starField('stars', 150);
  starField('stars2', 90);

  /* ================= 60-second ping-pong cycle ================= */
  var CYCLE = 60000;   // 60 s into dusk, 60 s back through sunrise
  var scrub = document.getElementById('scrub');
  var pauseBtn = document.getElementById('pause');
  var phase = 0, cycleT = 0, paused = reduce.matches, scrubbing = false;
  if (paused) pauseBtn.textContent = 'Resume cycle';
  var lastNow = performance.now();

  function autoPhase(now){
    cycleT += now - lastNow;
    var c = (cycleT % (CYCLE*2)) / CYCLE;
    return c < 1 ? c : 2 - c;
  }
  function syncCycleT(){   /* remap wall clock so auto motion resumes from the scrubbed phase */
    var rising = (cycleT % (CYCLE*2)) >= CYCLE;
    cycleT = rising ? CYCLE*(2 - phase) : CYCLE*phase;
  }
  scrub.addEventListener('input', function(){        /* dragging scrubs and pauses */
    scrubbing = true; paused = true;
    pauseBtn.textContent = 'Resume cycle';
    phase = scrub.value / 1000;
  });
  pauseBtn.addEventListener('click', function(){
    paused = !paused; scrubbing = false;
    pauseBtn.textContent = paused ? 'Resume cycle' : 'Pause cycle';
    if (!paused) syncCycleT();
  });

  /* ================= parallax (mouse + device orientation) ================= */
  var layers = Array.prototype.slice.call(document.querySelectorAll('.layer'));
  var titleEl = document.getElementById('title');
  var ptx = 0, pty = 0, pcx = 0, pcy = 0;
  window.addEventListener('pointermove', function(e){
    ptx = (e.clientX / window.innerWidth) * 2 - 1;
    pty = (e.clientY / window.innerHeight) * 2 - 1;
  });
  window.addEventListener('deviceorientation', function(e){
    if (e.gamma == null) return;
    ptx = Math.max(-1, Math.min(1, e.gamma / 30));
    pty = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  });
  function parallax(){
    pcx += (ptx - pcx) * 0.06;      /* eased toward the pointer each frame */
    pcy += (pty - pcy) * 0.06;
    for (var i=0;i<layers.length;i++){
      var m = +layers[i].dataset.m;
      layers[i].style.transform = 'translate3d(' + (-pcx*m).toFixed(2) + 'px,' + (-pcy*m*0.28).toFixed(2) + 'px,0)';
    }
    titleEl.style.transform = 'translateX(calc(-50% + ' + (pcx*10).toFixed(2) + 'px))';   /* title drifts opposite */
  }

  /* ================= wind-blown sand ================= */
  var cv = document.getElementById('sand'), ctx = cv.getContext('2d');
  var DPR = 1, VW = 0, VH = 0;
  function sizeCanvas(){
    DPR = window.devicePixelRatio || 1;
    VW = window.innerWidth; VH = window.innerHeight;
    cv.width = Math.round(VW*DPR); cv.height = Math.round(VH*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  var N = 260, parts = [];
  function newPart(anywhere){
    return {
      x: anywhere ? Math.random()*VW : -20 - Math.random()*80,
      y: VH*(0.34 + Math.random()*0.63),
      v: 55 + Math.random()*175,
      ph: Math.random()*Math.PI*2,
      sw: 4 + Math.random()*9,
      len: 12 + Math.random()*30,
      a: 0, aMax: 0.05 + Math.random()*0.14
    };
  }
  for (var i=0;i<N;i++) parts.push(newPart(true));

  var gust = 1, gustTarget = 1;
  var windEl = document.getElementById('wind');
  var DIRS = ['ESE','E','ESE','SE','E','ESE'], dirIx = 0;
  setInterval(function(){     /* the readout refreshes every two seconds */
    dirIx = (dirIx + 1) % DIRS.length;
    windEl.textContent = 'WIND ' + DIRS[dirIx] + ' · ' + Math.round(9 + gustTarget*6) + ' kn';
  }, 2000);

  function sandStep(dt){
    if (Math.random() < 0.008) gustTarget = 0.55 + Math.random()*1.15;   /* wandering gust */
    gust += (gustTarget - gust) * 0.012;
    ctx.clearRect(0,0,VW,VH);
    ctx.globalCompositeOperation = 'screen';
    ctx.lineWidth = 1.1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = sandTint;
    for (var i=0;i<N;i++){
      var p = parts[i];
      p.x += p.v * gust * dt;
      p.ph += dt * 2.1;
      p.a += (p.aMax - p.a) * 0.05;                        /* fade in */
      if (p.x - p.len > VW){ parts[i] = newPart(false); continue; }   /* respawn on the left */
      var y = p.y + Math.sin(p.ph) * p.sw;
      var L = p.len * (0.7 + gust*0.55);
      ctx.globalAlpha = p.a;
      ctx.beginPath();
      ctx.moveTo(p.x - L, y + Math.sin(p.ph - L*0.012) * p.sw * 0.4);
      ctx.lineTo(p.x, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ================= main loop ================= */
  function frame(now){
    var dt = Math.min((now - lastNow)/1000, 0.1);
    var t = (paused || scrubbing) ? phase : autoPhase(now);
    phase = t;
    lastNow = now;
    if (!paused && !scrubbing) scrub.value = Math.round(t*1000);
    applyColors(t);
    parallax();
    if (!reduce.matches) sandStep(dt);
    requestAnimationFrame(frame);
  }
  applyColors(phase);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
