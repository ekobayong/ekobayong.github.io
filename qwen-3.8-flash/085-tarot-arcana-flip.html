<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Major Arcana — A Three-Card Spread</title>
<style>
  :root{
    --card-w: clamp(84px, 13vw, 150px);
    --card-h: calc(var(--card-w) * 1.66);
    --gold: #f3dc9a;
    --gold-mid: #d9b45b;
    --rose: #c9a58c;
    --ink: #e8d9b8;
    --flip-ms: 1100ms;
    --fly-ms: 700ms;
    --fan-ms: 560ms;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-variant-caps: small-caps;
    color: var(--ink);
    background: linear-gradient(180deg, #4a0f1e 0%, #3a0b17 55%, #2c0812 100%);
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
  }
  /* woven cloth: two crossed 45° thread gradients, 1px light / 1px dark every 5px */
  body::before{
    content:""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(45deg,
        rgba(255,225,200,.05) 0, rgba(255,225,200,.05) 1px, transparent 1px, transparent 5px),
      repeating-linear-gradient(-45deg,
        rgba(0,0,0,.09) 0, rgba(0,0,0,.09) 1px, transparent 1px, transparent 5px);
  }
  /* heavy vignette */
  body::after{
    content:""; position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 50% 38%, transparent 42%, rgba(10,2,5,.55) 78%, rgba(6,1,3,.92) 100%);
  }
  .candle{
    position: fixed; top: -140px; left: 50%; width: 680px; height: 420px; z-index: 0;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 55%, rgba(255,200,120,.3), rgba(255,180,100,.12) 45%, transparent 72%);
    filter: blur(26px);
    animation: flicker 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes flicker{
    0%   { transform: translateX(-50%) scale(1);    opacity: .9; }
    18%  { transform: translateX(-50%) scale(1.045); opacity: 1; }
    34%  { transform: translateX(-50%) scale(.985);  opacity: .86; }
    52%  { transform: translateX(-50%) scale(1.06);  opacity: .97; }
    70%  { transform: translateX(-50%) scale(.97);   opacity: .88; }
    86%  { transform: translateX(-50%) scale(1.02);  opacity: .95; }
    100% { transform: translateX(-50%) scale(1);     opacity: .9; }
  }
  .wrap{ position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 34px 18px 40px; }

  header{ text-align: center; }
  h1{
    font-size: clamp(1.7rem, 4.4vw, 3.1rem);
    font-weight: 600;
    letter-spacing: .22em;
    color: var(--gold);
    text-shadow: 0 0 22px rgba(243,220,154,.4), 0 0 60px rgba(255,190,110,.18);
    font-variant-caps: small-caps;
  }
  .subtitle{
    margin-top: 10px; font-style: italic; font-weight: 400;
    color: var(--rose); letter-spacing: .06em;
    font-size: clamp(.86rem, 1.8vw, 1.06rem);
  }
  .rule{
    width: min(430px, 72vw); height: 2px; margin: 20px auto 4px;
    background: linear-gradient(90deg, transparent, rgba(243,220,154,.75) 30%, #f3dc9a 50%, rgba(243,220,154,.75) 70%, transparent);
  }
  .rule::after{ content:""; display:block; width:6px; height:6px; background:var(--gold); transform: rotate(45deg) translate(105px,-2px); box-shadow: 0 0 8px rgba(243,220,154,.8); }

  /* ---- slots ---- */
  .spread{
    display: flex; justify-content: center; gap: clamp(18px, 5vw, 64px);
    margin-top: 26px; flex-wrap: nowrap;
  }
  .slot-col{ width: calc(var(--card-w) + 14px); display: flex; flex-direction: column; align-items: center; }
  .slot-label{
    font-variant-caps: small-caps; letter-spacing: .3em; text-indent: .3em;
    color: var(--gold-mid); font-size: clamp(.72rem, 1.5vw, .92rem); margin-bottom: 8px;
  }
  .slot{
    width: 100%; height: var(--card-h);
    border: 1.5px dashed rgba(217,180,91,.55);
    border-radius: calc(var(--card-w) * .09);
    position: relative;
    box-shadow: inset 0 0 26px rgba(0,0,0,.35);
  }
  .slot::after{
    content: "✦"; position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(217,180,91,.4); font-size: 1.3rem;
  }
  .slot.done::after{ content: none; }
  .reading{
    margin-top: 14px; min-height: 96px; width: 100%; text-align: center;
    opacity: 0; transform: translateY(14px);
    transition: opacity 900ms ease 300ms, transform 900ms ease 300ms;
  }
  .reading.up{ opacity: 1; transform: none; }
  .rd-name{ font-size: clamp(.95rem, 2vw, 1.2rem); color: var(--gold); letter-spacing: .12em; }
  .rd-name .orient{ color: var(--rose); font-size: .82em; }
  .rd-kw{ font-style: italic; font-variant-caps: normal; color: var(--rose); font-size: clamp(.78rem, 1.5vw, .92rem); margin: 5px 0 8px; letter-spacing: .02em; }
  .rd-text{ font-variant-caps: normal; font-size: clamp(.8rem, 1.45vw, .95rem); line-height: 1.55; color: #e6d4ac; }

  /* ---- controls ---- */
  .controls{ display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 30px 0 4px; }
  button.act{
    font-family: inherit; font-variant-caps: small-caps; cursor: pointer;
    letter-spacing: .18em; text-indent: .18em;
    font-size: clamp(.82rem, 1.6vw, .98rem);
    color: var(--gold); background: linear-gradient(180deg, rgba(90,22,42,.9), rgba(52,10,22,.9));
    border: 1px solid rgba(217,180,91,.65); border-radius: 2px;
    padding: .62em 1.5em;
    box-shadow: 0 3px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,220,160,.15);
    transition: transform .18s ease, box-shadow .18s ease, color .18s ease;
  }
  button.act:hover:not(:disabled){ transform: translateY(-2px); color: #fff2c8; box-shadow: 0 7px 20px rgba(0,0,0,.55), 0 0 18px rgba(243,220,154,.25); }
  button.act:active:not(:disabled){ transform: translateY(0); }
  button.act:disabled{ opacity: .38; cursor: default; }
  .status{ text-align: center; margin-top: 12px; min-height: 1.4em; font-style: italic; font-variant-caps: normal; color: var(--rose); font-size: .9rem; letter-spacing: .04em; }

  /* ---- stage & cards ---- */
  .stage{ position: relative; margin-top: 26px; height: calc(var(--card-h) + 130px); perspective: 1400px; }
  .card{
    position: absolute; left: 50%; top: 0;
    width: var(--card-w); height: var(--card-h);
    transform: translate(calc(-50% + var(--fx)), var(--fy)) rotate(var(--fr)) translateY(var(--lift, 0px));
    transition: transform var(--fan-ms) cubic-bezier(.2,.75,.3,1) var(--fd,0ms), opacity .6s ease;
    transform-style: preserve-3d;
    outline: none; cursor: pointer;
  }
  .card:hover:not(.drawn):not(.moving), .card:focus-visible:not(.drawn):not(.moving){ --lift: -18px; }
  .card.fly{ transition: transform var(--fly-ms) cubic-bezier(.3,.6,.35,1); }
  .card.gather{ transition: transform 620ms cubic-bezier(.35,.1,.3,1); }
  .stage.complete .card:not(.drawn){ opacity: .32; pointer-events: none; }
  .inner{
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform var(--flip-ms) cubic-bezier(.45,.05,.25,1);
  }
  .card.face-up .inner{ transform: rotateY(180deg); }
  .card.face-up.rev .inner{ transform: rotateY(180deg) rotate(180deg); }
  .face{
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: calc(var(--card-w) * .085);
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  }
  .face.front{ transform: rotateY(180deg); }
  .face.back svg{ width: 100%; height: 100%; display: block; }
  .face.front{
    background: radial-gradient(ellipse at 50% 30%, #2a1d36, #1b1424 75%);
    border: 2px solid rgba(217,180,91,.85);
  }
  .face.front::before{
    content:""; position: absolute; inset: 4px; border: 1px solid rgba(217,180,91,.5); pointer-events: none;
  }
  .numeral{
    position: absolute; top: 5.2%; left: 0; right: 0; text-align: center;
    color: var(--gold-mid); font-size: calc(var(--card-w) * .13);
    letter-spacing: .14em; text-indent: .14em;
    text-shadow: 0 0 8px rgba(217,180,91,.35);
  }
  .cname{
    position: absolute; bottom: 4.6%; left: 0; right: 0; text-align: center;
    color: var(--gold-mid); font-variant-caps: small-caps;
    font-size: calc(var(--card-w) * .092); letter-spacing: .1em;
  }
  .art{ position: absolute; left: 13%; top: 15%; width: 74%; height: 64%; }
  .shimmer{
    position: absolute; inset: -20%; pointer-events: none; opacity: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255,235,170,.55) 47%, rgba(255,250,220,.9) 50%, rgba(255,235,170,.55) 53%, transparent 62%);
    mix-blend-mode: screen;
  }
  .card.face-up.shimmer-on .shimmer{ animation: sweep 1.15s ease-in-out; }
  @keyframes sweep{
    0%{ opacity: 1; transform: translateX(-90%); }
    100%{ opacity: 1; transform: translateX(95%); }
  }

  footer{ text-align: center; margin-top: 22px; color: rgba(201,165,140,.65); font-size: .8rem; font-variant-caps: normal; letter-spacing: .1em; font-style: italic; }

  @media (max-width: 620px){
    :root{ --card-w: 26vw; }
    .spread{ gap: 4vw; }
    .rd-text{ display: none; }
    .reading{ min-height: 52px; }
  }
  @media (prefers-reduced-motion: reduce){
    .candle{ animation: none; }
    :root{ --flip-ms: 1ms; --fly-ms: 1ms; --fan-ms: 1ms; }
    .card, .inner, .reading, button.act{ transition-duration: 1ms !important; transition-delay: 0ms !important; }
    .card.face-up.shimmer-on .shimmer{ animation: none; }
    .card:hover:not(.drawn){ --lift: 0px; }
  }
</style>
</head>
<body>
<div class="candle" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>The Major Arcana</h1>
    <p class="subtitle">Three cards from the twenty-two — what was, what is, what leans toward you.</p>
    <div class="rule" aria-hidden="true"></div>
  </header>

  <section class="spread" aria-label="Spread positions">
    <div class="slot-col">
      <div class="slot-label">Past</div>
      <div class="slot" id="slot0"></div>
      <div class="reading" id="read0"></div>
    </div>
    <div class="slot-col">
      <div class="slot-label">Present</div>
      <div class="slot" id="slot1"></div>
      <div class="reading" id="read1"></div>
    </div>
    <div class="slot-col">

      <div class="reading" id="read2"></div>

  <p class="status" id="status" aria-live="polite">The deck waits, fanned beneath the candle.</p>

      <circle cx="50" cy="34" r="14"/>
      <path d="M50 12 v-6 M50 56 v6 M28 34 h-6 M78 34 h6 M34 18 l-4 -4 M66 18 l4 -4 M34 50 l-4 4 M66 50 l4 4"/>
      <path d="M42 12 q4 -6 8 0 t8 0 M42 56 q4 6 8 0 t8 0 M26 26 q-6 4 0 8 M74 26 q6 4 0 8"/>
      <path d="M8 76 h84 M8 88 h84 M8 76 v12 M22 76 v12 M36 76 v12 M50 76 v12 M64 76 v12 M78 76 v12 M92 76 v12 M15 82 h7 M29 82 h7 M43 82 h7 M57 82 h7 M71 82 h7 M85 82 h7"/>
    </g></symbol>
    <symbol id="art20" viewBox="0 0 100 100"><g fill="none" stroke="#d9b45b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 38 q10 -4 16 0 l26 -14 v34 l-26 -14 q-8 3 -16 -6 Z"/>
      <path d="M62 20 v-8 M62 12 l16 -4 v12 l-16 -4 M62 10 h0"/>
      <path d="M70 6 l0 8 M66 9 h8"/>
      <path d="M30 44 q-6 10 -2 16 M34 40 q-8 12 -3 20"/>
      <path d="M20 84 q10 -10 20 0 M42 84 q10 -10 20 0"/>
      <path d="M76 62 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
    </g></symbol>
    <symbol id="art21" viewBox="0 0 100 100"><g fill="none" stroke="#d9b45b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="50" cy="50" rx="24" ry="34" stroke-dasharray="5 3.4"/>
      <path d="M44 36 q6 -6 12 0 M50 44 v16 M42 52 h16"/>
      <path d="M8 10 l10 6 -6 2 2 6 -6 -4 Z"/>
      <path d="M90 10 q6 6 0 10 q-6 4 0 10"/>
      <path d="M8 88 q8 -6 12 2 q2 6 -6 6 M10 92 h8"/>
      <path d="M92 84 a4 5 0 1 1 .1 0 M88 90 h8 M92 76 v-4"/>

  <section class="stage" id="stage" aria-label="The deck"></section>

  <footer>Hover a card to raise it — click to draw it yourself.</footer>
</div>

<script>
(function(){
  'use strict';
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = RM.matches;
  RM.addEventListener && RM.addEventListener('change', e => { reduce = e.matches; });

  /* ---------- data: 22 Major Arcana, original readings ---------- */
  const ARCANA = [
    {n:"0", name:"The Fool", kw:"beginnings · innocence · the leap",
     up:"A cliff edge is not an end; it is the place where your maps admit they have run out. Step lightly — the world is watching to see whether you trust it.",
     rev:"You are leaning over the abyss with no ground beneath and calling it destiny. Reconsider the leap: caution is not cowardice, it is a spare cloak."},
    {n:"I", name:"The Magician", kw:"will · craft · manifestation",
     up:"Every tool you will ever need is already on the table. The trick was never magic — it was attention, and yours is finally pointed true.",
     rev:"The tools are scattered and your hands are busy for nothing. Ask what you are actually conjuring, and whether it serves you or only impresses."},
    {n:"II", name:"The High Priestess", kw:"intuition · mystery · the inner voice",
     up:"What you need to know is not being said; it is being kept, and it has left you notes in dreams. Read the silence between the pillars.",
     rev:"You have stopped listening to the quieter signal, and louder substitutes crowd the channel. The veil is not torn — only unvisited."},
    {n:"III", name:"The Empress", kw:"abundance · nurture · creation",
     up:"Something you planted in ordinary weather is ripening without your help. Let it be generous; you are allowed to enjoy what grows.",
     rev:"Care given past the point of return has become a garden that tends you instead. Ease off the watering; even soil needs drought to breathe."},
    {n:"IV", name:"The Emperor", kw:"authority · order · foundation",
     up:"Set the boundary the way a wall sets a valley: firmly, and for everyone's safety. Structure is not the enemy of freedom; it is the frame that makes rest possible.",
     rev:"The throne is warm, the gates are heavy, and you have legislated against your own softness. Rule less; govern nothing you long to love."},
    {n:"V", name:"The Hierophant", kw:"tradition · teaching · lineage",
     up:"Someone has walked this road before you and left markers in the stone. Take the teaching — tradition is a ladder that was once invented.",
     rev:"The rule you are defending was handed to you for shelter, and you have turned it into a wall. A custom that protects nothing can be set down."},
    {n:"VI", name:"The Lovers", kw:"union · choice · alignment",
     up:"Two circles overlap and something neither could be alone is born in the lens between them. Choose — for commitment is how affection becomes fact.",
     rev:"Parts of you are pulling against each other across the same decision. Until want and value agree, every choice will keep unchoosing itself."},
    {n:"VII", name:"The Chariot", kw:"willpower · momentum · triumph",
     up:"The reins are in both hands and the team pulls opposite ways — you are moving anyway, and that is the whole art. Victory belongs to whoever steers the contradiction.",
     rev:"Speed without a road: the chariot is running while the rider has forgotten the destination. Loosen the reins and ask where you meant to go."},
    {n:"VIII", name:"Strength", kw:"courage · gentleness · patience",
     up:"The lion is not slain; it is befriended, and it sits. Soft hands hold what iron only provokes.",
     rev:"Either the grip has tightened out of fear, or the lion has been allowed to pace the house alone. Both are the absence of strength."},
    {n:"IX", name:"The Hermit", kw:"solitude · guidance · search",
     up:"Your lamp is small because it is meant to light one step, not the whole mountain. Take the step; the rest of the road is the mountain's business.",
     rev:"You have shut the door so long the lantern is starting to scorch the room. Come out — a light carried in solitude still wants witnesses."},
    {n:"X", name:"Wheel of Fortune", kw:"cycles · turning point · fate",
     up:"The hub stays still while the rim keeps weather. Whatever seat you hold now is a position, not an address.",
     rev:"You are clinging to the top of a wheel that is indifferent to your luggage. Let the turn come; what you hold is only half of what you're meant to carry."},
    {n:"XI", name:"Justice", kw:"fairness · truth · account",
     up:"Weigh the facts, but do not mistake the scale for the hand that steadies it. Truth is not harsh; it is exact, and exactness is a mercy to the future.",
     rev:"The verdict arrived before the evidence, and the scale is calibrated by wanting. Reopen the case — honesty is not too late."},
    {n:"XII", name:"The Hanged Man", kw:"pause · perspective · sacrifice",
     up:"Hold still; the world is kinder and stranger when seen inverted. Surrender is not defeat but a change of angle with a price attached.",
     rev:"The rope is fraying while you wait to be rescued from your own suspension. The lesson has finished teaching; put your feet back down."},
    {n:"XIII", name:"Death", kw:"ending · transition · release",
     up:"The sun rising over this ending has never once been late. Close the door properly — an ending left ajar is only a haunting.",
     rev:"You are haunting your own life, keeping rooms in a house that already moved. Refuse the change long enough and grief will do the work by hand."},
    {n:"XIV", name:"Temperance", kw:"balance · patience · alchemy",
     up:"Pour slowly between the vessels; the miracle is in the arc, not the landing. The right amount is not compromise — it is the hardest skill you own.",
     rev:"One cup is overflowing and you have been calling it enthusiasm. Dilute, wait, mix again; measure your life against mornings, not urgencies."},
    {n:"XV", name:"The Devil", kw:"shadow · bondage · temptation",
     up:"The chains are loose enough to slip off any evening you choose to notice them. Say the name of what binds you aloud — collars hate being seen.",
     rev:"The lock has rusted open and no one is coming to undo it for you. That is the good news; take it and walk down."},
    {n:"XVI", name:"The Tower", kw:"upheaval · revelation · awakening",
     up:"What was built on a fault must fall before the ground can be trusted again. Let the lightning finish its sentence — the ruin is honest.",
     rev:"Either you are bracing a wall that already came down last season, or the tower only cracked and you keep flinching at the crash. Step out of the shadow either way."},
    {n:"XVII", name:"The Star", kw:"hope · healing · inspiration",
     up:"Pour water on the sand that has already drunk starlight, and call it hope. After the Tower, the sky is proof that nothing was lost but the roof.",
     rev:"Cloud, doubt, or simple tiredness has hidden the fixed light you navigate by. The bucket is still in your hands — the sky is resting, not resigning."},
    {n:"XVIII", name:"The Moon", kw:"illusion · dreams · the unconscious",
     up:"Everything here is true and reflected at once, between the towers and down the path. Walk it anyway; the dog and the wolf both know the way by heart.",
     rev:"The fog is thinning and things are merely strange, not sinister. The fear was borrowed; return it to the tide."},
    {n:"XIX", name:"The Sun", kw:"joy · vitality · clarity",
     up:"There is a wall around the garden, you are on the inside of it, and the child has no need to know what it keeps out. Say yes to the plain day — that is the whole spell.",
     rev:"A cloud crossed over unasked, and warmth is being rationed out to see if you have earned it. Let the sun warm you on a bad day; that is when it means something."},
    {n:"XX", name:"Judgement", kw:"reckoning · renewal · calling",
     up:"The call is not thunder; it is the small voice that knows your name and uses it. Rise — your best case is argued by the one who lived it.",
     rev:"You are summing up your life on the worst evidence and the loudest critic. The court is still in session; no verdict is final while you are walking."},
    {n:"XXI", name:"The World", kw:"wholeness · arrival · integration",
     up:"The wreath closes; each corner kept what you asked it to guard. Finish the circle — completion is a skill, not luck — then step out of it into whatever is next.",
     rev:"One step short of the finish, so the dance keeps rehearsing the same seam. It is already over; say so out loud and leave."}
  ];

  /* ---------- build deck ---------- */
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');
  const slots = [document.getElementById('slot0'), document.getElementById('slot1'), document.getElementById('slot2')];
  const reads = [document.getElementById('read0'), document.getElementById('read1'), document.getElementById('read2')];
  const btnShuffle = document.getElementById('btn-shuffle');
  const btnDraw = document.getElementById('btn-draw');
  const btnGather = document.getElementById('btn-gather');

  let W = 0, H = 0, R = 0;           // card metrics + fan radius
  const cards = [];                   // {el, inner, d, state:'stack'|'fan'|'flying'|'placed', fanPos}
  let fanOrder = [];                  // indices in arc order
  let slotCards = [null, null, null];
  let busy = false;

  ARCANA.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label', d.n + ' — ' + d.name);
    el.innerHTML =
      '<div class="inner">' +
        '<div class="face front">' +
          '<span class="numeral">' + d.n + '</span>' +
          '<svg class="art" viewBox="0 0 100 100" aria-hidden="true"><use href="#art' + i + '"/></svg>' +
          '<span class="cname">' + d.name + '</span>' +
          '<div class="shimmer"></div>' +
        '</div>' +
        '<div class="face back"><svg viewBox="0 0 100 166" aria-hidden="true"><use href="#card-back"/></svg></div>' +
      '</div>';
    el.addEventListener('click', () => drawOne(i));
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drawOne(i); }
    });
    stage.appendChild(el);
    cards.push({ el, inner: el.querySelector('.inner'), d, state: 'stack', fanPos: 0 });
  });

  function metrics(){
    W = stage.querySelector('.card').offsetWidth;
    H = stage.querySelector('.card').offsetHeight;
    R = H * 2.6;                       // transform-origin: 2.6 card-heights below centre
    stage.style.height = (H + 150) + 'px';
  }

  /* transform helpers: card centre = base + (fx, fy); base is left:50% top:0 */
  function setPose(c, fx, fy, fr, delay){
    const st = c.el.style;
    st.setProperty('--fx', fx + 'px');
    st.setProperty('--fy', fy + 'px');
    st.setProperty('--fr', (fr || 0) + 'deg');
    st.setProperty('--fd', (delay || 0) + 'ms');
  }

  function toStack(seed){
    metrics();
    fanOrder = cards.map((_,i)=>i);
    cards.forEach((c, i) => {
      c.state = 'stack';
      const j = seed ? (Math.sin(i * 127.1) * 43758.5) % 1 : 0;
      const k = seed ? (Math.sin(i * 311.7) * 12543.7) % 1 : 0;
      setPose(c, (j * 8 - 4), H * 0.42 + (k * 4 - 2), (k * 3 - 1.5), 0);
      c.el.style.zIndex = i;
    });
  }

  function fanOut(order, stagger){
    metrics();
    const vw = Math.min(stage.clientWidth, window.innerWidth - 24);
    const spacing = Math.max(W * 0.55, (vw - W) / (order.length - 1));
    let half = ((order.length - 1) * spacing) / 2;
    half = Math.min(half, R * 0.82);                       // keep arc sane
    const halfAngle = Math.asin(Math.min(0.985, half / R));
    const step = halfAngle * 2 / (order.length - 1);
    fanOrder = order.slice();
    order.forEach((idx, i) => {
      const c = cards[idx];
      if (c.state === 'placed' || c.state === 'flying') return;
      const ang = -halfAngle + step * i;
      c.state = 'fan';
      c.fanPos = i;
      setPose(c, R * Math.sin(ang), H * 0.30 + R * (1 - Math.cos(ang)), ang * 180 / Math.PI, stagger ? i * 22 : 0);
      c.el.style.zIndex = i + 2;
    });
  }

  /* ---------- shuffle ---------- */
  function shuffle(done){
    if (busy) return;
    busy = true;
    const t = reduce ? 10 : 420;
    toStack(true);
    cards.forEach(c => {
      c.el.style.transitionDuration = t + 'ms';
    });
    setTimeout(() => {
      const order = cards.map((_,i)=>i);
      for (let i = order.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
      cards.forEach(c => c.el.style.transitionDuration = '');
      fanOut(order, !reduce);
      setTimeout(() => { busy = false; done && done(); }, reduce ? 30 : 700);
    }, t + 40);
  }

  /* ---------- drawing ---------- */
  function nextEmptySlot(){
    for (let s = 0; s < 3; s++) if (!slotCards[s]) return s;
    return -1;
  }
  function status(msg){ statusEl.textContent = msg; }

  function drawToSlot(idx, slot, cb){
    const c = cards[idx];
    c.state = 'flying';
    c.el.classList.add('fly', 'moving');
    c.el.style.zIndex = 100;
    const sr = stage.getBoundingClientRect();
    const tr = slots[slot].getBoundingClientRect();
    const tx = tr.left + tr.width / 2 - sr.left;
    const ty = tr.top + tr.height / 2 - sr.top;
    void c.el.offsetHeight;                    // flush current pose before transition
    c.el.classList.remove('moving');
    setPose(c, tx - sr.width / 2, ty - H / 2, 0, 0);
    setTimeout(() => {
      const reversed = Math.random() < 0.30;
      c.el.classList.add('face-up');
      if (reversed) setTimeout(() => c.el.classList.add('rev'), reduce ? 0 : 550);
      setTimeout(() => runShimmer(c.el), reduce ? 0 : 150);
      slotCards[slot] = c;
      c.state = 'placed';
      c.el.classList.add('drawn');
      c.el.tabIndex = -1;
      slots[slot].classList.add('done');
      fillReading(slot, c.d, reversed);
      void stage.offsetHeight;                 // reading may have shifted the layout
      {
        const sr2 = stage.getBoundingClientRect(), tr2 = slots[slot].getBoundingClientRect();
        setPose(c, tr2.left + tr2.width / 2 - sr2.left - sr2.width / 2,
                    tr2.top + tr2.height / 2 - sr2.top - H / 2, 0, 0);
      }
      status(c.d.name + (reversed ? ' reversed — ' : ' upright — ') + ['the past, what shaped it.', 'the present, what holds it.', 'the future, what leans toward you.'][slot]);
      checkComplete();
      cb && cb();
    }, reduce ? 20 : 720);
  }

  function fillReading(slot, d, reversed){
    const kw = (reversed ? d.rev : d.up);
    reads[slot].innerHTML =
      '<p class="rd-name">' + d.n + ' · ' + d.name + ' <span class="orient">' + (reversed ? 'Reversed' : 'Upright') + '</span></p>' +
      '<p class="rd-kw">' + d.kw + '</p>' +
      '<p class="rd-text">' + kw + '</p>';
    reads[slot].classList.add('up');
  }

  function runShimmer(el){
    if (reduce) return;
    el.classList.remove('shimmer-on');
    void el.offsetWidth;
    el.classList.add('shimmer-on');
  }

  function drawOne(idx){
    if (busy) return;
    const c = cards[idx];
    if (c.state === 'placed' || c.state === 'flying' || c.state === 'stack') return;
    const s = nextEmptySlot();
    if (s < 0) { status('The spread is full — gather the deck to begin again.'); return; }
    drawToSlot(idx, s);
  }

  function drawThree(){
    if (busy) return;
    const empty = [];
    for (let s = 0; s < 3; s++) if (!slotCards[s]) empty.push(s);
    if (!empty.length) { status('The spread is full — gather the deck to begin again.'); return; }
    const pool = cards.map((_, i) => i).filter(i => {
      const st = cards[i].state;
      return st !== 'placed' && st !== 'flying';
    });
    for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const picks = pool.slice(0, Math.min(3, empty.length));
    busy = true;
    status('The candle gutters as three cards leave the fan…');
    let k = 0;
    (function next(){
      if (k >= picks.length) { busy = false; return; }
      drawToSlot(picks[k], empty[k], () => {
        k++;
        setTimeout(next, reduce ? 30 : 650);
      });
    })();
  }

  function checkComplete(){
    const full = slotCards.every(Boolean);
    stage.classList.toggle('complete', full);
    if (full) status('The spread is complete. Read it slowly; it was built for you.');
    btnDraw.disabled = full;
  }

  /* ---------- gather ---------- */
  function gather(){
    if (busy) return;
    busy = true;
    status('Gathering: the cards fold back into the dark.');
    let n = 0;
    cards.forEach((c, i) => {
      if (c.state !== 'placed' && c.state !== 'flying') return;
      n++;
      c.el.classList.remove('shimmer-on');
      c.el.classList.add('gather');
      setTimeout(() => c.el.classList.remove('face-up', 'rev'), 40);
      setTimeout(() => {
        c.state = 'stack';
        c.el.classList.remove('drawn');
        c.el.tabIndex = 0;
      }, reduce ? 20 : 640);
    });
    [0,1,2].forEach(s => {
      slotCards[s] = null;
      reads[s].classList.remove('up');
      reads[s].textContent = '';
      slots[s].classList.remove('done');
    });
    stage.classList.remove('complete');
    btnDraw.disabled = false;
    setTimeout(() => {
      cards.forEach(cc => { if (cc.state === 'placed') cc.state = 'stack'; });
      toStack(true);
      cards.forEach(c => c.el.classList.remove('gather'));
      busy = false;
      shuffle();
    }, reduce ? 40 : 760);
    if (!n) busy = false;
  }

  /* ---------- shimmer on hover of placed cards ---------- */
  stage.addEventListener('pointerenter', e => {
    const cardEl = e.target.closest && e.target.closest('.card.face-up');
    if (cardEl) runShimmer(cardEl);
  }, true);

  /* ---------- resize ---------- */
  let rzT;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      const order = fanOrder.length ? fanOrder.slice() : cards.map((_,i)=>i);
      fanOut(order, false);
    }, 160);
  });

  btnShuffle.addEventListener('click', () => { shuffle(); });
  btnDraw.addEventListener('click', drawThree);
  btnGather.addEventListener('click', gather);

  /* ---------- init: deal a shuffle on arrival ---------- */
  metrics();
  toStack(true);
  setTimeout(() => shuffle(), reduce ? 30 : 350);
  window.addEventListener('load', () => metrics());
})();
</script>
