<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ether — a fluid you can touch</title>
<style>
  :root{
    --bg:#04050a;
    --accent:#8ad4ff;
    --inkish:rgba(232,230,242,0.55);
    --serif:Georgia,"Iowan Old Style",Palatino,ui-serif,serif;
    --sans:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:var(--sans);
    color:#e8e6f2;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #cv{
    position:fixed;inset:0;display:block;
    width:100vw;height:100vh;
    touch-action:none;
    cursor:crosshair;
  }
  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(125% 125% at 50% 46%,transparent 52%,rgba(0,0,0,.42) 82%,rgba(0,0,0,.62) 100%);
    mix-blend-mode:multiply;
  }
  /* ---------- title ---------- */
  .head{
    position:fixed;left:clamp(18px,4vw,44px);top:clamp(16px,4vh,36px);
    z-index:6;pointer-events:none;
    animation:rise .9s cubic-bezier(0.22,1,0.36,1) both;
  }
  .head h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(34px,5vw,64px);
    letter-spacing:0.14em;
    line-height:1;
    background:linear-gradient(to bottom,#ffffff 0%,#b7c4ff 55%,#6d7fd6 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(120,190,255,.35)) drop-shadow(0 0 44px rgba(80,140,255,.18));
  }
  .head p{
    margin-top:12px;
    font-size:11px;letter-spacing:0.32em;text-transform:uppercase;
    color:var(--inkish);
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }
  /* ---------- bottom hint ---------- */
  .hint{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
    z-index:6;pointer-events:none;
    font-size:12px;letter-spacing:0.22em;text-transform:uppercase;
    color:rgba(214,220,248,.6);
    animation:rise 1s .3s cubic-bezier(0.22,1,0.36,1) both, breathe 3.4s 1.4s ease-in-out infinite;
    transition:opacity .8s;
    white-space:nowrap;
  }
  .hint.gone{opacity:0 !important;animation:rise 1s .3s cubic-bezier(0.22,1,0.36,1) both}
  @keyframes breathe{
    0%,100%{opacity:.35}
    50%{opacity:.85}
  }
  /* ---------- HUD ---------- */
  .hud{
    position:fixed;right:18px;bottom:18px;z-index:7;
    width:272px;
    background:rgba(14,16,28,0.55);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:18px;
    padding:15px 16px 14px;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,0.12);
    animation:rise .9s .15s cubic-bezier(0.22,1,0.36,1) both;
  }
  .hud .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hud .brand{
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(226,230,248,.6);
  }
  .hud .fps{
    font-size:12px;font-variant-numeric:tabular-nums;
    color:var(--accent);
    text-shadow:0 0 10px rgba(138,212,255,.4);
  }
  .ctl{margin-top:13px}
  .ctl label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(226,230,248,.55);
    margin-bottom:5px;
  }
  .ctl output{
    font-size:11px;letter-spacing:.04em;text-transform:none;
    font-variant-numeric:tabular-nums;color:#dfe6ff;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:18px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(138,212,255,.15),rgba(138,212,255,.85));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:#fff;border:none;
    margin-top:-6px;
    box-shadow:0 0 12px 2px rgba(138,212,255,.75);
    transition:transform .15s;
  }
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
  input[type=range]::-moz-range-track{
    height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(138,212,255,.15),rgba(138,212,255,.85));
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:#fff;border:none;
    box-shadow:0 0 12px 2px rgba(138,212,255,.75);
    transition:transform .15s;
  }
  input[type=range]:hover::-moz-range-thumb{transform:scale(1.25)}
  .acts{margin-top:15px;display:flex;align-items:center;gap:8px}
  .btn{
    position:relative;overflow:hidden;
    font-family:var(--sans);
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:#dce4ff;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;
    padding:8px 14px;
    cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .btn::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),rgba(138,212,255,.22),transparent 55%);
    opacity:0;transition:opacity .25s;
  }
  .btn:hover::before{opacity:1}
  .btn:hover{border-color:rgba(138,212,255,.5)}
  .btn[aria-pressed="true"]{
    background:rgba(138,212,255,.16);
    border-color:rgba(138,212,255,.55);
    color:#eaf6ff;
  }
  .btn:disabled{opacity:.35;cursor:default}
  .swatch{
    margin-left:auto;
    width:20px;height:20px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:hsl(200 95% 55%);
    box-shadow:0 0 14px 3px hsl(200 95% 55% / .6);
    flex:none;
  }
  @media (max-width:480px){
    .hud{left:10px;right:10px;bottom:10px;width:auto}
    .hint{bottom:calc(10px + 168px)}
  }
  @media (prefers-reduced-motion: reduce){
    .head,.hud,.hint{animation:none}
    .hint{opacity:.6}
  }
</style>
</head>
<body>
<canvas id="cv" aria-label="interactive fluid canvas"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="head">
  <h1>Ether</h1>
  <p>a fluid you can touch</p>
</header>

<p class="hint" id="hint">drag anywhere to breathe color into the void</p>

<aside class="hud" aria-label="fluid controls">
  <div class="row">
    <span class="brand">Stable fluids · 96²</span>
    <span class="fps" id="fps">– fps</span>
  </div>
  <div class="ctl">
    <label for="bri">Brightness <output id="briOut">1.40</output></label>
    <input type="range" id="bri" min="0.4" max="3" step="0.01" value="1.4">
  </div>
  <div class="ctl">
    <label for="dis">Dissipation <output id="disOut">0.988</output></label>
    <input type="range" id="dis" min="0.94" max="0.999" step="0.0005" value="0.988">
  </div>
  <div class="acts">
    <button class="btn" id="clear">Clear</button>
    <button class="btn" id="auto" aria-pressed="true">Auto</button>
    <span class="swatch" id="swatch" title="current dye hue" aria-hidden="true"></span>
  </div>
</aside>

<script>
'use strict';
/* ============================================================
   Ether — Jos Stam "stable fluids" on a 96×96 interior grid.
   Float32 fields: u, v, dye r/g/b, one-cell boundary ring.
   ============================================================ */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=96, S=N+2, SZ=S*S;
const IX=(i,j)=>i+S*j;

const u=new Float32Array(SZ), v=new Float32Array(SZ),
      u0=new Float32Array(SZ), v0=new Float32Array(SZ),
      dR=new Float32Array(SZ), dG=new Float32Array(SZ), dB=new Float32Array(SZ),
      tmp=new Float32Array(SZ), p=new Float32Array(SZ), div=new Float32Array(SZ);

const VISC=0.0002, DIFF=0.00012, DT=0.016;

function setBnd(b,x){
  for(let i=1;i<=N;i++){
    x[IX(0  ,i)] = b===1 ? -x[IX(1,i)] : x[IX(1,i)];
    x[IX(N+1,i)] = b===1 ? -x[IX(N,i)] : x[IX(N,i)];
    x[IX(i,0  )] = b===2 ? -x[IX(i,1)] : x[IX(i,1)];
    x[IX(i,N+1)] = b===2 ? -x[IX(i,N)] : x[IX(i,N)];
  }
  x[IX(0,0)]     = 0.5*(x[IX(1,0)]+x[IX(0,1)]);
  x[IX(0,N+1)]   = 0.5*(x[IX(1,N+1)]+x[IX(0,N)]);
  x[IX(N+1,0)]   = 0.5*(x[IX(N,0)]+x[IX(N+1,1)]);
  x[IX(N+1,N+1)] = 0.5*(x[IX(N,N+1)]+x[IX(N+1,N)]);
}
function linSolve(b,x,x0,a,c,iter){
  const ic=1/c;
  for(let k=0;k<iter;k++){
    for(let j=1;j<=N;j++){
      let idx=IX(1,j);
      for(let i=1;i<=N;i++,idx++){
        x[idx]=(x0[idx]+a*(x[idx-1]+x[idx+1]+x[idx-S]+x[idx+S]))*ic;
      }
    }
    setBnd(b,x);
  }
}
function diffuse(b,x,x0,diff,iter){
  const a=DT*diff*N*N;
  x0.set(x);
  linSolve(b,x,x0,a,1+4*a,iter);
}
function advect(b,d,d0,uu,vv){
  const dt0=DT*N;
  for(let j=1;j<=N;j++){
    for(let i=1;i<=N;i++){
      let x=i-dt0*uu[IX(i,j)], y=j-dt0*vv[IX(i,j)];
      if(x<0.5)x=0.5; if(x>N+0.5)x=N+0.5;
      if(y<0.5)y=0.5; if(y>N+0.5)y=N+0.5;
      const i0=x|0, j0=y|0;
      const s1=x-i0, s0=1-s1, t1=y-j0, t0=1-t1;
      d[IX(i,j)]=s0*(t0*d0[IX(i0,j0)]+t1*d0[IX(i0,j0+1)])+
                 s1*(t0*d0[IX(i0+1,j0)]+t1*d0[IX(i0+1,j0+1)]);
    }
  }
  setBnd(b,d);
}
function project(iter){
  for(let j=1;j<=N;j++){
    for(let i=1;i<=N;i++){
      div[IX(i,j)]=-0.5*(u[IX(i+1,j)]-u[IX(i-1,j)]+v[IX(i,j+1)]-v[IX(i,j-1)])/N;
      p[IX(i,j)]=0;
    }
  }
  setBnd(0,div); setBnd(0,p);
  linSolve(0,p,div,1,4,iter);
  for(let j=1;j<=N;j++){
    for(let i=1;i<=N;i++){
      u[IX(i,j)]-=0.5*N*(p[IX(i+1,j)]-p[IX(i-1,j)]);
      v[IX(i,j)]-=0.5*N*(p[IX(i,j+1)]-p[IX(i,j-1)]);
    }
  }
  setBnd(1,u); setBnd(2,v);
}
function velStep(){
  /* diffuse(b, field, scratch): snapshots `field` into scratch, solves in place */
  diffuse(1,u,u0,VISC,4);
  diffuse(2,v,v0,VISC,4);
  project(16);
  u0.set(u); v0.set(v);
  advect(1,u,u0,u0,v0);
  advect(2,v,v0,u0,v0);
  project(16);
  for(let k=0;k<SZ;k++){u[k]*=0.995;v[k]*=0.995;}   /* gentle global damping */
}
let dissipation=0.988;
function dyeStep(){
  diffuse(0,dR,tmp,DIFF,3); tmp.set(dR); advect(0,dR,tmp,u,v);
  diffuse(0,dG,tmp,DIFF,3); tmp.set(dG); advect(0,dG,tmp,u,v);
  diffuse(0,dB,tmp,DIFF,3); tmp.set(dB); advect(0,dB,tmp,u,v);
  for(let k=0;k<SZ;k++){dR[k]*=dissipation;dG[k]*=dissipation;dB[k]*=dissipation;}
}
/* ---------------- splats ---------------- */
function splat(cx,cy,vx,vy,r,g,b,rad,amt){
  const r2=rad*rad;
  const i0=Math.max(1,Math.floor(cx-rad)), i1=Math.min(N,Math.ceil(cx+rad));
  const j0=Math.max(1,Math.floor(cy-rad)), j1=Math.min(N,Math.ceil(cy+rad));
  for(let j=j0;j<=j1;j++){
    for(let i=i0;i<=i1;i++){
      const dx=i-cx, dy=j-cy, d2=dx*dx+dy*dy;
      if(d2>r2*1.6)continue;
      const w=Math.exp(-d2/(r2*0.5));
      const k=IX(i,j);
      u[k]+=vx*w; v[k]+=vy*w;
      dR[k]+=r*amt*w; dG[k]+=g*amt*w; dB[k]+=b*amt*w;
    }
  }
}
function hsl(h,s,l){ /* h 0..1 */
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};
  return [f(0),f(8),f(4)];
}
/* opening bloom: ring of 24 outward splats in cyan-blue */
function seedRing(){
  for(let k=0;k<24;k++){
    const a=k/24*Math.PI*2;
    const cx=N/2+Math.cos(a)*N*0.29, cy=N/2+Math.sin(a)*N*0.29;
    const col=hsl((0.50+k/24*0.11)%1,0.95,0.55);
    splat(cx,cy,Math.cos(a)*0.16,Math.sin(a)*0.16,col[0],col[1],col[2],4.5,0.5);
  }
}
/* ---------------- canvas ---------------- */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const buf=document.createElement('canvas');
buf.width=N;buf.height=N;
const bctx=buf.getContext('2d');
const img=bctx.createImageData(N,N);
let vw=0,vh=0,dpr=1,cell=1,ox=0,oy=0;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=innerWidth;vh=innerHeight;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  cell=Math.max(vw,vh);                 /* square sim cover-fits the viewport */
  ox=(vw-cell)/2; oy=(vh-cell)/2;
}
addEventListener('resize',resize);resize();

let brightness=1.4;
function render(){
  const data=img.data;
  for(let j=0;j<N;j++){
    for(let i=0;i<N;i++){
      const k=IX(i+1,j+1), o=(j*N+i)*4;
      let r= 4+dR[k]*255*brightness,
          g= 5+dG[k]*255*brightness,
          b=10+dB[k]*255*brightness;
      data[o  ]=r>255?255:r;
      data[o+1]=g>255?255:g;
      data[o+2]=b>255?255:b;
      data[o+3]=255;
    }
  }
  bctx.putImageData(img,0,0);
  ctx.save();
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,vw,vh);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(buf,ox,oy,cell,cell);
  ctx.restore();
}
/* ---------------- pointer interaction ---------------- */
let hue=0.52, lx=null, ly=null, down=false, firstTouch=false;
const hint=document.getElementById('hint');
function toGrid(x,y){return [(x-ox)/cell*N+0.5,(y-oy)/cell*N+0.5]}
function splatAt(x,y,dxPx,dyPx,pressed){
  const [gx,gy]=toGrid(x,y);
  /* pointer delta in grid cells, scaled by 8 */
  const vx=(dxPx/cell)*N*8, vy=(dyPx/cell)*N*8;
  const speed=Math.hypot(dxPx,dyPx)/cell*N;
  hue=(hue+0.0016+speed*0.00006)%1;
  const col=hsl(hue,0.95,0.55);
  const rad=(pressed?2.2+Math.min(6,speed*1.4):2.4);
  const amt=pressed?0.55+Math.min(1.4,speed*0.28):0.045;
  splat(gx,gy,vx*0.12,vy*0.12,col[0],col[1],col[2],rad,amt);
}
function inHud(t){return t&&t.closest&&t.closest('.hud')}
addEventListener('pointermove',e=>{
  if(inHud(e.target))return;
  const x=e.clientX,y=e.clientY;
  if(lx==null){lx=x;ly=y;return;}
  splatAt(x,y,x-lx,y-ly,down);
  lx=x;ly=y;
},{passive:true});
addEventListener('pointerdown',e=>{
  if(inHud(e.target))return;
  down=true;lx=e.clientX;ly=e.clientY;
  splatAt(e.clientX,e.clientY,0,0,true);
  if(!firstTouch){firstTouch=true;hint.classList.add('gone');}
});
addEventListener('pointerup',()=>{down=false});
addEventListener('pointerleave',()=>{down=false;lx=ly=null});

/* ---------------- ambient emitters ---------------- */
let autoOn=!reduce;
const autoBtn=document.getElementById('auto');
autoBtn.setAttribute('aria-pressed',String(autoOn));
if(reduce)autoBtn.disabled=true;
autoBtn.addEventListener('click',()=>{
  if(reduce)return;
  autoOn=!autoOn;
  autoBtn.setAttribute('aria-pressed',String(autoOn));
});
const emitters=[
  {r1:0.30,r2:0.20,w1:0.13,w2:0.17,ph:0,      ho:0.00},
  {r1:0.24,r2:0.31,w1:0.09,w2:0.21,ph:2.4,    ho:0.42}
];
function emittersStep(t){
  emitters.forEach(m=>{
    const px=m.x,py=m.y;
    m.x=N/2+Math.sin(t*m.w1+m.ph)*m.r1*N+Math.sin(t*m.w2*1.7)*m.r2*N*0.35;
    m.y=N/2+Math.cos(t*m.w2+m.ph)*m.r2*N+Math.cos(t*m.w1*1.3)*m.r1*N*0.35;
    if(px!=null){
      const col=hsl((hue+m.ho)%1,0.95,0.55);
      splat(m.x,m.y,(m.x-px)*0.10,(m.y-py)*0.10,col[0],col[1],col[2],3.6,0.16);
    }
  });
}

/* ---------------- HUD wiring ---------------- */
const bri=document.getElementById('bri'), briOut=document.getElementById('briOut');
const dis=document.getElementById('dis'), disOut=document.getElementById('disOut');
bri.addEventListener('input',()=>{brightness=parseFloat(bri.value);briOut.textContent=brightness.toFixed(2)});
dis.addEventListener('input',()=>{dissipation=parseFloat(dis.value);disOut.textContent=dissipation.toFixed(3)});
document.getElementById('clear').addEventListener('click',()=>{
  u.fill(0);v.fill(0);u0.fill(0);v0.fill(0);
  dR.fill(0);dG.fill(0);dB.fill(0);
});
document.querySelectorAll('.btn').forEach(btn=>{
  btn.addEventListener('pointermove',e=>{
    const r=btn.getBoundingClientRect();
    btn.style.setProperty('--mx',(e.clientX-r.left)+'px');
    btn.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
});
const swatch=document.getElementById('swatch');
const fpsEl=document.getElementById('fps');

/* ---------------- main loop ---------------- */
let frames=0,fpsT=performance.now(),t0=performance.now();
function loop(now){
  const t=(now-t0)/1000;
  if(autoOn&&!reduce)emittersStep(t);
  velStep();
  dyeStep();
  render();
  const hd=(hue*360).toFixed(0);
  swatch.style.background='hsl('+hd+' 95% 55%)';
  swatch.style.boxShadow='0 0 14px 3px hsl('+hd+' 95% 55% / 0.6)';
  frames++;
  if(now-fpsT>500){
    fpsEl.textContent=Math.round(frames*1000/(now-fpsT))+' fps';
    frames=0;fpsT=now;
  }
  requestAnimationFrame(loop);
}
seedRing();
requestAnimationFrame(loop);
</script>
</body>
</html>
