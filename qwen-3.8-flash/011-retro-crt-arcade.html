<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Drift — Voltage Works VW-25</title>
<style>
  :root {
    --g:  #39ff6a;   /* phosphor green */
    --gd: #1f8a3c;   /* dim green */
    --c:  #2bd8ff;   /* cyan */
    --m:  #ff3cac;   /* magenta */
    --y:  #fff35c;   /* yellow */
    --a:  #ffb347;   /* amber */
    --scr: 'Courier New', ui-monospace, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: radial-gradient(ellipse 130% 100% at 50% 108%, #1b1b22 0%, #0b0b10 45%, #050507 100%);
    display: grid;
    place-items: center;
    font-family: var(--scr);
    -webkit-font-smoothing: none;
  }

  /* ---------- cabinet ---------- */
  .cabinet {
    position: relative;
    width: min(94vw, 118vh);
    aspect-ratio: 5 / 4;
  }
  .bezel {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px),
      linear-gradient(160deg, #2a2a2e 0%, #141416 55%, #0b0b0d 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 1px 0 0 rgba(255,255,255,0.05),
      inset 0 -3px 8px rgba(0,0,0,0.7),
      0 46px 90px -22px rgba(0,0,0,0.95),
      0 12px 28px rgba(0,0,0,0.6);
  }
  .lamp {
    position: absolute;
    top: 26%;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffd9a0, var(--a));
    box-shadow: 0 0 12px 3px rgba(255,179,71,0.65), 0 0 30px 8px rgba(255,179,71,0.25);
    animation: lamp 1.9s ease-in-out infinite alternate;
  }
  .lamp.l { left: 12px; }
  .lamp.r { right: 12px; animation-delay: -0.95s; }
  @keyframes lamp { from { opacity: 0.45; } to { opacity: 1; } }

  .badge {
    position: absolute;
    left: 50%; bottom: 2.6%;
    transform: translateX(-50%);
    font-size: clamp(6px, 0.85vw + 0.6vh, 10px);
    letter-spacing: 0.28em;
    color: #5a5a60;
    text-shadow: 0 1px 0 rgba(255,255,255,0.09), 0 -1px 1px rgba(0,0,0,0.8);
    white-space: nowrap;
  }

  /* ---------- CRT screen ---------- */
  .screen {
    position: absolute;
    left: 4%; right: 4%; top: 3.5%; bottom: 9.5%;
    border-radius: 8% / 11%;
    background: #020603;
    overflow: hidden;
    box-shadow:
      inset 0 0 14px 6px rgba(0,0,0,0.9),
      inset 0 0 90px 34px rgba(0,0,0,0.75),
      inset 0 0 200px 80px rgba(0,0,0,0.55),
      0 0 24px rgba(57,255,106,0.06);
  }
  .content {
    position: absolute;
    inset: 0;
    padding: 3.2% 4.5% 2.5%;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 1.2%;
    font-size: clamp(8px, 1.05vh + 0.9vw, 16px);
    color: var(--g);
    text-shadow: 0 0 5px rgba(57,255,106,0.55), 0 0 18px rgba(57,255,106,0.22);
    animation: flick 5.3s step-end infinite;
  }
  @keyframes flick {
    0%, 91%, 92.6%, 94.8%, 96%, 100% { opacity: 1; }
    91.6%  { opacity: 0.84; }
    93.2%  { opacity: 0.92; }
    95.4%  { opacity: 0.87; }
  }
  .crt-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .scanlines { background: repeating-linear-gradient(0deg, rgba(0,0,0,0.30) 0 1px, transparent 1px 3px); }
  .grille    { background: repeating-linear-gradient(90deg,
      rgba(255,40,40,0.05) 0 1px, rgba(40,255,40,0.05) 1px 2px, rgba(60,60,255,0.05) 2px 3px); }
  .rollbar {
    height: 26%;
    top: -30%;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.055) 45%, rgba(255,255,255,0.085) 50%, rgba(255,255,255,0.055) 55%, transparent);
    animation: roll 7s linear infinite;
  }
  @keyframes roll { from { transform: translateY(0); } to { transform: translateY(500%); } }
  .sheen {
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.05) 45%,
      rgba(255,255,255,0.016) 53%, transparent 62%);
  }

  /* ---------- logo ---------- */
  .logo-zone { text-align: center; flex: none; padding-top: 1%; }
  .logo-wrap {
    position: relative;
    display: inline-block;
    animation: huespin 14s linear infinite;
  }
  @keyframes huespin {
    from { filter: hue-rotate(0deg) drop-shadow(0 0 6px rgba(57,255,106,0.4)); }
    to   { filter: hue-rotate(360deg) drop-shadow(0 0 6px rgba(57,255,106,0.4)); }
  }
  #logoPix { position: absolute; left: 0; top: 0; width: 4px; height: 4px; background: transparent; }
  .tagline {
    color: var(--c);
    text-shadow: 0 0 6px rgba(43,216,255,0.6);
    letter-spacing: 0.32em;
    font-size: 0.95em;
    margin-top: 4px;
  }

  /* ---------- attract panel ---------- */
  .panel {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1.05fr;
    gap: 4%;
    align-content: center;
    padding: 1% 3% 0;
  }
  .box { border: 1px solid var(--gd); padding: 1.2em 1.4em; min-width: 0; }
  .box h2 {
    font-size: 0.9em;
    font-weight: 400;
    color: var(--gd);
    letter-spacing: 0.22em;
    margin-bottom: 1em;
    border-bottom: 1px dashed rgba(31,138,60,0.5);
    padding-bottom: 0.5em;
  }
  .box h2 b { color: var(--m); text-shadow: 0 0 6px rgba(255,60,172,0.6); font-weight: 400; }

  .row {
    position: relative;
    padding: 0.4em 0.6em 0.4em 1.9em;
    color: var(--gd);
    letter-spacing: 0.12em;
    font-size: 1em;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease-out, color 0.12s;
  }
  .row::before {
    content: '';
    position: absolute;
    left: 0.4em; top: 50%;
    margin-top: -0.42em;
    border-left: 0.66em solid var(--m);
    border-top: 0.42em solid transparent;
    border-bottom: 0.42em solid transparent;
    filter: drop-shadow(0 0 4px rgba(255,60,172,0.7));
    visibility: hidden;
  }
  .row.sel { color: var(--g); transform: translateX(6px); text-shadow: 0 0 6px rgba(57,255,106,0.7); }
  .row.sel::before { visibility: visible; animation: curblink 0.9s step-end infinite; }
  @keyframes curblink { 50% { opacity: 0; } }
  .row.flash { animation: rowinv 0.62s step-end; }
  @keyframes rowinv {
    0%, 34%, 68%, 100% { background: transparent; color: var(--g); }
    17%, 51% { background: var(--g); color: #000; text-shadow: none; }
  }

  .scores { width: 100%; border-collapse: collapse; font-size: 0.98em; }
  .scores td { padding: 0.28em 0.15em; letter-spacing: 0.06em; }
  .scores .rk { color: var(--gd); width: 2.2em; }
  .scores .ini { color: var(--a); text-shadow: 0 0 6px rgba(255,179,71,0.55); }
  .scores .sc { color: var(--c); text-align: right; text-shadow: 0 0 6px rgba(43,216,255,0.55); }
  .scores.slide tr { animation: rowin 0.28s steps(3, end) backwards; }
  @keyframes rowin {
    from { transform: translateX(22px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  .rank-label { margin-top: 0.9em; color: var(--m); font-size: 0.8em; letter-spacing: 0.3em; text-shadow: 0 0 6px rgba(255,60,172,0.6); }

  /* ---------- attract footer ---------- */
  .attract-foot {
    flex: none;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 3em;
    padding: 0 0 1.5%;
    font-size: 0.95em;
    letter-spacing: 0.2em;
  }
  #coinBtn {
    font: inherit;
    background: none;
    border: 0;
    color: var(--y);
    text-shadow: 0 0 7px rgba(255,243,92,0.7);
    letter-spacing: 0.2em;
    cursor: pointer;
    animation: blink 1.1s step-end infinite;
  }
  #coinBtn.urgent { animation-duration: 0.35s; }
  @keyframes blink { 50% { opacity: 0.12; } }
  #creditCount { color: var(--a); text-shadow: 0 0 7px rgba(255,179,71,0.7); }
  .copyline { color: var(--gd); font-size: 0.72em; letter-spacing: 0.14em; }

  /* ---------- game view ---------- */
  #gameWrap { position: absolute; inset: 0; display: none; z-index: 3; }
  #gameWrap.on { display: block; }
  #game { width: 100%; height: 100%; display: block; cursor: ew-resize; touch-action: none; }
  .panel.hidden, .logo-zone.hidden, #attractFoot.hidden2 { visibility: hidden; }

  /* ---------- toast ---------- */
  #toast {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    font-size: 2.6em;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--m);
    text-shadow: 0 0 12px rgba(255,60,172,0.9), 0 0 40px rgba(255,60,172,0.5);
    pointer-events: none;
    opacity: 0;
    white-space: nowrap;
    z-index: 5;
  }
  #toast.pop { animation: toastpop var(--td, 1.6s) step-end forwards; }
  @keyframes toastpop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(1.35); }
    6%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    82%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- credits overlay ---------- */
  #creditsOv {
    position: absolute;
    inset: 8% 12%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9em;
    text-align: center;
    letter-spacing: 0.22em;
    font-size: 0.95em;
    color: var(--g);
    background: rgba(2,6,3,0.88);
    border: 1px solid var(--gd);
    z-index: 4;
    cursor: pointer;
  }
  #creditsOv.on { display: flex; animation: credin 0.2s steps(2); }
  @keyframes credin { from { opacity: 0; } }
  #creditsOv .big { font-size: 1.7em; color: var(--c); text-shadow: 0 0 10px rgba(43,216,255,0.8); }
  #creditsOv .press { margin-top: 1.4em; color: var(--y); font-size: 0.8em; animation: blink 1.1s step-end infinite; }

  @media (max-width: 640px) {
    .content { font-size: clamp(7px, 0.6vw + 1.05vh, 11px); padding: 2.2% 3.5% 1.5%; gap: 0.8%; }
    .panel { grid-template-columns: 1fr; gap: 2.5%; padding: 0 1.5%; }
    .box { padding: 0.55em 0.8em; }
    .box h2 { margin-bottom: 0.4em; padding-bottom: 0.35em; }
    .row { padding: 0.2em 0.4em 0.2em 1.6em; font-size: 0.95em; }
    .scores td { padding: 0.1em 0.1em; }
    .rank-label { margin-top: 0.4em; }
    .tagline { font-size: 0.8em; letter-spacing: 0.2em; margin-top: 1px; }
    .attract-foot { gap: 1.4em; font-size: 0.82em; }
    .copyline { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .content { animation: none; }
    .rollbar { display: none; }
    #coinBtn, .row.sel::before, #creditsOv .press { animation: none; }
    .scores.slide tr { animation: none; }
    .lamp { animation: none; opacity: 0.9; }
    .logo-wrap { animation: none; filter: drop-shadow(0 0 6px rgba(57,255,106,0.4)); }
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="bezel">
    <span class="lamp l"></span>
    <span class="lamp r"></span>
    <div class="screen">
      <div class="content" id="content">

        <div class="logo-zone" id="logoZone">
          <div class="logo-wrap" id="logoWrap" role="img" aria-label="Neon Drift">
            <span id="logoPix"></span>
          </div>
          <div class="tagline">// ATTRACT MODE — 1987 //</div>
        </div>

        <div class="panel" id="panel">
          <div class="box">
            <h2>▸ SELECT <b>1 OF 4</b></h2>
            <div id="menu">
              <div class="row sel" data-act="start">1P START — PADDLE</div>
              <div class="row" data-act="rank">VIEW RANKINGS</div>
              <div class="row" data-act="shuffle">SHUFFLE TABLE</div>
              <div class="row" data-act="credits">CREDITS</div>
            </div>
          </div>
          <div class="box">
            <h2>TODAY'S HI-SCORES</h2>
            <table class="scores" id="scores"><tbody></tbody></table>
            <div class="rank-label" id="rankLabel">RANKS 01–05</div>
          </div>
        </div>

        <div class="attract-foot" id="attractFoot">
          <button id="coinBtn" type="button">INSERT COIN</button>
          <span id="creditCount">CREDIT 00</span>
          <span class="copyline">© 1987 VOLTAGE WORKS · PLAY COIN REQUIRED</span>
        </div>
      </div>

      <div id="gameWrap"><canvas id="game" aria-label="Paddle game"></canvas></div>

      <div id="toast" aria-live="polite"></div>
      <div id="creditsOv" role="dialog" aria-label="Credits"></div>

      <div class="crt-overlay scanlines"></div>
      <div class="crt-overlay grille"></div>
      <div class="crt-overlay rollbar"></div>
      <div class="crt-overlay sheen"></div>
    </div>
    <div class="badge">VOLTAGE WORKS · MODEL VW-25 · MADE IN OSAKA</div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);

  /* ================= pixel logo ================= */
  const FONT = {
    N: ['10001','11001','10101','10011','10001'],
    E: ['11111','10000','11110','10000','11111'],
    O: ['01110','10001','10001','10001','01110'],
    ' ': null,
    D: ['11100','10010','10001','10010','11100'],
    R: ['11110','10001','11110','10100','10010'],
    I: ['11111','00100','00100','00100','11111'],
    F: ['11111','10000','11110','10000','10000'],
    T: ['11111','00100','00100','00100','00100'],
  };
  const GLYPH_COLORS = ['#2bd8ff', '#ff3cac', '#fff35c', '#ffb347', '#39ff6a'];
  const TEXT = 'NEON DRIFT';
  const logoWrap = $('#logoWrap');
  const logoPix = $('#logoPix');

  function buildLogo() {
    const screen = $('.screen');
    const cols = TEXT.length * 6 - 1;
    const p = Math.max(2, Math.floor(screen.clientWidth * 0.7 / cols));
    logoWrap.style.width  = cols * p + 'px';
    logoWrap.style.height = 5 * p + 'px';
    logoPix.style.width  = p + 'px';
    logoPix.style.height = p + 'px';
    const shadows = [];
    for (let glyph = 0; glyph < TEXT.length; glyph++) {
      const map = FONT[TEXT[glyph]];
      if (!map) continue;
      const color = GLYPH_COLORS[glyph % GLYPH_COLORS.length];
      const x0 = glyph * 6;
      for (let r = 0; r < 5; r++)
        for (let c = 0; c < 5; c++)
          if (map[r][c] === '1')
            shadows.push(`${(x0 + c) * p}px ${r * p}px 0 0 ${color}`);
    }
    logoPix.style.boxShadow = shadows.join(',');
  }
  buildLogo();

  /* ================= toast ================= */
  const toast = $('#toast');
  function showToast(msg, dur = 1.5) {
    toast.textContent = msg;
    toast.classList.remove('pop');
    void toast.offsetWidth;
    toast.style.setProperty('--td', dur + 's');
    toast.classList.add('pop');
  }

  /* ================= hi-scores ================= */
  let scoreData = [
    ['NEO',9874520],['AAA',9130770],['VWF',8642100],['KTN',8210540],['MRB',7935880],
    ['PLR',7402110],['ZAP',6888340],['OBA',6311720],['GNT',5874090],['MKO',5230680],
    ['D84',4715930],['RXF',4102770],['CAT',3689240],['HEX',3015460],['YOU',2488100],
  ];
  const tbody = $('#scores tbody');
  const rankLabel = $('#rankLabel');
  let page = 0;

  function renderPage(p) {
    page = p;
    tbody.innerHTML = '';
    tbody.classList.remove('slide'); void tbody.offsetWidth; tbody.classList.add('slide');
    scoreData.slice(p * 5, p * 5 + 5).forEach(([ini, sc], i) => {
      const tr = document.createElement('tr');
      tr.style.animationDelay = (i * 0.09) + 's';
      tr.innerHTML =
        `<td class="rk">${String(p * 5 + i + 1).padStart(2, '0')}</td>` +
        `<td class="ini">${ini}</td>` +
        `<td class="sc">${String(sc).padStart(7, '0')}</td>`;
      tbody.appendChild(tr);
    });
    rankLabel.textContent = `RANKS ${String(p * 5 + 1).padStart(2, '0')}–${String(p * 5 + 5).padStart(2, '0')}`;
  }
  renderPage(0);
  setInterval(() => { if (!gameOn) renderPage((page + 1) % 3); }, 4000);

  /* ================= menu ================= */
  const rows = [...document.querySelectorAll('#menu .row')];
  let sel = 0;
  function select(i) {
    sel = (i + rows.length) % rows.length;
    rows.forEach((r, k) => r.classList.toggle('sel', k === sel));
  }
  rows.forEach((r, i) => {
    r.addEventListener('mouseenter', () => select(i));
    r.addEventListener('click', () => activate(r));
  });
  function activate(row) {
    row.classList.remove('flash'); void row.offsetWidth;
    row.classList.add('flash');
    const act = row.dataset.act;
    if (act === 'start') tryStart();
    else if (act === 'rank') renderPage((page + 1) % 3);
    else if (act === 'shuffle') shuffleTable();
    else if (act === 'credits') openCredits();
  }

  function shuffleTable() {
    const d = scoreData.slice();
    for (let i = d.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [d[i], d[j]] = [d[j], d[i]];
    }
    scoreData = d;
    renderPage(page);
    showToast('SHUFFLED');
  }

  /* ================= credits overlay ================= */
  const creditsOv = $('#creditsOv');
  let creditsOpen = false;
  function openCredits() {
    creditsOv.innerHTML =
      `<div>VOLTAGE WORKS PRESENTS</div>` +
      `<div class="big">NEON DRIFT</div>` +
      `<div>SOFTWARE · K. TANAKA</div>` +
      `<div>HARDWARE · M. AOKI</div>` +
      `<div>GRAPHIC · R. SATO</div>` +
      `<div>SPECIAL THANKS · AKIHABARA AMUSEMENT CENTER</div>` +
      `<div class="press">CLICK OR PRESS ANY KEY TO EXIT</div>`;
    creditsOv.classList.add('on');
    creditsOpen = true;
  }
  function closeCredits() { creditsOv.classList.remove('on'); creditsOpen = false; }
  creditsOv.addEventListener('click', closeCredits);

  /* ================= coin / credits ================= */
  let credits = 0;
  const creditCount = $('#creditCount');
  const coinBtn = $('#coinBtn');
  function addCoin() {
    credits++;
    creditCount.textContent = 'CREDIT ' + String(credits).padStart(2, '0');
    showToast('CREDIT ' + credits);
  }
  function addCreditUrgent() {
    coinBtn.classList.add('urgent');
    setTimeout(() => coinBtn.classList.remove('urgent'), 2100);
  }
  coinBtn.addEventListener('click', addCoin);

  /* ================= attract ↔ game ================= */
  const panel = $('#panel');
  const logoZone = $('#logoZone');
  const attractFoot = $('#attractFoot');
  const gameWrap = $('#gameWrap');
  let gameOn = false;

  function tryStart() {
    if (credits < 1) { addCreditUrgent(); return; }
    credits--;
    creditCount.textContent = 'CREDIT ' + String(credits).padStart(2, '0');
    startGame();
  }

  function toAttract() {
    gameOn = false;
    cancelAnimationFrame(rafId);
    gameWrap.classList.remove('on');
    panel.classList.remove('hidden');
    logoZone.classList.remove('hidden');
    attractFoot.classList.remove('hidden2');
  }

  /* ================= the game ================= */
  const canvas = $('#game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let ball = null, paddle = null, bricks = null, cell = 40;
  let score = 0, lives = 3, stage = 1, launchT = 0;
  let keyL = false, keyR = false, rafId = 0, lastT = 0;
  const trail = [];
  const BRICK_COLORS = ['#ff3cac', '#2bd8ff', '#fff35c'];

  function makeBricks() {
    bricks = [];
    for (let row = 0; row < 3; row++)
      for (let col = 0; col < 8; col++)
        bricks.push({ alive: true, x: 0, y: 0, w: 10, h: 10, color: BRICK_COLORS[row] });
  }

  function layout() {
    const mX = W * 0.09, top = H * 0.14, gap = Math.max(4, W * 0.008);
    const bw = (W - 2 * mX - 7 * gap) / 8, bh = H * 0.045;
    bricks.forEach((b, i) => {
      const col = i % 8, row = (i / 8) | 0;
      b.x = mX + col * (bw + gap);
      b.y = top + row * (bh + gap);
      b.w = bw; b.h = bh;
    });
    paddle.w = Math.max(64, W * 0.13);
    paddle.h = Math.max(8, H * 0.016);
    paddle.y = H - H * 0.06;
    ball.s = Math.max(8, W * 0.014);
    cell = Math.max(30, W / 16);
  }

  function resetBall() {
    const sp = Math.min(W, H) * 0.42;
    ball.speed = sp;
    const ang = (-Math.PI / 2) + (Math.random() * 0.9 - 0.45);
    ball.vx = Math.cos(ang) * sp;
    ball.vy = Math.sin(ang) * sp;
    trail.length = 0;
    launchT = performance.now() + 1300;
  }

  function sizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = gameWrap.clientWidth;
    H = gameWrap.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (bricks && paddle) layout();
  }

  function startGame() {
    gameOn = true;
    panel.classList.add('hidden');
    logoZone.classList.add('hidden');
    attractFoot.classList.add('hidden2');
    gameWrap.classList.add('on');
    paddle = { x: W / 2, y: 0, w: 90, h: 10 };
    ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 200, s: 10 };
    score = 0; lives = 3; stage = 1; keyL = false; keyR = false;
    makeBricks();
    sizeCanvas();
    paddle.x = W / 2;
    resetBall();
    showToast('READY');
    lastT = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    gameOn = false;
    cancelAnimationFrame(rafId);
    showToast('GAME OVER', 2.3);
    setTimeout(toAttract, 2300);
  }

  function loop(ts) {
    const dt = Math.min((ts - lastT) / 1000, 0.04);
    lastT = ts;
    update(ts, dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function update(ts, dt) {
    const K = paddle.w * 3.6;
    if (keyL) paddle.x -= K * dt;
    if (keyR) paddle.x += K * dt;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

    if (ts < launchT) {
      ball.x = paddle.x;
      ball.y = paddle.y - ball.s * 2.6;
      trail.length = 0;
      return;
    }
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    const s = ball.s, half = s / 2;
    if (ball.x - half < 0)          { ball.x = half;      ball.vx =  Math.abs(ball.vx); }
    if (ball.x + half > W)          { ball.x = W - half;  ball.vx = -Math.abs(ball.vx); }
    if (ball.y - half < H * 0.05)   { ball.y = H * 0.05 + half; ball.vy = Math.abs(ball.vy); }

    if (ball.vy > 0 &&
        ball.y + half >= paddle.y && ball.y - half <= paddle.y + paddle.h &&
        Math.abs(ball.x - paddle.x) <= paddle.w / 2 + half) {
      const off = (ball.x - paddle.x) / (paddle.w / 2);
      ball.speed = Math.min(ball.speed * 1.03, Math.min(W, H) * 0.85);
      const ang = -Math.PI / 2 + off * 1.05;
      ball.vx = Math.cos(ang) * ball.speed;
      ball.vy = Math.sin(ang) * ball.speed;
      ball.y = paddle.y - half - 1;
      score += 5;
    }

    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x + half > b.x && ball.x - half < b.x + b.w &&
          ball.y + half > b.y && ball.y - half < b.y + b.h) {
        b.alive = false;
        score += 25;
        const overlapX = Math.min(ball.x + half - b.x, b.x + b.w - (ball.x - half));
        const overlapY = Math.min(ball.y + half - b.y, b.y + b.h - (ball.y - half));
        if (overlapX < overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        break;
      }
    }

    if (bricks.every((b) => !b.alive)) {
      stage++;
      makeBricks();
      layout();
      resetBall();
      showToast('STAGE CLEAR', 2);
    }

    if (ball.y - half > H) {
      lives--;
      if (lives > 0) { showToast('MISS'); resetBall(); }
      else { endGame(); return; }
    }

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 14) trail.shift();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#020603';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(57,255,106,0.07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += cell) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += cell) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();

    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.92;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;

    trail.forEach((t, i) => {
      const f = (i + 1) / trail.length;
      ctx.fillStyle = `rgba(57,255,106,${(f * 0.4).toFixed(3)})`;
      const sz = ball.s * (0.35 + 0.6 * f);
      ctx.fillRect(t.x - sz / 2, t.y - sz / 2, sz, sz);
    });

    ctx.shadowColor = '#fff35c';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#fff35c';
    ctx.fillRect(ball.x - ball.s / 2, ball.y - ball.s / 2, ball.s, ball.s);

    ctx.shadowColor = '#39ff6a';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#39ff6a';
    ctx.fillRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h);
    ctx.shadowBlur = 0;

    ctx.shadowColor = 'rgba(57,255,106,0.7)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#39ff6a';
    ctx.font = `${Math.round(H * 0.028)}px 'Courier New', ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + String(score).padStart(7, '0'), W * 0.03, H * 0.015);
    ctx.textAlign = 'right';
    ctx.fillText('STAGE ' + stage, W * 0.97, H * 0.015);
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;

    const d = H * 0.016;
    for (let i = 0; i < lives; i++) {
      ctx.save();
      ctx.translate(W * 0.04 + i * d * 2.4, H - d * 1.6);
      ctx.rotate(Math.PI / 4);
      ctx.shadowColor = '#39ff6a';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = '#39ff6a';
      ctx.lineWidth = 2;
      ctx.strokeRect(-d / 2, -d / 2, d, d);
      ctx.restore();
    }
  }

  /* input: keys */
  addEventListener('keydown', (e) => {
    if (creditsOpen) { closeCredits(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keyL = true; }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keyR = true; }
    else if (e.key === 'c' || e.key === 'C') { if (!gameOn) addCoin(); return; }
    else if (gameOn) return;
    if (gameOn && (e.key.startsWith('Arrow'))) e.preventDefault();
    else if (e.key === 'ArrowUp') { select(sel - 1); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { select(sel + 1); e.preventDefault(); }
    else if (e.key === 'Enter' && !gameOn) activate(rows[sel]);
  });
  addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyL = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyR = false;
  });

  /* input: pointer drag / touch on canvas */
  let dragging = false;
  function pointTo(e) {
    const r = canvas.getBoundingClientRect();
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, e.clientX - r.left));
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (!gameOn) return;
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    pointTo(e);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => { if (dragging) pointTo(e); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) lastT = performance.now(); });

  addEventListener('resize', () => {
    buildLogo();
    if (gameOn) {
      const px = paddle.x / W;
      sizeCanvas();
      paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, px * W));
      ball.x = Math.min(Math.max(ball.x, ball.s), W - ball.s);
    }
  });
})();
</script>
</body>
</html>
