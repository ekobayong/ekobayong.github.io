<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope — brass eyepiece of living glass</title>
<style>
  :root{
    --brass-hi:#f3d58a; --brass:#c99a3c; --brass-lo:#9c6a1e; --brass-dk:#5a3a0c;
    --parchment:#e9dcc4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#0e0c0a;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--parchment);
    overflow:hidden;
    display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(58vmin 58vmin at 50% 46%, #241c14 0%, rgba(36,28,20,0) 70%);
  }
  .grain{
    position:fixed; inset:0; z-index:50; pointer-events:none; opacity:.12; mix-blend-mode:overlay;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="220" height="220" filter="url(%23f)"/></svg>');
  }

  header{
    position:relative; z-index:5;
    display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap;
    padding:clamp(12px,2.6vh,24px) clamp(16px,3.4vw,36px) 0;
  }
  h1{
    font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;
    font-weight:400; font-size:clamp(20px,2.6vw,30px); letter-spacing:.015em;
    color:var(--parchment);
  }
  h1::after{content:""; display:block; width:44px; height:1px; margin-top:6px;
    background:linear-gradient(90deg,var(--brass),transparent);}
  #status{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.24em;
    color:rgba(233,220,196,.5);
  }
  #status b{color:var(--brass-hi); font-weight:700;}

  main{flex:1; position:relative; z-index:2; display:flex; align-items:center; justify-content:center; min-height:0;}

  /* ---------- brass eyepiece ---------- */
  .scope{
    position:relative;
    width:min(88vw, 74vh); height:min(88vw, 74vh);
    border-radius:50%;
    filter:drop-shadow(0 40px 70px rgba(0,0,0,.85)) drop-shadow(0 6px 18px rgba(0,0,0,.7));
  }
  .rim{ position:absolute; inset:0; border-radius:50%; overflow:hidden; }
  .rim .sheen{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg,
      #f3d58a 0deg, #c99a3c 62deg, #5a3a0c 130deg, #9c6a1e 190deg,
      #f3d58a 248deg, #7a5316 300deg, #c99a3c 340deg, #f3d58a 360deg);
    animation:sheen 40s linear infinite;
  }
  @keyframes sheen{ to{ transform:rotate(360deg);} }
  /* machined inner lip */
  .rim .lip{
    position:absolute; inset:2.6%; border-radius:50%;
    background:conic-gradient(from 140deg, #5a3a0c, #c99a3c 90deg, #f3d58a 150deg, #9c6a1e 230deg, #5a3a0c 300deg, #c99a3c 360deg);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.75), inset 0 -2px 4px rgba(255,225,160,.35),
               inset 0 0 0 1px rgba(30,20,5,.9);
  }
  /* knurling: repeating hairlines masked to the outer band */
  .rim .knurl{
    position:absolute; inset:0; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,235,180,.32) 0deg 0.6deg, rgba(0,0,0,0) 0.6deg 3deg);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, transparent 66%, #000 69%, #000 96%, transparent 100%);
            mask-image:radial-gradient(circle at 50% 50%, transparent 66%, #000 69%, #000 96%, transparent 100%);
  }
  .rim .shade{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, rgba(255,240,200,.28), rgba(0,0,0,0) 45%),
               radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 78%, rgba(0,0,0,.45) 100%);
    mix-blend-mode:soft-light;
  }

  .lens{
    position:absolute; inset:7%; border-radius:50%; overflow:hidden;
    background:#07050d;
    box-shadow:inset 0 0 22px 8px rgba(10,5,0,.9), inset 0 0 0 1.5px rgba(20,12,2,.95);
    cursor:grab;
  }
  .lens:active{cursor:grabbing;}
  #display{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .vignette{
    position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(38% 26% at 30% 24%, rgba(255,255,255,.14), rgba(255,255,255,0) 100%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 55%, rgba(8,4,0,.55) 88%, rgba(4,2,0,.85) 100%);
  }
  .glint{
    position:absolute; inset:-20%; pointer-events:none; border-radius:50%;
    background:linear-gradient(112deg, rgba(255,255,255,0) 42%, rgba(255,250,235,.13) 49%, rgba(255,255,255,0) 57%);
    animation:glint 9s ease-in-out infinite alternate;
    mix-blend-mode:screen;
  }
  @keyframes glint{ from{ transform:translateX(-24%);} to{ transform:translateX(24%);} }

  /* ---------- footer controls ---------- */
  footer{
    position:relative; z-index:5;
    display:flex; align-items:center; justify-content:center; gap:clamp(10px,2vw,26px);
    flex-wrap:wrap;
    padding:0 18px clamp(14px,2.8vh,26px);
  }
  .ctl{display:flex; align-items:center; gap:9px;}
  .cap{
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.3em;
    color:rgba(233,220,196,.5);
  }
  .pillbrass{
    display:flex; border-radius:999px; overflow:hidden;
    border:1px solid rgba(201,154,60,.55);
    background:linear-gradient(180deg, #c99a3c, #9c6a1e 55%, #5a3a0c);
    box-shadow:inset 0 1px 0 rgba(255,235,180,.55), inset 0 -2px 4px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.5);
  }
  .pillbrass button{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font:700 10px/1 var(--sans); letter-spacing:.18em; text-transform:uppercase;
    color:rgba(24,14,2,.85); padding:9px 13px; transition:background .25s, color .25s;
  }
  .pillbrass button + button{border-left:1px solid rgba(60,38,8,.5);}
  .pillbrass button.on{
    background:linear-gradient(180deg, rgba(255,240,200,.9), rgba(243,213,138,.75));
    color:#241302; box-shadow:inset 0 0 8px rgba(90,58,12,.6);
  }
  .pals{display:flex; gap:8px;}
  .pal{
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:1.5px solid rgba(201,154,60,.5);
    box-shadow:inset 0 1px 3px rgba(255,255,255,.25), 0 2px 8px rgba(0,0,0,.55);
    transition:transform .2s, border-color .2s;
  }
  .pal:hover{transform:scale(1.12);}
  .pal.on{border-color:var(--brass-hi); transform:scale(1.15);
    box-shadow:0 0 10px rgba(243,213,138,.5), inset 0 1px 3px rgba(255,255,255,.25);}
  #shakeBtn{
    appearance:none; cursor:pointer; border-radius:999px;
    border:1px solid rgba(201,154,60,.6);
    background:linear-gradient(180deg,#c99a3c,#7a5316 60%,#5a3a0c);
    box-shadow:inset 0 1px 0 rgba(255,235,180,.6), 0 3px 10px rgba(0,0,0,.5);
    color:rgba(24,14,2,.9); font:700 10px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase;
    padding:10px 20px; transition:filter .2s;
  }
  #shakeBtn:hover{filter:brightness(1.15);}
  #shakeBtn:active{transform:translateY(1px);}
  #density{width:min(180px,30vw);}
  input[type=range]{-webkit-appearance:none; appearance:none; height:20px; background:transparent; cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:5px; border-radius:3px;
    background:linear-gradient(90deg,#5a3a0c,#c99a3c); box-shadow:inset 0 1px 2px rgba(0,0,0,.7);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    margin-top:-5px; background:radial-gradient(circle at 35% 30%, #f3d58a, #9c6a1e 70%, #5a3a0c);
    border:1px solid rgba(40,24,4,.8); box-shadow:0 1px 4px rgba(0,0,0,.6);}
  input[type=range]::-moz-range-track{height:5px; border-radius:3px; background:linear-gradient(90deg,#5a3a0c,#c99a3c);}
  input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f3d58a, #9c6a1e 70%, #5a3a0c); border:1px solid rgba(40,24,4,.8);}
  #denVal{font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--brass-hi); min-width:2ch; text-align:center;}

  @media (prefers-reduced-motion: reduce){
    .rim .sheen{animation:none;}
    .glint{animation:none; opacity:.5;}
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="grain"></div>

<header>
  <h1>Kaleidoscope</h1>
  <div id="status"><b id="foldN">8</b> folds &nbsp;·&nbsp; <b id="shardN">18</b> shards</div>
</header>

<main>
  <div class="scope" id="scope">
    <div class="rim">
      <div class="sheen"></div>
      <div class="knurl"></div>
      <div class="lip"></div>
      <div class="shade"></div>
    </div>
    <div class="lens" id="lens">
      <canvas id="display"></canvas>
      <div class="glint"></div>
      <div class="vignette"></div>
    </div>
  </div>
</main>

<footer>
  <div class="ctl">
    <span class="cap">Folds</span>
    <div class="pillbrass" id="foldCtl">
      <button data-folds="6">6</button>
      <button data-folds="8" class="on">8</button>
      <button data-folds="10">10</button>
      <button data-folds="12">12</button>
    </div>
  </div>
  <div class="ctl">
    <span class="cap">Glass</span>
    <div class="pals" id="palCtl"></div>
  </div>
  <div class="ctl">
    <span class="cap">Shard density</span>
    <input type="range" id="density" min="6" max="40" step="1" value="18">
    <span id="denVal">18</span>
  </div>
  <div class="ctl"><button id="shakeBtn">Shake</button></div>
</footer>

<script>
'use strict';
/* =========================================================
   Kaleidoscope — a live brass eyepiece of living glass.
   A hidden source canvas of drifting shapes is sliced into
   N mirror wedges per frame, alternating reflection.
   ========================================================= */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

const PALETTES = {
  jewel:  { name:'Jewel',   bg:'#07050d', mode:'screen',
            cols:['#7b1fa2','#c2185b','#0288d1','#00897b','#f9a825','#3949ab','#e53935'] },
  pastel: { name:'Pastel',  bg:'#f7f1e6', mode:'multiply',
            cols:['#f8bbd0','#b3e5fc','#c8e6c9','#fff59d','#e1bee7','#ffe0b2','#b2dfdb'] },
  neon:   { name:'Neon',    bg:'#020206', mode:'lighter',
            cols:['#39ff14','#ff073a','#00f0ff','#ff9d00','#ff00e6','#c6ff00','#7a5cff'] },
  autumn: { name:'Autumn',  bg:'#1a0f08', mode:'source-over',
            cols:['#8b2500','#d2691e','#daa520','#556b2f','#a0522d','#cd5c5c','#f4a460'] },
};
let palKey = 'jewel';
let folds = 8;
let density = 18;

function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgba(h, a){ const c = hexRGB(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const pick = a => a[(Math.random() * a.length) | 0];

/* ---------- shapes ---------- */
let SW = 0, SH = 0;              // source canvas logical size (CSS px of the 1.5x field)
let shapes = [];
function makeShape(){
  const pal = PALETTES[palKey];
  const type = Math.random() < 0.55 ? 'blob' : 'shard';
  const s = {
    type,
    x: Math.random() * SW, y: Math.random() * SH,
    vx: (Math.random() - 0.5) * 22, vy: (Math.random() - 0.5) * 22,
    rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.7,
    size: type === 'blob' ? SW * (0.07 + Math.random() * 0.15) : SW * (0.045 + Math.random() * 0.1),
    c1: pick(pal.cols), c2: pick(pal.cols),
    ph: Math.random() * TAU, bs: 0.35 + Math.random() * 0.5,
  };
  if (type === 'shard') {
    const n = 3 + ((Math.random() * 4) | 0);            // 3..6 sides
    s.verts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + (Math.random() - 0.5) * 0.5;
      const r = s.size * (0.55 + Math.random() * 0.45); // jittered radii
      s.verts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
  }
  return s;
}
function rebuildShapes(){ shapes = []; for (let i = 0; i < density; i++) shapes.push(makeShape()); }
function setDensity(d){
  density = Math.max(6, Math.min(40, d));
  while (shapes.length < density) shapes.push(makeShape());
  if (shapes.length > density) shapes.length = density;
  document.getElementById('shardN').textContent = shapes.length;
  document.getElementById('denVal').textContent = density;
}
let kick = 1, kickT = 0;
function shake(){
  rebuildShapes();
  kick = 3; kickT = 1.25;
}

/* ---------- canvases ---------- */
const src = document.createElement('canvas');
const sctx = src.getContext('2d');
const lens = document.getElementById('lens');
const display = document.getElementById('display');
const dctx = display.getContext('2d');
let lensSize = 0, dpr = 1, srcScale = 1;

function sizeCanvases(){
  const rect = lens.getBoundingClientRect();
  lensSize = Math.max(80, Math.round(Math.min(rect.width, rect.height)));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  display.width = Math.round(lensSize * dpr); display.height = Math.round(lensSize * dpr);
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SW = SH = Math.round(lensSize * 1.5);
  srcScale = Math.min(dpr * 1.2, 1.6);
  src.width = Math.round(SW * srcScale); src.height = Math.round(SH * srcScale);
  sctx.setTransform(srcScale, 0, 0, srcScale, 0, 0);
}
new ResizeObserver(sizeCanvases).observe(lens);
sizeCanvases();
rebuildShapes();

/* ---------- motion & view state ---------- */
let globalRot = 0;
const off = { x:0, y:0, tx:0, ty:0 };
function setOffsetFromPointer(px, py){
  const r = lensSize / 2;
  off.tx = ((px / innerWidth) * 2 - 1) * 0.25 * r;
  off.ty = ((py / innerHeight) * 2 - 1) * 0.25 * r;
}
addEventListener('pointermove', e => setOffsetFromPointer(e.clientX, e.clientY));
addEventListener('pointerdown', e => setOffsetFromPointer(e.clientX, e.clientY));
lens.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  if (t) setOffsetFromPointer(t.clientX, t.clientY);
}, { passive:false });
lens.addEventListener('dblclick', shake);

/* ---------- drawing ---------- */
function drawSource(t){
  const pal = PALETTES[palKey];
  sctx.globalCompositeOperation = 'source-over';
  sctx.fillStyle = pal.bg;
  sctx.fillRect(0, 0, SW, SH);
  sctx.globalCompositeOperation = pal.mode;
  for (const s of shapes) {
    const breathe = 1 + 0.08 * Math.sin(t * s.bs + s.ph);
    sctx.save();
    sctx.translate(s.x, s.y);
    sctx.rotate(s.rot);
    sctx.scale(breathe, breathe);
    if (s.type === 'blob') {
      const gr = sctx.createRadialGradient(-s.size * 0.28, -s.size * 0.28, s.size * 0.06, 0, 0, s.size);
      gr.addColorStop(0, rgba(s.c1, 0.95));
      gr.addColorStop(0.5, rgba(s.c2, 0.75));
      gr.addColorStop(1, rgba(s.c2, 0));
      sctx.fillStyle = gr;
      sctx.beginPath(); sctx.arc(0, 0, s.size, 0, TAU); sctx.fill();
    } else {
      const gr = sctx.createLinearGradient(-s.size, -s.size, s.size, s.size);
      gr.addColorStop(0, rgba(s.c1, 0.9));
      gr.addColorStop(1, rgba(s.c2, 0.85));
      sctx.beginPath();
      s.verts.forEach(([x, y], i) => i ? sctx.lineTo(x, y) : sctx.moveTo(x, y));
      sctx.closePath();
      sctx.fillStyle = gr; sctx.fill();
      sctx.strokeStyle = 'rgba(255,255,255,0.18)';
      sctx.lineWidth = 1;
      sctx.stroke();
    }
    sctx.restore();
  }
}
function stepShapes(dt){
  const drift = (REDUCE ? 0.3 : 1) * kick;
  for (const s of shapes) {
    s.x += s.vx * drift * dt; s.y += s.vy * drift * dt;
    s.rot += s.vr * drift * dt;
    const m = s.size * 1.3;
    if (s.x < -m) s.x = SW + m; else if (s.x > SW + m) s.x = -m;
    if (s.y < -m) s.y = SH + m; else if (s.y > SH + m) s.y = -m;
  }
  if (kickT > 0) { kickT -= dt; kick = kickT > 0 ? 1 + 2 * (kickT / 1.25) : 1; }
}
function drawDisplay(t){
  const r = lensSize / 2;
  const a = TAU / folds, ext = 0.004;
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dctx.clearRect(0, 0, lensSize, lensSize);
  dctx.save();
  dctx.translate(r, r);
  dctx.rotate(globalRot);
  for (let i = 0; i < folds; i++) {
    dctx.save();
    // clip sector (extended slightly to hide seams)
    dctx.beginPath();
    dctx.moveTo(0, 0);
    dctx.arc(0, 0, r + 1, i * a - ext / 2, (i + 1) * a + ext / 2);
    dctx.closePath();
    dctx.clip();
    if (i % 2 === 0) {
      dctx.rotate(i * a);
    } else {
      // reflection across the line at angle (i+1)*a/2
      const c = (i + 1) * a / 2;
      dctx.rotate(c); dctx.scale(1, -1); dctx.rotate(-c);
    }
    // offset applied INSIDE the wedge frame so each wedge samples the rotated
    // source — but to keep adjacent wedges true mirror images, the offset is
    // shared in the pre-wedge frame (see loop start), so draw centred here:
    dctx.drawImage(src, -SW / 2, -SH / 2, SW, SH);
    dctx.restore();
  }
  // mirror facets
  dctx.globalCompositeOperation = 'overlay';
  dctx.strokeStyle = 'rgba(255,255,255,0.22)';
  dctx.lineWidth = 1;
  for (let i = 0; i < folds; i++) {
    dctx.beginPath();
    dctx.moveTo(0, 0);
    dctx.lineTo(Math.cos(i * a) * r, Math.sin(i * a) * r);
    dctx.stroke();
  }
  dctx.restore();
  dctx.globalCompositeOperation = 'source-over';
}

/* ---------- controls ---------- */
const foldCtl = document.getElementById('foldCtl');
const palCtl = document.getElementById('palCtl');
function setPalette(key){
  palKey = key;
  const pal = PALETTES[key];
  lens.style.background = pal.bg;
  shapes.forEach(s => { s.c1 = pick(pal.cols); s.c2 = pick(pal.cols); });
  palCtl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.pal === key));
}
Object.entries(PALETTES).forEach(([key, p]) => {
  const b = document.createElement('button');
  b.className = 'pal' + (key === palKey ? ' on' : '');
  b.dataset.pal = key;
  b.title = p.name;
  b.style.background = `conic-gradient(${p.cols.map((c, i) => `${c} ${i / p.cols.length * 360}deg ${(i + 1) / p.cols.length * 360}deg`).join(',')})`;
  b.addEventListener('click', () => setPalette(key));
  palCtl.appendChild(b);
});
foldCtl.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  folds = +t.dataset.folds;
  foldCtl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === t));
  document.getElementById('foldN').textContent = folds;
});
document.getElementById('density').addEventListener('input', e => setDensity(+e.target.value));
document.getElementById('shakeBtn').addEventListener('click', shake);
setPalette('jewel');

/* ---------- main loop ---------- */
let last = performance.now(), clock = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  clock += dt;
  if (!REDUCE) globalRot += 0.06 * dt;
  // wander the offset gently so the pattern never freezes
  const r = lensSize / 2;
  const wx = Math.sin(clock * 0.11) * 0.05 * r + Math.sin(clock * 0.071 + 2) * 0.03 * r;
  const wy = Math.cos(clock * 0.087 + 1) * 0.05 * r + Math.sin(clock * 0.123) * 0.03 * r;
  const tX = off.tx + wx, tY = off.ty + wy;
  const k = 1 - Math.exp(-4.5 * dt);           // exponential easing
  off.x += (tX - off.x) * k; off.y += (tY - off.y) * k;

  stepShapes(dt);
  drawSource(clock);
  drawDisplay(clock);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
