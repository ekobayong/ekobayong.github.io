<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation — Interactive Particle Field</title>
<style>
  :root {
    --peri: #a9b4ff;
    --peri-soft: rgba(169, 180, 255, 0.55);
    --ink: rgba(236, 239, 255, 0.92);
    --dim: rgba(236, 239, 255, 0.52);
    --panel-bg: rgba(6, 11, 31, 0.55);
    --panel-line: rgba(236, 239, 255, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background-color: #060b1f;
    background-image:
      radial-gradient(140% 95% at 50% 118%, rgba(66, 79, 160, 0.22) 0%, rgba(66, 79, 160, 0) 58%),
      radial-gradient(90% 80% at -12% -14%, rgba(120, 90, 200, 0.10) 0%, rgba(120, 90, 200, 0) 62%),
      radial-gradient(120% 120% at 50% 50%, rgba(6, 11, 31, 0) 52%, #03061a 100%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  canvas#sky { position: fixed; inset: 0; display: block; }

  .layer { position: fixed; z-index: 2; pointer-events: none; }
  .layer button, .layer input { pointer-events: auto; }

  .topbar {
    position: fixed; z-index: 2; pointer-events: none;
    top: clamp(18px, 3.4vw, 42px);
    left: clamp(18px, 3.4vw, 46px);
    right: clamp(18px, 3.4vw, 46px);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  }
  header { max-width: min(72vw, 860px); }
  header h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 300;
    font-size: clamp(2.6rem, 8vw, 7.5rem);
    line-height: 1;
    letter-spacing: 0.18em;
    color: #eef0ff;
    text-shadow: 0 0 34px rgba(169, 180, 255, 0.35), 0 0 8px rgba(169, 180, 255, 0.18);
    margin-right: -0.18em;
  }
  header .sub {
    margin-top: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: clamp(0.56rem, 0.9vw, 0.72rem);
    text-transform: uppercase;
    letter-spacing: 0.42em;
    color: var(--dim);
  }

  #stamp {
    flex: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--dim); text-align: right; line-height: 2;
    font-variant-numeric: tabular-nums;
  }
  #stamp b { color: var(--peri); font-weight: 400; }

  .legend { bottom: clamp(18px, 3.4vw, 42px); left: clamp(18px, 3.4vw, 46px); list-style: none; }
  .legend li {
    display: flex; align-items: center; gap: 13px;
    margin: 9px 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim);
  }
  .g { width: 26px; display: inline-flex; align-items: center; justify-content: flex-start; flex: none; }
  .g-dot i {
    width: 5px; height: 5px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 9px 3px var(--peri-soft);
  }
  .g-line i {
    width: 26px; height: 0.8px;
    background: linear-gradient(90deg, rgba(169,180,255,0) 0%, rgba(169,180,255,0.9) 50%, rgba(169,180,255,0) 100%);
  }
  .g-ring i {
    width: 13px; height: 13px; border-radius: 50%;
    border: 1px solid var(--peri-soft);
    box-shadow: inset 0 0 0 3px rgba(6,11,31,0.4), 0 0 8px rgba(169,180,255,0.28);
  }

  .panel {
    bottom: clamp(18px, 3.4vw, 42px); right: clamp(18px, 3.4vw, 46px);
    width: 292px; padding: 18px 20px 20px;
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
  }
  .panel .row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px;
  }
  .panel label, .panel .cap {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim);
  }
  .panel output {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12px; color: var(--peri); font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 20px; margin-bottom: 18px;
    background: transparent; cursor: ew-resize;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 1px;
    background: linear-gradient(90deg, rgba(169,180,255,0.95) var(--fill, 36%), rgba(236,239,255,0.16) var(--fill, 36%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; margin-top: -5.5px;
    border-radius: 50%; border: none; background: #ffffff;
    box-shadow: 0 0 10px 2px rgba(169, 180, 255, 0.75);
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  input[type="range"]:hover::-webkit-slider-thumb,
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.35); }
  input[type="range"]::-moz-range-track { height: 1px; background: rgba(236,239,255,0.16); }
  input[type="range"]::-moz-range-progress { height: 1px; background: rgba(169,180,255,0.95); }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px 2px rgba(169, 180, 255, 0.75);
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  input[type="range"]:hover::-moz-range-thumb { transform: scale(1.35); }

  .seg {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    border: 1px solid var(--panel-line); border-radius: 3px; overflow: hidden;
  }
  .seg .pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
    background: rgba(169, 180, 255, 0.16);
    border: 1px solid rgba(169, 180, 255, 0.45);
    border-radius: 2px;
    transform: translateX(0);
    transition: transform 0.45s ease-out;
    pointer-events: none;
  }
  .seg.repelling .pill { transform: translateX(calc(100% + 1px)); }
  .seg button {
    position: relative; z-index: 1;
    background: none; border: none; cursor: pointer;
    padding: 9px 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--dim);
    transition: color 0.45s ease-out;
  }
  .seg button.on { color: #eef0ff; }

  .settle { animation: settle 1s cubic-bezier(0.22, 0.8, 0.3, 1) var(--d, 0s) backwards; }
  @keyframes settle {
    from { opacity: 0; transform: translateY(14px); filter: blur(7px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  @media (max-width: 640px) {
    .topbar { top: 16px; left: 16px; right: 16px; flex-direction: column; gap: 14px; }
    header { max-width: none; }
    #stamp { text-align: left; }
    .legend { display: none; }
    .panel { left: 16px; right: 16px; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .settle { animation: none; }
    .seg .pill, .seg button, input[type="range"]::-webkit-slider-thumb, input[type="range"]::-moz-range-thumb {
      transition: none;
    }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="topbar">
  <header class="settle" style="--d:.15s">
    <h1>Constellation</h1>
    <p class="sub">Field study no. 006 · a slow gravity</p>
  </header>
  <div id="stamp" class="settle" style="--d:.45s">
    <div>particles <b id="stP">0</b></div>
    <div>threads <b id="stT">0</b></div>
    <div>fps <b id="stF">0</b></div>
  </div>
</div>

<ul class="legend layer settle" style="--d:.75s">
  <li><span class="g g-dot"><i></i></span>Particle — a held light</li>
  <li><span class="g g-line"><i></i></span>Thread — proximity, fading</li>
  <li><span class="g g-ring"><i></i></span>Ripple — a released touch</li>
</ul>

<section class="panel layer settle" style="--d:1.05s" aria-label="Field controls">
  <div class="row">
    <label for="link">Connection distance</label>
    <output id="linkOut" for="link">120</output>
  </div>
  <input type="range" id="link" min="40" max="260" step="1" value="120" aria-label="Connection distance">
  <div class="row"><span class="cap">Field polarity</span></div>
  <div class="seg" id="seg" role="group" aria-label="Field polarity">
    <span class="pill"></span>
    <button type="button" id="bAttr" class="on" aria-pressed="true">Attract</button>
    <button type="button" id="bRepel" aria-pressed="false">Repel</button>
  </div>
</section>

<script>
(function () {
  'use strict';
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W = 1, H = 1, DPR = 1;

  var particles = [];
  var ripples = [];
  var rSeq = 0;
  var T = 120;                 // connection distance
  var repel = false;
  var mouse = { x: -9999, y: -9999, on: false };
  var threadCount = 0;

  var PERI = [169, 180, 255];

  /* ---------- sprites ---------- */
  function makeSprite(rgb) {
    var s = 128, c = document.createElement('canvas');
    c.width = s; c.height = s;
    var g = c.getContext('2d');
    var hal = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    var col = rgb[0] + ',' + rgb[1] + ',' + rgb[2];
    hal.addColorStop(0, 'rgba(' + col + ',0.55)');
    hal.addColorStop(0.42, 'rgba(' + col + ',0.10)');
    hal.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = hal;
    g.fillRect(0, 0, s, s);
    g.beginPath();
    g.arc(s / 2, s / 2, s / 24, 0, 6.2832);
    g.fillStyle = 'rgba(' + col + ',0.95)';
    g.fill();
    return c;
  }
  var SPRITES = [makeSprite([255, 255, 255]), makeSprite([169, 180, 255]), makeSprite([214, 221, 255])];

  /* ---------- particles ---------- */
  function targetCount() {
    return Math.max(90, Math.min(420, Math.round(W * H / 5200)));
  }
  function spawnParticle(x, y, vx, vy) {
    particles.push({
      x: x, y: y,
      vx: vx || 0, vy: vy || 0,
      r: 0.9 + Math.random() * 1.1,
      ph: Math.random() * 6.283,
      tw: 0.5 + Math.random() * 1.6,
      seed: Math.random() * 100,
      spr: (Math.random() * 3) | 0
    });
  }
  function seedField() {
    particles.length = 0;
    var n = targetCount();
    for (var i = 0; i < n; i++) {
      spawnParticle(Math.random() * W, Math.random() * H);
    }
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      p.vx = Math.cos(p.seed) * 6; p.vy = Math.sin(p.seed * 1.3) * 6;
    }
  }
  function trimField() {
    var n = targetCount();
    while (particles.length > n) particles.pop();
    while (particles.length < n) spawnParticle(Math.random() * W, Math.random() * H);
  }

  /* ---------- curl-noise-like flow ---------- */
  function flow(px, py, t, seed) {
    var a = Math.sin(px * 0.00155 + t * 0.06) +
            Math.cos(py * 0.00128 - t * 0.047) +
            0.6 * Math.sin((px + py) * 0.00074 + t * 0.031) +
            0.35 * Math.sin(px * 0.0038 - py * 0.0031 + t * 0.09 + seed);
    var ang = a * 1.9;
    var sp = 11 + 5 * Math.sin(t * 0.11 + seed * 2.4);
    return [Math.cos(ang) * sp, Math.sin(ang) * sp];
  }

  /* ---------- simulation ---------- */
  function step(dt, t) {
    var i, p;
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      if (!REDUCED) {
        var f = flow(p.x, p.y, t, p.seed);
        p.vx += (f[0] - p.vx) * Math.min(1, dt * 0.8);
        p.vy += (f[1] - p.vy) * Math.min(1, dt * 0.8);
      }
      if (mouse.on) {
        var dx = mouse.x - p.x, dy = mouse.y - p.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 220 && d > 1) {
          var q = 1 - d / 220;
          var sgn = repel ? -1 : 1;
          var a = sgn * q * q * 340 * dt;
          p.vx += dx / d * a;
          p.vy += dy / d * a;
        }
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (REDUCED) { p.vx *= Math.pow(0.2, dt); p.vy *= Math.pow(0.2, dt); }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20;
      if (p.y > H + 20) p.y = -20;
    }
    /* ripples */
    for (i = ripples.length - 1; i >= 0; i--) {
      var R = ripples[i];
      var age = t - R.born;
      if (age > 1.6) { ripples.splice(i, 1); continue; }
      var front = (age / 1.6) * 520;
      var band = 30;
      for (var k = 0; k < particles.length; k++) {
        var q = particles[k];
        if (R.hit[k]) continue;
        var dx = q.x - R.x, dy = q.y - R.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (Math.abs(d - front) < band && d > 1) {
          R.hit[k] = 1;
          var kick = 190 * (1 - age / 1.6);
          q.vx += dx / d * kick;
          q.vy += dy / d * kick;
        }
      }
    }
  }

  /* ---------- threads via spatial hash ---------- */
  var buckets = [];
  var BUCKETS = 10;

  function drawThreads() {
    for (var b = 0; b < BUCKETS; b++) buckets[b] = [];
    var cell = T;
    var cols = Math.max(1, Math.ceil(W / cell));
    var rows = Math.max(1, Math.ceil(H / cell));
    var grid = new Array(cols * rows);
    var i, j;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      var cx = Math.min(cols - 1, Math.max(0, (p.x / cell) | 0));
      var cy = Math.min(rows - 1, Math.max(0, (p.y / cell) | 0));
      var key = cy * cols + cx;
      (grid[key] || (grid[key] = [])).push(p);
      p._cx = cx; p._cy = cy;
    }
    for (i = 0; i < particles.length; i++) {
      var a = particles[i];
      for (var ox = 0; ox <= 1; ox++) {
        for (var oy = (ox === 0 ? 1 : -1); oy <= 1; oy++) {
          var nx = a._cx + ox, ny = a._cy + oy;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
          if (ox === 0 && oy < 1) continue;
          var list = grid[ny * cols + nx];
          if (!list) continue;
          for (j = 0; j < list.length; j++) {
            var c = list[j];
            if (c === a) continue;
            var dx = c.x - a.x, dy = c.y - a.y;
            var d2 = dx * dx + dy * dy;
            if (d2 >= T * T) continue;
            var d = Math.sqrt(d2);
            var w = 1 - d / T;
            w *= w;
            if (w < 0.02) continue;
            var bi = Math.min(BUCKETS - 1, (w * BUCKETS) | 0);
            buckets[bi].push(a.x, a.y, c.x, c.y);
          }
        }
      }
    }
    threadCount = 0;
    ctx.lineWidth = 0.8;
    for (var bb = 0; bb < BUCKETS; bb++) {
      var seg = buckets[bb];
      if (!seg.length) continue;
      var alpha = ((bb + 0.5) / BUCKETS) * 0.55;
      ctx.strokeStyle = 'rgba(' + PERI[0] + ',' + PERI[1] + ',' + PERI[2] + ',' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      for (j = 0; j < seg.length; j += 4) {
        ctx.moveTo(seg[j], seg[j + 1]);
        ctx.lineTo(seg[j + 2], seg[j + 3]);
      }
      ctx.stroke();
      threadCount += seg.length / 4;
    }
  }

  /* ---------- render ---------- */
  function render(t) {
    ctx.clearRect(0, 0, W, H);

    /* cursor halo */
    if (mouse.on) {
      var pulse = 82 + 9 * Math.sin(t * 2.1) + 4 * Math.sin(t * 3.7);
      var hg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, pulse);
      hg.addColorStop(0, 'rgba(169,180,255,0.10)');
      hg.addColorStop(0.55, 'rgba(169,180,255,0.045)');
      hg.addColorStop(1, 'rgba(169,180,255,0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, pulse, 0, 6.2832);
      ctx.fill();
    }

    drawThreads();

    /* particles */
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var tw = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * p.tw + p.ph));
      var s = p.r * 12;
      ctx.globalAlpha = tw;
      ctx.drawImage(SPRITES[p.spr], p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    /* ripples */
    for (var r = 0; r < ripples.length; r++) {
      var R = ripples[r];
      var age = t - R.born;
      if (age < 0 || age > 1.6) continue;
      var k = age / 1.6;
      var a0 = (1 - k) * (1 - k);
      var front = k * 520;
      ctx.lineWidth = 1.4 - k;
      ctx.strokeStyle = 'rgba(169,180,255,' + (a0 * 0.8).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(R.x, R.y, front, 0, 6.2832); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + (a0 * 0.8 * 0.4).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(R.x, R.y, front * 0.62, 0, 6.2832); ctx.stroke();
    }
  }

  /* ---------- loop ---------- */
  var stP = document.getElementById('stP'),
      stT = document.getElementById('stT'),
      stF = document.getElementById('stF');
  var last = 0, acc = 0, frames = 0;

  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) last = ts;
    var ms = Math.min(100, ts - last);
    last = ts;
    var t = ts / 1000;
    var dt = ms / 1000;
    step(dt, t);
    render(t);
    acc += ms; frames++;
    if (acc >= 500) {
      stP.textContent = particles.length;
      stT.textContent = threadCount;
      stF.textContent = Math.round(frames * 1000 / acc);
      acc = 0; frames = 0;
    }
  }

  /* ---------- events ---------- */
  function release(x, y, t) {
    ripples.push({ x: x, y: y, born: t || last / 1000, hit: {} });
    for (var i = 0; i < 4; i++) {
      var a = (i / 4) * 6.2832 + (Math.random() - 0.5) * 0.9;
      var v = 150 + Math.random() * 130;
      spawnParticle(x, y, Math.cos(a) * v, Math.sin(a) * v);
    }
  }
  window.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
  });
  window.addEventListener('pointerdown', function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
    release(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', function (e) {
    if (e.pointerType === 'touch') mouse.on = false;
  });
  window.addEventListener('pointerout', function (e) {
    if (!e.relatedTarget) mouse.on = false;
  });
  document.addEventListener('mouseleave', function () { mouse.on = false; });

  var link = document.getElementById('link');
  var linkOut = document.getElementById('linkOut');
  function syncSlider() {
    T = +link.value;
    linkOut.textContent = T;
    var pct = ((T - 40) / (260 - 40)) * 100;
    link.style.setProperty('--fill', pct + '%');
  }
  link.addEventListener('input', syncSlider);
  syncSlider();

  var seg = document.getElementById('seg');
  var bA = document.getElementById('bAttr'), bR = document.getElementById('bRepel');
  function setPolarity(r) {
    repel = r;
    seg.classList.toggle('repelling', r);
    bA.classList.toggle('on', !r); bR.classList.toggle('on', r);
    bA.setAttribute('aria-pressed', String(!r));
    bR.setAttribute('aria-pressed', String(r));
  }
  bA.addEventListener('click', function (e) { e.stopPropagation(); setPolarity(false); });
  bR.addEventListener('click', function (e) { e.stopPropagation(); setPolarity(true); });

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!particles.length) seedField();
    else trimField();
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
