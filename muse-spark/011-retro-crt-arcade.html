<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON DRIFT — Attract Mode 1987</title>
<style>
/* ============ NEON DRIFT : CRT CABINET ============ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --grn: #39ff6a;
  --dim: #1f8a3c;
  --cyn: #2bd8ff;
  --mag: #ff3cac;
  --yel: #fff35c;
  --amb: #ffb347;
  --ink: #020603;
}
/* ---------- dark arcade room ---------- */
body {
  background:
    radial-gradient(120% 90% at 50% 110%, #1b1b22 0%, #0b0b10 55%, #050507 100%);
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Courier New', ui-monospace, Menlo, monospace;
  color: var(--grn);
  padding: 18px;
}
/* ---------- wooden / charcoal cabinet bezel ---------- */
.cabinet {
  background: linear-gradient(180deg, #2a2a2e, #141416 40%, #0b0b0d);
  border-radius: 26px;
  padding: 22px 22px 14px;
  max-width: 880px;
  width: 100%;
  box-shadow:
    0 40px 90px rgba(0, 0, 0, .8),
    inset 0 2px 0 rgba(255, 255, 255, .12),
    inset 0 -3px 0 rgba(0, 0, 0, .7);
  border: 1px solid #000;
}
/* ---------- pilot lamps + brand strip ---------- */
.lamps {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.lamp {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--amb);
  box-shadow: 0 0 12px 3px rgba(255, 179, 71, .8);
  animation: pulse 1.6s infinite alternate;
}
@keyframes pulse {
  to {
    opacity: .45;
    box-shadow: 0 0 4px 1px rgba(255, 179, 71, .4);
  }
}
.brand {
  font-size: 10px;
  letter-spacing: .28em;
  color: #8a8a90;
}
/* ---------- CRT screen tube ---------- */
.screen {
  position: relative;
  background: var(--ink);
  border-radius: 34px / 44px;
  overflow: hidden;
  border: 6px solid #000;
  box-shadow:
    inset 0 0 80px #000,
    inset 0 0 180px rgba(0, 0, 0, .9);
  min-height: 560px;
}
.screen-inner {
  position: relative;
  z-index: 3;
  padding: 26px 26px 20px;
  text-align: center;
  animation: flick 4s steps(2) infinite;
}
@keyframes flick {
  0%, 94% { opacity: 1; }
  95% { opacity: .86; }
  96% { opacity: 1; }
  98% { opacity: .92; }
  100% { opacity: 1; }
}
/* ---------- CRT overlays ---------- */
.scan {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, .32) 0 1px,
    transparent 1px 4px
  );
}
.grille {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  opacity: .16;
  background: repeating-linear-gradient(
    90deg,
    #f00 0 1px,
    #0f0 1px 2px,
    #00f 2px 3px,
    transparent 3px 4px
  );
}
.vig {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 45%,
    rgba(0, 0, 0, .55) 82%,
    rgba(0, 0, 0, .9) 100%
  );
}
.roll {
  position: absolute;
  left: 0;
  right: 0;
  height: 90px;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    transparent,
    rgba(180, 255, 200, .10),
    transparent
  );
  animation: roll 7s linear infinite;
}
@keyframes roll {
  from { top: -90px; }
  to { top: 100%; }
}
.sheen {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    transparent 40%,
    rgba(255, 255, 255, .07) 46%,
    transparent 55%
  );
}
/* ---------- pixel logo (box-shadow glyphs) ---------- */
.logo {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 6px 0 2px;
  flex-wrap: wrap;
  min-height: 30px;
}
.glyph {
  position: relative;
  animation: hue 6s linear infinite;
}
@keyframes hue {
  to { filter: hue-rotate(360deg); }
}
.tag {
  color: var(--cyn);
  font-size: 12px;
  letter-spacing: .3em;
  margin: 6px 0 16px;
  text-shadow: 0 0 8px var(--cyn);
}
/* ---------- two-column menu / scores ---------- */
.panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  text-align: left;
}
.box {
  border: 1px solid var(--dim);
  padding: 12px 14px;
  min-height: 224px;
  box-shadow:
    0 0 14px rgba(57, 255, 106, .15),
    inset 0 0 24px rgba(57, 255, 106, .06);
  background: rgba(2, 10, 4, .6);
}
.box h3 {
  color: var(--mag);
  font-size: 12px;
  letter-spacing: .22em;
  margin-bottom: 10px;
  text-shadow: 0 0 8px var(--mag);
}
.opt {
  padding: 7px 8px;
  color: var(--dim);
  cursor: pointer;
  font-size: 14px;
  letter-spacing: .06em;
}
.opt.sel {
  color: var(--grn);
  transform: translateX(8px);
  text-shadow: 0 0 10px var(--grn);
}
.opt.sel::before {
  content: '▶ ';
  color: var(--mag);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
.opt.flash {
  background: var(--grn);
  color: #000;
}
/* ---------- hi-score table ---------- */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
td {
  padding: 5px 4px;
  font-variant-numeric: tabular-nums;
}
td.i {
  color: var(--amb);
}
td.s {
  color: var(--cyn);
  text-align: right;
  text-shadow: 0 0 8px var(--cyn);
}
#rankLabel {
  color: var(--mag);
  font-size: 11px;
  letter-spacing: .2em;
  margin-top: 8px;
}
.slide {
  animation: slide .4s steps(4);
}
@keyframes slide {
  from {
    transform: translateX(30px);
    opacity: 0;
  }
}
/* ---------- footer : coin / credits ---------- */
.footer {
  margin-top: 14px;
  text-align: center;
}
#coin {
  color: var(--yel);
  letter-spacing: .3em;
  font-size: 15px;
  cursor: pointer;
  background: none;
  border: 1px solid transparent;
  font: inherit;
  animation: blink 1.1s steps(2) infinite;
  text-shadow: 0 0 12px var(--yel);
  padding: 4px 10px;
}
#coin:hover {
  border-color: var(--yel);
}
#coin:focus-visible {
  outline: 2px solid var(--yel);
}
.credits {
  color: var(--amb);
  font-size: 13px;
  margin-top: 6px;
}
.copy {
  color: #3a5a44;
  font-size: 10px;
  margin-top: 6px;
  letter-spacing: .12em;
}
/* ---------- toast + game ---------- */
#toast {
  position: absolute;
  left: 50%;
  top: 44%;
  transform: translate(-50%, -50%);
  z-index: 9;
  color: var(--mag);
  font-size: 34px;
  letter-spacing: .2em;
  text-shadow: 0 0 18px var(--mag);
  display: none;
  white-space: nowrap;
}
#gameWrap {
  display: none;
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 10px;
}
canvas#game {
  width: 100%;
  max-width: 640px;
  height: 340px;
  background: rgba(2, 12, 5, .7);
  border: 1px solid var(--dim);
  touch-action: none;
}
.hud {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--cyn);
  padding: 6px 4px;
}
.badge {
  text-align: center;
  font-size: 10px;
  color: #777;
  letter-spacing: .14em;
  margin-top: 10px;
}
/* ---------- responsive ---------- */
@media (max-width: 640px) {
  .panel {
    grid-template-columns: 1fr;
  }
  .screen-inner {
    padding: 16px;
  }
  #toast {
    font-size: 24px;
  }
}
@media (min-width: 1400px) {
  .cabinet {
    max-width: 1000px;
  }
  canvas#game {
    max-width: 760px;
  }
}
/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .roll,
  .screen-inner,
  .lamp,
  #coin,
  .glyph {
    animation: none !important;
  }
  .opt.sel::before {
    animation: none !important;
  }
}
</style>
</head>
<body>
<div class="cabinet">
  <div class="lamps">
    <span class="lamp" aria-hidden="true"></span>
    <span class="brand">VOLTAGE WORKS · MODEL VW-25</span>
    <span class="lamp" aria-hidden="true"></span>
  </div>
  <div class="screen">
    <div class="vig"></div>
    <div class="scan"></div>
    <div class="grille"></div>
    <div class="roll" aria-hidden="true"></div>
    <div class="sheen"></div>
    <div id="toast" role="status"></div>
    <div class="screen-inner" id="attract">
      <div class="logo" id="logo" aria-label="NEON DRIFT"></div>
      <div class="tag">// ATTRACT MODE — 1987 //</div>
      <div class="panel">
        <div class="box">
          <h3>■ SELECT</h3>
          <div id="menu" role="menu"></div>
        </div>
        <div class="box">
          <h3>■ TODAY'S HI-SCORES</h3>
          <table id="scores" aria-live="polite"></table>
          <div id="rankLabel">RANK 1–5</div>
        </div>
      </div>
      <div class="footer">
        <button id="coin">INSERT COIN</button>
        <div class="credits">CREDIT <span id="cred">00</span> · PRESS C FOR COIN</div>
        <div class="copy">© 1987 VOLTAGE WORKS · HI-SCORE SAVED ON NVRAM</div>
      </div>
    </div>
    <div id="gameWrap">
      <div class="hud">
        <span>SCORE <b id="sc">0</b></span>
        <span>LIVES <b id="lv">◆◆◆</b></span>
        <span>STAGE <b id="st">1</b></span>
      </div>
      <canvas id="game" width="640" height="340" aria-label="Paddle breakout game"></canvas>
      <div class="copy">ARROWS / A·D / DRAG TO MOVE · ESC TO QUIT</div>
    </div>
  </div>
  <div class="badge">Voltage Works · Model VW-25 · Made in Osaka</div>
</div>
<script>
/* 5x5 bitmap font for the pixel logo */
const FONT = {
  N: [11111, 11011, 10101, 10001, 10001],
  E: [11111, 10000, 11110, 10000, 11111],
  O: [01110, 10001, 10001, 10001, 01110],
  D: [11110, 10001, 10001, 10001, 11110],
  R: [11110, 10001, 11110, 10100, 10010],
  I: [11111, 00100, 00100, 00100, 11111],
  F: [11111, 10000, 11110, 10000, 10000],
  T: [11111, 00100, 00100, 00100, 00100],
  ' ': [0, 0, 0, 0, 0]
};
const WORD = 'NEON DRIFT';
const COLS = ['#39ff6a', '#2bd8ff', '#ff3cac', '#fff35c', '#ffb347'];
/* build one box-shadow glyph per letter */
const logo = document.getElementById('logo');
[...WORD].forEach((ch, i) => {
  const g = document.createElement('div');
  g.className = 'glyph';
  const pat = FONT[ch] || FONT[' '];
  const shadows = [];
  pat.forEach((row, y) => {
    String(row).padStart(5, '0').split('').forEach((b, x) => {
      if (b === '1') shadows.push((x * 5) + 'px ' + (y * 5) + 'px 0 ' + COLS[i % COLS.length]);
    });
  });
  g.style.boxShadow = shadows.join(',');
  g.style.width = '2px';
  g.style.height = '2px';
  g.style.margin = '0 14px 16px 0';
  g.title = ch;
  logo.appendChild(g);
});
/* menu state */
const menuItems = ['1P START — PADDLE', 'VIEW RANKINGS', 'SHUFFLE TABLE', 'CREDITS'];
let sel = 0;
let credits = 0;
const menuEl = document.getElementById('menu');
function drawMenu() {
  menuEl.innerHTML = '';
  menuItems.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'opt' + (i === sel ? ' sel' : '');
    d.textContent = (i + 1) + '. ' + m;
    d.setAttribute('role', 'menuitem');
    d.addEventListener('mouseenter', () => { sel = i; drawMenu(); });
    d.addEventListener('click', () => activate(i));
    menuEl.appendChild(d);
  });
}
drawMenu();
/* hi-score pages rotate every 4s */
const allScores = [
  ['AAA', 9876500], ['NEO', 8761200], ['DRF', 7654300],
  ['CRT', 6543200], ['JOY', 5432100], ['PAC', 4321000],
  ['INV', 3210000], ['GAL', 2109000], ['MID', 1098000],
  ['POP', 987600], ['RET', 876500], ['80S', 765400],
  ['JOE', 654300], ['KIM', 543200], ['MAX', 100000]
];
let page = 0;
const scoresEl = document.getElementById('scores');
const rankLabel = document.getElementById('rankLabel');
function drawScores() {
  scoresEl.innerHTML = '';
  scoresEl.classList.remove('slide');
  void scoresEl.offsetWidth;
  scoresEl.classList.add('slide');
  for (let i = 0; i < 5; i++) {
    const k = (page * 5 + i) % allScores.length;
    const r = allScores[k];
    const tr = document.createElement('tr');
    const a = document.createElement('td');
    a.textContent = String(k + 1).padStart(2, '0');
    const b = document.createElement('td');
    b.className = 'i';
    b.textContent = r[0];
    const c = document.createElement('td');
    c.className = 's';
    c.textContent = String(r[1]).padStart(7, '0');
    tr.append(a, b, c);
    scoresEl.appendChild(tr);
  }
  rankLabel.textContent = 'RANK ' + (page * 5 + 1) + '–' + (page * 5 + 5);
}
drawScores();
setInterval(() => { page = (page + 1) % 3; drawScores(); }, 4000);
/* toast helper */
function toast(t, ms) {
  const e = document.getElementById('toast');
  e.textContent = t;
  e.style.display = 'block';
  clearTimeout(e._t);
  e._t = setTimeout(() => { e.style.display = 'none'; }, ms || 1200);
}
/* coin handling */
function addCredit() {
  credits = Math.min(99, credits + 1);
  document.getElementById('cred').textContent = String(credits).padStart(2, '0');
  toast('CREDIT ' + credits, 800);
}
document.getElementById('coin').addEventListener('click', addCredit);
/* menu flash feedback then action */
function flash(i, fn) {
  const rows = menuEl.children;
  rows[i].classList.add('flash');
  setTimeout(() => rows[i].classList.remove('flash'), 120);
  setTimeout(() => {
    rows[i].classList.add('flash');
    setTimeout(() => rows[i].classList.remove('flash'), 120);
  }, 220);
  setTimeout(fn, 480);
}
function activate(i) {
  flash(i, () => {
    if (i === 0) {
      if (credits < 1) { toast('NEED CREDIT', 1000); return; }
      credits--;
      document.getElementById('cred').textContent = String(credits).padStart(2, '0');
      startGame();
    } else if (i === 1) {
      page = (page + 1) % 3; drawScores(); toast('PAGE ' + (page + 1), 700);
    } else if (i === 2) {
      allScores.sort(() => Math.random() - .5); page = 0; drawScores(); toast('SHUFFLED', 800);
    } else {
      toast('MADE IN OSAKA', 1200);
    }
  });
}
/* keyboard menu nav */
document.addEventListener('keydown', (e) => {
  if (playing) return;
  if (e.key === 'ArrowUp') { sel = (sel + 3) % 4; drawMenu(); }
  if (e.key === 'ArrowDown') { sel = (sel + 1) % 4; drawMenu(); }
  if (e.key === 'Enter') activate(sel);
  if (e.key.toLowerCase() === 'c') addCredit();
  if (/^[1-4]$/.test(e.key)) activate(+e.key - 1);
});
/* ============ breakout game ============ */
let playing = false;
const keys = {};
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let paddle = { x: 270, w: 90 };
let ball = { x: 320, y: 280, vx: 2.4, vy: -3 };
let bricks = [];
let score = 0, lives = 3, stage = 1;
let trail = [];
function buildBricks() {
  bricks = [];
  const cols = ['#ff3cac', '#ffb347', '#2bd8ff'];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 8; c++) {
      bricks.push({ x: 40 + c * 70, y: 40 + r * 26, w: 62, h: 18, c: cols[r], on: true });
    }
  }
}
function startGame() {
  playing = true;
  document.getElementById('attract').style.display = 'none';
  document.getElementById('gameWrap').style.display = 'block';
  score = 0; lives = 3; stage = 1;
  paddle = { x: 270, w: 90 };
  ball = { x: 320, y: 280, vx: 2.4, vy: -3 };
  trail = [];
  buildBricks();
  toast('READY', 900);
  fit();
  requestAnimationFrame(loop);
}
function endGame() {
  playing = false;
  document.getElementById('gameWrap').style.display = 'none';
  document.getElementById('attract').style.display = 'block';
  toast('GAME OVER', 1400);
}
function fit() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = 640 * d;
  cv.height = 340 * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener('resize', () => { if (playing) fit(); });
document.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (playing && e.key === 'Escape') endGame();
});
document.addEventListener('keyup', (e) => { keys[e.key] = false; });
cv.addEventListener('pointermove', (e) => {
  if (!playing) return;
  const r = cv.getBoundingClientRect();
  paddle.x = Math.max(0, Math.min(640 - paddle.w, (e.clientX - r.left) / r.width * 640));
});
function loop() {
  if (!playing) return;
  if (keys.ArrowLeft || keys.a || keys.A) paddle.x = Math.max(0, paddle.x - 6);
  if (keys.ArrowRight || keys.d || keys.D) paddle.x = Math.min(640 - paddle.w, paddle.x + 6);
  ball.x += ball.vx;
  ball.y += ball.vy;
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 14) trail.shift();
  if (ball.x < 4 || ball.x > 636) ball.vx *= -1;
  if (ball.y < 4) ball.vy *= -1;
  if (ball.y > 306 && ball.vy > 0 && ball.x > paddle.x - 6 && ball.x < paddle.x + paddle.w + 6) {
    ball.vy *= -1.04;
    ball.vx += (ball.x - (paddle.x + paddle.w / 2)) / 40;
    score += 5;
  }
  bricks.forEach((b) => {
    if (b.on && ball.x > b.x - 5 && ball.x < b.x + b.w + 5 && ball.y > b.y - 5 && ball.y < b.y + b.h + 5) {
      b.on = false; ball.vy *= -1; score += 25;
    }
  });
  if (ball.y > 336) {
    lives--;
    if (lives <= 0) { endGame(); return; }
    toast('MISS', 800);
    ball = { x: 320, y: 260, vx: 2.4, vy: -3 };
  }
  if (bricks.every((b) => !b.on)) {
    stage++; toast('STAGE CLEAR', 1200); buildBricks();
    ball.vx *= 1.2; ball.vy *= 1.2;
  }
  document.getElementById('sc').textContent = score;
  document.getElementById('lv').textContent = '◆'.repeat(lives) + '◇'.repeat(3 - lives);
  document.getElementById('st').textContent = stage;
  ctx.clearRect(0, 0, 640, 340);
  ctx.strokeStyle = 'rgba(57,255,106,.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 640; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 340); ctx.stroke();
  }
  for (let y = 0; y < 340; y += 32) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(640, y); ctx.stroke();
  }
  bricks.forEach((b) => {
    if (!b.on) return;
    ctx.fillStyle = b.c;
    ctx.shadowColor = b.c;
    ctx.shadowBlur = 10;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });
  ctx.shadowBlur = 0;
  trail.forEach((t, i) => {
    ctx.fillStyle = 'rgba(57,255,106,' + (i / trail.length * .6) + ')';
    ctx.fillRect(t.x - 3, t.y - 3, 6, 6);
  });
  ctx.fillStyle = '#fff35c';
  ctx.shadowColor = '#fff35c';
  ctx.shadowBlur = 12;
  ctx.fillRect(ball.x - 5, ball.y - 5, 10, 10);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#39ff6a';
  ctx.shadowColor = '#39ff6a';
  ctx.shadowBlur = 14;
  ctx.fillRect(paddle.x, 318, paddle.w, 10);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
