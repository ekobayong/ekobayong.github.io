<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumi — Ink Drops in Still Water</title>
<style>
/* Sumi ink in water */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  background: #e7edf0;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  height: 100vh;
  overflow: hidden;
  cursor: crosshair;
}
#bg,
#ink {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#ink {
  mix-blend-mode: multiply;
}
.top {
  position: fixed;
  top: 16px;
  left: 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  z-index: 5;
  pointer-events: none;
}
.top h1 {
  font-family: Georgia, 'Iowan Old Style', Palatino, serif;
  font-weight: 400;
  font-size: clamp(22px, 2.6vw, 34px);
  color: #2a3440;
  line-height: 1;
}
.top small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #6a7a88;
  margin-top: 4px;
  font-family: system-ui, sans-serif;
}
.rule {
  width: 1px;
  height: 44px;
  background: linear-gradient(#2a3440, transparent);
  position: relative;
}
.rule::before {
  content: "";
  position: absolute;
  top: -4px;
  left: -3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dot, #1f2a6b);
}
.vert {
  writing-mode: vertical-rl;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: #6a7a88;
}
#hint {
  position: fixed;
  top: 45%;
  left: 0;
  right: 0;
  text-align: center;
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 20px;
  color: #4a5a68;
  z-index: 5;
  pointer-events: none;
  animation: breathe 3s ease-in-out infinite;
}
@keyframes breathe {
  50% { opacity: 0.3; }
}
#count {
  position: fixed;
  bottom: 18px;
  right: 18px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #4a5a68;
  z-index: 5;
  background: rgba(255, 255, 255, 0.6);
  padding: 4px 10px;
  border-radius: 10px;
}
#keys {
  position: fixed;
  bottom: 18px;
  left: 18px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: #4a5a68;
  z-index: 5;
  opacity: 0.7;
}
.pill {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(0, 0, 0, 0.1);
  border-radius: 30px;
  padding: 8px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 6;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 96vw;
  box-shadow: 0 12px 40px rgba(42, 52, 64, 0.18);
}
.sw {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow:
    inset -3px -4px 6px rgba(0, 0, 0, 0.35),
    inset 2px 3px 5px rgba(255, 255, 255, 0.4);
  padding: 0;
}
.sw:hover {
  transform: scale(1.12);
}
.sw.on {
  border-color: #222;
  outline: 2px solid #222;
  outline-offset: 2px;
}
.sw:focus-visible,
button.u:focus-visible,
.seg button:focus-visible {
  outline: 2px solid #157a7a;
  outline-offset: 2px;
}
button.u {
  background: none;
  border: 1px solid #4a5a68;
  color: #2a3440;
  padding: 7px 14px;
  border-radius: 18px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-family: inherit;
}
button.u:hover {
  background: #2a3440;
  color: #fff;
}
button.u.pulse {
  animation: pulse 1s infinite;
}
@keyframes pulse {
  50% { background: #2a3440; color: #fff; }
}
.seg {
  display: flex;
  background: rgba(0, 0, 0, 0.08);
  border-radius: 16px;
  padding: 2px;
}
.seg button {
  border: none;
  background: none;
  padding: 6px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  color: #2a3440;
}
.seg button.on {
  background: #2a3440;
  color: #fff;
}
@media (max-width: 640px) {
  #keys {
    display: none;
  }
  .vert {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  #hint {
    animation: none;
  }
  button.u.pulse {
    animation: none;
  }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="ink"></canvas>
<div class="top">
  <div>
    <h1>Sumi</h1>
    <small>ink drops in water</small>
  </div>
  <div class="rule" id="rule"></div>
  <div class="vert">&#22647; &middot; still water &middot; slow breath</div>
</div>
<div id="hint">touch the water</div>
<div id="count">0 drops</div>
<div id="keys">1&ndash;5 ink &middot; P paper &middot; D drain</div>
<div class="pill" id="pill" role="toolbar" aria-label="Ink controls">
  <button class="sw on" data-c="#1f2a6b" style="background:#1f2a6b" title="Indigo (1)" aria-label="Indigo ink"></button>
  <button class="sw" data-c="#c8402a" style="background:#c8402a" title="Vermilion (2)" aria-label="Vermilion ink"></button>
  <button class="sw" data-c="#6b4a2b" style="background:#6b4a2b" title="Sepia (3)" aria-label="Sepia ink"></button>
  <button class="sw" data-c="#14141a" style="background:#14141a" title="Black (4)" aria-label="Black ink"></button>
  <button class="sw" data-c="#157a7a" style="background:#157a7a" title="Teal (5)" aria-label="Teal ink"></button>
  <div class="seg" id="med" role="group" aria-label="Medium">
    <button class="on" data-m="water">Water</button>
    <button data-m="paper">Paper</button>
  </div>
  <button class="u" id="drain">Drain</button>
</div>
<script>
(function () {
  'use strict';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bg = document.getElementById('bg');
  var ink = document.getElementById('ink');
  var bx = bg.getContext('2d');
  var ix = ink.getContext('2d');
  var W = 0, H = 0;
  var parts = [];
  var inkCol = '#1f2a6b';
  var medium = 'water';
  var drops = 0;
  var draining = false;
  var lastChain = 0;
  var mouseDown = false;
  var mx = 0, my = 0;

  function dpr() {
    return Math.min(window.devicePixelRatio || 1, 2);
  }

  function size() {
    var d = dpr();
    W = window.innerWidth;
    H = window.innerHeight;
    bg.width = W * d;
    bg.height = H * d;
    ink.width = W * d;
    ink.height = H * d;
    bx.setTransform(d, 0, 0, d, 0, 0);
    ix.setTransform(d, 0, 0, d, 0, 0);
    paintBG();
  }

  // Water: cool radial wash + caustic ellipses.
  // Paper: fibrous cream + mottling.
  function paintBG() {
    if (medium === 'water') {
      document.body.style.background = '#e7edf0';
      var g = bx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.hypot(W, H) / 1.4);
      g.addColorStop(0, '#f1f5f6');
      g.addColorStop(0.6, '#e3eaee');
      g.addColorStop(1, '#cfd9df');
      bx.fillStyle = g;
      bx.fillRect(0, 0, W, H);
      bx.strokeStyle = 'rgba(255,255,255,.35)';
      bx.lineWidth = 1;
      for (var i = 0; i < 40; i++) {
        bx.globalAlpha = 0.06;
        bx.beginPath();
        bx.ellipse(
          Math.random() * W, Math.random() * H,
          30 + Math.random() * 80, 10 + Math.random() * 24,
          Math.random() * 3, 0, 7
        );
        bx.stroke();
      }
      bx.globalAlpha = 1;
    } else {
      document.body.style.background = '#f3ead8';
      bx.fillStyle = '#f3ead8';
      bx.fillRect(0, 0, W, H);
      for (var j = 0; j < 2500; j++) {
        bx.fillStyle = Math.random() > 0.5
          ? 'rgba(120,95,60,.12)'
          : 'rgba(255,255,255,.35)';
        bx.fillRect(Math.random() * W, Math.random() * H, 3 + Math.random() * 5, 1);
      }
      for (var k = 0; k < 60; k++) {
        var cx = Math.random() * W, cy = Math.random() * H;
        var m = bx.createRadialGradient(cx, cy, 0, cx, cy, 60);
        m.addColorStop(0, 'rgba(180,150,100,.08)');
        m.addColorStop(1, 'transparent');
        bx.fillStyle = m;
        bx.fillRect(0, 0, W, H);
      }
    }
  }

  // Pre-baked soft sprites per ink + medium.
  var cache = {};
  function sprite(col, hard) {
    var cv = document.createElement('canvas');
    cv.width = 64;
    cv.height = 64;
    var ctx = cv.getContext('2d');
    var gr = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
    gr.addColorStop(0, col);
    gr.addColorStop(hard ? 0.55 : 0.3, col + '88');
    gr.addColorStop(1, col + '00');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, 64, 64);
    return cv;
  }
  function spr(col) {
    var k = col + medium;
    if (!cache[k]) { cache[k] = sprite(col, medium === 'water'); }
    return cache[k];
  }

  // Cheap pseudo-curl field from layered sines.
  function noise(x, y, t) {
    return Math.sin(x / 42 + t) * Math.cos(y / 42 - t * 0.7)
      + Math.sin(x / 240 - t * 0.3) * Math.cos(y / 240 + t * 0.2);
  }

  function drop(px, py) {
    document.getElementById('hint').style.display = 'none';
    drops++;
    document.getElementById('count').textContent = drops + ' drops';
    var area = W * H / 1e6 + 0.6;
    var n = Math.floor((380 + Math.random() * 240) * area);
    var lo = medium === 'water' ? 30 : 14;
    var hi = medium === 'water' ? 120 : 40;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = lo + Math.random() * (hi - lo);
      parts.push({
        x: px + (Math.random() - 0.5) * 8,
        y: py + (Math.random() - 0.5) * 8,
        vx: Math.cos(a) * s / 60,
        vy: Math.sin(a) * s / 60,
        age: 0,
        life: 4 + Math.random() * 6,
        sz: 4 + Math.random() * 10,
        col: inkCol
      });
    }
    // Dense stamped core.
    ix.save();
    ix.globalCompositeOperation = 'multiply';
    for (var j = 0; j < 14; j++) {
      ix.globalAlpha = 0.5;
      ix.drawImage(
        spr(inkCol),
        px - 16 + Math.random() * 32 - 16,
        py - 16 + Math.random() * 32 - 16,
        32, 32
      );
    }
    ix.restore();
    ix.globalAlpha = 1;
  }

  window.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.pill')) { return; }
    mouseDown = true;
    mx = e.clientX;
    my = e.clientY;
    drop(mx, my);
    lastChain = performance.now();
  });
  window.addEventListener('pointermove', function (e) {
    mx = e.clientX;
    my = e.clientY;
    if (mouseDown && performance.now() - lastChain > 220) {
      drop(mx, my);
      lastChain = performance.now();
    }
  });
  window.addEventListener('pointerup', function () { mouseDown = false; });
  window.addEventListener('pointercancel', function () { mouseDown = false; });

  document.getElementById('pill').addEventListener('click', function (e) {
    var s = e.target.closest ? e.target.closest('.sw') : null;
    if (s) {
      inkCol = s.dataset.c;
      var all = document.querySelectorAll('.sw');
      for (var i = 0; i < all.length; i++) {
        all[i].classList.toggle('on', all[i] === s);
      }
      document.getElementById('rule').style.setProperty('--dot', inkCol);
      return;
    }
    var m = e.target.dataset ? e.target.dataset.m : null;
    if (m) {
      medium = m;
      var btns = document.querySelectorAll('#med button');
      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.toggle('on', btns[j] === e.target);
      }
      paintBG();
      return;
    }
    if (e.target.id === 'drain') { startDrain(); }
  });

  function startDrain() {
    if (draining) { return; }
    draining = true;
    var b = document.getElementById('drain');
    b.classList.add('pulse');
    b.textContent = 'Draining\u2026';
    var f = 0;
    var iv = setInterval(function () {
      f++;
      ix.save();
      ix.globalCompositeOperation = 'destination-out';
      ix.fillStyle = 'rgba(0,0,0,0.018)';
      ix.fillRect(0, 0, W, H);
      ix.restore();
      if (f > 380 || (parts.length === 0 && f > 100)) {
        clearInterval(iv);
        ix.clearRect(0, 0, W, H);
        parts = [];
        draining = false;
        b.classList.remove('pulse');
        b.textContent = 'Drain';
      }
    }, reduced ? 8 : 16);
  }

  window.addEventListener('keydown', function (e) {
    var cols = ['#1f2a6b', '#c8402a', '#6b4a2b', '#14141a', '#157a7a'];
    if (e.key >= '1' && e.key <= '5') {
      inkCol = cols[parseInt(e.key, 10) - 1];
      var all = document.querySelectorAll('.sw');
      for (var i = 0; i < all.length; i++) {
        all[i].classList.toggle('on', i === parseInt(e.key, 10) - 1);
      }
      document.getElementById('rule').style.setProperty('--dot', inkCol);
    }
    if (e.key === 'd' || e.key === 'D') { startDrain(); }
    if (e.key === 'p' || e.key === 'P') {
      var sel = medium === 'water' ? '[data-m="paper"]' : '[data-m="water"]';
      document.querySelector(sel).click();
    }
  });

  var t = 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    if (draining) { return; }
    // Slow self-swirl of the whole ink body (water only).
    if (medium === 'water' && !reduced) {
      ix.save();
      ix.globalCompositeOperation = 'copy';
      ix.translate(W / 2, H / 2);
      ix.rotate(0.0002);
      ix.scale(1.0004, 1.0004);
      ix.translate(-W / 2 + Math.sin(t) * 0.4, -H / 2);
      ix.drawImage(ink, 0, 0, W, H);
      ix.restore();
      ix.setTransform(dpr(), 0, 0, dpr(), 0, 0);
    }
    ix.save();
    ix.globalCompositeOperation = 'multiply';
    var fr = medium === 'water' ? 0.965 : 0.9;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.age += dt;
      var e = 2.5;
      var dx = (noise(p.x + e, p.y, t) - noise(p.x - e, p.y, t)) / (2 * e) * 30 * dt;
      var dy = (noise(p.x, p.y + e, t) - noise(p.x, p.y - e, t)) / (2 * e) * 30 * dt;
      var ang = Math.atan2(p.y - H / 2, p.x - W / 2) + 1.57;
      p.vx = (p.vx + dx) * fr + Math.cos(ang) * 2 * dt;
      p.vy = (p.vy + dy) * fr + Math.sin(ang) * 2 * dt;
      p.x += p.vx;
      p.y += p.vy;
      var k = p.age / p.life;
      if (k >= 1) { continue; }
      var a = (medium === 'water' ? 0.07 : 0.045) * (1 - k);
      var sz = p.sz * (1 + k * 2);
      ix.globalAlpha = Math.max(0, a);
      ix.drawImage(spr(p.col), p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ix.restore();
    ix.globalAlpha = 1;
    parts = parts.filter(function (p) { return p.age < p.life; });
  }

  size();
  window.addEventListener('resize', size);
  document.getElementById('rule').style.setProperty('--dot', inkCol);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
