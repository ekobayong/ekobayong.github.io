<!-- PROMPT-BEGIN 100-organic-wave-lab.html | 100. Organic Wave Lab
Original generation prompt (from prompt.md):

Build a full-viewport, self-contained HTML instrument for composing layered organic waveforms — the finale piece of a collection, so it must feel expansive, polished and calm. The whole window is a canvas on which up to six wave layers are drawn as smooth filled paths stacked from back to front. Each layer has amplitude, frequency, phase, speed, baseline (vertical position as a percentage of the viewport), colour and visibility. A layer's surface is a sum of three sines — the fundamental, a 2.17× partial at 38% amplitude and a 4.3× partial at 16% — so the shapes read as dunes, aurora curtains or water rather than textbook sinusoids. Paths are traced with quadratic mid-point smoothing at ~220 samples per width, closed to the bottom edge, and filled with a vertical gradient that either fades the colour to transparent ("fade" presets) or darkens it to 55% ("shade" presets); a hairline white crest highlight at 22–28% opacity runs along each surface. Layers composite with a preset-specific blend mode: normal, screen, multiply or lighter (additive).

Presets, each defining a two-stop background gradient, blend mode, gradient style, panel ink colour and five or six layers: Dunes (sand #f2e4cf → #c9a27a background, normal blending, shaded fills in #e9cfa8, #d4a86f, #b7804a, #8a5a33, #5b3a22, dark ink UI); Aurora (near-black #03050f → #0b1b2b, screen, fading fills in #36f2b5, #3ac8ff, #a86cff, #ff6ad5, #1ef0d8); Tide (pale #dfeaf1 → #7fa4bd, multiply, shaded blues #bcd8e6 → #123a52, dark ink); Silk (#1a1520 → #3a2740, screen, pastel #f7c9d8, #c9b8f5, #9fd6f0, #f6e3b4, #e9a5c9); Nebula (#050208 → #150a26, lighter, six layers in #5a1a8c, #c026a6, #ff4f7a, #3b3cff, #ffb26a, #22e0ff). A soft radial light in the upper left and a faint vignette add depth behind the waves.

A "Harmony" toggle locks every layer's frequency to a shared fundamental multiplied by just-intonation ratios (1, 3/2, 2, 5/4, 5/3, 5/2) and exposes a Fundamental slider, disabling per-layer frequency; a "Flow" toggle (and the space bar) pauses time. Dragging anywhere on the canvas bends the waves locally: each pointer movement adds a Gaussian bump (σx 110px, σy 160px) whose strength follows the vertical drag delta and which decays over roughly a second, affecting layers in proportion to how close their baseline is to the pointer. "Export SVG" serialises the current frame — background gradient, per-layer gradient defs, quadratic paths and mix-blend-mode — and downloads it as an .svg via a Blob URL.

The side panel is a tall glass column: rgba(14,16,24,.42) with 18px backdrop blur, a 1px hairline border, 18px radius, and a deep soft shadow; on light presets it flips to warm frosted white with dark ink. Typography is a refined thin sans ('Helvetica Neue', 'Avenir Next', Segoe UI, weight 200–300) with small-caps letter-spaced labels; the title "Organic Wave Lab" sits top-left at weight 200 with "Wave" in warm accent #f0c98a. The panel contains preset pills (aria-pressed), the two toggles, a layer list of reorderable chips (grip glyph, glowing colour swatch, name such as Crest / Swell / Drift / Undertow / Haze / Bed, monospace ƒ and amplitude readout, visibility and delete icon buttons) that can be dragged to reorder or moved with Alt+Arrow keys, a control block for the selected layer (Amplitude, Frequency, Phase in π units, Speed, Baseline percentage, colour picker with hex readout), an add-layer button capped at six with a wry toast, plus "Surprise me" (randomises colours and parameters into a balanced stack) and "Export SVG". A round floating button and the H key hide the panel to admire the full composition; a pill toast confirms actions. Under 720px the panel becomes a bottom sheet. The canvas is devicePixelRatio-aware (capped at 2) and resizes live; prefers-reduced-motion freezes the flow and removes UI transitions.
PROMPT-END -->

<body>
<canvas id="sea"></canvas>
<div class="title">Organic <b>Wave</b> Lab<small>Finale · six layers · drag to bend</small></div>
<aside class="panel" id="panel">
  <h4>Presets</h4>
  <div class="pills" id="presets"></div>
  <div class="togs">
    <button id="tHarm"><span>Harmony off</span></button>
    <button id="tFlow" class="on"><span>Flow on</span></button>
  </div>
  <h4>Layers · drag to reorder</h4>
  <div id="layers"></div>

</aside>
<button id="hide" title="Hide panel (H)">◐</button>
<div id="toast"></div>
<script>
var cv = document.getElementById('sea');
var ctx = cv.getContext('2d');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var PRESETS = {
  Dunes: { bg: ['#f2e4cf', '#c9a27a'], blend: 'source-over', style: 'shade', light: 1, layers: [['#e9cfa8', 60, .9, 0], ['#d4a86f', 72, .7, .8], ['#b7804a', 55, 1.1, 2], ['#8a5a33', 46, 1.4, 4], ['#5b3a22', 38, 1.8, 1]] },
  Aurora: { bg: ['#03050f', '#0b1b2b'], blend: 'screen', style: 'fade', light: 0, layers: [['#36f2b5', 70, 1, 0], ['#3ac8ff', 60, 1.4, 2], ['#a86cff', 52, 2, 4], ['#ff6ad5', 44, 2.6, 1], ['#1ef0d8', 36, 3.2, 3]] },
  Tide: { bg: ['#dfeaf1', '#7fa4bd'], blend: 'multiply', style: 'shade', light: 1, layers: [['#bcd8e6', 58, .8, 0], ['#7fa9c2', 50, 1.2, 2], ['#3d6b8a', 42, 1.6, 4], ['#123a52', 34, 2.1, 1]] },
  Silk: { bg: ['#1a1520', '#3a2740'], blend: 'screen', style: 'fade', light: 0, layers: [['#f7c9d8', 62, .9, 0], ['#c9b8f5', 54, 1.3, 2], ['#9fd6f0', 46, 1.8, 4], ['#f6e3b4', 38, 2.4, 1], ['#e9a5c9', 30, 3, 3]] },
  Nebula: { bg: ['#050208', '#150a26'], blend: 'lighter', style: 'fade', light: 0, layers: [['#5a1a8c', 60, 1, 0], ['#c026a6', 60, 1.5, 1], ['#ff4f7a', 52, 2, 2], ['#3b3cff', 48, 2.5, 3], ['#ffb26a', 40, 3, 4], ['#22e0ff', 34, 3.6, 5]] }
};
var NAMES = ['Crest', 'Swell', 'Drift', 'Undertow', 'Haze', 'Bed'];
var RATIOS = [1, 1.5, 2, 1.25, 1.667, 2.5];
var S = { preset: 'Aurora', harmony: false, flow: !reduced, fund: .9, layers: [], sel: 0, bumps: [] };
var T = 0;
function loadPreset(n) {
  S.preset = n;
  var p = PRESETS[n];
  document.body.classList.toggle('light', !!p.light);
  S.layers = p.layers.map(function (l, i) {
    return {
      name: NAMES[i] || ('Layer' + (i + 1)),
      color: l[0], amp: l[1], freq: l[2], phase: l[3],
      speed: .4 + Math.random() * .6,
      base: [.35, .45, .55, .65, .75, .85][i] || .6,
      vis: true
    };
  });
  S.sel = 0;
  renderPanel();
}
function freqOf(L) {
  if (!S.harmony) return L.freq;
  var idx = S.layers.indexOf(L) % RATIOS.length;
  return S.fund * RATIOS[idx];
}
function yOf(L, x, W, H, t) {
  var bump = 0, i;
  for (i = 0; i < S.bumps.length; i++) {
    var o = S.bumps[i];
    var dx = x - o.x, dy = (L.base * H) - o.y;
    bump += o.s * Math.exp(-(dx * dx) / (2 * 110 * 110) - (dy * dy) / (2 * 160 * 160));
  }
  var f = freqOf(L);
  var ph = L.phase + t * L.speed;
  var u = x / W * Math.PI * 2 * f;
  var w = Math.sin(u + ph) * L.amp + Math.sin(u * 2.17 + ph * 1.3) * L.amp * .38 + Math.sin(u * 4.3 + ph * 2.1) * L.amp * .16;
  return L.base * H - w * H / 300 + bump;
}
function shade(hex) {
  var n = parseInt(hex.slice(1), 16);
  var r = ((n >> 16) * .45) | 0, g = (((n >> 8) & 255) * .45) | 0, b = ((n & 255) * .45) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function draw() {
  var d = Math.min(window.devicePixelRatio || 1, 2);
  var W = window.innerWidth, H = window.innerHeight;
  if (cv.width !== ((W * d) | 0)) { cv.width = W * d; cv.height = H * d; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  var p = PRESETS[S.preset];
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, p.bg[0]);
  bg.addColorStop(1, p.bg[1]);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  var gl = ctx.createRadialGradient(W * .2, H * .15, 0, W * .2, H * .15, W * .6);
  gl.addColorStop(0, 'rgba(255,255,255,.14)');
  gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, W, H);
  if (S.flow && !reduced) T += .016;
  var i;
  for (i = 0; i < S.bumps.length; i++) S.bumps[i].s *= .985;
  S.bumps = S.bumps.filter(function (b) { return Math.abs(b.s) > 1; });
  ctx.globalCompositeOperation = p.blend;
  var rev = S.layers.slice().reverse();
  rev.forEach(function (L) {
    if (!L.vis) return;
    var N = 220, pts = [], k;
    for (k = 0; k <= N; k++) {
      var X = k / N * W;
      pts.push([X, yOf(L, X, W, H, T)]);
    }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (k = 1; k < pts.length - 1; k++) {
      var mx = (pts[k][0] + pts[k + 1][0]) / 2;
      var my = (pts[k][1] + pts[k + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    var fg = ctx.createLinearGradient(0, 0, 0, H);
    if (p.style === 'fade') {
      fg.addColorStop(0, L.color);
      fg.addColorStop(1, L.color + '00');
    } else {
      fg.addColorStop(0, L.color);
      fg.addColorStop(1, shade(L.color));
    }
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    pts.forEach(function (pt, idx) {
      if (idx) ctx.lineTo(pt[0], pt[1]); else ctx.moveTo(pt[0], pt[1]);
    });
    ctx.stroke();
  });
  ctx.globalCompositeOperation = 'source-over';
  var v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .9);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.3)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(draw);
}
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(t._x);
  t._x = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
function renderPanel() {
  var pr = document.getElementById('presets');
  pr.innerHTML = '';
  Object.keys(PRESETS).forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = k;
    b.setAttribute('aria-pressed', k === S.preset ? 'true' : 'false');
    b.addEventListener('click', function () {
      loadPreset(k);
      toast('Preset · ' + k);
    });
    pr.appendChild(b);
  });
  var L = document.getElementById('layers');
  L.innerHTML = '';
  S.layers.forEach(function (l, i) {
    var dd = document.createElement('div');
    dd.className = 'chip' + (i === S.sel ? ' sel' : '');
    dd.draggable = true;
    dd.innerHTML = '<span class="grip">⠿</span><span class="sw" style="background:' + l.color + ';color:' + l.color + '"></span><b>' + l.name + '</b><span style="font-family:monospace;opacity:.7">⌀' + (l.amp | 0) + '</span><span style="flex:1"></span><button title="visibility">' + (l.vis ? '◉' : '○') + '</button><button title="delete">×</button>';
    dd.addEventListener('click', function (e) {
      if (e.target.tagName === 'BUTTON') return;
      S.sel = i;
      renderPanel();
    });
    var btns = dd.querySelectorAll('button');
    btns[0].addEventListener('click', function () { l.vis = !l.vis; renderPanel(); });
    btns[1].addEventListener('click', function () { S.layers.splice(i, 1); S.sel = 0; renderPanel(); });
    dd.addEventListener('dragstart', function (e) { e.dataTransfer.setData('i', i); });
    dd.addEventListener('dragover', function (e) { e.preventDefault(); });
    dd.addEventListener('drop', function (e) {
      var a = +e.dataTransfer.getData('i');
      var mv = S.layers.splice(a, 1)[0];
      S.layers.splice(i, 0, mv);
      S.sel = i;
      renderPanel();
    });
    L.appendChild(dd);
  });
  var c = document.getElementById('ctl');
  var l = S.layers[S.sel];
  if (!l) { c.innerHTML = ''; return; }
  var dis = S.harmony ? 'disabled' : '';
  c.innerHTML = '<h4>' + l.name + ' · controls</h4>' +
    '<label>Amplitude <input type="range" min="5" max="120" value="' + l.amp + '" data-k="amp"><output>' + (l.amp | 0) + '</output></label>' +
    '<label>Frequency <input type="range" min="20" max="400" value="' + (l.freq * 100) + '" data-k="freq" ' + dis + '><output>' + l.freq.toFixed(2) + '</output></label>' +
    '<label>Phase ° <input type="range" min="0" max="628" value="' + (l.phase * 100) + '" data-k="phase"><output>' + Math.round(l.phase * 57.3) + '°</output></label>' +
    '<label>Speed <input type="range" min="0" max="200" value="' + (l.speed * 100) + '" data-k="speed"><output>' + l.speed.toFixed(2) + '</output></label>' +
    '<label>Baseline <input type="range" min="10" max="95" value="' + (l.base * 100) + '" data-k="base"><output>' + Math.round(l.base * 100) + '%</output></label>' +
    '<label>Colour <input type="color" value="' + l.color + '" data-k="color"><output>' + l.color + '</output></label>' +
    (S.harmony ? '<label>Fundamental <input type="range" min="30" max="200" value="' + (S.fund * 100) + '" data-k="fund"><output>' + S.fund.toFixed(2) + '</output></label>' : '');
  c.querySelectorAll('input').forEach(function (inp) {
    inp.addEventListener('input', function () {
      var k = inp.dataset.k, v = +inp.value;
      if (k === 'amp') l.amp = v;
      if (k === 'freq') l.freq = v / 100;
      if (k === 'phase') l.phase = v / 100;
      if (k === 'speed') l.speed = v / 100;
      if (k === 'base') l.base = v / 100;
      if (k === 'fund') S.fund = v / 100;
      if (k === 'color') l.color = inp.value;
      var out = inp.parentElement.querySelector('output');
      if (out) {
        if (k === 'amp') out.textContent = l.amp | 0;
        if (k === 'freq') out.textContent = l.freq.toFixed(2);
        if (k === 'phase') out.textContent = Math.round(l.phase * 57.3) + '°';
        if (k === 'speed') out.textContent = l.speed.toFixed(2);
        if (k === 'base') out.textContent = Math.round(l.base * 100) + '%';
        if (k === 'color') out.textContent = l.color;
        if (k === 'fund') out.textContent = S.fund.toFixed(2);
      }
    });
  });
}
document.getElementById('tHarm').addEventListener('click', function (e) {
  S.harmony = !S.harmony;
  e.currentTarget.querySelector('span').textContent = S.harmony ? 'Harmony on' : 'Harmony off';
  e.currentTarget.classList.toggle('on', S.harmony);
  renderPanel();
  toast(S.harmony ? 'Just intonation locked' : 'Free frequencies');
});
document.getElementById('tFlow').addEventListener('click', function (e) {
  S.flow = !S.flow;
  e.currentTarget.querySelector('span').textContent = S.flow ? 'Flow on' : 'Flow off';
  e.currentTarget.classList.toggle('on', S.flow);
});
document.getElementById('bAdd').addEventListener('click', function () {
  if (S.layers.length >= 6) { toast('Six is plenty — delete one first.'); return; }
  S.layers.push({
    name: NAMES[S.layers.length] || 'New',
    color: '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'),
    amp: 40 + Math.random() * 40, freq: .8 + Math.random() * 2,
    phase: Math.random() * 6, speed: .5, base: .4 + Math.random() * .4, vis: true
  });
  S.sel = S.layers.length - 1;
  renderPanel();
});
document.getElementById('bRnd').addEventListener('click', function () {
  S.layers.forEach(function (l) {
    l.color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    l.amp = 25 + Math.random() * 70;
    l.freq = .6 + Math.random() * 2.6;
    l.base = .3 + Math.random() * .55;
  });
  renderPanel();
  toast('Surprised.');
});
document.getElementById('bSvg').addEventListener('click', function () {
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + PRESETS[S.preset].bg[0] + '"/><stop offset="1" stop-color="' + PRESETS[S.preset].bg[1] + '"/></linearGradient></defs><rect width="1200" height="700" fill="url(#bg)"/>';
  S.layers.forEach(function (l) {
    if (!l.vis) return;
    var dd = 'M0,' + yOf(l, 0, 1200, 700, T).toFixed(1), x;
    for (x = 20; x <= 1200; x += 20) dd += ' L' + x + ',' + yOf(l, x, 1200, 700, T).toFixed(1);
    dd += ' L1200,700 L0,700 Z';
    s += '<path d="' + dd + '" fill="' + l.color + '" opacity=".8"/>';
  });
  s += '</svg>';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
  a.download = 'waves.svg';
  a.click();
  toast('SVG exported.');
});
var pd = false, py = 0;
cv.addEventListener('pointerdown', function (e) {
  pd = true; py = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', function (e) {
  if (!pd) return;
  var dy = e.clientY - py;
  py = e.clientY;
  S.bumps.push({ x: e.clientX, y: e.clientY, s: dy * 2.2 });
  if (S.bumps.length > 40) S.bumps.shift();
});
cv.addEventListener('pointerup', function () { pd = false; });
function toggleP() {
  var p = document.getElementById('panel');
  p.style.display = p.style.display === 'none' ? '' : 'none';
}
document.getElementById('hide').addEventListener('click', toggleP);
window.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('tFlow').click(); }
  if (e.key === 'h' || e.key === 'H') toggleP();
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    var d = e.key === 'ArrowUp' ? -1 : 1, j = S.sel + d;
    if (j >= 0 && j < S.layers.length) {
      var mv = S.layers.splice(S.sel, 1)[0];
      S.layers.splice(j, 0, mv);
      S.sel = j;
      renderPanel();
    }
  }
});
loadPreset('Aurora');
draw();
</script>
</body>
