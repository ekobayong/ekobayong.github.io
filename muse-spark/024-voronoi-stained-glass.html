<!-- PROMPT-BEGIN 024-voronoi-stained-glass.html | 024. Rose of Cells — Voronoi Stained-Glass Window
Original generation prompt (from prompt.md):

Build a single self-contained HTML page that renders a generative gothic stained-glass window from a Voronoi diagram, set into a dim stone wall and casting coloured light onto the floor. The page is a full-viewport grid (header, scene, footer) with overflow hidden. The wall is pure CSS: a stone gradient from #3a3531 through #2b2724 to #1d1a18, brick courses drawn with 220×92px repeating linear-gradient mortar lines (#17140f) offset every other row, a faint diagonal grain, a warm radial glow near the window, and a heavy radial vignette darkening the corners. The floor is a fixed 26vh band at the bottom (#14110f → #0d0b0a) with faint perspective flagstone lines; a second canvas sits on it, transformed with rotateX(62deg) scaleY(-1), blurred 22px, saturated, at 55% opacity with mix-blend-mode: screen, and receives a downscaled copy of the window each frame so the glass appears to spill colour onto the stone.

The window itself is a canvas sized to a 1:1.75 lancet proportion (max 640px wide) that fits the available space, with devicePixelRatio handling (capped at 2). The clip shape is an equilateral gothic arch: straight sides up to a springing line at 42% of the height, then two arcs of radius equal to the window width centred on the opposite springing points, meeting at a pointed apex. Seed points (26–70, scaled by area, with Poisson-like minimum spacing) are scattered inside the arch. Voronoi cells are computed by half-plane clipping: each cell starts as the bounding rectangle and is clipped by the perpendicular bisector against every other site (Sutherland–Hodgman against a line). Each cell is drawn as glass: a radial gradient from a tinted highlight (32% toward white) offset toward the site and up-left, through the base jewel colour, to a 55% darkened rim, suggesting varying glass thickness; faint white diagonal streaks clipped inside the pane at 9% alpha give the glass grain; a 6px round-joined lead line in #17130f surrounds every pane with a 1.2px pale highlight; the whole arch gets an 8px outer lead frame and a thin pale reveal line.

Three palettes: Chartres (cobalt and ultramarine blues #1b2f8f/#233fa8/#1a4fb5/#2b64c8, ruby reds #8f1626/#a91f30/#c0392b, gold #d8b25c, cream #e8d6a2, violet #4b2a7a, white #f1f0e8, teal #1d6e6b), Autumn (rust #a33d13/#c25a1c, ambers #d9931c/#e8b23a, oxblood #7a2a12, olives #6b6a1f/#8e8a2e, umber #4d2b1a, straw #e9c98a, #b3471a, #5b3a1e, #d97c2b) and Emerald (forest to sea greens #0b4a2a/#0f6b3c/#158a4a/#1e8f7a/#2ea78c/#116d5a/#3fbf9a, deep teal #0d3c3a/#0a2f26, gold #c9a44b/#e6d38a, ivory #f0ead2). Palette buttons at the bottom carry small dot swatches and recolour existing panes without changing geometry; Regenerate (or the R key) scatters new points. The glass is rendered once into an offscreen layer; every frame the main canvas composites that layer and then paints a slow diagonal sheet of warm light (rgba(255,250,235) at up to 26%) sweeping across over a 9-second period using soft-light and screen compositing, clipped to the arch. Clicking inside the arch adds a new site: the previous glass layer is snapshotted and the new pane grows from its centroid to full size over 620ms with cubic ease-out on top of it, after which the full diagram is redrawn. Typography is Georgia/Palatino serif with an uppercase, letter-spaced title "Rose of Cells" (accent gold #d7b36a), an italic subtitle, and small uppercase button labels. Respect prefers-reduced-motion by freezing the shimmer and skipping the growth animation.
PROMPT-END -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose of Cells — Voronoi Stained Glass</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
  font-family: Georgia, Palatino, serif;
  background: #2b2724;
  color: #e8d6a2;
}
.wall {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(600px 400px at 50% 30%, rgba(255, 220, 150, .14), transparent 70%),
    repeating-linear-gradient(0deg, #17140f 0 2px, transparent 2px 92px),
    repeating-linear-gradient(90deg, #17140f 0 2px, transparent 2px 220px),
    linear-gradient(#3a3531, #2b2724, #1d1a18);
}
.wall::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .015) 0 2px, transparent 2px 6px),
    radial-gradient(130% 110% at 50% 45%, transparent 55%, rgba(0, 0, 0, .65));
}
header {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 14px 12px 6px;
}
header h1 {
  font-size: 22px;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: #d7b36a;
  font-weight: 400;
  text-indent: .34em;
}
header p {
  font-style: italic;
  font-size: 13px;
  color: #b9a684;
  margin-top: 4px;
}
#scene {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 0;
}
#win {
  cursor: crosshair;
  filter: drop-shadow(0 18px 50px rgba(0, 0, 0, .7));
}
#floor {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 26vh;
  z-index: 1;
  background: linear-gradient(#14110f, #0d0b0a);
  border-top: 1px solid #000;
}
#floor::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 90px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 34px);
  transform: perspective(400px) rotateX(30deg);
  transform-origin: bottom;
}
#refl {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) rotateX(62deg) scaleY(-1);
  bottom: -6vh;
  z-index: 1;
  opacity: .55;
  filter: blur(22px) saturate(1.4);
  mix-blend-mode: screen;
  pointer-events: none;
  transform-origin: bottom;
}
footer {
  position: relative;
  z-index: 3;
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  padding: 12px;
  background: rgba(0, 0, 0, .45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
footer button {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  background: transparent;
  color: #d7b36a;
  border: 1px solid #6b5320;
  border-radius: 999px;
  padding: 9px 16px;
  cursor: pointer;
  display: flex;
  gap: 8px;
  align-items: center;
  transition: background .25s, color .25s;
}
footer button.on,
footer button:hover {
  background: #d7b36a;
  color: #1d1a18;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
#count {
  font-size: 12px;
  color: #8f7f5e;
  font-style: italic;
}
.dens {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #8f7f5e;
}
.dens input {
  accent-color: #d7b36a;
  width: 110px;
}
.tip {
  position: relative;
  z-index: 3;
  text-align: center;
  font-size: 11px;
  font-style: italic;
  color: #6f6350;
  padding-bottom: 6px;
  background: rgba(0, 0, 0, .45);
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
</head>
<body>
<div class="wall"></div>
<header>
  <h1>Rose of Cells</h1>
  <p>A Voronoi window in lead &amp; light — click the glass to set a new pane</p>
</header>
<div id="scene"><canvas id="win"></canvas></div>
<div id="floor"></div>
<canvas id="refl"></canvas>
<div class="tip">Each pane is half-plane clipped geometry · light sweeps every 9 seconds</div>
<footer>
  <button data-p="chartres" class="on"><span class="dot" style="background:#233fa8"></span>Chartres</button>
  <button data-p="autumn"><span class="dot" style="background:#c25a1c"></span>Autumn</button>
  <button data-p="emerald"><span class="dot" style="background:#158a4a"></span>Emerald</button>
  <button id="regen">Regenerate · R</button>
  <button id="save">Save PNG</button>
  <label class="dens">Panes <input type="range" id="dens" min="26" max="70" value="46"></label>
  <span id="count"></span>
</footer>
<script>
var PAL = {
  chartres: ['#1b2f8f', '#233fa8', '#1a4fb5', '#2b64c8', '#8f1626', '#a91f30', '#c0392b', '#d8b25c', '#e8d6a2', '#4b2a7a', '#f1f0e8', '#1d6e6b'],
  autumn: ['#a33d13', '#c25a1c', '#d9931c', '#e8b23a', '#7a2a12', '#6b6a1f', '#8e8a2e', '#4d2b1a', '#e9c98a', '#b3471a', '#5b3a1e', '#d97c2b'],
  emerald: ['#0b4a2a', '#0f6b3c', '#158a4a', '#1e8f7a', '#2ea78c', '#116d5a', '#3fbf9a', '#0d3c3a', '#0a2f26', '#c9a44b', '#e6d38a', '#f0ead2']
};
var pal = 'chartres';
var sites = [];
var colors = [];
var W = 420, H = 735;
var wantPanes = 46;
var win = document.getElementById('win');
var ctx = win.getContext('2d');
var refl = document.getElementById('refl');
var rctx = refl.getContext('2d');
var off = document.createElement('canvas');
var octx = off.getContext('2d');
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size() {
  var availH = window.innerHeight - 230;
  var availW = Math.min(640, window.innerWidth - 32);
  var h = Math.max(280, Math.min(availH, availW * 1.75));
  var w = h / 1.75;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = w;
  H = h;
  [win, off].forEach(function (c) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
  });
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  refl.width = Math.round(w / 2);
  refl.height = Math.round(h / 2);
  refl.style.width = w + 'px';
  refl.style.height = '26vh';
  scatter();
}
function inArch(x, y) {
  if (y < H * .42) return x > 8 && x < W - 8 && y > 4;
  var cy = H * .42;
  var dxl = x, dxr = W - x, dy = y - cy;
  var r = W;
  return (dxl * dxl + dy * dy <= r * r) && (dxr * dxr + dy * dy <= r * r) && y < H - 6;
}
function pick() {
  var arr = PAL[pal];
  return arr[Math.floor(Math.random() * arr.length)];
}
function scatter() {
  sites = [];
  colors = [];
  var area = W * H;
  var n = Math.max(26, Math.min(70, wantPanes || Math.round(area / 14000)));
  var guard = 0;
  while (sites.length < n && guard++ < 4000) {
    var x = 10 + Math.random() * (W - 20);
    var y = 6 + Math.random() * (H - 12);
    if (!inArch(x, y)) continue;
    var ok = true;
    for (var i = 0; i < sites.length; i++) {
      if (Math.hypot(sites[i].x - x, sites[i].y - y) > 26) continue;
      ok = false;
      break;
    }
    if (!ok) continue;
    sites.push({ x: x, y: y });
    colors.push(pick());
  }
  document.getElementById('count').textContent = sites.length + ' panes · ' + pal;
  renderGlass();
}
function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, Math.round(r * f)));
  g = Math.max(0, Math.min(255, Math.round(g * f)));
  b = Math.max(0, Math.min(255, Math.round(b * f)));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function cellPoly(idx) {
  var poly = [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H }];
  var a = sites[idx];
  for (var j = 0; j < sites.length; j++) {
    if (j === idx) continue;
    var b = sites[j];
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var nx = b.x - a.x, ny = b.y - a.y;
    var out = [];
    for (var k = 0; k < poly.length; k++) {
      var p = poly[k], q = poly[(k + 1) % poly.length];
      var dp = (p.x - mx) * nx + (p.y - my) * ny;
      var dq = (q.x - mx) * nx + (q.y - my) * ny;
      if (dp <= 0) out.push(p);
      if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
        var t = dp / (dp - dq);
        out.push({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
      }
    }
    poly = out;
    if (!poly.length) break;
  }
  return poly;
}
function trace(c, poly) {
  c.beginPath();
  c.moveTo(poly[0].x, poly[0].y);
  for (var k = 1; k < poly.length; k++) c.lineTo(poly[k].x, poly[k].y);
  c.closePath();
}
function clipArch(c) {
  c.beginPath();
  c.moveTo(8, H);
  c.lineTo(8, H * .42);
  var r = W - 16, cy = H * .42;
  c.arc(W - 8, cy, r, Math.PI, Math.PI * 1.5);
  c.arc(8, cy, r, Math.PI * 1.5, Math.PI * 2);
  c.lineTo(W - 8, H);
  c.closePath();
  c.clip();
}
function drawCell(c, poly, col, site) {
  if (poly.length < 3) return;
  c.save();
  trace(c, poly);
  c.clip();
  var g = c.createRadialGradient(site.x - 10, site.y - 14, 6, site.x, site.y, 120);
  g.addColorStop(0, shade(col, 1.5));
  g.addColorStop(.45, col);
  g.addColorStop(1, shade(col, .45));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,.09)';
  c.lineWidth = 5;
  for (var s = -H; s < W; s += 26) {
    c.beginPath();
    c.moveTo(s, 0);
    c.lineTo(s + H, H);
    c.stroke();
  }
  c.restore();
  c.save();
  trace(c, poly);
  c.strokeStyle = '#17130f';
  c.lineWidth = 6;
  c.lineJoin = 'round';
  c.stroke();
  c.strokeStyle = 'rgba(240,230,200,.5)';
  c.lineWidth = 1.2;
  c.stroke();
  c.restore();
}
function renderGlass() {
  octx.clearRect(0, 0, W, H);
  octx.save();
  clipArch(octx);
  octx.fillStyle = '#0a0806';
  octx.fillRect(0, 0, W, H);
  for (var i = 0; i < sites.length; i++) drawCell(octx, cellPoly(i), colors[i], sites[i]);
  octx.restore();
  octx.save();
  clipArch(octx);
  octx.strokeStyle = '#17130f';
  octx.lineWidth = 10;
  octx.stroke();
  octx.restore();
}
var grow = null, snap = null;
var t0 = performance.now();
win.addEventListener('click', function (e) {
  var r = win.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width * W;
  var y = (e.clientY - r.top) / r.height * H;
  if (!inArch(x, y)) return;
  snap = document.createElement('canvas');
  snap.width = off.width;
  snap.height = off.height;
  snap.getContext('2d').drawImage(off, 0, 0);
  sites.push({ x: x, y: y });
  colors.push(pick());
  grow = { i: sites.length - 1, t: 0 };
  if (reduced) {
    grow = null;
    snap = null;
    renderGlass();
  }
  document.getElementById('count').textContent = sites.length + ' panes · ' + pal;
});
function frame(t) {
  requestAnimationFrame(frame);
  var el = (t - t0) / 1000;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.clearRect(0, 0, W, H);
  if (snap && grow) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(snap, 0, 0, win.width, win.height);
    ctx.restore();
    ctx.save();
    ctx.scale(dpr, dpr);
    clipArch(ctx);
    grow.t = Math.min(1, grow.t + 1 / 60 / 0.62);
    var e = 1 - Math.pow(1 - grow.t, 3);
    var s = sites[grow.i];
    ctx.save();
    ctx.translate(s.x, s.y);
    var k = Math.max(.01, e);
    ctx.scale(k, k);
    ctx.translate(-s.x, -s.y);
    drawCell(ctx, cellPoly(grow.i), colors[grow.i], s);
    ctx.restore();
    ctx.restore();
    if (grow.t >= 1) {
      grow = null;
      snap = null;
      renderGlass();
    }
  } else {
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.drawImage(off, 0, 0, W, H);
    ctx.restore();
  }
  if (!reduced) {
    ctx.save();
    ctx.scale(dpr, dpr);
    clipArch(ctx);
    var ph = (el % 9) / 9;
    var x = W * (ph * 1.6 - .3);
    var gr = ctx.createLinearGradient(x - 90, 0, x + 90, H);
    gr.addColorStop(0, 'rgba(255,250,235,0)');
    gr.addColorStop(.5, 'rgba(255,250,235,.26)');
    gr.addColorStop(1, 'rgba(255,250,235,0)');
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = .4;
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  rctx.clearRect(0, 0, refl.width, refl.height);
  rctx.drawImage(win, 0, 0, refl.width, refl.height);
}
document.querySelectorAll('footer button[data-p]').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('footer button[data-p]').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    pal = b.dataset.p;
    colors = sites.map(function () { return pick(); });
    renderGlass();
    document.getElementById('count').textContent = sites.length + ' panes · ' + pal;
  });
});
document.getElementById('regen').addEventListener('click', function () { scatter(); });
document.getElementById('dens').addEventListener('input', function (e) {
  wantPanes = +e.target.value;
  scatter();
});
document.getElementById('save').addEventListener('click', function () {
  var a = document.createElement('a');
  a.download = 'rose-of-cells.png';
  a.href = win.toDataURL('image/png');
  a.click();
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'r' || e.key === 'R') scatter();
});
window.addEventListener('resize', size);
size();
requestAnimationFrame(frame);
</script>
</body>
</html>
