<html lang="en">
<head>
<meta charset="UTF-8">

<title>LUNAR WIND — Vaporwave Sunset</title>
<style>
:root{--grid-speed:4s;
--pink:#ff71ce;
--cyan:#01cdfe;
--mint:#05ffa1;
--violet:#b967ff;
--yellow:#fffb96}
*{margin:0;
padding:0;

html,body{height:100%;
overflow:hidden;
background:#12002a;
font-family:system-ui,sans-serif}
.scene{position:fixed;
inset:0;
perspective:520px;
perspective-origin:50% 40%;
overflow:hidden;
background:linear-gradient(#0a0020 0%,#2b0a5e 42%,#7a2a9e 60%,#ff71ce 64%,#12002a 66%,#12002a 100%)}
.stars{position:absolute;
inset:0 0 34% 0}
.star{position:absolute;
border-radius:50%;

@keyframes tw{to{opacity:.2}}
.haze{position:absolute;

right:0;
top:60%;
height:12%;

.sunglow{position:absolute;
left:50%;
top:20%;
width:min(46vmin,380px);
height:min(46vmin,380px);
transform:translate(-50%,-50%);

box-shadow:0 0 80px 30px rgba(255,113,206,.6),0 0 200px 80px rgba(255,251,150,.25);

.sun{position:absolute;
left:50%;
top:20%;
width:min(46vmin,380px);
height:min(46vmin,380px);
transform:translate(-50%,-50%);
border-radius:50%;
background:linear-gradient(#fffb96,#ffb347 40%,#ff71ce 70%,#b967ff);
-webkit-mask-image:linear-gradient(#000 52%,transparent 52%),linear-gradient(#000,#000);
-webkit-mask-composite:source-over;
mask-image:linear-gradient(#000 0 52%,transparent 52% 55%,#000 55% 63%,transparent 63% 67%,#000 67% 73.5%,transparent 73.5% 78.5%,#000 78.5% 83%,transparent 83% 89%,#000 89% 92%,transparent 92% 100%);
animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-50%,calc(-50% + 4vh))}}
.floor{position:absolute;
left:-100%;
top:66%;
width:300%;
height:130%;
transform-origin:top center;
transform:rotateX(72deg);
background:linear-gradient(transparent,#01cdfe 2px,transparent 3px) center/100% 100%,repeating-linear-gradient(90deg,rgba(1,205,254,.8) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(255,113,206,.85) 0 2px,transparent 2px 80px);

@keyframes grid{to{background-position:0 0,0 0,0 80px}}
.floor-fade{position:absolute;
left:0;
right:0;
top:66%;
bottom:0;
background:linear-gradient(rgba(255,113,206,.45),transparent 30%,rgba(10,0,32,.9) 95%)}
.checker{position:absolute;
left:50%;
bottom:-28vmin;
width:60vmin;
height:60vmin;
transform:translateX(-50%) rotateX(74deg);
background:repeating-conic-gradient(#b967ff 0 12%,transparent 12% 25%);
opacity:.5;
border-radius:50%;

mask-image:radial-gradient(#000 55%,transparent 72%);
animation:spin 40s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotateX(74deg) rotate(360deg)}}
.palm{position:absolute;
bottom:33%;
width:22vw;

.palm.left{left:-2vw}.palm.right{right:-2vw;
transform:scaleX(-1);
animation-delay:-3s}
@keyframes sway{to{transform:rotate(1.3deg)}}
.palm.right{animation-name:swayR}@keyframes swayR{from{transform:scaleX(-1) rotate(-1.3deg)}to{transform:scaleX(-1) rotate(1.3deg)}}
h1{position:absolute;
top:46%;
width:100%;
text-align:center;
font-family:Palatino,"Iowan Old Style",Georgia,serif;
font-weight:900;
font-size:clamp(30px,8.5vw,132px);
letter-spacing:.04em;
background:linear-gradient(#fff 0 30%,var(--cyan) 38%,#063a55 49%,#fff 51%,var(--pink) 62%,var(--violet));

filter:drop-shadow(4px 4px 0 #5b2a9e) drop-shadow(8px 8px 0 #2b0a5e) drop-shadow(0 0 22px rgba(1,205,254,.8));

.subt{position:absolute;
top:calc(46% + clamp(44px,9vw,140px));
width:100%;
text-align:center;
font-family:ui-monospace,monospace;
color:var(--mint);
letter-spacing:.5em;
text-shadow:0 0 12px var(--mint);
font-size:clamp(11px,2vw,18px)}
.cap{position:absolute;
top:18px;
right:18px;
font-family:ui-monospace,monospace;
color:#fff;
letter-spacing:.3em;
font-size:11px;
opacity:.8}
.bust{position:absolute;
left:62%;
top:28%;
width:110px;

animation:float 9s ease-in-out infinite alternate}

.window{position:absolute;
left:18px;
bottom:18px;
width:320px;
max-width:calc(100vw - 36px);
background:#c0c0c0;
border:2px solid;
border-color:#fff #404040 #404040 #fff;
box-shadow:1px 1px 0 #000,6px 6px 0 rgba(0,0,0,.35);
font-size:12px;
color:#000}
.tbar{background:linear-gradient(90deg,navy,blue);
color:#fff;
display:flex;
align-items:center;
gap:8px;
padding:4px 6px;
font-weight:700}
.tbar .ic{width:14px;
height:14px;
background:linear-gradient(135deg,var(--pink),var(--cyan))}
.tbar .btns{margin-left:auto;
display:flex;
gap:3px}.tbar .btns span{background:#c0c0c0;
color:#000;
border:2px solid;
border-color:#fff #404040 #404040 #fff;
padding:0 6px;
font-size:11px;
cursor:pointer}
.menu{display:flex;
gap:12px;
padding:4px 8px;
background:#c0c0c0}.menu u{text-decoration:underline}
.lcd{background:#000;
color:var(--mint);
font-family:ui-monospace,monospace;
padding:8px 10px;
margin:6px;
font-size:12px;
line-height:1.7}
.lcd b{color:var(--pink);
font-weight:400;
font-size:10px;
letter-spacing:.2em}
.prog{height:14px;
background:navy;
margin:6px;
position:relative;
overflow:hidden}.prog i{position:absolute;
inset:0;
width:0;
background:repeating-linear-gradient(90deg,var(--cyan) 0 8px,transparent 8px 10px)}
.ctl{display:flex;
gap:6px;
padding:6px}.ctl button{flex:1;
background:#c0c0c0;
border:2px solid;
border-color:#fff #404040 #404040 #fff;
padding:7px 0;
cursor:pointer;
font-weight:700}.ctl button.on{border-color:#404040 #fff #fff #404040}
.statusbar{display:flex;
border-top:1px solid #808080}.statusbar span{flex:1;
padding:3px 8px;
border-right:1px solid #808080}
@media(max-width:640px){.cap{display:none}.bust{width:64px;
left:70%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.floor{animation:none!important}}
</style>
</head>
<body>

<h1 id="title">ＬＵＮＡＲ　ＷＩＮＤ</h1><div class="subt">Ｓ Ｉ Ｄ Ｅ　Ｂ　·　１ ９ ９ ５</div>
<div class="cap">ＭＥＭＯＲＩＥＳ / ＯＦ　ＴＯＭＯＲＲＯＷ</div>
<div class="window" role="group" aria-label="Lunar Wind Player"><div class="tbar"><span class="ic"></span>Lunar Wind Player<span class="btns"><span>_</span><span>□</span><span>×</span></span></div><div class="menu"><span><u>F</u>ile</span><span><u>V</u>iew</span><span><u>O</u>ptions</span><span><u>H</u>elp</span></div><div class="lcd"><b>NOW PLAYING</b><br>🌴 lunar_wind_sideB.mp3<br><b>SPEED</b> <span id="lcdSpeed">CRUISE ×1</span> &nbsp;
 <b>GRID</b> <span id="lcdGrid">4.0s</span><br><b>CLOCK</b> <span id="clock">00:00:00</span></div><div class="prog"><i id="bar"></i></div><div class="ctl"><button id="bPlay" aria-pressed="false">▶ Play</button><button id="bSlow">◂◂ Slow</button><button id="bFast">▸▸ Fast</button></div><div class="statusbar"><span id="stMode">CRUISE</span><span>44.1kHz</span></div></div>
</div>
<script>
const st=document.getElementById('stars');
const cols=['#fff','#fffb96','#01cdfe','#b967ff'];

for(let i=0;
i<10;
i++){const s=document.createElement('div');
s.className='star';
const sz=1+Math.random()*2.5;
s.style.cssText=`left:${Math.random()*100}%;
top:${Math.random()*100}%;
width:${sz}px;
height:${sz}px;
background:${cols[i%4]};
box-shadow:0 0 6px ${cols[i%4]};
animation-delay:${(Math.random()*3).toFixed(1)}s`;
st.appendChild(s)}
const speeds=[['DRIFT',12],['CRUISE',4],['RUSH',1.4],['HYPER',.5]];
let idx=1,playing=false,sec=0,t0=0;

const root=document.documentElement,lcdS=document.getElementById('lcdSpeed'),lcdG=document.getElementById('lcdGrid'),stM=document.getElementById('stMode'),bar=document.getElementById('bar'),bPlay=document.getElementById('bPlay');

function apply(){document.documentElement.style.setProperty('--grid-speed',speeds[idx][1]+'s');
lcdS.textContent=speeds[idx][0]+' ×'+(4/speeds[idx][1]).toFixed(1);
lcdG.textContent=speeds[idx][1]+'s';
stM.textContent=speeds[idx][0]}
apply();

bPlay.onclick=()=>{playing=!playing;
bPlay.textContent=playing?'❚❚ Pause':'▶ Play';
bPlay.classList.toggle('on',playing);
bPlay.setAttribute('aria-pressed',playing);
if(playing){idx=2;
apply()}else{idx=1;
apply()}};

document.getElementById('bSlow').onclick=()=>{idx=Math.max(0,idx-1);
apply()};

document.getElementById('bFast').onclick=()=>{idx=Math.min(3,idx+1);
apply()};

setInterval(()=>{if(!playing)return;
sec++;
const h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec/60)%60).padStart(2,'0'),s=String(sec%60).padStart(2,'0');
document.getElementById('clock').textContent=`${h}:${m}:${s}`;
bar.style.width=((sec%20)/20*100)+'%'},1000);

let tx=0,ty=0,cx2=0,cy2=0;
const title=document.getElementById('title'),bust=document.getElementById('bust'),sun=document.getElementById('sun');

if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches){addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5);
ty=(e.clientY/innerHeight-.5)});
(function pl(){cx2+=(tx-cx2)*.05;
cy2+=(ty-cy2)*.05;
title.style.transform=`translate(${cx2*24}px,${cy2*14}px) rotateY(${cx2*8}deg)`;
bust.style.marginLeft=cx2*-30+'px';
sun.style.marginLeft=cx2*-18+'px';
requestAnimationFrame(pl)})()}
</script>
