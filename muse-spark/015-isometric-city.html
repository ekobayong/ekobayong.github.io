<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Meridian — Isometric City</title>
<style>
*{

margin:0;

padding:0;

box-sizing:border-box

}

:root{

--sky1:#5faaff;

--sky2:#e1f2ff;

--night:0

}

body{

background:linear-gradient(180deg,var(--sky1),var(--sky2));

min-height:100svh;

overflow:hidden;

font-family:ui-sans-serif,system-ui,sans-serif;

transition:background 1s

}

#stars{

position:fixed;

inset:0;

opacity:var(--night);

background:radial-gradient(circle,#fff 0 1px,transparent 1.5px);

background-size:60px 50px;

pointer-events:none

}

#sun,#moon{

position:fixed;

width:64px;

height:64px;

border-radius:50%;

z-index:1

}

#sun{

background:radial-gradient(circle at 40% 35%,#fff6c8,#ffb52e 60%,#ff7a12);

box-shadow:0 0 40px 12px rgba(255,180,60,.6)

}

#moon{

background:radial-gradient(circle at 40% 35%,#fff,#c9cede 70%);

box-shadow:0 0 24px 6px rgba(220,230,255,.5)

}

.cloud{

position:fixed;

width:150px;

height:34px;

background:rgba(255,255,255,.85);

border-radius:20px;

filter:blur(1px);

z-index:1;

animation:drift linear infinite

}

@keyframes drift{

from{

left:-180px

}

to{

left:110vw

}

}

h1{

position:fixed;

top:16px;

left:20px;

font-family:Georgia,serif;

font-weight:400;

font-size:26px;

z-index:10;

color:#222

}

#clock{

position:fixed;

top:16px;

right:20px;

z-index:10;

font-family:Georgia,serif;

background:rgba(255,255,255,.8);

backdrop-filter:blur(8px);

padding:8px 16px;

border-radius:999px;

font-size:14px

}

#stage{

position:fixed;

inset:0;

display:grid;

place-items:center;

perspective:1200px

}

#iso{

width:540px;

height:540px;

position:relative;

transform:rotateX(60deg) rotateZ(45deg) scale(var(--s,1));

transform-style:preserve-3d

}

#ground{

position:absolute;

inset:0;

background:linear-gradient(180deg,#b9d59a,#a9c78e);

box-shadow:0 0 0 14px #c9c2b4,0 0 0 16px #a9a294,0 30px 60px rgba(0,0,0,.4)

}

#ground::before{

content:'';

position:absolute;

inset:0;

background:linear-gradient(0deg,transparent 44%,#d9d3c7 44% 56%,transparent 56%),linear-gradient(90deg,transparent 44%,#d9d3c7 44% 56%,transparent 56%)

}

#ground::after{

content:'';

position:absolute;

inset:0;

background:linear-gradient(0deg,transparent calc(50% - 45px),#5b5f6b calc(50% - 45px) calc(50% + 45px),transparent calc(50% + 45px)),linear-gradient(90deg,transparent calc(50% - 45px),#5b5f6b calc(50% - 45px) calc(50% + 45px),transparent calc(50% + 45px))

}

#nightshade{

position:absolute;

inset:-40px;

background:rgba(18,24,66,var(--night));

pointer-events:none;

z-index:50

}

.slot{

position:absolute;

transform-style:preserve-3d

}

.face{

position:absolute;

transform-origin:0 0

}

.top{

background:color-mix(in srgb,var(--c) 85%,white);

box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)

}

.south,.east{

display:grid;

gap:2px;

padding:4px;

background:var(--c)

}

.south{

filter:brightness(.96)

}

.east{

filter:brightness(.74)

}

.win{

background:linear-gradient(180deg,#bcd4ea,#7fa3c8);

border-radius:1px;

position:relative;

min-height:6px

}

.win.on::after{

content:'';

position:absolute;

inset:0;

background:#ffd58a;

box-shadow:0 0 6px #ffd58a

}

.win.on:nth-child(3n)::after{

background:#ffe9b8

}

.win.on:nth-child(4n)::after{

background:#cfe6ff

}

.door{

position:absolute;

bottom:0;

left:40%;

width:20%;

height:14px;

background:#2c2c30

}

.shadow{

position:absolute;

background:rgba(0,0,0,.25);

filter:blur(6px);

z-index:-1

}

.tree{

position:absolute;

width:18px;

height:18px;

transform-style:preserve-3d

}

.tree::before{

content:'';

position:absolute;

inset:0;

border-radius:50%;

background:radial-gradient(circle at 35% 30%,#8ac27a,#4f8a48)

}

.tag{

position:absolute;

transform:rotateZ(-45deg) rotateX(-60deg);

background:rgba(255,255,255,.9);

backdrop-filter:blur(6px);

padding:6px 10px;

border-radius:8px;

font-size:11px;

white-space:nowrap;

display:none;

z-index:99

}

.slot:hover .tag,.slot:focus-within .tag{

display:block

}

.slot:hover{

filter:brightness(1.08)

}

.car{

position:absolute;

width:34px;

height:14px;

border-radius:7px;

z-index:20

}

.car::before{

content:'';

position:absolute;

left:-3px;

top:3px;

width:6px;

height:8px;

background:#fff;

border-radius:2px;

box-shadow:0 0 8px #fff

}

.car::after{

content:'';

position:absolute;

right:-3px;

top:3px;

width:6px;

height:8px;

background:#f00;

border-radius:2px;

box-shadow:0 0 8px #f00

}

#marquee{

position:absolute;

background:#2a2038;

color:#ff5fb8;

font-family:Georgia,serif;

font-style:italic;

font-size:13px;

padding:8px 14px;

border-radius:8px;

transform:translateZ(70px);

text-shadow:0 0 8px #ff5fb8,0 0 16px #ff5fb8,0 0 24px #ff5fb8;

animation:bob 3s ease-in-out infinite alternate layer;

z-index:60;

white-space:nowrap

}

@keyframes bob{

to{

transform:translateZ(86px)

}

}

#toolbar{

position:fixed;

bottom:16px;

left:50%;

transform:translateX(-50%);

background:rgba(255,255,255,.85);

backdrop-filter:blur(10px);

border-radius:999px;

padding:8px 12px;

display:flex;

gap:8px;

z-index:100

}

#toolbar button{

border:1px solid #999;

background:#fff;

border-radius:999px;

padding:8px 14px;

font-size:12px;

cursor:pointer

}

#toolbar button[aria-pressed="true"]{

background:#222;

color:#fff

}

#rain{

position:fixed;

inset:0;

pointer-events:none;

z-index:90;

display:none;

background:repeating-linear-gradient(100deg,transparent 0 14px,rgba(180,200,255,.35) 14px 15px,transparent 15px 30px);

animation:fall .5s linear infinite

}

@keyframes fall{

to{

transform:translateY(30px)

}

}

#cap{

position:fixed;

bottom:70px;

left:50%;

transform:translateX(-50%);

font-size:12px;

background:rgba(0,0,0,.6);

color:#fff;

padding:6px 14px;

border-radius:8px;

z-index:100

}

@media(prefers-reduced-motion:reduce){

.cloud,#marquee,#rain{

animation:none

}

}
</style>
</head>
<body>
<div id="stars"></div><div id="sun"></div><div id="moon"></div>
<h1>Little Meridian</h1><div id="clock">12:00 · day</div>
<div id="stage"><div id="iso"><div id="ground"></div><div id="nightshade"></div><div id="marquee">★ Night Market · open late ★</div></div></div>
<div id="rain"></div>
<div id="toolbar"><button id="pause" aria-pressed="false">Pause cycle</button><button id="rainB" aria-pressed="false">Rain</button><button id="skip">Skip to night</button></div>
<div id="cap" aria-live="polite">Hover a building</div>
<script>
const iso=document.getElementById('iso');
const B=[['Harbor Tower',60,60,70,70,220,'#a9b7c9','offices · 42 fl'],['Marigold Flats',180,50,80,60,110,'#e9c1a0','homes · 18 fl'],['Linden Court',300,60,70,70,90,'#b9d4c2','homes · 12 fl'],['The Prism',410,70,60,60,150,'#c9bfe0','gallery · 9 fl'],['Cobalt Works',60,180,90,60,120,'#9fb8d8','factory · 6 fl'],['Night Market',200,200,120,60,44,'#e6a49a','market · 2 fl'],['Pillow Bank',370,190,80,70,100,'#e8dcc4','bank · 14 fl'],['Ferris Apartments',60,300,70,80,130,'#dcb3b8','homes · 20 fl'],['Saltbox Studios',190,320,80,70,80,'#c3ccb0','studios · 5 fl'],['Aurora Spire',320,330,70,70,260,'#a8cfd0','hotel · 55 fl'],['Tin Roof Diner',430,330,60,60,40,'#ecd9a1','diner · 1 fl'],['Meridian House',250,110,60,50,70,'#cfc5d6','library · 4 fl']];
function fit(){const s=Math.min(innerWidth/640,innerHeight/640);iso.style.setProperty('--s',Math.min(1.7,Math.max(.42,s)))}fit();addEventListener('resize',fit);
B.forEach((b,i)=>{const [n,x,y,w,d,h,c,use]=b;const slot=document.createElement('div');slot.className='slot';slot.tabIndex=0;slot.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${d}px`;
const sh=document.createElement('div');sh.className='shadow';sh.style.cssText=`left:10px;top:10px;width:${w}px;height:${d}px`;slot.appendChild(sh);
const top=document.createElement('div');top.className='face top';top.style.cssText=`--c:${c};width:${w}px;height:${d}px;transform:translateZ(${h}px)`;slot.appendChild(top);
const so=document.createElement('div');so.className='face south';const cols=Math.max(3,Math.floor(w/16)),rows=Math.max(2,Math.floor(h/26));
so.style.cssText=`--c:${c};width:${w}px;height:${h}px;transform:translateY(${d}px) translateZ(0) rotateX(-90deg);transform-origin:0 0;grid-template-columns:repeat(${cols},1fr)`;slot.appendChild(so);
const ea=document.createElement('div');ea.className='face east';
ea.style.cssText=`--c:${c};width:${d}px;height:${h}px;transform:translateX(${w}px) translateZ(0) rotateZ(90deg) rotateX(-90deg);transform-origin:0 0;grid-template-columns:repeat(${Math.max(2,Math.floor(d/16))},1fr)`;slot.appendChild(ea);
for(let k=0;k<cols*rows;k++){const win=document.createElement('div');win.className='win'+(Math.random()<.3?' on':'');so.appendChild(win)}
for(let k=0;k<Math.max(2,Math.floor(d/16))*rows;k++){const win=document.createElement('div');win.className='win'+(Math.random()<.3?' on':'');ea.appendChild(win)}
const door=document.createElement('div');door.className='door';door.style.transform=`translateY(${d-14}px)`;so.appendChild(door);
const tag=document.createElement('div');tag.className='tag';tag.style.cssText=`left:0;top:-40px;transform:rotateZ(-45deg) rotateX(-60deg) translateZ(${h+30}px)`;tag.textContent=`${n} — ${use}`;slot.appendChild(tag);
slot.addEventListener('mouseenter',()=>{slot.style.transform=`translateZ(24px)`;slot.style.transition='transform .4s cubic-bezier(.2,1.3,.3,1)';document.getElementById('cap').textContent=n+' — '+use});
slot.addEventListener('mouseleave',()=>slot.style.transform='');
iso.appendChild(slot)});
document.getElementById('marquee').style.left='190px';document.getElementById('marquee').style.top='230px';
// trees
[[140,140],[360,120],[120,420],[420,250]].forEach(([x,y])=>{const t=document.createElement('div');t.className='tree';t.style.left=x+'px';t.style.top=y+'px';t.style.transform=`translateZ(10px)`;iso.appendChild(t)});
// cars
const carCols=['#ff6b6b','#2dd4bf','#ffd93d','#a78bfa'];
carCols.forEach((c,i)=>{const car=document.createElement('div');car.className='car';car.style.background=c;car.style.boxShadow=`0 0 10px ${c}`;iso.appendChild(car);
const horiz=i<2;car.animate(horiz?[{left:'-40px',top:(225+i*22)+'px'},{left:'580px',top:(225+i*22)+'px'}]:[{left:(225+i*22)+'px',top:'-40px'},{left:(225+i*22)+'px',top:'580px'}],{duration:(8+i*1.5)*1000,iterations:Infinity})});
// day/night cycle 120s
const SKY=[['#0c1028','#1e2246',1],['#2a1e4e','#5a3a7a',.9],['#ff966e','#ffd7aa',.25],['#5faaff','#e1f2ff',0],['#5faaff','#e8f4ff',0],['#ff966e','#ffd7aa',.3],['#4a2a5e','#b45a7a',.7],['#0c1028','#1e2246',1],['#0c1028','#1e2246',1]];
let t=0.32,paused=false,night=false;const clock=document.getElementById('clock');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)paused=true;
function lerp(a,b,f){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)+(((pb>>16)-(pa>>16))*f))|0,g=(((pa>>8)&255)+((((pb>>8)&255)-((pa>>8)&255))*f))|0,bl=((pa&255)+(((pb&255)-(pa&255))*f))|0;return `rgb(${r},${g},${bl})`}
setInterval(()=>{if(!paused)t=(t+1/1200)%1;
const seg=t*(SKY.length-1),i=Math.floor(seg),f=seg-i;const a=SKY[i],b=SKY[Math.min(SKY.length-1,i+1)];
document.body.style.setProperty('--sky1',lerp(a[0],b[0],f));document.body.style.setProperty('--sky2',lerp(a[1],b[1],f));
const nv=a[2]+(b[2]-a[2])*f;document.body.style.setProperty('--night',nv.toFixed(2));
document.getElementById('nightshade').style.background=`rgba(18,24,66,${(nv*.55).toFixed(2)})`;
const hr=(t*24+6)%24,hh=String(Math.floor(hr)).padStart(2,'0'),mm=String(Math.floor(hr%1*60)).padStart(2,'0');
clock.textContent=`${hh}:${mm} · ${nv>.5?'night':nv>.2?'dusk/dawn':'day'}`;
const sunA=t*Math.PI*2;document.getElementById('sun').style.left=(50+Math.cos(sunA)*38)+'%';document.getElementById('sun').style.top=(42-Math.sin(sunA)*34)+'%';document.getElementById('sun').style.opacity=Math.sin(sunA)>-.1?1:0;
document.getElementById('moon').style.left=(50-Math.cos(sunA)*38)+'%';document.getElementById('moon').style.top=(42+Math.sin(sunA)*34)+'%';
night=nv>.5;document.getElementById('skip').textContent=night?'Skip to day':'Skip to night';
},100);
// flicker windows
setInterval(()=>{if(night||Math.random()<.3){const w=[...document.querySelectorAll('.win')];for(let i=0;i<6;i++){const el=w[(Math.random()*w.length)|0];el.classList.toggle('on')}}},380);
// clouds
for(let i=0;i<3;i++){const c=document.createElement('div');c.className='cloud';c.style.top=(8+i*9)+'%';c.style.animationDuration=(90+i*20)+'s';document.body.appendChild(c)}
document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.setAttribute('aria-pressed',paused)};
document.getElementById('rainB').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',!on);document.getElementById('rain').style.display=on?'none':'block'};
document.getElementById('skip').onclick=()=>{t=night?0.32:0.0};
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault()}if(e.key==='r'||e.key==='R')document.getElementById('rainB').click()});
</script>
</body>
</html>
