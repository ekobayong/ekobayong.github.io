<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>051 · Composer — De Stijl Generator</title>
<style>
 * {
  box-sizing:border-box
}
html,body {
  margin:0;
  padding:0
}
 body {
  font-family:Georgia,'Iowan Old Style',Palatino,serif;
  background:linear-gradient(180deg,#d9d3c7,#cfc8bb 60%,#c8c1b3);
  min-height:100vh;
  color:#141414
}
 body::before {
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 4px);
  mix-blend-mode:multiply;
  pointer-events:none
}
 .spot {
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 60% 42% at 50% 22%,rgba(255,248,230,.75),transparent 70%);
  pointer-events:none
}
 .label {
  font-family:ui-sans-serif,system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.28em;
  font-size:11px
}
 header {
  text-align:center;
  padding:26px 16px 6px
}
 h1 {
  font-size:clamp(28px,4.5vw,52px);
  margin:.2em 0 .1em;
  font-weight:400
}
 h1 b {
  font-style:italic;
  font-weight:400
}
 main {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  padding:10px 16px 60px
}
 .easel {
  width:min(92vw,620px);
  aspect-ratio:1/1;
  background:linear-gradient(135deg,#2b2b2b,#0d0d0d 40%,#202020 60%,#050505);
  padding:22px;
  box-shadow:0 30px 60px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.4);
  position:relative;
  transition:transform .8s ease
}
 .easel::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.10) 46%,transparent 55%);
  pointer-events:none
}
 #grid {
  display:grid;
  width:100%;
  height:100%;
  background:#1a1a1a;
  gap:10px;
  transition:grid-template-columns 1.1s cubic-bezier(.65,0,.25,1),grid-template-rows 1.1s cubic-bezier(.65,0,.25,1)
}
 #grid.breathe {
  transition:none
}
 .cell {
  border:0;
  cursor:pointer;
  padding:0;
  min-width:0;
  min-height:0;
  position:relative;
  transition:transform .18s ease,filter .38s ease,background-color .38s ease;
  animation:pop .5s both
}
 .cell:hover {
  transform:scale(.985);
  z-index:2
}
 .cell.white {
  background:#f6f3ec;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)
}
 .cell.red {
  background:#d7301f
}
.cell.blue {
  background:#1e4d9b
}
.cell.yellow {
  background:#f2c40f
}
.cell.black {
  background:#161616
}
 .cell.red,.cell.blue,.cell.yellow {
  background-image:linear-gradient(135deg,rgba(255,255,255,.18),rgba(0,0,0,.12))
}
 @keyframes pop {
  from {
    opacity:0;
    transform:scale(.6)
  }
  to {
    opacity:1;
    transform:scale(1)
  }
  
}
 .controls {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:center
}
 .btn {
  font-family:ui-sans-serif,system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:12px;
  background:#faf7f0;
  border:2px solid #111;
  padding:11px 18px;
  cursor:pointer;
  box-shadow:4px 4px 0 #111;
  position:relative;
  overflow:hidden
}
 .btn:hover {
  color:#faf7f0
}
.btn::before {
  content:"";
  position:absolute;
  inset:0;
  background:#111;
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .25s ease;
  z-index:0
}
 .btn:hover::before {
  transform:scaleX(1)
}
.btn span {
  position:relative;
  z-index:1
}
 .btn.on {
  background:#111;
  color:#faf7f0
}
 .depth {
  display:flex;
  align-items:center;
  gap:10px;
  background:#faf7f0;
  border:2px solid #111;
  padding:8px 14px;
  box-shadow:4px 4px 0 #111
}
 input[type=range] {
  accent-color:#d7301f;
  width:130px
}
 input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:16px;
  height:16px;
  background:#d7301f;
  border:2px solid #111;
  border-radius:0;
  cursor:pointer
}
 .plate {
  background:linear-gradient(180deg,#faf7f0,#f3efe6);
  border:1px solid #c9c2b4;
  width:min(92vw,620px);
  padding:18px 22px;
  text-align:center;
  position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,.2)
}
 .plate::before,.plate::after {
  content:"";
  position:absolute;
  top:8px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#eee,#888)
}
 .plate::before {
  left:12px
}
.plate::after {
  right:12px
}
 .plate .artist {
  font-family:ui-sans-serif,system-ui;
  letter-spacing:.3em;
  font-size:10px;
  text-transform:uppercase
}
 .plate .title {
  font-style:italic;
  font-size:20px;
  margin:6px 0
}
 .plate .meta {
  font-size:13px;
  color:#555
}
 .plate.swap .fade {
  opacity:0
}
.fade {
  transition:opacity .3s ease
}
 .floor {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:22%;
  background:linear-gradient(180deg,#6b6358,#5a5248);
  z-index:-1
}
 .hint {
  font-family:ui-sans-serif,system-ui;
  font-size:12px;
  letter-spacing:.08em;
  opacity:.7
}
 @media(max-width:560px) {
  .easel {
    padding:14px
  }
  #grid {
    gap:7px
  }
  
}
 @media(prefers-reduced-motion:reduce) {
  * {
    animation:none!important;
    transition:none!important
  }
  
}
 
/* —— gallery furniture: selection, focus, footer, print —— */ ::selection {
  background:#d7301f;
  color:#faf7f0
}
 .cell:focus-visible {
  outline:3px solid #1e4d9b;
  outline-offset:-3px;
  z-index:3
}
 .btn:focus-visible,.depth:focus-within {
  outline:3px solid #1e4d9b;
  outline-offset:3px
}
 kbd {
  font-family:ui-monospace,Menlo,monospace;
  font-size:11px;
  border:1.5px solid #111;
  border-bottom-width:3px;
  padding:1px 7px;
  background:#fff
}
 .keyline {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
   font-family:ui-sans-serif,system-ui;
  font-size:12px;
  letter-spacing:.06em
}
 .keyline span {
  display:inline-flex;
  gap:7px;
  align-items:center
}
 .walltag {
  width:min(92vw,620px);
  display:flex;
  justify-content:space-between;
  gap:10px;
   font-family:ui-sans-serif,system-ui;
  font-size:10px;
  letter-spacing:.26em;
  text-transform:uppercase;
  opacity:.62
}
 .countline {
  font-family:ui-sans-serif,system-ui;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  opacity:.7
}
 .countline b {
  display:inline-block;
  min-width:3ch;
  text-align:center;
  background:#111;
  color:#faf7f0;
  padding:2px 8px;
  margin:0 4px
}
 .easel .corner {
  position:absolute;
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,.25)
}
 .easel .corner.tl {
  top:6px;
  left:6px;
  border-right:0;
  border-bottom:0
}
 .easel .corner.tr {
  top:6px;
  right:6px;
  border-left:0;
  border-bottom:0
}
 .easel .corner.bl {
  bottom:6px;
  left:6px;
  border-right:0;
  border-top:0
}
 .easel .corner.br {
  bottom:6px;
  right:6px;
  border-left:0;
  border-top:0
}
 .plate .medium {
  font-size:12px;
  color:#6b5b45;
  font-style:italic;
  margin-top:6px
}
 footer.museum {
  width:min(92vw,620px);
  text-align:center;
  font-family:ui-sans-serif,system-ui;
   font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:.6;
  padding-bottom:8px
}
 noscript .needjs {
  display:block;
  background:#a8261c;
  color:#fff;
  padding:12px;
  text-align:center;
   font-family:ui-sans-serif,system-ui
}
 @media(max-width:420px) {
   .controls {
    gap:8px
  }
   .btn {
    padding:9px 12px;
    font-size:11px
  }
   .plate .title {
    font-size:17px
  }
   
}
 @media(min-width:1400px) {
   h1 {
    letter-spacing:-.01em
  }
   .easel {
    box-shadow:0 44px 90px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.4)
  }
   
}
 @media(prefers-contrast:more) {
   .cell.white {
    background:#fff
  }
   .btn,.depth,.plate {
    border-width:3px
  }
   
}
 @media(forced-colors:active) {
   .cell {
    forced-color-adjust:none
  }
   
}
 @media print {
   .controls,.hint,.spot,.floor {
    display:none
  }
   body {
    background:#fff
  }
   .easel {
    box-shadow:none;
    transform:none
  }
   
}
 
</style>
</head>
<body>
<div class="spot"></div>
<header><div class="label">No. 051 · De Stijl Generator · N / A keys</div>
<h1>Composer <b>with Red, Blue &amp; Yellow</b></h1></header>
<main>
<div class="easel" id="easel"><div id="grid" role="grid" aria-label="De Stijl composition"></div></div>
<div class="controls">
<button class="btn" id="btnNew"><span>New composition</span></button>
<button class="btn" id="btnBreathe"><span>Animate</span></button>
<button class="btn" id="btnExport"><span>Export PNG</span></button>
<div class="depth"><span class="label">Depth</span><input type="range" id="depth" min="2" max="7" value="4"><b id="depthVal">4</b></div>
</div>
<div class="plate swap" id="plate"><div class="fade" id="plateInner">
<div class="artist">Piet Anonymous (b. 1872)</div>
<div class="title" id="pTitle">Composition with Red and Blue</div>
<div class="meta" id="pMeta">Oil on canvas · 71 × 71 cm · 1928</div>
</div></div>
<div class="hint">Click any plane to cycle its colour — white → red → blue → yellow → black.</div>
</main>
<div class="floor"></div>
<script>
const grid=document.getElementById('grid'),easel=document.getElementById('easel');
const depthEl=document.getElementById('depth'),depthVal=document.getElementById('depthVal');
const CYCLE=['white','red','blue','yellow','black'];
const PAL={red:'#d7301f',blue:'#1e4d9b',yellow:'#f2c40f',black:'#161616',white:'#f6f3ec'};
let breathing=false,raf=0,baseC=[],baseR=[],t0=0;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rnd(a,b){return a+Math.random()*(b-a)}
function trackSize(){const r=Math.random();if(r<.6)return rnd(.8,1.3);if(r<.85)return rnd(.45,.7);return rnd(1.5,2.2)}
function subdivide(x,y,w,h,d,max,out){
  if(d>=max||(w<=1&&h<=1)||(d>1&&Math.random()<.14)){out.push({x,y,w,h});return}
  const horiz=(w===h)?Math.random()<.5:(w>h?Math.random()<.72:Math.random()>.72);
  const ratio=Math.random()<.5?.382:.618;const j=ratio+rnd(-.15,.15);
  if(horiz&&h>1){const c=Math.max(1,Math.min(h-1,Math.round(h*j)));subdivide(x,y,w,c,d+1,max,out);subdivide(x,y+c,w,h-c,d+1,max,out)}
  else if(!horiz&&w>1){const c=Math.max(1,Math.min(w-1,Math.round(w*j)));subdivide(x,y,c,h,d+1,max,out);subdivide(x+c,y,w-c,h,d+1,max,out)}
  else out.push({x,y,w,h});
}
function pickColor(){const r=Math.random();if(r<.08)return 'red';if(r<.15)return 'blue';if(r<.22)return 'yellow';if(r<.245)return 'black';return 'white'}
function compose(){
  const max=+depthEl.value;depthVal.textContent=max;
  baseC=Array.from({length:16},trackSize);baseR=Array.from({length:16},trackSize);
  applyTracks(baseC,baseR);
  const leaves=[];subdivide(0,0,16,16,0,max,leaves);
  grid.innerHTML='';
  leaves.forEach((L,i)=>{
    const b=document.createElement('button');const c=pickColor();
    b.className='cell '+c;b.style.gridColumn=`${L.x+1}/span ${L.w}`;b.style.gridRow=`${L.y+1}/span ${L.h}`;
    b.dataset.color=c;b.setAttribute('aria-label','plane '+c);
    if(!RM)b.style.animationDelay=(i*28)+'ms';
    b.onclick=()=>{const n=CYCLE[(CYCLE.indexOf(b.dataset.color)+1)%CYCLE.length];b.dataset.color=n;b.className='cell '+n};
    grid.appendChild(b);
  });
  easel.style.transform=`rotate(${rnd(-.6,.6).toFixed(2)}deg)`;
  updatePlate();
}
function applyTracks(c,r){grid.style.gridTemplateColumns=c.map(v=>v+'fr').join(' ');grid.style.gridTemplateRows=r.map(v=>v+'fr').join(' ')}
function updatePlate(){
  const cells=[...grid.children].map(c=>c.dataset.color);
  const has=[...new Set(cells.filter(c=>c!=='white'&&c!=='black'))];
  const names={red:'Red',blue:'Blue',yellow:'Yellow'};
  let t=has.length?('Composition No. '+(2+Math.floor(Math.random()*6))+' with '+has.map(h=>names[h]).join(', ')):'Tableau in White';
  const inner=document.getElementById('plateInner'),plate=document.getElementById('plate');
  inner.style.opacity=0;
  setTimeout(()=>{document.getElementById('pTitle').textContent=t;
    document.getElementById('pMeta').textContent=`Oil on canvas · 71 × 71 cm · ${1919+Math.floor(Math.random()*24)}`;
    inner.style.opacity=1},RM?0:280);
}
function tick(t){
  if(!breathing)return;
  const e=t/1000;
  const c=baseC.map((b,i)=>b*(1+.16*Math.sin(e*.4+i*.7)+.06*Math.sin(e*1.7+i*1.3)));
  const r=baseR.map((b,i)=>b*(1+.16*Math.sin(e*.33+i*.9+2)+.06*Math.sin(e*1.9+i)));
  applyTracks(c,r);raf=requestAnimationFrame(tick);
}
document.getElementById('btnNew').onclick=compose;
depthEl.oninput=compose;
const bB=document.getElementById('btnBreathe');
bB.onclick=()=>{if(RM)return;breathing=!breathing;bB.classList.toggle('on',breathing);grid.classList.toggle('breathe',breathing);if(breathing)raf=requestAnimationFrame(tick);else{cancelAnimationFrame(raf);applyTracks(baseC,baseR)}};
document.getElementById('btnExport').onclick=()=>{
  const cv=document.createElement('canvas');cv.width=cv.height=800;const x=cv.getContext('2d');
  x.fillStyle='#1a1a1a';x.fillRect(0,0,800,800);
  const cols=baseC,sumC=cols.reduce((a,b)=>a+b,0),rows=baseR,sumR=rows.reduce((a,b)=>a+b,0);
  const px=i=>cols.slice(0,i).reduce((a,b)=>a+b,0)/sumC*800;
  const py=i=>rows.slice(0,i).reduce((a,b)=>a+b,0)/sumR*800;
  [...grid.children].forEach(b=>{const cs=getComputedStyle(b);const r=b.getBoundingClientRect(),g=grid.getBoundingClientRect();
    const fx=(r.left-g.left)/g.width,fy=(r.top-g.top)/g.height,fw=r.width/g.width,fh=r.height/g.height;
    x.fillStyle=PAL[b.dataset.color];x.fillRect(fx*800+3,fy*800+3,fw*800-6,fh*800-6)});
  const a=document.createElement('a');a.download='mondrian-composition.png';a.href=cv.toDataURL();a.click();
};
addEventListener('keydown',e=>{if(e.key==='n'||e.key==='N')compose();if(e.key==='a'||e.key==='A')bB.click()});
compose();
</script>
</body>
</html>
