<style>

body{

<body>
<canvas id="stars"></canvas><div class="neb1"></div><div class="neb2"></div>
<h1>Orbit<i>.</i></h1><div class="sub">Eight worlds · true periods · 3D</div>
<div id="view"><div id="pivot"></div></div>
<div class="hint">drag to orbit · scroll for pitch · click a world</div>
<div id="toolbar">
<label style="font-size:12px">SPEED <span id="sv">1×</span> <input id="speed" type="range" min="0" max="40" step="0.5" value="1"></label>
<button id="lblBtn" aria-pressed="true">Labels</button>
<button id="reset">Reset view</button>
</div>
<aside id="card" aria-live="polite"><button id="close">✕</button><div class="type" id="cType"></div><h2 id="cName"></h2><dl id="cMeta"></dl><p id="cFact"></p></aside>
<script>
const sc=document.getElementById('stars'),sx=sc.getContext('2d');
function starfield(){sc.width=innerWidth;sc.height=innerHeight;sx.clearRect(0,0,sc.width,sc.height);
const n=Math.floor(innerWidth*innerHeight/4500);const cols=['#cfe0ff','#fff6e8','#ffd9b0','#ffffff'];
for(let i=0;i<n;i++){sx.globalAlpha=.25+Math.random()*.7;sx.fillStyle=cols[i%4];const r=Math.random()*1.6+.3;sx.beginPath();sx.arc(Math.random()*sc.width,Math.random()*sc.height,r,0,7);sx.fill()}
sx.globalAlpha=.5;for(let i=0;i<6;i++){sx.strokeStyle='#9fb8ff';sx.beginPath();sx.arc(Math.random()*sc.width,Math.random()*sc.height,4+Math.random()*6,0,7);sx.stroke()}sx.globalAlpha=1}
starfield();addEventListener('resize',starfield);
const pivot=document.getElementById('pivot');
let yaw=0,pitch=62,speed=1,auto=true,dragging=false,lx=0,ly=0;
const PLANETS=[
{n:'Mercury',r:105,inc:7,period:88,c1:'#cfc9bf',c2:'#46423d',size:10,fact:'The swift planet: a cratered iron heart wrapped in a whisper-thin exosphere.',d:'4,879 km',day:'59 days',year:'88 days',moons:0,temp:'167°C'},
{n:'Venus',r:140,inc:3.4,period:225,c1:'#f6e3b4',c2:'#9c6a3a',size:16,extra:'clouds',fact:'Wrapped in crushing CO₂ skies, Venus spins backwards beneath unbroken acid cloud.',d:'12,104 km',day:'243 days ↺',year:'225 days',moons:0,temp:'464°C'},
{n:'Earth',r:180,inc:0,period:365,c1:'#3b7be0',c2:'#0a2a66',size:17,extra:'earth',moon:true,fact:'The only known world with liquid-water oceans, oxygen air and life.',d:'12,742 km',day:'23.9 h',year:'365.25 days',moons:1,temp:'15°C'},
{n:'Mars',r:222,inc:1.9,period:687,c1:'#e6845a',c2:'#6a2810',size:13,extra:'mars',fact:'Home to Olympus Mons, the tallest volcano, and valleys carved by ancient rivers.',d:'6,779 km',day:'24.6 h',year:'687 days',moons:2,temp:'−63°C'},
{n:'Jupiter',r:300,inc:1.3,period:4333,c1:'#ecdcc7',c2:'#a56b4d',size:34,extra:'jupiter',fact:'A gas giant wider than eleven Earths; its Great Red Spot is a centuries-old storm.',d:'139,820 km',day:'9.9 h',year:'11.9 yr',moons:95,temp:'−110°C'},
{n:'Saturn',r:380,inc:2.5,period:10759,c1:'#efe0b8',c2:'#8a6f3f',size:30,extra:'saturn',fact:'Its dazzling rings are countless shards of ice, some as small as dust.',d:'116,460 km',day:'10.7 h',year:'29.4 yr',moons:146,temp:'−140°C'},
{n:'Uranus',r:450,inc:0.8,period:30687,c1:'#d6f6f7',c2:'#3a9aa3',size:22,fact:'An ice giant knocked on its side, rolling around the Sun at a 98° tilt.',d:'50,724 km',day:'17.2 h',year:'84 yr',moons:28,temp:'−195°C'},
{n:'Neptune',r:512,inc:1.8,period:60190,c1:'#6d95f5',c2:'#142f8f',size:21,fact:'The windiest world: supersonic methane storms under deep cobalt blue.',d:'49,244 km',day:'16.1 h',year:'164.8 yr',moons:16,temp:'−200°C'}];
// sun
const sunW=document.createElement('div');sunW.className='sunW';
sunW.innerHTML='<div class="corona"></div><div class="corona c2"></div><div class="sun" tabindex="0" role="button" aria-label="Sun"></div><div class="lbl">Sun</div>';
pivot.appendChild(sunW);
sunW.querySelector('.sun').onclick=()=>showCard({n:'Sun',type:'G-type star',d:'1.39M km',day:'27 days',year:'—',moons:8,temp:'5,505°C',fact:'99.86% of the system\'s mass. A million Earths could fit inside it.'});
const objs=[];
PLANETS.forEach(p=>{
const orb=document.createElement('div');orb.className='orbit';
const D=p.r*2;orb.style.width=orb.style.height=D+'px';orb.style.left=orb.style.top=(-p.r)+'px';orb.style.transform=`rotateX(${90+p.inc}deg)`;pivot.appendChild(orb);
const w=document.createElement('div');w.className='pwrap';pivot.appendChild(w);
const el=document.createElement('div');el.className='planet';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',p.n);
el.style.width=el.style.height=p.size+'px';
let bg=`radial-gradient(circle at 35% 30%,${p.c1},${p.c2} 75%)`;
if(p.extra==='jupiter')bg=`repeating-linear-gradient(180deg,#d7bd9c 0 4px,#b18866 4px 7px,#ecdcc7 7px 11px,#a56b4d 11px 14px),radial-gradient(circle at 35% 30%,#ecdcc7,#a56b4d)`;
if(p.extra==='saturn')bg=`repeating-linear-gradient(180deg,#efe0b8 0 3px,#cbb27f 3px 5px,#f6ecd2 5px 7px)`;
if(p.extra==='earth')bg=`radial-gradient(circle at 35% 30%,#7db4ff,#3b7be0 40%,#0a2a66),radial-gradient(circle at 60% 55%,#4a9a3e 0 18%,transparent 19%),radial-gradient(circle at 35% 65%,#3c8a3a 0 14%,transparent 15%)`;
if(p.extra==='venus')bg=`repeating-linear-gradient(35deg,rgba(255,255,255,.25) 0 3px,transparent 3px 9px),radial-gradient(circle at 35% 30%,#f6e3b4,#9c6a3a)`;
if(p.extra==='mars')bg=`radial-gradient(circle at 65% 70%,rgba(0,0,0,.4) 0 20%,transparent 21%),radial-gradient(circle at 50% 8%,#fff 0 8%,transparent 9%),radial-gradient(circle at 35% 30%,#e6845a,#6a2810)`;
el.style.background=bg;el.style.boxShadow='0 0 12px rgba(180,200,255,.35)';
el.style.left=el.style.top=(-p.size/2)+'px';
el.innerHTML=`<div class="lbl">${p.n}</div>`;
if(p.extra==='saturn'){const ring=document.createElement('div');ring.style.cssText=`position:absolute;left:-65%;top:-65%;width:230%;height:230%;border-radius:50%;transform:rotateX(74deg);background:radial-gradient(closest-side,transparent 52%,rgba(240,220,170,.9) 54%,rgba(120,100,60,.2) 58%,rgba(240,220,170,.85) 62%,transparent 70%);pointer-events:none`;el.appendChild(ring)}
w.appendChild(el);
let moonEl=null,moonW=null;
if(p.moon){moonW=document.createElement('div');moonW.style.cssText='position:absolute;left:0;top:0;transform-style:preserve-3d';el.appendChild(moonW);moonEl=document.createElement('div');moonEl.style.cssText='position:absolute;width:5px;height:5px;border-radius:50%;background:#ddd;box-shadow:0 0 6px #fff';moonW.appendChild(moonEl)}
const o={p,w,el,moonW,moonEl,angle:Math.random()*360};objs.push(o);
el.onclick=e=>{e.stopPropagation();showCard({n:p.n,type:'Planet',...p})};el.onkeydown=e=>{if(e.key==='Enter')showCard({n:p.n,type:'Planet',...p})};
});
const card=document.getElementById('card');
function showCard(p){document.getElementById('cType').textContent=p.type||'Planet';document.getElementById('cName').textContent=p.n;
document.getElementById('cMeta').innerHTML=`<dt>Diameter · </dt><dd>${p.d||'—'}</dd><br><dt>Day · </dt><dd>${p.day||'—'}</dd><br><dt>Year · </dt><dd>${p.year||'—'}</dd><br><dt>Moons · </dt><dd>${p.moons??'—'}</dd><br><dt>Mean temp · </dt><dd>${p.temp||'—'}</dd>`;
document.getElementById('cFact').textContent=p.fact||'';card.classList.add('open')}
document.getElementById('close').onclick=()=>card.classList.remove('open');
addEventListener('keydown',e=>{if(e.key==='Escape')card.classList.remove('open')});
document.getElementById('speed').oninput=e=>{speed=+e.target.value;document.getElementById('sv').textContent=speed+'×'};
document.getElementById('lblBtn').onclick=e=>{const b=e.currentTarget;const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',!on);document.body.classList.toggle('nolabels',on)};
document.getElementById('reset').onclick=()=>{yaw=0;pitch=62};
// drag
const view=document.getElementById('view');
view.addEventListener('pointerdown',e=>{dragging=true;auto=false;lx=e.clientX;ly=e.clientY;view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-lx)*.3;pitch=Math.min(89,Math.max(2,pitch-(e.clientY-ly)*.25));lx=e.clientX;ly=e.clientY});
view.addEventListener('pointerup',()=>dragging=false);
view.addEventListener('wheel',e=>{pitch=Math.min(89,Math.max(2,pitch+e.deltaY*.05))},{passive:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
if(auto&&!reduced)yaw+=dt*1.5;
const s=Math.min(innerWidth,innerHeight)/1100+.55;
pivot.style.transform=`scale3d(${s},${s},${s}) rotateX(${pitch}deg) rotateY(${yaw}deg)`;
const cx=innerWidth/2,cy=innerHeight/2;
objs.forEach(o=>{o.angle+=(dt*speed*360)/(o.p.period/365*12)%360;
o.w.style.transform=`rotateX(${-o.p.inc}deg) rotateY(${o.angle}deg) translateX(${o.p.r}px)`;
o.el.style.transform=`rotateY(${-o.angle+yaw}deg) rotateX(${-o.p.inc+pitch}deg)`;
if(o.moonW){const ma=t/1000*speed*(365/27.3)/12*2+1;o.moonW.style.transform=`rotateY(${ma*57}deg) translateX(18px)`}
const r=o.el.getBoundingClientRect();const dx=(r.left+r.width/2-cx),dy=(r.top+r.height/2-cy);const m=Math.hypot(dx,dy)||1;
o.el.style.setProperty('--lx',(50-dx/m*50)+'%');o.el.style.setProperty('--ly',(50-dy/m*50)+'%')});
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
