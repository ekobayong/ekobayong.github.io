else if(cmd==='clear')log.innerHTML='';
else if(cmd===''){}
else print(`<span class="err">ERR: unknown command "${c.replace(/</g,'&lt;')}" — try "help".</span>`);
busy=false;inp.disabled=false;inp.focus();log.scrollTop=log.scrollHeight;}

document.getElementById('theta').textContent=ang.toFixed(2);}

setInterval(()=>{document.getElementById('gv1').textContent=(34+Math.random()*6).toFixed(1)+'°C';document.getElementById('gf1').style.width=(30+Math.random()*50)+'%';document.getElementById('gv2').textContent=(Math.random()*1.4).toFixed(2)+' T';document.getElementById('gf2').style.width=(Math.random()*90)+'%';},1400);

const hex=document.getElementById('hex');let rows=[];
function mkRow(a){let h='',asc='';for(let i=0;i<8;i++){const b=Math.floor(Math.random()*256);const hot=Math.random()<.12;h+=`<span class="${hot?'h':'x'}">${b.toString(16).padStart(2,'0')}</span> `;asc+=String.fromCharCode(b>31&&b<127?b:46);}return `<div><span class="a">0x${a.toString(16).padStart(4,'0')}</span>  ${h} <span style="color:var(--dim)">${asc.replace(/</g,'&lt;')}</span></div>`;}
let addr=0x7f3a;for(let i=0;i<14;i++)rows.push(mkRow(addr+i*8));
setInterval(()=>{addr+=8;rows.push(mkRow(addr));rows.shift();hex.innerHTML=rows.join('');},RM?1500:220);
hex.innerHTML=rows.join('');
</script>
