<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleido — Symmetric Mandala Studio</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: radial-gradient(circle at 50% 45%, #1a1b1e, #0d0e10 75%);
  height: 100vh;
  overflow: hidden;
  font-family: ui-sans-serif, system-ui, sans-serif;
  color: #e8e8ea;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(115% 115% at 50% 50%, transparent 55%, rgba(0, 0, 0, .55));
}
#cv {
  position: fixed;
  inset: 0;
  cursor: crosshair;
  touch-action: none;
}
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 22px;
  pointer-events: none;
  z-index: 5;
}
.brand {
  font-weight: 200;
  letter-spacing: .32em;
  font-size: 22px;
}
.brand small {
  display: block;
  font-size: 10px;
  letter-spacing: .28em;
  color: #8b8c91;
  margin-top: 4px;
}
#status {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  text-align: right;
  line-height: 1.9;
  color: #8b8c91;
}
#status b {
  color: #f0b35a;
  font-weight: 600;
}
#bar {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  display: flex;
  gap: 4px;
  align-items: center;
  background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 999px;
  padding: 8px 12px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
  max-width: 96vw;
  flex-wrap: wrap;
  justify-content: center;
}
#bar button {
  border: none;
  background: transparent;
  color: #e8e8ea;
  font: inherit;
  font-size: 12px;
  padding: 9px 13px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s;
}
#bar button:hover {
  background: rgba(255, 255, 255, .12);
}
#bar button.on {
  background: #f0b35a;
  color: #111;
}
.pop {
  position: fixed;
  bottom: 74px;
  left: 50%;
  transform: translate(-50%, 8px);
  z-index: 6;
  background: rgba(20, 21, 24, .95);
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 16px;
  padding: 14px;
  display: none;
  gap: 8px;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  max-width: 92vw;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}
.pop.open {
  display: flex;
  opacity: 1;
  transform: translate(-50%, 0);
}
.pop h5 {
  width: 100%;
  text-align: center;
  font-size: 10px;
  letter-spacing: .3em;
  color: #8b8c91;
  font-weight: 400;
}
.chip {
  border: 1px solid rgba(255, 255, 255, .2);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 12px;
  cursor: pointer;
  background: transparent;
  color: #e8e8ea;
}
.chip.on {
  background: #f0b35a;
  color: #111;
  border-color: #f0b35a;
}
.sw {
  width: 44px;
  height: 30px;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  padding: 0;
}
.sw.on {
  border-color: #fff;
}
.brushrow {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  font-family: ui-monospace, monospace;
  color: #8b8c91;
  width: 100%;
  justify-content: center;
}
.brushrow input {
  accent-color: #f0b35a;
  width: 150px;
}
#toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: #f0b35a;
  z-index: 6;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
}
#help {
  position: fixed;
  bottom: 18px;
  right: 16px;
  z-index: 6;
  font-family: ui-monospace, monospace;
  font-size: 10px;
  color: #55565c;
  letter-spacing: .08em;
  text-align: right;
  line-height: 1.8;
}
@media (max-width: 760px) {
  #help { display: none; }
}
@media (max-width: 640px) {
  #bar button .lbl { display: none; }
  #status { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<header>
  <div class="brand">KALEIDO<small>SYMMETRIC MANDALA STUDIO</small></div>
  <div id="status">SYMMETRY <b id="sSym">12</b> · MIRROR <b id="sMir">ON</b><br>STROKES <b id="sN">0</b> · <b id="sPal">DRIFT</b></div>
</header>
<div id="toast"></div>
<div class="pop" id="popSym">
  <h5>FOLD SYMMETRY</h5>
</div>
<div class="pop" id="popPal">
  <h5>PALETTE</h5>
</div>
<div class="pop" id="popBrush">
  <h5>BRUSH</h5>
  <label class="brushrow">SIZE <input type="range" id="brush" min="20" max="140" value="100"><span id="brushV">1.0×</span></label>
  <label class="brushrow">GLOW <input type="range" id="glow" min="0" max="24" value="10"><span id="glowV">10</span></label>
</div>
<div id="bar">
  <button id="bClear">✕ <span class="lbl">Clear</span></button>
  <button id="bUndo">↩ <span class="lbl">Undo</span></button>
  <button id="bSave">⤓ <span class="lbl">Save</span></button>
  <button id="bSym">✳ <span class="lbl">Symmetry</span></button>
  <button id="bMir" class="on">◭ <span class="lbl">Mirror</span></button>
  <button id="bPal">◉ <span class="lbl">Palette</span></button>
  <button id="bBrush">🖌 <span class="lbl">Brush</span></button>
  <button id="bAuto">▶ <span class="lbl">Auto</span></button>
  <button id="bRegen">⚄ <span class="lbl">New</span></button>
</div>
<div id="help">DRAG TO DRAW · A AUTO · C CLEAR<br>Z UNDO · S SAVE · M MIRROR</div>
<script>
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var sym = 12;
var mirror = true;
var pal = 'drift';
var strokes = [];
var cur = null;
var hue = Math.random() * 360;
var auto = false;
var autoS = null;
var brushMul = 1;
var glowAmt = 10;
var PALS = {
  ember: ['#ffb347', '#ff7a3a', '#ff5e3a', '#e0335a', '#c81d5a'],
  lagoon: ['#a7f3d0', '#5eead4', '#22d3ee', '#3b82f6', '#1e3a8a'],
  gilded: ['#fff6d5', '#f7dd9a', '#f0b35a', '#c98a2c', '#7a4b12'],
  ivory: ['#ffffff', '#f2ede4', '#d9d2c4', '#a8a29a', '#6e675e']
};
var CX = 0, CY = 0, dpr = 1;
function size() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;
  cv.style.width = window.innerWidth + 'px';
  cv.style.height = window.innerHeight + 'px';
  CX = window.innerWidth / 2;
  CY = window.innerHeight / 2;
  redraw();
}
function col() {
  if (pal === 'drift') {
    hue = (hue + .9) % 360;
    return 'hsl(' + hue.toFixed(1) + ',85%,62%)';
  }
  var a = PALS[pal];
  return a[Math.floor(Math.random() * a.length)];
}
function paintSeg(s, i) {
  if (i < 1) return;
  var p0 = s.pts[i - 1], p1 = s.pts[i];
  var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
  for (var j = 0; j < sym; j++) {
    var a = j / sym * Math.PI * 2;
    var copies = mirror ? [0, 1] : [0];
    for (var m = 0; m < copies.length; m++) {
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(a);
      if (copies[m]) ctx.scale(-1, 1);
      ctx.strokeStyle = s.c;
      ctx.lineWidth = s.w[i];
      ctx.lineCap = 'round';
      ctx.shadowBlur = glowAmt;
      ctx.shadowColor = s.c;
      ctx.globalAlpha = .92;
      ctx.beginPath();
      ctx.moveTo(p0.x - CX, p0.y - CY);
      ctx.lineTo(mx - CX, my - CY);
      ctx.stroke();
      ctx.restore();
    }
  }
}
function redraw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  strokes.forEach(function (s) {
    for (var i = 1; i < s.pts.length; i++) paintSeg(s, i);
  });
  upd();
}
function upd() {
  document.getElementById('sSym').textContent = sym;
  document.getElementById('sMir').textContent = mirror ? 'ON' : 'OFF';
  document.getElementById('sN').textContent = strokes.length;
  document.getElementById('sPal').textContent = pal.toUpperCase();
}
var lastT = 0;
cv.addEventListener('pointerdown', function (e) {
  cv.setPointerCapture(e.pointerId);
  cur = { pts: [{ x: e.clientX, y: e.clientY }], w: [8 * brushMul], c: col() };
  lastT = performance.now();
});
cv.addEventListener('pointermove', function (e) {
  if (!cur) return;
  var p = { x: e.clientX, y: e.clientY };
  var n = performance.now();
  var last = cur.pts[cur.pts.length - 1];
  var sp = Math.hypot(p.x - last.x, p.y - last.y) / Math.max(1, n - lastT);
  lastT = n;
  var w = 14 - Math.min(12, sp * 4);
  w = Math.max(1.2, Math.min(14, w)) * brushMul;
  var lw = cur.w[cur.w.length - 1];
  w = lw * .7 + w * .3;
  cur.w.push(w);
  cur.pts.push(p);
  if (pal === 'drift') cur.c = col();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintSeg(cur, cur.pts.length - 1);
});
window.addEventListener('pointerup', function () {
  if (cur && cur.pts.length > 1) {
    strokes.push(cur);
    upd();
  }
  cur = null;
});
function noise(t) {
  return Math.sin(t * 1.7) * .5 + Math.sin(t * 2.9 + 1.3) * .3 + Math.sin(t * 4.7 + 2.1) * .2;
}
function autoStep() {
  if (!auto) return;
  if (!autoS) {
    var ring = [.12, .2, .28, .36, .44][Math.floor(Math.random() * 5)] * Math.min(window.innerWidth, window.innerHeight);
    autoS = {
      r: ring,
      a: Math.random() * 6.28,
      life: 120 + Math.random() * 160,
      dir: Math.random() < .5 ? 1 : -1,
      w: 2 + Math.random() * 5,
      c: col(),
      prev: null
    };
  }
  var s = autoS;
  s.a += s.dir * (.02 + Math.abs(noise(s.a)) * .05);
  var rr = s.r + noise(s.a * 2) * 22;
  var x = CX + Math.cos(s.a) * rr;
  var y = CY + Math.sin(s.a) * rr;
  if (!s.prev) s.prev = { x: x, y: y };
  var w = Math.max(1.2, Math.min(10, s.w + noise(s.a * 3) * 3)) * brushMul;
  var fake = { pts: [s.prev, { x: x, y: y }], w: [w, w], c: s.c };
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintSeg(fake, 1);
  strokes.push(fake);
  if (strokes.length > 4000) strokes.splice(0, 500);
  s.prev = { x: x, y: y };
  if (--s.life <= 0) autoS = null;
  upd();
  setTimeout(function () { requestAnimationFrame(autoStep); }, 16);
}
function toast(m) {
  var el = document.getElementById('toast');
  el.textContent = m;
  el.style.opacity = 1;
  setTimeout(function () { el.style.opacity = 0; }, 1400);
}
function closePops() {
  document.querySelectorAll('.pop').forEach(function (p) { p.classList.remove('open'); });
}
var popS = document.getElementById('popSym');
[6, 8, 12, 16].forEach(function (n) {
  var b = document.createElement('button');
  b.className = 'chip' + (n === sym ? ' on' : '');
  b.textContent = n + '-fold';
  b.addEventListener('click', function () {
    sym = n;
    popS.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });
    b.classList.add('on');
    redraw();
    toast('Symmetry ' + n);
  });
  popS.appendChild(b);
});
var popP = document.getElementById('popPal');
function mk(name, grad) {
  var b = document.createElement('button');
  b.className = 'sw' + (pal === name ? ' on' : '');
  b.title = name;
  b.style.background = grad;
  b.setAttribute('aria-label', 'Palette ' + name);
  b.addEventListener('click', function () {
    pal = name;
    popP.querySelectorAll('.sw').forEach(function (c) { c.classList.remove('on'); });
    b.classList.add('on');
    upd();
  });
  popP.appendChild(b);
}
mk('drift', 'conic-gradient(red,yellow,lime,aqua,blue,magenta,red)');
mk('ember', 'linear-gradient(90deg,#ffb347,#e0335a)');
mk('lagoon', 'linear-gradient(90deg,#5eead4,#3b82f6)');
mk('gilded', 'linear-gradient(90deg,#fff6d5,#c98a2c)');
mk('ivory', 'linear-gradient(90deg,#fff,#6e675e)');
function togglePop(id) {
  var p = document.getElementById(id);
  var was = p.classList.contains('open');
  closePops();
  if (!was) p.classList.add('open');
}
document.getElementById('bSym').addEventListener('click', function (e) { e.stopPropagation(); togglePop('popSym'); });
document.getElementById('bPal').addEventListener('click', function (e) { e.stopPropagation(); togglePop('popPal'); });
document.getElementById('bBrush').addEventListener('click', function (e) { e.stopPropagation(); togglePop('popBrush'); });
document.addEventListener('click', closePops);
document.getElementById('brush').addEventListener('input', function (e) {
  brushMul = e.target.value / 100;
  document.getElementById('brushV').textContent = brushMul.toFixed(1) + '×';
});
document.getElementById('glow').addEventListener('input', function (e) {
  glowAmt = +e.target.value;
  document.getElementById('glowV').textContent = glowAmt;
});
document.getElementById('bClear').addEventListener('click', function () {
  strokes = [];
  redraw();
  toast('Canvas cleared');
});
document.getElementById('bUndo').addEventListener('click', function () {
  strokes.pop();
  redraw();
});
document.getElementById('bSave').addEventListener('click', function () {
  var o = document.createElement('canvas');
  o.width = window.innerWidth;
  o.height = window.innerHeight;
  var c = o.getContext('2d');
  var g = c.createRadialGradient(window.innerWidth / 2, window.innerHeight / 2, 10, window.innerWidth / 2, window.innerHeight / 2, Math.max(window.innerWidth, window.innerHeight));
  g.addColorStop(0, '#1a1b1e');
  g.addColorStop(1, '#0d0e10');
  c.fillStyle = g;
  c.fillRect(0, 0, o.width, o.height);
  c.drawImage(cv, 0, 0, o.width, o.height);
  var a = document.createElement('a');
  a.download = 'kaleido.png';
  a.href = o.toDataURL();
  a.click();
  toast('Saved PNG');
});
document.getElementById('bMir').addEventListener('click', function (e) {
  mirror = !mirror;
  e.currentTarget.classList.toggle('on', mirror);
  upd();
});
document.getElementById('bAuto').addEventListener('click', function (e) {
  auto = !auto;
  e.currentTarget.classList.toggle('on', auto);
  if (auto) requestAnimationFrame(autoStep);
  toast(auto ? 'Auto-draw on' : 'Auto-draw off');
});
document.getElementById('bRegen').addEventListener('click', function () {
  hue = Math.random() * 360;
  sym = [6, 8, 12, 16][Math.floor(Math.random() * 4)];
  strokes = [];
  auto = true;
  document.getElementById('bAuto').classList.add('on');
  requestAnimationFrame(autoStep);
  setTimeout(function () {
    auto = false;
    document.getElementById('bAuto').classList.remove('on');
  }, 4000);
  redraw();
  toast('New mandala blooming…');
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'a' || e.key === 'A') document.getElementById('bAuto').click();
  if (e.key === 'c' || e.key === 'C') document.getElementById('bClear').click();
  if (e.key === 'z' || e.key === 'Z') document.getElementById('bUndo').click();
  if (e.key === 's' || e.key === 'S') document.getElementById('bSave').click();
  if (e.key === 'm' || e.key === 'M') document.getElementById('bMir').click();
  if (e.key === 'Escape') closePops();
});
window.addEventListener('resize', size);
size();
</script>
</body>
</html>
