<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Flame — Candle Breathing Guide</title>
<style>
:root
{
  --glow:.8;--breath:1;--bend:0;--parch:#e9d8c3
}

*
{
  box-sizing:border-box
}
html,body
{
  margin:0;height:100%
}

body
{
  background:#120a07;color:var(--parch);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;overflow:hidden
}

#room
{
  position:fixed;inset:0;background:radial-gradient(600px 420px at 50% 58%,rgba(255,150,60,calc(.34*var(--glow))),transparent 70%),linear-gradient(#2a1710,#120a07 70%);pointer-events:none
}

#table
{
  position:fixed;left:-10%;right:-10%;bottom:-12%;height:34%;background:linear-gradient(#2c1810,#1c0f0a);transform:perspective(700px) rotateX(28deg);box-shadow:inset 0 20px 60px rgba(255,150,60,calc(.2*var(--glow)))
}

#pool
{
  position:fixed;left:50%;bottom:8%;width:52vmin;height:12vmin;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,170,80,calc(.5*var(--glow))),transparent 70%);filter:blur(10px);pointer-events:none
}

#vig
{
  position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.72));pointer-events:none
}

main
{
  position:relative;z-index:5;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:26px 16px 12px;text-align:center
}

h1
{
  margin:0;font-weight:300;letter-spacing:.34em;font-size:15px;text-transform:uppercase
}

#cue
{
  font-size:clamp(30px,5vw,52px);font-style:italic;font-weight:300;margin:10px 0 0;min-height:64px;transition:opacity .6s
}

#count
{
  font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.3em;opacity:.7
}

#stage
{
  position:relative;width:min(66vmin,420px);height:min(66vmin,420px);margin:6px auto
}

#ring
{
  position:absolute;inset:0;transform:rotate(-90deg)
}

#candle
{
  position:absolute;left:50%;bottom:16%;width:86px;height:190px;transform:translateX(-50%)
}

.wax
{
  position:absolute;bottom:0;width:100%;height:100%;background:linear-gradient(90deg,#c9a789,#f2dcc2 28%,#fbe9d4 50%,#e3c5a6 72%,#b8977a);border-radius:10px 10px 14px 14px;box-shadow:inset -8px 0 14px rgba(120,70,30,.35),inset 8px 0 14px rgba(255,255,255,.5)
}

.wax::before
{
  content:"";position:absolute;top:-7px;left:6px;right:6px;height:16px;background:radial-gradient(ellipse,#fff6e6,#d9b48f);border-radius:50%
}

.drip
{
  position:absolute;top:2px;width:12px;background:linear-gradient(#f2dcc2,#b8977a);border-radius:0 0 8px 8px
}

#wick
{
  position:absolute;left:50%;top:-20px;width:5px;height:24px;background:#1a0f08;transform:translateX(-50%);border-radius:3px
}

#ember
{
  position:absolute;left:50%;top:-24px;width:8px;height:8px;background:#ff9b3d;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 14px 4px rgba(255,120,30,.8);opacity:0
}

#flame
{
  position:absolute;left:50%;bottom:100%;width:54px;height:110px;transform-origin:50% 100%;transform:translateX(-50%) scale(var(--breath))
}

.f
{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);transform-origin:50% 100%
}

.f-glow
{
  width:150px;height:150px;background:radial-gradient(circle,rgba(255,150,50,.75),transparent 65%);filter:blur(14px);mix-blend-mode:screen
}

.f-outer
{
  width:52px;height:96px;background:linear-gradient(#ff9a2e,#ff5a1e 70%,#b81f0e);border-radius:50%/62% 62% 38% 38%;filter:blur(1px)
}

.f-mid
{
  width:32px;height:62px;background:linear-gradient(#ffe27a,#ffb52e);border-radius:50%/60% 60% 40% 40%
}

.f-core
{
  width:15px;height:34px;background:linear-gradient(#fff,#ffec9e);border-radius:50%/60% 60% 40% 40%;filter:blur(.4px)
}

.f-blue
{
  width:20px;height:14px;bottom:-3px;background:radial-gradient(circle,rgba(90,150,255,.9),transparent 70%)
}

#smoke
{
  position:fixed;inset:0;pointer-events:none;z-index:6
}

.controls
{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px
}

.chip
{
  font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;letter-spacing:.14em;border:1px solid rgba(233,216,195,.35);background:transparent;color:var(--parch);border-radius:999px;padding:9px 16px;cursor:pointer
}

.chip.on,.chip:hover
{
  background:var(--parch);color:#2a1710
}

#begin
{
  background:#e9d8c3;color:#2a1710;border:0;border-radius:999px;padding:12px 34px;font-size:13px;letter-spacing:.24em;font-weight:700;cursor:pointer;margin-top:10px
}

#status
{
  font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.18em;margin-top:10px;opacity:.75
}

.hint
{
  font-family:ui-sans-serif,system-ui;font-size:12px;opacity:.55;margin-top:6px
}

@media(max-height:640px)
{
  #stage
{
  width:52vmin;height:52vmin
}
#cue
{
  font-size:26px;min-height:40px
}

}

@media(prefers-reduced-motion:reduce)
{
  #cue
{
  transition:none
}
.f
{
  animation:none!important
}

}

</style>
</head>
<body>
<div id="room"></div><div id="table"></div><div id="pool"></div><div id="vig"></div>
<canvas id="smoke"></canvas>
<main>
<h1>Still Flame · Breathing Room</h1>
<div id="cue">Rest — settle in</div>
<div id="count">· · ·</div>
<div id="stage">
<svg id="ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="rgba(233,216,195,.18)" stroke-width="3"/><circle cx="100" cy="100" r="72" fill="none" stroke="rgba(233,216,195,.14)" stroke-width="1" stroke-dasharray="3 7"/><circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="#f2a95b" stroke-width="4" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540"/></svg>
<div id="candle"><div class="wax"></div><div class="drip" id="d1" style="left:10px;height:18px"></div><div class="drip" id="d2" style="left:38px;height:26px"></div><div class="drip" id="d3" style="left:62px;height:14px"></div><div id="wick"></div><div id="ember"></div><div id="flame"><div class="f f-glow"></div><div class="f f-outer" id="lOuter"></div><div class="f f-mid" id="lMid"></div><div class="f f-core" id="lCore"></div><div class="f f-blue"></div></div></div>
</div>
<div class="controls" role="tablist"><button class="chip on" data-p="478">4 · 7 · 8</button><button class="chip" data-p="box">BOX 4·4·4·4</button><button class="chip" data-p="calm">CALM 5·7·2</button></div>
<button id="begin">BEGIN</button>
<div id="status">00:00 · 0 CYCLES · LIT</div>
<div class="hint">hold mouse / space to blow out · click candle to relight</div>
</main>
<script>
const root=document.documentElement,cue=document.getElementById('cue'),cnt=document.getElementById('count'),arc=document.getElementById('arc'),fl=document.getElementById('flame'),st=document.getElementById('status');
const P=
{
   '478':[
{
  n:'Breathe in',d:4
}
,
{
  n:'Hold',d:7
}
,
{
  n:'Breathe out',d:8
}
],box:[
{
  n:'Breathe in',d:4
}
,
{
  n:'Hold',d:4
}
,
{
  n:'Breathe out',d:4
}
,
{
  n:'Rest',d:4
}
],calm:[
{
  n:'Breathe in',d:5
}
,
{
  n:'Breathe out',d:7
}
,
{
  n:'Rest',d:2
}
]
}
;
let pat='478',run=false,ph=0,pt=0,elapsed=0,cycles=0,breath=.9,bend=0,blow=0,lit=true,flick=0;
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mkAnim(id,dur)
{
  if(red)return;const s=document.createElement('style');let k=`@keyframes $
{
  id
}

{
  `;for(let i=0;i<=8;i++)k+=`$
{
  i*12.5
}
%
{
  transform:translateX(-50%) translateX($
{
  (Math.random()*6-3).toFixed(1)
}
px) scale($
{
  (0.96+Math.random()*.08).toFixed(3)
}
) skewX($
{
  (Math.random()*4-2).toFixed(1)
}
deg)
}
`;k+='
}
';s.textContent=k;document.head.appendChild(s);const el=document.getElementById(id);el.style.animation=`$
{
  id
}
 $
{
  dur
}
s ease-in-out infinite alternate`;
}

mkAnim('lOuter',1.7);mkAnim('lMid',1.3);mkAnim('lCore',.9);
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>
{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');pat=c.dataset.p;ph=0;pt=0;
}
);
const beg=document.getElementById('begin');beg.onclick=()=>
{
  run=!run;beg.textContent=run?'PAUSE':'BEGIN';if(run&&!lit)relight();
}
;
function ease(t)
{
  return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}

let last=performance.now();
function loop(now)
{
  requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(run&&lit)
{
  const seq=P[pat],cur=seq[ph];pt+=dt;elapsed+=dt;const k=Math.min(1,pt/cur.d);
if(cur.n==='Breathe in')breath=.78+(1.32-.78)*ease(k);if(cur.n==='Breathe out')breath=1.32-(1.32-.78)*ease(k);
cue.textContent=cur.n;cnt.textContent=Math.ceil(cur.d-pt)+' sec';arc.style.strokeDashoffset=540-540*k;
if(pt>=cur.d)
{
  pt=0;ph=(ph+1)%seq.length;if(ph===0)
{
  cycles++;
}

}
 
}

else if(!run)
{
  cue.style.opacity=1;
}

flick+=dt*9;const fl2=red?0:Math.sin(flick)*.04+Math.sin(flick*2.7)*.03;
bend+=(blow-bend)*Math.min(1,dt*4);
const b=lit?breath*(1-.45*bend)+fl2:0.001;
root.style.setProperty('--breath',lit?b.toFixed(3):'0.001');
root.style.setProperty('--bend',bend.toFixed(3));
fl.style.transform=`translateX(-50%) scale($
{
  Math.max(.001,b)
}
) skewX($
{
  -28*bend
}
deg) rotate($
{
  -14*bend
}
deg)`;
const glow=lit?Math.max(.12,(.72+.28*fl2)*(breath/1.1)*(1-.8*bend)):0;
root.style.setProperty('--glow',glow.toFixed(3));
fl.style.opacity=lit?1:0;
const mm=String(Math.floor(elapsed/60)).padStart(2,'0'),ss=String(Math.floor(elapsed%60)).padStart(2,'0');
st.textContent=`$
{
  mm
}
:$
{
  ss
}
 · $
{
  cycles
}
 CYCLES · $
{
  lit?'LIT':'OUT'
}
`;
if(lit)
{
  ['d1','d2','d3'].forEach((id,i)=>
{
  const e=document.getElementById(id);const mx=[34,44,28][i];const h=parseFloat(e.style.height||20)+dt*[.05,.03,.07][i];if(h<mx)e.style.height=h+'px';
}
);
}

drawSmoke(dt);
}

addEventListener('pointerdown',e=>
{
  if(e.target.closest('button'))return;blow=1;
}
);
addEventListener('pointerup',()=>
{
  if(!blowT)blow=0;
}
);
addEventListener('keydown',e=>
{
  if(e.code==='Space')
{
  e.preventDefault();if(!lit)
{
  relight();return;
}
blow=1;
}

}
);
addEventListener('keyup',e=>
{
  if(e.code==='Space')blow=0;
}
);
let blowT=0,blowHold=0;
setInterval(()=>
{
  if(blow&&lit)
{
  blowHold+=.1;if(blowHold>1.5)
{
  extinguish();blowHold=0;
}

}
else blowHold=0;
}
,100);
const sc=document.getElementById('smoke'),sx=sc.getContext('2d');let parts=[];
function rss()
{
  sc.width=innerWidth*Math.min(devicePixelRatio,2);sc.height=innerHeight*Math.min(devicePixelRatio,2);sc.style.width=innerWidth+'px';sc.style.height=innerHeight+'px';
}
rss();addEventListener('resize',rss);
function extinguish()
{
  lit=false;blow=0;run=run;const r=sc.getBoundingClientRect();const cxp=sc.width/2,cyp=sc.height*.42;for(let i=0;i<(red?14:70);i++)parts.push(
{
  x:cxp,y:cyp,vx:(Math.random()-.5)*30,vy:-(40+Math.random()*70),r:8+Math.random()*18,a:.5,ph:Math.random()*7
}
);const em=document.getElementById('ember');em.style.opacity=1;em.style.transition='none';requestAnimationFrame(()=>
{
  em.style.transition='opacity 4s';em.style.opacity=0;
}
);cue.textContent='Blown out — click candle to relight';
}

function relight()
{
  lit=true;fl.style.transform='translateX(-50%) scale(1.5)';setTimeout(()=>
{
  
}
,50);if(!run)
{
  run=true;beg.textContent='PAUSE';
}

}

document.getElementById('candle').addEventListener('click',e=>
{
  e.stopPropagation();if(!lit)relight();
}
);
function drawSmoke(dt)
{
  sx.clearRect(0,0,sc.width,sc.height);parts=parts.filter(p=>p.a>.01);for(const p of parts)
{
  p.ph+=dt;p.x+=(p.vx+Math.sin(p.ph*3)*20)*dt;p.y+=p.vy*dt;p.r+=12*dt;p.a-=dt*(red?.4:.1);sx.globalAlpha=Math.max(0,p.a);const g=sx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'rgba(200,200,200,.8)');g.addColorStop(1,'rgba(200,200,200,0)');sx.fillStyle=g;sx.beginPath();sx.arc(p.x,p.y,p.r,0,7);sx.fill();
}
sx.globalAlpha=1;
}

requestAnimationFrame(loop);
</script>
</body>
</html>
