<!-- PROMPT-BEGIN 056-cube-carousel-3d.html | 056. Halden & Voss — Hexagonal Prism Project Carousel
Original generation prompt (from prompt.md):

Design a single self-contained HTML page for a fictional architecture studio, "Halden & Voss", that presents six built projects on the faces of a large hexagonal prism rendered with CSS 3D transforms. The prism sits centred on a dark concrete stage and rotates around its vertical axis to bring the chosen project poster to the front. Each of the six faces is a tall "project poster" (aspect roughly 1:1.42) built entirely from CSS gradients and geometric pseudo-shapes: an amber ring stroke, a black triangle wedge, a skewed light band with a pale sphere, a ruled grid of steel lines with an amber square, nested offset rectangles on a molten-copper radial gradient, and a dark house silhouette with a thin amber spire on pale paper. Every poster carries an ultra-large serif numeral (01–06) set at roughly 62% of the face width in Georgia / Iowan Old Style / Palatino, a two-line serif title with an italic accent word, a small uppercase letterspaced metadata row (city and year) and a project type line.

Palette: concrete greys #17181a, #2a2b2d, #3b3d40; steel #8b96a3 and #c3cad2; warm amber #e39b3a and deep amber #b86f1c; warm paper #efe9df for text. The page background is a vertical concrete gradient with a subtle SVG fractal-noise grain overlay (data URI, overlay blend) and a large soft radial "ambient light" spot whose colour is the active project's accent and whose position drifts with the rotation angle (x follows sin(angle), y follows cos(2·angle)).

Geometry: faces are positioned with rotateY(i·60deg) translateZ(apothem) where apothem = faceWidth × 0.866. The scene has perspective 1700px with the origin slightly above centre. Below the prism, a second copy of the prism (cloned by JavaScript) is flipped with scaleY(-1), masked with a vertical linear-gradient mask that fades to transparent, lightly blurred and desaturated — a reflective concrete floor. Faces that turn away from the viewer receive a per-face dark "shade" overlay whose opacity is computed from cos(angle + i·60°), so the prism reads as lit from the front.

Motion: rotation is driven by a requestAnimationFrame spring (stiffness 42, damping 9.5) that produces a small elastic overshoot when settling on a face. Dragging horizontally spins the prism directly at 0.35° per pixel; on release the drag velocity is projected forward (clamped to ±2.5 faces) and the target snaps to the nearest face, so it feels like inertia with a magnetic catch. Left/Right arrow keys step faces, number keys 1–6 jump, horizontal wheel/trackpad steps, and a row of thin-line dot indicators (active one widens and turns amber) selects directly. Clicking a face brings it to the front. The lower-left info panel (kicker, large serif title, one-paragraph description, client / material / status facts) swaps content with a masked slide-up text transition whenever the front face changes; a vertical "01 / 06" counter sits on the right. A fixed header shows the studio brand mark (rotated square) and a nav whose links underline from left on hover. Reduced-motion users get instant snapping and no text transitions. The layout adapts to phones by shrinking the face width, moving the controls to a bottom row and hiding the description.

<style>

<body>
<div id="glow"></div>
<header><div class="brand"><span class="mark"></span>HALDEN &amp; VOSS</div>
<nav><a href="#">Works</a><a href="#">Studio</a><a href="#">Journal</a><a href="#">Contact</a></nav></header>
<div id="stage"><div id="rotor"></div></div>
<div id="floor"></div>
<div id="info"><div class="kick" id="k">01 — Concert Hall</div><h2 id="t">Fjord <em>Resonance</em></h2><p id="d">A spruce-lined hall tuned like an instrument above the Oslo fjord.</p>
<div class="facts"><span id="f1">Oslo · 2023</span><span id="f2">Spruce / concrete</span><span id="f3">Built</span></div></div>
<div id="counter"><span id="cN">01</span> / 06</div>
<div id="dots"></div>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FW=innerWidth<700?190:250;
document.documentElement.style.setProperty('--fw',FW+'px');
document.querySelectorAll('.face').forEach(f=>f.style.setProperty('--fw',FW+'px'));
const AP=FW*0.866;document.documentElement.style.setProperty('--ap',AP+'px');
const P=[
 {t:'Fjord <em>Resonance</em>',k:'01 — Concert Hall',d:'A spruce-lined hall tuned like an instrument above the Oslo fjord.',m:['Oslo · 2023','Spruce / concrete','Built'],bg:'radial-gradient(circle at 50% 40%,#e39b3a 0 60px,transparent 61px),linear-gradient(#2b2b26,#141311)',acc:'#e39b3a'},
 {t:'Black <em>Wedge</em>',k:'02 — Gallery',d:'A matte basalt wedge cut open to the north light for rotating shows.',m:['Bergen · 2021','Basalt / steel','Built'],bg:'linear-gradient(135deg,#111 55%,#e39b3a 55.5% 60%,#222 61%)',acc:'#c3cad2'},
 {t:'Light <em>Band</em>',k:'03 — Library',d:'A skewed skylight band drags noon sun across five floors of oak stacks.',m:['Trondheim · 2024','Oak / glass','On site'],bg:'linear-gradient(115deg,transparent 42%,#efe9df 42.5% 55%,transparent 56%),radial-gradient(circle at 70% 30%,#efe9df 0 34px,transparent 35px),linear-gradient(#3b3d40,#17181a)',acc:'#efe9df'},
 {t:'Steel <em>Grid</em>',k:'04 — Atelier',d:'A ruled grid of steel fins shades a working atelier; one amber room glows.',m:['Oslo · 2020','Steel / amber','Built'],bg:'repeating-linear-gradient(0deg,transparent 0 18px,rgba(255,255,255,.25) 18px 19px),repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.25) 18px 19px),linear-gradient(#2a2b2d,#17181a)',acc:'#b86f1c'},
 {t:'Copper <em>Strata</em>',k:'05 — Baths',d:'Nested rectangles step down to copper pools fed by a fjord source.',m:['Stavanger · 2022','Copper / stone','Built'],bg:'radial-gradient(circle at 60% 60%,#e8823a,#7a3a12 60%,#241209)',acc:'#e8823a'},
 {t:'Spire <em>House</em>',k:'06 — Chapel',d:'A dark timber silhouette with a single amber spire on pale paper.',m:['Lofoten · 2025','Timber','Concept'],bg:'linear-gradient(#efe9df 60%,#2b2b26 60.5%)',acc:'#b86f1c'}];
const rotor=document.getElementById('rotor'),dots=document.getElementById('dots'),glow=document.getElementById('glow');
let target=0,angle=0,velA=0,idx=0;
P.forEach((p,i)=>{
 const f=document.createElement('div');f.className='face';f.style.setProperty('--i',i);f.style.setProperty('--fw',FW+'px');f.style.setProperty('--ap',AP+'px');
 f.innerHTML=`<div class="poster" style="background:${p.bg}"><div class="num">${'0'+(i+1)}</div><h3>${p.t}</h3><div class="meta">${p.m[0]} · ${p.m[2]}</div></div><div class="shade"></div>`;
 // extra shapes for some faces
 if(i===3){f.querySelector('.poster').insertAdjacentHTML('beforeend','<div style="position:absolute;right:26px;top:90px;width:44px;height:44px;background:#e39b3a"></div>')}
 if(i===5){f.querySelector('.poster').insertAdjacentHTML('beforeend','<div style="position:absolute;left:50%;bottom:38%;width:2px;height:70px;background:#e39b3a"></div>')}
 f.onclick=()=>go(i);
 rotor.appendChild(f);
 const d=document.createElement('button');d.setAttribute('aria-label','project '+(i+1));if(i===0)d.classList.add('on');d.onclick=()=>go(i);dots.appendChild(d);
});
// floor mirror
const floor=document.getElementById('floor');floor.innerHTML=`<div style="transform:scaleY(-1);transform-style:preserve-3d;position:relative" id="mirror"></div>`;
const mirror=document.getElementById('mirror');mirror.innerHTML=rotor.innerHTML;mirror.style.transform='scaleY(-1)';
mirror.querySelectorAll('.face').forEach(f=>{f.style.cursor='default'});
function go(i){target=-i*60;setInfo(i)}
function setInfo(i){idx=(i+6)%6;const p=P[idx];
 const info=document.getElementById('info');info.classList.remove('swap');void info.offsetWidth;info.classList.add('swap');
 document.getElementById('t').innerHTML=p.t;document.getElementById('k').textContent=p.k;document.getElementById('d').textContent=p.d;
 document.getElementById('f1').textContent=p.m[0];document.getElementById('f2').textContent=p.m[1];document.getElementById('f3').textContent=p.m[2];
 document.getElementById('cN').textContent='0'+(idx+1);
 [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===idx));
 glow.style.background=p.acc;
}
function frame(){
 // spring stiffness 42 damping 9.5
 const F=42,D=9.5,dt=1/60;
 const acc=(target-angle)*F-velA*D;velA+=acc*dt;angle+=velA*dt;
 if(RM){angle=target}
 rotor.style.transform=`rotateX(-6deg) rotateY(${angle}deg)`;
 mirror.style.transform=`scaleY(-1) rotateX(-6deg) rotateY(${angle}deg)`;
 [...rotor.children].forEach((f,i)=>{const a=(angle+i*60)*Math.PI/180;const sh=(1-Math.cos(a))/2*.75;f.querySelector('.shade').style.opacity=sh});
 glow.style.left=(30+Math.sin(angle*Math.PI/180)*22)+'vw';glow.style.top=(8+Math.cos(angle*2*Math.PI/180)*6)+'vh';
 requestAnimationFrame(frame);
}
setInfo(0);frame();
// drag
let sx=null,sv=0,lastA=0,lastT=0;
addEventListener('pointerdown',e=>{sx=e.clientX;lastA=angle;lastT=performance.now()});
addEventListener('pointermove',e=>{if(sx==null)return;const dx=e.clientX-sx;angle=lastA+dx*.35;
 const now=performance.now();sv=(angle-lastA)/Math.max(1,now-lastT)*16;lastA=angle;lastT=now;});
addEventListener('pointerup',()=>{if(sx==null)return;sx=null;
 let faces=sv*8;faces=Math.max(-2.5,Math.min(2.5,faces));
 const cur=Math.round(-angle/60+faces*.2);go(cur);});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.key>='1'&&e.key<='6')go(+e.key-1)});
addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){go(idx+(e.deltaX>0?1:-1))}},{passive:true});
addEventListener('resize',()=>location.reload());
</script>
