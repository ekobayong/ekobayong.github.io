<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karesansui — A Garden of Raked Sand</title>
<style>
*{

margin:0;

padding:0;

box-sizing:border-box

}

body{

height:100svh;

overflow:hidden;

font-family:Iowan Old Style,Palatino,Georgia,ui-serif;

cursor:none

}

#sand{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block

}

#vig{

position:fixed;

inset:0;

pointer-events:none;

box-shadow:inset 0 0 120px rgba(90,70,45,.35)

}

header{

position:fixed;

top:20px;

left:24px;

z-index:5;

pointer-events:none;

animation:up 1s cubic-bezier(.22,1,.36,1)

}

@keyframes up{

from{

transform:translateY(12px);

opacity:0

}

}

h1{

font-size:clamp(22px,2.6vw,34px);

letter-spacing:.08em;

font-weight:400;

color:#2b241c

}

header p{

font-style:italic;

font-size:13px;

color:rgba(43,36,28,.65)

}

#vert{

position:fixed;

right:18px;

top:90px;

writing-mode:vertical-rl;

letter-spacing:.42em;

font-size:11px;

color:rgba(43,36,28,.55);

z-index:5

}

#vert::after{

content:'';

display:block;

width:1px;

height:80px;

background:linear-gradient(180deg,rgba(43,36,28,.5),transparent);

margin:10px auto 0

}

#seal{

position:fixed;

right:22px;

bottom:22px;

width:44px;

height:44px;

background:#b3402a;

color:#f5efe0;

display:grid;

place-items:center;

font-size:24px;

transform:rotate(-3deg);

z-index:5;

box-shadow:0 4px 12px rgba(0,0,0,.25)

}

#tools{

position:fixed;

left:20px;

bottom:20px;

z-index:6;

display:flex;

gap:8px;

align-items:center

}

.pill{

background:rgba(245,239,224,.85);

backdrop-filter:blur(8px);

border:1px solid rgba(43,36,28,.3);

border-radius:999px;

padding:8px 14px;

font-size:13px;

cursor:pointer;

color:#2b241c;

font-family:inherit;

position:relative;

overflow:hidden

}

.pill::before{

content:'';

position:absolute;

inset:0;

background:#2b241c;

transform:translateX(-101%);

transition:transform .3s

}

.pill:hover::before{

transform:none

}

.pill:hover{

color:#f5efe0

}

.pill span{

position:relative

}

.pill[aria-pressed="true"]{

background:#2b241c;

color:#f5efe0

}

#cur{

position:fixed;

width:60px;

height:60px;

margin:-30px;

border:1px solid rgba(43,36,28,.5);

border-radius:50%;

pointer-events:none;

z-index:9;

display:flex;

align-items:center;

justify-content:center;

gap:2px

}

#cur i{

display:block;

width:1px;

height:26px;

background:rgba(43,36,28,.5)

}

#cur.drag{

border-color:#b3402a

}

#cur.drag i{

background:#b3402a

}

#hint{

position:fixed;

left:50%;

top:50%;

transform:translate(-50%,-50%);

z-index:5;

background:rgba(43,36,28,.75);

color:#f5efe0;

font-size:13px;

letter-spacing:.1em;

padding:10px 20px;

border-radius:999px;

pointer-events:none;

font-style:italic

}

@media(max-width:640px){

body{

cursor:auto

}

#cur,#hint,header p{

display:none

}

#vert{

top:12px;

font-size:9px

}

}

@media(prefers-reduced-motion:reduce){

header{

animation:none

}

}
</style>
</head>
<body>
<canvas id="sand"></canvas><div id="vig"></div>
<header><h1>Karesansui</h1><p>sit a while — the sand keeps your thoughts for you.</p></header>
<div id="vert">枯山水 raked sand · three stones · one afternoon</div>
<div id="seal">静</div>
<div id="tools"><button class="pill" data-t="1" aria-pressed="false"><span>❘ 1</span></button><button class="pill" data-t="3" aria-pressed="true"><span>❘❘❘ 3</span></button><button class="pill" data-t="5" aria-pressed="false"><span>❘❘❘❘❘ 5</span></button><button class="pill" id="smooth"><span>Smooth sand</span></button></div>
<div id="cur"><i></i><i></i><i></i></div>
<div id="hint">drag to rake · move the stones · let it be</div>
<script>
const cv=document.getElementById('sand'),ctx=cv.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,sandL,grooveL;
let tines=3;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const stones=[{x:.3,y:.55,rx:.075,ry:.05,rot:-.35,c1:'#5b544b',c2:'#22201c'},{x:.62,y:.42,rx:.055,ry:.04,rot:.6,c1:'#4e463d',c2:'#1d1a16'},{x:.76,y:.68,rx:.09,ry:.055,rot:.1,c1:'#655c52',c2:'#24211d'}];
function buildSand(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
sandL=document.createElement('canvas');sandL.width=W; sandL.height=H;const c=sandL.getContext('2d');
const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#e9dcc3');g.addColorStop(.5,'#e4d4b8');g.addColorStop(1,'#dccbab');c.fillStyle=g;c.fillRect(0,0,W,H);
// grain tile
const t=document.createElement('canvas');t.width=t.height=256;const tc=t.getContext('2d');const id=tc.createImageData(256,256);const r=mulberry(7);
for(let i=0;i<id.data.length;i+=4){const a=Math.pow(r(),2.4)*38;const dk=r()<.5?-1:1;id.data[i]=id.data[i+1]=id.data[i+2]=128;id.data[i+3]=a}tc.putImageData(id,0,0);
c.fillStyle=c.createPattern(t,'repeat');c.fillRect(0,0,W,H);
for(let i=0;i<6;i++){const x=r()*W,y=r()*H,rad=120+r()*220;const rg=c.createRadialGradient(x,y,0,x,y,rad);const warm=i%2===0;rg.addColorStop(0,warm?'rgba(255,246,224,.16)':'rgba(120,100,70,.12)');rg.addColorStop(1,'transparent');c.fillStyle=rg;c.fillRect(x-rad,y-rad,rad*2,rad*2)}
grooveL=document.createElement('canvas');grooveL.width=W;grooveL.height=H;
stones.forEach(s=>{s.px=s.x*W;s.py=s.y*H});
// pre-rake ripples + top wave
const gc=grooveL.getContext('2d');
stones.forEach(s=>{for(let ring=1;ring<=3;ring++){gc.strokeStyle='rgba(120,96,62,.28)';gc.lineWidth=1.6;gc.beginPath();gc.ellipse(s.px,s.py,s.rx*Math.min(W,H)*(1+ring*.28),s.ry*Math.min(W,H)*(1+ring*.28),s.rot,0,7);gc.stroke()}});
gc.strokeStyle='rgba(120,96,62,.22)';for(let x=0;x<W;x+=4){const y=H*.08+Math.sin(x*.02)*10;gc.fillRect(x,y,2,2)}
}
function inStone(x,y,pad=6){const m=Math.min(W,H);for(const s of stones){const dx=x-s.px,dy=y-s.py;const c=Math.cos(-s.rot),si=Math.sin(-s.rot);const lx=dx*c-dy*si,ly=dx*si+dy*c;if((lx*lx)/((s.rx*m+pad)**2)+(ly*ly)/((s.ry*m+pad)**2)<1)return s}return null}
function rakeSeg(x0,y0,x1,y1){const g=grooveL.getContext('2d');const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);if(!len)return;const nx=-dy/len,ny=dx/len;const steps=Math.max(1,Math.floor(len/4));
for(let s=0;s<steps;s++){const t0=s/steps,t1=(s+1)/steps;const ax=x0+dx*t0,ay=y0+dy*t0,bx=x0+dx*t1,by=y0+dy*t1;
for(let k=0;k<tines;k++){const off=(k-(tines-1)/2)*9;const aX=ax+nx*off,aY=ay+ny*off,bX=bx+nx*off,bY=by+ny*off;
if(inStone(bX,bY))continue;
g.lineCap='round';g.strokeStyle='rgba(96,74,46,.30)';g.lineWidth=3.2;g.beginPath();g.moveTo(aX+1.1,aY+1.1);g.lineTo(bX+1.1,bY+1.1);g.stroke();
g.strokeStyle='rgba(255,250,236,.55)';g.lineWidth=2.2;g.beginPath();g.moveTo(aX-1.3,aY-1.3);g.lineTo(bX-1.3,bY-1.3);g.stroke();
g.strokeStyle='rgba(120,96,62,.28)';g.lineWidth=1.6;g.beginPath();g.moveTo(aX,aY);g.lineTo(bX,bY);g.stroke()}}}
let drawing=false,dragS=null,doff=null,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{document.getElementById('hint').style.display='none';const s=inStone(e.clientX,e.clientY,14);
if(s){dragS=s;doff={x:e.clientX-s.px,y:e.clientY-s.py}}else{drawing=true;lx=e.clientX;ly=e.clientY}cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{const cur=document.getElementById('cur');cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';
cur.classList.toggle('drag',!!dragS);
if(dragS){dragS.px=e.clientX-doff.x;dragS.py=e.clientY-doff.y}
else if(drawing){rakeSeg(lx,ly,e.clientX,e.clientY);lx=e.clientX;ly=e.clientY}});
addEventListener('pointerup',()=>{drawing=false;dragS=null});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');tines=+b.dataset.t;const cur=document.getElementById('cur');cur.innerHTML='<i></i>'.repeat(tines)});
document.getElementById('smooth').onclick=()=>{const g=grooveL.getContext('2d');if(reduced){g.clearRect(0,0,W,H);return}let a=1;const f=()=>{a-=.08;grooveL.getContext('2d');ctx.globalAlpha=1;g.save();g.globalCompositeOperation='destination-out';g.fillStyle=`rgba(0,0,0,${.12})`;g.fillRect(0,0,W,H);g.restore();if(a>0)requestAnimationFrame(f)};f()};
function branch(t){ctx.save();ctx.translate(W*.85,H*.1);ctx.strokeStyle='rgba(58,44,26,.16)';ctx.fillStyle='rgba(58,44,26,.16)';ctx.filter='blur(9px)';
if(reduced)t=0;const sway=Math.sin(t/60000)*14+Math.sin(t/170000)*10;
ctx.lineWidth=26;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-60+sway,60,-140+sway,120,-220+sway,170);ctx.stroke();
ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-90+sway,80);ctx.quadraticCurveTo(-160+sway,110,-200+sway,60);ctx.stroke();
ctx.beginPath();ctx.moveTo(-140+sway,130);ctx.quadraticCurveTo(-200+sway,170,-250+sway,140);ctx.stroke();
for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(-80-i*30+sway,50+i*22,26,15,i,0,7);ctx.fill()}
ctx.restore()}
function render(t){ctx.clearRect(0,0,W,H);ctx.drawImage(sandL,0,0,W,H);ctx.drawImage(grooveL,0,0,W,H);
branch(t||0);
// stones
const m=Math.min(W,H);stones.forEach(s=>{ctx.save();ctx.translate(s.px,s.py);ctx.rotate(s.rot);
ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=22;ctx.shadowOffsetX=6;ctx.shadowOffsetY=10;
const g=ctx.createRadialGradient(-s.rx*m*.25,-s.ry*m*.3,4,0,0,s.rx*m*1.2);g.addColorStop(0,s.c1);g.addColorStop(1,s.c2);
ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,s.rx*m,s.ry*m,0,0,7);ctx.fill();
ctx.shadowColor='transparent';ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(-s.rx*m*.3,-s.ry*m*.35,s.rx*m*.4,s.ry*m*.25,-.4,0,7);ctx.fill();
ctx.strokeStyle='rgba(255,250,236,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,s.rx*m+7,s.ry*m+7,0,0,7);ctx.stroke();ctx.restore()});
requestAnimationFrame(render)}
buildSand();addEventListener('resize',buildSand);requestAnimationFrame(render);
</script>
</body>
</html>
