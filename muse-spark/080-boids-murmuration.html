<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmuration — Starlings at Dusk</title>
<style>
:root
{
  --night:0;--amber:#d9a466
}

*
{
  box-sizing:border-box
}
html,body
{
  margin:0;height:100%;overflow:hidden
}

body
{
  font-family:Georgia,"Iowan Old Style",Palatino,serif;color:#f0e6d4
}

#day
{
  position:fixed;inset:0;background:linear-gradient(#2a2f4a,#5a4a6e 38%,#b26a5a 62%,#e3a06a 78%,#f0c48c);z-index:0
}

#day::after
{
  content:"";position:absolute;left:0;right:0;bottom:0;height:36%;background:radial-gradient(70% 100% at 50% 100%,rgba(255,170,90,.7),transparent 70%)
}

#nite
{
  position:fixed;inset:0;background:linear-gradient(#05060c,#0b0f1e 40%,#1a1c33 70%,#2b2540);opacity:var(--night);z-index:1
}

#nite::after
{
  content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 100%,rgba(120,90,200,.4),transparent 70%)
}

#stars
{
  position:fixed;inset:0;z-index:2;opacity:var(--night);pointer-events:none
}

#flock
{
  position:fixed;inset:0;z-index:3;cursor:none
}

#land
{
  position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none
}
#land svg
{
  display:block;width:100%;height:150px
}

#hawk
{
  position:fixed;z-index:5;width:34px;height:20px;pointer-events:none;transition:opacity .3s
}

header
{
  position:fixed;left:22px;top:18px;z-index:10;pointer-events:none
}

header h1
{
  margin:0;font-size:clamp(38px,6vw,74px);font-weight:400
}
header h1 em
{
  color:var(--amber)
}

header p
{
  font-style:italic;opacity:.85;margin:4px 0 0
}

#panel
{
  position:fixed;right:16px;top:16px;z-index:10;width:270px;background:rgba(13,15,20,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px;font-family:ui-monospace,Menlo,monospace;transition:transform .4s
}

#panel.hide
{
  transform:translateX(300px)
}

#panel h4
{
  margin:0 0 10px;font-size:10px;letter-spacing:.3em;color:var(--amber)
}

#panel label
{
  display:block;font-family:Georgia,serif;font-style:italic;font-size:13px;margin:9px 0 2px;color:#e8d9bf
}
#panel label b
{
  font-family:monospace;font-style:normal;color:var(--amber);float:right
}

#panel input
{
  width:100%;-webkit-appearance:none;height:2px;background:rgba(255,255,255,.3);border-radius:2px
}
#panel input::-webkit-slider-thumb
{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--amber);cursor:pointer
}

.btns
{
  display:flex;gap:6px;margin-top:12px
}
.btns button
{
  flex:1;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:8px;font:inherit;font-size:11px;cursor:pointer
}
.btns button:hover
{
  border-color:var(--amber)
}
.btns button.on
{
  background:var(--amber);color:#111
}

#hideB
{
  position:fixed;right:16px;bottom:16px;z-index:10;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(13,15,20,.6);color:#fff;padding:10px 18px;cursor:pointer;font-family:monospace
}

footer
{
  position:fixed;left:22px;bottom:14px;z-index:10;font-family:monospace;font-size:11px;opacity:.75
}

@media(max-width:640px)
{
  #panel
{
  width:calc(100vw - 32px)
}
header h1
{
  font-size:40px
}

}

@media(prefers-reduced-motion:reduce)
{
  *
{
  transition:none!important
}

}

</style>
</head>
<body>
<div id="day"></div><div id="nite"></div><div id="stars"></div>
<canvas id="flock"></canvas>
<div id="land"><svg viewBox="0 0 1600 150" preserveAspectRatio="xMidYMax slice"><ellipse cx="300" cy="150" rx="500" ry="80" fill="#2a2333"/><polygon points="0,120 80,90 150,115 230,85 310,112 400,88 480,114 560,86 650,110 740,84 830,112 920,88 1010,114 1100,86 1200,110 1300,88 1400,112 1500,90 1600,115 1600,150 0,150" fill="#1c1620"/><rect x="0" y="128" width="1600" height="22" fill="#0a0a10"/><g stroke="#0a0a10" stroke-width="6"><line x1="300" y1="60" x2="300" y2="130"/><line x1="800" y1="50" x2="800" y2="130"/><line x1="1300" y1="65" x2="1300" y2="130"/><line x1="270" y1="75" x2="330" y2="75"/><line x1="770" y1="65" x2="830" y2="65"/><line x1="1270" y1="80" x2="1330" y2="80"/></g><path d="M300 75 Q 550 105, 800 65 M800 65 Q 1050 100, 1300 80" stroke="#0a0a10" stroke-width="2" fill="none"/><g fill="#0a0a10"><ellipse cx="340" cy="72" rx="7" ry="5"/><ellipse cx="770" cy="62" rx="7" ry="5"/><ellipse cx="1330" cy="77" rx="7" ry="5"/></g></svg></div>
<svg id="hawk" viewBox="0 0 34 20"><path d="M1 12 Q10 4 17 10 Q24 4 33 12 Q24 10 17 14 Q10 10 1 12" fill="#0a0a10"/></svg>
<header><h1>Murmura<em>tion</em></h1><p>“and the evening folded them into one dark wing.”</p></header>
<div id="panel"><h4>FIELD CONTROLS · <span id="fps">60</span> FPS</h4>
<label>Birds <b id="vN">2500</b></label><input id="rN" type="range" min="500" max="12000" step="100" value="2500">
<label>Cohesion <b id="vC">1.0</b></label><input id="rC" type="range" min="0" max="3" step="0.05" value="1">
<label>Alignment <b id="vA">1.2</b></label><input id="rA" type="range" min="0" max="3" step="0.05" value="1.2">
<label>Separation <b id="vS">1.4</b></label><input id="rS" type="range" min="0" max="3" step="0.05" value="1.4">
<label>Speed <b id="vV">3.5</b></label><input id="rV" type="range" min="1" max="7" step="0.1" value="3.5">
<label>Perception <b id="vP">34</b></label><input id="rP" type="range" min="10" max="80" step="1" value="34">
<label>Dusk → night <b id="vD">0.15</b></label><input id="rD" type="range" min="0" max="1" step="0.01" value="0.15">
<div class="btns"><button id="bP">Pause</button><button id="bS">Step</button><button id="bX">Scatter</button></div>
</div>
<button id="hideB">⟨ panel ⟩</button>
<footer>move = hawk · click = scatter · space = pause · S = scatter</footer>
<script>
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('flock'),ctx=cv.getContext('2d');
let W,H,DPR;function rs()
{
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
}
rs();addEventListener('resize',rs);
const st=document.getElementById('stars');for(let i=0;i<12;i++)
{
  const d=document.createElement('div');d.style.cssText=`position:absolute;left:$
{
  Math.random()*100
}
%;top:$
{
  Math.random()*45
}
%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#fff,transparent 70%)`;st.appendChild(d);
}

let N=2500,CO=1,AL=1.2,SE=1.4,SP=3.5,PR=34,paused=false,step1=false;
let X=new Float32Array(12000),Y=new Float32Array(12000),VX=new Float32Array(12000),VY=new Float32Array(12000);
function seed(n)
{
  for(let i=0;i<n;i++)
{
  X[i]=Math.random()*W;Y[i]=Math.random()*H*.6;const a=Math.random()*7;VX[i]=Math.cos(a)*120;VY[i]=Math.sin(a)*120;
}

}

seed(N);
const $=id=>document.getElementById(id);
$('rN').oninput=e=>
{
  N=+e.target.value;$('vN').textContent=N;seed(N);
}
;
$('rC').oninput=e=>
{
  CO=+e.target.value;$('vC').textContent=CO.toFixed(2);
}
;
$('rA').oninput=e=>
{
  AL=+e.target.value;$('vA').textContent=AL.toFixed(2);
}
;
$('rS').oninput=e=>
{
  SE=+e.target.value;$('vS').textContent=SE.toFixed(2);
}
;
$('rV').oninput=e=>
{
  SP=+e.target.value;$('vV').textContent=SP.toFixed(1);
}
;
$('rP').oninput=e=>
{
  PR=+e.target.value;$('vP').textContent=PR;
}
;
$('rD').oninput=e=>
{
  document.documentElement.style.setProperty('--night',e.target.value);$('vD').textContent=(+e.target.value).toFixed(2);
}
;
document.documentElement.style.setProperty('--night',.15);
$('bP').onclick=()=>
{
  paused=!paused;$('bP').textContent=paused?'Resume':'Pause';$('bP').classList.toggle('on',paused);
}
;
$('bS').onclick=()=>
{
  step1=true;paused=true;$('bP').textContent='Resume';
}
;
$('bX').onclick=()=>scatter(W/2,H/3);
$('hideB').onclick=()=>$('panel').classList.toggle('hide');
addEventListener('keydown',e=>
{
  if(e.code==='Space'&&e.target.tagName!=='INPUT')
{
  e.preventDefault();$('bP').click();
}
if(e.key==='s'||e.key==='S')scatter(W/2,H/3);
}
);
let mx=W/2,my=H/3,mh=false;const hawk=document.getElementById('hawk');
addEventListener('pointermove',e=>
{
  mx=e.clientX;my=e.clientY;hawk.style.left=(mx-17)+'px';hawk.style.top=(my-10)+'px';hawk.style.transform=`rotate($
{
  (VX[0]>0?8:-8)
}
deg)`;
}
);
function scatter(x,y)
{
  for(let i=0;i<N;i++)
{
  const dx=X[i]-x,dy=Y[i]-y,d=Math.hypot(dx,dy)+1;const f=Math.min(600,22000/d);VX[i]+=dx/d*f;VY[i]+=dy/d*f;
}

}

cv.addEventListener('pointerdown',e=>scatter(e.clientX,e.clientY));
// spatial hash
const head=new Int32Array(40000),next=new Int32Array(12000);
function tick(dt,tt)
{
  const cell=Math.max(8,PR);const gw=Math.ceil(W/cell)+2,gh=Math.ceil(H/cell)+2;head.fill(-1,0,gw*gh);
for(let i=0;i<N;i++)
{
  let c=(Math.floor(Y[i]/cell)*gw+Math.floor(X[i]/cell));c=Math.max(0,Math.min(gw*gh-1,c));next[i]=head[c];head[c]=i;
}

const ax=W*(.5+.3*Math.sin(tt*.00021)),ay=H*(.25+.14*Math.sin(tt*.00037+1.3));
const maxV=60*SP,minV=maxV*.45;
for(let i=0;i<N;i++)
{
  let cx0=Math.floor(X[i]/cell),cy0=Math.floor(Y[i]/cell),n=0,sx=0,sy=0,avx=0,avy=0,rx=0,ry=0;
for(let gx2=cx0-1;gx2<=cx0+1;gx2++)for(let gy2=cy0-1;gy2<=cy0+1;gy2++)
{
  if(gx2<0||gy2<0||gx2>=gw||gy2>=gh)continue;let j=head[gy2*gw+gx2],c=0;while(j!==-1&&c<24)
{
  if(j!==i)
{
  const dx=X[j]-X[i],dy=Y[j]-Y[i],d2=dx*dx+dy*dy;if(d2<PR*PR&&d2>.01)
{
  n++;avx+=VX[j];avy+=VY[j];sx+=X[j];sy+=Y[j];const d=Math.sqrt(d2);if(d<PR*.45)
{
  rx-=dx/(d*d)*9000;ry-=dy/(d*d)*9000;
}

}

}
j=next[j];c++;
}

}

let fx=0,fy=0;
if(n)
{
  fx+=(sx/n-X[i])*.35*CO;fy+=(sy/n-Y[i])*.35*CO;fx+=(avx/n-VX[i])*.06*AL;fy+=(avy/n-VY[i])*.06*AL;fx+=rx*.02*SE;fy+=ry*.02*SE;
}

fx+=(ax-X[i])*.12;fy+=(ay-Y[i])*.12;
if(X[i]<80)fx+=(80-X[i])*2;if(X[i]>W-80)fx-=(X[i]-(W-80))*2;if(Y[i]<60)fy+=(60-Y[i])*2;if(Y[i]>H*.7)fy-=(Y[i]-H*.7)*3;
const hdx=X[i]-mx,hdy=Y[i]-my,hd=Math.hypot(hdx,hdy);if(hd<160)
{
  fx+=hdx/(hd+1)*900;fy+=hdy/(hd+1)*900;
}

VX[i]+=fx*dt;VY[i]+=fy*dt;const sp=Math.hypot(VX[i],VY[i])||1;const cl=Math.max(minV,Math.min(maxV,sp));VX[i]*=cl/sp;VY[i]*=cl/sp;X[i]+=VX[i]*dt;Y[i]+=VY[i]*dt;if(X[i]<0)X[i]+=W;if(X[i]>W)X[i]-=W;if(Y[i]<0)Y[i]+=H*.8;if(Y[i]>H*.85)Y[i]=H*.1;
}


}

let last=performance.now(),fpsA=60;
function draw()
{
  ctx.clearRect(0,0,W,H);const night=+$('rD').value;
for(let b=0;b<4;b++)
{
  ctx.beginPath();const dense=b;for(let i=(b*977)%Math.max(1,(N/40|0));i<N;i+=4)
{
  const cx0=Math.floor(X[i]/cell0()),cy0=0;ctx.moveTo(0,0);
}
ctx.stroke();
}

const sz=N>8000?2.2:N>4000?2.8:3.4;
const cols=[`rgba(30,20,30,0.42)`,`rgba(24,16,26,0.6)`,`rgba(16,12,20,0.8)`,`rgba(8,8,14,0.96)`];
for(let b=0;b<4;b++)
{
  ctx.fillStyle=cols[b];ctx.beginPath();for(let i=b;i<N;i+=4)
{
  const a=Math.atan2(VY[i],VX[i]);const s2=sz+(b*.5);const nx=X[i],ny=Y[i];ctx.moveTo(nx+Math.cos(a)*s2*2,ny+Math.sin(a)*s2*2);ctx.lineTo(nx+Math.cos(a+2.5)*s2,ny+Math.sin(a+2.5)*s2);ctx.lineTo(nx+Math.cos(a-2.5)*s2,ny+Math.sin(a-2.5)*s2);ctx.closePath();
}
ctx.fill();
}

}

function cell0()
{
  return 10;
}

function frame(now)
{
  requestAnimationFrame(frame);let dt=Math.min(.033,(now-last)/1000);last=now;if(red)dt*=.5;fpsA+=(1/Math.max(.01,dt)-fpsA)*.05;$('fps').textContent=Math.round(Math.min(99,fpsA));
if(!paused||step1)
{
  const sub=red?1:2;for(let k=0;k<sub;k++)tick(dt/sub,now);step1=false;
}

draw();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
