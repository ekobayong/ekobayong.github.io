<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stillwater — Zen Pomodoro</title>
<style>
:root { --h: 200; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(120vmax 120vmax at 50% -10%, hsl(calc(var(--h) + 40) 28% 16%), hsl(var(--h) 30% 10%));
  color: hsl(var(--h) 30% 94%);
  font-family: ui-sans-serif, system-ui, sans-serif;
  min-height: 100vh;
  transition: background 3s linear;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 12% 30%, #fff8, transparent),
    radial-gradient(1px 1px at 70% 12%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 40% 70%, #fff5, transparent),
    radial-gradient(1px 1px at 85% 80%, #fff7, transparent),
    radial-gradient(1px 1px at 25% 85%, #fff5, transparent);
  opacity: .6;
  pointer-events: none;
}
.wrap {
  display: flex;
  gap: 26px;
  max-width: 980px;
  width: 100%;
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
.stage {
  flex: 1 1 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.brandline { font-size: 11px; letter-spacing: .4em; text-transform: uppercase; opacity: .55; margin-bottom: 10px; }
.modes {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.modes button {
  background: transparent;
  border: 1px solid hsl(var(--h) 20% 94% / .2);
  color: inherit;
  padding: 7px 14px;
  border-radius: 99px;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: .08em;
}
.modes button.on {
  background: hsl(var(--h) 30% 94%);
  color: #111;
}
.ringbox {
  position: relative;
  width: min(78vw, 440px);
  aspect-ratio: 1;
}
.ringbox svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.halo {
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle, hsla(var(--h), 70%, 65%, .28), transparent 65%);
  opacity: 0;
  transition: opacity 1s;
}
body.break .halo {
  opacity: 1;
  animation: breathe 7s ease-in-out infinite;
}
@keyframes breathe {
  50% { transform: scale(1.08); }
}
.center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.modelabel { font-size: 12px; letter-spacing: .34em; text-transform: uppercase; opacity: .6; }
#time {
  font-weight: 200;
  font-size: clamp(64px, 16vw, 112px);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
  font-family: inherit;
  line-height: 1;
}
#time:hover { opacity: .85; }
.hint { font-size: 12px; opacity: .5; }
.dots { display: flex; gap: 10px; margin: 16px 0; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid currentColor; opacity: .5; }
.dots i.done {
  background: hsl(var(--h) 80% 70%);
  box-shadow: 0 0 12px hsl(var(--h) 80% 70%);
  opacity: 1;
  border-color: transparent;
}
.dots i.cur {
  transform: scale(1.4);
  opacity: 1;
}
.btns {
  display: flex;
  gap: 14px;
  align-items: center;
}
.btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid hsl(var(--h) 20% 94% / .2);
  background: hsl(var(--h) 20% 100% / .06);
  backdrop-filter: blur(8px);
  color: inherit;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 20px;
  transition: transform .2s;
}
.btn.main {
  width: 78px;
  height: 78px;
  background: hsl(var(--h) 30% 94%);
  color: #111;
  border: none;
  font-size: 26px;
}
.btn:hover { transform: scale(1.06); }
.btn:hover svg { transform: rotate(-40deg); }
.btn svg { transition: transform .4s; }
kbd {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  border: 1px solid hsl(var(--h) 20% 94% / .2);
  padding: 2px 7px;
  border-radius: 6px;
  opacity: .7;
}
.keys {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
  justify-content: center;
  font-size: 12px;
  opacity: .8;
}
.card {
  flex: 1 1 300px;
  background: hsl(var(--h) 20% 100% / .05);
  border: 1px solid hsl(var(--h) 20% 94% / .12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 22px;
  align-self: flex-start;
}
.card h2 {
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 22px;
  margin-bottom: 4px;
}
.card p.sub {
  font-size: 13px;
  opacity: .6;
  margin-bottom: 10px;
}
.addrow {
  display: flex;
  gap: 8px;
}
.addrow input {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 1px solid hsl(var(--h) 20% 94% / .25);
  color: inherit;
  padding: 10px 4px;
  font-size: 15px;
  outline: none;
}
.addrow button {
  background: hsl(var(--h) 30% 94%);
  border: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  color: #111;
}
ul {
  list-style: none;
  margin-top: 12px;
  display: grid;
  gap: 8px;
}
li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 15px;
}
li .box {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
}
li .box::after {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: currentColor;
  transform: scale(0);
  transition: transform .25s;
}
li.done .box::after {
  transform: scale(1);
}
li.done .lb { opacity: .45; }
li .lb { position: relative; flex: 1; }
li.done .lb::after {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  height: 1px;
  width: 100%;
  background: currentColor;
  animation: strike .3s;
}
@keyframes strike { from { width: 0; } }
li .x { display: none; cursor: pointer; opacity: .6; background: none; border: none; color: inherit; font-size: 16px; }
li:hover .x { display: block; }
.stats {
  margin-top: 14px;
  font-size: 13px;
  opacity: .7;
  font-family: ui-monospace, monospace;
}
.quote { margin-top: 12px; font-family: Georgia, serif; font-style: italic; font-size: 14px; opacity: .65; }
#toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translate(-50%, 80px);
  background: hsl(var(--h) 30% 94%);
  color: #111;
  padding: 12px 22px;
  border-radius: 99px;
  transition: transform .5s;
  font-size: 14px;
  z-index: 20;
}
#toast.show { transform: translate(-50%, 0); }
#bloom {
  position: fixed;
  left: 50%;
  top: 42%;
  width: 120px;
  height: 120px;
  margin: -60px;
  border-radius: 50%;
  background: radial-gradient(circle, hsl(var(--h) 80% 75% / .9), transparent 70%);
  filter: blur(20px);
  transform: scale(.2);
  opacity: 0;
  pointer-events: none;
}
#bloom.go {
  animation: bloom 3.2s ease forwards;
}
@keyframes bloom { 30% { opacity: .9; } 100% { transform: scale(9); opacity: 0; } }
.gleam {
  position: absolute;
  inset: 0;
  animation: spin 14s linear infinite;
  pointer-events: none;
}
.gleam i {
  position: absolute;
  top: -4px;
  left: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 14px #fff;
}
@keyframes spin { to { transform: rotate(360deg); } }
.paused .gleam { animation-play-state: paused; }
@media (max-width: 700px) { .card { flex-basis: 100%; } }
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<div id="bloom"></div>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="brandline">Stillwater · a spa for attention</div>
    <div class="modes">
      <button data-m="focus" class="on">Focus</button>
      <button data-m="short">Short break</button>
      <button data-m="long">Long break</button>
    </div>
    <div class="ringbox">
      <div class="halo"></div>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
        <circle cx="100" cy="100" r="97" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4" stroke-dasharray="1 9.1"/>
        <circle id="prog" cx="100" cy="100" r="88" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0" style="transition:stroke-dashoffset .9s linear"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop id="s1" offset="0" stop-color="#8fd0ff"/>
            <stop id="s2" offset="1" stop-color="#c0a8ff"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="gleam" id="gleam"><i></i></div>
      <div class="center">
        <div class="modelabel" id="modeLb">Focus</div>
        <button id="time" title="Click to edit minutes">25:00</button>
        <div class="hint">click the numerals to edit</div>
      </div>
    </div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="btns">
      <button class="btn" id="bReset" title="Reset (R)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="btn main" id="bMain" title="Start/Pause (Space)">▶</button>
      <button class="btn" id="bSkip" title="Skip (N)">⏭</button>
    </div>
    <div class="keys">
      <span><kbd>space</kbd> start</span>
      <span><kbd>R</kbd> reset</span>
      <span><kbd>N</kbd> skip</span>
      <span><kbd>1/2/3</kbd> modes</span>
    </div>
  </div>
  <aside class="card">
    <h2>What deserves your attention?</h2>
    <p class="sub">One thing at a time. The hue drifts as you stay.</p>
    <div class="addrow">
      <input id="taskIn" placeholder="Name one thing…">
      <button id="taskAdd" title="Add task">+</button>
    </div>
    <ul id="tasks"></ul>
    <div class="stats" id="stats"></div>
    <div class="quote">“Still water runs deep — so does a quiet hour.”</div>
  </aside>
</div>
<div id="toast"></div>
<script>
var lens = { focus: 25, short: 5, long: 15 };
var hues = { focus: 200, short: 150, long: 270 };
var mode = 'focus';
var total = lens[mode] * 60;
var left = total;
var run = false;
var timer = null;
var done = 0;
var focusMin = 0;
var baseH = hues[mode];
function $(id) { return document.getElementById(id); }
var timeEl = $('time');
var prog = $('prog');
var dots = $('dots');
var stage = $('stage');
function paint() {
  var drift = (1 - left / total) * 50;
  var h = baseH + drift;
  document.documentElement.style.setProperty('--h', h);
  $('s1').setAttribute('stop-color', 'hsl(' + (h - 20) + ' 80% 72%)');
  $('s2').setAttribute('stop-color', 'hsl(' + (h + 60) + ' 80% 70%)');
  var m = String(Math.floor(left / 60)).padStart(2, '0');
  var s = String(left % 60).padStart(2, '0');
  timeEl.textContent = m + ':' + s;
  document.title = m + ':' + s + ' · Stillwater';
  prog.style.strokeDashoffset = 553 * (1 - left / total);
  document.body.classList.toggle('break', mode !== 'focus');
  Array.prototype.forEach.call(dots.children, function (d, i) {
    d.className = i < done ? 'done' : (i === done ? 'cur' : '');
  });
  $('modeLb').textContent = mode === 'focus' ? 'Focus' : (mode === 'short' ? 'Short break' : 'Long break');
}
function setMode(m) {
  mode = m;
  baseH = hues[m];
  total = lens[m] * 60;
  left = total;
  stop();
  document.querySelectorAll('.modes button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.m === m);
  });
  paint();
}
document.querySelectorAll('.modes button').forEach(function (b) {
  b.addEventListener('click', function () { setMode(b.dataset.m); });
});
function tick() {
  if (left > 0) {
    left--;
    if (mode === 'focus') focusMin += 1 / 60;
    paint();
    if (left === 0) complete(false);
  }
}
function start() {
  if (run) return;
  ensureAudio();
  run = true;
  $('bMain').textContent = '⏸';
  stage.classList.remove('paused');
  timer = setInterval(tick, 1000);
}
function stop() {
  run = false;
  if (timer) clearInterval(timer);
  $('bMain').textContent = '▶';
  stage.classList.add('paused');
}
$('bMain').addEventListener('click', function () { run ? stop() : start(); });
$('bReset').addEventListener('click', function () { stop(); left = total; paint(); });
$('bSkip').addEventListener('click', function () { complete(true); });
timeEl.addEventListener('click', function () {
  var v = prompt('Minutes for ' + mode + ' (1–120):', lens[mode]);
  var n = parseInt(v, 10);
  if (n >= 1 && n <= 120) {
    lens[mode] = n;
    total = n * 60;
    left = total;
    stop();
    paint();
  }
});
var AC = null;
function ensureAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function chime() {
  if (!AC) return;
  var notes = [261.6, 329.6, 392, 523.25];
  notes.forEach(function (f, i) {
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    var t = AC.currentTime + i * .18;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(.25, t + .03);
    g.gain.exponentialRampToValueAtTime(.001, t + 1.4);
    o.connect(g);
    g.connect(AC.destination);
    o.start(t);
    o.stop(t + 1.5);
  });
}
function toast(m) {
  var t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 3200);
}
function complete(skip) {
  chime();
  var b = $('bloom');
  b.classList.remove('go');
  void b.offsetWidth;
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) b.classList.add('go');
  if (mode === 'focus' && !skip) {
    done = (done + 1) % 4;
    toast('Session complete. Time to rest.');
    setMode(done === 0 ? 'long' : 'short');
    start();
  } else {
    toast(mode === 'focus' ? 'Skipped to break.' : 'Back to focus.');
    setMode('focus');
  }
  renderStats();
}
window.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); run ? stop() : start(); }
  if (e.key === 'r' || e.key === 'R') $('bReset').click();
  if (e.key === 'n' || e.key === 'N') $('bSkip').click();
  if (e.key === '1') setMode('focus');
  if (e.key === '2') setMode('short');
  if (e.key === '3') setMode('long');
});
var seed = ['Breathe before opening inbox', 'Read 20 pages', 'Water the fern'];
var ul = $('tasks');
var tasks = seed.map(function (t) { return { t: t, done: false }; });
function render() {
  ul.innerHTML = '';
  tasks.forEach(function (o, i) {
    var li = document.createElement('li');
    if (o.done) li.className = 'done';
    li.innerHTML = '<span class="box"></span><span class="lb"></span><button class="x">×</button>';
    li.querySelector('.lb').textContent = o.t;
    li.querySelector('.box').addEventListener('click', function () {
      o.done = !o.done;
      render();
    });
    li.querySelector('.x').addEventListener('click', function () {
      tasks.splice(i, 1);
      render();
    });
    ul.appendChild(li);
  });
  renderStats();
}
function renderStats() {
  var d = tasks.filter(function (t) { return t.done; }).length;
  $('stats').textContent = d + '/' + tasks.length + ' done · ' + Math.floor(focusMin) + ' focus min today';
}
function add() {
  var v = $('taskIn').value.trim();
  if (!v) return;
  tasks.push({ t: v, done: false });
  $('taskIn').value = '';
  render();
}
$('taskAdd').addEventListener('click', add);
$('taskIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
stage.classList.add('paused');
render();
paint();
</script>
</body>
</html>
