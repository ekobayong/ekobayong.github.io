<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Keeper's Light — Lighthouse Storm</title>
<style>
*
{
  box-sizing:border-box
}
html,body
{
  margin:0;height:100%;overflow:hidden
}

body
{
  background:linear-gradient(#050a14,#0b1a30 45%,#12314a 75%,#03111b);color:#e9eef5;font-family:Georgia,"Iowan Old Style",Palatino,serif
}

#moon
{
  position:fixed;right:12%;top:8%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e9f1f7,#8fa2b1 70%);box-shadow:0 0 80px 30px rgba(200,220,240,.18);z-index:1
}

.cloud
{
  position:fixed;height:60px;border-radius:50%;filter:blur(18px);z-index:2;pointer-events:none
}

.c1
{
  background:#1a2c44;top:10%;width:60vw;left:-10%;animation:dr1 46s linear infinite
}

.c2
{
  background:#0f1d30;top:20%;width:70vw;left:20%;animation:dr2 70s linear infinite
}

@keyframes dr1
{
  to
{
  transform:translateX(60vw)
}

}
@keyframes dr2
{
  to
{
  transform:translateX(-50vw)
}

}

#scene
{
  position:fixed;inset:0;z-index:3
}

#scene svg
{
  width:100%;height:100%;display:block
}

#beam
{
  position:fixed;z-index:4;pointer-events:none;width:240vmax;height:240vmax;left:0;top:0;background:conic-gradient(from 0deg,rgba(255,217,138,.42) 0deg,rgba(255,217,138,.14) 8deg,transparent 16deg,transparent 180deg,rgba(255,217,138,.42) 180deg,rgba(255,217,138,.14) 188deg,transparent 196deg,transparent 360deg);filter:blur(14px);mix-blend-mode:screen
}

#beam2
{
  position:fixed;z-index:4;pointer-events:none;width:240vmax;height:240vmax;left:0;top:0;background:conic-gradient(from 0deg,rgba(255,200,120,.2) 0deg,transparent 24deg,transparent 180deg,rgba(255,200,120,.2) 180deg,transparent 204deg,transparent 360deg);filter:blur(30px);mix-blend-mode:screen
}

#lampGlow
{
  position:fixed;z-index:4;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,160,.9),transparent 70%);mix-blend-mode:screen;pointer-events:none;animation:pulse 2.4s ease-in-out infinite
}

@keyframes pulse
{
  50%
{
  transform:scale(1.25);opacity:.8
}

}

#rain
{
  position:fixed;inset:0;z-index:5;pointer-events:none
}

#flash
{
  position:fixed;inset:0;background:#cfe4ff;opacity:0;pointer-events:none;z-index:6
}

#title
{
  position:fixed;left:20px;top:18px;z-index:10;max-width:360px
}

#title h1
{
  margin:0;font-size:clamp(28px,4vw,46px);font-weight:400
}
#title h1 em
{
  color:#ffd98a
}

#title p
{
  font-style:italic;opacity:.8;font-size:15px
}

#log
{
  position:fixed;left:20px;bottom:18px;z-index:10;font-style:italic;font-size:14px;opacity:.85;background:rgba(5,12,24,.5);padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1)
}

#panel
{
  position:fixed;right:18px;bottom:18px;z-index:10;background:rgba(5,12,24,.55);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;width:280px;font-family:ui-monospace,Menlo,monospace
}

#panel label
{
  font-size:11px;letter-spacing:.24em
}

input[type=range]
{
  width:100%;accent-color:#ffd98a;margin:10px 0
}

.reads
{
  display:flex;justify-content:space-between;font-size:12px;margin:6px 0 12px
}

.row
{
  display:flex;gap:8px
}
.row button
{
  flex:1;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:9px;cursor:pointer;font:inherit;font-size:12px
}

.row button.on
{
  background:#ffd98a;color:#111;font-weight:800
}

.shake
{
  animation:shk .6s
}

@keyframes shk
{
  20%
{
  transform:translate(-8px,4px)
}
40%
{
  transform:translate(7px,-5px)
}
60%
{
  transform:translate(-5px,-3px)
}
80%
{
  transform:translate(4px,3px)
}

}

@media(max-width:640px)
{
  #title
{
  max-width:60vw
}
#panel
{
  width:calc(100vw - 36px)
}
#log
{
  display:none
}

}

@media(prefers-reduced-motion:reduce)
{
  .c1,.c2,#lampGlow
{
  animation:none
}
#beam,#beam2
{
  display:none
}

}

</style>
</head>
<body>
<div id="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<div id="scene"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="rk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2632"/><stop offset="1" stop-color="#070b12"/></linearGradient><linearGradient id="tw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c535d"/><stop offset=".4" stop-color="#e8ebef"/><stop offset=".6" stop-color="#b3bac4"/><stop offset="1" stop-color="#4c535d"/></linearGradient></defs>
<polygon points="0,700 220,620 420,660 640,600 900,660 1150,610 1400,660 1600,620 1600,900 0,900" fill="url(#rk)"/>
<path id="sea2" fill="#0a2a3a" opacity=".9"/><path id="sea1" fill="#10384a"/><path id="foam" fill="none" stroke="rgba(220,240,255,.7)" stroke-width="3"/>
<g id="house"><rect x="880" y="600" width="120" height="70" fill="#141a24" stroke="#2a3442"/><polygon points="880,600 940,560 1000,600" fill="#0b0f16"/><rect id="win" x="928" y="620" width="24" height="28" fill="#ffe7a8"><animate attributeName="opacity" values="1;.6;1" dur="2.2s" repeatCount="indefinite"/></rect></g>
<g id="light"><polygon points="560,680 640,680 620,420 580,420" fill="url(#tw)"/><rect x="575" y="480" width="50" height="26" fill="#5a1c1c"/><rect x="572" y="560" width="56" height="26" fill="#c13a34"/><rect x="569" y="630" width="62" height="26" fill="#9a2c28"/><rect x="578" y="660" width="44" height="22" rx="4" fill="#0b0e13"/><ellipse id="lamp" cx="600" cy="398" rx="26" ry="22" fill="#ffd98a" stroke="#3a2c10" stroke-width="4"/><path d="M572 398h56M600 376v44" stroke="#3a2c10" stroke-width="3"/><polygon points="570,376 630,376 612,344 588,344" fill="#0b0e13"/><circle cx="600" cy="336" r="6" fill="#c13a34"/><rect x="560" y="404" width="80" height="8" fill="#1a1e26"/></g>
</svg></div>
<div id="beam"></div><div id="beam2"></div><div id="lampGlow"></div>
<canvas id="rain"></canvas><div id="flash"></div>
<div id="title"><h1>The Keeper's <em>Light</em></h1><p>A night storm off Blackrock Point — hold fast, keep the lamp turning.</p></div>
<div id="log">Log: wind rising, gulls gone quiet…</div>
<div id="panel"><label>STORM INTENSITY — <span id="iv">55%</span></label><input id="storm" type="range" min="15" max="100" value="55"><div style="display:flex;justify-content:space-between;font-size:10px"><span>CALM</span><span>GALE</span></div><div class="reads"><span>WIND <b id="rW">32kn</b></span><span>SWELL <b id="rS">4.1m</b></span><span>RAIN <b id="rR">—</b></span></div><div class="row"><button id="fog" aria-pressed="false">🔊 FOGHORN OFF</button><button id="bolt">⚡ STRIKE</button></div></div>
<script>
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('rain'),cx=cv.getContext('2d');
function rs()
{
  cv.width=innerWidth*Math.min(devicePixelRatio,2);cv.height=innerHeight*Math.min(devicePixelRatio,2);cx.setTransform(Math.min(devicePixelRatio,2),0,0,Math.min(devicePixelRatio,2),0,0);
}
rs();addEventListener('resize',rs);
let storm=.55,beamA=0,drops=[],spray=[],t=0,fogOn=false,fogT=null;
const s1=document.getElementById('sea1'),s2=document.getElementById('sea2'),fm=document.getElementById('foam');
function wave(d,amp,sp)
{
  let p=`M-20 $
{
  d
}
 `;for(let x=-20;x<=1620;x+=20)
{
  const y=d+Math.sin(x*.012+t*sp)*amp+Math.sin(x*.03+t*sp*1.7)*amp*.4;p+=`L$
{
  x
}
 $
{
  y.toFixed(1)
}
 `;
}
return p+'L1620 920 L-20 920 Z';
}

const beam=document.getElementById('beam'),beam2=document.getElementById('beam2'),glow=document.getElementById('lampGlow');
function anchor()
{
  const l=document.getElementById('lamp').getBoundingClientRect();const bx=l.left+l.width/2,by=l.top+l.height/2;for(const b of [beam,beam2])
{
  b.style.left=(bx-120*Math.max(innerWidth,innerHeight)/100)+'px';b.style.top=(by-120*Math.max(innerWidth,innerHeight)/100)+'px';
}
glow.style.left=(bx-40)+'px';glow.style.top=(by-40)+'px';return 
{
  bx,by
}
;
}

let LP=anchor();addEventListener('resize',()=>LP=anchor());
function mkDrops()
{
  const n=Math.round(60+storm*(red?300:1400));drops=[];for(let i=0;i<n;i++)drops.push(
{
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:10+Math.random()*22+storm*20,s:500+storm*900
}
);document.getElementById('rR').textContent=n;
}

mkDrops();
document.getElementById('storm').oninput=e=>
{
  storm=e.target.value/100;document.getElementById('iv').textContent=e.target.value+'%';mkDrops();log();
}
;
function log()
{
  const m=storm<.3?'Log: a quiet night — lamp steady, sea like glass.':storm<.6?'Log: wind rising, gulls gone quiet…':storm<.85?'Log: gale howling — spray over the gallery rail!':'Log: HOLD FAST — mountainous seas, light never fails!';document.getElementById('log').textContent=m;document.getElementById('rW').textContent=Math.round(8+storm*52)+'kn';document.getElementById('rS').textContent=(1+storm*7).toFixed(1)+'m';
}

log();
const fogB=document.getElementById('fog');let AC=null;
fogB.onclick=()=>
{
  fogOn=!fogOn;fogB.classList.toggle('on',fogOn);fogB.textContent=fogOn?'🔊 FOGHORN ON':'🔊 FOGHORN OFF';fogB.setAttribute('aria-pressed',fogOn);if(fogOn)
{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=68;g.gain.value=.0001;o.connect(g);g.connect(AC.destination);o.start();fogT=setInterval(()=>
{
  g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+.4);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+2.2);
}
,3200);fogB._n=
{
  o,g
}
;
}
else
{
  clearInterval(fogT);try
{
  fogB._n.g.gain.value=.0001;fogB._n.o.stop();
}
catch(e)
{
  
}

}

}
;
function strike()
{
  const f=document.getElementById('flash');f.style.transition='none';f.style.opacity=.85;setTimeout(()=>
{
  f.style.transition='opacity .4s';f.style.opacity=0;
}
,90);setTimeout(()=>
{
  f.style.opacity=.4;setTimeout(()=>f.style.opacity=0,120);
}
,220);setTimeout(()=>
{
  if(!red)
{
  document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');
}

}
,450+Math.random()*500);
}

document.getElementById('bolt').onclick=strike;addEventListener('pointerdown',e=>
{
  if(e.target.closest('#panel'))return;strike();
}
);
setInterval(()=>
{
  if(Math.random()<storm*.5)strike();
}
,6000);
let last=performance.now();
function frame(now)
{
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt*(0.6+storm*1.8);if(!red)beamA+=dt*38;
const ang=red?0:beamA*Math.PI/180;beam.style.transform=`rotate($
{
  beamA
}
deg)`;beam2.style.transform=`rotate($
{
  beamA
}
deg)`;
LP=LP||anchor();
s1.setAttribute('d',wave(700,6+storm*22,1.2));s2.setAttribute('d',wave(740,8+storm*28,1.6));
let fd=`M-20 700 `;for(let x=-20;x<=1620;x+=20)
{
  const y=700+Math.sin(x*.012+t*1.2)*(6+storm*22)+Math.sin(x*.03+t*2)*(3+storm*9);fd+=`L$
{
  x
}
 $
{
  y.toFixed(1)
}
 `;
}
fm.setAttribute('d',fd);
cx.clearRect(0,0,innerWidth,innerHeight);const wind=(storm-.4)*220;
cx.lineWidth=1.2;
for(const d of drops)
{
  d.y+=d.s*dt;d.x+=wind*dt;if(d.y>innerHeight)
{
  d.y=-20;d.x=Math.random()*innerWidth;
}

const a=Math.atan2(d.s,wind||1);const inBeam=Math.abs(((Math.atan2(d.y-LP.by,d.x-LP.bx)*180/Math.PI-beamA%360+540)%360)-180)<14||Math.abs(((Math.atan2(d.y-LP.by,d.x-LP.bx)*180/Math.PI-beamA%360+720)%360)-180)<14;
cx.strokeStyle=inBeam?'rgba(255,220,150,.85)':'rgba(170,200,230,.4)';cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x-Math.sin(a)*0+d.l*wind/900,d.y-d.l);cx.stroke();
}

if(Math.random()<storm*.9)spray.push(
{
  x:innerWidth*.35+Math.random()*innerWidth*.3,y:innerHeight*.78,vx:(Math.random()-.5)*120,vy:-(120+Math.random()*220),l:1
}
);
spray=spray.filter(p=>p.l>0);for(const p of spray)
{
  p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*.8;cx.fillStyle='rgba(210,235,250,.6)';cx.fillRect(p.x,p.y,3,3);
}


}

requestAnimationFrame(frame);setTimeout(()=>LP=anchor(),400);
</script>
</body>
</html>
