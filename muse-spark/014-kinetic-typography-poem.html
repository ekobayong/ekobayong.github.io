<!DOCTYPE html>
<!-- PROMPT-BEGIN 014-kinetic-typography-poem.html | 014. Nocturne for the Sea — Scroll-Driven Kinetic Poem
Original generation prompt (from prompt.md):

Write and typeset an original nine-stanza poem about the sea at night ("Nocturne for the Sea") as a single self-contained HTML page where scrolling is the choreography. The page is a warm black (#0e0c0b) with bone-white text (#ece6d9, dimmed variant rgba(236,230,217,0.42)) and a single accent of deep sea teal (#146c73 with a brighter #2aa3ab for glows and highlights). Type is a serif system stack (Georgia, Iowan Old Style, Palatino, Book Antiqua, ui-serif) at a fluid size clamp(1.5rem, 1rem + 3.6vw, 4.4rem) with 1.22 line-height and balanced wrapping inside a 22ch column; labels use a tracked uppercase sans stack (ui-sans-serif, system-ui, Helvetica Neue) at 10–11px with 0.22–0.32em letter-spacing. Each stanza is a full-viewport (100svh) grid-centered section with a small teal roman numeral above it that fades in as the stanza centers.

Atmosphere: a fixed moon (radial gradient from #f7f1e1 through #d8d0bd to #8f8877 with two crater shadows and a double bone glow) that rises off-screen, shrinks and dims as global scroll progress increases; a fixed blurred teal "water" glow along the bottom that swells slowly on an 11-second alternating loop and grows stronger toward the end of the poem; and a faint overlay film grain made from two repeating radial gradients at 6% opacity with overlay blending. A vertical progress rail on the right shows a 1px track with a glowing teal fill proportional to scroll, nine clickable dots that scale up when current or hovered, and a vertical "III / IX" counter. A "Scroll" hint with a dripping line animation fades out immediately once scrolling begins.

Choreography, one per stanza, driven by two CSS custom properties written per frame by JavaScript — ––t (a smoothstep of how centered the section is in the viewport) and ––p (monotonic 0→1 as the section travels through the viewport) — plus an IntersectionObserver that toggles an .in class at 35% visibility for staggered entrance transitions: (I) letters split into spans rise from 1.1em below with an 8° tilt, staggered 26ms per letter; (II) words slide in from opposite sides, odd from −30vw and even from +30vw, staggered 55ms; (III) letter-spacing stretches continuously to 0.42em with scroll while the final italic line stays tight; (IV) lines hinge up in 3D from 85° rotateX with 900px perspective and a translateZ recede, bottom-origin; (V) text is filled like liquid using background-clip: text with a gradient whose teal lower half rises through the glyphs as ––p increases; (VI) words surface from a 14px blur and 1.25 scale, staggered 70ms; (VII) words are scattered with random per-word offsets (up to ±30vw, ±25vh, ±30°) stored in custom properties and converge to their places as ––t approaches 1; (VIII) letters ripple with a CSS sin() wave whose phase is driven by ––p and letter index, damping as the stanza centers, with the phrase "almost your name." in teal; (IX) the closing lines scale from 1.35 to 1 and tighten their tracking from 0.2em as they arrive, with the phrase "dripping light." in teal and a small colophon beneath. Arrow keys, Page Up/Down and Space step between stanzas. Under prefers-reduced-motion, all text is shown settled with no transitions and the water and hint animations stop.
PROMPT-END -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne for the Sea — A Kinetic Poem</title>
<style>
*{

margin:0;

padding:0;

box-sizing:border-box

}

:root{

--bone:#ece6d9;

--dim:rgba(236,230,217,.42);

--teal:#146c73;

--glow:#2aa3ab;

--bg:#0e0c0b

}

body{

background:var(--bg);

color:var(--bone);

font-family:Georgia,Iowan Old Style,Palatino,Book Antiqua,ui-serif;

overflow-x:hidden

}

#moon{

position:fixed;

left:12%;

width:130px;

height:130px;

border-radius:50%;

background:radial-gradient(circle at 38% 32%,#f7f1e1,#d8d0bd 45%,#8f8877 80%);

box-shadow:0 0 60px 18px rgba(236,230,217,.18),0 0 140px 50px rgba(236,230,217,.08);

z-index:1

}

#moon::after{

content:'';

position:absolute;

inset:0;

border-radius:50%;

background:radial-gradient(circle at 60% 55%,rgba(0,0,0,.25) 0 10px,transparent 11px),radial-gradient(circle at 40% 65%,rgba(0,0,0,.22) 0 14px,transparent 15px)

}

#water{

position:fixed;

left:-10%;

right:-10%;

bottom:-12vh;

height:34vh;

background:radial-gradient(60% 90% at 50% 100%,rgba(20,108,115,.55),transparent 70%);

filter:blur(30px);

z-index:1;

animation:swell 11s ease-in-out infinite alternate

}

@keyframes swell{

to{

transform:scaleY(1.25);

opacity:.85

}

}

#grain{

position:fixed;

inset:0;

z-index:3;

pointer-events:none;

opacity:.06;

mix-blend-mode:overlay;

background:repeating-radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1px 4px),repeating-radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 1px 5px)

}

main{

position:relative;

z-index:2

}

section{

min-height:100svh;

display:grid;

place-items:center;

padding:0 20px;

text-align:center

}

.stanza{

max-width:22ch;

font-size:clamp(1.5rem,1rem + 3.6vw,4.4rem);

line-height:1.22;

text-wrap:balance

}

.num{

font-family:ui-sans-serif,system-ui,Helvetica Neue,sans-serif;

font-size:11px;

letter-spacing:.32em;

color:var(--glow);

margin-bottom:18px;

opacity:0;

transition:opacity 1s

}

section.in .num{

opacity:1

}

.teal{

color:var(--glow)

}

/* choreography pieces */
.s1 .ch{

display:inline-block;

transform:translateY(1.1em) rotate(8deg);

opacity:0;

transition:transform .7s,opacity .7s

}

section.in.s1 .ch{

transform:none;

opacity:1

}

.s2 .w{

display:inline-block;

opacity:0;

transition:transform .8s,opacity .8s

}

section.in.s2 .w:nth-child(odd){

transform:translateX(-30vw)

}

section.in.s2 .w:nth-child(even){

transform:translateX(30vw)

}

section.in.s2.in2 .w{

transform:none!important;

opacity:1

}

.s4 .ln{

display:block;

transform:perspective(900px) rotateX(85deg) translateZ(-60px);

transform-origin:bottom;

opacity:0;

transition:transform .9s,opacity .9s

}

section.in.s4 .ln{

transform:none;

opacity:1

}

.s5 .fill{

background:linear-gradient(180deg,var(--bone) 50%,var(--bone) 50%),linear-gradient(180deg,var(--bone),var(--teal));

background-size:100% 100%;

-webkit-background-clip:text;

background-clip:text

}

.s6 .w{

display:inline-block;

filter:blur(14px);

transform:scale(1.25);

opacity:0;

transition:all .8s

}

section.in.s6 .w{

filter:none;

transform:none;

opacity:1

}

.s9 .big{

transition:transform .2s linear,letter-spacing .2s linear

}

#rail{

position:fixed;

right:16px;

top:50%;

transform:translateY(-50%);

z-index:5;

display:flex;

flex-direction:column;

align-items:center;

gap:10px

}

#track{

width:1px;

height:180px;

background:rgba(236,230,217,.2);

position:relative

}

#fill{

position:absolute;

top:0;

left:0;

width:100%;

background:var(--glow);

box-shadow:0 0 8px var(--glow);

height:0

}

.dot{

width:8px;

height:8px;

border-radius:50%;

border:1px solid var(--dim);

cursor:pointer;

background:transparent;

padding:0

}

.dot.cur,.dot:hover{

transform:scale(1.6);

background:var(--glow);

border-color:var(--glow)

}

#cnt{

font-family:ui-sans-serif,system-ui;

font-size:10px;

letter-spacing:.22em;

writing-mode:vertical-rl;

color:var(--dim)

}

#hint{

position:fixed;

bottom:26px;

left:50%;

transform:translateX(-50%);

z-index:5;

font-family:ui-sans-serif,system-ui;

font-size:10px;

letter-spacing:.3em;

text-transform:uppercase;

color:var(--dim)

}

#hint::after{

content:'';

display:block;

width:1px;

height:34px;

margin:8px auto 0;

background:var(--glow);

animation:drip 1.6s ease-in-out infinite

}

@keyframes drip{

from{

transform:scaleY(0);

transform-origin:top

}

50%{

transform:scaleY(1)

}

to{

transform:scaleY(0);

transform-origin:bottom

}

}

header{

min-height:100svh;

display:grid;

place-items:center;

text-align:center;

position:relative;

z-index:2

}

header h1{

font-size:clamp(2.4rem,6vw,5rem);

font-weight:400

}

header p{

color:var(--dim);

font-family:ui-sans-serif,system-ui;

font-size:11px;

letter-spacing:.3em;

margin-top:14px;

text-transform:uppercase

}

footer{

text-align:center;

padding:60px 20px;

color:var(--dim);

font-size:13px;

font-style:italic;

position:relative;

z-index:2

}

@media(prefers-reduced-motion:reduce){

#water,#hint::after{

animation:none

}

.s1 .ch,.s2 .w,.s4 .ln,.s6 .w{

transform:none!important;

opacity:1!important;

filter:none!important

}

}
</style>
</head>
<body>
<div id="moon"></div><div id="water"></div><div id="grain"></div>
<nav id="rail" aria-label="Poem progress"><div id="cnt">I / IX</div><div id="track"><div id="fill"></div></div><div id="dots" style="display:flex;flex-direction:column;gap:10px"></div></nav>
<div id="hint">Scroll</div>
<header><div><h1>Nocturne <em class="teal">for the Sea</em></h1><p>nine tides · scroll slowly</p></div></header>
<main id="main"></main>
<footer>dripping light. — written for the night water · MMXXVI</footer>
<script>
const ST=[["The harbour loosens","its iron belt,","and night comes in","on bare feet."],["Wind carries salt","from far // afar —","every window","a drowned star."],["The tide rehearses","its slow refrain,","spelling and respelling","the shore again."],["O moon, pale keeper","of the drowned bell —","your light leans down","into the swell."],["The water fills","each hollow word","with teal and silver,","tide // stirred."],["Out of the fog","a hull appears,","surfacing softly","through salted years."],["Scatter, gather —","gulls, bells, foam:","every wave","finds its home."],["Listen: the dark","says almost your name.","Hold it gently —","a moth, a flame."],["Sleep now, swimmer.","The sea will keep","dripping light.","into your sleep."]];
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX'];
const main=document.getElementById('main');
ST.forEach((lines,i)=>{const s=document.createElement('section');s.className='s'+(i+1);s.id='st'+i;
let inner=`<div><div class="num">${ROM[i]}</div><div class="stanza">`;
if(i===0){inner+=[...ST[0].join(' ')].map((c,k)=>`<span class="ch" style="transition-delay:${k*26}ms">${c===' '?'&nbsp;':c}</span>`).join('')}
else if(i===1){inner+=ST[1].join(' ').split(' ').map((w,k)=>`<span class="w" style="transition-delay:${k*55}ms">${w}</span> `).join('')}
else if(i===2){inner+=ST[2].map(l=>`<div>${l}</div>`).join('')}
else if(i===3){inner+=ST[3].map((l,k)=>`<span class="ln" style="transition-delay:${k*150}ms">${l}</span>`).join('')}
else if(i===4){inner+=`<span class="fill">${ST[4].join('<br>')}</span>`}
else if(i===5){inner+=ST[5].join(' ').split(' ').map((w,k)=>`<span class="w" style="transition-delay:${k*70}ms">${w}</span> `).join('')}
else if(i===6){inner+=ST[6].join(' ').split(' ').map(w=>{const x=(Math.random()*60-30).toFixed(1),y=(Math.random()*50-25).toFixed(1),r=(Math.random()*60-30).toFixed(0);return `<span class="w6" data-x="${x}" data-y="${y}" data-r="${r}" style="display:inline-block">${w}</span> `}).join('')}
else if(i===7){const t=ST[7].join(' ').replace('almost your name.','<span class="teal">almost your name.</span>');inner+=t.split('').map(c=>`<span class="c8">${c===' '?'&nbsp;':c}</span>`).join('')}
else{inner+=ST[8].join('<br>').replace('dripping light.','<span class="teal">dripping light.</span>')+'<div style="font-size:12px;color:rgba(236,230,217,.42);margin-top:18px;font-family:ui-sans-serif,system-ui;letter-spacing:.2em">· COLOPHON · SET IN GEORGIA ·</div>'}
inner+='</div></div>';s.innerHTML=inner;main.appendChild(s)});
const secs=[...document.querySelectorAll('section')];
const dots=document.getElementById('dots');
secs.forEach((s,i)=>{const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Go to stanza '+(i+1));d.onclick=()=>s.scrollIntoView({behavior:'smooth'});dots.appendChild(d)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.intersectionRatio>.35){e.target.classList.add('in');setTimeout(()=>e.target.classList.add('in2'),60)}}),{threshold:[.35]});
secs.forEach(s=>io.observe(s));
const moon=document.getElementById('moon'),water=document.getElementById('water'),fill=document.getElementById('fill'),cnt=document.getElementById('cnt'),hint=document.getElementById('hint');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}
function tick(){const vh=innerHeight;let prog=scrollY/(document.body.scrollHeight-vh);
fill.style.height=(prog*100)+'%';
moon.style.top=((1-prog)*70-10)+'vh';const sc=1-prog*.45;moon.style.transform=`scale(${sc})`;moon.style.opacity=1-prog*.55;
water.style.opacity=.5+prog*.5;
hint.style.opacity=scrollY>40?0:1;
secs.forEach((s,i)=>{const r=s.getBoundingClientRect();const center=r.top+r.height/2-vh/2;const t=smooth(vh/2,-vh*.1,Math.abs(center)*-1+vh/2);
const p=Math.min(1,Math.max(0,1-(r.top+r.height)/ (vh+r.height)+ .5));
s.style.setProperty('--t',t.toFixed(3));s.style.setProperty('--p',p.toFixed(3));
if(i===0){s.querySelectorAll('.ch').forEach(el=>{el.style.opacity=t;})}
if(i===2){s.querySelector('.stanza').style.letterSpacing=(p*.42)+'em';s.querySelector('.stanza').lastElementChild.style.letterSpacing='0'}
if(i===4){const el=s.querySelector('.fill');el.style.background=`linear-gradient(180deg, rgba(236,230,217,.25) ${(1-p)*100}%, #2aa3ab ${(1-p)*100+18}%, #ece6d9 ${(1-p)*100+45}%)`;el.style.webkitBackgroundClip='text';el.style.backgroundClip='text';el.style.color='transparent'}
if(i===6){s.querySelectorAll('.w6').forEach(el=>{const k=1-t;el.style.transform=`translate(${el.dataset.x*k}vw,${el.dataset.y*k}vh) rotate(${el.dataset.r*k}deg)`;el.style.opacity=.2+.8*t})}
if(i===7){s.querySelectorAll('.c8').forEach((el,k)=>{if(!reduced)el.style.transform=`translateY(${Math.sin(p*9+k*.7)*(1-t)*14}px)`})}
if(i===8){const b=s.querySelector('.stanza');b.style.transform=`scale(${1.35-.35*t})`;b.style.letterSpacing=((1-t)*.2)+'em'}
const cur=Math.abs(center)<vh/2;dots.children[i].classList.toggle('cur',cur);if(cur)cnt.textContent=ROM[i]+' / IX'});
requestAnimationFrame(tick)}
requestAnimationFrame(tick);
if(reduced){document.querySelectorAll('.w,.ch,.ln').forEach(e=>{e.style.opacity=1;e.style.transform='none'})}
let idx=0;addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)){idx=Math.min(8,idx+1);secs[idx].scrollIntoView({behavior:reduced?'auto':'smooth'});e.preventDefault()}if(['ArrowUp','PageUp'].includes(e.key)){idx=Math.max(0,idx-1);secs[idx].scrollIntoView({behavior:reduced?'auto':'smooth'});e.preventDefault()}});
</script>
</body>
</html>
