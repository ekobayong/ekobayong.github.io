<html lang="en">

<style>

  transform:rotateY(-90deg) translateZ(37px);filter:brightness(.86)

  .block

.front

.back

}

}

@media(prefers-reduced-motion:reduce)

{

</style>

<body>
<div id="glow"></div><div id="beams"></div>
<header><h1 id="ttl">Wooden Blocks</h1><div class="bar"><input id="word" maxlength="12" placeholder="SPELL…" value="PLAY"><button class="hot" id="spell">Spell word ▸</button><button id="add">+ Block</button><button id="shake">Shake table</button><button id="tidy">Tidy up</button></div></header>
<div id="arena"><div id="rug"></div><div id="desk"></div></div>

<script>
const arena=document.getElementById('arena'),toast=document.getElementById('toast');
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
const paints=[['#e85c4e','#c33b30'],['#4a86d6','#2a5fa8'],['#f6cf4a','#e0ad1a'],['#63ad70','#3f8a4d']];
const ttl=document.getElementById('ttl');const txt='Wooden Blocks';ttl.innerHTML=[...txt].map((c,i)=>c===' '?' ':`<span class="c$
{
  i%4
}
">$
{
  c
}
</span>`).join('');
let blocks=[],bid=0;
function size()
{
  return innerWidth<560?60:74;
}

function floorY()
{
  return arena.clientHeight-90-size();
}

function say(m)
{
  toast.textContent=m;toast.classList.add('show');clearTimeout(say._t);say._t=setTimeout(()=>toast.classList.remove('show'),1800);
}

function make(ch,px)
{
  const s=size();const el=document.createElement('div');el.className='block';el.style.width=el.style.height=s+'px';const pi=bid%4;const e2=document.createElement('div');const faces=['front','back','right','left','top','bottom'].map(f=>
{
  const d=document.createElement('div');d.className='face '+f;if(f==='front')
{
  d.innerHTML=`<div class="inset" style="background:linear-gradient($
{
  paints[pi][0]
}
,$
{
  paints[pi][1]
}
)">$
{
  ch
}
</div>`;
}
return d;
}
);faces.forEach(f=>el.appendChild(f));arena.appendChild(el);
const b=
{
  id:bid++,ch,el,x:px??(100+Math.random()*(arena.clientWidth-200)),y:-120-Math.random()*160,vx:(Math.random()-.5)*120,vy:0,rot:(Math.random()-.5)*24,vr:(Math.random()-.5)*60,w:s,h:s,drag:false
}
;blocks.push(b);return b;
}

function spawnWord(w)
{
  w=(w||'PLAY').toUpperCase().replace(/[^A-Z]/g,'').slice(0,12)||'PLAY';const cx=arena.clientWidth/2;[...w].forEach((c,i)=>
{
  setTimeout(()=>make(c,cx+(i-w.length/2)* (size()+8)),red?0:i*110);
}
);say('Spelling “'+w+'” ★');
}

document.getElementById('spell').onclick=()=>spawnWord(document.getElementById('word').value);
document.getElementById('add').onclick=()=>
{
  make(String.fromCharCode(65+Math.floor(Math.random()*26)));say('One more block!');
}
;
document.getElementById('tidy').onclick=()=>
{
  blocks.forEach(b=>
{
  b.el.style.transition='opacity .5s, transform .5s';b.el.style.opacity=0;
}
);setTimeout(()=>
{
  blocks.forEach(b=>b.el.remove());blocks=[];
}
,520);say('All tidy — nice and pine-fresh.');
}
;
function shake()
{
  blocks.forEach(b=>
{
  b.vy=-(500+Math.random()*700);b.vx+=(Math.random()-.5)*900;b.vr+=(Math.random()-.5)*400;
}
);if(!red)arena.animate([
{
  transform:'translateX(0)'
}
,
{
  transform:'translateX(-10px)'
}
,
{
  transform:'translateX(10px)'
}
,
{
  transform:'translateX(0)'
}
],
{
  duration:320,iterations:1
}
);say('Wobble wobble!');
}

document.getElementById('shake').onclick=shake;addEventListener('keydown',e=>
{
  if(e.code==='Space'&&document.activeElement.tagName!=='INPUT')
{
  e.preventDefault();shake();
}

}
);
let dragB=null,dx=0,dy=0,lx=0,ly=0,lt=0;
addEventListener('pointerdown',e=>
{
  const bEl=e.target.closest('.block');if(!bEl)return;dragB=blocks.find(b=>b.el===bEl);if(!dragB)return;dragB.drag=true;dx=e.clientX-dragB.x;dy=e.clientY-dragB.y;lx=e.clientX;ly=e.clientY;lt=performance.now();dragB.el.setPointerCapture?.(e.pointerId);
}
);
addEventListener('pointermove',e=>
{
  if(!dragB)return;dragB.x=e.clientX-dx;dragB.y=e.clientY-dy;const n=performance.now();dragB._vx=(e.clientX-lx)/Math.max(.016,(n-lt)/1000);dragB._vy=(e.clientY-ly)/Math.max(.016,(n-lt)/1000);lx=e.clientX;ly=e.clientY;lt=n;
}
);
addEventListener('pointerup',()=>
{
  if(dragB)
{
  dragB.vx=Math.max(-1200,Math.min(1200,dragB._vx||0));dragB.vy=Math.max(-1200,Math.min(1200,dragB._vy||0));dragB.drag=false;dragB=null;
}

}
);
let last=performance.now();
function loop(now)
{
  requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000);last=now;const G=2200,FY=floorY();
for(const b of blocks)
{
  if(b.drag)
{
  b.vx=0;b.vy=0;
}

else
{
  b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=(1-.4*dt);b.vr+=(0-b.rot)*8*dt;b.vr*=(1-2*dt);b.rot+=b.vr*dt;
if(b.y>FY)
{
  b.y=FY;if(Math.abs(b.vy)>120)b.vr+=(Math.random()-.5)*220;if(b.vy<-80)say('clack!');b.vy*=-.32;b.vx*=.82;if(Math.abs(b.vy)<30)b.vy=0;
}

if(b.x<4)
{
  b.x=4;b.vx*=-.6;
}
if(b.x>arena.clientWidth-b.w-4)
{
  b.x=arena.clientWidth-b.w-4;b.vx*=-.6;
}

}

}

for(let p=0;p<3;p++)for(let i=0;i<blocks.length;i++)for(let j=i+1;j<blocks.length;j++)
{
  const a=blocks[i],b=blocks[j];const ox=(a.w+b.w)/2-Math.abs(a.x-b.x),oy=(a.h+b.h)/2-Math.abs(a.y-b.y);if(ox>0&&oy>0)
{
  if(ox<oy)
{
  const s=(a.x<b.x?-1:1)*ox/2;if(!a.drag)a.x+=s;if(!b.drag)b.x-=s;const t=a.vx;a.vx=b.vx*.9;b.vx=t*.9;
}
else
{
  const s=(a.y<b.y?-1:1)*oy/2;if(!a.drag)a.y+=s;if(!b.drag)b.y-=s;if(s!==0)
{
  const t=a.vy;a.vy=b.vy*.5;b.vy=t*.5;a.vr+=(Math.random()-.5)*80;b.vr+=(Math.random()-.5)*80;
}

}

}

}

for(const b of blocks)
{
  b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';b.el.style.transform=`rotateX(14deg) rotateY(-12deg) rotateZ($
{
  b.rot*.12
}
deg)`;
}


}

spawnWord('PLAY');requestAnimationFrame(loop);
addEventListener('resize',()=>
{
  
}
);
</script>
