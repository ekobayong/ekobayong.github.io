<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>060 · RAIN.TYPE — Typographic Rain</title>
<style>
 * {
  box-sizing:border-box
}
html,body {
  margin:0;
  height:100%;
  overflow:hidden;
  background:#04100c
}
 body {
  font-family:ui-monospace,Menlo,monospace;
  color:#e8fff3
}
 :root {
  --head:#e8fff3;
  --mid:#5cffb0;
  --tail:#0b6b46;
  --bg:#04100c
}
 #rain {
  position:fixed;
  inset:0
}
 .vig {
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55));
  pointer-events:none
}
 .hud {
  position:fixed;
  top:18px;
  left:18px;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  padding:16px;
  width:300px;
  z-index:5
}
 .hud::before,.hud::after {
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  border:2px solid var(--head)
}
 .hud::before {
  top:-2px;
  left:-2px;
  border-right:0;
  border-bottom:0
}
.hud::after {
  bottom:-2px;
  right:-2px;
  border-left:0;
  border-top:0
}
 .hud h1 {
  margin:0;
  font-size:20px;
  letter-spacing:.06em
}
.cur {
  display:inline-block;
  width:10px;
  height:18px;
  background:var(--head);
  vertical-align:-3px;
  animation:blink 1s steps(2) infinite
}
 @keyframes blink {
  50% {
    opacity:0
  }
  
}
 .swatches {
  display:flex;
  gap:8px;
  margin:12px 0
}
 .swatches button {
  flex:1;
  height:30px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:6px;
  cursor:pointer
}
 .swatches button.on {
  outline:2px solid var(--head)
}
 .hud label {
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  display:block;
  margin:10px 0 4px
}
 input[type=range] {
  width:100%;
  accent-color:var(--mid)
}
 .cmd {
  display:flex;
  gap:6px;
  margin-top:8px
}
 .cmd input {
  flex:1;
  background:#000;
  border:1px solid rgba(255,255,255,.25);
  color:var(--head);
  font-family:inherit;
  padding:8px;
  border-radius:6px
}
 .cmd button {
  background:var(--mid);
  border:0;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700
}
 #status {
  font-size:11px;
  margin-top:10px;
  opacity:.85
}
 #stats {
  position:fixed;
  right:16px;
  bottom:14px;
  font-size:11px;
  text-align:right;
  opacity:.75;
  z-index:5;
  background:rgba(0,0,0,.4);
  padding:8px 12px;
  border-radius:8px
}
 #cap {
  position:fixed;
  left:16px;
  bottom:14px;
  font-size:11px;
  opacity:.6;
  z-index:5;
  max-width:300px
}
 @media(max-width:640px) {
  .hud {
    width:calc(100vw - 36px)
  }
  #cap {
    display:none
  }
  
}
 @media(prefers-reduced-motion:reduce) {
  .cur {
    animation:none
  }
  
}
 
/* —— type-lab furniture: legend, help, frames —— */ ::selection {
  background:var(--mid);
  color:#000
}
 button:focus-visible,input:focus-visible {
  outline:2px solid var(--head);
  outline-offset:2px
}
 .legend-row {
  display:flex;
  gap:6px;
  margin-top:10px;
  font-size:10px;
  opacity:.75
}
 .legend-row span {
  border:1px solid rgba(255,255,255,.25);
  padding:4px 9px;
  border-radius:6px
}
 .help {
  position:fixed;
  top:18px;
  right:18px;
  z-index:5;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.14);
   border-radius:10px;
  padding:10px 14px;
  font-size:10.5px;
  line-height:2;
  backdrop-filter:blur(10px)
}
 .help b {
  color:var(--mid);
  font-weight:400
}
 .glyph-strip {
  position:fixed;
  bottom:52px;
  left:50%;
  transform:translateX(-50%);
  z-index:4;
  display:flex;
  gap:4px;
   font-size:13px;
  opacity:.5;
  background:rgba(0,0,0,.35);
  padding:7px 14px;
  border-radius:99px;
  max-width:92vw;
  overflow:hidden
}
 .frame-tl,.frame-tr,.frame-bl,.frame-br {
  position:fixed;
  width:22px;
  height:22px;
  z-index:5;
  opacity:.6;
  pointer-events:none
}
 .frame-tl {
  top:10px;
  left:10px;
  border-top:1px solid var(--head);
  border-left:1px solid var(--head)
}
 .frame-tr {
  top:10px;
  right:10px;
  border-top:1px solid var(--head);
  border-right:1px solid var(--head)
}
 .frame-bl {
  bottom:10px;
  left:10px;
  border-bottom:1px solid var(--head);
  border-left:1px solid var(--head)
}
 .frame-br {
  bottom:10px;
  right:10px;
  border-bottom:1px solid var(--head);
  border-right:1px solid var(--head)
}
 .readme {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:8;
  max-width:420px;
  background:#000;
   border:1px solid var(--mid);
  border-radius:12px;
  padding:22px;
  font-size:12px;
  line-height:1.9;
  display:none
}
 .readme.open {
  display:block
}
 .readme button {
  margin-top:10px
}
 noscript p {
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:#000;
  z-index:40
}
 @media(max-width:640px) {
   .help {
    display:none
  }
   .glyph-strip {
    display:none
  }
   
}
 @media(min-width:2000px) {
   .hud {
    width:340px
  }
   
}
 @media(prefers-contrast:more) {
   .hud {
    background:#000;
    border-color:#fff
  }
   #stats,#cap {
    background:#000;
    color:#fff;
    opacity:1
  }
   
}
 @media print {
   .hud,.help,.glyph-strip {
    display:none
  }
   
}
 
</style>
</head>
<body>
<canvas id="rain"></canvas><div class="vig"></div>
<div class="hud"><h1>Rain.Type <span class="cur"></span></h1>
<div style="font-size:10px;opacity:.6;letter-spacing:.24em">DIGITAL RAIN AS TYPE · 60 GLYPHS</div>
<div class="swatches" id="sw"></div>
<label>Density · <span id="dv">70</span>%</label><input type="range" id="den" min="10" max="100" value="70">
<label>Speed · <span id="sv">1.0</span>×</label><input type="range" id="spd" min="20" max="250" value="100">
<label>Message</label>
<div class="cmd"><input id="msg" placeholder="> type a phrase, press enter" maxlength="40"><button id="go">Resolve</button></div>
<div id="status">ready · press 1–4 for palette</div></div>
<div id="stats">–</div>
<div id="cap">24 invented katakana-like strokes + A–Z + 0–9, drawn in bold monospace with fading tails.</div>
<script>
const cv=document.getElementById('rain'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PALS={Jade:{bg:'#04100c',head:'#e8fff3',mid:'#5cffb0',tail:'#0b6b46'},
 Amber:{bg:'#0d0903',head:'#fff3d6',mid:'#ffb347',tail:'#7a4a0a'},
 Ice:{bg:'#050912',head:'#f4fbff',mid:'#8fd3ff',tail:'#1f4f7a'},
 Rose:{bg:'#0f050a',head:'#ffe9f1',mid:'#ff6fa3',tail:'#7a1f45'}};
let pal='Jade',density=.7,speedM=1;
if(RM){density=.35}
const KATA=['ｱ','ｶ','ｻ','ﾀ','ﾅ','ﾊ','ﾏ','ﾔ','ﾗ','ﾜ','ﾝ','ｼ','ﾁ','ﾄ','ﾉ','ﾋ','ﾐ','ﾘ','ｦ','ｹ','ｾ','ﾃ','ﾈ','ﾍ'];
const GLYPHS=[...KATA,...'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
let W,H,cell=22,cols=0,rows=0,streams=[],locked=new Map(),msg=null,msgState='idle',msgTimer=0;
function applyPal(n){pal=n;const p=PALS[n];document.documentElement.style.setProperty('--bg',p.bg);
 ['head','mid','tail'].forEach(k=>document.documentElement.style.setProperty('--'+k,p[k]));
 document.body.style.background=p.bg;
 [...document.getElementById('sw').children].forEach((b,i)=>b.classList.toggle('on',Object.keys(PALS)[i]===n))}
const sw=document.getElementById('sw');
Object.entries(PALS).forEach(([n,p])=>{const b=document.createElement('button');b.title=n;
 b.style.background=`linear-gradient(90deg,${p.head},${p.mid},${p.tail})`;b.onclick=()=>applyPal(n);sw.appendChild(b)});
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cell=W>2000?26:W<640?18:22;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);
 streams=Array.from({length:cols},(_,i)=>({y:Math.random()*rows,v:6+Math.random()*10,g:rand(),b:Math.random()}));
 locked.clear();msgState='idle'}
addEventListener('resize',resize);
function rand(){return GLYPHS[Math.random()*GLYPHS.length|0]}
const bright=new Map(); // "c,r" -> {g,b}
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,f){return [a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0]}
let last=performance.now(),fps=60;
function frame(now){
 let dt=Math.min(.1,(now-last)/1000);last=now;fps=fps*.95+(1/Math.max(dt,1e-3))*.05;
 const p=PALS[pal],tailC=hexRGB(p.tail),midC=hexRGB(p.mid),headC=hexRGB(p.head);
 ctx.fillStyle=p.bg;ctx.globalAlpha=.28;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.textBaseline='middle';
 const activeN=Math.floor(cols*density);
 // decay
 for(const [k,v] of bright){v.b*=Math.exp(-1.6*dt);if(v.b<.02)bright.delete(k)}
 streams.forEach((s,i)=>{
  if(i>activeN){return}
  // message lock logic
  let target=null;
  if(msg&&msgState==='resolving'){const mi=msg.cols.indexOf(i);if(mi>=0)target=msg.row}
  s.y+=s.v*speedM*dt;
  if(target!=null&&s.y>=target&&!locked.has(i)){
    locked.set(i,{ch:msg.text[mi],pop:now});document.getElementById('status').textContent=`resolving ${locked.size} / ${msg.text.length}`;
    if(locked.size>=msg.text.length){msgState='holding';msgTimer=now;document.getElementById('status').textContent='locked · holding (click to release)'}
    s.y=-2;
  }
  if(s.y>=rows+2){s.y=-2-Math.random()*4;s.g=rand()}
  const r=Math.floor(s.y),c=i;
  if(r>=0&&r<rows){bright.set(c+','+r,{g:rand(),b:1,head:true})}
  // flicker tails
  if(!RM&&Math.random()<.02){const fr=(Math.random()*rows)|0;const k=c+','+fr;if(bright.has(k))bright.get(k).g=rand()}
 });
 // draw cells
 ctx.font=`bold ${cell*.72}px ui-monospace,Menlo,monospace`;
 for(const [k,v] of bright){
  const [c,r]=k.split(',').map(Number);const x=c*cell+cell/2,y=r*cell+cell/2;
  const lock=[...locked.entries()].find(([ci,L])=>ci===c&&msg&&r===msg.row&&L.ch);
  let ch=v.g,sc=1,col;
  if(lock){ch=lock[1].ch;const age=now-lock[1].pop;sc=age<350?1.7-.7*(age/350):1;
   const pulse=.7+.3*Math.sin(now/300);col=`rgba(${headC[0]},${headC[1]},${headC[2]},${pulse})`;
   ctx.save();ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=col;ctx.font=`bold ${cell*.72*sc}px ui-monospace,monospace`;
   ctx.fillText(ch,x,y);ctx.restore();
   ctx.fillStyle=col;ctx.fillRect(x-cell*.32,y+cell*.38,cell*.64,2);continue}
  if(v.b>.75){const f=(v.b-.75)/.25;const m=mix(midC,headC,f);col=`rgba(${m[0]},${m[1]},${m[2]},1)`;ctx.save();ctx.shadowColor=col;ctx.shadowBlur=12;ctx.fillStyle=col;ctx.fillText(ch,x,y);ctx.restore()}
  else if(v.b>.3){const f=(v.b-.3)/.45;const m=mix(tailC,midC,f);col=`rgba(${m[0]},${m[1]},${m[2]},${.35+f*.65})`;ctx.fillStyle=col;ctx.fillText(ch,x,y)}
  else{col=`rgba(${tailC[0]},${tailC[1]},${tailC[2]},${v.b*2})`;ctx.fillStyle=col;ctx.fillText(ch,x,y)}
 }
 // message lifecycle
 if(msgState==='holding'&&now-msgTimer>4500)msgState='dissolving',document.getElementById('status').textContent='dissolving';
 if(msgState==='dissolving'){if(Math.random()<.1&&locked.size){const k=[...locked.keys()][Math.random()*locked.size|0];locked.delete(k)}
  if(!locked.size){msgState='idle';msg=null;document.getElementById('status').textContent='ready · press 1–4 for palette'}}
 document.getElementById('stats').textContent=`${cols}×${rows} · ${activeN} streams · ${fps|0} fps`;
 requestAnimationFrame(frame);
}
function resolve(text){
 text=text.toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,40)||'TYPE IS RAIN';
 text=text.replace(/ /g,'·');
 const row=Math.floor(rows*.46);const start=Math.max(0,((cols-text.length)/2)|0);
 msg={text,row,cols:text.split('').map((_,i)=>start+i).filter(c=>c<cols)};
 locked.clear();msgState='resolving';document.getElementById('status').textContent=`resolving 0 / ${text.length}`;
 streams.forEach((s,i)=>{if(msg.cols.includes(i))s.y=Math.max(-8,row-14-Math.random()*10)});
}
document.getElementById('go').onclick=()=>resolve(document.getElementById('msg').value);
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')resolve(e.target.value)});
cv.addEventListener('click',()=>{if(msgState==='holding'){msgState='dissolving';document.getElementById('status').textContent='dissolving'}});
document.getElementById('den').oninput=e=>{density=e.target.value/100;document.getElementById('dv').textContent=e.target.value};
document.getElementById('spd').oninput=e=>{speedM=e.target.value/100;document.getElementById('sv').textContent=speedM.toFixed(1)};
addEventListener('keydown',e=>{const names=Object.keys(PALS);if(e.key>='1'&&e.key<='4')applyPal(names[+e.key-1])});
resize();applyPal('Jade');
if(RM){document.getElementById('den').value=35;density=.35}
requestAnimationFrame(frame);
setTimeout(()=>resolve('TYPE IS RAIN'),2000);
</script>
</body>
</html>
