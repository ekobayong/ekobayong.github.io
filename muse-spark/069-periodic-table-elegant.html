<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Elements Arranged — Periodic Table</title>
<style>
/* Elegant periodic table */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(ellipse at 50% 0%, #222a3b, #1b2130); color: #d6dcea;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh; padding: 22px 14px 70px;
}
header { max-width: 1240px; margin: 0 auto 12px; }
header h1 {
  font-family: Georgia, 'Iowan Old Style', Palatino, serif; font-weight: 400;
  font-size: clamp(26px, 3.4vw, 44px);
}
header h1 em { color: #8b95a8; }
header p { color: #8b95a8; font-size: 13px; margin-top: 4px; }
.bar { max-width: 1240px; margin: 0 auto 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px; padding: 8px 14px; display: flex; gap: 8px; align-items: center;
}
.search input {
  background: none; border: none; color: #fff; outline: none;
  width: 180px; font-family: inherit; font-size: 13px;
}
.seg {
  background: rgba(255,255,255,0.06); border-radius: 16px; padding: 3px;
  display: flex; border: 1px solid rgba(255,255,255,0.08);
}
.seg button {
  background: none; border: none; color: #d6dcea; padding: 6px 12px;
  border-radius: 12px; cursor: pointer; font-size: 12px; font-family: inherit;
}
.seg button.on { background: #d6dcea; color: #1b2130; font-weight: 700; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 10px; padding: 5px 10px; border-radius: 14px; border: 1px solid;
  cursor: pointer; background: transparent; color: #d6dcea; font-family: inherit;
}
.chip:hover { background: rgba(255,255,255,0.12); }
.chip.on { background: #fff; color: #111; font-weight: 700; }
.chip:focus-visible,
.seg button:focus-visible,
.search input:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  overflow-x: auto;
  position: relative;
  padding-bottom: 8px;
}
.table {
  display: grid;
  grid-template-columns: repeat(18, minmax(46px, 1fr));
  gap: 5px;
  min-width: 920px;
  position: relative;
}
.tile {
  border-radius: 7px;
  padding: 5px 4px 4px;
  text-align: center;
  cursor: pointer;
  border: 1px solid;
  position: relative;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s, opacity 0.3s;
  background: var(--fill);
  border-color: var(--bd);
  min-height: 62px;
  font-family: inherit;
  color: inherit;
}
.tile::before {
  content: "";
  position: absolute;
  top: 0;
  left: 6px;
  right: 6px;
  height: 2px;
  background: var(--cat);
  border-radius: 2px;
}
.tile:hover,
.tile:focus-visible {
  transform: translateY(-5px) scale(1.07);
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
  outline: 1px solid var(--cat);
  z-index: 3;
}
.tile .n {
  font-size: 9px;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
  text-align: left;
}
.tile .s {
  font-family: Georgia, serif;
  font-size: 17px;
  line-height: 1.1;
}
.tile .nm {
  font-size: 7.5px;
  opacity: 0.75;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile.dim {
  opacity: 0.12;
  filter: grayscale(1);
}
.tile.ghost {
  border-style: dashed;
  background: transparent;
  color: #8b95a8;
  cursor: default;
  font-size: 11px;
}
/* detail card in the empty block */
#detail {
  grid-column: 4 / 13;
  grid-row: 1 / 4;
  background: rgba(30, 37, 52, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  min-height: 200px;
  z-index: 5;
}
#detail svg {
  width: 150px;
  height: 150px;
  flex-shrink: 0;
}
#detail h2 {
  font-family: Georgia, serif;
  font-size: 34px;
  color: var(--ec, #fff);
  line-height: 1;
}
#detail .ename {
  font-family: Georgia, serif;
  font-size: 15px;
  margin-top: 2px;
}
#detail .cat {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #8b95a8;
}
#detail dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  font-size: 12px;
  margin-top: 8px;
}
#detail dt {
  color: #8b95a8;
}
#detail dd {
  font-family: 'Courier New', monospace;
}
#detail .close {
  display: none;
}
footer {
  max-width: 1240px;
  margin: 12px auto 0;
  font-size: 12px;
  color: #8b95a8;
  font-family: 'Courier New', monospace;
}
.temp {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
}
.temp input[type="range"] {
  accent-color: #f0b46a;
  width: 160px;
  cursor: pointer;
}
.shell {
  transform-origin: 100px 100px;
  animation: spin linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@media (max-width: 900px) {
  #detail {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    grid-column: auto;
    grid-row: auto;
    aspect-ratio: auto;
    border-radius: 16px 16px 0 0;
    z-index: 50;
    transform: translateY(110%);
    transition: transform 0.4s;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  }
  #detail.show {
    transform: none;
  }
  .tile .nm {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .shell {
    animation: none;
  }
  .tile,
  #detail {
    transition: none;
  }
}
</style>
</head>
<body>
<header>
  <h1>The Elements <em>arranged</em></h1>
  <p>118 specimens &middot; long form &middot; click any tile for its Bohr atom</p>
</header>
<div class="bar">
  <div class="search"><span aria-hidden="true">&#8981;</span><input id="q" placeholder="search name, symbol, number&hellip;" aria-label="Search elements"></div>
  <div class="seg" id="mode" role="group" aria-label="Colour mode">
    <button class="on" data-m="cat">Category</button>
    <button data-m="state">State</button>
  </div>
  <div class="temp">&#127777; <input type="range" id="temp" min="0" max="6000" value="293" aria-label="Temperature in kelvin"><span id="tempv">293 K</span></div>
</div>
<div class="bar"><div class="legend" id="legend"></div></div>
<div class="wrap"><div class="table" id="table"></div></div>
<footer id="count">118 elements shown</footer>
<script>
(function () {

  var cats = {

  };
  var catName = {

    transition: 'transition metal', post: 'post-transition',
    metalloid: 'metalloid', nonmetal: 'reactive nonmetal',
    halogen: 'halogen', noble: 'noble gas',
    lanth: 'lanthanide', act: 'actinide', unknown: 'unknown'
  };
  // symbol, name, mass, category, melt K, boil K (0 = unknown).
  var data = [
    ['H', 'Hydrogen', 1.008, 'nonmetal', 14, 20], ['He', 'Helium', 4.003, 'noble', 1, 4],
    ['Li', 'Lithium', 6.94, 'alkali', 454, 1615], ['Be', 'Beryllium', 9.012, 'alkaline', 1560, 2742],

    ['Cu', 'Copper', 63.546, 'transition', 1358, 2835], ['Zn', 'Zinc', 65.38, 'transition', 693, 1180],
    ['Ga', 'Gallium', 69.723, 'post', 303, 2477], ['Ge', 'Germanium', 72.63, 'metalloid', 1211, 3106],
    ['As', 'Arsenic', 74.922, 'metalloid', 1090, 887], ['Se', 'Selenium', 78.971, 'nonmetal', 494, 958],
    ['Br', 'Bromine', 79.904, 'halogen', 266, 332], ['Kr', 'Krypton', 83.798, 'noble', 116, 120],
    ['Rb', 'Rubidium', 85.468, 'alkali', 312, 961], ['Sr', 'Strontium', 87.62, 'alkaline', 1050, 1655],
    ['Y', 'Yttrium', 88.906, 'transition', 1799, 3609], ['Zr', 'Zirconium', 91.224, 'transition', 2128, 4682],
    ['Nb', 'Niobium', 92.906, 'transition', 2750, 5017], ['Mo', 'Molybdenum', 95.95, 'transition', 2896, 4912],
    ['Tc', 'Technetium', 98, 'transition', 2430, 4538], ['Ru', 'Ruthenium', 101.07, 'transition', 2607, 4423],
    ['Rh', 'Rhodium', 102.91, 'transition', 2237, 3968], ['Pd', 'Palladium', 106.42, 'transition', 1828, 3236],
    ['Ag', 'Silver', 107.87, 'transition', 1235, 2435], ['Cd', 'Cadmium', 112.41, 'transition', 594, 1040],
    ['In', 'Indium', 114.82, 'post', 430, 2345], ['Sn', 'Tin', 118.71, 'post', 505, 2875],
    ['Sb', 'Antimony', 121.76, 'metalloid', 904, 1860], ['Te', 'Tellurium', 127.6, 'metalloid', 723, 1261],
    ['I', 'Iodine', 126.9, 'halogen', 387, 457], ['Xe', 'Xenon', 131.29, 'noble', 161, 165],
    ['Cs', 'Caesium', 132.91, 'alkali', 302, 944], ['Ba', 'Barium', 137.33, 'alkaline', 1000, 2170],
    ['La', 'Lanthanum', 138.91, 'lanth', 1193, 3737], ['Ce', 'Cerium', 140.12, 'lanth', 1068, 3716],
    ['Pr', 'Praseodymium', 140.91, 'lanth', 1208, 3793], ['Nd', 'Neodymium', 144.24, 'lanth', 1297, 3347],
    ['Pm', 'Promethium', 145, 'lanth', 1315, 3273], ['Sm', 'Samarium', 150.36, 'lanth', 1345, 2067],
    ['Eu', 'Europium', 151.96, 'lanth', 1099, 1802], ['Gd', 'Gadolinium', 157.25, 'lanth', 1585, 3546],
    ['Tb', 'Terbium', 158.93, 'lanth', 1629, 3503], ['Dy', 'Dysprosium', 162.5, 'lanth', 1680, 2840],
    ['Ho', 'Holmium', 164.93, 'lanth', 1734, 2993], ['Er', 'Erbium', 167.26, 'lanth', 1770, 3141],
    ['Tm', 'Thulium', 168.93, 'lanth', 1818, 2223], ['Yb', 'Ytterbium', 173.05, 'lanth', 1097, 1469],
    ['Lu', 'Lutetium', 174.97, 'lanth', 1925, 3675], ['Hf', 'Hafnium', 178.49, 'transition', 2506, 4876],
    ['Ta', 'Tantalum', 180.95, 'transition', 3290, 5731], ['W', 'Tungsten', 183.84, 'transition', 3695, 5828],
    ['Re', 'Rhenium', 186.21, 'transition', 3459, 5869], ['Os', 'Osmium', 190.23, 'transition', 3306, 5285],
    ['Ir', 'Iridium', 192.22, 'transition', 2719, 4701], ['Pt', 'Platinum', 195.08, 'transition', 2042, 4098],
    ['Au', 'Gold', 196.97, 'transition', 1337, 3129], ['Hg', 'Mercury', 200.59, 'transition', 234, 630],
    ['Tl', 'Thallium', 204.38, 'post', 577, 1746], ['Pb', 'Lead', 207.2, 'post', 601, 2022],
    ['Bi', 'Bismuth', 208.98, 'post', 544, 1837], ['Po', 'Polonium', 209, 'post', 527, 1235],
    ['At', 'Astatine', 210, 'halogen', 575, 610], ['Rn', 'Radon', 222, 'noble', 202, 211],
    ['Fr', 'Francium', 223, 'alkali', 300, 950], ['Ra', 'Radium', 226, 'alkaline', 973, 2010],
    ['Ac', 'Actinium', 227, 'act', 1323, 3471], ['Th', 'Thorium', 232.04, 'act', 2023, 5061],
    ['Pa', 'Protactinium', 231.04, 'act', 1841, 4300], ['U', 'Uranium', 238.03, 'act', 1405, 4404],
    ['Np', 'Neptunium', 237, 'act', 917, 4173], ['Pu', 'Plutonium', 244, 'act', 913, 3501],
    ['Am', 'Americium', 243, 'act', 1449, 2880], ['Cm', 'Curium', 247, 'act', 1613, 3383],
    ['Bk', 'Berkelium', 247, 'act', 1259, 2900], ['Cf', 'Californium', 251, 'act', 1173, 1743],
    ['Es', 'Einsteinium', 252, 'act', 1133, 1269], ['Fm', 'Fermium', 257, 'act', 1125, 0],
    ['Md', 'Mendelevium', 258, 'act', 1100, 0], ['No', 'Nobelium', 259, 'act', 1100, 0],
    ['Lr', 'Lawrencium', 266, 'act', 1900, 0], ['Rf', 'Rutherfordium', 267, 'unknown', 2400, 0],
    ['Db', 'Dubnium', 268, 'unknown', 0, 0], ['Sg', 'Seaborgium', 269, 'unknown', 0, 0],
    ['Bh', 'Bohrium', 270, 'unknown', 0, 0], ['Hs', 'Hassium', 277, 'unknown', 0, 0],
    ['Mt', 'Meitnerium', 278, 'unknown', 0, 0], ['Ds', 'Darmstadtium', 281, 'unknown', 0, 0],
    ['Rg', 'Roentgenium', 282, 'unknown', 0, 0], ['Cn', 'Copernicium', 285, 'unknown', 0, 0],
    ['Nh', 'Nihonium', 286, 'unknown', 0, 0], ['Fl', 'Flerovium', 289, 'unknown', 0, 0],
    ['Mc', 'Moscovium', 290, 'unknown', 0, 0], ['Lv', 'Livermorium', 293, 'unknown', 0, 0],
    ['Ts', 'Tennessine', 294, 'unknown', 0, 0], ['Og', 'Oganesson', 294, 'unknown', 0, 0]
  ];

  // Classic long-form placement.
  function posFor(n) {
    if (n === 1) { return [1, 1]; }
    if (n === 2) { return [1, 18]; }
    if (n >= 3 && n <= 10) {
      var m3 = { 3: 1, 4: 2, 5: 13, 6: 14, 7: 15, 8: 16, 9: 17, 10: 18 };
      return [2, m3[n]];
    }
    if (n >= 11 && n <= 18) {
      var m4 = { 11: 1, 12: 2, 13: 13, 14: 14, 15: 15, 16: 16, 17: 17, 18: 18 };
      return [3, m4[n]];
    }
    if (n >= 19 && n <= 36) {
      if (n <= 20) { return [4, n - 18]; }
      if (n <= 30) { return [4, n - 20 + 3]; }
      return [4, n - 30 + 13];
    }
    if (n >= 37 && n <= 54) {
      if (n <= 38) { return [5, n - 36]; }
      if (n <= 48) { return [5, n - 38 + 3]; }
      return [5, n - 48 + 13];
    }
    if (n >= 55 && n <= 86) {
      if (n === 55 || n === 56) { return [6, n - 54]; }
      if (n >= 57 && n <= 71) { return [9, n - 57 + 3]; }
      if (n >= 72 && n <= 80) { return [6, n - 72 + 4]; }
      return [6, n - 80 + 13];
    }
    if (n === 87 || n === 88) { return [7, n - 86]; }
    if (n >= 89 && n <= 103) { return [10, n - 89 + 3]; }
    return [7, n - 103 + 4];
  }

  var table = document.getElementById('table');
  var legend = document.getElementById('legend');
  var mode = 'cat', pinned = null, temp = 293;

  Object.keys(cats).forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = catName[k];
    b.style.borderColor = cats[k];
    b.dataset.c = k;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('mouseenter', function () { hi(k); });
    b.addEventListener('mouseleave', function () { hi(pinned); });
    b.addEventListener('click', function () {
      pinned = (pinned === k) ? null : k;
      Array.prototype.forEach.call(legend.children, function (cc) {
        cc.classList.toggle('on', cc.dataset.c === pinned);
        cc.setAttribute('aria-pressed', cc.dataset.c === pinned ? 'true' : 'false');
      });
      hi(pinned);
      filter();
    });
    legend.appendChild(b);
  });

  function stateOf(i) {
    var m = data[i][4], b = data[i][5];
    if (!m) { return 'solid'; }
    if (temp < m) { return 'solid'; }
    if (!b || temp >= b) { return 'gas'; }
    return 'liquid';
  }
  var stateCol = { solid: '#8fa3b8', liquid: '#5aa7e0', gas: '#f0b46a' };

  function build() {
    table.innerHTML = '';
    var det = document.createElement('div');
    det.id = 'detail';
    det.innerHTML = '<p style="color:#8b95a8">Select an element \u2192</p>';
    table.appendChild(det);
    data.forEach(function (el, i) {
      var n = i + 1;
      var b = document.createElement('button');
      b.className = 'tile';
      var cat = el[3];
      var fill, bd, bar;
      if (mode === 'cat') {
        fill = 'color-mix(in srgb,' + cats[cat] + ' 16%,transparent)';
        bd = 'color-mix(in srgb,' + cats[cat] + ' 28%,transparent)';
        bar = cats[cat];
        b.style.color = '';
      } else {
        var s = stateOf(i);
        fill = stateCol[s];
        bd = stateCol[s];
        bar = stateCol[s];
        b.style.color = '#101623';
      }
      b.style.setProperty('--fill', fill);
      b.style.setProperty('--bd', bd);
      b.style.setProperty('--cat', bar);
      b.innerHTML = '<div class="n">' + n + '</div><div class="s">'
        + el[0] + '</div><div class="nm">' + el[1] + '</div>';
      var rc = posFor(n);
      b.style.gridRow = rc[0];
      b.style.gridColumn = rc[1];
      b.dataset.i = i;
      b.setAttribute('aria-label', el[1] + ' ' + n);
      b.addEventListener('click', function () { show(i); });
      table.appendChild(b);
    });
    var g1 = document.createElement('div');
    g1.className = 'tile ghost';
    g1.style.gridRow = 6;
    g1.style.gridColumn = 3;
    g1.textContent = '57\u201371';
    var g2 = document.createElement('div');
    g2.className = 'tile ghost';
    g2.style.gridRow = 7;
    g2.style.gridColumn = 3;
    g2.textContent = '89\u2013103';
    table.appendChild(g1);
    table.appendChild(g2);
    filter();
  }

  // Bohr atom with rotating shells.
  function bohr(el, n) {
    var shells = [], e = n;
    var caps = [2, 8, 18, 32, 32, 18, 8];
    for (var ci = 0; ci < caps.length; ci++) {
      if (e <= 0) { break; }
      shells.push(Math.min(caps[ci], e));
      e -= caps[ci];
    }
    var inner = '';
    shells.forEach(function (cc, i) {
      var r = 20 + i * 11;
      var dots = '';
      for (var k = 0; k < cc; k++) {
        var a = k / cc * Math.PI * 2;
        var ex = (100 + Math.cos(a) * r).toFixed(1);
        var ey = (100 + Math.sin(a) * r).toFixed(1);
        dots += '<circle cx="' + ex + '" cy="' + ey + '" r="3.4" fill="'
          + cats[el[3]] + '" style="filter:drop-shadow(0 0 4px ' + cats[el[3]] + ')"/>';
      }
      var rev = (i % 2) ? ';animation-direction:reverse' : '';
      inner += '<g class="shell" style="animation-duration:' + (6 + i * 3.5)
        + 's' + rev + '">' + dots + '</g>'
        + '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="rgba(255,255,255,.14)"/>';
    });
    return '<svg viewBox="0 0 200 200" role="img" aria-label="Bohr model">'
      + inner
      + '<circle cx="100" cy="100" r="12" fill="url(#gg)"/>'
      + '<defs><radialGradient id="gg"><stop offset="0" stop-color="#fff"/>'
      + '<stop offset="1" stop-color="' + cats[el[3]] + '"/></radialGradient></defs></svg>';
  }

  function shellText(n) {
    var e = n, out = [];
    var caps = [2, 8, 18, 32, 32, 18, 8];
    for (var i = 0; i < caps.length && e > 0; i++) {
      var take = Math.min(caps[i], e);
      out.push(take);
      e -= take;
    }
    return out.join('-');
  }

  function show(i) {
    var el = data[i], n = i + 1;
    var d = document.getElementById('detail');
    var st = stateOf(i);
    d.style.setProperty('--ec', cats[el[3]]);
    d.innerHTML = bohr(el, n)
      + '<div><div class="cat">' + catName[el[3]] + '</div>'
      + '<h2>' + el[0] + '</h2>'
      + '<div class="ename">' + el[1] + ' \u00b7 \u2116 ' + n + '</div>'
      + '<dl><dt>mass</dt><dd>' + el[2] + ' u</dd>'
      + '<dt>shells</dt><dd>' + shellText(n) + '</dd>'
      + '<dt>melt / boil</dt><dd>' + (el[4] || '?') + ' / ' + (el[5] || '?') + ' K</dd>'
      + '<dt>state ' + temp + 'K</dt><dd>\u25cf ' + st + '</dd></dl></div>';
    d.classList.add('show');
  }

  function hi(k) {
    var tiles = document.querySelectorAll('.tile[data-i]');
    for (var i = 0; i < tiles.length; i++) {
      var el = data[parseInt(tiles[i].dataset.i, 10)];
      tiles[i].classList.toggle('dim', !!k && el[3] !== k);
    }
  }

  function filter() {
    var q = document.getElementById('q').value.toLowerCase().trim();
    var c = 0;
    var tiles = document.querySelectorAll('.tile[data-i]');
    for (var i = 0; i < tiles.length; i++) {
      var k = parseInt(tiles[i].dataset.i, 10);
      var el = data[k];
      var ok = !q
        || el[1].toLowerCase().indexOf(q) !== -1
        || el[0].toLowerCase() === q
        || el[0].toLowerCase().indexOf(q) === 0
        || String(k + 1) === q;
      var pin = !pinned || el[3] === pinned;
      tiles[i].classList.toggle('dim', !(ok && pin));
      if (ok && pin) { c++; }
    }
    var sc = { solid: 0, liquid: 0, gas: 0 };
    if (mode === 'state') {
      data.forEach(function (_, j) { sc[stateOf(j)]++; });
      document.getElementById('count').textContent = c + ' shown \u00b7 '
        + temp + ' K \u00b7 solid ' + sc.solid + ' liquid ' + sc.liquid + ' gas ' + sc.gas;
    } else {
      document.getElementById('count').textContent = c + ' elements shown \u00b7 ' + temp + ' K \u00b7 ' + mode;
    }
  }

  document.getElementById('q').addEventListener('input', filter);
  document.getElementById('mode').addEventListener('click', function (e) {
    if (e.target.dataset.m) {
      mode = e.target.dataset.m;
      Array.prototype.forEach.call(e.target.parentElement.children, function (b) {
        b.classList.toggle('on', b === e.target);
      });
      build();
    }
  });
  document.getElementById('temp').addEventListener('input', function (e) {
    temp = parseInt(e.target.value, 10);
    document.getElementById('tempv').textContent = temp + ' K';
    if (mode !== 'state') {
      mode = 'state';
      Array.prototype.forEach.call(
        document.getElementById('mode').children, function (b) {
          b.classList.toggle('on', b.dataset.m === 'state');
        });
    }
    build();
  });

  build();
  show(5);
})();
</script>
</body>
</html>
