<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>052 · Night Window — Rain on Glass</title>
<style>
 * {
  box-sizing:border-box
}
html,body {
  margin:0;
  height:100%;
  overflow:hidden
}
 body {
  background:#05070f;
  font-family:Georgia,serif;
  color:#e9e4da
}
 #scene {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  cursor:crosshair
}
 .sash {
  position:fixed;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 0 14px #241a12,inset 0 0 0 17px #4a3826,inset 0 0 90px rgba(0,0,0,.85);
  z-index:5
}
 .sash::before,.sash::after {
  content:"";
  position:fixed;
  background:#1c130d;
  z-index:5
}
 .sash::before {
  left:0;
  right:0;
  top:50%;
  height:12px;
  transform:translateY(-50%);
  opacity:.9
}
 .sash::after {
  top:0;
  bottom:0;
  left:50%;
  width:12px;
  transform:translateX(-50%);
  opacity:.9
}
 .vig {
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55));
  pointer-events:none;
  z-index:4
}
 .hud {
  position:fixed;
  top:26px;
  left:30px;
  z-index:6;
  pointer-events:none
}
 .hud h1 {
  font-style:italic;
  font-weight:400;
  font-size:30px;
  margin:0;
  text-shadow:0 2px 14px rgba(0,0,0,.8)
}
 .hud p {
  font-family:ui-sans-serif,system-ui;
  font-size:10px;
  letter-spacing:.34em;
  text-transform:uppercase;
  opacity:.75;
  margin:6px 0
}
 .clock {
  font-family:ui-monospace,Menlo,monospace;
  font-size:12px;
  opacity:.85
}
 .panel {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  display:flex;
  gap:14px;
  align-items:center;
  background:rgba(10,14,22,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  padding:10px 18px;
  transition:opacity .6s
}
 .panel.idle {
  opacity:.35
}
.panel:hover {
  opacity:1
}
 .panel label {
  font-family:ui-sans-serif,system-ui;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase
}
 input[type=range] {
  accent-color:#ffb35c;
  width:110px
}
 button {
  font-family:ui-sans-serif,system-ui;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  background:transparent;
  color:#e9e4da;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  padding:8px 14px;
  cursor:pointer
}
 button:hover {
  background:#ffb35c;
  color:#111;
  border-color:#ffb35c
}
 .lamp {
  position:fixed;
  right:6%;
  bottom:8%;
  width:120px;
  z-index:3;
  pointer-events:none;
  opacity:.32;
  filter:blur(1.5px);
  animation:breathe 7s ease-in-out infinite alternate
}
 @keyframes breathe {
  from {
    opacity:.26
  }
  to {
    opacity:.38
  }
  
}
 @media(max-width:640px) {
  .hud {
    left:16px;
    top:16px
  }
  .hud h1 {
    font-size:22px
  }
  .panel {
    flex-wrap:wrap;
    border-radius:18px;
    justify-content:center
  }
  
}
 @media(prefers-reduced-motion:reduce) {
  .lamp {
    animation:none
  }
  
}
 
/* —— room details: focus, caption, credits, print —— */ ::selection {
  background:#ffb35c;
  color:#111
}
 button:focus-visible,input:focus-visible {
  outline:2px solid #ffb35c;
  outline-offset:3px
}
 .caption {
  position:fixed;
  left:30px;
  bottom:24px;
  z-index:6;
  max-width:270px;
  font-size:12px;
   line-height:1.7;
  font-style:italic;
  opacity:.66;
  pointer-events:none;
  text-shadow:0 2px 10px #000
}
 .credits {
  position:fixed;
  right:26px;
  top:26px;
  z-index:6;
  text-align:right;
  font-family:ui-monospace,monospace;
   font-size:10.5px;
  letter-spacing:.14em;
  opacity:.6;
  pointer-events:none
}
 .credits b {
  color:#ffb35c;
  font-weight:400
}
 .sill {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:26px;
  z-index:6;
   background:linear-gradient(180deg,#3a2c1e,#1c130d);
  box-shadow:0 -6px 24px rgba(0,0,0,.7)
}
 .toast {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:7;
  pointer-events:none;
   font-style:italic;
  font-size:22px;
  text-shadow:0 2px 16px #000;
  opacity:0;
  transition:opacity .5s
}
 .toast.show {
  opacity:.95
}
 .hud .sub {
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:6px
}
 .hud .dotlive {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ffb35c;
  box-shadow:0 0 10px #ffb35c
}
 noscript div {
  position:fixed;
  inset:auto 0 0 0;
  background:#a8261c;
  color:#fff;
  padding:12px;
  text-align:center;
  z-index:20
}
 @media(max-width:640px) {
   .caption {
    display:none
  }
   .credits {
    display:none
  }
   .sill {
    height:18px
  }
   
}
 @media(min-width:1800px) {
   .hud h1 {
    font-size:38px
  }
   .panel {
    padding:14px 26px
  }
   
}
 @media(prefers-contrast:more) {
   .panel {
    background:rgba(0,0,0,.85);
    border-width:2px
  }
   .hud {
    text-shadow:0 0 2px #000,0 2px 8px #000
  }
   
}
 @media print {
   .panel,.lamp,.sash {
    display:none
  }
   body {
    background:#fff
  }
   
}
 
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vig"></div><div class="sash"></div>
<div class="hud"><h1>Night Window</h1><p>Rain on glass · inside is warm</p><div class="clock"><span id="clock">--:--</span> · <span id="wx">soft drizzle on the pane</span></div></div>
<svg class="lamp" viewBox="0 0 100 150"><ellipse cx="50" cy="30" rx="42" ry="26" fill="#ff9b3c" opacity=".5"/><polygon points="20,40 80,40 62,78 38,78" fill="#ffd9a3" opacity=".9"/><rect x="47" y="78" width="6" height="52" fill="#222"/><ellipse cx="50" cy="136" rx="24" ry="6" fill="#111"/></svg>
<div class="panel" id="panel">
<label>Drizzle <input type="range" id="intensity" min="0" max="100" value="55"></label>
<button id="wiper">Wiper sweep</button>
<button id="wipeall">Wipe all</button>
</div>
<script>
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const city=document.createElement('canvas'),fog=document.createElement('canvas'),fctx=fog.getContext('2d');
let drops=[],beads=[],streaks=[],lights=[],buildings=[];
let intensity=.55,wiperX=-1;
const SPRITES=[];
function mkSprite(r,g,b){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g2=x.createRadialGradient(32,32,2,32,32,30);g2.addColorStop(0,`rgba(${r},${g},${b},1)`);g2.addColorStop(.4,`rgba(${r},${g},${b},.5)`);g2.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=g2;x.fillRect(0,0,64,64);return c}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);if(W*H*DPR*DPR>7e6)DPR*=.7;
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  city.width=Math.max(2,W*.5|0);city.height=Math.max(2,H*.5|0);
  fog.width=W;fog.height=H;paintFog(true);buildCity();
}
const COLS=[[255,178,82],[255,233,190],[110,180,255],[255,96,140],[90,240,190],[200,120,255],[255,178,82],[255,233,190]];
COLS.forEach(c=>SPRITES.push(mkSprite(...c)));
function buildCity(){
  const x=city.getContext('2d');x.clearRect(0,0,city.width,city.height);
  const g=x.createLinearGradient(0,0,0,city.height);g.addColorStop(0,'#04060f');g.addColorStop(.6,'#0b1024');g.addColorStop(.82,'#2a1b2c');g.addColorStop(1,'#3a2418');
  x.fillStyle=g;x.fillRect(0,0,city.width,city.height);
  buildings=[];let bx=0;
  while(bx<city.width){const bw=20+Math.random()*50,bh=city.height*(.15+Math.random()*.3);buildings.push({x:bx,w:bw,h:bh});bx+=bw+2+Math.random()*10}
  x.save();x.filter='blur(3px)';x.fillStyle='rgb(12,14,22)';
  buildings.forEach(b=>x.fillRect(b.x,city.height-b.h,b.w,b.h));x.restore();
  lights=[];
  buildings.forEach(b=>{for(let wy=city.height-b.h+6;wy<city.height-4;wy+=9){for(let wx=b.x+3;wx<b.x+b.w-3;wx+=8){if(Math.random()<.28)lights.push({x:wx,y:wy,s:Math.random()*SPRITES.length|0,ph:Math.random()*7,sz:4+Math.random()*5})}}});
  for(let i=0;i<46;i++)lights.push({x:Math.random()*city.width,y:city.height*(.6+Math.random()*.38),s:Math.random()*SPRITES.length|0,ph:Math.random()*7,sz:9+Math.random()*17,big:true});
  for(let i=0;i<12;i++)lights.push({x:Math.random()*city.width,y:Math.random()*city.height*.4,s:2,ph:Math.random()*7,sz:6,big:true});
  streaks=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,l:20+Math.random()*40,v:300+Math.random()*300}));
}
function paintFog(full){
  if(full){fctx.globalCompositeOperation='source-over';fctx.fillStyle='rgb(206,219,232)';fctx.fillRect(0,0,W,H);
    const g=fctx.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.min(W,H)*.6);g.addColorStop(0,'rgba(0,0,0,.18)');g.addColorStop(1,'rgba(0,0,0,0)');
    fctx.globalCompositeOperation='destination-out';fctx.fillStyle=g;fctx.fillRect(0,0,W,H);}
}
function spawnBead(x,y,r){beads.push({x,y,r:r||1+Math.random()*1.6,rel:4.6+Math.random()*2.9});if(beads.length>900)beads.shift()}
for(let i=0;i<160;i++)spawnBead(Math.random()*innerWidth,Math.random()*innerHeight);
let last=performance.now(),t=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  // drizzle
  if(Math.random()<intensity*.5)spawnBead(Math.random()*W,Math.random()*H);
  // city lights draw
  const cx=city.getContext('2d');
  cx.globalCompositeOperation='source-over';
  // twinkle via overlay: redraw additive sprites each frame on small canvas
  buildCityLightLayer(cx);
  // main composite
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#04060f');sky.addColorStop(.6,'#0b1024');sky.addColorStop(.82,'#2a1b2c');sky.addColorStop(1,'#3a2418');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(city,0,0,W,H);
  // back rain streaks
  ctx.strokeStyle='rgba(180,200,230,.08)';ctx.lineWidth=1;ctx.beginPath();
  streaks.forEach(s=>{s.y+=s.v*dt;if(s.y>H){s.y=-40;s.x=Math.random()*W}ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-4,s.y-s.l)});
  ctx.stroke();
  // fog layer
  fctx.globalCompositeOperation='source-over';fctx.fillStyle='rgba(206,219,232,0.0045)';fctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.7;ctx.drawImage(fog,0,0,W,H);ctx.globalAlpha=1;
  updateDrops(dt);drawDrops();
  // wiper sweep
  if(wiperX>=0){wiperX+=W*1.4*dt;fctx.globalCompositeOperation='destination-out';fctx.fillRect(wiperX-40,0,90,H);
    drops=drops.filter(d=>!(d.x>wiperX-60&&d.x<wiperX+60));beads=beads.filter(b=>!(b.x>wiperX-60&&b.x<wiperX+60));
    ctx.fillStyle='rgba(200,220,240,.12)';ctx.fillRect(wiperX-40,0,90,H);
    if(wiperX>W+60)wiperX=-1}
  // warm corner glow
  const wg=ctx.createRadialGradient(W*.85,H*.9,10,W*.85,H*.9,300);wg.addColorStop(0,'rgba(255,170,80,.14)');wg.addColorStop(1,'rgba(255,170,80,0)');
  ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}
let lightTick=0;
function buildCityLightLayer(cx){
  // cheap: paint sprites additively over buildings every few frames
  cx.save();cx.globalCompositeOperation='lighter';
  lights.forEach(L=>{const tw=RM?1:(.6+.4*Math.sin(t*2+L.ph)+(Math.random()<.005?-.5:0));if(tw<=0)return;
    cx.globalAlpha=Math.min(1,tw);cx.drawImage(SPRITES[L.s],L.x-L.sz/2,L.y-L.sz/2,L.sz,L.sz)});
  cx.restore();cx.globalAlpha=1;
}
function updateDrops(dt){
  // beads swell then release as movers
  for(let i=beads.length-1;i>=0;i--){const b=beads[i];if(Math.random()<.01*intensity){b.r+=.06;if(b.r>b.rel){drops.push({x:b.x,y:b.y,r:b.r,vy:20,vx:0});beads.splice(i,1)}}}
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];
    d.vy=Math.min(260,d.vy+260*dt*(d.r/6));d.x+=Math.sin(t*6+d.y*.05)*20*dt*(d.r/6);d.y+=d.vy*dt;
    // trail + absorb
    if(Math.random()<.3&&d.r>3){spawnBead(d.x+(Math.random()-.5)*6,d.y-d.r,1);d.r*=.997}
    for(let j=beads.length-1;j>=0;j--){const b=beads[j],dx=b.x-d.x,dy=b.y-d.y;if(dx*dx+dy*dy<(d.r+b.r)*(d.r+b.r)){d.r=Math.sqrt(d.r*d.r+b.r*b.r);beads.splice(j,1)}}
    // clear fog path
    fctx.globalCompositeOperation='destination-out';fctx.beginPath();fctx.ellipse(d.x,d.y,d.r*1.4,d.r*1.8,0,0,7);fctx.fill();
    if(d.r<2.4){spawnBead(d.x,d.y,d.r);drops.splice(i,1);continue}
    if(d.y>H+20)drops.splice(i,1);
  }
  if(drops.length>220)drops.splice(0,drops.length-220);
}
function drawDrops(){
  drops.concat(beads).forEach(d=>{
    if(d.r<2.4){ctx.fillStyle='rgba(220,235,250,.35)';ctx.beginPath();ctx.arc(d.x-d.r*.3,d.y-d.r*.3,d.r*.5,0,7);ctx.fill();
      ctx.fillStyle='rgba(200,215,235,.18)';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();return}
    ctx.save();ctx.beginPath();ctx.ellipse(d.x,d.y,d.r,d.r*(1+Math.min(.6,(d.vy||0)/600)),0,0,7);ctx.clip();
    // refraction: flipped minified city
    ctx.translate(d.x,d.y);ctx.scale(1,-1);ctx.scale(1/2.3,1/2.3);
    ctx.drawImage(city,-d.x*2.3+city.width/2- W*.25,-(H-d.y)*2.3+city.height/2, W*2.3,H*2.3);
    ctx.restore();
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(d.x,d.y,d.r,d.r*1.05,0,0,7);ctx.stroke();ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(d.x-d.r*.35,d.y-d.r*.4,Math.max(.6,d.r*.14),0,7);ctx.fill();
  });
}
// pointer wipe
let pdown=false,lastP=null,idleT=null;
const panel=document.getElementById('panel');
function wipeTo(x,y){
  fctx.globalCompositeOperation='destination-out';
  const R=Math.min(W,H)*.06;
  if(lastP){const dx=x-lastP.x,dy=y-lastP.y,n=Math.ceil(Math.hypot(dx,dy)/8);
    for(let i=0;i<=n;i++){const px=lastP.x+dx*i/n,py=lastP.y+dy*i/n;const g=fctx.createRadialGradient(px,py,2,px,py,R);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');fctx.fillStyle=g;fctx.beginPath();fctx.arc(px,py,R,0,7);fctx.fill()}}
  else{fctx.beginPath();fctx.arc(x,y,R,0,7);fctx.fill()}
  lastP={x,y};
  beads=beads.filter(b=>Math.hypot(b.x-x,b.y-y)>R*.6);
  panel.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>panel.classList.add('idle'),3000);
}
cv.addEventListener('pointermove',e=>{if(e.buttons)wipeTo(e.clientX,e.clientY)});
cv.addEventListener('pointerdown',e=>{pdown=true;lastP=null;wipeTo(e.clientX,e.clientY);drops.push({x:e.clientX,y:e.clientY,r:5+Math.random()*3,vy:10,vx:0})});
addEventListener('pointerup',()=>{pdown=false;lastP=null});
document.getElementById('intensity').oninput=e=>{intensity=e.target.value/100;
  document.getElementById('wx').textContent=intensity<.3?'mist breathing on the pane':intensity<.7?'soft drizzle on the pane':'heavy rain, stay in'};
document.getElementById('wiper').onclick=()=>wiperX=0;
document.getElementById('wipeall').onclick=()=>wiperX=0;
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
idleT=setTimeout(()=>panel.classList.add('idle'),3000);
</script>
</body>
</html>
