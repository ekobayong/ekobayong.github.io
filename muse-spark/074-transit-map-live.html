Design a single self-contained HTML page presenting an animated, Beck-style schematic metro map for the fictional city of Vellmar. Everything — CSS, JavaScript, and the map itself — lives in one file; the map is an inline SVG (viewBox 0 0 1000 740) whose lines, stations, labels and moving trains are constructed at runtime from a compact data model. No external fonts, images or scripts. Typography is crisp official wayfinding: a system sans stack (ui-sans-serif, system-ui, 'Helvetica Neue', Helvetica, Arial) at weight 500 for everything, weight 700 for the wordmark and selected station names, tiny wide-tracked uppercase (letter-spacing 0.28em) for panel headings, and a monospace stack with tabular numerals for countdowns and the clock.

Palette, day mode: warm paper background #f5f2ea with a slightly darker map panel #ebe7dc, ink #1b1e24, secondary text #5a5f6b, hairline rules #d5d0c4, a pale river band #cfe3ec, white station discs with ink strokes. Night mode swaps to background #0f1318, panel #151a21, ink #e9ecf1, secondary #9aa3b2, rules #252c36, river #17232e, and dark station discs with light strokes; all swaps animate over 0.5s via CSS custom properties, and night mode is auto-enabled when the OS prefers dark. The six lines are Crimson #d9363e, Cobalt #1f6fd6, Emerald #1e9e5a, Amber #f0a020, Violet #7b4fbf and Slate #3a8c96; status colors are good-service green #1e9e5a and delay amber #f0a020.

The map: a faint 100-unit grid, a meandering river drawn as a soft filled path across the lower-middle, and a small caption "Vellmar Metro · Network Diagram · 2026". Each line is a 9-unit polyline of purely horizontal, vertical and 45° segments with round joins and caps, plus an invisible 26-unit-wide hit path for easy hovering. Lines cross at genuine interchanges (Central Vellmar, Kingsrow, Aurora Park, Lantern Court, Riverside, Botanic Gardens, Foundry Square, Priory Gate, Saltmarsh, Old Docks) which are drawn as white discs with a thick ink ring; ordinary stations are short perpendicular ticks on the side of the label, and termini get a full crossbar tick plus a smaller disc. Station labels (about 50 real names such as Westgate Quay, Harbor Mills, Tannery Steps, Museum Quarter, Weaver's Row, Ferry Landing, Eastmoor Terminal) are 11.5px, positioned with hand-tuned offsets and anchors, and use paint-order stroke with a paper-colored halo for legibility across lines.

Trains: four per line (two per direction) rendered as small colored discs with a white rim and a translucent halo. Each frame a train advances along its line's path via getTotalLength/getPointAtLength at about 62 units per second; station positions along the path are pre-computed by nearest-point search, and a train that crosses a station snaps to it and dwells ~1.6s (double at termini, where it reverses). A delayed line runs at 45% speed with doubled dwell.

Interaction: hovering a line (on the map, in the header legend, or in the status list) highlights it by fading every other line, its trains and its non-shared stations to 13% opacity, and thickens the hovered stroke. Clicking or keyboard-activating a station selects it (amber ring, bold label) and fills the right-hand "Next arrivals" card with the station name, colored pips for each line calling there, and up to six upcoming trains sorted by ETA, each row showing line, destination terminus ("towards …" or "Terminates here") and a monospace countdown that recomputes from live train positions four times a second — "Due" in green under three seconds, seconds under a minute, then m:ss. A "Service status" card lists all six lines with a pill badge; every 18–40 seconds a random line flips to a pulsing amber "Minor delays" badge for 14–30 seconds, which also slows its trains and annotates arrival rows. A live clock sits in the map corner. A pill button in the header toggles night mode. Layout is a two-column grid (map + 320px aside) that stacks on screens under 860px, with the map keeping its aspect ratio; reduced-motion users get slower trains and no pulsing badge.
