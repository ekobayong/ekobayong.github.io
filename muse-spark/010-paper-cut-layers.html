Build a single self-contained HTML page called "Valley of Paper": a full-viewport layered paper-cut landscape at dusk, constructed entirely from one inline SVG (viewBox 0 0 1600 900, preserveAspectRatio xMidYMax slice, oversized by ~6% on each side so parallax never reveals edges) sitting over a CSS sky gradient. Stack eight sheets from back to front, each a group with a soft CSS drop-shadow (drop-shadow(0 10px 8px rgba(20,10,40,0.35)) for distant sheets, a deeper 18px/14px shadow for the two nearest) so every silhouette reads as a piece of cut card lying on the one behind it: (1) a field of 140 tiny twinkling stars generated in JS with a seeded random; (2) a paper sun (70px disc with a wide radial glow) that sinks as time passes; (3) a crescent paper moon (disc with a masked bite) that rises; (4) three drifting paper clouds built from cubic-bezier blob paths, animated with translateX keyframes on 140–190s loops; (5) far jagged mountains; (6) mid mountains; (7) rolling hills with a row of small pines drawn from a single reusable <use href="#pine"> symbol; (8) nearer hills with larger pines that sway ±0.8° on a 6s ease loop, each with a staggered delay; (9) a front ridge carrying a paper cabin (walls, gabled roof, chimney, two windows and a door) and two pines; and (10) a foreground ground strip with a paper deer facing left (elliptical body, curved neck, small head with ears, stroked antlers, four legs — two slightly splayed — and a tail) plus two large pines at the edges.

Dusk palette (top of sky to foreground): sky #3b2a5c → #c9698a → #f7b26a, sun #ffd28a, clouds #f7d5c4, sheets #8b6a9c, #6a4f83, #4f3a6b, #3a2a54, #2b1f44, #1c1533, #130f26. Night palette: sky #050a1e → #0f1c44 → #24356a, sun #ff9a5a (as it sets), clouds #3a4a7a, sheets #2b3a6b, #1f2c55, #182243, #111935, #0c122a, #080c1f, #050815, and a cabin window that warms from a faint rgba(255,200,110,0.15) to a bright rgba(255,160,70,1.0). Every colour lives in a CSS custom property; a JavaScript function linearly interpolates each hex pair with a smoothstep curve and writes the results as the slider moves, while also driving ––stars (fades in between 35% and 85% of the slider), ––sun-y (sun descends 620px), ––moon-y (moon rises 700px), and the window glow. Sheets use 0.6s fill transitions so slider scrubbing feels buttery.

Parallax: pointer position (normalised −1..1) sets a target offset up to 40px, smoothed each frame with exponential easing (6% per frame) and written to ––mx/––my; each layer translates by that offset times its own ––p factor (0.1 for stars up to 1.15 for the foreground; vertical movement is 60% of horizontal) with a 0.9s ease-out transition, so near sheets glide more than far ones. On coarse-pointer devices, offer device-tilt parallax: iOS shows an "Enable tilt parallax" pill button that calls DeviceOrientationEvent.requestPermission(), other devices attach the deviceorientation listener directly, mapping gamma and beta (centred on a 45° holding angle) to the same target; touch-drag on the scene also pans when no tilt data is present.

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley of Paper — A Cut-Paper Dusk</title>
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box
}

:root {
  --sky1:#3b2a5c;
  --sky2:#c9698a;
  --sky3:#f7b26a;
  --sun:#ffd28a;
  --cloud:#f7d5c4;
  --s1:#8b6a9c;
  --s2:#6a4f83;
  --s3:#4f3a6b;
  --s4:#3a2a54;
  --s5:#2b1f44;
  --s6:#1c1533;
  --s7:#130f26;
  --stars:0;
  --suny:0;
  --moony:700;
  --win:rgba(255,200,110,.15);
  --mx:0px;
  --my:0px
}

body {
  font-family:ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN','Arial Rounded MT Bold',Segoe UI,system-ui,sans-serif;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3))
}

.scene {
  position:fixed;
  inset:0;
  overflow:hidden
}

svg#land {
  position:absolute;
  inset:-6%;
  width:112%;
  height:112%
}

.layer {
  transition:transform .9s ease-out
}

.layer * {
  transition:fill .6s
}

.stars {
  opacity:var(--stars)
}
.stars circle {
  animation:tw 3s ease-in-out infinite alternate
}

@keyframes tw {
  to {
  opacity:.2
}

}

.cloud {
  animation:drift linear infinite
}

.c1 {
  animation-duration:140s
}
.c2 {
  animation-duration:170s
}
.c3 {
  animation-duration:190s
}

@keyframes drift {
  from {
  transform:translateX(-200px)
}
to {
  transform:translateX(1800px)
}

}

.pineS {
  animation:sway 6s ease-in-out infinite alternate;
  transform-box:fill-box;
  transform-origin:bottom center
}

@keyframes sway {
  from {
  transform:rotate(-.8deg)
}
to {
  transform:rotate(.8deg)
}

}

.card {
  position:fixed;
  z-index:10;
  background:#f6ead6;
  color:#3b2a2a;
  border-radius:6px;
  box-shadow:0 18px 40px rgba(10,5,25,.4);
  animation:rise 1.2s ease both
}

@keyframes rise {
  from {
  opacity:0;
  transform:translateY(20px) rotate(var(--tilt,-1.2deg))
}
to {
  opacity:1;
  transform:rotate(var(--tilt,-1.2deg))
}

}

.title {
  top:26px;
  left:26px;
  padding:18px 24px;
  --tilt:-1.2deg;
  max-width:min(420px,80vw)
}

.title::before {
  content:"";
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%) rotate(2deg);
  width:120px;
  height:26px;
  background:rgba(246,234,214,.6);
  border:1px solid rgba(0,0,0,.08)
}

.title:hover {
  transform:rotate(0);
  margin-top:2px
}

.title h1 {
  font-size:clamp(1.5rem,3.4vw,2.4rem);
  font-weight:800
}

.title p {
  font-size:.62rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.6;
  margin-top:6px
}

.panelC {
  bottom:26px;
  right:26px;
  padding:20px 24px;
  --tilt:.8deg;
  width:min(360px,calc(100vw - 52px))
}

.panelC label {
  font-size:.65rem;
  letter-spacing:.28em;
  text-transform:uppercase
}

#clock {
  font-family:ui-monospace,Menlo,monospace;
  font-size:1.1rem;
  margin:8px 0
}

input[type=range] {
  -webkit-appearance:none;
  width:100%;
  height:10px;
  border-radius:99px;
  background:linear-gradient(90deg,#f7b26a,#c9698a,#3b2a5c,#050a1e);
  outline:none
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#f6ead6;
  border:3px solid #3b2a2a;
  cursor:pointer
}

input[type=range]::-webkit-slider-thumb:hover {
  transform:scale(1.2)
}

input[type=range]::-moz-range-thumb {
  width:22px;
  height:22px;
  border-radius:50%;
  background:#f6ead6;
  border:3px solid #3b2a2a
}

.ticks {
  display:flex;
  justify-content:space-between;
  font-size:.6rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  opacity:.6;
  margin-top:8px
}

#tiltBtn {
  position:fixed;
  top:26px;
  right:26px;
  z-index:11;
  border:0;
  background:#f6ead6;
  border-radius:99px;
  padding:10px 20px;
  font:inherit;
  font-size:.72rem;
  font-weight:700;
  cursor:pointer;
  display:none;
  box-shadow:0 10px 24px rgba(0,0,0,.35)
}

@media(max-width:640px) {
  .panelC {
  left:26px;
  right:26px;
  width:auto
}
.title {
  max-width:70vw
}

}

@media(prefers-reduced-motion:reduce) {
  .cloud,.pineS,.stars circle,.card {
  animation:none!important
}

}

</style>
</head>
<body>
<div class="scene" id="scene">
<svg id="land" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-label="Layered paper valley">
<defs><symbol id="pine" viewBox="0 0 40 80"><polygon points="20,0 36,34 26,34 38,58 2,58 14,34 4,34" fill="inherit"/><rect x="17" y="58" width="6" height="22" fill="inherit"/></symbol>
<radialGradient id="sunglow"><stop offset="0" stop-color="#ffd28a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd28a" stop-opacity="0"/></radialGradient>
<mask id="bite"><rect width="100" height="100" fill="white"/><circle id="biteC" cx="68" cy="30" r="34" fill="black"/></mask></defs>
<g class="layer stars" id="starG" style="--p:.1" opacity="1"></g>
<g class="layer" style="--p:.15" id="sunG"><circle cx="1150" cy="620" r="150" fill="url(#sunglow)"/><circle id="sunD" cx="1150" cy="480" r="70" fill="var(--sun)"/></g>
<g class="layer" style="--p:.2" id="moonG"><g mask="url(#bite)"><circle id="moonD" cx="380" cy="700" r="52" fill="#f4efe6"/></g></g>
<g class="layer" style="--p:.25" fill="var(--cloud)" opacity=".9">
<path class="cloud c1" d="M-100,220 q40,-30 90,-12 q30,-28 80,-14 q50,-10 70,16 q40,6 30,30 l-300,10 q-20,-18 30,-30z"/>
<path class="cloud c2" d="M-200,300 q40,-30 90,-12 q30,-28 80,-14 q50,-10 70,16 q40,6 30,30 l-300,10 q-20,-18 30,-30z"/>
<path class="cloud c3" d="M-150,150 q40,-30 90,-12 q30,-28 80,-14 q50,-10 70,16 q40,6 30,30 l-300,10 q-20,-18 30,-30z"/></g>
<g class="layer" style="--p:.35" fill="var(--s1)"><path d="M-100,520 L150,340 L300,470 L470,320 L640,480 L820,350 L1000,480 L1200,330 L1400,470 L1700,360 L1700,900 L-100,900z" style="filter:drop-shadow(0 10px 8px rgba(20,10,40,.35))"/></g>
<g class="layer" style="--p:.5" fill="var(--s2)"><path d="M-100,600 L200,430 L420,570 L700,440 L950,590 L1250,450 L1500,580 L1700,500 L1700,900 L-100,900z" style="filter:drop-shadow(0 10px 8px rgba(20,10,40,.35))"/></g>
<g class="layer" style="--p:.65" fill="var(--s3)"><path d="M-100,680 Q300,600 700,660 Q1100,720 1700,640 L1700,900 L-100,900z" style="filter:drop-shadow(0 10px 8px rgba(20,10,40,.35))"/>
<g fill="var(--s6)"><use href="#pine" x="250" y="600" width="34" height="68"/><use href="#pine" x="330" y="610" width="28" height="56"/><use href="#pine" x="900" y="605" width="34" height="68"/><use href="#pine" x="1150" y="600" width="28" height="56"/></g></g>
<g class="layer" style="--p:.8" fill="var(--s4)"><path d="M-100,740 Q400,680 800,730 Q1200,780 1700,720 L1700,900 L-100,900z" style="filter:drop-shadow(0 10px 8px rgba(20,10,40,.35))"/>
<g fill="var(--s7)"><use href="#pine" class="pineS" x="140" y="660" width="52" height="104" style="animation-delay:0s"/><use href="#pine" class="pineS" x="1350" y="655" width="56" height="112" style="animation-delay:-2s"/><use href="#pine" class="pineS" x="700" y="670" width="44" height="88" style="animation-delay:-4s"/></g></g>
<g class="layer" style="--p:.95" fill="var(--s5)"><path d="M-100,800 Q500,760 900,800 Q1300,840 1700,790 L1700,900 L-100,900z" style="filter:drop-shadow(0 18px 14px rgba(20,10,40,.5))"/>
<g><rect x="620" y="700" width="110" height="80" fill="var(--s6)"/><polygon points="610,700 675,655 740,700" fill="var(--s7)"/><rect x="640" y="725" width="26" height="26" fill="var(--win)" id="win1"/><rect x="684" y="725" width="26" height="26" fill="var(--win)" id="win2"/><rect x="662" y="752" width="26" height="28" fill="#0a0812"/><rect x="735" y="712" width="10" height="68" fill="var(--s7)"/>
<use href="#pine" x="540" y="700" width="60" height="120" fill="#0d0a18"/><use href="#pine" x="760" y="705" width="52" height="104" fill="#0d0a18"/></g></g>
<g class="layer" style="--p:1.15" fill="var(--s7)"><path d="M-100,860 Q600,830 1700,855 L1700,900 L-100,900z" style="filter:drop-shadow(0 18px 14px rgba(20,10,40,.5))"/>
<g fill="var(--s7)" stroke="#0d0a18"><ellipse cx="420" cy="862" rx="46" ry="22"/><path d="M455,845 Q470,815 490,810 L500,800 M492,806 l10,-8 M494,810 l12,-2" fill="none" stroke-width="3"/><rect x="388" y="872" width="8" height="26"/><rect x="410" y="872" width="8" height="26"/><rect x="432" y="872" width="8" height="26"/><rect x="450" y="870" width="8" height="26"/></g>
<use href="#pine" x="60" y="740" width="90" height="150" fill="#080614"/><use href="#pine" x="1420" y="745" width="90" height="150" fill="#080614"/></g>
</svg>
</div>
<button id="tiltBtn">Enable tilt parallax</button>
<div class="card title"><h1>Valley of Paper</h1><p>A cut-paper dusk · move to look around</p></div>
<div class="card panelC"><label for="dusk">Time of day</label><div id="clock">18:40 · Golden dusk</div>
<input type="range" id="dusk" min="0" max="1000" value="120" aria-label="Time of day from dusk to night">
<div class="ticks"><span>Golden dusk</span><span>Twilight</span><span>Blue night</span></div>
<p style="font-size:.68rem;opacity:.6;margin-top:8px">Drag the scene or tilt your phone to look around.</p></div>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const r=document.documentElement.style;
// stars seeded
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const sg=document.getElementById('starG');let sh='';for(let i=0;i<140;i++){sh+=`<circle cx="${(rnd()*1600).toFixed(0)}" cy="${(rnd()*420).toFixed(0)}" r="${(0.8+rnd()*1.6).toFixed(1)}" fill="#fff" style="animation-delay:${(-rnd()*3).toFixed(1)}s"/>`;}sg.innerHTML=sh;
const DUSK={sky1:['#3b2a5c','#050a1e'],sky2:['#c9698a','#0f1c44'],sky3:['#f7b26a','#24356a'],sun:['#ffd28a','#ff9a5a'],cloud:['#f7d5c4','#3a4a7a'],s1:['#8b6a9c','#2b3a6b'],s2:['#6a4f83','#1f2c55'],s3:['#4f3a6b','#182243'],s4:['#3a2a54','#111935'],s5:['#2b1f44','#0c122a'],s6:['#1c1533','#080c1f'],s7:['#130f26','#050815']};
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}function toH(c){return'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');}
const sm=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const slider=document.getElementById('dusk');
function apply(t){const k=sm(t);
for(const key in DUSK){const A=hx(DUSK[key][0]),B=hx(DUSK[key][1]);r.setProperty('--'+key,toH([A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k]));}
r.setProperty('--stars',sm((t-.35)/.5).toFixed(2));r.setProperty('--win',`rgba(255,160,70,${(.15+.85*k).toFixed(2)})`);
document.getElementById('sunD').setAttribute('cy',480+t*380);document.getElementById('moonD').setAttribute('cy',700-t*430);
const mins=18*60+40+t*(5*60+19);const hh=String(Math.floor(mins/60)%24).padStart(2,'0'),mm=String(Math.floor(mins%60)).padStart(2,'0');
document.getElementById('clock').textContent=`${hh}:${mm} · ${t<.33?'Golden dusk':t<.7?'Twilight':'Blue night'}`;
document.querySelectorAll('.layer').forEach(l=>{const p=parseFloat(l.style.getPropertyValue('--p'))||.5;l.dataset.p=p;});}
slider.addEventListener('input',()=>apply(slider.value/1000));apply(.12);
// parallax
let tx2=0,ty2=0,cx2=0,cy2=0;const layers=[...document.querySelectorAll('.layer')];
addEventListener('pointermove',e=>{tx2=(e.clientX/innerWidth-.5)*2;ty2=(e.clientY/innerHeight-.5)*2;});
let dragX=null;const scene=document.getElementById('scene');
scene.addEventListener('pointerdown',e=>{dragX=e.clientX;});addEventListener('pointerup',()=>dragX=null);
scene.addEventListener('pointermove',e=>{if(dragX!==null&&matchMedia('(pointer:coarse)').matches){tx2=Math.max(-1,Math.min(1,tx2+(e.clientX-dragX)/300));dragX=e.clientX;}});
function par(){if(!RM){cx2+=(tx2-cx2)*.06;cy2+=(ty2-cy2)*.06;layers.forEach(l=>{const p=parseFloat(l.style.getPropertyValue('--p'))||.5;l.style.transform=`translate(${(cx2*40*p).toFixed(1)}px,${(cy2*24*p).toFixed(1)}px)`;});}requestAnimationFrame(par);}
if(!RM)requestAnimationFrame(par);
// tilt
if(matchMedia('(pointer:coarse)').matches){const b=document.getElementById('tiltBtn');
if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){b.style.display='block';b.onclick=async()=>{try{await DeviceOrientationEvent.requestPermission();b.style.display='none';}catch(e){}};}
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tx2=Math.max(-1,Math.min(1,e.gamma/30));ty2=Math.max(-1,Math.min(1,(e.beta-45)/30));});}
slider.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){slider.value=Math.min(1000,+slider.value+50);slider.dispatchEvent(new Event('input'));}});
</script>
</body>
</html>
