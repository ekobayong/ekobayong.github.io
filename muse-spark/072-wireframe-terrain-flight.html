<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Horizon — Wireframe Terrain Flight</title>
<style>
:root
{
  --acc:#19f0ff
}

*
{
  box-sizing:border-box
}
html,body
{
  margin:0;height:100%;overflow:hidden;background:#010409;color:#dff6ff;font-family:ui-sans-serif,system-ui,sans-serif
}

#sky
{
  position:fixed;inset:0;display:block
}

.hud
{
  position:fixed;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace
}

#tele
{
  top:16px;left:16px;background:rgba(4,10,18,.62);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;min-width:230px
}

#tele h4
{
  margin:0 0 8px;font-size:10px;letter-spacing:.34em;color:#8fa3b8
}

#tele .row
{
  display:flex;justify-content:space-between;font-size:13px;padding:2px 0;font-variant-numeric:tabular-nums
}

#tele .row b
{
  color:var(--acc);text-shadow:0 0 10px var(--acc)
}

#pal
{
  top:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:44vw
}

.seg
{
  display:flex;background:rgba(4,10,18,.62);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px;backdrop-filter:blur(10px)
}

.seg button
{
  border:0;background:transparent;color:#b9c7d6;font:inherit;font-size:11px;letter-spacing:.12em;padding:8px 13px;border-radius:999px;cursor:pointer
}

.seg button.on
{
  background:var(--acc);color:#02141a;font-weight:800;box-shadow:0 0 14px var(--acc)
}

#right
{
  right:16px;bottom:16px;display:flex;gap:12px;align-items:flex-end
}

#thr
{
  background:rgba(4,10,18,.62);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;backdrop-filter:blur(10px)
}

#thrbar
{
  width:10px;height:150px;background:#0a1520;border-radius:8px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.2)
}

#thrfill
{
  position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--acc),#fff);box-shadow:0 0 12px var(--acc)
}

#hor
{
  width:110px;height:110px;background:rgba(4,10,18,.62);border:1px solid rgba(255,255,255,.16);border-radius:50%;backdrop-filter:blur(10px)
}

#help
{
  left:16px;bottom:14px;font-size:11px;color:#8fa3b8;background:rgba(4,10,18,.55);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12)
}

#paused
{
  position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:26px;letter-spacing:.5em;display:none;color:#fff;text-shadow:0 0 18px var(--acc);border:2px solid var(--acc);padding:14px 26px 14px 38px;border-radius:12px;background:rgba(0,0,0,.5)
}

#title
{
  position:fixed;left:50%;top:14px;transform:translateX(-50%);text-align:center;pointer-events:none
}

#title h1
{
  margin:0;font-size:15px;letter-spacing:.5em;font-weight:800
}

#title p
{
  margin:2px 0 0;font-size:10px;letter-spacing:.3em;color:#8fa3b8
}

@media(max-width:700px)
{
  #help
{
  display:none
}
#pal
{
  max-width:60vw
}
#tele
{
  min-width:0;transform:scale(.88);transform-origin:top left
}

}

@media(prefers-reduced-motion:reduce)
{
  *
{
  animation:none!important
}

}

</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="title"><h1>VECTOR HORIZON</h1><p>ENDLESS WIREFRAME FLIGHT · 072</p></div>
<div class="hud" id="tele"><h4>◉ TELEMETRY</h4><div class="row"><span>ALT</span><b id="vAlt">0000 m</b></div><div class="row"><span>SPD</span><b id="vSpd">0 kn</b></div><div class="row"><span>HDG</span><b id="vHdg">000°</b></div><div class="row"><span>DIST</span><b id="vDst">0.0 km</b></div></div>
<div class="hud" id="pal"><div class="seg" id="segPal"><button data-p="0" class="on">TRON</button><button data-p="1">SYNTH</button><button data-p="2">AMBER</button><button data-p="3">BLUEPRINT</button></div><div class="seg" id="segMode"><button data-m="wire" class="on">WIRE</button><button data-m="solid">SOLID</button><button data-m="pause">❚❚</button></div></div>
<div class="hud" id="right"><div id="thr"><span style="font-size:10px;letter-spacing:.2em">THR</span><div id="thrbar"><div id="thrfill" style="height:55%"></div></div><span id="thrv" style="font-size:11px">55%</span></div><svg id="hor" viewBox="0 0 100 100"><defs><clipPath id="cc"><circle cx="50" cy="50" r="40"/></clipPath></defs><circle cx="50" cy="50" r="42" fill="none" stroke="#3a4a5c" stroke-width="2"/><g id="horg" clip-path="url(#cc)"><rect id="hsky" x="0" y="0" width="100" height="50" fill="#0e2a3a"/><rect id="hgnd" x="0" y="50" width="100" height="50" fill="#7a3a20"/><line x1="0" y1="50" x2="100" y2="50" stroke="#fff" stroke-width="2"/></g><path d="M25 52h16l4-5 5 5h16" fill="none" stroke="#ffe259" stroke-width="3" stroke-linecap="round"/><g stroke="#8fa3b8" font-size="7"><text x="50" y="14" text-anchor="middle">0</text></g></svg></div>
<div class="hud" id="help">mouse steer · wheel / ↑↓ throttle · ←→ bank · space pause</div>
<div id="paused">— PAUSED —</div>
<script>
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;function rs()
{
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
}
rs();addEventListener('resize',rs);
const PALS=[
{
  top:'#010409',hor:'#052a36',line:[25,240,255],glow:'#19f0ff',s1:'#ffb347',s2:'#ff3d81',star:'#bfefff'
}
,
{
  top:'#0b0018',hor:'#4a0f6a',line:[255,43,214],glow:'#ff2bd6',s1:'#ffe259',s2:'#ff2bd6',star:'#ffd7f5'
}
,
{
  top:'#050300',hor:'#2a1600',line:[255,176,0],glow:'#ffb000',s1:'#fff1c4',s2:'#ff8c00',star:'#ffe6b0'
}
,
{
  top:'#062052',hor:'#12407f',line:[219,233,255],glow:'#dbe9ff',s1:'#ffffff',s2:'#4a86ff',star:'#ffffff'
}
];
let pal=0,mode='wire',paused=false;
const perm=new Uint8Array(512);
{
  const p=[...Array(256).keys()];let s=1337;const rnd=()=> (s=(s*16807)%2147483647)/2147483647;for(let i=255;i>0;i--)
{
  const j=(rnd()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];
}
for(let i=0;i<512;i++)perm[i]=p[i&255];
}

function vnoise(x,y)
{
  const xi=Math.floor(x)&255,yi=Math.floor(y)&255,xf=x-Math.floor(x),yf=y-Math.floor(y);const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=perm[perm[xi]+yi]/255,b=perm[perm[xi+1]+yi]/255,c=perm[perm[xi]+yi+1]/255,d=perm[perm[xi+1]+yi+1]/255;return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}

function fbm(x,y)
{
  return vnoise(x,y)*.55+vnoise(x*2.1+7,y*2.1)*.3+vnoise(x*4.3+13,y*4.3)*.15;
}

function groundH(x,z)
{
  const r=fbm(x*.012,z*.012)*90;const valley=Math.exp(-Math.pow((x-Math.sin(z*.004)*120-Math.sin(z*.0013)*80)/90,2));return r*(1-valley*.92)+4;
}

const COLS=64,ROWS=48,xs=new Float32Array(COLS*ROWS),ys=new Float32Array(COLS*ROWS),hs=new Float32Array(COLS*ROWS);
let camZ=0,camX=0,steer=0,steerT=0,thr=.55,thrT=.55,hdg=0,dist=0,bank=0;
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;if(red)thrT=.3;
const stars=Array.from(
{
  length:160
}
,()=>(
{
  x:Math.random(),y:Math.random()*.5,p:Math.random()*7
}
));
addEventListener('pointermove',e=>
{
  steerT=((e.clientX/W)-.5)*2;
}
);
addEventListener('wheel',e=>
{
  thrT=Math.min(1,Math.max(.05,thrT-e.deltaY*.0006));
}
,
{
  passive:true
}
);
addEventListener('keydown',e=>
{
  if(e.code==='ArrowLeft')steerT=-1;if(e.code==='ArrowRight')steerT=1;if(e.code==='ArrowUp')thrT=Math.min(1,thrT+.08);if(e.code==='ArrowDown')thrT=Math.max(.05,thrT-.08);if(e.code==='Space')
{
  e.preventDefault();togglePause();
}

}
);
let touchX=null,touchY=null;
addEventListener('touchstart',e=>
{
  touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;
}
,
{
  passive:true
}
);
addEventListener('touchmove',e=>
{
  if(touchX==null)return;steerT=Math.max(-1,Math.min(1,(e.touches[0].clientX/W-.5)*2));thrT=Math.max(.05,Math.min(1,thrT-(e.touches[0].clientY-touchY)*.003));touchY=e.touches[0].clientY;
}
,
{
  passive:true
}
);
function togglePause()
{
  paused=!paused;document.getElementById('paused').style.display=paused?'block':'none';document.querySelector('[data-m="pause"]').classList.toggle('on',paused);
}

document.querySelectorAll('#segPal button').forEach(b=>b.onclick=()=>
{
  pal=+b.dataset.p;document.querySelectorAll('#segPal button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.documentElement.style.setProperty('--acc',PALS[pal].glow);
}
);
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>
{
  const m=b.dataset.m;if(m==='pause')
{
  togglePause();return;
}
mode=m;document.querySelectorAll('#segMode button').forEach(x=>
{
  if(x.dataset.m!=='pause')x.classList.remove('on');
}
);b.classList.add('on');
}
);
const vAlt=document.getElementById('vAlt'),vSpd=document.getElementById('vSpd'),vHdg=document.getElementById('vHdg'),vDst=document.getElementById('vDst');
let last=performance.now(),hudT=0;
function frame(now)
{
  requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)
{
  draw(0);return;
}

steer+=(steerT-steer)*Math.min(1,dt*3);thr+=(thrT-thr)*Math.min(1,dt*2);
bank=steer*28;hdg=(hdg+steer*dt*22+360)%360;
const spd=60+thr*(red?140:420);camZ+=spd*dt*(red?.5:1);camX+=steer*dt*90+Math.sin(now*.0004)*8*dt;dist+=spd*dt/1000;
const swayX=red?0:Math.sin(now*.0006)*14, swayY=red?0:Math.sin(now*.0009)*6;
draw(dt,swayX,swayY,spd,now);
hudT+=dt;if(hudT>.08)
{
  hudT=0;const g=groundH(camX,camZ);vAlt.textContent=String(Math.round(120+g)).padStart(4,'0')+' m';vSpd.textContent=Math.round(spd*.9)+' kn';vHdg.textContent=String(Math.round(hdg)).padStart(3,'0')+'°';vDst.textContent=dist.toFixed(1)+' km';document.getElementById('thrfill').style.height=(thr*100)+'%';document.getElementById('thrv').textContent=Math.round(thr*100)+'%';document.getElementById('horg').setAttribute('transform',`rotate($
{
  -bank
}
 50 50) translate(0 $
{
  (thr-.5)*26
}
)`);
}

}

function draw(dt,swayX,swayY,spd,now)
{
  const P=PALS[pal];const hz=H*.42;const f=Math.max(W,H)*1.1;
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,P.top);g.addColorStop(.42,P.hor);g.addColorStop(.46,P.hor);g.addColorStop(1,'#020204');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle=P.star;for(const s of stars)
{
  const tw=red?1:(.4+.6*Math.abs(Math.sin(now*.001+s.p)));ctx.globalAlpha=tw*(1-s.y*1.4);ctx.fillRect(s.x*W,s.y*H,1.6,1.6);
}
ctx.globalAlpha=1;
const sx=W/2,sy=hz-70,r=Math.min(W,H)*.11;const sg=ctx.createLinearGradient(0,sy-r,0,sy+r);sg.addColorStop(0,P.s1);sg.addColorStop(1,P.s2);ctx.save();ctx.fillStyle=sg;ctx.shadowColor=P.s2;ctx.shadowBlur=40;ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fill();ctx.restore();
ctx.fillStyle=P.top;for(let i=0;i<7;i++)
{
  const yy=sy-r+ (i/7)*r*2;ctx.fillRect(sx-r-6,yy,r*2+12,2+i*1.6);
}

ctx.fillStyle=P.hor;ctx.globalAlpha=.5;ctx.fillRect(0,hz-2,W,4);ctx.globalAlpha=1;
const far=1600;for(let j=0;j<ROWS;j++)
{
  const zj=Math.pow(j/(ROWS-1),2.2)*far+8;for(let i=0;i<COLS;i++)
{
  const wx=(i/(COLS-1)-.5)*1600+camX;const h=groundH(wx,camZ+zj);hs[j*COLS+i]=h;const px=(wx-camX)/ (zj) *f + W/2 + swayX;const py=hz - (h-10)/(zj)*f*.6 + swayY;xs[j*COLS+i]=px;ys[j*COLS+i]=py;
}

}

ctx.save();ctx.translate(W/2,hz);ctx.rotate(bank*Math.PI/180*.5);ctx.translate(-W/2,-hz);
const L=P.line;
if(mode==='solid')
{
  for(let j=ROWS-2;j>=0;j--)
{
  for(let i=0;i<COLS-1;i++)
{
  const z0=Math.pow(j/(ROWS-1),2.2)*far+8;const fog=1-Math.pow(z0/far,1.1);const h=(hs[j*COLS+i]+hs[j*COLS+i+1]+hs[(j+1)*COLS+i]+hs[(j+1)*COLS+i+1])/4;const li=Math.max(.08,Math.min(1,(h/70+.5)))*fog;ctx.fillStyle=`rgba($
{
  L[0]*li|0
}
,$
{
  L[1]*li|0
}
,$
{
  L[2]*li|0
}
,$
{
  .25+.7*fog
}
)`;ctx.strokeStyle=`rgba($
{
  L
}
,.25)`;ctx.beginPath();ctx.moveTo(xs[j*COLS+i],ys[j*COLS+i]);ctx.lineTo(xs[j*COLS+i+1],ys[j*COLS+i+1]);ctx.lineTo(xs[(j+1)*COLS+i+1],ys[(j+1)*COLS+i+1]);ctx.lineTo(xs[(j+1)*COLS+i],ys[(j+1)*COLS+i]);ctx.closePath();ctx.fill();
}

}

}

else
{
  for(let j=ROWS-2;j>=0;j--)
{
  const z0=Math.pow(j/(ROWS-1),2.2)*far+8;const fog=1-Math.pow(z0/far,1.1);ctx.fillStyle='rgba(1,4,9,.88)';ctx.beginPath();ctx.moveTo(xs[j*COLS],ys[j*COLS]);for(let i=1;i<COLS;i++)ctx.lineTo(xs[j*COLS+i],ys[j*COLS+i]);for(let i=COLS-1;i>=0;i--)ctx.lineTo(xs[(j+1)*COLS+i],ys[(j+1)*COLS+i]+2);ctx.closePath();ctx.fill();ctx.strokeStyle=`rgba($
{
  L[0]
}
,$
{
  L[1]
}
,$
{
  L[2]
}
,$
{
  .06+.9*fog
}
)`;ctx.lineWidth=.5+2.2*fog;ctx.beginPath();for(let i=0;i<COLS;i++)
{
  i?ctx.lineTo(xs[j*COLS+i],ys[j*COLS+i]):ctx.moveTo(xs[j*COLS+i],ys[j*COLS+i]);
}
ctx.stroke();
}

for(let i=0;i<COLS;i++)
{
  const gr=ctx.createLinearGradient(0,hz,0,H);gr.addColorStop(0,`rgba($
{
  L[0]
}
,$
{
  L[1]
}
,$
{
  L[2]
}
,0)`);gr.addColorStop(1,`rgba($
{
  L[0]
}
,$
{
  L[1]
}
,$
{
  L[2]
}
,.8)`);ctx.strokeStyle=gr;ctx.lineWidth=1;ctx.beginPath();for(let j=0;j<ROWS;j++)
{
  j?ctx.lineTo(xs[j*COLS+i],ys[j*COLS+i]):ctx.moveTo(xs[j*COLS+i],ys[j*COLS+i]);
}
ctx.stroke();
}

ctx.strokeStyle='#fff';ctx.shadowColor=P.glow;ctx.shadowBlur=16;ctx.lineWidth=2.4;ctx.beginPath();for(let i=0;i<COLS;i++)
{
  i?ctx.lineTo(xs[i],ys[i]):ctx.moveTo(xs[i],ys[i]);
}
ctx.stroke();ctx.shadowBlur=0;
}

ctx.restore();
if(thr>.62&&!red)
{
  const cx0=W/2,cy0=hz;ctx.save();ctx.strokeStyle='rgba(255,255,255,'+((thr-.62)*1.6)+')';for(let i=0;i<26;i++)
{
  const a=Math.random()*Math.PI*2,rr=60+Math.random()*Math.max(W,H)*.5;ctx.lineWidth=Math.random()*2+.5;ctx.beginPath();ctx.moveTo(cx0+Math.cos(a)*rr*.3,cy0+Math.sin(a)*rr*.3);ctx.lineTo(cx0+Math.cos(a)*rr,cy0+Math.sin(a)*rr);ctx.stroke();
}
ctx.restore();
}

const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);

}

requestAnimationFrame(frame);
</script>
</body>
</html>
