Build a single self-contained HTML page titled "Pixel Art Studio — Sprite Editor": a compact but complete pixel-art editor with a beautiful modern dark interface. The canvas of the app is near-black (#0d0e13) with two soft radial glows, violet (#8b7cff at 18 %) top-left and mint (#5ff2c1 at 12 %) bottom-right; panels are #151720 with hairline borders rgba(255,255,255,0.07) and 16 px radii; secondary surfaces are #1c1f2a; text is #e9ecf5 with muted #8a90a6; accent violet #8b7cff, accent mint #5ff2c1. Typography is ui-sans-serif/system-ui for labels and ui-monospace for coordinates, hex codes, shortcut keys and small-cap section headings. Every control is a pill: rounded-full buttons that lift 1 px on hover, compress on press, show a violet-tinted pressed state with an inset ring when active, and carry a tiny dark keycap showing their shortcut. The primary "Export PNG ×10" pill is a violet gradient with a coloured drop shadow.

Editor behaviour: the drawing surface is a canvas sized N×zoom CSS pixels with a devicePixelRatio-scaled backing store so cells stay crisp; it draws a two-tone checkerboard for transparency, the filled cells, a faint grid when zoom ≥ 8, a mint centre line when mirroring, and a white hover outline (plus a mint mirrored outline). Pencil and eraser interpolate between successive pointer positions with Bresenham so fast strokes have no gaps; Line shows a live preview from the press point and commits on release; Fill is a stack-based flood fill over the contiguous region of identical colour (with a second pass for the mirrored region when Mirror X is on); Eyedropper picks a cell's colour then returns to the previous tool, and Alt-click or right-click samples at any time. Mirror X writes every edit to x and N−1−x. Undo/redo keep up to 80 snapshots; a snapshot is taken at pointer-down and only kept if the stroke changed something. Changing grid size resamples the current art with nearest-neighbour so nothing is lost. Export renders the sprite to an N×10 canvas with imageSmoothingEnabled = false and downloads it as sprite-NxN-x10.png. Keyboard: B E G I L M, Z undo, Shift+Z redo, Ctrl/Cmd+Z and Ctrl/Cmd+Y, [ and ] to zoom.

<main>
<div class="rail"><div class="card"><h3>TOOLS</h3><div id="tools"></div></div><div class="card"><h3>CANVAS</h3><label style="font-size:12px">Grid <select id="gsize" style="background:#1c1f2a;

<script>
const PICO=['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa','#291814','#111d35','#422136','#125359','#742f29','#49333b','#a28879','#f3ef7d','#be1250','#ff6c24','#a8e72e','#00b543','#065ab5','#754665','#ff6e59','#ff9d81'];

let N=32,zoom=12,tool='pencil',color='#ff77a8',mirror=false,grid=new Map(),undoS=[],redoS=[];

const art=document.getElementById('art'),ctx=art.getContext('2d');

const tools=[['pencil','B','M4 20 L14 10 M12 4 l4 4 L6 18 l-5 1 1-5Z'],['eraser','E','M5 15 L15 5 l4 4 -10 10 H5Z'],['fill','G','M4 12 h16 v4 h-16Z M12 4 v16'],['picker','I','M10 4 a6 6 0 1 0 6 6 L20 14'],['line','L','M4 20 L20 4']];

const tbox=document.getElementById('tools');

tools.forEach(([n,k,path])=>{const b=document.createElement('button');
b.className='tool'+(n===tool?' act':'');
b.dataset.t=n;
b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${path}"/></svg>${n[0].toUpperCase()+n.slice(1)}<span class="keycap">${k}</span>`;
b.onclick=()=>setTool(n);
tbox.appendChild(b)});

const mB=document.createElement('button');
mB.className='tool';
mB.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18 M7 8 L3 12 l4 4 M17 8 l4 4 -4 4"/></svg>Mirror X<span class="keycap">M</span>`;
mB.onclick=()=>{mirror=!mirror;
mB.classList.toggle('act',mirror);
toast('Mirror X '+(mirror?'on':'off'))};
tbox.appendChild(mB);

function setTool(n){tool=n;
document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('act',b.dataset.t===n));
document.getElementById('tname').textContent=n[0].toUpperCase()+n.slice(1)}
function key(x,y){return x+','+y}
function fit(){const d=devicePixelRatio||1;
art.style.width=N*zoom+'px';
art.style.height=N*zoom+'px';
art.width=N*zoom*d;
art.height=N*zoom*d;
ctx.setTransform(zoom*d,0,0,zoom*d,0,0);
ctx.imageSmoothingEnabled=false;
draw();
document.getElementById('ginfo').textContent=N+'×'+N;
document.getElementById('zinfo').textContent=zoom+'px';
document.getElementById('zv').textContent=zoom}
function draw(hover,lineTo){ctx.clearRect(0,0,N,N);
for(let y=0;
y<N;
y++)for(let x=0;
x<N;
x++){if((x+y)%2===0){ctx.fillStyle='#14161f';
ctx.fillRect(x,y,1,1)}else{ctx.fillStyle='#101218';
ctx.fillRect(x,y,1,1)}}
grid.forEach((c,k)=>{const[x,y]=k.split(',').map(Number);
ctx.fillStyle=c;
ctx.fillRect(x,y,1,1)});

if(lineTo){ctx.fillStyle=color+'88';
line(lineTo[0],lineTo[1],hover[0],hover[1],(x,y)=>ctx.fillRect(x,y,1,1))}
if(zoom>=8){ctx.strokeStyle='rgba(255,255,255,.06)';
ctx.lineWidth=1/zoom;
for(let i=0;
i<=N;
i++){ctx.beginPath();
ctx.moveTo(i,0);
ctx.lineTo(i,N);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(0,i);
ctx.lineTo(N,i);
ctx.stroke()}}
if(mirror){ctx.strokeStyle='#5ff2c1';
ctx.lineWidth=2/zoom;
ctx.beginPath();
ctx.moveTo(N/2,0);
ctx.lineTo(N/2,N);
ctx.stroke()}
if(hover&&hover[0]>=0&&hover[0]<N){ctx.strokeStyle='#fff';
ctx.lineWidth=2/zoom;
ctx.strokeRect(hover[0],hover[1],1,1);
if(mirror){ctx.strokeStyle='#5ff2c1';
ctx.strokeRect(N-1-hover[0],hover[1],1,1)}}
preview()}
function preview(){for(const[id,s]of[['p1',2],['p2',3],['hero',8]]){const c=document.getElementById(id),g=c.getContext('2d');
c.width=N;
c.height=N;
g.imageSmoothingEnabled=false;
g.clearRect(0,0,N,N);
grid.forEach((col,k)=>{const[x,y]=k.split(',').map(Number);
g.fillStyle=col;
g.fillRect(x,y,1,1)})}}
function put(x,y,c){if(x<0||y<0||x>=N||y>=N)return;
const m=mirror?[[x,y],[N-1-x,y]]:[[x,y]];
m.forEach(([a,b])=>{if(c===null)grid.delete(key(a,b));
else grid.set(key(a,b),c)})}
function line(x0,y0,x1,y1,fn){let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
while(true){fn(x0,y0);
if(x0===x1&&y0===y1)break;
const e2=2*e;
if(e2>=dy){e+=dy;
x0+=sx}if(e2<=dx){e+=dx;
y0+=sy}}}
function fill(x,y,c){const t=grid.get(key(x,y))||null;
if(t===c)return;
const st=[[x,y]];
while(st.length){const[a,b]=st.pop();
if(a<0||b<0||a>=N||b>=N)continue;
if((grid.get(key(a,b))||null)!==t)continue;
put(a,b,c);
st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}if(mirror){const mx=N-1-x;
const st2=[[mx,y]];
const t2=grid.get(key(mx,y))||null;
if(t2!==t){} }}
function snap(){undoS.push(new Map(grid));
if(undoS.length>80)undoS.shift();
redoS=[]}
let down=false,start=null,moved=false,prevT=null;

function cell(e){const r=art.getBoundingClientRect();
return[Math.floor((e.clientX-r.left)/r.width*N),Math.floor((e.clientY-r.top)/r.height*N)]}
art.addEventListener('pointerdown',e=>{e.preventDefault();
art.setPointerCapture(e.pointerId);
const[x,y]=cell(e);

if(e.button===2||e.altKey){const c=grid.get(key(x,y));
if(c){color=c;
syncCol()}return}
snap();
down=true;
moved=false;
start=[x,y];
prevT=tool;

if(tool==='picker'){const c=grid.get(key(x,y));
if(c){color=c;
syncCol()}setTool(prevTTool);
down=false;
undoS.pop();
return}
if(tool==='fill'){fill(x,y,color);
draw();
down=false;
return}
stroke(x,y,x,y)});

let prevTTool='pencil';

art.addEventListener('pointermove',e=>{const[x,y]=cell(e);
document.getElementById('pos').textContent=x+','+y;

if(tool==='picker'&&!down){draw([x,y]);
return}
if(!down){draw([x,y]);
return}
if(tool==='line'){draw([x,y],start);
return}
const[a,b]=start;
if(a===x&&b===y&&!moved){stroke(x,y,x,y);
return}
line(a,b,x,y,(px,py)=>stroke(px,py,px,py,true));
start=[x,y];
moved=true});

addEventListener('pointerup',()=>{if(down&&tool==='line'&&start){const h=null}if(down){if(tool==='line'){/* commit from draw preview: re-apply */}draw()}down=false;
preview()});

function stroke(x0,y0,x1,y1,skip){if(tool==='pencil')put(x1,y1,color);
else if(tool==='eraser')put(x1,y1,null);
else if(tool==='line'&&!skip){}draw();
moved=true}
// line commit on release
art.addEventListener('pointerup',e=>{if(prevT==='line'&&start){const[x,y]=cell(e);
snap2line(start,[x,y])}});

function snap2line(a,b){if(!a||!b)return;
if(undoS.length&&prevT==='line'){/* already snapped at down */}line(a[0],a[1],b[0],b[1],(x,y)=>put(x,y,color));
draw()}
art.addEventListener('contextmenu',e=>e.preventDefault());

const palBox=document.getElementById('pal');

PICO.forEach(c=>{const b=document.createElement('button');
b.style.background=c;
b.title=c;
b.onclick=()=>{color=c;
syncCol();
palBox.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
b.classList.add('sel')};
palBox.appendChild(b)});

function syncCol(){document.getElementById('curSw').style.background=color;
document.getElementById('curSw').style.color=color;
document.getElementById('hex').textContent=color.toUpperCase()}
syncCol();

document.getElementById('nat').oninput=e=>{color=e.target.value;
syncCol()};

document.getElementById('useNat').onclick=()=>{color=document.getElementById('nat').value;
syncCol();
toast('Custom '+color)};

document.getElementById('undo').onclick=()=>{if(!undoS.length)return;
redoS.push(new Map(grid));
grid=undoS.pop();
draw()};

document.getElementById('redo').onclick=()=>{if(!redoS.length)return;
undoS.push(new Map(grid));
grid=redoS.pop();
draw()};

document.getElementById('clear').onclick=()=>{snap();
grid.clear();
draw();
toast('Canvas cleared')};

document.getElementById('exp').onclick=()=>{const c=document.createElement('canvas');
c.width=N*10;
c.height=N*10;
const g=c.getContext('2d');
g.imageSmoothingEnabled=false;
grid.forEach((col,k)=>{const[x,y]=k.split(',').map(Number);
g.fillStyle=col;
g.fillRect(x*10,y*10,10,10)});
const a=document.createElement('a');
a.download=`sprite-${N}x${N}-x10.png`;
a.href=c.toDataURL();
a.click();
toast('Exported PNG ×10')};

document.getElementById('gsize').onchange=e=>{const n=+e.target.value;
const ng=new Map();
grid.forEach((c,k)=>{const[x,y]=k.split(',').map(Number);
const nx=Math.floor(x/N*n),ny=Math.floor(y/N*n);
ng.set(key(nx,ny),c)});
N=n;
grid=ng;
fit()};

document.getElementById('zoom').oninput=e=>{zoom=+e.target.value;
fit()};

document.getElementById('crt').onchange=e=>document.getElementById('crtw').classList.toggle('crt',e.target.checked);

function toast(m){const t=document.getElementById('toast');
t.textContent=m;
t.classList.add('show');
clearTimeout(t._h);
t._h=setTimeout(()=>t.classList.remove('show'),1600);
document.getElementById('msg').textContent=m}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if((e.metaKey||e.ctrlKey)&&k==='z'&&!e.shiftKey){e.preventDefault();
document.getElementById('undo').click();
return}if(((e.metaKey||e.ctrlKey)&&k==='y')||k==='Z'&&e.shiftKey){document.getElementById('redo').click();
return}
if(k==='b')setTool('pencil');
if(k==='e')setTool('eraser');
if(k==='g')setTool('fill');
if(k==='i'){prevTTool=tool;
setTool('picker')}if(k==='l')setTool('line');
if(k==='m')mB.click();
if(k==='z'&&!e.metaKey&&!e.ctrlKey)document.getElementById('undo').click();
if(k==='['){zoom=Math.max(4,zoom-2);
document.getElementById('zoom').value=zoom;
fit()}if(k===']'){zoom=Math.min(28,zoom+2);
document.getElementById('zoom').value=zoom;
fit()}});
