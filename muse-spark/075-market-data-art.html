<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurum Exchange — Market Data as Art</title>
<style>
:root
{
  --mint:#2ee59d;--rose:#ff5c7a;--gold:#d4af37;--bg:#07080a
}

*
{
  box-sizing:border-box
}
body
{
  margin:0;background:var(--bg);color:#e8e6df;font-family:ui-sans-serif,system-ui,"Helvetica Neue",sans-serif;min-height:100vh
}

#sonar
{
  position:fixed;inset:0;z-index:0
}
#grain
{
  position:fixed;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:4px 4px;opacity:.5
}

header
{
  position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(212,175,55,.25);flex-wrap:wrap
}

.word
{
  letter-spacing:.34em;font-weight:300;font-size:14px
}
.word b
{
  color:var(--gold);font-weight:700
}

.live
{
  display:flex;align-items:center;gap:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px
}
.dot
{
  width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:bl 1.4s infinite
}

@keyframes bl
{
  50%
{
  opacity:.3
}

}

.tf
{
  display:flex;gap:6px;margin-left:auto
}
.tf button,.syms button
{
  border:1px solid rgba(212,175,55,.4);background:transparent;color:#e8e6df;border-radius:999px;padding:7px 15px;font-family:ui-monospace,monospace;font-size:12px;cursor:pointer
}

.tf button.on
{
  background:var(--gold);color:#111;font-weight:800
}

.syms
{
  display:flex;gap:6px;flex-wrap:wrap
}

.syms button.on
{
  border-color:var(--mint);box-shadow:0 0 10px rgba(46,229,157,.5)
}

main
{
  position:relative;z-index:2;display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:16px 20px
}

.panel
{
  background:rgba(12,14,18,.82);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:14px;position:relative;overflow:hidden
}

.panel::before
{
  content:"";position:absolute;top:0;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)
}

.panel h3
{
  margin:0 0 10px;font-size:10px;letter-spacing:.3em;color:#b8b4a8
}

#last
{
  font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:300;text-shadow:0 0 18px rgba(212,175,55,.4)
}

#chg
{
  font-family:ui-monospace,monospace;font-size:14px
}
.up
{
  color:var(--mint)
}
.dn
{
  color:var(--rose)
}

.stats
{
  display:flex;gap:18px;font-family:ui-monospace,monospace;font-size:12px;color:#b8b4a8;margin:6px 0 10px;flex-wrap:wrap
}

canvas.chart
{
  width:100%;display:block;border-radius:8px
}

.right
{
  display:flex;flex-direction:column;gap:14px
}

#heat
{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px
}

.cell
{
  border-radius:8px;padding:10px 8px;font-size:11px;text-align:center;transition:background 1.2s,color 1.2s,transform .2s;cursor:default;min-height:64px;display:flex;flex-direction:column;justify-content:center
}

.cell:hover
{
  transform:scale(1.05);outline:1px solid var(--gold)
}

.cell b
{
  display:block;font-size:12px
}
.cell span
{
  font-family:ui-monospace,monospace
}

footer
{
  position:relative;z-index:2;height:38px;overflow:hidden;border-top:1px solid rgba(212,175,55,.3);background:#0c0e12;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)
}

#tape
{
  display:flex;gap:34px;white-space:nowrap;animation:mq 48s linear infinite;font-family:ui-monospace,monospace;font-size:12px
}

footer:hover #tape
{
  animation-play-state:paused
}

@keyframes mq
{
  to
{
  transform:translateX(-50%)
}

}

@media(max-width:900px)
{
  main
{
  grid-template-columns:1fr
}

}

@media(prefers-reduced-motion:reduce)
{
  #tape
{
  animation-duration:120s
}
.dot
{
  animation:none
}

}

</style>
</head>
<body>
<canvas id="sonar"></canvas><div id="grain"></div>
<header><div class="word"><b>AURUM</b> EXCHANGE</div><div class="live"><span class="dot"></span><span>Synthetic feed · <b id="symName">AUR/USD</b> · <span id="clock">--:--:--</span></span></div><div class="syms" id="syms"></div><div class="tf" id="tf"><button data-tf="60" class="on">1m</button><button data-tf="300">5m</button><button data-tf="3600">1h</button></div></header>
<main>
<div class="panel"><h3>PRICE · CANDLES · SONAR FEED</h3><div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap"><div id="last">1240.00</div><div id="chg" class="up">+0.00 (+0.00%)</div></div><div class="stats"><span>HIGH <b id="hi">–</b></span><span>LOW <b id="lo">–</b></span><span>VOLATILITY <b id="vol">–</b></span><span id="symMeta">AUR · base 1240</span></div><canvas id="price" class="chart" height="320"></canvas></div>
<div class="right">
<div class="panel"><h3>DEPTH OF MARKET</h3><canvas id="depth" style="width:100%" height="220"></canvas></div>
<div class="panel"><h3>SECTOR HEAT · 12</h3><div id="heat"></div></div>
</div>
</main>
<footer><div id="tape"></div></footer>
<script>
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SYMS=[['AUR',1240],['PHTN',88.4],['ORBF',212.7],['SYNB',45.2],['DSAL',31.9],['FUSN',402.1],['QFAB',156.3],['VFRM',27.5],['CART',64.8],['COLD',19.4],['LUNA',98.6],['TXTL',12.2],['TMBR',54.0],['HELX',77.7],['MIRA',133.3],['ZEPH',66.1]];
let sym=0,base=1240,bucket=60;
let ticks=[],sig=.0006;const OM=.0000002,AL=.09,BE=.9;
function gen(n)
{
  for(let i=0;i<n;i++)
{
  const r=(Math.random()-.5)*2*Math.sqrt(sig)*3;sig=OM+AL*r*r+BE*sig;const prev=ticks.length?ticks[ticks.length-1].p:base;const p=prev*(1+r)+ (base-prev)*.0004;ticks.push(
{
  p,t:i
}
);
}

}

gen(32000);
const sc=document.getElementById('sonar'),sx=sc.getContext('2d');let rings=[];
function rss()
{
  sc.width=innerWidth;sc.height=innerHeight;
}
rss();addEventListener('resize',rss);
const pc=document.getElementById('price'),px=pc.getContext('2d');
const dc=document.getElementById('depth'),dx=dc.getContext('2d');
function fit(c)
{
  const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=(+c.getAttribute('height')||220)*d;c.getContext('2d').setTransform(d,0,0,d,0,0);return 
{
  w:r.width,h:+c.getAttribute('height')||220
}
;
}

let PW=
{
  w:600,h:320
}
,DW=
{
  w:300,h:220
}
;
function refit()
{
  PW=fit(pc);DW=fit(dc);
}
setTimeout(refit,50);addEventListener('resize',refit);
const sectors=['Photonics','Orbital Freight','Synthetic Bio','Desalination','Fusion Util','Quantum Fabs','Vertical Farms','Cartography','Cold Storage','Lunar Leisure','Textiles','Timber'].map(n=>(
{
  n,v:(Math.random()*4-2)
}
));
const heat=document.getElementById('heat');const cells=sectors.map(s=>
{
  const d=document.createElement('div');d.className='cell';heat.appendChild(d);return d;
}
);
function drawHeat()
{
  sectors.forEach((s,i)=>
{
  const c=cells[i];const col=s.v>=0?`rgba(46,229,157,$
{
  Math.min(.9,Math.abs(s.v)/5+.12)
}
)`:`rgba(255,92,122,$
{
  Math.min(.9,Math.abs(s.v)/5+.12)
}
)`;c.style.background=col;c.style.color=Math.abs(s.v)>3?'#111':'#e8e6df';c.innerHTML=`<b>$
{
  s.n
}
</b><span>$
{
  s.v>=0?'+':''
}
$
{
  s.v.toFixed(2)
}
%</span>`;
}
);
}

drawHeat();
const tape=document.getElementById('tape');let tapeData=SYMS.map(s=>(
{
  s:s[0],p:s[1],c:0
}
));
function drawTape()
{
  tape.innerHTML=(tapeData.concat(tapeData)).map(t=>`<span><b>$
{
  t.s
}
</b> $
{
  t.p.toFixed(2)
}
 <span class="$
{
  t.c>=0?'up':'dn'
}
">$
{
  t.c>=0?'▲':'▼'
}
 $
{
  Math.abs(t.c).toFixed(2)
}
%</span></span>`).join('');
}

drawTape();
const symBox=document.getElementById('syms');['AUR','FUSN','QFAB','LUNA'].forEach(n=>
{
  const b=document.createElement('button');b.textContent=n;if(n==='AUR')b.classList.add('on');b.onclick=()=>
{
  document.querySelectorAll('#syms button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const f=SYMS.find(s=>s[0]===n);sym=SYMS.indexOf(f);base=f[1];document.getElementById('symName').textContent=n+'/USD';document.getElementById('symMeta').textContent=n+' · base '+base;ticks=[];sig=.0006;gen(32000);rings=[];
}
;symBox.appendChild(b);
}
);
document.querySelectorAll('#tf button').forEach(b=>b.onclick=()=>
{
  document.querySelectorAll('#tf button').forEach(x=>x.classList.remove('on'));b.classList.add('on');bucket=+b.dataset.tf;cache=
{
  
}
;
}
);
let cache=
{
  
}
;
function candles()
{
  const key=bucket+'_'+ticks.length;if(cache.key===key)return cache.v;const bs=bucket/7.5;const per=Math.max(1,Math.round(bs));const n=Math.min(120,Math.floor(PW.w/8));const out=[];for(let i=0;i<n;i++)
{
  const e=ticks.length-(n-i)*per,s=Math.max(0,e);const sl=ticks.slice(s,s+per);if(!sl.length)continue;out.push(
{
  o:sl[0].p,h:Math.max(...sl.map(x=>x.p)),l:Math.min(...sl.map(x=>x.p)),c:sl[sl.length-1].p
}
);
}
cache=
{
  key,v:out
}
;return out;
}

function drawPrice()
{
  const cs=candles();if(!cs.length)return;px.clearRect(0,0,PW.w,PW.h);let hi=Math.max(...cs.map(c=>c.h)),lo=Math.min(...cs.map(c=>c.l));const pad=(hi-lo||1)*.12;hi+=pad;lo-=pad;const X=i=>10+i*(PW.w-70)/cs.length,Y=p=>10+(1-(p-lo)/(hi-lo))*(PW.h-70);
px.strokeStyle='rgba(212,175,55,.35)';px.fillStyle='#8f8b7f';px.font='10px monospace';px.textAlign='left';for(let k=0;k<5;k++)
{
  const v=lo+(hi-lo)*k/4,y=Y(v);px.beginPath();px.moveTo(0,y);px.lineTo(PW.w-60,y);px.stroke();px.fillText(v.toFixed(1),PW.w-56,y+3);
}

const slot=(PW.w-70)/cs.length;cs.forEach((c,i)=>
{
  const up=c.c>=c.o;px.strokeStyle=up?'#2ee59d':'#ff5c7a';px.fillStyle=up?'rgba(0,0,0,0)':'#ff5c7a';px.lineWidth=1;const x=X(i)+slot/2;px.beginPath();px.moveTo(x,Y(c.h));px.lineTo(x,Y(c.l));px.stroke();const bw=slot*.55,bx=x-bw/2;if(i===cs.length-1)
{
  px.shadowBlur=18;px.shadowColor=up?'#2ee59d':'#ff5c7a';
}
else
{
  px.shadowBlur=0;
}
px.strokeRect(bx,Y(Math.max(c.o,c.c)),bw,Math.max(1,Math.abs(Y(c.o)-Y(c.c))));if(!up)px.fillRect(bx,Y(Math.max(c.o,c.c)),bw,Math.max(1,Math.abs(Y(c.o)-Y(c.c))));px.shadowBlur=0;if(i===cs.length-1)
{
  px.fillStyle=up?'#2ee59d':'#ff5c7a';px.beginPath();px.arc(x,Y(c.c),4,0,7);px.fill();
}

}
);
const last=cs[cs.length-1].c;px.setLineDash([5,4]);px.strokeStyle='#d4af37';px.beginPath();px.moveTo(0,Y(last));px.lineTo(PW.w-60,Y(last));px.stroke();px.setLineDash([]);px.fillStyle=last>=cs[cs.length-1].o?'#2ee59d':'#ff5c7a';px.fillRect(PW.w-60,Y(last)-9,56,18);px.fillStyle='#111';px.fillText(last.toFixed(1),PW.w-54,Y(last)+3);
const e0=cs[0].o;document.getElementById('last').textContent=last.toFixed(2);const ch=last-e0,pct=ch/e0*100;const ce=document.getElementById('chg');ce.textContent=`$
{
  ch>=0?'+':''
}
$
{
  ch.toFixed(2)
}
 ($
{
  pct.toFixed(2)
}
%)`;ce.className=ch>=0?'up':'dn';document.getElementById('hi').textContent=hi.toFixed(1);document.getElementById('lo').textContent=lo.toFixed(1);document.getElementById('vol').textContent=(Math.sqrt(sig)*100).toFixed(3)+'%';
}

let book=Array.from(
{
  length:44
}
,(_,i)=>(
{
  v:10+Math.random()*40,side:i<22?0:1
}
));
function drawDepth(t)
{
  dx.clearRect(0,0,DW.w,DW.h);const breathe=1+.08*Math.sin(t/900);dx.fillStyle='#d4af37';dx.fillRect(DW.w/2-1,0,2,DW.h);book.forEach((b,i)=>
{
  if(Math.random()<.1)b.v=Math.max(2,b.v+(Math.random()-.5)*6);const row=i%22,y=6+row*(DW.h-12)/22,h=(DW.h-12)/22-3;const w=Math.min(DW.w/2-8,b.v*breathe*1.6);if(b.side===0)
{
  const g=dx.createLinearGradient(DW.w/2-w,0,DW.w/2,0);g.addColorStop(0,'rgba(46,229,157,.15)');g.addColorStop(1,'rgba(46,229,157,.9)');dx.fillStyle=g;dx.fillRect(DW.w/2-w,y,w,h);
}
else
{
  const g=dx.createLinearGradient(DW.w/2,0,DW.w/2+w,0);g.addColorStop(0,'rgba(255,92,122,.9)');g.addColorStop(1,'rgba(255,92,122,.15)');dx.fillStyle=g;dx.fillRect(DW.w/2,y,w,h);
}
if(row%4===0)
{
  dx.fillStyle='#8f8b7f';dx.font='9px monospace';dx.fillText((base+(i-22)*1.4).toFixed(1),i<22?4:DW.w-44,y+9);
}

}
);
}

function tick()
{
  const r=(Math.random()-.5)*2*Math.sqrt(sig)*3;sig=OM+AL*r*r+BE*sig;const prev=ticks[ticks.length-1].p;const p=prev*(1+r)+(base-prev)*.0004;ticks.push(
{
  p,t:ticks.length
}
);if(ticks.length>34000)ticks.splice(0,2000);cache=
{
  
}
;
const up=r>=0;rings.push(
{
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:6,max:30+Math.abs(r)*9000,c:up?'46,229,157':'255,92,122',a:.5
}
);if(rings.length>90)rings.shift();
sectors[Math.floor(Math.random()*sectors.length)].v+=r*40;tapeData.forEach(t=>
{
  if(Math.random()<.3)
{
  t.p*=1+r*.6;t.c+=r*30;
}

}
);drawTape();
}

setInterval(tick,red?360:130);
setInterval(()=>
{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB');
}
,1000);
(function loop(t)
{
  requestAnimationFrame(loop);sx.clearRect(0,0,sc.width,sc.height);sx.fillStyle='#07080a';sx.fillRect(0,0,sc.width,sc.height);rings=rings.filter(q=>q.a>.01);for(const q of rings)
{
  q.r+=(q.max-q.r)*.04+.6;q.a*=.965;sx.strokeStyle=`rgba($
{
  q.c
}
,$
{
  q.a
}
)`;sx.lineWidth=1.5;sx.beginPath();sx.arc(q.x,q.y,q.r,0,7);sx.stroke();sx.strokeStyle=`rgba($
{
  q.c
}
,$
{
  q.a*.5
}
)`;sx.beginPath();sx.arc(q.x,q.y,q.r*.55,0,7);sx.stroke();
}
drawPrice();drawDepth(t||0);
}
)(0);
</script>
</body>
</html>
