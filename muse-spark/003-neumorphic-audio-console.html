<head>

<style>
* {

.fader {
  --pos:.7;
  width:42px;
  height:170px;
  border-radius:21px;
  background:var(--bg);
  box-shadow:inset 5px 5px 10px #a3b1c6,inset -5px -5px 10px #fff;
  position:relative;
  cursor:ns-resize;

.fader::before {
  content:"";
  position:absolute;

  top:12px;

  content:"";

  right:4px;

.fader.drag .cap {

.meter {

.seg {

.seg.on {

}
.seg.amber.on {

.seg.red.on {

  box-shadow:0 0 6px var(--r)
}

.db {
  background:var(--bg);
  box-shadow:inset 5px 5px 10px #a3b1c6,inset -5px -5px 10px #fff;
  border-radius:12px;
  padding:8px 16px;
  font-size:.8rem;
  min-width:92px;
  text-align:center
}

.master {
  background:linear-gradient(145deg,#e9eef5,#d0d7e1);
  border-radius:28px;
  padding:22px;
  box-shadow:9px 9px 18px #a3b1c6,-9px -9px 18px #fff;
  display:flex;
  flex-direction:column;

  align-items:center
}

.tc {
  background:#2b3442;

.tp {

  border:0;
  border-radius:14px;
  background:linear-gradient(145deg,#eef2f7,#ccd3de);
  box-shadow:5px 5px 10px #a3b1c6,-5px -5px 10px #fff;
  cursor:pointer;
  font-size:1.1rem;

.tp:active,.tp.on {
  box-shadow:inset 5px 5px 10px #a3b1c6,inset -5px -5px 10px #fff
}

.tp.play.on {

}
.tp.rec.on {

}

.scenes {
  display:flex;
  gap:10px
}

.scn {
  border:0;
  border-radius:999px;
  padding:10px 22px;
  background:linear-gradient(145deg,#eef2f7,#ccd3de);
  box-shadow:5px 5px 10px #a3b1c6,-5px -5px 10px #fff;

.scn.sel {

.hint {

kbd {

.knob:focus,.fader:focus,.tog:focus,.tp:focus,.scn:focus {

@media(prefers-reduced-motion:reduce) {
  * {
  transition:none!important;
  animation:none!important
}

}

</style>

<body>
<div class="top"><div class="badge"><svg width="34" height="34" viewBox="0 0 34 34"><rect x="3" y="18" width="5" height="12" rx="2" fill="#4fd1c5"/><rect x="11" y="10" width="5" height="20" rx="2" fill="#3d4a5c"/><rect x="19" y="4" width="5" height="26" rx="2" fill="#ff7a59"/><rect x="27" y="14" width="4" height="16" rx="2" fill="#3d4a5c"/></svg><div><h1>Softdesk 4</h1><p>neumorphic mixer · 4ch + master · fake DSP</p></div></div>
<div class="cpu mono" id="cpu">48kHz · 256 spl · CPU 12%</div></div>
<div class="board" id="board"></div>
<p class="hint">Drag knobs &amp; faders · <kbd>↑</kbd><kbd>↓</kbd> adjust · <kbd>Home</kbd>/<kbd>End</kbd> extremes · double-click resets · <kbd>Space</kbd> play</p>
<script>
const CH=[{n:'Vocal',g:72,p:50,f:.75},{n:'Keys',g:64,p:38,f:.62},{n:'Bass',g:80,p:62,f:.8},{n:'Drums',g:85,p:50,f:.9}];
const SCENES={Verse:[.55,.5,.62,.7],Chorus:[.8,.75,.7,.9],Bridge:[.4,.6,.5,.55]};
let state=CH.map(c=>({...c,mute:false,solo:false})),master={f:.8,width:60},playing=true,rec=false,tc=0;
const board=document.getElementById('board');
function knobHTML(label,val,fmt){return `<div class="kwrap"><div class="knob" tabindex="0" role="slider" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${val}" data-k="${label}"><div class="ptr"></div></div><span class="kval mono">${fmt(val)}</span><span style="font-size:.62rem;letter-spacing:.18em;color:var(--faint)">${label}</span></div>`;}
board.innerHTML=state.map((c,i)=>`<section class="strip" aria-label="${c.n} channel"><h2>${c.n}</h2><div class="knobrow">${knobHTML('Gain'+i,c.g,v=>v+'%')}${knobHTML('Pan'+i,c.p,v=>v<45?'L'+(45-v):v>55?'R'+(v-55):'C')}</div><div class="togs"><button class="tog" data-m="${i}" aria-pressed="false" aria-label="Mute ${c.n}"><i></i><small>MUTE</small></button><button class="tog" data-s="${i}" aria-pressed="false" aria-label="Solo ${c.n}"><i></i><small>SOLO</small></button></div><div class="frow"><div class="fader" tabindex="0" role="slider" aria-label="${c.n} fader" data-f="${i}"><div class="cap"></div></div><div class="meter" id="m${i}">${'<div class="seg"></div>'.repeat(14)}</div></div><div class="db mono" id="d${i}">-6.0 dB</div></section>`).join('')
+`<section class="strip master" aria-label="Master"><h2>Master</h2><div class="tc mono" id="tc">00:00:00.00</div><div class="transport"><button class="tp" id="tRw" aria-label="Return">⏮</button><button class="tp" id="tStop" aria-label="Stop">⏹</button><button class="tp play on" id="tPlay" aria-label="Play">▶</button><button class="tp rec" id="tRec" aria-label="Record">●</button></div><div class="knobrow">${knobHTML('Width',master.width,v=>v+'%')}</div><div class="frow"><div class="fader" id="mFad" tabindex="0" role="slider" aria-label="Master fader"><div class="cap"></div></div><div class="meter" id="mL"></div><div class="meter" id="mR"></div></div><div class="db mono" id="mDb">-2.0 dB</div><div class="scenes"><button class="scn sel" data-sc="Verse">VERSE</button><button class="scn" data-sc="Chorus">CHORUS</button><button class="scn" data-sc="Bridge">BRIDGE</button></div></section>`;
document.getElementById('mL').innerHTML='<div class="seg"></div>'.repeat(14);document.getElementById('mR').innerHTML='<div class="seg"></div>'.repeat(14);
document.querySelectorAll('#board .meter .seg').forEach((s,i)=>{const idx=i%14;if(idx>=12)s.classList.add('red');else if(idx>=9)s.classList.add('amber');});
function paintKnob(el,v){el.style.setProperty('--a',(v/100*270)+'deg');el.querySelector('.ptr').style.transform=`translate(-50%,0) rotate(${-135+v/100*270}deg)`;el.setAttribute('aria-valuenow',Math.round(v));el.parentElement.querySelector('.kval').textContent=el.dataset.k.startsWith('Pan')?(v<45?'L'+Math.round(45-v):v>55?'R'+Math.round(v-55):'C'):Math.round(v)+'%';}
document.querySelectorAll('.knob').forEach(k=>{const key=k.dataset.k;let v=key.startsWith('Gain')?state[+key.slice(4)].g:key.startsWith('Pan')?state[+key.slice(3)].p:master.width;paintKnob(k,v);
let sy=0,sv=0;k.addEventListener('pointerdown',e=>{k.setPointerCapture(e.pointerId);k.classList.add('press');sy=e.clientY;sv=v;});
k.addEventListener('pointermove',e=>{if(!k.hasPointerCapture())return;const f=e.shiftKey?.15:1;v=Math.max(0,Math.min(100,sv+(sy-e.clientY)/180*100*f));paintKnob(k,v);store(key,v);});
k.addEventListener('pointerup',()=>k.classList.remove('press'));
k.addEventListener('wheel',e=>{e.preventDefault();v=Math.max(0,Math.min(100,v+(e.deltaY<0?4:-4)));paintKnob(k,v);store(key,v);},{passive:false});
k.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight')v=Math.min(100,v+4);else if(e.key==='ArrowDown'||e.key==='ArrowLeft')v=Math.max(0,v-4);else if(e.key==='Home')v=0;else if(e.key==='End')v=100;else return;e.preventDefault();paintKnob(k,v);store(key,v);});
k.addEventListener('dblclick',()=>{v=key.startsWith('Pan')?50:key==='Width'?60:70;paintKnob(k,v);store(key,v);});});
function store(key,v){if(key.startsWith('Gain'))state[+key.slice(4)].g=v;else if(key.startsWith('Pan'))state[+key.slice(3)].p=v;else master.width=v;}
function paintFad(el,p){el.style.setProperty('--pos',p);}
document.querySelectorAll('[data-f]').forEach(f=>{let p=state[+f.dataset.f].f;paintFad(f,p);
f.addEventListener('pointerdown',e=>{f.setPointerCapture(e.pointerId);f.classList.add('drag');move(e);});
f.addEventListener('pointermove',e=>{if(f.hasPointerCapture())move(e);});
f.addEventListener('pointerup',()=>f.classList.remove('drag'));
function move(e){const r=f.getBoundingClientRect();p=Math.max(0,Math.min(1,1-(e.clientY-r.top-12)/(r.height-24)));paintFad(f,p);state[+f.dataset.f].f=p;}
f.addEventListener('wheel',e=>{e.preventDefault();p=Math.max(0,Math.min(1,p+(e.deltaY<0?.05:-.05)));paintFad(f,p);state[+f.dataset.f].f=p;},{passive:false});
f.addEventListener('keydown',e=>{if(e.key==='ArrowUp')p=Math.min(1,p+.05);else if(e.key==='ArrowDown')p=Math.max(0,p-.05);else if(e.key==='Home')p=0;else if(e.key==='End')p=1;else return;e.preventDefault();paintFad(f,p);state[+f.dataset.f].f=p;});});
const mFad=document.getElementById('mFad');let mp=master.f;paintFad(mFad,mp);
mFad.addEventListener('pointerdown',e=>{mFad.setPointerCapture(e.pointerId);mv(e);});mFad.addEventListener('pointermove',e=>{if(mFad.hasPointerCapture())mv(e);});
function mv(e){const r=mFad.getBoundingClientRect();mp=Math.max(0,Math.min(1,1-(e.clientY-r.top-12)/(r.height-24)));paintFad(mFad,mp);master.f=mp;}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;state[i].mute=!state[i].mute;b.setAttribute('aria-pressed',state[i].mute);});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;state[i].solo=!state[i].solo;b.setAttribute('aria-pressed',state[i].solo);});
document.querySelectorAll('.scn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const t=SCENES[b.dataset.sc];const from=state.map(s=>s.f);const t0=performance.now();
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;if(rm){state.forEach((s,i)=>{s.f=t[i];paintFad(document.querySelector(`[data-f="${i}"]`),t[i]);});return;}
(function anim(n){const k=Math.min(1,(n-t0)/600),e=1-Math.pow(1-k,3);state.forEach((s,i)=>{s.f=from[i]+(t[i]-from[i])*e;paintFad(document.querySelector(`[data-f="${i}"]`),s.f);});if(k<1)requestAnimationFrame(anim);})(t0);});
const tPlay=document.getElementById('tPlay'),tRec=document.getElementById('tRec');
tPlay.onclick=()=>{playing=!playing;tPlay.classList.toggle('on',playing);};
document.getElementById('tStop').onclick=()=>{playing=false;tPlay.classList.remove('on');};
document.getElementById('tRw').onclick=()=>{tc=0;};
tRec.onclick=()=>{rec=!rec;tRec.classList.toggle('on',rec);};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();tPlay.click();}});
const peaks=[0,0,0,0];
function setMeter(id,lvl){const m=document.getElementById(id);if(!m)return;const n=Math.round(lvl*14);[...m.children].forEach((s,i)=>s.classList.toggle('on',i<n));}
let frames=0,lastT=performance.now();
function engine(t){const dt=(t-lastT)/1000;lastT=t;
if(playing)tc+=dt;
const anySolo=state.some(s=>s.solo);
let L=0,R=0;
state.forEach((s,i)=>{let sig=0;if(playing){const tt=t/1000;sig=(.5+.5*Math.sin(tt*1.3+i*2))*(.6+.4*Math.sin(tt*4+i))*(0.85+0.15*Math.sin(tt*13+i*5));sig*=(s.g/100+.2)*s.f;if(s.mute||(anySolo&&!s.solo))sig=0;}
peaks[i]=Math.max(sig,peaks[i]-dt*1.2);setMeter('m'+i,peaks[i]);
document.getElementById('d'+i).textContent=(sig<=0.01?'-∞':(-(1-sig)*30).toFixed(1))+' dB';
const pan=(s.p-50)/50;L+=sig*(pan<0?1:1-pan*.6);R+=sig*(pan>0?1:1+pan*.6);});
const w=master.width/100;L*=master.f*(1+w*.2);R*=master.f*(1+w*.2);
setMeter('mL',L/2);setMeter('mR',R/2);
document.getElementById('mDb').textContent=(-(1-master.f)*30).toFixed(1)+' dB';
const s=Math.floor(tc%60),m=Math.floor(tc/60)%60,h=Math.floor(tc/3600);
document.getElementById('tc').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(Math.floor(tc%1*25)).padStart(2,'0')}`;
frames++;if(t-frames>0&&frames%30===0){document.getElementById('cpu').textContent=`48kHz · 256 spl · CPU ${playing?Math.round(10+Math.random()*8+master.f*6):4}%`;}
requestAnimationFrame(engine);}
requestAnimationFrame(engine);
</script>
</body>
</html>
