<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelian Codex · Series I — Holographic Card Gallery</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --gold: #d9b04c;
  --gold-l: #fff6d5;
  --gold-d: #8a6a1f;
  --lav: #b9a9d6;
  --ink: #e9e2f5;
}
body {
  color: var(--ink);
  font-family: Georgia, 'Palatino Linotype', Palatino, serif;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(900px 500px at 50% -80px, #3a1a5c, transparent 70%),
    radial-gradient(700px 500px at 90% 100%, #2a0f3f, transparent 70%),
    linear-gradient(#170b24, #0b0611);
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .06;
  background:
    repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 8px),
    repeating-linear-gradient(-45deg, #fff 0 1px, transparent 1px 8px);
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}
.eyebrow {
  font-family: ui-monospace, Menlo, monospace;
  color: var(--gold);
  letter-spacing: .32em;
  font-size: 12px;
  text-transform: uppercase;
  text-align: center;
}
h1 {
  font-size: clamp(38px, 6vw, 72px);
  text-align: center;
  line-height: 1.02;
  margin: 14px 0 10px;
  background: linear-gradient(#fff6d5, #d9b04c 55%, #8a6a1f);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
h1 em {
  font-style: italic;
}
.lede {
  text-align: center;
  color: var(--lav);
  max-width: 620px;
  margin: 0 auto;
  font-style: italic;
  font-size: 17px;
  line-height: 1.6;
}
.rule {
  height: 1px;
  max-width: 640px;
  margin: 26px auto;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.controls button {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  background: transparent;
  color: var(--gold);
  border: 1px solid #6b5320;
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
  transition: background .25s, color .25s, transform .15s;
}
.controls button:hover,
.controls button:focus-visible {
  background: #d9b04c;
  color: #1a0f2a;
  outline: none;
}
.controls button:active {
  transform: scale(.96);
}
.filters {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 28px;
}
.filters button {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .1em;
  background: rgba(217, 176, 76, .08);
  color: var(--lav);
  border: 1px solid #4a3a6a;
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  transition: all .25s;
}
.filters button.on {
  background: rgba(217, 176, 76, .25);
  color: var(--gold-l);
  border-color: var(--gold);
}
#count {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: #8f7fb5;
  align-self: center;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 280px));
  gap: 28px;
  justify-content: center;
}
.card3d {
  width: 280px;
  height: 400px;
  perspective: 1200px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: opacity .4s, transform .4s;
}
.card3d.hidden {
  display: none;
}
.card3d:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 6px;
  border-radius: 18px;
}
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--flip, 0deg)));
  transition: transform .55s cubic-bezier(.2, .8, .2, 1);
}
.card3d.interacting .card-inner {
  transition: transform 80ms linear;
}
.face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.front {
  background: #14101f;
  border-radius: 18px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
}
.back {
  transform: rotateY(180deg);
  background:
    repeating-linear-gradient(45deg, rgba(217,176,76,.05) 0 2px, transparent 2px 10px),
    repeating-linear-gradient(-45deg, rgba(217,176,76,.05) 0 2px, transparent 2px 10px),
    #221327;
  border: 1px solid #6b5320;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: center;
  border-radius: 18px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
}
.back h3 {
  font-size: 22px;
  line-height: 1.2;
  background: linear-gradient(#fff6d5, #d9b04c);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.origin {
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: .12em;
}
.lore {
  font-size: 13.5px;
  line-height: 1.65;
  color: #d8cdf0;
  text-align: left;
}
.lore::first-letter {
  font-size: 30px;
  color: var(--gold);
  float: left;
  line-height: 1;
  padding-right: 6px;
}
.hint {
  margin-top: auto;
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: #8f7fb5;
}
.art {
  position: absolute;
  inset: 0;
}
.emblem {
  position: absolute;
  top: 44px;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 150px;
  transition: transform .4s;
  filter: drop-shadow(0 8px 22px rgba(0, 0, 0, .6));
}
.card3d:hover .emblem {
  transform: translateX(-50%) scale(1.1);
}
.foil {
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg,
    rgba(255, 0, 200, .55),
    rgba(255, 215, 0, .55),
    rgba(0, 255, 255, .55),
    rgba(60, 80, 255, .55),
    rgba(180, 80, 255, .55));
  background-size: 300% 300%;
  background-position: calc(var(--mx, 50%) * 1.6) calc(var(--my, 50%) * 1.6);
  mix-blend-mode: color-dodge;
  opacity: .38;
  transition: opacity .3s;
}
.card3d:hover .foil {
  opacity: .62;
}
.card3d.idle .foil {
  animation: sweep 3.2s ease-in-out;
}
@keyframes sweep {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.sparkle {
  position: absolute;
  inset: 0;
  mix-blend-mode: screen;
  opacity: .8;
  background-image:
    radial-gradient(circle, #fff 1px, transparent 1.6px),
    radial-gradient(circle, #ffe9a8 1px, transparent 1.8px),
    radial-gradient(circle, #9be7ff 1px, transparent 1.5px),
    radial-gradient(circle, #ffb0ec 1px, transparent 1.5px),
    radial-gradient(circle, #fff 1px, transparent 1.4px);
  background-size: 70px 70px, 110px 110px, 55px 55px, 140px 140px, 90px 90px;
  background-position:
    calc(var(--mx, 50%) * .6) calc(var(--my, 50%) * .6),
    calc(var(--mx, 50%) * -.8) calc(var(--my, 50%) * .9),
    calc(var(--mx, 50%) * 1.1) calc(var(--my, 50%) * -.7),
    calc(var(--mx, 50%) * -.5) calc(var(--my, 50%) * -.6),
    calc(var(--mx, 50%) * .9) calc(var(--my, 50%) * 1.2);
}
.glare {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%),
    rgba(255, 255, 255, .85), transparent 55%);
  mix-blend-mode: overlay;
  opacity: 0;
  transition: opacity .3s;
}
.card3d:hover .glare {
  opacity: .9;
}
.frame {
  position: absolute;
  inset: 10px;
  border-radius: 13px;
  padding: 2px;
  background: linear-gradient(135deg, #fff2c2, #d9b04c, #8a6a1f, #ffe9a8);
  background-position: calc(var(--mx, 50%) * 1.4) calc(var(--my, 50%) * 1.4);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.hairline {
  position: absolute;
  inset: 15px;
  border: 1px solid rgba(255, 242, 194, .35);
  border-radius: 10px;
  pointer-events: none;
}
.plate {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 16px 14px;
  background: linear-gradient(transparent, rgba(5, 2, 12, .92) 45%);
}
.plate .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.plate h2 {
  font-size: 18px;
  color: #fff6d5;
  line-height: 1.25;
}
.num {
  font-family: ui-monospace, monospace;
  color: var(--gold);
  font-size: 12px;
  flex: none;
}
.type {
  display: inline-block;
  margin-top: 6px;
  font-family: ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .1em;
  background: rgba(217, 176, 76, .18);
  border: 1px solid rgba(217, 176, 76, .6);
  color: #ffe9a8;
  border-radius: 999px;
  padding: 3px 10px;
}
.stats {
  margin-top: 8px;
  display: grid;
  gap: 5px;
}
.stat {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 8px;
  align-items: center;
  font-family: ui-monospace, monospace;
  font-size: 10px;
  color: #cfc2ea;
}
.bar {
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .14);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #fff6d5, #d9b04c);
  transition: width 1s ease .2s;
}
.flavor {
  font-style: italic;
  font-size: 12px;
  color: #b9a9d6;
  margin-top: 4px;
}
.sig {
  width: 34px;
  height: 34px;
  margin: 6px auto;
}
.legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 30px;
  font-family: ui-monospace, monospace;
  font-size: 11px;
  color: #8f7fb5;
  letter-spacing: .08em;
}
.legend b {
  color: var(--gold);
}
footer {
  text-align: center;
  margin-top: 26px;
  color: #8f7fb5;
  font-size: 13px;
  font-style: italic;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
@media (max-width: 640px) {
  .card3d {
    width: 250px;
    height: 358px;
  }
  .grid {
    grid-template-columns: repeat(auto-fit, minmax(230px, 250px));
  }
  .wrap {
    padding: 32px 16px 60px;
  }
}
@media (max-width: 360px) {
  .card3d {
    width: 228px;
    height: 326px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: transform .01ms !important;
  }
  .card-inner {
    transform: rotateY(var(--flip, 0deg)) !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Aurelian Codex · Series I</p>
  <h1>Six Elemental <em>Wards</em></h1>
  <p class="lede">Holographic foil relics, kept under velvet and low light. Tilt to catch the foil — tap to read the lore.</p>
  <div class="rule"></div>
  <div class="controls">
    <button id="fanBtn">Unflip all</button>
    <button id="flipBtn">Flip all</button>
    <button id="shimmerBtn">Pause shimmer</button>
    <span id="count"></span>
  </div>
  <div class="filters" id="filters" aria-label="Filter by element"></div>
  <p class="sr" aria-live="polite" id="live"></p>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span><b>← →</b> move focus</span>
    <span><b>Enter</b> flip card</span>
    <span><b>1–6</b> flip by number</span>
  </div>
  <footer>Printed in gold on smoke · Series I of the Aurelian Codex</footer>
</div>
<script>
var CARDS = [
  { el: "fire", n: "Ignis the Ember Wyrm", t: "Fire · Legendary", m: 92, g: 64, s: 78,
    f: "What burns remembers your name.", g1: "#ff7a2a", g2: "#7a0e0e",
    icon: '<path d="M75 15 C95 45 115 60 115 95 A40 40 0 0 1 35 95 C35 60 60 48 75 15Z" fill="URL"/><path d="M75 55 C85 70 92 78 92 92 A17 17 0 0 1 58 92 C58 78 68 70 75 55Z" fill="#ffe9a8"/>',
    o: "Found · Cinder Vaults",
    lore: "Hatched in the last breath of a dying furnace, Ignis curled around the coals for a hundred years and would not let them go cold. The ward-keepers say its scales still tick like cooling iron when danger is near." },
  { el: "water", n: "Undine of the Still Deep", t: "Water · Mythic", m: 58, g: 88, s: 70,
    f: "Silence, kept at pressure.", g1: "#57e6ff", g2: "#0a2358",
    icon: '<circle cx="55" cy="80" r="28" fill="none" stroke="#bff3ff" stroke-width="3"/><circle cx="95" cy="90" r="20" fill="none" stroke="#bff3ff" stroke-width="2.5"/><circle cx="75" cy="60" r="12" fill="none" stroke="#eafcff" stroke-width="2"/>',
    o: "Found · Sunken Choir",
    lore: "She sings one octave below hearing. Divers who follow the hum surface hours later with pearls in their pockets and no memory of the descent. The Codex lists her as benign, with reservations." },
  { el: "air", n: "Sylph Herald of High Wind", t: "Air · Rare", m: 66, g: 60, s: 99,
    f: "First to arrive, last to stay.", g1: "#ffffff", g2: "#4f8fc9",
    icon: '<path d="M15 70 Q60 55 135 62" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M15 90 Q70 78 135 84" stroke="#cfeaff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M15 110 Q60 100 120 104" stroke="#9bdcff" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    o: "Found · Kite Chapel",
    lore: "A messenger that outran its own war. The Herald carried the ceasefire three valleys in eleven minutes and never asked who had won. Its feather, kept in the Codex, still lifts in a closed room." },
  { el: "earth", n: "Gnomon the Patient Stone", t: "Earth · Ancient", m: 80, g: 97, s: 30,
    f: "The mountain also waits.", g1: "#9be36b", g2: "#1d3a1a",
    icon: '<path d="M75 25 L115 105 L35 105 Z" fill="URL"/><path d="M75 48 L97 92 L53 92 Z" fill="rgba(255,255,255,.35)"/><circle cx="75" cy="80" r="6" fill="#eaffd0"/>',
    o: "Found · Buried Dial",
    lore: "Gnomon has not moved since the second dynasty, and sees no reason to start. Moss grows on its northern face in the shape of a sundial that tells the correct time in a country that no longer exists." },
  { el: "storm", n: "Fulgur the Split Second", t: "Storm · Legendary", m: 95, g: 55, s: 100,
    f: "Catch me between ticks.", g1: "#ffe45e", g2: "#3d1a7a",
    icon: '<path d="M85 15 L45 85 L70 85 L60 135 L105 65 L78 65 Z" fill="URL" stroke="#fff6d5" stroke-width="2"/>',
    o: "Found · Gallows Mast",
    lore: "It lives in the pause between lightning and thunder and feeds on struck clocks. Sailors nail a bent nail to the mast so Fulgur will split the nail instead of the ship. It usually agrees." },
  { el: "void", n: "Umbra the Kept Shadow", t: "Void · Forbidden", m: 88, g: 90, s: 65,
    f: "Do not turn it face-down.", g1: "#8a5cff", g2: "#050308",
    icon: '<circle cx="75" cy="75" r="34" fill="none" stroke="URL" stroke-width="6"/><circle cx="105" cy="55" r="14" fill="#0b0611" stroke="#d9b04c" stroke-width="2"/><ellipse cx="75" cy="75" rx="34" ry="34" fill="none" stroke="#d9b04c" stroke-width="1" stroke-dasharray="4 6"/>',
    o: "Found · Nowhere, twice",
    lore: "The only ward stored in a box inside a box. Its keeper empties the outer box each equinox and finds the same small dark: heavier than before, patient, faintly polite. It has never once been rude." }
];
var grid = document.getElementById('grid');
var count = document.getElementById('count');
var live = document.getElementById('live');
var flipped = 0;
var activeFilter = 'all';
function upd() {
  count.textContent = flipped + " / 6 revealed";
}
function announce(msg) {
  live.textContent = msg;
}
var cardEls = [];
CARDS.forEach(function (c, i) {
  var b = document.createElement('button');
  b.className = 'card3d';
  b.dataset.el = c.el;
  b.setAttribute('aria-label', c.n + ' — activate to flip');
  b.setAttribute('aria-pressed', 'false');
  var art = c.icon.split('URL').join('url(#g' + i + ')');
  b.innerHTML =
    '<span class="card-inner"><span class="face front">' +
    '<span class="art" style="background:radial-gradient(220px 220px at 50% 30%,' + c.g1 + ',' + c.g2 + ' 75%)">' +
    '<svg viewBox="0 0 150 150" style="position:absolute;inset:0;width:100%;height:100%;opacity:.25">' + art +
    '<defs><linearGradient id="g' + i + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c.g1 + '"/><stop offset="1" stop-color="' + c.g2 + '"/></linearGradient></defs></svg></span>' +
    '<span class="emblem"><svg viewBox="0 0 150 150" width="150" height="150"><defs><linearGradient id="e' + i + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6d5"/><stop offset=".5" stop-color="#d9b04c"/><stop offset="1" stop-color="#8a6a1f"/></linearGradient></defs><circle cx="75" cy="75" r="60" fill="rgba(0,0,0,.35)" stroke="url(#e' + i + ')" stroke-width="3"/>' + c.icon.split('URL').join('url(#e' + i + ')') + '</svg></span>' +
    '<span class="foil"></span><span class="sparkle"></span><span class="glare"></span><span class="frame"></span><span class="hairline"></span>' +
    '<span class="plate"><span class="row"><h2>' + c.n + '</h2><span class="num">0' + (i + 1) + '/06</span></span>' +
    '<span class="type">' + c.t + '</span>' +
    '<span class="stats"><span class="flavor">\u201C' + c.f + '\u201D</span>' +
    '<span class="stat">Might<span class="bar"><i data-w="' + c.m + '"></i></span></span>' +
    '<span class="stat">Guard<span class="bar"><i data-w="' + c.g + '"></i></span></span>' +
    '<span class="stat">Swift<span class="bar"><i data-w="' + c.s + '"></i></span></span></span></span></span>' +
    '<span class="face back"><h3>' + c.n + '</h3><p class="origin">' + c.o + '</p><p class="lore">' + c.lore + '</p>' +
    '<svg class="sig" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#d9b04c" stroke-width="1.5"/><path d="M17 6 L20 17 L17 28 L14 17 Z" fill="#d9b04c"/></svg>' +
    '<span class="hint">tap to return · ' + c.t + '</span></span></span>';
  grid.appendChild(b);
  cardEls.push(b);
  var raf = null, sx = 0, sy = 0, drag = false, downX = 0, downY = 0;
  function write() {
    raf = null;
    var r = b.getBoundingClientRect();
    var px = (sx - r.left) / r.width * 100;
    var py = (sy - r.top) / r.height * 100;
    px = Math.max(0, Math.min(100, px));
    py = Math.max(0, Math.min(100, py));
    var ry = (px - 50) / 50 * 16;
    var rx = (50 - py) / 50 * 16;
    if (b.classList.contains('flipped')) ry = -ry;
    b.style.setProperty('--mx', px + '%');
    b.style.setProperty('--my', py + '%');
    b.style.setProperty('--rx', rx.toFixed(2) + 'deg');
    b.style.setProperty('--ry', ry.toFixed(2) + 'deg');
  }
  b.addEventListener('pointermove', function (e) {
    sx = e.clientX;
    sy = e.clientY;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) drag = true;
    b.classList.add('interacting');
    if (!raf) raf = requestAnimationFrame(write);
  });
  b.addEventListener('pointerenter', function (e) {
    sx = e.clientX;
    sy = e.clientY;
  });
  b.addEventListener('pointerdown', function (e) {
    drag = false;
    downX = e.clientX;
    downY = e.clientY;
  });
  b.addEventListener('pointerleave', function () {
    b.classList.remove('interacting');
    b.style.setProperty('--rx', '0deg');
    b.style.setProperty('--ry', '0deg');
  });
  b.addEventListener('click', function () {
    if (window.matchMedia('(pointer:coarse)').matches && drag) return;
    flip(b, c);
  });
  b.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      flip(b, c);
    }
  });
});
function flip(b, c) {
  var on = b.classList.toggle('flipped');
  b.style.setProperty('--flip', on ? '180deg' : '0deg');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  flipped += on ? 1 : -1;
  upd();
  announce(c.n + (on ? ' revealed.' : ' hidden.'));
}
upd();
// filter chips
var filters = document.getElementById('filters');
['all', 'fire', 'water', 'air', 'earth', 'storm', 'void'].forEach(function (f) {
  var btn = document.createElement('button');
  btn.textContent = f === 'all' ? 'All wards' : f;
  btn.className = f === 'all' ? 'on' : '';
  btn.addEventListener('click', function () {
    activeFilter = f;
    filters.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
    btn.classList.add('on');
    cardEls.forEach(function (el) {
      el.classList.toggle('hidden', f !== 'all' && el.dataset.el !== f);
    });
    announce(f === 'all' ? 'Showing all wards.' : 'Showing ' + f + ' wards.');
  });
  filters.appendChild(btn);
});
document.getElementById('fanBtn').addEventListener('click', function () {
  document.querySelectorAll('.card3d.flipped').forEach(function (c) { c.click(); });
});
document.getElementById('flipBtn').addEventListener('click', function () {
  document.querySelectorAll('.card3d:not(.flipped):not(.hidden)').forEach(function (c) { c.click(); });
});
// idle shimmer sweep
var shimmerOn = true;
var order = cardEls.slice();
var k = 0;
var lastAct = Date.now();
window.addEventListener('pointermove', function () { lastAct = Date.now(); }, { passive: true });
window.addEventListener('keydown', function () { lastAct = Date.now(); });
setInterval(function () {
  if (!shimmerOn || Date.now() - lastAct < 3000) return;
  order.forEach(function (c) { c.classList.remove('idle'); });
  k = (k + 1) % order.length;
  if (!order[k].matches(':hover') && !order[k].classList.contains('hidden')) {
    order[k].classList.add('idle');
    setTimeout(function () { order[k].classList.remove('idle'); }, 1200);
  }
}, 3200);
document.getElementById('shimmerBtn').addEventListener('click', function (e) {
  shimmerOn = !shimmerOn;
  e.target.textContent = shimmerOn ? 'Pause shimmer' : 'Resume shimmer';
});
// stat bars animate on scroll into view
var io = new IntersectionObserver(function (es) {
  es.forEach(function (en) {
    if (en.isIntersecting) {
      en.target.querySelectorAll('.bar i').forEach(function (bar) {
        bar.style.width = bar.dataset.w + '%';
      });
      io.unobserve(en.target);
    }
  });
}, { threshold: .4 });
cardEls.forEach(function (c) { io.observe(c); });
// keyboard: arrows move, digits flip
document.addEventListener('keydown', function (e) {
  var vis = cardEls.filter(function (c) { return !c.classList.contains('hidden'); });
  var idx = vis.indexOf(document.activeElement);
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    vis[(idx + 1 + vis.length) % vis.length].focus();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    vis[(idx - 1 + vis.length) % vis.length].focus();
  } else if (/^[1-6]$/.test(e.key)) {
    var n = parseInt(e.key, 10) - 1;
    if (vis[n]) { vis[n].focus(); vis[n].click(); }
  }
});
</script>
