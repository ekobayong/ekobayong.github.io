<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathe — Living Gradient Mesh</title>
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box
}

:root {
  --base:#1a1030;
  --c1:#ff6b57;
  --c2:#7b4dff;
  --c3:#14b8a6;
  --c4:#f5b942
}

body {
  background:var(--base);
  color:#fff;
  font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  height:100vh;
  overflow:hidden;
  transition:background 2.2s
}

.mesh {
  position:fixed;
  inset:-20%;
  filter:blur(clamp(50px,7vw,120px)) saturate(1.15);
  z-index:0
}

.blob {
  position:absolute;
  border-radius:50%;
  mix-blend-mode:screen;
  transition:background 2.2s;
  width:55vmax;
  height:55vmax
}

.b1 {
  width:60vmax;
  height:60vmax;
  background:var(--c1)
}
.b2 {
  width:70vmax;
  height:70vmax;
  background:var(--c2)
}
.b3 {
  width:52vmax;
  height:52vmax;
  background:var(--c3)
}
.b4 {
  width:48vmax;
  height:48vmax;
  background:var(--c4)
}
.b5 {
  width:64vmax;
  height:64vmax;
  background:var(--c2)
}

#grain {
  position:fixed;
  inset:0;
  z-index:2;
  opacity:.22;
  mix-blend-mode:overlay;
  pointer-events:none
}

.vig {
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55))
}

header {
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  padding:22px 30px;
  font-family:ui-monospace,Menlo,monospace;
  font-size:.68rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:rgba(255,255,255,.7)
}

.center {
  position:fixed;
  inset:0;
  z-index:4;
  display:grid;
  place-items:center;
  text-align:center;
  pointer-events:none;
  padding:20px
}

.wordwrap {
  position:relative;
  height:1.2em;
  width:100%
}

.word {
  position:absolute;
  inset:0;
  font-family:'Iowan Old Style',Palatino,Georgia,serif;
  font-style:italic;
  font-weight:300;
  font-size:clamp(3.4rem,15vw,15rem);
  letter-spacing:-.02em;
  line-height:1;
  text-shadow:0 0 60px rgba(255,255,255,.5);
  transition:opacity 1.6s ease-out,transform 1.6s ease-out,filter 1.6s ease-out
}

.word.out {
  opacity:0;
  transform:translateY(-12px) scale(1.015);
  filter:blur(10px)
}

.word.pre {
  opacity:0;
  transform:translateY(12px) scale(.985);
  filter:blur(8px)
}

#cap {
  margin-top:26px;
  font-size:.65rem;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:rgba(255,255,255,.65);
  transition:opacity .6s
}

footer {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 30px;
  gap:14px
}

.seg {
  display:flex;
  gap:6px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  padding:6px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px)
}

.seg button {
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.7);
  font:inherit;
  font-size:.68rem;
  letter-spacing:.2em;
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer
}

.seg button.on {
  background:rgba(255,255,255,.18);
  color:#fff
}

.dot {
  width:16px;
  height:16px;
  border-radius:50%;
  background:conic-gradient(var(--a) 0 25%,var(--b) 0 50%,var(--c) 0 75%,var(--d) 0);
  transition:transform .35s cubic-bezier(.34,1.8,.64,1)
}

.seg button:hover .dot {
  transform:scale(1.4) rotate(45deg)
}

#pp {
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.4);
  background:transparent;
  color:#fff;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:transform .3s
}

#pp:hover {
  transform:scale(1.1)
}

.hint {
  font-family:ui-monospace,monospace;
  font-size:.62rem;
  letter-spacing:.2em;
  color:rgba(255,255,255,.5)
}

@media(max-width:640px) {
  .hint,.hsub {
  display:none
}
.seg button {
  padding:8px 10px
}
header {
  padding:16px
}

}

@media(prefers-reduced-motion:reduce) {
  body,.blob {
  transition-duration:.5s
}

}

</style>
</head>
<body>
<div class="mesh" id="mesh"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div></div>
<canvas id="grain"></canvas>
<div class="vig"></div>
<header><span>Breathe</span><span class="hsub">A living gradient · no. 009</span><span id="palName">Dawn</span></header>
<div class="center"><div style="width:100%"><div class="wordwrap"><div class="word" id="wA">breathe</div><div class="word pre" id="wB"></div></div><div id="cap">in through the nose, four counts</div></div></div>
<footer><div class="seg" role="group" aria-label="Palette">
<button data-p="0" class="on"><span class="dot" style="--a:#ff6b57;--b:#7b4dff;--c:#14b8a6;--d:#f5b942"></span>DAWN</button>
<button data-p="1"><span class="dot" style="--a:#00c2c7;--b:#2748ff;--c:#5be7a9;--d:#ff7ab6"></span>REEF</button>
<button data-p="2"><span class="dot" style="--a:#ff4d2e;--b:#9c1a5b;--c:#ff9f1c;--d:#ffd166"></span>EMBER</button></div>
<button id="pp" aria-label="Pause or play" aria-pressed="false"><svg id="icP" width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" fill="#fff"/><rect x="11" y="2" width="4" height="14" fill="#fff"/></svg></button>
<div class="hint">space · pause&ensp;1 2 3 · palette</div></footer>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PALS=[{n:'Dawn',b:'#1a1030',c:['#ff6b57','#7b4dff','#14b8a6','#f5b942']},{n:'Reef',b:'#03131f',c:['#00c2c7','#2748ff','#5be7a9','#ff7ab6']},{n:'Ember',b:'#1c0a0a',c:['#ff4d2e','#9c1a5b','#ff9f1c','#ffd166']}];
const words=[['breathe','in through the nose, four counts'],['drift','let the thought pass like weather'],['soften','drop the shoulders, unclench the jaw'],['become','you are mostly water and light'],['linger','stay one breath longer than easy'],['unfold','open the hands, open the day'],['return','begin again, without apology']];
let paused=false,wi=0,showingA=true;
const r=document.documentElement.style;
function setPal(i){const p=PALS[i];r.setProperty('--base',p.b);p.c.forEach((c,j)=>r.setProperty('--c'+(j+1),c));document.getElementById('palName').textContent=p.n;
document.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',j===i));}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setPal(+b.dataset.p));
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')setPal(+e.key-1);if(e.code==='Space'&&e.target===document.body){e.preventDefault();toggle();}});
// blobs
const blobs=[...document.querySelectorAll('.blob')].map((el,i)=>({el,px:20+Math.random()*60,py:15+Math.random()*60,tx:23+i*7,ty:31+i*6,ph:Math.random()*7,ph2:Math.random()*7,sc:.92+Math.random()*.1}));
function easeBreath(x){return Math.sign(Math.sin(x))*Math.pow(Math.abs(Math.sin(x)),.8);}
let T=0,lastT=performance.now();
function place(){const t=T/1000;blobs.forEach(b=>{const x=easeBreath(t*6.28/b.tx+b.ph),y=easeBreath(t*6.28/b.ty+b.ph2);const s=1+Math.sin(t*.2+b.ph)*.1;
b.el.style.left=`calc(${(b.px+x*22).toFixed(2)}% - 25vmax)`;b.el.style.top=`calc(${(b.py+y*18).toFixed(2)}% - 25vmax)`;b.el.style.transform=`rotate(${(t*2+b.ph*30).toFixed(1)}deg) scale(${s.toFixed(3)})`;});}
function loop(n){requestAnimationFrame(loop);if(paused)return;const dt=(n-lastT)/1000;lastT=n;T+=dt*1000;place();}
if(RM){T=8000;place();}else requestAnimationFrame(loop);
// grain
const gc=document.getElementById('grain'),gx=gc.getContext('2d');let frames=[],fi=0,gTimer=null;
function buildGrain(){const d=Math.min(devicePixelRatio||1,1.5);gc.width=innerWidth*d;gc.height=innerHeight*d;frames=[];
for(let f=0;f<4;f++){const c=document.createElement('canvas');c.width=Math.ceil(gc.width/3);c.height=Math.ceil(gc.height/3);const x=c.getContext('2d');const im=x.createImageData(c.width,c.height);
for(let i=0;i<im.data.length;i+=4){const v=110+Math.random()*90;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);frames.push(c);}}
buildGrain();let rsz;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(buildGrain,200);});
function drawG(){gx.clearRect(0,0,gc.width,gc.height);gx.imageSmoothingEnabled=false;gx.drawImage(frames[fi%4],0,0,gc.width,gc.height);fi++;}
if(RM){drawG();}else{gTimer=setInterval(()=>{if(!paused)drawG();},50);}
// words
const wA=document.getElementById('wA'),wB=document.getElementById('wB'),cap=document.getElementById('cap');
function cycle(){wi=(wi+1)%words.length;const show=showingA?wB:wA,hide=showingA?wA:wB;showingA=!showingA;
cap.style.opacity=0;setTimeout(()=>{cap.textContent=words[wi][1];cap.style.opacity=1;},600);
hide.classList.add('out');show.textContent=words[wi][0];show.classList.remove('pre','out');show.style.opacity=1;
setTimeout(()=>{hide.classList.add('pre');hide.classList.remove('out');hide.style.opacity=0;},1700);}
let wTimer=setInterval(()=>{if(!paused)cycle();},RM?9000:5200);
function toggle(){paused=!paused;document.getElementById('pp').setAttribute('aria-pressed',paused);
document.getElementById('icP').innerHTML=paused?'<path d="M4 2l10 7-10 7z" fill="#fff"/>':'<rect x="3" y="2" width="4" height="14" fill="#fff"/><rect x="11" y="2" width="4" height="14" fill="#fff"/>';}
document.getElementById('pp').onclick=toggle;
</script>
</body>
</html>
