<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation — Field Study 006</title>
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box
}

body {
  background:#060b1f;
  color:#ecefff;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  overflow:hidden;
  height:100vh
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(100% 60% at 50% 110%,rgba(66,79,160,.22),transparent 60%),radial-gradient(50% 40% at 10% 0%,rgba(120,90,200,.1),transparent 60%),radial-gradient(120% 100% at 50% 50%,transparent 55%,#03061a 100%);
  pointer-events:none;
  z-index:1
}

canvas {
  position:fixed;
  inset:0;
  z-index:0
}

.ui {
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:30px 34px
}

header {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px
}

h1 {
  font-family:'Iowan Old Style',Palatino,Georgia,serif;
  font-weight:300;
  font-size:clamp(2.6rem,8vw,7.5rem);
  letter-spacing:.18em;
  line-height:1;
  text-shadow:0 0 30px rgba(169,180,255,.4);
  animation:settle 2.4s ease both
}

.sub {
  font-size:.65rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:#a9b4ff;
  margin-top:10px;
  animation:settle 2.4s .2s ease both
}

@keyframes settle {
  from {
  opacity:0;
  transform:translateY(14px);
  filter:blur(6px)
}
to {
  opacity:1;
  filter:blur(0)
}

}

.stamp {
  font-size:.68rem;
  text-align:right;
  line-height:1.9;
  color:#a9b4ff;
  border:1px solid rgba(169,180,255,.25);
  padding:10px 16px;
  background:rgba(6,11,31,.4);
  animation:settle 2.4s .35s ease both
}

.bot {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px
}

.legend {
  font-size:.68rem;
  line-height:2.2;
  color:#a9b4ff;
  animation:settle 2.4s .5s ease both
}

.g-dot,.g-line,.g-ring {
  display:inline-block;
  width:26px;
  text-align:center;
  margin-right:10px
}

.g-dot::after {
  content:"●";
  color:#fff
}
.g-line::after {
  content:"—";
  color:#a9b4ff
}
.g-ring::after {
  content:"◎";
  color:#fff
}

.panel {
  pointer-events:auto;
  background:rgba(6,11,31,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(236,239,255,.18);
  border-radius:4px;
  padding:20px 22px;
  min-width:280px;
  animation:settle 2.4s .65s ease both
}

.panel label {
  font-size:.62rem;
  letter-spacing:.3em;
  text-transform:uppercase;
  display:flex;
  justify-content:space-between;
  margin-bottom:12px
}

input[type=range] {
  -webkit-appearance:none;
  width:100%;
  height:1px;
  background:linear-gradient(90deg,#a9b4ff var(--p,40%),rgba(169,180,255,.2) var(--p,40%));
  outline:none
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #a9b4ff;
  cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.8,.64,1)
}

input[type=range]::-webkit-slider-thumb:hover {
  transform:scale(1.35)
}

input[type=range]::-moz-range-thumb {
  width:12px;
  height:12px;
  border:0;
  border-radius:50%;
  background:#fff
}

.seg {
  display:flex;
  position:relative;
  margin-top:16px;
  border:1px solid rgba(169,180,255,.3);
  border-radius:999px;
  overflow:hidden
}

.seg button {
  flex:1;
  background:transparent;
  border:0;
  color:#a9b4ff;
  font:inherit;
  font-size:.68rem;
  letter-spacing:.2em;
  padding:10px;
  cursor:pointer;
  z-index:1
}

.seg button.on {
  color:#060b1f;
  font-weight:700
}

.pill {
  position:absolute;
  top:2px;
  bottom:2px;
  width:calc(50% - 2px);
  left:2px;
  background:#a9b4ff;
  border-radius:999px;
  transition:left .45s ease-out
}

.seg.repel .pill {
  left:calc(50%)
}

@media(max-width:640px) {
  header {
  flex-direction:column
}
.legend {
  display:none
}
.panel {
  width:100%
}
.ui {
  padding:18px
}

}

@media(prefers-reduced-motion:reduce) {
  * {
  animation:none!important
}

}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
<header><div><h1>Constellation</h1><div class="sub">Field study no. 006 · a slow gravity</div></div>
<div class="stamp" id="stamp">— pts · — threads · — fps</div></header>
<div class="bot"><div class="legend"><div><span class="g-dot"></span>particle · drifting star</div><div><span class="g-line"></span>thread · proximity bond</div><div><span class="g-ring"></span>ripple · click to disturb</div></div>
<div class="panel"><label>Connection distance <span id="cv">120</span></label>
<input type="range" id="rng" min="40" max="260" value="120" aria-label="Connection distance">
<div class="seg" id="seg" role="group" aria-label="Gravity mode"><div class="pill"></div><button id="bA" class="on">ATTRACT</button><button id="bR">REPEL</button></div></div>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,pts=[],ripples=[],mx=-999,my=-999,mode=1,linkD=120,fps=60;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);spawn();}
function spawn(){const n=Math.max(90,Math.min(420,Math.round(W*H/5200)));pts=[];
for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:.8+Math.random()*1.6,ph:Math.random()*7,tw:.5+Math.random()*2,tint:Math.random()<.4?'169,180,255':'255,255,255'});}
resize();addEventListener('resize',resize);
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
cv.parentElement.addEventListener('pointerdown',()=>{});
addEventListener('pointerdown',e=>{if(e.target.closest('.panel'))return;ripple(e.clientX,e.clientY);});
function ripple(x,y){ripples.push({x,y,r:0,a:1});for(let i=0;i<4;i++){const a=Math.random()*7;pts.push({x,y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,r:1+Math.random()*1.5,ph:Math.random()*7,tw:1,tint:'255,255,255'});}if(pts.length>600)pts.splice(0,pts.length-600);}
const rng=document.getElementById('rng');
function paintR(){document.getElementById('cv').textContent=rng.value;linkD=+rng.value;rng.style.setProperty('--p',((rng.value-40)/220*100)+'%');}
rng.addEventListener('input',paintR);paintR();
const seg=document.getElementById('seg'),bA=document.getElementById('bA'),bR=document.getElementById('bR');
bA.onclick=()=>{mode=1;seg.classList.remove('repel');bA.classList.add('on');bR.classList.remove('on');};
bR.onclick=()=>{mode=-1;seg.classList.add('repel');bR.classList.add('on');bA.classList.remove('on');};
addEventListener('keydown',e=>{if(e.key==='a'||e.key==='A')bA.click();if(e.key==='r'||e.key==='R')bR.click();});
let last=performance.now(),threads=0;
function step(n){const dt=Math.min(50,n-last);last=n;fps+=(1000/Math.max(dt,1)-fps)*.05;
ctx.clearRect(0,0,W,H);
if(!RM){for(const p of pts){p.x+=(p.vx+Math.sin(n*.0004+p.y*.01)*.25)*dt/16;p.y+=(p.vy+Math.cos(n*.0004+p.x*.01)*.25)*dt/16;
const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy);if(d<220&&d>4){const f=(1-d/220);const q=f*f*.06*mode;p.vx+=dx/d*q;p.vy+=dy/d*q;}
p.vx*=.995;p.vy*=.995;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;}}
// spatial hash
const cell=linkD,grid=new Map();
for(const p of pts){const k=((p.x/cell)|0)+':'+((p.y/cell)|0);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(p);}
threads=0;ctx.lineWidth=.8;
for(const p of pts){const gx=(p.x/cell)|0,gy=(p.y/cell)|0;
for(let ix=gx-1;ix<=gx+1;ix++)for(let iy=gy-1;iy<=gy+1;iy++){const arr=grid.get(ix+':'+iy);if(!arr)continue;
for(const q of arr){if(q===p)continue;const dx=p.x-q.x,dy=p.y-q.y;if(Math.abs(dx)>linkD||Math.abs(dy)>linkD)continue;const d=Math.hypot(dx,dy);if(d<linkD){const o=Math.pow(1-d/linkD,2)*.7;if(o>.02){ctx.strokeStyle=`rgba(169,180,255,${o.toFixed(3)})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();threads++;}}}}
threads/=2;}
// ripples push + draw
ripples=ripples.filter(r=>r.a>0);
for(const r of ripples){r.r+=dt*.28;r.a-=dt/1600;
for(const p of pts){const d=Math.hypot(p.x-r.x,p.y-r.y);if(Math.abs(d-r.r)<14){p.vx+=(p.x-r.x)/(d+1)*1.4;p.vy+=(p.y-r.y)/(d+1)*1.4;}}
ctx.strokeStyle=`rgba(169,180,255,${(r.a*.8).toFixed(3)})`;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();
ctx.strokeStyle=`rgba(255,255,255,${(r.a*.4).toFixed(3)})`;ctx.beginPath();ctx.arc(r.x,r.y,r.r*.72,0,7);ctx.stroke();}
// particles
for(const p of pts){const tw=.55+.45*Math.sin(n*.001*p.tw+p.ph);const halo=p.r*6;
const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,halo);g.addColorStop(0,`rgba(${p.tint},${(.9*tw).toFixed(2)})`);g.addColorStop(1,`rgba(${p.tint},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,halo,0,7);ctx.fill();
ctx.fillStyle=`rgba(255,255,255,${(.7*tw+.3).toFixed(2)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
// cursor halo
if(mx>0){const g=ctx.createRadialGradient(mx,my,0,mx,my,60);g.addColorStop(0,'rgba(169,180,255,.25)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,60,0,7);ctx.fill();}
if((n|0)%15===0)document.getElementById('stamp').innerHTML=`${pts.length} pts · ${Math.round(threads)} threads · ${Math.round(fps)} fps`;
requestAnimationFrame(step);}
requestAnimationFrame(step);
</script>
</body>
</html>
