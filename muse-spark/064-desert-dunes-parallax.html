<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahel Meridian — Desert Dunes</title>
<style>
/* Desert dunes at golden hour */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --sky1: #5d8fb5;
  --sky2: #e8b86b;
  --sky3: #f8dca4;
  --d1: #f1d9a8;
  --d2: #e4b982;
  --d3: #d59b62;
  --d4: #bd7a48;
  --d5: #9a5a35;
  --d6: #6e3b24;
  --sun: #fff6d2;
  --stars: 0;
  --sx: 66%;
  --sy: 22%;
}
html,
body {
  height: 100%;
}
body {
  overflow: hidden;
  font-family: Georgia, 'Iowan Old Style', Palatino, serif;
  background: linear-gradient(var(--sky1), var(--sky2) 60%, var(--sky3));
}
.sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(var(--sky1) 0%, var(--sky2) 62%, var(--sky3) 100%);
}
#stars {
  position: absolute;
  inset: 0;
  opacity: var(--stars);
  width: 100%;
  height: 100%;
}
.sun {
  position: absolute;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, var(--sun) 45%, transparent 72%);
  box-shadow: 0 0 80px 30px var(--sun);
  left: var(--sx);
  top: var(--sy);
  transform: translate(-50%, -50%);
  z-index: 3;
}
.haze {
  position: absolute;
  left: 0;
  right: 0;
  top: 56%;
  height: 14%;
  background: linear-gradient(transparent, rgba(255, 240, 210, 0.4));
  filter: blur(14px);
  z-index: 4;
}
.layer {
  position: absolute;
  left: -6%;
  right: -6%;
  bottom: 0;
  will-change: transform;
}
.layer svg {
  width: 100%;
  height: 100%;
  display: block;
}
.layer path {
  transition: fill 1s;
}
/* title */
.title {
  position: absolute;
  top: 24px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff8ea;
  text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
  z-index: 20;
  padding: 0 12px;
  pointer-events: none;
}
.title h1 {
  font-size: clamp(22px, 4.5vw, 52px);
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  transform: scaleX(1.12);
  font-weight: 400;
}
.title .rule {
  width: 180px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #fff, transparent);
  margin: 10px auto;
}
.title p {
  font-style: italic;
  font-size: clamp(12px, 1.6vw, 17px);
  opacity: 0.9;
}
#wind {
  position: absolute;
  top: 20px;
  right: 18px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #fff;
  background: rgba(0, 0, 0, 0.3);
  padding: 6px 12px;
  border-radius: 8px;
  z-index: 21;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
#sand {
  position: absolute;
  inset: 0;
  z-index: 15;
  mix-blend-mode: screen;
  pointer-events: none;
}
.caravan {
  position: absolute;
  bottom: 24%;
  left: 0;
  width: 100%;
  height: 60px;
  z-index: 14;
  pointer-events: none;
  overflow: hidden;
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.camel {
  animation: bob 1.4s ease-in-out infinite;
}
/* control panel */
.panel {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(60, 35, 15, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 240, 210, 0.4);
  border-radius: 14px;
  padding: 12px 20px;
  display: flex;
  gap: 16px;
  align-items: center;
  z-index: 30;
  color: #ffe9c4;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 94vw;
}
.panel label {
  font-size: 10px;
  letter-spacing: 0.3em;
}
.panel input[type="range"] {
  width: min(320px, 50vw);
  -webkit-appearance: none;
  appearance: none;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(90deg, #f8dca4, #e3894e, #5a2f5a, #070a1a);
  cursor: pointer;
}
.panel input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #f6b975);
  border: 2px solid #6e3b24;
  cursor: pointer;
}
.panel input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #f6b975);
  border: 2px solid #6e3b24;
  cursor: pointer;
}
#clock {
  font-family: 'Courier New', monospace;
  font-size: 14px;
  min-width: 56px;
}
.panel button {
  background: transparent;
  border: 1px solid #ffe9c4;
  color: #ffe9c4;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}
.panel button:hover {
  background: rgba(255, 233, 196, 0.2);
}
.panel button:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}
.ticks {
  display: flex;
  gap: 12px;
  font-size: 10px;
  letter-spacing: 0.18em;
  opacity: 0.8;
}
@media (max-width: 640px) {
  #wind {
    display: none;
  }
  .ticks {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .camel {
    animation: none;
  }
}
</style>
</head>
<body>
<div class="sky"></div>
<canvas id="stars"></canvas>
<div class="sun" id="sun"></div>
<div class="haze"></div>
<div class="title" id="title">
  <h1>SAHEL MERIDIAN</h1>
  <div class="rule"></div>
  <p>Where the ergs meet the evening &mdash; 16&deg; 14&prime; N, 0&deg; 02&prime; W</p>
</div>
<div id="wind">WIND ESE &middot; 14 kn</div>
<div id="dunes"></div>
<div class="caravan">
  <svg viewBox="0 0 1200 80" preserveAspectRatio="none" style="width:200%;height:60px" id="car">
    <g id="camels"></g>
  </svg>
</div>
<canvas id="sand"></canvas>
<div class="panel">
  <label for="time">TIME OF DAY</label>
  <input type="range" id="time" min="0" max="1000" value="0" aria-label="Time of day">
  <span id="clock">16:40</span>
  <button id="pause">Pause</button>
  <div class="ticks"><span>GOLDEN</span><span>TWILIGHT</span><span>NIGHT</span></div>
</div>
<script>
(function () {
  'use strict';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Keyframed palette: golden hour -> dusk -> night.
  var keys = [
    { s1: '#5d8fb5', s2: '#e8b86b', s3: '#f8dca4',
      d: ['#f1d9a8', '#e4b982', '#d59b62', '#bd7a48', '#9a5a35', '#6e3b24'],
      sun: '#fff6d2', st: 0 },
    { s1: '#3f5e8c', s2: '#e3894e', s3: '#f6b975',
      d: ['#e8c894', '#d5a06e', '#c08454', '#a66a3e', '#84492c', '#5c301e'],
      sun: '#ffe0a0', st: 0 },
    { s1: '#26305a', s2: '#b2496a', s3: '#ef8a5a',
      d: ['#c49a7a', '#a97a58', '#8a5a42', '#6e4432', '#4e2e22', '#382015'],
      sun: '#ffb26a', st: 0.4 },
    { s1: '#121a3b', s2: '#5a2f5a', s3: '#c9613f',
      d: ['#8a6a62', '#6e524e', '#53403e', '#3c2e32', '#2a2026', '#1c1418'],
      sun: '#ffb26a', st: 0.8 },
    { s1: '#070a1a', s2: '#1c1837', s3: '#4a2a3a',
      d: ['#5c4a4a', '#4a3a3e', '#382c30', '#261e24', '#1a141a', '#120c10'],
      sun: '#ff9a5a', st: 1 }
  ];

  // Six dune silhouettes, far -> near.
  var dunesEl = document.getElementById('dunes');
  var ridges = [
    'M0,300 C300,220 600,260 800,200 C1000,140 1200,220 1600,180 L1600,600 L0,600 Z',
    'M0,340 C250,260 550,320 850,260 C1100,210 1350,280 1600,240 L1600,600 L0,600 Z',
    'M0,380 C300,300 650,360 950,300 C1200,255 1400,320 1600,290 L1600,600 L0,600 Z',
    'M0,420 C280,340 620,400 920,350 C1180,310 1400,370 1600,340 L1600,600 L0,600 Z',
    'M0,470 C320,390 680,450 980,410 C1230,375 1420,430 1600,400 L1600,600 L0,600 Z',
    'M0,520 C350,450 700,500 1000,470 C1250,445 1450,490 1600,470 L1600,600 L0,600 Z'
  ];
  var layers = [];
  ridges.forEach(function (d, i) {
    var div = document.createElement('div');
    div.className = 'layer';
    div.style.bottom = (-i * 2) + '%';
    div.style.height = (34 + i * 7) + '%';
    div.style.zIndex = 5 + i;
    div.innerHTML = '<svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">'
      + '<path d="' + d + '" fill="var(--d' + (i + 1) + ')"/></svg>';
    dunesEl.appendChild(div);
    layers.push(div);
  });

  // Caravan: four camel silhouettes with rider + calf.
  function camelSVG(x, delay, scale) {
    return '<g class="camel" style="animation-delay:' + delay + 's"'
      + ' transform="translate(' + x + ',10) scale(' + scale + ')" fill="#2a1a10">'
      + '<ellipse cx="0" cy="30" rx="22" ry="12"/>'
      + '<circle cx="0" cy="16" r="9"/>'
      + '<path d="M20,28 Q30,20 34,6 L40,6 L36,22 Q30,32 20,32" fill="#2a1a10"/>'
      + '<circle cx="40" cy="4" r="5"/>'
      + '<rect x="-14" y="6" width="10" height="12" rx="2"/>'
      + '<path d="M-16,40 L-16,58 M-6,40 L-6,58 M8,40 L10,58 M16,40 L14,58"'
      + ' stroke="#2a1a10" stroke-width="4" fill="none"/></g>';
  }
  document.getElementById('camels').innerHTML =
    camelSVG(60, 0, 1) + camelSVG(190, 0.3, 0.9) + camelSVG(320, 0.6, 1.05) + camelSVG(440, 0.9, 0.7);
  var car = document.getElementById('car');
  var carX = -40;

  // Star field canvas.
  var sc = document.getElementById('stars');
  var sx = sc.getContext('2d');
  var starArr = [];
  function initStars() {
    sc.width = window.innerWidth;
    sc.height = window.innerHeight;
    starArr = [];
    for (var i = 0; i < 180; i++) {
      starArr.push([Math.random() * window.innerWidth,
        Math.random() * window.innerHeight * 0.7,
        Math.random() * 1.5 + 0.3]);
    }
  }
  initStars();
  window.addEventListener('resize', initStars);
  function drawStars() {
    sx.clearRect(0, 0, sc.width, sc.height);
    sx.fillStyle = '#fff';
    for (var i = 0; i < starArr.length; i++) {
      var s = starArr[i];
      sx.globalAlpha = Math.random() * 0.9 + 0.1;
      sx.beginPath();
      sx.arc(s[0], s[1], s[2], 0, 7);
      sx.fill();
    }
    sx.globalAlpha = 1;
  }

  // Wind-blown sand streaks.
  var sand = document.getElementById('sand');
  var sctx = sand.getContext('2d');
  var streaks = [];
  function sizeSand() {
    sand.width = window.innerWidth;
    sand.height = window.innerHeight;
    streaks = [];
    for (var i = 0; i < 260; i++) {
      streaks.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        v: 1 + Math.random() * 3,
        l: 20 + Math.random() * 60,
        a: Math.random() * 0.5 + 0.1,
        ph: Math.random() * 7
      });
    }
  }
  sizeSand();
  window.addEventListener('resize', sizeSand);

  var tParam = 0, dir = 1, paused = reduced;
  var mx = 0, my = 0, emx = 0, emy = 0, gust = 1;
  window.addEventListener('pointermove', function (e) {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  var slider = document.getElementById('time');
  var clock = document.getElementById('clock');
  var pauseBtn = document.getElementById('pause');
  if (reduced) { pauseBtn.textContent = 'Resume'; }
  slider.addEventListener('input', function () {
    paused = true;
    pauseBtn.textContent = 'Resume';
    tParam = slider.value / 1000;
  });
  pauseBtn.addEventListener('click', function () {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });

  function lerp(a, b, t) { return a + (b - a) * t; }
  function hx(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    var A = hx(a), B = hx(b);
    return 'rgb(' + A.map(function (v, i) {
      return Math.round(lerp(v, B[i], t));
    }).join(',') + ')';
  }
  function smooth(t) { return t * t * (3 - 2 * t); }

  function applyScene(p) {
    var seg = p * 4;
    var i = Math.min(3, Math.floor(seg));
    var f = smooth(seg - i);
    var k = keys[i], k2 = keys[i + 1];
    var rs = document.documentElement.style;
    rs.setProperty('--sky1', mix(k.s1, k2.s1, f));
    rs.setProperty('--sky2', mix(k.s2, k2.s2, f));
    rs.setProperty('--sky3', mix(k.s3, k2.s3, f));
    for (var d = 0; d < 6; d++) {
      rs.setProperty('--d' + (d + 1), mix(k.d[d], k2.d[d], f));
    }
    rs.setProperty('--sun', mix(k.sun, k2.sun, f));
    rs.setProperty('--stars', lerp(k.st, k2.st, f).toFixed(2));
    rs.setProperty('--sx', (lerp(66, 42, p)).toFixed(1) + '%');
    rs.setProperty('--sy', (lerp(22, 70, p)).toFixed(1) + '%');
    var mins = 16 * 60 + 40 + p * (3 * 60 + 32);
    clock.textContent = String(Math.floor(mins / 60)).padStart(2, '0')
      + ':' + String(Math.floor(mins % 60)).padStart(2, '0');
    drawStars();
  }

  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!paused && !reduced) {
      tParam += dt / 60 * dir;
      if (tParam >= 1) { tParam = 1; dir = -1; }
      if (tParam <= 0) { tParam = 0; dir = 1; }
      slider.value = Math.round(tParam * 1000);
    }
    applyScene(tParam);
    emx += (mx - emx) * 0.05;
    emy += (my - emy) * 0.05;
    layers.forEach(function (l, i) {
      var m = 8 + i * 14;
      l.style.transform = 'translate(' + (emx * m).toFixed(1) + 'px,'
        + (emy * m * 0.6).toFixed(1) + 'px)';
    });
    document.getElementById('title').style.transform =
      'translate(' + (-emx * 10).toFixed(1) + 'px,' + (-emy * 6).toFixed(1) + 'px)';
    if (!reduced) {
      carX += dt * 2.2;
      if (carX > 60) { carX = -40; }
      car.style.transform = 'translateX(' + carX.toFixed(2) + 'vw)';
      car.style.color = 'var(--d4)';
      gust = 0.6 + Math.abs(Math.sin(now / 4000)) * 0.8;
      sctx.clearRect(0, 0, sand.width, sand.height);
      sctx.strokeStyle = 'rgba(255,240,210,.5)';
      sctx.lineWidth = 1.2;
      streaks.forEach(function (s) {
        s.x += s.v * gust * 3;
        if (s.x > window.innerWidth) {
          s.x = -50;
          s.y = Math.random() * window.innerHeight;
        }
        sctx.globalAlpha = s.a;
        sctx.beginPath();
        sctx.moveTo(s.x, s.y);
        sctx.lineTo(s.x + s.l * gust, s.y + Math.sin(now / 800 + s.ph) * 3);
        sctx.stroke();
      });
      sctx.globalAlpha = 1;
    }
  }
  setInterval(function () {
    document.getElementById('wind').textContent = 'WIND ESE \u00b7 '
      + Math.round(12 + gust * 4) + ' kn';
  }, 2000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
