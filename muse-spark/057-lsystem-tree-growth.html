<body>
<div class="frame"></div>
<header><div class="plate-no">Plate XVII · Lindenmayer Herbarium</div><h1>Arbor recursiva var. lindenmayeri</h1><div class="fam">Grammaticaceae — a stochastic bracketed L-system, five derivations</div></header>
<div class="rules">axiom X<br>X → F[+X]F[−X]+X<br>X → F[−X]F[+X]−X<br>X → F[+X][−X]FX<br>F → FF · angle 22–28°</div>
<canvas id="cv"></canvas>
<div id="toast">Sapling planted</div>
<div id="caption">
<div class="seasons" id="seas">
<button data-s="spring" class="on"><span class="dot" style="background:#f4a9bc"></span>Spring</button>
<button data-s="summer"><span class="dot" style="background:#5f8f45"></span>Summer</button>
<button data-s="autumn"><span class="dot" style="background:#d98a2c"></span>Autumn</button>
<button data-s="winter"><span class="dot" style="background:#cfe0ea"></span>Winter</button>
</div>
<div class="wind"><span id="wl">gentle</span><input type="range" id="wind" min="0" max="100" value="30"></div>
<button id="plant">Plant new tree</button>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;let season='spring',windAmt=.3,trees=[],flakes=[];
const SEAS={spring:['#f4a9bc','#f9c9d5','#ea8ea6','#fff1f3'],summer:['#5f8f45','#78a659','#3e6d33','#93bb6e'],autumn:['#d98a2c','#c2561f','#e6b04b','#a63d1a'],winter:[]};
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',rs);rs();
function xorshift(s){return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967295}}
function grow(seed,ox,oy,scale){
  const rnd=xorshift(seed);let s='X';
  for(let d=0;d<5;d++){let o='';for(const c of s){if(c==='X'){const r=rnd();o+=r<.33?'F[+X]F[-X]+X':r<.66?'F[-X]F[+X]-X':'F[+X][-X]FX'}else if(c==='F')o+='FF';else o+=c}if(o.length>9000)break;s=o}
  const ang=(22+rnd()*6)*Math.PI/180;
  const stack=[];let x=0,y=0,hd=-Math.PI/2;const segs=[];let order=0;
  const nodes=[{x:0,y:0}];
  // turtle → segments with order = depth of F
  let depth=0;
  const st=[{x:0,y:0,h:-Math.PI/2,d:0}];
  // simpler: walk string
  let cur={x:0,y:0,h:-Math.PI/2,d:0};const sk=[];
  for(const c of s){if(c==='F'){const len=7;const nx=cur.x+Math.cos(cur.h)*len,ny=cur.y+Math.sin(cur.h)*len;
    segs.push({x1:cur.x,y1:cur.y,x2:nx,y2:ny,d:cur.d,order:cur.d,leaf:false});cur.x=nx;cur.y=ny;cur.d+=.35}
    else if(c==='+')cur.h+=ang*(0.85+rnd()*.3);
    else if(c==='-')cur.h-=ang*(0.85+rnd()*.3);
    else if(c==='[')sk.push({...cur});
    else if(c===']'){const t=sk.pop();if(t){ // branch tip
      if(segs.length&&rnd()<.3)segs[segs.length-1].leaf=true;
      cur=t}} }
  segs.forEach(sg=>{if(Math.hypot(sg.x2-sg.x1,sg.y2-sg.y1)>0&&sg.d>6)sg.leaf=true});
  const maxO=Math.max(...segs.map(s=>s.order),1);
  return {seed,ox,oy,scale,segs,maxO,born:performance.now(),leaves:segs.filter(s=>s.leaf).map(s=>({s,ph:Math.random()*7,c:SEAS[season][Math.random()*4|0]||'#5f8f45',g:0}))};
}
function plant(x,y,fresh){
  const sc=(y/H)*.5+.7;
  trees.push(grow((Math.random()*1e9)|0,x??W/2,y??H*.92,sc??1));
  if(trees.length>8)trees.shift();
  if(fresh){const t=document.getElementById('toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1400)}
}
plant(W/2,H*.92,false);
for(let i=0;i<70;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:20+Math.random()*40,ph:Math.random()*7});
const wl=document.getElementById('wl');
document.getElementById('wind').oninput=e=>{windAmt=e.target.value/100;wl.textContent=windAmt<.15?'still':windAmt<.45?'gentle':windAmt<.75?'brisk':'gale'};
document.getElementById('seas').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 [...document.querySelectorAll('#seas button')].forEach(x=>x.classList.toggle('on',x===b));season=b.dataset.s;
 trees.forEach(t=>{t.leaves.forEach(l=>l.g=0);t.leaves.forEach(l=>l.c=SEAS[season][Math.random()*4|0]||'#fff')})};
document.getElementById('plant').onclick=()=>plant(W/2+ (Math.random()-.5)*200,H*.92,true);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('plant').click()}});
cv.addEventListener('pointerdown',e=>plant(e.clientX,e.clientY,true));
function frame(now){
  const t=now/1000;
  // sky tint + ground
  const tints={spring:'rgba(244,169,188,.10)',summer:'rgba(95,143,69,.12)',autumn:'rgba(217,138,44,.14)',winter:'rgba(160,190,220,.16)'};
  ctx.clearRect(0,0,W,H);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'rgba(255,255,255,0)');sky.addColorStop(1,tints[season]);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // ground
  ctx.strokeStyle='rgba(43,35,24,.5)';ctx.beginPath();ctx.moveTo(0,H*.92);ctx.lineTo(W,H*.92);ctx.stroke();
  const gg=ctx.createLinearGradient(0,H*.92,0,H);gg.addColorStop(0,'rgba(107,91,69,.25)');gg.addColorStop(1,'rgba(107,91,69,.05)');
  ctx.fillStyle=gg;ctx.fillRect(0,H*.92,W,H*.08);
  // mist
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let i=0;i<3;i++){const mx=((t*12*(i+1)+i*400)%(W+400))-200;ctx.beginPath();ctx.ellipse(mx,H*.88-i*14,130,14,0,0,7);ctx.fill()}
  // grass
  ctx.strokeStyle='rgba(59,42,28,.6)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<W;x+=14){const lean=windAmt*8*Math.sin(t*1.6+x*.05);ctx.moveTo(x,H*.92);ctx.lineTo(x+lean,H*.92-6-Math.abs(Math.sin(x))*6)}
  ctx.stroke();
  trees.forEach(tr=>{
    const age=RM?9999:now-tr.born;
    ctx.save();ctx.translate(tr.ox,tr.oy);ctx.scale(tr.scale,tr.scale);
    tr.segs.forEach(sg=>{
      const need=sg.order*55,el=now-tr.born-need;
      if(el<0&&!RM)return;
      let f=RM?1:Math.min(1,el/100);f=1-Math.pow(1-f,3);
      const wob=windAmt*(0.003+0.014*sg.order/tr.maxO)*Math.sin(t*1.6+sg.order*.35)+windAmt*.002*Math.sin(t*5+sg.d);
      const x1=sg.x1,y1=sg.y1;
      const mxp=sg.x1+(sg.x2-sg.x1)*f, myp=sg.y1+(sg.y2-sg.y1)*f;
      ctx.strokeStyle='#3b2a1c';ctx.lineCap='round';
      ctx.lineWidth=Math.max(.6,5*Math.pow(1-sg.order/tr.maxO,1.6));
      ctx.beginPath();ctx.moveTo(x1+wob*sg.order*4,y1);ctx.lineTo(mxp+wob*sg.order*8,myp);ctx.stroke();
      if(season==='winter'&&ctx.lineWidth>2){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,y1-2);ctx.lineTo(mxp,myp-2);ctx.stroke()}
    });
    // leaves
    if(season!=='winter')tr.leaves.forEach(L=>{
      const need=L.s.order*55+100;const el=now-tr.born-need;if(el<0&&!RM)return;
      L.g=Math.min(1,L.g+.02);
      const sc=L.g*(0.7+0.3*Math.sin(L.ph+t));
      ctx.save();ctx.translate(L.s.x2,L.s.y2);ctx.rotate(L.ph+t*.1);ctx.scale(sc,sc);
      ctx.fillStyle=L.c;ctx.globalAlpha=.9;ctx.beginPath();ctx.ellipse(0,0,7,4.4,0,0,7);ctx.fill();ctx.restore();ctx.globalAlpha=1;
    });
    ctx.restore();
  });
  if(season==='winter'){ctx.fillStyle='rgba(255,255,255,.85)';flakes.forEach(f=>{f.y+=f.v/60;f.x+=Math.sin(t+f.ph)*.5+windAmt*1.2;if(f.y>H){f.y=-6;f.x=Math.random()*W}ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()})}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
