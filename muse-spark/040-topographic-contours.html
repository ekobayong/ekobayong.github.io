<!-- PROMPT-BEGIN 040-topographic-contours.html | 040. The Living Landscape — Animated Topographic Contours
Original generation prompt (from prompt.md):

Create a single self-contained, full-viewport HTML page titled "Living Landscape — Animated Topographic Contours, Sheet 040" that looks like a survey map sheet whose terrain is quietly alive. A canvas fills the screen. JavaScript computes a heightfield on a coarse grid (cell size about 1/200 of the longer viewport edge, minimum 5 px) using five-octave 3D Perlin-style gradient noise with a light domain warp, where the third noise axis is time so the whole landscape drifts and ridges migrate. From the heightfield derive a hillshade by taking finite-difference gradients and dotting against a light from the upper left; write the shaded colour per cell into an ImageData buffer on an offscreen canvas and draw it stretched across the viewport with smoothing so it reads as a soft tinted relief. Then trace contours with marching squares at 26 evenly spaced levels (every 40 m from a 180 m datum), linearly interpolating crossing points along cell edges and resolving the two saddle cases with the cell's centre value. Minor contours are 0.7 px hairlines; every fifth level is an index contour drawn at 1.6 px and labelled with its elevation in metres: choose a few segment midpoints per level at least 150 px apart and away from the edges, rotate the text to the local line direction (never upside down), paint a small background-coloured rectangle first so the line appears to break for the label, then draw the number in bold 10 px system sans. Recompute and redraw at most 30 times per second; a "Flow" slider (0–100, default 35) scales the time step and a Pause/Resume button (also Space) freezes it.

Cursor spotlight: while the pointer is over the map, draw a large soft radial highlight around it, a thin circle with four crosshair ticks in the accent colour, and a small boxed monospace reading of the interpolated elevation beside the cursor. A glass readout card in the bottom-left shows Elevation (m), Slope (degrees, from the gradient using 2.5 m per pixel at 1:25 000) and Aspect (eight compass points) in large serif numerals, plus a black-and-white scale bar labelled 1 km, a legend distinguishing 40 m and 200 m index contours, and the Flow and Pause controls.

Palettes (buttons in the top-right, keys 1/2/3; each swaps the canvas colours and, via a data attribute on body, the CSS variables of the UI): Paper & Ink — warm paper #f3eee3 with hillshade as gentle sepia lightness variation, minor lines rgba(43,42,40,0.42), index lines rgba(43,42,40,0.92), labels #2b2a28, accent rust #b5482b; Terrain — hypsometric tint interpolated through valley green (62,110,74), grass (122,150,82), tan (200,178,122), brown (150,112,78), grey (120,104,92) and snow (242,239,230), multiplied by the hillshade, with dark brown lines and accent #8a4b2a; Night Blueprint — deep blue #0a1a33 brightened by hillshade, minor lines rgba(127,209,255,0.42), index lines rgba(217,236,255,0.95), labels #d9ecff, accent #7fd1ff. A faint 120 px CSS graticule is blended over the canvas (multiply on light palettes, screen at night).

Cartographic UI: a top-left title card with a thin inner border like a map neatline, a monospace header row "Sheet 040 · Series L-7 / 1 : 25 000", the serif headline "The Living Landscape" with an italic accent word, and a two-sentence explanation of the contour interval. Labels and legend use small caps (font-variant: small-caps) with wide letter-spacing; numerals use tabular figures. In the bottom-right sits an inline SVG compass rose: two concentric rings with tick marks, a four-point star with alternating dark/light halves, a smaller rotated four-point star behind it, a rust north needle, a centre dot, and serif small-caps N, S, E, W; the rose sways ±1.2° over 12 seconds. All cards use translucent palette-matched glass with backdrop blur and 6 px radii. The layout is a fixed grid with the title and palettes on top, the readout and compass at the bottom; under 720 px the description and compass hide and the palette buttons become a bottom row. Handle devicePixelRatio (capped at 2), debounce resize (rebuilding the grid), and under prefers-reduced-motion render a static field that still responds to the cursor and palette changes without animating.

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Landscape — Animated Topographic Contours, Sheet 040</title>
<style>
:root{--paper:#f3eee3;
--line:rgba(43,42,40,.42);
--index:rgba(43,42,40,.92);
--lab:#2b2a28;
--acc:#b5482b;
--glass:rgba(243,238,227,.82)}
body[data-p="terrain"]{--paper:#e9e2cf;
--line:rgba(90,60,30,.45);
--index:rgba(80,50,25,.95);
--lab:#4a3320;
--acc:#8a4b2a;
--glass:rgba(233,226,207,.85)}
body[data-p="night"]{--paper:#0a1a33;
--line:rgba(127,209,255,.42);
--index:rgba(217,236,255,.95);
--lab:#d9ecff;

*{margin:0;
padding:0;
box-sizing:border-box}
html,body{height:100%;
overflow:hidden;
background:var(--paper);
color:var(--lab);
font-family:system-ui,sans-serif}
#map{position:fixed;
inset:0;
width:100%;
height:100%}
.grat{position:fixed;
inset:0;
pointer-events:none;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
background-size:120px 120px;
opacity:.12;
mix-blend-mode:multiply}
body[data-p="night"] .grat{mix-blend-mode:screen}
.ui{position:fixed;
inset:0;
display:grid;
grid-template-rows:auto 1fr auto;
grid-template-columns:1fr auto;
padding:16px;
gap:12px;
pointer-events:none}
.card{pointer-events:auto;
background:var(--glass);
backdrop-filter:blur(10px);
border-radius:6px;
padding:14px 16px;
border:1px solid var(--line);
position:relative}
.card::before{content:"";
position:absolute;
inset:4px;
border:1px solid var(--line);
border-radius:4px;
pointer-events:none}
.top-left{justify-self:start;
max-width:400px}.top-right{justify-self:end;
display:flex;
gap:8px;
align-self:start}
.mono{font-family:ui-monospace,monospace;
font-size:10px;
letter-spacing:.22em;
text-transform:uppercase}
h1{font-family:Georgia,serif;
font-weight:400;
font-size:clamp(22px,3vw,34px)}h1 em{font-style:italic;
color:var(--acc)}
.desc{font-size:12px;
margin-top:6px;

.pal{border:1px solid var(--lab);

font-family:ui-monospace,monospace}
.pal.on{background:var(--lab);
color:var(--paper)}
.readout{align-self:end;
justify-self:start;
display:flex;
gap:18px;
align-items:center;
flex-wrap:wrap}
.readout .big{font-family:Georgia,serif;
font-size:26px;
font-variant-numeric:tabular-nums}
.readout small{font-variant:small-caps;

font-size:10px;
display:block}
.scale{width:120px;
height:6px;
background:repeating-linear-gradient(90deg,var(--lab) 0 15px,var(--paper) 15px 30px);
border:1px solid var(--lab);
margin-top:6px}
.compass{align-self:end;
justify-self:end;
width:110px;
height:110px;
animation:sway 12s ease-in-out infinite alternate}

#spot{position:fixed;
pointer-events:none;

display:none}
input[type=range]{accent-color:var(--acc);
width:110px}
button.ctl{border:1px solid var(--lab);
background:none;
color:var(--lab);
border-radius:6px;
padding:7px 12px;
font:inherit;
font-size:11px;
cursor:pointer;
font-family:ui-monospace,monospace}
@media(max-width:720px){.desc,.compass{display:none}.top-right{grid-column:1/-1;
justify-self:start}}
@media(prefers-reduced-motion:reduce){.compass{animation:none}}
</style>
</head>
<body data-p="paper">
<canvas id="map"></canvas><div class="grat"></div>
<div class="ui">
<div class="card top-left"><div class="mono">Sheet 040 · Series L-7 / 1 : 25 000</div><h1>The Living <em>Landscape</em></h1><p class="desc">Contour interval 40 m · index every 200 m · terrain drifts with time. Move the cursor for a spotlight reading.</p></div>
<div class="top-right"><div class="card" style="display:flex;
gap:8px"><button class="pal on" data-p="paper">1 Paper</button><button class="pal" data-p="terrain">2 Terrain</button><button class="pal" data-p="night">3 Night</button></div></div>
<div class="card readout"><div><small>Elevation</small><span class="big" id="rE">—</span></div><div><small>Slope</small><span class="big" id="rS">—</span></div><div><small>Aspect</small><span class="big" id="rA">—</span></div><div><small>1 km scale</small><div class="scale"></div></div><div><small>— 40 m · — 200 m index</small><label class="mono">Flow <input type="range" id="flow" min="0" max="100" value="35"></label> <button class="ctl" id="pause">Pause</button></div></div>
<div class="compass card"><svg viewBox="0 0 100 100" width="80" height="80"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width=".6"/><g fill="currentColor"><path d="M50 12 L54 50 L50 46 L46 50Z"/><path d="M50 88 L46 50 L50 54 L54 50Z" opacity=".4"/><path d="M12 50 L50 46 L46 50 L50 54Z" opacity=".4"/><path d="M88 50 L50 54 L54 50 L50 46Z" opacity=".4"/></g><path d="M50 12 L54 50 L50 46 L46 50Z" fill="#b5482b"/><text x="50" y="10" text-anchor="middle" font-size="9" font-family="Georgia">N</text><text x="50" y="98" text-anchor="middle" font-size="8" font-family="Georgia">S</text><text x="4" y="53" font-size="8" font-family="Georgia">W</text><text x="90" y="53" font-size="8" font-family="Georgia">E</text><circle cx="50" cy="50" r="3" fill="currentColor"/></svg></div>
</div>
<div id="spot"></div>
<script>
const cv=document.getElementById('map'),ctx=cv.getContext('2d');

const buf=document.createElement('canvas'),bx=buf.getContext('2d');

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

let W,H,DPR,gw,gh,field=[],flow=.35,run=true,time=0,mouse=null;

function h2(n){const s=Math.sin(n*127.1+311.7)*43758.5;
return s-Math.floor(s)}
function vn(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);

function L(a,b,t){return a+(b-a)*t}
const c000=h2(xi+yi*57+zi*131),c100=h2(xi+1+yi*57+zi*131),c010=h2(xi+(yi+1)*57+zi*131),c110=h2(xi+1+(yi+1)*57+zi*131),c001=h2(xi+yi*57+(zi+1)*131),c101=h2(xi+1+yi*57+(zi+1)*131),c011=h2(xi+(yi+1)*57+(zi+1)*131),c111=h2(xi+1+(yi+1)*57+(zi+1)*131);

return L(L(L(c000,c100,u),L(c010,c110,u),v),L(L(c001,c101,u),L(c011,c111,u),v),w)}
function fbm(x,y,t){let v=0,a=.5,f=1;
for(let o=0;
o<5;
o++){v+=a*vn(x*f,y*f,t+o*3.7);
a*=.5;
f*=2.03}return v}
function size(){DPR=Math.min(2,devicePixelRatio||1);
W=innerWidth;
H=innerHeight;
cv.width=W*DPR;
cv.height=H*DPR;
ctx.setTransform(DPR,0,0,DPR,0,0);

const cell=Math.max(5,Math.max(W,H)/200);
gw=Math.ceil(W/cell);
gh=Math.ceil(H/cell);
buf.width=gw;
buf.height=gh}
size();
let d;
addEventListener('resize',()=>{clearTimeout(d);
setTimeout(size,250)});

function compute(){field=new Array(gh);
for(let j=0;
j<gh;
j++){field[j]=new Float32Array(gw);
for(let i=0;
i<gw;
i++){const x=i/gw*6,y=j/gh*6;
const wx=fbm(x+9,y+3,time*.1)*1.4,wy=fbm(x+4,y+8,time*.1)*1.4;
field[j][i]=fbm(x+wx,y+wy,time)*1.2-0.15}}}
const TER=[[62,110,74],[122,150,82],[200,178,122],[150,112,78],[120,104,92],[242,239,230]];

function paint(){const img=bx.createImageData(gw,gh),pal=document.body.dataset.p;
const lx=-.6,ly=-.8,L=Math.hypot(lx,ly);

for(let j=0;
j<gh;
j++)for(let i=0;
i<gw;
i++){const h=field[j][i];
const hx=((field[j][Math.min(gw-1,i+1)]-field[j][Math.max(0,i-1)])/2)*8,hy=((field[Math.min(gh-1,j+1)][i]-field[Math.max(0,j-1)][i])/2)*8;

let sh=(1-(hx*lx+hy*ly)/L*.9);
sh=Math.max(.55,Math.min(1.35,sh));
let r,g,b;
const k=(i+j*2)%2;

if(pal==='night'){const v=sh;
 r=10*v+8;
g=26*v+10;
b=51*v+20}
else if(pal==='terrain'){const t=Math.max(0,Math.min(.999,h));
const seg=t*(TER.length-1),s0=Math.floor(seg),f=seg-s0,a=TER[s0],c2=TER[Math.min(5,s0+1)];
r=(a[0]+(c2[0]-a[0])*f)*sh;
g=(a[1]+(c2[1]-a[1])*f)*sh;
b=(a[2]+(c2[2]-a[2])*f)*sh}
else{const l=243-(1-sh)*60;
 r=l;
g=l-6;
b=l-16}
const o=(j*gw+i)*4;
img.data[o]=r;
img.data[o+1]=g;
img.data[o+2]=b;
img.data[o+3]=255}
bx.putImageData(img,0,0);
ctx.imageSmoothingEnabled=true;
ctx.drawImage(buf,0,0,W,H)}
function contours(){const cw=W/gw,ch=H/gh;
const lv=[];
for(let k=0;
k<26;
k++)lv.push(0.08+k*(0.84/26));

ctx.lineWidth=.7;
lv.forEach((L,li)=>{const idx=li%5===0;
ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue(idx?'--index':'--line');
ctx.lineWidth=idx?1.6:.7;
ctx.beginPath();

for(let j=0;
j<gh-1;
j++)for(let i=0;
i<gw-1;
i++){const a=field[j][i]-L,b=field[j][i+1]-L,c=field[j+1][i+1]-L,d=field[j+1][i]-L;
let code=(a>0?8:0)|(b>0?4:0)|(c>0?2:0)|(d>0?1:0);
if(code===0||code===15)continue;

const x0=i*cw,y0=j*ch;
const T=(p,q)=>p/(p-q);
const top=[x0+cw*T(a,b),y0],rgt=[x0+cw,y0+ch*T(b,c)],bot=[x0+cw*T(d,c),y0+ch],lft=[x0,y0+ch*T(a,d)];

function seg(p,q){ctx.moveTo(p[0],p[1]);
ctx.lineTo(q[0],q[1])}
switch(code){case 1:case 14:seg(lft,bot);
break;
case 2:case 13:seg(bot,rgt);
break;
case 3:case 12:seg(lft,rgt);
break;
case 4:case 11:seg(top,rgt);
break;
case 5:seg(top,lft);
seg(bot,rgt);
break;
case 6:case 9:seg(top,bot);
break;
case 7:case 8:seg(top,lft);
break;
case 10:seg(top,rgt);
seg(lft,bot);
break}}
ctx.stroke();

if(idx){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--lab');
ctx.font='bold 10px system-ui';
let placed=0;
for(let j=4;
j<gh-4&&placed<3;
j+=Math.floor(gh/3)){for(let i=4;
i<gw-4;
i+=9){if(placed>=3)break;
const v=field[j][i];
if(Math.abs(v-L)<.012&&i*cw>90&&i*cw<W-90){const m=((180+L*1200)|0);
const x=i*cw,y=j*ch;
ctx.save();
ctx.translate(x,y);
ctx.rotate(Math.atan2(field[j+1][i]-field[j-1][i],field[j][i+1]-field[j][i-1])+Math.PI/2);
if(ctx.getTransform().b<0||Math.cos(0)>2){}const w2=ctx.measureText(m+' m').width;
ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--paper');
ctx.fillRect(-w2/2-3,-8,w2+6,13);
ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--lab');
ctx.textAlign='center';
ctx.fillText(m+' m',0,3);
ctx.restore();
placed++;
break}}}})}
function elevAt(x,y){const i=Math.max(0,Math.min(gw-1.001,x/W*gw)),j=Math.max(0,Math.min(gh-1.001,y/H*gh));
const i0=Math.floor(i),j0=Math.floor(j),fx=i-i0,fy=j-j0;
const v=field[j0][i0]*(1-fx)*(1-fy)+field[j0][i0+1]*fx*(1-fy)+field[Math.min(gh-1,j0+1)][i0]*(1-fx)*fy+field[Math.min(gh-1,j0+1)][i0+1]*fx*fy;
return{v,elv:Math.round(180+v*1200),gx:(field[j0][Math.min(gw-1,i0+1)]-field[j0][Math.max(0,i0-1)])*600,gy:(field[Math.min(gh-1,j0+1)][i0]-field[Math.max(0,j0-1)][i0])*600}}
let last=0;

function frame(now){requestAnimationFrame(frame);
if(now-last<33)return;
last=now;
if(run&&!RM)time+=flow*.03;
if(run||!frame.d||document.body.dataset.p!==frame.p){compute();
paint();
contours();
frame.d=true;
frame.p=document.body.dataset.p}
else{paint();
contours()}
if(mouse){const r=200;
const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,r);
g.addColorStop(0,'rgba(255,255,255,.22)');
g.addColorStop(1,'transparent');
ctx.fillStyle=g;
ctx.fillRect(mouse.x-r,mouse.y-r,r*2,r*2);

ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--acc');
ctx.beginPath();
ctx.arc(mouse.x,mouse.y,26,0,7);
ctx.stroke();
for(const[a,b]of[[0,-32],[0,32],[-32,0],[32,0]]){ctx.beginPath();
ctx.moveTo(mouse.x+a,mouse.y+b);
ctx.lineTo(mouse.x+a*1.2,mouse.y+b*1.2);
ctx.stroke()}
const{v,elv,gx,gy}=elevAt(mouse.x,mouse.y);
const sl=Math.atan(Math.hypot(gx,gy)*2.5/1000)*57.3;
const dirs=['E','SE','S','SW','W','NW','N','NE'];
const asp=dirs[((Math.atan2(gx,-gy)/6.283+1)%1*8)|0];

document.getElementById('rE').textContent=elv+' m';
document.getElementById('rS').textContent=sl.toFixed(1)+'°';
document.getElementById('rA').textContent=asp;

const sp=document.getElementById('spot');
sp.style.display='block';
sp.style.left=mouse.x+18+'px';
sp.style.top=mouse.y-30+'px';
sp.textContent=elv+' m'}}
requestAnimationFrame(frame);

addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY}});

document.getElementById('flow').oninput=e=>flow=e.target.value/100;

const pb=document.getElementById('pause');
function tog(){run=!run;
pb.textContent=run?'Pause':'Resume'}pb.onclick=tog;

addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();
tog()}if(e.key==='1')setP('paper');
if(e.key==='2')setP('terrain');
if(e.key==='3')setP('night')});

function setP(p){document.body.dataset.p=p;
document.querySelectorAll('.pal').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
frame.d=false}
document.querySelectorAll('.pal').forEach(b=>b.onclick=()=>setP(b.dataset.p));

if(RM){time=1.2;
compute();
paint();
contours()}
</script>
</body>
</html>
