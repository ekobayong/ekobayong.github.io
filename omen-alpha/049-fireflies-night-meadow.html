<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>049 · Night Meadow — Fireflies</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
  #scene { position:fixed; inset:0; cursor:none; transition:filter 1.4s ease; }
  #scene.newmoon { filter:brightness(.72) saturate(.62); }

  #sky {
    position:absolute; inset:0; z-index:0;
    background:linear-gradient(180deg, #05081a 0%, #0d1a3d 42%, #1a2f52 76%, #22344f 100%);
  }
  #moonglow {
    position:absolute; inset:0; z-index:1; pointer-events:none; transition:opacity 1.4s ease;
    background:radial-gradient(46% 40% at 78% 13%, rgba(255,236,190,.30), rgba(255,236,190,0) 75%);
  }
  .star {
    position:absolute; border-radius:50%; z-index:1; pointer-events:none;
    animation:twinkle var(--d,4s) ease-in-out var(--dl,0s) infinite alternate;
    transition:opacity 1.4s ease;
  }
  #scene.newmoon .star { opacity:.95 !important; animation-play-state:paused; }
  @keyframes twinkle { from { opacity:.55; } to { opacity:.95; } }

  #moon {
    position:absolute; top:8%; right:11%; z-index:1;
    width:clamp(64px, 10vw, 130px); height:clamp(64px, 10vw, 130px); border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #fffbf0 0%, #f4ead2 55%, #d9cfb4 100%);
    box-shadow:0 0 40px rgba(255,238,200,.75), 0 0 140px 30px rgba(255,232,185,.4);
    transition:opacity 1.4s ease, box-shadow 1.4s ease;
    overflow:hidden;
  }
  #scene.newmoon #moon { opacity:.06; box-shadow:none; }
  #moon .crater {
    position:absolute; border-radius:50%;
    background:rgba(190,178,148,.5);
    box-shadow:inset 1px 2px 3px rgba(160,148,118,.7);
  }
  #phasebtn {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:20;
    display:flex; align-items:center; gap:10px;
    background:rgba(10,14,30,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    color:#dfe6f5; border:1px solid rgba(190,200,235,.25); border-radius:999px;
    font-size:10.5px; letter-spacing:.28em; text-transform:uppercase;
    padding:10px 20px; cursor:pointer; font-family:inherit;
    transition:background .3s ease, border-color .3s ease;
  }
  #phasebtn:hover { background:rgba(18,24,46,.7); border-color:rgba(210,220,250,.5); }
  #phasedot { width:12px; height:12px; border-radius:50%; position:relative; flex:none;
    background:radial-gradient(circle at 38% 36%, #fff7e0, #e8dcb2 70%);
    box-shadow:0 0 8px rgba(255,238,200,.9);
  }
  #scene.newmoon #phasedot {
    background:#0d1526; box-shadow:inset 3px -1px 0 0 #dfe6f5, 0 0 0 1px rgba(190,200,235,.4);
  }
  #counter {
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:20;
    color:rgba(223,230,245,.55); font-size:10px; letter-spacing:.3em; text-transform:uppercase; pointer-events:none;
    transition:opacity .4s ease;
  }
  #caption {
    position:fixed; top:9%; left:50%; transform:translateX(-50%); z-index:20; text-align:center;
    opacity:0; pointer-events:none;
    font-family:'Iowan Old Style','Palatino','Palatino Linotype',Georgia,serif;
  }
  #caption .line1 { font-style:italic; font-size:clamp(17px,2.2vw,24px); color:#e3e9f7; text-shadow:0 1px 8px rgba(4,8,20,.8); }
  #caption .line2 {
    margin-top:9px; font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:rgba(200,212,240,.65);
    font-variant:small-caps;
  }
  .caption-in { animation:capfade 4s ease 1.2s forwards; }
  @keyframes capfade { to { opacity:1; } }

  #mist1, #mist2 { position:absolute; height:70px; width:60%; border-radius:50%; pointer-events:none; z-index:3; }
  #mist1 {
    left:0; bottom:26%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(150,170,210,.20), rgba(150,170,210,0) 75%);
    filter:blur(14px);
    animation:driftA 40s linear infinite alternate;
    transition:opacity 1.4s ease;
  }
  #mist2 {
    right:0; bottom:18%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(140,160,205,.22), rgba(140,160,205,0) 75%);
    filter:blur(14px);
    animation:driftB 55s linear infinite alternate;
    transition:opacity 1.4s ease;
  }
  #scene.newmoon #mist1, #scene.newmoon #mist2 { opacity:.4; }
  @keyframes driftA { from { transform:translateX(-6%); } to { transform:translateX(10%); } }
  @keyframes driftB { from { transform:translateX(8%); } to { transform:translateX(-8%); } }

  #hills, #grassFar, #grassMid, #grassNear { position:absolute; left:0; width:100%; }
  #hills { bottom:0; z-index:2; }
  #grassFar  { bottom:0; z-index:4; opacity:.55; filter:blur(1.1px); }
  #grassMid  { bottom:0; z-index:5; }
  #grassNear { bottom:0; z-index:6; }
  .blade {
    transform-box:fill-box; transform-origin:50% 100%;
    animation:sway var(--d,6s) ease-in-out var(--dl,0s) infinite alternate;
  }
  @keyframes sway { from { transform:rotate(-3.5deg) skewX(0.8deg); } to { transform:rotate(3.5deg) skewX(-0.8deg); } }

  #fireflies { position:absolute; inset:0; z-index:7; pointer-events:none; }

  @media (prefers-reduced-motion: reduce){
    .blade, #mist1, #mist2, .star { animation:none !important; }
  }
</style>
</head>
<body>
  <div id="scene">
    <div id="sky"></div>
    <div id="moonglow"></div>
    <svg id="hills" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2c4d"/><stop offset="1" stop-color="#101c36"/>
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0f1a31"/><stop offset="1" stop-color="#080f21"/>
        </linearGradient>
      </defs>
      <path d="M0 120 Q 140 60 300 105 T 620 95 T 1000 110 L1000 220 L0 220 Z" fill="url(#hillFar)"/>
      <path d="M0 165 Q 180 115 380 150 T 720 140 T 1000 160 L1000 220 L0 220 Z" fill="url(#hillNear)"/>
    </svg>
    <div id="mist1"></div>
    <div id="mist2"></div>
    <svg id="grassFar"  preserveAspectRatio="none"></svg>
    <svg id="grassMid"  preserveAspectRatio="none"></svg>
    <svg id="grassNear" preserveAspectRatio="none"></svg>
    <canvas id="fireflies"></canvas>
  </div>

  <div id="caption">
    <div class="line1">The field remembers every small light.</div>
    <div class="line2">a night meadow · late june</div>
  </div>
  <div id="counter"></div>
  <button id="phasebtn"><span id="phasedot"></span><span id="phaselabel">New moon</span></button>

<script>
(function(){
"use strict";
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var scene = document.getElementById("scene");
var W = window.innerWidth, H = window.innerHeight;

/* ---------- seeded LCG ---------- */
function lcg(seed){
  var s = seed >>> 0;
  return function(){
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

/* ---------- stars ---------- */
var starLayer = document.getElementById("sky");
(function makeStars(){
  var rnd = lcg(20260601);
  var cols = ["#ffffff", "#cfd8ff", "#ffe9c4"];
  for (var i = 0; i < 15; i++){
    var st = document.createElement("div");
    st.className = "star";
    var size = 1.4 + rnd() * 2.4;
    st.style.width = size + "px";
    st.style.height = size + "px";
    st.style.left = (rnd() * 100) + "%";
    st.style.top = (rnd() * 52) + "%";
    var c = cols[Math.floor(rnd() * 3)];
    st.style.background = "radial-gradient(circle, " + c + " 0%, " + c + " 40%, transparent 70%)";
    st.style.setProperty("--d", (3 + rnd() * 5).toFixed(2) + "s");
    st.style.setProperty("--dl", (-rnd() * 6).toFixed(2) + "s");
    st.style.opacity = 0.75;
    starLayer.appendChild(st);
  }
})();

/* ---------- moon craters ---------- */
(function craters(){
  var moon = document.getElementById("moon");
  var rnd = lcg(777);
  for (var i = 0; i < 6; i++){
    var cr = document.createElement("div");
    cr.className = "crater";
    var d = 6 + rnd() * 12;
    cr.style.width = d + "%"; cr.style.height = d + "%";
    cr.style.left = (12 + rnd() * 66) + "%";
    cr.style.top = (12 + rnd() * 60) + "%";
    moon.appendChild(cr);
  }
})();

/* ---------- grass ---------- */
function buildGrass(svgId, count, color, baseFrac, hMin, hMax, durMin, durMax, seed){
  var svg = document.getElementById(svgId);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.style.height = H + "px";
  var html = "";
  var rnd = lcg(seed);
  for (var i = 0; i < count; i++){
    var x = rnd() * W;
    var baseY = H * baseFrac + rnd() * H * 0.06;
    var h = H * (hMin + rnd() * (hMax - hMin));
    var lean = (rnd() - 0.5) * h * 0.5;
    var w = 1.6 + rnd() * 2.6;
    var tipX = x + lean;
    var ctrlX = x + lean * 0.25;
    var ctrlY = baseY - h * 0.55;
    html += '<path class="blade" d="M' + (x - w) + ' ' + baseY +
            ' Q' + (ctrlX - w * 0.4) + ' ' + ctrlY + ' ' + tipX + ' ' + (baseY - h) +
            ' Q' + (ctrlX + w * 0.4) + ' ' + ctrlY + ' ' + (x + w) + ' ' + baseY + ' Z" fill="' + color + '"';
    var d = durMin + rnd() * (durMax - durMin);
    if (!reduced){
      html += ' style="--d:' + d.toFixed(2) + 's;--dl:' + (-rnd() * d).toFixed(2) + 's"';
    } else {
      html += ' style="animation:none"';
    }
    html += "/>";
  }
  svg.innerHTML = html;
}
buildGrass("grassFar", 140, "#0b1530", 0.66, 0.055, 0.11, 6, 9, 11);
buildGrass("grassMid", 120, "#070f24", 0.78, 0.07, 0.14, 4.8, 7.5, 22);
buildGrass("grassNear", 90, "#03081a", 0.90, 0.09, 0.18, 4, 6.5, 33);

/* ---------- fireflies canvas ---------- */
var canvas = document.getElementById("fireflies");
var ctx = canvas.getContext("2d");
var DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
}
window.addEventListener("resize", function(){ resize(); buildAll(); });
resize();

var flies = [];
var ambientCount = 0;
function targetAmbient(){
  return Math.max(28, Math.min(90, Math.round(W * H / 16000)));
}
function meadowBand(){ return [H * 0.28, H * 0.90]; }
function makeFly(x, y, burst){
  var band = meadowBand();
  var ang = Math.random() * Math.PI * 2;
  return {
    x: x !== undefined ? x : Math.random() * W,
    y: y !== undefined ? y : band[0] + Math.random() * (band[1] - band[0]),
    vx: Math.cos(ang) * (burst ? 1.6 : 0.5),
    vy: Math.sin(ang) * (burst ? 1.6 : 0.5),
    heading: ang,
    hue: 78 + Math.random() * 12,
    r: 1.1 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
    rate: 0.5 + Math.random() * 0.8,
    life: burst ? 17 : Infinity,
    age: 0,
    burst: !!burst
  };
}
function buildAll(){
  var n = targetAmbient();
  flies = flies.filter(function(f){ return f.burst; });   // keep transient swarms
  ambientCount = 0;
  while (ambientCount < n){ flies.push(makeFly()); ambientCount++; }
}
buildAll();

/* ---------- pointer breeze ---------- */
var mouse = { x:-9999, y:-9999, active:false };
scene.addEventListener("pointermove", function(e){
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
scene.addEventListener("pointerleave", function(){ mouse.active = false; });

scene.addEventListener("pointerdown", function(e){
  if (e.target.closest("#phasebtn")) return;
  var n = 14 + Math.floor(Math.random() * 10);   // 14–23
  for (var i = 0; i < n; i++){
    flies.push(makeFly(e.clientX, e.clientY, true));
  }
});

/* ---------- simulation + render ---------- */
var lastT = performance.now();
var timeScale = reduced ? 0.25 : 1;
var counterEl = document.getElementById("counter");

function step(dt){
  var band = meadowBand();
  for (var i = flies.length - 1; i >= 0; i--){
    var f = flies[i];
    f.age += dt;
    if (f.life !== Infinity && f.age > f.life){ flies.splice(i, 1); continue; }
    // wander: heading random walk
    f.heading += (Math.random() - 0.5) * 0.6;
    // nudge back toward meadow band + horizontal bounds
    var cx = Math.cos(f.heading), cy = Math.sin(f.heading);
    if (f.y < band[0]) cy += 0.05 * (band[0] - f.y) / 40;
    if (f.y > band[1]) cy -= 0.05 * (f.y - band[1]) / 40;
    if (f.x < 20) cx += 0.04;
    if (f.x > W - 20) cx -= 0.04;
    f.heading = Math.atan2(cy, cx);
    f.vx += Math.cos(f.heading) * 0.045;
    f.vy += Math.sin(f.heading) * 0.045;
    // breeze: pushed away from pointer
    if (mouse.active){
      var dx = f.x - mouse.x, dy = f.y - mouse.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 150 && d > 0.01){
        var force = (1 - d / 150) * 0.5;
        f.vx += (dx / d) * force;
        f.vy += (dy / d) * force;
      }
    }
    f.vx *= 0.94; f.vy *= 0.94;
    f.x += f.vx * dt * 60;
    f.y += f.vy * dt * 60;
    f.phase += f.rate * dt * Math.PI * 2;
  }
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  var dimBoost = scene.classList.contains("newmoon") ? 1.15 : 1;
  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < flies.length; i++){
    var f = flies[i];
    var pulse = Math.sin(f.phase);
    var b = pulse * pulse;                    // squared sine: mostly dim, blooms briefly
    if (f.burst){
      var remain = 1 - f.age / f.life;
      b *= Math.min(1, remain * 3);
    }
    b *= dimBoost;
    if (b < 0.015) continue;
    var haloR = f.r * 10;
    var grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, haloR);
    grd.addColorStop(0, "hsla(" + f.hue.toFixed(0) + ",100%,72%," + (0.55 * b).toFixed(3) + ")");
    grd.addColorStop(0.35, "hsla(" + f.hue.toFixed(0) + ",100%,62%," + (0.22 * b).toFixed(3) + ")");
    grd.addColorStop(1, "hsla(" + f.hue.toFixed(0) + ",100%,55%,0)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(f.x, f.y, haloR, 0, 6.2832);
    ctx.fill();
    // bright core
    ctx.fillStyle = "rgba(238,255,190," + Math.min(1, b).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

function loop(now){
  var dt = Math.min(0.05, (now - lastT) / 1000) * timeScale;
  lastT = now;
  step(dt);
  draw();
  var live = flies.length;
  counterEl.textContent = live + " fireflies · click to release a swarm";
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- caption + moon phase ---------- */
document.getElementById("caption").classList.add("caption-in");
document.getElementById("phasebtn").addEventListener("click", function(){
  var on = scene.classList.toggle("newmoon");
  document.getElementById("phaselabel").textContent = on ? "Full moon" : "New moon";
});
})();
</script>
</body>
</html>
