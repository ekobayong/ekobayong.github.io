<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vector Horizon — Endless Wireframe Terrain Flight</title>
<style>
  :root{ --hud: #19f0ff; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#010409}
  body{font-family:ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;color:#e6f4f8}
  canvas#world{position:fixed;inset:0;display:block;touch-action:none}

  .panel{position:fixed;top:16px;left:16px;z-index:5;padding:12px 16px;
    background:rgba(4,8,14,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid color-mix(in srgb, var(--hud) 30%, transparent);border-radius:8px}
  .panel .lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
    font-size:10px;letter-spacing:.32em;color:var(--hud);opacity:.85;margin-bottom:8px}
  .panel table{border-collapse:collapse;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:13px}
  .panel td{padding:1px 8px 1px 0}
  .panel td:first-child{color:#8fb3bd;font-size:10px;letter-spacing:.14em}
  .panel td:last-child{color:var(--hud);text-shadow:0 0 8px var(--hud);
    font-variant-numeric:tabular-nums;text-align:right;min-width:64px}

  .segmented{position:fixed;z-index:5;display:flex;gap:4px;
    background:rgba(4,8,14,.55);backdrop-filter:blur(8px);padding:4px;border-radius:8px;
    border:1px solid color-mix(in srgb, var(--hud) 25%, transparent)}
  #paletteSeg{top:16px;right:16px}
  #modeSeg{top:60px;right:16px}
  .segmented button{background:transparent;border:0;color:#9fb9c2;cursor:pointer;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:10px;
    letter-spacing:.16em;padding:6px 10px;border-radius:5px;transition:.2s}
  .segmented button:hover{color:#fff}
  .segmented button.on{background:var(--hud);color:#04121a;font-weight:700;
    box-shadow:0 0 10px color-mix(in srgb, var(--hud) 60%, transparent)}

  .throttle-box{position:fixed;bottom:20px;right:20px;z-index:5;display:flex;flex-direction:column;
    align-items:center;gap:10px;background:rgba(4,8,14,.55);backdrop-filter:blur(8px);
    padding:12px;border-radius:10px;border:1px solid color-mix(in srgb, var(--hud) 25%, transparent)}
  #thrBar{width:14px;height:130px;border:1px solid #4a6a74;border-radius:7px;position:relative;overflow:hidden;background:rgba(0,0,0,.3)}
  #thrFill{position:absolute;bottom:0;left:0;right:0;background:var(--hud);
    box-shadow:0 0 12px var(--hud);border-radius:0 0 6px 6px;height:40%}
  .thr-lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:9px;letter-spacing:.24em;color:#8fb3bd}
  #adi{filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
  .adi-box{display:flex;flex-direction:column;align-items:center;gap:4px}

  #help{position:fixed;bottom:20px;left:20px;z-index:5;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
    font-size:10px;letter-spacing:.08em;color:#7d99a3;background:rgba(4,8,14,.45);
    padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.06)}

  #paused{position:fixed;inset:0;z-index:6;display:none;place-items:center;pointer-events:none;
    background:rgba(0,0,0,.35)}
  #paused.show{display:grid}
  #paused span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
    font-size:22px;letter-spacing:.6em;color:var(--hud);text-shadow:0 0 18px var(--hud)}
  @media(max-width:640px){ #help{display:none} #adi{width:84px;height:84px} }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div class="panel">
  <div class="lbl">TELEMETRY</div>
  <table>
    <tr><td>ALT</td><td id="rAlt">000</td></tr>
    <tr><td>SPD</td><td id="rSpd">000</td></tr>
    <tr><td>HDG</td><td id="rHdg">000</td></tr>
    <tr><td>DIST</td><td id="rDist">000</td></tr>
  </table>
</div>

<div class="segmented" id="paletteSeg" role="group" aria-label="Palette"></div>
<div class="segmented" id="modeSeg" role="group" aria-label="Shading">
  <button data-m="wire" class="on">WIREFRAME</button>
  <button data-m="solid">SOLID</button>
  <button data-m="pause">PAUSE</button>
</div>

<div class="throttle-box">
  <div class="adi-box">
    <svg id="adi" width="110" height="110" viewBox="0 0 110 110">
      <defs>
        <clipPath id="adiclip"><circle cx="55" cy="55" r="44"/></clipPath>
      </defs>
      <circle cx="55" cy="55" r="48" fill="#0a141a" stroke="#3a5a64" stroke-width="2"/>
      <g clip-path="url(#adiclip)">
        <g id="adiRot" transform-origin="55 55">
          <rect id="adiSky" x="-10" y="-40" width="130" height="95" fill="#1a5a8c"/>
          <rect id="adiGnd" x="-10" y="55" width="130" height="100" fill="#5a3a1a"/>
          <line x1="-10" y1="55" x2="120" y2="55" stroke="#f0f0e0" stroke-width="2"/>
        </g>
      </g>
      <g stroke="#ffe14a" stroke-width="3" stroke-linecap="round">
        <line x1="30" y1="55" x2="46" y2="55"/><line x1="64" y1="55" x2="80" y2="55"/>
        <line x1="52" y1="55" x2="58" y2="55"/>
      </g>
      <g id="adiTicks" stroke="#7d99a3" stroke-width="1.5">
        <line x1="55" y1="10" x2="55" y2="16" transform="rotate(-30 55 55)"/>
        <line x1="55" y1="10" x2="55" y2="18"/>
        <line x1="55" y1="10" x2="55" y2="16" transform="rotate(30 55 55)"/>
        <line x1="55" y1="10" x2="55" y2="16" transform="rotate(60 55 55)"/>
        <line x1="55" y1="10" x2="55" y2="16" transform="rotate(-60 55 55)"/>
      </g>
    </svg>
  </div>
  <div id="thrBar"><div id="thrFill"></div></div>
  <div class="thr-lbl">THR</div>
</div>

<div id="help">MOUSE steer · ↑/↓ or WHEEL throttle · ←/→ steer · SPACE pause</div>
<div id="paused"><span>— PAUSED —</span></div>

<script>
(function(){
'use strict';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* palettes */
var PALETTES = [
  { name:'TRON',     skyTop:'#010409', skyHor:'#052a36', line:[0x19,0xf0,0xff], glow:'#19f0ff', sun1:'#ffb347', sun2:'#ff3d81', star:'#7fd6e8' },
  { name:'SYNTH',    skyTop:'#0b0018', skyHor:'#4a0f6a', line:[0xff,0x2b,0xd6], glow:'#ff2bd6', sun1:'#ffe259', sun2:'#ff2bd6', star:'#e8b7f0' },
  { name:'AMBER',    skyTop:'#050300', skyHor:'#2a1600', line:[0xff,0xb0,0x00], glow:'#ffb000', sun1:'#fff1c4', sun2:'#ff8c00', star:'#ffd9a0' },
  { name:'BLUEPRINT',skyTop:'#062052', skyHor:'#12407f', line:[0xdb,0xe9,0xff], glow:'#dbe9ff', sun1:'#ffffff', sun2:'#4a8cff', star:'#cfe0ff' }
];
var palIdx = 0, pal = PALETTES[0];

var canvas = document.getElementById('world'), ctx = canvas.getContext('2d');
var W = 0, H = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  focal = Math.max(W, H) * 1.1;
  horizonY = H * 0.42;
  stars = makeStars();
}
window.addEventListener('resize', resize);

/* stars */
var stars = [];
function makeStars(){
  var a = [], n = 160;
  for (var i = 0; i < n; i++) a.push({
    x: Math.random(), y: Math.random() * 0.4,
    r: Math.random() * 1.2 + 0.3, ph: Math.random() * Math.PI * 2
  });
  return a;
}

/* value noise */
var perm = new Uint8Array(256);
(function(){
  for (var i = 0; i < 256; i++) perm[i] = i;
  for (var i = 255; i > 0; i--) {
    var j = (Math.random() * (i + 1)) | 0;
    var t = perm[i]; perm[i] = perm[j]; perm[j] = t;
  }
})();
function hash2(x, y){ return perm[(perm[x & 255] + y) & 255] / 255; }
function smoothstep(t){ return t * t * (3 - 2 * t); }
function vnoise(x, y){
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var u = smoothstep(xf), v = smoothstep(yf);
  var a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y){
  var s = 0, amp = 0.55, f = 1;
  for (var o = 0; o < 3; o++) { s += vnoise(x * f, y * f) * amp; f *= 2.1; amp *= 0.5; }
  return s;
}
function valley(cx){
  return Math.sin(cx * 0.35) * 40 + Math.sin(cx * 0.13 + 2.1) * 65;
}

/* terrain buffers */
var COLS = 64, ROWS = 48;
var heights = new Float32Array(COLS * ROWS);
var px = new Float32Array(COLS * ROWS), py = new Float32Array(COLS * ROWS);
var pz = new Float32Array(COLS * ROWS);
var rowDepth = new Float32Array(ROWS);
(function(){
  for (var r = 0; r < ROWS; r++) {
    var t = r / (ROWS - 1);
    rowDepth[r] = 6 + Math.pow(t, 1.6) * 420;
  }
})();

var focal = 900, horizonY = 300;
var far = 420;

/* state */
var heading = 0, bank = 0, targetBank = 0, steer = 0;
var throttle = 0.4, targetThrottle = 0.4;
var altitude = 30, camX = 0, camZ = 0;
var paused = false, solid = false, dist = 0;
var topSpeed = reduced ? 26 : 52;
var tPrev = performance.now();
var hudPrev = 0, frameNow = performance.now();

/* inputs */
var keys = {};
window.addEventListener('keydown', function(e){
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); setPause(!paused); }
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('mousemove', function(e){
  steer = (e.clientX / W - 0.5) * 2;
  if (!mouseSteering && Math.abs(steer) > 0.02) mouseSteering = true;
  if (e.pointerType !== 'touch') targetThrottle += 0; /* unchanged */
});
var mouseSteering = false;
var wheel = function(e){
  e.preventDefault();
  targetThrottle = clamp(targetThrottle + (e.deltaY < 0 ? 0.06 : -0.06), 0, 1);
};
window.addEventListener('wheel', wheel, { passive: false });

/* touch */
var touchLast = null;
canvas.addEventListener('touchstart', function(e){
  var t = e.touches[0];
  touchLast = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  var t = e.touches[0];
  if (touchLast) {
    steer = clamp(steer + (t.clientX - touchLast.x) * 0.006, -1.2, 1.2);
    targetThrottle = clamp(targetThrottle + (touchLast.y - t.clientY) * 0.004, 0, 1);
  }
  touchLast = { x: t.clientX, y: t.clientY };
}, { passive: false });
canvas.addEventListener('touchend', function(){ touchLast = null; }, { passive: true });

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }

function setPause(p){
  paused = p;
  document.getElementById('paused').classList.toggle('show', p);
  modeSegBtns.pause.classList.toggle('on', p);
}

/* segmented controls */
var palSeg = document.getElementById('paletteSeg');
var palBtns = [];
PALETTES.forEach(function(p, i){
  var b = document.createElement('button');
  b.textContent = p.name;
  if (i === 0) b.classList.add('on');
  b.addEventListener('click', function(){
    palIdx = i; pal = PALETTES[i];
    document.documentElement.style.setProperty('--hud', pal.glow);
    palBtns.forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
  });
  palSeg.appendChild(b); palBtns.push(b);
});
var modeSegBtns = {};
Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'), function(b){
  modeSegBtns[b.dataset.m] = b;
  b.addEventListener('click', function(){
    if (b.dataset.m === 'pause') { setPause(!paused); return; }
    solid = b.dataset.m === 'solid';
    modeSegBtns.wire.classList.toggle('on', !solid);
    modeSegBtns.solid.classList.toggle('on', solid);
    if (b.dataset.m !== 'pause') modeSegBtns.pause.classList.remove('on');
  });
});

/* simulation of camera */
function advance(dt){
  /* steering inputs: keys override */
  if (keys['ArrowLeft'] || keys['KeyA']) steer = clamp(steer - dt * 2.4, -1.2, 1.2);
  if (keys['ArrowRight'] || keys['KeyD']) steer = clamp(steer + dt * 2.4, -1.2, 1.2);
  if (keys['ArrowUp'] || keys['KeyW']) targetThrottle = clamp(targetThrottle + dt * 0.8, 0, 1);
  if (keys['ArrowDown'] || keys['KeyS']) targetThrottle = clamp(targetThrottle - dt * 0.8, 0, 1);

  if (reduced) steer *= 0.9; /* damp */
  bank = lerp(bank, steer * 0.5, 1 - Math.exp(-dt * 3.2));
  heading += steer * dt * (0.5 + throttle * 0.6) * 0.9;
  throttle = lerp(throttle, targetThrottle, 1 - Math.exp(-dt * 2.2));

  var speed = throttle * topSpeed;
  camZ += Math.cos(heading) * speed * dt;
  camX += Math.sin(heading) * speed * dt * 0.6;
  dist += speed * dt * 0.1; /* km-ish */

  /* altitude follows ground */
  var gh = groundAt(camX, camZ);
  var target = gh + 26 + throttle * 14;
  altitude = lerp(altitude, target, 1 - Math.exp(-dt * 1.4));
}
function groundAt(x, z){
  var cx = z * 0.02;
  var v = Math.abs(fbm(x * 0.02, z * 0.02) - 0.5) * 2;
  var vv = Math.exp(-Math.pow((x - valley(cx)) * 0.02, 2));
  return fbm(x * 0.02, z * 0.02) * 90 * (0.25 + (1 - vv)) + fbm(x * 0.005, z * 0.005) * 120 * (1 - vv * 0.8);
}

/* build heights */
function buildHeights(){
  for (var r = 0; r < ROWS; r++) {
    var z = rowDepth[r];
    for (var c = 0; c < COLS; c++) {
      var x = (c - COLS / 2) * 8;
      var wx = camX + x, wz = camZ + z;
      var cx = wz * 0.02;
      var vv = Math.exp(-Math.pow((wx - valley(cx)) * 0.02, 2));
      var h = groundAt(wx, wz) * (1 - vv * 0.85);
      heights[r * COLS + c] = h;
      pz[r * COLS + c] = z;
    }
  }
}
/* project */
var sway = 0;
function project(){
  var swayX = reduced ? 0 : Math.sin(sway) * 6;
  var swayY = reduced ? 0 : Math.sin(sway * 1.37) * 4;
  sway += 0.02;
  var alt = H * 0.42 + (altitude) * (focal / 400) * 0.55;
  for (var i = 0; i < COLS * ROWS; i++) {
    var z = pz[i];
    var x = (camX + (i % COLS - COLS / 2) * 8 - camX + swayX);
    x = ((i % COLS) - COLS / 2) * 8 + swayX;
    var sx = W / 2 + x * focal / z;
    var h = heights[i] - altitude;
    var sy = horizonY + (h + 26) * focal / z + swayY;
    py[i] = sy;
    px[i] = sx;
  }
  /* rotate in screen space around horizon */
  var cosb = Math.cos(bank), sinb = Math.sin(bank);
  for (var i = 0; i < COLS * ROWS; i++) {
    var dx = px[i] - W / 2, dy = py[i] - horizonY;
    px[i] = W / 2 + dx * cosb - dy * sinb;
    py[i] = horizonY + dx * sinb + dy * cosb;
  }
}

/* sky + sun + stars */
var sunR = 0, sunX = 0, sunY = 0;
function drawSky(t){
  var g = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  g.addColorStop(0, pal.skyTop);
  g.addColorStop(0.38, pal.skyHor);
  g.addColorStop(0.42, pal.skyHor);
  g.addColorStop(0.42, pal.skyTop);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + 2);

  /* stars */
  ctx.fillStyle = pal.star;
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.0016 + s.ph));
    ctx.globalAlpha = tw;
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  /* sun */
  sunR = Math.min(W, H) * 0.14;
  sunX = W * 0.5; sunY = horizonY - sunR * 0.35;
  var grad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
  grad.addColorStop(0, pal.sun1); grad.addColorStop(1, pal.sun2);
  ctx.save();
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.clip();
  /* glow rim */
  ctx.shadowColor = pal.sun2; ctx.shadowBlur = 40;
  ctx.fillStyle = grad;
  ctx.fillRect(sunX - sunR, sunY - sunR, sunR * 2, sunR * 2);
  ctx.shadowBlur = 0;
  /* slices */
  ctx.fillStyle = pal.skyHor;
  var slices = 7;
  for (var i = 0; i < slices; i++) {
    var yy = sunY - sunR * 0.2 + (i / slices) * sunR * 1.4;
    var th = (i / slices) * 7 + 1;
    ctx.fillRect(sunX - sunR, yy, sunR * 2, th);
  }
  ctx.restore();

  /* hazy horizon strip */
  var hz = ctx.createLinearGradient(0, horizonY - 30, 0, horizonY + 40);
  hz.addColorStop(0, 'rgba(0,0,0,0)');
  hz.addColorStop(0.5, pal.skyHor);
  hz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = hz;
  ctx.fillRect(0, horizonY - 30, W, 70);
  ctx.globalAlpha = 1;
}

/* terrain drawing */
function drawTerrain(){
  var lr = pal.line;
  var lineRGB = lr[0] + ',' + lr[1] + ',' + lr[2];

  /* fill strips for occlusion (wireframe) */
  if (!solid) {
    ctx.fillStyle = pal.skyHor;
    for (var r = 0; r < ROWS - 1; r++) {
      ctx.beginPath();
      var i0 = r * COLS;
      ctx.moveTo(px[i0], py[i0]);
      for (var c = 1; c < COLS; c++) ctx.lineTo(px[i0 + c], py[i0 + c]);
      for (var c = COLS - 1; c >= 0; c--) ctx.lineTo(px[i0 + COLS + c], py[i0 + COLS + c]);
      ctx.closePath();
      ctx.globalAlpha = 0.93;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* row lines far to near */
  for (var r = ROWS - 1; r >= 0; r--) {
    var fog = Math.pow(1 - (rowDepth[r] / far), 1.1);
    fog = Math.max(fog, 0);
    if (fog <= 0.02) continue;
    ctx.beginPath();
    var i0 = r * COLS;
    ctx.moveTo(px[i0], py[i0]);
    for (var c = 1; c < COLS; c++) ctx.lineTo(px[i0 + c], py[i0 + c]);
    if (solid) {
      /* quads filled with shaded line color */
      for (var c = 0; c < COLS - 1; c++) {
        var i = i0 + c, iN = i0 + COLS + c;
        var slope = Math.abs(heights[i + 1] - heights[i]) + Math.abs(heights[iN] - heights[i]);
        var light = clamp(0.35 + slope * 0.02 + heights[i] * 0.004, 0.12, 1);
        var f = fog * light;
        ctx.fillStyle = 'rgba(' + (lr[0] * f | 0) + ',' + (lr[1] * f | 0) + ',' + (lr[2] * f | 0) + ',1)';
        ctx.beginPath();
        ctx.moveTo(px[i], py[i]); ctx.lineTo(px[i + 1], py[i + 1]);
        ctx.lineTo(px[iN + 1], py[iN + 1]); ctx.lineTo(px[iN], py[iN]);
        ctx.closePath(); ctx.fill();
        if (fog > 0.35) {
          ctx.strokeStyle = 'rgba(' + lineRGB + ',' + (fog * 0.25) + ')';
          ctx.stroke();
        }
      }
    } else {
      ctx.strokeStyle = 'rgba(' + lineRGB + ',' + (fog * 0.85) + ')';
      ctx.lineWidth = fog * 2 + 0.4;
      ctx.stroke();
    }
  }

  if (!solid) {
    /* column lines with vertical gradient fade */
    for (var c = 0; c < COLS; c += 1) {
      var grad = ctx.createLinearGradient(0, horizonY, 0, H);
      grad.addColorStop(0, 'rgba(' + lineRGB + ',0)');
      grad.addColorStop(0.3, 'rgba(' + lineRGB + ',0.35)');
      grad.addColorStop(1, 'rgba(' + lineRGB + ',0.6)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      for (var r = 0; r < ROWS; r++) {
        var i = r * COLS + c;
        if (r === 0) ctx.moveTo(px[i], py[i]); else ctx.lineTo(px[i], py[i]);
      }
      ctx.stroke();
    }
    /* nearest glowing row */
    ctx.beginPath();
    for (var c = 0; c < COLS; c++) {
      var i = c;
      if (c === 0) ctx.moveTo(px[i], py[i]); else ctx.lineTo(px[i], py[i]);
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = pal.glow; ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

/* speed lines */
function drawSpeedLines(){
  if (throttle < 0.62) return;
  var a = (throttle - 0.62) / 0.38;
  var cx = W / 2, cy = horizonY;
  ctx.save();
  for (var i = 0; i < 26; i++) {
    var ang = (i / 26) * Math.PI * 2 + frameNow * 0.0001;
    var len = (40 + (i % 7) * 22) * a;
    var x0 = cx + Math.cos(ang) * 30, y0 = cy + Math.sin(ang) * 30;
    var x1 = cx + Math.cos(ang) * (30 + len), y1 = cy + Math.sin(ang) * (30 + len);
    ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.35) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
}

/* vignette + scanlines */
function drawPost(){
  var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (var y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}

/* HUD */
var rAlt = document.getElementById('rAlt'), rSpd = document.getElementById('rSpd'),
    rHdg = document.getElementById('rHdg'), rDist = document.getElementById('rDist'),
    thrFill = document.getElementById('thrFill'),
    adiRot = document.getElementById('adiRot');
function pad3(n){ n = Math.abs(Math.round(n)) % 1000; return (n < 10 ? '00' : n < 100 ? '0' : '') + n; }
function updateHUD(){
  rAlt.textContent = pad3(altitude);
  rSpd.textContent = pad3(throttle * topSpeed * 1.94);
  rHdg.textContent = pad3((heading * 57.3 + 360) % 360);
  rDist.textContent = (dist).toFixed(1);
  thrFill.style.height = (throttle * 100) + '%';
  var pitch = (throttle - 0.5) * 16;
  adiRot.setAttribute('transform', 'rotate(' + (-bank * 57.3) + ' 55 55) translate(0 ' + pitch + ')');
  adiSky.setAttribute('y', -40 + pitch);
  adiGnd.setAttribute('y', 55 + pitch);
}

/* main loop */
function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min((now - tPrev) / 1000, 0.05);
  tPrev = now;
  frameNow = now;
  if (!paused) advance(dt);
  buildHeights();
  project();
  ctx.clearRect(0, 0, W, H);
  drawSky(now);
  drawTerrain();
  if (!paused) drawSpeedLines();
  drawPost();
  if (now - hudPrev > 80) { hudPrev = now; updateHUD(); }
}

resize();
buildHeights();
updateHUD();
requestAnimationFrame(frame);
})();
</script>
</body>
