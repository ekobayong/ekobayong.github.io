<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardust — Cosmic Cursor Trail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #000;
    font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    color: #eee;
    cursor: none;
    touch-action: none;
  }
  canvas#art { position: fixed; inset: 0; display: block; }

  #ring {
    position: fixed; width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid #fff; pointer-events: none; z-index: 30;
    mix-blend-mode: difference;
    transform: translate(-50%, -50%);
    transition: width .3s, height .3s, border-style .3s;
  }
  #ring.vortex {
    width: 44px; height: 44px; border-style: dashed;
    animation: spin 1.6s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

  .title-block { position: fixed; top: 26px; left: 30px; z-index: 10; pointer-events: none; }
  .title-block h1 { font-family: Georgia, 'Iowan Old Style', Palatino, serif; font-weight: normal; font-size: 30px; letter-spacing: .04em; color: #f0f0f5; }
  .title-block .sub { font-size: 10px; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-top: 6px; }

  #hints {
    position: fixed; top: 26px; right: 30px; z-index: 10; text-align: right;
    font-size: 11px; line-height: 1.9; color: rgba(255,255,255,.55); pointer-events: none;
    transition: opacity 1.6s;
  }
  #hints kbd {
    font-family: 'Courier New', monospace; background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2); border-radius: 3px; padding: 0 5px; font-size: 10px;
  }

  .dock {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 4px;
    background: rgba(14,14,22,.72);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 7px 12px;
    max-width: 96vw; flex-wrap: wrap; justify-content: center;
  }
  .grp { display: flex; align-items: center; gap: 4px; padding: 0 8px; }
  .grp + .grp { border-left: 1px solid rgba(255,255,255,.12); }
  .dock-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 0; cursor: pointer;
    color: rgba(255,255,255,.75); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 7px 10px; border-radius: 999px; font-family: inherit;
    transition: background .2s, color .2s;
    white-space: nowrap;
  }
  .dock-btn .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dock-btn svg { display: block; }
  .dock-btn:hover { background: rgba(255,255,255,.08); }
  .dock-btn.sel { background: #e8e8f2; color: #14141c; }
  .dock-btn.sel .sw { outline: 1.5px solid #14141c; outline-offset: 1px; }
  .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.12); }
  @media (max-width: 640px) {
    #ring { display: none; }
    body { cursor: auto; }
    .dock-btn { font-size: 0; padding: 8px; gap: 0; }
    .dock-btn .sw, .dock-btn svg { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #ring { animation: none !important; }
  }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ring"></div>

<div class="title-block">
  <h1>Stardust</h1>
  <div class="sub">A cosmic cursor trail</div>
</div>

<div id="hints">
  Press &amp; hold to gather a vortex<br>
  Keys <kbd>1</kbd>–<kbd>4</kbd> brushes · <kbd>C</kbd> clear · <kbd>S</kbd> save
</div>

<div class="dock" id="dock">
  <div class="grp" id="brushGrp">
    <button class="dock-btn sel" data-brush="dust" data-key="1"><span class="sw" style="background:#9fd8ff"></span><span class="lab">Dust</span></button>
    <button class="dock-btn" data-brush="ribbons" data-key="2"><span class="sw" style="background:#ff9fe5"></span><span class="lab">Ribbons</span></button>
    <button class="dock-btn" data-brush="embers" data-key="3"><span class="sw" style="background:#ffb060"></span><span class="lab">Embers</span></button>
    <button class="dock-btn" data-brush="ink" data-key="4"><span class="sw" style="background:#e8e8f0"></span><span class="lab">Ink</span></button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="fadeGrp">
    <button class="dock-btn" data-fade="0.012" title="Slow fade">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 10 Q8 10 14 2"/><path d="M2 6 H10" opacity=".4"/></svg>
    </button>
    <button class="dock-btn sel" data-fade="0.045" title="Mid fade">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 10 Q8 10 14 2"/><path d="M2 6 H10"/></svg>
    </button>
    <button class="dock-btn" data-fade="0.14" title="Fast fade">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 10 Q8 10 14 2"/><path d="M2 6 H10"/><path d="M2 2 H10"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="dock-btn" id="clearBtn" title="Clear (C)">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 3.5 h9 M5 3.5 V2 h3 v1.5 M3.5 3.5 l.7 8 h4.6 l.7 -8"/></svg>
      <span class="lab">Clear</span>
    </button>
    <button class="dock-btn" id="saveBtn" title="Save PNG (S)">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.5 1 v8 M3.5 6.5 L6.5 9.5 L9.5 6.5 M1.5 11.5 h10"/></svg>
      <span class="lab">Save</span>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- canvas ---------- */
  var canvas = document.getElementById("art");
  var ctx = canvas.getContext("2d", { alpha: false });
  var W = 0, H = 0, DPR = 1;
  window.addEventListener("resize", function () {
    var old = document.createElement("canvas");
    old.width = canvas.width; old.height = canvas.height;
    old.getContext("2d").drawImage(canvas, 0, 0);
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    if (old.width) ctx.drawImage(old, 0, 0, old.width, old.height, 0, 0, W, H);
  });
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  /* ---------- state ---------- */
  var brush = "dust";
  var fadeSpeed = reduced ? Math.max(0.045, 0.08) : 0.045;
  var particles = [];
  var hue = 200, hueDrift = 14; /* deg/s */
  var pointer = { x: W / 2, y: H / 2, vx: 0, vy: 0, down: false, lastMove: performance.now() };
  var prev = null;
  var comet = { x: W / 2, y: H / 2, vx: 0, vy: 0, trail: [] };
  var holdStart = 0;
  var ghost = { active: false, t: 0 };
  var shockwaves = [];

  /* ---------- helpers ---------- */
  function rand(a, b) { return a + Math.random() * (b - a); }
  function brushHue() {
    if (brush === "embers") return rand(8, 42);
    if (brush === "ink") return 230;
    return hue + rand(-18, 18);
  }

  function spawn(x, y, vx, vy) {
    var p = {
      x: x, y: y, vx: vx, vy: vy,
      life: 0, maxLife: brush === "ink" ? rand(3, 6) : rand(1.2, 4),
      hue: brushHue(), sat: 95, light: brush === "ink" ? 80 : rand(60, 72),
      size: brush === "dust" ? rand(0.6, 2.2) : brush === "ink" ? rand(6, 22) : rand(1, 3),
      drag: brush === "embers" ? 0.985 : 0.96,
      wander: Math.random() * Math.PI * 2,
      wanderAmp: brush === "dust" ? rand(6, 20) : rand(2, 8),
      flicker: brush === "embers" ? Math.random() * Math.PI * 2 : -1,
      alpha: brush === "ink" ? 0.045 : rand(0.5, 0.95),
      prevX: x, prevY: y
    };
    if (brush === "embers") { p.vy -= rand(20, 70); p.alpha = rand(0.4, 0.9); }
    particles.push(p);
  }

  /* ---------- pointer ---------- */
  var ring = document.getElementById("ring");
  window.addEventListener("pointermove", function (e) {
    var nx = e.clientX, ny = e.clientY;
    var dx = nx - pointer.x, dy = ny - pointer.y;
    pointer.vx = dx; pointer.vy = dy;
    if (prev && !ghost.active) {
      var dist = Math.hypot(dx, dy);
      var steps = Math.min(40, Math.floor(dist / 3));
      for (var i = 1; i <= steps; i++) {
        var t = i / steps;
        var sx = prev.x + dx * t, sy = prev.y + dy * t;
        var kick = rand(6, 26);
        var a = Math.random() * Math.PI * 2;
        spawn(sx, sy, dx * 0.25 * rand(0.3, 1) + Math.cos(a) * kick, dy * 0.25 * rand(0.3, 1) + Math.sin(a) * kick);
      }
    }
    prev = { x: nx, y: ny };
    pointer.x = nx; pointer.y = ny;
    pointer.lastMove = performance.now();
    ghost.active = false;
    document.getElementById("hints").style.opacity = "0";
  });
  window.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".dock")) return;
    pointer.down = true;
    holdStart = performance.now();
    ring.classList.add("vortex");
    document.getElementById("hints").style.opacity = "0";
  });
  window.addEventListener("pointerup", function () {
    if (pointer.down) {
      pointer.down = false;
      ring.classList.remove("vortex");
      releaseVortex();
    }
  });

  function releaseVortex() {
    var held = Math.min(1.2, (performance.now() - holdStart) / 1000);
    if (held < 0.05) return;
    var power = 160 + held * 250;
    var burst = Math.round(rand(160, 420));
    for (var i = 0; i < burst; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rand(120, 480);
      spawn(pointer.x, pointer.y, Math.cos(a) * sp, Math.sin(a) * sp);
    }
    particles.forEach(function (p) {
      var dx = p.x - pointer.x, dy = p.y - pointer.y;
      var d = Math.hypot(dx, dy);
      if (d < 300 && d > 0.001) {
        var f = (1 - d / 300) * power * held;
        p.vx += dx / d * f; p.vy += dy / d * f;
      }
    });
    shockwaves.push({ x: pointer.x, y: pointer.y, r: 10, alpha: 0.8 });
  }

  /* ---------- ghost cursor ---------- */
  function ghostPos() {
    var t = ghost.t;
    var A = W * 0.32, B = H * 0.3;
    var x = W / 2 + A * Math.sin(3 * t + Math.PI / 2) + Math.sin(t * 0.7) * 30;
    var y = H / 2 + B * Math.sin(2 * t) + Math.cos(t * 0.5) * 24;
    return { x: x, y: y };
  }

  /* ---------- brushes draw ---------- */
  function drawParticle(p) {
    if (brush === "ink") ctx.globalCompositeOperation = "source-over";
    else ctx.globalCompositeOperation = "lighter";
    if (brush === "dust") {
      /* soft triple-radius halo */
      ctx.fillStyle = "hsla(" + p.hue + "," + p.sat + "%," + p.light + "%," + (p.alpha * 0.25 * lifeFrac(p)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "hsla(" + p.hue + "," + p.sat + "%," + p.light + "%," + (p.alpha * 0.5 * lifeFrac(p)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "hsla(" + p.hue + "," + p.sat + "%," + Math.min(96, p.light + 18) + "%," + (p.alpha * lifeFrac(p)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (brush === "ribbons") {
      ctx.strokeStyle = "hsla(" + p.hue + "," + p.sat + "%," + p.light + "%," + (p.alpha * lifeFrac(p)).toFixed(3) + ")";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(p.prevX, p.prevY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (brush === "embers") {
      var flick = 0.5 + 0.5 * Math.sin(p.flicker);
      ctx.fillStyle = "hsla(" + p.hue + ",100%," + (50 + flick * 20) + "%," + (p.alpha * flick * lifeFrac(p)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    } else { /* ink */
      ctx.fillStyle = "hsla(" + p.hue + ",6%," + p.light + "%," + (p.alpha * lifeFrac(p)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  function lifeFrac(p) { return Math.max(0, 1 - p.life / p.maxLife); }

  /* ---------- vortex ---------- */
  function vortexPull(dt) {
    if (!pointer.down) return;
    var held = Math.min(1.2, (performance.now() - holdStart) / 1000);
    var strength = held / 1.2;
    var nSeeds = held > 0.15 ? 3 : 0;
    for (var s = 0; s < nSeeds; s++) {
      var a = Math.random() * Math.PI * 2, r = rand(20, 120);
      spawn(pointer.x + Math.cos(a) * r, pointer.y + Math.sin(a) * r, 0, 0);
    }
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = pointer.x - p.x, dy = pointer.y - p.y;
      var d = Math.hypot(dx, dy);
      if (d < 260 && d > 1) {
        var pull = (1 - d / 260) * (140 + strength * 260) * dt;
        var tang = (1 - d / 260) * (120 + strength * 420) * dt;
        p.vx += dx / d * pull - dy / d * tang;
        p.vy += dy / d * pull + dx / d * tang;
      }
    }
  }

  /* ---------- comet ---------- */
  function updateComet(dt) {
    var tx, ty;
    if (ghost.active) { var g = ghostPos(); tx = g.x; ty = g.y; }
    else { tx = pointer.x; ty = pointer.y; }
    var k = 120, damp = 0.82;
    comet.vx = (comet.vx + (tx - comet.x) * k * dt) * damp;
    comet.vy = (comet.vy + (ty - comet.y) * k * dt) * damp;
    comet.x += comet.vx * dt * 60 * 0.06 + comet.vx * dt;
    comet.y += comet.vy * dt * 60 * 0.06 + comet.vy * dt;
    comet.trail.push({ x: comet.x, y: comet.y });
    if (comet.trail.length > 28) comet.trail.shift();
    var compHue = (hue + 180) % 360;
    for (var i = 1; i < comet.trail.length; i++) {
      var a = comet.trail[i - 1], b = comet.trail[i];
      var f = i / comet.trail.length;
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "hsla(" + compHue + ",90%,70%," + (0.06 + f * 0.5).toFixed(3) + ")";
      ctx.lineWidth = 0.5 + f * 2.4;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    if (comet.trail.length) {
      var head = comet.trail[comet.trail.length - 1];
      var g2 = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 18);
      g2.addColorStop(0, "rgba(255,255,255,.95)");
      g2.addColorStop(0.4, "hsla(" + compHue + ",90%,80%,.5)");
      g2.addColorStop(1, "hsla(" + compHue + ",90%,70%,0)");
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(head.x, head.y, 18, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------- frame ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.06);
    last = now;
    hue = (hue + hueDrift * dt) % 360;

    /* ghost takeover */
    if (!ghost.active && now - pointer.lastMove > 2600 && !pointer.down) {
      ghost.active = true; ghost.t = Math.random() * 100;
      prev = null;
    }
    if (ghost.active) {
      var dtg = dt * 0.9;
      ghost.t += dtg;
      var g = ghostPos();
      var ng = ghostPos();
      /* spawn along ghost movement */
      var dx = 0;
      var steps = Math.min(40, Math.floor(Math.abs(g.x - (comet.x)) / 3));
      for (var i = 1; i <= steps; i++) {
        var t = i / Math.max(1, steps);
        var a = Math.random() * Math.PI * 2, kick = rand(6, 26);
        spawn(comet.x + (g.x - comet.x) * t, comet.y + (g.y - comet.y) * t,
          Math.cos(a) * kick, Math.sin(a) * kick);
      }
      ring.style.left = g.x + "px"; ring.style.top = g.y + "px";
    } else {
      ring.style.left = pointer.x + "px"; ring.style.top = pointer.y + "px";
    }

    /* fade */
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(0,0,0," + fadeSpeed + ")";
    ctx.fillRect(0, 0, W, H);

    vortexPull(dt);

    /* particles */
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.prevX = p.x; p.prevY = p.y;
      p.life += dt;
      if (p.life > p.maxLife) { particles.splice(j, 1); continue; }
      if (brush === "dust" || brush === "ribbons") {
        p.wander += dt * 2;
        p.vx += Math.cos(p.wander) * p.wanderAmp * dt;
        p.vy += Math.sin(p.wander) * p.wanderAmp * dt;
      }
      if (brush === "embers") { p.flicker += dt * 12; p.vy -= 24 * dt; }
      var dragF = Math.pow(p.drag, dt * 60);
      p.vx *= dragF; p.vy *= dragF;
      p.x += p.vx * dt; p.y += p.vy * dt;
      drawParticle(p);
    }

    /* shockwaves */
    for (var s2 = shockwaves.length - 1; s2 >= 0; s2--) {
      var sw = shockwaves[s2];
      sw.r += 500 * dt; sw.alpha -= dt * 1.4;
      if (sw.alpha <= 0) { shockwaves.splice(s2, 1); continue; }
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(255,255,255," + sw.alpha.toFixed(3) + ")";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
    }

    updateComet(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- dock ---------- */
  var dock = document.getElementById("dock");
  dock.addEventListener("click", function (e) {
    var b = e.target.closest(".dock-btn");
    if (!b) return;
    if (b.dataset.brush) {
      brush = b.dataset.brush;
      document.querySelectorAll("#brushGrp .dock-btn").forEach(function (x) { x.classList.toggle("sel", x === b); });
    }
    if (b.dataset.fade) {
      fadeSpeed = parseFloat(b.dataset.fade);
      document.querySelectorAll("#fadeGrp .dock-btn").forEach(function (x) { x.classList.toggle("sel", x === b); });
    }
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    particles.length = 0;
  });
  document.getElementById("saveBtn").addEventListener("click", function () {
    var a = document.createElement("a");
    var d = new Date();
    a.download = "stardust-" + d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2) + "-" + ("0" + d.getHours()).slice(-2) + ("0" + d.getMinutes()).slice(-2) + ("0" + d.getSeconds()).slice(-2) + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
  document.addEventListener("keydown", function (e) {
    var brushes = { "1": "dust", "2": "ribbons", "3": "embers", "4": "ink" };
    if (brushes[e.key]) {
      document.querySelector('[data-brush="' + brushes[e.key] + '"]').click();
    }
    if (e.key === "c" || e.key === "C") document.getElementById("clearBtn").click();
    if (e.key === "s" || e.key === "S") document.getElementById("saveBtn").click();
  });

  /* idle ghost painting also spawns via comet pos — seed some initial dust */
  for (var i0 = 0; i0 < 60; i0++) spawn(W / 2 + rand(-100, 100), H / 2 + rand(-80, 80), rand(-20, 20), rand(-20, 20));
})();
</script>
</body>
</html>
