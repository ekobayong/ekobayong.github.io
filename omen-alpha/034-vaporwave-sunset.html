<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＬＵＮＡＲ ＷＩＮＤ — Vaporwave Sunset</title>
<style>
  :root{
    --pink:#ff71ce;
    --cyan:#01cdfe;
    --mint:#05ffa1;
    --violet:#b967ff;
    --yellow:#fffb96;
    --night:#12002a;
    --grid-speed:4s;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--night);
    font-family:system-ui, 'Segoe UI', sans-serif;
  }
  .scene-fixed{position:fixed;inset:0;overflow:hidden;}

  /* ---------- sky ---------- */
  .sky{
    position:absolute;inset:0;
    background:linear-gradient(180deg, #0a0020 0%, #2b0a5e 34%, #7a2a9e 58%, var(--pink) 64%, var(--pink) 66%, var(--night) 66.4%);
  }
  .haze{
    position:absolute;left:0;right:0;top:60%;height:12%;
    background:linear-gradient(180deg, transparent, rgba(255,113,206,.55) 50%, transparent);
    filter:blur(6px);
    pointer-events:none;
  }
  .star{
    position:absolute;border-radius:50%;
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.25;}to{opacity:1;}}

  /* ---------- sun ---------- */
  .sun-glow{
    position:absolute;left:50%;top:20%;
    width:min(46vmin,380px);height:min(46vmin,380px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow:0 0 80px 30px rgba(255,113,206,.55), 0 0 200px 80px rgba(255,251,150,.28);
    animation:drift 40s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .sun{
    position:absolute;left:50%;top:20%;
    width:min(46vmin,380px);height:min(46vmin,380px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:linear-gradient(180deg, #fffb96 0%, #ffb347 34%, #ff71ce 66%, #b967ff 100%);
    -webkit-mask-image:linear-gradient(180deg, #000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%, #000 67% 73.5%, transparent 73.5% 78.5%, #000 78.5% 83%, transparent 83% 89%, #000 89% 92%, transparent 92% 100%);
    mask-image:linear-gradient(180deg, #000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%, #000 67% 73.5%, transparent 73.5% 78.5%, #000 78.5% 83%, transparent 83% 89%, #000 89% 92%, transparent 92% 100%);
    animation:drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift{from{margin-top:0;}to{margin-top:4vh;}}

  /* ---------- floor ---------- */
  .scene{position:absolute;inset:0;perspective:520px;perspective-origin:50% 40%;overflow:hidden;}
  .floor{
    position:absolute;left:-100%;top:66%;
    width:300%;height:130%;
    transform-origin:top center;
    transform:rotateX(72deg);
    background:
      linear-gradient(90deg, transparent 49.8%, var(--cyan) 49.8% 50.2%, transparent 50.2%),
      repeating-linear-gradient(90deg, var(--cyan) 0 2px, transparent 2px 80px),
      repeating-linear-gradient(0deg, var(--pink) 0 2px, transparent 2px 80px),
      linear-gradient(180deg, #1b0340, #0a001f);
    animation:scroll var(--grid-speed) linear infinite;
  }
  @keyframes scroll{from{background-position:0 0, 0 0, 0 0;}to{background-position:0 0, 0 0, 0 80px;}}
  .floor-fade{
    position:absolute;left:0;right:0;top:66%;height:34%;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,113,206,.4), transparent 30%),
      linear-gradient(0deg, rgba(18,0,42,.9), transparent 60%);
  }
  .checker{
    position:absolute;left:50%;bottom:-6vmin;
    width:60vmin;height:60vmin;
    transform:translateX(-50%) rotateX(74deg);
    background:repeating-conic-gradient(var(--violet) 0 12%, transparent 12% 25%);
    border-radius:50%;
    -webkit-mask-image:radial-gradient(circle, #000 30%, transparent 72%);
    mask-image:radial-gradient(circle, #000 30%, transparent 72%);
    opacity:.5;
    animation:spin 40s linear infinite;
  }
  @keyframes spin{from{transform:translateX(-50%) rotateX(74deg) rotateZ(0);}to{transform:translateX(-50%) rotateX(74deg) rotateZ(360deg);}}

  /* ---------- palms ---------- */
  .palm{position:absolute;bottom:33%;width:22vw;transform-origin:bottom center;animation:sway 7s ease-in-out infinite alternate;pointer-events:none;}
  .palm.left{left:-2vw;}
  .palm.right{right:-2vw;transform:scaleX(-1);animation-delay:-3.5s;}
  @keyframes sway{from{rotate:-1.3deg;}to{rotate:1.3deg;}}

  /* ---------- title ---------- */
  .title{
    position:absolute;left:0;right:0;top:38%;text-align:center;
    font-family:Palatino, 'Iowan Old Style', Georgia, serif;
    font-weight:700;
    font-size:clamp(30px, 8.5vw, 132px);
    letter-spacing:.04em;line-height:1.1;
    color:transparent;
    background:linear-gradient(180deg, #ffffff 0%, var(--cyan) 44%, #063a55 49%, #ffffff 51%, var(--pink) 60%, var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-stroke:1px rgba(255,255,255,.35);
    filter:drop-shadow(4px 4px 0 rgba(185,103,255,.55)) drop-shadow(8px 8px 0 rgba(18,0,42,.8)) drop-shadow(0 0 22px var(--cyan));
    animation:shimmerGlow 6s ease-in-out infinite alternate;
  }
  @keyframes shimmerGlow{
    from{filter:drop-shadow(4px 4px 0 rgba(185,103,255,.55)) drop-shadow(8px 8px 0 rgba(18,0,42,.8)) drop-shadow(0 0 22px var(--cyan));}
    to{filter:drop-shadow(4px 4px 0 rgba(185,103,255,.55)) drop-shadow(8px 8px 0 rgba(18,0,42,.8)) drop-shadow(0 0 22px var(--pink));}
  }
  .subtitle{
    position:absolute;left:0;right:0;top:50%;text-align:center;
    font-family:ui-monospace, 'Courier New', monospace;
    color:var(--mint);font-size:clamp(12px, 1.6vw, 20px);
    letter-spacing:.5em;text-shadow:0 0 12px rgba(5,255,161,.8);
  }
  .caption{
    position:absolute;top:16px;right:18px;
    font-family:ui-monospace, 'Courier New', monospace;
    font-size:11px;letter-spacing:.28em;color:rgba(255,113,206,.85);
    text-align:right;line-height:1.9;
  }

  /* ---------- bust ---------- */
  .bust{
    position:absolute;right:14%;top:28%;
    width:min(17vw, 190px);
    filter:drop-shadow(0 0 26px rgba(185,103,255,.6));
    animation:float 9s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(-22px) rotate(-2deg);}
    50%{transform:translateY(22px) rotate(2deg);}
  }

  /* ---------- retro window ---------- */
  .win{
    position:absolute;left:18px;bottom:18px;
    width:320px;
    background:#c0c0c0;
    border:2px solid;border-color:#fff #404040 #404040 #fff;
    box-shadow:1px 1px 0 #000, 6px 6px 0 rgba(0,0,0,.35);
    font-family:system-ui, 'Segoe UI', sans-serif;
    color:#000;
    z-index:5;
  }
  .win-titlebar{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(90deg, #000080, #1084d0);
    color:#fff;padding:4px 6px;font-size:12px;font-weight:700;
  }
  .win-icon{width:14px;height:14px;border-radius:2px;background:linear-gradient(135deg, var(--pink), var(--cyan));flex:none;}
  .win-titlebar .grow{flex:1;}
  .win-btn{
    width:18px;height:16px;background:#c0c0c0;color:#000;
    border:2px solid;border-color:#fff #404040 #404040 #fff;
    font-size:10px;line-height:10px;text-align:center;cursor:default;
    font-family:system-ui,sans-serif;flex:none;
  }
  .win-menu{
    display:flex;gap:14px;padding:3px 8px;font-size:12px;border-bottom:1px solid #808080;
  }
  .win-menu span u{text-underline-offset:2px;}
  .win-body{padding:8px;}
  .lcd{
    background:#000;color:var(--mint);
    font-family:ui-monospace, 'Courier New', monospace;
    font-size:11px;line-height:1.8;padding:8px 10px;
    border:2px solid;border-color:#404040 #fff #fff #404040;
    margin-bottom:8px;
  }
  .lcd .lp{color:var(--pink);}
  .lcd #clock{float:right;}
  .progress{
    height:16px;background:#000;
    border:2px solid;border-color:#404040 #fff #fff #404040;
    margin-bottom:8px;position:relative;overflow:hidden;
  }
  .progress .bar{
    position:absolute;inset:1px auto 1px 1px;width:0%;
    background:repeating-linear-gradient(90deg, #000080 0 8px, #1084d0 8px 16px);
    transition:width .3s linear;
  }
  .win-actions{display:flex;gap:6px;margin-bottom:8px;}
  .win-actions button{
    flex:1;padding:5px 0;font-size:12px;cursor:pointer;
    background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;
    font-family:system-ui,sans-serif;
  }
  .win-actions button:active, .win-actions button.pressed{
    border-color:#404040 #fff #fff #404040;
  }
  .win-status{
    display:flex;gap:2px;font-size:11px;
  }
  .win-status span{
    flex:1;padding:2px 6px;background:#c0c0c0;
    border:2px solid;border-color:#808080 #fff #fff #808080;
  }

  /* vignette */
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(6,0,16,.55) 100%);}

  @media (max-width:720px){
    .caption{display:none;}
    .bust{width:12vw;right:6%;}
    .win{width:280px;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="scene-fixed">
  <div class="sky" id="sky">
    <div class="star" style="left:8%;top:6%;width:3px;height:3px;background:#fff;animation-delay:-.5s"></div>
    <div class="star" style="left:20%;top:14%;width:2px;height:2px;background:#fffb96;animation-delay:-1.2s"></div>
    <div class="star" style="left:34%;top:4%;width:2px;height:2px;background:#01cdfe;animation-delay:-2s"></div>
    <div class="star" style="left:47%;top:10%;width:2px;height:2px;background:#fff;animation-delay:-.2s"></div>
    <div class="star" style="left:60%;top:5%;width:3px;height:3px;background:#b967ff;animation-delay:-3s"></div>
    <div class="star" style="left:72%;top:12%;width:2px;height:2px;background:#fffb96;animation-delay:-1.8s"></div>
    <div class="star" style="left:85%;top:7%;width:2px;height:2px;background:#01cdfe;animation-delay:-2.6s"></div>
    <div class="star" style="left:92%;top:18%;width:2px;height:2px;background:#fff;animation-delay:-.9s"></div>
    <div class="star" style="left:14%;top:24%;width:2px;height:2px;background:#b967ff;animation-delay:-2.2s"></div>
    <div class="star" style="left:55%;top:20%;width:2px;height:2px;background:#fff;animation-delay:-3.4s"></div>
    <div class="haze"></div>
    <div class="sun-glow" id="sunGlow"></div>
    <div class="sun" id="sun"></div>
  </div>

  <div class="scene">
    <div class="floor"></div>
  </div>
  <div class="floor-fade"></div>
  <div class="checker"></div>

  <svg class="palm left" viewBox="0 0 220 300" aria-hidden="true">
    <g fill="#12002a" style="filter:drop-shadow(0 0 6px rgba(255,113,206,.35))">
      <path d="M120 300 C110 220 108 150 100 110 C96 90 88 78 74 70 L82 60 C100 70 112 86 118 108 C126 148 130 220 138 300 Z"/>
      <path d="M78 66 C60 44 36 36 10 42 C34 30 64 32 86 52 Z"/>
      <path d="M82 58 C78 32 62 12 36 4 C66 2 90 22 94 52 Z"/>
      <path d="M90 54 C94 28 112 10 140 6 C116 18 104 36 102 58 Z"/>
      <path d="M96 60 C108 42 134 34 162 40 C136 44 116 54 106 68 Z"/>
      <path d="M70 70 C50 64 30 68 14 80 C30 62 54 56 76 62 Z"/>
      <path d="M100 66 C110 56 132 54 152 62 C132 56 116 58 104 68 Z"/>
      <path d="M84 60 C70 48 46 44 24 50 C48 40 74 44 90 56 Z"/>
    </g>
  </svg>
  <svg class="palm right" viewBox="0 0 220 300" aria-hidden="true">
    <g fill="#12002a" style="filter:drop-shadow(0 0 6px rgba(255,113,206,.35))">
      <path d="M120 300 C110 220 108 150 100 110 C96 90 88 78 74 70 L82 60 C100 70 112 86 118 108 C126 148 130 220 138 300 Z"/>
      <path d="M78 66 C60 44 36 36 10 42 C34 30 64 32 86 52 Z"/>
      <path d="M82 58 C78 32 62 12 36 4 C66 2 90 22 94 52 Z"/>
      <path d="M90 54 C94 28 112 10 140 6 C116 18 104 36 102 58 Z"/>
      <path d="M96 60 C108 42 134 34 162 40 C136 44 116 54 106 68 Z"/>
      <path d="M70 70 C50 64 30 68 14 80 C30 62 54 56 76 62 Z"/>
      <path d="M100 66 C110 56 132 54 152 62 C132 56 116 58 104 68 Z"/>
      <path d="M84 60 C70 48 46 44 24 50 C48 40 74 44 90 56 Z"/>
    </g>
  </svg>

  <svg class="bust" id="bust" viewBox="0 0 120 200" aria-label="Classical marble bust">
    <defs>
      <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".5" stop-color="#d9ccf0"/>
        <stop offset="1" stop-color="#b967ff"/>
      </linearGradient>
    </defs>
    <g fill="url(#marble)">
      <rect x="30" y="168" width="60" height="14" rx="2"/>
      <rect x="36" y="154" width="48" height="16" rx="3"/>
      <path d="M38 156 C30 138 34 120 44 112 L76 112 C86 120 90 138 82 156 Z"/>
      <path d="M52 112 L52 84 C52 76 68 76 68 84 L68 112 Z"/>
      <ellipse cx="60" cy="62" rx="22" ry="28"/>
      <path d="M36 44 C38 24 82 24 84 44 C80 30 40 30 36 44 Z"/>
      <ellipse cx="37" cy="64" rx="4" ry="6"/>
      <ellipse cx="83" cy="64" rx="4" ry="6"/>
    </g>
    <g stroke="#7b3fd4" stroke-width="1.4" fill="none" opacity=".8">
      <path d="M48 56 Q54 52 58 55"/>
      <path d="M62 55 Q66 52 72 56"/>
      <path d="M60 60 L59 74 Q60 77 63 76"/>
      <path d="M54 84 Q60 87 66 84"/>
    </g>
  </svg>

  <h1 class="title" id="title">ＬＵＮＡＲ　ＷＩＮＤ</h1>
  <div class="subtitle">Ｓ Ｉ Ｄ Ｅ　Ｂ　·　１ ９ ９ ５</div>
  <div class="caption">ＭＥＭＯＲＩＥＳ<br>ＯＦ　ＴＯＭＯＲＲＯＷ</div>

  <div class="win" id="win" role="group" aria-label="Lunar Wind Player">
    <div class="win-titlebar">
      <span class="win-icon"></span>
      <span class="grow">Lunar Wind Player</span>
      <span class="win-btn">_</span><span class="win-btn">□</span><span class="win-btn">×</span>
    </div>
    <div class="win-menu"><span><u>F</u>ile</span><span><u>V</u>iew</span><span><u>O</u>ptions</span><span><u>H</u>elp</span></div>
    <div class="win-body">
      <div class="lcd">
        <span class="lp">NOW PLAYING</span> ＬＵＮＡＲ　ＷＩＮＤ<br>
        <span class="lp">SPEED</span> <span id="speedLabel">CRUISE</span> ×<span id="speedMult">1.0</span>
        <span id="clock">00:00:00</span>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="win-actions">
        <button id="btnPlay">▶ Play</button>
        <button id="btnSlow">◂◂ Slow</button>
        <button id="btnFast">▸▸ Fast</button>
      </div>
      <div class="win-status"><span id="statusCell">Stopped</span><span>48 kHz stereo</span></div>
    </div>
  </div>

  <div class="vignette"></div>
</div>

<script>
(function(){
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine = window.matchMedia("(hover:hover) and (pointer:fine)").matches;

  var SPEEDS = [
    {label:"DRIFT",  s:"12s",  mult:"0.3"},
    {label:"CRUISE", s:"4s",   mult:"1.0"},
    {label:"RUSH",   s:"1.4s", mult:"2.9"},
    {label:"HYPER",  s:"0.5s", mult:"8.0"}
  ];
  var speedIdx = 1, playing = false, elapsed = 0, lastTick = null;

  function applySpeed(){
    var sp = SPEEDS[speedIdx];
    document.documentElement.style.setProperty("--grid-speed", sp.s);
    document.getElementById("speedLabel").textContent = sp.label;
    document.getElementById("speedMult").textContent = sp.mult;
  }
  function setPlay(on){
    playing = on;
    var b = document.getElementById("btnPlay");
    b.classList.toggle("pressed", on);
    b.setAttribute("aria-pressed", on);
    b.textContent = on ? "❚❚ Pause" : "▶ Play";
    document.getElementById("statusCell").textContent = on ? "Playing" : "Stopped";
    if (on){ speedIdx = 2; } else { speedIdx = 1; } // RUSH while playing / CRUISE paused
    applySpeed();
    if (on) lastTick = performance.now();
  }
  document.getElementById("btnPlay").addEventListener("click", function(){ setPlay(!playing); });
  document.getElementById("btnSlow").addEventListener("click", function(){
    speedIdx = Math.max(0, speedIdx - 1); applySpeed();
  });
  document.getElementById("btnFast").addEventListener("click", function(){
    speedIdx = Math.min(3, speedIdx + 1); applySpeed();
  });

  function pad(n){ return (n<10?"0":"")+n; }
  function tick(now){
    if (playing && lastTick != null){
      elapsed += (now - lastTick)/1000;
      var h = Math.floor(elapsed/3600), m = Math.floor(elapsed/60)%60, s = Math.floor(elapsed)%60;
      document.getElementById("clock").textContent = pad(h)+":"+pad(m)+":"+pad(s);
      var pct = ((elapsed % 20) / 20 * 100);
      document.getElementById("bar").style.width = pct + "%";
    }
    lastTick = now;
    requestAnimationFrame(tick);
  }
  if (!reduced) requestAnimationFrame(tick);
  else {
    // static clock update once per second even in reduced motion
    setInterval(function(){
      if (playing){ elapsed++; document.getElementById("clock").textContent = pad(Math.floor(elapsed/3600))+":"+pad(Math.floor(elapsed/60)%60)+":"+pad(elapsed%60); }
    }, 1000);
  }

  /* mouse parallax */
  if (fine && !reduced){
    var title = document.getElementById("title");
    var bust = document.getElementById("bust");
    var sun = document.getElementById("sun");
    var glow = document.getElementById("sunGlow");
    var tx=0, ty=0, cx=0, cy=0;
    window.addEventListener("mousemove", function(e){
      tx = (e.clientX / window.innerWidth - 0.5) * 2;
      ty = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    (function pl(){
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
      title.style.marginLeft = (cx * 14) + "px";
      title.style.transform = "perspective(800px) rotateY(" + (cx * 4) + "deg)";
      bust.style.translate = (cx * -18) + "px " + (cy * -8) + "px";
      sun.style.marginLeft = (cx * -10) + "px";
      glow.style.marginLeft = (cx * -10) + "px";
      requestAnimationFrame(pl);
    })();
  }
})();
</script>
</body>
</html>
