<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope — Brass Eyepiece of Living Glass</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 60% 50% at 50% 45%, #241c14, #0e0c0a 80%);
    font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    color: #e9dcc4;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 12px 16px;
  }
  #noise { position: fixed; inset: 0; pointer-events: none; opacity: .12; mix-blend-mode: overlay; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; z-index: 1; }
  header h1 {
    font-family: Georgia, 'Iowan Old Style', Palatino, serif;
    font-weight: normal; font-size: clamp(20px, 3vw, 30px); letter-spacing: .06em; color: #e9dcc4;
  }
  header .meta { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: rgba(233,220,196,.5); }
  .lens-wrap {
    position: relative; width: min(88vw, 74vh); height: min(88vw, 74vh);
    border-radius: 50%; z-index: 1;
    box-shadow: 0 40px 110px rgba(0,0,0,.85), 0 10px 40px rgba(0,0,0,.6);
    flex: 1 1 auto; min-height: 0; max-height: 74vh; aspect-ratio: 1/1; height: auto;
  }
  .rim {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg,
      #f3d58a, #c99a3c 12%, #9c6a1e 30%, #5a3a0c 50%, #9c6a1e 70%, #c99a3c 88%, #f3d58a);
    animation: sheen 40s linear infinite;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.5), 0 0 0 1px #3a2708;
  }
  @keyframes sheen { to { transform: rotate(360deg); } }
  .rim::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(rgba(0,0,0,.35) 0deg .5deg, transparent .5deg 3deg);
    -webkit-mask: radial-gradient(circle, transparent 62%, black 64%, black 92%, transparent 94%);
    mask: radial-gradient(circle, transparent 62%, black 64%, black 92%, transparent 94%);
  }
  .rim::after {
    content: ""; position: absolute; inset: 6%; border-radius: 50%;
    background: conic-gradient(from 90deg,
      #b8863a, #6e4a12 25%, #c99a3c 50%, #6e4a12 75%, #b8863a);
    box-shadow: inset 0 0 24px rgba(0,0,0,.8), inset 0 2px 6px rgba(255,230,170,.35);
  }
  .lens {
    position: absolute; inset: 7%; border-radius: 50%; overflow: hidden;
    background: #07050d; cursor: crosshair;
  }
  #display { width: 100%; height: 100%; display: block; }
  .vignette {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background:
      radial-gradient(ellipse 40% 30% at 28% 22%, rgba(255,255,255,.16), transparent 70%),
      radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,.42) 84%, rgba(0,0,0,.72) 100%);
  }
  .glint {
    position: absolute; inset: 7%; border-radius: 50%; pointer-events: none; overflow: hidden;
  }
  .glint::before {
    content: ""; position: absolute; left: -60%; top: -20%; width: 46%; height: 140%;
    background: linear-gradient(100deg, transparent, rgba(255,250,230,.14), transparent);
    transform: rotate(18deg);
    animation: glint 9s ease-in-out infinite alternate;
  }
  @keyframes glint { from { left: -60%; } to { left: 110%; } }

  footer {
    margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
    z-index: 1;
  }
  .pill {
    display: inline-flex; border-radius: 999px; padding: 3px;
    background: linear-gradient(180deg, #8a6620, #5a3a0c);
    box-shadow: inset 0 1px 2px rgba(255,230,170,.35), 0 2px 6px rgba(0,0,0,.5);
  }
  .pill button, .pill label {
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(233,220,196,.8); background: transparent; border: 0;
    padding: 6px 13px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .pill button.sel { background: linear-gradient(180deg, #f3d58a, #c99a3c); color: #3a2708; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .pill .lab { color: rgba(233,220,196,.55); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 6px 6px 6px 12px; }
  #density { -webkit-appearance: none; appearance: none; width: 130px; height: 4px; border-radius: 2px;
    background: rgba(0,0,0,.5); cursor: pointer; margin: 0 10px; }
  #density::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f3d58a, #c99a3c 60%, #8a6620); border: 1px solid #3a2708; }
  #density::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #3a2708;
    background: radial-gradient(circle at 35% 30%, #f3d58a, #c99a3c 60%, #8a6620); }
  .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.5); cursor: pointer; padding: 0; }
  .swatch.sel { outline: 2px solid #f3d58a; outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) {
    .rim, .glint::before { animation: none !important; }
  }
</style>
</head>
<body>
<svg id="noise" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <filter id="fn"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/></filter>
  <rect width="400" height="400" filter="url(#fn)"/>
</svg>

<header>
  <h1>Kaleidoscope</h1>
  <span class="meta" id="meta">12 folds · 24 shards</span>
</header>

<div class="lens-wrap">
  <div class="rim"></div>
  <div class="lens" id="lens">
    <canvas id="display"></canvas>
    <div class="vignette"></div>
  </div>
  <div class="glint"></div>
</div>

<footer>
  <div class="pill" id="foldPill">
    <button data-folds="6">6</button>
    <button data-folds="8">8</button>
    <button data-folds="10">10</button>
    <button data-folds="12" class="sel">12</button>
  </div>
  <div class="pill" id="palPill"></div>
  <div class="pill">
    <span class="lab">Shard density</span>
    <input type="range" id="density" min="6" max="40" step="1" value="24">
  </div>
  <div class="pill"><button id="shakeBtn">Shake</button></div>
</footer>

<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var PALETTES = {
    jewel: { colors: ["#7b1fa2", "#c2185b", "#0288d1", "#00897b", "#f9a825", "#3949ab", "#e53935"], bg: "#07050d", comp: "screen" },
    pastel: { colors: ["#f8bbd0", "#b3e5fc", "#c8e6c9", "#fff59d", "#e1bee7", "#ffe0b2", "#b2dfdb"], bg: "#f7f1e6", comp: "multiply" },
    neon: { colors: ["#39ff14", "#ff073a", "#00f0ff", "#ff9d00", "#ff00e6", "#c6ff00", "#7a5cff"], bg: "#020206", comp: "lighter" },
    autumn: { colors: ["#8b2500", "#d2691e", "#daa520", "#556b2f", "#a0522d", "#cd5c5c", "#f4a460"], bg: "#1a0f08", comp: "source-over" }
  };
  var palName = "jewel";
  var folds = 12;
  var DENSITY = 24;

  /* ---------- source canvas ---------- */
  var lens = document.getElementById("lens");
  var display = document.getElementById("display");
  var dctx = display.getContext("2d");
  var source = document.createElement("canvas");
  var sctx = source.getContext("2d");
  var srcSize = 400;
  source.width = srcSize; source.height = srcSize;

  var shapes = [];
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function makeShape() {
    var P = PALETTES[palName];
    var a = pick(P.colors), b = pick(P.colors);
    var kind = Math.random() < 0.55 ? "blob" : "shard";
    var s = {
      kind: kind,
      x: Math.random() * srcSize, y: Math.random() * srcSize,
      vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.4,
      base: kind === "blob" ? 24 + Math.random() * 54 : 14 + Math.random() * 40,
      phase: Math.random() * Math.PI * 2,
      a: a, b: b,
      sides: 3 + Math.floor(Math.random() * 4),
      verts: null
    };
    if (kind === "shard") {
      s.verts = [];
      var n = s.sides;
      for (var i = 0; i < n; i++) {
        var ang = (i / n) * Math.PI * 2 + Math.random() * 0.4;
        var r = s.base * (0.7 + Math.random() * 0.5);
        s.verts.push([Math.cos(ang) * r, Math.sin(ang) * r]);
      }
    }
    return s;
  }
  function rebuild() {
    shapes = [];
    for (var i = 0; i < DENSITY; i++) shapes.push(makeShape());
    updateMeta();
  }
  function updateMeta() {
    document.getElementById("meta").textContent = folds + " folds · " + shapes.length + " shards";
  }

  function drawSource(t) {
    var P = PALETTES[palName];
    sctx.globalCompositeOperation = "source-over";
    sctx.fillStyle = P.bg;
    sctx.fillRect(0, 0, srcSize, srcSize);
    sctx.globalCompositeOperation = P.comp;
    var speed = reduced ? 0.3 : 1;
    shapes.forEach(function (s) {
      s.x += s.vx * speed / 60; s.y += s.vy * speed / 60;
      s.rot += s.vr / 60;
      if (s.x < -s.base) s.x = srcSize + s.base;
      if (s.x > srcSize + s.base) s.x = -s.base;
      if (s.y < -s.base) s.y = srcSize + s.base;
      if (s.y > srcSize + s.base) s.y = -s.base;
      var breathe = 1 + 0.08 * Math.sin(t * 1.2 + s.phase);
      var r = s.base * breathe;
      sctx.save();
      sctx.translate(s.x, s.y);
      sctx.rotate(s.rot);
      if (s.kind === "blob") {
        var g = sctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.05, 0, 0, r);
        g.addColorStop(0, s.a);
        g.addColorStop(0.55, s.b);
        g.addColorStop(1, "rgba(0,0,0,0)");
        sctx.fillStyle = g;
        sctx.beginPath(); sctx.arc(0, 0, r, 0, Math.PI * 2); sctx.fill();
      } else {
        var lg = sctx.createLinearGradient(-r, -r, r, r);
        lg.addColorStop(0, s.a);
        lg.addColorStop(1, s.b);
        sctx.fillStyle = lg;
        sctx.strokeStyle = "rgba(255,255,255,.22)";
        sctx.lineWidth = 1;
        sctx.beginPath();
        s.verts.forEach(function (v, i) {
          if (i === 0) sctx.moveTo(v[0] * breathe, v[1] * breathe);
          else sctx.lineTo(v[0] * breathe, v[1] * breathe);
        });
        sctx.closePath(); sctx.fill(); sctx.stroke();
      }
      sctx.restore();
    });
  }

  /* ---------- display ---------- */
  var dispSize = 300, DPR = 1;
  function sizeDisplay() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var d = lens.clientWidth;
    dispSize = d;
    display.width = d * DPR; display.height = d * DPR;
    source.width = source.height = Math.ceil(d * 1.5);
    srcSize = source.width;
  }
  new ResizeObserver(sizeDisplay).observe(lens);

  var autoRot = 0;
  var ox = 0, oy = 0, tox = 0, toy = 0;
  var lastT = performance.now();
  function render(now) {
    var dt = Math.min((now - lastT) / 1000, 0.06);
    lastT = now;
    var t = now / 1000;
    /* wandering target */
    var wanderX = Math.sin(t * 0.13) * 0.06 + Math.sin(t * 0.043) * 0.04;
    var wanderY = Math.cos(t * 0.11) * 0.06 + Math.cos(t * 0.051) * 0.04;
    var targetX = (pointerActive ? pointerNX : wanderX) * srcSize * 0.25;
    var targetY = (pointerActive ? pointerNY : wanderY) * srcSize * 0.25;
    var k = 1 - Math.exp(-6 * dt);
    ox += (targetX - ox) * k;
    oy += (targetY - oy) * k;

    drawSource(t);
    var d = display.width;
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.fillStyle = PALETTES[palName].bg;
    dctx.fillRect(0, 0, d, d);
    var cx = d / 2;
    var rot = autoRot + t * 0.06 * (reduced ? 0 : 1);
    dctx.translate(cx, cx);
    dctx.rotate(rot);
    dctx.translate(-cx, -cx);
    var a = Math.PI * 2 / folds;
    for (var i = 0; i < folds; i++) {
      dctx.save();
      dctx.beginPath();
      dctx.moveTo(cx, cx);
      dctx.arc(cx, cx, d, i * a - 0.002, (i + 1) * a + 0.004);
      dctx.closePath();
      dctx.clip();
      if (i % 2 === 0) {
        dctx.translate(cx, cx);
        dctx.rotate(i * a);
        dctx.translate(-ox, -oy);
        dctx.drawImage(source, -srcSize / 2, -srcSize / 2);
      } else {
        var c = (i + 1) * a / 2;
        dctx.translate(cx, cx);
        dctx.rotate(c);
        dctx.scale(1, -1);
        dctx.rotate(-c);
        dctx.translate(-ox, -oy);
        dctx.drawImage(source, -srcSize / 2, -srcSize / 2);
      }
      dctx.restore();
    }
    /* mirror facet lines */
    dctx.save();
    dctx.globalCompositeOperation = "overlay";
    dctx.strokeStyle = "rgba(255,255,255,.35)";
    dctx.lineWidth = 1;
    for (var f = 0; f < folds; f++) {
      var ang = f * a + rot;
      dctx.beginPath();
      dctx.moveTo(cx, cx);
      dctx.lineTo(cx + Math.cos(ang) * d, cx + Math.sin(ang) * d);
      dctx.stroke();
    }
    dctx.restore();
    /* slow whole-image rotation is folded into `rot` via wedge angles */
    requestAnimationFrame(render);
  }

  /* ---------- pointer ---------- */
  var pointerActive = false, pointerNX = 0, pointerNY = 0;
  lens.addEventListener("pointermove", function (e) {
    var r = lens.getBoundingClientRect();
    pointerNX = ((e.clientX - r.left) / r.width - 0.5) * 2;
    pointerNY = ((e.clientY - r.top) / r.height - 0.5) * 2;
    pointerActive = true;
  });
  lens.addEventListener("pointerleave", function () { pointerActive = false; });
  lens.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  lens.addEventListener("dblclick", shake);

  /* ---------- controls ---------- */
  var foldPill = document.getElementById("foldPill");
  foldPill.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    folds = +b.dataset.folds;
    foldPill.querySelectorAll("button").forEach(function (x) { x.classList.toggle("sel", x === b); });
    updateMeta();
  });
  var palPill = document.getElementById("palPill");
  Object.keys(PALETTES).forEach(function (name, i) {
    var b = document.createElement("button");
    b.className = "swatch" + (i === 0 ? " sel" : "");
    b.style.background = "linear-gradient(135deg," + PALETTES[name].colors[0] + "," + PALETTES[name].colors[2] + ")";
    b.title = name;
    b.addEventListener("click", function () {
      palName = name;
      palPill.querySelectorAll(".swatch").forEach(function (x) { x.classList.toggle("sel", x === b); });
    });
    palPill.appendChild(b);
  });
  document.getElementById("density").addEventListener("input", function (e) {
    var v = +e.target.value;
    while (shapes.length < v) shapes.push(makeShape());
    while (shapes.length > v) shapes.pop();
    updateMeta();
  });
  function shake() {
    rebuild();
    shapes.forEach(function (s) {
      s.vx *= 3; s.vy *= 3; s.vr *= 3;
    });
  }
  document.getElementById("shakeBtn").addEventListener("click", shake);

  rebuild();
  sizeDisplay();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
