<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahel Meridian — Desert Dunes at Golden Hour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --sky-a: #5d8fb5; --sky-b: #e8b86b; --sky-c: #f8dca4;
    --dune1: #f1d9a8; --dune2: #e4b982; --dune3: #d59b62;
    --dune4: #bd7a48; --dune5: #9a5a35; --dune6: #6e3b24;
    --sun: #fff6d2; --glow: rgba(255,240,200,.55);
    --sand-tint: #f1d9a8;
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Iowan Old Style', Palatino, Georgia, serif; }
  .scene { position: fixed; inset: 0; }
  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--sky-a), var(--sky-b) 62%, var(--sky-c));
  }
  .horizon-glow {
    position: absolute; left: 0; right: 0; bottom: 18%; height: 40%;
    background: radial-gradient(ellipse 80% 100% at 50% 100%, var(--glow), transparent 75%);
    filter: blur(18px);
  }
  #stars {
    position: absolute; inset: 0; opacity: var(--star-o, 0); transition: opacity 1s; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.2px 1.2px at 34% 8%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 55% 22%, rgba(255,255,255,.85), transparent),
      radial-gradient(1.4px 1.4px at 72% 12%, rgba(255,255,255,.75), transparent),
      radial-gradient(1px 1px at 88% 26%, rgba(255,255,255,.9), transparent),
      radial-gradient(.9px .9px at 20% 34%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.1px 1.1px at 64% 38%, rgba(255,255,255,.65), transparent),
      radial-gradient(1px 1px at 44% 30%, rgba(255,255,255,.8), transparent);
  }
  #sun {
    position: absolute; width: clamp(48px, 7vw, 110px); height: clamp(48px, 7vw, 110px);
    border-radius: 50%; left: 66%; top: 22%;
    background: radial-gradient(circle at 42% 40%, #fffef0, var(--sun) 65%, #ffe9a8);
    box-shadow: 0 0 clamp(40px, 8vw, 130px) clamp(24px, 5vw, 80px) var(--glow);
    transition: opacity .5s;
  }
  .haze-band {
    position: absolute; left: 0; right: 0; bottom: 34%; height: 10%;
    background: linear-gradient(180deg, transparent, var(--sky-b), transparent);
    filter: blur(14px); opacity: .7;
  }
  .dune { position: absolute; left: 50%; bottom: 0; width: 220vw; transform: translateX(-50%); }
  .dune path { transition: fill 1s linear; }
  #d6 { height: 30%; } #d5 { height: 36%; } #d4 { height: 43%; }
  #d3 { height: 52%; } #d2 { height: 62%; } #d1 { height: 76%; }
  .dune-svg { width: 100%; height: 100%; display: block; position: absolute; bottom: 0; }
  .layer {
    position: absolute; inset: 0; will-change: transform;
  }
  #caravan { position: absolute; left: -20vw; bottom: 30%; width: 16vw; opacity: .9; }
  #caravan .camel { animation: bob 1.4s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3%) rotate(-1.2deg); } }
  #sand { position: fixed; inset: 0; mix-blend-mode: screen; pointer-events: none; }
  .wind-readout {
    position: fixed; top: 20px; right: 24px; text-align: right;
    font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: .12em;
    color: rgba(255,248,225,.85); text-shadow: 0 1px 4px rgba(60,30,10,.6);
  }
  .title-block {
    position: fixed; top: 12%; left: 0; right: 0; text-align: center; pointer-events: none;
    color: #fdf4dd; text-shadow: 0 2px 14px rgba(90,40,10,.5);
  }
  .title-block h1 {
    font-weight: normal; font-size: clamp(26px, 5vw, 62px);
    letter-spacing: .34em; text-indent: .34em; text-transform: uppercase;
    transform: scaleX(1.12);
  }
  .title-rule {
    width: min(340px, 60vw); height: 1px; margin: 16px auto 12px;
    background: linear-gradient(90deg, transparent, rgba(255,240,210,.8), transparent);
  }
  .title-block .sub { font-style: italic; font-size: clamp(12px, 1.6vw, 17px); color: rgba(255,240,215,.9); }

  .panel {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center;
    padding: 12px 22px; border-radius: 16px;
    background: rgba(60,38,20,.42); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(250,235,200,.35);
    box-shadow: 0 12px 40px rgba(30,10,0,.45);
    max-width: min(92vw, 720px);
  }
  .panel .lab { font-size: 10px; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; color: rgba(255,240,210,.8); font-family: 'Segoe UI', system-ui, sans-serif; }
  #timeSlider {
    -webkit-appearance: none; appearance: none; width: min(300px, 44vw); height: 8px; border-radius: 4px; cursor: pointer;
    background: linear-gradient(90deg, #5d8fb5, #e8b86b 30%, #f8dca4 42%, #e3894e 55%, #b2496a 70%, #5a2f5a 82%, #121a3b 100%);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
  }
  #timeSlider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fffef0, #ffd97a 60%, #e8a13a);
    box-shadow: 0 0 10px rgba(255,220,140,.9), 0 2px 4px rgba(0,0,0,.4); border: none;
  }
  #timeSlider::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 38% 34%, #fffef0, #ffd97a 60%, #e8a13a);
    box-shadow: 0 0 10px rgba(255,220,140,.9);
  }
  #clock { font-family: 'Courier New', monospace; font-size: 16px; color: #fdf0d0; min-width: 56px; }
  .btn {
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: #fdf0d0; background: rgba(255,240,210,.14); border: 1px solid rgba(250,235,200,.4);
    border-radius: 8px; padding: 7px 16px; cursor: pointer;
  }
  .btn:hover { background: rgba(255,240,210,.24); }
  @media (prefers-reduced-motion: reduce) {
    #caravan .camel { animation: none !important; }
    .dune path { transition: none !important; }
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="layer" data-multi="8" id="skyLayer">
    <div class="sky"></div>
    <div id="stars"></div>
    <div id="sun"></div>
    <div class="haze-band"></div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="shimmer" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" result="n" seed="7">
          <animate attributeName="baseFrequency" values="0.012 0.05;0.014 0.055;0.012 0.05" dur="7s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="5;9;5" dur="4.5s" repeatCount="indefinite"/>
        </feDisplacementMap>
      </filter>
    </defs>
  </svg>

  <div class="layer" data-multi="14" id="farLayer" style="filter:url(#shimmer)">
    <div class="dune" id="d6" style="--fill: var(--dune6);">
      <svg class="dune-svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
        <path id="p6" d="M0 340 C 260 290, 420 330, 640 300 C 900 265, 1120 320, 1340 295 C 1470 280, 1550 300, 1600 310 L1600 600 L0 600 Z"/>
      </svg>
    </div>
  </div>
  <div class="layer" data-multi="22" id="far2Layer">
    <div class="dune" id="d5">
      <svg class="dune-svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
        <path id="p5" d="M0 300 C 200 250, 480 270, 700 235 C 940 200, 1180 250, 1380 225 C 1490 212, 1560 225, 1600 235 L1600 600 L0 600 Z"/>
      </svg>
    </div>
  </div>
  <div class="layer" data-multi="34" id="midLayer">
    <div class="dune" id="d4">
      <svg class="dune-svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
        <path id="p4" d="M0 300 C 240 230, 430 260, 660 215 C 920 168, 1140 230, 1360 200 C 1480 185, 1550 195, 1600 205 L1600 600 L0 600 Z"/>
      </svg>
    </div>
    <svg id="caravan" viewBox="0 0 300 90">
      <g class="camel" style="animation-delay:0s" transform="translate(10,20) scale(.9)">
        <ellipse cx="30" cy="22" rx="20" ry="10" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M14 16 Q20 2 30 14 Q40 2 46 16 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M46 18 Q56 8 58 0 L62 0 Q60 10 52 20 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <ellipse cx="59" cy="1" rx="4" ry="3" fill="var(--sand-tint, #f1d9a8)"/>
        <line x1="20" y1="30" x2="20" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="28" y1="30" x2="30" y2="50" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="38" y1="30" x2="38" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="44" y1="28" x2="50" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <path d="M28 12 Q26 0 32 0 Q36 4 32 12 Z" fill="var(--sand-tint, #f1d9a8)"/>
      </g>
      <g class="camel" style="animation-delay:.35s" transform="translate(95,26)">
        <ellipse cx="30" cy="22" rx="20" ry="10" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M14 16 Q20 2 30 14 Q40 2 46 16 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M46 18 Q56 8 58 0 L62 0 Q60 10 52 20 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <ellipse cx="59" cy="1" rx="4" ry="3" fill="var(--sand-tint, #f1d9a8)"/>
        <line x1="20" y1="30" x2="20" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="28" y1="30" x2="30" y2="50" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="38" y1="30" x2="38" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="44" y1="28" x2="50" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <path d="M30 12 Q26 -6 34 -8 Q42 -2 34 12 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <circle cx="34" cy="-11" r="5" fill="var(--sand-tint, #f1d9a8)"/>
      </g>
      <g class="camel" style="animation-delay:.7s" transform="translate(180,30) scale(.55)">
        <ellipse cx="30" cy="22" rx="20" ry="10" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M16 16 Q20 6 30 14 Q40 6 44 16 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M46 18 Q54 10 56 4 L60 4 Q58 12 52 20 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <ellipse cx="57" cy="5" rx="3.4" ry="2.6" fill="var(--sand-tint, #f1d9a8)"/>
        <line x1="22" y1="30" x2="22" y2="46" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="30" y1="30" x2="32" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="38" y1="30" x2="38" y2="46" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
      </g>
      <g class="camel" style="animation-delay:1.05s" transform="translate(225,24) scale(.92)">
        <ellipse cx="30" cy="22" rx="20" ry="10" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M14 16 Q20 2 30 14 Q40 2 46 16 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <path d="M46 18 Q56 8 58 0 L62 0 Q60 10 52 20 Z" fill="var(--sand-tint, #f1d9a8)"/>
        <ellipse cx="59" cy="1" rx="4" ry="3" fill="var(--sand-tint, #f1d9a8)"/>
        <line x1="20" y1="30" x2="20" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="28" y1="30" x2="30" y2="50" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="38" y1="30" x2="38" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
        <line x1="44" y1="28" x2="50" y2="48" stroke="var(--sand-tint, #f1d9a8)" stroke-width="3"/>
      </g>
    </svg>
  </div>
  <div class="layer" data-multi="48" id="nearLayer">
    <div class="dune" id="d3">
      <svg class="dune-svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
        <path id="p3" d="M0 320 C 220 250, 480 290, 720 235 C 980 180, 1200 250, 1400 220 C 1500 205, 1560 215, 1600 225 L1600 600 L0 600 Z"/>
      </svg>
    </div>
  </div>
  <div class="layer" data-multi="62" id="near2Layer">
    <div class="dune" id="d2">
      <svg class="dune-svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
        <path id="p2" d="M0 330 C 260 250, 520 300, 780 240 C 1040 185, 1240 260, 1440 225 L1600 240 L1600 600 L0 600 Z"/>
      </svg>
    </div>
  </div>
  <div class="layer" data-multi="80" id="nearestLayer">
    <div class="dune" id="d1">
      <svg class="dune-svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
        <path id="p1" d="M0 350 C 280 260, 560 320, 840 250 C 1100 190, 1320 280, 1600 235 L1600 600 L0 600 Z"/>
      </svg>
    </div>
  </div>

  <canvas id="sand"></canvas>

  <div class="title-block layer" data-multi="-12">
    <h1>Sahel Meridian</h1>
    <div class="title-rule"></div>
    <div class="sub">Where the ergs meet the evening — 16° 14′ N, 0° 02′ W</div>
  </div>

  <div class="wind-readout" id="windReadout">WIND ESE · 14 kn</div>

  <div class="panel">
    <span class="lab">Time of Day</span>
    <input type="range" id="timeSlider" min="0" max="60" step="0.01" value="0">
    <span id="clock">16:40</span>
    <button class="btn" id="pauseBtn">Pause cycle</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- cycle keyframes ---------- */
  var KEYS = [
    { p: 0,   sky: [93,143,181], mid: [232,184,107], hor: [248,220,164], sun: [255,246,210], glow: 0.55, stars: 0,
      dunes: [[241,217,168],[228,185,130],[213,155,98],[189,122,72],[154,90,53],[110,59,36]] },
    { p: 0.35, sky: [63,94,140], mid: [227,137,78], hor: [246,185,117], sun: [255,220,160], glow: 0.5, stars: 0,
      dunes: [[224,196,140],[208,166,112],[192,140,88],[168,110,62],[136,80,46],[96,52,30]] },
    { p: 0.62, sky: [38,48,90], mid: [178,73,106], hor: [239,138,90], sun: [255,190,120], glow: 0.4, stars: 0.35,
      dunes: [[180,140,120],[150,105,95],[124,82,80],[100,62,66],[80,46,52],[62,36,42]] },
    { p: 0.82, sky: [18,26,59], mid: [90,47,90], hor: [201,97,63], sun: [255,178,106], glow: 0.3, stars: 0.75,
      dunes: [[120,88,88],[94,66,72],[74,50,58],[58,40,48],[46,30,38],[36,22,28]] },
    { p: 1,   sky: [7,10,26], mid: [28,24,55], hor: [74,42,58], sun: [255,178,106], glow: 0.18, stars: 1,
      dunes: [[92,74,74],[70,54,58],[54,40,48],[42,30,38],[30,20,26],[18,12,16]] }
  ];
  var hex = function (c) { return "#" + c.map(function (n) { return ("0" + Math.round(n).toString(16)).slice(-2); }).join(""); };
  function smooth(t) { return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixc(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

  var root = document.documentElement;
  var sun = document.getElementById("sun");
  var stars = document.getElementById("stars");
  var clockEl = document.getElementById("clock");
  var pPaths = ["p1", "p2", "p3", "p4", "p5", "p6"].map(function (id) { return document.getElementById(id); });

  function applyProgress(p) {
    var i = 0;
    while (i < KEYS.length - 2 && p > KEYS[i + 1].p) i++;
    var a = KEYS[i], b = KEYS[i + 1];
    var t = smooth(Math.max(0, Math.min(1, (p - a.p) / (b.p - a.p))));
    root.style.setProperty("--sky-a", hex(mixc(a.sky, b.sky, t)));
    root.style.setProperty("--sky-b", hex(mixc(a.mid, b.mid, t)));
    root.style.setProperty("--sky-c", hex(mixc(a.hor, b.hor, t)));
    root.style.setProperty("--sun", hex(mixc(a.sun, b.sun, t)));
    root.style.setProperty("--glow", "rgba(255,220,160," + lerp(a.glow, b.glow, t).toFixed(2) + ")");
    root.style.setProperty("--star-o", lerp(a.stars, b.stars, t).toFixed(2));
    var tint;
    for (var d = 0; d < 6; d++) {
      var c = mixc(a.dunes[d], b.dunes[d], t);
      root.style.setProperty("--dune" + (6 - d), hex(c));
      pPaths[d].setAttribute("fill", hex(c));
      if (d === 0) tint = hex(c);
    }
    root.style.setProperty("--sand-tint", tint);
    /* sun path: (66%,22%) -> (42%,70%), fade before horizon */
    var sp = Math.min(1, p / 0.92);
    var sx = lerp(66, 42, sp), sy = lerp(22, 70, sp);
    sun.style.left = sx + "%"; sun.style.top = sy + "%";
    sun.style.opacity = sp > 0.97 ? 0 : 1;
    /* clock 16:40 -> 20:12 */
    var mins = 16 * 60 + 40 + (20 * 60 + 12 - (16 * 60 + 40)) * p;
    var h = Math.floor(mins / 60), m = Math.floor(mins % 60);
    clockEl.textContent = ("0" + h).slice(-2) + ":" + ("0" + m).slice(-2);
  }

  /* ---------- cycle / scrub ---------- */
  var slider = document.getElementById("timeSlider");
  var pauseBtn = document.getElementById("pauseBtn");
  var playing = !reduced;
  var progress = 0, CYCLE = 60;
  var lastT = performance.now();
  pauseBtn.textContent = reduced ? "Cycle paused" : "Pause cycle";

  function setPlaying(v) {
    playing = v;
    pauseBtn.textContent = playing ? "Pause cycle" : "Resume cycle";
  }
  pauseBtn.addEventListener("click", function () {
    if (sliderScratch) { sliderScratch = false; setPlaying(true); slider.value = 0; return; }
    setPlaying(!playing);
  });
  var sliderScratch = false;
  slider.addEventListener("input", function () {
    sliderScratch = true;
    setPlaying(false);
    progress = parseFloat(slider.value);
    applyProgress(progress);
  });

  /* ---------- parallax ---------- */
  var layers = Array.prototype.slice.call(document.querySelectorAll(".layer[data-multi]"));
  var px = 0, py = 0, tx = 0, ty = 0;
  document.addEventListener("mousemove", function (e) {
    tx = (e.clientX / window.innerWidth - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  window.addEventListener("deviceorientation", function (e) {
    if (e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma / 40));
    ty = Math.max(-1, Math.min(1, (e.beta - 45) / 40));
  });

  /* ---------- sand streaks ---------- */
  var sand = document.getElementById("sand");
  var sctx = sand.getContext("2d");
  var streaks = [], gust = 1, gustTarget = 1, gustT = 0;
  function sizeSand() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    sand.width = window.innerWidth * dpr;
    sand.height = window.innerHeight * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawnStreak(initial) {
    var dpr = 1;
    var y = Math.random() * window.innerHeight;
    var speed = (60 + Math.random() * 160) * (0.6 + gust * 0.6);
    streaks.push({
      x: initial ? Math.random() * window.innerWidth : -20,
      y: y, vx: speed, len: 10 + Math.random() * 40, life: 0,
      maxLife: 2 + Math.random() * 4, sway: Math.random() * Math.PI * 2,
      a: 0.05 + Math.random() * 0.16
    });
  }
  for (var i = 0; i < 260; i++) spawnStreak(true);

  var windEl = document.getElementById("windReadout");
  var windTimer = 0;
  function sandFrame(dt) {
    if (reduced) return;
    gustT += dt;
    if (gustT > 4) { gustT = 0; gustTarget = 0.5 + Math.random() * 1.6; }
    gust += (gustTarget - gust) * 0.02;
    windTimer += dt;
    if (windTimer > 2) {
      windTimer = 0;
      windEl.textContent = "WIND ESE · " + Math.round(10 + gust * 8) + " kn";
    }
    sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    sctx.globalCompositeOperation = "screen";
    var tint = getComputedStyle(root).getPropertyValue("--dune1").trim() || "#f1d9a8";
    var count = Math.min(streaks.length, Math.round(260 * (0.4 + gust * 0.5)));
    for (var i = 0; i < count; i++) {
      var s = streaks[i];
      s.life += dt;
      if (s.life > s.maxLife || s.x > window.innerWidth + 40) {
        streaks[i] = null;
        spawnStreak(false);
        continue;
      }
      var fadeIn = Math.min(1, s.life / 0.6);
      var fadeOut = Math.min(1, (s.maxLife - s.life) / 0.6);
      s.sway += dt * 2;
      s.x += s.vx * gust * dt;
      s.y += Math.sin(s.sway) * 12 * dt;
      sctx.strokeStyle = tint;
      sctx.globalAlpha = s.a * fadeIn * fadeOut;
      sctx.lineWidth = 1;
      sctx.beginPath();
      sctx.moveTo(s.x, s.y);
      sctx.lineTo(s.x - s.len * (0.6 + gust * 0.4), s.y - Math.sin(s.sway) * 4);
      sctx.stroke();
    }
    sctx.globalAlpha = 1;
  }

  /* ---------- main loop ---------- */
  var cPath = document.getElementById("caravan");
  var caravanX = -20;
  function loop(now) {
    var dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    if (playing && !sliderScratch) {
      progress += dt / CYCLE;
      if (progress >= 1) progress = 0;
      slider.value = progress.toFixed(2);
      applyProgress(progress);
    }
    if (!reduced) {
      px += (tx - px) * 0.06;
      py += (ty - py) * 0.06;
      layers.forEach(function (l) {
        var m = parseFloat(l.getAttribute("data-multi"));
        l.style.transform = "translate(" + (-px * m).toFixed(1) + "px," + (-py * m * 0.5).toFixed(1) + "px)";
      });
      caravanX += dt * (100 / 110);
      if (caravanX > 130) caravanX = -20;
      cPath.style.left = caravanX + "vw";
    }
    sandFrame(dt);
    requestAnimationFrame(loop);
  }
  if (reduced) { progress = 0; applyProgress(0); document.getElementById("farLayer").style.filter = "none"; }
  sizeSand();
  window.addEventListener("resize", sizeSand);
  applyProgress(progress);
  requestAnimationFrame(loop);
})();
</script>
