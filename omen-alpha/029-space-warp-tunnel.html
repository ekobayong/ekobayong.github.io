<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUMPGATE — Hyperspace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#000;color:#aee0ff;
  font-family:system-ui,ui-sans-serif,"Segoe UI",Roboto,sans-serif;
  user-select:none;
}
#space{position:fixed;inset:0;display:block}
/* letterbox + film texture */
.bar{position:fixed;left:0;right:0;height:6vh;background:#000;z-index:3;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 48%, rgba(0,0,0,.72) 100%);
}
.scanlines{
  position:fixed;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.7;
}
.flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:#fff;opacity:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}

/* ---------- HUD ---------- */
.hud{
  position:fixed;z-index:6;pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  color:#aee0ff;
  text-shadow:0 0 6px rgba(80,160,255,.75), 0 0 14px rgba(80,160,255,.3);
  font-size:11px;letter-spacing:.12em;line-height:1.9;
}
.hud .lbl{color:#5f9be0;opacity:.85}
.hud .val{color:#cfe9ff}
.corner{position:fixed}
#tl{top:calc(6vh + 18px);left:22px}
#tr{top:calc(6vh + 18px);right:22px;text-align:right}

#title{
  position:fixed;top:calc(6vh + 16px);left:0;right:0;text-align:center;z-index:6;pointer-events:none;
  font-weight:200;font-size:clamp(20px,3vw,34px);letter-spacing:.5em;color:#dff0ff;
  text-shadow:0 0 12px rgba(120,190,255,.6);text-indent:.5em;
}
#prompt{
  margin-top:6px;font-size:11px;letter-spacing:.3em;color:#7db4ef;text-transform:uppercase;
  transition:opacity 1s ease;
}
#prompt.gone{opacity:0}

#reticle{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;
  width:min(58vmin,460px);height:min(58vmin,460px);opacity:.5;
}
#reticle .r1{animation:spinA 14s linear infinite;transform-origin:center}
#reticle .r2{animation:spinB 22s linear infinite;transform-origin:center}
@keyframes spinA{to{transform:rotate(360deg)}}
@keyframes spinB{to{transform:rotate(-360deg)}}
#reticle .dot{animation:pulseDot 2.4s ease-in-out infinite;transform-origin:center}
@keyframes pulseDot{0%,100%{opacity:.4;r:2}50%{opacity:1;r:3.6}}

#bottom{
  position:fixed;left:0;right:0;bottom:calc(6vh + 16px);z-index:6;text-align:center;pointer-events:none;
}
#speed{
  font-weight:100;font-size:clamp(46px,7vw,84px);line-height:1;letter-spacing:.02em;color:#e8f4ff;
  font-family:system-ui,ui-sans-serif,sans-serif;
  text-shadow:0 0 18px rgba(110,190,255,.55);
  transition:text-shadow .3s;
}
#speed.maxglow{text-shadow:0 0 8px #fff, 0 0 30px rgba(190,225,255,.95), 0 0 60px rgba(120,190,255,.7)}
#speed .unit{font-size:.34em;color:#8fc2f5;letter-spacing:.2em;font-weight:200}
#bar{
  width:min(46vw,520px);height:4px;margin:12px auto 8px;border-radius:2px;
  background:rgba(120,170,230,.18);overflow:hidden;position:relative;
}
#barFill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,#3d8bff,#7fc4ff,#f4f8ff);
  box-shadow:0 0 12px rgba(120,190,255,.8);
}
#stage{font-size:11px;letter-spacing:.34em;color:#7db4ef;text-transform:uppercase}

@media (max-width:640px){
  #tl,#tr{font-size:9px}
  #tl{left:12px}#tr{right:12px}
  .hud{line-height:1.7}
}
@media (prefers-reduced-motion: reduce){
  #reticle .r1,#reticle .r2,#reticle .dot{animation:none}
  #prompt{transition:none}
}
</style>
</head>
<body>

<canvas id="space"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="bar top" aria-hidden="true"></div>
<div class="bar bot" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<svg id="reticle" viewBox="0 0 200 200" aria-hidden="true">
  <g class="r1" fill="none" stroke="#6fa8e8" stroke-width="1">
    <circle cx="100" cy="100" r="88" stroke-dasharray="14 10" opacity=".7"/>
    <path d="M100 4v10M100 186v10M4 100h10M186 100h10" stroke-width="1.4"/>
  </g>
  <g class="r2" fill="none" stroke="#8fc4ff" stroke-width="1">
    <circle cx="100" cy="100" r="66" stroke-dasharray="4 12" opacity=".8"/>
    <circle cx="100" cy="34" r="2" fill="#8fc4ff" stroke="none"/>
    <circle cx="100" cy="166" r="2" fill="#8fc4ff" stroke="none"/>
    <circle cx="34" cy="100" r="2" fill="#8fc4ff" stroke="none"/>
    <circle cx="166" cy="100" r="2" fill="#8fc4ff" stroke="none"/>
  </g>
  <circle class="dot" cx="100" cy="100" r="2.6" fill="#cfe9ff"/>
</svg>

<div id="title" class="mono">JUMPGATE
  <div id="prompt">hold anywhere — engage drive</div>
</div>

<div class="hud corner mono" id="tl">
  <span class="lbl">VECTOR</span> <span class="val" id="hVec">27.4°</span><br>
  <span class="lbl">GATE</span> <span class="val">JG-114 / KRAKEN</span><br>
  <span class="lbl">HULL</span> <span class="val" id="hHull">100.0%</span>
</div>
<div class="hud corner mono" id="tr">
  <span class="lbl">DRIVE</span> <span class="val" id="hDrive">IDLE</span><br>
  <span class="lbl">FPS</span> <span class="val" id="hFps">60</span> ·
  <span class="lbl">STARS</span> <span class="val" id="hStars">0</span><br>
  <span class="lbl">DIST</span> <span class="val" id="hDist">0.000 ly</span><br>
  <span class="lbl">T+</span> <span class="val" id="hTime">00:00</span><br>
  <span class="lbl">SHAKE</span> <span class="val" id="hShake">0.0 px</span>
</div>

<div id="bottom">
  <div id="speed">0.00<span class="unit"> c</span></div>
  <div id="bar"><div id="barFill"></div></div>
  <div id="stage" class="mono">sublight</div>
</div>

<script>
(function(){
"use strict";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1,CX=0,CY=0;
const FOCAL=420;

function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;CX=W/2;CY=H/2;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  seed();
}
addEventListener("resize",resize);

/* ---------- stars ---------- */
const ST_COLORS=[["#8a5cff",.12],["#3d8bff",.55],["#f4f8ff",1]];
let stars=[];
function seed(){
  stars.length=0;
  const n=Math.max(350,Math.min(1400,Math.round(W*H/2600)));
  const spread=Math.max(W,H)*1.1;
  for(let i=0;i<n;i++){
    const r=Math.random();
    const col = r<.12?"#8a5cff" : r<.67?"#3d8bff":"#f4f8ff";
    stars.push({
      x:(Math.random()*2-1)*spread,
      y:(Math.random()*2-1)*spread,
      z:200+Math.random()*2800,
      col
    });
  }
  document.getElementById("hStars").textContent=n;
}

/* ---------- state ---------- */
let speed=0, target=0, engaged=false, dist=0, startTime=null, shakeMag=0;
let flashAt=-1e9, wasAbove93=false, fpsSmooth=60;
const spEl=document.getElementById("speed"), barFill=document.getElementById("barFill"),
      stageEl=document.getElementById("stage"), hDrive=document.getElementById("hDrive"),
      hHull=document.getElementById("hHull"), hDist=document.getElementById("hDist"),
      hTime=document.getElementById("hTime"), hFps=document.getElementById("hFps"),
      hShake=document.getElementById("hShake"), flash=document.getElementById("flash"),
      prompt=document.getElementById("prompt");

function setEngaged(on){
  engaged=on;
  target=on?1:0;
  if (on && startTime===null){ startTime=performance.now(); prompt.classList.add("gone"); }
}
addEventListener("pointerdown",()=>setEngaged(true));
addEventListener("pointerup",()=>setEngaged(false));
addEventListener("pointercancel",()=>setEngaged(false));
addEventListener("blur",()=>setEngaged(false));
addEventListener("keydown",e=>{
  if (e.code==="Space"){ e.preventDefault(); setEngaged(true); }
});
addEventListener("keyup",e=>{ if (e.code==="Space") setEngaged(false); });

/* ---------- rings ---------- */
const RING_N=14, RING_GAP=235;
let ringSpin=new Array(RING_N).fill(0);
function ringZ(i){ let z=260+i*RING_GAP - distOffset; if (z<200) z+=RING_N*RING_GAP; return z; }
let distOffset=0;

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  fpsSmooth += (1/Math.max(dt,1e-4) - fpsSmooth)*.05;

  /* speed ease: faster ramp up than decay */
  const rate = target>speed ? .055 : .018;
  speed += (target-speed)*rate*(dt*60);
  speed=Math.min(1,Math.max(0,speed));
  dist += speed*speed*dt*0.0022;
  distOffset += (40 + speed*speed*2600)*dt*60*0.06;

  /* flash crossing 93% */
  if (!wasAbove93 && speed>=.93){ flashAt=now; }
  wasAbove93 = speed>=.93;
  const fl=Math.max(0,1-(now-flashAt)/320);
  flash.style.opacity=(fl*.85).toFixed(3);

  /* shake */
  shakeMag = speed>.75 ? (speed-.75)/.25*6 : 0;
  const shx = reduced?0:(Math.random()*2-1)*shakeMag;
  const shy = reduced?0:(Math.random()*2-1)*shakeMag;

  /* draw */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.translate(shx,shy);
  ctx.fillStyle=`rgba(0,0,0,${(0.5-speed*0.4).toFixed(3)})`;
  ctx.fillRect(-20,-20,W+40,H+40);

  ctx.globalCompositeOperation="lighter";

  /* core glow */
  const coreR=40+speed*speed*640;
  const coreA=0.12+speed*speed*0.85;
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,coreR);
  g.addColorStop(0,`rgba(235,245,255,${(coreA*.9).toFixed(3)})`);
  g.addColorStop(.4,`rgba(120,190,255,${(coreA*.4).toFixed(3)})`);
  g.addColorStop(1,"rgba(60,120,255,0)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(CX,CY,coreR,0,7);ctx.fill();

  /* rings */
  const step=(Math.PI*2)/8;
  for(let i=0;i<RING_N;i++){
    const z=ringZ(i);
    if (z>3600) continue;
    ringSpin[i]+= (0.002+speed*0.016)*(i%2?1:-1);
    const k=FOCAL/z;
    const R=900*k;
    if (R<6) continue;
    const a0=ringSpin[i];
    ctx.beginPath();
    for(let v=0;v<8;v++){
      const a=a0+v*step;
      const x=CX+Math.cos(a)*R, y=CY+Math.sin(a)*R;
      if(v===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.shadowColor="#3d8bff";ctx.shadowBlur=10;
    ctx.strokeStyle=`rgba(61,139,255,${Math.min(.55,.08+k*6).toFixed(3)})`;
    ctx.lineWidth=Math.min(2,.4+k*8);
    ctx.stroke();
    ctx.shadowBlur=0;
    /* violet struts on even rings */
    if (i%2===0){
      const z2=ringZ(i+1), k2=FOCAL/z2, R2=900*k2;
      ctx.strokeStyle="rgba(138,92,255,.14)";
      ctx.lineWidth=1;
      ctx.beginPath();
      for(let v=0;v<8;v+=2){
        const a=a0+v*step;
        ctx.moveTo(CX+Math.cos(a)*R, CY+Math.sin(a)*R);
        ctx.lineTo(CX+Math.cos(a+ringSpin[i+1]-a0)*R2, CY+Math.sin(a+ringSpin[i+1]-a0)*R2);
      }
      ctx.stroke();
    }
  }

  /* stars */
  const advance=(0.4+speed*speed*46)*dt*60;
  const sepBase=(speed-.75)/.25*6;
  for(const s of stars){
    s.z-=advance;
    if (s.z<200){ s.z+=2800; }
    const k=FOCAL/s.z;
    const x=CX+s.x*k, y=CY+s.y*k;
    if (x<-40||x>W+40||y<-40||y>H+40) continue;
    const tail=30+speed*speed*560;
    const k2=FOCAL/(s.z+tail);
    const tx=CX+s.x*k2, ty=CY+s.y*k2;
    const lw=Math.max(.6,Math.min(2.6,k*5));
    ctx.strokeStyle=s.col;
    ctx.lineWidth=lw;
    ctx.lineCap="round";
    ctx.globalAlpha=Math.min(.95,.25+k*4);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();
    /* chromatic split */
    if (speed>.75){
      const sep=sepBase*(.3+Math.min(1.2,k*8));
      ctx.globalAlpha*=.55;
      ctx.strokeStyle="rgba(255,70,70,.8)";
      ctx.beginPath();ctx.moveTo(x+sep,y);ctx.lineTo(tx+sep,ty);ctx.stroke();
      ctx.strokeStyle="rgba(90,130,255,.8)";
      ctx.beginPath();ctx.moveTo(x-sep,y);ctx.lineTo(tx-sep,ty);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";

  /* HUD */
  const c=speed*9.99;
  spEl.firstChild.nodeValue=c.toFixed(2);
  barFill.style.width=(speed*100).toFixed(1)+"%";
  const stage = speed<.25?"sublight":speed<.6?"warp entry":speed<.93?"hyperspace":"threshold";
  stageEl.textContent=stage;
  hDrive.textContent = speed<.03?"IDLE":speed>=.97?"MAX":(engaged&&target>speed)?"BURN":"COAST";
  hHull.textContent=(100-speed*.9).toFixed(1)+"%";
  hDist.textContent=dist.toFixed(3)+" ly";
  if (startTime){
    const t=Math.floor((now-startTime)/1000);
    hTime.textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  }
  hFps.textContent=Math.round(fpsSmooth);
  hShake.textContent=shakeMag.toFixed(1)+" px";
  spEl.classList.toggle("maxglow",speed>=.97);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
