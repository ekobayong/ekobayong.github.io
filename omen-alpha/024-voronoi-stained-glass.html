<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose of Cells — Voronoi Stained Glass</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:Georgia,'Palatino Linotype',Palatino,'Times New Roman',serif;
  color:#e7ddc8;
  background:#17140f;
  display:grid;
  grid-template-rows:auto 1fr auto;
}
header{
  padding:26px 30px 14px;
  text-align:center;
  position:relative;z-index:3;
}
header h1{
  font-weight:400;
  font-size:clamp(22px,3.4vw,38px);
  letter-spacing:.34em;text-transform:uppercase;
  color:#e7ddc8;
}
header h1 span{color:#d7b36a}
header p{
  margin-top:8px;font-style:italic;font-size:14px;color:#a99c86;
}
.scene{position:relative;overflow:hidden;z-index:1}
/* ---------- stone wall ---------- */
.wall{position:absolute;inset:0;
  background:
    radial-gradient(720px 820px at 50% 42%, rgba(224,176,102,.14), transparent 70%),
    repeating-linear-gradient(112deg, rgba(255,255,255,.016) 0 2px, transparent 2px 9px),
    linear-gradient(180deg,#3a3531 0%,#2b2724 55%,#1d1a18 100%);
}
.wall::before{ /* brick courses */
  content:"";position:absolute;inset:0;opacity:.85;
  background:
    repeating-linear-gradient(0deg, #17140f 0 3px, transparent 3px 92px),
    repeating-linear-gradient(0deg, transparent 0 92px, #17140f 92px 95px);
}
.wall::after{ /* staggered vertical joints + vignette */
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, transparent 0 214px, rgba(23,20,15,.9) 214px 217px, transparent 217px 430px) 0 0/430px 184px repeat-y,
    repeating-linear-gradient(90deg, transparent 0 214px, rgba(23,20,15,.9) 214px 217px, transparent 217px 430px) 215px 92px/430px 184px repeat-y,
    radial-gradient(140% 120% at 50% 40%, transparent 42%, rgba(6,5,4,.78) 100%);
  opacity:.55;
}
/* ---------- floor ---------- */
.floor{
  position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:2;
  background:
    linear-gradient(180deg, rgba(9,7,6,.0), rgba(9,7,6,.6) 30%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 2px, transparent 2px 54px),
    repeating-linear-gradient(90deg, transparent 0 96px, rgba(58,50,42,.35) 96px 98px),
    linear-gradient(180deg,#14110f,#0d0b0a);
  perspective:600px;
  overflow:hidden;
}
.floor::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(88deg, transparent 0 118px, rgba(120,105,90,.12) 118px 119px),
    repeating-linear-gradient(92deg, transparent 0 118px, rgba(120,105,90,.12) 118px 119px);
  transform:perspective(300px) rotateX(55deg);
  transform-origin:top center;
  opacity:.5;
}
#refl{
  position:absolute;top:0;height:130%;
  transform:rotateX(62deg) scaleY(-1);
  transform-origin:top center;
  filter:blur(22px) saturate(1.5);
  opacity:.55;mix-blend-mode:screen;
  pointer-events:none;
}
/* ---------- window ---------- */
#win{
  position:relative;z-index:2;
  display:block;margin:1vh auto 3vh;
  cursor:crosshair;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));
}
footer{
  position:relative;z-index:4;
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;
  padding:14px 20px 20px;
  background:linear-gradient(180deg, rgba(6,5,4,.0), rgba(6,5,4,.55));
}
.pbtn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:Georgia,Palatino,serif;font-variant:small-caps;letter-spacing:.12em;
  font-size:14px;color:#d8cdb8;
  background:rgba(30,26,22,.75);
  border:1px solid rgba(120,105,86,.5);border-radius:4px;
  padding:8px 14px;cursor:pointer;
  transition:border-color .25s, color .25s;
}
.pbtn:hover,.pbtn:focus-visible{border-color:#d7b36a;color:#f2e7cf;outline:none}
.pbtn .dots{display:inline-flex;gap:3px}
.pbtn .dots i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.4)}
.pbtn[aria-pressed="true"]{border-color:#d7b36a;color:#ffe9b8}
footer .sep{width:1px;height:22px;background:rgba(120,105,86,.4)}
footer .kbd{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.14em;color:#8d8271;
}
@media (prefers-reduced-motion: reduce){
  /* shimmer frozen via JS flag */
}
</style>
</head>
<body>

<header>
  <h1>Rose of <span>Cells</span></h1>
  <p>a gothic window grown from a Voronoi diagram — click the glass to add a pane, R to regrow it</p>
</header>

<div class="scene">
  <div class="wall" aria-hidden="true"></div>
  <canvas id="win"></canvas>
</div>

<div class="floor" aria-hidden="true"><canvas id="refl"></canvas></div>

<footer>
  <button class="pbtn" data-pal="0" aria-pressed="true"><span class="dots" data-dots="0"></span>Chartres</button>
  <button class="pbtn" data-pal="1" aria-pressed="false"><span class="dots" data-dots="1"></span>Autumn</button>
  <button class="pbtn" data-pal="2" aria-pressed="false"><span class="dots" data-dots="2"></span>Emerald</button>
  <span class="sep"></span>
  <button class="pbtn" id="regen">Regenerate</button>
  <span class="kbd">R — regrow</span>
</footer>

<script>
(function(){
"use strict";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(2, devicePixelRatio||1);
const winC = document.getElementById("win");
const ctx = winC.getContext("2d");
const refl = document.getElementById("refl");
const rctx = refl.getContext("2d");

/* ---------------- palettes ---------------- */
const PALETTES = [
  ["#1b2f8f","#233fa8","#1a4fb5","#2b64c8","#8f1626","#a91f30","#c0392b","#d8b25c","#e8d6a2","#4b2a7a","#f1f0e8","#1d6e6b"],
  ["#a33d13","#c25a1c","#d9931c","#e8b23a","#7a2a12","#6b6a1f","#8e8a2e","#4d2b1a","#e9c98a","#b3471a","#5b3a1e","#d97c2b"],
  ["#0b4a2a","#0f6b3c","#158a4a","#1e8f7a","#2ea78c","#116d5a","#3fbf9a","#0d3c3a","#0a2f26","#c9a44b","#e6d38a","#f0ead2"]
];
const SWATCH_PICK = [[0,3,7,4,1,9],[1,3,4,9,2,5],[4,2,5,10,1,6]];
let palIdx = 0;

/* dot swatches */
document.querySelectorAll("[data-dots]").forEach(el=>{
  el.innerHTML = SWATCH_PICK[+el.dataset.dots].map(i=>`<i style="background:${PALETTES[+el.dataset.dots][i]}"></i>`).join("");
});
document.querySelectorAll(".pbtn[data-pal]").forEach(b=>{
  b.addEventListener("click",()=>{
    palIdx = +b.dataset.pal;
    document.querySelectorAll(".pbtn[data-pal]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    colorCells();
    renderGlass();
  });
});
document.getElementById("regen").addEventListener("click",regrow);
addEventListener("keydown",e=>{
  if (e.key==="r"||e.key==="R") regrow();
});

/* ---------------- color helpers ---------------- */
function hex(c){const n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function mix(c1,c2,t){return `rgb(${Math.round(c1[0]+(c2[0]-c1[0])*t)},${Math.round(c1[1]+(c2[1]-c1[1])*t)},${Math.round(c1[2]+(c2[2]-c1[2])*t)})`;}
const WHITE=[255,255,255], BLACK=[12,10,8];

/* ---------------- geometry ---------------- */
let W=0,H=0,SY=0,R=0,apexY=0;
function inArch(x,y){
  if (x<0||x>W||y<0||y>H) return false;
  if (y>=SY) return true;
  const d1=Math.hypot(x-W,y-SY), d2=Math.hypot(x,y-SY);
  return d1<=R && d2<=R;
}
function archPath(c){
  const dy = Math.sqrt(Math.max(0, R*R - (W/2)*(W/2)));
  const a1 = Math.atan2(-dy,-W/2) + Math.PI*2;
  const a2 = Math.atan2(-dy, W/2);
  c.beginPath();
  c.moveTo(0,H);
  c.lineTo(0,SY);
  c.arc(W,SY,R,Math.PI,a1,false);
  c.arc(0,SY,R,a2,0,false);
  c.lineTo(0,H);
  c.closePath();
}

/* ---------------- sites / voronoi ---------------- */
let sites=[], cellPolys=[], cellCols=[], glass=null, gctx=null;
const seedRand = (function(){ let s=Date.now()%2147483647; return ()=>{ s=s*16807%2147483647; return (s-1)/2147483646; };})();

function bisectorClip(poly,a,b){ /* Sutherland–Hodgman: keep half-plane closer to a */
  const out=[];
  const ax=a[0]-b[0], ay=a[1]-b[1]; /* gradient of f = 2(a-b)·p + (b·b - a·a) */
  const bb=b[0]*b[0]+b[1]*b[1]-a[0]*a[0]-a[1]*a[1];
  const f=p=>2*(ax*p[0]+ay*p[1])+bb;
  for(let i=0;i<poly.length;i++){
    const P=poly[i], Q=poly[(i+1)%poly.length];
    const fp=f(P), fq=f(Q);
    if (fp<=0) out.push(P);
    if ((fp<0&&fq>0)||(fp>0&&fq<0)){
      const t=fp/(fp-fq);
      out.push([P[0]+(Q[0]-P[0])*t, P[1]+(Q[1]-P[1])*t]);
    }
  }
  return out;
}
function computeCells(){
  cellPolys=[]; cellCols=[];
  for (let i=0;i<sites.length;i++){
    let poly=[[ -W*.2,-H*.2],[W*1.2,-H*.2],[W*1.2,H*1.2],[-W*.2,H*1.2]];
    for (let j=0;j<sites.length;j++){
      if (i===j) continue;
      poly=bisectorClip(poly,sites[i],sites[j]);
      if (!poly.length) break;
    }
    cellPolys.push(poly);
    cellCols.push(i % PALETTES[palIdx].length);
  }
}
function centroid(poly){
  let x=0,y=0;
  poly.forEach(p=>{x+=p[0];y+=p[1];});
  return [x/poly.length, y/poly.length];
}

function makeSites(){
  const count=Math.max(26, Math.min(70, Math.round(W*H/5200)));
  const minD=Math.sqrt(W*H/count)*0.52;
  sites=[];
  let guard=0;
  while (sites.length<count && guard<count*400){
    guard++;
    const x=seedRand()*W, y=seedRand()*H;
    if (!inArch(x,y)) continue;
    let ok=true;
    for (const s of sites){ if (Math.hypot(s[0]-x,s[1]-y)<minD){ok=false;break;} }
    if (ok) sites.push([x,y]);
  }
  computeCells();
}

/* ---------------- rendering ---------------- */
function polyPath(c,poly){
  c.beginPath();
  c.moveTo(poly[0][0],poly[0][1]);
  for(let i=1;i<poly.length;i++) c.lineTo(poly[i][0],poly[i][1]);
  c.closePath();
}
function drawPane(c, poly, site, colorHex, alpha){
  const col=hex(colorHex);
  const cx=centroid(poly);
  const gx=site[0]-W*.08, gy=site[1]-H*.1;
  const ext=Math.max(30, Math.hypot(poly[0][0]-site[0],poly[0][1]-site[1]));
  c.save();
  archPath(c); c.clip();
  polyPath(c,poly); c.clip();
  const g=c.createRadialGradient(gx,gy,ext*.06,site[0],site[1],ext*1.25);
  g.addColorStop(0, mix(col,WHITE,.32));
  g.addColorStop(.5, `rgb(${col[0]},${col[1]},${col[2]})`);
  g.addColorStop(1, mix(col,BLACK,.55));
  c.globalAlpha=alpha;
  c.fillStyle=g;
  c.fill();
  /* diagonal glass grain */
  c.globalAlpha=alpha*.09;
  c.strokeStyle="#ffffff";
  c.lineWidth=1.4;
  for(let k=-3;k<=3;k++){
    c.beginPath();
    c.moveTo(gx-90+k*22, gy-90);
    c.lineTo(gx+70+k*22, gy+120);
    c.stroke();
  }
  c.globalAlpha=alpha;
  /* lead line */
  polyPath(c,poly);
  c.lineJoin="round"; c.lineCap="round";
  c.strokeStyle="#17130f"; c.lineWidth=6;
  c.stroke();
  c.strokeStyle="rgba(226,214,190,.32)"; c.lineWidth=1.2;
  c.stroke();
  c.restore();
}
function renderGlassTo(c){
  c.save();
  c.clearRect(0,0,W,H);
  archPath(c); c.clip();
  c.fillStyle="#0b0908"; c.fillRect(0,0,W,H);
  for (let i=0;i<sites.length;i++){
    drawPane(c, cellPolys[i], sites[i], PALETTES[palIdx][cellCols[i]], 1);
  }
  /* outer lead frame + pale reveal */
  archPath(c);
  c.lineJoin="round";
  c.strokeStyle="rgba(210,198,175,.4)"; c.lineWidth=11; c.stroke();
  c.strokeStyle="#17130f"; c.lineWidth=8; c.stroke();
  c.strokeStyle="rgba(210,198,175,.25)"; c.lineWidth=1.2; c.stroke();
  c.restore();
}
function renderGlass(){ renderGlassTo(gctx); }

function colorCells(){
  /* keep geometry; reassign palette colors deterministically */
  cellCols = cellPolys.map((_,i)=> i % PALETTES[palIdx].length);
}

/* ---------------- layout ---------------- */
function resize(){
  const scene=document.querySelector(".scene");
  const availW=scene.clientWidth*0.86, availH=scene.clientHeight-40;
  let h=Math.min(availH, availW*1.75);
  let w=h/1.75;
  if (w>640){ w=640; h=w*1.75; }
  W=Math.round(w); H=Math.round(h);
  SY=H*0.42;
  R=Math.sqrt((W/2)*(W/2)+(SY-H*0.02)*(SY-H*0.02));
  winC.width=W*DPR; winC.height=H*DPR;
  winC.style.width=W+"px"; winC.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  glass=document.createElement("canvas");
  glass.width=W*DPR; glass.height=H*DPR;
  gctx=glass.getContext("2d");
  gctx.setTransform(DPR,0,0,DPR,0,0);
  refl.style.width=W+"px";
  refl.style.left=`calc(50% - ${W/2}px)`;
  refl.width=Math.round(W*.6); refl.height=Math.round(H*.6);
  makeSites();
  renderGlass();
}
addEventListener("resize",()=>{ resize(); });

/* ---------------- animation ---------------- */
let grow=null;
function frame(now){
  const t=(now%9000)/9000;
  ctx.clearRect(0,0,W,H);
  /* composite glass */
  ctx.drawImage(glass,0,0,W,H);
  /* sweeping warm light sheet, clipped to arch */
  ctx.save();
  archPath(ctx); ctx.clip();
  const sweep = reduced ? 0.35 : t;
  const cx0=-W*.4 + sweep*(W*1.8);
  const grd=ctx.createLinearGradient(cx0-160,0,cx0+160,H*.6);
  grd.addColorStop(0,"rgba(255,250,235,0)");
  grd.addColorStop(.5,"rgba(255,250,235,.26)");
  grd.addColorStop(1,"rgba(255,250,235,0)");
  ctx.globalCompositeOperation="soft-light";
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="screen";
  ctx.globalAlpha=.12;
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.globalCompositeOperation="source-over";
  /* growth animation */
  if (grow){
    const p=Math.min(1,(now-grow.t0)/620);
    const e=1-Math.pow(1-p,3);
    ctx.drawImage(grow.snap,0,0,W,H);
    ctx.save();
    archPath(ctx); ctx.clip();
    ctx.translate(grow.c[0],grow.c[1]);
    ctx.scale(e,e);
    ctx.translate(-grow.c[0],-grow.c[1]);
    drawPane(ctx, grow.poly, grow.site, grow.color, 1);
    ctx.restore();
    if (p>=1){
      sites.push(grow.site);
      computeCells();
      renderGlass();
      grow=null;
    }
  }
  /* floor reflection */
  rctx.clearRect(0,0,refl.width,refl.height);
  const src= grow ? winC : glass;
  rctx.drawImage(src, 0, 0, src.width, src.height, 0, 0, refl.width, refl.height);
  requestAnimationFrame(frame);
}

/* ---------------- interactions ---------------- */
winC.addEventListener("pointerdown",e=>{
  if (grow) return;
  const r=winC.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  if (!inArch(x,y)) return;
  const snap=document.createElement("canvas");
  snap.width=glass.width; snap.height=glass.height;
  snap.getContext("2d").drawImage(glass,0,0);
  /* pane for the new site (against existing sites) */
  let poly=[[-W*.2,-H*.2],[W*1.2,-H*.2],[W*1.2,H*1.2],[-W*.2,H*1.2]];
  for (const s of sites){ poly=bisectorClip(poly,[x,y],s); if(!poly.length) break; }
  if (!poly.length) return;
  grow={ site:[x,y], poly, c:centroid(poly), snap, t0:performance.now(),
         color:PALETTES[palIdx][sites.length % PALETTES[palIdx].length] };
  if (reduced){
    sites.push(grow.site); computeCells(); renderGlass(); grow=null;
  }
});

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
