<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Major Arcana — Three-Card Tarot Spread</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;overflow-x:hidden}
body{
  font-family:"Iowan Old Style",Palatino,Georgia,serif;
  background:#4a0f1e;
  background-image:
    radial-gradient(120% 100% at 50% 0%,#5a1426 0%,#4a0f1e 55%,#2c0812 100%);
  color:#e8d9c8;position:relative;
}
body::before{ /* woven cloth */
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(45deg,rgba(255,220,180,.05) 0 1px,transparent 1px 5px,rgba(0,0,0,.16) 5px 6px,transparent 6px 10px),
    repeating-linear-gradient(-45deg,rgba(255,220,180,.05) 0 1px,transparent 1px 5px,rgba(0,0,0,.16) 5px 6px,transparent 6px 10px);
}
body::after{ /* vignette */
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(75% 70% at 50% 40%,transparent 40%,rgba(10,0,4,.72) 100%);
}
.candle{
  position:fixed;left:50%;top:-12%;width:60vmax;height:44vmax;transform:translateX(-50%);
  z-index:0;pointer-events:none;filter:blur(26px);
  background:radial-gradient(50% 50% at 50% 40%,rgba(255,200,120,.3),rgba(255,180,100,.12) 45%,transparent 75%);
  animation:flicker 3.2s ease-in-out infinite;
}
@keyframes flicker{
  0%,100%{transform:translateX(-50%) scale(1);opacity:.85}
  22%{transform:translateX(-50.3%) scale(1.03);opacity:1}
  47%{transform:translateX(-49.6%) scale(.97);opacity:.78}
  71%{transform:translateX(-50.2%) scale(1.02);opacity:.95}
}
main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px}
h1{
  font-size:clamp(20px,3.4vw,34px);font-weight:normal;font-variant:small-caps;
  color:#f3dc9a;letter-spacing:.22em;text-shadow:0 0 22px rgba(243,220,154,.35);
}
.sub{font-style:italic;color:#c9a58c;margin-top:8px;font-size:14.5px}
.rule{width:min(340px,70%);height:1px;margin:14px auto 0;
  background:linear-gradient(90deg,transparent,#f3dc9a88,#f3dc9a,transparent)}
.slots{display:flex;justify-content:center;gap:clamp(10px,3vw,42px);margin:22px 0 8px}
.slotcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(200px,29vw)}
.slot{
  width:clamp(84px,13vw,150px);aspect-ratio:1/1.66;border:1.5px dashed rgba(243,220,154,.45);
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-variant:small-caps;letter-spacing:.14em;font-size:clamp(10px,1.4vw,13px);color:#c9a58c;
  transition:border-color .4s;
}
.slot.full{border-style:solid;border-color:rgba(243,220,154,.2);color:transparent}
.slotlabel{font-variant:small-caps;letter-spacing:.2em;color:#c9a58c;font-size:clamp(11px,1.5vw,14px)}
.reading{
  min-height:76px;max-width:230px;text-align:center;font-size:12.5px;line-height:1.5;
  color:#d8c4ae;opacity:0;transform:translateY(8px);transition:opacity .7s,transform .7s;
  font-style:italic;
}
.reading.in{opacity:1;transform:none}
.reading .kw{font-style:italic;color:#c9a58c;display:block;margin-top:4px}
.reading .cname{font-style:normal;font-variant:small-caps;color:#f3dc9a;letter-spacing:.12em;display:block;margin-bottom:4px}
.controls{text-align:center;margin:6px 0 14px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button.ab{
  font-family:inherit;font-variant:small-caps;letter-spacing:.16em;font-size:14px;
  color:#f3dc9a;background:transparent;border:1px solid #f3dc9a66;border-radius:999px;
  padding:9px 26px;cursor:pointer;transition:background .3s,color .3s;
}
button.ab:hover{background:#f3dc9a18}
button.ab:disabled{opacity:.35;cursor:default}
#status{text-align:center;font-variant:small-caps;letter-spacing:.12em;color:#c9a58c;
  min-height:22px;font-size:14px;margin-bottom:8px}
.stage{position:relative;height:calc(clamp(84px,13vw,150px)*1.66 + 200px);min-height:280px}
.fcard{
  position:absolute;left:50%;top:46%;
  width:clamp(84px,13vw,150px);aspect-ratio:1/1.66;
  margin-left:calc(clamp(84px,13vw,150px)/-2);margin-top:calc(clamp(84px,13vw,150px)*-0.83);
  perspective:900px;cursor:pointer;outline:none;
  transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .5s,filter .5s;
}
@media (max-width:640px){.fcard{width:26vw;margin-left:-13vw;margin-top:calc(26vw*-.83)}}
.fcard .inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.35,0,.25,1);
}
.fcard.flipped .inner{transform:rotateY(180deg)}
.fcard.reversed .front{transform:rotate(180deg)}
.fcard .face{
  position:absolute;inset:0;border-radius:9px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
.fcard .back{background:radial-gradient(120% 120% at 50% 40%,#5a1426,#38091a)}
.fcard .back svg,.fcard .front svg{width:100%;height:100%;display:block}
.fcard .front{background:linear-gradient(160deg,#1b1424,#2a1d36);transform:rotateY(180deg)}
.fcard .front .meta{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:10% 6%;
}
.fcard .front .num{
  font-variant:small-caps;letter-spacing:.2em;color:#d9b45b;font-size:clamp(10px,1.4vw,14px);
}
.fcard .front .nm{
  font-variant:small-caps;letter-spacing:.1em;color:#e8d9c8;text-align:center;
  font-size:clamp(8.5px,1.2vw,12px);
}
.fcard .front .sym{width:58%;flex:1;margin:4% 0}
.fcard .front .sym svg{width:100%;height:100%}
.fcard.hover, .fcard:focus-visible{z-index:20}
.fcard .foil{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.5) 46%,rgba(255,250,220,.85) 50%,rgba(255,240,190,.5) 54%,transparent 70%);
  background-size:300% 100%;background-position:120% 0;
}
.fcard.swept .foil{animation:sweep 1.2s ease .15s 1}
.fcard.hover .foil,.fcard:focus-visible .foil{animation:sweep 1.4s ease infinite alternate}
@keyframes sweep{from{background-position:130% 0;opacity:1}to{background-position:-40% 0;opacity:1}}
.dimmed{opacity:.28;filter:saturate(.5)}
footer{text-align:center;color:#a08066;font-variant:small-caps;letter-spacing:.18em;font-size:12px;padding-bottom:30px}
@media (prefers-reduced-motion: reduce){
  .candle{animation:none}
  .fcard{transition:none}
  .fcard .inner{transition:transform .2s}
  .fcard .foil{animation:none !important}
  .reading{transition:none}
}
</style>
</head>
<body>
<div class="candle" aria-hidden="true"></div>
<main>
  <header>
    <h1>The Major Arcana</h1>
    <p class="sub">three cards, drawn by candlelight from a twenty-two card deck</p>
    <div class="rule"></div>
  </header>
  <div class="slots">
    <div class="slotcol">
      <div class="slotlabel">Past</div>
      <div class="slot" id="slot0"></div>
      <div class="reading" id="read0"></div>
    </div>
    <div class="slotcol">
      <div class="slotlabel">Present</div>
      <div class="slot" id="slot1"></div>
      <div class="reading" id="read1"></div>
    </div>
    <div class="slotcol">
      <div class="slotlabel">Future</div>
      <div class="slot" id="slot2"></div>
      <div class="reading" id="read2"></div>
    </div>
  </div>
  <div id="status" role="status" aria-live="polite">Shuffle the deck to begin.</div>
  <div class="controls">
    <button class="ab" id="shuffleBtn">Shuffle</button>
    <button class="ab" id="drawBtn">Draw three</button>
    <button class="ab" id="gatherBtn">Gather the deck</button>
  </div>
  <div class="stage" id="stage"></div>
</main>
<footer>cut once · the deck knows what it keeps</footer>

var stage=document.getElementById("stage");
var statusEl=document.getElementById("status");
var slots=[0,1,2].map(function(i){return document.getElementById("slot"+i);});
var reads=[0,1,2].map(function(i){return document.getElementById("read"+i);});
var cards=[],order=[],placed=[null,null,null];

function buildDeck(){
  CARDS.forEach(function(c,i){
    var d=document.createElement("div");
    d.className="fcard";d.tabIndex=0;
    d.setAttribute("role","button");
    d.setAttribute("aria-label","Major Arcana card, face down");
    d.innerHTML='<div class="inner">'+
      '<div class="face back">'+BACK+'</div>'+
      '<div class="face front"><div class="meta">'+
      '<div class="num">'+c.num+'</div>'+
      '<div class="sym">'+c.sy+'</div>'+
      '<div class="nm">'+c.n+'</div>'+
      '</div><div class="foil"></div></div>'+
      '</div>';
    stage.appendChild(d);
    cards.push({el:d,data:c,idx:i,drawn:false,reversed:false});
  });
  order=cards.slice();
  restStack();
}
function say(t){statusEl.textContent=t;}

/* positions */
function restStack(){
  cards.forEach(function(c){
    c.el.classList.remove("flipped","hover","dimmed","swept");
    c.el.style.transform="translate(-2px,"+(c.idx*.6)+"px) rotate("+(Math.random()-.5)*2+"deg)";
    c.el.style.zIndex=30-c.idx;
    c.drawn=false;
  });
  placed=[null,null,null];
  reads.forEach(function(r){r.classList.remove("in");r.innerHTML="";});
  slots.forEach(function(s){s.classList.remove("full");s.textContent="";});
  order=cards.slice();
  say("The deck is stacked.");
}
function fan(){
  var n=cards.length;
  var stageW=stage.clientWidth;
  var cw=cards[0].el.offsetWidth;
  var spread=Math.min(Math.PI*0.9,(n-1)*0.085, (stageW-cw)/ (n*2) );
  var total=Math.min(1.6,(stageW-cw)/ (cards[0].el.offsetHeight) / 2);
  var maxAngle=Math.min(1.5,(stageW-cw)/(2*2.6*cards[0].el.offsetHeight));
  var i;
  var ang=maxAngle;
  order.forEach(function(c,i){
    var t=(i-(n-1)/2)/((n-1)/2||1);
    var theta=t*ang;
    c.el.style.transformOrigin="50% "+(cards[0].el.offsetHeight*3.6)+"px";
    c.el.style.zIndex=i+2;
    c.el.style.transform="rotate("+theta+"rad)";
    c.el.setAttribute("aria-label","face-down arcana card, position "+(i+1)+" of "+n);
  });
  say("Twenty-two cards fanned. Hover to lift, press Enter or click to draw one.");
}
function shuffle(){
  var d=cards.slice();
  for(var i=d.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));var t=d[i];d[i]=d[j];d[j]=t;
  }
  order=d;
  restStack();
  setTimeout(function(){
    fan();
    var steps=reduce?0:6;
    var k=0;
    var iv=setInterval(function(){
      k++;
      var dd=cards.slice();
      for(var m=dd.length-1;m>0;m--){var jj=Math.floor(Math.random()*(m+1));var tt=dd[m];dd[m]=dd[jj];dd[jj]=tt;}
      order=dd;
      fan();
      if(k>=steps){clearInterval(iv);fan();say("Shuffled and fanned — pick a card, or Draw three.");}
    },reduce?0:180);
  },300);
}

/* draw to slot */
function drawTo(c,slotIndex){
  if(c.drawn||placed[slotIndex])return false;
  var slot=slots[slotIndex];
  var sr=slot.getBoundingClientRect();
  var cr=c.el.getBoundingClientRect();
  var dx=(sr.left-cr.left);
  var dy=(sr.top-cr.top);
  c.drawn=true;
  placed[slotIndex]=c;
  c.el.style.zIndex=40+slotIndex;
  c.reversed=Math.random()<0.3;
  var rot=c.reversed?" rotate(180deg)":"";
  var base=c.el.style.transformOrigin;
  var delay=0;
  function flyAndFlip(){
    c.el.style.transform="translate("+dx+"px,"+dy+"px)"+rot;
    var flipAt=reduce?50:700;
    setTimeout(function(){
      c.el.classList.add("flipped");
      if(!reduce)setTimeout(function(){c.el.classList.add("swept");},400);
      c.el.setAttribute("aria-label",c.data.n+(c.reversed?", reversed":""));
      var r=reads[slotIndex];
      r.innerHTML='<span class="cname">'+c.data.n+(c.reversed?" — reversed":"")+'</span>'+
        (c.reversed?c.data.rv:c.data.up)+
        '<span class="kw">'+c.data.kw+'</span>';
      setTimeout(function(){r.classList.add("in");},150);
      if(placed.every(Boolean)){
        say("The spread is complete. The remaining cards sleep.");
        cards.forEach(function(o){if(!o.drawn)o.el.classList.add("dimmed");});
        document.getElementById("drawBtn").disabled=true;
      }else say(placed.filter(Boolean).length+" of three placed.");
    },flipAt);
  }
  if(reduce){flyAndFlip();}
  else setTimeout(flyAndFlip,50);
  return true;
}

/* draw three */
function drawThree(){
  var delay=0;
  for(var s=0;s<3;s++){
    (function(si){
      var avail=order.filter(function(c){return !c.drawn;});
      if(!avail.length||placed[si])return;
      var pick=avail[Math.floor(Math.random()*avail.length)];
      var d=reduce?0:delay;
      setTimeout(function(){drawTo(pick,si);},d);
      delay+=650;
    })(s);
  }
  document.getElementById("drawBtn").disabled=true;
}

/* interactions */
document.getElementById("shuffleBtn").addEventListener("click",function(){
  document.getElementById("drawBtn").disabled=false;
  cards.forEach(function(c){c.el.classList.remove("dimmed");});
  shuffle();
});
document.getElementById("drawBtn").addEventListener("click",drawThree);
document.getElementById("gatherBtn").addEventListener("click",function(){
  document.getElementById("drawBtn").disabled=false;
  cards.forEach(function(c){c.el.classList.remove("dimmed");});
  restStack();
  fan();
});
cards.forEach(function(c){
  c.el.addEventListener("click",function(){
    if(c.drawn)return;
    for(var s=0;s<3;s++){if(!placed[s]){drawTo(c,s);return;}}
  });
  c.el.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();c.el.click();}
  });
  c.el.addEventListener("pointerenter",function(){c.el.classList.add("hover");});
  c.el.addEventListener("pointerleave",function(){c.el.classList.remove("hover");});
});

buildDeck();
requestAnimationFrame(function(){fan();});
})();
</script>
</body>
</html>
