<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Flame — Candle Breathing Guide</title>
<style>
  :root{
    --glow:0.9; --breath:0.78; --bend:0;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,ui-serif,serif;
    --sans:system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
    --parchment:#e9d8c3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:#120a07;
    font-family:var(--serif);
    color:var(--parchment);
    user-select:none;
    -webkit-user-select:none;
  }
  /* wall */
  .wall{position:fixed;inset:0;background:linear-gradient(180deg,#2a1710 0%,#1d0f09 55%,#150a06 100%)}
  .glow-layer{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(46vmin 34vmin at 50% 62%, rgba(255,150,60,.55), rgba(255,150,60,0) 70%),
      radial-gradient(80vmin 40vmin at 50% 100%, rgba(255,120,40,.18), rgba(255,120,40,0) 70%);
    opacity:var(--glow)}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120vmax 90vmax at 50% 45%, rgba(0,0,0,0) 40%, rgba(5,2,1,.78) 100%)}

  /* table */
  .table{position:fixed;left:0;right:0;bottom:0;height:22vh;
    background:linear-gradient(180deg,#2a160d 0%,#1c0f0a 30%,#120804 100%);
    transform:perspective(60vmin) rotateX(28deg);transform-origin:bottom}
  .table::before{content:"";position:absolute;left:50%;top:-6vmin;transform:translateX(-50%);
    width:70vmin;height:22vmin;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,160,70,.4), rgba(255,160,70,0) 70%);
    filter:blur(14px);opacity:var(--glow)}
  .table::after{content:"";position:absolute;left:50%;top:1vmin;transform:translateX(-50%);
    width:20vmin;height:6vmin;border-radius:50%;
    background:rgba(0,0,0,.55);filter:blur(8px)}

  .scene{position:fixed;inset:0;display:grid;place-items:center}

  /* candle */
  .candle{position:relative;width:6.4vmin;min-width:38px;cursor:pointer;
    margin-top:26vmin;z-index:3}
  .candle-body{
    position:relative;width:100%;height:34vmin;
    background:linear-gradient(90deg,#c9a789 0%,#f2dcc2 26%,#fbe9d4 46%,#e3c5a6 74%,#b8977a 100%);
    border-radius:1.2vmin 1.2vmin .6vmin .6vmin;
    box-shadow:inset 0 -2vmin 4vmin rgba(60,20,5,.45)}
  .candle-body::before{content:"";position:absolute;top:-0.9vmin;left:0;right:0;height:2.2vmin;border-radius:50%;
    background:radial-gradient(50% 100% at 50% 20%, #ffe9c8, #e8c8a4 60%, #cfa87f);
    box-shadow:0 0 3vmin 0.4vmin rgba(255,200,120,.28)}
  .candle-body::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:inset 0 0 4vmin rgba(255,170,90,.14)}
  .drip{position:absolute;top:0;width:1.1vmin;border-radius:0 0 50% 50%;height:var(--h,2vmin);
    background:linear-gradient(180deg,#fbe9d4,#d9b58e);opacity:.95}
  .drip:nth-of-type(1){left:12%}
  .drip:nth-of-type(2){left:48%;--h:3vmin}
  .drip:nth-of-type(3){left:76%}
  .wick{position:absolute;left:50%;bottom:100%;width:.7vmin;height:3vmin;transform:translateX(-50%);
    background:linear-gradient(180deg,#3a2416,#191009);border-radius:.4vmin .4vmin 0 0;z-index:4}
  .ember{position:absolute;left:50%;bottom:2.6vmin;width:1.4vmin;height:1.4vmin;border-radius:50%;
    transform:translateX(-50%);background:#ff9b3d;filter:blur(1px);opacity:0;
    box-shadow:0 0 1.6vmin #ff9b3d;transition:opacity 2s;z-index:4}
  .lit .ember{opacity:1}
  .out .ember{animation:emberPulse 2.4s ease-out forwards}
  @keyframes emberPulse{0%{opacity:.9}55%{opacity:.6}100%{opacity:0}}

  /* flame */
  .flame-anchor{position:absolute;left:50%;bottom:100%;width:0;height:0;z-index:5;pointer-events:none}
  .flame{
    position:absolute;left:0;bottom:0;
    transform-origin:50% 100%;
    transform:translateX(-50%) scale(calc(var(--breath) * (1 - 0.45 * var(--bend)))) skewX(calc(-28deg * var(--bend))) rotate(calc(-14deg * var(--bend)));
    filter:hue-rotate(var(--hue,0deg));
  }
  .f-glow{position:absolute;bottom:-2vmin;left:50%;transform:translateX(-50%);
    width:26vmin;height:26vmin;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 60%, rgba(255,150,60,.85), rgba(255,120,30,.25) 55%, rgba(255,120,30,0) 75%);
    mix-blend-mode:screen;filter:blur(6px)}
  .f-outer,.f-mid,.f-core{position:absolute;bottom:0;left:50%;transform-origin:50% 100%}
  .f-outer{width:4.6vmin;height:11vmin;transform:translateX(-50%);
    border-radius:50%/62% 62% 38% 38%;
    background:linear-gradient(180deg,rgba(255,230,150,.9),#ff9b3d 40%,#e04a10 85%,#c03008);
    filter:blur(1.5px);
    animation:var(--flick1) 3.1s ease-in-out infinite}
  .f-mid{width:2.9vmin;height:7.6vmin;transform:translateX(-50%);
    border-radius:50%/62% 62% 38% 38%;
    background:linear-gradient(180deg,#fff6c8,#ffd452 45%,#ff9b2e 90%);
    filter:blur(.8px);
    animation:var(--flick2) 2.3s ease-in-out infinite}
  .f-core{width:1.3vmin;height:4.4vmin;transform:translateX(-50%);
    border-radius:50%/62% 62% 38% 38%;
    background:linear-gradient(180deg,#ffffff,#fff3c0 60%,rgba(255,230,160,.2));
    animation:var(--flick3) 1.7s ease-in-out infinite}
  .f-base{position:absolute;bottom:-0.6vmin;left:50%;transform:translateX(-50%);
    width:2.4vmin;height:2vmin;border-radius:50%;
    background:radial-gradient(50% 60% at 50% 70%, rgba(90,140,255,.9), rgba(90,140,255,0) 72%);
    filter:blur(2px)}
  @keyframes flickA{
    0%{transform:translateX(-50%) scale(1,1) skewX(0deg)}
    20%{transform:translateX(-50%) scale(1.05,.94) skewX(2deg)}
    40%{transform:translateX(-50%) scale(.94,1.07) skewX(-2deg)}
    60%{transform:translateX(-50%) scale(1.03,.97) skewX(1deg)}
    80%{transform:translateX(-50%) scale(.96,1.04) skewX(-1deg)}
    100%{transform:translateX(-50%) scale(1,1) skewX(0deg)}}
  @keyframes flickB{
    0%{transform:translateX(-50%) scale(1,1)}
    25%{transform:translateX(-48%) scale(.92,1.1)}
    50%{transform:translateX(-52%) scale(1.08,.93)}
    75%{transform:translateX(-49%) scale(.96,1.05)}
    100%{transform:translateX(-50%) scale(1,1)}}
  @keyframes flickC{
    0%{transform:translateX(-50%) scale(1,1)}
    30%{transform:translateX(-53%) scale(1.12,.9)}
    70%{transform:translateX(-47%) scale(.9,1.12)}
    100%{transform:translateX(-50%) scale(1,1)}}

  /* ring */
  .ring-wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:64vmin;height:64vmin;pointer-events:none;z-index:2}
  .ring-wrap svg{width:100%;height:100%}
  .ring-track{fill:none;stroke:rgba(233,216,195,.14);stroke-width:1}
  .ring-dash{fill:none;stroke:rgba(233,216,195,.3);stroke-width:1;stroke-dasharray:4 10}
  .ring-arc{fill:none;stroke:#f2a93b;stroke-width:2.5;stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(242,169,59,.6));transition:stroke-dashoffset 1s linear}

  /* cues */
  .cues{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;z-index:2;pointer-events:none;width:90vw}
  .cue{position:absolute;left:50%;transform:translateX(-50%);bottom:16vmin;white-space:nowrap;
    font-size:clamp(1.2rem,3.4vmin,2rem);font-weight:300;font-variant:small-caps;
    letter-spacing:.34em;color:var(--parchment);opacity:0;transition:opacity 1.1s ease}
  .cue.on{opacity:.95}
  #count{position:absolute;left:50%;transform:translateX(-50%);bottom:11.5vmin;
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1rem;color:rgba(233,216,195,.75)}

  /* chips + controls */
  .chipbar{position:fixed;left:50%;bottom:4.5vh;transform:translateX(-50%);
    display:flex;gap:.7rem;z-index:6;flex-wrap:wrap;justify-content:center}
  .chip,.pill{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;cursor:pointer;
    padding:.55rem 1.1rem;border-radius:999px;border:1px solid rgba(233,216,195,.35);
    background:rgba(233,216,195,.06);color:var(--parchment);transition:.25s}
  .chip:hover,.pill:hover{background:rgba(233,216,195,.16)}
  .chip.on{background:#f2a93b;color:#241203;border-color:#f2a93b;font-weight:600}
  #begin.on{background:#f2a93b;color:#241203;border-color:#f2a93b}
  .status{position:fixed;left:50%;bottom:1.4vh;transform:translateX(-50%);
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;
    color:rgba(233,216,195,.6);z-index:6;letter-spacing:.1em}
  .title{position:fixed;top:4vh;left:0;right:0;text-align:center;z-index:2;pointer-events:none}
  .title h1{font-weight:300;font-variant:small-caps;letter-spacing:.24em;
    font-size:clamp(1.1rem,2.6vmin,1.6rem);color:var(--parchment);opacity:.85}
  .hint{position:fixed;top:calc(4vh + 3.4vmin);left:0;right:0;text-align:center;
    font-family:var(--sans);font-size:.66rem;letter-spacing:.2em;color:rgba(233,216,195,.45);z-index:2}
  #smoke{position:fixed;inset:0;pointer-events:none;z-index:5}

  @media (max-height:480px){
    .title{display:none}.candle{margin-top:20vmin}
    .cue{bottom:12vmin}#count{bottom:8vmin}
  }
  @media (prefers-reduced-motion:reduce){
    .f-outer,.f-mid,.f-core{animation:none!important}
    .flame{--hue:0deg!important}
    .cue{transition-duration:.2s}
    .out .ember{animation-duration:.8s}
  }
</style>
</head>
<body>
<div class="wall"></div>
<div class="glow-layer"></div>
<div class="table"></div>
<div class="vignette"></div>

<div class="title"><h1>Still Flame</h1></div>
<div class="hint">HOLD mouse or space to blow · click the candle to relight</div>

<div class="scene" id="scene">
  <div class="candle lit" id="candle" title="Click to relight / toggle">
    <div class="candle-body">
      <div class="drip" style="--h:1.6vmin"></div>
      <div class="drip" style="--h:2.6vmin"></div>
      <div class="drip" style="--h:2.1vmin"></div>
    </div>
    <div class="wick"><div class="ember"></div></div>
    <div class="flame-anchor" id="flameWrap">
      <div class="flame">
        <div class="f-glow"></div>
        <div class="f-outer"></div>
        <div class="f-mid"></div>
        <div class="f-core"></div>
        <div class="f-base"></div>
      </div>
    </div>
  </div>
</div>

<div class="ring-wrap">
  <svg viewBox="0 0 200 200">
    <circle class="ring-track" cx="100" cy="100" r="92"/>
    <circle class="ring-dash" cx="100" cy="100" r="82"/>
    <circle class="ring-arc" id="arc" cx="100" cy="100" r="92"
      transform="rotate(-90 100 100)"/>
  </svg>
</div>

<div class="cues">
  <div class="cue" id="cue">Breathe in</div>
  <div id="count"></div>
</div>

<div class="chipbar">
  <button class="chip on" data-p="478">4 · 7 · 8</button>
  <button class="chip" data-p="box">Box</button>
  <button class="chip" data-p="calm">Calm</button>
  <button class="pill" id="begin">Begin</button>
</div>
<div class="status" id="status">session 00:00 · cycles 0</div>
<canvas id="smoke"></canvas>

<script>
(function(){
'use strict';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* flicker keyframes injection */
if (!reduced) {
  var style = document.createElement('style');
  var mk = function(name){
    var s = '';
    for (var i = 0; i < 8; i++) {
      var tx = (Math.random() * 10 - 5).toFixed(1);
      var sx = (0.9 + Math.random() * 0.22).toFixed(2);
      var sy = (0.9 + Math.random() * 0.22).toFixed(2);
      var sk = (Math.random() * 8 - 4).toFixed(1);
      s += (i / 8 * 100).toFixed(0) + '%{transform:translateX(-50%) translateX(' + tx + 'px) scale(' + sx + ',' + sy + ') skewX(' + sk + 'deg)}';
    }
    return '@keyframes ' + name + '{' + s + '100%{transform:translateX(-50%) scale(1,1)}}';
  };
  style.textContent = mk('kfA') + mk('kfB') + mk('kfC');
  document.head.appendChild(style);
  var rs = document.documentElement.style;
  rs.setProperty('--flick1', 'kfA');
  rs.setProperty('--flick2', 'kfB');
  rs.setProperty('--flick3', 'kfC');
}

/* state */
var patterns = {
  '478': [ {p:'Breathe in',s:4},{p:'Hold',s:7},{p:'Breathe out',s:8} ],
  'box': [ {p:'Breathe in',s:4},{p:'Hold',s:4},{p:'Breathe out',s:4},{p:'Rest',s:4} ],
  'calm':[ {p:'Breathe in',s:5},{p:'Breathe out',s:7},{p:'Rest',s:2} ]
};
var curPat = '478';
var running = false, lit = true, blowing = false, blowT = 0;
var breath = 0.78, breathTarget = 0.78;
var bend = 0, bendTarget = 0;
var phase = 0, phaseT = 0, sessionT = 0, cycles = 0;
var hue = 0;
var flicker = 1;

var root = document.documentElement.style;
var candle = document.getElementById('candle');
var cueEl = document.getElementById('cue');
var countEl = document.getElementById('count');
var arc = document.getElementById('arc');
var statusEl = document.getElementById('status');
var beginBtn = document.getElementById('begin');
var ARC_LEN = 2 * Math.PI * 92;
arc.style.strokeDasharray = ARC_LEN;
arc.style.strokeDashoffset = ARC_LEN;

/* chips */
Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    curPat = c.dataset.p;
    phase = 0; phaseT = 0;
  });
});
beginBtn.addEventListener('click', function(){
  running = !running;
  beginBtn.classList.toggle('on', running);
  beginBtn.textContent = running ? 'Pause' : 'Begin';
  if (running) { phase = 0; phaseT = 0; }
});

/* blow interaction */
var holdStarted = null;
function startBlow(){
  if (!lit) return;
  blowing = true; holdStarted = performance.now();
}
function endBlow(){
  blowing = false; blowT = 0;
  if (performance.now() - holdStarted > 1500 && lit) extinguish();
}
window.addEventListener('mousedown', function(e){
  if (e.target.closest('button')) return;
  startBlow();
});
window.addEventListener('mouseup', function(){ if (blowing) endBlow(); });
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    if (!lit) relight(); else startBlow();
  }
});
window.addEventListener('keyup', function(e){ if (e.code === 'Space' && blowing) endBlow(); });
candle.addEventListener('click', function(e){
  e.stopPropagation();
  if (!lit) relight();
});

/* smoke */
var smokeCv = document.getElementById('smoke'), sctx = smokeCv.getContext('2d');
var smokeParts = [], smokeUntil = 0, smokeDpr = 1;
function sizeSmoke(){
  smokeDpr = Math.min(window.devicePixelRatio || 1, 2);
  smokeCv.width = innerWidth * smokeDpr; smokeCv.height = innerHeight * smokeDpr;
  smokeCv.style.width = innerWidth + 'px'; smokeCv.style.height = innerHeight + 'px';
  sctx.setTransform(smokeDpr, 0, 0, smokeDpr, 0, 0);
}
sizeSmoke(); window.addEventListener('resize', sizeSmoke);
function spawnSmoke(){
  var r = document.getElementById('flameWrap').getBoundingClientRect();
  var x = r.left, y = r.top;
  var dur = reduced ? 1800 : 5000;
  smokeUntil = performance.now() + dur;
  for (var i = 0; i < 60; i++) {
    smokeParts.push({
      x: x + (Math.random() - .5) * 8, y: y,
      vy: -(18 + Math.random() * 30),
      sway: Math.random() * Math.PI * 2, swaySpeed: 1 + Math.random() * 2,
      r: 2 + Math.random() * 5, life: 1,
      decay: 1 / (dur / 1000) * (0.8 + Math.random() * 0.6), delay: Math.random() * 1200
    });
  }
}
function drawSmoke(now, dt){
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  if (performance.now() > smokeUntil) { smokeParts.length = 0; return; }
  for (var i = smokeParts.length - 1; i >= 0; i--) {
    var p = smokeParts[i];
    p.sway += p.swaySpeed * dt;
    p.x += Math.sin(p.sway) * 14 * dt;
    p.y += p.vy * dt;
    p.r += 6 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) { smokeParts.splice(i, 1); continue; }
    var a = p.life * 0.35;
    var g = sctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, 'rgba(190,190,190,' + a + ')');
    g.addColorStop(1, 'rgba(190,190,190,0)');
    sctx.fillStyle = g;
    sctx.beginPath(); sctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); sctx.fill();
  }
}

function extinguish(){
  lit = false; running = false;
  beginBtn.classList.remove('on'); beginBtn.textContent = 'Begin';
  candle.classList.remove('lit'); candle.classList.add('out');
  cueEl.classList.remove('on'); countEl.textContent = '';
  spawnSmoke();
}
function relight(){
  lit = true;
  candle.classList.add('lit'); candle.classList.remove('out');
  breath = 0.55;
  flameEl.style.transition = 'none';
}

/* wax drips */
var drips = Array.prototype.slice.call(document.querySelectorAll('.drip'));
var dripMax = [5.5, 7.5, 6.2], dripRates = [0.011, 0.007, 0.009];

/* main loop */
var flameEl = document.querySelector('.flame');
var tPrev = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - tPrev) / 1000, 0.06);
  tPrev = now;

  if (running && lit) {
    sessionT += dt;
    var seq = patterns[curPat];
    var ph = seq[phase % seq.length];
    phaseT += dt;
    var frac = Math.min(phaseT / ph.s, 1);
    arc.style.strokeDashoffset = ARC_LEN * (1 - frac);
    if (cueEl.textContent !== ph.p) {
      cueEl.classList.remove('on');
      setTimeout(function(){ cueEl.textContent = ph.p; cueEl.classList.add('on'); }, reduced ? 200 : 500);
    }
    var remain = Math.max(0, ph.s - phaseT);
    countEl.textContent = Math.ceil(remain) + 's';
    /* breath targets */
    if (ph.p === 'Breathe in') breathTarget = 1.32 * easeInOut(frac);
    else if (ph.p === 'Breathe out') breathTarget = 1.32 - 0.54 * easeInOut(frac);
    else breathTarget = breath;
    if (phaseT >= ph.s) {
      phaseT = 0; phase++;
      if (phase % seq.length === 0) cycles++;
    }
  } else if (!lit) {
    breathTarget = 0;
    arc.style.strokeDashoffset = ARC_LEN;
  } else {
    breathTarget = 0.78;
  }

  var ease = 1 - Math.exp(-dt * 2.2);
  breath += (breathTarget - breath) * ease;

  /* blow */
  bendTarget = blowing && lit ? 1 : 0;
  bend += (bendTarget - bend) * (1 - Math.exp(-dt * (blowing ? 4 : 2)));

  /* room flicker */
  flicker += (Math.random() - 0.5) * 0.5;
  flicker = Math.max(0.6, Math.min(1.15, flicker * 0.92 + 1 * 0.08));
  var glow = Math.max(0, Math.min(1.2, breath * flicker));
  if (!lit) glow = 0;
  if (blowing) glow *= 0.45;
  root.setProperty('--glow', glow.toFixed(3));
  root.setProperty('--breath', (lit ? breath : 0).toFixed(3));
  root.setProperty('--bend', bend.toFixed(3));

  /* hue drift */
  if (!reduced) {
    hue += dt * 3;
    flameEl.style.setProperty('--hue', (Math.sin(hue) * 6).toFixed(1) + 'deg');
  }

  /* drips */
  drips.forEach(function(d, i){
    var cur = parseFloat(d.style.getPropertyValue('--h')) || 1.5 + i;
    if (lit && cur < dripMax[i]) d.style.setProperty('--h', (cur + dripRates[i] * dt).toFixed(2) + 'vmin');
  });

  /* status */
  var m = Math.floor(sessionT / 60), s = Math.floor(sessionT % 60);
  statusEl.textContent = 'session ' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ' · cycles ' + cycles;

  drawSmoke(now, dt);
}
function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* initial cue */
cueEl.textContent = 'Breathe in'; cueEl.classList.add('on');
countEl.textContent = '';
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
