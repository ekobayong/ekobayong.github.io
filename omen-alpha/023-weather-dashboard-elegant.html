<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Ellery — Weather</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  --bg1:#fbe9c8;--bg2:#f4c98a;--bg3:#e8a35c;
  --ink:#3b2a14;--accent:#e07a1f;--accent2:#f6b352;
  --cardbg:rgba(255,255,255,.55);--cardbrd:rgba(255,255,255,.65);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
  transition:background .7s ease, color .7s ease;
  padding:34px clamp(16px,4vw,52px) 60px;
}
body[data-condition="cloudy"]{--bg1:#e9edf2;--bg2:#cfd8e3;--bg3:#aab8c9;--ink:#232c38;--accent:#5f7d9d;--accent2:#8fa8bf}
body[data-condition="rain"]{--bg1:#cfe0ee;--bg2:#8fb1cf;--bg3:#4f78a3;--ink:#12293e;--accent:#2b6aa8;--accent2:#7fa8cc}
body[data-condition="snow"]{--bg1:#f7f9fc;--bg2:#e3ebf5;--bg3:#c8d6e8;--ink:#2a3648;--accent:#6f8fb8;--accent2:#a8c0dc}
body[data-condition="storm"]{--bg1:#3a4256;--bg2:#232a3c;--bg3:#14192a;--ink:#eef1f7;--accent:#f0c45a;--accent2:#8fa3c8;--cardbg:rgba(255,255,255,.08);--cardbrd:rgba(255,255,255,.18)}
.serif{font-family:Georgia,'Iowan Old Style',Palatino,'Palatino Linotype',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}

/* ---------- header ---------- */
header{
  max-width:1180px;margin:0 auto 26px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;
}
.town h1{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-weight:400;font-size:clamp(26px,3.6vw,40px);letter-spacing:.01em}
.town p{font-size:13px;opacity:.72;margin-top:4px}
.seg{
  display:flex;border-radius:999px;padding:4px;gap:2px;
  background:rgba(255,255,255,.35);
  border:1px solid rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
body[data-condition="storm"] .seg{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.2)}
.seg button{
  border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer;
  opacity:.65;transition:opacity .25s,background .25s;
}
.seg button:hover{opacity:.9}
.seg button[aria-pressed="true"]{
  background:var(--accent);color:#fff;opacity:1;
  box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%, transparent);
}
body[data-condition="storm"] .seg button[aria-pressed="true"]{color:#14192a}

/* ---------- grid & cards ---------- */
.dash{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{
  grid-column:span 12;
  background:var(--cardbg);
  border:1px solid var(--cardbrd);
  border-radius:24px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:24px 26px;
  box-shadow:0 18px 44px color-mix(in srgb,var(--accent) 16%, rgba(20,30,50,.18));
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, background .7s, border-color .7s;
}
.card:hover{transform:translateY(-2px)}
.card h2{
  font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.6;
  margin-bottom:14px;
}
@media (min-width:981px){ .c8{grid-column:span 8} .c4{grid-column:span 4} }

/* ---------- current ---------- */
.current{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.current .icon{flex:0 0 260px;max-width:100%}
.current .body{flex:1;min-width:240px}
.bigtemp{
  font-family:Georgia,'Iowan Old Style',Palatino,serif;
  font-size:clamp(64px,9vw,128px);line-height:.95;letter-spacing:-.03em;font-weight:400;
}
.bigtemp sup{font-size:.38em;letter-spacing:0}
.desc{font-size:18px;margin-top:10px}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:13px;opacity:.85}
.meta b{font-weight:600;color:var(--accent)}
body[data-condition="storm"] .meta b{color:var(--accent2)}

/* ---------- animated icon ---------- */
.icon svg{width:200px;height:200px;max-width:100%;display:block;margin:0 auto}
.icon g{opacity:0;transition:opacity .6s ease}
body[data-condition="sunny"] .g-sun,
body[data-condition="cloudy"] .g-cloud, body[data-condition="cloudy"] .g-cloud2,
body[data-condition="rain"] .g-cloud, body[data-condition="rain"] .g-cloud2, body[data-condition="rain"] .g-rain,
body[data-condition="snow"] .g-cloud, body[data-condition="snow"] .g-snow,
body[data-condition="storm"] .g-cloudd, body[data-condition="storm"] .g-bolt{opacity:1}
.g-sun .core{animation:breath 5s ease-in-out infinite alternate;transform-origin:100px 100px}
@keyframes breath{from{transform:scale(1)}to{transform:scale(1.07)}}
.g-sun .raysA{animation:spin 40s linear infinite;transform-origin:100px 100px}
.g-sun .raysB{animation:spinRev 40s linear infinite;transform-origin:100px 100px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
.g-cloud{animation:drift1 9s ease-in-out infinite alternate}
.g-cloud2{animation:drift2 13s ease-in-out infinite alternate}
.g-cloudd{animation:drift1 9s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translateX(-5px)}to{transform:translateX(6px)}}
@keyframes drift2{from{transform:translateX(6px)}to{transform:translateX(-7px)}}
.g-rain line{animation:fall1 1.1s linear infinite}
.g-rain line:nth-child(2){animation-delay:.18s}
.g-rain line:nth-child(3){animation-delay:.36s}
.g-rain line:nth-child(4){animation-delay:.54s}
.g-rain line:nth-child(5){animation-delay:.72s}
@keyframes fall1{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.g-snow .flake{animation:fall2 3.4s ease-in-out infinite}
.g-snow .flake:nth-child(2){animation-delay:.5s}
.g-snow .flake:nth-child(3){animation-delay:1s}
.g-snow .flake:nth-child(4){animation-delay:1.5s}
.g-snow .flake:nth-child(5){animation-delay:2s}
@keyframes fall2{
  0%{transform:translate(0,0);opacity:0}
  15%{opacity:1}
  50%{transform:translate(7px,28px)}
  85%{opacity:1}
  100%{transform:translate(-4px,58px);opacity:0}
}
.g-bolt{animation:flash 3.6s linear infinite}
@keyframes flash{
  0%,38%,44%,100%{opacity:0}
  40%,48%{opacity:1}
  42%{opacity:.4}
}

/* ---------- wind compass ---------- */
.wind{display:flex;flex-direction:column;align-items:center;gap:10px}
.wind svg{width:210px;height:210px}
.needle{transform-origin:100px 100px;transition:transform 1.4s cubic-bezier(.34,1.4,.5,1)}
.wind .disc-speed{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-size:26px}
.wind .disc-sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:9px;letter-spacing:.14em;opacity:.65}
.wind .foot{display:flex;gap:18px;font-size:12.5px;opacity:.8;flex-wrap:wrap;justify-content:center}
.wind .foot b{font-weight:600;color:var(--accent)}
body[data-condition="storm"] .wind .foot b{color:var(--accent2)}

/* ---------- hourly ---------- */
.hourly svg{width:100%;height:auto;display:block}
.hourly .axis{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:11px;opacity:.6}
#tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .2s;
  background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.7);
  color:#1d2430;border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(20,30,50,.18);z-index:4;
}
body[data-condition="storm"] #tip{background:rgba(20,26,42,.85);color:#eef1f7;border-color:rgba(255,255,255,.2)}
#tip b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}

/* ---------- gauges ---------- */
.comfort .gauges{display:flex;flex-direction:column;gap:8px}
.gauge{display:flex;align-items:center;gap:16px}
.gauge svg{flex:0 0 96px}
.gauge .val{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-size:26px}
.gauge .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.gauge .note{font-size:12px;opacity:.65;margin-top:2px}
.arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}

/* ---------- week ---------- */
.week{display:flex;gap:10px;overflow:hidden}
.day{
  flex:1;min-width:0;text-align:center;padding:12px 6px;border-radius:16px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  transition:background .25s;
}
.day:hover{background:rgba(255,255,255,.32)}
.day .dname{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
.day svg{width:38px;height:38px;margin:6px auto}
.day .range{font-size:12.5px;margin-top:4px}
.day .range b{font-weight:600}
.rbar{height:5px;border-radius:3px;background:rgba(127,127,127,.22);margin:8px 4px 0;position:relative}
.rbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent))}

/* ---------- sun ---------- */
.sun-card{display:flex;flex-direction:column;gap:12px}
.sun-card svg{width:100%;max-width:240px;margin:0 auto;display:block}
.sun-times{display:flex;justify-content:space-between;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:12px;opacity:.8}
input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer}
.sun-note{font-size:12px;opacity:.65;text-align:center}

@media (max-width:560px){
  .day:nth-child(n+5){display:none}
  .card{padding:18px}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .g-rain line,.g-bolt{opacity:1}
  body[data-condition="rain"] .g-rain{opacity:1}
}
</style>
</head>

    hours:[-5,-5.3,-5.5,-5.6,-5.4,-5,-4.4,-3.7,-3.1,-2.6,-2.2,-1.9,-1.6,-1.4,-1.6,-2.1,-2.8,-3.5,-4.1,-4.6,-5,-5.3,-5.5,-5.7],
    week:[["Mon","snow",-4,1],["Tue","snow",-5,0],["Wed","cloud",-3,2],["Thu","partly",-2,3],["Fri","snow",-4,0],["Sat","cloud",-3,1],["Sun","partly",-2,3]] },
  storm:{ temp:15.1, feels:13, hi:17, lo:11, precip:95, desc:"Thunderheads rolling in from the west",
    wind:48, dir:270, dirName:"W", gust:76, hum:81, uv:0, press:996, pressNote:"falling fast",

    week:[["Mon","storm",11,17],["Tue","rain",10,14],["Wed","rain",10,13],["Thu","cloud",11,15],["Fri","partly",12,17],["Sat","sun",13,19],["Sun","sun",14,20]] }
};

const fmt = t => Math.round(t)+"°";

/* ---------------- segmented control ---------------- */
const buttons=[...document.querySelectorAll(".seg button")];
buttons.forEach(b=>b.addEventListener("click",()=>setCondition(b.dataset.c)));

/* ---------------- animated icon ---------------- */
/* handled purely in CSS via body[data-condition] */

/* ---------------- compass ---------------- */
const compass=$("#compass");
let needle, compassBuilt=false;
function buildCompass(){
  let s="";
  for(let i=0;i<72;i++){
    const a=i*5*Math.PI/180;
    const long=i%18===0, mid=i%9===0;
    const r1=long?76:mid?84:90, r2=94;
    const c=Math.cos(a-Math.PI/2), sn=Math.sin(a-Math.PI/2);
    s+=`<line x1="${100+c*r1}" y1="${100+sn*r1}" x2="${100+c*r2}" y2="${100+sn*r2}"
        stroke="currentColor" stroke-opacity="${long?.55:mid?.35:.2}" stroke-width="${long?2.4:1.2}"/>`;
  }
  [["N",100,16],["E",188,104],["S",100,196],["W",12,104]].forEach(([t,x,y])=>{
    s+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="13"
        font-family="ui-monospace,Menlo,Consolas,monospace" fill="currentColor" opacity=".6">${t}</text>`;
  });
  s+=`<g class="needle" id="needle">
        <polygon points="100,32 106,104 100,116 94,104" fill="var(--accent)"/>
        <polygon points="100,168 104,104 100,96 96,104" fill="currentColor" opacity=".25"/>
      </g>`;
  s+=`<circle cx="100" cy="100" r="34" fill="var(--cardbg)" stroke="var(--cardbrd)"/>`;
  s+=`<text class="disc-speed" x="100" y="98" text-anchor="middle" fill="var(--ink)" id="wSpeed">14</text>`;
  s+=`<text class="disc-sub" x="100" y="112" text-anchor="middle" fill="var(--ink)">KM/H</text>`;
  compass.innerHTML=s;
  needle=$("#needle");
  compassBuilt=true;
}
buildCompass();

/* ---------------- gauges ---------------- */
const gaugeDefs=[
  {id:"hum", lab:"Humidity", r:40, max:100, note:"relative"},
  {id:"uv", lab:"UV Index", r:40, max:11, note:"of 11+ · clear sky scale"},
  {id:"press", lab:"Pressure", r:40, max:1040, min:960, note:"hPa"}
];
const gaugesEl=$("#gauges");
gaugeDefs.forEach(g=>{
  const arcLen=Math.PI*g.r;
  const row=document.createElement("div");
  row.className="gauge";
  row.innerHTML=`
    <svg viewBox="0 0 100 62">
      <path d="M10 56 A ${g.r} ${g.r} 0 0 1 90 56" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="8" stroke-linecap="round"/>
      <path class="arc" data-g="${g.id}" d="M10 56 A ${g.r} ${g.r} 0 0 1 90 56" fill="none"
        stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${arcLen}" stroke-dashoffset="${arcLen}"/>
    </svg>
    <div>
      <div class="lab">${g.lab}</div>
      <div class="val" id="g-${g.id}">—</div>
      <div class="note">${g.note}</div>
    </div>`;
  gaugesEl.appendChild(row);
});
function setGauge(id, v, def){
  const arc=document.querySelector(`.arc[data-g="${id}"]`);
  const L=Math.PI*def.r;
  const frac=clamp((v-(def.min||0))/((def.max||100)-(def.min||0)),0,1);
  arc.style.strokeDashoffset = reduced ? L*(1-frac) : L*(1-frac);
  requestAnimationFrame(()=>{ arc.style.strokeDashoffset = L*(1-frac); });
  document.getElementById("g-"+id).textContent =
    id==="press" ? Math.round(v) : (id==="uv" ? v.toFixed(1) : Math.round(v)+"%");
}

/* ---------------- hourly chart ---------------- */
const chart=$("#chart"), tip=$("#tip");
let chartReady=false, chartData=null, hoverLayer=null;
const CX0=30, CX1=770, CY0=26, CY1=190;

function buildChart(hours){
  const n=hours.length;
  const mn=Math.min(...hours), mx=Math.max(...hours);
  const pad=(mx-mn)||1;
  const pts=hours.map((t,i)=>[
    CX0+i*(CX1-CX0)/(n-1),
    CY1-((t-(mn-pad*.15))/((mx+pad*.15)-(mn-pad*.15)))*(CY1-CY0)
  ]);
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<n-1;i++){
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(n-1,i+2)];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`;
  }
  const iMax=hours.indexOf(mx), iMin=hours.indexOf(mn);
  let s=`<defs><linearGradient id="hgrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--accent)" stop-opacity=".38"/>
    <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<path d="${d} L ${CX1} ${CY1+16} L ${CX0} ${CY1+16} Z" fill="url(#hgrad)"/>`;
  s+=`<path id="hline" d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`;
  [[iMax,mx,"max"],[iMin,mn,"min"]].forEach(([i,v,kind])=>{
    s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="var(--accent)"/>
        <text x="${clamp(pts[i][0],34,766)}" y="${kind==="max"?pts[i][1]-12:pts[i][1]+20}" text-anchor="middle"
          font-size="13" fill="var(--ink)" font-family="Georgia,serif">${Math.round(v)}°</text>`;
  });
  for(let i=0;i<n;i+=4){
    s+=`<text class="axis" x="${pts[i][0]}" y="214" text-anchor="middle">${String(i).padStart(2,"0")}</text>`;
  }
  s+=`<g id="hover" opacity="0">
        <line id="hcursor" y1="${CY0}" y2="${CY1+16}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 4"/>
        <circle id="hdot" r="5" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      </g>`;
  chart.innerHTML=s;
  const line=document.getElementById("hline");
  const len=line.getTotalLength();
  line.style.strokeDasharray=len;
  if (reduced){ line.style.strokeDashoffset=0; }
  else{
    line.style.strokeDashoffset=len;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      line.style.transition="stroke-dashoffset 1.6s ease-out";
      line.style.strokeDashoffset=0;
    }));
  }
  chartData={pts,hours,n};
}
chart.addEventListener("pointermove",e=>{
  if(!chartData) return;
  const r=chart.getBoundingClientRect();
  const x=(e.clientX-r.left)*(800/r.width);
  let best=0,bd=1e9;
  chartData.pts.forEach((p,i)=>{const d=Math.abs(p[0]-x); if(d<bd){bd=d;best=i;}});
  const p=chartData.pts[best];
  const h=document.getElementById("hover");
  h.setAttribute("opacity","1");
  document.getElementById("hcursor").setAttribute("x1",p[0]);
  document.getElementById("hcursor").setAttribute("x2",p[0]);
  document.getElementById("hdot").setAttribute("cx",p[0]);
  document.getElementById("hdot").setAttribute("cy",p[1]);
  tip.style.opacity=1;
  tip.innerHTML=`<b>${String(best).padStart(2,"0")}:00</b> · ${chartData.hours[best].toFixed(1)}°C`;
  const wr=chart.parentElement.getBoundingClientRect();
  tip.style.left=(r.left-wr.left+p[0]*(r.width/800))+"px";
  tip.style.top=(r.top-wr.top+p[1]*(r.height/220)-34)+"px";
});
chart.addEventListener("pointerleave",()=>{ tip.style.opacity=0; document.getElementById("hover").setAttribute("opacity","0"); });

/* ---------------- week ---------------- */
const weekEl=$("#week");
function buildWeek(days){
  const lo=Math.min(...days.map(d=>d[2])), hi=Math.max(...days.map(d=>d[3]));
  weekEl.innerHTML=days.map(d=>{
    const l=(d[2]-lo)/(hi-lo)*100, r=(d[3]-lo)/(hi-lo)*100;
    return `<div class="day">
      <div class="dname">${d[0]}</div>
      <svg><use href="#i-${d[1]}"/></svg>
      <div class="range"><b>${d[3]}°</b> / ${d[2]}°</div>
      <div class="rbar"><i style="left:${l}%;right:${100-r}%"></i></div>
    </div>`;
  }).join("");
}

/* ---------------- sun card ---------------- */
const sunArc=$("#sunArc"), slider=$("#timeSlider");
function buildSun(){
  sunArc.innerHTML=`
    <path d="M30 130 A 90 90 0 0 1 210 130" fill="none" stroke="currentColor" stroke-opacity=".3"
      stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
    <path id="sunLit" d="M30 130 A 90 90 0 0 1 210 130" fill="none" stroke="var(--accent2)"
      stroke-width="4" stroke-linecap="round" stroke-dasharray="283"/>
    <circle id="sunOrb" cx="120" cy="40" r="10" fill="var(--accent2)"/>
    <circle id="sunHalo" cx="120" cy="40" r="18" fill="var(--accent2)" opacity=".25"/>
    <line x1="10" y1="130" x2="230" y2="130" stroke="currentColor" stroke-opacity=".3"/>`;
  updateSun();
}
function updateSun(){
  const c=cond[document.body.dataset.condition];
  const mins=+slider.value;
  const [sh,sm]=c.rise.split(":").map(Number), [eh,em]=c.set.split(":").map(Number);
  const rise=sh*60+sm, set=eh*60+em;
  const frac=clamp((mins-rise)/(set-rise),0,1);
  const ang=Math.PI*(1-frac);
  const cx=120+90*Math.cos(ang), cy=130-90*Math.sin(ang);
  const orb=document.getElementById("sunOrb"), halo=document.getElementById("sunHalo"),
        lit=document.getElementById("sunLit");
  if(orb){ orb.setAttribute("cx",cx); orb.setAttribute("cy",cy);
    halo.setAttribute("cx",cx); halo.setAttribute("cy",cy);
    lit.setAttribute("stroke-dasharray", `${283*frac} 400`); }
  document.getElementById("sunrise").textContent=c.rise;
  document.getElementById("sunset").textContent=c.set;
  const hh=Math.floor(mins/60), mm=String(mins%60).padStart(2,"0");
  document.getElementById("clock").textContent=`${String(hh).padStart(2,"0")}:${mm}`;
}
slider.addEventListener("input",updateSun);
buildSun();

/* ---------------- condition switching ---------------- */
function setCondition(c){
  document.body.dataset.condition=c;
  buttons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===c)));
  const d=cond[c];
  document.getElementById("curTemp").textContent=Math.round(d.temp);
  document.getElementById("desc").textContent=d.desc;
  document.getElementById("feels").textContent=fmt(d.feels);
  document.getElementById("hi").textContent=fmt(d.hi);
  document.getElementById("lo").textContent=fmt(d.lo);
  document.getElementById("precip").textContent=d.precip+"%";
  document.getElementById("wOrigin").textContent=d.dirName;
  document.getElementById("wGust").textContent=d.gust+" km/h";
  if(compassBuilt){
    document.getElementById("wSpeed").textContent=d.wind;
    needle.style.transform=`rotate(${d.dir}deg)`;
  }
  setGauge("hum",d.hum,gaugeDefs[0]);
  setGauge("uv",d.uv,gaugeDefs[1]);
  setGauge("press",d.press,gaugeDefs[2]);
  buildChart(d.hours);
  buildWeek(d.week);
  updateSun();
}
const now=new Date();
document.getElementById("dateline").textContent=
  now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · coastal simulated data";
slider.value=now.getHours()*60+now.getMinutes();
setCondition("sunny");
})();
</script>
</body>
</html>
