<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelian Codex — Holographic Card Gallery</title>
<style>
:root{
  --gold:#d9b04c;
  --gold-lt:#fff2c2;
  --gold-dk:#8a6a1f;
  --lav:#b9a9d6;
  --paper:#f3ecdf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{
  min-height:100vh;
  font-family:Georgia,'Palatino Linotype',Palatino,'Times New Roman',serif;
  color:var(--paper);
  background:
    radial-gradient(1100px 640px at 50% -12%, #3a1a5c, transparent 70%),
    radial-gradient(950px 760px at 110% 96%, #2a0f3f, transparent 72%),
    linear-gradient(180deg, #170b24 0%, #0b0611 100%);
  overflow-x:hidden;
  padding-bottom:90px;
}
body::before{ /* velvet nap */
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.014) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(65deg, rgba(0,0,0,.055) 0 2px, transparent 2px 7px);
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}

/* ---------- header ---------- */
header{
  position:relative; z-index:2;
  max-width:1160px; margin:0 auto;
  padding:72px 28px 40px;
  text-align:center;
}
.eyebrow{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-size:12px; letter-spacing:.32em; text-transform:uppercase;
  color:var(--gold);
}
h1{
  margin:22px auto 0;
  max-width:14em;
  font-weight:400;
  font-size:clamp(34px,5.4vw,64px);
  line-height:1.08;
  letter-spacing:.01em;
  background:linear-gradient(180deg,#fff6d5 0%, #d9b04c 55%, #8a6a1f 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
h1 em{font-style:italic}
.lede{
  margin:18px auto 0; max-width:560px;
  color:var(--lav); font-size:17px; line-height:1.6; font-style:italic;
}
.rule{
  width:220px; height:1px; margin:30px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
}

/* ---------- gallery ---------- */
.gallery{
  position:relative; z-index:2;
  max-width:1160px; margin:0 auto;
  padding:26px 28px 10px;
  display:grid;
  grid-template-columns:repeat(auto-fit, 280px);
  justify-content:center;
  gap:44px 34px;
}
.card{
  position:relative;
  width:280px; height:400px;
  perspective:1100px;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.card:focus-visible{filter:drop-shadow(0 0 0 transparent)}
.card:focus-visible .inner{box-shadow:0 0 0 2px var(--gold)}
.inner{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) * var(--mir,1))) rotateY(var(--flip,0deg));
  transition:transform 550ms cubic-bezier(.2,.8,.2,1);
  border-radius:16px;
}
.card.hovering .inner{transition:transform 80ms linear}
.face{
  position:absolute; inset:0;
  border-radius:16px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  box-shadow:0 24px 48px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.4);
}
.front{
  background:
    radial-gradient(130% 100% at 20% 0%, var(--artA) 0%, transparent 55%),
    radial-gradient(120% 110% at 90% 110%, var(--artB) 0%, transparent 60%),
    linear-gradient(170deg, var(--artC), #120a1e 85%);
  display:flex; flex-direction:column;
}
.back{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(45deg, rgba(217,176,76,.07) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-45deg, rgba(217,176,76,.07) 0 1px, transparent 1px 9px),
    radial-gradient(140% 120% at 50% 10%, #2c1533 0%, #1d0c24 70%);
  color:#e8dcb2;
  padding:26px 22px;
  display:flex; flex-direction:column;
  text-align:center;
}
.back .bname{
  font-size:21px; letter-spacing:.04em; color:var(--gold);
  line-height:1.25;
}
.back .borigin{
  margin-top:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:#9d8a5e;
}
.back .bsigil{margin:18px auto 6px; opacity:.95}
.back .blore{
  font-size:13.5px; line-height:1.62; text-align:left; color:#cbbd97;
}
.back .blore::first-letter{
  font-size:2.6em; line-height:.85; float:left;
  margin:4px 8px 0 0; color:var(--gold); font-style:italic;
}
.back .bhint{
  margin-top:auto; padding-top:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#8d7a52;
}

/* ---------- front layers ---------- */
.art{
  position:absolute; top:10px; left:10px; right:10px; height:200px;
  border-radius:10px; overflow:hidden;
  background:
    radial-gradient(90% 80% at 70% 20%, var(--artA) 0%, transparent 65%),
    radial-gradient(100% 90% at 25% 85%, var(--artB) 0%, transparent 60%),
    linear-gradient(180deg, var(--artC), #0d0716);
}
.art svg{position:absolute; inset:0; width:100%; height:100%}
.emblem{
  position:absolute; top:64px; left:50%; width:92px; height:92px;
  margin-left:-46px;
  transition:transform 420ms cubic-bezier(.2,.8,.2,1);
}
.card.hovering .emblem{transform:scale(1.12)}
.foil{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg,
    rgba(255,64,190,.55), rgba(255,206,92,.55), rgba(72,240,214,.55),
    rgba(64,130,255,.55), rgba(178,88,255,.55), rgba(255,64,190,.55));
  background-size:300% 300%;
  background-position:calc(var(--mx,50)*1.6%) calc(var(--my,50)*1.6%);
  mix-blend-mode:color-dodge;
  opacity:.38;
  transition:opacity 300ms linear;
}
.card.hovering .foil, .card.shimmer .foil{opacity:.62}
.sparkles{
  position:absolute; inset:0; pointer-events:none;
  mix-blend-mode:screen; opacity:.8;
  background-image:
    radial-gradient(circle 1.4px at 50% 50%, rgba(255,255,255,.95) 0%, transparent 70%),
    radial-gradient(circle 1.1px at 50% 50%, rgba(255,255,255,.85) 0%, transparent 70%),
    radial-gradient(circle 1.6px at 50% 50%, rgba(255,244,200,.9) 0%, transparent 70%),
    radial-gradient(circle 1px at 50% 50%, rgba(255,255,255,.8) 0%, transparent 70%),
    radial-gradient(circle 1.2px at 50% 50%, rgba(214,240,255,.9) 0%, transparent 70%);
  background-size:47px 47px, 61px 61px, 79px 79px, 101px 101px, 133px 133px;
  background-position:
    calc(var(--mx,50)*1%) calc(var(--my,50)*1%),
    calc(100% - var(--mx,50)*1%) calc(var(--my,50)*1%),
    calc(var(--mx,50)*1%) calc(100% - var(--my,50)*1%),
    calc(100% - var(--mx,50)*1%) calc(100% - var(--my,50)*1%),
    calc(var(--mx,50)*1.4% - 30%) calc(var(--my,50)*1.4% + 20%);
}
.glare{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(240px 240px at calc(var(--mx,50)*1%) calc(var(--my,50)*1%),
    rgba(255,255,255,.5) 0%, rgba(255,255,255,.12) 38%, transparent 70%);
  mix-blend-mode:overlay;
  opacity:0; transition:opacity 260ms linear;
}
.card.hovering .glare{opacity:1}
.gilt{
  position:absolute; inset:7px; pointer-events:none;
  padding:2px;
  background:linear-gradient(115deg, #fff2c2, #d9b04c 30%, #8a6a1f 55%, #d9b04c 80%, #fff2c2);
  background-size:280% 280%;
  background-position:calc(var(--mx,50)*1.2%) calc(var(--my,50)*1.2%);
  border-radius:12px;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite:exclude;
}
.hairline{
  position:absolute; inset:13px; pointer-events:none;
  border:1px solid rgba(255,242,194,.28); border-radius:9px;
}
.sweep{
  position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:16px;
}
.sweep::before{
  content:""; position:absolute; top:-20%; bottom:-20%; left:-45%; width:36%;
  background:linear-gradient(100deg, transparent, rgba(255,244,214,.42) 45%, rgba(255,255,255,.6) 50%, rgba(255,244,214,.42) 55%, transparent);
  mix-blend-mode:screen;
  transform:translateX(-160%) rotate(6deg);
  opacity:0;
}
.card.shimmer .sweep::before{animation:shimmerSweep 1.5s ease-in-out}
@keyframes shimmerSweep{
  0%{transform:translateX(-160%) rotate(6deg); opacity:0}
  12%{opacity:1}
  88%{opacity:1}
  100%{transform:translateX(470%) rotate(6deg); opacity:0}
}

/* ---------- front content ---------- */
.plate{
  position:relative; margin:222px 14px 0; padding-top:10px;
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
.plate h3{
  font-size:19px; font-weight:400; letter-spacing:.02em; color:#f6ecd6;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}
.plate .num{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-size:11px; letter-spacing:.14em; color:rgba(246,236,214,.62);
}
.pill{
  position:relative; align-self:flex-start;
  margin:8px 0 0 14px; padding:4px 12px;
  border-radius:999px; border:1px solid rgba(217,176,76,.55);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold); background:rgba(20,10,32,.55);
}
.stats{
  position:relative; margin:auto 14px 14px; padding:10px 12px 12px;
  border-radius:9px; background:rgba(10,5,18,.5);
  border:1px solid rgba(217,176,76,.25);
}
.flavor{
  font-style:italic; font-size:12px; line-height:1.45; color:#c9b9df;
  margin-bottom:9px;
}
.bar{display:flex; align-items:center; gap:8px; margin-top:6px}
.bar b{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  font-weight:400; font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:rgba(243,236,223,.65); width:44px; flex:none;
}
.track{flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden}
.track span{
  display:block; height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--gold-dk), var(--gold), #fff2c2);
  transform:scaleX(0); transform-origin:left;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);
}
.card.seen .track span{transform:scaleX(var(--v,1))}
.card:nth-child(3n) .seen-2 .track span{transition-delay:.12s}

/* ---------- responsive card sizes ---------- */
@media (max-width:640px){
  .gallery{grid-template-columns:repeat(auto-fit, 250px); gap:34px 22px}
  .card{width:250px; height:358px}
  .art{height:176px}
  .plate{margin-top:196px}
}
@media (max-width:360px){
  .gallery{grid-template-columns:repeat(auto-fit, 228px); padding:18px 14px}
  .card{width:228px; height:326px}
  .art{height:158px}
  .plate{margin-top:176px; margin-left:12px; margin-right:12px}
  .stats{margin-left:12px; margin-right:12px}
  header{padding-top:52px}
}
@media (prefers-reduced-motion: reduce){
  .inner, .emblem, .track span{transition:none !important}
  .sweep{display:none}
  .card .foil{transition:none}
}
</style>
</head>

  <div class="rule" role="presentation"></div>
</header>

<main class="gallery" id="gallery" aria-label="Aurelian Codex card gallery"></main>

  <circle cx="22" cy="22" r="20" fill="none" stroke="#d9b04c" stroke-width="1.6"/>
  <circle cx="22" cy="22" r="13" fill="none" stroke="#d9b04c" stroke-width="1"/>
  <path d="M22 6v32M6 22h32M11 11l22 22M33 11L11 33" stroke="#d9b04c" stroke-width=".8" opacity=".7"/>
  <circle cx="22" cy="22" r="3.4" fill="#d9b04c"/></svg>`;

cards.forEach((c,i)=>{
  const el = document.createElement("article");
  el.className = "card";
  el.tabIndex = 0;
  el.setAttribute("role","button");
  el.setAttribute("aria-pressed","false");
  el.innerHTML = `
  <div class="inner">
    <div class="face front" style="--artA:${c.artA};--artB:${c.artB};--artC:${c.artC}">
      <div class="art">${c.art}</div>
      <div class="emblem">${c.emblem}</div>
      <div class="foil" aria-hidden="true"></div>
      <div class="sparkles" aria-hidden="true"></div>
      <div class="glare" aria-hidden="true"></div>
      <div class="gilt" aria-hidden="true"></div>
      <div class="hairline" aria-hidden="true"></div>
      <div class="sweep" aria-hidden="true"></div>
      <div class="plate"><h3>${c.name}</h3><span class="num">0${i+1}/06</span></div>
      <span class="pill">${c.cls}</span>
      <div class="stats">
        <p class="flavor">${c.flavor}</p>
        ${c.stats.map((s,j)=>`<div class="bar"><b>${s[0]}</b><div class="track"><span style="--v:${s[1]};transition-delay:${j*120}ms"></span></div></div>`).join("")}
      </div>
    </div>
    <div class="face back">
      <h3 class="bname">${c.name}</h3>

    </div>
  </div>`;
  gallery.appendChild(el);

/* ---------------- tilt + flip ---------------- */
const clamp16 = v => Math.max(-16, Math.min(16, v));
let pending = null;

function applyVars(card){
  const inner = card.firstElementChild;
  inner.style.setProperty("--rx", card._rx + "deg");
  inner.style.setProperty("--ry", card._ry + "deg");
  inner.style.setProperty("--mx", card._mx);
  inner.style.setProperty("--my", card._my);
  pending = null;
}
function schedule(card){
  if (pending === null){
    pending = requestAnimationFrame(()=>applyVars(card));
  } else {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(()=>applyVars(card));
  }
}
function flip(card){
  const inner = card.firstElementChild;
  const flipped = inner.style.getPropertyValue("--flip") === "180deg";
  inner.style.setProperty("--flip", flipped ? "0deg" : "180deg");
  inner.style.setProperty("--mir", flipped ? "1" : "-1");
  card.setAttribute("aria-pressed", String(!flipped));
}

document.querySelectorAll(".card").forEach(card=>{
  let downX=0, downY=0, dragging=false, isDown=false;

  card.addEventListener("pointerenter", e=>{
    if (e.pointerType === "touch") return;
    card.classList.add("hovering");
  });
  card.addEventListener("pointerleave", ()=>{
    card.classList.remove("hovering");
    card._rx = 0; card._ry = 0; card._mx = 50; card._my = 50;
    if (!reduce) schedule(card);
    else applyVars(card);
  });

  if (!reduce){
    card.addEventListener("pointermove", e=>{
      if (e.pointerType === "touch" && !isDown) return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      if (isDown && Math.hypot(e.clientX-downX, e.clientY-downY) > 12) dragging = true;
      card._mx = Math.round(px*100);
      card._my = Math.round(py*100);
      card._ry = clamp16((px - .5) * 32);
      card._rx = clamp16((.5 - py) * 32);
      schedule(card);
    });
  }

  card.addEventListener("pointerdown", e=>{
    isDown = true; dragging = false;
    downX = e.clientX; downY = e.clientY;
    lastInteract = Date.now();
    if (e.pointerType === "touch") card.classList.add("hovering");
  });
  card.addEventListener("pointerup", e=>{
    const wasTouch = e.pointerType === "touch";
    isDown = false;
    if (wasTouch){
      card.classList.remove("hovering");
      card._rx = 0; card._ry = 0;
      schedule(card);
      if (!dragging) flip(card);
    }
  });
  card.addEventListener("pointercancel", ()=>{ isDown = false; card.classList.remove("hovering"); });
  card.addEventListener("click", e=>{
    if (e.pointerType === "touch") return; // handled by pointerup
    flip(card);
  });
  card.addEventListener("keydown", e=>{
    if (e.key === "Enter" || e.key === " "){
      e.preventDefault(); flip(card);
    }
  });
  card._rx = 0; card._ry = 0; card._mx = 50; card._my = 50;
});

/* ---------------- stats bars in view ---------------- */
const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if (en.isIntersecting){ en.target.classList.add("seen"); io.unobserve(en.target); }
  });
},{threshold:.35});
document.querySelectorAll(".card").forEach(c=>io.observe(c));

/* ---------------- idle shimmer ---------------- */
let lastInteract = 0;
const allCards = [...document.querySelectorAll(".card")];
let shimmerIdx = 0;
setInterval(()=>{
  if (reduce) return;
  if (Date.now() - lastInteract < 3400) return;
  if (document.querySelector(".card:hover")) return;
  const card = allCards[shimmerIdx % allCards.length];
  shimmerIdx++;
  card.classList.add("shimmer");
  card.addEventListener("animationend", ()=>card.classList.remove("shimmer"), {once:true});
}, 3200);
})();
</script>
