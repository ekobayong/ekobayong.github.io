<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>045 · The Long Meridian — Cinematic Title Sequence</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:#000; color:#E8E2D6;
    font-family:'Iowan Old Style','Palatino','Palatino Linotype',Georgia,serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #stage {
    position:relative;
    overflow:hidden;
    box-shadow:0 0 120px rgba(0,0,0,.95), 0 0 40px rgba(10,12,20,.8);
    background:#000;
  }
  #stage .layer { position:absolute; inset:0; will-change:transform, opacity, filter; }

  /* fog */
  .fog {
    position:absolute; width:90%; height:80%; border-radius:50%;
    filter:blur(40px); mix-blend-mode:screen; opacity:.5;
  }
  #fogA { left:-25%; top:-30%; background:radial-gradient(50% 50% at 50% 50%, rgba(120,125,140,.4), rgba(120,125,140,0) 70%); }
  #fogB { right:-30%; top:0%;   background:radial-gradient(50% 50% at 50% 50%, rgba(150,140,120,.34), rgba(150,140,120,0) 70%); }
  #fogC { left:5%; bottom:-45%; background:radial-gradient(55% 50% at 50% 50%, rgba(130,133,148,.4), rgba(130,133,148,0) 70%); }

  /* horizon */
  #horizon {
    top:58%; left:10%; right:10%; height:1px; opacity:0;
    background:linear-gradient(90deg, rgba(201,164,98,0) 0%, #C9A462 20%, #E8E2D6 50%, #C9A462 80%, rgba(201,164,98,0) 100%);
    transform:scaleX(0);
  }

  /* cast names */
  #castLayer { display:flex; align-items:center; justify-content:center; }
  .castname { position:absolute; text-align:center; opacity:0; }
  .castname .kicker {
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    font-weight:200; font-size:11px; letter-spacing:.5em; text-transform:uppercase;
    color:rgba(232,226,214,.55); margin-bottom:14px; transform:translateX(0.25em);
  }
  .castname .nm {
    font-size:clamp(20px,3.2vw,40px); letter-spacing:.32em; text-transform:uppercase;
    color:#E8E2D6; transform:translateX(0.16em); white-space:nowrap;
  }

  /* title */
  #titleBlock {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; opacity:0;
  }
  #byline, #date {
    position:absolute; left:0; right:0; text-align:center; opacity:0;
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    font-weight:300; font-size:clamp(9px,1.1vw,13px); letter-spacing:.5em; text-transform:uppercase;
    color:rgba(232,226,214,.7);
  }
  #byline { top:30%; } #date { bottom:26%; }
  #mainTitle {
    font-size:clamp(26px,4.6vw,64px); font-weight:500; letter-spacing:.1em;
    color:transparent; white-space:nowrap; transform:translateX(0.19em);
    background:linear-gradient(100deg, #E8E2D6 0%, #FFFFFF 30%, #E8E2D6 55%, #FFFFFF 80%, #E8E2D6 100%);
    background-size:300% 100%; background-position:100% 0;
    -webkit-background-clip:text; background-clip:text;
    filter:blur(6px);
  }

  /* flare streak */
  #flare {
    top:0; bottom:0; width:120%; opacity:0; mix-blend-mode:screen; pointer-events:none;
    background:
      radial-gradient(2% 55% at 50% 58%, rgba(255,244,214,.95), rgba(255,244,214,0) 100%),
      linear-gradient(90deg, rgba(90,120,200,0) 0%, rgba(90,120,200,.12) 20%,
        rgba(255,220,150,.22) 48%, rgba(255,244,214,.9) 50%,
        rgba(255,220,150,.22) 52%, rgba(90,120,200,.12) 80%, rgba(90,120,200,0) 100%);
  }

  /* credits */
  #creditsLayer { overflow:hidden; opacity:0;
    -webkit-mask:linear-gradient(180deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
    mask:linear-gradient(180deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
  }
  #creditsCol { position:absolute; left:0; right:0; text-align:center; top:100%; }
  .credit { margin-bottom:4.2%; }
  .credit .role {
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    font-weight:300; font-size:clamp(8px,1vw,11px); letter-spacing:.45em; text-transform:uppercase;
    color:rgba(232,226,214,.5); margin-bottom:8px; transform:translateX(0.22em);
  }
  .credit .who {
    font-size:clamp(13px,1.9vw,22px); letter-spacing:.3em; text-transform:uppercase;
    color:#E8E2D6; transform:translateX(0.15em);
  }
  .credit .who.small { font-size:clamp(10px,1.4vw,15px); letter-spacing:.22em; }
  #prodLine { margin-top:6%; font-style:italic; font-size:clamp(10px,1.4vw,15px); color:rgba(232,226,214,.75); }

  /* end card */
  #endLayer { display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; }
  #endLine {
    font-style:italic; font-size:clamp(14px,2vw,26px); color:#E8E2D6;
    max-width:64%; text-align:center; line-height:1.6; margin-bottom:5%;
  }
  #replayBtn {
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    background:transparent; border:1px solid rgba(232,226,214,.6); border-radius:999px;
    color:#E8E2D6; padding:10px 30px; letter-spacing:.32em; text-transform:uppercase; font-size:11px;
    cursor:pointer; transition:letter-spacing .45s ease, background .45s ease, color .45s ease;
  }
  #replayBtn:hover, #replayBtn:focus-visible { letter-spacing:.45em; background:#E8E2D6; color:#000; outline:none; }

  /* grain + vignette */
  #grain { position:absolute; inset:0; width:100%; height:100%; opacity:.16; mix-blend-mode:overlay; pointer-events:none; }
  #vignette {
    pointer-events:none;
    background:radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 46%, rgba(0,0,0,.62) 100%);
  }

  /* ---------- control strip ---------- */
  #control {
    height:96px; width:100%; max-width:1100px; flex:none;
    display:flex; flex-direction:column; justify-content:center; gap:9px; padding:0 26px;
    opacity:.55; transition:opacity .4s ease;
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  #control:hover, #control:focus-within { opacity:1; }
  #chapters { display:flex; gap:6px; }
  .chap {
    background:none; border:none; color:rgba(232,226,214,.55); cursor:pointer;
    font-size:10px; letter-spacing:.32em; text-transform:uppercase; padding:5px 10px;
    transition:color .3s ease;
  }
  .chap:hover { color:#E8E2D6; }
  .chap.lit { color:#C9A462; }
  #track { position:relative; height:14px; cursor:pointer; touch-action:none; }
  #track::before {
    content:""; position:absolute; left:0; right:0; top:7px; height:1px; background:rgba(232,226,214,.28);
  }
  #progress { position:absolute; left:0; top:7px; height:1px; background:#E8E2D6; width:0; }
  .tick { position:absolute; top:4px; width:1px; height:7px; background:rgba(232,226,214,.45); }
  #playhead {
    position:absolute; top:7px; width:11px; height:11px; margin-left:-5.5px; border-radius:50%;
    background:#E8E2D6; transform:translateY(-5px);
    box-shadow:0 0 10px rgba(232,226,214,.9), 0 0 22px rgba(232,226,214,.5);
  }
  #transport { display:flex; align-items:center; gap:18px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:rgba(232,226,214,.75); }
  #timecode { font-variant-numeric:tabular-nums; min-width:88px; }
  #pauseBtn, #replayBtn2 {
    background:none; border:1px solid rgba(232,226,214,.35); color:#E8E2D6; border-radius:999px;
    padding:5px 16px; cursor:pointer; font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    font-family:inherit; transition:border-color .3s ease;
  }
  #pauseBtn:hover, #replayBtn2:hover { border-color:#E8E2D6; }
  #total { margin-left:auto; color:rgba(232,226,214,.5); }

  @media (prefers-reduced-motion: reduce){
    #replayBtn { transition:none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="layer" data-depth="1.0">
      <div class="fog" id="fogA"></div>
      <div class="fog" id="fogB"></div>
      <div class="fog" id="fogC"></div>
    </div>
    <div class="layer" id="horizonLayer" data-depth="0.5"><div id="horizon"></div></div>
    <div class="layer" id="castLayer" data-depth="0.4">
      <div class="castname" id="cast0"><div class="kicker">starring</div><div class="nm">Maren Solheim</div></div>
      <div class="castname" id="cast1"><div class="kicker">with</div><div class="nm">Adaeze Okonkwo</div></div>
      <div class="castname" id="cast2"><div class="kicker">and</div><div class="nm">Tomasz Wierzbicki</div></div>
      <div class="castname" id="cast3"><div class="kicker">as the Cartographer</div><div class="nm">Juno Castellanos</div></div>
    </div>
    <div class="layer" id="titleBlock" data-depth="0.15">
      <div id="byline">A film by Ilse Varga</div>
      <div id="mainTitle">THE LONG MERIDIAN</div>
      <div id="date">Autumn · MCMXCIX</div>
    </div>
    <div class="layer" id="flare" data-depth="0.6"></div>
    <div class="layer" id="creditsLayer" data-depth="0.55">
      <div id="creditsCol"></div>
    </div>
    <div class="layer" id="endLayer" data-depth="0.3">
      <div id="endLine">The meridian does not end. It only turns back toward the sea.</div>
      <button id="replayBtn">Replay</button>
    </div>
    <canvas id="grain"></canvas>
    <div class="layer" id="vignette" data-depth="0"></div>
  </div>

  <div id="control">
    <div id="chapters">
      <button class="chap" data-ch="0">Dark</button>
      <button class="chap" data-ch="5">Cast</button>
      <button class="chap" data-ch="24">Title</button>
      <button class="chap" data-ch="36">Credits</button>
      <button class="chap" data-ch="66">End</button>
    </div>
    <div id="track" aria-label="Timeline">
      <div id="progress"></div>
      <div id="playhead"></div>
    </div>
    <div id="transport">
      <span id="timecode">00:00</span>
      <button id="pauseBtn">Pause</button>
      <button id="replayBtn2">Replay</button>
      <span id="total">01:12</span>
    </div>
  </div>

<script>
(function(){
"use strict";
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var DURATION = 72;
var CH = [0, 5, 24, 36, 66];   // Dark, Cast, Title, Credits, End
var stage = document.getElementById("stage");
var layers = Array.prototype.slice.call(document.querySelectorAll("#stage .layer"));
var grain = document.getElementById("grain");
var gctx = grain.getContext("2d");

/* ---------- sizing ---------- */
var SW = 0, SH = 0;
function resize(){
  var availH = window.innerHeight - 96 - 24;
  SW = Math.min(window.innerWidth - 16, availH * 2.39);
  SH = SW / 2.39;
  stage.style.width = SW + "px";
  stage.style.height = SH + "px";
  grain.width = Math.max(2, Math.round(SW / 3));
  grain.height = Math.max(2, Math.round(SH / 3));
}
window.addEventListener("resize", resize);
resize();

/* ---------- credits column ---------- */
var creditsCol = document.getElementById("creditsCol");
var CREDITS = [
  ["Casting", "Grete Lindqvist"],
  ["Music", "Aurel Sarnoff"],
  ["Costume Designer", "Petra Almkvist"],
  ["Production Designer", "Henri Osei"],
  ["Editor", "Marta Ciesielska"],
  ["Director of Photography", "Nils Åkerman"],
  ["Executive Producers", "D. Ferreira · S. Bexley"],
  ["Produced by", "Ilse Varga · N. Marchetti"],
  ["Written by", "Ilse Varga"],
  ["Directed by", "Ilse Varga"]
];
var html = "";
CREDITS.forEach(function(c){
  html += '<div class="credit"><div class="role">' + c[0] + '</div><div class="who">' + c[1] + "</div></div>";
});
html += '<div class="credit"><div class="who small">A production of Meridian Pictures · Nordlys Film</div></div>';
creditsCol.innerHTML = html;

/* ---------- helpers ---------- */
function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function bell(t){ return Math.sin(Math.PI * clamp01(t)); }
function seg(t, a, b){ return clamp01((t - a) / (b - a)); }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function fmt(sec){
  sec = Math.max(0, Math.min(DURATION, sec));
  return pad2(Math.floor(sec / 60)) + ":" + pad2(Math.floor(sec % 60));
}

/* ---------- deterministic layer render ---------- */
var castEls = [0,1,2,3].map(function(i){ return document.getElementById("cast" + i); });

function render(t){
  // camera drift: sin/cos translate + breathing zoom scaled by depth
  for (var i = 0; i < layers.length; i++){
    var el = layers[i];
    var depth = +el.dataset.depth;
    var dx = Math.sin(t * 0.21 + i * 1.7) * 4 * depth;
    var dy = Math.cos(t * 0.17 + i * 2.3) * 3 * depth;
    var z = 1 + (0.012 + 0.004 * Math.sin(t * 0.11)) * depth;   // 1.2–1.6%
    if (reduced){ dx = dy = 0; z = 1; }
    el.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) scale(" + z.toFixed(4) + ")";
  }

  // fog: 38–52s alternating drifts, never visibly repeating
  var fogWrap = layers[0];
  fogWrap.children[0].style.transform = "translate(" + (Math.sin(t * 6.283 / 38) * 12) + "%," + (Math.cos(t * 6.283 / 44) * 8) + "%)";
  fogWrap.children[1].style.transform = "translate(" + (Math.cos(t * 6.283 / 52) * 14) + "%," + (Math.sin(t * 6.283 / 40 + 1) * 9) + "%)";
  fogWrap.children[2].style.transform = "translate(" + (Math.sin(t * 6.283 / 46 + 2) * 11) + "%," + (Math.cos(t * 6.283 / 38 + 3) * 7) + "%)";
  var fogOp = (t < 4) ? seg(t, 0, 4) : (t > 69 ? 1 - seg(t, 69, 71) : 1);
  fogWrap.style.opacity = (0.5 * fogOp).toFixed(3);

  // horizon: scales in during cast, fades before credits
  var hIn = seg(t, 6, 9), hOut = 1 - seg(t, 33, 35.5);
  var horizon = document.getElementById("horizon");
  horizon.style.transform = "scaleX(" + easeOutCubic(hIn).toFixed(3) + ")";
  horizon.style.opacity = (clamp01(hIn) * hOut).toFixed(3);

  // cast: four names, each fades up 0.9s, holds 3.2s, fades out
  for (var n = 0; n < 4; n++){
    var start = 5 + n * 4.75;
    var lt = t - start;
    var el = castEls[n], op = 0, ty = 10;
    if (lt >= 0 && lt < 4.75){
      if (lt < 0.9){ var e = easeOutCubic(lt / 0.9); op = e; ty = 10 * (1 - e); }
      else if (lt < 0.9 + 3.2){ op = 1; ty = 0; }
      else { op = 1 - seg(lt, 4.1, 4.75); ty = 0; }
    }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ty.toFixed(1) + "px)";
  }

  // title chapter
  var tb = document.getElementById("titleBlock");
  var titleOp = seg(t, 24, 26.4) * (1 - seg(t, 35, 36.5));
  var inTitle = t >= 24 && t < 36.5;
  tb.style.opacity = titleOp.toFixed(3);
  tb.style.display = (inTitle || titleOp > 0.001) ? "flex" : "none";
  if (inTitle){
    var mt = document.getElementById("mainTitle");
    var ap = seg(t, 24, 27);
    mt.style.filter = "blur(" + (6 * (1 - easeOutCubic(ap))).toFixed(2) + "px)";
    mt.style.letterSpacing = (0.10 + 0.28 * easeOutCubic(seg(t, 24, 29))).toFixed(4) + "em";
    mt.style.backgroundPosition = (100 - 200 * seg(t, 24.6, 34)).toFixed(1) + "% 0";
    document.getElementById("byline").style.opacity = seg(t, 27, 28.5).toFixed(3);
    document.getElementById("date").style.opacity = seg(t, 28.5, 30).toFixed(3);
  }

  // flare streak behind the title
  var fl = document.getElementById("flare");
  var fOp = bell(seg(t, 24, 36)) * (t > 23.5 && t < 36.5 ? 1 : 0);
  var fx = seg(t, 24, 36);                       // 0 → 1 left to right
  fl.style.opacity = fOp.toFixed(3);
  fl.style.transform = "translateX(" + ((-60 + fx * 130)).toFixed(1) + "%) rotate(" + (-4 + 8 * fx).toFixed(2) + "deg)";

  // credits roll
  var cl = document.getElementById("creditsLayer");
  var cOp = seg(t, 36, 37.5) * (1 - seg(t, 64.5, 66));
  cl.style.opacity = cOp.toFixed(3);
  if (cOp > 0.001){
    var roll = seg(t, 37.5, 66);                 // 30 s upward roll
    var travel = SH + creditsCol.offsetHeight;
    creditsCol.style.transform = "translateY(" + (-travel * easeLinearAt(roll)) + "px)";
  }
  function easeLinearAt(x){ return x; }

  // end card
  var endEl = document.getElementById("endLayer");
  var eOp = seg(t, 66, 68.4);
  endEl.style.opacity = eOp.toFixed(3);
  endEl.style.display = eOp > 0.001 ? "flex" : "none";

  // chapters lit
  var chaps = document.querySelectorAll(".chap");
  var current = 0;
  for (var k = CH.length - 1; k >= 0; k--){ if (t >= CH[k]) { current = k; break; } }
  chaps.forEach(function(c, idx){ c.classList.toggle("lit", idx === current); });

  // control strip
  document.getElementById("timecode").textContent = fmt(t) + " / " + fmt(DURATION);
  document.getElementById("progress").style.width = (t / DURATION * 100) + "%";
  document.getElementById("playhead").style.left = (t / DURATION * 100) + "%";
}

/* ---------- grain ---------- */
var grainFrame = 0;
function drawGrain(){
  grainFrame++;
  if (reduced && grainFrame % 4 !== 0) return;
  var w = grain.width, h = grain.height;
  var img = gctx.createImageData(w, h);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4){
    var v = 90 + Math.random() * 120;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 255;
  }
  gctx.putImageData(img, 0, 0);
}

/* ---------- playback clock ---------- */
var t = 0;
var playing = true;
var lastNow = performance.now();
var pausedAtGrain = false;

function tick(now){
  var dt = (now - lastNow) / 1000;
  lastNow = now;
  if (playing){
    t += dt;
    if (t >= DURATION){ t = DURATION; playing = false; updatePauseBtn(); }
  }
  render(t);
  drawGrain();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function updatePauseBtn(){
  document.getElementById("pauseBtn").textContent = playing ? "Pause" : "Play";
}
function togglePlay(){
  if (!playing && t >= DURATION){ t = 0; }
  playing = !playing;
  updatePauseBtn();
}
function seek(sec){
  t = Math.max(0, Math.min(DURATION, sec));
  if (!playing) render(t);
}

/* ---------- controls ---------- */
document.getElementById("pauseBtn").addEventListener("click", togglePlay);
document.getElementById("replayBtn2").addEventListener("click", function(){ t = 0; playing = true; updatePauseBtn(); });
document.getElementById("replayBtn").addEventListener("click", function(){ t = 0; playing = true; updatePauseBtn(); });
document.querySelectorAll(".chap").forEach(function(c){
  c.addEventListener("click", function(){ seek(+c.dataset.ch + 0.01); });
});

var track = document.getElementById("track");
var seeking = false;
function trackSeek(e){
  var r = track.getBoundingClientRect();
  var f = (e.clientX - r.left) / r.width;
  seek(f * DURATION);
}
track.addEventListener("pointerdown", function(e){
  seeking = true; track.setPointerCapture(e.pointerId); trackSeek(e);
});
track.addEventListener("pointermove", function(e){ if (seeking) trackSeek(e); });
track.addEventListener("pointerup", function(){ seeking = false; });

// chapter tick marks
CH.forEach(function(sec){
  if (sec === 0) return;
  var tk = document.createElement("div");
  tk.className = "tick";
  tk.style.left = (sec / DURATION * 100) + "%";
  track.appendChild(tk);
});

window.addEventListener("keydown", function(e){
  if (e.code === "Space"){ e.preventDefault(); togglePlay(); }
  if (e.key === "ArrowRight") seek(t + 2);
  if (e.key === "ArrowLeft") seek(t - 2);
  if (e.key === "r" || e.key === "R"){ t = 0; playing = true; updatePauseBtn(); }
});

render(0);
updatePauseBtn();
})();
</script>
</body>
</html>
