<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wooden Alphabet Blocks — A Tumbling Toy</title>
<style>
  :root{
    --cream1:#fff6e6; --cream2:#fbf3e4; --cream3:#f2dfc4;
    --wood:#4a3323;
    --rounded:ui-rounded,SF Pro Rounded,'Arial Rounded MT Bold','Helvetica Neue',system-ui,sans-serif;
    --red1:#e85c4e; --red2:#c33b30; --blue1:#4a86d6; --blue2:#2a5fa8;
    --yel1:#f6cf4a; --yel2:#e0ad1a; --grn1:#63ad70; --grn2:#3f8a4d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--rounded);background:linear-gradient(180deg,var(--cream1) 0%,var(--cream2) 45%,var(--cream3) 100%)}
  .sun-glow{position:fixed;top:-10%;right:-8%;width:70vmax;height:70vmax;pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,190,140,.5), rgba(255,190,140,0) 70%)}
  .beam{position:fixed;top:-30%;width:22vw;height:180%;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(180deg, rgba(255,220,170,.4), rgba(255,220,170,0));transform:rotate(24deg)}
  .beam.b1{left:12%}.beam.b2{left:34%;transform:rotate(24deg) scaleX(.6);opacity:.7}

  header{position:relative;z-index:10;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
    padding:.9rem 1.2rem}
  .title{display:flex;gap:.1rem;font-weight:800;font-size:1.25rem}
  .title span{cursor:default;display:inline-block;transition:transform .3s cubic-bezier(.3,2,.4,1)}
  .title span:hover{transform:translateY(-6px) rotate(-6deg)}
  .spacer{flex:1}
  .btn{font-family:var(--rounded);font-weight:700;font-size:.78rem;color:#3a2a1c;
    background:#fff3dc;border:3px solid var(--wood);border-radius:12px;padding:.55rem 1rem;
    box-shadow:4px 4px 0 var(--wood);cursor:pointer;transition:all .12s}
  .btn:hover{background:#ffe9c4}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--wood)}
  #wordInput{font-family:var(--rounded);font-weight:700;font-size:.85rem;color:#3a2a1c;
    background:#fff3dc;border:3px solid var(--wood);border-radius:12px;padding:.5rem .8rem;width:11em;
    outline:none;text-transform:uppercase}
  #wordInput:focus{box-shadow:0 0 0 3px rgba(74,51,35,.2)}

  #stage{position:fixed;inset:0;z-index:1;touch-action:none}
  #blocks{position:absolute;inset:0;perspective:1200px}

  /* rug + desk */
  .rug{position:fixed;left:0;right:0;bottom:12vh;height:12vh;z-index:2;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 3px, transparent 3px 8px),
      linear-gradient(180deg,#d9a98a,#c48a6a);
    border:3px dashed rgba(255,255,255,.5);
    box-shadow:inset 0 8px 16px rgba(0,0,0,.12)}
  .desk{position:fixed;left:0;right:0;bottom:0;height:12vh;z-index:3;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 14px),
      linear-gradient(180deg,#a8703f,#7a4b26);
    box-shadow:inset 0 10px 20px rgba(0,0,0,.35), inset 0 -14px 26px rgba(0,0,0,.3)}
  .desk::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(180deg,#c88b52,#a8703f)}
  .floor-line{position:fixed;left:0;right:0;bottom:12vh;height:0;z-index:4}

  /* block */
  .block{position:absolute;width:var(--bs);height:var(--bs);transform-style:preserve-3d;
    will-change:transform;cursor:grab;touch-action:none;z-index:5}
  .block.drag{cursor:grabbing}
  .face{position:absolute;width:var(--bs);height:var(--bs);backface-visibility:hidden;
    background:
      repeating-linear-gradient(45deg, rgba(120,70,20,.07) 0 4px, transparent 4px 12px),
      linear-gradient(135deg,#ecc48d,#d9a86c);
    border-radius:calc(var(--bs)*0.08);
    box-shadow:inset 0 0 0 2px rgba(255,230,190,.5), inset 0 0 calc(var(--bs)*0.14) rgba(120,60,10,.35)}
  .face.top{background:
      repeating-linear-gradient(45deg, rgba(120,70,20,.06) 0 4px, transparent 4px 12px),
      linear-gradient(135deg,#f4d3a0,#e8c086);filter:brightness(1.06)}
  .face.side{filter:brightness(.82)}
  .face.front{display:grid;place-items:center}
  .paint{position:absolute;inset:12%;border-radius:calc(var(--bs)*0.06);
    display:grid;place-items:center;
    box-shadow:inset 0 0 0 3px rgba(255,244,214,.85), inset 0 calc(var(--bs)*0.04) calc(var(--bs)*0.08) rgba(0,0,0,.35)}
  .paint::before{content:"";position:absolute;left:-6%;top:-6%;width:34%;height:34%;pointer-events:none;
    background:linear-gradient(135deg,#e9c38c,#d9a86c);
    clip-path:polygon(0 0,100% 0,0 100%)}
  .letter{position:relative;font-weight:800;font-size:calc(var(--bs)*0.42);color:#fff8e8;
    text-shadow:0 2px 3px rgba(60,20,0,.45);line-height:1}
  .shadow{position:absolute;left:10%;right:10%;bottom:-14%;height:12%;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(80,45,15,.4), rgba(80,45,15,0) 70%);z-index:-1}

  #toast{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%) translateY(140%);z-index:20;
    background:#3a2a1c;color:#fff3dc;font-weight:700;font-size:.8rem;padding:.6rem 1.4rem;border-radius:999px;
    transition:transform .45s cubic-bezier(.3,1.6,.4,1)}
  #toast.show{transform:translateX(-50%) translateY(0)}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="sun-glow"></div>
<div class="beam b1"></div>
<div class="beam b2"></div>

<header>
  <div class="title" id="title"><span style="color:#c33b30">B</span><span style="color:#2a5fa8">L</span><span style="color:#e0ad1a">O</span><span style="color:#3f8a4d">C</span><span style="color:#c33b30">K</span><span style="color:#2a5fa8">S</span></div>
  <div class="spacer"></div>
  <input id="wordInput" maxlength="12" placeholder="spell a word" aria-label="Spell a word">
  <button class="btn" id="spellBtn">Spell it</button>
  <button class="btn" id="shakeBtn">Shake table</button>
  <button class="btn" id="addBtn">+ Block</button>
  <button class="btn" id="tidyBtn">Tidy up</button>
</header>

<div id="stage">
  <div class="rug"></div>
  <div id="blocks"></div>
  <div class="desk"></div>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stage = document.getElementById('blocks');
var BS = Math.max(60, Math.min(96, Math.floor(innerWidth / 16)));
if (innerWidth < 400) BS = 60;

var PAINTS = [
  ['#e85c4e','#c33b30'], ['#4a86d6','#2a5fa8'], ['#f6cf4a','#e0ad1a'], ['#63ad70','#3f8a4d']
];
var paintIdx = 0;
var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

var blocks = []; /* {el, x, y, vx, vy, ang, va, drag} */
var GRAV = 2200, REST = 0.32, FLOOR;

function floorY(){
  return innerHeight - innerHeight * 0.12; /* desk top */
}
function toXY(el){
  /* blocks positioned by center */
}
function makeBlock(letter){
  var el = document.createElement('div');
  el.className = 'block';
  var p = PAINTS[paintIdx % PAINTS.length]; paintIdx++;
  var half = BS / 2, halfPx = half + 'px';
  var faces = '';
  var mk = function(cls, transform, extra){
    return '<div class="face ' + cls + '" style="transform:' + transform + '">' + (extra || '') + '</div>';
  };
  var paintHTML = '<div class="paint" style="background:linear-gradient(160deg,' + p[0] + ',' + p[1] + ')"><span class="letter">' + letter + '</span></div>';
  faces += mk('front', 'translateZ(' + halfPx + ')', paintHTML);
  faces += mk('back', 'rotateY(180deg) translateZ(' + halfPx + ')', '');
  faces += mk('side right', 'rotateY(90deg) translateZ(' + halfPx + ')', '');
  faces += mk('side left', 'rotateY(-90deg) translateZ(' + halfPx + ')', '');
  faces += mk('side top', 'rotateX(90deg) translateZ(' + halfPx + ')', '');
  faces += mk('side', 'rotateX(-90deg) translateZ(' + halfPx + ')', '');
  el.innerHTML = faces + '<div class="shadow"></div>';
  stage.appendChild(el);
  return { el: el, x: 0, y: 0, vx: 0, vy: 0, ang: (Math.random() * 8 - 4), va: 0, drag: false, letter: letter };
}

function updateTransforms(){
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var depthScale = 1 + (b.y / innerHeight) * 0.06;
    b.el.style.transform = 'translate(' + (b.x - BS / 2) + 'px,' + (b.y - BS / 2) + 'px)' +
      ' rotate(' + b.ang + 'deg)' +
      ' scale(' + depthScale.toFixed(3) + ')' +
      ' rotateX(16deg) rotateY(14deg)';
  }
}

/* physics */
function physics(dt){
  FLOOR = floorY();
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    if (b.drag) { b.vx = 0; b.vy = 0; continue; }
    b.vy += GRAV * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.ang += b.va * dt;
    /* spring upright */
    var spring = -b.ang * 6 - b.va * 2.4;
    b.va += spring * dt;
    /* walls */
    var lo = BS * 0.28;
    if (b.x < lo) { b.x = lo; b.vx = -b.vx * REST; b.va *= 0.6; }
    if (b.x > innerWidth - lo) { b.x = innerWidth - lo; b.vx = -b.vx * REST; b.va *= 0.6; }
    /* floor */
    if (b.y > FLOOR - BS * 0.35) {
      b.y = FLOOR - BS * 0.35;
      if (b.vy > 40) { b.va += (Math.random() - 0.5) * Math.min(8, b.vy * 0.02); }
      b.vy = -b.vy * REST;
      if (Math.abs(b.vy) < 30) b.vy = 0;
      b.vx *= 0.94; b.va *= 0.92;
      if (Math.abs(b.ang) < 1 && Math.abs(b.va) < 1) { b.ang = 0; b.va = 0; }
    }
  }
  /* block-block relaxation x3 */
  for (var pass = 0; pass < 3; pass++) {
    for (var i = 0; i < blocks.length; i++) {
      for (var j = i + 1; j < blocks.length; j++) {
        var a = blocks[i], c = blocks[j];
        var dx = c.x - a.x, dy = c.y - a.y;
        var ox = BS - Math.abs(dx), oy = BS - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (a.drag) { resolve(c, -dx, -dy, ox, oy); }
          else if (c.drag) { resolve(a, dx, dy, ox, oy); }
          else {
            var hx = ox / 2, hy = oy / 2;
            if (ox < oy) { /* separate x */
              var sx = dx >= 0 ? hx : -hx;
              a.x -= sx; c.x += sx;
              a.vx = -a.vx * REST * 0.5; c.vx = -c.vx * REST * 0.5;
            } else {
              var sy = dy >= 0 ? hy : -hy;
              a.y -= sy; c.y += sy;
              var t = a.vy; a.vy = c.vy * REST; c.vy = t * REST;
              a.va += (Math.random() - 0.5) * 3; c.va += (Math.random() - 0.5) * 3;
            }
          }
        }
      }
    }
  }
  function resolve(b, dx, dy, ox, oy){
    if (ox < oy) { b.x += (dx >= 0 ? ox : -ox); b.vx = -b.vx * REST; }
    else { b.y += (dy >= 0 ? oy : -oy); b.vy = 0; }
  }
  updateTransforms();
}

/* main loop */
var last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  physics(dt);
}
requestAnimationFrame(loop);

/* dragging */
var drag = null, lastPt = null, lastVel = { x: 0, y: 0 };
stage.addEventListener('pointerdown', function(e){
  var el = e.target.closest('.block');
  if (!el) return;
  var b = null;
  for (var i = 0; i < blocks.length; i++) if (blocks[i].el === el) b = blocks[i];
  if (!b) return;
  b.drag = true; el.classList.add('drag');
  drag = b; lastPt = { x: e.clientX, y: e.clientY };
  el.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', function(e){
  if (!drag || !lastPt) return;
  var dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
  lastVel = { x: dx * 60, y: dy * 60 };
  drag.x += dx; drag.y += dy;
  drag.ang += dx * 0.12;
  lastPt = { x: e.clientX, y: e.clientY };
  updateTransforms();
});
function endDrag(){
  if (!drag) return;
  drag.drag = false;
  drag.vx = Math.max(-1400, Math.min(1400, lastVel.x));
  drag.vy = Math.max(-1400, Math.min(1400, lastVel.y));
  drag.el.classList.remove('drag');
  drag = null; lastPt = null;
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* toast */
var toast = document.getElementById('toast'), tTimer;
function showToast(m){
  toast.textContent = m;
  toast.classList.add('show');
  clearTimeout(tTimer);
  tTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
}

/* spawn */
function spawnBlock(letter, x, drop){
  var b = makeBlock(letter || LETTERS[Math.floor(Math.random() * 26)]);
  b.x = x != null ? x : innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.5;
  b.y = drop ? -BS : Math.max(BS, innerHeight * 0.4);
  if (x == null) b.x = Math.max(BS * 0.4, Math.min(innerWidth - BS * 0.4, b.x));
  updateTransforms();
  return b;
}

/* spell */
document.getElementById('spellBtn').addEventListener('click', spell);
document.getElementById('wordInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') spell();
});
var spellQueue = [];
function spell(){
  var w = (document.getElementById('wordInput').value || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!w) { showToast('Type some letters first!'); return; }
  if (w.length > 12) w = w.slice(0, 12);
  var n = w.length, startX = innerWidth / 2 - (n - 1) * BS * 0.62;
  for (var i = 0; i < n; i++) {
    (function(letter, xx){
      setTimeout(function(){
        spawnBlock(letter, xx, true);
      }, reduced ? 0 : i * 110);
    })(w[i], startX + i * BS * 1.24);
  }
  showToast('Dropping "' + w + '"!');
}
/* + block */
document.getElementById('addBtn').addEventListener('click', function(){
  spawnBlock(null, null, true);
  showToast('One more block!');
});
/* shake */
function shakeTable(){
  if (!blocks.length) { showToast('Nothing to shake!'); return; }
  blocks.forEach(function(b){
    b.vy -= 500 + Math.random() * 500;
    b.vx += (Math.random() - 0.5) * 900;
    b.va += (Math.random() - 0.5) * 14;
  });
  if (!reduced && stage.animate) {
    stage.animate(
      [{ transform: 'translate(0,0)' },
       { transform: 'translate(-8px,4px) rotate(-.4deg)' },
       { transform: 'translate(7px,-3px) rotate(.4deg)' },
       { transform: 'translate(-4px,2px)' },
       { transform: 'translate(0,0)' }],
      { duration: 420, easing: 'ease-out' });
  }
  showToast('Wobble wobble!');
}
document.getElementById('shakeBtn').addEventListener('click', shakeTable);
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); shakeTable(); }
});
/* tidy */
document.getElementById('tidyBtn').addEventListener('click', function(){
  blocks.forEach(function(b){
    b.el.style.transition = 'opacity .5s';
    b.el.style.opacity = '0';
  });
  var old = blocks.slice();
  blocks.length = 0;
  setTimeout(function(){ old.forEach(function(b){ b.el.remove(); }); }, 520);
  showToast('All tidy!');
});

/* welcome blocks */
spawnBlock('A', innerWidth * 0.38, false);
spawnBlock('B', innerWidth * 0.5, false);
spawnBlock('C', innerWidth * 0.62, false);
})();
</script>
</body>
</html>
