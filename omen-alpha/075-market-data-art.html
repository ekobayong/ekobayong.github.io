<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurum Exchange — Market Data as Abstract Art</title>
<style>
  :root{
    --obsidian:#07080a; --footer:#0c0e12; --mint:#2ee59d; --rose:#ff5c7a; --gold:#d4af37;
    --t1:rgba(232,230,223,1); --t2:rgba(232,230,223,.66); --t3:rgba(232,230,223,.4);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--obsidian);color:var(--t1);overflow:hidden;
    font-family:ui-sans-serif,system-ui,'Helvetica Neue',Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column}
  #sonar{position:fixed;inset:0;z-index:0}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:3px 3px}

  header{position:relative;z-index:2;display:flex;align-items:center;gap:1.4rem;
    padding:.7rem 1.4rem;border-bottom:1px solid rgba(212,175,55,.22);flex-wrap:wrap}
  .wordmark{font-weight:300;letter-spacing:.42em;text-transform:uppercase;font-size:.95rem}
  .wordmark b{font-weight:600}
  .sub{font-size:.68rem;letter-spacing:.16em;color:var(--t3);text-transform:uppercase}
  .tframe{display:flex;gap:4px;border:1px solid rgba(212,175,55,.3);border-radius:999px;padding:3px}
  .tframe button{background:transparent;border:0;color:var(--t3);cursor:pointer;
    font-family:var(--mono);font-size:.68rem;padding:.3rem .8rem;border-radius:999px;transition:.2s}
  .tframe button.on{background:rgba(212,175,55,.16);color:var(--gold)}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:.72rem;color:var(--t2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);
    animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.3}}

  main{position:relative;z-index:2;flex:1;display:grid;
    grid-template-columns:2fr 1fr;grid-template-rows:1fr;gap:.9rem;padding:.9rem 1.4rem;min-height:0}
  .col{display:flex;flex-direction:column;gap:.9rem;min-height:0}

  .panel{position:relative;background:rgba(10,12,16,.72);border:1px solid rgba(212,175,55,.22);
    border-radius:10px;padding:.9rem 1.1rem;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(212,175,55,.65),transparent)}
  .panel h2{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--t3);margin-bottom:.7rem}
  .panel canvas{flex:1;min-height:0;width:100%}

  .stats{display:flex;gap:2rem;flex-wrap:wrap;align-items:baseline;margin-bottom:.5rem}
  .stat .k{font-size:10px;letter-spacing:.24em;color:var(--t3)}
  #last{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:300;
    font-size:34px;text-shadow:0 0 14px rgba(212,175,55,.28)}
  #chg{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--t2)}
  .up{color:var(--mint)}.dn{color:var(--rose)}

  footer{position:relative;z-index:2;height:38px;background:var(--footer);
    border-top:1px solid rgba(212,175,55,.22);overflow:hidden;display:flex;align-items:center}
  #tape{display:flex;gap:2.4rem;white-space:nowrap;will-change:transform;animation:tape 48s linear infinite}
  footer:hover #tape{animation-play-state:paused}
  @keyframes tape{to{transform:translateX(-50%)}}
  footer::before,footer::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:3;pointer-events:none}
  footer::before{left:0;background:linear-gradient(90deg,var(--footer),transparent)}
  footer::after{right:0;background:linear-gradient(-90deg,var(--footer),transparent)}
  .tick{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.74rem;color:var(--t2);display:flex;gap:.5rem}
  .tick .sym{color:var(--t1);letter-spacing:.06em}
  .tick .arrow{font-size:.66rem}

  @media(max-width:900px){
    body{overflow:auto}
    main{grid-template-columns:1fr;grid-template-rows:auto}
    .price-panel{min-height:460px}
    .col .panel{min-height:240px}
  }
</style>
</head>
<body>
<canvas id="sonar"></canvas>
<div class="grain"></div>

<header>
  <div class="wordmark"><b>AURUM</b> Exchange</div>
  <div class="sub">Synthetic feed · AUR/USD</div>
  <div class="tframe" id="tframe">
    <button data-t="60" class="on">1m</button><button data-t="300">5m</button><button data-t="3600">1h</button>
  </div>
  <div class="spacer"></div>
  <div class="live"><span class="dot"></span><span id="clock">00:00:00</span></div>
</header>

<main>
  <section class="panel price-panel">
    <div class="stats">
      <div class="stat"><div class="k">LAST</div><div id="last">1240.00</div></div>
      <div class="stat"><div class="k">CHANGE</div><div id="chg">+0.00</div></div>
      <div class="stat"><div class="k">HIGH</div><div class="v" id="hi">—</div></div>
      <div class="stat"><div class="k">LOW</div><div class="v" id="lo">—</div></div>
      <div class="stat"><div class="k">VOLATILITY / H</div><div class="v" id="vol">—</div></div>
    </div>
    <canvas id="chart"></canvas>
  </section>
  <div class="col">
    <section class="panel" style="flex:1">
      <h2>Depth of market</h2>
      <canvas id="dom"></canvas>
    </section>
    <section class="panel" id="heat">
      <h2>Sector heat</h2>
      <div id="sectors" style="position:relative;flex:1;min-height:150px"></div>
    </section>
  </div>
</main>

<footer><div id="tape"></div></footer>

<script>
(function(){
'use strict';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var TICK_MS = reduced ? 360 : 130;

/* GARCH simulation */
var price = 1240, sigma = 0.0009, omega = 2.2e-7, alpha = 0.06, beta = 0.92;
var ticks = [];
var SIM_MIN = 7.5; /* seconds simulated per tick */
var HISTORY = 32000;
(function pregen(){
  var p = 1240;
  for (var i = 0; i < HISTORY; i++) {
    var r = gauss() * sigma + (1240 - p) * 0.000004;
    sigma = Math.sqrt(omega + alpha * r * r + beta * sigma * sigma);
    p = Math.max(900, p * (1 + r));
    ticks.push(p);
  }
  price = p;
})();
function gauss(){
  var u = Math.random() || 1e-9, v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* candles */
var buckets = null, bucketTf = 60, bucketN = 0;
function buildBuckets(tf){
  var out = [];
  var start = -1;
  for (var i = 0; i < ticks.length; i++) {
    var b = Math.floor(i * SIM_MIN / tf);
    if (b !== start) { out.push({ o:ticks[i], h:ticks[i], l:ticks[i], c:ticks[i], n:1, t:b }); start = b; }
    else { var cd = out[out.length - 1]; cd.h = Math.max(cd.h, ticks[i]); cd.l = Math.min(cd.l, ticks[i]); cd.c = ticks[i]; cd.n++; }
  }
  return out;
}
function candles(tf){
  if (!buckets || bucketTf !== tf || bucketN !== ticks.length) {
    buckets = buildBuckets(tf); bucketTf = tf; bucketN = ticks.length;
  }
  return buckets;
}

/* sonar */
var sonar = document.getElementById('sonar'), sctx = sonar.getContext('2d');
var rings = [];
var dpr1 = 1;
function sizeSonar(){
  dpr1 = Math.min(window.devicePixelRatio || 1, 2);
  sonar.width = innerWidth * dpr1; sonar.height = innerHeight * dpr1;
  sonar.style.width = innerWidth + 'px'; sonar.style.height = innerHeight + 'px';
  sctx.setTransform(dpr1, 0, 0, dpr1, 0, 0);
}
sizeSonar(); window.addEventListener('resize', sizeSonar);
function spawnRing(up, mag){
  rings.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: 2, max: 14 + Math.min(90, mag * 260), up: up, a: 0.16, echo: 0
  });
  if (rings.length > 130) rings.shift();
}
function drawSonar(){
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (var i = rings.length - 1; i >= 0; i--) {
    var g = rings[i];
    g.r += g.max * 0.012; g.echo += g.max * 0.012;
    g.a *= 0.985;
    if (g.a < 0.004) { rings.splice(i, 1); continue; }
    sctx.strokeStyle = g.up ? 'rgba(46,229,157,' + g.a + ')' : 'rgba(255,92,122,' + g.a + ')';
    sctx.lineWidth = 1;
    sctx.beginPath(); sctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); sctx.stroke();
    if (g.echo < g.r) {
      sctx.beginPath(); sctx.arc(g.x, g.y, g.echo * 0.6, 0, Math.PI * 2); sctx.stroke();
    }
  }
}

/* chart */
var chart = document.getElementById('chart'), cctx = chart.getContext('2d');
function sizeCanvas(cv){
  var r = cv.getBoundingClientRect();
  var d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(10, r.width * d); cv.height = Math.max(10, r.height * d);
  cv.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  return { w: r.width, h: r.height };
}
var niceSteps = [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500];
function drawChart(tf){
  var s = sizeCanvas(chart);
  var W = s.w, H = s.h;
  cctx.clearRect(0, 0, W, H);
  var cs = candles(tf);
  var maxCandles = Math.max(20, Math.floor(W / 7));
  cs = cs.slice(-maxCandles);
  if (cs.length < 2) return;
  var hi = -1e9, lo = 1e9, maxVol = 0;
  cs.forEach(function(c){ hi = Math.max(hi, c.h); lo = Math.min(lo, c.l); maxVol = Math.max(maxVol, c.n); });
  var pad = (hi - lo) * 0.08 + 0.5;
  hi += pad; lo -= pad;
  var volH = Math.min(42, H * 0.14), chartH = H - volH - 14;
  var y = function(p){ return chartH - (p - lo) / (hi - lo) * chartH + 4; };
  var slot = W / cs.length;

  /* gold hairlines */
  var range = hi - lo;
  var step = 10;
  for (var i = 0; i < niceSteps.length; i++) { step = niceSteps[i]; if (range / step <= 8) break; }
  var first = Math.ceil(lo / step) * step;
  cctx.font = '10px ' + getComputedStyle(document.body).getPropertyValue('--mono');
  for (var p = first; p < hi; p += step) {
    var yy = y(p);
    cctx.strokeStyle = 'rgba(212,175,55,.14)'; cctx.lineWidth = 1;
    cctx.beginPath(); cctx.moveTo(0, yy); cctx.lineTo(W - 44, yy); cctx.stroke();
    cctx.fillStyle = 'rgba(232,230,223,.4)';
    cctx.textAlign = 'right';
    cctx.fillText(p.toFixed(1), W - 4, yy + 3);
  }

  /* time marks */
  var n = cs.length;
  cctx.textAlign = 'center';
  cctx.fillStyle = 'rgba(232,230,223,.3)';
  var marks = [[Math.round(n * 0.5), '-' + Math.round(n * 0.5 * tf / 60) + 'm'], [n - 1, 'now']];
  marks.forEach(function(m){
    cctx.fillText(m[1], m[0] * slot + slot / 2, H - 2);
  });

  /* candles */
  cs.forEach(function(c, i){
    var x = i * slot + slot / 2;
    var up = c.c >= c.o;
    var col = up ? '#2ee59d' : '#ff5c7a';
    cctx.strokeStyle = col; cctx.lineWidth = 1;
    cctx.beginPath(); cctx.moveTo(x, y(c.h)); cctx.lineTo(x, y(c.l)); cctx.stroke();
    var bw = Math.max(1, slot * 0.55);
    var yo = y(c.o), yc = y(c.c);
    var top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yc - yo));
    if (up) { cctx.strokeRect(x - bw / 2, top, bw, hgt); }
    else { cctx.fillStyle = col; cctx.fillRect(x - bw / 2, top, bw, hgt); }
    if (i === cs.length - 1) {
      cctx.save();
      cctx.shadowColor = col; cctx.shadowBlur = 18;
      cctx.strokeRect(x - bw / 2, top, bw, hgt);
      cctx.restore();
      var pulse = 3 + Math.sin(performance.now() / 300) * 1.2;
      cctx.fillStyle = col;
      cctx.beginPath(); cctx.arc(x, yc, pulse, 0, Math.PI * 2); cctx.fill();
    }
    /* volume */
    var vh = (c.n / maxVol) * volH;
    cctx.fillStyle = up ? 'rgba(46,229,157,.16)' : 'rgba(255,92,122,.16)';
    cctx.fillRect(x - bw / 2, H - 12 - vh, bw, vh);
  });

  /* current price line */
  var lastP = ticks[ticks.length - 1];
  var ly = y(lastP);
  cctx.strokeStyle = 'rgba(212,175,55,.5)';
  cctx.setLineDash([4, 4]);
  cctx.beginPath(); cctx.moveTo(0, ly); cctx.lineTo(W - 44, ly); cctx.stroke();
  cctx.setLineDash([]);
  var upLast = ticks.length > 1 && lastP >= ticks[ticks.length - 2];
  cctx.fillStyle = upLast ? '#2ee59d' : '#ff5c7a';
  cctx.fillRect(W - 44, ly - 8, 44, 16);
  cctx.fillStyle = '#07080a';
  cctx.textAlign = 'left';
  cctx.fillText(lastP.toFixed(1), W - 42, ly + 3.5);

  /* global stats DOM */
  var lastEl = document.getElementById('last');
  lastEl.textContent = lastP.toFixed(2);
  var day = cs.slice(-Math.max(2, Math.round(3600 / tf)));
  var ref = day[0].o;
  var chg = lastP - ref;
  var chgEl = document.getElementById('chg');
  chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + ' (' + (chg / ref * 100).toFixed(2) + '%)';
  chgEl.className = chg >= 0 ? 'up' : 'dn';
  document.getElementById('hi').textContent = Math.max.apply(null, cs.map(function(c){ return c.h; })).toFixed(2);
  document.getElementById('lo').textContent = Math.min.apply(null, cs.map(function(c){ return c.l; })).toFixed(2);
  document.getElementById('vol').textContent = (sigma * Math.sqrt(3600 / SIM_MIN) * 100).toFixed(2) + '%';
}

/* DOM panel */
var dom = document.getElementById('dom'), dctx = dom.getContext('2d');
var bids = [], asks = [];
for (var i = 0; i < 22; i++) { bids.push(0.4 + Math.random() * 0.6); asks.push(0.4 + Math.random() * 0.6); }
function drawDOM(now){
  var s = sizeCanvas(dom);
  var W = s.w, H = s.h;
  dctx.clearRect(0, 0, W, H);
  var rows = 22, rowH = H / rows;
  var breathe = 1 + Math.sin(now / 2400) * 0.08;
  var cx = W / 2;
  dctx.strokeStyle = 'rgba(212,175,55,.4)'; dctx.lineWidth = 1;
  dctx.beginPath(); dctx.moveTo(cx, 0); dctx.lineTo(cx, H); dctx.stroke();
  for (var i = 0; i < rows; i++) {
    var bw = bids[i] * (W / 2 - 30) * breathe;
    var aw = asks[i] * (W / 2 - 30) * breathe;
    var gB = dctx.createLinearGradient(cx - bw, 0, cx, 0);
    gB.addColorStop(0, 'rgba(46,229,157,.05)'); gB.addColorStop(1, 'rgba(46,229,157,.7)');
    dctx.fillStyle = gB;
    dctx.fillRect(cx - bw, i * rowH + 1, bw, rowH - 3);
    var gA = dctx.createLinearGradient(cx, 0, cx + aw, 0);
    gA.addColorStop(0, 'rgba(255,92,122,.05)'); gA.addColorStop(1, 'rgba(255,92,122,.7)');
    dctx.fillStyle = gA;
    dctx.fillRect(cx + 1, i * rowH + 1, aw, rowH - 3);
    if (i % 4 === 0) {
      dctx.fillStyle = 'rgba(232,230,223,.35)';
      dctx.font = '9px ' + getComputedStyle(document.body).getPropertyValue('--mono');
      dctx.textAlign = 'center';
      dctx.fillText((1240 - i * 0.5).toFixed(1), cx, i * rowH + rowH - 2);
    }
  }
}

/* sector treemap */
var SECTORS = ['Photonics','Orbital Freight','Synthetic Biology','Desalination','Fusion Utilities','Quantum Fabs','Vertical Farms','Cartography','Cold Storage','Lunar Leisure','Textiles','Timber'];
var secW = SECTORS.map(function(){ return 0.3 + Math.random() * 0.7; });
var secEls = [];
var heatBox = document.getElementById('sectors');
(function buildHeat(){
  var total = secW.reduce(function(a, b){ return a + b; }, 0);
  var cols = [0, 1, 2].map(function(){ return { w: 0, items: [] }; });
  var ci = 0;
  for (var i = 0; i < 12; i++) {
    var c = cols[i % 3];
    c.w += secW[i] / total; c.items.push(i);
  }
  var xoff = 0;
  cols.forEach(function(c){
    var wPct = c.w / 3;
    var yoff = 0;
    var colTotal = c.items.reduce(function(a, i2){ return a + secW[i2]; }, 0);
    c.items.forEach(function(i2){
      var hPct = secW[i2] / colTotal;
      var d = document.createElement('div');
      d.style.cssText = 'position:absolute;left:' + (xoff * 100) + '%;top:' + (yoff * 100) +
        '%;width:' + (wPct * 100 - 0.4) + '%;height:' + (hPct * 100 - 0.4) +
        '%;border-radius:5px;transition:background 1.2s ease,color 1.2s ease;cursor:default;' +
        'display:flex;align-items:flex-end;padding:6px 8px;font-size:.66rem;overflow:hidden;box-sizing:border-box;' +
        'font-family:ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em';
      d.textContent = SECTORS[i2];
      d.addEventListener('mouseenter', function(){ d.style.outline = '1px solid #d4af37'; d.style.transform = 'scale(1.02)'; });
      d.addEventListener('mouseleave', function(){ d.style.outline = 'none'; d.style.transform = ''; });
      heatBox.appendChild(d);
      secEls.push({ el: d, w: secW[i2] });
      yoff += hPct;
    });
    xoff += wPct;
  });
})();
function paintSectors(){
  secEls.forEach(function(s, i){
    var pct = secW[i];
    var up = pct >= 0.5;
    var a = Math.min(0.85, Math.abs(pct - 0.5) * 2.2);
    var col = up ? '46,229,157' : '255,92,122';
    s.el.style.background = 'rgba(' + col + ',' + a.toFixed(2) + ')';
    s.el.style.color = a > 0.42 ? '#07080a' : 'rgba(232,230,223,.8)';
  });
}
paintSectors();

/* ticker tape */
var SYMBOLS = ['AUR','PHTN','ORBF','SYNB','DSAL','FUSN','QFAB','VFRM','CART','COLD','LUNA','TXTL','TMBR','HELX','MIRA','ZEPH'];
var symPrices = {}, tape = document.getElementById('tape');
SYMBOLS.forEach(function(s2){ symPrices[s2] = { p: 20 + Math.random() * 380, ref: 0 }; SYMBOLS.forEach(function(k){ symPrices[k].ref = symPrices[k].p; }); });
function buildTape(){
  tape.innerHTML = '';
  for (var dup = 0; dup < 2; dup++) {
    SYMBOLS.forEach(function(sym){
      var d = document.createElement('span');
      d.className = 'tick'; d.dataset.sym = sym;
      d.innerHTML = '<span class="sym">' + sym + '</span><span class="pr"></span><span class="arrow"></span>';
      tape.appendChild(d);
    });
  }
  updateTape();
}
function updateTape(){
  Array.prototype.forEach.call(tape.children, function(d){
    var sym = d.dataset.sym, s2 = symPrices[sym];
    var chg = s2.p - s2.ref;
    d.querySelector('.pr').textContent = s2.p.toFixed(2);
    var a = d.querySelector('.arrow');
    a.textContent = chg >= 0 ? '▲' : '▼';
    a.className = 'arrow ' + (chg >= 0 ? 'up' : 'dn');
  });
}
buildTape();

/* timeframe buttons */
var tf = 60;
Array.prototype.forEach.call(document.querySelectorAll('#tframe button'), function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#tframe button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    tf = +b.dataset.t;
    buckets = null;
  });
});

/* clock */
setInterval(function(){
  var d = new Date();
  document.getElementById('clock').textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(function(n){ return String(n).padStart(2, '0'); }).join(':');
}, 1000);

/* tick engine */
setInterval(function(){
  var r = gauss() * sigma + (1240 - price) * 0.000004;
  sigma = Math.sqrt(omega + alpha * r * r + beta * sigma * sigma);
  var prev = price;
  price = Math.max(900, price * (1 + r));
  ticks.push(price);
  if (ticks.length > 34000) { ticks.splice(0, 1000); bucketN = -1; }
  var up = price >= prev;
  var mag = Math.abs(r);
  spawnRing(up, mag);
  /* sympathy nudges */
  var si = Math.floor(Math.random() * 12);
  secW[si] = Math.max(0.05, Math.min(0.95, secW[si] + (up ? 1 : -1) * mag * 40));
  paintSectors();
  var sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
  symPrices[sym].p = Math.max(1, symPrices[sym].p * (1 + (up ? 1 : -1) * mag * 6));
  updateTape();
}, TICK_MS);

/* render loop */
function render(now){
  requestAnimationFrame(render);
  drawSonar();
  drawChart(tf);
  drawDOM(now);
}
requestAnimationFrame(render);
})();
</script>
</body>
</html>
