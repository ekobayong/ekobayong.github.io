<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Keeper's Light — A Lighthouse in a Night Storm</title>
<style>
  :root{ --storm: 0.55; --lampdeg: 0deg; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:#050a14;font-family:'Iowan Old Style',Georgia,Palatino,serif;color:#dfe7ef}

  .sky{position:fixed;inset:0;
    background:linear-gradient(180deg,#050a14 0%,#0b1a30 55%,#12314a 100%)}
  .moon{position:fixed;top:8%;right:12%;width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #e9f1f7, #b9c8d4 55%, #8fa2b1);
    box-shadow:0 0 70px 24px rgba(190,210,230,.25), 0 0 160px 60px rgba(160,190,220,.12)}
  .clouds-far,.clouds-near{position:fixed;left:-10%;width:120%;top:0;pointer-events:none}
  .clouds-far{top:0;animation:driftFar 120s linear infinite}
  .clouds-near{top:4%;animation:driftNear 70s linear infinite}
  @keyframes driftFar{to{transform:translateX(10%)}}
  @keyframes driftNear{to{transform:translateX(-12%)}}

  #scene{position:fixed;inset:0;z-index:2;cursor:crosshair}
  #scene svg.ground{position:absolute;inset:0;width:100%;height:100%}
  .sea-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* beam anchored */
  #beamLayer{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
  .beam-arm{position:absolute;width:0;height:0}
  .wedge{position:absolute;left:0;top:0;width:240vmax;height:240vmax;transform-origin:0 0;
    mix-blend-mode:screen}
  .wedge.w1{background:conic-gradient(from -8deg, rgba(255,217,138,0) 0deg, rgba(255,217,138,.42) 8deg, rgba(255,217,138,0) 16deg);
    filter:blur(14px)}
  .wedge.w2{background:conic-gradient(from -20deg, rgba(255,183,71,0) 0deg, rgba(255,183,71,.14) 20deg, rgba(255,183,71,0) 40deg);
    filter:blur(30px)}
  .lamp-glow{position:absolute;width:22vmin;height:22vmin;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(255,217,138,.7), rgba(255,179,71,.25) 55%, rgba(255,179,71,0) 75%);
    mix-blend-mode:screen;animation:lampPulse 3.2s ease-in-out infinite}
  @keyframes lampPulse{50%{opacity:.6;transform:scale(.92)}}

  #rain{position:fixed;inset:0;z-index:5;pointer-events:none}

  #flash{position:fixed;inset:0;z-index:8;pointer-events:none;background:#cfe0ff;opacity:0}
  #frameGlow{position:fixed;inset:0;z-index:7;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(200,220,255,0);transition:box-shadow .2s}
  #scene.shake{animation:quake .55s ease-out}
  @keyframes quake{
    0%,100%{transform:translate(0,0)}
    15%{transform:translate(-10px,6px)}
    30%{transform:translate(9px,-7px)}
    45%{transform:translate(-7px,4px)}
    60%{transform:translate(6px,-3px)}
    80%{transform:translate(-3px,2px)}
  }

  /* UI */
  .title-card{position:fixed;top:2.4rem;left:2.4rem;z-index:10;pointer-events:none;max-width:420px}
  .title-card h1{font-weight:400;font-size:clamp(1.6rem,3.4vw,2.6rem);color:#eef3f8;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .title-card h1 em{color:#ffd98a;font-style:italic}
  .title-card p{font-style:italic;font-size:.95rem;opacity:.75;margin-top:.4rem;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  #log{position:fixed;left:2.4rem;bottom:2.2rem;z-index:10;font-style:italic;font-size:.9rem;
    opacity:.8;max-width:44ch;text-shadow:0 1px 8px rgba(0,0,0,.7)}

  .panel{position:fixed;right:2.2rem;bottom:2.2rem;z-index:10;width:280px;
    background:rgba(5,12,24,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:1.1rem 1.2rem}
  .panel h2{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;font-family:Georgia,serif;
    font-weight:400;opacity:.75;margin-bottom:.8rem}
  #stormSlider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline:none;
    background:linear-gradient(90deg,#1e6a7a,#cfe4ea);cursor:pointer}
  #stormSlider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9b0,#c9962e 60%,#7a5a14);
    box-shadow:0 0 10px rgba(255,217,138,.8)}
  #stormSlider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:0;
    background:radial-gradient(circle at 35% 30%,#ffe9b0,#c9962e 60%,#7a5a14);
    box-shadow:0 0 10px rgba(255,217,138,.8)}
  .scale{display:flex;justify-content:space-between;font-size:.62rem;opacity:.55;margin-top:.3rem}
  .readouts{display:flex;gap:1rem;margin-top:.9rem;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;font-size:.72rem}
  .readouts div{flex:1}
  .readouts .k{font-size:.58rem;letter-spacing:.2em;opacity:.55}
  .readouts .v{color:#ffd98a;font-size:.85rem;margin-top:.15rem}

  @media(prefers-reduced-motion:reduce){
    .clouds-far,.clouds-near{animation:none}
    .wedge{animation:none!important}
    .lamp-glow{animation:none}
    #scene.shake{animation:none}
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="moon"></div>
<svg class="clouds-far" viewBox="0 0 1600 400" style="height:44vh" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <g fill="#1a2c44" filter="url(#cfar)">
    <ellipse cx="200" cy="90" rx="300" ry="60"/><ellipse cx="700" cy="60" rx="380" ry="70"/>
    <ellipse cx="1200" cy="100" rx="340" ry="66"/><ellipse cx="1550" cy="60" rx="300" ry="60"/>
    <ellipse cx="450" cy="160" rx="320" ry="54"/><ellipse cx="1000" cy="180" rx="360" ry="56"/>
  </g>
  <defs><filter id="cfar" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="cnear" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="30"/></filter></defs>
</svg>
<svg class="clouds-near" viewBox="0 0 1600 420" style="height:46vh" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <g fill="#0f1d30" filter="url(#cnear)">
    <ellipse cx="150" cy="110" rx="360" ry="70"/><ellipse cx="640" cy="80" rx="420" ry="80"/>
    <ellipse cx="1150" cy="120" rx="380" ry="74"/><ellipse cx="1520" cy="90" rx="320" ry="66"/>
    <ellipse cx="400" cy="200" rx="380" ry="60"/><ellipse cx="900" cy="230" rx="420" ry="64"/>
  </g>
</svg>

<div id="scene">
  <svg class="ground" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="rockG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1d2632"/><stop offset="1" stop-color="#070b12"/>
      </linearGradient>
      <linearGradient id="towerG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6c7480"/><stop offset="0.35" stop-color="#e8ebef"/>
        <stop offset="0.7" stop-color="#b3bac4"/><stop offset="1" stop-color="#4c535d"/>
      </linearGradient>
      <linearGradient id="seaG1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#10384a"/><stop offset="1" stop-color="#0a2a3a"/>
      </linearGradient>
      <linearGradient id="seaG2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a2a3a"/><stop offset="1" stop-color="#03111b"/>
      </linearGradient>
      <clipPath id="towerClip"><path d="M905 330 L935 330 L975 760 L865 760 Z"/></clipPath>
    </defs>

    <!-- headland -->
    <path d="M680 900 L700 780 L760 700 L840 660 L900 640 L980 650 L1080 700 L1160 780 L1200 900 Z" fill="url(#rockG)"/>
    <path d="M760 900 L790 800 L880 740 L980 745 L1080 800 L1130 900 Z" fill="#0b1119"/>
    <path d="M700 780 L760 700 L840 660 L900 640 L940 645 L870 700 L800 790 Z" fill="#232d3b"/>

    <!-- lighthouse -->
    <g>
      <rect x="878" y="750" width="84" height="18" fill="#232a34"/>
      <path d="M905 330 L935 330 L975 760 L865 760 Z" fill="url(#towerG)"/>
      <g clip-path="url(#towerClip)">
        <rect x="860" y="400" width="120" height="20" fill="#5a1c1c"/>
        <rect x="860" y="420" width="120" height="20" fill="#c13a34"/>
        <rect x="860" y="440" width="120" height="18" fill="#9a2c28"/>
        <rect x="860" y="540" width="120" height="18" fill="#5a1c1c"/>
        <rect x="860" y="558" width="120" height="18" fill="#c13a34"/>
        <rect x="860" y="576" width="120" height="16" fill="#9a2c28"/>
      </g>
      <!-- door -->
      <path d="M905 760 L905 722 Q920 708 935 722 L935 760 Z" fill="#141a22"/>
      <!-- gallery -->
      <rect x="885" y="318" width="70" height="10" fill="#39424e"/>
      <g stroke="#4c5661" stroke-width="3">
        <line x1="890" y1="318" x2="890" y2="296"/><line x1="906" y1="318" x2="906" y2="296"/>
        <line x1="922" y1="318" x2="922" y2="296"/><line x1="938" y1="318" x2="938" y2="296"/>
        <line x1="950" y1="318" x2="950" y2="296"/>
      </g>
      <rect x="885" y="294" width="70" height="5" fill="#4c5661"/>
      <!-- lamp room -->
      <ellipse id="lampAnchor" cx="920" cy="272" rx="26" ry="22" fill="#ffd98a" opacity="0.55"/>
      <rect x="896" y="252" width="48" height="42" fill="#0e131a"/>
      <g stroke="#e8ebef" stroke-width="2">
        <line x1="908" y1="252" x2="908" y2="294"/>
        <line x1="920" y1="252" x2="920" y2="294"/>
        <line x1="932" y1="252" x2="932" y2="294"/>
      </g>
      <ellipse cx="920" cy="272" rx="12" ry="11" fill="#ffe9b0"/>
      <path d="M892 252 L948 252 L936 222 L904 222 Z" fill="#1a2028"/>
      <path d="M892 252 L948 252 L920 214 Z" fill="#242c36"/>
    </g>

    <!-- cottage -->
    <g>
      <rect x="790" y="640" width="52" height="34" fill="#10151d"/>
      <path d="M784 640 L816 618 L848 640 Z" fill="#1c2430"/>
      <rect id="cottageWindow" x="806" y="650" width="14" height="12" fill="#ffe7a8">
        <animate attributeName="opacity" values="1;0.55;0.95;0.7;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <ellipse cx="813" cy="656" rx="18" ry="12" fill="#e59b2c" opacity="0.14">
        <animate attributeName="opacity" values="0.18;0.08;0.16;0.1;0.18" dur="2.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </svg>

  <svg class="sea-layer" id="seaFar" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path id="seaFarPath" d="" fill="url(#seaG1)" opacity="0.92"/>
  </svg>
  <svg class="sea-layer" id="seaNear" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path id="seaNearPath" d="" fill="url(#seaG2)"/>
    <path id="foam" d="" fill="none" stroke="#bfe0e8" stroke-width="1.5" opacity="0.5"/>
  </svg>
</div>

<div id="beamLayer">
  <div class="beam-arm" id="beamArm">
    <div class="wedge w1"></div>
    <div class="wedge w2"></div>
    <div class="lamp-glow" style="left:-11vmin;top:-11vmin"></div>
  </div>
</div>
<canvas id="rain"></canvas>
<div id="frameGlow"></div>
<div id="flash"></div>

<div class="title-card">
  <h1>The Keeper's <em>Light</em></h1>
  <p>Nine miles from the harbor mouth, one flame answers the storm.</p>
</div>
<div id="log">Dusk. The glass is wiped, the wick trimmed, the sea restless.</div>

<div class="panel">
  <h2>Storm intensity</h2>
  <input type="range" id="stormSlider" min="0" max="100" value="55" aria-label="Storm intensity">
  <div class="scale"><span>calm</span><span>gale</span></div>
  <div class="readouts">
    <div><div class="k">WIND kn</div><div class="v" id="rWind">18</div></div>
    <div><div class="k">SWELL m</div><div class="v" id="rSwell">1.4</div></div>
    <div><div class="k">RAIN</div><div class="v" id="rRain">moderate</div></div>
  </div>
</div>

<script>
(function(){
'use strict';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var scene = document.getElementById('scene');

/* storm state */
var storm = 0.55, stormTarget = 0.55;
var slider = document.getElementById('stormSlider');
slider.addEventListener('input', function(){ stormTarget = +slider.value / 100; });

/* beam anchoring */
var beamArm = document.getElementById('beamArm');
var lampEl = document.getElementById('lampAnchor');
function anchorBeam(){
  var r = lampEl.getBoundingClientRect();
  beamArm.style.left = (r.left + r.width / 2) + 'px';
  beamArm.style.top = (r.top + r.height / 2) + 'px';
}
window.addEventListener('resize', anchorBeam);
setTimeout(anchorBeam, 100);

/* beam rotation */
var beamDeg = 0;
function stepBeam(dt){
  beamDeg += dt * 38;
  var facing = (Math.cos(beamDeg * Math.PI / 180) + 1) / 2; /* 1 toward viewer */
  var alpha = 0.3 + facing * 0.7;
  beamArm.style.opacity = alpha.toFixed(2);
  beamArm.style.transform = 'rotate(' + beamDeg + 'deg)';
}

/* sea */
var seaFarPath = document.getElementById('seaFarPath');
var seaNearPath = document.getElementById('seaNearPath');
var foamPath = document.getElementById('foam');
function waveD(baseY, amp, t, windK){
  var d = 'M0 ' + (baseY + Math.sin(t) * amp);
  for (var x = 0; x <= 1600; x += 40) {
    var y = baseY
      + Math.sin(x * 0.006 + t * 1.1) * amp
      + Math.sin(x * 0.013 - t * 1.7) * amp * 0.6
      + Math.sin(x * 0.021 + t * 2.3 + windK) * amp * 0.35;
    d += ' L' + x + ' ' + y.toFixed(1);
  }
  return d + ' L1600 900 L0 900 Z';
}
var seaT = 0;

/* rain canvas */
var rain = document.getElementById('rain'), rctx = rain.getContext('2d');
var drops = [];
var spray = [];
var dpr = 1;
function sizeRain(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  rain.width = innerWidth * dpr; rain.height = innerHeight * dpr;
  rain.style.width = innerWidth + 'px'; rain.style.height = innerHeight + 'px';
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeRain(); window.addEventListener('resize', sizeRain);

function targetDropCount(){
  var n = Math.round(60 + storm * 1400);
  return reduced ? Math.round(n * 0.35) : n;
}
function syncDrops(){
  var want = targetDropCount();
  while (drops.length < want) drops.push(newDrop(true));
  if (drops.length > want) drops.length = want;
}
function newDrop(anywhere){
  return {
    x: Math.random() * (innerWidth + 400) - 200,
    y: anywhere ? Math.random() * innerHeight : -40,
    len: 12 + Math.random() * 20,
    sp: 700 + Math.random() * 900
  };
}
function drawRain(dt, now){
  rctx.clearRect(0, 0, innerWidth, innerHeight);
  syncDrops();
  var wind = storm * 900;
  var beamAngle = ((beamDeg % 360) + 360) % 360;
  rctx.lineWidth = 1;
  for (var i = 0; i < drops.length; i++) {
    var d = drops[i];
    d.y += d.sp * dt;
    d.x += wind * dt;
    if (d.y > innerHeight + 40) { var nd = newDrop(false); d.y = nd.y; d.x = nd.x; }
    if (d.x > innerWidth + 200) d.x -= innerWidth + 400;
    var dx2 = d.x - beamArmX, dy2 = d.y - beamArmY;
    var dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    var inBeam = false;
    if (dist2 < innerWidth * 0.6) {
      var angTo = (Math.atan2(dy2, dx2) * 180 / Math.PI + 360) % 360;
      var diff = Math.abs(angTo - beamAngle);
      if (diff > 180) diff = 360 - diff;
      inBeam = diff < 10;
    }
    var warm = inBeam && (i % 3 === 0);
    rctx.strokeStyle = warm ? 'rgba(255,217,138,.85)' : 'rgba(160,190,215,.34)';
    rctx.beginPath();
    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x - wind * (d.len / d.sp), d.y - d.len);
    rctx.stroke();
  }
  /* spray */
  for (var i = spray.length - 1; i >= 0; i--) {
    var p = spray[i];
    p.vy += 1400 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt * 1.4;
    if (p.life <= 0) { spray.splice(i, 1); continue; }
    rctx.fillStyle = 'rgba(190,220,230,' + (p.life * 0.5).toFixed(2) + ')';
    rctx.beginPath(); rctx.arc(p.x, p.y, 1.5 + p.life * 2, 0, Math.PI * 2); rctx.fill();
  }
}
var beamArmX = 0, beamArmY = 0;
function readBeamPos(){
  var r = beamArm.getBoundingClientRect();
  beamArmX = r.left; beamArmY = r.top;
}

/* spray spawner */
var sprayT = 0;
function stepSpray(dt){
  sprayT -= dt;
  if (sprayT <= 0) {
    sprayT = Math.max(0.08, 1.2 - storm);
    var cx = 700 + Math.random() * 500;
    var cy = 640 + Math.random() * 40;
    for (var i = 0; i < 6 + storm * 14; i++) {
      spray.push({ x: cx + Math.random() * 60 - 30, y: cy, vx: (Math.random() - .5) * 260,
        vy: -(200 + Math.random() * 420), life: 1 });
    }
  }
}

/* lightning */
var flash = document.getElementById('flash'), frameGlow = document.getElementById('frameGlow');
var nextStrike = performance.now() + 9000;
function strike(){
  if (storm < 0.15) { nextStrike = performance.now() + 6000; return; }
  flash.animate([{opacity:0},{opacity:.55},{opacity:0},{opacity:.4},{opacity:0}],
    { duration: 450, easing: 'ease-out' });
  frameGlow.style.boxShadow = 'inset 0 0 0 6px rgba(200,220,255,.35), inset 0 0 120px rgba(180,205,255,.25)';
  setTimeout(function(){ frameGlow.style.boxShadow = 'inset 0 0 0 0 rgba(200,220,255,0)'; }, 260);
  var delay = 450 + Math.random() * 500;
  setTimeout(function(){
    if (!reduced) {
      scene.classList.add('shake');
      setTimeout(function(){ scene.classList.remove('shake'); }, 600);
    }
  }, delay);
  nextStrike = performance.now() + Math.max(4000, (16000 - storm * 12000)) * (0.7 + Math.random() * 0.8);
}
scene.addEventListener('click', strike);

/* log lines */
var LOGS = [
  [0, 'Calm. The lamp turns slow as a thought, and the sea breathes easy.'],
  [0.3, 'A breeze from the southwest. Gulls huddle on the lee rocks.'],
  [0.5, 'Rain against the lantern glass. The keeper counts the flashes.'],
  [0.7, 'Half a gale. Waves burst white on the headland and the light swings hard.'],
  [0.9, 'Full gale. The tower hums. Every crest hides a rock; every nine seconds, the flame answers.']
];
var logEl = document.getElementById('log');
var logIdx = -1;
function updateLog(){
  var idx = 0;
  for (var i = 0; i < LOGS.length; i++) if (storm >= LOGS[i][0]) idx = i;
  if (idx !== logIdx) { logIdx = idx; logEl.textContent = LOGS[idx][1]; }
}

/* readouts */
var rWind = document.getElementById('rWind'), rSwell = document.getElementById('rSwell'), rRain = document.getElementById('rRain');
function updateReadouts(){
  rWind.textContent = Math.round(4 + storm * 58);
  rSwell.textContent = (0.4 + storm * 5.6).toFixed(1);
  rRain.textContent = storm < 0.25 ? 'light' : storm < 0.55 ? 'moderate' : storm < 0.8 ? 'heavy' : 'torrential';
}

/* main loop */
var last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  storm += (stormTarget - storm) * Math.min(1, dt * 2.5);
  readBeamPos();
  if (!reduced) {
    stepBeam(dt);
    seaT += dt * (0.8 + storm * 2.4);
  }
  /* sea paths */
  var amp = 4 + storm * 22;
  seaFarPath.setAttribute('d', waveD(600, amp * 0.7, seaT, 0));
  seaNearPath.setAttribute('d', waveD(680, amp, seaT * 1.3, 1.4));
  var f = 'M0 ' + (680 + Math.sin(seaT * 1.3) * amp);
  for (var x = 40; x <= 1600; x += 40) {
    var y = 680 + Math.sin(x * 0.013 - seaT * 1.3 * 1.7) * amp * 0.6 + Math.sin(x * 0.021 + seaT * 2.3) * amp * 0.35;
    f += ' L' + x + ' ' + y.toFixed(1);
  }
  foamPath.setAttribute('d', f);
  if (!reduced) { stepSpray(dt); drawRain(dt, now); }
  if (now > nextStrike) strike();
  updateLog();
  updateReadouts();
}
requestAnimationFrame(loop);
anchorBeam();
})();
</script>
</body>
</html>
