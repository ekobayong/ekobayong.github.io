<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmuration — Starlings at Dusk</title>
<style>
  :root{ --night: 0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Iowan Old Style',Georgia,Palatino,serif}

  .sky-dusk{position:fixed;inset:0;
    background:
      radial-gradient(120vmax 70vmax at 50% 130%, rgba(227,160,106,.55), rgba(240,196,140,.25) 45%, transparent 70%),
      linear-gradient(180deg, #2a2f4a 0%, #5a4a6e 34%, #b26a5a 62%, #e3a06a 82%, #f0c48c 100%)}
  .sky-night{position:fixed;inset:0;opacity:var(--night);
    background:
      radial-gradient(100vmax 40vmax at 50% 105%, rgba(120,80,180,.28), transparent 65%),
      linear-gradient(180deg, #05060c 0%, #0b0f1e 45%, #1a1c33 75%, #2b2540 100%)}
  .stars{position:fixed;inset:0;opacity:var(--night);pointer-events:none;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff 60%, transparent),
      radial-gradient(1px 1px at 30% 8%, #ffe 60%, transparent),
      radial-gradient(1.4px 1.4px at 55% 22%, #fff 60%, transparent),
      radial-gradient(1px 1px at 70% 12%, #ffd 60%, transparent),
      radial-gradient(1.2px 1.2px at 85% 28%, #fff 60%, transparent),
      radial-gradient(1px 1px at 42% 35%, #eef 60%, transparent),
      radial-gradient(1.3px 1.3px at 92% 6%, #fff 60%, transparent),
      radial-gradient(1px 1px at 6% 42%, #fff 60%, transparent),
      radial-gradient(1.1px 1.1px at 62% 40%, #ffd 60%, transparent),
      radial-gradient(1px 1px at 22% 55%, #fff 60%, transparent),
      radial-gradient(1.2px 1.2px at 78% 48%, #eef 60%, transparent),
      radial-gradient(1px 1px at 48% 15%, #fff 60%, transparent)}

  #flock{position:fixed;inset:0;z-index:2;cursor:none;touch-action:none}

  .landscape{position:fixed;left:0;right:0;bottom:0;height:38vh;z-index:3;pointer-events:none}
  .landscape svg{width:100%;height:100%;display:block}

  /* UI */
  .title{position:fixed;top:3.4vh;left:4vw;z-index:10;pointer-events:none;max-width:520px}
  .title h1{font-weight:400;font-size:clamp(2rem,5vw,3.4rem);color:#1c1620;
    text-shadow:0 1px 10px rgba(240,196,140,.4)}
  .title h1 em{color:#d9a466}
  .title p{font-style:italic;color:rgba(30,22,30,.75);margin-top:.3rem;font-size:1.02rem;
    text-shadow:0 1px 8px rgba(240,196,140,.3)}

  .panel{position:fixed;top:3.4vh;right:3vw;z-index:10;width:250px;
    background:rgba(13,15,20,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:1rem 1.1rem;
    color:#e8e4da;transition:transform .5s cubic-bezier(.3,1.2,.4,1),opacity .5s;
    font-family:Georgia,serif}
  .panel.hide{transform:translateX(calc(100% + 4vw));opacity:0}
  .panel h2{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.64rem;letter-spacing:.24em;
    text-transform:uppercase;color:#d9a466;margin-bottom:.8rem}
  .ctl{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin:.42rem 0}
  .ctl label{font-style:italic;font-size:.82rem}
  .ctl output{font-family:ui-monospace,Menlo,Consolas,monospace;color:#d9a466;font-size:.74rem;min-width:3.4ch;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:1px;
    background:rgba(255,255,255,.25);outline:none;cursor:pointer;margin:.15rem 0 .5rem}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#d9a466;box-shadow:0 0 8px rgba(217,164,102,.8)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;border:0;
    background:#d9a466;box-shadow:0 0 8px rgba(217,164,102,.8)}
  .btns{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
  .btns button{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.66rem;letter-spacing:.14em;
    background:transparent;color:#e8e4da;border:1px solid rgba(255,255,255,.3);border-radius:6px;
    padding:.4rem .8rem;cursor:pointer;transition:.2s}
  .btns button:hover{border-color:#d9a466;color:#d9a466}
  .btns button[aria-pressed="true"]{background:rgba(217,164,102,.2);border-color:#d9a466;color:#d9a466}
  .hide-btn{position:fixed;bottom:3vh;right:3vw;z-index:10;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.7rem;letter-spacing:.14em;background:rgba(13,15,20,.55);color:#e8e4da;
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.5rem 1.2rem;cursor:pointer;
    backdrop-filter:blur(10px)}
  .hide-btn:hover{border-color:#d9a466}
  .footer{position:fixed;bottom:3vh;left:4vw;z-index:10;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.66rem;letter-spacing:.1em;color:rgba(28,22,32,.65);pointer-events:none}

  #hawk{position:fixed;z-index:9;width:34px;height:26px;pointer-events:none;transform:translate(-50%,-50%)}
  @media(max-width:640px){ .panel{width:min(250px,78vw)} .title p{display:none} }
</style>
</head>
<body>
<div class="sky-dusk"></div>
<div class="sky-night"></div>
<div class="stars"></div>

<div class="landscape">
  <svg viewBox="0 0 1600 340" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="treeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1c1620"/><stop offset="1" stop-color="#0a0a10"/>
      </linearGradient>
    </defs>
    <path d="M0 250 Q 250 205 500 240 T 1000 235 T 1600 245 L 1600 340 L 0 340 Z" fill="#2a2333" opacity="0.85"/>
    <path d="M0 290 L0 340 L1600 340 L1600 285 L1500 288 L1400 280 L1300 292 L1200 284 L1100 294 L1000 286 L900 296 L800 288 L700 298 L600 290 L500 300 L400 292 L300 302 L200 294 L100 304 Z" fill="url(#treeG)"/>
    <path d="M40 292 L60 240 L55 292 L80 250 L86 292 L110 236 L104 292 L130 246 L136 292 L155 252 L160 292 L180 240 L186 292 L205 248 L212 292 L232 238 L238 292 L258 250 L264 292 L285 242 L292 292 L312 252 L318 292 L340 244 L346 292 L365 254 L372 292 L392 246 L398 292 L420 256 L426 292 L448 242 L454 292 L474 250 L480 292 L500 260 L505 292 Z" fill="#0a0a10"/>
    <path d="M1100 290 L1115 235 L1108 290 L1135 245 L1142 290 L1165 232 L1158 290 L1185 250 L1192 290 L1215 240 L1222 290 L1242 254 L1248 290 L1270 244 L1276 290 Z" fill="#0a0a10"/>
    <g stroke="#0d0d14" stroke-width="6" stroke-linecap="round">
      <line x1="620" y1="340" x2="620" y2="180"/>
      <line x1="590" y1="205" x2="650" y2="205"/>
      <line x1="596" y1="222" x2="644" y2="222"/>
      <line x1="1020" y1="340" x2="1020" y2="170"/>
      <line x1="988" y1="196" x2="1052" y2="196"/>
      <line x1="994" y1="214" x2="1046" y2="214"/>
      <line x1="1400" y1="340" x2="1400" y2="200"/>
      <line x1="1372" y1="224" x2="1428" y2="224"/>
    </g>
    <path d="M300 226 Q 620 262 1020 200" fill="none" stroke="#0d0d14" stroke-width="1.6"/>
    <path d="M1020 200 Q 1210 246 1400 226" fill="none" stroke="#0d0d14" stroke-width="1.6"/>
    <g fill="#0c0a12">
      <ellipse cx="596" cy="200" rx="7" ry="4"/><ellipse cx="596" cy="196" rx="3.4" ry="2.6"/>
      <ellipse cx="644" cy="217" rx="7" ry="4"/><ellipse cx="644" cy="213" rx="3.4" ry="2.6"/>
      <ellipse cx="1050" cy="193" rx="6.4" ry="3.6"/>
    </g>
  </svg>
</div>

<div class="title">
  <h1>Murmur<em>ation</em></h1>
  <p>Ten thousand small decisions, and not one of them is the leader's.</p>
</div>

<canvas id="flock"></canvas>
<svg id="hawk" viewBox="0 0 34 26" aria-hidden="true">
  <path d="M2 14 Q 10 4 17 12 Q 24 4 32 14 Q 26 12 22 15 L 17 24 L 12 15 Q 8 12 2 14 Z" fill="#14121a" opacity="0.9"/>
</svg>

<div class="panel" id="panel">
  <h2 id="fpsHdr">MURMURATION · -- FPS</h2>
  <div class="ctl"><label>Birds</label><output id="oBirds">4000</output></div>
  <input type="range" id="rBirds" min="500" max="12000" step="100" value="4000">
  <div class="ctl"><label>Cohesion</label><output id="oCoh">1.0</output></div>
  <input type="range" id="rCoh" min="0" max="3" step="0.05" value="1">
  <div class="ctl"><label>Alignment</label><output id="oAli">1.0</output></div>
  <input type="range" id="rAli" min="0" max="3" step="0.05" value="1">
  <div class="ctl"><label>Separation</label><output id="oSep">1.4</output></div>
  <input type="range" id="rSep" min="0" max="3" step="0.05" value="1.4">
  <div class="ctl"><label>Speed</label><output id="oSpd">3.0</output></div>
  <input type="range" id="rSpd" min="1" max="7" step="0.1" value="3">
  <div class="ctl"><label>Perception</label><output id="oPer">40</output></div>
  <input type="range" id="rPer" min="10" max="80" step="1" value="40">
  <div class="ctl"><label>Dusk → night</label><output id="oNight">0.0</output></div>
  <input type="range" id="rNight" min="0" max="1" step="0.01" value="0">
  <div class="btns">
    <button id="bPause" aria-pressed="false">PAUSE</button>
    <button id="bStep">STEP</button>
    <button id="bScatter">SCATTER</button>
  </div>
</div>
<button class="hide-btn" id="bHide">HIDE PANEL</button>
<div class="footer">CLICK canvas to scatter · SPACE pause · S scatter</div>

<script>
(function(){
'use strict';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var canvas = document.getElementById('flock'), ctx = canvas.getContext('2d');
var W = 0, H = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); window.addEventListener('resize', resize);

/* params */
var P = { birds: 4000, coh: 1, ali: 1, sep: 1.4, speed: 3, per: 40 };
var MAXB = 12000;
var px2 = new Float32Array(MAXB), py2 = new Float32Array(MAXB);
var vx = new Float32Array(MAXB), vy = new Float32Array(MAXB);
var dens = new Float32Array(MAXB);
var count = P.birds;

function initBoids(n){
  count = n;
  for (var i = 0; i < n; i++) {
    px2[i] = Math.random() * W; py2[i] = Math.random() * H * 0.7;
    var a = Math.random() * Math.PI * 2;
    vx[i] = Math.cos(a) * 2; vy[i] = Math.sin(a) * 2;
  }
}
initBoids(count);

/* spatial hash */
var cellSize = 40, gw = 0, gh2 = 0;
var head = new Int32Array(0), next = new Int32Array(MAXB);
function buildHash(){
  gw = Math.ceil(W / cellSize) + 2;
  gh2 = Math.ceil(H / cellSize) + 2;
  var cells = gw * gh2;
  if (head.length < cells) head = new Int32Array(cells);
  head.fill(-1, 0, cells);
  for (var i = 0; i < count; i++) {
    var cx = Math.min(gw - 1, Math.max(0, (px2[i] / cellSize) | 0));
    var cy = Math.min(gh2 - 1, Math.max(0, (py2[i] / cellSize) | 0));
    var ci = cy * gw + cx;
    next[i] = head[ci]; head[ci] = i;
  }
}

/* attractor */
var attT = 0;
function attractor(){
  attT += 0.004;
  return {
    x: W * 0.5 + Math.sin(attT * 0.7) * W * 0.32 + Math.sin(attT * 0.23) * W * 0.1,
    y: H * 0.35 + Math.sin(attT * 1.1 + 1.2) * H * 0.18
  };
}

/* sim tick */
var paused = false, doStep = false;
var mouse = { x: -9999, y: -9999, active: false };
function simTick(){
  buildHash();
  var att = attractor();
  var per = P.per, per2 = per * per;
  var sepR = per * 0.45, sepR2 = sepR * sepR;
  var maxS = P.speed, minS = P.speed * 0.45;
  var treeY = H * 0.7;
  var r2 = Math.random;
  for (var i = 0; i < count; i++) {
    var xi = px2[i], yi = py2[i];
    var cx = (xi / cellSize) | 0, cy = (yi / cellSize) | 0;
    var coX = 0, coY = 0, alX = 0, alY = 0, seX = 0, seY = 0;
    var nNeighbors = 0;
    var cap = 24;
    for (var oy = -1; oy <= 1; oy++) for (var ox = -1; ox <= 1; ox++) {
      var gx2 = cx + ox, gy2 = cy + oy;
      if (gx2 < 0 || gy2 < 0 || gx2 >= gw || gy2 >= gh2) continue;
      var j = head[gy2 * gw + gx2];
      while (j !== -1) {
        if (j !== i && nNeighbors < cap) {
          var dx = px2[j] - xi, dy = py2[j] - yi;
          var d2 = dx * dx + dy * dy;
          if (d2 < per2 && d2 > 0.001) {
            nNeighbors++;
            coX += px2[j]; coY += py2[j];
            alX += vx[j]; alY += vy[j];
            if (d2 < sepR2) {
              var inv = 1 / d2;
              seX -= dx * inv; seY -= dy * inv;
            }
          }
        }
        j = next[j];
      }
    }
    dens[i] = nNeighbors;
    var ax = 0, ay = 0;
    if (nNeighbors > 0) {
      ax += ((coX / nNeighbors - xi)) * 0.0022 * P.coh * 60;
      ay += ((coY / nNeighbors - yi)) * 0.0022 * P.coh * 60;
      ax += ((alX / nNeighbors - vx[i])) * 0.045 * P.ali;
      ay += ((alY / nNeighbors - vy[i])) * 0.045 * P.ali;
      ax += seX * 90 * P.sep;
      ay += seY * 90 * P.sep;
    }
    /* attractor */
    var dxa = att.x - xi, dya = att.y - yi;
    var da = Math.sqrt(dxa * dxa + dya * dya) + 1;
    ax += dxa / da * 0.05; ay += dya / da * 0.05;
    /* edges */
    var E = 90;
    if (xi < E) ax += 0.35;
    if (xi > W - E) ax -= 0.35;
    if (yi < E) ay += 0.35;
    if (yi > treeY) ay -= 0.45;
    /* hawk */
    if (mouse.active) {
      var dxh = xi - mouse.x, dyh = yi - mouse.y;
      var dh = dxh * dxh + dyh * dyh;
      if (dh < 160 * 160 && dh > 0.01) {
        var f = (1 - Math.sqrt(dh) / 160) * 2.2;
        ax += dxh / Math.sqrt(dh) * f; ay += dyh / Math.sqrt(dh) * f;
      }
    }
    vx[i] += ax * 0.16; vy[i] += ay * 0.16;
    /* clamp speed */
    var sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]) || 0.001;
    var lim = sp > maxS ? maxS / sp : sp < minS ? minS / sp : 1;
    vx[i] *= lim; vy[i] *= lim;
    px2[i] += vx[i]; py2[i] += vy[i];
    if (px2[i] < -20) px2[i] = W + 10; if (px2[i] > W + 20) px2[i] = -10;
    if (py2[i] < -20) py2[i] = treeY; if (py2[i] > treeY) py2[i] = -10;
  }
}

/* draw */
function drawBirds(){
  var size = Math.max(2.2, 4.4 - count / 4000);
  var buckets = [[], [], [], []];
  for (var i = 0; i < count; i++) {
    var d = dens[i];
    var b = d < 3 ? 0 : d < 8 ? 1 : d < 16 ? 2 : 3;
    buckets[b].push(i);
  }
  var styles = [
    'rgba(22,22,26,0.42)', 'rgba(18,17,22,0.62)', 'rgba(12,11,17,0.82)', 'rgba(5,5,8,0.96)'
  ];
  if (nightLevel > 0.4) styles = styles.map(function(s, i){
    var al = [0.5, 0.7, 0.9, 1][i];
    return i < 2 ? 'rgba(8,8,14,' + al + ')' : s;
  });
  for (var b = 0; b < 4; b++) {
    var arr = buckets[b];
    if (!arr.length) continue;
    ctx.beginPath();
    for (var k = 0; k < arr.length; k++) {
      var i = arr[k];
      var X = px2[i], Y = py2[i];
      var sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]) || 1;
      var ux = vx[i] / sp, uy = vy[i] / sp;
      var nx = -uy, ny = ux;
      ctx.moveTo(X + ux * size * 1.7, Y + uy * size * 1.7);
      ctx.lineTo(X - ux * size, Y - uy * size + ny * size * 0.7);
      ctx.lineTo(X - ux * size * 0.6, Y - uy * size * 0.6);
      ctx.lineTo(X - ux * size, Y - uy * size - ny * size * 0.7);
      ctx.closePath();
    }
    ctx.fillStyle = styles[b];
    ctx.fill();
  }
}

/* hawk svg follow */
var hawk = document.getElementById('hawk');
var hawkX = -100, hawkY = -100, hawkAng = 0;
function stepHawk(){
  hawk.style.left = hawkX + 'px';
  hawk.style.top = hawkY + 'px';
  hawk.style.transform = 'translate(-50%,-50%) rotate(' + hawkAng + 'rad)';
}

/* UI wiring */
function bind(id, out, key, fmt){
  var r = document.getElementById(id), o = document.getElementById(out);
  r.addEventListener('input', function(){
    P[key] = +r.value;
    o.textContent = fmt ? fmt(P[key]) : P[key];
    if (key === 'per') cellSize = P.per;
  });
  o.textContent = fmt ? fmt(P[key]) : P[key];
}
bind('rBirds', 'oBirds', 'birds');
bind('rCoh', 'oCoh', 'coh', function(v){ return (+v).toFixed(2); });
bind('rAli', 'oAli', 'ali', function(v){ return (+v).toFixed(2); });
bind('rSep', 'oSep', 'sep', function(v){ return (+v).toFixed(2); });
bind('rSpd', 'oSpd', 'speed', function(v){ return (+v).toFixed(1); });
bind('rPer', 'oPer', 'per');
document.getElementById('rBirds').addEventListener('change', function(){
  count = P.birds;
  if (count > 0) initBoids(Math.min(count, MAXB));
});
var nightLevel = 0;
document.getElementById('rNight').addEventListener('input', function(){
  nightLevel = +this.value;
  document.documentElement.style.setProperty('--night', nightLevel);
  document.getElementById('oNight').textContent = nightLevel.toFixed(1);
});

var bPause = document.getElementById('bPause');
function setPause(p){
  paused = p;
  bPause.setAttribute('aria-pressed', p);
  bPause.textContent = p ? 'RESUME' : 'PAUSE';
}
bPause.addEventListener('click', function(){ setPause(!paused); });
document.getElementById('bStep').addEventListener('click', function(){ doStep = true; });
function scatter(x, y){
  for (var i = 0; i < count; i++) {
    var dx = px2[i] - x, dy = py2[i] - y;
    var d = Math.sqrt(dx * dx + dy * dy) + 1;
    var f = Math.min(3, 240 / d);
    vx[i] += dx / d * f * P.speed;
    vy[i] += dy / d * f * P.speed;
  }
}
document.getElementById('bScatter').addEventListener('click', function(){ scatter(W / 2, H / 2); });
canvas.addEventListener('pointerdown', function(e){
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  scatter(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', function(e){
  var dx = e.clientX - hawkX, dy = e.clientY - hawkY;
  if (Math.abs(dx) + Math.abs(dy) > 2) hawkAng = Math.atan2(dy, dx);
  hawkX = e.clientX; hawkY = e.clientY;
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('pointerleave', function(){
  mouse.active = false; mouse.x = mouse.y = -9999;
  hawkX = hawkY = -100; stepHawk();
});
window.addEventListener('keydown', function(e){
  if (e.code === 'Space') { e.preventDefault(); setPause(!paused); }
  else if (e.key === 's' || e.key === 'S') scatter(W / 2, H / 2);
});
document.getElementById('bHide').addEventListener('click', function(){
  var panel = document.getElementById('panel');
  var hidden = panel.classList.toggle('hide');
  this.textContent = hidden ? 'SHOW PANEL' : 'HIDE PANEL';
});

/* loop */
var last = performance.now(), fpsT = last, fpsN = 0;
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  fpsN++;
  if (now - fpsT > 1000) {
    document.getElementById('fpsHdr').textContent = 'MURMURATION · ' + fpsN + ' FPS';
    fpsN = 0; fpsT = now;
  }
  var rate = reduced ? 0.5 : 1;
  acc += dt * rate;
  var stepDT = 1 / 60;
  while (acc > stepDT) {
    acc -= stepDT;
    if (!paused || doStep) { simTick(); doStep = false; }
  }
  stepHawk();
  ctx.clearRect(0, 0, W, H);
  drawBirds();
}
var acc = 0;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
