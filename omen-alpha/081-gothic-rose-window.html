<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosace du Nord — Gothic Rose Window</title>
<style>
:root{
  --ink:#e9dcc8; --muted:#a5937a; --nave:#0b0908;
  --tint:#dfe9ff; --sunA:#ffffff; --sunB:#c9d8ff; --mote:#cfe0ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--nave);
  background-image:
    radial-gradient(120% 90% at 50% 12%, #171210 0%, #0d0a09 46%, #0b0908 100%);
  color:var(--ink);
  font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;
  overflow-x:hidden;
}
header{text-align:center;padding:26px 16px 8px}
h1{
  font-size:clamp(17px,2.6vw,26px);
  letter-spacing:.34em;text-transform:uppercase;font-weight:normal;
  color:#d9c6a4;text-shadow:0 0 18px rgba(214,178,120,.25);
}
.sub{font-style:italic;color:var(--muted);margin-top:8px;font-size:14px;letter-spacing:.04em}
.pillbar{display:flex;justify-content:center;gap:0;margin:18px 0 4px}
.pill{
  display:flex;border:1px solid #3a3128;border-radius:999px;overflow:hidden;
  background:#141009;
}
.pill button{
  appearance:none;background:transparent;border:0;color:var(--muted);
  font:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  padding:9px 20px;cursor:pointer;transition:color .3s,background .3s;
}
.pill button+button{border-left:1px solid #3a3128}
.pill button[aria-pressed="true"]{background:#241c12;color:#ecdcbb}
.stage{position:relative;width:100%;max-width:840px;margin:0 auto;padding:6px 12px 26px}
.windowWrap{position:relative}
svg#rose{display:block;width:100%;height:auto;user-select:none}
.pane{transition:filter .35s ease;cursor:pointer}
.pane:hover,.pane:focus{
  filter:brightness(1.55) saturate(1.35) drop-shadow(0 0 8px rgba(255,240,200,.7));
  outline:none;
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#tooltip{
  position:fixed;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s;
  background:rgba(16,12,9,.92);border:1px solid #4a3c2c;border-radius:4px;
  padding:9px 12px;max-width:250px;color:var(--ink);font-size:13px;line-height:1.45;
  box-shadow:0 6px 24px rgba(0,0,0,.6);
}
#tooltip .t{letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:#d9b45b;margin-bottom:4px}
#tooltip .s{font-style:italic;color:var(--muted);font-size:12px}
.caption{
  text-align:center;min-height:44px;margin-top:10px;color:var(--muted);
  font-size:13.5px;font-style:italic;
}
.caption b{
  display:block;font-style:normal;font-weight:normal;font-size:11px;
  letter-spacing:.24em;text-transform:uppercase;color:#d9b45b;margin-bottom:5px;
}
footer{text-align:center;color:#4f4438;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;padding:10px 0 30px}
@media (prefers-reduced-motion: reduce){
  .pane{transition:none}
}
</style>
</head>
<body>
<header>
  <h1>Rosace du Nord</h1>
  <p class="sub">The Mystic Rose of Our Lady of the Twelve Hours — tracery of c. 1240</p>
  <div class="pillbar" role="group" aria-label="Season">
    <div class="pill">
      <button data-season="winter" aria-pressed="true">Winter</button>
      <button data-season="summer" aria-pressed="false">Summer</button>
      <button data-season="evening" aria-pressed="false">Evening</button>
    </div>
  </div>
</header>

<div class="stage">
  <div class="windowWrap">
    <svg id="rose" viewBox="0 0 800 820" role="img" aria-label="Gothic rose window of twelve lancets">
      <defs>
        <pattern id="ashlar" width="64" height="40" patternUnits="userSpaceOnUse">
          <rect width="64" height="40" fill="#2e2824"/>
          <rect x="0" y="0" width="64" height="2" fill="#1a1512"/>
          <rect x="0" y="20" width="64" height="2" fill="#1a1512"/>
          <rect x="0" y="1" width="64" height="1" fill="#463c35"/>
          <rect x="0" y="21" width="64" height="1" fill="#463c35"/>
          <rect x="0" y="0" width="2" height="40" fill="#1a1512"/>
          <rect x="32" y="20" width="2" height="20" fill="#1a1512"/>
          <rect x="16" y="0" width="2" height="20" fill="#1a1512"/>
          <rect x="48" y="0" width="2" height="20" fill="#1a1512"/>
          <rect x="2" y="0" width="1" height="40" fill="#463c35"/>
          <rect x="34" y="20" width="1" height="20" fill="#463c35"/>
        </pattern>
        <radialGradient id="gRuby"><stop offset="0" stop-color="#ff5d70"/><stop offset=".45" stop-color="#b3142a"/><stop offset="1" stop-color="#5a0812"/></radialGradient>
        <radialGradient id="gSapphire"><stop offset="0" stop-color="#6f95ff"/><stop offset=".45" stop-color="#1f3fb8"/><stop offset="1" stop-color="#0a1656"/></radialGradient>
        <radialGradient id="gEmerald"><stop offset="0" stop-color="#63e39a"/><stop offset=".45" stop-color="#128a4d"/><stop offset="1" stop-color="#053c22"/></radialGradient>
        <radialGradient id="gAmber"><stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#e08a12"/><stop offset="1" stop-color="#6b3a02"/></radialGradient>
        <radialGradient id="gAmethyst"><stop offset="0" stop-color="#d59bff"/><stop offset=".45" stop-color="#7a2fb4"/><stop offset="1" stop-color="#32104f"/></radialGradient>
        <radialGradient id="gGold"><stop offset="0" stop-color="#fff2b0"/><stop offset=".45" stop-color="#e8b93a"/><stop offset="1" stop-color="#7a5a0a"/></radialGradient>
        <radialGradient id="gCore"><stop offset="0" stop-color="#fff8e0"/><stop offset=".55" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d9b45b"/></radialGradient>
        <radialGradient id="sunGrad" gradientUnits="userSpaceOnUse" cx="400" cy="110" r="250">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
          <stop offset=".4" stop-color="#c9d8ff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#c9d8ff" stop-opacity="0"/>
        </radialGradient>
        <filter id="antique" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="mottle" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 0.7  0.9 0.9 0.9 0 -0.9"/>
        </filter>
        <filter id="poolBlur" x="-30%" y="-60%" width="160%" height="220%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
        <clipPath id="windowClip"><circle cx="400" cy="410" r="300"/></clipPath>
        <clipPath id="innerClip"><circle cx="400" cy="410" r="272"/></clipPath>
        <symbol id="spokeSym">
          <g>
            <line x1="400" y1="410" x2="400" y2="138" stroke="#181310" stroke-width="9"/>
            <line x1="400" y1="410" x2="400" y2="138" stroke="#4a4038" stroke-width="6.4"/>
            <line x1="402" y1="410" x2="402" y2="138" stroke="#7a6c60" stroke-width="1.5"/>
          </g>
        </symbol>
        <symbol id="miniSpokeSym">
          <g>
            <line x1="400" y1="176" x2="400" y2="138" stroke="#181310" stroke-width="6"/>
            <line x1="400" y1="176" x2="400" y2="138" stroke="#4a4038" stroke-width="4.2"/>
            <line x1="401.4" y1="176" x2="401.4" y2="138" stroke="#7a6c60" stroke-width="1.2"/>
          </g>
        </symbol>
      </defs>

      <circle cx="400" cy="410" r="300" fill="url(#ashlar)"/>
      <circle cx="400" cy="410" r="300" fill="none" stroke="#181310" stroke-width="10"/>
      <circle cx="400" cy="410" r="296" fill="none" stroke="#4a4038" stroke-width="6"/>
      <circle cx="400" cy="410" r="293.5" fill="none" stroke="#7a6c60" stroke-width="1.5"/>

      <g id="glassLayer" filter="url(#antique)" clip-path="url(#innerClip)">
        <g id="panes"></g>
      </g>

      <g id="spokes"></g>
      <g id="rings"></g>

      <rect id="tintRect" x="100" y="110" width="600" height="600" fill="#dfe9ff"
        opacity=".4" style="mix-blend-mode:multiply" clip-path="url(#innerClip)"/>
      <circle id="sunDisc" cx="400" cy="110" r="300" fill="url(#sunGrad)"
        style="mix-blend-mode:screen" clip-path="url(#innerClip)"/>
      <circle cx="400" cy="410" r="272" fill="none" stroke="#181310" stroke-width="4"/>
      <circle cx="400" cy="410" r="270" fill="none" stroke="#4a4038" stroke-width="2.6"/>
      <circle cx="400" cy="410" r="268.8" fill="none" stroke="#7a6c60" stroke-width="1.2"/>
    </svg>
  </div>
  <p class="caption" id="caption" aria-live="polite">
    <b>Twelve lancets · Prophets and Gospels</b>
    Hover any pane to hear its story — the sun crosses behind the glass every ninety seconds.
  </p>
</div>

<footer>Our Lady of the Twelve Hours · Tracery · Glass · Light</footer>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="tooltip" role="tooltip"><div class="t"></div><div class="s"></div></div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var CX=400,CY=410;
var svg=document.getElementById("rose");
var panesG=document.getElementById("panes");
var spokesG=document.getElementById("spokes");
var ringsG=document.getElementById("rings");

function P(a,r){var t=(a-90)*Math.PI/180;return [CX+r*Math.cos(t),CY+r*Math.sin(t)];}
function f(n){return n.toFixed(2);}
function el(name,attrs,parent){var e=document.createElementNS(NS,name);
  for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(s){var t=document.createElementNS(NS,"title");t.textContent=s;return t;}

/* ---- subjects ---- */
var gospel=[
 ["St Matthew","The winged man writes the genealogy while an angel dictates."],
 ["St Mark","The lion roars in the desert and the evangelist takes dictation."],
 ["St Luke","The ox kneels at the desk of the physician of the good news."],
 ["St John","The eagle lifts the beloved disciple toward unclouded light."],
 ["Annunciation","A lily stands between the messenger and the maiden."],
 ["Nativity","Ox and ass warm the child with their breath in the dark stable."],
 ["Baptism","The Jordan parts; a dove descends on the standing water."],
 ["Last Supper","Thirteen at table; bread is broken and one goes out."],
 ["Gethsemane","The cup passes while the disciples sleep among the olives."],
 ["Crucifixion","Sun and moon mourn at the two sides of the cross."],
 ["Resurrection","The stone rolls away and the soldiers fall like cut wheat."],
 ["Pentecost","Tongues of fire rest on the assembly in the upper room."]];
var months=[
 ["January — Feasting","A hooded soul warms both hands at a small coal fire."],
 ["February — Sitting","The fire fails; the sitter hugs the chair for warmth."],
 ["March — Pruning","The vine dresser lifts the knife to the sleeping vine."],
 ["April — Planting","New sets go into the soft earth while lambs stagger."],
 ["May — Hawking","A falcon leaves the glove against a bright green sky."],
 ["June — Haymaking","Scythes comb the meadow; the load rides home high."],
 ["July — Reaping","The sickle bites; wheat falls in curved golden rows."],
 ["August — Threshing","The flail rises and falls in the dust of the barn."],
 ["September — Sowing","Grain flies in an arc over the freshly broken furrow."],
 ["October — Vintage","Baskets of dark grapes are trampled into purple must."],
 ["November — Slaying","The fatted ox falls; smoke rises from the kitchen."],
 ["December — Baking","Round loaves go into the mouth of the stone oven."]];
var border=["Griffin of the Choir","Lily of the Wall","Pelican in her Piety","Vine of the South Wall",
 "Dove of the Dipper","Star of the Rose"];
var days=["Day I — Light","Day II — the Firmament","Day III — Earth and Seed",
 "Day IV — Sun and Moon","Day V — Fishes and Fowl","Day VI — Beasts and Man"];
var stories=[
 "On the first day, light was let in without a lamp.",
 "The waters above and below were parted by a word.",
 "Earth put forth seed, herb after its kind, in green order.",
 "Two lights were hung to govern the day and the night.",
 "The deep was told to bring forth moving things with wings.",
 "Beasts were made, and last of all, a keeper for them all."];

var jewel=["gRuby","gSapphire","gEmerald","gAmber","gAmethyst","gGold"];

/* ---- spokes (12 full + 12 short at 15deg offset) ---- */
var i,a;
for(i=0;i<12;i++){a=i*30;
  var u=el("use",{href:"#spokeSym",transform:"rotate("+a+" "+CX+" "+CY+")"},spokesG);
  u.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#spokeSym");}
for(i=0;i<12;i++){a=i*30+15;
  var v=el("use",{href:"#miniSpokeSym",transform:"rotate("+a+" "+CX+" "+CY+")"},spokesG);
  v.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#miniSpokeSym");}

/* ---- rings at 60,136,234,272 : three stacked strokes ---- */
[60,136,234,272].forEach(function(r){
  el("circle",{cx:CX,cy:CY,r:r,fill:"none",stroke:"#181310","stroke-width":7},ringsG);
  el("circle",{cx:CX,cy:CY,r:r,fill:"none",stroke:"#4a4038","stroke-width":5},ringsG);
  el("circle",{cx:CX,cy:CY,r:r-1.5,fill:"none",stroke:"#7a6c60","stroke-width":1.5},ringsG);
});

/* ---- glass panes ---- */
function sectorPath(r1,r2,a1,a2){
  var p1=P(a1,r1),p2=P(a1,r2),p3=P(a2,r2),p4=P(a2,r1);
  return "M"+f(p1[0])+" "+f(p1[1])+" L"+f(p2[0])+" "+f(p2[1])+
    " A"+r2+" "+r2+" 0 0 1 "+f(p3[0])+" "+f(p3[1])+
    " L"+f(p4[0])+" "+f(p4[1])+
    " A"+r1+" "+r1+" 0 0 0 "+f(p1[0])+" "+f(p1[1])+" Z";
}
function lancetPath(r1,r2,acenter,halfW,apexR){
  var b1=P(acenter-halfW,r1),m1=P(acenter-halfW,r2),ap=P(acenter,apexR),
      m2=P(acenter+halfW,r2),b2=P(acenter+halfW,r1);
  return "M"+f(b1[0])+" "+f(b1[1])+" L"+f(m1[0])+" "+f(m1[1])+
    " Q"+f(ap[0])+" "+f(ap[1])+" "+f(m2[0])+" "+f(m2[1])+
    " L"+f(b2[0])+" "+f(b2[1])+
    " A"+r1+" "+r1+" 0 0 0 "+f(b1[0])+" "+f(b1[1])+" Z";
}
var idx=0;
/* 24 border panes annulus 234-272 */
for(i=0;i<24;i++){
  var gr=(i%2===0)?"gGold":"gSapphire";
  var pth=sectorPath(234,272,i*15+1.2,(i+1)*15-1.2);
  var pane=el("path",{d:pth,fill:"url(#"+gr+")",class:"pane",tabindex:"0"},panesG);
  pane.appendChild(txt(border[i%border.length]+" — border pane "+(i+1)+
    ". "+["Gold glass of the choir donors.","Sapphire of the deep water."][i%2]));
  idx++;
}
/* 12 tall lancets annulus 136-234 */
for(i=0;i<12;i++){
  var j=(i%jewel.length);
  var pane2=el("path",{d:lancetPath(138,208,i*30,11,232),fill:"url(#"+jewel[j]+")",
    class:"pane",tabindex:"0"},panesG);
  pane2.appendChild(txt(gospel[i][0]+" — "+gospel[i][1]));
  idx++;
}
/* 12 short lancets annulus 60-136 rotated 15deg */
for(i=0;i<12;i++){
  var k=(i+2)%jewel.length;
  var pane3=el("path",{d:lancetPath(62,118,i*30+15,9,134),fill:"url(#"+jewel[k]+")",
    class:"pane",tabindex:"0"},panesG);
  pane3.appendChild(txt(months[i][0]+" — "+months[i][1]));
  idx++;
}
/* central rosette: six petals of creation + core */
for(i=0;i<6;i++){
  var ang=i*60;
  var cxp=P(ang,30)[0],cyp=P(ang,30)[1];
  var pet=el("ellipse",{cx:f(cxp),cy:f(cyp),rx:14,ry:21,
    transform:"rotate("+ang+" "+f(cxp)+" "+f(cyp)+")",
    fill:"url(#"+jewel[(i+3)%6]+")",class:"pane",tabindex:"0"},panesG);
  pet.appendChild(txt(days[i]+" — "+stories[i]));
  idx++;
}
var core=el("circle",{cx:CX,cy:CY,r:13,fill:"url(#gCore)",class:"pane",tabindex:"0"},panesG);
core.appendChild(txt("The Mystic Rose — core of white gold, named for the evergreen Virgin."));

/* ---- tooltip + caption ---- */
var tip=document.getElementById("tooltip"),cap=document.getElementById("caption");
var tipT=tip.querySelector(".t"),tipS=tip.querySelector(".s");
function showPane(pane,ev){
  var t=pane.getElementsByTagName("title")[0];
  if(!t)return;
  var parts=t.textContent.split(" — ");
  tipT.textContent=parts[0]||"";
  tipS.textContent=parts.slice(1).join(" — ")||"";
  tip.style.opacity="1";moveTip(ev);
  cap.innerHTML="<b></b>".replace("<b></b>","<b>"+(parts[0]||"")+"</b>"+(parts[1]?"<span style='font-style:italic'>"+parts[1]+"</span>":""));
}
function moveTip(ev){
  tip.style.left=Math.min(window.innerWidth-270,ev.clientX+16)+"px";
  tip.style.top=(ev.clientY+18)+"px";
}
function hidePane(){tip.style.opacity="0";}
Array.prototype.forEach.call(document.querySelectorAll(".pane"),function(pn){
  pn.addEventListener("pointerenter",function(e){showPane(pn,e);});
  pn.addEventListener("pointermove",moveTip);
  pn.addEventListener("pointerleave",hidePane);
  pn.addEventListener("focus",function(e){showPane(pn,{clientX:window.innerWidth/2-130,clientY:120});});
  pn.addEventListener("blur",hidePane);
});

/* ---- season selector ---- */
var seasons={
  winter:{tint:"#dfe9ff",a:"#ffffff",b:"#c9d8ff",mote:"207,224,255"},
  summer:{tint:"#ffe9b8",a:"#fff6dc",b:"#ffd47a",mote:"255,224,160"},
  evening:{tint:"#ffb56b",a:"#ffd9a6",b:"#ff8a3c",mote:"255,170,110"}
};
var seasonName="winter";
var seasonBtns=document.querySelectorAll(".pill button");
seasonBtns.forEach(function(btn){
  btn.addEventListener("click",function(){
    seasonBtns.forEach(function(b){b.setAttribute("aria-pressed",b===btn?"true":"false");});
    seasonName=btn.dataset.season;
    var s=seasons[seasonName];
    document.getElementById("tintRect").setAttribute("fill",s.tint);
    var sg=document.getElementById("sunGrad");
    sg.getElementsByTagName("stop")[0].setAttribute("stop-color",s.a);
    sg.getElementsByTagName("stop")[1].setAttribute("stop-color",s.b);
    document.documentElement.style.setProperty("--mote",s.mote);
  });
});

/* ---- floor light pool ---- */
var poolFilter=document.createElementNS(NS,"filter");
poolFilter.setAttribute("id","poolFilter2");
var defs=svg.querySelector("defs");
var feB=document.createElementNS(NS,"feGaussianBlur");
feB.setAttribute("stdDeviation","9");
poolFilter.appendChild(feB);defs.appendChild(poolFilter);
var poolG=document.createElementNS(NS,"g");
poolG.setAttribute("id","pool");
poolG.setAttribute("style","mix-blend-mode:screen;opacity:.55;filter:url(#poolFilter2)");
var poolUse=el("use",{href:"#glassLayer"},poolG);
poolUse.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#glassLayer");
svg.appendChild(poolG);
function setPool(){
  var sx=Math.cos(sunTheta),off=-sx*120;
  var skew=-28+sx*6;
  poolUse.setAttribute("transform","translate("+(CX+off)+" 730) skewX("+skew+") scale(1 .34) translate(-"+CX+" -"+CY+")");
}

/* ---- sun + motes ---- */
var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var sunTheta=reduce?-Math.PI/2:-2.4;
var sunGradEl=document.getElementById("sunGrad");
var sunDisc=document.getElementById("sunDisc");
function placeSun(){
  var sx=CX+Math.cos(sunTheta)*330,sy=CY+Math.sin(sunTheta)*330;
  sunGradEl.setAttribute("cx",sx);sunGradEl.setAttribute("cy",sy);
  sunDisc.setAttribute("cx",sx);sunDisc.setAttribute("cy",sy);
  setPool();
  beamDirX=-Math.cos(sunTheta);beamDirY=-Math.sin(sunTheta);
  var l=Math.hypot(beamDirX,beamDirY)||1;beamDirX/=l;beamDirY/=l;
}
var beamDirX=0,beamDirY=-1;

var canvas=document.getElementById("dust"),ctx=canvas.getContext("2d");
var motes=[],MOTES_N=0;
function sizeCanvas(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var svgRect=svg.getBoundingClientRect();
  var sc=svgRect.width/800;
  window.winScreen={x:svgRect.left+400*sc,y:svgRect.top+410*sc,r:300*sc};
}
function seedMotes(){
  motes=[];
  MOTES_N=100+Math.floor(Math.random()*61);
  var col=getComputedStyle(document.documentElement).getPropertyValue("--mote").trim()||"207,224,255";
  for(var m=0;m<MOTES_N;m++){
    motes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      r:.6+Math.random()*1.7,vy:.16+Math.random()*.5,ph:Math.random()*6.28,
      sway:.2+Math.random()*.7,col:col});
  }
}
function moteInBeam(m){
  if(!window.winScreen)return false;
  var dx=m.x-window.winScreen.x,dy=m.y-window.winScreen.y;
  var t=dx*beamDirX+dy*beamDirY;
  if(t<0||t>innerHeight*1.2)return false;
  var px=-beamDirY,py=beamDirX;
  var d=Math.abs(dx*px+dy*py);
  return d<60+t*0.42;
}
var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,.1);last=now;
  if(!reduce){sunTheta+=dt*(Math.PI*2/90);if(sunTheta>Math.PI*2.5)sunTheta-=Math.PI*2;}
  placeSun();
  ctx.clearRect(0,0,innerWidth,innerHeight);
  var col=getComputedStyle(document.documentElement).getPropertyValue("--mote").trim()||"207,224,255";
  for(var m=0;m<motes.length;m++){
    var mo=motes[m];
    if(!reduce){
      mo.y+=mo.vy*dt*60;
      mo.ph+=dt*mo.sway*2.4;
      mo.x+=Math.sin(mo.ph)*.35;
      if(mo.y>innerHeight+4){mo.y=-4;mo.x=Math.random()*innerWidth;}
    }
    var inBeam=moteInBeam(mo);
    var al=inBeam?.5:.13;
    ctx.beginPath();
    ctx.fillStyle="rgba("+col+","+al+")";
    ctx.arc(mo.x,mo.y,mo.r*(inBeam?1.5:1),0,6.2832);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
sizeCanvas();
seedMotes();
window.addEventListener("resize",function(){sizeCanvas();});
placeSun();
if(reduce){
  /* single settled frame */
  sunTheta=-Math.PI/2;placeSun();
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(var m0=0;m0<motes.length;m0++){
    var mo0=motes[m0];
    var al0=moteInBeam(mo0)?.5:.13;
    ctx.beginPath();ctx.fillStyle="rgba("+mo0.col+","+al0+")";
    ctx.arc(mo0.x,mo0.y,mo0.r,0,6.2832);ctx.fill();
  }
}else{
  requestAnimationFrame(frame);
}
})();
</script>
</body>
