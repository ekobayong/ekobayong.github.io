<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KESTREL//OS v9.4.1 Nightjar</title>
<style>
  :root{
    --bg:#05060a;
    --lift:#10142a;
    --mag:#ff2bd6;
    --cyn:#00f0ff;
    --amb:#ffb830;
    --mint:#5cff8a;
    --dim:#6b7390;
    --body:#d8e6ff;
    --panel:rgba(10,12,22,.82);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(90% 55% at 50% 0%, var(--lift), var(--bg) 70%);
    color:var(--body);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
    font-size:13.5px;line-height:1.55;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- CRT layers ---------- */
  .crt{position:fixed;inset:0;pointer-events:none;z-index:50}
  .scanlines{
    background:repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.28) 2px 3px);
    mix-blend-mode:multiply;
  }
  .sweep{
    background:linear-gradient(to bottom, transparent, rgba(0,240,255,.055) 45%, rgba(0,240,255,.11) 50%, transparent 60%);
    height:24vh;animation:sweep 7s linear infinite;
  }
  @keyframes sweep{from{transform:translateY(-30vh)}to{transform:translateY(130vh)}}
  .flicker{background:#fff;opacity:.02;animation:flick .12s steps(2) infinite}
  @keyframes flick{0%{opacity:.02}50%{opacity:.035}100%{opacity:.02}}
  .vignette{background:radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%)}
  .gridfloor{
    position:fixed;left:-25%;right:-25%;bottom:-6vh;height:30vh;z-index:2;pointer-events:none;
    perspective:340px;overflow:hidden;
    -webkit-mask-image:linear-gradient(to top,#000 40%,transparent);
    mask-image:linear-gradient(to top,#000 40%,transparent);
  }
  .gridfloor .plane{
    position:absolute;inset:-100% 0 0 0;
    transform:rotateX(62deg);transform-origin:bottom center;
    background:
      repeating-linear-gradient(to bottom, rgba(0,240,255,.16) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(to right, rgba(0,240,255,.13) 0 1px, transparent 1px 64px);
    animation:gridscroll 3.4s linear infinite;
  }
  @keyframes gridscroll{from{background-position:0 0}to{background-position:0 44px}}

  /* ---------- layout ---------- */
  .app{
    position:relative;z-index:5;height:100vh;
    display:grid;grid-template-rows:auto 1fr;gap:14px;
    padding:14px clamp(10px,2vw,26px) 90px;
    max-width:1720px;margin:0 auto;
  }
  .panel{
    position:relative;
    background:var(--panel);
    border:1px solid rgba(0,240,255,.28);
    box-shadow:0 0 22px rgba(0,240,255,.09), inset 0 0 30px rgba(0,240,255,.03);
  }
  .panel > .plabel{
    position:absolute;top:-9px;left:18px;
    background:var(--bg);
    padding:0 10px;
    font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mag);
    text-shadow:0 0 8px rgba(255,43,214,.7);
  }
  .corner{position:absolute;width:10px;height:10px;border:1px solid var(--cyn);opacity:.85}
  .corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
  .corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
  .corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none}

  /* ---------- header ---------- */
  header{
    padding:12px 20px 14px;
    clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
  }
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{
    font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--body);
    text-shadow:0 0 12px rgba(0,240,255,.55);
  }
  h1 .sl{color:var(--mag);text-shadow:0 0 12px rgba(255,43,214,.7)}
  h1 .ver{font-size:.55em;color:var(--dim);letter-spacing:.14em;text-shadow:none;margin-left:.6em}
  h1.glitch{animation:glitchA .42s steps(2) both}
  @keyframes glitchA{
    0%{text-shadow:-3px 0 var(--mag),3px 0 var(--cyn);transform:translate(2px,-1px) skewX(4deg)}
    20%{text-shadow:4px 0 var(--mag),-4px 0 var(--cyn);transform:translate(-3px,1px) skewX(-6deg)}
    40%{text-shadow:-2px 0 var(--mag),2px 0 var(--cyn);transform:translate(1px,0) skewX(2deg);clip-path:inset(10% 0 55% 0)}
    60%{text-shadow:3px 0 var(--mag),-3px 0 var(--cyn);transform:translate(-2px,-1px) skewX(-3deg);clip-path:inset(50% 0 8% 0)}
    80%{text-shadow:-1px 0 var(--mag),1px 0 var(--cyn);transform:translate(1px,1px)}
    100%{text-shadow:0 0 12px rgba(0,240,255,.55);transform:none;clip-path:none}
  }
  .status{display:flex;gap:22px;align-items:center;font-size:.72rem;color:var(--dim);flex-wrap:wrap}
  .led{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint);animation:blink 1.6s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  .status b{color:var(--body);font-weight:400}
  .status .clock{color:var(--cyn)}

  /* ---------- main ---------- */
  main{
    display:grid;grid-template-columns:1fr clamp(280px,22vw,340px);gap:14px;
    min-height:0;
  }
  .consolep{display:flex;flex-direction:column;padding:20px 18px 14px;min-height:0}
  .log{
    flex:1;overflow-y:auto;padding-right:8px;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,240,255,.3) transparent;
  }
  .log::-webkit-scrollbar{width:6px}
  .log::-webkit-scrollbar-thumb{background:rgba(0,240,255,.25)}
  .log .line{white-space:pre-wrap;word-break:break-word}
  .ts{color:var(--dim)}
  .c-cyn{color:var(--cyn);text-shadow:0 0 8px rgba(0,240,255,.5)}
  .c-mag{color:var(--mag)}
  .c-mint{color:var(--mint)}
  .c-amb{color:var(--amb)}
  .c-dim{color:var(--dim)}
  .c-err{color:#ff4d5e;text-shadow:0 0 8px rgba(255,77,94,.5)}
  .oktag{color:var(--mint)} .warntag{color:var(--amb)}
  .banner{color:var(--cyn);text-shadow:0 0 10px rgba(0,240,255,.6);line-height:1.15;font-size:12px}
  .cursor{
    display:inline-block;width:.62em;height:1.05em;background:var(--cyn);
    vertical-align:-0.15em;box-shadow:0 0 8px rgba(0,240,255,.8);
    animation:caretblink 1s steps(2) infinite;
  }
  @keyframes caretblink{50%{opacity:0}}
  .pbar{
    display:inline-block;width:26ch;height:10px;border:1px solid rgba(0,240,255,.4);
    vertical-align:middle;margin:0 10px;position:relative;overflow:hidden;
  }
  .pbar i{
    position:absolute;inset:0;transform-origin:left;width:0;
    background:linear-gradient(90deg,var(--cyn),var(--mag));
    box-shadow:0 0 10px rgba(0,240,255,.6);
  }
  .ppct{color:var(--cyn)}
  .promptline{display:flex;gap:8px;align-items:center;padding-top:10px;margin-top:8px;border-top:1px solid rgba(0,240,255,.18)}
  .promptline .p{color:var(--mag);text-shadow:0 0 8px rgba(255,43,214,.6);white-space:nowrap}
  #cmd{
    flex:1;background:transparent;border:none;outline:none;color:var(--body);
    font:inherit;caret-color:var(--cyn);
  }
  #cmd:disabled{opacity:.4}

  /* ---------- sidebar ---------- */
  .side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .core{padding:16px 14px 10px}
  #ico{display:block;width:100%;height:180px}
  .angleread{font-size:.66rem;color:var(--dim);text-align:right;margin-top:4px}
  .gauges{padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px}
  .gauge .grow{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:6px}
  .gauge .gname{color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
  .gauge .gval{color:var(--cyn)}
  .gbar{height:3px;background:rgba(255,43,214,.18);position:relative;overflow:hidden}
  .gbar i{position:absolute;inset:0;transform-origin:left;background:var(--mag);box-shadow:0 0 8px rgba(255,43,214,.8);transform:scaleX(0);transition:transform .9s ease-out}
  .hexdump{padding:14px 14px 16px;overflow:hidden;flex:1;min-height:0}
  .hexrows{
    display:flex;flex-direction:column;gap:1px;font-size:11.5px;
    -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);
    mask-image:linear-gradient(to bottom,#000 62%,transparent);
  }
  .hrow2{display:flex;gap:10px;white-space:nowrap}
  .haddr{color:var(--mag);min-width:7ch}
  .hbytes{color:var(--dim);letter-spacing:.08em}
  .hbytes b{font-weight:400;color:var(--cyn);text-shadow:0 0 7px rgba(0,240,255,.8)}
  .hascii{color:var(--dim);margin-left:auto}

  @media (max-width:1800px){ }
  @media (min-width:1800px){ #ico{height:240px} body{font-size:14.5px} }
  @media (max-width:860px){
    body{overflow:auto}
    .app{height:auto;grid-template-rows:auto auto}
    main{grid-template-columns:1fr}
    .consolep{min-height:60vh}
    .status .nodeid{display:none}
  }
  @media (max-width:480px){
    header .hrow{flex-direction:column;align-items:flex-start}
    .pbar{width:14ch}
  }

  @media (prefers-reduced-motion:reduce){
    .sweep,.flicker,.gridfloor .plane,.led,.cursor{animation:none!important}
    h1.glitch{animation:none}
  }
</style>
</head>
<body>

<div class="crt scanlines"></div>
<div class="crt sweep"></div>
<div class="crt flicker"></div>
<div class="crt vignette"></div>
<div class="gridfloor"><div class="plane"></div></div>

<div class="app">
  <header class="panel">
    <span class="plabel">System</span>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="hrow">
      <h1 id="title">KESTREL<span class="sl">//</span>OS<span class="ver">v9.4.1 Nightjar</span></h1>
      <div class="status">
        <span class="led" id="led"></span>
        <span class="nodeid">NODE <b>NJ-07·KESTREL</b></span>
        <span>LINK <b>SECURE</b></span>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel consolep">
      <span class="plabel">Console</span>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="log" id="log"></div>
      <div class="promptline">
        <span class="p">operator@kestrel:~$</span>
        <input id="cmd" autocomplete="off" spellcheck="false" disabled aria-label="command input">
      </div>
    </section>

    <aside class="side">
      <div class="panel core">
        <span class="plabel">Core assembly</span>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <canvas id="ico"></canvas>
        <div class="angleread" id="angle">θ 0.0°</div>
      </div>
      <div class="panel gauges">
        <span class="plabel">Telemetry</span>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="gauge">
          <div class="grow"><span class="gname">Core temp</span><span class="gval" id="gTemp">41.2 °C</span></div>
          <div class="gbar"><i id="gTempBar"></i></div>
        </div>
        <div class="gauge">
          <div class="grow"><span class="gname">Flux</span><span class="gval" id="gFlux">62 %</span></div>
          <div class="gbar"><i id="gFluxBar"></i></div>
        </div>
      </div>
      <div class="panel hexdump">
        <span class="plabel">Memory · 0x7f3a</span>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="hexrows" id="hexrows"></div>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- helpers ---------- */
var log = document.getElementById("log");
var input = document.getElementById("cmd");
function scrollDown(){ log.scrollTop = log.scrollHeight; }
function span(cls, text){
  var s = document.createElement("span");
  if (cls) s.className = cls;
  s.textContent = text;
  return s;
}
function stamp(){
  var d = new Date();
  return "[" + String(d.getHours()).padStart(2,"0") + ":" +
    String(d.getMinutes()).padStart(2,"0") + ":" +
    String(d.getSeconds()).padStart(2,"0") + "." +
    String(d.getMilliseconds()).padStart(3,"0").slice(0,2) + "]";
}
function addLine(nodes){
  var l = document.createElement("div");
  l.className = "line";
  nodes.forEach(function(n){ l.appendChild(n); });
  log.appendChild(l);
  scrollDown();
  return l;
}

/* ---------- live clock ---------- */
setInterval(function(){
  var d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
}, 500);

/* ---------- header glitch ---------- */
var title = document.getElementById("title");
function glitch(){
  if (!reduce){
    title.classList.remove("glitch");
    void title.offsetWidth;
    title.classList.add("glitch");
    setTimeout(function(){ title.classList.remove("glitch"); }, 430);
  }
}
(function scheduleGlitch(){
  setTimeout(function(){ glitch(); scheduleGlitch(); }, 2500 + Math.random()*6000);
})();

/* ---------- typing engine ---------- */
function typeLine(nodes, text, done){
  var line = document.createElement("div");
  line.className = "line";
  nodes.forEach(function(n){ line.appendChild(n); });
  var txt = span(null, "");
  var cur = span("cursor", " ");
  line.appendChild(txt); line.appendChild(cur);
  log.appendChild(line);
  var i = 0;
  function step(){
    if (reduce){ txt.textContent = text; cur.remove(); done && done(); scrollDown(); return; }
    var burst = Math.random() < 0.06 ? 2 : 1;
    i = Math.min(text.length, i + burst);
    txt.textContent = text.slice(0, i);
    scrollDown();
    if (i < text.length){
      setTimeout(step, 14 + Math.random()*26);
    } else {
      cur.remove();
      done && done();
    }
  }
  step();
}
function tagged(text, ok){
  var pre = span("ts", stamp() + " ");
  var nodes = [pre];
  return {nodes:nodes, text:text, ok:ok};
}
function printTagged(text, ok){
  var pre = span("ts", stamp() + " ");
  var line = addLine([pre, span(null, text + "  ")]);
  line.appendChild(span(ok ? "oktag" : "warntag", ok ? "[ OK ]" : "[WARN]"));
}
function progressBar(label, done){
  var line = document.createElement("div");
  line.className = "line";
  line.appendChild(span("ts", stamp() + " "));
  line.appendChild(span(null, label + " "));
  var bar = document.createElement("span");
  bar.className = "pbar";
  var fill = document.createElement("i");
  bar.appendChild(fill);
  line.appendChild(bar);
  var pct = span("ppct", "  0%");
  line.appendChild(pct);
  log.appendChild(line); scrollDown();
  var v = 0;
  if (reduce){ fill.style.width = "100%"; pct.textContent = " 100%"; done(); return; }
  (function step(){
    v = Math.min(100, v + 3 + Math.random()*7);
    fill.style.width = v + "%";
    pct.textContent = " " + Math.floor(v) + "%";
    scrollDown();
    if (v < 100) setTimeout(step, 55 + Math.random()*80);
    else done();
  })();
}

/* ---------- boot sequence ---------- */
var BOOT = [
  ["Mounting cortex partition nj0 …", true],
  ["Verifying firmware signature 0x9E37 …", true],
  ["Calibrating Nightjar antenna array …", false],
  ["Decrypting operator keyring …", true],
  ["Purging stale dreamcache …", true],
  ["Linking street-level mesh uplink …", true],
  ["Ambient governance daemon absent — continuing offline.", false]
];
var banner = [
"  _  __     _         _      _  ___ ",
" | |/ /___ | | _____ | |    / |/ _ \\",
" | ' // _ \\| |/ / _ \\| |   | | | | |",
" | . \\ (_) |   | (_) | |___| | |_| |",
" |_|\\_\\___/|_|\\_\\___/|______|_|\\___|"
].join("\n");

function boot(){
  var bl = addLine([span("banner", banner)]);
  scrollDown();
  var idx = 0;
  function next(){
    if (idx < BOOT.length){
      var item = BOOT[idx++];
      var pre = span("ts", stamp() + " ");
      var nodes = [pre];
      var holder = {nodes:nodes, text:item[0], ok:item[1]};
      var line = document.createElement("div");
      line.className = "line";
      nodes.forEach(function(n){ line.appendChild(n); });
      var txt = span(null,""); var cur = span("cursor"," ");
      line.appendChild(txt); line.appendChild(cur);
      log.appendChild(line);
      var i = 0;
      (function type(){
        if (reduce){ txt.textContent = item[0]; }
        else {
          var burst = Math.random() < 0.05 ? 2 : 1;
          i = Math.min(item[0].length, i + burst);
          txt.textContent = item[0].slice(0,i);
          scrollDown();
          if (i < item[0].length){ setTimeout(type, 14 + Math.random()*26); }
        }
        if (reduce || i >= item[0].length){
          cur.remove();
          line.appendChild(span(" "));
          line.appendChild(span(item[1] ? "oktag" : "warntag", item[1] ? "[ OK ]" : "[WARN]"));
          scrollDown();
          setTimeout(next, reduce ? 0 : 160 + Math.random()*260);
        }
      })();
    } else {
      progressBar("Hydrating memory lattice", function(){
        progressBar("Loading operator profile", function(){
          addLine([span("c-mint","Welcome, operator. KESTREL//OS is awake. Type "), span("c-cyn","help"), span(null," for commands.")]);
          input.disabled = false;
          input.focus();
        });
      });
    }
  }
  setTimeout(next, 400);
}
boot();

/* ---------- commands ---------- */
var history = [];
var hIdx = -1;
var busy = false;

var CMDS = {
  help: function(){
    var rows = [
      ["help", "list every verb this shell knows"],
      ["status", "subsystem table, live states"],
      ["scan", "sweep the spectrum for signals"],
      ["about", "what this artifact actually is"],
      ["clear", "wipe the console log"]
    ];
    addLine([span("c-cyn","COMMANDS")]);
    rows.forEach(function(r){
      var line = addLine([span("c-mag","  " + r[0].padEnd(9)), span(null, r[1])]);
    });
  },
  status: function(){
    var rows = [
      ["cortex", "ONLINE", true],
      ["mesh uplink", "NOMINAL", true],
      ["dreamcache", "86% FULL", false],
      ["governance daemon", "ABSENT (fine)", false],
      ["security lattice", "ARMED", true]
    ];
    addLine([span("c-cyn","SUBSYSTEMS")]);
    rows.forEach(function(r){
      addLine([span(null,"  " + r[0].padEnd(20)), span(r[2] ? "c-mint" : "c-amb", r[1])]);
    });
  },
  about: function(){
    addLine([span(null,"KESTREL//OS v9.4.1 Nightjar — a boot screen wearing a console.")]);
    addLine([span(null,"This entire operating system is one offline HTML file.")]);
    addLine([span(null,"No network, no fonts, no libraries. The Nightjar is a rumour we keep alive.")]);
  },
  clear: function(){ log.innerHTML = ""; }
};

function runScan(){
  busy = true; input.disabled = true;
  addLine([span("ts", stamp() + " "), span(null,"Sweeping spectrum 2.4–5.8 GHz …")]);
  progressBar("Scanning", function(){
    var signals = [
      ["0x4F2A", "corner-bakery beacon", "-63 dBm", "benign"],
      ["0x91D3", "unregistered relay «nightjar-2»", "-71 dBm", "unclassified"],
      ["0xDEAD", "corp counter-net drone", "-44 dBm", "hostile"]
    ];
    var i = 0;
    (function next(){
      if (i < signals.length){
        var s = signals[i++];
        var line = addLine([
          span("ts", stamp() + " "),
          span("c-mag", s[0] + "  "),
          span(null, s[1].padEnd(34)),
          span("c-dim", s[2] + "  "),
          span(s[3]==="hostile" ? "c-err" : (s[3]==="benign" ? "c-mint" : "c-amb"), s[3])
        ]);
        setTimeout(next, reduce ? 0 : 340);
      } else {
        addLine([span("ts", stamp() + " "), span("c-cyn","3 signals · 1 hostile · recommend EMP civility")]);
        glitch();
        busy = false; input.disabled = false; input.focus();
      }
    })();
  });
}

input.addEventListener("keydown", function(e){
  if (busy) return;
  if (e.key === "ArrowUp"){
    e.preventDefault();
    if (history.length){
      hIdx = hIdx < 0 ? history.length - 1 : Math.max(0, hIdx - 1);
      input.value = history[hIdx];
    }
  } else if (e.key === "ArrowDown"){
    e.preventDefault();
    if (hIdx >= 0){
      hIdx++;
      if (hIdx >= history.length){ hIdx = -1; input.value = ""; }
      else input.value = history[hIdx];
    }
  } else if (e.key === "Enter"){
    var raw = input.value.trim();
    input.value = "";
    addLine([span("c-mag","operator@kestrel:~$ "), span(null, raw)]);
    if (!raw) return;
    history.push(raw); hIdx = -1;
    var name = raw.toLowerCase().split(/\s+/)[0];
    if (name === "scan"){ runScan(); }
    else if (CMDS[name]){ CMDS[name](); }
    else {
      addLine([span("ts", stamp() + " "), span("c-err","unknown command: " + name + " — type help")]);
    }
  }
});
document.querySelector(".consolep").addEventListener("click", function(){
  if (!busy) input.focus();
});

/* ---------- icosahedron canvas ---------- */
var cv = document.getElementById("ico");
var ctx = cv.getContext("2d");
var PHI = (1 + Math.sqrt(5)) / 2;
var V = [
  [-1,PHI,0],[1,PHI,0],[-1,-PHI,0],[1,-PHI,0],
  [0,-1,PHI],[0,1,PHI],[0,-1,-PHI],[0,1,-PHI],
  [PHI,0,-1],[PHI,0,1],[-PHI,0,-1],[-PHI,0,1]
].map(function(v){
  var l = Math.hypot(v[0],v[1],v[2]);
  return [v[0]/l, v[1]/l, v[2]/l];
});
var E = [];
for (var i = 0; i < 12; i++)
  for (var j = i+1; j < 12; j++){
    var dx=V[i][0]-V[j][0], dy=V[i][1]-V[j][1], dz=V[i][2]-V[j][2];
    if (Math.hypot(dx,dy,dz) < 1.2) E.push([i,j]);
  }
var ang = 0;
function sizeCanvas(){
  var dpr = Math.min(devicePixelRatio || 1, 3);
  var r = cv.getBoundingClientRect();
  cv.width = Math.max(2, r.width * dpr);
  cv.height = Math.max(2, r.height * dpr);
}
sizeCanvas();
window.addEventListener("resize", function(){ sizeCanvas(); if (reduce) drawIco(0); });

function drawIco(t){
  var dpr = Math.min(devicePixelRatio||1, 3);
  var w = cv.width, h = cv.height;
  ctx.clearRect(0,0,w,h);
  var cx = w/2, cy = h/2, R = Math.min(w,h) * 0.34;
  /* static outer ring */
  ctx.strokeStyle = "rgba(255,43,214,.5)";
  ctx.lineWidth = Math.max(1, dpr*0.7);
  ctx.beginPath(); ctx.arc(cx, cy, R*1.45, 0, Math.PI*2); ctx.stroke();
  /* dashed rotating arc */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang * 1.6);
  ctx.setLineDash([4*dpr, 5*dpr]);
  ctx.strokeStyle = "rgba(255,43,214,.75)";
  ctx.beginPath(); ctx.arc(0, 0, R*1.32, -0.7, 1.8); ctx.stroke();
  ctx.restore();
  /* rotate vertices */
  var a = ang, b = ang * 0.6;
  var ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
  var P = V.map(function(v){
    var x = v[0]*ca - v[2]*sa, z = v[0]*sa + v[2]*ca;
    var y = v[1]*cb - z*sb; z = v[1]*sb + z*cb;
    var persp = 2.6 / (2.6 + z);
    return {x: cx + x*R*persp, y: cy + y*R*persp, z: z};
  });
  E.forEach(function(e){
    var p1 = P[e[0]], p2 = P[e[1]];
    var depth = 1 - ((p1.z + p2.z)/2 + 1)/2; /* 0 far, 1 near */
    var alpha = 0.15 + depth * 0.75;
    ctx.strokeStyle = "rgba(0,240,255," + alpha.toFixed(3) + ")";
    ctx.lineWidth = Math.max(1, dpr * (0.4 + depth*0.9));
    if (depth > 0.6){ ctx.shadowColor = "rgba(0,240,255,.8)"; ctx.shadowBlur = 6*dpr; }
    else ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  });
  ctx.shadowBlur = 0;
  P.forEach(function(p){
    var depth = 1 - (p.z+1)/2;
    ctx.fillStyle = "rgba(255,43,214," + (0.35 + depth*0.6).toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, dpr*(0.9+depth)), 0, Math.PI*2); ctx.fill();
  });
  document.getElementById("angle").textContent = "θ " + ((ang*57.2958)%360).toFixed(1) + "°";
}
function tick(){
  ang += 0.012;
  drawIco(ang);
  if (!reduce) requestAnimationFrame(tick);
}
if (reduce) drawIco(0); else tick();

/* ---------- gauges ---------- */
function updGauges(){
  var temp = 39 + Math.random()*9;
  var flux = 45 + Math.random()*45;
  document.getElementById("gTemp").textContent = temp.toFixed(1) + " °C";
  document.getElementById("gFlux").textContent = Math.round(flux) + " %";
  document.getElementById("gTempBar").style.transform = "scaleX(" + (temp/60).toFixed(3) + ")";
  document.getElementById("gFluxBar").style.transform = "scaleX(" + (flux/100).toFixed(3) + ")";
}
updGauges();
setInterval(updGauges, 1400);

/* ---------- hex dump ---------- */
var hexwrap = document.getElementById("hexrows");
var addr = 0x7f3a00;
var HEXCH = "0123456789ABCDEF";
function randByte(){ return Math.floor(Math.random()*256); }
function hex2(n){ return HEXCH[(n>>4)&15] + HEXCH[n&15]; }
function addHexRow(){
  var row = document.createElement("div");
  row.className = "hrow2";
  var a = document.createElement("span"); a.className = "haddr";
  a.textContent = "0x" + hex2((addr>>16)&255) + hex2((addr>>8)&255) + hex2(addr&255);
  addr = (addr + 8) & 0xFFFFFF;
  var bytes = document.createElement("span"); bytes.className = "hbytes";
  var ascii = document.createElement("span"); ascii.className = "hascii";
  var asc = "";
  for (var i = 0; i < 8; i++){
    var b = randByte();
    var s = document.createElement("span");
    s.textContent = hex2(b) + " ";
    if (Math.random() < 0.12){
      var bb = document.createElement("b");
      bb.textContent = hex2(b);
      s.textContent = ""; s.appendChild(bb); s.appendChild(document.createTextNode(" "));
    }
    bytes.appendChild(s);
    asc += (b >= 32 && b < 127) ? String.fromCharCode(b) : "·";
  }
  ascii.textContent = asc;
  row.appendChild(a); row.appendChild(bytes); row.appendChild(ascii);
  hexwrap.insertBefore(row, hexwrap.firstChild);
  while (hexwrap.children.length > 14) hexwrap.removeChild(hexwrap.lastChild);
}
for (var k = 0; k < 14; k++) addHexRow();
setInterval(addHexRow, reduce ? 1500 : 220);
})();
</script>
