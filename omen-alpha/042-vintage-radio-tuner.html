<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>042 · Marconi Meridian 55 — Vintage Radio Tuner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height:100%; }
  body {
    font-family:'Iowan Old Style','Palatino','Palatino Linotype',Georgia,serif;
    background:radial-gradient(120% 100% at 50% 30%, #2D2119 0%, #1A120B 55%, #0A0705 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px 20px 56px; min-height:100vh;
  }
  .brandline {
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:9.5px; letter-spacing:.5em; text-transform:uppercase; color:#8a6a3a;
    margin-bottom:18px; text-shadow:0 1px 0 #000;
  }
  .brandline b { color:#C9A05C; font-weight:normal; }

  /* ---------- cabinet ---------- */
  .cabinet {
    position:relative;
    width:min(760px, 100%);
    border-radius:42px 42px 26px 26px;
    padding:26px 26px 24px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,0) 30%),
      repeating-linear-gradient(115deg, rgba(0,0,0,.06) 0 2px, rgba(0,0,0,0) 2px 7px, rgba(255,255,255,.02) 7px 9px),
      linear-gradient(165deg, #7A4525 0%, #5A2F18 46%, #3A1C0E 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,220,180,.28),
      inset 0 -3px 8px rgba(0,0,0,.55),
      0 30px 60px rgba(0,0,0,.65),
      0 10px 24px rgba(0,0,0,.5);
    overflow:hidden;
  }
  .cabinet::after {           /* diagonal glossy sheen */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(125deg, rgba(255,240,210,.09) 0%, rgba(255,240,210,0) 28%,
               rgba(255,240,210,0) 62%, rgba(255,220,180,.05) 84%, rgba(255,240,210,0) 100%);
    border-radius:inherit;
  }

  /* ---------- face panel ---------- */
  .face {
    position:relative; z-index:1;
    border-radius:20px 20px 12px 12px;
    background:linear-gradient(180deg, #EFE2C4 0%, #E6D6B0 55%, #D9C79F 100%);
    box-shadow:
      inset 0 2px 6px rgba(120,90,50,.35),
      inset 0 -2px 5px rgba(120,90,50,.25),
      0 1px 2px rgba(0,0,0,.4);
    padding:16px;
    display:grid;
    grid-template-columns:1.08fr .92fr;
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"dial dial" "grille display" "knobs knobs";
    gap:14px;
  }

  /* ---------- dial ---------- */
  .dialwrap { grid-area:dial; position:relative; }
  .dial {
    position:relative; height:88px; border-radius:10px;
    background:#1C1108;
    border:1px solid #A9823F;
    box-shadow:
      0 0 0 3px rgba(0,0,0,.35),
      inset 0 0 12px rgba(0,0,0,.9),
      0 4px 8px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .dialglow {
    position:absolute; inset:0;
    background:radial-gradient(70% 120% at 50% 100%, rgba(255,179,71,.42) 0%, rgba(255,179,71,.12) 45%, rgba(255,179,71,0) 75%);
    animation:flick 2.7s steps(1) infinite;
  }
  @keyframes flick { 0%,100%{opacity:1} 38%{opacity:.93} 61%{opacity:.97} 82%{opacity:.9} }
  .dialscale { position:absolute; inset:0; }
  .dialnums {
    position:absolute; left:6%; right:6%; top:9px; height:18px;
    display:flex; justify-content:space-between;
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:11px; color:#FFB347; text-shadow:0 0 6px rgba(255,140,40,.8), 0 0 2px rgba(255,120,20,.9);
  }
  .dialticks {
    position:absolute; left:6%; right:6%; top:30px; height:8px;
    background:repeating-linear-gradient(90deg, rgba(255,179,71,.75) 0 1px, transparent 1px 9px);
  }
  .dialticks.major {
    top:29px; height:14px;
    background:repeating-linear-gradient(90deg, rgba(255,196,110,.95) 0 2px, transparent 2px 90px);
  }
  .cities { position:absolute; left:6%; right:6%; top:48px; bottom:8px; }
  .city {
    position:absolute; transform:translateX(-50%);
    font-style:italic; font-size:12.5px; color:#C7A679; white-space:nowrap;
    text-shadow:0 0 4px rgba(0,0,0,.8);
    transition:color .35s ease, text-shadow .35s ease;
  }
  .city.r2 { font-size:11.5px; }
  .city.lit {
    color:#FFFFFF;
    text-shadow:0 0 8px rgba(255,179,71,1), 0 0 22px rgba(255,150,50,.95), 0 0 3px #fff;
  }
  .needle {
    position:absolute; top:4px; bottom:4px; width:3px; margin-left:-1.5px;
    background:#C8322A; border-radius:1px;
    box-shadow:0 0 6px rgba(255,60,40,.9), 0 0 16px rgba(255,80,40,.5);
    transition:left .12s linear;
  }
  .needle::before {
    content:""; position:absolute; top:-3px; left:50%; transform:translateX(-50%) rotate(45deg);
    width:9px; height:9px; background:#C8322A;
    box-shadow:0 0 8px rgba(255,60,40,.9);
  }
  .dialcap {
    position:absolute; left:0; right:0; bottom:-16px; text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:8.5px;
    letter-spacing:.4em; color:#8a6a44; text-transform:uppercase;
  }

  /* ---------- grille ---------- */
  .grille { grid-area:grille; position:relative; border-radius:14px; padding:9px;
    background:linear-gradient(180deg, #C9A05C, #8f6a30);
    box-shadow:inset 0 0 0 1px rgba(255,230,180,.4), 0 2px 6px rgba(0,0,0,.4);
  }
  .fabric {
    position:relative; height:100%; min-height:170px; border-radius:8px; overflow:hidden;
    background:
      repeating-linear-gradient(55deg,  rgba(0,0,0,.28) 0 1.5px, rgba(255,255,255,0) 1.5px 6px),
      repeating-linear-gradient(-55deg, rgba(0,0,0,.22) 0 1.5px, rgba(255,255,255,0) 1.5px 6px),
      repeating-linear-gradient(0deg,  #C9A97A 0 3px, #A3835A 3px 6px);
    box-shadow:inset 0 0 14px rgba(40,20,5,.75), inset 0 2px 3px rgba(255,240,200,.3);
    display:flex; align-items:center; justify-content:center;
  }
  .fabric svg { opacity:.92; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }

  /* ---------- display window ---------- */
  .display { grid-area:display; position:relative; border-radius:10px;
    background:#0a0603; border:2px solid #23140a;
    box-shadow:inset 0 0 16px #000, inset 0 1px 0 rgba(255,200,140,.15), 0 1px 3px rgba(0,0,0,.5);
    overflow:hidden; min-height:236px;
  }
  #noiseCanvas { position:absolute; inset:0; width:100%; height:100%; opacity:1; transition:opacity .9s ease; }
  #noiseCanvas.dim { opacity:.08; }
  .scanband {
    position:absolute; left:0; right:0; height:34%;
    background:linear-gradient(180deg, rgba(255,170,80,0) 0%, rgba(255,170,80,.10) 45%, rgba(255,170,80,0) 100%);
    animation:scan 6s linear infinite; pointer-events:none;
  }
  @keyframes scan { from { top:-34%; } to { top:100%; } }
  .searching {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:11px; letter-spacing:.55em; text-transform:uppercase;
    color:#E8A25B; text-shadow:0 0 8px rgba(255,140,50,.7);
    opacity:.85; transition:opacity .4s ease;
  }
  .stationcard {
    position:absolute; inset:0; padding:20px 18px;
    display:flex; flex-direction:column; justify-content:center; text-align:center;
    opacity:0; transform:translateY(12px);
    transition:opacity .6s ease, transform .6s ease; pointer-events:none;
  }
  .stationcard.on { opacity:1; transform:translateY(0); }
  .sc-city { font-size:27px; letter-spacing:.14em; color:#FFF1D6; text-shadow:0 0 14px rgba(255,190,110,.55); }
  .sc-freq { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; letter-spacing:.3em; color:#E29A3D; margin-top:8px; }
  .sc-desc { font-style:italic; font-size:12px; line-height:1.5; color:#D9B98C; margin-top:10px; }
  .vuwrap { margin-top:14px; padding:0 6px; }

  /* ---------- knob row ---------- */
  .knobrow { grid-area:knobs; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:2px 8px 4px; }
  .knobgroup { display:flex; align-items:center; gap:14px; }
  .knoblabel { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:8.5px; letter-spacing:.3em;
    text-transform:uppercase; color:#7a5a34; text-align:center; margin-top:7px; }
  .knob { position:relative; border-radius:50%; cursor:ns-resize; touch-action:none;
    background:radial-gradient(circle at 35% 30%, #3a3a3e 0%, #1a1a1d 45%, #0b0b0d 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.22), 0 5px 12px rgba(0,0,0,.65), 0 0 0 1px #000;
    outline:none; flex:none;
  }
  .knob::before {   /* fluted ridge ring */
    content:""; position:absolute; inset:2px; border-radius:50%;
    background:repeating-conic-gradient(rgba(255,255,255,.16) 0deg 4deg, rgba(0,0,0,.35) 4deg 12deg);
    -webkit-mask:radial-gradient(circle, transparent 58%, #000 59%, #000 100%);
    mask:radial-gradient(circle, transparent 58%, #000 59%, #000 100%);
  }
  .knob::after {    /* indicator line */
    content:""; position:absolute; left:50%; top:7%; width:2.5px; height:34%;
    transform:translateX(-50%); border-radius:2px;
    background:linear-gradient(180deg, #F2E4C2, #cbb284);
    box-shadow:0 0 3px rgba(0,0,0,.7);
  }
  .knob:hover, .knob:focus-visible { box-shadow:inset 0 1px 1px rgba(255,255,255,.22), 0 5px 12px rgba(0,0,0,.65), 0 0 0 1px #000, 0 0 14px rgba(230,180,90,.55); }
  .knob .rot { position:absolute; inset:0; border-radius:50%; }
  .knob-small { width:64px; height:64px; }
  .knob-big   { width:92px; height:92px; }
  .vents { display:flex; gap:7px; position:relative; z-index:0; padding:0 6px; }
  .vent {
    width:7px; height:64px; border-radius:4px;
    background:linear-gradient(180deg, #120a04, #241105 55%, #33190a);
    box-shadow:inset 0 0 3px #000, 0 1px 0 rgba(255,220,170,.15);
    position:relative; overflow:hidden;
  }
  .vent::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,150,50,.0), rgba(255,150,50,.55));
    animation:breath 3.4s ease-in-out infinite;
    opacity:.4;
  }
  @keyframes breath { 0%,100% { opacity:.28; } 50% { opacity:.75; } }
  .valveglow {
    position:absolute; left:-26px; right:-26px; top:-10px; bottom:-10px; z-index:-1;
    background:radial-gradient(50% 60% at 50% 50%, rgba(255,130,40,.34), rgba(255,130,40,0) 70%);
    filter:blur(14px); pointer-events:none;
  }
  .powerpill {
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10px; letter-spacing:.32em;
    text-transform:uppercase; color:#4a3014;
    background:linear-gradient(180deg, #F4E8CB, #DECBA2);
    border:1px solid #b09562; border-radius:999px;
    padding:9px 20px 8px; cursor:pointer; align-self:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 5px rgba(0,0,0,.45);
    transition:box-shadow .25s ease, transform .15s ease;
  }
  .powerpill:hover { box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 2px 5px rgba(0,0,0,.45), 0 0 12px rgba(255,190,100,.5); }
  .powerpill:active { transform:translateY(1px); }
  .powerpill.on { color:#7a3c00; background:linear-gradient(180deg,#FFE2AE,#EBC684); }

  @media (max-width:640px){
    body { padding:32px 12px 44px; }
    .cabinet { border-radius:30px 30px 20px 20px; padding:16px; }
    .face { grid-template-columns:1fr; grid-template-rows:auto auto auto auto;
      grid-template-areas:"dial" "display" "grille" "knobs"; gap:22px; }
    .knobrow { flex-wrap:wrap; justify-content:center; }
    .vents { order:3; width:100%; justify-content:center; padding-top:8px; }
    .dial { height:96px; }
  }
</style>
</head>
<body>
  <div class="brandline">— <b>MARCONI</b> · meridian series · est. MCMLV —</div>

  <div class="cabinet">
    <div class="face">
      <div class="dialwrap">
        <div class="dial">
          <div class="dialglow"></div>
          <div class="dialscale">
            <div class="dialnums" id="dialnums"></div>
            <div class="dialticks major"></div>
            <div class="dialticks"></div>
            <div class="cities" id="cities"></div>
          </div>
          <div class="needle" id="needle"></div>
        </div>
        <div class="dialcap">kilohertz · medium wave</div>
      </div>

      <div class="grille">
        <div class="fabric">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="29" fill="none" stroke="#E2B869" stroke-width="2"/>
            <circle cx="32" cy="32" r="24" fill="none" stroke="#B4862F" stroke-width="1"/>
            <path d="M32 12 L40 32 L32 52 L24 32 Z" fill="#E2B869"/>
            <path d="M12 32 L32 24 L52 32 L32 40 Z" fill="#B4862F"/>
            <circle cx="32" cy="32" r="4.5" fill="#8a5c14"/>
          </svg>
        </div>
      </div>

      <div class="display">
        <canvas id="noiseCanvas"></canvas>
        <div class="scanband"></div>
        <div class="searching" id="searching">searching</div>
        <div class="stationcard" id="stationCard">
          <div class="sc-city" id="scCity"></div>
          <div class="sc-freq" id="scFreq"></div>
          <div class="sc-desc" id="scDesc"></div>
          <div class="vuwrap">
            <svg id="vu" viewBox="0 0 220 96" width="100%" aria-hidden="true">
              <rect x="1" y="1" width="218" height="94" rx="7" fill="#EFE2C4" stroke="#8a6a3a"/>
              <path d="M28 84 A 82 82 0 0 1 192 84" fill="none" stroke="#3a2a18" stroke-width="1.5"/>
              <path d="M158 33.4 A 82 82 0 0 1 192 84" fill="none" stroke="#C8322A" stroke-width="7"/>
              <g font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#3a2a18">
                <text x="22" y="92">0</text><text x="103" y="12">5</text><text x="186" y="92">10</text>
                <text x="168" y="20" fill="#C8322A">OVERLOAD</text>
              </g>
              <g id="vuNeedle">
                <path d="M110 84 L110 84" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>
                <circle cx="110" cy="84" r="6" fill="#241a10"/>
                <circle cx="110" cy="84" r="2.4" fill="#E8D9B4"/>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <div class="knobrow">
        <div class="knobgroup">
          <div>
            <div class="knob knob-small" id="volKnob" tabindex="0" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="6"><div class="rot"></div></div>
            <div class="knoblabel">volume</div>
          </div>
        </div>
        <div class="vents" id="vents" aria-hidden="true">
          <div class="valveglow"></div>
        </div>
        <div class="knobgroup">
          <button class="powerpill" id="powerBtn" aria-pressed="false">Power</button>
          <div>
            <div class="knob knob-big" id="tuneKnob" tabindex="0" role="slider" aria-label="Tuning" aria-valuemin="600" aria-valuemax="1500"><div class="rot"></div></div>
            <div class="knoblabel">tuning</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
"use strict";
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var FREQ_MIN = 600, FREQ_MAX = 1500;
var freq = 600 + (1500-600) * 0.18;   // current tuning, kHz
var volume = 0.6;
var powered = false;

var stations = [
  { city:"Madrid",     f:621,  row:0, desc:"a late tango programme drifting in from a warm plaza" },
  { city:"Lisbon",     f:666,  row:0, desc:"fado hour by the river, sung under electric lamps" },
  { city:"Luxembourg", f:729,  row:0, desc:"relay of the continental chart show, crackling with promise" },
  { city:"Oslo",       f:630,  row:1, desc:"the northern service reads shipping news and quiet verse" },
  { city:"Paris",      f:864,  row:0, desc:"a jazz club broadcast, smoke and trumpet, well past midnight" },
  { city:"Hilversum",  f:1008, row:1, desc:"the solemn green dome of the Dutch evening concert" },
  { city:"Athens",     f:981,  row:1, desc:"bougatsa and bells: a Mediterranean morning magazine" },
  { city:"Stockholm",  f:1062, row:1, desc:"an archive hour of tape recordings from the archipelago" },
  { city:"Warsaw",     f:1386, row:0, desc:"chopin nocturnes requested by listeners at home" },
  { city:"Vienna",     f:1476, row:0, desc:"the operetta hour, waltzing through the ethereal fog" }
];
var CAPTURE = 9;   // kHz capture range

/* ---------- dial numbers ---------- */
var dialnums = document.getElementById("dialnums");
for (var f = FREQ_MIN; f <= FREQ_MAX; f += 100){
  var s = document.createElement("span");
  s.textContent = f;
  dialnums.appendChild(s);
}

/* ---------- cities on the dial ---------- */
var citiesEl = document.getElementById("cities");
stations.forEach(function(st, i){
  var el = document.createElement("div");
  el.className = "city" + (st.row ? " r2" : "");
  el.textContent = st.city;
  el.style.left = ((st.f - FREQ_MIN) / (FREQ_MAX - FREQ_MIN) * 100) + "%";
  el.style.top = st.row ? "1.35em" : "0";
  el.dataset.f = st.f;
  citiesEl.appendChild(el);
  st.el = el;
});

/* ---------- needle + lock ---------- */
var needle = document.getElementById("needle");
var searchingEl = document.getElementById("searching");
var stationCard = document.getElementById("stationCard");
var scCity = document.getElementById("scCity");
var scFreq = document.getElementById("scFreq");
var scDesc = document.getElementById("scDesc");
var noiseCanvas = document.getElementById("noiseCanvas");
var nctx = noiseCanvas.getContext("2d");
var currentStation = null;

function tunedStation(){
  var best = null, bestD = 1e9;
  stations.forEach(function(st){
    var d = Math.abs(st.f - freq);
    if (d < CAPTURE && d < bestD){ best = st; bestD = d; }
  });
  return best;
}

function refreshDial(){
  var pct = (freq - FREQ_MIN) / (FREQ_MAX - FREQ_MIN);
  needle.style.left = (6 + pct * 88) + "%";
  var st = tunedStation();
  stations.forEach(function(s){ s.el.classList.toggle("lit", s === st); });
  if (st !== currentStation){
    currentStation = st;
    if (st){
      scCity.textContent = st.city;
      scFreq.textContent = st.f + " kHz · medium wave";
      scDesc.textContent = "Tonight: " + st.desc + ".";
      stationCard.classList.add("on");
      searchingEl.style.opacity = "0";
      noiseCanvas.classList.add("dim");
      tuneAudio(true);
    } else {
      stationCard.classList.remove("on");
      searchingEl.style.opacity = "0.85";
      noiseCanvas.classList.remove("dim");
      tuneAudio(false);
    }
  }
}

/* ---------- noise canvas ---------- */
var noiseW = 0, noiseH = 0, noiseData = null, lastNoiseDraw = 0, scanY = 0;
function sizeNoise(){
  var r = noiseCanvas.getBoundingClientRect();
  var scale = 0.5;   // half-resolution
  noiseW = Math.max(8, Math.round(r.width * scale));
  noiseH = Math.max(8, Math.round(r.height * scale));
  noiseCanvas.width = noiseW;
  noiseCanvas.height = noiseH;
  noiseData = nctx.createImageData(noiseW, noiseH);
}
sizeNoise();
window.addEventListener("resize", sizeNoise);

function drawNoise(){
  if (!noiseData) return;
  var d = noiseData.data, i, v;
  for (i = 0; i < d.length; i += 4){
    v = Math.random();
    d[i]   = 40 + v * 215;         // strong red channel
    d[i+1] = 10 + v * 110;
    d[i+2] = 0  + v * 30;
    d[i+3] = 255;
  }
  // rolling scan band
  scanY = (scanY + 0.6) % (noiseH * 1.4);
  nctx.putImageData(noiseData, 0, 0);
  nctx.fillStyle = "rgba(255,190,110,0.18)";
  nctx.fillRect(0, scanY, noiseW, Math.max(4, noiseH * 0.14));
}

/* ---------- VU meter ---------- */
var vuNeedle = document.getElementById("vuNeedle");
var vuAngle = 0;
function setVU(deg){
  vuAngle = deg;
  var rad = (deg - 90) * Math.PI / 180;
  var x = 110 + Math.sin(rad) * 72;
  var y = 84 - Math.cos(rad) * 72;
  vuNeedle.firstElementChild.setAttribute("d", "M110 84 L" + x.toFixed(1) + " " + y.toFixed(1));
}
var vuPhase = 0;
function updateVU(now){
  var st = currentStation;
  if (st){
    vuPhase += 0.045;
    setVU(12 + Math.sin(vuPhase) * 34 + Math.sin(vuPhase * 2.7) * 5);
  } else {
    setVU(6 + (Math.random() - 0.5) * 10 + Math.random() * 8);
  }
}

/* ---------- knobs ---------- */
function makeKnob(el, onDelta, onWheel){
  var rot = el.querySelector(".rot");
  var curAngle = 0;
  var dragging = false, lastAngle = 0;
  function pointerAngle(e){
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  }
  el.addEventListener("pointerdown", function(e){
    dragging = true; lastAngle = pointerAngle(e);
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var a = pointerAngle(e);
    var d = a - lastAngle;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    lastAngle = a;
    curAngle += d;
    rot.style.transform = "rotate(" + curAngle.toFixed(1) + "deg)";
    onDelta(d / 270);   // normalized delta
  });
  el.addEventListener("pointerup", function(){ dragging = false; });
  el.addEventListener("pointercancel", function(){ dragging = false; });
  el.addEventListener("wheel", function(e){
    e.preventDefault();
    var d = (e.deltaY < 0 ? 12 : -12);
    curAngle += d;
    rot.style.transform = "rotate(" + curAngle.toFixed(1) + "deg)";
    onDelta(d / 270);
  }, { passive:false });
  el.addEventListener("keydown", function(e){
    var step = e.shiftKey ? 30 : 8;
    if (e.key === "ArrowUp" || e.key === "ArrowRight"){ e.preventDefault(); curAngle += step; onDelta(step/270); }
    if (e.key === "ArrowDown" || e.key === "ArrowLeft"){ e.preventDefault(); curAngle -= step; onDelta(-step/270); }
    rot.style.transform = "rotate(" + curAngle.toFixed(1) + "deg)";
  });
  return { set: function(angle){ curAngle = angle; rot.style.transform = "rotate(" + angle + "deg)"; } };
}

var tuneKnob = makeKnob(document.getElementById("tuneKnob"), function(norm){
  freq = Math.max(FREQ_MIN, Math.min(FREQ_MAX, freq + norm * (FREQ_MAX - FREQ_MIN) * 0.6));
  refreshDial();
  syncTuneKnob();
}, null);
function syncTuneKnob(){
  tuneKnob.set(((freq - FREQ_MIN) / (FREQ_MAX - FREQ_MIN)) * 1080);
}
syncTuneKnob();

var volKnob = makeKnob(document.getElementById("volKnob"), function(norm){
  volume = Math.max(0, Math.min(1, volume + norm * 0.5));
  document.getElementById("volKnob").setAttribute("aria-valuenow", Math.round(volume * 10));
  applyVolume();
}, null);
volKnob.set(volume * 270);

/* ---------- vents ---------- */
var ventsEl = document.getElementById("vents");
for (var v = 0; v < 10; v++){
  var vent = document.createElement("div");
  vent.className = "vent";
  if (reduced) vent.style.animation = "none";
  vent.style.setProperty("--i", v);
  ventsEl.appendChild(vent);
}
if (!reduced){
  var style = document.createElement("style");
  style.textContent = ".vent::after{ animation-delay: calc(var(--i) * -0.33s); }";
  document.head.appendChild(style);
}

/* ---------- Web Audio (created only on click) ---------- */
var actx = null, master, noiseGain, padGain, padOsc, padFilter, lfo, humGain;
function buildAudio(){
  if (actx) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = volume * 0.5; master.connect(actx.destination);

  // filtered white noise — static
  var len = actx.sampleRate * 2;
  var buf = actx.createBuffer(1, len, actx.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  var noise = actx.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  var nFilter = actx.createBiquadFilter(); nFilter.type = "lowpass"; nFilter.frequency.value = 3200;
  noiseGain = actx.createGain(); noiseGain.gain.value = 0.12;
  noise.connect(nFilter); nFilter.connect(noiseGain); noiseGain.connect(master);
  noise.start();

  // mains hum: 50 Hz sine + 100 Hz triangle
  var h1 = actx.createOscillator(); h1.type = "sine"; h1.frequency.value = 50;
  var h2 = actx.createOscillator(); h2.type = "triangle"; h2.frequency.value = 100;
  humGain = actx.createGain(); humGain.gain.value = 0.012;
  h1.connect(humGain); h2.connect(humGain); humGain.connect(master);
  h1.start(); h2.start();

  // station pad: soft low-passed sine with LFO vibrato
  padOsc = actx.createOscillator(); padOsc.type = "sine"; padOsc.frequency.value = 220;
  padFilter = actx.createBiquadFilter(); padFilter.type = "lowpass"; padFilter.frequency.value = 700;
  padGain = actx.createGain(); padGain.gain.value = 0;
  lfo = actx.createOscillator(); lfo.frequency.value = 0.4;
  var lfoAmt = actx.createGain(); lfoAmt.gain.value = 6;
  lfo.connect(lfoAmt); lfoAmt.connect(padOsc.detune);
  padOsc.connect(padFilter); padFilter.connect(padGain); padGain.connect(master);
  padOsc.start(); lfo.start();
}
function applyVolume(){
  if (master) master.gain.setTargetAtTime(volume * 0.5, actx.currentTime, 0.08);
}
function tuneAudio(locked){
  if (!actx) return;
  var t = actx.currentTime;
  noiseGain.gain.setTargetAtTime(locked ? 0.014 : 0.12, t, 0.25);
  padGain.gain.setTargetAtTime(locked ? 0.05 : 0, t, 0.5);
  if (locked && currentStation){
    padOsc.frequency.setTargetAtTime(160 + (currentStation.f - 600) * 0.42, t, 0.4);
  }
}
var powerBtn = document.getElementById("powerBtn");
powerBtn.addEventListener("click", function(){
  powered = !powered;
  powerBtn.classList.toggle("on", powered);
  powerBtn.setAttribute("aria-pressed", powered);
  if (powered){
    buildAudio();
    if (actx && actx.state === "suspended") actx.resume();
    applyVolume(); tuneAudio(!!currentStation);
  } else if (actx){
    var t = actx.currentTime;
    master.gain.setTargetAtTime(0, t, 0.1);
  }
});

/* ---------- main loop ---------- */
var throttle = reduced ? 120 : 45;   // ms between noise redraws
function loop(now){
  if (now - lastNoiseDraw > throttle){
    lastNoiseDraw = now;
    drawNoise();
    updateVU(now);
  }
  requestAnimationFrame(loop);
}
refreshDial();
requestAnimationFrame(loop);
})();
</script>
