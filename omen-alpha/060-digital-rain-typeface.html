<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain.Type — digital rain as typography</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #04100c; --head: #e8fff3; --mid: #5cffb0; --tail: #0b6b46;
    --ink: rgba(232,255,243,0.85); --dim: rgba(232,255,243,0.45);
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    color: var(--ink);
  }
  canvas#rc { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 110% 100% at 50% 46%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%);
  }
  /* HUD */
  .hud {
    position: fixed; top: 22px; left: 22px; z-index: 10;
    width: 330px; max-width: calc(100vw - 44px);
    padding: 16px 18px 18px;
    background: color-mix(in srgb, var(--bg) 62%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid color-mix(in srgb, var(--mid) 25%, transparent);
  }
  .hud .corner { position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--mid); }
  .hud .c1 { top: -1.5px; left: -1.5px; border-right: none; border-bottom: none; }
  .hud .c2 { top: -1.5px; right: -1.5px; border-left: none; border-bottom: none; }
  .hud .c3 { bottom: -1.5px; left: -1.5px; border-right: none; border-top: none; }
  .hud .c4 { bottom: -1.5px; right: -1.5px; border-left: none; border-top: none; }
  .hud h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 0.06em; color: var(--head);
    display: flex; align-items: center;
  }
  .cursor {
    display: inline-block; width: 9px; height: 15px; margin-left: 7px;
    background: var(--head);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 0%, 60% { opacity: 1; } 60.1%, 100% { opacity: 0; } }
  .pals { display: flex; gap: 8px; margin: 14px 0 4px; }
  .pal {
    flex: 1; cursor: pointer; padding: 0; border: 1px solid rgba(255,255,255,0.14);
    background: transparent; border-radius: 2px; overflow: hidden;
  }
  .pal .bar { display: block; height: 10px; }
  .pal.on { border-color: var(--head); box-shadow: 0 0 8px color-mix(in srgb, var(--mid) 55%, transparent); }
  .srow { margin-top: 12px; }
  .srow label { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .srow label b { color: var(--ink); font-weight: 400; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: color-mix(in srgb, var(--mid) 40%, transparent); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; margin-top: -4.5px; border-radius: 1px;
    background: var(--head); box-shadow: 0 0 9px var(--mid);
  }
  input[type="range"]::-moz-range-track { height: 2px; background: color-mix(in srgb, var(--mid) 40%, transparent); }
  input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border: none; border-radius: 1px; background: var(--head); box-shadow: 0 0 9px var(--mid); }
  .cmdline { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .cmdline .gt { color: var(--mid); font-weight: 700; }
  #cmd {
    flex: 1; background: transparent; border: none; outline: none;
    border-bottom: 1px solid color-mix(in srgb, var(--mid) 45%, transparent);
    color: var(--head); font: 13px/1.6 ui-monospace, monospace;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  #cmd::placeholder { color: var(--dim); }
  .resolve {
    cursor: pointer; background: transparent; color: var(--mid);
    border: 1px solid color-mix(in srgb, var(--mid) 55%, transparent);
    font: 600 9.5px/1 ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 9px; border-radius: 2px;
  }
  .resolve:hover { color: var(--head); border-color: var(--head); }
  .status { margin-top: 12px; font-size: 11px; letter-spacing: 0.1em; color: var(--mid); min-height: 15px; }
  .stats {
    position: fixed; right: 22px; bottom: 18px; z-index: 10;
    font-size: 10.5px; letter-spacing: 0.12em; color: var(--dim);
    text-align: right; line-height: 1.8; pointer-events: none;
  }
  .caption {
    position: fixed; left: 22px; bottom: 18px; z-index: 10;
    font-size: 10.5px; letter-spacing: 0.08em; color: var(--dim); line-height: 1.7;
    max-width: 330px; pointer-events: none;
  }
  @media (max-width: 640px) {
    .hud { width: calc(100vw - 44px); }
    .caption { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<canvas id="rc"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="hud" id="hud">
  <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
  <h1>Rain.Type<span class="cursor" aria-hidden="true"></span></h1>
  <div class="pals" id="pals"></div>
  <div class="srow">
    <label><span>Density</span><b id="denVal">62%</b></label>
    <input type="range" id="density" min="10" max="100" value="62">
  </div>
  <div class="srow">
    <label><span>Speed</span><b id="spdVal">1.0×</b></label>
    <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1">
  </div>
  <div class="cmdline">
    <span class="gt">&gt;</span>
    <input id="cmd" maxlength="40" placeholder="type a phrase, press enter" spellcheck="false" autocomplete="off">
    <button class="resolve" id="resolveBtn" type="button">Resolve</button>
  </div>
  <div class="status" id="status">plain rain</div>
</div>

<div class="stats" id="stats"></div>
<div class="caption">
  24 invented glyphs on a 10-unit grid, stroked with round caps ·<br>
  ten numerals and 26 capitals in bold mono · keys 1–4 change palette
</div>

<script>
(function () {
  "use strict";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var PALETTES = [
    { name: "Jade", bg: "#04100c", head: "#e8fff3", mid: "#5cffb0", tail: "#0b6b46" },
    { name: "Amber Archive", bg: "#0d0903", head: "#fff3d6", mid: "#ffb347", tail: "#7a4a0a" },
    { name: "Ice", bg: "#050912", head: "#f4fbff", mid: "#8fd3ff", tail: "#1f4f7a" },
    { name: "Rose", bg: "#0f050a", head: "#ffe9f1", mid: "#ff6fa3", tail: "#7a1f45" }
  ];
  var palIdx = reduceMotion ? 0 : 0;

  var INVENTED = [
    "M1 5 H9 M5 1 V9", "M2 2 L8 8 M8 2 L2 8", "M2 2 V8 H8", "M8 2 V8 H2",
    "M2 2 H8 V8", "M2 8 H8 M5 8 V2", "M2 5 H8 M8 2 V8", "M2 2 H8 M2 5 H8 M2 8 H6",
    "M3 1 L7 9 M7 1 L3 9", "M5 1 V4 M5 4 L2 9 M5 4 L8 9", "M2 3 H8 V7 H2 Z M5 3 V7",
    "M1 2 H9 M3 2 V9 M7 2 V9", "M2 2 V8 M2 2 H8 M8 2 V8", "M5 1 V9 M3 3 H7",
    "M2 9 L5 1 L8 9", "M2 2 L5 5 L8 2 M2 8 L5 5 L8 8", "M2 4 H8 M8 4 V8 H2",
    "M3 2 H7 V6 H3 Z M5 6 V9", "M2 2 H8 M2 5 H8 M2 8 H8", "M2 2 L8 5 L2 8",
    "M8 2 L2 5 L8 8", "M2 2 H8 M5 2 V9 M2 9 H8", "M4 1 H6 M4 9 H6 M5 1 V9",
    "M2 3 Q5 9 8 3"
  ];
  var GLYPHS = [];
  for (var gi = 0; gi < INVENTED.length; gi++) GLYPHS.push({ type: "path", d: INVENTED[gi] });
  var CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (var ci = 0; ci < CHARS.length; ci++) GLYPHS.push({ type: "text", ch: CHARS[ci] });
  var NG = GLYPHS.length; // 60
  var LETTER_INDEX = {};
  for (var li = 0; li < CHARS.length; li++) LETTER_INDEX[CHARS[li]] = INVENTED.length + li;

  var LEVELS = 14;

  // ————— canvas & grid —————
  var canvas = document.getElementById("rc");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, cell = 22, cols = 0, rows = 0;

  var streams = [];   // per column
  var atlas = null, atlasC = null, atlasCell = 0;

  function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function colorAt(t) {
    var P = PALETTES[palIdx];
    var tail = hexRGB(P.tail), mid = hexRGB(P.mid), head = hexRGB(P.head);
    var r, g, b;
    if (t < 0.5) { var u = t / 0.5; r = lerp(tail[0], mid[0], u); g = lerp(tail[1], mid[1], u); b = lerp(tail[2], mid[2], u); }
    else { var u2 = (t - 0.5) / 0.5; r = lerp(mid[0], head[0], u2); g = lerp(mid[1], head[1], u2); b = lerp(mid[2], head[2], u2); }
    return [r | 0, g | 0, b | 0];
  }

  function buildAtlas() {
    atlasCell = Math.max(8, Math.round(cell * DPR));
    atlasC = document.createElement("canvas");
    atlasC.width = NG * atlasCell; atlasC.height = LEVELS * atlasCell;
    var a = atlasC.getContext("2d");
    a.lineCap = "round"; a.lineJoin = "round";
    for (var lv = 0; lv < LEVELS; lv++) {
      var t = lv / (LEVELS - 1);
      var col = colorAt(t);
      var alpha = lv <= 3 ? 0.18 + 0.24 * t : 1;
      a.shadowBlur = 0;
      for (var g = 0; g < NG; g++) {
        a.save();
        a.translate(g * atlasCell + atlasCell / 2, lv * atlasCell + atlasCell / 2);
        a.globalAlpha = alpha;
        var G = GLYPHS[g];
        if (lv === LEVELS - 1) { a.shadowColor = "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0.9)"; a.shadowBlur = atlasCell * 0.28; }
        if (G.type === "path") {
          var p = new Path2D(G.d);
          a.scale(atlasCell / 10, atlasCell / 10);
          a.lineWidth = 1.5;
          a.strokeStyle = "rgb(" + col[0] + "," + col[1] + "," + col[2] + ")";
          a.stroke(p);
        } else {
          var fs = atlasCell * 0.78;
          a.font = "bold " + fs + "px ui-monospace, Consolas, monospace";
          a.textAlign = "center"; a.textBaseline = "middle";
          a.fillStyle = "rgb(" + col[0] + "," + col[1] + "," + col[2] + ")";
          a.fillText(G.ch, 0, atlasCell * 0.04);
        }
        a.restore();
      }
    }
    atlas = atlasC;
  }

  function fit() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cell = W > 2000 ? 26 : (W < 640 ? 18 : 22);
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell) + 1;
    streams = [];
    for (var c = 0; c < cols; c++) {
      streams.push({
        active: false, head: 0, speed: 0,
        glyph: new Uint8Array(rows), bright: new Float32Array(rows)
      });
    }
    buildAtlas();
    syncDensity(true);
  }

  var densityInput = document.getElementById("density");
  var speedInput = document.getElementById("speed");
  var denVal = document.getElementById("denVal"), spdVal = document.getElementById("spdVal");
  var defaultDensity = reduceMotion ? 35 : 62, defaultSpeed = 1;
  densityInput.value = defaultDensity; speedInput.value = defaultSpeed;

  function density() { return parseInt(densityInput.value, 10) / 100; }
  function speedMult() { return parseFloat(speedInput.value); }

  function resetStream(s) {
    s.head = -Math.random() * rows * 0.8;
    s.speed = 6 + Math.random() * 10;
  }
  function syncDensity(force) {
    var target = Math.max(1, Math.round(cols * density()));
    var active = 0;
    for (var i = 0; i < cols; i++) if (streams[i].active) active++;
    var guard = cols * 2;
    while (active < target && guard-- > 0) {
      var c = (Math.random() * cols) | 0;
      if (!streams[c].active) { streams[c].active = true; resetStream(streams[c]); active++; }
    }
    while (active > target && guard-- > 0) {
      var c2 = (Math.random() * cols) | 0;
      if (streams[c2].active && !(msgState !== "idle" && isMsgCol(c2))) { streams[c2].active = false; active--; }
    }
  }
  densityInput.addEventListener("input", function () { denVal.textContent = densityInput.value + "%"; syncDensity(); });
  speedInput.addEventListener("input", function () { spdVal.textContent = speedMult().toFixed(1) + "×"; });
  denVal.textContent = densityInput.value + "%";
  spdVal.textContent = speedMult().toFixed(1) + "×";

  // ————— message mode —————
  var msgState = "idle"; // idle | resolving | holding | dissolving
  var locks = []; // {col, gi, born, releaseAt, gone}
  var holdUntil = 0;
  var statusEl = document.getElementById("status");
  var cmd = document.getElementById("cmd");

  function resolvePhrase() {
    var phrase = cmd.value.toUpperCase().replace(/[^A-Z0-9 ]/g, "").replace(/\s+/g, " ").trim().slice(0, 40);
    if (!phrase) return;
    var len = phrase.replace(/ /g, "").length;
    var targetRow = Math.floor(rows * 0.46);
    var startCol = Math.max(0, Math.floor((cols - phrase.length) / 2));
    locks = [];
    for (var i = 0; i < phrase.length; i++) {
      var ch = phrase[i];
      if (ch === " ") continue;
      var c = startCol + i;
      if (c >= cols) break;
      var s = streams[c];
      s.active = true;
      resetStream(s);
      s.head = targetRow - (3 + Math.random() * 6);
      s.speed = 9 + Math.random() * 6;
      locks.push({ col: c, gi: LETTER_INDEX[ch], born: 0, releaseAt: 0, gone: false });
    }
    msgState = "resolving";
    statusEl.textContent = "resolving 0 / " + locks.length;
  }
  function beginDissolve() {
    if (msgState !== "holding") return;
    msgState = "dissolving";
    var now = performance.now();
    locks.forEach(function (L) { if (!L.gone) L.releaseAt = now + Math.random() * 1600; });
    statusEl.textContent = "dissolving";
  }
  function clearMsg() {
    msgState = "idle"; locks = [];
    statusEl.textContent = "plain rain";
  }
  document.getElementById("resolveBtn").addEventListener("click", resolvePhrase);
  cmd.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); resolvePhrase(); cmd.blur(); }
  });
  canvas.addEventListener("pointerdown", function () {
    if (msgState === "holding") beginDissolve();
  });
  window.setTimeout(function () { cmd.value = "TYPE IS RAIN"; resolvePhrase(); }, reduceMotion ? 800 : 2000);

  // ————— update & draw —————
  var last = performance.now(), fps = 60, frames = 0, fpsT = 0, statsT = 0;

  function update(dt, now) {
    var decay = Math.exp(-1.6 * dt);
    var spd = speedMult();
    for (var c = 0; c < cols; c++) {
      var s = streams[c];
      if (!s.active) continue;
      var oldHead = s.head;
      s.head += s.speed * spd * dt;
      var o = Math.floor(oldHead), nn = Math.floor(s.head);
      for (var r = Math.max(0, o + 1); r <= Math.min(rows - 1, nn); r++) {
        if (isLocked(c, r)) continue;
        s.glyph[r] = (Math.random() * NG) | 0;
        s.bright[r] = 1;
      }
      // brightness decay
      var b = s.bright;
      for (var r2 = 0; r2 < rows; r2++) {
        if (b[r2] > 0.015) b[r2] *= decay; else b[r2] = 0;
      }
      // tail flicker
      if (!reduceMotion && Math.random() < 0.15) {
        var fr = (Math.random() * rows) | 0;
        if (s.bright[fr] > 0.03 && s.bright[fr] < 0.85 && !isLocked(c, fr)) {
          s.glyph[fr] = (Math.random() * NG) | 0;
        }
      }
      if (s.head > rows + Math.random() * 10) {
        if (isMsgCol(c)) { resetStream(s); s.head = -(Math.random() * rows); }
        else { s.active = false; }
      }
    }
    syncDensity();

    // message state machine
    if (msgState === "resolving") {
      var bornCount = 0;
      locks.forEach(function (L) {
        var s2 = streams[L.col];
        if (!L.born && s2.head >= rowOf(L.col)) {
          L.born = now;
          s2.glyph[rowOf(L.col)] = L.gi;
          s2.bright[rowOf(L.col)] = 1;
        }
        if (L.born) bornCount++;
      });
      statusEl.textContent = "resolving " + bornCount + " / " + locks.length;
      if (bornCount >= locks.length) {
        msgState = "holding";
        holdUntil = now + 4500;
        statusEl.textContent = "locked · holding";
      }
    } else if (msgState === "holding") {
      if (now > holdUntil) beginDissolve();
    } else if (msgState === "dissolving") {
      var left = 0;
      locks.forEach(function (L) {
        if (L.gone) return;
        if (now > L.releaseAt) {
          L.gone = true;
          var s3 = streams[L.col];
          var rr = rowOf(L.col);
          s3.bright[rr] = 0.9;
        } else left++;
      });
      if (left === 0) clearMsg();
    }
  }

  function rowOf(col) {
    for (var i = 0; i < locks.length; i++) if (locks[i].col === col) return lockRow;
    return lockRow;
  }
  var lockRow = 0;
  function isLocked(c, r) {
    if (msgState === "idle") return false;
    for (var i = 0; i < locks.length; i++) {
      var L = locks[i];
      if (!L.gone && L.born && L.col === c && r === lockRow) return true;
    }
    return false;
  }
  function isMsgCol(c) {
    for (var i = 0; i < locks.length; i++) if (locks[i].col === c && !locks[i].gone) return true;
    return false;
  }

  function draw(now) {
    var P = PALETTES[palIdx];
    ctx.fillStyle = P.bg;
    ctx.fillRect(0, 0, W, H);
    var cs = cell, cd = atlasCell;
    for (var c = 0; c < cols; c++) {
      var s = streams[c];
      if (!s.active) continue;
      for (var r = 0; r < rows; r++) {
        var br = s.bright[r];
        var lockedCell = false;
        if (msgState !== "idle" && r === lockRow) {
          for (var i = 0; i < locks.length; i++) {
            var L = locks[i];
            if (L.col === c && !L.gone && L.born) { lockedCell = true; br = 1; }
          }
        }
        if (br <= 0.02 && !lockedCell) continue;
        var lv = Math.max(0, Math.min(LEVELS - 1, Math.round(br * (LEVELS - 1))));
        var x = c * cs, y = r * cs;
        ctx.drawImage(atlas, s.glyph[r] * cd, lv * cd, cd, cd, x, y, cs, cs);
        if (lockedCell) {
          for (var j = 0; j < locks.length; j++) {
            var L2 = locks[j];
            if (L2.col !== c || L2.gone || !L2.born) continue;
            // locked letter: pop scale, pulsing halo, underline
            var pop = Math.min(1, (now - L2.born) / 350);
            var scale = reduceMotion ? 1 : 1.7 - 0.7 * pop;
            var pulse = reduceMotion ? 0.5 : 0.4 + 0.25 * Math.sin(now * 0.005);
            var cxp = x + cs / 2, cyp = y + cs / 2;
            ctx.save();
            var halo = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, cs * 1.1);
            halo.addColorStop(0, "rgba(" + hexRGB(P.head).join(",") + "," + (0.22 * pulse).toFixed(3) + ")");
            halo.addColorStop(1, "rgba(" + hexRGB(P.head).join(",") + ",0)");
            ctx.fillStyle = halo;
            ctx.fillRect(x - cs, y - cs, cs * 3, cs * 3);
            ctx.restore();
            if (scale !== 1) {
              ctx.save();
              ctx.translate(cxp, cyp);
              ctx.scale(scale, scale);
              ctx.drawImage(atlas, L2.gi * cd, (LEVELS - 1) * cd, cd, cd, -cs / 2, -cs / 2, cs, cs);
              ctx.restore();
            } else {
              ctx.drawImage(atlas, L2.gi * cd, (LEVELS - 1) * cd, cd, cd, x, y, cs, cs);
            }
            ctx.fillStyle = P.head;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(x + cs * 0.12, y + cs - 2.5, cs * 0.76, 1.5);
            ctx.globalAlpha = 1;
          }
        }
      }
      // draw head glow marker
      var hr = Math.floor(s.head);
      if (hr >= 0 && hr < rows && !isLocked(c, hr)) {
        // head already stamped at brightness 1; add soft bloom
        var hx = c * cs + cs / 2, hy = hr * cs + cs / 2;
        var g2 = ctx.createRadialGradient(hx, hy, 0, hx, hy, cs);
        g2.addColorStop(0, "rgba(" + hexRGB(P.head).join(",") + ",0.14)");
        g2.addColorStop(1, "rgba(" + hexRGB(P.head).join(",") + ",0)");
        ctx.fillStyle = g2;
        ctx.fillRect(hx - cs, hy - cs, cs * 2, cs * 2);
      }
    }
  }

  var statsEl = document.getElementById("stats");
  function updateStats(now) {
    if (now - statsT < 500) return;
    statsT = now;
    var act = 0;
    for (var i = 0; i < cols; i++) if (streams[i].active) act++;
    statsEl.textContent = "grid " + cols + "×" + rows + " · streams " + act + " · fps " + Math.round(fps);
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    frames++;
    if (now - fpsT > 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
    update(dt, now);
    draw(now);
    updateStats(now);
    requestAnimationFrame(frame);
  }

  // ————— palette UI —————
  var palsEl = document.getElementById("pals");
  PALETTES.forEach(function (p, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pal" + (i === palIdx ? " on" : "");
    b.title = p.name;
    b.innerHTML = '<span class="bar" style="background:linear-gradient(90deg,' + p.tail + ',' + p.mid + ',' + p.head + ')"></span>';
    b.addEventListener("click", function () { setPalette(i); });
    palsEl.appendChild(b);
  });
  function setPalette(i) {
    palIdx = i;
    var P = PALETTES[i];
    document.documentElement.style.setProperty("--bg", P.bg);
    document.documentElement.style.setProperty("--head", P.head);
    document.documentElement.style.setProperty("--mid", P.mid);
    document.documentElement.style.setProperty("--tail", P.tail);
    var kids = palsEl.children;
    for (var k = 0; k < kids.length; k++) kids[k].classList.toggle("on", k === i);
    buildAtlas();
  }
  document.addEventListener("keydown", function (e) {
    if (document.activeElement === cmd) return;
    if (e.key >= "1" && e.key <= "4") setPalette(parseInt(e.key, 10) - 1);
  });

  var resizeT = 0;
  window.addEventListener("resize", function () {
    window.clearTimeout(resizeT);
    resizeT = window.setTimeout(function () {
      fit();
      if (msgState !== "idle") { lockRow = Math.floor(rows * 0.46); }
    }, 160);
  });

  fit();
  lockRow = Math.floor(rows * 0.46);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
