<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nova@portfolio — Faux Terminal Portfolio</title>
<style>
:root{
  --bg:#282a36; --fg:#f8f8f2; --accent:#bd93f9; --green:#50fa7b;
  --cyan:#8be9fd; --pink:#ff79c6; --yellow:#f1fa8c; --red:#ff5555;
  --comment:#6272a4; --desk1:#1b1f3a; --desk2:#3b2a6b; --desk3:#0f4c5c;
  --desk4:#08090f;
}
html[data-theme="solarized"]{--bg:#002b36;--fg:#eee8d5;--accent:#b58900;--green:#859900;--cyan:#2aa198;--pink:#d33682;--yellow:#b58900;--red:#dc322f;--comment:#586e75;--desk1:#073642;--desk2:#586e75;--desk3:#2aa198;--desk4:#001a20}
html[data-theme="nord"]{--bg:#2e3440;--fg:#eceff4;--accent:#88c0d0;--green:#a3be8c;--cyan:#8fbcbb;--pink:#b48ead;--yellow:#ebcb8b;--red:#bf616a;--comment:#4c566a;--desk1:#2e3440;--desk2:#4c566a;--desk3:#434c5e;--desk4:#1a2028}
html[data-theme="paper"]{--bg:#fbf8f1;--fg:#3a3530;--accent:#b3541e;--green:#4a7a2c;--cyan:#2b7a8c;--pink:#a03a5e;--yellow:#8a6d1d;--red:#a03a2a;--comment:#9a8f80;--desk1:#e8e0d0;--desk2:#d8c8b0;--desk3:#c2d0c8;--desk4:#f6f1e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  background:#08090f;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
}
.desktop{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(70% 55% at 18% 20%, var(--desk2) 0%, transparent 70%),
    radial-gradient(60% 50% at 82% 70%, var(--desk3) 0%, transparent 70%),
    radial-gradient(90% 80% at 50% 40%, var(--desk1) 0%, var(--desk4) 100%);
  transition:background .6s;
}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-1;transition:background .6s}
.blob1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--desk2);
  animation:drift1 26s ease-in-out infinite alternate}
.blob2{width:40vmax;height:40vmax;right:-10vmax;bottom:-14vmax;background:var(--desk3);
  animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-7vmax,-5vmax) scale(.95)}}

#termWrap{width:min(980px,100%);margin:6vh auto 20px;padding:0 12px;display:flex;flex-direction:column;flex:1}
.window{
  max-width:980px;width:100%;max-height:680px;height:min(680px,calc(100vh - 150px));
  display:flex;flex-direction:column;margin:0 auto;
  border-radius:14px;border:1px solid rgba(255,255,255,.09);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);
  overflow:hidden;
}
.chrome{
  display:flex;align-items:center;gap:12px;padding:9px 14px;flex:none;
  background:rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.lights{display:flex;gap:7px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.tabs{display:flex;gap:6px;flex:1;overflow:hidden}
.tab{
  font-size:11.5px;padding:4px 14px;border-radius:8px;white-space:nowrap;
  color:var(--comment);background:rgba(255,255,255,.04);
}
.tab.active{background:rgba(255,255,255,.10);color:var(--fg)}
#term{
  flex:1;overflow-y:auto;padding:16px 18px 20px;font-size:13px;line-height:1.55;
  color:var(--fg);
}
#term::-webkit-scrollbar{width:8px}
#term::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
#term::-webkit-scrollbar-track{background:transparent}
.line{white-space:pre-wrap;word-break:break-word}
.line.err{color:var(--red)}
.logo{color:var(--accent);text-shadow:0 0 9px var(--accent);white-space:pre}
.lastlogin{color:var(--comment);font-size:11.5px;margin-top:10px}
.welcome{margin-bottom:12px}
.prompt{color:var(--green)} .prompt .at{color:var(--comment)}
.prompt .dir{color:var(--cyan)} .prompt .ps1{color:var(--pink)}
#inputRow{display:flex;align-items:baseline;gap:6px}
#inputRow .ghost{white-space:pre;pointer-events:none}
#cmd{
  flex:1;background:transparent;border:0;outline:none;color:var(--fg);
  font:inherit;caret-color:transparent;min-width:30px;
}
.cursor{
  display:inline-block;width:.62em;height:1.15em;background:var(--accent);
  vertical-align:text-bottom;margin-left:-.05em;
  animation:blink 1.1s steps(1) infinite;
}
.cursor.dim{background:var(--comment);animation:none}
@keyframes blink{50%{opacity:0}}
.cmdtable{display:grid;grid-template-columns:1fr 2fr;gap:2px 18px;margin:4px 0 10px}
.cmdtable .c{color:var(--accent)}
.cmdtable .d{color:var(--comment)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;margin:6px 0}
.kv .k{color:var(--accent)}
.bars{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;align-items:center;margin:8px 0}
.bars .name{color:var(--comment);font-size:12px}
.bar{height:14px;border-radius:3px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px)}
.bar i{
  display:block;height:100%;border-radius:3px;width:0;
  background-image:linear-gradient(90deg,var(--accent),var(--cyan));
  transition:width 1.1s cubic-bezier(.22,1,.36,1);
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.card{
  border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 8px 8px 0;
  background:rgba(255,255,255,.05);opacity:0;transform:translateY(10px);
  transition:opacity .4s ease,transform .4s ease,translate .2s;
}
.card.in{opacity:1;transform:translateY(0)}
.card:hover{translate:0 -3px}
.card h4{font-size:13px;color:var(--fg);margin-bottom:4px;font-weight:600}
.card p{color:var(--comment);font-size:11.5px;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:9.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--comment);
  color:var(--comment);letter-spacing:.06em}
.contactline{display:flex;gap:8px;margin:3px 0}
.contactline .k{color:var(--accent);width:110px;flex:none}
a{color:var(--cyan)}
#matrix{position:absolute;inset:0;z-index:10;display:none}
#matrix canvas{width:100%;height:100%}
.window{position:relative}

/* dock */
.dock{
  margin:0 auto 26px;display:flex;gap:10px;padding:9px 14px;border-radius:18px;
  background:rgba(255,255,255,.07);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);position:relative;
}
.app{
  width:46px;height:46px;border-radius:12px;position:relative;cursor:pointer;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.22,1,.36,1);
}
.app:hover{transform:scale(1.28) translateY(-6px)}
.app svg{width:24px;height:24px;fill:none;stroke:rgba(255,255,255,.92);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.app .tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.9);
  background:rgba(20,22,30,.92);color:#fff;font-size:10.5px;padding:4px 9px;border-radius:6px;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;white-space:nowrap;
}
.app:hover .tip{opacity:1;transform:translateX(-50%) scale(1)}
.a1{background:linear-gradient(135deg,#4f8ef7,#8bd0ff)}
.a2{background:linear-gradient(135deg,#ff7a59,#ffb56b)}
.a3{background:linear-gradient(135deg,#38d39f,#5ee8a6)}
.a4{background:linear-gradient(135deg,#bd93f9,#8be9fd)}
.a5{background:linear-gradient(135deg,#e58fae,#f3d9a4)}

/* mobile tap pill */
#tapPill{
  display:none;margin:14px auto 30px;padding:9px 22px;border-radius:999px;
  border:1px solid var(--accent);color:var(--accent);font-size:12px;letter-spacing:.12em;
  animation:pulse 1.4s ease-in-out infinite;cursor:pointer;
}
@keyframes pulse{50%{opacity:.5}}
#tapPill.show{display:inline-block}
@media (max-width:640px){
  #termWrap{margin-top:2vh}
  .tab:not(.active){display:none}
  .cmdtable{grid-template-columns:1fr 1fr;gap:2px 8px}
  #term{font-size:12px;padding:12px 12px 14px}
}
@media (prefers-reduced-motion: reduce){
  .blob1,.blob2{animation:none}
  .cursor{animation:none}
  .bar i{transition:none}
  .card{transition:none;opacity:1;transform:none}
  .app{transition:none}
  #tapPill{animation:none}
}
</style>
</head>
<body>
<div class="desktop" aria-hidden="true"></div>
<div class="blob blob1" aria-hidden="true"></div>
<div class="blob blob2" aria-hidden="true"></div>

<div id="termWrap">
  <div class="window">
    <div class="chrome">
      <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="tabs">
        <div class="tab active">nova@portfolio — zsh</div>
        <div class="tab">notes.md</div>
        <div class="tab">server.log</div>
      </div>
    </div>
    <div id="term" tabindex="-1">
      <div id="matrix"><canvas id="mxCanvas"></canvas></div>
      <div id="out"></div>
      <div id="inputRow">
        <span class="ghost" id="promptGhost"></span>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command input">
        <span class="cursor" id="cursor" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  <button id="tapPill">Tap to type</button>
  <nav class="dock" aria-label="dock">
    <button class="app a1" data-cmd="ls"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/></svg><span class="tip">Projects on disk</span></button>
    <button class="app a2" data-cmd="projects"><svg viewBox="0 0 24 24"><path d="M3 7l4-4h10l4 4"/><rect x="3" y="7" width="18" height="13" rx="1"/></svg><span class="tip">Projects</span></button>
    <button class="app a3" data-cmd="skills"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span class="tip">Skills</span></button>
    <button class="app a4" data-cmd="contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="tip">Contact</span></button>
    <button class="app a5" data-cmd="theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18M12 3v18"/></svg><span class="tip">Themes</span></button>
  </nav>
</div>

<script>
(function(){
"use strict";
var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var out=document.getElementById("out");
var term=document.getElementById("term");
var input=document.getElementById("cmd");
var ghost=document.getElementById("promptGhost");
var tapPill=document.getElementById("tapPill");
var history=[],hIdx=-1;

function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function print(html,cls){
  var d=document.createElement("div");
  d.className="line"+(cls?" "+cls:"");
  d.innerHTML=html;
  out.appendChild(d);
  term.scrollTop=term.scrollHeight;
  return d;
}
function promptHTML(){
  return '<span class="prompt">nova<span class="at">@</span>portfolio</span>'
   +'<span class="at">:</span><span class="dir">~</span> <span class="ps1">❯</span> ';
}
function refreshPrompt(){ghost.innerHTML=promptHTML();}
refreshPrompt();

/* theme */
var themes=["dracula","solarized","nord","paper"];
function setTheme(name){
  var t=document.documentElement;
  if(name==="dracula"){t.removeAttribute("data-theme");}
  else t.setAttribute("data-theme",name);
}

/* ascii logo */
var LOGO=
"  ███╗   ██╗  ██████╗  ██╗   ██╗  █████╗  \n"+
"  ████╗  ██║ ██╔═══██╗ ██║   ██║ ██╔══██╗ \n"+
"  ██╔██╗ ██║ ██║   ██║ ██║   ██║ ███████║ \n"+
"  ██║╚██╗██║ ██║   ██║ ╚██╗ ██╔╝ ██╔══██║ \n"+
"  ██║ ╚████║ ╚██████╔╝  ╚████╔╝  ██║  ██║ \n"+
"  ╚═╝  ╚═══╝  ╚═════╝    ╚═══╝   ╚═╝  ╚═╝ ";

function typeLogo(){
  if(reduce){print(esc(LOGO).replace(/\n/g,"<br>"),"logo");afterLogo();return;}
  var d=print("","logo");
  var i=0,text=LOGO;
  var tick=setInterval(function(){
    i+=4;
    d.innerHTML=esc(text.slice(0,i)).replace(/\n/g,"<br>");
    term.scrollTop=term.scrollHeight;
    if(i>=text.length){clearInterval(tick);afterLogo();}
  },24);
}
function afterLogo(){
  print('<span class="lastlogin">Last login: Fri Sep 4 09:12:44 on ttys004</span>');
  print('<span class="welcome">Welcome to Nova\'s machine. Type <span style="color:var(--accent)">help</span> for commands, <span style="color:var(--accent)">about</span> to meet Nova.</span>');
  print("");
  focusInput();
}

/* commands */
var commands={
  help:function(){
    var rows=[["help","list every command"],["about","who is Nova?"],["skills","animated skill chart"],
      ["projects","four selected works"],["contact","ways to reach Nova"],["theme <name>","dracula · solarized · nord · paper"],
      ["matrix","watch the rain fall"],["history","what you have typed"],["clear","wipe the screen"],
      ["whoami / date / echo / ls","small conveniences"],["sudo","do not"]];
    var html='<div class="cmdtable">';
    rows.forEach(function(r){html+='<span class="c">'+esc(r[0])+'</span><span class="d">'+esc(r[1])+'</span>';});
    html+="</div>";print(html);
  },
  about:function(){
    print('<div class="kv">'+
      '<span class="k">name</span><span>Nova Reyes</span>'+
      '<span class="k">role</span><span>creative engineer</span>'+
      '<span class="k">city</span><span>Lisbon, PT — where the light is an argument</span>'+
      '<span class="k">years</span><span>9 of shipping, still curious</span>'+
      '<span class="k">loves</span><span>generative art, trams, tiny synthesizers, fado at dusk</span>'+
      '<span class="k">currently</span><span>teaching browsers to paint with light</span>'+
    '</div>');
  },
  skills:function(){
    var bars=[["TypeScript",92],["Web Audio",80],["Canvas / SVG",95],["CSS architecture",88],["Node tooling",74]];
    var html='<div class="bars">';
    bars.forEach(function(b,i){
      html+='<span class="name">'+esc(b[0])+'</span><span class="bar"><i data-w="'+b[1]+'" style="transition-delay:'+(i*90)+'ms"></i></span>';
    });
    html+="</div>";
    print(html);
    requestAnimationFrame(function(){
      Array.prototype.forEach.call(out.querySelectorAll(".bar i"),function(el){
        el.style.width=el.dataset.w+"%";
      });
    });
  },
  projects:function(){
    var cards=[
      ["Tidewater","A tide-timetable web app for Atlantic surfers, offline-first.","linear-gradient(90deg,#4f8ef7,#8bd0ff)","PWA","Maps","Bucklescript"],
      ["Lantern","Ambient generative lighting controller for a Lisbon co-working loft.","linear-gradient(90deg,#ff7a59,#ffb56b)","WebAudio","DMX","Canvas"],
      ["Fieldnotes","A write-first journaling tool with structure that gets out of the way.","linear-gradient(90deg,#38d39f,#5ee8a6)","Local-first","CRDT","a11y"],
      ["Glasshouse","An interactive gallery of optics exhibits — like this one, but bigger.","linear-gradient(90deg,#bd93f9,#8be9fd)","SVG","Physics","Education"]];
    var html='<div class="cards">';
    cards.forEach(function(c,i){
      html+='<div class="card" style="border-color:transparent;background:'+c[2]+';border-left:3px solid currentColor" data-i="'+i+'">'+
        '<h4>'+esc(c[0])+'</h4><p>'+esc(c[1])+'</p><div class="tags">'+
        c.slice(3).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+
        '</div></div>';
    });
    html+="</div>";
    print(html);
    var list=out.querySelectorAll(".card");
    Array.prototype.forEach.call(list,function(el){
      var i=+el.dataset.i;
      setTimeout(function(){el.classList.add("in");},reduce?0:120*i+60);
    });
  },
  contact:function(){
    print('<div class="contactline"><span class="k">email</span><span>nova@novareyes.dev</span></div>'+
      '<div class="contactline"><span class="k">github</span><span><a href="https://github.com/novareyes" onclick="return false">@novareyes</a></span></div>'+
      '<div class="contactline"><span class="k">mastodon</span><span><a href="#" onclick="return false">@nova@mastodon.social</a></span></div>'+
      '<div class="contactline"><span class="k">pgp</span><span>4F2A 9C1D 88E7 0B44 51D0 9A3B 77C2 0FE1 6B98 AA12</span></div>');
  },
  theme:function(arg){
    if(!arg){
      print("usage: theme &lt;name&gt; — try: "+themes.join(" · "));
      return;
    }
    arg=arg.toLowerCase();
    if(themes.indexOf(arg)<0){print("no such theme: "+esc(arg),"err");return;}
    setTheme(arg);
    print("theme set to "+arg+". the desktop recolours behind you.");
  },
  clear:function(){out.innerHTML="";},
  history:function(){
    if(!history.length){print("history is empty — begin!","err");return;}
    print(history.map(function(h,i){return String(i+1).padStart(4)+"  "+esc(h);}).join("\n"));
  },
  whoami:function(){print("nova — creative engineer, Lisbon. you are the visitor, but you knew that.");},
  date:function(){print(new Date().toString());},
  echo:function(args){print(esc(args.join(" ")));},
  ls:function(){
    print('<span style="color:var(--cyan)">projects/</span>  <span style="color:var(--cyan)">sketches/</span>  notes.md  resume.pdf  <span style="color:var(--green)">glasshouse.sh</span>');
  },
  sudo:function(){print("nova is not in the sudoers file. this incident will be reported to the seagulls.","err");},
  matrix:function(){startMatrix();}
};

function run(line){
  print(promptHTML()+esc(line));
  var parts=line.trim().split(/\s+/);
  var name=parts[0],args=parts.slice(1);
  if(name){history.push(line);hIdx=history.length;}
  var fn=commands[name];
  if(fn)fn(args);
  else if(name){print("zsh: command not found: "+esc(name),"err");}
  refreshPrompt();
}

/* tab completion */
var cmdNames=["help","about","skills","projects","contact","theme","matrix","clear","history","whoami","date","echo","ls","sudo"];
input.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var v=input.value;
    input.value="";
    run(v);
  }else if(e.key==="Tab"){
    e.preventDefault();
    var v=input.value;
    var parts=v.split(" ");
    var head=parts.slice(0,parts.length-1).join(" ");
    var frag=parts[parts.length-1];
    var pool=(head==="theme")?themes:cmdNames;
    var hits=pool.filter(function(c){return c.indexOf(frag)===0;});
    if(hits.length===1){input.value=(head?head+" ":"")+hits[0]+" ";}
    else if(hits.length>1){
      print(promptHTML()+esc(v));
      print('<span style="color:var(--comment)">'+hits.map(esc).join("   ")+'</span>');
    }
  }else if(e.key==="ArrowUp"){
    e.preventDefault();
    if(history.length){
      hIdx=Math.max(0,hIdx-1);
      input.value=history[hIdx];
    }
  }else if(e.key==="ArrowDown"){
    e.preventDefault();
    hIdx=Math.min(history.length,hIdx+1);
    input.value=hIdx===history.length?"":history[hIdx];
  }else if(e.key==="l"&&e.ctrlKey){
    e.preventDefault();commands.clear();refreshPrompt();
  }else if(e.key==="c"&&e.ctrlKey){
    e.preventDefault();
    print(promptHTML()+esc(input.value)+"^C");
    input.value="";refreshPrompt();
  }
});
var cursorEl=document.getElementById("cursor");
input.addEventListener("focus",function(){
  cursorEl.classList.remove("dim");
  tapPill.classList.remove("show");
});
input.addEventListener("blur",function(){
  cursorEl.classList.add("dim");
  if(matchMedia("(max-width:640px)").matches)tapPill.classList.add("show");
});
tapPill.addEventListener("click",function(){input.focus();});
function focusInput(){
  if(!matchMedia("(hover: none)").matches)input.focus();
  else tapPill.classList.add("show");
}

/* dock */
document.querySelectorAll(".app").forEach(function(a){
  a.addEventListener("click",function(){
    var c=a.dataset.cmd;
    run(c);
    input.focus();
  });
});

/* matrix easter egg */
function startMatrix(){
  var wrap=document.getElementById("matrix");
  var cv=document.getElementById("mxCanvas");
  wrap.style.display="block";
  cv.width=wrap.clientWidth;cv.height=wrap.clientHeight;
  var cx=cv.getContext("2d");
  var glyphs="アイウエオカキクケコサシスセソナニヌネノ{}<>[]();=+*01";
  var cols=Math.floor(cv.width/14);
  var drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-30;
  var theme=getComputedStyle(document.documentElement);
  var green=theme.getPropertyValue("--green").trim()||"#50fa7b";
  var t0=performance.now();
  function step(now){
    cx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#000";
    cx.fillRect(0,0,cv.width,cv.height);
    cx.font="13px ui-monospace,Menlo,monospace";
    cx.fillStyle=green;
    for(var i2=0;i2<cols;i2++){
      var ch=glyphs[Math.floor(Math.random()*glyphs.length)];
      cx.fillText(ch,i2*14,drops[i2]*16);
      if(drops[i2]*16>cv.height&&Math.random()>.96)drops[i2]=0;
      drops[i2]++;
    }
    if(now-t0<7000&&!stopMatrix)requestAnimationFrame(step);
    else{
      wrap.style.display="none";stopMatrix=false;
      print("the rain stopped. for a moment the code was the world. anyway — back to work.");
    }
  }
  var stopMatrix=false;
  function kill(){stopMatrix=true;wrap.removeEventListener("pointerdown",kill);}
  wrap.addEventListener("pointerdown",kill);
  window.addEventListener("keydown",function once(e){
    stopMatrix=true;wrap.style.display="none";
    window.removeEventListener("keydown",once);
  });
  requestAnimationFrame(step);
}

setTheme("dracula");
typeLogo();
if(!matchMedia("(hover: none)").matches)input.addEventListener("blur",function(){},true);
term.addEventListener("click",function(e){
  if(e.target.tagName!=="A")input.focus();
});
})();
</script>
