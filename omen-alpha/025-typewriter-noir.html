<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Castellane Photograph</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#050505;
  color:#cfcbc3;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  overflow:hidden;
}

/* ============ the room ============ */
.room{position:fixed;inset:0;overflow:hidden}

/* hanging lamp, upper right */
.lamp{position:absolute;top:0;right:16%;width:150px;height:130px;pointer-events:none}
.lamp .cord{position:absolute;left:50%;top:0;width:2px;height:60px;background:#141414;margin-left:-1px}
.lamp .shade{
  position:absolute;left:50%;top:58px;width:130px;height:52px;margin-left:-65px;
  background:linear-gradient(180deg,#262624,#141412);
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  border-bottom:3px solid #ffb648;
  box-shadow:0 0 24px rgba(255,182,72,.25);
}
.lamp .bulb{
  position:absolute;left:50%;top:104px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(circle,#fff2d0,#ffb648 60%,transparent 75%);
  filter:blur(4px);
}
.pool{
  position:absolute;left:50%;top:24%;width:130vw;height:130vw;max-width:1900px;max-height:1900px;
  transform:translate(-50%,-18%);
  background:radial-gradient(closest-side, rgba(255,182,72,.34), rgba(255,182,72,.12) 40%, transparent 72%);
  mix-blend-mode:screen;pointer-events:none;
}
body:not(.reduced) .pool{animation:flicker 7.3s steps(1,end) infinite}
@keyframes flicker{
  0%,100%{opacity:1} 11%{opacity:.82} 13%{opacity:1} 41%{opacity:.9} 43%{opacity:1}
  68%{opacity:.76} 70%{opacity:1} 71.5%{opacity:.86} 73%{opacity:1}
}

/* rain-streaked window, upper left */
.window{
  position:absolute;top:7vh;left:6vw;width:32vw;height:38vh;min-width:240px;min-height:200px;
  background:linear-gradient(180deg,#08090d,#05060a 70%,#040407);
  border:6px solid #131315;border-radius:3px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.8), inset 0 0 40px rgba(0,0,0,.9);
}
.skyline{
  position:absolute;inset:0;opacity:.9;
  background:
    radial-gradient(1.6px 1.6px at 22% 58%, #b98a4a 0%, transparent 100%),
    radial-gradient(1.6px 1.6px at 31% 62%, #a87c40 0%, transparent 100%),
    radial-gradient(1.4px 1.4px at 55% 55%, #c89a55 0%, transparent 100%),
    radial-gradient(1.4px 1.4px at 74% 60%, #b3874a 0%, transparent 100%),
    radial-gradient(1.2px 1.2px at 88% 57%, #a87c40 0%, transparent 100%),
    linear-gradient(180deg,#0a0b10 0%,#0a0b10 52%,#07080c 52%,#05060a 100%);
}
.skyline::before{
  content:"";position:absolute;left:0;right:0;bottom:0;top:40%;
  background:
    linear-gradient(90deg,
      transparent 0 8%, #0b0c11 8% 18%, transparent 18% 30%, #0d0e13 30% 42%,
      transparent 42% 58%, #0b0c11 58% 70%, transparent 70% 84%, #0d0e13 84% 100%);
  filter:blur(.5px);
}
.streaks{
  position:absolute;inset:-20% -10%;
  background:repeating-linear-gradient(105deg, transparent 0 26px, rgba(190,205,225,.14) 26px 30px, transparent 30px 60px);
  mask-image:linear-gradient(#000,#000);
  -webkit-mask-image:linear-gradient(#000,#000);
  opacity:.75;
}
body:not(.reduced) .streaks{animation:rainA 1.1s linear infinite}
@keyframes rainA{from{transform:translateY(0)}to{transform:translateY(46px)}}
.streaks.b{
  background:repeating-linear-gradient(100deg, transparent 0 34px, rgba(170,190,215,.1) 34px 37px, transparent 37px 78px);
  opacity:.6;
}
body:not(.reduced) .streaks.b{animation:rainB .8s linear infinite}
@keyframes rainB{from{transform:translateY(0)}to{transform:translateY(60px)}}
.drips{position:absolute;inset:0}
.drips i{
  position:absolute;width:4px;height:14px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%, rgba(200,215,235,.5), transparent 70%);
  top:-20px;opacity:0;
}
body:not(.reduced) .drips i{animation:drip 4.5s ease-in infinite}
.drips i:nth-child(1){left:18%;animation-delay:.4s}
.drips i:nth-child(2){left:47%;animation-delay:1.9s;animation-duration:5.2s}
.drips i:nth-child(3){left:68%;animation-delay:3.1s;animation-duration:5.8s}
.drips i:nth-child(4){left:82%;animation-delay:1.2s;animation-duration:4.1s}
@keyframes drip{0%{top:-20px;opacity:0}8%{opacity:.8}80%{opacity:.7}100%{top:96%;opacity:0}}
.mullion{position:absolute;inset:0;pointer-events:none}
.mullion::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;background:#131315;margin-left:-5px}
.mullion::after{content:"";position:absolute;top:52%;left:0;right:0;height:10px;background:#131315}

/* desk with blinds */
.desk{
  position:absolute;left:0;right:0;bottom:0;height:52vh;
  background:
    repeating-linear-gradient(92deg, rgba(60,40,22,.35) 0 2px, transparent 2px 90px),
    repeating-linear-gradient(88deg, rgba(30,20,10,.4) 0 1px, transparent 1px 44px),
    linear-gradient(180deg,#241708,#1a1006 70%);
  transform:perspective(700px) rotateX(8deg);
  transform-origin:top center;
  box-shadow:0 -30px 60px rgba(0,0,0,.85);
}
.blinds{
  position:absolute;inset:-2% 0;
  background:repeating-linear-gradient(180deg, rgba(255,182,72,.12) 0 9px, transparent 9px 34px);
  transform:skewY(-3deg);
  mix-blend-mode:screen;
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 78%);
          mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 78%);
  opacity:.7;pointer-events:none;
}
/* ashtray + cigarette + smoke */
.ashtray{position:absolute;right:9%;bottom:34vh;width:90px;height:34px;pointer-events:none}
.ashtray .dish{
  position:absolute;inset:0;border-radius:50% 50% 46% 46%/70% 70% 30% 30%;
  background:linear-gradient(180deg,#2a2a2e,#101012 70%);
  box-shadow:0 8px 18px rgba(0,0,0,.8), inset 0 4px 8px rgba(255,255,255,.06);
}
.cig{position:absolute;left:12px;top:2px;width:64px;height:7px;border-radius:3px;
  background:linear-gradient(90deg,#d9d5cc 0 70%, #caa06a 70% 76%, #5a3a20 76%);
  transform:rotate(8deg);
}
.ember{
  position:absolute;left:74px;top:2px;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,#ffd9a0,#ff6a1f 55%,#7a2008 85%);
  box-shadow:0 0 10px #ff8a2a;
}
body:not(.reduced) .ember{animation:ember 2.2s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.75;box-shadow:0 0 8px #ff8a2a}50%{opacity:1;box-shadow:0 0 16px #ffa53a}}
.smoke{position:absolute;left:70px;top:-6px;pointer-events:none}
.smoke i{
  position:absolute;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle, rgba(210,210,215,.14), transparent 70%);
  filter:blur(6px);opacity:0;
}
body:not(.reduced) .smoke i{animation:smoke 6.8s ease-out infinite}
.smoke i:nth-child(1){animation-duration:6s}
.smoke i:nth-child(2){animation-duration:6.9s;animation-delay:.9s}
.smoke i:nth-child(3){animation-duration:7.6s;animation-delay:2.1s}
.smoke i:nth-child(4){animation-duration:6.4s;animation-delay:3.2s}
.smoke i:nth-child(5){animation-duration:7.1s;animation-delay:4.4s}
@keyframes smoke{
  0%{transform:translate(0,0) scale(.5);opacity:0}
  12%{opacity:.85}
  45%{transform:translate(-26px,-110px) scale(1.4);opacity:.5}
  70%{transform:translate(10px,-200px) scale(2.1);opacity:.28}
  100%{transform:translate(-8px,-290px) scale(2.9);opacity:0}
}

/* title card */
.titlecard{
  position:absolute;top:26px;right:30px;text-align:right;pointer-events:none;z-index:6;
  font-family:Georgia,'Palatino Linotype',Palatino,serif;
}
.titlecard h1{font-style:italic;font-weight:400;font-size:clamp(16px,2vw,24px);color:#e6e2d8;line-height:1.3}
.titlecard p{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#8d897f;margin-top:6px}

/* ============ the typewriter ============ */
.stage{
  position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);
  width:min(760px,92vw);display:flex;flex-direction:column;align-items:center;z-index:5;
}
.platen{
  width:110%;height:22px;border-radius:11px;
  background:linear-gradient(180deg,#3a3a40,#17171b);
  box-shadow:0 6px 18px rgba(0,0,0,.9), inset 0 2px 3px rgba(255,255,255,.08);
  order:2;margin-top:-4px;
}
.paper{
  order:1;
  width:100%;max-width:720px;height:min(46vh,400px);
  background:#d9d5cc;
  border-radius:4px 4px 0 0;
  overflow:hidden;position:relative;cursor:pointer;
  box-shadow:0 -8px 40px rgba(0,0,0,.75);
  transition:transform .18s ease;
}
.paper::before{ /* shadow of the platen */
  content:"";position:absolute;left:0;right:0;top:0;height:34px;z-index:2;
  background:linear-gradient(180deg, rgba(10,10,12,.4), transparent);
}
.paper::after{ /* bottom fade */
  content:"";position:absolute;left:0;right:0;bottom:0;height:56px;z-index:2;
  background:linear-gradient(0deg, rgba(90,86,76,.55), transparent);
  pointer-events:none;
}
.sheet{
  position:absolute;left:0;right:0;top:0;
  padding:16px 34px 24px;
  background:repeating-linear-gradient(180deg, transparent 0 27px, rgba(70,90,140,.16) 27px 28px);
  font-size:15px;line-height:28px;color:#17161a;
  transition:transform .18s ease;
  will-change:transform;
}
body:not(.reduced) .paper.jolt .sheet{animation:jolt 90ms ease}
body:not(.reduced) .paper.jolt{animation:joltPaper 90ms ease}
@keyframes jolt{from{transform:translateX(0)}30%{transform:translateX(-7px)}to{transform:translateX(0)}}
@keyframes joltPaper{from{transform:translateX(0) translate(-50%)}30%{transform:translateX(-7px) translate(-50%)}to{transform:translateX(0) translate(-50%)}}
.sheet span.ch{display:inline-block;white-space:pre-wrap}
.sheet span.ch.sticky{animation:sticky .34s ease}
@keyframes sticky{0%{filter:blur(1.5px);transform:translateY(2px)}100%{filter:blur(0);transform:none}}
.cursor{
  display:inline-block;width:10px;height:20px;background:#17161a;vertical-align:-3px;margin-left:1px;
}
body:not(.reduced) .cursor{animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* choices as typewriter keys */
.choices{
  order:3;display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .35s ease, transform .35s ease;
}
.choices.show{opacity:1;pointer-events:auto;transform:none}
.key{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#2c2c30,#1a1a1e);
  border:1px solid #3d3d44;border-radius:10px;
  padding:10px 16px;color:#cfcbc3;cursor:pointer;
  font-family:inherit;font-size:13px;text-align:left;max-width:330px;
  transition:box-shadow .2s, transform .08s ease;
}
.key:hover,.key:focus-visible{box-shadow:0 0 0 1px #ffb648, 0 0 18px rgba(255,182,72,.35);outline:none}
.key:active,.key.down{transform:translateY(5px)}
.keycap{
  flex:none;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a4a52,#232327 70%);
  border:1px solid #55555e;
  display:grid;place-items:center;
  font-family:Georgia,Palatino,serif;font-size:15px;color:#e6e2d8;
}

/* bottom bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:7;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 20px;
  background:linear-gradient(0deg, rgba(5,5,5,.92), rgba(5,5,5,.0));
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8d897f;
}
.bar .chapter{color:#ffb648}
.bar .hints{opacity:.75}
.bar button{
  background:transparent;border:1px solid #3d3d44;border-radius:6px;
  color:#cfcbc3;font:inherit;letter-spacing:inherit;text-transform:inherit;
  padding:6px 12px;cursor:pointer;
}
.bar button:hover{border-color:#ffb648;color:#ffb648}

/* vignette + grain */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(ellipse 72% 62% at 50% 46%, transparent 55%, rgba(0,0,0,.88) 100%);
}
.grain{
  position:fixed;inset:-55%;pointer-events:none;z-index:9;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:200% 200%;
  opacity:.16;mix-blend-mode:overlay;
}
body:not(.reduced) .grain{animation:grainJit 5.4s step-end infinite}
@keyframes grainJit{
  0%{transform:translate(0,0) rotate(0deg)}
  16.66%{transform:translate(-2.2%,1.4%) rotate(.4deg)}
  33.33%{transform:translate(1.6%,-1.8%) rotate(-.5deg)}
  50%{transform:translate(-1.2%,-1%) rotate(.2deg)}
  66.66%{transform:translate(2%,1.2%) rotate(.6deg)}
  83.33%{transform:translate(-1.6%,2%) rotate(-.3deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}

@media (max-width:640px){
  .window{top:5vh;left:4vw;width:52vw;height:26vh;min-width:170px}
  .ashtray{display:none}
  .lamp{right:4%}
  .key{font-size:11px;padding:8px 10px;max-width:270px}
  .sheet{padding:12px 18px 18px;font-size:13px}
  .bar .hints{display:none}
  .titlecard{right:16px}
}

@media (prefers-reduced-motion: reduce){
  .pool,.streaks,.drips i,.ember,.smoke i,.cursor,.grain{animation:none !important}
  .drips i,.smoke i{opacity:.25}
  .cursor{opacity:1}
  .paper,.sheet{transition:none}
}
</style>
</head>
<body>

<div class="room" aria-hidden="true">
  <div class="lamp"><div class="cord"></div><div class="shade"></div><div class="bulb"></div></div>
  <div class="pool"></div>
  <div class="window">
    <div class="skyline"></div>
    <div class="drips"><i></i><i></i><i></i><i></i></div>
    <div class="streaks"></div>
    <div class="streaks b"></div>
    <div class="mullion"></div>
  </div>
  <div class="desk"></div>
  <div class="blinds"></div>
  <div class="ashtray">
    <div class="dish"></div>
    <div class="cig"></div>
    <div class="ember"></div>
    <div class="smoke"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<div class="titlecard">
  <h1>The Castellane Photograph</h1>
  <p>a typewriter noir</p>
</div>

<div class="stage">
  <div class="paper" id="paper"><div class="sheet" id="sheet"></div></div>
  <div class="platen"></div>

</div>

  <button id="restart">Start over</button>
</div>

<div class="grain" aria-hidden="true"></div>

<script>
(function(){
"use strict";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);
const sheet=$("#sheet"), paper=$("#paper"), choicesEl=$("#choices"), chapterEl=$("#chapter");

/* ---------------- the story : thirteen nodes, four endings ---------------- */
const NODES = {
  start:{ ch:"I · The Client", t:
`2:14 a.m. The rain hasn't stopped since Tuesday.

She walks in out of the weather like it owed her money. Vera Castellane. Sable coat, no ring, eyes that have been awake too long. She puts a photograph on my desk and turns it toward me.

"My brother," she says. "Danny. He died eleven months ago in the Castellane cannery fire. He was alive last Tuesday."

The man in the photograph is standing in front of a fishing boat, squinting, very much not ashes.`,
    c:[["Go to the Halloran Hotel, where Danny liked to stay.","hotel"],
       ["Go out to the burned cannery and walk the dead ground.","cannery"]] },

  hotel:{ ch:"II · The Halloran", t:
`The Halloran Hotel keeps its lobby at the temperature of old coffee. The fire escape hugs the back wall like it's hiding from the fire marshal.

I take the stairs. Third floor. Danny Castellane signed the register here twice last month — the clerk's memory is better than his conscience, which is not saying much.`,
    c:[["Slip out onto the fire escape and wait.","escape"],
       ["Lean on the night clerk until he talks.","clerk"]] },

  cannery:{ ch:"II · The Cannery", t:
`The cannery is a black ribcage against the harbor. Eleven months of rain hasn't washed the smoke out of the bricks.

A night watchman was supposed to be on duty the night of the fire. A man named Ortiz. His name isn't on the memorial plaque, and nobody at the union can find his file. Files don't burn twice.`,
    c:[["Tail Vera and see who she meets.","tail"],
       ["Ask the Halloran's night clerk about last Tuesday.","hotel"]] },

  escape:{ ch:"III · The Fire Escape", t:
`The fire escape is three stories of rust and nobody's business. I settle in above the alley and light one for patience.

At 1:40 a.m. a car idles at the curb, wipers on, engine warm. Vera comes out of the service door, and a man steps out of the shadows to meet her — broad shoulders, watchman's build, a face I have seen exactly once, in a photograph of a dead man.

You don't photograph that well twice.`,
    c:[["Go back in and squeeze the night clerk.","clerk"],
       ["Follow the money. An insurance office keeps morning hours.","policy"]] },

  clerk:{ ch:"III · The Night Clerk", t:
`The clerk is a man who has learned to look inconvenienced as a career. A twenty migrates across the desk. Then a second twenty.

"Last Tuesday," he reads off the register, "Danny Castellane took room 4C. Paid cash. Signed the book with his left hand, which was a shame, because his name was already in it from the week before."

Room 4C. Fourth floor, corner, faces the alley.`,
    c:[["Go up to room 4C tonight.","room"],
       ["Trace the policy first. Know who profits.","policy"]] },

  tail:{ ch:"III · Tailing Vera", t:
`Tailing Vera Castellane through the rain is a lesson in humility. She dresses like a widow and moves like a courier.

She drops a sealed envelope at a florist's, collects a newspaper at a cigar stand, and stands for nine full minutes in front of the harbor, looking at the cannery's burned silhouette. Then she goes home to nobody.

Whatever she's doing, she isn't doing it for free.`,
    c:[["Walk away from all of it. It's raining, and it's late.","walk"],
       ["Dig into the money. The insurance office keeps records.","policy"]] },

  policy:{ ch:"IV · Forty Thousand Dollars", t:
`The Pacific Mercantile Mutual keeps its records the way banks keep sins: alphabetically, and forever.

Daniel Castellane, deceased. Policy number C-4409. Forty thousand dollars, double indemnity for fire. The beneficiary signature reads Vera Castellane, dated three weeks before the fire.

Three weeks before. Nobody buys that much insurance on a healthy brother by accident.`,
    c:[["Find out what really happened to the watchman, Ortiz.","ortiz"],
       ["Take Vera's offer: a false report, and cash on the nail.","offer"]] },

  ortiz:{ ch:"IV · The Watchman", t:
`Ortiz. Raul Ortiz. Night watchman, eleven months on the job, one daughter in a parochial school.

Here is what the fire report hides in its arithmetic: the remains identified as Danny Castellane were found wearing a watchman's coat, carrying a watchman's ring, in the watchman's corridor.

Raul Ortiz died in Danny's place. Danny Castellane walked out of his own funeral and left a dead man standing in it. Vera knows. Vera has always known.`,
    c:[["Call Lieutenant Moss. Let the law carry it from here.","moss"],
       ["Go to room 4C tonight, alone.","room"]] },

  offer:{ ch:"IV · The Envelope", t:
`Vera finds me before I find her. She's good like that.

She puts an envelope on the table, fat and unnumbered. "You write what happened," she says. "A watchman fell asleep. A fire got hungry. My brother is dead, the end." Her voice doesn't shake, which is the tell.

Forty thousand dollars says the truth is negotiable.`,
    c:[["Take the envelope. Write the pretty report.","report"],
       ["Push it back and call Lieutenant Moss.","moss"]] },

  moss:{ ch:"V · Lieutenant Moss", t:
`Lieutenant Moss answers on the fourth ring, at three in the morning, because cops who answer at three in the morning are the ones worth calling.

"Moss. Tell me you didn't call about the weather."

I tell him about a coat, a ring, a corridor, and a man who photographed alive eleven months after he burned. He is quiet for ten seconds. Then: "Don't go anywhere. I'm coming to you."`,
    c:[["Stand with him at the reburial.","reburial"],
       ["Skip the ceremony. The truth will out on its own.","walk"]] },

  room:{ end:true, ch:"End · Room 4C", t:
`Room 4C is dark, and the dark is occupied.

The lamp comes up. She is sitting in the corner chair with a small pistol, the kind that folds into a purse and a plan.

"You always did travel heavy, Mr.—?" I never get the surname out.

The shot is very loud in a cheap room. As the floor comes up to meet me I think, absurdly: she always did buy the cheap ones.

THE END.`,
    c:null },

  walk:{ end:true, ch:"End · The Rain", t:
`I put my hat on and go out into it.

The rain takes the case off my shoulders, washes it down the storm drain with the cigarette butts and the year's regrets. Somewhere a man with a dead man's shoulders is drinking coffee in an alley. Somewhere a woman is counting a fortune she bought with a fire.

It isn't justice. But the rain doesn't ask, and tonight, neither do I.

THE END.`,
    c:null },

  report:{ end:true, ch:"End · The False Report", t:
`The envelope spends easily. Reports don't.

I write it the way she asked: a watchman fell asleep, a fire got hungry, a brother died, the end. The signatures dry. The file goes downstairs and stays there.

Forty thousand dollars, less the agency's cut, less the part of me that reads Ortiz's name every time I close my eyes. She always did buy the cheap ones.

THE END.`,
    c:null },

  reburial:{ end:true, ch:"End · Ortiz", t:
`They rebury Raul Ortiz in the spring, under his own name, with his daughter holding the folded flag.

Lieutenant Moss stands on one side of me, hat in his hands. Vera Castellane stands on the other side of the law, being fitted for a coat that doesn't breathe.

The priest says something about a man kept in his place. It's raining, lightly, the good kind. The kind that means it.

THE END.`,
    c:null }
};

/* ---------------- typewriter engine ---------------- */
let typing=false, finishNow=false, timers=[];
let lines=0;

function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

function setScroll(){
  const cap = paper.clientHeight - 40;
  const used = sheet.scrollHeight;
  const over = Math.max(0, used - cap);
  sheet.style.transform = `translateY(${-over}px)`;
}
function joltPaper(){
  if (reduced) return;
  paper.classList.remove("jolt");
  void paper.offsetWidth;
  paper.classList.add("jolt");
}
function chapterLabel(id){ chapterEl.textContent = NODES[id].ch; }

function typeText(id){
  const node=NODES[id];
  chapterLabel(id);
  choicesEl.classList.remove("show");
  choicesEl.innerHTML="";
  sheet.innerHTML = `<span class="cursor" id="cur"></span>`;
  const cur=document.getElementById("cur");
  const chars=[...node.t];
  typing=true; finishNow=false; lines=0;
  let i=0;

  function schedule(delay, fn){
    const t=setTimeout(()=>{ if(finishNow) fn(0); else fn(delay); }, reduced?0:delay);
    timers.push(t);
  }
  function step(){
    if (i>=chars.length){ done(); return; }
    const ch=chars[i];
    if (ch==="\n" && chars[i+1]==="\n"){
      i+=2;
      sheet.insertBefore(document.createElement("br"), cur);
      sheet.insertBefore(document.createElement("br"), cur);
      lines+=2;
      setScroll(); joltPaper();
      schedule(160, step);
      return;
    }
    if (ch==="\n"){
      i++;
      sheet.insertBefore(document.createElement("br"), cur);
      lines++;
      setScroll(); joltPaper();
      schedule(150, step);
      return;
    }
    const sp=document.createElement("span");
    sp.className="ch"; sp.textContent=ch;
    sheet.insertBefore(sp, cur);
    i++;
    setScroll();
    let d=28+Math.random()*46;
    if (ch===" ") d+=20;
    if (",;:".includes(ch)) d+=140;
    if (".!?".includes(ch)) d+=380;
    if (ch==="\"" || ch==="“" || ch==="”") d+=60;
    if (chars[i-2]==="\"" || chars[i-2]==="“" || chars[i-2]==="”") d+=60;
    if (Math.random()<0.035){
      sp.classList.add("sticky");
      d+=260+Math.random()*240;
    }
    schedule(d, step);
  }
  function done(){
    typing=false;
    cur.remove();
    if (node.c){
      node.c.forEach((c,idx)=>{
        const b=document.createElement("button");
        b.className="key";
        b.innerHTML=`<span class="keycap">${idx+1}</span><span>${c[0]}</span>`;
        b.addEventListener("click",()=>go(c[1]));
        choicesEl.appendChild(b);
      });
      choicesEl.classList.add("show");
      setScroll();
    } else {
      chapterEl.textContent=node.ch;
    }
  }
  step();
  sheet._finishAll = ()=>{
    finishNow=true;
    clearTimers();
    while (i<chars.length){
      const ch=chars[i];
      if (ch==="\n" && chars[i+1]==="\n"){ sheet.insertBefore(document.createElement("br"),cur); i++; }
      if (ch==="\n") sheet.insertBefore(document.createElement("br"),cur);
      else { const sp=document.createElement("span"); sp.className="ch"; sp.textContent=ch; sheet.insertBefore(sp,cur); }
      i++;
    }
    lines++;
    setScroll();
    done();
  };
}

function go(id){ typeText(id); }

paper.addEventListener("click",()=>{ if (typing && sheet._finishAll) sheet._finishAll(); });
addEventListener("keydown",e=>{
  if (e.code==="Space" && typing && sheet._finishAll){ e.preventDefault(); sheet._finishAll(); return; }
  if (typing) return;
  if (e.key==="1"||e.key==="2"){
    const btn=choicesEl.children[+e.key-1];
    if (btn){ btn.classList.add("down"); setTimeout(()=>btn.classList.remove("down"),120); btn.click(); }
  }
});
$("#restart").addEventListener("click",()=>{ clearTimers(); typing=false; go("start"); });
if (reduced) document.body.classList.add("reduced");

go("start");
})();
</script>
</body>
</html>
