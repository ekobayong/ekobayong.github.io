<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumi — Ink Drops in Still Water</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #e7edf0;
    font-family: Georgia, 'Iowan Old Style', Palatino, serif;
    color: #4a5258;
    cursor: crosshair;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; }
  #water { z-index: 0; }
  #ink { z-index: 1; mix-blend-mode: multiply; pointer-events: none; }

  .brand {
    position: fixed; top: 30px; left: 34px; z-index: 5; display: flex; align-items: flex-start; gap: 18px; pointer-events: none;
  }
  .brand h1 {
    font-weight: normal; font-size: clamp(22px, 2.6vw, 34px); color: #2e353b; letter-spacing: .04em;
  }
  .brand .sub {
    font-size: 10px; letter-spacing: .34em; text-indent: .34em; text-transform: uppercase;
    color: #7c868d; margin-top: 6px;
  }
  .vrule {
    width: 1px; height: 110px; position: relative; margin-top: 4px;
    background: linear-gradient(180deg, rgba(60,70,78,.7), rgba(60,70,78,0));
  }
  .vrule::before {
    content: ""; position: absolute; top: -4px; left: -2.5px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--inkc, #1f2a6b);
  }
  .vcap {
    writing-mode: vertical-rl; font-size: 12px; letter-spacing: .22em; color: #8a949b;
    margin-top: 2px;
  }

  #hint {
    position: fixed; left: 50%; top: 54%; transform: translateX(-50%);
    font-style: italic; font-size: clamp(15px, 1.8vw, 21px); color: #6a747c;
    letter-spacing: .06em; pointer-events: none; z-index: 5;
    animation: breathe 3.4s ease-in-out infinite;
    transition: opacity .8s;
  }
  #hint.gone { opacity: 0 !important; animation: none; }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .85; } }

  .dock {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 6;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(90,105,115,.2); border-radius: 999px;
    padding: 10px 18px;
  }
  .swatches { display: flex; gap: 10px; }
  .sw {
    width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; position: relative;
    box-shadow: inset 2px 3px 5px rgba(255,255,255,.35), inset -2px -3px 5px rgba(0,0,0,.35);
  }
  .sw::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 1.5px solid transparent; transition: border-color .25s;
  }
  .sw.sel::after { border-color: rgba(60,70,78,.65); }
  .dock .lab {
    font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #5c6870;
  }
  .seg { display: inline-flex; border: 1px solid rgba(90,105,115,.3); border-radius: 999px; overflow: hidden; }
  .seg button {
    background: transparent; border: 0; padding: 6px 14px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: #5c6870;
  }
  .seg button.sel { background: rgba(70,85,95,.14); color: #2e353b; }
  #drainBtn {
    background: rgba(70,85,95,.1); border: 1px solid rgba(90,105,115,.3); border-radius: 999px;
    padding: 6px 16px; cursor: pointer; font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5c6870;
  }
  #drainBtn.draining { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  #counter {
    position: fixed; bottom: 26px; right: 30px; z-index: 5;
    font-size: 12px; font-style: italic; color: #7c868d; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) {
    #hint { animation: none; opacity: .7; }
    #drainBtn.draining { animation: none; }
  }
</style>
</head>
<body>
<canvas id="water"></canvas>
<canvas id="ink"></canvas>

<div class="brand">
  <div>
    <h1>Sumi</h1>
    <div class="sub">ink drops in water</div>
  </div>
  <div class="vrule"></div>
  <div class="vcap">墨 · still water · slow breath</div>
</div>

<div id="hint">touch the water</div>

<div class="dock">
  <div class="swatches" id="swatches"></div>
  <div class="seg" id="mediumSeg">
    <button data-med="water" class="sel">Water</button>
    <button data-med="paper">Paper</button>
  </div>
  <button id="drainBtn">Drain</button>
</div>

<div id="counter">0 drops</div>

<script>
(function () {
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var INKS = {
    indigo: "#1f2a6b", vermilion: "#c8402a", sepia: "#6b4a2b",
    black: "#14141a", teal: "#157a7a"
  };
  var inkNames = Object.keys(INKS);
  var inkIndex = 0;
  var medium = "water";
  var dropCount = 0;

  var water = document.getElementById("water");
  var ink = document.getElementById("ink");
  var wctx = water.getContext("2d", { alpha: false });
  var ictx = ink.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function sizeCanvases() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [water, ink].forEach(function (c) {
      c.width = W * DPR; c.height = H * DPR;
    });
    wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ictx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintMedium();
  }

  /* ---------- background medium ---------- */
  function paintWater() {
    var g = wctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#f1f5f6");
    g.addColorStop(0.6, "#e3eaee");
    g.addColorStop(1, "#cfd9df");
    wctx.fillStyle = g;
    wctx.fillRect(0, 0, W, H);
    /* caustic rings */
    wctx.save();
    wctx.globalAlpha = 0.06;
    wctx.strokeStyle = "#ffffff";
    for (var i = 0; i < 40; i++) {
      var x = Math.random() * W, y = Math.random() * H;
      var rx = 20 + Math.random() * 90, ry = rx * (0.4 + Math.random() * 0.5);
      wctx.lineWidth = 1 + Math.random() * 2;
      wctx.beginPath();
      wctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
      wctx.stroke();
    }
    wctx.restore();
  }
  function paintPaper() {
    wctx.fillStyle = "#f3ead8";
    wctx.fillRect(0, 0, W, H);
    /* mottling */
    for (var m = 0; m < 60; m++) {
      var x = Math.random() * W, y = Math.random() * H, r = 60 + Math.random() * 220;
      var g = wctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(190,160,110,.10)");
      g.addColorStop(1, "rgba(190,160,110,0)");
      wctx.fillStyle = g;
      wctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    /* fibres */
    var n = Math.floor(W * H / 900);
    for (var i = 0; i < n; i++) {
      var fx = Math.random() * W, fy = Math.random() * H;
      var a = Math.random() * Math.PI, len = 3 + Math.random() * 9;
      wctx.strokeStyle = Math.random() < 0.65 ? "rgba(120,95,60,.12)" : "rgba(255,255,255,.35)";
      wctx.lineWidth = 0.7;
      wctx.beginPath();
      wctx.moveTo(fx, fy);
      wctx.lineTo(fx + Math.cos(a) * len, fy + Math.sin(a) * len);
      wctx.stroke();
    }
  }
  function paintMedium() {
    if (medium === "water") paintWater(); else paintPaper();
  }

  /* ---------- ink sprites ---------- */
  var spriteCache = {};
  function sprite(color, soft) {
    var key = color + (soft ? "s" : "h");
    if (spriteCache[key]) return spriteCache[key];
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grd = g.createRadialGradient(32, 32, soft ? 2 : 6, 32, 32, 32);
    grd.addColorStop(0, color);
    grd.addColorStop(soft ? 0.55 : 0.75, color + "");
    grd.addColorStop(1, hexA(color, 0));
    g.fillStyle = grd;
    g.beginPath(); g.arc(32, 32, 32, 0, Math.PI * 2); g.fill();
    spriteCache[key] = c;
    return c;
  }
  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g2 = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g2 + "," + b + "," + a + ")";
  }

  /* ---------- particles ---------- */
  var particles = [];
  function rand(a, b) { return a + Math.random() * (b - a); }
  function drop(x, y) {
    var areaScale = Math.min(1.4, Math.max(0.5, (W * H) / (1440 * 900)));
    var n = Math.round((380 + Math.random() * 240) * areaScale);
    var speedMin = medium === "water" ? 30 : 14;
    var speedMax = medium === "water" ? 120 : 40;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rand(speedMin, speedMax);
      particles.push({
        x: x + rand(-4, 4), y: y + rand(-4, 4),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, maxLife: rand(4, 10),
        ink: inkIndex,
        size: rand(4, 12),
        phase: Math.random() * Math.PI * 2
      });
    }
    /* dense core stamp */
    var spr = sprite(INKS[inkIndex], medium === "paper");
    ictx.globalCompositeOperation = "multiply";
    for (var s = 0; s < 14; s++) {
      var r = rand(0, 14), sa = Math.random() * Math.PI * 2;
      ictx.globalAlpha = rand(0.06, 0.14);
      var sz = rand(10, 26);
      ictx.drawImage(spr, x + Math.cos(sa) * r - sz / 2, y + Math.sin(sa) * r - sz / 2, sz, sz);
    }
    ictx.globalAlpha = 1;
    dropCount++;
    document.getElementById("counter").textContent = dropCount + " drop" + (dropCount === 1 ? "" : "s");
    document.getElementById("hint").classList.add("gone");
  }

  /* ---------- curl noise ---------- */
  function permHash(x, y, z) {
    var n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function vnoise(x, y, z) {
    /* cheap value noise, trilinear-ish via sin hashing */
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var xf = x - xi, yf = y - yi, zf = z - zi;
    function sm(t) { return t * t * (3 - 2 * t); }
    var u = sm(xf), v = sm(yf), w = sm(zf);
    function h(i, j, k) { return permHash(xi + i, yi + j, zi + k); }
    var a = h(0, 0, 0) * (1 - u) + h(1, 0, 0) * u;
    var b = h(0, 1, 0) * (1 - u) + h(1, 1, 0) * u;
    var c = h(0, 0, 1) * (1 - u) + h(1, 0, 1) * u;
    var d = h(0, 1, 1) * (1 - u) + h(1, 1, 1) * u;
    var ab = a * (1 - v) + b * v, cd = c * (1 - v) + d * v;
    return ab * (1 - w) + cd * w;
  }
  var EPS = 2;
  function curl(x, y, t, scale) {
    var s = scale;
    var n1 = vnoise(x / s, (y + EPS) / s, t);
    var n2 = vnoise(x / s, (y - EPS) / s, t);
    var n3 = vnoise((x + EPS) / s, y / s, t);
    var n4 = vnoise((x - EPS) / s, y / s, t);
    return [(n1 - n2) / (2 * EPS), -(n3 - n4) / (2 * EPS)];
  }
  var nTime = 0;
  function curlVel(x, y) {
    var fine = curl(x, y, nTime, 42);
    var coarse = curl(x, y, nTime * 0.5, 240);
    return [
      fine[0] * 900 + coarse[0] * 2600,
      fine[1] * 900 + coarse[1] * 2600
    ];
  }

  /* ---------- main loop ---------- */
  var frictionWater = 0.965, frictionPaper = 0.90;
  var last = performance.now();
  var drain = { active: false, t: 0 };

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    nTime += dt * 0.22;

    /* advance particles */
    var fr = medium === "water" ? frictionWater : frictionPaper;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life += dt;
      if (p.life > p.maxLife) { particles.splice(i, 1); continue; }
      if (medium === "water" && !reduced) {
        var cv = curlVel(p.x, p.y);
        p.vx += cv[0] * dt; p.vy += cv[1] * dt;
      }
      var f = Math.pow(fr, dt * 60);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }

    /* draw particles (never clear) */
    ictx.globalCompositeOperation = "multiply";
    var spr0 = null;
    for (var j = 0; j < particles.length; j++) {
      var q = particles[j];
      if (!spr0 || spr0.key !== q.ink + (medium === "paper")) {
        spr0 = sprite(INKS[q.ink], medium === "paper");
      }
      var age = q.life / q.maxLife;
      var alpha = (medium === "water" ? 0.07 : 0.045) * (1 - age);
      var size = q.size * (1 + age * 2.2);
      ictx.globalAlpha = alpha;
      ictx.drawImage(spr0, q.x - size / 2, q.y - size / 2, size, size);
    }
    ictx.globalAlpha = 1;

    /* water self-swirl: redraw onto itself with slight rotate/scale */
    if (medium === "water" && !reduced) {
      ictx.globalCompositeOperation = "copy";
      ictx.save();
      var wob = Math.sin(nTime * 3) * 0.4 * DPR;
      ictx.translate(W / 2 * DPR + wob, H / 2 * DPR + Math.cos(nTime * 2.3) * 0.4 * DPR);
      ictx.rotate(0.0002);
      ictx.scale(1.0004, 1.0004);
      ictx.translate(-W / 2 * DPR, -H / 2 * DPR);
      ictx.drawImage(ink, 0, 0, W, H);
      ictx.restore();
      ictx.globalCompositeOperation = "multiply";
    }

    /* drain */
    if (drain.active) {
      drain.t += dt;
      var rate = reduced ? 0.036 : 0.018;
      ictx.globalCompositeOperation = "destination-out";
      ictx.fillStyle = "rgba(0,0,0," + rate + ")";
      ictx.fillRect(0, 0, W * DPR, H * DPR);
      ictx.globalCompositeOperation = "multiply";
      if (drain.t >= 7) {
        drain.active = false;
        ictx.clearRect(0, 0, W * DPR, H * DPR);
        document.getElementById("drainBtn").classList.remove("draining");
        document.getElementById("drainBtn").textContent = "Drain";
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  var dragging = false, lastDrop = 0;
  window.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".dock")) return;
    dragging = true;
    drop(e.clientX, e.clientY);
    lastDrop = performance.now();
  });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    if (performance.now() - lastDrop > 220) {
      drop(e.clientX, e.clientY);
      lastDrop = performance.now();
    }
  });
  window.addEventListener("pointerup", function () { dragging = false; });

  /* ---------- dock ---------- */
  var swEl = document.getElementById("swatches");
  inkNames.forEach(function (name, i) {
    var b = document.createElement("button");
    b.className = "sw" + (i === 0 ? " sel" : "");
    b.style.background = INKS[name];
    b.title = name + " (" + (i + 1) + ")";
    b.addEventListener("click", function () {
      inkIndex = i;
      document.documentElement.style.setProperty("--inkc", INKS[name]);
      swEl.querySelectorAll(".sw").forEach(function (x) { x.classList.toggle("sel", x === b); });
    });
    swEl.appendChild(b);
  });
  document.documentElement.style.setProperty("--inkc", INKS[inkNames[0]]);

  document.getElementById("mediumSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    medium = b.dataset.med;
    document.querySelectorAll("#mediumSeg button").forEach(function (x) { x.classList.toggle("sel", x === b); });
    paintMedium();
  });
  document.getElementById("drainBtn").addEventListener("click", function () {
    if (drain.active) return;
    drain.active = true; drain.t = 0;
    this.classList.add("draining");
    this.textContent = "Draining…";
  });
  document.addEventListener("keydown", function (e) {
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 5) swEl.children[n - 1].click();
    if (e.key === "d" || e.key === "D") document.getElementById("drainBtn").click();
    if (e.key === "p" || e.key === "P") {
      var seg = document.getElementById("mediumSeg");
      var cur = medium === "water" ? 1 : 0;
      seg.children[cur].click();
    }
  });

  sizeCanvases();
  window.addEventListener("resize", sizeCanvases);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
