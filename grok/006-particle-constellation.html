<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation — Interactive Particle Field</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(80% 70% at 12% 8%, rgba(120,90,200,0.10), transparent 55%),
        radial-gradient(90% 80% at 50% 110%, rgba(66,79,160,0.22), transparent 60%),
        radial-gradient(120% 120% at 50% 50%, #060b1f, #03061a);
      color: #ecefff;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .ui { position: relative; z-index: 2; height: 100%; pointer-events: none; }
    header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      padding: 22px 26px;
    }
    h1 {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-weight: 300;
      font-size: clamp(2.6rem, 8vw, 7.5rem);
      letter-spacing: 0.18em;
      text-shadow: 0 0 24px rgba(169,180,255,0.45);
      animation: settle 2.4s ease both;
    }
    .sub {
      font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
      font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
      color: rgba(169,180,255,0.75); margin-top: 6px;
      animation: settle 2.4s 0.15s ease both;
    }
    .stamp {
      font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
      font-size: 11px; letter-spacing: 0.12em; color: rgba(236,239,255,0.7);
      animation: settle 2.4s 0.25s ease both;
      text-align: right;
    }
    .legend {
      position: absolute; left: 26px; bottom: 24px;
      font-size: 12px; color: rgba(236,239,255,0.7);
      animation: settle 2.4s 0.4s ease both;
    }
    .legend div { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .g-dot { width: 8px; height: 8px; border-radius: 50%; background: #a9b4ff; box-shadow: 0 0 8px #a9b4ff; }
    .g-line { width: 22px; height: 1px; background: #a9b4ff; }
    .g-ring { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #a9b4ff; }
    .panel {
      pointer-events: auto;
      position: absolute; right: 22px; bottom: 22px;
      width: 280px;
      background: rgba(6,11,31,0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(236,239,255,0.18);
      border-radius: 4px;
      padding: 16px;
      animation: settle 2.4s 0.55s ease both;
    }
    .panel label { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(236,239,255,0.7); margin-bottom: 8px; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 1px;
      background: linear-gradient(90deg, #a9b4ff var(--fill, 40%), rgba(169,180,255,0.2) var(--fill, 40%));
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 10px #a9b4ff; cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1.4, 0.36, 1);
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.35); }
    .seg {
      display: flex; position: relative; margin-top: 16px;
      border: 1px solid rgba(236,239,255,0.18); border-radius: 999px; overflow: hidden;
    }
    .seg button {
      flex: 1; border: 0; background: transparent; color: #ecefff;
      font: inherit; font-size: 12px; padding: 8px 0; cursor: pointer; position: relative; z-index: 1;
    }
    .pill {
      position: absolute; top: 2px; bottom: 2px; width: calc(50% - 4px); left: 2px;
      background: rgba(169,180,255,0.28); border-radius: 999px;
      transition: transform 0.45s ease-out;
    }
    .seg.repel .pill { transform: translateX(100%); }
    @keyframes settle {
      from { opacity: 0; transform: translateY(14px); filter: blur(8px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    @media (max-width: 640px) {
      header { flex-direction: column; }
      .legend { display: none; }
      .panel { left: 12px; right: 12px; width: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      header *, .legend, .panel { animation: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="ui">
    <header>
      <div>
        <h1>Constellation</h1>
        <div class="sub">Field study no. 006 · a slow gravity</div>
      </div>
      <div class="stamp" id="stamp">particles 0 · threads 0 · fps —</div>
    </header>
    <div class="legend">
      <div><span class="g-dot"></span> particle</div>
      <div><span class="g-line"></span> thread</div>
      <div><span class="g-ring"></span> ripple</div>
    </div>
    <div class="panel">
      <label for="dist">Connection distance</label>
      <input id="dist" type="range" min="40" max="260" value="120">
      <div class="seg" id="mode">
        <span class="pill"></span>
        <button type="button" data-m="attract">Attract</button>
        <button type="button" data-m="repel">Repel</button>
      </div>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function init() {
      var canvas = qs("#c");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var stamp = qs("#stamp");
      var distEl = qs("#dist");
      var modeEl = qs("#mode");
      var reduce = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var w = 0, h = 0, dpr = 1;
      var particles = [];
      var ripples = [];
      var mouse = { x: 0, y: 0, on: false };
      var dist = 120;
      var attract = true;
      var fps = 0, frames = 0, fpsT = 0;
      var threads = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth || 800;
        h = window.innerHeight || 600;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var target = Math.round((w * h) / 5200);
        target = Math.max(90, Math.min(420, target));
        while (particles.length < target) birth(Math.random() * w, Math.random() * h, 0, 0);
        if (particles.length > target) particles.length = target;
      }
      function birth(x, y, vx, vy) {
        particles.push({
          x: x, y: y,
          vx: vx || (Math.random() - 0.5) * 0.25,
          vy: vy || (Math.random() - 0.5) * 0.25,
          r: 1.1 + Math.random() * 1.6,
          hue: Math.random() < 0.55 ? "#ffffff" : "#a9b4ff",
          ph: Math.random() * Math.PI * 2
        });
      }
      function hash(cell) {
        var map = {};
        var size = dist;
        particles.forEach(function (p, i) {
          var cx = Math.floor(p.x / size);
          var cy = Math.floor(p.y / size);
          var k = cx + "," + cy;
          if (!map[k]) map[k] = [];
          map[k].push(i);
        });
        return map;
      }
      function curl(x, y, t) {
        var n1 = Math.sin(x * 0.0021 + t * 0.00018) + Math.cos(y * 0.0017 + t * 0.00013);
        var n2 = Math.cos(x * 0.0014 - t * 0.00011) - Math.sin(y * 0.0024 + t * 0.00016);
        return { x: n2 * 0.08, y: n1 * 0.08 };
      }
      function step(now) {
        var i, p;
        if (!reduce) {
          for (i = 0; i < particles.length; i++) {
            p = particles[i];
            var c = curl(p.x, p.y, now);
            p.vx += c.x; p.vy += c.y;
            if (mouse.on) {
              var dx = mouse.x - p.x, dy = mouse.y - p.y;
              var d2 = dx * dx + dy * dy;
              if (d2 < 220 * 220 && d2 > 1) {
                var f = (1 - d2 / (220 * 220));
                f = f * f * 0.045 * (attract ? 1 : -1);
                p.vx += dx * f; p.vy += dy * f;
              }
            }
            p.vx *= 0.992; p.vy *= 0.992;
            if (Math.abs(p.vx) + Math.abs(p.vy) < 0.02) {
              p.vx += (Math.random() - 0.5) * 0.04;
              p.vy += (Math.random() - 0.5) * 0.04;
            }
            p.x += p.vx; p.y += p.vy;
            if (p.x < -20) p.x = w + 20;
            if (p.x > w + 20) p.x = -20;
            if (p.y < -20) p.y = h + 20;
            if (p.y > h + 20) p.y = -20;
          }
        }
        for (i = ripples.length - 1; i >= 0; i--) {
          var r = ripples[i];
          r.t += 16;
          var life = r.t / 1600;
          r.rad = life * 220;
          if (!reduce) {
            particles.forEach(function (p) {
              var dx = p.x - r.x, dy = p.y - r.y;
              var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
              if (Math.abs(d - r.rad) < 14) {
                p.vx += (dx / d) * 0.35;
                p.vy += (dy / d) * 0.35;
              }
            });
          }
          if (r.t > 1600) ripples.splice(i, 1);
        }
      }
      function draw(now) {
        ctx.clearRect(0, 0, w, h);
        var map = hash();
        threads = 0;
        ctx.lineWidth = 0.8;
        var keys = Object.keys(map);
        var seen = {};
        keys.forEach(function (k) {
          var parts = k.split(",");
          var cx = +parts[0], cy = +parts[1];
          var bucket = [];
          for (var ox = -1; ox <= 1; ox++) {
            for (var oy = -1; oy <= 1; oy++) {
              var nb = map[(cx + ox) + "," + (cy + oy)];
              if (nb) bucket = bucket.concat(nb);
            }
          }
          var cell = map[k];
          for (var a = 0; a < cell.length; a++) {
            for (var b = 0; b < bucket.length; b++) {
              var i = cell[a], j = bucket[b];
              if (j <= i) continue;
              var key = i + "-" + j;
              if (seen[key]) continue;
              seen[key] = 1;
              var p = particles[i], q = particles[j];
              var dx = p.x - q.x, dy = p.y - q.y;
              var d = Math.sqrt(dx * dx + dy * dy);
              if (d < dist) {
                var t = 1 - d / dist;
                var aop = t * t;
                ctx.strokeStyle = "rgba(169,180,255," + (aop * 0.7) + ")";
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
                threads++;
              }
            }
          }
        });
        particles.forEach(function (p) {
          var tw = 0.55 + 0.45 * Math.sin(now / 700 + p.ph);
          var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
          g.addColorStop(0, p.hue);
          g.addColorStop(0.18, p.hue);
          g.addColorStop(1, "rgba(169,180,255,0)");
          ctx.globalAlpha = tw;
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        });
        ripples.forEach(function (r) {
          var a = 1 - r.t / 1600;
          ctx.strokeStyle = "rgba(169,180,255," + a + ")";
          ctx.beginPath(); ctx.arc(r.x, r.y, r.rad, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255," + (a * 0.4) + ")";
          ctx.beginPath(); ctx.arc(r.x, r.y, r.rad * 0.62, 0, Math.PI * 2); ctx.stroke();
        });
        if (mouse.on) {
          var pulse = 10 + 6 * Math.sin(now / 280);
          ctx.strokeStyle = "rgba(169,180,255,0.35)";
          ctx.beginPath(); ctx.arc(mouse.x, mouse.y, pulse, 0, Math.PI * 2); ctx.stroke();
        }
      }
      function loop(now) {
        step(now);
        draw(now);
        frames++;
        if (now - fpsT > 400) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
        if (stamp) stamp.textContent = "particles " + particles.length + " · threads " + threads + " · fps " + fps;
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
      }
      resize();
      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; });
      window.addEventListener("pointerleave", function () { mouse.on = false; });
      window.addEventListener("pointerdown", function (e) {
        ripples.push({ x: e.clientX, y: e.clientY, t: 0, rad: 0 });
        for (var i = 0; i < 4; i++) {
          var a = Math.random() * Math.PI * 2;
          birth(e.clientX, e.clientY, Math.cos(a) * 2.2, Math.sin(a) * 2.2);
        }
      });
      if (distEl) {
        function syncFill() {
          var t = (distEl.value - 40) / (260 - 40) * 100;
          distEl.style.setProperty("--fill", t + "%");
          dist = +distEl.value;
        }
        distEl.addEventListener("input", syncFill);
        syncFill();
      }
      if (modeEl) {
        modeEl.addEventListener("click", function (e) {
          var btn = e.target.closest("button");
          if (!btn) return;
          attract = btn.getAttribute("data-m") !== "repel";
          modeEl.classList.toggle("repel", !attract);
        });
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
