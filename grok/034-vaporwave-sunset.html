<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ＬＵＮＡＲ　ＷＩＮＤ — Vaporwave Sunset</title>
  <style>
    :root {
      --pink: #ff71ce; --cyan: #01cdfe; --mint: #05ffa1; --violet: #b967ff; --yellow: #fffb96;
      --night: #12002a; --grid-speed: 4s;
      --serif: Palatino, "Iowan Old Style", Georgia, ui-serif, serif;
      --mono: ui-monospace, Menlo, "Courier New", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }
    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(#0a0020 0%, #2b0a5e 40%, #7a2a9e 63%, #ff71ce 66%, #12002a 66.1%);
    }
    .star {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      animation: twinkle 3.6s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }
    .haze {
      position: absolute; left: 0; right: 0; top: 60%; height: 12%;
      background: rgba(255,113,206,0.28); filter: blur(6px); pointer-events: none;
    }
    .sun-wrap {
      position: absolute; left: 50%; top: 20%; transform: translate(-50%, -50%);
      animation: sunDrift 40s ease-in-out infinite alternate;
    }
    .sun-glow {
      position: absolute; inset: -20px;
      box-shadow: 0 0 80px 30px rgba(255,113,206,0.55), 0 0 200px 80px rgba(255,251,150,0.35);
      border-radius: 50%;
    }
    .sun {
      width: min(46vmin, 380px); height: min(46vmin, 380px); border-radius: 50%;
      background: linear-gradient(#fffb96, #ffb347 45%, #ff71ce 75%, #b967ff);
      -webkit-mask-image: linear-gradient(#000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%, #000 67% 73.5%, transparent 73.5% 78.5%, #000 78.5% 83%, transparent 83% 89%, #000 89% 92%, transparent 92% 100%);
      mask-image: linear-gradient(#000 0 52%, transparent 52% 55%, #000 55% 63%, transparent 63% 67%, #000 67% 73.5%, transparent 73.5% 78.5%, #000 78.5% 83%, transparent 83% 89%, #000 89% 92%, transparent 92% 100%);
    }
    @keyframes sunDrift { from { top: 20%; } to { top: calc(20% + 4vh); } }
    .scene {
      position: fixed; left: 0; right: 0; top: 0; bottom: 0;
      perspective: 520px; perspective-origin: 50% 40%; pointer-events: none;
    }
    .floor {
      position: absolute; top: 66%; left: -100%; width: 300%; height: 130%;
      transform-origin: 50% 0; transform: rotateX(72deg);
      background:
        linear-gradient(90deg, transparent 49.85%, #01cdfe 49.85% 50.15%, transparent 50.15%),
        repeating-linear-gradient(90deg, transparent 0 78px, #01cdfe 78px 80px),
        repeating-linear-gradient(0deg, transparent 0 78px, #ff71ce 78px 80px);
      background-size: 100% 100%, 80px 100%, 100% 80px;
      animation: gridScroll var(--grid-speed) linear infinite;
    }
    @keyframes gridScroll { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 0, 0 80px; } }
    .floor-fade {
      position: absolute; inset: 0;
      background: linear-gradient(rgba(255,113,206,0.35), transparent 18%, #12002a 90%);
    }
    .checker {
      position: absolute; left: 50%; bottom: -10%; width: 60vmin; height: 60vmin;
      transform: translateX(-50%) rotateX(74deg);
      background: repeating-conic-gradient(#b967ff 0 12%, #12002a 0 24%);
      border-radius: 50%; opacity: 0.5;
      -webkit-mask-image: radial-gradient(circle, #000 40%, transparent 70%);
      mask-image: radial-gradient(circle, #000 40%, transparent 70%);
      animation: spin 40s linear infinite;
    }
    @keyframes spin { to { transform: translateX(-50%) rotateX(74deg) rotate(360deg); } }
    .palm {
      position: absolute; bottom: 33%; width: 22vw; max-width: 280px;
      filter: drop-shadow(0 0 12px rgba(255,113,206,0.45));
      transform-origin: 50% 100%;
      animation: sway 5.5s ease-in-out infinite alternate;
    }
    .palm.left { left: 0; }
    .palm.right { right: 0; transform: scaleX(-1); animation-delay: -2.2s; }
    @keyframes sway { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
    .palm.right { animation-name: swayR; }
    @keyframes swayR { from { transform: scaleX(-1) rotate(-1.3deg); } to { transform: scaleX(-1) rotate(1.3deg); } }
    h1 {
      position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%);
      text-align: center; margin: 0;
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(30px, 8.5vw, 132px); letter-spacing: 0.04em;
      background: linear-gradient(#fff, #01cdfe 40%, #063a55 49%, #fff 51%, #ff71ce 75%, #b967ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.35);
      filter: drop-shadow(4px 4px 0 #b967ff) drop-shadow(8px 8px 0 #2b0a5e) drop-shadow(0 0 22px #01cdfe);
      animation: chromeGlow 6s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes chromeGlow {
      from { filter: drop-shadow(4px 4px 0 #b967ff) drop-shadow(8px 8px 0 #2b0a5e) drop-shadow(0 0 22px #01cdfe); }
      to { filter: drop-shadow(4px 4px 0 #b967ff) drop-shadow(8px 8px 0 #2b0a5e) drop-shadow(0 0 22px #ff71ce); }
    }
    .sub {
      position: absolute; left: 0; right: 0; top: 58%;
      text-align: center; font-family: var(--mono); color: var(--mint);
      letter-spacing: 0.42em; font-size: 13px; text-shadow: 0 0 10px var(--mint);
      pointer-events: none;
    }
    .cap {
      position: absolute; top: 18px; right: 22px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--cyan);
    }
    .bust {
      position: absolute; right: 12%; top: 28%; width: min(22vw, 180px);
      filter: drop-shadow(0 0 18px #b967ff);
      animation: floatB 9s ease-in-out infinite;
    }
    @keyframes floatB {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-22px) rotate(2deg); }
    }
    .win {
      position: absolute; left: 18px; bottom: 18px; width: 320px;
      background: #c0c0c0; color: #000; font-family: system-ui, sans-serif; font-size: 12px;
      border: 2px solid #fff; border-right-color: #404040; border-bottom-color: #404040;
      box-shadow: 1px 1px 0 #000, 6px 6px 0 rgba(0,0,0,0.25);
      pointer-events: auto;
    }
    .titlebar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #fff; display: flex; align-items: center; gap: 6px; padding: 3px 4px;
      font-weight: 700;
    }
    .ico { width: 14px; height: 14px; background: linear-gradient(90deg, #ff71ce, #01cdfe); }
    .win-btns { margin-left: auto; display: flex; gap: 3px; }
    .win-btns b {
      display: inline-block; width: 16px; height: 14px; text-align: center; line-height: 12px;
      background: #c0c0c0; border: 1px solid #fff; border-right-color: #404040; border-bottom-color: #404040;
      color: #000; font-weight: 400; font-size: 10px;
    }
    .menu { display: flex; gap: 12px; padding: 3px 8px; background: #c0c0c0; }
    .menu u { color: #000; }
    .lcd {
      margin: 6px; background: #000; color: var(--mint); font-family: var(--mono);
      padding: 8px; min-height: 78px; font-size: 11px; line-height: 1.55;
    }
    .lcd .pk { color: var(--pink); }
    .prog { margin: 0 6px 6px; height: 14px; background: #000040; border: 1px solid #404040; }
    .prog i {
      display: block; height: 100%; width: 0%;
      background: repeating-linear-gradient(90deg, #1084d0 0 8px, #000080 8px 10px);
      animation: fill20 20s linear infinite; animation-play-state: paused;
    }
    @keyframes fill20 { from { width: 0; } to { width: 100%; } }
    .playing .prog i { animation-play-state: running; }
    .ctrls { display: flex; gap: 6px; padding: 0 6px 6px; }
    .ctrls button {
      flex: 1; background: #c0c0c0; border: 2px solid #fff; border-right-color: #404040; border-bottom-color: #404040;
      font-family: system-ui; font-size: 11px; padding: 4px; cursor: pointer;
    }
    .ctrls button[aria-pressed="true"] {
      border-color: #404040; border-right-color: #fff; border-bottom-color: #fff; background: #a8a8a8;
    }
    .stat { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #808080; font-size: 10px; }
    .stat span { padding: 3px 6px; border-right: 1px solid #fff; }
    @media (max-width: 600px) { .cap { display: none; } .bust { width: 90px; } .win { transform: scale(0.86); transform-origin: bottom left; } }
    @media (prefers-reduced-motion: reduce) {
      .star, .sun-wrap, .floor, .checker, .palm, h1, .bust, .prog i { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" id="sky">
    <div class="haze"></div>
    <div class="sun-wrap" id="sun">
      <div class="sun-glow"></div>
      <div class="sun"></div>
    </div>
    <div class="scene">
      <div class="floor"><div class="floor-fade"></div></div>
      <div class="checker"></div>
    </div>
    <svg class="palm left" viewBox="0 0 200 260" aria-hidden="true">
      <path d="M110 250 C108 180 100 120 92 70" fill="none" stroke="#12002a" stroke-width="10"/>
      <path d="M92 70 C40 90 20 130 18 160" fill="#12002a"/>
      <path d="M92 70 C50 50 20 40 8 55" fill="#12002a"/>
      <path d="M92 70 C70 30 50 8 30 12" fill="#12002a"/>
      <path d="M92 70 C110 20 130 0 150 10" fill="#12002a"/>
      <path d="M92 70 C140 40 170 50 186 70" fill="#12002a"/>
      <path d="M92 70 C150 80 180 110 188 140" fill="#12002a"/>
      <path d="M92 70 C120 100 140 140 142 170" fill="#12002a"/>
    </svg>
    <svg class="palm right" viewBox="0 0 200 260" aria-hidden="true">
      <path d="M110 250 C108 180 100 120 92 70" fill="none" stroke="#12002a" stroke-width="10"/>
      <path d="M92 70 C40 90 20 130 18 160" fill="#12002a"/>
      <path d="M92 70 C50 50 20 40 8 55" fill="#12002a"/>
      <path d="M92 70 C70 30 50 8 30 12" fill="#12002a"/>
      <path d="M92 70 C110 20 130 0 150 10" fill="#12002a"/>
      <path d="M92 70 C140 40 170 50 186 70" fill="#12002a"/>
      <path d="M92 70 C150 80 180 110 188 140" fill="#12002a"/>
      <path d="M92 70 C120 100 140 140 142 170" fill="#12002a"/>
    </svg>
    <div class="cap">ＭＥＭＯＲＩＥＳ / ＯＦ　ＴＯＭＯＲＲＯＷ</div>
    <h1 id="title">ＬＵＮＡＲ　ＷＩＮＤ</h1>
    <div class="sub">Ｓ Ｉ Ｄ Ｅ　Ｂ　·　１ ９ ９ ５</div>
    <svg class="bust" id="bust" viewBox="0 0 120 180" aria-hidden="true">
      <defs>
        <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#d8c6ff"/><stop offset="1" stop-color="#b967ff"/>
        </linearGradient>
      </defs>
      <rect x="30" y="150" width="60" height="22" fill="url(#marble)"/>
      <path d="M28 150 L92 150 L80 118 L40 118 Z" fill="url(#marble)"/>
      <rect x="50" y="100" width="20" height="22" rx="6" fill="url(#marble)"/>
      <ellipse cx="60" cy="70" rx="28" ry="34" fill="url(#marble)"/>
      <path d="M34 62 Q60 28 86 62 Q86 48 60 38 Q34 48 34 62" fill="#c9b0ff"/>
      <ellipse cx="34" cy="74" rx="6" ry="8" fill="url(#marble)"/>
      <ellipse cx="86" cy="74" rx="6" ry="8" fill="url(#marble)"/>
      <path d="M48 64 Q54 62 58 66" fill="none" stroke="#b967ff" stroke-width="1.4"/>
      <path d="M72 64 Q66 62 62 66" fill="none" stroke="#b967ff" stroke-width="1.4"/>
      <path d="M60 70 L58 84" fill="none" stroke="#b967ff" stroke-width="1.4"/>
      <path d="M52 92 Q60 96 68 92" fill="none" stroke="#b967ff" stroke-width="1.4"/>
    </svg>
  </div>
  <div class="win" id="player">
    <div class="titlebar"><span class="ico"></span> Lunar Wind Player <span class="win-btns"><b>_</b><b>□</b><b>×</b></span></div>
    <div class="menu"><span><u>F</u>ile</span><span><u>V</u>iew</span><span><u>O</u>ptions</span><span><u>H</u>elp</span></div>
    <div class="lcd">
      <div><span class="pk">NOW PLAYING</span> LUNAR WIND — SIDE B</div>
      <div><span class="pk">SPEED</span> <span id="spd">1.00× CRUISE</span></div>
      <div><span class="pk">GRID</span> <span id="gmode">CRUISE</span></div>
      <div><span class="pk">TIME</span> <span id="clock">00:00:00</span></div>
    </div>
    <div class="prog"><i id="bar"></i></div>
    <div class="ctrls">
      <button type="button" id="play" aria-pressed="false">▶ Play</button>
      <button type="button" id="slow">◂◂ Slow</button>
      <button type="button" id="fast">▸▸ Fast</button>
    </div>
    <div class="stat"><span>Ready</span><span id="stat2">Grid 4.0s</span></div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function init() {
      var sky = qs("#sky");
      if (sky) {
        var cols = ["#fff", "#fffb96", "#01cdfe", "#b967ff"];
        for (var i = 0; i < 10; i++) {
          var s = document.createElement("div");
          s.className = "star";
          s.style.left = (8 + Math.random() * 84) + "%";
          s.style.top = (4 + Math.random() * 58) + "%";
          s.style.background = cols[i % 4];
          s.style.animationDelay = (i * 0.37) + "s";
          sky.appendChild(s);
        }
      }
      var levels = [
        { name: "DRIFT", s: 12, mul: "0.33×" },
        { name: "CRUISE", s: 4, mul: "1.00×" },
        { name: "RUSH", s: 1.4, mul: "2.85×" },
        { name: "HYPER", s: 0.5, mul: "8.00×" }
      ];
      var lvl = 1, playing = false, tsec = 0, last = 0;
      function apply() {
        var L = levels[lvl];
        document.documentElement.style.setProperty("--grid-speed", L.s + "s");
        var spd = qs("#spd"); if (spd) spd.textContent = L.mul + " " + L.name;
        var gm = qs("#gmode"); if (gm) gm.textContent = L.name;
        var st = qs("#stat2"); if (st) st.textContent = "Grid " + L.s + "s";
      }
      apply();
      var play = qs("#play"), slow = qs("#slow"), fast = qs("#fast"), player = qs("#player"), clock = qs("#clock");
      if (play) play.addEventListener("click", function () {
        playing = !playing;
        play.setAttribute("aria-pressed", playing ? "true" : "false");
        play.textContent = playing ? "❚❚ Pause" : "▶ Play";
        if (player) { if (playing) player.classList.add("playing"); else player.classList.remove("playing"); }
        if (playing) { lvl = 2; apply(); }
        else { lvl = 1; apply(); }
      });
      if (slow) slow.addEventListener("click", function () { lvl = Math.max(0, lvl - 1); apply(); });
      if (fast) fast.addEventListener("click", function () { lvl = Math.min(3, lvl + 1); apply(); });
      function tick(now) {
        if (playing) {
          if (!last) last = now;
          tsec += (now - last) / 1000;
          last = now;
          var h = Math.floor(tsec / 3600), m = Math.floor((tsec % 3600) / 60), s = Math.floor(tsec % 60);
          function z(n) { return (n < 10 ? "0" : "") + n; }
          if (clock) clock.textContent = z(h) + ":" + z(m) + ":" + z(s);
        } else last = now;
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(tick);
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(tick);
      var reduce = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var fine = typeof window.matchMedia === "function" && window.matchMedia("(pointer: fine)").matches;
      if (!reduce && fine) {
        var mx = 0, my = 0, px = 0, py = 0;
        var title = qs("#title"), bust = qs("#bust"), sun = qs("#sun");
        window.addEventListener("mousemove", function (e) {
          mx = (e.clientX / window.innerWidth - 0.5);
          my = (e.clientY / window.innerHeight - 0.5);
        });
        function para() {
          px += (mx - px) * 0.06; py += (my - py) * 0.06;
          if (title) title.style.transform = "translateY(-50%) translate(" + (px * 18) + "px," + (py * 10) + "px) rotateY(" + (px * 8) + "deg)";
          if (bust) bust.style.marginLeft = (-px * 24) + "px";
          if (sun) sun.style.marginLeft = (px * 16) + "px";
          if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(para);
        }
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(para);
      }
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
