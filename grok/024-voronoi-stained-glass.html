<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose of Cells — Voronoi Stained-Glass Window</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: Georgia, Palatino, "Palatino Linotype", serif;
      color: #e8d6a2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #1d1a18;
    }
    header, footer {
      position: relative;
      z-index: 4;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #d7b36a;
      font-weight: 500;
    }
    header p { font-style: italic; font-size: 13px; color: #c8b88a; opacity: .8; }
    .scene {
      position: relative;
      overflow: hidden;
    }
    .wall {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 60% at 50% 38%, rgba(215,179,106,.16), transparent 55%),
        radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.72) 100%),
        repeating-linear-gradient(90deg, transparent 0 218px, #17140f 218px 220px),
        repeating-linear-gradient(0deg, transparent 0 90px, #17140f 90px 92px),
        repeating-linear-gradient(28deg, rgba(255,255,255,.03) 0 1px, transparent 1px 7px),
        linear-gradient(#3a3531, #2b2724 55%, #1d1a18);
      background-size: auto, auto, 220px 92px, 220px 92px, auto, auto;
    }
    .wall::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0 90px, #17140f 90px 92px),
        repeating-linear-gradient(90deg, transparent 0 218px, #17140f 218px 220px);
      background-position: 110px 46px, 110px 46px;
      background-size: 220px 92px;
      opacity: .85;
      pointer-events: none;
    }
    .floor {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 26vh;
      background:
        repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,255,255,.03) 7% 7.3%, transparent 7.3% 14%),
        linear-gradient(#14110f, #0d0b0a);
      transform: perspective(400px) rotateX(8deg);
      transform-origin: top;
    }
    #glass {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -54%);
      display: block;
      cursor: crosshair;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,.55));
    }
    #spill {
      position: absolute;
      left: 50%;
      bottom: 2vh;
      transform: translateX(-50%) rotateX(62deg) scaleY(-1);
      transform-origin: center bottom;
      filter: blur(22px) saturate(1.35);
      opacity: .55;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    footer { justify-content: center; gap: 10px; }
    button {
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e8d6a2;
      background: rgba(0,0,0,.35);
      border: 1px solid #d7b36a;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover { background: rgba(215,179,106,.18); }
    button[aria-pressed="true"] { background: #d7b36a; color: #1d1a18; }
    .swatch { display: flex; gap: 3px; }
    .swatch i { width: 8px; height: 8px; border-radius: 50%; display: block; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Rose of Cells</h1>
    <p>A generative gothic window, leaded by chance</p>
  </header>
  <div class="scene" id="scene">
    <div class="wall"></div>
    <div class="floor"></div>
    <canvas id="spill"></canvas>
    <canvas id="glass"></canvas>
  </div>
  <footer>
    <button type="button" data-pal="chartres" aria-pressed="true">
      <span class="swatch"><i style="background:#1b2f8f"></i><i style="background:#a91f30"></i><i style="background:#d8b25c"></i></span>
      Chartres
    </button>
    <button type="button" data-pal="autumn" aria-pressed="false">
      <span class="swatch"><i style="background:#a33d13"></i><i style="background:#d9931c"></i><i style="background:#6b6a1f"></i></span>
      Autumn
    </button>
    <button type="button" data-pal="emerald" aria-pressed="false">
      <span class="swatch"><i style="background:#0b4a2a"></i><i style="background:#2ea78c"></i><i style="background:#c9a44b"></i></span>
      Emerald
    </button>
    <button type="button" id="regen">Regenerate</button>
  </footer>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    var PALS = {
      chartres: ["#1b2f8f","#233fa8","#1a4fb5","#2b64c8","#8f1626","#a91f30","#c0392b","#d8b25c","#e8d6a2","#4b2a7a","#f1f0e8","#1d6e6b"],
      autumn: ["#a33d13","#c25a1c","#d9931c","#e8b23a","#7a2a12","#6b6a1f","#8e8a2e","#4d2b1a","#e9c98a","#b3471a","#5b3a1e","#d97c2b"],
      emerald: ["#0b4a2a","#0f6b3c","#158a4a","#1e8f7a","#2ea78c","#116d5a","#3fbf9a","#0d3c3a","#0a2f26","#c9a44b","#e6d38a","#f0ead2"]
    };
    function hexRgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }
    function mix(a, b, t) {
      return "rgb(" + Math.round(a[0]+(b[0]-a[0])*t) + "," + Math.round(a[1]+(b[1]-a[1])*t) + "," + Math.round(a[2]+(b[2]-a[2])*t) + ")";
    }
    function darken(rgb, t) {
      return [rgb[0]*(1-t), rgb[1]*(1-t), rgb[2]*(1-t)];
    }
    function clipPoly(poly, ax, ay, bx, by) {
      var out = [];
      var n = poly.length;
      if (!n) return out;
      function side(px, py) { return (bx-ax)*(py-ay) - (by-ay)*(px-ax); }
      function isect(p1, p2) {
        var x1 = p1[0], y1 = p1[1], x2 = p2[0], y2 = p2[1];
        var dx1 = x2-x1, dy1 = y2-y1, dx2 = bx-ax, dy2 = by-ay;
        var den = dx1*dy2 - dy1*dx2;
        if (Math.abs(den) < 1e-8) return p2;
        var t = ((ax-x1)*dy2 - (ay-y1)*dx2) / den;
        return [x1+t*dx1, y1+t*dy1];
      }
      var i, cur, prev, cIn, pIn;
      for (i = 0; i < n; i++) {
        cur = poly[i];
        prev = poly[(i + n - 1) % n];
        cIn = side(cur[0], cur[1]) >= 0;
        pIn = side(prev[0], prev[1]) >= 0;
        if (cIn) {
          if (!pIn) out.push(isect(prev, cur));
          out.push(cur);
        } else if (pIn) {
          out.push(isect(prev, cur));
        }
      }
      return out;
    }
    function inArch(x, y, w, h) {
      var spring = Math.max(w * 0.8660254 + 6, h * 0.42);
      if (y < 0 || y > h || x < 0 || x > w) return false;
      if (y >= spring) return true;
      var d1 = Math.hypot(x - 0, y - spring);
      var d2 = Math.hypot(x - w, y - spring);
      return d1 <= w && d2 <= w;
    }
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    function init() {
      var canvas = qs("#glass");
      var spill = qs("#spill");
      var scene = qs("#scene");
      if (!canvas || !scene) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var sctx = spill ? spill.getContext("2d") : null;
      var reduce = false;
      if (typeof window.matchMedia === "function") {
        var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        reduce = !!(mq && mq.matches);
      }
      var pal = "chartres";
      var sites = [];
      var colors = [];
      var layer = null;
      var growing = null;
      var W = 0, H = 0, dpr = 1;

      function size() {
        var availW = Math.min(640, scene.clientWidth * 0.52);
        var availH = scene.clientHeight * 0.78;
        var ratio = 1 / 1.75;
        var w = availW;
        var h = w / ratio;
        if (h > availH) { h = availH; w = h * ratio; }
        dpr = window.devicePixelRatio ? Math.min(window.devicePixelRatio, 2) : 1;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        W = w; H = h;
        if (spill && sctx) {
          spill.width = Math.floor(w * dpr * 0.55);
          spill.height = Math.floor(h * dpr * 0.35);
          spill.style.width = (w * 0.9) + "px";
          spill.style.height = (h * 0.28) + "px";
        }
      }

      function seedSites() {
        sites = [];
        colors = [];
        var area = W * H;
        var n = Math.round(26 + (70 - 26) * Math.min(1, area / 280000));
        n = Math.max(26, Math.min(70, n));
        var minD = Math.sqrt(area / n) * 0.55;
        var tries = 0;
        while (sites.length < n && tries < n * 40) {
          tries++;
          var x = Math.random() * W;
          var y = Math.random() * H;
          if (!inArch(x, y, W, H)) continue;
          var ok = true, i;
          for (i = 0; i < sites.length; i++) {
            var dx = sites[i].x - x, dy = sites[i].y - y;
            if (dx*dx + dy*dy < minD * minD) { ok = false; break; }
          }
          if (ok) {
            sites.push({ x: x, y: y });
            var list = PALS[pal];
            colors.push(list[Math.floor(Math.random() * list.length)]);
          }
        }
      }

      function voronoiCell(i) {
        var poly = [[0,0],[W,0],[W,H],[0,H]];
        var s = sites[i];
        var j, ox, oy, mx, my, dx, dy, nx, ny, px, py;
        for (j = 0; j < sites.length; j++) {
          if (j === i) continue;
          ox = sites[j].x; oy = sites[j].y;
          mx = (s.x + ox) / 2;
          my = (s.y + oy) / 2;
          dx = ox - s.x; dy = oy - s.y;
          nx = -dy; ny = dx;
          px = mx + nx; py = my + ny;
          poly = clipPoly(poly, mx + nx, my + ny, mx - nx, my - ny);
          if (poly.length < 3) break;
        }
        return poly.filter(function (p) { return inArch(p[0], p[1], W, H) || true; });
      }

      function springY() {
        var rise = W * 0.8660254;
        return Math.max(rise + 6, H * 0.42);
      }
      function archPath(ctx2) {
        var spring = springY();
        ctx2.beginPath();
        ctx2.moveTo(0, H);
        ctx2.lineTo(0, spring);
        ctx2.arc(W, spring, W, Math.PI, -Math.PI * 2 / 3, true);
        ctx2.arc(0, spring, W, -Math.PI / 3, 0, false);
        ctx2.lineTo(W, H);
        ctx2.closePath();
      }

      function drawGlass(target) {
        var c = target;
        c.save();
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, W, H);
        archPath(c);
        c.clip();
        c.fillStyle = "#17130f";
        c.fillRect(0, 0, W, H);
        var i, poly, k, col, rgb, g, cx, cy;
        for (i = 0; i < sites.length; i++) {
          poly = voronoiCell(i);
          if (poly.length < 3) continue;
          col = hexRgb(colors[i] || "#1b2f8f");
          cx = sites[i].x; cy = sites[i].y;
          g = c.createRadialGradient(cx - 8, cy - 12, 2, cx, cy, 48);
          g.addColorStop(0, mix(col, [255,255,255], 0.32));
          g.addColorStop(0.45, "rgb(" + col[0] + "," + col[1] + "," + col[2] + ")");
          g.addColorStop(1, "rgb(" + Math.round(col[0]*0.45) + "," + Math.round(col[1]*0.45) + "," + Math.round(col[2]*0.45) + ")");
          c.beginPath();
          c.moveTo(poly[0][0], poly[0][1]);
          for (k = 1; k < poly.length; k++) c.lineTo(poly[k][0], poly[k][1]);
          c.closePath();
          c.fillStyle = g;
          c.fill();
          c.save();
          c.clip();
          c.strokeStyle = "rgba(255,255,255,0.09)";
          c.lineWidth = 1;
          var s;
          for (s = -H; s < W + H; s += 7) {
            c.beginPath();
            c.moveTo(s, 0);
            c.lineTo(s + H, H);
            c.stroke();
          }
          c.restore();
          c.beginPath();
          c.moveTo(poly[0][0], poly[0][1]);
          for (k = 1; k < poly.length; k++) c.lineTo(poly[k][0], poly[k][1]);
          c.closePath();
          c.strokeStyle = "#17130f";
          c.lineWidth = 6;
          c.lineJoin = "round";
          c.stroke();
          c.strokeStyle = "rgba(255,240,210,0.28)";
          c.lineWidth = 1.2;
          c.stroke();
        }
        archPath(c);
        c.strokeStyle = "#17130f";
        c.lineWidth = 8;
        c.stroke();
        c.strokeStyle = "rgba(255,240,210,0.35)";
        c.lineWidth = 1.4;
        c.stroke();
        c.restore();
      }

      function bake() {
        layer = document.createElement("canvas");
        layer.width = canvas.width;
        layer.height = canvas.height;
        var lctx = layer.getContext("2d");
        if (!lctx) return;
        drawGlass(lctx);
      }

      function recolor() {
        var list = PALS[pal];
        var i;
        for (i = 0; i < colors.length; i++) colors[i] = list[Math.floor(Math.random() * list.length)];
        bake();
      }

      var start = performance.now ? performance.now() : 0;
      function loop(now) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        if (layer) ctx.drawImage(layer, 0, 0, W, H);
        if (growing && growing.layer) {
          ctx.save();
          var t = reduce ? 1 : easeOut(Math.min(1, (now - growing.t0) / 620));
          ctx.translate(growing.x, growing.y);
          ctx.scale(t, t);
          ctx.translate(-growing.x, -growing.y);
          ctx.drawImage(growing.layer, 0, 0, W, H);
          ctx.restore();
          if (t >= 1) {
            bake();
            growing = null;
          }
        }
        if (!reduce) {
          var period = 9000;
          var u = ((now - start) % period) / period;
          var gx = -W * 0.3 + u * W * 1.6;
          ctx.save();
          archPath(ctx);
          ctx.clip();
          ctx.globalCompositeOperation = "soft-light";
          var lg = ctx.createLinearGradient(gx, 0, gx + W * 0.35, H);
          lg.addColorStop(0, "rgba(255,250,235,0)");
          lg.addColorStop(0.5, "rgba(255,250,235,0.26)");
          lg.addColorStop(1, "rgba(255,250,235,0)");
          ctx.fillStyle = lg;
          ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = "screen";
          ctx.fillStyle = lg;
          ctx.globalAlpha = 0.35;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
        if (sctx && spill) {
          sctx.setTransform(1, 0, 0, 1, 0, 0);
          sctx.clearRect(0, 0, spill.width, spill.height);
          sctx.drawImage(canvas, 0, 0, spill.width, spill.height);
        }
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
      }

      function addSite(x, y) {
        if (!inArch(x, y, W, H)) return;
        var snap = document.createElement("canvas");
        snap.width = canvas.width;
        snap.height = canvas.height;
        var sc = snap.getContext("2d");
        if (sc && layer) sc.drawImage(layer, 0, 0);
        sites.push({ x: x, y: y });
        var list = PALS[pal];
        colors.push(list[Math.floor(Math.random() * list.length)]);
        var grow = document.createElement("canvas");
        grow.width = canvas.width;
        grow.height = canvas.height;
        var gc = grow.getContext("2d");
        if (gc) drawGlass(gc);
        growing = { x: x, y: y, t0: performance.now ? performance.now() : 0, layer: grow };
        layer = snap;
        if (reduce) { bake(); growing = null; }
      }

      canvas.addEventListener("click", function (e) {
        var r = canvas.getBoundingClientRect();
        addSite((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
      });

      qsa("button[data-pal]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          pal = btn.getAttribute("data-pal") || "chartres";
          qsa("button[data-pal]").forEach(function (b) { b.setAttribute("aria-pressed", b === btn ? "true" : "false"); });
          recolor();
        });
      });
      var regen = qs("#regen");
      if (regen) regen.addEventListener("click", function () { seedSites(); bake(); });
      window.addEventListener("keydown", function (e) {
        if (e.key === "r" || e.key === "R") { seedSites(); bake(); }
      });
      window.addEventListener("resize", function () { size(); seedSites(); bake(); });
      size();
      seedSites();
      bake();
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
      else loop(0);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
