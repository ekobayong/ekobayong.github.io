<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Landscape — Animated Topographic Contours, Sheet 040</title>
  <style>
    :root {
      --paper: #f3eee3; --ink: #2b2a28; --accent: #b5482b; --glass: rgba(243,238,227,0.78);
      --line: rgba(43,42,40,0.42); --index: rgba(43,42,40,0.92); --label: #2b2a28;
      --serif: Georgia, "Iowan Old Style", Palatino, ui-serif, serif;
      --sans: ui-sans-serif, system-ui, sans-serif;
      --mono: ui-monospace, "Courier New", monospace;
    }
    body[data-pal="terrain"] {
      --paper: #d8d2c2; --ink: #3a2c22; --accent: #8a4b2a; --glass: rgba(232,226,210,0.78);
      --line: rgba(74,48,28,0.5); --index: rgba(58,36,20,0.92); --label: #3a2c22;
    }
    body[data-pal="night"] {
      --paper: #0a1a33; --ink: #d9ecff; --accent: #7fd1ff; --glass: rgba(10,26,51,0.72);
      --line: rgba(127,209,255,0.42); --index: rgba(217,236,255,0.95); --label: #d9ecff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .graticule {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 120px 120px; opacity: 0.35; mix-blend-mode: multiply;
    }
    body[data-pal="night"] .graticule { mix-blend-mode: screen; opacity: 0.28; }
    .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .ui > * { pointer-events: auto; }
    .card {
      background: var(--glass); backdrop-filter: blur(10px);
      border-radius: 6px; border: 1px solid rgba(43,42,40,0.18);
      padding: 12px 14px;
    }
    body[data-pal="night"] .card { border-color: rgba(127,209,255,0.28); }
    .title {
      position: absolute; top: 16px; left: 16px; max-width: 360px;
      box-shadow: inset 0 0 0 1px rgba(43,42,40,0.15);
    }
    .sheet {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; font-variant: small-caps; color: var(--accent); margin-bottom: 6px;
    }
    h1 { font-family: var(--serif); font-size: 26px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.02em; }
    h1 em { font-style: italic; color: var(--accent); }
    .title p { margin: 0; font-size: 13px; line-height: 1.45; }
    .pals { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
    .pals button {
      border: 1px solid rgba(43,42,40,0.2); background: var(--glass); color: var(--ink);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-variant: small-caps; letter-spacing: 0.06em;
    }
    .pals button[aria-pressed="true"] { outline: 2px solid var(--accent); }
    .readout {
      position: absolute; left: 16px; bottom: 16px; min-width: 250px;
      font-variant: small-caps; letter-spacing: 0.06em;
    }
    .nums { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .nums b { display: block; font-family: var(--serif); font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: 0; font-variant: normal; }
    .nums span { font-size: 10px; color: var(--accent); }
    .scale { display: flex; align-items: center; gap: 8px; font-size: 11px; margin: 8px 0; }
    .bar { width: 80px; height: 6px; border: 1px solid var(--ink); border-top: 0; position: relative; }
    .bar::before, .bar::after { content: ""; position: absolute; top: -4px; width: 1px; height: 10px; background: var(--ink); }
    .bar::before { left: 0; } .bar::after { right: 0; }
    .legend { font-size: 11px; margin: 6px 0 10px; }
    .legend i { display: inline-block; width: 22px; height: 0; border-top: 1.6px solid var(--index); margin: 0 6px 0 0; vertical-align: middle; }
    .legend i.m { border-top-width: 0.7px; border-color: var(--line); }
    .ctrls { display: flex; align-items: center; gap: 10px; }
    .ctrls label { font-size: 11px; }
    input[type=range] { width: 110px; accent-color: var(--accent); }
    .ctrls button {
      border: 1px solid var(--accent); background: transparent; color: var(--ink);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    .rose { position: absolute; right: 18px; bottom: 18px; width: 120px; height: 120px; animation: sway 12s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @media (max-width: 720px) {
      .title p, .rose { display: none; }
      .pals { top: auto; bottom: 16px; right: 16px; left: 16px; justify-content: center; }
      .readout { bottom: 64px; }
    }
    @media (prefers-reduced-motion: reduce) { .rose { animation: none; } }
  </style>
</head>
<body data-pal="paper">
  <canvas id="map"></canvas>
  <div class="graticule"></div>
  <div class="ui">

      <div class="sheet">Sheet 040 · Series L-7 / 1 : 25 000</div>
      <h1>The Living <em>Landscape</em></h1>
      <p>Contours every 40 m from a 180 m datum; every fifth line is an index contour at 200 m. The heightfield is a drifting five-octave noise so ridges migrate like weather.</p>
    </div>
    <div class="pals" id="pals">
      <button type="button" data-pal="paper" aria-pressed="true">Paper &amp; Ink</button>
      <button type="button" data-pal="terrain">Terrain</button>
      <button type="button" data-pal="night">Night Blueprint</button>
    </div>
    <div class="card readout">

      <div class="legend"><i class="m"></i> 40 m &nbsp; <i></i> 200 m index</div>
      <div class="ctrls">

        <button type="button" id="pause">Pause</button>
      </div>
    </div>
    <svg class="rose" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="1"/>

      </g>
      <polygon points="60,22 66,60 60,54 54,60" fill="#b5482b"/>
      <polygon points="60,98 66,60 60,66 54,60" fill="currentColor" opacity="0.35"/>
      <polygon points="22,60 60,54 60,66" fill="currentColor" opacity="0.2"/>
      <polygon points="98,60 60,54 60,66" fill="currentColor" opacity="0.55"/>
      <circle cx="60" cy="60" r="3" fill="currentColor"/>
      <text x="60" y="18" text-anchor="middle" font-size="10" font-family="Georgia, serif" fill="currentColor">N</text>
      <text x="60" y="116" text-anchor="middle" font-size="10" font-family="Georgia, serif" fill="currentColor">S</text>
      <text x="8" y="64" text-anchor="middle" font-size="10" font-family="Georgia, serif" fill="currentColor">W</text>
      <text x="112" y="64" text-anchor="middle" font-size="10" font-family="Georgia, serif" fill="currentColor">E</text>
    </svg>
  </div>

        if (paused || reduce) draw();
      });
      canvas.addEventListener("pointerleave", function () { mx = -1; my = -1; });
      var flowEl = qs("#flow"), pauseBtn = qs("#pause");
      if (flowEl) flowEl.addEventListener("input", function () { flow = Number(flowEl.value) / 100; });
      function togPause() {
        paused = !paused;
        if (pauseBtn) pauseBtn.textContent = paused ? "Resume" : "Pause";
        if (!paused && typeof window.requestAnimationFrame === "function") { last = 0; window.requestAnimationFrame(frame); }
      }
      if (pauseBtn) pauseBtn.addEventListener("click", togPause);
      window.addEventListener("keydown", function (e) {
        if (e.key === " " ) { e.preventDefault(); togPause(); }
        if (e.key === "1") setPal("paper");
        if (e.key === "2") setPal("terrain");
        if (e.key === "3") setPal("night");
      });
      function setPal(p) {
        pal = p;
        document.body.setAttribute("data-pal", p);
        qsa("#pals button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-pal") === p ? "true" : "false"); });
        draw();
      }
      qsa("#pals button").forEach(function (b) {
        b.addEventListener("click", function () { setPal(b.getAttribute("data-pal")); });
      });
      rebuild();
      if (reduce) { paused = true; if (pauseBtn) pauseBtn.textContent = "Resume"; draw(); }
      else if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
      else draw();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
