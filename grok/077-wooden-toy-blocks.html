<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wooden Alphabet Blocks</title>
  <style>
    :root {
      --brown: #4a3323;
      --round: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Helvetica Neue", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--round);
      background: linear-gradient(#fff6e6, #fbf3e4 45%, #f2dfc4);
      color: var(--brown);
    }
    .glow {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 85% 8%, rgba(255,190,150,0.45), transparent 42%);
    }
    .beams {
      position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(118deg, transparent 36%, rgba(255,255,240,0.28) 38%, rgba(255,255,240,0.08) 44%, transparent 48%),
        linear-gradient(128deg, transparent 52%, rgba(255,255,240,0.2) 55%, transparent 62%);
      mix-blend-mode: screen;
    }
    header.bar {
      position: relative; z-index: 4;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 12px 16px;
    }
    h1 { font-size: clamp(1.2rem, 3vw, 1.8rem); display: flex; gap: 1px; }
    h1 span { display: inline-block; cursor: default; }
    h1 span:hover { animation: wiggle 0.4s ease; }
    @keyframes wiggle { 25% { transform: rotate(-12deg) translateY(-3px); } 75% { transform: rotate(10deg); } }
    .c0 { color: #e85c4e; } .c1 { color: #4a86d6; } .c2 { color: #e0ad1a; } .c3 { color: #3f8a4d; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
    input#word {
      font-family: inherit; font-weight: 700; text-transform: uppercase;
      border: 3px solid var(--brown); background: #fff8e8; color: var(--brown);
      border-radius: 10px; padding: 8px 10px; width: 160px;
    }
    .btn {
      font-family: inherit; font-weight: 800;
      background: #f6cf4a; color: var(--brown);
      border: 3px solid var(--brown);
      box-shadow: 4px 4px 0 var(--brown);
      border-radius: 12px; padding: 8px 12px; cursor: pointer;
    }
    .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--brown); }
    .btn.blue { background: #4a86d6; color: #fff; }
    .btn.red { background: #e85c4e; color: #fff; }
    .btn.green { background: #63ad70; color: #fff; }
    #stage {
      position: absolute; inset: 0; top: 64px;
      perspective: 900px;
    }
    .rug {
      position: absolute; left: 0; right: 0; bottom: 54px; height: 70px;
      background: repeating-linear-gradient(90deg, #d9a98a 0 8px, #c48a6a 8px 16px);
      border-top: 2px dashed rgba(255,255,255,0.45);
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.08);
    }
    .desk {
      position: absolute; left: 0; right: 0; bottom: 0; height: 54px;
      background:
        repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,0.06) 11px 12px),
        linear-gradient(#c88b52 0 8px, #a8703f 8px, #7a4b26);
      box-shadow: inset 0 10px 14px rgba(0,0,0,0.18);
    }
    .block {
      position: absolute;
      transform-style: preserve-3d;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .block:active { cursor: grabbing; }
    .face {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(135deg, rgba(90,50,20,0.08) 0 2px, transparent 2px 7px),
        linear-gradient(#ecc48d, #d9a86c);
      background-color: #e3b77f;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), inset 4px 4px 8px rgba(255,255,255,0.18), inset -4px -4px 8px rgba(90,50,20,0.18);
      backface-visibility: hidden;
    }
    .face.top { filter: brightness(1.12); }
    .face.bot, .face.left, .face.right { filter: brightness(0.86); }
    .paint {
      position: absolute; inset: 12%;
      border-radius: 8%;
      clip-path: polygon(0 0, 100% 0, 100% 78%, 86% 100%, 0 100%);
    }
    .paint::after {
      content: "";
      position: absolute; width: 18%; height: 18%; border-radius: 50%;
      background: rgba(90,50,20,0.16); right: 12%; bottom: 18%;
    }
    .letter {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-weight: 800; color: #fff8e8;
      text-shadow: 2px 3px 0 rgba(74,51,35,0.28);
      font-size: 0.62em;
    }
    .toast {
      position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 20px);
      background: var(--brown); color: #fff8e8;
      padding: 8px 16px; border-radius: 999px; opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 8; font-weight: 700;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 420px) { header.bar { padding: 8px; } }
    @media (prefers-reduced-motion: reduce) {
      h1 span:hover { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="beams"></div>
  <header class="bar">
    <h1 id="title"></h1>
    <div class="controls">
      <input id="word" type="text" maxlength="12" placeholder="spell a word" aria-label="spell a word">
      <button type="button" class="btn" id="spell">spell a word</button>
      <button type="button" class="btn blue" id="shake">Shake table</button>
      <button type="button" class="btn green" id="add">+ Block</button>
      <button type="button" class="btn red" id="tidy">Tidy up</button>
    </div>
  </header>
  <div id="stage">
    <div class="rug"></div>
    <div class="desk"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function init() {
      var stage = qs("#stage");
      var wordIn = qs("#word");
      var toast = qs("#toast");
      var title = qs("#title");
      if (!stage) return;
      var reduce = false;
      if (typeof window.matchMedia === "function") {
        reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }
      if (title) {
        var t = "Wooden Alphabet Blocks";
        var html = "", i;
        for (i = 0; i < t.length; i++) {
          if (t[i] === " ") html += " ";
          else html += "<span class='c" + (i % 4) + "'>" + t[i] + "</span>";
        }
        title.innerHTML = html;
      }
      var paints = [
        { a: "#e85c4e", b: "#c33b30" },
        { a: "#4a86d6", b: "#2a5fa8" },
        { a: "#f6cf4a", b: "#e0ad1a" },
        { a: "#63ad70", b: "#3f8a4d" }
      ];
      var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      var blocks = [];
      var colorI = 0;
      var G = 2200, REST = 0.32;
      function sizeFor() {
        return window.innerWidth < 420 ? 60 : Math.max(64, Math.min(88, window.innerWidth / 16));
      }
      function floorY() {
        return stage.getBoundingClientRect().height - 54 - 4;
      }
      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add("show");
        window.setTimeout(function () { toast.classList.remove("show"); }, 1600);
      }
      function makeCube(letter, x, y) {
        var size = sizeFor();
        var el = document.createElement("div");
        el.className = "block";
        el.style.width = size + "px";
        el.style.height = size + "px";
        var pal = paints[colorI++ % 4];
        var faces = [
          { cls: "front", t: "rotateY(0deg) translateZ(" + (size / 2) + "px)" },
          { cls: "back", t: "rotateY(180deg) translateZ(" + (size / 2) + "px)" },
          { cls: "right", t: "rotateY(90deg) translateZ(" + (size / 2) + "px)" },
          { cls: "left", t: "rotateY(-90deg) translateZ(" + (size / 2) + "px)" },
          { cls: "top", t: "rotateX(90deg) translateZ(" + (size / 2) + "px)" },
          { cls: "bot", t: "rotateX(-90deg) translateZ(" + (size / 2) + "px)" }
        ];
        faces.forEach(function (f) {
          var d = document.createElement("div");
          d.className = "face " + f.cls;
          d.style.transform = f.t;
          if (f.cls === "front") {
            var p = document.createElement("div");
            p.className = "paint";
            p.style.background = "linear-gradient(" + pal.a + "," + pal.b + ")";
            var L = document.createElement("div");
            L.className = "letter";
            L.textContent = letter;
            L.style.fontSize = (size * 0.62) + "px";
            p.appendChild(L);
            d.appendChild(p);
          }
          el.appendChild(d);
        });
        stage.appendChild(el);
        var b = {
          el: el, letter: letter, size: size,
          x: x, y: y, vx: 0, vy: 0, ang: (Math.random() - 0.5) * 10,
          av: 0, tiltX: 12 + Math.random() * 10, tiltY: (Math.random() - 0.5) * 28,
          drag: false, dead: false
        };
        bindDrag(b);
        blocks.push(b);
        place(b);
        return b;
      }
      function place(b) {
        var depth = 0.92 + (b.y / Math.max(1, floorY())) * 0.12;
        b.el.style.transform = "translate3d(" + b.x + "px," + b.y + "px,0) rotateX(" + b.tiltX + "deg) rotateY(" + (b.tiltY + b.ang) + "deg) scale(" + depth + ")";
        b.el.style.zIndex = String(100 + Math.floor(b.y));
        b.el.style.filter = "drop-shadow(6px 10px 8px rgba(90,50,20,0.28))";
      }
      function bindDrag(b) {
        b.el.addEventListener("pointerdown", function (e) {
          if (e.button && e.button !== 0) return;
          b.drag = true;
          b.vx = 0; b.vy = 0;
          b.px = e.clientX; b.py = e.clientY;
          if (b.el.setPointerCapture) b.el.setPointerCapture(e.pointerId);
          e.preventDefault();
        });
        b.el.addEventListener("pointermove", function (e) {
          if (!b.drag) return;
          var dx = e.clientX - b.px, dy = e.clientY - b.py;
          b.x += dx; b.y += dy;
          b.lvx = dx; b.lvy = dy; b.lt = e.timeStamp;
          b.px = e.clientX; b.py = e.clientY;
          place(b);
        });
        function end(e) {
          if (!b.drag) return;
          b.drag = false;
          b.vx = (b.lvx || 0) * 18;
          b.vy = (b.lvy || 0) * 18;
        }
        b.el.addEventListener("pointerup", end);
        b.el.addEventListener("pointercancel", end);
      }
      function spawnWord(w) {
        w = (w || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 12);
        if (!w) { showToast("Type a word first."); return; }
        var sz = sizeFor();
        var total = w.length * (sz + 10);
        var start = Math.max(20, (stage.clientWidth - total) / 2);
        w.split("").forEach(function (ch, i) {
          window.setTimeout(function () {
            makeCube(ch, start + i * (sz + 10), -sz - 20);
          }, reduce ? 0 : i * 110);
        });
        showToast("Spelling “" + w + "”");
      }
      function addRandom() {
        var ch = alphabet[(Math.random() * 26) | 0];
        makeCube(ch, 40 + Math.random() * Math.max(40, stage.clientWidth - 120), -sizeFor());
        showToast("A wild " + ch + " appears.");
      }
      function shake() {
        blocks.forEach(function (b) {
          b.vy = -700 - Math.random() * 400;
          b.vx = (Math.random() - 0.5) * 700;
          b.av = (Math.random() - 0.5) * 220;
        });
        if (!reduce && stage.animate) {
          stage.animate(
            [{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }],
            { duration: 280, easing: "ease-out" }
          );
        }
        showToast("Shake table!");
      }
      function tidy() {
        blocks.forEach(function (b) {
          b.el.style.transition = "opacity 0.35s ease, transform 0.35s ease";
          b.el.style.opacity = "0";
          b.dead = true;
        });
        window.setTimeout(function () {
          blocks.forEach(function (b) { if (b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el); });
          blocks = [];
        }, 380);
        showToast("Tidy up — all clear.");
      }
      var spellBtn = qs("#spell"), shakeBtn = qs("#shake"), addBtn = qs("#add"), tidyBtn = qs("#tidy");
      if (spellBtn) spellBtn.addEventListener("click", function () { spawnWord(wordIn ? wordIn.value : ""); });
      if (wordIn) wordIn.addEventListener("keydown", function (e) {
        if (e.key === "Enter") spawnWord(wordIn.value);
      });
      if (shakeBtn) shakeBtn.addEventListener("click", shake);
      if (addBtn) addBtn.addEventListener("click", addRandom);
      if (tidyBtn) tidyBtn.addEventListener("click", tidy);
      window.addEventListener("keydown", function (e) {
        if (e.code === "Space" && document.activeElement !== wordIn) {
          e.preventDefault();
          shake();
        }
      });
      "PLAY".split("").forEach(function (ch, i) {
        makeCube(ch, 80 + i * (sizeFor() + 12), 40);
      });
      var last = 0;
      function step(now) {
        var dt = Math.min(0.032, (now - (last || now)) / 1000);
        last = now;
        var floor = floorY();
        var W = stage.clientWidth;
        var i, j, b, o, pass;
        for (i = 0; i < blocks.length; i++) {
          b = blocks[i];
          if (b.dead || b.drag) continue;
          b.vy += G * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.ang += b.av * dt;
          b.av += -b.ang * 8 * dt;
          b.av *= 0.96;
          if (b.y + b.size > floor) {
            b.y = floor - b.size;
            if (b.vy > 0) {
              b.vy = -b.vy * REST;
              b.av += b.vx * 0.04;
              if (Math.abs(b.vy) < 40) b.vy = 0;
            }
            b.vx *= 0.82;
          }
          if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx) * REST; }
          if (b.x + b.size > W) { b.x = W - b.size; b.vx = -Math.abs(b.vx) * REST; }
        }
        for (pass = 0; pass < 3; pass++) {
          for (i = 0; i < blocks.length; i++) {
            for (j = i + 1; j < blocks.length; j++) {
              b = blocks[i]; o = blocks[j];
              if (b.dead || o.dead) continue;
              var ox = (b.x + b.size / 2) - (o.x + o.size / 2);
              var oy = (b.y + b.size / 2) - (o.y + o.size / 2);
              var px = (b.size + o.size) / 2 - Math.abs(ox);
              var py = (b.size + o.size) / 2 - Math.abs(oy);
              if (px > 0 && py > 0) {
                if (px < py) {
                  var sx = ox < 0 ? -px / 2 : px / 2;
                  if (!b.drag) b.x += sx;
                  if (!o.drag) o.x -= sx;
                  if (!b.drag) b.vx *= 0.7;
                  if (!o.drag) o.vx *= 0.7;
                } else {
                  var sy = oy < 0 ? -py / 2 : py / 2;
                  if (!b.drag) b.y += sy;
                  if (!o.drag) o.y -= sy;
                  if (oy < 0) { if (!b.drag) b.vy = Math.min(b.vy, 0); if (!o.drag) o.vy = Math.max(o.vy, 0); }
                  else { if (!o.drag) o.vy = Math.min(o.vy, 0); if (!b.drag) b.vy = Math.max(b.vy, 0); }
                  if (!b.drag) b.vy *= 0.5;
                  if (!o.drag) o.vy *= 0.5;
                }
              }
            }
          }
        }
        for (i = 0; i < blocks.length; i++) if (!blocks[i].dead) place(blocks[i]);
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(step);
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(step);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
