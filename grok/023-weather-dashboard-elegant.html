<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Ellery — Elegant Weather Dashboard</title>
  <style>
    :root {
      --bg0: #fbe9c8; --bg1: #f4c98a; --bg2: #e8a35c;
      --ink: #3b2a14; --accent: #e07a1f; --accent2: #f6b352;
      --card: rgba(255,255,255,.48); --shadow: 16px 28px 48px rgba(224,122,31,.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg0), var(--bg1) 48%, var(--bg2));
      min-height: 100vh;
      transition: background 700ms ease, color 700ms ease;
    }
    body[data-condition="sunny"] { --bg0:#fbe9c8; --bg1:#f4c98a; --bg2:#e8a35c; --ink:#3b2a14; --accent:#e07a1f; --accent2:#f6b352; --card:rgba(255,255,255,.48); --shadow:16px 28px 48px rgba(224,122,31,.22); }
    body[data-condition="cloudy"] { --bg0:#e9edf2; --bg1:#cfd8e3; --bg2:#aab8c9; --ink:#243040; --accent:#5f7d9d; --accent2:#8aa3bb; --card:rgba(255,255,255,.5); --shadow:16px 28px 48px rgba(95,125,157,.22); }
    body[data-condition="rain"] { --bg0:#cfe0ee; --bg1:#8fb1cf; --bg2:#4f78a3; --ink:#152536; --accent:#2b6aa8; --accent2:#6aa0d0; --card:rgba(255,255,255,.46); --shadow:16px 28px 48px rgba(43,106,168,.25); }
    body[data-condition="snow"] { --bg0:#f7f9fc; --bg1:#e3ebf5; --bg2:#c8d6e8; --ink:#243044; --accent:#6f8fb8; --accent2:#9bb4d0; --card:rgba(255,255,255,.62); --shadow:16px 28px 48px rgba(111,143,184,.2); }
    body[data-condition="storm"] { --bg0:#3a4256; --bg1:#232a3c; --bg2:#14192a; --ink:#eef1f7; --accent:#f0c45a; --accent2:#f6d98a; --card:rgba(255,255,255,.1); --shadow:16px 28px 48px rgba(0,0,0,.4); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 48px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 22px; }
    .brand h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .brand p { font-size: 12px; opacity: .7; margin-top: 2px; }
    .pills { display: flex; background: var(--card); border-radius: 999px; padding: 4px; border: 1px solid rgba(255,255,255,.45); backdrop-filter: blur(14px); }
    .pills button {
      border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px;
      padding: 8px 14px; border-radius: 999px; cursor: pointer;
    }
    .pills button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px;
      transition: transform 200ms ease, box-shadow 200ms ease, background 700ms ease;
    }
    .card:hover { transform: translateY(-2px); }
    .span8 { grid-column: span 8; }
    .span4 { grid-column: span 4; }
    .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .65; margin-bottom: 10px; }
    .current { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: center; }
    .temp { font-family: Georgia, "Iowan Old Style", serif; font-size: clamp(64px, 10vw, 128px); letter-spacing: -0.04em; line-height: .9; }
    .desc { font-size: 20px; margin: 6px 0 12px; }
    .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; opacity: .8; }
    .wx { width: 200px; height: 200px; margin: 0 auto; }
    .wx g { opacity: 0; transition: opacity 600ms ease; }
    body[data-condition="sunny"] .g-sun,
    body[data-condition="cloudy"] .g-cloud,
    body[data-condition="rain"] .g-cloud,
    body[data-condition="rain"] .g-rain,
    body[data-condition="snow"] .g-cloud,
    body[data-condition="snow"] .g-snow,
    body[data-condition="storm"] .g-cloud,
    body[data-condition="storm"] .g-bolt { opacity: 1; }
    .sun-core { transform-origin: 100px 88px; animation: breathe 4s ease-in-out infinite; }
    .rays { transform-origin: 100px 88px; animation: spin 40s linear infinite; }
    .rays2 { transform-origin: 100px 88px; animation: spin 40s linear infinite reverse; }
    .cloud-a { animation: driftA 9s ease-in-out infinite alternate; }
    .cloud-b { animation: driftB 13s ease-in-out infinite alternate; }
    .drop { animation: fall 1.1s linear infinite; }
    .flake { animation: snow 3.4s ease-in-out infinite; }
    .bolt { animation: flash 3.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.08); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes driftA { from { transform: translateX(-8px); } to { transform: translateX(10px); } }
    @keyframes driftB { from { transform: translateX(12px); } to { transform: translateX(-10px); } }
    @keyframes fall { from { transform: translateY(-8px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(28px); opacity: 0; } }
    @keyframes snow { from { transform: translate(0,-6px); opacity: 0; } 20% { opacity: 1; } 50% { transform: translate(8px, 12px); } to { transform: translate(-4px, 30px); opacity: 0; } }
    @keyframes flash { 0%, 12%, 22%, 100% { opacity: 0; } 8%, 10%, 18%, 20% { opacity: 1; } }
    .compass { display: flex; flex-direction: column; align-items: center; }
    .compass svg { width: 100%; max-width: 240px; }
    .needle { transform-origin: 100px 100px; transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
    .letters { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11px; fill: var(--ink); }
    .chart-wrap { position: relative; }
    #hourChart { width: 100%; height: 220px; display: block; }
    .tooltip {
      position: absolute; pointer-events: none; display: none;
      background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 8px;
    }
    .gauges { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .gauges svg { width: 100%; }
    .gauge-val { font-family: Georgia, "Iowan Old Style", serif; font-size: 22px; margin-top: -8px; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day { text-align: center; font-size: 12px; }
    .day .name { font-weight: 600; margin-bottom: 6px; }
    .range { height: 6px; background: rgba(0,0,0,.1); border-radius: 6px; position: relative; margin-top: 8px; }
    .range i { position: absolute; height: 100%; border-radius: 6px; background: var(--accent); }
    .sun-card { text-align: center; }
    .sun-card input { width: 100%; margin-top: 10px; accent-color: var(--accent); }
    .sun-times { display: flex; justify-content: space-between; font-family: ui-monospace, Consolas, monospace; font-size: 12px; margin-top: 8px; }
    @media (max-width: 980px) {
      .span8, .span4 { grid-column: span 12; }
    }
    @media (max-width: 560px) {
      .current { grid-template-columns: 1fr; }
      .days .day:nth-child(n+5) { display: none; }
      .pills button { padding: 7px 10px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      snow: { temp: -1, feels: -4, high: 1, low: -6, precip: "70%", desc: "Pale porcelain flurries on the quay", hours: [-5,-6,-6,-6,-5,-4,-3,-2,-1,0,1,1,1,0,0,-1,-2,-3,-3,-4,-4,-5,-5,-5], wind: 20, speed: 8, gust: 15, origin: "NNE", hum: 84, uv: 1, pr: 1024, rise: "07:32", set: "17:00", days: [
        { n: "Thu", ico: "snow", lo: -6, hi: 1 }, { n: "Fri", ico: "snow", lo: -7, hi: 0 }, { n: "Sat", ico: "cloud", lo: -4, hi: 2 },
        { n: "Sun", ico: "snow", lo: -5, hi: 1 }, { n: "Mon", ico: "partly", lo: -3, hi: 3 }, { n: "Tue", ico: "cloud", lo: -2, hi: 4 }, { n: "Wed", ico: "snow", lo: -4, hi: 1 }
      ]},
      storm: { temp: 13, feels: 9, high: 15, low: 10, precip: "95%", desc: "Dark slate squalls over the breakwater", hours: [11,11,10,10,11,11,12,12,13,14,15,15,14,14,13,13,12,12,12,11,11,11,10,10], wind: 280, speed: 34, gust: 48, origin: "W", hum: 88, uv: 2, pr: 986, rise: "06:24", set: "19:10", days: [
        { n: "Thu", ico: "storm", lo: 10, hi: 15 }, { n: "Fri", ico: "rain", lo: 11, hi: 16 }, { n: "Sat", ico: "storm", lo: 10, hi: 14 },
        { n: "Sun", ico: "cloud", lo: 11, hi: 16 }, { n: "Mon", ico: "rain", lo: 12, hi: 17 }, { n: "Tue", ico: "partly", lo: 12, hi: 18 }, { n: "Wed", ico: "cloud", lo: 11, hi: 16 }
      ]}
    };

    function init() {
      var ticks = qs("#ticks");
      var needle = qs("#needle");
      var chart = qs("#hourChart");
      var daysEl = qs("#days");
      var tip = qs("#tip");
      if (!ticks || !chart || !daysEl) return;

      var i;
      for (i = 0; i < 72; i++) {
        var a = (i / 72) * Math.PI * 2 - Math.PI / 2;
        var inner = i % 18 === 0 ? 70 : (i % 6 === 0 ? 76 : 80);
        var x1 = 100 + Math.cos(a) * inner;
        var y1 = 100 + Math.sin(a) * inner;
        var x2 = 100 + Math.cos(a) * 86;
        var y2 = 100 + Math.sin(a) * 86;
        var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke", "currentColor");
        line.setAttribute("stroke-width", i % 6 === 0 ? "1.6" : "0.7");
        line.setAttribute("opacity", i % 6 === 0 ? ".7" : ".35");
        ticks.appendChild(line);
      }

      var hoursPts = [];
      function apply(name) {
        var d = DATA[name];
        if (!d) return;
        document.body.setAttribute("data-condition", name);
        var map = { temp: d.temp + "°", feels: d.feels + "°", high: d.high + "°", low: d.low + "°", precip: d.precip, desc: d.desc, wSpeed: d.speed, wOrigin: d.origin, wGust: d.gust + " kn", rise: d.rise, set: d.set, humVal: d.hum + "%", uvVal: String(d.uv), prVal: String(d.pr) };
        Object.keys(map).forEach(function (id) {
          var el = qs("#" + id);
          if (el) el.textContent = map[id];
        });
        if (needle) needle.style.transform = "rotate(" + d.wind + "deg)";
        var humArc = qs("#humArc"), uvArc = qs("#uvArc"), prArc = qs("#prArc");
        if (humArc) humArc.style.strokeDashoffset = String(126 * (1 - d.hum / 100));
        if (uvArc) uvArc.style.strokeDashoffset = String(126 * (1 - d.uv / 11));
        if (prArc) prArc.style.strokeDashoffset = String(126 * (1 - (d.pr - 960) / 80));
        drawChart(d.hours);
        drawDays(d.days);
        placeSun();
      }

      function drawChart(temps) {
        var min = Math.min.apply(null, temps);
        var max = Math.max.apply(null, temps);
        var span = Math.max(1, max - min);
        hoursPts = temps.map(function (t, i) {
          var x = 20 + (i / 23) * 760;
          var y = 180 - ((t - min) / span) * 140;
          return [x, y, t, i];
        });
        var line = catmull(hoursPts);
        var fill = line + " L " + hoursPts[hoursPts.length - 1][0] + " 210 L " + hoursPts[0][0] + " 210 Z";
        var minI = 0, maxI = 0;
        temps.forEach(function (t, i) { if (t <= temps[minI]) minI = i; if (t >= temps[maxI]) maxI = i; });
        var html = '<path d="' + fill + '" fill="url(#chartFill)"/>';
        html += '<path id="tempPath" d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
        html += '<line id="cursor" x1="0" y1="10" x2="0" y2="210" stroke="var(--ink)" stroke-dasharray="3 4" opacity="0"/>';
        html += '<circle id="hoverDot" r="5" fill="var(--accent)" opacity="0"/>';
        [minI, maxI].forEach(function (idx) {
          var p = hoursPts[idx];
          html += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="var(--accent)"/>';
          html += '<text x="' + p[0] + '" y="' + (p[1] - 10) + '" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="currentColor">' + p[2] + '°</text>';
        });
        chart.innerHTML = html;
        var path = qs("#tempPath", chart);
        if (path && typeof path.getTotalLength === "function") {
          var len = path.getTotalLength();
          path.style.strokeDasharray = String(len);
          path.style.strokeDashoffset = String(len);
          path.getBoundingClientRect();
          path.style.transition = "stroke-dashoffset 1.6s ease";
          path.style.strokeDashoffset = "0";
        }
      }

      function drawDays(days) {
        var lo = Infinity, hi = -Infinity;
        days.forEach(function (d) { if (d.lo < lo) lo = d.lo; if (d.hi > hi) hi = d.hi; });
        var span = Math.max(1, hi - lo);
        daysEl.innerHTML = days.map(function (d) {
          var left = ((d.lo - lo) / span) * 100;
          var w = ((d.hi - d.lo) / span) * 100;
          return '<div class="day"><div class="name">' + d.n + '</div><svg width="28" height="28"><use href="#ico-' + d.ico + '"></use></svg><div>' + d.hi + '° / ' + d.lo + '°</div><div class="range"><i style="left:' + left + '%;width:' + w + '%"></i></div></div>';
        }).join("");
      }

      chart.addEventListener("mousemove", function (e) {
        if (!hoursPts.length) return;
        var rect = chart.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 800;
        var best = hoursPts[0], bestD = 1e9, j, dd;
        for (j = 0; j < hoursPts.length; j++) {
          dd = Math.abs(hoursPts[j][0] - x);
          if (dd < bestD) { bestD = dd; best = hoursPts[j]; }
        }
        var cur = qs("#cursor", chart);
        var dot = qs("#hoverDot", chart);
        if (cur) { cur.setAttribute("x1", best[0]); cur.setAttribute("x2", best[0]); cur.setAttribute("opacity", "0.5"); }
        if (dot) { dot.setAttribute("cx", best[0]); dot.setAttribute("cy", best[1]); dot.setAttribute("opacity", "1"); }
        if (tip) {
          tip.style.display = "block";
          tip.style.left = ((best[0] / 800) * rect.width) + "px";
          tip.style.top = ((best[1] / 220) * rect.height - 28) + "px";
          var hr = best[3] % 24;
          tip.textContent = (hr < 10 ? "0" : "") + hr + ":00 · " + best[2] + "°";
        }
      });
      chart.addEventListener("mouseleave", function () {
        var cur = qs("#cursor", chart);
        var dot = qs("#hoverDot", chart);
        if (cur) cur.setAttribute("opacity", "0");
        if (dot) dot.setAttribute("opacity", "0");
        if (tip) tip.style.display = "none";
      });

      var slider = qs("#sunSlider");
      var sunOrb = qs("#sunOrb");
      var clockLabel = qs("#clockLabel");
      function parseHM(s) {
        var p = (s || "06:00").split(":");
        return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
      }
      function placeSun() {
        if (!slider || !sunOrb) return;
        var cond = document.body.getAttribute("data-condition") || "sunny";
        var d = DATA[cond] || DATA.sunny;
        if (!d) return;
        var m = parseInt(slider.value, 10);
        var rise = parseHM(d.rise);
        var set = parseHM(d.set);
        var t = 0;
        if (m <= rise) t = 0;
        else if (m >= set) t = 1;
        else t = (m - rise) / (set - rise);
        var ang = Math.PI * (1 - t);
        var cx = 110 + Math.cos(ang) * 90;
        var cy = 100 - Math.sin(ang) * 90;
        sunOrb.setAttribute("cx", String(cx));
        sunOrb.setAttribute("cy", String(cy));
        var hh = Math.floor(m / 60), mm = m % 60;
        if (clockLabel) clockLabel.textContent = (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
      }
      if (slider) {
        var now = new Date();
        slider.value = String(now.getHours() * 60 + now.getMinutes());
        slider.addEventListener("input", placeSun);
      }

      qsa(".pills button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          qsa(".pills button").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
          btn.setAttribute("aria-pressed", "true");
          apply(btn.getAttribute("data-cond"));
        });
      });

      apply("sunny");
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
