<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Major Arcana — Three-Card Tarot Spread</title>
  <style>
    :root { --gold: #f3dc9a; --rose: #c9a58c; --ink: #1b1424; --foil: #d9b45b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,200,120,.3), transparent 60%),
        radial-gradient(ellipse at center, transparent 40%, rgba(10,2,6,.72) 100%),
        repeating-linear-gradient(45deg, rgba(255,220,180,.05) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(-45deg, rgba(20,4,10,.18) 0 1px, transparent 1px 5px),
        linear-gradient(180deg, #4a0f1e, #2c0812);
      color: var(--gold);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      overflow-x: hidden;
      min-height: 100dvh;
    }
    .glow {
      position: fixed; top: -8%; left: 50%; width: 40vw; height: 28vh; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255,200,120,.35), transparent 70%);
      filter: blur(18px); pointer-events: none; animation: flicker 3.2s ease-in-out infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
    }
    header { text-align: center; padding: 1.4rem 1rem 0.6rem; position: relative; z-index: 2; }
    h1 {
      font-size: clamp(1.2rem, 3.4vw, 2rem); letter-spacing: 0.22em; text-transform: uppercase;
      font-weight: 500; text-shadow: 0 0 18px rgba(243,220,154,.45);
    }
    .sub { font-style: italic; color: var(--rose); margin-top: 0.35rem; font-variant: small-caps; letter-spacing: 0.12em; }
    .rule { width: min(16rem, 60%); height: 1px; margin: 0.7rem auto 0; background: linear-gradient(90deg, transparent, #d9b45b, transparent); }
    .slots {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8rem; width: min(920px, 94vw); margin: 1rem auto 0.4rem;
    }
    .slot {
      border: 1.5px dashed rgba(217,180,91,.45); min-height: calc(clamp(84px, 13vw, 150px) * 1.66);
      border-radius: 10px; display: flex; align-items: flex-start; justify-content: center;
      padding-top: 0.4rem; position: relative;
    }
    .slot span.label {
      font-variant: small-caps; letter-spacing: 0.2em; font-size: 0.72rem; color: var(--rose);
    }
    .reading {
      width: min(920px, 94vw); margin: 0.3rem auto 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;
    }
    .reading article { opacity: 0; font-size: 0.78rem; color: #e8d7b8; line-height: 1.4; min-height: 4.5rem; }
    .reading article.on { opacity: 1; transition: opacity 500ms ease; }
    .reading em { color: var(--rose); font-style: italic; display: block; margin-top: 0.2rem; }
    .stage {
      position: relative; width: min(1100px, 96vw); height: 280px; margin: 0.4rem auto 0;
      perspective: 1200px;
    }
    .card {
      position: absolute; width: clamp(84px, 13vw, 150px); aspect-ratio: 1 / 1.66;
      transform-style: preserve-3d; cursor: pointer; left: 50%; top: 18px;
      transition: transform 700ms cubic-bezier(.22,1,.36,1), filter 300ms ease;
      outline: none;
    }
    .card:hover, .card:focus-visible { z-index: 5; }
    .card.fanned:hover, .card.fanned:focus-visible { transform: var(--fan) translateY(-18px); }
    .face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 10px; overflow: hidden;
    }
    .back { }
    .front { transform: rotateY(180deg); background: linear-gradient(180deg, #1b1424, #2a1d36); }
    .card.flipped { }
    .foil {
      pointer-events: none; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(255,240,200,.55) 48%, transparent 62%);
      mix-blend-mode: screen; transform: translateX(-120%);
    }
    .card.flipped .foil, .card.front-hover .foil { animation: sweep 1.1s ease forwards; }
    @keyframes sweep { to { transform: translateX(120%); } }
    .front-inner { padding: 0.45rem 0.35rem; text-align: center; height: 100%; display: flex; flex-direction: column; }
    .front-inner .num { font-size: 0.62rem; letter-spacing: 0.18em; color: var(--foil); }
    .front-inner .name { font-variant: small-caps; letter-spacing: 0.12em; font-size: 0.68rem; color: var(--gold); margin-bottom: 0.2rem; }
    .front-inner svg { flex: 1; width: 86%; margin: 0 auto; }
    .controls { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin: 0.8rem 0 1.4rem; }
    .controls button {
      appearance: none; border: 1px solid rgba(217,180,91,.5); background: rgba(42,8,18,.6);
      color: var(--gold); font-family: inherit; font-variant: small-caps; letter-spacing: 0.16em;
      padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer;
    }
    .status { text-align: center; color: var(--rose); font-style: italic; min-height: 1.2em; font-size: 0.85rem; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    @media (max-width: 640px) {
      .card { width: 26vw; }
      .stage { height: 230px; }
      .reading, .slots { gap: 0.4rem; }
      .reading article { font-size: 0.68rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; }
      .card { transition-duration: 180ms; }
      .card.flipped .foil, .card.front-hover .foil { animation: none; opacity: 0.35; transform: none; }
      .reading article.on { transition: none; }
    }
  </style>
</head>

    var ARCANA = [
      { n: "0", name: "The Fool", up: "A cliff-edge invitation arrives without a map. Begin anyway, pockets empty, heart loud.", rv: "Recklessness wears a smile. Pause before the step that cannot be unstepped.", kw: "beginnings, trust, air" },
      { n: "I", name: "The Magician", up: "Will and tool meet on one table. Speak the work into being with both hands.", rv: "Talent scatters. Gather the implements before promising the trick.", kw: "will, craft, focus" },
      { n: "II", name: "The High Priestess", up: "The answer is already seated between two pillars. Listen under the noise.", rv: "Secrets sour when hoarded. Share the quiet knowledge that heals.", kw: "intuition, veil, moon" },
      { n: "III", name: "The Empress", up: "Abundance wants a garden, not a vault. Tend what is growing beside you.", rv: "Overgiving empties the soil. Rest is also a harvest.", kw: "nurture, Venus, plenty" },
      { n: "IV", name: "The Emperor", up: "Structure is a kindness. Draw the border that lets the city stand.", rv: "Control has calcified. Loosen the throne so others may sit.", kw: "order, rule, foundation" },
      { n: "V", name: "The Hierophant", up: "A lineage offers keys. Learn the rite, then make it your own.", rv: "Dogma rattles. Question the teacher without burning the temple.", kw: "tradition, keys, teaching" },
      { n: "VI", name: "The Lovers", up: "A choice of hearts under one sun. Alignment is the true union.", rv: "A split in values. Name the fork before walking both roads.", kw: "union, choice, vesica" },
      { n: "VII", name: "The Chariot", up: "Two horses, one will. Victory belongs to the driver who does not look away.", rv: "Momentum without aim. Rein in before the wheels leave the road.", kw: "drive, victory, direction" },
      { n: "VIII", name: "Strength", up: "The lion yields to a gentle hand. Courage here is patience with teeth sheathed.", rv: "Force has replaced grace. Soften the grip; the beast is listening.", kw: "courage, lion, mercy" },
      { n: "IX", name: "The Hermit", up: "A hexagonal lantern is enough. Walk far enough to hear your own step.", rv: "Isolation has become a locked room. Bring the light back to the path.", kw: "solitude, lantern, wisdom" },
      { n: "X", name: "Wheel of Fortune", up: "The spoke turns whether you bless it or not. Ride the rising arc.", rv: "Resistance to change. What falls will rise; stop clutching the rim.", kw: "cycle, fate, turn" },
      { n: "XI", name: "Justice", up: "The scale does not flatter. Tell the true weight of what you have done.", rv: "Bias leans the beam. Correct the measure before judging others.", kw: "balance, truth, sword" },
      { n: "XII", name: "The Hanged Man", up: "Inversion is a teacher. Surrender the old view until blood returns to meaning.", rv: "Stalling dressed as sacrifice. Choose a direction and come down.", kw: "pause, inversion, halo" },
      { n: "XIII", name: "Death", up: "The scythe clears the field so a sun may rise. Let the finished thing finish.", rv: "Clinging to a husk. The ending has already occurred; walk forward.", kw: "ending, rebirth, scythe" },

    function init() {

      function nextEmpty() {

        cards.forEach(function (c, i) {
          c.style.zIndex = String(i);
          var t = "translate(-50%, 0) translate(" + (i * 0.4) + "px," + (i * 0.5) + "px) rotate(0deg)";
          c.style.setProperty("--fan", t);
          c.style.transform = t;
          c.classList.remove("fanned", "flipped", "drawn", "dim");
          c.style.pointerEvents = "auto";
        });
      }
      function fan() {
        var n = cards.length;
        var span = Math.min(70, (stage.clientWidth / (cards[0].offsetWidth || 100)) * 4.2);
        var origin = "50% " + (2.6 * (cards[0].offsetHeight || 140)) + "px";
        order.forEach(function (idx, i) {
          var c = cards[idx];
          var ang = -span / 2 + (span * i) / (n - 1);
          c.style.transformOrigin = "50% 260%";
          var t = "translate(-50%, 0) rotate(" + ang + "deg)";
          c.style.setProperty("--fan", t);
          c.style.transitionDelay = reduce ? "0ms" : (i * 22) + "ms";
          c.style.transform = t;
          c.classList.add("fanned");
          c.style.zIndex = String(i);
        });
      }
      function shuffleDeck() {
        if (busy) return;
        gather(true);
        var i, j, tmp;
        for (i = order.length - 1; i > 0; i--) {
          j = Math.floor(Math.random() * (i + 1));
          tmp = order[i]; order[i] = order[j]; order[j] = tmp;
        }
        stack();
        status.textContent = "The deck is shuffled.";
        setTimeout(fan, reduce ? 80 : 280);
      }
      function placeCard(cardIdx, slotIdx, reversed) {
        var card = cards[cardIdx];
        var slot = slots[slotIdx];
        if (!card || !slot) return;
        var cr = card.getBoundingClientRect();
        var sr = slot.getBoundingClientRect();
        var dx = sr.left + sr.width / 2 - (cr.left + cr.width / 2);
        var dy = sr.top + sr.height / 2 - (cr.top + cr.height / 2);
        card.classList.remove("fanned");
        card.style.transitionDelay = "0ms";
        var rot = reversed ? 180 : 0;
        card.style.transform = "translate(-50%, 0) translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
        card.classList.add("drawn");
        placed[slotIdx] = { idx: cardIdx, reversed: reversed };
        setTimeout(function () {
          card.classList.add("flipped");
          card.style.transform += " rotateY(180deg)";
        }, reduce ? 80 : 420);
        var a = ARCANA[cardIdx];
        var txt = reversed ? a.rv : a.up;
        reads[slotIdx].innerHTML = "<strong>" + POS[slotIdx] + " — " + a.name + (reversed ? " (reversed)" : "") + "</strong><p>" + txt + "</p><em>" + a.kw + "</em>";
        reads[slotIdx].classList.add("on");
        status.textContent = a.name + " flies to " + POS[slotIdx] + (reversed ? ", reversed." : ".");
      }
      function finishIfDone() {
        if (placed[0] && placed[1] && placed[2]) {
          cards.forEach(function (c) {
            if (!c.classList.contains("drawn")) { c.classList.add("dim"); c.style.filter = "brightness(0.45)"; c.style.pointerEvents = "none"; }
          });
          status.textContent = "The spread is complete.";
        }
      }
      function drawOne(idx) {
        if (cards[idx].classList.contains("drawn")) return;
        var slot = nextEmpty();
        if (slot < 0) return;
        var rev = Math.random() < 0.3;
        placeCard(idx, slot, rev);
        finishIfDone();
      }
      function drawThree() {
        if (busy) return;
        if (placed[0] && placed[1] && placed[2]) { status.textContent = "Gather the deck first."; return; }
        busy = true;
        var pool = order.filter(function (i) { return !cards[i].classList.contains("drawn"); });
        var picks = [];
        while (picks.length < 3 && pool.length) {
          var j = Math.floor(Math.random() * pool.length);
          picks.push(pool.splice(j, 1)[0]);
        }
        picks.forEach(function (idx, n) {
          setTimeout(function () {
            var slot = nextEmpty();
            if (slot >= 0) placeCard(idx, slot, Math.random() < 0.3);
            if (n === picks.length - 1) { busy = false; finishIfDone(); }
          }, n * (reduce ? 120 : 650));
        });
        if (!picks.length) busy = false;
      }
      function gather(silent) {
        placed = [null, null, null];
        busy = false;
        reads.forEach(function (r) { r.classList.remove("on"); r.innerHTML = ""; });
        cards.forEach(function (c) {
          c.classList.remove("flipped", "drawn", "dim");
          c.style.filter = "";
          c.style.pointerEvents = "auto";
          c.style.transform = "translate(-50%, 0)";
        });
        stack();
        if (!silent) status.textContent = "The deck is gathered.";
      }
      shuffleBtn.addEventListener("click", shuffleDeck);
      drawBtn.addEventListener("click", drawThree);
      gatherBtn.addEventListener("click", function () { gather(false); });
      stack();
      setTimeout(fan, 200);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
