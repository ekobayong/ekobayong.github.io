<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DRIFT — Voltage Works VW-25</title>
  <style>
    :root {
      --phosphor: #39ff6a;
      --dim: #1f8a3c;
      --cyan: #2bd8ff;
      --magenta: #ff3cac;
      --yellow: #fff35c;
      --amber: #ffb347;
      --tube: #020603;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 88%, #1b1b22 0%, #050507 62%);
      font-family: "Courier New", ui-monospace, Menlo, monospace;
      color: var(--phosphor);
      overflow: hidden;
    }
    .room { width: min(92vw, 820px); padding: 28px 0 36px; }
    .cabinet {
      position: relative;
      aspect-ratio: 5 / 4;
      border-radius: 28px;
      background: linear-gradient(165deg, #2a2a2e 0%, #141416 48%, #0b0b0d 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.18),
        inset 0 -8px 18px rgba(0,0,0,0.55),
        inset 10px 0 16px rgba(255,255,255,0.04),
        inset -10px 0 16px rgba(0,0,0,0.4),
        0 40px 80px rgba(0,0,0,0.72);
      padding: 7.5% 8.5% 11%;
    }
    .cabinet::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 22px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .lamp {
      position: absolute;
      top: 46%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px 3px rgba(255,179,71,0.85), 0 0 28px rgba(255,179,71,0.45);
      animation: pulseLamp 2.4s ease-in-out infinite;
    }
    .lamp.left { left: 18px; }
    .lamp.right { right: 18px; animation-delay: 1.1s; }
    .badge {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(180,180,170,0.55);
      text-shadow: 0 1px 0 rgba(0,0,0,0.8);
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--tube);
      border-radius: 46% / 8%;
      overflow: hidden;
      box-shadow:
        inset 0 0 80px 18px rgba(0,0,0,0.78),
        inset 0 0 0 2px rgba(20,40,20,0.6);
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 4.5% 5.5% 3.5%;
      animation: flicker 5.4s steps(2, end) infinite;
    }
    .scanlines, .grille, .roll, .sheen, .vignette {
      position: absolute; inset: 0; pointer-events: none;
    }
    .scanlines {
      z-index: 5;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.42) 0px,
        rgba(0,0,0,0.42) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    .grille {
      z-index: 4;
      background: repeating-linear-gradient(
        to right,
        rgba(255,0,0,0.045) 0px,
        rgba(0,255,0,0.04) 1px,
        rgba(0,0,255,0.05) 2px,
        transparent 3px
      );
      mix-blend-mode: screen;
    }
    .roll {
      z-index: 3;
      background: linear-gradient(to bottom, transparent 0%, rgba(180,255,200,0.12) 48%, transparent 100%);
      height: 18%;
      animation: rollBar 7s linear infinite;
    }
    .sheen {
      z-index: 6;
      background: linear-gradient(118deg, rgba(255,255,255,0.12) 0%, transparent 32%, transparent 58%, rgba(255,255,255,0.04) 100%);
    }
    .vignette {
      z-index: 7;
      box-shadow: inset 0 0 90px 28px rgba(0,0,0,0.72);
    }
    .logo-wrap { text-align: center; margin-bottom: 8px; min-height: 42px; overflow: visible; }
    #pixel-logo {
      display: block;
      width: 4px;
      height: 4px;
      margin: 4px auto 28px;
      background: transparent;
      filter: drop-shadow(0 0 6px rgba(57,255,106,0.45));
      animation: hueSpin 14s linear infinite;
    }
    .tagline {
      color: var(--cyan);
      font-size: clamp(9px, 1.6vw, 13px);
      letter-spacing: 0.22em;
      text-shadow: 0 0 8px var(--cyan);
      margin-top: 10px;
    }
    .panels {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }
    .box {
      border: 1px solid var(--dim);
      padding: 8px 10px;
      min-height: 0;
      overflow: hidden;
    }
    .box h2 {
      font-size: clamp(10px, 1.7vw, 13px);
      color: var(--magenta);
      letter-spacing: 0.16em;
      margin-bottom: 8px;
      text-shadow: 0 0 8px var(--magenta);
    }
    .menu { list-style: none; }
    .menu li {
      position: relative;
      padding: 5px 6px 5px 18px;
      color: var(--dim);
      cursor: pointer;
      font-size: clamp(10px, 1.8vw, 14px);
      text-shadow: 0 0 6px rgba(31,138,60,0.4);
    }
    .menu li.sel {
      color: var(--phosphor);
      transform: translateX(8px);
      text-shadow: 0 0 10px var(--phosphor);
    }
    .menu li.sel::before {
      content: "▶";
      position: absolute;
      left: 0;
      color: var(--magenta);
      animation: blink 0.9s steps(1, end) infinite;
    }
    .menu li.flash {
      background: var(--phosphor);
      color: #000;
      text-shadow: none;
    }
    .scores { font-size: clamp(9px, 1.6vw, 13px); }
    .range {
      color: var(--magenta);
      margin-bottom: 6px;
      letter-spacing: 0.12em;
    }
    .score-page { animation: slideIn 0.35s steps(4, end); }
    .score-row {
      display: grid;
      grid-template-columns: 2ch 4ch 1fr;
      gap: 8px;
      padding: 3px 0;
    }
    .score-row .init { color: var(--amber); }
    .score-row .pts { color: var(--cyan); text-align: right; }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: clamp(9px, 1.5vw, 12px);
    }
    #insert {
      color: var(--yellow);
      background: none;
      border: 0;
      font: inherit;
      letter-spacing: 0.2em;
      cursor: pointer;
      text-shadow: 0 0 8px var(--yellow);
      animation: blink 1s steps(1, end) infinite;
    }
    .credits { color: var(--amber); }
    .copy { color: var(--dim); letter-spacing: 0.08em; }
    #play {
      display: none;
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
    }
    #play.active { display: block; }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      text-shadow: 0 0 8px var(--phosphor);
      pointer-events: none;
    }
    .lives { color: var(--magenta); letter-spacing: 0.2em; }
    .toast {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 8;
      pointer-events: none;
    }
    .toast.show { display: grid; }
    .toast span {
      color: var(--magenta);
      font-size: clamp(18px, 4vw, 36px);
      letter-spacing: 0.28em;
      text-shadow: 0 0 16px var(--magenta);
      background: rgba(2,6,3,0.55);
      padding: 10px 18px;
    }
    @keyframes pulseLamp {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes rollBar {
      0% { transform: translateY(-120%); }
      100% { transform: translateY(620%); }
    }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.86; }
      96% { opacity: 1; }
      97% { opacity: 0.9; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes hueSpin { to { filter: hue-rotate(360deg) drop-shadow(0 0 6px rgba(57,255,106,0.45)); } }
    @keyframes slideIn {
      from { transform: translateX(40%); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    @media (max-width: 640px) {
      .panels { grid-template-columns: 1fr; }
      .cabinet { aspect-ratio: 4 / 5; }
      .foot { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      .roll, .content, .menu li.sel::before, #insert, .lamp, #pixel-logo { animation: none; }
    }
  </style>
</head>
<body>
  <div class="room">
    <div class="cabinet">
      <span class="lamp left" aria-hidden="true"></span>
      <span class="lamp right" aria-hidden="true"></span>
      <div class="screen">
        <div class="scanlines"></div>
        <div class="grille"></div>
        <div class="roll"></div>
        <div class="sheen"></div>
        <div class="vignette"></div>
        <div class="content" id="attract">
          <div class="logo-wrap">
            <div id="pixel-logo" aria-label="NEON DRIFT"></div>
            <p class="tagline">// ATTRACT MODE — 1987 //</p>
          </div>
          <div class="panels">
            <div class="box">
              <h2>SELECT</h2>
              <ul class="menu" id="menu" role="menu">
                <li class="sel" data-act="start" role="menuitem">1P START — PADDLE</li>
                <li data-act="rank" role="menuitem">VIEW RANKINGS</li>
                <li data-act="shuffle" role="menuitem">SHUFFLE TABLE</li>
                <li data-act="credits" role="menuitem">CREDITS</li>
              </ul>
            </div>
            <div class="box">
              <h2>TODAY'S HI-SCORES</h2>
              <div class="scores">
                <div class="range" id="rank-range">RANK 01–05</div>
                <div id="score-list"></div>
              </div>
            </div>
          </div>
          <div class="foot">
            <button type="button" id="insert">INSERT COIN</button>
            <span class="credits" id="credit-line">CREDIT 00</span>
            <span class="copy">© 1987 VOLTAGE WORKS</span>
          </div>
        </div>
        <div id="play">
          <div class="hud">
            <span id="score-hud">SCORE 0000000</span>
            <span class="lives" id="lives">◆ ◆ ◆</span>
            <span id="stage-hud">STAGE 1</span>
          </div>
          <canvas id="game"></canvas>
        </div>
        <div class="toast" id="toast"><span></span></div>
      </div>
      <p class="badge">Voltage Works · Model VW-25 · Made in Osaka</p>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    var GLYPHS = {
      N: ["10001","11001","10101","10011","10001"],
      E: ["11111","10000","11110","10000","11111"],
      O: ["01110","10001","10001","10001","01110"],
      D: ["11110","10001","10001","10001","11110"],
      R: ["11110","10001","11110","10100","10010"],
      I: ["11111","00100","00100","00100","11111"],
      F: ["11111","10000","11110","10000","10000"],
      T: ["11111","00100","00100","00100","00100"],
      " ": ["00000","00000","00000","00000","00000"]
    };
    var ACCENTS = ["#2bd8ff","#ff3cac","#fff35c","#ffb347","#39ff6a","#2bd8ff","#ff3cac","#fff35c","#ffb347","#39ff6a"];
    var SCORES = [
      { r: 1, n: "ACE", s: 128450 },
      { r: 2, n: "NEO", s: 97620 },
      { r: 3, n: "KAI", s: 84310 },
      { r: 4, n: "RIO", s: 72100 },
      { r: 5, n: "YUK", s: 65440 },
      { r: 6, n: "MAX", s: 51280 },
      { r: 7, n: "JUN", s: 48900 },
      { r: 8, n: "HAL", s: 40110 },
      { r: 9, n: "ZOE", s: 33330 },
      { r: 10, n: "PIX", s: 28040 },
      { r: 11, n: "VIN", s: 19990 },
      { r: 12, n: "BOB", s: 12500 },
      { r: 13, n: "DOT", s: 9800 },
      { r: 14, n: "QST", s: 6400 },
      { r: 15, n: "CPU", s: 1987 }
    ];
    var BRICK_COLORS = ["#2bd8ff","#ff3cac","#fff35c","#ffb347","#39ff6a","#2bd8ff","#ff3cac","#fff35c"];
    function pad7(n) {
      var s = String(Math.max(0, n | 0));
      while (s.length < 7) s = "0" + s;
      return s;
    }
    function pad2(n) {
      return n < 10 ? "0" + n : String(n);
    }
    function init() {
      var logo = qs("#pixel-logo");
      var menuEl = qs("#menu");
      var items = qsa("#menu li");
      var scoreList = qs("#score-list");
      var rankRange = qs("#rank-range");
      var insert = qs("#insert");
      var creditLine = qs("#credit-line");
      var attract = qs("#attract");
      var play = qs("#play");
      var canvas = qs("#game");
      var toastEl = qs("#toast");
      var toastSpan = toastEl ? qs("span", toastEl) : null;
      var scoreHud = qs("#score-hud");
      var livesEl = qs("#lives");
      var stageHud = qs("#stage-hud");
      if (!logo || !menuEl || !scoreList || !rankRange || !insert || !creditLine || !attract || !play || !canvas) return;
      var reduced = false;
      if (typeof window.matchMedia === "function") {
        try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { reduced = false; }
      }
      var word = "NEON DRIFT";
      var shadows = [];
      var cell = 5;
      var gap = 6;
      var letterW = 5 * cell + gap;
      var i, r, c, ch, bits, color, ox;
      for (i = 0; i < word.length; i++) {
        ch = word.charAt(i);
        bits = GLYPHS[ch] || GLYPHS[" "];
        color = ACCENTS[i % ACCENTS.length];
        ox = i * letterW;
        for (r = 0; r < 5; r++) {
          for (c = 0; c < 5; c++) {
            if (bits[r].charAt(c) === "1") {
              shadows.push((ox + c * cell) + "px " + (r * cell) + "px 0 0 " + color);
            }
          }
        }
      }
      logo.style.boxShadow = shadows.join(",");
      logo.style.width = "4px";
      logo.style.height = "4px";
      logo.style.marginLeft = "calc(50% - " + (letterW * word.length / 2) + "px)";
      var selected = 0;
      var credits = 0;
      var page = 0;
      var toastTimer = 0;
      function showToast(msg, ms) {
        if (!toastEl || !toastSpan) return;
        toastSpan.textContent = msg;
        toastEl.classList.add("show");
        if (toastTimer) window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toastEl.classList.remove("show");
        }, ms || 900);
      }
      function renderScores() {
        var start = page * 5;
        var slice = SCORES.slice(start, start + 5);
        rankRange.textContent = "RANK " + pad2(start + 1) + "–" + pad2(start + slice.length);
        var html = '<div class="score-page">';
        var j, row;
        for (j = 0; j < slice.length; j++) {
          row = slice[j];
          html += '<div class="score-row"><span>' + pad2(row.r) + '</span><span class="init">' + row.n + '</span><span class="pts">' + pad7(row.s) + "</span></div>";
        }
        html += "</div>";
        scoreList.innerHTML = html;
      }
      renderScores();
      if (!reduced) {
        window.setInterval(function () {
          page = (page + 1) % 3;
          renderScores();
        }, 4000);
      }
      function selectRow(idx) {
        selected = (idx + items.length) % items.length;
        items.forEach(function (el, k) {
          if (k === selected) el.classList.add("sel");
          else el.classList.remove("sel");
        });
      }
      function flashRow(el, done) {
        if (!el) return;
        var n = 0;
        function tick() {
          el.classList.toggle("flash");
          n += 1;
          if (n < 4) window.setTimeout(tick, 80);
          else if (done) done();
        }
        tick();
      }
      function addCredit() {
        credits += 1;
        creditLine.textContent = "CREDIT " + pad2(Math.min(99, credits));
        showToast("CREDIT " + credits, 700);
      }
      function activate() {
        var el = items[selected];
        if (!el) return;
        var act = el.getAttribute("data-act");
        flashRow(el, function () {
          if (act === "start") {
            if (credits < 1) {
              showToast("INSERT COIN", 900);
              return;
            }
            credits -= 1;
            creditLine.textContent = "CREDIT " + pad2(credits);
            startGame();
          } else if (act === "rank") {
            page = 0;
            renderScores();
            showToast("RANKINGS", 700);
          } else if (act === "shuffle") {
            SCORES.sort(function () { return Math.random() - 0.5; });
            var k;
            for (k = 0; k < SCORES.length; k++) SCORES[k].r = k + 1;
            renderScores();
            showToast("SHUFFLED", 800);
          } else if (act === "credits") {
            showToast("VW-25 1987", 1100);
          }
        });
      }
      items.forEach(function (el, idx) {
        el.addEventListener("mouseenter", function () { selectRow(idx); });
        el.addEventListener("click", function () {
          selectRow(idx);
          activate();
        });
      });
      insert.addEventListener("click", addCredit);
      document.addEventListener("keydown", function (e) {
        if (!e) return;
        var key = e.key;
        if (key === "c" || key === "C") addCredit();
        if (play.classList.contains("active")) return;
        if (key === "ArrowDown") { e.preventDefault(); selectRow(selected + 1); }
        if (key === "ArrowUp") { e.preventDefault(); selectRow(selected - 1); }
        if (key === "Enter" || key === " ") { e.preventDefault(); activate(); }
      });
      var ctx = canvas.getContext ? canvas.getContext("2d") : null;
      var game = {
        running: false,
        w: 0,
        h: 0,
        paddle: { x: 0, w: 72, h: 10 },
        ball: { x: 0, y: 0, vx: 2.2, vy: -2.6, s: 8 },
        trail: [],
        bricks: [],
        lives: 3,
        score: 0,
        stage: 1,
        keys: { l: false, r: false },
        dragging: false,
        dragX: 0,
        dpr: 1,
        raf: 0
      };
      function spawnBricks() {
        game.bricks = [];
        var rows = 3, cols = 8, bw, bh = 14, gapX = 6, gapY = 8, ox, oy = 46, r, c;
        bw = (game.w - 24 - gapX * (cols - 1)) / cols;
        ox = 12;
        for (r = 0; r < rows; r++) {
          for (c = 0; c < cols; c++) {
            game.bricks.push({
              x: ox + c * (bw + gapX),
              y: oy + r * (bh + gapY),
              w: bw,
              h: bh,
              live: true,
              color: BRICK_COLORS[(r * cols + c) % BRICK_COLORS.length]
            });
          }
        }
      }
      function resetBall() {
        game.ball.x = game.w / 2;
        game.ball.y = game.h * 0.62;
        game.ball.vx = (Math.random() > 0.5 ? 1 : -1) * (2.1 + game.stage * 0.15);
        game.ball.vy = -2.5 - game.stage * 0.12;
        game.trail = [];
      }
      function sizeCanvas() {
        if (!ctx) return;
        var rect = canvas.getBoundingClientRect();
        var dpr = 1;
        if (window.devicePixelRatio) dpr = Math.min(2, window.devicePixelRatio);
        game.dpr = dpr;
        game.w = Math.max(120, rect.width);
        game.h = Math.max(120, rect.height);
        canvas.width = Math.floor(game.w * dpr);
        canvas.height = Math.floor(game.h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        game.paddle.w = Math.max(56, game.w * 0.16);
        if (!game.bricks.length) spawnBricks();
      }
      function endGame() {
        game.running = false;
        showToast("GAME OVER", 1400);
        window.setTimeout(function () {
          play.classList.remove("active");
          attract.style.display = "";
        }, 1400);
      }
      function miss() {
        game.lives -= 1;
        if (livesEl) {
          livesEl.textContent = ["◆ ◆ ◆", "◆ ◆", "◆", ""][Math.max(0, 3 - game.lives)] || "";
        }
        showToast("MISS", 700);
        if (game.lives <= 0) endGame();
        else {
          resetBall();
          showToast("READY", 600);
        }
      }
      function hitPaddle() {
        game.score += 5;
        var spd = Math.sqrt(game.ball.vx * game.ball.vx + game.ball.vy * game.ball.vy) * 1.035;
        var nx = game.ball.vx;
        var ny = -Math.abs(game.ball.vy);
        var mag = Math.sqrt(nx * nx + ny * ny) || 1;
        game.ball.vx = (nx / mag) * spd;
        game.ball.vy = (ny / mag) * spd;
      }
      function loop() {
        if (!ctx || !game.running) return;
        var p = game.paddle, b = game.ball, w = game.w, h = game.h;
        if (game.keys.l) p.x -= 6.4;
        if (game.keys.r) p.x += 6.4;
        if (game.dragging) p.x = game.dragX - p.w / 2;
        if (p.x < 8) p.x = 8;
        if (p.x + p.w > w - 8) p.x = w - 8 - p.w;
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 8) { b.x = 8; b.vx *= -1; }
        if (b.x + b.s > w - 8) { b.x = w - 8 - b.s; b.vx *= -1; }
        if (b.y < 28) { b.y = 28; b.vy *= -1; }
        if (b.y > h) miss();
        if (b.y + b.s >= h - 22 && b.y < h - 8 && b.x + b.s > p.x && b.x < p.x + p.w) {
          b.y = h - 22 - b.s;
          var t = ((b.x + b.s / 2) - (p.x + p.w / 2)) / (p.w / 2);
          b.vx += t * 1.4;
          hitPaddle();
        }
        var live = 0, k, br;
        for (k = 0; k < game.bricks.length; k++) {
          br = game.bricks[k];
          if (!br.live) continue;
          live += 1;
          if (b.x < br.x + br.w && b.x + b.s > br.x && b.y < br.y + br.h && b.y + b.s > br.y) {
            br.live = false;
            live -= 1;
            game.score += 25;
            b.vy *= -1;
          }
        }
        if (live === 0) {
          showToast("STAGE CLEAR", 1000);
          game.stage += 1;
          spawnBricks();
          resetBall();
        }
        game.trail.push({ x: b.x, y: b.y });
        if (game.trail.length > 10) game.trail.shift();
        ctx.fillStyle = "#020603";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(57,255,106,0.12)";
        ctx.lineWidth = 1;
        var gx, gy;
        for (gx = 0; gx < w; gx += 18) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
        }
        for (gy = 0; gy < h; gy += 18) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
        }
        for (k = 0; k < game.bricks.length; k++) {
          br = game.bricks[k];
          if (!br.live) continue;
          ctx.fillStyle = br.color;
          ctx.shadowColor = br.color;
          ctx.shadowBlur = 8;
          ctx.fillRect(br.x, br.y, br.w, br.h);
        }
        ctx.shadowBlur = 0;
        for (k = 0; k < game.trail.length; k++) {
          ctx.fillStyle = "rgba(57,255,106," + (k / game.trail.length) * 0.35 + ")";
          ctx.fillRect(game.trail[k].x, game.trail[k].y, b.s, b.s);
        }
        ctx.fillStyle = "#fff35c";
        ctx.shadowColor = "#fff35c";
        ctx.shadowBlur = 10;
        ctx.fillRect(b.x, b.y, b.s, b.s);
        ctx.fillStyle = "#39ff6a";
        ctx.shadowColor = "#39ff6a";
        ctx.shadowBlur = 12;
        ctx.fillRect(p.x, h - 22, p.w, p.h);
        ctx.shadowBlur = 0;
        if (scoreHud) scoreHud.textContent = "SCORE " + pad7(game.score);
        if (stageHud) stageHud.textContent = "STAGE " + game.stage;
        if (typeof window.requestAnimationFrame === "function") {
          game.raf = window.requestAnimationFrame(loop);
        }
      }
      function startGame() {
        if (!ctx) return;
        attract.style.display = "none";
        play.classList.add("active");
        game.running = true;
        game.lives = 3;
        game.score = 0;
        game.stage = 1;
        game.paddle.x = 40;
        if (livesEl) livesEl.textContent = "◆ ◆ ◆";
        sizeCanvas();
        spawnBricks();
        resetBall();
        showToast("READY", 800);
        if (typeof window.requestAnimationFrame === "function") {
          game.raf = window.requestAnimationFrame(loop);
        } else {
          loop();
        }
      }
      canvas.addEventListener("pointerdown", function (e) {
        game.dragging = true;
        var rect = canvas.getBoundingClientRect();
        game.dragX = e.clientX - rect.left;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      });
      canvas.addEventListener("pointermove", function (e) {
        if (!game.dragging) return;
        var rect = canvas.getBoundingClientRect();
        game.dragX = e.clientX - rect.left;
      });
      canvas.addEventListener("pointerup", function () { game.dragging = false; });
      document.addEventListener("keydown", function (e) {
        if (!game.running) return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") game.keys.l = true;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") game.keys.r = true;
      });
      document.addEventListener("keyup", function (e) {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") game.keys.l = false;
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") game.keys.r = false;
      });
      if (typeof window.addEventListener === "function") {
        window.addEventListener("resize", function () {
          if (game.running) sizeCanvas();
        });
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
