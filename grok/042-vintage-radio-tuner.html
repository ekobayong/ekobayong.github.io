<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marconi Meridian 55 — Vintage Radio Tuner</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px 48px;
      background: radial-gradient(ellipse at 50% 28%, #2D2119 0%, #0A0705 72%);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      color: #3A2414;
    }
    .brand {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #C4A574;
      margin-bottom: 18px;
    }
    .radio {
      width: min(920px, 100%);
      background:
        linear-gradient(180deg, rgba(255,220,170,0.14), transparent 18%),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 7px),
        linear-gradient(165deg, #7A4525 0%, #5A2F18 46%, #3A1C0E 100%);
      border-radius: 42px 42px 26px 26px;
      padding: 22px 22px 26px;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.55),
        0 2px 0 rgba(255,210,150,0.18) inset,
        0 -18px 30px rgba(0,0,0,0.35) inset;
      position: relative;
      overflow: hidden;
    }
    .radio::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.18) 0%, transparent 36%, transparent 62%, rgba(255,220,160,0.05) 100%);
      pointer-events: none;
      border-radius: inherit;
    }
    .face {
      position: relative;
      background: linear-gradient(180deg, #EFE2C4, #D9C79F);
      border-radius: 18px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "dial dial"
        "grille display"
        "knobs knobs";
      gap: 16px;
      box-shadow: inset 0 2px 10px rgba(90,50,20,0.25), inset 0 -1px 0 rgba(255,255,255,0.4);
    }
    .dial {
      grid-area: dial;
      background: #1C1108;
      border-radius: 10px;
      padding: 10px 14px 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 3px #b08a4a, 0 0 0 5px #6a4a22, inset 0 -20px 40px rgba(255,179,71,0.22);
    }
    .dial-glow {
      position: absolute; left: 8%; right: 8%; bottom: -30%;
      height: 70%;
      background: radial-gradient(ellipse at 50% 100%, #FFB347 0%, rgba(255,179,71,0) 70%);
      opacity: 0.55;
      animation: flicker 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.5; }
      40% { opacity: 0.62; }
      73% { opacity: 0.44; }
    }
    .ticks {
      height: 18px;
      background:
        repeating-linear-gradient(90deg, #E29A3D 0 1px, transparent 1px 8px),
        repeating-linear-gradient(90deg, #FFB347 0 1.5px, transparent 1.5px 40px);
      opacity: 0.85;
      margin-top: 4px;
    }
    .freqs {
      display: flex; justify-content: space-between;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #E29A3D;
      text-shadow: 0 0 8px rgba(255,179,71,0.8);
      margin-top: 4px;
    }
    .cities {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      margin-top: 6px;
      position: relative;
      height: 36px;
    }
    .cities span {
      font-style: italic;
      font-size: 11px;
      color: #8a6a3a;
      white-space: nowrap;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .cities span:nth-child(even) { margin-top: 16px; }
    .cities span.lit {
      color: #fff;
      text-shadow: 0 0 10px #FFB347, 0 0 22px #FFB347;
    }
    .needle {
      position: absolute; top: 6px; bottom: 6px; width: 2px;
      background: #C8322A;
      box-shadow: 0 0 8px #C8322A, 0 0 16px rgba(200,50,42,0.6);
      transform: translateX(-50%);
      left: 0%;
      pointer-events: none;
      z-index: 2;
    }
    .needle::before {
      content: "";
      position: absolute; top: -3px; left: 50%;
      width: 10px; height: 10px;
      background: #C8322A;
      transform: translateX(-50%) rotate(45deg);
      box-shadow: 0 0 8px #C8322A;
    }
    .grille {
      grid-area: grille;
      border-radius: 14px;
      padding: 10px;
      background: linear-gradient(180deg, #c4a05a, #8a6a32);
      box-shadow: inset 0 1px 0 rgba(255,230,180,0.5), 0 4px 10px rgba(0,0,0,0.2);
      min-height: 210px;
      position: relative;
    }
    .weave {
      width: 100%; height: 100%; min-height: 190px; border-radius: 8px;
      background:
        repeating-linear-gradient(45deg, rgba(80,50,20,0.18) 0 2px, transparent 2px 6px),
        repeating-linear-gradient(-45deg, rgba(80,50,20,0.16) 0 2px, transparent 2px 7px),
        repeating-linear-gradient(0deg, #C9A97A 0 3px, #A3835A 3px 6px);
    }
    .emblem {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
    }
    .display {
      grid-area: display;
      background: #0b0906;
      border-radius: 10px;
      padding: 10px;
      box-shadow: inset 0 0 0 3px #b08a4a, inset 0 0 24px rgba(0,0,0,0.8);
      display: flex; flex-direction: column; gap: 8px;
      min-height: 210px;
    }
    #noise {
      width: 100%; height: 92px;
      border-radius: 4px;
      display: block;
      background: #050403;
    }
    .searching {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 11px;
      color: #E29A3D;
      text-align: center;
      min-height: 16px;
    }
    .station-card {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      text-align: center;
      min-height: 64px;
    }
    .station-card.on {
      opacity: 1;
      transform: translateY(0);
    }
    .station-card h2 {
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #FFF1D6;
      font-weight: 400;
    }
    .station-card .khz {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #E29A3D;
      font-size: 12px;
      margin: 4px 0;
    }
    .station-card p {
      font-style: italic;
      color: #d4c4a0;
      font-size: 13px;
    }
    .vu { width: 100%; height: 54px; display: block; }
    .knobs {
      grid-area: knobs;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .knob-wrap label {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A3A1A;
    }
    .knob {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 0;
      background:
        repeating-conic-gradient(from 0deg, #1a120c 0 6deg, #0a0705 6deg 12deg),
        radial-gradient(circle at 40% 35%, #2a2218, #0a0705 70%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.08);
      position: relative;
      cursor: grab;
      touch-action: none;
    }
    .knob.large { width: 92px; height: 92px; }
    .knob:hover, .knob:focus-visible {
      box-shadow: 0 0 0 4px rgba(176,138,74,0.55), 0 4px 10px rgba(0,0,0,0.45);
      outline: none;
    }
    .knob .ridge {
      position: absolute; inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 32%, #2c241c, #0c0907 72%);
      mask: radial-gradient(circle, transparent 62%, #000 64%);
      -webkit-mask: radial-gradient(circle, transparent 62%, #000 64%);
      background-image: repeating-conic-gradient(#1a120c 0 8deg, #050403 8deg 16deg);
    }
    .knob .mark {
      position: absolute; left: 50%; top: 8px;
      width: 3px; height: 14px;
      background: #EFE2C4;
      border-radius: 1px;
      transform: translateX(-50%);
    }
    .vents {
      display: flex; gap: 6px; align-items: flex-end; position: relative;
      padding: 8px 14px;
    }
    .vents::before {
      content: "";
      position: absolute; inset: 4px 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(255,140,40,0.55), transparent 70%);
      filter: blur(10px);
      z-index: 0;
    }
    .vent {
      width: 8px; height: 42px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255,179,71,0.15), #FFB347 70%, #c86a18);
      box-shadow: 0 0 8px rgba(255,179,71,0.6);
      position: relative; z-index: 1;
      animation: breathe 2.6s ease-in-out infinite;
    }
    .vent:nth-child(2) { animation-delay: 0.2s; height: 46px; }
    .vent:nth-child(3) { animation-delay: 0.4s; }
    .vent:nth-child(4) { animation-delay: 0.15s; height: 50px; }
    .vent:nth-child(5) { animation-delay: 0.55s; }
    .vent:nth-child(6) { animation-delay: 0.3s; height: 44px; }
    .vent:nth-child(7) { animation-delay: 0.7s; }
    .vent:nth-child(8) { animation-delay: 0.1s; height: 48px; }
    .vent:nth-child(9) { animation-delay: 0.45s; }
    .vent:nth-child(10) { animation-delay: 0.25s; }
    @keyframes breathe {
      0%, 100% { opacity: 0.55; filter: brightness(0.9); }
      50% { opacity: 1; filter: brightness(1.2); }
    }
    .power {
      appearance: none; border: 0;
      background: linear-gradient(180deg, #EFE2C4, #D9C79F);
      color: #3A1C0E;
      font-family: inherit;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 11px;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 2px 0 #b08a4a, inset 0 1px 0 #fff;
      cursor: pointer;
    }
    .power.on { box-shadow: 0 0 12px rgba(255,179,71,0.7), 0 2px 0 #b08a4a; }
    @media (max-width: 640px) {
      .face {
        grid-template-columns: 1fr;
        grid-template-areas: "dial" "display" "grille" "knobs";
      }
      .knobs { flex-wrap: wrap; justify-content: center; }
      .vents { order: 5; width: 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dial-glow, .vent { animation: none; }
    }
  </style>
</head>
<body>
  <div class="brand">Marconi Meridian 55</div>
  <div class="radio" role="application" aria-label="Marconi Meridian 55 vintage radio tuner">
    <div class="face">
      <div class="dial" id="dial">
        <div class="dial-glow"></div>
        <div class="ticks"></div>
        <div class="freqs">
          <span>600</span><span>700</span><span>800</span><span>900</span>
          <span>1000</span><span>1100</span><span>1200</span><span>1300</span>
          <span>1400</span><span>1500</span>
        </div>
        <div class="cities" id="cities">
          <span data-city="Madrid">Madrid</span>
          <span data-city="Luxembourg">Luxembourg</span>
          <span data-city="Hilversum">Hilversum</span>
          <span data-city="Paris">Paris</span>
          <span data-city="Lisbon">Lisbon</span>
          <span data-city="Vienna">Vienna</span>
          <span data-city="Stockholm">Stockholm</span>
          <span data-city="Athens">Athens</span>
          <span data-city="Warsaw">Warsaw</span>
          <span data-city="Oslo">Oslo</span>
        </div>
        <div class="needle" id="needle"></div>
      </div>
      <div class="grille">
        <div class="weave"></div>
        <svg class="emblem" viewBox="0 0 54 54" aria-hidden="true">
          <circle cx="27" cy="27" r="24" fill="#c4a05a" stroke="#7a5520" stroke-width="2"/>
          <circle cx="27" cy="27" r="18" fill="none" stroke="#6a4a18" stroke-width="1"/>
          <text x="27" y="24" text-anchor="middle" font-size="8" fill="#3A1C0E" font-family="Georgia,serif">M</text>
          <text x="27" y="36" text-anchor="middle" font-size="6" fill="#3A1C0E" font-family="Georgia,serif">55</text>
        </svg>
      </div>
      <div class="display">
        <canvas id="noise" width="320" height="92"></canvas>
        <div class="searching" id="searching">searching</div>
        <div class="station-card" id="card">
          <h2 id="city-name"></h2>
          <div class="khz" id="freq-line"></div>
          <p id="prog"></p>
        </div>
        <svg class="vu" id="vu" viewBox="0 0 220 54" aria-label="VU meter">
          <rect x="0" y="0" width="220" height="54" fill="#EFE2C4" rx="0"/>
          <path d="M18 42 A 92 92 0 0 1 168 18" fill="none" stroke="#3A1C0E" stroke-width="1.2"/>
          <path d="M168 18 A 92 92 0 0 1 202 28" fill="none" stroke="#C8322A" stroke-width="2"/>
          <text x="18" y="52" font-size="7" font-family="ui-monospace,monospace">−20</text>
          <text x="70" y="22" font-size="7" font-family="ui-monospace,monospace">0</text>
          <text x="196" y="40" font-size="7" font-family="ui-monospace,monospace" fill="#C8322A">+3</text>
          <line id="vu-needle" x1="110" y1="50" x2="40" y2="28" stroke="#111" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="knobs">
        <div class="knob-wrap">
          <button class="knob" id="vol" aria-label="volume" type="button">
            <span class="ridge"></span><span class="mark"></span>
          </button>
          <label for="vol">Volume</label>
        </div>
        <div class="vents" aria-hidden="true">
          <span class="vent"></span><span class="vent"></span><span class="vent"></span>
          <span class="vent"></span><span class="vent"></span><span class="vent"></span>
          <span class="vent"></span><span class="vent"></span><span class="vent"></span>
          <span class="vent"></span>
        </div>
        <button class="power" id="power" type="button">Power</button>
        <div class="knob-wrap">
          <button class="knob large" id="tune" aria-label="tuning" type="button">
            <span class="ridge"></span><span class="mark"></span>
          </button>
          <label for="tune">Tuning</label>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    function init() {
      var stations = [
        { city: "Madrid", khz: 630, prog: "Guitarra de medianoche — a late recital from Radio Nacional." },
        { city: "Luxembourg", khz: 720, prog: "The Grand Duchy Hour: swing records and river news." },
        { city: "Hilversum", khz: 810, prog: "Dutch chamber winds, live from the glass studios." },
        { city: "Paris", khz: 900, prog: "Chansons après minuit, with rain on the Seine." },
        { city: "Lisbon", khz: 990, prog: "Fado from Alfama, a guitar and a low voice." },
        { city: "Vienna", khz: 1080, prog: "Waltzes after the opera, strings still warm." },
        { city: "Stockholm", khz: 1170, prog: "Northern serial drama: snow on the archipelago." },
        { city: "Athens", khz: 1260, prog: "Aegean night news and a bouzouki coda." },
        { city: "Warsaw", khz: 1350, prog: "Poetry from the old town, then a mazurka." },
        { city: "Oslo", khz: 1440, prog: "Fjords and shipping forecasts, read very slowly." }
      ];
      var freq = 900;
      var vol = 0.55;
      var volAng = -120 + vol * 240;
      var tuneAng = ((freq - 600) / 900) * 280 - 140;
      var locked = null;
      var powered = false;
      var audio = null;
      var nodes = {};
      var reduced = false;
      if (typeof window.matchMedia === "function") {
        reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }
      var needle = qs("#needle");
      var cities = qsa("#cities span");
      var card = qs("#card");
      var cityName = qs("#city-name");
      var freqLine = qs("#freq-line");
      var prog = qs("#prog");
      var searching = qs("#searching");
      var noise = qs("#noise");
      var nctx = noise ? noise.getContext("2d") : null;
      var vuNeedle = qs("#vu-needle");
      var volEl = qs("#vol");
      var tuneEl = qs("#tune");
      var powerEl = qs("#power");
      var noiseAlpha = 1;
      var lastNoise = 0;

      function freqToPct(f) {
        return ((f - 600) / 900) * 100;
      }
      function findStation(f) {
        var i, s, best = null, d;
        for (i = 0; i < stations.length; i++) {
          d = Math.abs(stations[i].khz - f);
          if (d <= 18) {
            if (!best || d < Math.abs(best.khz - f)) best = stations[i];
          }
        }
        return best;
      }
      function applyKnob(el, ang) {
        if (!el) return;
        el.style.transform = "rotate(" + ang + "deg)";
      }
      function updateDial() {
        if (needle) needle.style.left = freqToPct(freq) + "%";
        applyKnob(tuneEl, tuneAng);
        applyKnob(volEl, volAng);
        var st = findStation(freq);
        var i;
        for (i = 0; i < cities.length; i++) {
          if (!cities[i]) continue;
          if (st && cities[i].getAttribute("data-city") === st.city) cities[i].classList.add("lit");
          else cities[i].classList.remove("lit");
        }
        if (st) {
          locked = st;
          if (searching) searching.textContent = "";
          if (card) card.classList.add("on");
          if (cityName) cityName.textContent = st.city;
          if (freqLine) freqLine.textContent = st.khz + " kHz";
          if (prog) prog.textContent = st.prog;
        } else {
          locked = null;
          if (searching) searching.textContent = "searching";
          if (card) card.classList.remove("on");
        }
        updateAudio();
      }
      function makeAudio() {
        if (audio) return;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audio = new AC();
        var noiseBuf = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
        var data = noiseBuf.getChannelData(0);
        var i;
        for (i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        var noiseSrc = audio.createBufferSource();
        noiseSrc.buffer = noiseBuf;
        noiseSrc.loop = true;
        var noiseFilter = audio.createBiquadFilter();
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = 900;
        noiseFilter.Q.value = 0.6;
        var noiseGain = audio.createGain();
        noiseGain.gain.value = 0;
        noiseSrc.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audio.destination);
        noiseSrc.start();
        var hum = audio.createOscillator();
        hum.type = "sine";
        hum.frequency.value = 50;
        var hum2 = audio.createOscillator();
        hum2.type = "triangle";
        hum2.frequency.value = 100;
        var humGain = audio.createGain();
        humGain.gain.value = 0;
        hum.connect(humGain);
        hum2.connect(humGain);
        humGain.connect(audio.destination);
        hum.start();
        hum2.start();
        var pad = audio.createOscillator();
        pad.type = "sine";
        pad.frequency.value = 220;
        var lfo = audio.createOscillator();
        lfo.frequency.value = 4.2;
        var lfoGain = audio.createGain();
        lfoGain.gain.value = 6;
        lfo.connect(lfoGain);
        lfoGain.connect(pad.frequency);
        var padFilter = audio.createBiquadFilter();
        padFilter.type = "lowpass";
        padFilter.frequency.value = 640;
        var padGain = audio.createGain();
        padGain.gain.value = 0;
        pad.connect(padFilter);
        padFilter.connect(padGain);
        padGain.connect(audio.destination);
        pad.start();
        lfo.start();
        nodes = { noiseGain: noiseGain, humGain: humGain, padGain: padGain, pad: pad };
      }
      function updateAudio() {
        if (!audio || !nodes.noiseGain) return;
        var v = powered ? vol : 0;
        var signal = locked ? 1 : 0;
        var t = audio.currentTime;
        try {
          nodes.noiseGain.gain.setTargetAtTime((1 - signal) * 0.08 * v, t, 0.12);
          nodes.humGain.gain.setTargetAtTime(0.012 * v, t, 0.12);
          nodes.padGain.gain.setTargetAtTime(signal * 0.05 * v, t, 0.25);
          if (nodes.pad && locked) {
            var base = 180 + (locked.khz - 600) * 0.12;
            nodes.pad.frequency.setTargetAtTime(base, t, 0.2);
          }
        } catch (err) {}
      }

      function bindKnob(el, onDelta) {
        if (!el) return;
        var dragging = false, lastAng = 0;
        function angle(e) {
          var r = el.getBoundingClientRect();
          return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
        }
        el.addEventListener("pointerdown", function (e) {
          dragging = true;
          lastAng = angle(e);
          try { el.setPointerCapture(e.pointerId); } catch (err) {}
        });
        el.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          var a = angle(e);
          var d = a - lastAng;
          if (d > Math.PI) d -= Math.PI * 2;
          if (d < -Math.PI) d += Math.PI * 2;
          lastAng = a;
          onDelta(d * 180 / Math.PI);
        });
        el.addEventListener("pointerup", function () { dragging = false; });
        el.addEventListener("wheel", function (e) {
          e.preventDefault();
          onDelta(e.deltaY > 0 ? 6 : -6);
        }, { passive: false });
        el.addEventListener("keydown", function (e) {
          if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); onDelta(-6); }
          if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); onDelta(6); }
        });
      }

      bindKnob(volEl, function (d) {
        volAng = Math.max(-120, Math.min(120, volAng + d));
        vol = (volAng + 120) / 240;
        applyKnob(volEl, volAng);
        updateAudio();
      });
      bindKnob(tuneEl, function (d) {
        tuneAng = Math.max(-140, Math.min(140, tuneAng + d * 0.6));
        freq = 600 + ((tuneAng + 140) / 280) * 900;
        updateDial();
      });

      if (powerEl) {
        powerEl.addEventListener("click", function () {
          powered = !powered;
          powerEl.classList.toggle("on", powered);
          makeAudio();
          if (audio && audio.state === "suspended") audio.resume();
          updateAudio();
        });
      }

      function drawNoise(now) {
        if (typeof window.requestAnimationFrame === "function") {
          window.requestAnimationFrame(drawNoise);
        }
        if (!nctx || !noise) return;
        if (reduced && now - lastNoise < 120) {
          swingVU(now);
          return;
        }
        lastNoise = now;
        var w = 160, h = 46;
        var img = nctx.createImageData(w, h);
        var d = img.data;
        var i, v, o;
        var targetA = locked ? 0.08 : 1;
        noiseAlpha += (targetA - noiseAlpha) * 0.08;
        for (i = 0; i < w * h; i++) {
          v = Math.random() * 255;
          o = i * 4;
          d[o] = v * 1.05;
          d[o + 1] = v * 0.62;
          d[o + 2] = v * 0.22;
          d[o + 3] = 255 * noiseAlpha;
        }
        nctx.imageSmoothingEnabled = false;
        var off = document.createElement("canvas");
        off.width = w; off.height = h;
        var oc = off.getContext("2d");
        if (!oc) return;
        oc.putImageData(img, 0, 0);
        nctx.clearRect(0, 0, noise.width, noise.height);
        nctx.drawImage(off, 0, 0, noise.width, noise.height);
        var bandY = ((now / 40) % noise.height);
        nctx.fillStyle = "rgba(255,179,71,0.12)";
        nctx.fillRect(0, bandY, noise.width, 8);
        swingVU(now);
      }
      function swingVU(now) {
        if (!vuNeedle) return;
        var ang;
        if (locked) ang = -50 + Math.sin(now / 420) * 18 + Math.sin(now / 190) * 6;
        else ang = -70 + (Math.random() - 0.5) * 40;
        var rad = ang * Math.PI / 180;
        var x2 = 110 + Math.cos(rad) * 90;
        var y2 = 50 + Math.sin(rad) * 90;
        vuNeedle.setAttribute("x2", String(x2));
        vuNeedle.setAttribute("y2", String(y2));
      }

      updateDial();
      if (typeof window.requestAnimationFrame === "function") {
        window.requestAnimationFrame(drawNoise);
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
