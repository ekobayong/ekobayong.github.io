<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Meadow — Fireflies</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(#05081a, #0d1a3d 38%, #1a2f52 72%, #22344f 100%);
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #e8eefc;
      cursor: none;
      transition: filter 1.4s ease;
    }
    body.new-moon { filter: saturate(0.55) brightness(0.72); }
    .sky { position: fixed; inset: 0; z-index: 0; }
    .star {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      animation: twinkle 3.6s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.55; } to { opacity: 0.95; } }
    .moonglow {
      position: absolute; right: -8%; top: -10%; width: 55%; height: 55%;
      background: radial-gradient(circle, rgba(255,248,230,0.22), transparent 70%);
      pointer-events: none; transition: opacity 1.4s ease;
    }
    body.new-moon .moonglow { opacity: 0; }
    .moon {
      position: absolute; right: 8%; top: 8%;
      width: clamp(64px, 10vw, 130px); height: clamp(64px, 10vw, 130px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #fffbf0, #d9cfb4);
      box-shadow: 0 0 40px rgba(255,248,230,0.55), 0 0 140px rgba(255,236,200,0.28);
      transition: opacity 1.4s ease, box-shadow 1.4s ease;
    }
    .moon .crater {
      position: absolute; border-radius: 50%; background: rgba(180,170,150,0.28);
    }
    body.new-moon .moon { opacity: 0.08; box-shadow: none; }
    .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 48%; z-index: 1; }
    .mist {
      position: absolute; left: -20%; right: -20%; height: 90px; bottom: 12%;
      background: rgba(180, 196, 214, 0.2); filter: blur(14px);
      animation: mistA 40s ease-in-out infinite alternate;
      z-index: 3; pointer-events: none; transition: opacity 1.4s ease;
    }
    .mist.b { bottom: 6%; height: 70px; animation: mistB 55s ease-in-out infinite alternate; opacity: 0.7; }
    body.new-moon .mist { opacity: 0.25; }
    @keyframes mistA { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
    @keyframes mistB { from { transform: translateX(10%); } to { transform: translateX(-10%); } }
    #grass { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; z-index: 4; overflow: visible; }
    #grass path {
      transform-box: fill-box; transform-origin: 50% 100%;
      animation: sway var(--d, 6s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    @keyframes sway {
      from { transform: rotate(-3.5deg) skewX(-2deg); }
      to { transform: rotate(3.5deg) skewX(2deg); }
    }
    #flies { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; display: block; }
    .breeze {
      position: fixed; width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
      pointer-events: none; z-index: 6; transform: translate(-50%, -50%);
    }
    .caption {
      position: fixed; top: 36px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 8; pointer-events: none;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      opacity: 0; animation: cap 4s ease 1.2s forwards;
    }
    .caption p { font-style: italic; font-size: clamp(18px, 3vw, 28px); }
    .caption small {
      display: block; margin-top: 8px; letter-spacing: 0.28em;
      font-variant: small-caps; font-size: 12px; font-family: ui-sans-serif, system-ui, sans-serif;
      opacity: 0.75;
    }
    @keyframes cap { to { opacity: 1; } }
    .ui {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    #phase {
      appearance: none; border: 1px solid rgba(255,255,255,0.28);
      background: rgba(8,12,28,0.55); color: #e8eefc;
      border-radius: 999px; padding: 8px 16px 8px 12px;
      font: 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.18em;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #fffbf0; box-shadow: 0 0 8px #fffbf0;
    }
    .dot.crescent {
      background: transparent; box-shadow: inset -3px 0 0 #fffbf0;
      border: 1px solid #fffbf0;
    }
    .count { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.75; }
    @media (prefers-reduced-motion: reduce) {
      .star, .mist, #grass path, .caption { animation: none !important; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="moonglow"></div>
    <div class="moon" id="moon">
      <span class="crater" style="width:18%;height:14%;left:28%;top:30%"></span>
      <span class="crater" style="width:10%;height:10%;left:58%;top:48%"></span>
      <span class="crater" style="width:12%;height:8%;left:42%;top:62%"></span>
    </div>
    <svg class="hills" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2c4d"/><stop offset="1" stop-color="#101c36"/></linearGradient>
        <linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1a31"/><stop offset="1" stop-color="#080f21"/></linearGradient>
      </defs>
      <path fill="url(#f)" d="M0 220 C 180 160 280 250 420 190 C 560 130 640 230 780 170 C 920 110 1040 210 1200 150 L 1200 400 L 0 400 Z"/>
      <path fill="url(#n)" d="M0 280 C 160 230 300 320 460 260 C 620 200 740 310 900 250 C 1040 200 1120 280 1200 240 L 1200 400 L 0 400 Z"/>
    </svg>
    <div class="mist a"></div>
    <div class="mist b"></div>
    <svg id="grass" viewBox="0 0 1200 400" preserveAspectRatio="none"></svg>
  </div>
  <canvas id="flies"></canvas>
  <div class="breeze" id="breeze"></div>
  <div class="caption">
    <p>The field remembers every small light.</p>
    <small>a night meadow · late june</small>
  </div>
  <div class="ui">
    <button type="button" id="phase"><span class="dot" id="phasedot"></span><span id="phaselab">New moon</span></button>
    <div class="count" id="count">0 fireflies</div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function init() {
      var reduced = false;
      if (typeof window.matchMedia === "function") {
        reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }
      var sky = qs(".sky");
      if (sky) {
        var colors = ["#ffffff", "#cfd8ff", "#ffe9c4"];
        var i, s, seed = 1;
        function lcg() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
        for (i = 0; i < 15; i++) {
          s = document.createElement("div");
          s.className = "star";
          s.style.left = (6 + lcg() * 88) + "%";
          s.style.top = (4 + lcg() * 42) + "%";
          s.style.background = "radial-gradient(circle, " + colors[i % 3] + ", transparent 70%)";
          s.style.width = s.style.height = (2 + lcg() * 3) + "px";
          s.style.animationDelay = (-lcg() * 4) + "s";
          sky.appendChild(s);
        }
      }
      var grass = qs("#grass");
      if (grass) {
        var seed = 42;
        function lcg() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
        function blades(n, color, opacity, blur, slow) {
          var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("fill", color);
          g.setAttribute("opacity", String(opacity));
          if (blur) g.setAttribute("filter", "blur(0.7px)");
          var i, x, h, lean, d, p;
          for (i = 0; i < n; i++) {
            x = lcg() * 1200;
            h = 40 + lcg() * 90;
            lean = (lcg() - 0.5) * 18;
            d = "M" + x.toFixed(1) + " 400 Q " + (x + lean).toFixed(1) + " " + (400 - h * 0.55).toFixed(1) + " " + (x + lean * 1.4).toFixed(1) + " " + (400 - h).toFixed(1);
            p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", d);
            p.setAttribute("stroke", color);
            p.setAttribute("stroke-width", String(1 + lcg() * 1.4));
            p.setAttribute("fill", "none");
            p.style.setProperty("--d", (slow ? 6 + lcg() * 4 : 4 + lcg() * 4) + "s");
            p.style.setProperty("--delay", (-lcg() * 8) + "s");
            g.appendChild(p);
          }
          grass.appendChild(g);
        }
        blades(140, "#0b1530", 0.55, true, true);
        blades(120, "#070f24", 0.85, false, false);
        blades(90, "#03081a", 1, false, false);
      }

      var canvas = qs("#flies");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var dpr = 1, W = 0, H = 0;
      var flies = [];
      var mx = -999, my = -999;
      var newMoon = false;
      var breeze = qs("#breeze");
      var countEl = qs("#count");
      var phaseBtn = qs("#phase");
      var phaseDot = qs("#phasedot");
      var phaseLab = qs("#phaselab");

      function sprite() {
        var s = document.createElement("canvas");
        s.width = 64; s.height = 64;
        var c = s.getContext("2d");
        if (!c) return s;
        var g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, "hsla(84,100%,78%,1)");
        g.addColorStop(0.12, "hsla(84,100%,70%,0.7)");
        g.addColorStop(0.4, "hsla(84,90%,60%,0.18)");
        g.addColorStop(1, "hsla(84,90%,60%,0)");
        c.fillStyle = g;
        c.fillRect(0, 0, 64, 64);
        return s;
      }
      var halo = sprite();

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth || 1;
        H = window.innerHeight || 1;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var area = W * H;
        var n = Math.round(28 + (90 - 28) * Math.max(0, Math.min(1, (area - 320 * 480) / (1920 * 1080 - 320 * 480))));
        while (flies.length < n) flies.push(makeFly(Math.random() * W, (0.28 + Math.random() * 0.62) * H, false));
        if (flies.length > n) flies.length = n;
      }
      function makeFly(x, y, burst) {
        return {
          x: x, y: y,
          vx: (Math.random() - 0.5) * (burst ? 3.2 : 0.6),
          vy: (Math.random() - 0.5) * (burst ? 3.2 : 0.6),
          heading: Math.random() * Math.PI * 2,
          phase: Math.random() * Math.PI * 2,
          rate: 0.8 + Math.random() * 1.6,
          r: 1.2 + Math.random() * 1.6,
          hue: 78 + Math.random() * 12,
          life: burst ? 17 : Infinity,
          max: burst ? 17 : Infinity
        };
      }
      function step(dt) {
        var speed = reduced ? 0.28 : 1;
        var i, f, force, dx, dy, dist, bandLo, bandHi;
        bandLo = H * 0.28; bandHi = H * 0.9;
        for (i = flies.length - 1; i >= 0; i--) {
          f = flies[i];
          f.heading += (Math.random() - 0.5) * 0.35 * speed;
          f.vx += Math.cos(f.heading) * 0.04 * speed;
          f.vy += Math.sin(f.heading) * 0.04 * speed;
          if (f.y < bandLo) f.vy += 0.05;
          if (f.y > bandHi) f.vy -= 0.05;
          if (f.x < 20) f.vx += 0.05;
          if (f.x > W - 20) f.vx -= 0.05;
          dx = f.x - mx; dy = f.y - my;
          dist = Math.hypot(dx, dy);
          if (dist < 150 && dist > 0.1) {
            force = (1 - dist / 150) * 1.6;
            f.vx += (dx / dist) * force;
            f.vy += (dy / dist) * force;
          }
          f.vx *= 0.94; f.vy *= 0.94;
          f.x += f.vx * speed * (dt / 0.016);
          f.y += f.vy * speed * (dt / 0.016);
          f.phase += f.rate * dt * speed * (reduced ? 0.35 : 1);
          if (f.life !== Infinity) {
            f.life -= dt;
            if (f.life <= 0) flies.splice(i, 1);
          }
        }
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";
        var i, f, b, s, core;
        var boost = newMoon ? 1.15 : 1;
        for (i = 0; i < flies.length; i++) {
          f = flies[i];
          b = Math.pow(Math.sin(f.phase) * 0.5 + 0.5, 2) * boost;
          if (f.life !== Infinity) b *= Math.max(0, f.life / f.max);
          s = f.r * 10 * (0.6 + b);
          ctx.globalAlpha = 0.15 + b * 0.85;
          ctx.drawImage(halo, f.x - s, f.y - s, s * 2, s * 2);
          ctx.fillStyle = "hsl(" + f.hue + ",100%," + (70 + b * 20) + "%)";
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * (0.5 + b * 0.8), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        if (countEl) countEl.textContent = flies.length + " fireflies";
      }
      var last = (typeof performance !== "undefined" ? performance.now() : Date.now());
      function loop(now) {
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        step(dt);
        draw();
      }
      window.addEventListener("pointermove", function (e) {
        mx = e.clientX; my = e.clientY;
        if (breeze) { breeze.style.left = mx + "px"; breeze.style.top = my + "px"; }
      });
      window.addEventListener("pointerdown", function (e) {
        var n = 14 + Math.floor(Math.random() * 10);
        var k;
        for (k = 0; k < n; k++) flies.push(makeFly(e.clientX, e.clientY, true));
      });
      if (phaseBtn) phaseBtn.addEventListener("click", function () {
        newMoon = !newMoon;
        document.body.classList.toggle("new-moon", newMoon);
        if (phaseDot) phaseDot.classList.toggle("crescent", newMoon);
        if (phaseLab) phaseLab.textContent = newMoon ? "Full moon" : "New moon";
      });
      window.addEventListener("resize", resize);
      resize();
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
