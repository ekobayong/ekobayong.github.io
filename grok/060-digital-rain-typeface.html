<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain.Type — Digital Rain Reimagined as Typographic Art</title>
  <style>
    :root {
      --bg: #04100c;
      --head: #e8fff3;
      --mid: #5cffb0;
      --tail: #0b6b46;
      --ink: #e8fff3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); }
    canvas { display: block; width: 100%; height: 100%; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.55) 100%);
    }
    .hud {
      position: fixed; top: 18px; left: 18px; z-index: 4;
      width: min(360px, calc(100vw - 32px));
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid color-mix(in srgb, var(--mid) 35%, transparent);
      padding: 16px 16px 14px; font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .hud::before, .hud::after {
      content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--mid);
    }
    .hud::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .hud::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
    h1 {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 20px; font-weight: 500; letter-spacing: 0.08em;
    }
    h1 .cur {
      display: inline-block; width: 9px; height: 16px; background: var(--head); margin-left: 4px; vertical-align: -2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .swatches { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
    .sw {
      height: 18px; border: 1px solid transparent; cursor: pointer; padding: 0; width: 100%;
    }
    .sw.on { border-color: var(--head); box-shadow: 0 0 8px var(--mid); }
    .sw-lab { display: block; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; color: var(--mid); text-align: center; }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; flex: 1; height: 2px; background: var(--tail); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px; background: var(--head);
      box-shadow: 0 0 8px var(--mid); cursor: pointer; border: 0;
    }
    .cli {
      width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--tail);
      color: var(--head); font: 13px/1.6 ui-monospace, Consolas, monospace; padding: 6px 0; outline: none;
    }
    .status { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--mid); margin-top: 8px; }
    .go {
      margin-top: 8px; background: transparent; color: var(--head); border: 1px solid var(--mid);
      padding: 6px 10px; cursor: pointer; font: 11px ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .stats {
      position: fixed; right: 16px; bottom: 14px; z-index: 4;
      font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--mid); text-align: right;
    }
    .cap {
      position: fixed; left: 16px; bottom: 14px; z-index: 4;
      font: italic 12px Georgia, Palatino, serif; color: var(--mid); max-width: 280px;
    }
    @media (prefers-reduced-motion: reduce) {
      h1 .cur { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <h1>Rain.Type<span class="cur"></span></h1>
    <div class="swatches" id="swatches">
      <div><button type="button" class="sw on" data-p="0" aria-label="Jade" style="background:linear-gradient(90deg,#e8fff3,#5cffb0,#0b6b46)"></button><span class="sw-lab">Jade</span></div>
      <div><button type="button" class="sw" data-p="1" aria-label="Amber Archive" style="background:linear-gradient(90deg,#fff3d6,#ffb347,#7a4a0a)"></button><span class="sw-lab">Amber Archive</span></div>
      <div><button type="button" class="sw" data-p="2" aria-label="Ice" style="background:linear-gradient(90deg,#f4fbff,#8fd3ff,#1f4f7a)"></button><span class="sw-lab">Ice</span></div>
      <div><button type="button" class="sw" data-p="3" aria-label="Rose" style="background:linear-gradient(90deg,#ffe9f1,#ff6fa3,#7a1f45)"></button><span class="sw-lab">Rose</span></div>
    </div>
    <div class="row"><span>Density</span><input type="range" id="dens" min="10" max="100" value="70"></div>
    <div class="row"><span>Speed</span><input type="range" id="spd" min="20" max="250" value="100"></div>
    <input class="cli" id="cli" maxlength="40" placeholder="> type a phrase, press enter" value="">
    <button type="button" class="go" id="resolve">Resolve</button>
    <div class="status" id="status">idle · raining</div>
  </div>
  <p class="cap">Sixty glyphs: twenty-four invented katakana-like marks, ten numerals, twenty-six Latin capitals.</p>
  <div class="stats" id="stats">grid 0×0<br>streams 0<br>0 fps</div>
  <script>
(function () {
  "use strict";
  if (typeof window === "undefined" || typeof document === "undefined") return;
  function qs(sel, root) {
    try { return (root || document).querySelector(sel); } catch (e) { return null; }
  }
  var PATHS = [
    "M2 1 L2 9 M1 2 L9 2",
    "M1 1 L9 9 M9 1 L1 9",
    "M2 2 H8 V8 H2 Z",
    "M1 5 L5 1 L9 5 L5 9 Z",
    "M5 1 V9 M1 5 H9",
    "M2 1 L8 5 L2 9",
    "M8 1 L2 5 L8 9",
    "M1 2 H9 M1 8 H9 M5 2 V8",
    "M2 1 V6 C2 9 8 9 8 6 V1",
    "M1 8 Q5 1 9 8",
    "M1 2 Q5 8 9 2",
    "M3 1 V9 M7 1 V9 M3 5 H7",
    "M1 1 H6 V5 H9 V9 H4 V5 H1 Z",
    "M5 1 L9 5 L5 9 L1 5",
    "M2 9 L2 3 H8 V9",
    "M1 1 H9 L5 9 Z",
    "M2 2 H8 M5 2 V9 M2 9 H8",
    "M1 5 H9 M2 2 L8 8 M8 2 L2 8",
    "M3 1 L3 9 M3 1 H8 V4 H3",
    "M2 8 C2 2 8 2 8 8",
    "M1 1 V9 M1 1 H7 M1 5 H6",
    "M2 1 L5 8 L8 1",
    "M1 9 L5 1 L9 9 M3 6 H7",
    "M1 3 H9 M1 7 H9 M3 1 V9 M7 1 V9"
  ];
  var PALETTES = [
    { name: "Jade", bg: "#04100c", head: "#e8fff3", mid: "#5cffb0", tail: "#0b6b46" },
    { name: "Amber Archive", bg: "#0d0903", head: "#fff3d6", mid: "#ffb347", tail: "#7a4a0a" },
    { name: "Ice", bg: "#050912", head: "#f4fbff", mid: "#8fd3ff", tail: "#1f4f7a" },
    { name: "Rose", bg: "#0f050a", head: "#ffe9f1", mid: "#ff6fa3", tail: "#7a1f45" }
  ];
  function hexTo(h) {
    h = h.replace("#", "");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(c0, c1, t) {
    return [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)];
  }
  function init() {
    var canvas = qs("#c");
    var densEl = qs("#dens");
    var spdEl = qs("#spd");
    var cli = qs("#cli");
    var resolveBtn = qs("#resolve");
    var status = qs("#status");
    var stats = qs("#stats");
    var swatches = qs("#swatches");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    var reduced = false;
    if (typeof window.matchMedia === "function") {
      try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    }
    if (reduced) {
      if (densEl) densEl.value = "35";
      if (spdEl) spdEl.value = "35";
    }
    var pal = 0;
    var cell = 22, cols = 0, rows = 0, dpr = 1;
    var streams = [];
    var grid = [];
    var locked = [];
    var atlas = null;
    var glyphCount = 60;
    var LEVELS = 14;
    var GW = 32, GH = 32;
    var latin = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    var fps = 0, frames = 0, fpsT = 0;
    var mode = "rain";
    var lockRow = 0;
    var lockCols = [];
    var lockPhrase = "";
    var lockLanded = 0;
    var holdUntil = 0;
    var dissolveFrom = 0;

    function cellSize() {
      var w = window.innerWidth || 800;
      if (w < 700) return 18;
      if (w > 2000) return 26;
      return 22;
    }
    function applyPalette() {
      var p = PALETTES[pal];
      var root = document.documentElement;
      root.style.setProperty("--bg", p.bg);
      root.style.setProperty("--head", p.head);
      root.style.setProperty("--mid", p.mid);
      root.style.setProperty("--tail", p.tail);
      root.style.setProperty("--ink", p.head);
      buildAtlas();
    }
    function buildAtlas() {
      var p = PALETTES[pal];
      var head = hexTo(p.head), mid = hexTo(p.mid), tail = hexTo(p.tail);
      atlas = document.createElement("canvas");
      atlas.width = GW * glyphCount;
      atlas.height = GH * LEVELS;
      var a = atlas.getContext("2d");
      if (!a) return;
      var g, lv;
      for (lv = 0; lv < LEVELS; lv++) {
        var t = lv / (LEVELS - 1);
        var col, alpha = 1;
        if (t < 0.5) col = mix(tail, mid, t / 0.5);
        else col = mix(mid, head, (t - 0.5) / 0.5);
        if (t < 0.22) alpha = 0.25 + t * 2;
        var css = "rgba(" + col[0].toFixed(0) + "," + col[1].toFixed(0) + "," + col[2].toFixed(0) + "," + alpha + ")";
        for (g = 0; g < 24; g++) {
          var x = g * GW, y = lv * GH;
          if (lv === LEVELS - 1) {
            a.save(); a.shadowColor = p.head; a.shadowBlur = 8;
          }
          a.strokeStyle = css;
          a.lineWidth = 1.6; a.lineCap = "round"; a.lineJoin = "round";
          var path = new Path2D(PATHS[g]);
          a.save();
          a.translate(x + 6, y + 6);
          a.scale(2, 2);
          a.stroke(path);
          a.restore();
          if (lv === LEVELS - 1) a.restore();
        }
        a.font = "bold 18px ui-monospace, Consolas, monospace";
        a.textAlign = "center"; a.textBaseline = "middle";
        a.fillStyle = css;
        for (g = 0; g < 36; g++) {
          var x2 = (24 + g) * GW, y2 = lv * GH;
          if (lv === LEVELS - 1) { a.save(); a.shadowColor = p.head; a.shadowBlur = 8; }
          a.fillText(latin.charAt(g), x2 + GW / 2, y2 + GH / 2 + 1);
          if (lv === LEVELS - 1) a.restore();
        }
      }
    }
    function randGlyph(preferLatin) {
      if (preferLatin) return 24 + Math.floor(Math.random() * 36);
      return Math.floor(Math.random() * glyphCount);
    }
    function letterIndex(ch) {
      ch = ch.toUpperCase();
      var i = latin.indexOf(ch);
      if (i >= 0) return 24 + i;
      return randGlyph(true);
    }
    function resize() {
      cell = cellSize();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = window.innerWidth || 800, h = window.innerHeight || 600;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      cols = Math.max(8, Math.floor(w / cell));
      rows = Math.max(8, Math.floor(h / cell));
      grid = [];
      var i, n = cols * rows;
      for (i = 0; i < n; i++) grid.push({ g: randGlyph(), b: 0, lock: false, scale: 1, pulse: 0 });
      rebuildStreams();
      lockRow = Math.floor(rows * 0.46);
    }
    function rebuildStreams() {
      var dens = densEl ? parseFloat(densEl.value) / 100 : 0.7;
      var n = Math.max(1, Math.floor(cols * dens));
      streams = [];
      var used = {};
      while (streams.length < n) {
        var c = Math.floor(Math.random() * cols);
        if (used[c]) continue;
        used[c] = 1;
        streams.push({
          c: c,
          head: Math.random() * rows,
          speed: 6 + Math.random() * 10,
          target: -1
        });
      }
    }
    function setMode(m, extra) {
      mode = m;
      if (!status) return;
      if (m === "rain") status.textContent = "idle · raining";
      if (m === "resolving") status.textContent = "resolving " + lockLanded + " / " + lockPhrase.length;
      if (m === "hold") status.textContent = "locked · holding";
      if (m === "dissolving") status.textContent = "dissolving";
    }
    function resolvePhrase(text) {
      text = String(text || "").replace(/[^A-Za-z0-9 ]/g, "").slice(0, 40).toUpperCase();
      if (!text) return;
      lockPhrase = text;
      var start = Math.max(0, Math.floor((cols - text.length) / 2));
      lockCols = [];
      lockLanded = 0;
      var i;
      for (i = 0; i < grid.length; i++) { grid[i].lock = false; grid[i].scale = 1; }
      for (i = 0; i < text.length; i++) {
        var col = start + i;
        lockCols.push(col);
        var st = null;
        var s;
        for (s = 0; s < streams.length; s++) if (streams[s].c === col) st = streams[s];
        if (!st) {
          st = { c: col, head: 0, speed: 8 + Math.random() * 6, target: lockRow };
          streams.push(st);
        }
        st.target = lockRow;
        st.head = lockRow - (4 + Math.random() * 10);
        st.speed = 8 + Math.random() * 8;
      }
      setMode("resolving");
    }
    function loop(now) {
      var dt = Math.min(0.05, (now - (loop.prev || now)) / 1000);
      loop.prev = now;
      var speedMul = spdEl ? (parseFloat(spdEl.value) / 100) : 1;
      if (speedMul < 0.2) speedMul = 0.2;
      if (speedMul > 2.5) speedMul = 2.5;
      var i, s, cellI;
      for (i = 0; i < grid.length; i++) {
        if (!grid[i].lock) grid[i].b *= Math.exp(-1.6 * dt);
      }
      for (s = 0; s < streams.length; s++) {
        var st = streams[s];
        var prev = st.head;
        st.head += st.speed * speedMul * dt;
        var r0 = Math.floor(prev), r1 = Math.floor(st.head);
        var r;
        for (r = r0 + 1; r <= r1; r++) {
          var rr = ((r % rows) + rows) % rows;
          if (st.target >= 0 && r >= st.target && mode === "resolving") {
            var idx = lockCols.indexOf(st.c);
            if (idx >= 0) {
              cellI = st.c + lockRow * cols;
              if (grid[cellI] && !grid[cellI].lock) {
                grid[cellI].g = letterIndex(lockPhrase.charAt(idx));
                grid[cellI].lock = true;
                grid[cellI].b = 1;
                grid[cellI].scale = 1.7;
                grid[cellI].pulse = now;
                lockLanded++;
                if (status) status.textContent = "resolving " + lockLanded + " / " + lockPhrase.length;
                if (lockLanded >= lockPhrase.length) {
                  mode = "hold";
                  holdUntil = now + 4500;
                  if (status) status.textContent = "locked · holding";
                }
              }
              st.target = -1;
            }
          }
          cellI = st.c + rr * cols;
          if (grid[cellI] && !grid[cellI].lock) {
            grid[cellI].g = randGlyph();
            grid[cellI].b = 1;
          }
        }
        if (st.head > rows + 8) st.head = -Math.random() * 12;
        if (!reduced) {
          var f, nFlick = Math.floor(rows * 0.15);
          for (f = 0; f < nFlick; f++) {
            var fr = Math.floor(Math.random() * rows);
            cellI = st.c + fr * cols;
            if (grid[cellI] && !grid[cellI].lock && grid[cellI].b > 0.05) grid[cellI].g = randGlyph();
          }
        }
      }
      if (mode === "hold" && now > holdUntil) {
        mode = "dissolving";
        dissolveFrom = now;
        if (status) status.textContent = "dissolving";
        for (i = 0; i < lockCols.length; i++) {
          grid[lockCols[i] + lockRow * cols]._rel = now + Math.random() * 1600;
        }
      }
      if (mode === "dissolving") {
        var left = 0;
        for (i = 0; i < lockCols.length; i++) {
          var gcell = grid[lockCols[i] + lockRow * cols];
          if (gcell && gcell.lock) {
            if (now >= (gcell._rel || 0)) gcell.lock = false;
            else left++;
          }
        }
        if (now > dissolveFrom + 1700) {
          for (i = 0; i < grid.length; i++) grid[i].lock = false;
          mode = "rain";
          if (status) status.textContent = "idle · raining";
        }
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = PALETTES[pal].bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      var w = window.innerWidth, h = window.innerHeight;
      if (!atlas) buildAtlas();
      var y, x;
      for (y = 0; y < rows; y++) {
        for (x = 0; x < cols; x++) {
          var cellD = grid[x + y * cols];
          if (!cellD || (cellD.b < 0.02 && !cellD.lock)) continue;
          var lv = cellD.lock ? LEVELS - 1 : Math.max(0, Math.min(LEVELS - 1, Math.floor(cellD.b * (LEVELS - 1))));
          var dw = cell, dh = cell;
          if (cellD.lock) {
            var age = now - cellD.pulse;
            var sc = cellD.scale;
            if (age < 350) sc = 1.7 - 0.7 * Math.min(1, age / 350);
            else sc = 1;
            cellD.scale = sc;
            dw = cell * sc; dh = cell * sc;
            ctx.save();
            var pulse = 0.55 + 0.45 * Math.sin(now / 280);
            ctx.shadowColor = PALETTES[pal].head;
            ctx.shadowBlur = 12 * pulse;
            ctx.drawImage(atlas, cellD.g * GW, lv * GH, GW, GH, x * cell - (dw - cell) / 2, y * cell - (dh - cell) / 2, dw, dh);
            ctx.restore();
            ctx.strokeStyle = PALETTES[pal].head;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x * cell + 4, y * cell + cell - 3);
            ctx.lineTo(x * cell + cell - 4, y * cell + cell - 3);
            ctx.stroke();
          } else {
            ctx.drawImage(atlas, cellD.g * GW, lv * GH, GW, GH, x * cell, y * cell, cell, cell);
          }
        }
      }
      frames++;
      if (now - fpsT > 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
      if (stats) stats.innerHTML = "grid " + cols + "×" + rows + "<br>streams " + streams.length + "<br>" + fps + " fps";
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
    }
    if (swatches) {
      swatches.addEventListener("click", function (e) {
        var b = e.target.closest(".sw");
        if (!b) return;
        pal = parseInt(b.getAttribute("data-p"), 10) || 0;
        var bs = swatches.querySelectorAll(".sw");
        var i;
        for (i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i] === b);
        applyPalette();
      });
    }
    if (densEl) densEl.addEventListener("input", rebuildStreams);
    if (cli) {
      cli.addEventListener("keydown", function (e) {
        if (e.key === "Enter") resolvePhrase(cli.value);
      });
    }
    if (resolveBtn) resolveBtn.addEventListener("click", function () { resolvePhrase(cli ? cli.value : ""); });
    canvas.addEventListener("click", function () {
      if (mode === "hold") { holdUntil = 0; }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key >= "1" && e.key <= "4" && document.activeElement !== cli) {
        pal = parseInt(e.key, 10) - 1;
        if (swatches) {
          var bs = swatches.querySelectorAll(".sw");
          var i;
          for (i = 0; i < bs.length; i++) bs[i].classList.toggle("on", i === pal);
        }
        applyPalette();
      }
    });
    window.addEventListener("resize", resize);
    applyPalette();
    resize();
    window.setTimeout(function () { resolvePhrase("TYPE IS RAIN"); }, 2000);
    if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
