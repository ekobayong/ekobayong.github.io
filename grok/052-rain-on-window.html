<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Window — Rain on Glass</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #05070f; overflow: hidden; }
    body { font-family: Georgia, "Iowan Old Style", Palatino, serif; color: #e9e4da; }
    #view {
      position: fixed; inset: 0;
      box-shadow:
        inset 0 0 0 14px #1a120c,
        inset 0 0 0 18px #3a2a1c,
        inset 0 0 0 22px #24180f,
        inset 18px 22px 40px rgba(0,0,0,0.55),
        inset -12px -16px 30px rgba(0,0,0,0.4);
      background:
        repeating-linear-gradient(90deg, rgba(90,50,20,0.18) 0 2px, transparent 2px 7px),
        linear-gradient(180deg, #2a1c12, #120c08);
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.55) 100%);
    }
    .lamp {
      position: fixed; right: 7%; top: 8%; width: 120px; height: 180px;
      opacity: 0.32; z-index: 3; pointer-events: none;
      filter: blur(1.5px);
      mix-blend-mode: screen;
      animation: lampBreath 7s ease-in-out infinite;
    }
    .glow {
      position: fixed; right: -8%; top: -10%; width: 55vw; height: 55vh;
      background: radial-gradient(ellipse at 70% 30%, rgba(255,179,92,0.22), transparent 62%);
      pointer-events: none; z-index: 3;
      animation: lampBreath 7s ease-in-out infinite;
    }
    @keyframes lampBreath {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.42; }
    }
    .hud {
      position: fixed; left: 36px; top: 36px; z-index: 5;
      pointer-events: none;
    }
    .hud h1 {
      font-style: italic; font-weight: 400; font-size: clamp(28px, 4vw, 44px);
      color: #e9e4da; text-shadow: 0 2px 18px rgba(0,0,0,0.6);
    }
    .hud .sub {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
      color: #ffb35c; margin-top: 4px;
    }
    .clock {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 18px; margin-top: 14px; color: #e9e4da;
    }
    .weather { font-style: italic; font-size: 14px; color: #cfc8b8; margin-top: 4px; }
    .pill {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      z-index: 6;
      display: flex; align-items: center; gap: 16px;
      background: rgba(12, 14, 22, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(233,228,218,0.14);
      border-radius: 999px;
      padding: 10px 18px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      transition: opacity 600ms ease;
    }
    .pill.idle { opacity: 0.35; }
    .pill label {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #e9e4da;
    }
    .pill input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 140px; height: 3px; background: rgba(233,228,218,0.25); outline: none;
    }
    .pill input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #ffb35c; border: 0; cursor: pointer;
    }
    .pill button {
      font: 10px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.18em; text-transform: uppercase;
      background: transparent; color: #e9e4da;
      border: 1px solid rgba(233,228,218,0.35);
      border-radius: 999px; padding: 8px 14px; cursor: pointer;
    }
    .pill button:hover { background: #ffb35c; color: #05070f; border-color: #ffb35c; }
    @media (prefers-reduced-motion: reduce) {
      .lamp, .glow { animation: none; }
    }
  </style>
</head>
<body>
  <div id="view">
    <canvas id="glass"></canvas>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <svg class="lamp" viewBox="0 0 120 180" aria-hidden="true">
    <defs>
      <radialGradient id="bulb" cx="50%" cy="42%" r="50%">
        <stop offset="0%" stop-color="#fff6d8"/>
        <stop offset="70%" stop-color="#ffb35c" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#ffb35c" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffd9a3"/>
        <stop offset="100%" stop-color="#ff9b3c"/>
      </linearGradient>
    </defs>
    <ellipse cx="60" cy="78" rx="42" ry="28" fill="url(#bulb)"/>
    <polygon points="28,18 92,18 108,62 12,62" fill="url(#shade)"/>
    <rect x="56" y="62" width="8" height="72" fill="#2a2218"/>
    <ellipse cx="60" cy="142" rx="22" ry="6" fill="#1a140e"/>
    <rect x="40" y="138" width="40" height="8" rx="2" fill="#2a2218"/>
  </svg>
  <div class="hud">
    <h1>Night Window</h1>
    <p class="sub">Looking out · rainy night</p>
    <p class="clock" id="clock">00:00:00</p>
    <p class="weather" id="weather">A steady rain on the pane</p>
  </div>
  <div class="pill" id="pill">
    <label for="intensity">Rain</label>
    <input type="range" id="intensity" min="0" max="100" value="55">
    <button type="button" id="wipe">Wipe all</button>
  </div>
  <script>
(function () {
  "use strict";
  if (typeof window === "undefined" || typeof document === "undefined") return;
  function qs(sel, root) {
    try { return (root || document).querySelector(sel); } catch (e) { return null; }
  }
  function init() {
    var canvas = qs("#glass");
    var clockEl = qs("#clock");
    var weatherEl = qs("#weather");
    var intensityEl = qs("#intensity");
    var wipeBtn = qs("#wipe");
    var pill = qs("#pill");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    var reduced = false;
    if (typeof window.matchMedia === "function") {
      try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    }
    var dpr = 1, W = 0, H = 0;
    var city = document.createElement("canvas");
    var cityCtx = city.getContext("2d");
    var sky = document.createElement("canvas");
    var skyCtx = sky.getContext("2d");
    var fog = document.createElement("canvas");
    var fogCtx = fog.getContext("2d");
    if (!cityCtx || !skyCtx || !fogCtx) return;
    var sprites = [];
    var lights = [];
    var streaks = [];
    var drops = [];
    var beads = [];
    var last = 0;
    var idleT = 0;
    var wipeX = -1;
    var pointer = { x: 0, y: 0, px: 0, py: 0, down: false };
    var COLORS = [
      [255,178,82], [255,233,190], [110,180,255],
      [255,96,140], [90,240,190], [200,120,255],
      [255,178,82], [255,233,190]
    ];

    function makeSprite(rgb) {
      var s = document.createElement("canvas");
      s.width = 48; s.height = 48;
      var c = s.getContext("2d");
      if (!c) return s;
      var g = c.createRadialGradient(24, 24, 0, 24, 24, 24);
      g.addColorStop(0, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",1)");
      g.addColorStop(0.35, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.55)");
      g.addColorStop(1, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
      c.fillStyle = g;
      c.fillRect(0, 0, 48, 48);
      return s;
    }

    function size() {
      var w = window.innerWidth || 800;
      var h = window.innerHeight || 600;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      while (w * h * dpr * dpr > 7000000 && dpr > 0.75) dpr *= 0.85;
      W = Math.max(1, Math.floor(w * dpr));
      H = Math.max(1, Math.floor(h * dpr));
      canvas.width = W; canvas.height = H;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      city.width = Math.max(1, Math.floor(W * 0.5));
      city.height = Math.max(1, Math.floor(H * 0.5));
      sky.width = Math.max(1, Math.floor(W * 0.5));
      sky.height = Math.max(1, Math.floor(H * 0.5));
      fog.width = W; fog.height = H;
      buildCity();
      fillFog(true);
    }

    function buildCity() {
      if (!skyCtx || !cityCtx) return;
      var cw = city.width, ch = city.height;
      skyCtx.clearRect(0, 0, cw, ch);
      var g = skyCtx.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, "#04060f");
      g.addColorStop(0.42, "#0b1024");
      g.addColorStop(0.78, "#2a1b2c");
      g.addColorStop(1, "#3a2418");
      skyCtx.fillStyle = g;
      skyCtx.fillRect(0, 0, cw, ch);
      try { skyCtx.filter = "blur(3px)"; } catch (e) {}
      var x = 0;
      while (x < cw) {
        var bw = 18 + Math.random() * 42;
        var bh = 40 + Math.random() * (ch * 0.55);
        var shade = 8 + Math.floor(Math.random() * 11);
        skyCtx.fillStyle = "rgb(" + shade + "," + shade + "," + (shade + 2) + ")";
        skyCtx.fillRect(x, ch - bh, bw, bh);
        x += bw + 2 + Math.random() * 10;
      }
      try { skyCtx.filter = "none"; } catch (e2) {}
      cityCtx.drawImage(sky, 0, 0);
      lights = [];
      streaks = [];
      sprites = COLORS.map(makeSprite);
      var lx = 0;
      while (lx < cw) {
        var bw2 = 20 + Math.random() * 40;
        var bh2 = 50 + Math.random() * (ch * 0.5);
        var bx = lx, by = ch - bh2;
        if (Math.random() > 0.18) {
          for (var wy = by + 8; wy < ch - 8; wy += 18) {
            for (var wx = bx + 4; wx < bx + bw2 - 4; wx += 14) {
              if (Math.random() > 0.45) {
                lights.push({
                  x: wx, y: wy, r: 2.2 + Math.random() * 1.6,
                  c: Math.floor(Math.random() * sprites.length),
                  p: Math.random() * Math.PI * 2, k: 0.6 + Math.random() * 1.4,
                  flick: Math.random()
                });
              }
            }
          }
        }
        lx += bw2 + 4;
      }
      var i;
      for (i = 0; i < 46; i++) {
        lights.push({
          x: Math.random() * cw,
          y: ch * 0.62 + Math.random() * ch * 0.32,
          r: 9 + Math.random() * 17,
          c: Math.floor(Math.random() * sprites.length),
          p: Math.random() * 6.28, k: 0.4 + Math.random() * 0.8, flick: Math.random()
        });
      }
      for (i = 0; i < 12; i++) {
        lights.push({
          x: Math.random() * cw,
          y: Math.random() * ch * 0.35,
          r: 6 + Math.random() * 10,
          c: 2 + (i % 4),
          p: Math.random() * 6.28, k: 0.3 + Math.random(), flick: 0.2
        });
      }
      for (i = 0; i < 70; i++) {
        streaks.push({
          x: Math.random() * cw,
          y: Math.random() * ch,
          l: 18 + Math.random() * 40,
          s: 40 + Math.random() * 90
        });
      }
    }

    function fillFog(full) {
      if (!fogCtx) return;
      fogCtx.globalCompositeOperation = "source-over";
      var g = fogCtx.createRadialGradient(W * 0.5, H * 0.45, H * 0.1, W * 0.5, H * 0.45, H * 0.85);
      g.addColorStop(0, "rgba(206,219,232,0.55)");
      g.addColorStop(1, "rgba(206,219,232,1)");
      fogCtx.fillStyle = full ? g : "rgba(206,219,232,0.0045)";
      if (full) fogCtx.fillRect(0, 0, W, H);
      else fogCtx.fillRect(0, 0, W, H);
    }

    function weatherText(v) {
      if (v < 12) return "A hush. The glass barely beads.";
      if (v < 35) return "A light drizzle on the pane";
      if (v < 65) return "A steady rain on the pane";
      if (v < 85) return "Heavy rain stitching the glass";
      return "A downpour, the city a smear of light";
    }

    function spawnBead() {
      beads.push({
        x: 20 + Math.random() * (W - 40),
        y: 20 + Math.random() * (H * 0.55),
        r: 1.2 + Math.random() * 2.2,
        rel: 4.6 + Math.random() * 2.9,
        vx: 0, vy: 0, moving: false
      });
    }

    function spawnDrop(x, y, r) {
      drops.push({
        x: x, y: y, r: r || (5 + Math.random() * 4),
        vx: (Math.random() - 0.5) * 12,
        vy: 20 + Math.random() * 30,
        mass: 1
      });
    }

    function absorb(a, b) {
      var area = Math.PI * a.r * a.r + Math.PI * b.r * b.r;
      a.r = Math.sqrt(area / Math.PI);
      a.x = (a.x * a.r + b.x * b.r) / (a.r + b.r);
    }

    function clearFogPath(x, y, r) {
      if (!fogCtx) return;
      fogCtx.globalCompositeOperation = "destination-out";
      fogCtx.fillStyle = "rgba(0,0,0,0.85)";
      fogCtx.beginPath();
      fogCtx.ellipse(x, y, r * 0.55, r * 1.4, 0, 0, Math.PI * 2);
      fogCtx.fill();
      fogCtx.globalCompositeOperation = "source-over";
    }

    function wipeBrush(x, y, px, py) {
      if (!fogCtx) return;
      var rad = Math.min(W, H) * 0.06;
      fogCtx.globalCompositeOperation = "destination-out";
      var steps = Math.max(1, Math.ceil(Math.hypot(x - px, y - py) / (rad * 0.35)));
      for (var i = 0; i <= steps; i++) {
        var t = i / steps;
        var ix = px + (x - px) * t;
        var iy = py + (y - py) * t;
        var g = fogCtx.createRadialGradient(ix, iy, 0, ix, iy, rad);
        g.addColorStop(0, "rgba(0,0,0,0.85)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        fogCtx.fillStyle = g;
        fogCtx.beginPath();
        fogCtx.arc(ix, iy, rad, 0, Math.PI * 2);
        fogCtx.fill();
      }
      fogCtx.globalCompositeOperation = "source-over";
      var i2;
      for (i2 = beads.length - 1; i2 >= 0; i2--) {
        if (Math.hypot(beads[i2].x - x, beads[i2].y - y) < rad) beads.splice(i2, 1);
      }
    }

    function drawDrop(d) {
      var r = d.r;
      var stretch = 1 + Math.min(0.7, Math.abs(d.vy) * 0.008);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, r, r * stretch, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.scale(1, -1);
      var srcW = city.width / 2.3;
      var srcH = city.height / 2.3;
      var sx = (d.x / W) * city.width - srcW / 2;
      var sy = (1 - d.y / H) * city.height - srcH / 2;
      ctx.drawImage(city, sx, sy, srcW, srcH, -r * 1.2, -r * stretch * 1.2, r * 2.4, r * stretch * 2.4);
      ctx.restore();
      var g = ctx.createRadialGradient(d.x, d.y, r * 0.2, d.x, d.y, r);
      g.addColorStop(0, "rgba(255,255,255,0.08)");
      g.addColorStop(0.7, "rgba(255,255,255,0)");
      g.addColorStop(1, "rgba(0,0,0,0.42)");
      ctx.fillStyle = g;
      ctx.fillRect(d.x - r, d.y - r * stretch, r * 2, r * stretch * 2);
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.ellipse(d.x - r * 0.35, d.y - r * stretch * 0.4, r * 0.22, r * 0.12, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "rgba(10,16,24,0.22)";
      ctx.beginPath();
      ctx.ellipse(d.x + 1, d.y + r * stretch + 2, r * 0.7, r * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBead(b) {
      if (b.r < 2.4) {
        ctx.fillStyle = "rgba(210,225,240,0.55)";
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2); ctx.fill();
        return;
      }
      drawDrop(b);
    }

    function loop(now) {
      var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
      last = now;
      var intensity = intensityEl ? parseFloat(intensityEl.value) : 55;
      var rate = 4 + intensity * 0.22;
      var n;
      for (n = 0; n < rate * dt; n++) spawnBead();
      while (beads.length > 420) beads.shift();

      cityCtx.drawImage(sky, 0, 0);
      var t = now / 1000;
      var li;
      for (li = 0; li < lights.length; li++) {
        var L = lights[li];
        var tw = reduced ? 0.85 : (0.65 + 0.35 * Math.sin(t * L.k + L.p));
        if (!reduced && L.flick > 0.92 && Math.random() < 0.02) tw *= 0.2;
        cityCtx.globalAlpha = tw;
        var sp = sprites[L.c];
        if (sp) cityCtx.drawImage(sp, L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
      }
      cityCtx.globalAlpha = 1;
      cityCtx.strokeStyle = "rgba(180,200,220,0.08)";
      cityCtx.lineWidth = 1;
      for (li = 0; li < streaks.length; li++) {
        var S = streaks[li];
        S.y += S.s * dt;
        if (S.y > city.height + 20) { S.y = -20; S.x = Math.random() * city.width; }
        cityCtx.beginPath();
        cityCtx.moveTo(S.x, S.y);
        cityCtx.lineTo(S.x + 4, S.y + S.l);
        cityCtx.stroke();
      }

      var i;
      for (i = beads.length - 1; i >= 0; i--) {
        var b = beads[i];
        if (!b.moving) {
          b.r += dt * (0.15 + Math.random() * 0.4);
          if (b.r > b.rel) {
            drops.push({ x: b.x, y: b.y, r: b.r, vx: (Math.random() - 0.5) * 8, vy: 12, mass: 1 });
            beads.splice(i, 1);
          }
        }
      }
      for (i = drops.length - 1; i >= 0; i--) {
        var d = drops[i];
        d.vy += 180 * dt;
        var term = 90 + d.r * 18;
        if (d.vy > term) d.vy = term;
        d.vx += Math.sin(t * 3 + i) * 18 * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        d.r -= dt * 0.55;
        if (Math.random() < dt * 6 && d.r > 3) {
          beads.push({ x: d.x + (Math.random() - 0.5) * 6, y: d.y - 4, r: 1.1 + Math.random(), rel: 5, vx: 0, vy: 0, moving: false });
        }
        clearFogPath(d.x, d.y, d.r);
        var j;
        for (j = beads.length - 1; j >= 0; j--) {
          var bb = beads[j];
          if (Math.hypot(bb.x - d.x, bb.y - d.y) < d.r + bb.r) {
            absorb(d, bb);
            beads.splice(j, 1);
          }
        }
        for (j = drops.length - 1; j >= 0; j--) {
          if (j === i) continue;
          var od = drops[j];
          if (Math.hypot(od.x - d.x, od.y - d.y) < d.r + od.r) {
            absorb(d, od);
            drops.splice(j, 1);
            if (j < i) i--;
          }
        }
        if (d.r < 2.4) {
          beads.push({ x: d.x, y: d.y, r: d.r, rel: 5.5, vx: 0, vy: 0, moving: false });
          drops.splice(i, 1);
        } else if (d.y > H + 20) {
          drops.splice(i, 1);
        }
      }

      fillFog(false);
      if (wipeX >= 0) {
        wipeX += W * dt * 1.6;
        fogCtx.globalCompositeOperation = "destination-out";
        fogCtx.fillStyle = "#000";
        fogCtx.fillRect(0, 0, wipeX, H);
        fogCtx.globalCompositeOperation = "source-over";
        drops = drops.filter(function (d) { return d.x > wipeX; });
        beads = beads.filter(function (b) { return b.x > wipeX; });
        if (wipeX > W) wipeX = -1;
      }

      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(city, 0, 0, W, H);
      ctx.globalAlpha = 0.7;
      ctx.drawImage(fog, 0, 0);
      ctx.globalAlpha = 1;
      for (i = 0; i < beads.length; i++) drawBead(beads[i]);
      for (i = 0; i < drops.length; i++) drawDrop(drops[i]);

      if (clockEl) {
        var nowD = new Date();
        var hh = String(nowD.getHours()).padStart(2, "0");
        var mm = String(nowD.getMinutes()).padStart(2, "0");
        var ss = String(nowD.getSeconds()).padStart(2, "0");
        clockEl.textContent = hh + ":" + mm + ":" + ss;
      }
      if (weatherEl) weatherEl.textContent = weatherText(intensity);
      if (pill && now - idleT > 2400) pill.classList.add("idle");

      if (typeof window.requestAnimationFrame === "function") {
        window.requestAnimationFrame(loop);
      }
    }

    canvas.addEventListener("pointermove", function (e) {
      var rect = canvas.getBoundingClientRect();
      var x = (e.clientX - rect.left) * dpr;
      var y = (e.clientY - rect.top) * dpr;
      wipeBrush(x, y, pointer.x || x, pointer.y || y);
      pointer.px = pointer.x; pointer.py = pointer.y;
      pointer.x = x; pointer.y = y;
      idleT = performance.now();
      if (pill) pill.classList.remove("idle");
    });
    canvas.addEventListener("click", function (e) {
      var rect = canvas.getBoundingClientRect();
      spawnDrop((e.clientX - rect.left) * dpr, (e.clientY - rect.top) * dpr, 7 + Math.random() * 4);
    });
    if (wipeBtn) wipeBtn.addEventListener("click", function () { wipeX = 0; });
    ["mousemove", "pointerdown"].forEach(function (ev) {
      window.addEventListener(ev, function () {
        idleT = performance.now();
        if (pill) pill.classList.remove("idle");
      });
    });
    window.addEventListener("resize", size);
    size();
    last = performance.now();
    idleT = last;
    if (typeof window.requestAnimationFrame === "function") {
      window.requestAnimationFrame(loop);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
