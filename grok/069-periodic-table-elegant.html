    }

      display: flex; align-items: center; gap: 8px;
      background: rgba(30,37,52,.8); border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px; padding: 6px 12px; min-width: 220px;
    }
    .search input {
      background: transparent; border: 0; color: #e8ecf4; outline: none; width: 180px; font-size: 13px;
    }
    .seg { display: flex; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; overflow: hidden; }
    .seg button {
      background: transparent; color: #c5cde0; border: 0; padding: 7px 12px;
      font-size: 12px; letter-spacing: .08em; cursor: pointer;
    }
    .seg button.on { background: #e8ecf4; color: #1b2130; }
    .temp { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; color: #8b95a8; }
    .temp input { width: 160px; }
    .wrap {
      max-width: 1280px; margin: 0 auto; overflow-x: auto;
    }
    .table {
      display: grid;
      grid-template-columns: repeat(18, minmax(46px, 1fr));
      grid-template-rows: repeat(7, auto) 14px repeat(2, auto);
      gap: 4px;
      min-width: 920px;
      position: relative;
    }
    .tile {
      position: relative;
      background: color-mix(in srgb, var(--c) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
      border-radius: 4px;
      padding: 6px 5px 8px;
      text-align: center;
      color: #e8ecf4;
      cursor: pointer;
      grid-column: var(--col);
      grid-row: var(--row);
      transition: transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s cubic-bezier(.22,1,.36,1);
      min-height: 64px;
    }

      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
      background: var(--c);
    }

      transform: translateY(-5px) scale(1.07);
      box-shadow: 0 16px 28px rgba(0,0,0,.35);
      outline: 1px solid var(--c);
      z-index: 3;

    .tile .sym { font-family: Georgia, "Iowan Old Style", Palatino, serif; font-size: clamp(14px, 1.6vw, 20px); display: block; margin-top: 8px; }

    .ph {
      border: 1px dashed rgba(255,255,255,.2); border-radius: 4px;
      color: #8b95a8; font-size: 10px; display: flex; align-items: center; justify-content: center;
      min-height: 64px;
    }
    .detail {
      grid-column: 3 / 13; grid-row: 1 / 4;
      background: rgba(30,37,52,.92); backdrop-filter: blur(12px);
      border-radius: 12px; padding: 14px 16px;
      display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center;
      aspect-ratio: 3.15;
      min-height: 0;
    }
    .bohr { width: 100%; height: auto; }
    .shell { transform-origin: 100px 100px; animation: spin 6s linear infinite; }
    .shell:nth-child(odd) { animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta h3 {
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-size: 42px; line-height: 1; color: var(--ec, #8fa3b8);
    }
    .meta .name { font-size: 18px; margin: 4px 0; }
    .meta .cat { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: #8b95a8; }
    .meta dl { display: grid; grid-template-columns: 120px 1fr; gap: 4px 8px; margin-top: 10px; font-size: 12px; }
    .meta dt { color: #8b95a8; }
    .state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; max-width: 1280px; margin: 14px auto 0; }
    .chip {
      border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
      background: color-mix(in srgb, var(--c) 16%, transparent);
      color: #e8ecf4; border-radius: 999px; padding: 4px 10px; font-size: 11px; letter-spacing: .06em; cursor: pointer;
    }
    .chip[aria-pressed="true"] { outline: 1px solid #fff; }
    footer.count { max-width: 1280px; margin: 12px auto 0; color: #8b95a8; font-size: 12px; letter-spacing: .06em; }
    @media (max-width: 900px) {
      .tile .nm { display: none; }
      .detail {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto;
        grid-column: auto; grid-row: auto; aspect-ratio: auto;
        z-index: 20; border-radius: 16px 16px 0 0;
        transform: translateY(110%); transition: transform .35s ease;
        max-height: 70vh; overflow: auto;
      }
      .detail.open { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
      .shell { animation: none !important; }
    }
  </style>

          "<dt>Electrons</dt><dd>" + el[0] + " · " + sh.join(" / ") + "</dd>" +
          "<dt>Melting</dt><dd>" + (el[5] == null ? "—" : el[5] + " K") + "</dd>" +
          "<dt>Boiling</dt><dd>" + (el[6] == null ? "—" : el[6] + " K") + "</dd>" +
          "<dt>State at " + T + " K</dt><dd><span class=\"state-dot\" style=\"background:" + stCol + ";color:" + stCol + "\"></span>" + st + "</dd>" +
          "</dl></div>";
        if (window.innerWidth <= 900) detail.classList.add("open");
      }
      tiles.forEach(function (t) {
        t.btn.addEventListener("click", function (ev) {
          ev.stopPropagation();
          show(t.el[0]);
        });
      });
      document.addEventListener("click", function (ev) {
        if (window.innerWidth <= 900 && detail.classList.contains("open") && !detail.contains(ev.target)) {
          detail.classList.remove("open");
        }
      });
      if (q) q.addEventListener("input", function () {
        var s = q.value.trim().toLowerCase();
        var n = 0;
        tiles.forEach(function (t) {
          var name = t.el[2].toLowerCase();
          var sym = t.el[1].toLowerCase();
          var zs = String(t.el[0]);
          var ok = !s || name.indexOf(s) !== -1 || sym === s || (sym.indexOf(s) === 0 && s.length <= 2) || zs === s;
          t.btn.classList.toggle("dim", !ok);
          if (ok) n++;
        });
        if (count) count.textContent = n + " element" + (n === 1 ? "" : "s");
      });
      qs("#mode") && qsaSafe("#mode button").forEach(function (b) {
        b.addEventListener("click", function () {
          qsaSafe("#mode button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          mode = b.getAttribute("data-mode") || "category";
          if (mode === "category" && legend) {
            legend.innerHTML = "";
            Object.keys(CATS).forEach(function (k) {
              var c = document.createElement("button");
              c.type = "button"; c.className = "chip";
              c.style.setProperty("--c", CATS[k].c);
              c.textContent = CATS[k].l;
              c.addEventListener("mouseenter", function () { highlight(k); });
              c.addEventListener("mouseleave", function () { highlight(pin); });
              c.addEventListener("click", function () { pin = pin === k ? null : k; highlight(pin); });
              legend.appendChild(c);
            });
          }
          colourTiles();
        });
      });
      function qsaSafe(sel) {
        try { return Array.prototype.slice.call(document.querySelectorAll(sel)); } catch (e) { return []; }
      }
      if (temp) temp.addEventListener("input", function () {
        T = parseInt(temp.value, 10) || 293;
        if (tempOut) tempOut.textContent = T + " K";
        mode = "state";
        qsaSafe("#mode button").forEach(function (b) {
          b.classList.toggle("on", b.getAttribute("data-mode") === "state");
        });
        colourTiles();
        show(selected);
      });
      show(1);
      colourTiles();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
