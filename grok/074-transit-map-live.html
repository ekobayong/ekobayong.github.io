<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vellmar Metro</title>
  <style>
    :root {
      --bg: #f5f2ea;
      --panel: #ebe7dc;
      --ink: #1b1e24;
      --muted: #5a5f6b;
      --rule: #d5d0c4;
      --river: #cfe3ec;
      --station: #ffffff;
      --station-stroke: #1b1e24;
      --good: #1e9e5a;
      --delay: #f0a020;
      --crimson: #d9363e;
      --cobalt: #1f6fd6;
      --emerald: #1e9e5a;
      --amber: #f0a020;
      --violet: #7b4fbf;
      --slate: #3a8c96;
    }
    html.night {
      --bg: #0f1318;
      --panel: #151a21;
      --ink: #e9ecf1;
      --muted: #9aa3b2;
      --rule: #252c36;
      --river: #17232e;
      --station: #151a21;
      --station-stroke: #e9ecf1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      background: var(--bg);
      color: var(--ink);
      transition: background 0.5s ease, color 0.5s ease;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--rule);
      gap: 1rem;
    }
    .wordmark { font-weight: 700; font-size: 1.25rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.55rem; }
    .leg {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.78rem; cursor: pointer; background: none; border: 0; color: inherit; font-weight: 500;
    }
    .pip { width: 14px; height: 6px; border-radius: 3px; }
    .night-btn {
      border: 1px solid var(--rule);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: calc(100vh - 62px);
    }
    .map-wrap {
      background: var(--panel);
      padding: 1rem;
      transition: background 0.5s ease;
    }
    #map { width: 100%; height: auto; display: block; aspect-ratio: 1000 / 740; }
    aside {
      border-left: 1px solid var(--rule);
      padding: 1.1rem 1.15rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .card {
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 0.9rem 0.95rem;
      transition: background 0.5s ease, border-color 0.5s ease;
    }
    .ph {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }
    #stationName { font-weight: 700; font-size: 1.15rem; margin-bottom: 0.35rem; }
    .calling { display: flex; gap: 0.3rem; margin-bottom: 0.7rem; min-height: 10px; }
    .arr { list-style: none; }
    .arr li {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.38rem 0;
      border-top: 1px solid var(--rule);
      font-size: 0.86rem;
    }
    .eta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .eta.due { color: var(--good); font-weight: 700; }
    .status-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.4rem 0; border-top: 1px solid var(--rule); font-size: 0.9rem;
      cursor: pointer;
    }
    .badge {
      font-size: 0.68rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      background: rgba(30,158,90,0.14);
      color: var(--good);
    }
    .badge.delay {
      background: rgba(240,160,32,0.18);
      color: var(--delay);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      fill: var(--ink);
    }
    .hint { color: var(--muted); font-size: 0.85rem; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--rule); }
    }
    @media (prefers-reduced-motion: reduce) {
      .badge.delay { animation: none; }
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">Vellmar Metro</div>
    <div class="legend" id="legend"></div>
    <button type="button" class="night-btn" id="nightBtn">Night mode</button>
  </header>
  <div class="layout">
    <div class="map-wrap">

        <ul class="arr" id="arrList"></ul>
      </section>
      <section class="card">
        <div class="ph">Service status</div>
        <div id="statusList"></div>
      </section>
      <p class="hint">Hover a line to isolate it. Click a station for live arrivals. Delayed lines run at 45% speed.</p>

            var p = document.createElement("span");
            p.className = "pip";
            p.style.background = COLORS[id];
            calling.appendChild(p);
          });
        }
        refreshArrivals();
      }
      function nearestAhead(tr) {
        var arr = lineStations[tr.line];
        var best = null, i, item, ds;
        for (i = 0; i < arr.length; i++) {
          item = arr[i];
          ds = (item.s - tr.s) * tr.dir;
          if (ds < -2) ds += pathEls[tr.line].getTotalLength();
          if (ds >= -1) {
            if (!best || ds < best.ds) best = { st: item.st, s: item.s, ds: ds, term: i === 0 || i === arr.length - 1 };
          }
        }
        return best;
      }
      function refreshArrivals() {
        var list = qs("#arrList");
        if (!list || !selected) return;
        var rows = [];
        trains.forEach(function (tr) {
          if (selected.lines.indexOf(tr.line) === -1) return;
          var nxt = nearestAhead(tr);
          if (!nxt || nxt.st.name !== selected.name) return;
          var speed = delayed[tr.line] ? 62 * 0.45 : 62;
          if (reduce) speed *= 0.55;
          var eta = nxt.ds / speed + tr.dwell;
          var dest;
          if (selected.name === tr.dest) dest = "Terminates here";
          else dest = "towards " + tr.dest;
          rows.push({ line: tr.line, dest: dest, eta: eta, delay: !!delayed[tr.line] });
        });
        rows.sort(function (a, b) { return a.eta - b.eta; });
        list.innerHTML = "";
        rows.slice(0, 6).forEach(function (r) {
          var li = document.createElement("li");
          var etaTxt, cls = "eta";
          if (r.eta < 3) { etaTxt = "Due"; cls += " due"; }
          else if (r.eta < 60) etaTxt = String(Math.round(r.eta)) + "s";
          else etaTxt = Math.floor(r.eta / 60) + ":" + ("0" + Math.round(r.eta % 60)).slice(-2);
          li.innerHTML = '<span class="pip" style="background:' + COLORS[r.line] + '"></span><span>' + r.line + " · " + r.dest + (r.delay ? " · delays" : "") + '</span><span class="' + cls + '">' + etaTxt + "</span>";
          list.appendChild(li);
        });
        if (!rows.length) {
          var empty = document.createElement("li");
          empty.textContent = "No trains approaching.";
          empty.style.gridColumn = "1 / -1";
          list.appendChild(empty);
        }
      }
      var last = 0, arrAcc = 0, delayIn = 18 + Math.random() * 22;
      function step(now) {
        var dt = Math.min(0.05, (now - (last || now)) / 1000);
        last = now;
        var hh = new Date();
        if (clock) clock.textContent = ("0" + hh.getHours()).slice(-2) + ":" + ("0" + hh.getMinutes()).slice(-2) + ":" + ("0" + hh.getSeconds()).slice(-2);
        trains.forEach(function (tr) {
          var len = pathEls[tr.line].getTotalLength();
          var speed = delayed[tr.line] ? 62 * 0.45 : 62;
          if (reduce) speed *= 0.55;
          var nxt = nearestAhead(tr);
          if (tr.dwell > 0) {
            tr.dwell -= dt;
          } else {
            tr.s += tr.dir * speed * dt;
            if (nxt && nxt.ds < 3) {
              tr.s = nxt.s;
              tr.dwell = (nxt.term ? 3.2 : 1.6) * (delayed[tr.line] ? 2 : 1);
              if (nxt.term) {
                tr.dir *= -1;
                var ln = lines.filter(function (L) { return L.id === tr.line; })[0];
                tr.dest = tr.dir > 0 ? ln.termB : ln.termA;
              }
            }
          }
          if (tr.s < 0) tr.s += len;
          if (tr.s > len) tr.s -= len;
          var pt = tr.path.getPointAtLength(tr.s);
          tr.el.setAttribute("cx", pt.x);
          tr.el.setAttribute("cy", pt.y);
          tr.halo.setAttribute("cx", pt.x);
          tr.halo.setAttribute("cy", pt.y);
        });
        delayIn -= dt;
        if (delayIn <= 0) {
          var pick = lines[(Math.random() * lines.length) | 0].id;
          delayed[pick] = true;
          renderStatus();
          window.setTimeout(function () {
            delayed[pick] = false;
            renderStatus();
          }, (14 + Math.random() * 16) * 1000);
          delayIn = 18 + Math.random() * 22;
        }
        arrAcc += dt;
        if (arrAcc > 0.25) { arrAcc = 0; if (selected) refreshArrivals(); }
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(step);
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(step);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
