<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Drift — Cherry Blossom Scene</title>
  <style>
    :root {
      --sky-top: #cfe3f5;
      --sky-mid: #f3dfe8;
      --sky-bot: #fbeee6;
      --blush: #f7c8d4;
      --deep: #e2698c;
      --indigo: #2f2b52;
      --gold: #e9c27a;
      --mist: #b9b3d1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 48%, var(--sky-bot));
      color: var(--indigo);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    .sun {
      position: fixed; width: 22vmin; height: 22vmin; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #fff6d8 0%, #f6d48a 42%, rgba(233, 194, 122, 0) 70%);
      left: var(--sun-x, 12%); top: var(--sun-y, 58%);
      pointer-events: none; z-index: 0;
    }
    .haze {
      position: fixed; left: 0; right: 0; bottom: 16%; height: 18%;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,252,248,.55) 50%, rgba(255,255,255,0));
      pointer-events: none; z-index: 1;
    }
    svg.land { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; }
    canvas#petals { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; }
    .haiku {
      position: fixed; top: 1.4rem; right: 1.3rem; z-index: 5;
      writing-mode: vertical-rl; font-style: italic;
      color: var(--indigo); letter-spacing: 0.28em; font-size: 1.05rem;
    }
    .haiku span { opacity: 0; display: inline; }
    .haiku span.on { opacity: 1; }
    .title {
      position: fixed; left: 1.2rem; bottom: 1.2rem; z-index: 5;
    }
    .title h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 400; }
    .title h1 i { color: var(--deep); font-style: italic; }
    .title p { font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; color: #5a5678; margin-top: 0.2rem; }
    .mark {
      position: fixed; right: 1rem; bottom: 0.4rem; z-index: 4;
      font-size: clamp(5rem, 18vw, 10rem); color: rgba(47,43,82,.08); pointer-events: none; line-height: 1;
    }
    .hint {
      position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%);
      z-index: 6; font-size: 0.82rem; color: #4a4668; background: rgba(255,255,255,.35);
      padding: 0.28rem 0.7rem; border-radius: 999px; white-space: nowrap;
    }
    .hint.gone { opacity: 0; pointer-events: none; }
    @media (max-width: 500px) {
      .hint { white-space: normal; max-width: 90vw; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .haiku span { opacity: 1; }
      .hint { transition: none; }
    }
  </style>
</head>
<body>
  <div class="sun" id="sun"></div>
  <div class="haze"></div>
  <svg class="land" viewBox="0 0 1000 600" preserveAspectRatio="xMinYMax slice" aria-hidden="true">
    <defs>
      <filter id="mistBlur"><feGaussianBlur stdDeviation="4.5"/></filter>
      <radialGradient id="p1" cx="35%" cy="30%"><stop offset="0%" stop-color="#fff3f6"/><stop offset="55%" stop-color="#f7c8d4"/><stop offset="100%" stop-color="#e2698c"/></radialGradient>
      <radialGradient id="p2" cx="35%" cy="30%"><stop offset="0%" stop-color="#fbe0e8"/><stop offset="55%" stop-color="#f1b3c4"/><stop offset="100%" stop-color="#c9527a"/></radialGradient>
      <radialGradient id="p3" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#fbd9e2"/><stop offset="100%" stop-color="#e98aa6"/></radialGradient>
      <filter id="softBloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    </defs>
    <g filter="url(#mistBlur)" opacity="0.85">
      <path d="M0 390 C140 350 220 370 340 355 C480 336 560 372 700 348 C820 330 900 360 1000 340 L1000 600 L0 600 Z" fill="#b9b3d1"/>
      <path d="M0 430 C180 400 300 420 480 405 C650 390 780 430 1000 410 L1000 600 L0 600 Z" fill="#a8a2c2"/>
    </g>
    <g fill="#8f88b3" opacity="0.85" filter="url(#mistBlur)" transform="translate(620,250) scale(0.9)">
      <rect x="70" y="86" width="52" height="58"/>
      <path d="M58 86 Q96 68 134 86 Z"/>
      <rect x="78" y="48" width="36" height="40"/>
      <path d="M66 48 Q96 32 126 48 Z"/>
      <rect x="86" y="18" width="20" height="32"/>
      <path d="M76 18 Q96 4 116 18 Z"/>
      <rect x="93" y="0" width="6" height="18"/>
    </g>
    <g id="branches" fill="none" stroke="#2f2b52" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 600 C70 430 90 320 160 220" stroke-width="28"/>
      <path d="M160 220 C210 170 250 150 320 110" stroke-width="14"/>
      <path d="M160 220 C120 160 90 130 40 90" stroke-width="10"/>
      <path d="M320 110 C360 90 410 95 470 70" stroke-width="8"/>
      <path d="M320 110 C300 70 280 40 250 10" stroke-width="7"/>
      <path d="M210 175 C250 155 280 170 330 150" stroke-width="6"/>
      <path d="M90 150 C60 110 30 90 10 50" stroke-width="5"/>
      <path d="M470 70 C510 50 540 60 580 40" stroke-width="4"/>
      <path d="M720 600 C700 470 740 360 820 300" stroke-width="18"/>
      <path d="M820 300 C860 270 900 250 950 210" stroke-width="8"/>
      <path d="M820 300 C780 250 760 220 730 180" stroke-width="7"/>
      <path d="M900 250 C920 220 940 210 980 180" stroke-width="4"/>
    </g>
    <g id="bloomsBack" filter="url(#softBloom)"></g>
    <g id="bloomsFront"></g>
  </svg>
  <canvas id="petals"></canvas>
  <p class="haiku" id="haiku" aria-label="petals let go first the branch remembers nothing the river keeps all"></p>
  <div class="title">
    <h1>Sakura <i>Drift</i></h1>
    <p>A quiet Japanese spring afternoon</p>
  </div>
  <div class="mark">桜</div>
  <p class="hint" id="hint">Move to stir the breeze · click for a gust</p>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    var ANCHORS = [
      [40,90],[90,150],[160,220],[210,175],[250,10],[280,40],[320,110],[330,150],
      [360,90],[410,95],[470,70],[510,50],[540,60],[580,40],[120,160],[70,430],
      [730,180],[760,220],[820,300],[860,270],[900,250],[920,220],[950,210],[980,180],
      [740,360],[700,470],[250,150],[280,170],[40,50],[10,50]
    ];
    var HAIKU = "petals let go first / the branch remembers nothing / the river keeps all";
    function lerp(a, b, t) { return a + (b - a) * t; }
    function hexToRgb(h) {
      return { r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) };
    }
    function mixHex(a, b, t) {
      var A = hexToRgb(a), B = hexToRgb(b);
      return "rgb(" + Math.round(lerp(A.r, B.r, t)) + "," + Math.round(lerp(A.g, B.g, t)) + "," + Math.round(lerp(A.b, B.b, t)) + ")";
    }
    function init() {
      var canvas = qs("#petals");
      var sun = qs("#sun");
      var haiku = qs("#haiku");
      var hint = qs("#hint");
      var back = qs("#bloomsBack");
      var front = qs("#bloomsFront");
      if (!canvas || !sun || !haiku || !hint || !back || !front) return;
      var ns = "http://www.w3.org/2000/svg";
      var reduce = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var i, k;
      for (i = 0; i < ANCHORS.length; i++) {
        var n = 4 + (i % 4);
        for (k = 0; k < n; k++) {
          var c = document.createElementNS(ns, "circle");
          var r = 2.6 + (k * 0.9 + i % 3) * 0.7;
          if (r > 6.2) r = 6.2;
          c.setAttribute("cx", String(ANCHORS[i][0] + (k - 2) * 6 + (i % 5) - 2));
          c.setAttribute("cy", String(ANCHORS[i][1] + ((k * 7) % 11) - 5));
          c.setAttribute("r", r.toFixed(2));
          c.setAttribute("fill", "url(#p" + ((i + k) % 3 + 1) + ")");
          if (k % 3 !== 0) back.appendChild(c);
          else front.appendChild(c);
        }
        if (i % 5 === 0) {
          var e = document.createElementNS(ns, "ellipse");
          e.setAttribute("cx", String(ANCHORS[i][0] + 8));
          e.setAttribute("cy", String(ANCHORS[i][1] - 6));
          e.setAttribute("rx", "5"); e.setAttribute("ry", "3.2");
          e.setAttribute("fill", "#ffffff"); e.setAttribute("opacity", "0.7");
          e.setAttribute("transform", "rotate(-30 " + ANCHORS[i][0] + " " + ANCHORS[i][1] + ")");
          front.appendChild(e);
        }
      }
      var glyphs = HAIKU.split("");
      glyphs.forEach(function (ch) {
        var s = document.createElement("span");
        s.textContent = ch === " " ? " " : ch;
        haiku.appendChild(s);
      });
      var spans = haiku.querySelectorAll("span");
      if (reduce) {
        for (i = 0; i < spans.length; i++) spans[i].classList.add("on");
      } else {
        i = 0;
        function typeH() {
          if (i >= spans.length) return;
          spans[i].classList.add("on");
          i++;
          setTimeout(typeH, 55);
        }
        typeH();
      }
      var ctx = canvas.getContext ? canvas.getContext("2d") : null;
      if (!ctx) return;
      var W = 1, H = 1, dpr = 1;
      var petals = [];
      var gust = { x: 0, y: 0, e: 0 };
      var ptr = { x: 0, y: 0, vx: 0, vy: 0, px: 0, py: 0 };
      var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth || 800;
        H = window.innerHeight || 600;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
      }
      resize();
      window.addEventListener("resize", resize);
      function makePetal(fromCanopy) {
        return {
          x: fromCanopy ? (80 + Math.random() * W * 0.45) : Math.random() * W,
          y: fromCanopy ? (40 + Math.random() * H * 0.28) : Math.random() * H,
          z: 0.35 + Math.random() * 0.8,
          rot: Math.random() * Math.PI * 2,
          rv: (Math.random() - 0.5) * 0.04,
          ph: Math.random() * Math.PI * 2,
          flip: Math.random() * Math.PI * 2,
          fv: 0.02 + Math.random() * 0.03,
          float: false,
          c1: Math.random() > 0.5 ? "#fbe0e8" : "#f7c8d4",
          c2: Math.random() > 0.5 ? "#f0a3b9" : "#e2698c"
        };
      }
      var count = reduce ? 40 : 145;
      for (i = 0; i < count; i++) petals.push(makePetal(false));
      function drawPetal(p) {
        var s = 7 + p.z * 10;
        var w = s * Math.abs(Math.cos(p.flip));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(w / s, 1);
        ctx.globalAlpha = 0.35 + p.z * 0.5;
        var g = ctx.createLinearGradient(0, -s, 0, s);
        g.addColorStop(0, p.c1);
        g.addColorStop(1, p.c2);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.bezierCurveTo(s * 0.7, -s * 0.3, s * 0.55, s * 0.4, 0, s);
        ctx.bezierCurveTo(-s * 0.55, s * 0.4, -s * 0.7, -s * 0.3, 0, -s);
        ctx.fill();
        ctx.restore();
      }
      function skyCycle(t) {
        var u = (Math.sin(t / 90 * Math.PI * 2 - Math.PI / 2) + 1) / 2;
        document.documentElement.style.setProperty("--sky-top", mixHex("#cfe3f5", "#e9c9a8", u));
        document.documentElement.style.setProperty("--sky-mid", mixHex("#f3dfe8", "#f6d9b4", u));
        document.documentElement.style.setProperty("--sky-bot", mixHex("#fbeee6", "#fbe5c9", u));
        var ang = lerp(0.15, 1.15, u);
        sun.style.setProperty("--sun-x", (8 + u * 62) + "%");
        sun.style.setProperty("--sun-y", (62 - Math.sin(ang) * 42) + "%");
        sun.style.opacity = String(0.7 + u * 0.35);
        return u;
      }
      function frame(now) {
        var t = ((now || 0) - t0) / 1000;
        var golden = reduce ? 0.4 : skyCycle(t);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        var riverY = H * 0.83;
        var rg = ctx.createLinearGradient(0, riverY, 0, H);
        rg.addColorStop(0, golden > 0.5 ? "#d9b8b4" : "#c5cdd8");
        rg.addColorStop(1, "#5e628c");
        ctx.fillStyle = rg;
        ctx.fillRect(0, riverY, W, H - riverY);
        var glow = ctx.createRadialGradient(W * 0.18, riverY, 10, W * 0.18, riverY, W * 0.28);
        glow.addColorStop(0, "rgba(226,105,140,0.28)");
        glow.addColorStop(1, "rgba(226,105,140,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, riverY, W * 0.5, H - riverY);
        ctx.strokeStyle = "rgba(255,255,255,0.22)";
        var r;
        for (r = 0; r < 9; r++) {
          ctx.globalAlpha = 0.22 - r * 0.02;
          ctx.beginPath();
          var y = riverY + 8 + r * ((H - riverY) / 10);
          ctx.moveTo(0, y);
          var x;
          for (x = 0; x <= W; x += 12) ctx.lineTo(x, y + Math.sin(x * 0.02 + t * 0.8 + r) * 3.2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        var sunX = W * (0.08 + golden * 0.62);
        ctx.strokeStyle = "rgba(255,246,200,0.55)";
        ctx.lineWidth = 1.2;
        for (r = 0; r < 12; r++) {
          var gx = sunX + (r - 6) * 10;
          var gy = riverY + 18 + Math.sin(t * 3 + r) * 4;
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          ctx.lineTo(gx + 7, gy);
          ctx.stroke();
        }
        gust.e *= Math.exp(-0.016 / 0.9);
        ptr.vx *= 0.86; ptr.vy *= 0.86;
        for (i = 0; i < petals.length; i++) {
          var p = petals[i];
          if (!reduce) {
            var dx = p.x - ptr.x, dy = p.y - ptr.y;
            var dist = Math.hypot(dx, dy);
            if (dist < 180 && dist > 1) {
              var f = (1 - dist / 180) * 0.12;
              p.x += ptr.vx * f;
              p.y += ptr.vy * f - 0.15 * f;
            }
            p.x += gust.x * gust.e * (0.4 + p.z);
            p.y += gust.y * gust.e * 0.2;
            if (p.y > riverY) p.float = true;
            if (p.float) {
              p.x += 0.55 + p.z * 0.25;
              p.y = riverY + 8 + Math.sin(t * 1.4 + p.ph) * 4;
              if (p.x > W + 20) { petals[i] = makePetal(true); continue; }
            } else {
              p.y += 0.35 + p.z * 0.55;
              p.x += Math.sin(t * 0.8 + p.ph) * 0.55;
              if (p.y > H + 20) { petals[i] = makePetal(true); continue; }
            }
            p.rot += p.rv;
            p.flip += p.fv;
          }
          drawPetal(p);
        }
        if (!reduce && typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
      }
      window.addEventListener("pointermove", function (ev) {
        ptr.vx = ev.clientX - ptr.px; ptr.vy = ev.clientY - ptr.py;
        ptr.px = ptr.x = ev.clientX; ptr.py = ptr.y = ev.clientY;
      });
      window.addEventListener("click", function (ev) {
        hint.classList.add("gone");
        var fromLeft = ev.clientX < W / 2;
        gust.x = fromLeft ? 1.8 : -1.8;
        gust.y = -0.4;
        gust.e = 1;
        var n;
        for (n = 0; n < 36; n++) petals.push(makePetal(true));
        if (petals.length > 220) petals.splice(0, petals.length - 180);
      });
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
      else frame(0);
      if (reduce) frame(0);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
