<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHEL MERIDIAN — Desert Dunes at Golden Hour</title>
  <style>
    :root {
      --sky-a: #5d8fb5; --sky-b: #e8b86b; --sky-c: #f8dca4;
      --d1: #f1d9a8; --d2: #e4b982; --d3: #d59b62; --d4: #bd7a48; --d5: #9a5a35; --d6: #6e3b24;
      --sun: #fff6d2; --sand: #f1d9a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(180deg, var(--sky-a), var(--sky-b) 55%, var(--sky-c));
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      color: #f8ecd4;
    }
    .scene { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 28% 40%, #fff, transparent),
        radial-gradient(1px 1px at 44% 12%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 62% 28%, #ffe, transparent),
        radial-gradient(1px 1px at 78% 16%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 88% 36%, #fff, transparent),
        radial-gradient(1px 1px at 8% 48%, #fff, transparent),
        radial-gradient(1px 1px at 36% 8%, #fff, transparent),
        radial-gradient(1.3px 1.3px at 54% 22%, #fff, transparent),
        radial-gradient(1px 1px at 70% 6%, #fff, transparent);
      opacity: var(--star, 0);
      pointer-events: none;
      z-index: 1;
    }
    .sun {
      position: absolute; width: 90px; height: 90px; border-radius: 50%;
      left: var(--sun-x, 66%); top: var(--sun-y, 22%);
      background: radial-gradient(circle at 40% 40%, #fff, var(--sun) 55%, transparent 72%);
      box-shadow: 0 0 60px 20px color-mix(in srgb, var(--sun) 70%, transparent);
      transform: translate(-50%, -50%);
      opacity: var(--sun-op, 1);
      z-index: 2;
      filter: url(#shimmer);
    }
    .haze {
      position: absolute; left: -10%; right: -10%; height: 18%;
      bottom: 38%; z-index: 3; pointer-events: none;
      background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--sky-c) 55%, transparent));
      filter: blur(8px);
    }
    .dune {
      position: absolute; left: -8%; width: 116%; height: 62%;
      bottom: 0; z-index: 4;
    }
    .dune svg { width: 100%; height: 100%; display: block; }
    .dune path { transition: fill 1s linear; }
    .d1 { z-index: 4; } .d2 { z-index: 5; } .d3 { z-index: 6; }
    .d4 { z-index: 7; } .d5 { z-index: 8; } .d6 { z-index: 9; }
    .caravan {
      position: absolute; bottom: 28%; left: 0; z-index: 7;
      animation: trek 110s linear infinite;
    }
    @keyframes trek { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
    .camel { transform-origin: 50% 80%; animation: bob 1.4s ease-in-out infinite; }
    .camel:nth-child(2) { animation-delay: .2s; }
    .camel:nth-child(3) { animation-delay: .45s; }
    .camel:nth-child(4) { animation-delay: .7s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    #sand { position: absolute; inset: 0; z-index: 10; pointer-events: none; mix-blend-mode: screen; }
    .title {
      position: absolute; top: 8%; left: 0; right: 0; text-align: center; z-index: 12;
      letter-spacing: 0.34em; text-transform: uppercase;
      font-size: clamp(22px, 4.4vw, 48px);
      transform: scaleX(1.12);
    }
    .title::after {
      content: ""; display: block; width: 180px; height: 1px; margin: 12px auto 10px;
      background: linear-gradient(90deg, transparent, #f8ecd4, transparent);
    }
    .title em {
      display: block; font-size: clamp(12px, 1.6vw, 16px); letter-spacing: .08em;
      font-style: italic; text-transform: none; transform: scaleX(0.89);
    }
    .wind {
      position: absolute; top: 18px; right: 18px; z-index: 12;
      font-family: "Courier New", monospace; font-size: 12px; letter-spacing: .14em;
      color: #f8ecd4; text-shadow: 0 1px 4px #000;
    }
    .panel {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 14; width: min(520px, 92vw);
      background: rgba(70, 40, 22, 0.42);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(248, 236, 212, .35);
      border-radius: 14px; padding: 14px 18px;
    }
    .panel label {
      display: block; font-size: 10px; letter-spacing: .32em; margin-bottom: 8px;
      font-family: system-ui, sans-serif;
    }
    #tod {
      -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 6px;
      background: linear-gradient(90deg, #f8dca4, #e3894e, #b2496a, #5a2f5a, #121a3b);
    }
    #tod::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #fff, #ffd27a);
      border: 1px solid #c98a3a; cursor: pointer; box-shadow: 0 0 8px #ffd27a;
    }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    #clock { font-family: "Courier New", monospace; letter-spacing: .12em; }
    #pause {
      background: transparent; color: #f8ecd4; border: 1px solid rgba(248,236,212,.45);
      padding: 6px 14px; border-radius: 999px; cursor: pointer; letter-spacing: .12em; font-size: 11px;
    }
    @media (prefers-reduced-motion: reduce) {
      .camel, .caravan { animation: none !important; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true">
    <filter id="shimmer">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" result="n">
        <animate attributeName="baseFrequency" values="0.012 0.05;0.018 0.07;0.012 0.05" dur="7s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7">
        <animate attributeName="scale" values="5;9;5" dur="4.5s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </svg>
  <div class="scene" id="scene">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="haze"></div>
    <div class="dune d1" data-layer="1"><svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path id="p1" fill="var(--d1)" d="M0 340 C180 300 320 250 520 280 C740 318 900 220 1120 250 C1300 274 1460 210 1600 240 L1600 600 L0 600 Z"/></svg></div>
    <div class="dune d2" data-layer="2"><svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path id="p2" fill="var(--d2)" d="M0 380 C220 330 400 300 620 340 C860 386 1040 280 1260 320 C1420 348 1520 300 1600 320 L1600 600 L0 600 Z"/></svg></div>
    <div class="dune d3" data-layer="3"><svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path id="p3" fill="var(--d3)" d="M0 420 C200 370 380 360 600 400 C840 448 980 340 1220 380 C1400 408 1500 360 1600 390 L1600 600 L0 600 Z"/></svg></div>
    <div class="dune d4" data-layer="4">
      <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path id="p4" fill="var(--d4)" d="M0 450 C240 400 420 410 680 450 C940 492 1100 400 1340 440 C1480 464 1560 430 1600 450 L1600 600 L0 600 Z"/></svg>
      <svg class="caravan" id="caravan" viewBox="0 0 260 70" width="260" height="70" fill="var(--d6)">
        <g class="camel">
          <ellipse cx="30" cy="32" rx="16" ry="9"/><ellipse cx="38" cy="24" rx="8" ry="7"/>
          <path d="M46 24 Q54 10 58 22"/><circle cx="58" cy="20" r="3"/>
          <rect x="22" y="38" width="3" height="18"/><rect x="34" y="38" width="3" height="18"/>
        </g>
        <g class="camel">
          <ellipse cx="90" cy="34" rx="18" ry="10"/><ellipse cx="100" cy="24" rx="9" ry="8"/>
          <path d="M108 24 Q118 8 122 24"/><circle cx="122" cy="22" r="3.2"/>
          <rect x="80" y="42" width="3.2" height="20"/><rect x="96" y="42" width="3.2" height="20"/>
          <circle cx="100" cy="16" r="4"/>
        </g>
        <g class="camel">
          <ellipse cx="155" cy="36" rx="14" ry="8"/><ellipse cx="162" cy="28" rx="7" ry="6"/>
          <path d="M168 28 Q174 18 176 28"/><circle cx="176" cy="26" r="2.5"/>
          <rect x="148" y="42" width="2.6" height="16"/><rect x="158" y="42" width="2.6" height="16"/>
        </g>
        <g class="camel">
          <ellipse cx="210" cy="32" rx="16" ry="9"/><ellipse cx="220" cy="22" rx="8" ry="7"/>
          <path d="M228 22 Q236 8 240 22"/><circle cx="240" cy="20" r="3"/>
          <rect x="202" y="40" width="3" height="18"/><rect x="216" y="40" width="3" height="18"/>
        </g>
      </svg>
    </div>
    <div class="dune d5" data-layer="5"><svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path id="p5" fill="var(--d5)" d="M0 500 C180 460 360 470 620 510 C900 552 1100 460 1360 500 C1480 520 1560 490 1600 510 L1600 600 L0 600 Z"/></svg></div>
    <div class="dune d6" data-layer="6"><svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path id="p6" fill="var(--d6)" d="M0 540 C200 510 420 520 700 555 C980 590 1200 520 1460 548 C1540 560 1580 540 1600 548 L1600 600 L0 600 Z"/></svg></div>
    <canvas id="sand"></canvas>
    <h1 class="title" id="title">SAHEL MERIDIAN<em>Where the ergs meet the evening — 16° 14′ N, 0° 02′ W</em></h1>
    <div class="wind" id="wind">WIND ESE · 14 kn</div>
    <div class="panel">
      <label for="tod">TIME OF DAY</label>
      <input type="range" id="tod" min="0" max="1000" value="0">
      <div class="row">
        <span id="clock">16:40</span>
        <button type="button" id="pause">Pause</button>
      </div>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function hexToRgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function rgbToHex(r) {
      function p(n) { n = Math.max(0, Math.min(255, Math.round(n))); return (n < 16 ? "0" : "") + n.toString(16); }
      return "#" + p(r[0]) + p(r[1]) + p(r[2]);
    }
    function mix(a, b, t) {
      var A = hexToRgb(a), B = hexToRgb(b);
      return rgbToHex([lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function init() {
      var scene = qs("#scene");
      var slider = qs("#tod");
      var clock = qs("#clock");
      var pauseBtn = qs("#pause");
      var windEl = qs("#wind");
      var canvas = qs("#sand");
      var title = qs("#title");
      if (!scene || !canvas) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var reduced = false;
      if (typeof window.matchMedia === "function") {
        try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e1) {}
      }
      if (reduced) {
        var filt = qs("#shimmer");
        if (filt) filt.innerHTML = "";
      }
      var keys = [
        { t: 0, sky: ["#5d8fb5", "#e8b86b", "#f8dca4"], dunes: ["#f1d9a8", "#e4b982", "#d59b62", "#bd7a48", "#9a5a35", "#6e3b24"], sun: "#fff6d2", star: 0, sunOp: 1 },
        { t: 0.35, sky: ["#3f5e8c", "#e3894e", "#f6b975"], dunes: ["#e8c89a", "#d4a070", "#c48654", "#a86a3e", "#8a4e30", "#5e3220"], sun: "#ffe0a0", star: 0, sunOp: 1 },
        { t: 0.62, sky: ["#26305a", "#b2496a", "#ef8a5a"], dunes: ["#c9a088", "#b07a62", "#9a624c", "#7e4a38", "#5c3228", "#3a2018"], sun: "#ffc07a", star: 0.35, sunOp: 0.85 },
        { t: 0.82, sky: ["#121a3b", "#5a2f5a", "#c9613f"], dunes: ["#8a6a68", "#6e4e4e", "#5a3a3a", "#462828", "#321c1c", "#1e1010"], sun: "#ffb26a", star: 0.7, sunOp: 0.35 },
        { t: 1, sky: ["#070a1a", "#1c1837", "#4a2a3a"], dunes: ["#5c4a4a", "#4a3838", "#3a2828", "#2a1c1c", "#1c1214", "#120c10"], sun: "#ffb26a", star: 1, sunOp: 0 }
      ];
      function sample(u) {
        u = Math.max(0, Math.min(1, u));
        var i;
        for (i = 0; i < keys.length - 1; i++) if (u <= keys[i + 1].t) break;
        var a = keys[i], b = keys[i + 1];
        var t = smooth((u - a.t) / (b.t - a.t || 1));
        return {
          sky: [mix(a.sky[0], b.sky[0], t), mix(a.sky[1], b.sky[1], t), mix(a.sky[2], b.sky[2], t)],
          dunes: a.dunes.map(function (d, k) { return mix(d, b.dunes[k], t); }),
          sun: mix(a.sun, b.sun, t),
          star: lerp(a.star, b.star, t),
          sunOp: lerp(a.sunOp, b.sunOp, t)
        };
      }
      var cycle = 0;
      var dir = 1;
      var playing = !reduced;
      var mx = 0, my = 0, px = 0, py = 0;
      var W = 0, H = 0, dpr = 1;
      var gust = 1;
      var streaks = [];
      function spawnStreak() {
        return {
          x: Math.random() * W, y: Math.random() * H,
          vx: 40 + Math.random() * 80, len: 8 + Math.random() * 18,
          a: 0, life: 0, max: 2 + Math.random() * 4, sway: Math.random() * Math.PI * 2
        };
      }
      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!streaks.length) {
          var i;
          for (i = 0; i < 260; i++) streaks.push(spawnStreak());
        }
      }
      function apply(u) {
        var s = sample(u);
        var root = document.documentElement;
        root.style.setProperty("--sky-a", s.sky[0]);
        root.style.setProperty("--sky-b", s.sky[1]);
        root.style.setProperty("--sky-c", s.sky[2]);
        root.style.setProperty("--d1", s.dunes[0]);
        root.style.setProperty("--d2", s.dunes[1]);
        root.style.setProperty("--d3", s.dunes[2]);
        root.style.setProperty("--d4", s.dunes[3]);
        root.style.setProperty("--d5", s.dunes[4]);
        root.style.setProperty("--d6", s.dunes[5]);
        root.style.setProperty("--sun", s.sun);
        root.style.setProperty("--sand", s.dunes[0]);
        root.style.setProperty("--star", String(s.star));
        root.style.setProperty("--sun-op", String(s.sunOp));
        var sx = lerp(66, 42, u);
        var sy = lerp(22, 70, u);
        root.style.setProperty("--sun-x", sx + "%");
        root.style.setProperty("--sun-y", sy + "%");
        var mins = 16 * 60 + 40 + Math.round(u * (20 * 60 + 12 - (16 * 60 + 40)));
        var hh = Math.floor(mins / 60), mm = mins % 60;
        if (clock) clock.textContent = (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
        if (slider && document.activeElement !== slider) slider.value = String(Math.round(u * 1000));
      }
      scene.addEventListener("mousemove", function (ev) {
        var r = scene.getBoundingClientRect();
        mx = (ev.clientX - r.left) / r.width - 0.5;
        my = (ev.clientY - r.top) / r.height - 0.5;
      });
      window.addEventListener("deviceorientation", function (ev) {
        if (ev.gamma == null || ev.beta == null) return;
        mx = ev.gamma / 45;
        my = (ev.beta - 45) / 45;
      });
      if (slider) slider.addEventListener("input", function () {
        playing = false;
        if (pauseBtn) pauseBtn.textContent = "Resume";
        cycle = (parseFloat(slider.value) || 0) / 1000;
        apply(cycle);
      });
      if (pauseBtn) pauseBtn.addEventListener("click", function () {
        playing = !playing;
        pauseBtn.textContent = playing ? "Pause" : "Resume";
      });
      var lastWind = 0;
      var last = 0;
      function frame(now) {
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
        var dt = Math.min(0.05, (now - last) / 1000) || 0.016;
        last = now;
        if (playing && !reduced) {
          cycle += dir * dt / 60;
          if (cycle >= 1) { cycle = 1; dir = -1; }
          if (cycle <= 0) { cycle = 0; dir = 1; }
        }
        apply(cycle);
        px += (mx - px) * 0.08;
        py += (my - py) * 0.08;
        var layers = qsa(".dune");
        layers.forEach(function (el, i) {
          var mag = 8 + i * (72 / 5);
          el.style.transform = "translate(" + (px * mag) + "px," + (py * mag * 0.35) + "px)";
        });
        if (title) title.style.transform = "scaleX(1.12) translate(" + (-px * 12) + "px," + (-py * 8) + "px)";
        gust += (Math.sin(now * 0.0004) * 0.4 + Math.sin(now * 0.0011) * 0.2) * 0.02;
        gust = Math.max(0.6, Math.min(1.6, gust));
        if (now - lastWind > 2000 && windEl) {
          lastWind = now;
          var kn = Math.round(10 + gust * 8);
          windEl.textContent = "WIND ESE · " + kn + " kn";
        }
        if (reduced) return;
        ctx.clearRect(0, 0, W, H);
        var col = hexToRgb(getComputedStyle(document.documentElement).getPropertyValue("--sand").trim() || "#f1d9a8");
        streaks.forEach(function (s) {
          s.life += dt;
          s.a = Math.min(1, s.life / 0.4) * Math.max(0, 1 - s.life / s.max);
          s.x += s.vx * gust * dt;
          s.y += Math.sin(s.sway + now * 0.002) * 8 * dt;
          s.len = 8 + gust * 14;
          ctx.strokeStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (0.18 * s.a) + ")";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x + s.len, s.y + 1);
          ctx.stroke();
          if (s.x > W + 20 || s.life > s.max) {
            s.x = -20; s.y = Math.random() * H; s.life = 0; s.max = 2 + Math.random() * 4;
            s.vx = 40 + Math.random() * 80;
          }
        });
      }
      window.addEventListener("resize", resize);
      resize();
      apply(0);
      if (reduced) {
        playing = false;
        if (pauseBtn) pauseBtn.textContent = "Resume";
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
