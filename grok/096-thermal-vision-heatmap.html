<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THERMA-1 Thermal Vision Heatmap</title>
  <style>
    :root {
      --bezel-a: #2b2e34; --bezel-b: #1a1c20; --bezel-c: #0c0d10;
      --sage: #7c8378; --hi: #d7dbd2; --amber: #ffb347; --hot: #ffd7a1; --cold: #a9c4ff;
      --mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      background: radial-gradient(1200px 800px at 50% 30%, #16181c, #07080a);
      color: var(--sage);
      font-family: var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 20px 16px 40px;
    }
    h1 { color: var(--hi); font-weight: 500; font-size: 14px; letter-spacing: .32em; text-align: center; margin-bottom: 16px; }
    .unit { max-width: 1080px; margin: 0 auto; }
    .bezel {
      background: linear-gradient(160deg, var(--bezel-a), var(--bezel-b) 45%, var(--bezel-c));
      border-radius: 26px; padding: 22px; position: relative;
      box-shadow: 0 24px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .screw {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #8a8e94, #2a2c30);
      box-shadow: inset 0 0 0 1px #111;
    }
    .screw::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4px; height: 2px; background: #1a1c20; }
    .s1 { top: 10px; left: 12px; } .s2 { top: 10px; right: 12px; } .s3 { bottom: 10px; left: 12px; } .s4 { bottom: 10px; right: 12px; }
    .view {
      position: relative; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.08); background: #000;
      aspect-ratio: 16 / 9;
    }
    canvas#feed { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px #000; font-size: 11px; letter-spacing: .1em; }
    .hud .tl { position: absolute; top: 12px; left: 14px; }
    .hud .tr { position: absolute; top: 12px; right: 14px; text-align: right; }
    .hud .bl { position: absolute; bottom: 12px; left: 14px; }
    .hud .br { position: absolute; bottom: 12px; right: 14px; text-align: right; }
    .rec { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e4002b; margin-right: 6px; animation: rec 1s steps(1) infinite; vertical-align: middle; }
    @keyframes rec { 50% { opacity: .15; } }
    .cross {
      position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
      border: 1px dashed rgba(255,255,255,.55); border-radius: 50%;
    }
    .cross::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: #fff; border-radius: 50%; }
    .centre-t { position: absolute; left: calc(50% + 34px); top: 50%; transform: translateY(-50%); font-size: 13px; color: #fff; }
    .marker { position: absolute; font-size: 11px; transform: translate(-50%, -120%); transition: left .35s ease, top .35s ease; }
    .marker.hot { color: var(--hot); }
    .marker.cold { color: var(--cold); }
    .legend { position: absolute; right: 10px; top: 18%; width: 12px; height: 64%; border: 1px solid rgba(255,255,255,.35); }
    .legend canvas { width: 100%; height: 100%; display: block; }
    .legend .ticks { position: absolute; right: 16px; top: 0; height: 100%; color: #fff; font-size: 9px; }
    .legend .ticks span { position: absolute; right: 0; transform: translateY(-50%); }
    .brackets::before, .brackets::after, .brackets i::before, .brackets i::after {
      content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5);
    }
    .brackets::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
    .brackets::after { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
    .brackets i::before { bottom: 8px; left: 8px; border-right: 0; border-top: 0; }
    .brackets i::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
    .controls {
      margin-top: 16px; background: linear-gradient(#1c1e22, #121316);
      border: 1px solid #2a2d32; padding: 14px; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end;
    }
    .pal-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .pal-group button {
      font: inherit; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--hi); background: #121316; border: 1px solid #3a3e44; padding: 6px 8px; cursor: pointer;
    }
    .pal-group button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
    .sw { display: block; height: 6px; width: 72px; margin-top: 4px; }
    label.ctl { display: block; font-size: 10px; }
    label.ctl span { color: var(--hi); }
    input[type="range"] { width: 100%; accent-color: var(--amber); }
    .actions { display: flex; gap: 8px; }
    .actions button {
      font: inherit; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      background: #121316; color: var(--hi); border: 1px solid #3a3e44; padding: 10px 12px; cursor: pointer;
    }
    .actions button:hover { border-color: var(--amber); color: var(--amber); }
    @media (prefers-reduced-motion: reduce) {
      .rec { animation: none; }
      .marker { transition: none; }
    }
  </style>
</head>
<body>
  <div class="unit">
    <h1>THERMA-1</h1>
    <div class="bezel">
      <span class="screw s1"></span><span class="screw s2"></span><span class="screw s3"></span><span class="screw s4"></span>
      <div class="view" id="view">
        <canvas id="feed" aria-label="Thermal viewport"></canvas>
        <div class="hud">
          <div class="tl"><span class="rec" id="recDot"></span>REC <span id="elapsed">00:00:00</span><br><span id="isoDate"></span><br><span id="palName">IRON</span></div>
          <div class="tr">ε <span id="emis">0.950</span><br><span id="rangeRead">RANGE AUTO</span><br><span id="fps">00 FPS</span></div>
          <div class="bl">ZOOM 1.0× · FOCUS ∞<br>GHOSTS <span id="ghostN">3</span></div>
          <div class="br">MAX <span id="maxT">21.0</span> °C<br>MIN <span id="minT">21.0</span> °C<br>
            <svg id="batt" width="28" height="12" viewBox="0 0 28 12" aria-label="Battery">
              <rect x="0.5" y="1.5" width="24" height="9" rx="1" fill="none" stroke="#fff" stroke-width="1"/>
              <rect x="25" y="4" width="2.5" height="4" fill="#fff"/>
              <rect id="battFill" x="2" y="3" width="21" height="6" fill="#d7dbd2"/>
            </svg>
          </div>
          <div class="cross"></div>
          <div class="centre-t" id="centreT">21.0 °C</div>
          <div class="marker hot" id="hotMark">▲ 21.0</div>
          <div class="marker cold" id="coldMark">▼ 21.0</div>
          <div class="legend">
            <canvas id="legend" width="12" height="200"></canvas>
            <div class="ticks">
              <span style="top:0%">150</span>
              <span style="top:25%">108</span>
              <span style="top:50%">65</span>
              <span style="top:75%">23</span>
              <span style="top:100%">−20</span>
            </div>
          </div>
          <div class="brackets"><i></i></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <div>
        <label class="ctl">Palette</label>
        <div class="pal-group" id="pals">
          <button type="button" data-p="IRON" aria-pressed="true">IRON<span class="sw" style="background:linear-gradient(90deg,#000,#14003c,#78008c,#d22832,#fa8214,#ffdc3c,#fff)"></span></button>
          <button type="button" data-p="RAINBOW" aria-pressed="false">RAINBOW<span class="sw" style="background:linear-gradient(90deg,#000,#001060,#1a6bff,#19c850,#ffe14a,#ff8a00,#fff)"></span></button>
          <button type="button" data-p="ARCTIC" aria-pressed="false">ARCTIC<span class="sw" style="background:linear-gradient(90deg,#080a14,#143c78,#46a0dc,#beebfa,#fff)"></span></button>
          <button type="button" data-p="GRAY" aria-pressed="false">GRAY<span class="sw" style="background:linear-gradient(90deg,#000,#888,#fff)"></span></button>
        </div>
      </div>
      <label class="ctl">Brush radius <span id="brOut">6</span>
        <input type="range" id="brush" min="2" max="14" value="6">
      </label>
      <label class="ctl">Diffusion <span id="dfOut">0.10</span>
        <input type="range" id="diff" min="2" max="24" value="10">
      </label>
      <label class="ctl">Cooling <span id="clOut">0.985</span>
        <input type="range" id="cool" min="950" max="999" value="985">
      </label>
      <label class="ctl">Ghost count <span id="ghOut">3</span>
        <input type="range" id="ghosts" min="0" max="8" value="3">
      </label>
      <div class="actions">
        <button type="button" id="reset">Reset</button>
        <button type="button" id="ember">Drop ember</button>
      </div>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    function lerpC(a, b, t) {
      return [
        (a[0] + (b[0] - a[0]) * t) | 0,
        (a[1] + (b[1] - a[1]) * t) | 0,
        (a[2] + (b[2] - a[2]) * t) | 0
      ];
    }
    function lutFrom(stops) {
      var lut = new Uint8ClampedArray(256 * 3);
      for (var i = 0; i < 256; i++) {
        var t = i / 255, s = 0;
        while (s < stops.length - 2 && t > stops[s + 1].t) s++;
        var a = stops[s], b = stops[s + 1];
        var u = (t - a.t) / Math.max(0.0001, b.t - a.t);
        var c = lerpC(a.c, b.c, u);
        lut[i * 3] = c[0]; lut[i * 3 + 1] = c[1]; lut[i * 3 + 2] = c[2];
      }
      return lut;
    }
    function init() {
      var canvas = qs("#feed");
      var legend = qs("#legend");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");
      if (!ctx) return;
      var lctx = legend ? legend.getContext("2d") : null;
      var W = 160, H = 90, AMB = 21;
      var field = new Float32Array(W * H);
      var next = new Float32Array(W * H);
      for (var i = 0; i < W * H; i++) field[i] = AMB + (Math.random() - 0.5) * 0.4;
      var pals = {
        IRON: lutFrom([
          { t: 0, c: [0,0,0] }, { t: 0.16, c: [20,0,60] }, { t: 0.32, c: [120,0,140] },
          { t: 0.5, c: [210,40,50] }, { t: 0.68, c: [250,130,20] }, { t: 0.84, c: [255,220,60] }, { t: 1, c: [255,255,255] }
        ]),
        RAINBOW: lutFrom([
          { t: 0, c: [0,0,0] }, { t: 0.18, c: [0,16,96] }, { t: 0.36, c: [26,107,255] },
          { t: 0.52, c: [25,200,80] }, { t: 0.7, c: [255,225,74] }, { t: 0.86, c: [255,138,0] }, { t: 1, c: [255,255,255] }
        ]),
        ARCTIC: lutFrom([
          { t: 0, c: [8,10,20] }, { t: 0.3, c: [20,60,120] }, { t: 0.55, c: [70,160,220] },
          { t: 0.8, c: [190,235,250] }, { t: 1, c: [255,255,255] }
        ]),
        GRAY: lutFrom([{ t: 0, c: [0,0,0] }, { t: 1, c: [255,255,255] }])
      };
      var palName = "IRON";
      var brushR = 6, diff = 0.10, cool = 0.985, ghostN = 3;
      var painting = false, px = 0, py = 0;
      var embers = [];
      var ghosts = [];
      var t0 = Date.now();
      var frames = 0, fps = 0, fpsT = Date.now();
      var batt = 1;
      var reduce = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var skip = 0;
      function spawnGhosts() {
        ghosts = [];
        for (var g = 0; g < ghostN; g++) {
          ghosts.push({
            x: Math.random() * W, y: 20 + Math.random() * 50,
            vx: (Math.random() * 0.25 + 0.08) * (Math.random() < 0.5 ? -1 : 1),
            phase: Math.random() * Math.PI * 2, temp: 32 + Math.random() * 6
          });
        }
      }
      spawnGhosts();
      function idx(x, y) { return y * W + x; }
      function paintHeat(cx, cy, r, power) {
        var r2 = r * r;
        for (var y = Math.max(0, cy - r | 0); y < Math.min(H, cy + r + 1); y++) {
          for (var x = Math.max(0, cx - r | 0); x < Math.min(W, cx + r + 1); x++) {
            var d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
            if (d > r2) continue;
            field[idx(x, y)] += power * Math.exp(-d / (2 * (r * 0.45) * (r * 0.45)));
          }
        }
      }
      function toCell(ev) {
        var r = canvas.getBoundingClientRect();
        return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
      }
      canvas.addEventListener("pointerdown", function (ev) {
        painting = true;
        var p = toCell(ev);
        px = p.x; py = p.y;
        embers.push({ x: p.x, y: p.y, age: 0 });
      });
      canvas.addEventListener("pointermove", function (ev) {
        var p = toCell(ev); px = p.x; py = p.y;
        if (painting || ev.buttons) paintHeat(px, py, brushR, 1.8);
      });
      canvas.addEventListener("pointerup", function () { painting = false; });
      canvas.addEventListener("pointerleave", function () { painting = false; });
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var r = canvas.getBoundingClientRect();
        canvas.width = Math.max(2, Math.round(r.width * dpr));
        canvas.height = Math.max(2, Math.round(r.height * dpr));
      }
      if (typeof window.ResizeObserver === "function") {
        var view = qs("#view");
        if (view) new ResizeObserver(resize).observe(view);
      }
      window.addEventListener("resize", resize);
      resize();
      function drawLegend() {
        if (!lctx || !legend) return;
        var lut = pals[palName];
        var h = legend.height, w = legend.width;
        var img = lctx.createImageData(w, h);
        for (var y = 0; y < h; y++) {
          var t = 1 - y / (h - 1);
          var i = (t * 255) | 0;
          for (var x = 0; x < w; x++) {
            var o = (y * w + x) * 4;
            img.data[o] = lut[i * 3]; img.data[o + 1] = lut[i * 3 + 1]; img.data[o + 2] = lut[i * 3 + 2]; img.data[o + 3] = 255;
          }
        }
        lctx.putImageData(img, 0, 0);
      }
      drawLegend();
      function sim() {
        var i, x, y;
        for (y = 1; y < H - 1; y++) {
          for (x = 1; x < W - 1; x++) {
            i = idx(x, y);
            var lap = field[i - 1] + field[i + 1] + field[i - W] + field[i + W] - 4 * field[i];
            next[i] = (field[i] + lap * diff - AMB) * cool + AMB;
          }
        }
        for (x = 0; x < W; x++) { next[x] = field[x]; next[idx(x, H - 1)] = field[idx(x, H - 1)]; }
        for (y = 0; y < H; y++) { next[idx(0, y)] = field[idx(0, y)]; next[idx(W - 1, y)] = field[idx(W - 1, y)]; }
        var tmp = field; field = next; next = tmp;
        if (painting) paintHeat(px, py, brushR, 1.4);
        for (i = embers.length - 1; i >= 0; i--) {
          var e = embers[i];
          e.age += 1 / 60;
          var u = Math.min(1, e.age / 1.4);
          var rad = 2 + 9 * u;
          var pow = 4.5 * (1 - u);
          paintHeat(e.x, e.y, rad, pow);
          if (e.age > 1.4) embers.splice(i, 1);
        }
        ghosts.forEach(function (g) {
          g.x += g.vx;
          g.phase += 0.05;
          var bob = Math.sin(g.phase) * 3;
          if (g.x < -10 || g.x > W + 10) {
            g.x = g.vx > 0 ? -8 : W + 8;
            g.y = 20 + Math.random() * 50;
          }
          var gy = g.y + bob;
          paintHeat(g.x, gy, 3.2, g.temp * 0.04);
          paintHeat(g.x, gy + 7, 4.2, g.temp * 0.05);
          var foot = Math.sin(g.phase * 2) > 0 ? 1 : -1;
          paintHeat(g.x + foot * 1.4, gy + 13, 2.2, g.temp * 0.03);
          paintHeat(g.x - foot * 1.2, gy + 13, 1.6, g.temp * 0.02);
        });
      }
      function sampleBilinear(x, y) {
        x = Math.max(0, Math.min(W - 1.001, x));
        y = Math.max(0, Math.min(H - 1.001, y));
        var x0 = x | 0, y0 = y | 0, x1 = x0 + 1, y1 = y0 + 1;
        var fx = x - x0, fy = y - y0;
        var a = field[idx(x0, y0)], b = field[idx(Math.min(W - 1, x1), y0)];
        var c = field[idx(x0, Math.min(H - 1, y1))], d = field[idx(Math.min(W - 1, x1), Math.min(H - 1, y1))];
        return a * (1 - fx) * (1 - fy) + b * fx * (1 - fy) + c * (1 - fx) * fy + d * fx * fy;
      }
      var hotEase = { x: 0.5, y: 0.5 }, coldEase = { x: 0.5, y: 0.5 };
      function draw() {
        var cw = canvas.width, ch = canvas.height;
        var img = ctx.createImageData(cw, ch);
        var lut = pals[palName];
        var minV = 1e9, maxV = -1e9, hi = 0, lo = 0;
        for (var i = 0; i < W * H; i++) {
          if (field[i] < minV) { minV = field[i]; lo = i; }
          if (field[i] > maxV) { maxV = field[i]; hi = i; }
        }
        var floor = 4;
        if (maxV - minV < floor) { var mid = (maxV + minV) / 2; minV = mid - floor / 2; maxV = mid + floor / 2; }
        var span = maxV - minV || 1;
        for (var y = 0; y < ch; y++) {
          var gy = y / ch * (H - 1);
          var scan = (y % 3 === 0) ? 0.82 : 1;
          var vigY = (y / ch - 0.5);
          for (var x = 0; x < cw; x++) {
            var gx = x / cw * (W - 1);
            var t = sampleBilinear(gx, gy) + (Math.random() - 0.5) * 0.35;
            var u = (t - minV) / span;
            var li = Math.max(0, Math.min(255, (u * 255) | 0));
            var vig = 1 - Math.min(1, (Math.pow(x / cw - 0.5, 2) + vigY * vigY) * 1.6) * 0.45;
            var o = (y * cw + x) * 4;
            img.data[o] = lut[li * 3] * scan * vig;
            img.data[o + 1] = lut[li * 3 + 1] * scan * vig;
            img.data[o + 2] = lut[li * 3 + 2] * scan * vig;
            img.data[o + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        var hx = (hi % W) / W, hy = ((hi / W) | 0) / H;
        var cxv = (lo % W) / W, cyv = ((lo / W) | 0) / H;
        var k = reduce ? 1 : 0.12;
        hotEase.x += (hx - hotEase.x) * k; hotEase.y += (hy - hotEase.y) * k;
        coldEase.x += (cxv - coldEase.x) * k; coldEase.y += (cyv - coldEase.y) * k;
        var hotMark = qs("#hotMark"), coldMark = qs("#coldMark");
        if (hotMark) { hotMark.style.left = (hotEase.x * 100) + "%"; hotMark.style.top = (hotEase.y * 100) + "%"; hotMark.textContent = "▲ " + maxV.toFixed(1); }
        if (coldMark) { coldMark.style.left = (coldEase.x * 100) + "%"; coldMark.style.top = (coldEase.y * 100) + "%"; coldMark.textContent = "▼ " + minV.toFixed(1); }
        var centre = sampleBilinear(W / 2, H / 2);
        var ct = qs("#centreT"); if (ct) ct.textContent = centre.toFixed(1) + " °C";
        var maxT = qs("#maxT"), minT = qs("#minT");
        if (maxT) maxT.textContent = maxV.toFixed(1);
        if (minT) minT.textContent = minV.toFixed(1);
        var rr = qs("#rangeRead"); if (rr) rr.textContent = minV.toFixed(0) + " / " + maxV.toFixed(0) + " °C";
      }
      function hudClock() {
        var dt = Math.floor((Date.now() - t0) / 1000);
        var h = String(Math.floor(dt / 3600)).padStart(2, "0");
        var m = String(Math.floor((dt % 3600) / 60)).padStart(2, "0");
        var s = String(dt % 60).padStart(2, "0");
        var el = qs("#elapsed"); if (el) el.textContent = h + ":" + m + ":" + s;
        var iso = qs("#isoDate"); if (iso) iso.textContent = new Date().toISOString().slice(0, 10);
        var em = qs("#emis"); if (em) em.textContent = (0.95 + Math.sin(Date.now() / 4000) * 0.004).toFixed(3);
        batt = Math.max(0.05, 1 - (Date.now() - t0) / 480000);
        var bf = qs("#battFill");
        if (bf) { bf.setAttribute("width", String(21 * batt)); bf.setAttribute("fill", batt < 0.3 ? "#e4002b" : "#d7dbd2"); }
      }
      function frame() {
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
        skip = 1 - skip;
        if (reduce && skip) return;
        sim(); draw(); hudClock();
        frames++;
        if (Date.now() - fpsT > 500) {
          fps = Math.round(frames * 1000 / (Date.now() - fpsT));
          frames = 0; fpsT = Date.now();
          var f = qs("#fps"); if (f) f.textContent = String(fps).padStart(2, "0") + " FPS";
        }
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
      else setInterval(function () { sim(); draw(); hudClock(); }, reduce ? 50 : 32);
      qsa("#pals button").forEach(function (b) {
        b.addEventListener("click", function () {
          palName = b.getAttribute("data-p") || "IRON";
          qsa("#pals button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
          var pn = qs("#palName"); if (pn) pn.textContent = palName;
          drawLegend();
        });
      });
      document.addEventListener("keydown", function (e) {
        var map = { "1": "IRON", "2": "RAINBOW", "3": "ARCTIC", "4": "GRAY" };
        if (map[e.key]) {
          palName = map[e.key];
          qsa("#pals button").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-p") === palName ? "true" : "false"); });
          var pn = qs("#palName"); if (pn) pn.textContent = palName;
          drawLegend();
        }
      });
      var brush = qs("#brush"), diffEl = qs("#diff"), coolEl = qs("#cool"), gh = qs("#ghosts");
      if (brush) brush.addEventListener("input", function () { brushR = Number(brush.value); if (qs("#brOut")) qs("#brOut").textContent = brush.value; });
      if (diffEl) diffEl.addEventListener("input", function () { diff = Number(diffEl.value) / 100; if (qs("#dfOut")) qs("#dfOut").textContent = diff.toFixed(2); });
      if (coolEl) coolEl.addEventListener("input", function () { cool = Number(coolEl.value) / 1000; if (qs("#clOut")) qs("#clOut").textContent = cool.toFixed(3); });
      if (gh) gh.addEventListener("input", function () {
        ghostN = Number(gh.value); if (qs("#ghOut")) qs("#ghOut").textContent = gh.value;
        var gn = qs("#ghostN"); if (gn) gn.textContent = gh.value; spawnGhosts();
      });
      var reset = qs("#reset");
      if (reset) reset.addEventListener("click", function () {
        for (var i = 0; i < W * H; i++) field[i] = AMB + (Math.random() - 0.5) * 0.3;
        embers = [];
      });
      var emberBtn = qs("#ember");
      if (emberBtn) emberBtn.addEventListener("click", function () {
        embers.push({ x: 10 + Math.random() * (W - 20), y: 10 + Math.random() * (H - 20), age: 0 });
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
