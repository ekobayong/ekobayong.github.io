<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typographic Word Clock &amp; Time Poem</title>
  <style>
    :root {
      --bg-a: #070a16; --bg-b: #0f1630; --bg-c: #241c3d;
      --accent: #ffd68a; --glow: rgba(255,214,138,.55);
      --star: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      background:
        radial-gradient(ellipse 80% 40% at 50% 100%, var(--bg-c), transparent 55%),
        linear-gradient(180deg, var(--bg-a), var(--bg-b));
      color: #fff;
      font-family: "Helvetica Neue", "Avenir Next", Futura, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 16px 28px;
      overflow-x: hidden;
    }
    .stars {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 30% 40%, #fff, transparent),
        radial-gradient(1px 1px at 55% 15%, #fff, transparent),
        radial-gradient(1.4px 1.4px at 70% 35%, #fff, transparent),
        radial-gradient(1px 1px at 85% 22%, #fff, transparent),
        radial-gradient(1px 1px at 18% 60%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 42% 70%, #fff, transparent),
        radial-gradient(1px 1px at 88% 58%, #fff, transparent);
      opacity: var(--star);
      transition: opacity 1.2s linear;
    }
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .045; mix-blend-mode: overlay;
    }
    header, footer.bar {
      width: min(720px, 96vw);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.55);
      z-index: 2;
    }
    #digital { font-variant-numeric: tabular-nums; letter-spacing: .16em; }
    .frame {
      margin: 22px 0 18px;
      background: rgba(8,10,20,.36);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 22px 20px 26px;
      box-shadow: 0 28px 60px rgba(0,0,0,.45);
      position: relative;
      z-index: 2;
    }
    .frame::before, .frame::after {
      content: ""; position: absolute; width: 18px; height: 18px;
      border: 2px solid var(--accent); pointer-events: none;
    }
    .frame::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
    .frame::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: clamp(2px, 0.6vw, 8px);
    }
    .cell {
      width: clamp(16px, min(5.2vw, 6.2vh), 58px);
      height: clamp(16px, min(5.2vw, 6.2vh), 58px);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; text-transform: uppercase;
      font-size: clamp(12px, min(3.4vw, 4.2vh), 36px);
      color: rgba(255,255,255,.10);
      user-select: none;
    }
    .cell.on {
      color: #fff;
      text-shadow: 0 0 8px var(--glow), 0 0 18px var(--glow), 0 0 32px var(--accent);
    }
    .corners {
      display: flex; justify-content: space-between; margin-bottom: 8px;
    }
    .corners.bottom { margin: 8px 0 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,.12);
    }
    .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--glow); }
    .poem-wrap {
      position: relative; height: 4.4em; width: min(640px, 92vw); z-index: 2; margin-bottom: 10px;
    }
    .poem-wrap p {
      position: absolute; inset: 0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-style: italic;
      font-size: clamp(16px, 2.2vw, 26px);
      text-align: center; color: rgba(255,255,255,.82);
      opacity: 0; filter: blur(6px); transform: translateY(8px);
      transition: opacity 2.4s ease, filter 2.4s ease, transform 2.4s ease;
    }
    .poem-wrap p.show { opacity: 1; filter: blur(0); transform: translateY(0); }
    .period {
      font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
      font-variant: small-caps; color: rgba(255,255,255,.45); margin-bottom: 16px; z-index: 2;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
      z-index: 2; width: min(720px, 96vw);
    }
    .seg { display: flex; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; }
    .seg button {
      background: transparent; color: rgba(255,255,255,.7); border: 0;
      padding: 6px 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
    }
    .seg button.on { background: var(--accent); color: #1a140c; }
    .travel { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; }
    .travel label { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.5); white-space: nowrap; }
    #travel { flex: 1; }
    #now {
      background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px; padding: 6px 14px; letter-spacing: .16em; text-transform: uppercase;
      font-size: 11px; cursor: pointer;
    }
    #rain { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
    @media (prefers-reduced-motion: reduce) {
      .poem-wrap p { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <svg class="grain" width="100%" height="100%" aria-hidden="true">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>
  <header>
    <span>Word clock</span>
    <span id="digital">00:00</span>
    <span>Time poem</span>
  </header>
  <div class="frame" id="frame">
    <div class="corners"><span class="dot" data-m="1"></span><span class="dot" data-m="2"></span></div>
    <div class="grid" id="grid" aria-label="Word clock grid"></div>
    <div class="corners bottom"><span class="dot" data-m="3"></span><span class="dot" data-m="4"></span></div>
  </div>
  <div class="poem-wrap" id="poem">
    <p id="lineA" class="show"></p>
    <p id="lineB"></p>
  </div>
  <div class="period" id="period">deep night</div>
  <div class="controls">
    <div class="seg" id="themes">
      <button type="button" data-theme="ember" class="on">Ember</button>
      <button type="button" data-theme="moon">Moon</button>
      <button type="button" data-theme="verdigris">Verdigris</button>
    </div>
    <div class="seg" id="fmt">
      <button type="button" data-fmt="12" class="on">12h</button>
      <button type="button" data-fmt="24">24h</button>
    </div>
    <div class="travel">
      <label for="travel">Time travel</label>
      <input type="range" id="travel" min="0" max="1439" value="0">
      <button type="button" id="now">Now</button>
    </div>
  </div>
  <canvas id="rain"></canvas>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    var ROWS = ["ITLISASAMPM","ACQUARTERDC","TWENTYFIVEX","HALFSTENFTO","PASTERUNINE","ONESIXTHREE","FOURFIVETWO","EIGHTELEVEN","SEVENTWELVE","TENSEOCLOCK"];
    var WORDS = {
      IT: [0,0,2], IS: [0,3,2], A: [1,0,1], QUARTER: [1,2,7], TWENTY: [2,0,6], FIVE: [2,6,4],
      HALF: [3,0,4], TEN: [3,5,3], F: [3,8,1], TO: [3,9,2], PAST: [4,0,4], ERU: [4,4,3],
      NINE: [4,7,4], ONE: [5,0,3], SIX: [5,3,3], THREE: [5,6,5], FOUR: [6,0,4], FIVEH: [6,4,4],
      TWO: [6,8,3], EIGHT: [7,0,5], ELEVEN: [7,5,6], SEVEN: [8,0,5], TWELVE: [8,5,6],
      TENH: [9,0,3], SE: [9,3,2], OCLOCK: [9,5,6], AM: [0,7,2], PM: [0,9,2]
    };
    var HOURS = ["TWELVE","ONE","TWO","THREE","FOUR","FIVEH","SIX","SEVEN","EIGHT","NINE","TENH","ELEVEN"];
    var SKY = [
      { h: 0, a: "#070a16", b: "#0f1630", c: "#241c3d", star: 1 },
      { h: 4, a: "#0a0f22", b: "#1b2140", c: "#3b2a4f", star: 0.8 },
      { h: 6, a: "#2b2a55", b: "#8d4f6d", c: "#f2a06b", star: 0.15 },
      { h: 8, a: "#4f7fc4", b: "#9fc3e8", c: "#f6d9b2", star: 0 },
      { h: 12, a: "#4a8ad8", b: "#8fc0ee", c: "#dbe9f5", star: 0 },
      { h: 16, a: "#3e6fb0", b: "#a9a0c8", c: "#f0b48a", star: 0 },
      { h: 18, a: "#26314f", b: "#6b3d66", c: "#e0693f", star: 0.1 },
      { h: 20, a: "#0e1430", b: "#2a2350", c: "#5a2a4a", star: 0.7 },
      { h: 24, a: "#070a16", b: "#0f1630", c: "#241c3d", star: 1 }
    ];
    var POEMS = {
      "deep night": {
        s: ["the dark", "a hush", "the hour"],
        v: ["keeps", "folds", "holds"],
        o: ["the rooftops like a coat.", "its breath between the houses.", "the last lamp on the quay."]
      },
      dawn: {
        s: ["the first light", "a pale edge", "the birds"],
        v: ["finds", "lifts", "begin"],
        o: ["the windows one by one.", "the frost from the railings.", "their small negotiations."]
      },
      morning: {
        s: ["the kettle", "a street", "the hour"],
        v: ["learns", "fills", "opens"],
        o: ["its old song again.", "with bicycles and names.", "like a shop door."]
      },
      midday: {
        s: ["the sun", "a white hour", "the clocks"],
        v: ["stands", "rinses", "agree"],
        o: ["in the middle of the room.", "the colour out of shadows.", "for once, without argument."]
      },
      afternoon: {
        s: ["the light", "a long gold", "the desks"],
        v: ["leans", "spills", "tick"],
        o: ["into the later rooms.", "across the river like honey.", "toward an elsewhere."]
      },
      dusk: {
        s: ["the light", "a last warmth", "the city"],
        v: ["is leaving", "gathers", "puts on"],
        o: ["the rooftops one tile at a time.", "in the west like a held breath.", "its first handful of windows."]
      },
      evening: {
        s: ["the lamps", "a blue hour", "the rooms"],
        v: ["take", "settles", "keep"],
        o: ["the streets back from the sky.", "over the park like cloth.", "their private weather."]
      }
    };
    function hexTo(h) { h = h.replace("#",""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
    function toHex(r) {
      function p(n){ n=Math.max(0,Math.min(255,Math.round(n))); return (n<16?"0":"")+n.toString(16); }
      return "#"+p(r[0])+p(r[1])+p(r[2]);
    }
    function mix(a,b,t){ var A=hexTo(a),B=hexTo(b); return toHex([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]); }
    function init() {
      var grid = qs("#grid");
      var digital = qs("#digital");
      var lineA = qs("#lineA");
      var lineB = qs("#lineB");
      var periodEl = qs("#period");
      var travel = qs("#travel");
      var nowBtn = qs("#now");
      var rain = qs("#rain");
      if (!grid) return;
      var reduced = false;
      if (typeof window.matchMedia === "function") {
        try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e1) {}
      }
      var cells = [];
      ROWS.forEach(function (row) {
        row.split("").forEach(function (ch) {
          var s = document.createElement("span");
          s.className = "cell";
          s.textContent = ch;
          grid.appendChild(s);
          cells.push(s);
        });
      });
      function idx(r, c) { return r * 11 + c; }
      function light(key) {
        var w = WORDS[key];
        if (!w) return;
        var i;
        for (i = 0; i < w[2]; i++) {
          var el = cells[idx(w[0], w[1] + i)];
          if (el) el.classList.add("on");
        }
      }
      var fmt24 = false;
      var traveling = false;
      var minutes = 0;
      var lastFive = -1;
      var useA = true;
      var lastPoem = 0;
      function periodName(h) {
        if (h < 5) return "deep night";
        if (h < 7) return "dawn";
        if (h < 11) return "morning";
        if (h < 14) return "midday";
        if (h < 17) return "afternoon";
        if (h < 19) return "dusk";
        return "evening";
      }
      function applySky(h) {
        var i;
        for (i = 0; i < SKY.length - 1; i++) if (h <= SKY[i + 1].h) break;
        var a = SKY[i], b = SKY[i + 1];
        var t = (h - a.h) / (b.h - a.h || 1);
        var root = document.documentElement;
        root.style.setProperty("--bg-a", mix(a.a, b.a, t));
        root.style.setProperty("--bg-b", mix(a.b, b.b, t));
        root.style.setProperty("--bg-c", mix(a.c, b.c, t));
        root.style.setProperty("--star", String(a.star + (b.star - a.star) * t));
      }
      function sentence(p) {
        var pool = POEMS[p] || POEMS.evening;
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        return pick(pool.s) + " " + pick(pool.v) + " " + pick(pool.o);
      }
      function setPoem(p, force) {
        if (periodEl) periodEl.textContent = p;
        var next = sentence(p);
        var show = useA ? lineB : lineA;
        var hide = useA ? lineA : lineB;
        if (!show || !hide) return;
        show.textContent = next;
        if (reduced || force) {
          hide.classList.remove("show");
          show.classList.add("show");
        } else {
          hide.classList.remove("show");
          show.classList.add("show");
        }
        useA = !useA;
      }
      function render(date) {
        var h = date.getHours();
        var m = date.getMinutes();
        minutes = h * 60 + m;
        var extra = m % 5;
        var rounded = m - extra;
        var hourWord = h % 12;
        var to = false;
        if (rounded >= 35) { to = true; hourWord = (hourWord + 1) % 12; }
        cells.forEach(function (c) { c.classList.remove("on"); });
        light("IT"); light("IS");
        if (rounded === 0) light("OCLOCK");
        else if (rounded === 5 || rounded === 55) light("FIVE");
        else if (rounded === 10 || rounded === 50) light("TEN");
        else if (rounded === 15 || rounded === 45) { light("A"); light("QUARTER"); }
        else if (rounded === 20 || rounded === 40) light("TWENTY");
        else if (rounded === 25 || rounded === 35) { light("TWENTY"); light("FIVE"); }
        else if (rounded === 30) light("HALF");
        if (rounded !== 0) light(to ? "TO" : "PAST");
        light(HOURS[hourWord]);
        if (!fmt24) {
          if (h >= 12) light("PM"); else light("AM");
        }
        qsa(".dot").forEach(function (d) {
          var n = parseInt(d.getAttribute("data-m"), 10);
          if (n <= extra) d.classList.add("on"); else d.classList.remove("on");
        });
        if (digital) {
          var hh = fmt24 ? h : ((h % 12) || 12);
          var ap = fmt24 ? "" : (h >= 12 ? " PM" : " AM");
          digital.textContent = (hh < 10 ? "0" : "") + hh + ":" + (m < 10 ? "0" : "") + m + ap;
        }
        applySky(h + m / 60);
        var fiveKey = h * 12 + Math.floor(m / 5);
        if (fiveKey !== lastFive && lastFive !== -1) rainLetters();
        lastFive = fiveKey;
        if (travel && document.activeElement !== travel) travel.value = String(minutes);
      }
      var letters = "ITLISASAMPMACQUARTER";
      var drops = [];
      var rctx = rain ? rain.getContext("2d") : null;
      function resizeRain() {
        if (!rain || !rctx) return;
        var dpr = window.devicePixelRatio || 1;
        rain.width = Math.floor(window.innerWidth * dpr);
        rain.height = Math.floor(window.innerHeight * dpr);
        rain.style.width = window.innerWidth + "px";
        rain.style.height = window.innerHeight + "px";
        rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function rainLetters() {
        if (reduced || !rctx) return;
        var i;
        for (i = 0; i < 90; i++) {
          drops.push({
            x: Math.random() * window.innerWidth,
            y: -20 - Math.random() * 80,
            vy: 1.4 + Math.random() * 2.4,
            rot: Math.random() * 6,
            vr: (Math.random() - 0.5) * 0.12,
            ch: letters.charAt(Math.floor(Math.random() * letters.length)),
            a: 1
          });
        }
      }
      function tick() {
        var d;
        if (traveling && travel) {
          var mv = parseInt(travel.value, 10) || 0;
          d = new Date();
          d.setHours(Math.floor(mv / 60), mv % 60, 0, 0);
        } else d = new Date();
        render(d);
        var nowt = Date.now();
        if (nowt - lastPoem > 18000) {
          lastPoem = nowt;
          setPoem(periodName(d.getHours()));
        }
      }
      grid.addEventListener("click", function () {
        var d = traveling && travel ? (function () {
          var mv = parseInt(travel.value, 10) || 0;
          var x = new Date(); x.setHours(Math.floor(mv / 60), mv % 60, 0, 0); return x;
        })() : new Date();
        setPoem(periodName(d.getHours()));
        lastPoem = Date.now();
      });
      qsa("#themes button").forEach(function (b) {
        b.addEventListener("click", function () {
          qsa("#themes button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          var t = b.getAttribute("data-theme");
          var root = document.documentElement;
          if (t === "moon") { root.style.setProperty("--accent", "#e6f0ff"); root.style.setProperty("--glow", "rgba(230,240,255,.55)"); }
          else if (t === "verdigris") { root.style.setProperty("--accent", "#a8f0d4"); root.style.setProperty("--glow", "rgba(168,240,212,.55)"); }
          else { root.style.setProperty("--accent", "#ffd68a"); root.style.setProperty("--glow", "rgba(255,214,138,.55)"); }
        });
      });
      qsa("#fmt button").forEach(function (b) {
        b.addEventListener("click", function () {
          qsa("#fmt button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          fmt24 = b.getAttribute("data-fmt") === "24";
          tick();
        });
      });
      if (travel) travel.addEventListener("input", function () { traveling = true; tick(); });
      if (nowBtn) nowBtn.addEventListener("click", function () { traveling = false; tick(); });
      function loop() {
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
        if (rctx && drops.length) {
          rctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          var acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffd68a";
          rctx.fillStyle = acc;
          rctx.font = "700 18px Helvetica Neue, sans-serif";
          drops = drops.filter(function (d) {
            d.vy += 0.04; d.y += d.vy; d.rot += d.vr;
            if (d.y > window.innerHeight * 0.55) d.a -= 0.03;
            rctx.save();
            rctx.globalAlpha = Math.max(0, d.a);
            rctx.translate(d.x, d.y);
            rctx.rotate(d.rot);
            rctx.fillText(d.ch, 0, 0);
            rctx.restore();
            return d.a > 0 && d.y < window.innerHeight;
          });
        }
      }
      window.addEventListener("resize", resizeRain);
      resizeRain();
      setPoem(periodName(new Date().getHours()), true);
      lastPoem = Date.now();
      tick();
      window.setInterval(tick, 1000);
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
