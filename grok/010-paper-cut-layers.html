<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valley of Paper — Layered Paper-Cut Dusk</title>
  <style>
    :root {
      --sky1: #3b2a5c; --sky2: #c9698a; --sky3: #f7b26a;
      --sun: #ffd28a; --clouds: #f7d5c4;
      --s1: #8b6a9c; --s2: #6a4f83; --s3: #4f3a6b; --s4: #3a2a54;
      --s5: #2b1f44; --s6: #1c1533; --s7: #130f26;
      --win: rgba(255,200,110,0.15);
      --stars: 0; --sun-y: 0px; --moon-y: 700px;
      --mx: 0px; --my: 0px;
      --paper: #f6ead6; --ink: #3b2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--sky1), var(--sky2) 48%, var(--sky3));
      color: var(--ink);
      transition: background 0.6s linear;
    }
    .scene {
      position: fixed; inset: -6%;
      width: 112%; height: 112%;
    }
    svg.land {
      width: 100%; height: 100%; display: block;
      filter: drop-shadow(0 10px 8px rgba(20,10,40,0.35));
    }
    .layer { transform: translate(calc(var(--mx) * var(--p)), calc(var(--my) * var(--p) * 0.6)); transition: transform 0.9s ease-out; }
    .layer path, .layer use, .layer circle, .layer polygon, .layer rect, .layer ellipse { transition: fill 0.6s linear; }
    .near { filter: drop-shadow(0 18px 14px rgba(20,10,40,0.45)); }
    .star { opacity: var(--stars); }
    .sun { transform: translateY(var(--sun-y)); }
    .moon { transform: translateY(var(--moon-y)); }
    .cloud { animation: drift 160s linear infinite; }
    .c2 { animation-duration: 175s; }
    .c3 { animation-duration: 190s; }
    .pine-sway { transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }
    .p-d1 { animation-delay: 0.4s; }
    .p-d2 { animation-delay: 1.1s; }
    .p-d3 { animation-delay: 1.8s; }
    .win { fill: var(--win); transition: fill 0.6s; }
    .label {
      position: fixed; top: 22px; left: 22px; z-index: 4;
      background: var(--paper); color: var(--ink);
      border-radius: 6px; padding: 16px 18px 14px;
      box-shadow: 0 18px 40px rgba(20,10,40,0.28);
      transform: rotate(-1.2deg);
      transition: transform 0.45s cubic-bezier(0.22, 1.4, 0.36, 1), background 0.6s;
      animation: settle 1.1s ease both;
      max-width: min(420px, calc(100% - 40px));
    }
    .label::before {
      content: ""; position: absolute; top: -8px; left: 28px; width: 72px; height: 18px;
      background: rgba(255,255,255,0.45); transform: rotate(-2deg);
    }
    .label:hover { transform: rotate(0deg) translateY(-2px); }
    .label h1 { font-size: clamp(1.5rem, 3.4vw, 2.4rem); letter-spacing: -0.03em; }
    .label p { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; margin-top: 6px; opacity: 0.75; }
    .panel {
      position: fixed; right: 22px; bottom: 22px; z-index: 4;
      background: var(--paper); color: var(--ink);
      border-radius: 8px; padding: 16px 18px 14px;
      box-shadow: 0 18px 40px rgba(20,10,40,0.28);
      transform: rotate(0.8deg);
      width: min(340px, calc(100% - 40px));
      animation: settle 1.2s 0.12s ease both;
      transition: background 0.6s, color 0.6s;
    }
    .panel h2 { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 10px; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px;
      background: linear-gradient(90deg, #f7b26a, #c9698a, #3b2a5c, #050a1e);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: var(--paper); border: 2px solid #3b2a2a; cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); box-shadow: 0 0 0 4px rgba(59,42,42,0.15); }
    .clock { font-family: ui-monospace, Menlo, Consolas, monospace; margin: 8px 0 4px; font-size: 14px; }
    .ticks { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.04em; opacity: 0.7; }
    .hint { font-size: 11px; margin-top: 8px; opacity: 0.65; }
    .tilt {
      display: none; margin-top: 10px; border: 0; background: #fff; color: var(--ink);
      padding: 8px 12px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer;
      box-shadow: 0 8px 16px rgba(20,10,40,0.15);
    }
    .tilt.show { display: inline-block; }
    @keyframes drift { from { transform: translateX(-8%); } to { transform: translateX(110%); } }
    @keyframes sway { from, to { transform: rotate(-0.8deg); } 50% { transform: rotate(0.8deg); } }
    @keyframes settle { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; } }
    @media (max-width: 640px) {
      .panel { left: 12px; right: 12px; width: auto; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud, .pine-sway, .label, .panel { animation: none !important; }
      .layer { transition: none; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <svg class="land" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-label="Valley of Paper dusk landscape">
      <defs>
        <radialGradient id="sunGlow" cx="50%" cy="50%">
          <stop offset="0%" stop-color="var(--sun)"/>
          <stop offset="55%" stop-color="var(--sun)" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="var(--sun)" stop-opacity="0"/>
        </radialGradient>
        <symbol id="pine" viewBox="0 0 40 70">
          <polygon points="20,2 32,28 24,28 36,48 26,48 38,68 2,68 14,48 4,48 16,28 8,28"/>
        </symbol>
        <clipPath id="moonBite"><circle cx="1180" cy="220" r="34"/></clipPath>
      </defs>
      <g class="layer" style="--p:0.1" id="stars"></g>
      <g class="layer sun" style="--p:0.15">
        <circle cx="980" cy="210" r="90" fill="url(#sunGlow)"/>
        <circle cx="980" cy="210" r="35" fill="var(--sun)"/>
      </g>
      <g class="layer moon" style="--p:0.18">
        <circle cx="1194" cy="214" r="34" fill="#e8eefc" opacity="0.95"/>
        <circle cx="1208" cy="206" r="28" fill="var(--sky1)"/>
      </g>
      <g class="layer" style="--p:0.25">
        <g class="cloud" fill="var(--clouds)">
          <path d="M80 160 C110 120 170 118 200 150 C230 120 290 130 300 168 C330 170 330 210 280 214 L90 214 C50 210 50 176 80 160Z"/>
        </g>
        <g class="cloud c2" fill="var(--clouds)" opacity="0.85">
          <path d="M520 120 C560 90 640 88 670 122 C710 100 760 118 770 150 C800 154 790 188 740 190 L530 190 C490 186 490 140 520 120Z"/>
        </g>
        <g class="cloud c3" fill="var(--clouds)" opacity="0.7">
          <path d="M1100 150 C1140 122 1220 124 1250 154 C1290 136 1340 150 1350 180 C1380 184 1370 218 1320 220 L1110 220 C1070 216 1070 168 1100 150Z"/>
        </g>
      </g>
      <g class="layer" style="--p:0.4" fill="var(--s1)">
        <path d="M-40 520 L120 360 240 470 380 300 520 430 680 250 820 400 980 280 1140 420 1280 310 1460 430 1640 300 1640 900 -40 900Z"/>
      </g>
      <g class="layer" style="--p:0.55" fill="var(--s2)">
        <path d="M-40 560 L80 430 220 520 360 390 540 510 700 370 880 500 1060 400 1240 520 1420 410 1640 500 1640 900 -40 900Z"/>
      </g>
      <g class="layer" style="--p:0.75" fill="var(--s3)">
        <path d="M-40 620 C80 560 180 600 300 570 C460 530 520 610 680 580 C840 540 900 620 1080 590 C1240 560 1360 630 1640 600 L1640 900 -40 900Z"/>
        <use href="#pine" x="180" y="520" width="28" height="50" fill="var(--s4)"/>
        <use href="#pine" x="230" y="528" width="24" height="44" fill="var(--s4)"/>
        <use href="#pine" x="860" y="530" width="26" height="48" fill="var(--s4)"/>
        <use href="#pine" x="910" y="536" width="22" height="40" fill="var(--s4)"/>
        <use href="#pine" x="1320" y="540" width="26" height="46" fill="var(--s4)"/>
      </g>
      <g class="layer near" style="--p:0.95" fill="var(--s5)">
        <path d="M-40 690 C120 650 260 700 420 670 C600 630 720 710 920 680 C1120 650 1280 720 1640 690 L1640 900 -40 900Z"/>
        <g class="pine-sway p-d1"><use href="#pine" x="70" y="600" width="46" height="80" fill="var(--s6)"/></g>
        <g class="pine-sway p-d2"><use href="#pine" x="130" y="610" width="40" height="72" fill="var(--s6)"/></g>
        <g class="pine-sway p-d3"><use href="#pine" x="1180" y="612" width="48" height="84" fill="var(--s6)"/></g>
        <g class="pine-sway"><use href="#pine" x="1240" y="622" width="36" height="68" fill="var(--s6)"/></g>
      </g>
      <g class="layer near" style="--p:1.05" fill="var(--s6)">
        <path d="M-40 760 C200 720 360 780 560 750 C780 710 960 790 1200 760 C1400 740 1520 780 1640 760 L1640 900 -40 900Z"/>
        <g transform="translate(720,668)">
          <rect x="20" y="38" width="86" height="58" fill="var(--s7)"/>
          <polygon points="12,38 63,4 114,38" fill="var(--s7)"/>
          <rect x="78" y="10" width="12" height="22" fill="var(--s7)"/>
          <rect class="win" x="34" y="52" width="18" height="16"/>
          <rect class="win" x="74" y="52" width="18" height="16"/>
          <rect x="54" y="68" width="14" height="28" fill="#1a1428"/>
        </g>
        <use href="#pine" x="640" y="680" width="52" height="90" fill="var(--s7)"/>
        <use href="#pine" x="830" y="688" width="44" height="80" fill="var(--s7)"/>
      </g>
      <g class="layer near" style="--p:1.15" fill="var(--s7)">
        <path d="M-80 820 C200 790 500 850 860 820 C1200 790 1500 850 1680 820 L1680 980 -80 980Z"/>
        <g fill="var(--s7)" transform="translate(430,780) scale(-1,1)">
          <ellipse cx="40" cy="28" rx="28" ry="14"/>
          <path d="M12 24 C-4 10 4 2 18 10" fill="none" stroke="var(--s7)" stroke-width="5"/>
          <ellipse cx="8" cy="12" rx="8" ry="6"/>
          <ellipse cx="2" cy="6" rx="3" ry="5"/>
          <ellipse cx="10" cy="5" rx="3" ry="5"/>
          <path d="M18 8 L12 -10 M22 8 L28 -8" fill="none" stroke="var(--s7)" stroke-width="2"/>
          <rect x="22" y="38" width="4" height="18" transform="rotate(-8 24 38)"/>
          <rect x="34" y="38" width="4" height="18" transform="rotate(6 36 38)"/>
          <rect x="46" y="36" width="4" height="18" transform="rotate(-4 48 36)"/>
          <rect x="54" y="36" width="4" height="18" transform="rotate(10 56 36)"/>
          <ellipse cx="66" cy="24" rx="6" ry="3"/>
        </g>
        <use href="#pine" x="40" y="720" width="90" height="150" fill="#0d0a1c"/>
        <use href="#pine" x="1460" y="730" width="100" height="160" fill="#0d0a1c"/>
      </g>
    </svg>
  </div>
  <div class="label">
    <h1>Valley of Paper</h1>
    <p>A cut-paper dusk · move to look around</p>
  </div>
  <div class="panel">
    <h2>Time of day</h2>
    <input id="time" type="range" min="0" max="1000" value="80" aria-label="Time of day">
    <div class="clock" id="clock">18:52</div>
    <div class="ticks"><span>Golden dusk</span><span>Twilight</span><span>Blue night</span></div>
    <p class="hint">Drag the hour. Move to look around. Trees sway; stars arrive after twilight.</p>
    <button class="tilt" id="tilt" type="button">Enable tilt parallax</button>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function hexToRgb(h) {
      h = h.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function rgbToHex(c) {
      return "#" + c.map(function (n) {
        var s = Math.round(n).toString(16);
        return s.length < 2 ? "0" + s : s;
      }).join("");
    }
    function mixHex(a, b, t) {
      var A = hexToRgb(a), B = hexToRgb(b);
      return rgbToHex([lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]);
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function init() {
      var reduce = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var stars = qs("#stars");
      if (stars) {
        var seed = 7;
        function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
        var g = document.createDocumentFragment();
        for (var i = 0; i < 140; i++) {
          var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c.setAttribute("class", "star");
          c.setAttribute("cx", (rnd() * 1600).toFixed(1));
          c.setAttribute("cy", (rnd() * 420).toFixed(1));
          c.setAttribute("r", (0.6 + rnd() * 1.6).toFixed(2));
          c.setAttribute("fill", "#fff");
          if (!reduce) {
            c.style.animation = "starTw " + (1.6 + rnd() * 2.4) + "s ease-in-out " + (rnd() * 2) + "s infinite";
          }
          g.appendChild(c);
        }
        stars.appendChild(g);
        if (!reduce) {
          var st = document.createElement("style");
          st.textContent = "@keyframes starTw { 0%,100%{opacity:calc(var(--stars)*0.4)} 50%{opacity:var(--stars)} }";
          document.head.appendChild(st);
        }
      }
      var dusk = {
        sky1: "#3b2a5c", sky2: "#c9698a", sky3: "#f7b26a", sun: "#ffd28a", clouds: "#f7d5c4",
        s1: "#8b6a9c", s2: "#6a4f83", s3: "#4f3a6b", s4: "#3a2a54", s5: "#2b1f44", s6: "#1c1533", s7: "#130f26"
      };
      var night = {
        sky1: "#050a1e", sky2: "#0f1c44", sky3: "#24356a", sun: "#ff9a5a", clouds: "#3a4a7a",
        s1: "#2b3a6b", s2: "#1f2c55", s3: "#182243", s4: "#111935", s5: "#0c122a", s6: "#080c1f", s7: "#050815"
      };
      var slider = qs("#time");
      var clock = qs("#clock");
      function apply(v) {
        var t = smooth((v || 0) / 1000);
        var root = document.documentElement;
        Object.keys(dusk).forEach(function (k) {
          root.style.setProperty("--" + k, mixHex(dusk[k], night[k], t));
        });
        var starsT = 0;
        if (t > 0.35) starsT = Math.min(1, (t - 0.35) / 0.5);
        root.style.setProperty("--stars", starsT.toFixed(3));
        root.style.setProperty("--sun-y", (t * 620) + "px");
        root.style.setProperty("--moon-y", (700 - t * 700) + "px");
        var winA = lerp(0.15, 1, t);
        root.style.setProperty("--win", "rgba(255," + Math.round(lerp(200, 160, t)) + ",70," + winA.toFixed(2) + ")");
        var minutes = Math.round(18 * 60 + 40 + t * ((23 * 60 + 59) - (18 * 60 + 40)));
        var hh = Math.floor(minutes / 60);
        var mm = minutes % 60;
        if (clock) clock.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
        var paper = mixHex("#f6ead6", "#c8c2d4", t * 0.55);
        var ink = mixHex("#3b2a2a", "#1a1830", t);
        root.style.setProperty("--paper", paper);
        root.style.setProperty("--ink", ink);
      }
      if (slider) {
        slider.addEventListener("input", function () { apply(+slider.value); });
        apply(+slider.value);
      }

      var tx = 0, ty = 0, cx = 0, cy = 0;
      var tiltOn = false;
      function setTarget(nx, ny) {
        tx = Math.max(-1, Math.min(1, nx)) * 40;
        ty = Math.max(-1, Math.min(1, ny)) * 40;
      }
      window.addEventListener("pointermove", function (e) {
        setTarget((e.clientX / window.innerWidth) * 2 - 1, (e.clientY / window.innerHeight) * 2 - 1);
      });
      var scene = qs("#scene");
      if (scene) {
        scene.addEventListener("pointerdown", function (e) {
          scene._px = e.clientX; scene._py = e.clientY;
        });
        scene.addEventListener("pointermove", function (e) {
          if (e.buttons && !tiltOn) {
            setTarget((e.clientX / window.innerWidth) * 2 - 1, (e.clientY / window.innerHeight) * 2 - 1);
          }
        });
      }
      var tiltBtn = qs("#tilt");
      var coarse = typeof window.matchMedia === "function" && window.matchMedia("(pointer: coarse)").matches;
      if (coarse && tiltBtn) tiltBtn.classList.add("show");
      function onOrient(e) {
        var g = (e.gamma || 0) / 30;
        var b = ((e.beta || 45) - 45) / 30;
        setTarget(g, b);
        tiltOn = true;
      }
      if (tiltBtn) {
        tiltBtn.addEventListener("click", function () {
          var DOE = window.DeviceOrientationEvent;
          if (DOE && typeof DOE.requestPermission === "function") {
            DOE.requestPermission().then(function (s) {
              if (s === "granted") window.addEventListener("deviceorientation", onOrient);
            }).catch(function () {});
          } else {
            window.addEventListener("deviceorientation", onOrient);
          }
        });
      }
      function loop() {
        if (!reduce) {
          cx += (tx - cx) * 0.06;
          cy += (ty - cy) * 0.06;
          document.documentElement.style.setProperty("--mx", cx.toFixed(2) + "px");
          document.documentElement.style.setProperty("--my", cy.toFixed(2) + "px");
        } else {
          document.documentElement.style.setProperty("--mx", tx.toFixed(2) + "px");
          document.documentElement.style.setProperty("--my", ty.toFixed(2) + "px");
        }
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
