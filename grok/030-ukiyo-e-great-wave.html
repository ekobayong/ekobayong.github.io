<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nami no Yume — 波の夢</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 40% at 50% 30%, #3a322a, transparent 60%),
        #2a231d;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      color: #efe3c6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
    }
    h1 {
      writing-mode: horizontal-tb;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #c8b896;
      margin-bottom: 16px;
    }
    .desk {
      width: min(1200px, 96vw);
      filter: drop-shadow(0 28px 40px rgba(0,0,0,.55));
    }
    .print {
      width: 100%;
      aspect-ratio: 3 / 2;
      display: block;
      background: #efe3c6;
      transition: transform 0.9s ease;
    }
    .print.misreg .blue { transform: translate(5px, -3px); }
    .print.misreg .foam { transform: translate(-4px, 2px); }
    .print.misreg .key { transform: translate(2px, 3px); }
    .print.misreg .seal { transform: translate(-3px, -2px) rotate(-1deg); }
    .blue, .foam, .key, .seal { transition: transform 0.9s ease; }
    .controls { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .controls button {
      font-family: inherit;
      font-style: italic;
      font-size: 15px;
      background: transparent;
      color: #efe3c6;
      border: 1px solid #c8b896;
      padding: 8px 16px;
      cursor: pointer;
    }
    .controls button:hover, .controls button[aria-pressed="true"] {
      background: #b8322a;
      border-color: #b8322a;
      color: #f6efdc;
    }
    .caption-row {
      display: flex;
      justify-content: flex-end;
      width: min(1200px, 96vw);
      margin-top: 8px;
      gap: 18px;
      font-size: 12px;
      color: #c8b896;
    }
    @media (prefers-reduced-motion: reduce) {
      .print, .blue, .foam, .key, .seal { transition: none !important; }
    }
  </style>
</head>
<body>
  <h1>Nami no Yume</h1>
  <div class="desk">
    <svg class="print" id="print" viewBox="0 0 1200 800" role="img" aria-label="波の夢 — an original ukiyo-e seascape">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e9dcb9"/>
          <stop offset="55%" stop-color="#c9c0a8"/>
          <stop offset="100%" stop-color="#9fb0b3"/>
        </linearGradient>
        <linearGradient id="backW" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6f9cc2"/><stop offset="55%" stop-color="#3d6d9a"/><stop offset="100%" stop-color="#1b3a5c"/>
        </linearGradient>
        <linearGradient id="midW" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4a7ba8"/><stop offset="55%" stop-color="#2f5a86"/><stop offset="100%" stop-color="#132c47"/>
        </linearGradient>
        <linearGradient id="frontW" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a6b98"/><stop offset="55%" stop-color="#1b3a5c"/><stop offset="100%" stop-color="#0f2540"/>
        </linearGradient>
        <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#efe3c6"/><stop offset="35%" stop-color="#c5c8c0"/><stop offset="100%" stop-color="#3f5470"/>
        </linearGradient>
        <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#0f2540" stroke-width="1.2" opacity=".35"/>
        </pattern>
        <filter id="fibres">
          <feTurbulence type="turbulence" baseFrequency="0.9 0.04" numOctaves="2" result="t"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
        </filter>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
        </filter>
        <filter id="bleed">
          <feMorphology operator="dilate" radius="0.8"/>
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
      </defs>
      <rect width="1200" height="800" fill="#efe3c6"/>
      <rect width="1200" height="800" fill="url(#sky)"/>
      <rect width="1200" height="800" filter="url(#fibres)" opacity=".5"/>
      <circle cx="980" cy="140" r="54" fill="#f3e6c0" opacity=".55"/>
      <path d="M520 340 L600 180 L680 340 Z" fill="url(#mtn)"/>
      <path d="M560 210 C580 190, 620 200, 640 188" fill="none" stroke="#efe3c6" stroke-width="6" opacity=".7"/>
      <g fill="#efe3c6" opacity=".55">
        <path d="M200 160 C260 140, 300 170, 360 150"/>
        <path d="M780 120 C840 100, 900 130, 980 110"/>
      </g>
      <g class="blue">
        <path id="wBackFill" fill="url(#backW)"/>
        <path id="wBackStripe" fill="url(#stripes)"/>
        <path id="wMidFill" fill="url(#midW)"/>
        <path id="wMidStripe" fill="url(#stripes)"/>
        <path id="wFrontFill" fill="url(#frontW)"/>
        <path id="wFrontStripe" fill="url(#stripes)"/>
      </g>
      <g class="key">
        <path id="wFrontKey" fill="none" stroke="#0b1d33" stroke-width="2.5"/>
      </g>
      <g class="foam" id="foam"></g>
      <g id="boats"></g>
      <g class="seal" transform="translate(70,70)" filter="url(#bleed)">
        <rect x="0" y="0" width="72" height="92" fill="#b8322a" rx="2"/>
        <rect x="4" y="4" width="64" height="84" fill="none" stroke="#f6efdc" stroke-width="1.5"/>
        <text x="36" y="24" text-anchor="middle" fill="#f6efdc" font-size="11" font-family="Georgia, serif" letter-spacing="1">NAMI</text>
        <text x="36" y="42" text-anchor="middle" fill="#f6efdc" font-size="11" font-family="Georgia, serif" letter-spacing="1">NO</text>
        <text x="36" y="60" text-anchor="middle" fill="#f6efdc" font-size="11" font-family="Georgia, serif" letter-spacing="1">YUME</text>
        <text x="36" y="78" text-anchor="middle" fill="#f6efdc" font-size="10" font-family="Georgia, serif" letter-spacing="1">MMXXVI</text>
      </g>
      <text x="1148" y="80" writing-mode="tb" font-size="28" font-weight="700" fill="#1b3a5c" font-family="Georgia, Palatino, serif">波の夢</text>
      <text x="1118" y="90" writing-mode="tb" font-size="11" fill="#3f5470" font-family="Georgia, Palatino, serif" style="letter-spacing:4px">nami no yume</text>
      <rect width="1200" height="800" filter="url(#grain)" style="pointer-events:none" mix-blend-mode="multiply"/>
    </svg>
  </div>
  <div class="caption-row">
    <span>an original seascape in the manner of Edo woodblock</span>
  </div>
  <div class="controls">
    <button type="button" id="calm">Calm sea</button>
    <button type="button" id="storm">Rising storm</button>
    <button type="button" id="hold">Hold the block</button>
  </div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function init() {
      var print = qs("#print");
      var wBackFill = qs("#wBackFill");
      var wBackStripe = qs("#wBackStripe");
      var wMidFill = qs("#wMidFill");
      var wMidStripe = qs("#wMidStripe");
      var wFrontFill = qs("#wFrontFill");
      var wFrontStripe = qs("#wFrontStripe");
      var wFrontKey = qs("#wFrontKey");
      var foam = qs("#foam");
      var boats = qs("#boats");
      if (!print || !wFrontFill || !foam) return;
      var reduce = false;
      if (typeof window.matchMedia === "function") {
        var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
        reduce = !!(mq && mq.matches);
      }
      var amp = 1, targetAmp = 1, held = false, t = 0;
      var flecks = [];
      var i;
      for (i = 0; i < 46; i++) {
        flecks.push({ x: Math.random() * 1200, y: 420 + Math.random() * 300, life: Math.random(), vx: 0.4 + Math.random() * 0.6 });
      }
      function gauss(x, mu, s) {
        var d = (x - mu) / s;
        return Math.exp(-0.5 * d * d);
      }
      function layerY(x, time, base, a1, f1, p1, a2, f2, p2, a3, f3, p3, crest) {
        var y = base
          + a1 * Math.sin(x * f1 + time * p1)
          + a2 * Math.sin(x * f2 + time * p2)
          + a3 * Math.sin(x * f3 + time * p3);
        if (crest) {
          var g = gauss(x, 220, 90) * 330 * amp;
          if (x > 220) g *= 0.55;
          y -= g * (1 + 0.06 * Math.sin(time * 1.4));
        }
        return y;
      }
      function pathFor(fn) {
        var x, d = "M 0 800 L 0 " + fn(0);
        for (x = 8; x <= 1200; x += 8) d += " L " + x + " " + fn(x);
        d += " L 1200 800 Z";
        return d;
      }
      function slope(fn, x) {
        return (fn(x + 4) - fn(x - 4)) / 8;
      }
      function setPath(el, d) { if (el) el.setAttribute("d", d); }

      function drawFoam(fn) {
        var html = "";
        var x, y, prevY = fn(0), crests = [];
        for (x = 8; x <= 700; x += 10) {
          y = fn(x);
          if (prevY < y && y - layerY(x, t, 520, 18, 0.01, 0.8, 10, 0.021, -1.1, 6, 0.033, 1.4, false) < -80) {
            crests.push({ x: x, y: y, p: Math.min(1, (prevY - y) / 20) });
          }
          prevY = y;
        }
        crests.forEach(function (c) {
          var n = 3 + Math.round(c.p * 2);
          var k, r, ox, oy;
          html += '<path d="M ' + (c.x - 30) + ' ' + c.y + ' Q ' + c.x + ' ' + (c.y - 8) + ' ' + (c.x + 40) + ' ' + c.y + '" fill="none" stroke="#f6efdc" stroke-width="4" stroke-linecap="round"/>';
          for (k = 0; k < n; k++) {
            r = (10 - k * 1.6) * (0.6 + c.p);
            ox = c.x - 8 - k * 10;
            oy = c.y - 6 - k * 5;
            html += '<circle cx="' + ox + '" cy="' + oy + '" r="' + r + '" fill="#f6efdc"/>';
            html += '<circle cx="' + (ox - r * 0.6) + '" cy="' + (oy - r * 0.3) + '" r="' + (r * 0.45) + '" fill="#f6efdc"/>';
          }
        });
        flecks.forEach(function (f) {
          if (!held) {
            f.life += 0.008;
            if (f.life > 1) { f.life = 0; f.x = Math.random() * 500; f.y = 280 + Math.random() * 200; }
            f.x += f.vx * amp;
            f.y -= 0.35;
          }
          var a = Math.sin(f.life * Math.PI);
          html += '<circle cx="' + f.x + '" cy="' + f.y + '" r="' + (1.5 + a * 2) + '" fill="#f6efdc" opacity="' + (a * 0.9) + '"/>';
        });
        foam.innerHTML = html;
      }

      function drawBoats(fn) {
        var spots = [720, 860, 980];
        var html = "";
        spots.forEach(function (sx, idx) {
          var y = fn(sx) - 6;
          var sl = slope(fn, sx);
          var ang = Math.atan(sl) * 180 / Math.PI + Math.sin(t * 1.3 + idx) * 3;
          html += '<g transform="translate(' + sx + ',' + y + ') rotate(' + ang + ')">';
          html += '<path d="M-36 0 L36 0 L28 10 L-28 10 Z" fill="#5a3a22"/><path d="M-20 -2 L-8 -16 L4 -2" fill="#3a2416"/>';
          html += '<g fill="#2a1a12">';
          html += '<ellipse cx="-16" cy="-4" rx="4" ry="6"/><ellipse cx="-4" cy="-5" rx="4" ry="6"/><ellipse cx="8" cy="-4" rx="4" ry="6"/><ellipse cx="20" cy="-5" rx="4" ry="6"/>';
          html += '</g></g>';
        });
        boats.innerHTML = html;
      }

      function frame() {
        if (!held) t += 0.016;
        amp += (targetAmp - amp) * 0.04;
        function back(x) { return layerY(x, t, 430, 16 * amp, 0.008, 0.6, 8 * amp, 0.018, -0.9, 5 * amp, 0.03, 1.1, false); }
        function mid(x) { return layerY(x, t, 500, 22 * amp, 0.009, 0.7, 11 * amp, 0.02, -1.0, 6 * amp, 0.032, 1.2, false); }
        function front(x) { return layerY(x, t, 560, 26 * amp, 0.01, 0.85, 12 * amp, 0.022, -1.15, 7 * amp, 0.034, 1.35, true); }
        var pb = pathFor(back), pm = pathFor(mid), pf = pathFor(front);
        setPath(wBackFill, pb); setPath(wBackStripe, pb);
        setPath(wMidFill, pm); setPath(wMidStripe, pm);
        setPath(wFrontFill, pf); setPath(wFrontStripe, pf); setPath(wFrontKey, pf);
        drawFoam(front);
        drawBoats(back);
        if (!reduce && typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
      }

      print.addEventListener("mouseenter", function () { print.classList.add("misreg"); });
      print.addEventListener("mouseleave", function () { print.classList.remove("misreg"); });
      var calm = qs("#calm"), storm = qs("#storm"), hold = qs("#hold");
      if (calm) calm.addEventListener("click", function () { targetAmp = 0.45; held = false; if (hold) hold.setAttribute("aria-pressed", "false"); });
      if (storm) storm.addEventListener("click", function () { targetAmp = 1.6; held = false; if (hold) hold.setAttribute("aria-pressed", "false"); });
      if (hold) hold.addEventListener("click", function () {
        held = !held;
        hold.setAttribute("aria-pressed", held ? "true" : "false");
      });
      frame();
      if (reduce) { held = true; }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
