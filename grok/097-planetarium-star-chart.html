<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANETARIUM / A Chart of the Visible Heavens</title>
  <style>
    :root {
      --night: #070b1c; --brass: #efd9a1; --umber: #2b1c06;
      --serif: "Iowan Old Style", Palatino, "Book Antiqua", Georgia, serif;
      --mono: ui-monospace, "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #070b1c; color: var(--brass); }
    body {
      min-height: 100vh;
      background:
        radial-gradient(700px 420px at 18% 12%, #16204a, transparent 60%),
        radial-gradient(900px 600px at 82% 88%, #121a3a, transparent 55%),
        #070b1c;
      font-family: var(--serif);
    }
    .page {
      display: grid; grid-template-columns: minmax(280px, 1fr) 320px; gap: 20px;
      max-width: 1280px; margin: 0 auto; padding: 20px 18px 40px;
    }
    header.mast { grid-column: 1 / -1; text-align: center; padding: 8px 0 4px; }
    header.mast h1 {
      font-weight: 400; letter-spacing: .28em; text-transform: uppercase;
      font-size: clamp(18px, 2.4vw, 28px); text-shadow: 0 0 18px rgba(239,217,161,.35);
    }
    header.mast .rule { margin: 8px auto 0; width: min(420px, 80%); height: 1px; background: var(--brass); position: relative; }
    header.mast .rule::after { content: "✦"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #070b1c; padding: 0 8px; }
    .sky-wrap { position: relative; }
    canvas#sky { width: 100%; aspect-ratio: 1; display: block; background: transparent; }
    .tooltip {
      position: absolute; pointer-events: none; background: #f4ead2; color: #2b1c06;
      padding: 8px 10px 14px; font-size: 13px; min-width: 140px; opacity: 0;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.4));
    }
    .tooltip.on { opacity: 1; }
    .tooltip::after {
      content: ""; position: absolute; left: 16px; bottom: -8px;
      border: 8px solid transparent; border-top-color: #f4ead2; border-bottom: 0;
    }
    .tooltip b { display: block; font-weight: 600; }
    .panel {
      background: rgba(10, 16, 40, .62); border: 1px solid rgba(239,217,161,.35);
      backdrop-filter: blur(12px); padding: 16px; color: var(--brass);
    }
    .panel h2 { font-weight: 400; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; margin-bottom: 10px; }
    .panel label { display: block; font-size: 12px; margin: 10px 0 4px; }
    .panel label span { font-family: var(--mono); float: right; }
    input[type="range"], input[type="date"] { width: 100%; accent-color: var(--brass); background: #0b1230; color: var(--brass); border: 1px solid rgba(239,217,161,.3); padding: 4px; }
    .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .toggles button {
      font-family: inherit; font-size: 12px; background: transparent; color: var(--brass);
      border: 1px solid rgba(239,217,161,.35); padding: 8px 6px; cursor: pointer;
    }
    .toggles button[aria-pressed="true"] { background: rgba(239,217,161,.16); box-shadow: inset 0 0 0 1px var(--brass); }
    .row-btns { display: flex; gap: 8px; }
    .row-btns button {
      flex: 1; font-family: inherit; background: var(--brass); color: var(--umber);
      border: 0; padding: 8px; cursor: pointer; letter-spacing: .08em; text-transform: uppercase; font-size: 12px;
    }
    .card { margin-top: 16px; border-top: 1px solid rgba(239,217,161,.25); padding-top: 12px; font-size: 13px; }
    .card dl { display: grid; grid-template-columns: 80px 1fr; gap: 4px 8px; font-family: var(--mono); font-size: 12px; }
    @media (max-width: 900px) { .page { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none; } }
  </style>
</head>

        var od = observerDate();
        var lst = lstHours(od);
        projected = [];

          var p = stereo(aa, R);

        if (flags.mw) {

          [0, 7, -7].forEach(function (b, bi) {

        }
        if (flags.grid) {
          ctx.strokeStyle = "rgba(201,162,94,.18)"; ctx.lineWidth = 0.7;
          [30, 60].forEach(function (alt) {
            ctx.beginPath();
            for (var a = 0; a <= 360; a += 4) {

            ctx.stroke();
          });
          for (var az = 0; az < 360; az += 45) {

          }
        }
        if (flags.ecl) {
          ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(224,170,70,.7)"; ctx.lineWidth = 1;
          ctx.beginPath();
          var firstE = true;
          for (var lonE = 0; lonE <= 360; lonE += 3) {
            var eps = 23.44 * Math.PI / 180;
            var L = lonE * Math.PI / 180;
            var dec = Math.asin(Math.sin(eps) * Math.sin(L)) * 180 / Math.PI;
            var ra = Math.atan2(Math.cos(eps) * Math.sin(L), Math.cos(L)) * 12 / Math.PI;
            if (ra < 0) ra += 24;
            var p = projectStar({ ra: ra, dec: dec, mag: 5 });
            if (!p) { firstE = true; continue; }
            if (firstE) { ctx.moveTo(p.x, p.y); firstE = false; } else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke(); ctx.setLineDash([]);
        }
        faint.forEach(function (s) {
          var p = projectStar(s);
          if (!p) return;
          var a = Math.max(0.08, (6.8 - s.mag) / 8);
          ctx.fillStyle = "rgba(220,230,255," + a + ")";
          ctx.beginPath(); ctx.arc(p.x, p.y, 0.6, 0, Math.PI * 2); ctx.fill();
        });
        if (flags.figures) {
          Object.keys(FIGURES).forEach(function (con) {
            var pts = [];
            CATALOG.forEach(function (row) {
              if (row[5] === con || (con === "Ursa Major" && row[5] === "Ursa Major")) {
                var p = projectStar(byName[row[0]]);
                if (p) pts.push(p);
              }
            });
            if (con === "Lyra") {
              pts = ["Vega","Sheliak","Sulafat"].map(function (n) { return projectStar(byName[n]); }).filter(Boolean);
            }
            var hpts = hull(pts);
            if (hpts.length > 2) {
              var mx = 0, my = 0;
              hpts.forEach(function (p) { mx += p.x; my += p.y; });
              mx /= hpts.length; my /= hpts.length;
              var g = ctx.createRadialGradient(mx, my, 4, mx, my, 80);
              g.addColorStop(0, "rgba(201,162,94,0.13)"); g.addColorStop(1, "rgba(201,162,94,0)");
              ctx.beginPath();
              ctx.moveTo(hpts[0].x, hpts[0].y);
              hpts.forEach(function (p) { ctx.lineTo(p.x, p.y); });
              ctx.closePath(); ctx.fillStyle = g; ctx.fill();
            }
          });
        }
        if (flags.lines) {
          ctx.strokeStyle = "rgba(239,217,161,.55)"; ctx.lineWidth = 1;
          Object.keys(FIGURES).forEach(function (con) {
            FIGURES[con].forEach(function (pair) {
              var a = byName[pair[0]], b = byName[pair[1]];
              if (!a || !b) return;
              var pa = projectStar(a), pb = projectStar(b);
              if (!pa || !pb) return;
              ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
            });
          });
        }
        var tnow = Date.now() / 1000;
        CATALOG.forEach(function (row, idx) {
          var st = byName[row[0]];
          var p = projectStar(st);
          if (!p) return;
          p.star = st;
          projected.push(p);
          var tw = reduce ? 1 : 0.75 + 0.25 * Math.sin(tnow * 2.1 + idx);
          var rad = Math.max(0.8, (2.2 - st.mag) * 1.15) * tw;
          var col = tint(st.name);
          var glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 4);
          glow.addColorStop(0, col[1]); glow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(p.x, p.y, rad * 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = col[0]; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.fill();
        });
        if (flags.labels) {
          ctx.fillStyle = "rgba(239,217,161,.85)";
          ctx.font = "italic 12px Iowan Old Style, Palatino, Georgia, serif";
          ctx.textAlign = "center";
          Object.keys(FIGURES).forEach(function (con) {
            var acc = { x: 0, y: 0, n: 0 };
            FIGURES[con].forEach(function (pair) {
              var a = byName[pair[0]];
              if (!a) return;
              var p = projectStar(a);
              if (!p) return;
              acc.x += p.x; acc.y += p.y; acc.n++;
            });
            if (acc.n) ctx.fillText(con, acc.x / acc.n, acc.y / acc.n - 8);
          });
          ctx.fillStyle = "#f4ead2";
          ctx.font = "11px Iowan Old Style, Palatino, Georgia, serif";
          CATALOG.forEach(function (row) {
            if (row[3] > 1.6) return;
            var p = projectStar(byName[row[0]]);
            if (!p) return;
            ctx.fillText(row[0], p.x + 8, p.y - 6);
          });
        }
        ctx.restore();
        drawRing();
      }
      function resize() {
        var wrap = canvas.parentElement;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(w * dpr);
        draw();
      }
      if (typeof window.ResizeObserver === "function") {
        var wrap = canvas.parentElement;
        if (wrap) new ResizeObserver(resize).observe(wrap);
      }
      window.addEventListener("resize", resize);
      var last = Date.now();
      function loop() {
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
        var now = Date.now();
        var dt = (now - last) / 1000; last = now;
        if (!paused && drift > 0) {
          hourMin = (hourMin + dt * drift / 60) % 1440;
          if (hourMin < 0) hourMin += 1440;
          var ho = qs("#hour"); if (ho) ho.value = String(Math.round(hourMin));
          var hout = qs("#hourOut");
          if (hout) {
            var hh = Math.floor(hourMin / 60), mm = Math.floor(hourMin % 60);
            hout.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
          }
        }
        draw();
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(loop);
      else setInterval(draw, 80);
      resize();
      var hour = qs("#hour"), latEl = qs("#lat"), driftEl = qs("#drift");
      if (hour) hour.addEventListener("input", function () {
        hourMin = Number(hour.value);
        var hh = Math.floor(hourMin / 60), mm = hourMin % 60;
        var hout = qs("#hourOut"); if (hout) hout.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
      });
      if (latEl) latEl.addEventListener("input", function () {
        lat = Number(latEl.value);
        var lo = qs("#latOut"); if (lo) lo.textContent = (lat >= 0 ? "+" : "") + lat.toFixed(1) + "°";
      });
      if (driftEl) driftEl.addEventListener("input", function () {
        drift = Number(driftEl.value);
        var d = qs("#driftOut"); if (d) d.textContent = drift + "×";
      });
      qsa("#toggles button").forEach(function (b) {
        b.addEventListener("click", function () {
          var k = b.getAttribute("data-k");
          flags[k] = !flags[k];
          b.setAttribute("aria-pressed", flags[k] ? "true" : "false");
        });
      });
      var nowBtn = qs("#now"), pauseBtn = qs("#pause");
      if (nowBtn) nowBtn.addEventListener("click", function () {
        var n = new Date();
        hourMin = n.getHours() * 60 + n.getMinutes();
        if (hour) hour.value = String(hourMin);
        if (dateEl) dateEl.value = n.toISOString().slice(0, 10);
        var hout = qs("#hourOut");
        if (hout) hout.textContent = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
      });
      if (pauseBtn) pauseBtn.addEventListener("click", function () {
        paused = !paused; pauseBtn.textContent = paused ? "Resume" : "Pause";

        });
        if (hit && tip) {
          if (tipName) tipName.textContent = hit.star.name;
          if (tipMeta) tipMeta.textContent = hit.star.con + " · mag " + hit.star.mag.toFixed(2) + " · " + hit.star.dist + " ly";
          tip.classList.add("on");
          tip.style.left = (ev.clientX - r.left + 8) + "px";
          tip.style.top = (ev.clientY - r.top - 48) + "px";

          if (card) card.hidden = false;
          if (empty) empty.hidden = true;
          if (qs("#cName")) qs("#cName").textContent = hit.star.name;
          if (qs("#cCon")) qs("#cCon").textContent = hit.star.con;
          if (qs("#cRa")) qs("#cRa").textContent = hit.star.ra.toFixed(3) + " h";
          if (qs("#cDec")) qs("#cDec").textContent = hit.star.dec.toFixed(2) + "°";
          if (qs("#cMag")) qs("#cMag").textContent = hit.star.mag.toFixed(2);
          if (qs("#cDist")) qs("#cDist").textContent = hit.star.dist + " ly";
          if (qs("#cAlt")) qs("#cAlt").textContent = hit.alt.toFixed(1) + "°";

    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
