<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stillwater — Zen Pomodoro Focus Timer</title>
  <style>
    :root {
      --h: 200;
      --ink: hsl(var(--h) 30% 94%);
      --muted: hsla(var(--h) 30% 94% / .6);
      --hair: hsla(var(--h) 30% 94% / .12);
      --glass: hsla(var(--h) 30% 94% / .05);
      --serif: Georgia, "Iowan Old Style", Palatino, serif;
      --sans: ui-sans-serif, system-ui, "Segoe UI", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 50% 20%, hsl(calc(var(--h) + 40) 28% 16%), transparent 60%),
        radial-gradient(900px 700px at 80% 90%, hsl(calc(var(--h) + 20) 24% 14%), transparent 55%),
        hsl(var(--h) 30% 10%);
      transition: background 3s linear, color 3s linear;
      min-height: 100vh;
    }
    .stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 8% 12%, hsla(0,0%,100%,.55), transparent),
        radial-gradient(1px 1px at 22% 48%, hsla(0,0%,100%,.35), transparent),
        radial-gradient(1.5px 1.5px at 40% 18%, hsla(0,0%,100%,.5), transparent),
        radial-gradient(1px 1px at 63% 28%, hsla(0,0%,100%,.4), transparent),
        radial-gradient(1px 1px at 78% 14%, hsla(0,0%,100%,.3), transparent),
        radial-gradient(1.5px 1.5px at 88% 42%, hsla(0,0%,100%,.45), transparent),
        radial-gradient(1px 1px at 12% 72%, hsla(0,0%,100%,.35), transparent),
        radial-gradient(1px 1px at 33% 81%, hsla(0,0%,100%,.5), transparent),
        radial-gradient(1px 1px at 55% 68%, hsla(0,0%,100%,.3), transparent),
        radial-gradient(1.5px 1.5px at 71% 88%, hsla(0,0%,100%,.4), transparent),
        radial-gradient(1px 1px at 92% 76%, hsla(0,0%,100%,.35), transparent),
        radial-gradient(1px 1px at 47% 8%, hsla(0,0%,100%,.25), transparent);
    }
    .wrap {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px;
      display: grid; grid-template-columns: 1fr minmax(260px, 340px); gap: 36px; align-items: start;
    }
    header.brand { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; }
    header.brand h1 { font-weight: 300; letter-spacing: .28em; text-transform: uppercase; font-size: 13px; }
    header.brand span { color: var(--muted); font-size: 12px; }
    .stage { display: flex; flex-direction: column; align-items: center; padding-top: 12px; position: relative; }
    .halo {
      position: absolute; width: min(78vw, 440px); height: min(78vw, 440px);
      border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, hsla(calc(var(--h) + 40) 70% 70% / .28), transparent 68%);
      transform: scale(.92);
    }
    body.break .halo { opacity: 1; animation: breathe 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(.92); } 50% { transform: scale(1.08); } }
    .ring-wrap { position: relative; width: min(78vw, 440px); height: min(78vw, 440px); }
    .ring-wrap svg { width: 100%; height: 100%; display: block; }
    .gleam {
      position: absolute; inset: 6%; border-radius: 50%; pointer-events: none;
      background: conic-gradient(from 0deg, transparent 0 86%, rgba(255,255,255,.55) 92%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
      animation: spin 14s linear infinite;
    }
    body.paused .gleam { animation-play-state: paused; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .face {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; cursor: pointer;
    }
    .mode-label { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
    .time {
      font-weight: 200; font-variant-numeric: tabular-nums;
      font-size: clamp(64px, 16vw, 124px); letter-spacing: -.04em; line-height: 1;
    }
    .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .dots { display: flex; gap: 14px; margin: 22px 0 18px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      border: 1px solid hsla(var(--h) 80% 72% / .55);
      background: transparent; transition: transform .3s ease, background .3s ease, box-shadow .3s ease;
    }
    .dot.done { background: hsl(calc(var(--h) - 20) 80% 72%); box-shadow: 0 0 10px hsl(calc(var(--h) - 20) 80% 72%); }
    .dot.current { transform: scale(1.45); }
    .btns { display: flex; align-items: center; gap: 16px; }
    .icon-btn, .main-btn {
      width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--hair);
      background: var(--glass); backdrop-filter: blur(16px); color: var(--ink); cursor: pointer;
      display: grid; place-items: center;
    }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .icon-btn.reset:hover svg { transform: rotate(-40deg); transition: transform .4s ease; }
    .main-btn {
      width: 72px; height: 72px;
      background: hsla(var(--h) 30% 94% / .12);
      border-color: hsla(var(--h) 30% 94% / .22);
    }
    .main-btn svg { width: 28px; height: 28px; }
    .main-btn path { fill: var(--ink); transition: d .35s ease; }
    kbd {
      font-family: inherit; font-size: 11px; letter-spacing: .04em;
      border: 1px solid var(--hair); padding: 2px 7px; border-radius: 4px; color: var(--muted);
    }
    .keys { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; color: var(--muted); font-size: 12px; }
    .card {
      background: var(--glass); border: 1px solid var(--hair);
      backdrop-filter: blur(18px); border-radius: 20px; padding: 22px;
    }
    .card h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin-bottom: 16px; }
    .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .add-row input {
      flex: 1; background: transparent; border: 0; border-bottom: 1px solid var(--hair);
      color: var(--ink); font: inherit; padding: 8px 0; outline: none;
    }
    .add-row button {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hair);
      background: transparent; color: var(--ink); cursor: pointer; font-size: 20px;
    }
    .tasks { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .tasks li { display: grid; grid-template-columns: 22px 1fr 18px; gap: 10px; align-items: center; }
    .chk {
      width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--hair);
      background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0;
    }
    .chk i { width: 8px; height: 8px; border-radius: 50%; background: hsl(calc(var(--h) - 20) 80% 72%); transform: scale(0); transition: transform .25s ease; }
    .tasks li.done .chk i { transform: scale(1); }
    .tasks label { position: relative; color: var(--ink); cursor: pointer; }
    .tasks li.done label { color: var(--muted); }
    .tasks label::after {
      content: ""; position: absolute; left: 0; top: 50%; height: 1px; width: 0;
      background: var(--muted); transition: width .35s ease;
    }
    .tasks li.done label::after { width: 100%; }
    .rm { opacity: 0; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
    .tasks li:hover .rm { opacity: 1; }
    .stats { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(16px);
      padding: 12px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: opacity .4s ease, transform .4s ease; z-index: 5;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .bloom {
      position: fixed; left: 50%; top: 50%; width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle, hsla(calc(var(--h) + 30) 80% 80% / .7), transparent 70%);
      filter: blur(18px); transform: translate(-50%, -50%) scale(.2); opacity: 0; pointer-events: none; z-index: 4;
    }
    .bloom.play { animation: bloom 3.2s ease-out forwards; }
    @keyframes bloom {
      0% { opacity: .9; transform: translate(-50%, -50%) scale(.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(9); }
    }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      .gleam, .halo, .bloom { animation: none !important; }
      .ring-progress { transition: none !important; }
      body { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="bloom" id="bloom"></div>
  <div class="wrap">
    <header class="brand">
      <h1>Stillwater</h1>
      <span>Focus · rest · return</span>
    </header>
    <div class="stage">
      <div class="halo" aria-hidden="true"></div>
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop id="g1" offset="0%" stop-color="hsl(180 80% 72%)"/>
              <stop id="g2" offset="100%" stop-color="hsl(260 80% 70%)"/>
            </linearGradient>
          </defs>
          <g transform="translate(100 100)">
            <g id="ticks"></g>
            <circle r="88" fill="none" stroke="hsla(0,0%,100%,.12)" stroke-width="6"/>
            <circle id="progress" class="ring-progress" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="552.92" stroke-dashoffset="0" transform="rotate(-90)"/>
          </g>
        </svg>
        <div class="gleam" id="gleam"></div>
        <div class="face" id="face" title="click the numerals to edit">
          <div class="mode-label" id="modeLabel">Focus</div>
          <div class="time" id="time">25:00</div>
          <div class="hint">click the numerals to edit</div>
        </div>
      </div>
      <div class="dots" id="dots" aria-label="Session progress"></div>
      <div class="btns">
        <button type="button" class="icon-btn reset" id="reset" aria-label="Reset">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/></svg>
        </button>
        <button type="button" class="main-btn" id="toggle" aria-label="Start">
          <svg viewBox="0 0 24 24"><path id="playPath" d="M8 5 L19 12 L8 19 Z"/></svg>
        </button>
        <button type="button" class="icon-btn" id="skip" aria-label="Skip">
          <svg viewBox="0 0 24 24"><path d="M6 6 L14 12 L6 18 Z"/><path d="M16 6 V18"/></svg>
        </button>
      </div>
      <div class="keys">
        <span><kbd>space</kbd> start/pause</span>
        <span><kbd>r</kbd> reset</span>
        <span><kbd>n</kbd> skip</span>
        <span><kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> modes</span>
      </div>
    </div>
    <aside class="card">
      <h2>What deserves your attention?</h2>
      <form class="add-row" id="addForm">
        <input type="text" id="taskInput" placeholder="A single clear task" autocomplete="off">
        <button type="submit" aria-label="Add">+</button>
      </form>
      <ul class="tasks" id="tasks"></ul>
      <div class="stats">
        <span id="doneStat">0 / 0 done</span>
        <span id="minStat">0 focus minutes today</span>
      </div>
    </aside>
  </div>
  <div class="toast" id="toast">Session complete. Time to rest.</div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function init() {
      var timeEl = qs("#time");
      var modeLabel = qs("#modeLabel");
      var progress = qs("#progress");
      var g1 = qs("#g1");
      var g2 = qs("#g2");
      var toggle = qs("#toggle");
      var playPath = qs("#playPath");
      var resetBtn = qs("#reset");
      var skipBtn = qs("#skip");
      var face = qs("#face");
      var ticks = qs("#ticks");
      var dotsEl = qs("#dots");
      var toast = qs("#toast");
      var bloom = qs("#bloom");
      var tasksEl = qs("#tasks");
      var addForm = qs("#addForm");
      var taskInput = qs("#taskInput");
      var doneStat = qs("#doneStat");
      var minStat = qs("#minStat");
      if (!timeEl || !progress) return;
      var reduce = typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) progress.style.transition = "stroke-dashoffset 0.9s linear";
      var CIRC = 2 * Math.PI * 88;
      progress.setAttribute("stroke-dasharray", String(CIRC));
      if (ticks) {
        for (var i = 0; i < 60; i++) {
          var a = (i / 60) * Math.PI * 2 - Math.PI / 2;
          var inner = i % 5 === 0 ? 96 : 98;
          var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", String(Math.cos(a) * inner));
          line.setAttribute("y1", String(Math.sin(a) * inner));
          line.setAttribute("x2", String(Math.cos(a) * 100));
          line.setAttribute("y2", String(Math.sin(a) * 100));
          line.setAttribute("stroke", "hsla(0,0%,100%,.35)");
          line.setAttribute("stroke-width", i % 5 === 0 ? "1.4" : ".6");
          ticks.appendChild(line);
        }
      }
      var modes = {
        focus: { name: "Focus", mins: 25, h: 200 },
        short: { name: "Short break", mins: 5, h: 150 },
        long: { name: "Long break", mins: 15, h: 270 }
      };
      var mode = "focus";
      var remaining = modes.focus.mins * 60;
      var total = remaining;
      var running = false;
      var lastTs = 0;
      var sessionIndex = 0;
      var completedFocus = 0;
      var focusMinutes = 0;
      var audioCtx = null;
      var PLAY = "M8 5 L19 12 L8 19 Z";
      var PAUSE = "M7 5 H10 V19 H7 Z M14 5 H17 V19 H14 Z";
      if (dotsEl) {
        for (var d = 0; d < 4; d++) {
          var dot = document.createElement("span");
          dot.className = "dot" + (d === 0 ? " current" : "");
          dotsEl.appendChild(dot);
        }
      }
      function hueNow() {
        var base = modes[mode].h;
        var p = total ? 1 - remaining / total : 0;
        return base + p * 50;
      }
      function paintHue() {
        var h = hueNow();
        document.documentElement.style.setProperty("--h", String(h));
        if (g1) g1.setAttribute("stop-color", "hsl(" + (h - 20) + " 80% 72%)");
        if (g2) g2.setAttribute("stop-color", "hsl(" + (h + 60) + " 80% 70%)");
      }
      function fmt(sec) {
        var s = Math.max(0, Math.ceil(sec));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
      }
      function render() {
        timeEl.textContent = fmt(remaining);
        if (modeLabel) modeLabel.textContent = modes[mode].name;
        var p = total ? remaining / total : 0;
        progress.setAttribute("stroke-dashoffset", String(CIRC * (1 - p)));
        document.title = fmt(remaining) + " · Stillwater";
        document.body.classList.toggle("break", mode !== "focus");
        document.body.classList.toggle("paused", !running);
        if (playPath) {
          playPath.setAttribute("d", running ? PAUSE : PLAY);
          playPath.style.d = "path('" + (running ? PAUSE : PLAY) + "')";
        }
        if (toggle) toggle.setAttribute("aria-label", running ? "Pause" : "Start");
        paintHue();
        if (dotsEl) {
          var kids = dotsEl.children;
          for (var i = 0; i < kids.length; i++) {
            kids[i].className = "dot" + (i < (completedFocus % 4) ? " done" : "") + (i === (completedFocus % 4) && mode === "focus" ? " current" : "");
          }
        }
      }
      function ensureAudio() {
        if (audioCtx) return;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      function chime() {
        if (!audioCtx) return;
        var now = audioCtx.currentTime;
        var master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
        master.connect(audioCtx.destination);
        var freqs = [523.25, 659.25, 783.99, 1046.5];
        freqs.forEach(function (f, i) {
          var o = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          o.type = "sine";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now);
          var t = now + i * 0.18;
          g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
          o.connect(g); g.connect(master);
          o.start(t); o.stop(t + 1.5);
        });
        var tri = audioCtx.createOscillator();
        var tg = audioCtx.createGain();
        tri.type = "triangle";
        tri.frequency.value = 261.63 * 0.995;
        tg.gain.setValueAtTime(0.04, now);
        tg.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
        tri.connect(tg); tg.connect(master);
        tri.start(now); tri.stop(now + 2.3);
      }
      function completeSession() {
        running = false;
        if (mode === "focus") {
          completedFocus += 1;
          focusMinutes += modes.focus.mins;
          if (minStat) minStat.textContent = focusMinutes + " focus minutes today";
        }
        if (toast) {
          toast.textContent = "Session complete. Time to rest.";
          toast.classList.add("show");
          setTimeout(function () { toast.classList.remove("show"); }, 3200);
        }
        if (bloom && !reduce) {
          bloom.classList.remove("play");
          void bloom.offsetWidth;
          bloom.classList.add("play");
        }
        chime();
        if (mode === "focus") setMode(completedFocus % 4 === 0 ? "long" : "short");
        else setMode("focus");
        running = true;
        lastTs = 0;
      }
      function setMode(m) {
        mode = m;
        remaining = modes[m].mins * 60;
        total = remaining;
        render();
      }
      function frame(ts) {
        if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
        if (!running) { lastTs = ts; return; }
        if (!lastTs) lastTs = ts;
        var dt = (ts - lastTs) / 1000;
        lastTs = ts;
        remaining -= dt;
        if (remaining <= 0) { remaining = 0; render(); completeSession(); return; }
        render();
      }
      if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(frame);
      else setInterval(function () { if (running) { remaining -= 0.25; if (remaining <= 0) { remaining = 0; completeSession(); } render(); } }, 250);
      function start() {
        ensureAudio();
        if (audioCtx && audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
        running = !running;
        lastTs = 0;
        render();
      }
      if (toggle) toggle.addEventListener("click", start);
      if (resetBtn) resetBtn.addEventListener("click", function () { running = false; remaining = modes[mode].mins * 60; total = remaining; render(); });
      if (skipBtn) skipBtn.addEventListener("click", function () { remaining = 0; completeSession(); });
      if (face) face.addEventListener("click", function () {
        var v = window.prompt("Minutes for " + modes[mode].name + " (1–120)", String(modes[mode].mins));
        var n = parseInt(v, 10);
        if (!n || n < 1 || n > 120) return;
        modes[mode].mins = n;
        remaining = n * 60;
        total = remaining;
        running = false;
        render();
      });
      document.addEventListener("keydown", function (e) {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (e.code === "Space") { e.preventDefault(); start(); }
        if (e.key === "r" || e.key === "R") resetBtn && resetBtn.click();
        if (e.key === "n" || e.key === "N") skipBtn && skipBtn.click();
        if (e.key === "1") setMode("focus");
        if (e.key === "2") setMode("short");
        if (e.key === "3") setMode("long");
      });
      var tasks = [
        { t: "Draft the morning pages", done: false },
        { t: "Read twelve quiet pages", done: false },
        { t: "Walk once around the block", done: false }
      ];
      function renderTasks() {
        if (!tasksEl) return;
        tasksEl.innerHTML = "";
        tasks.forEach(function (item, idx) {
          var li = document.createElement("li");
          if (item.done) li.className = "done";
          var b = document.createElement("button");
          b.type = "button"; b.className = "chk"; b.innerHTML = "<i></i>";
          b.addEventListener("click", function () { item.done = !item.done; renderTasks(); });
          var lab = document.createElement("label");
          lab.textContent = item.t;
          var rm = document.createElement("button");
          rm.type = "button"; rm.className = "rm"; rm.textContent = "×";
          rm.addEventListener("click", function () { tasks.splice(idx, 1); renderTasks(); });
          li.appendChild(b); li.appendChild(lab); li.appendChild(rm);
          tasksEl.appendChild(li);
        });
        var done = tasks.filter(function (x) { return x.done; }).length;
        if (doneStat) doneStat.textContent = done + " / " + tasks.length + " done";
      }
      if (addForm) addForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!taskInput) return;
        var v = taskInput.value.replace(/^\s+|\s+$/g, "");
        if (!v) return;
        tasks.push({ t: v, done: false });
        taskInput.value = "";
        renderTasks();
      });
      renderTasks();
      render();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
