<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum — Palette Studio</title>
  <style>
    :root {
      --h: 212; --s: 62%; --l: 52%;
      --bg: hsl(var(--h), 18%, 97%);
      --ink: hsl(var(--h), 24%, 16%);
      --muted: hsl(var(--h), 12%, 42%);
      --line: hsl(var(--h), 30%, 82%);
      --accent: hsl(var(--h), var(--s), var(--l));
      --shadow: hsl(var(--h), 30%, 70%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 36px 20px 80px;
      transition: background 0.6s ease, color 0.6s ease;
    }
    h1, h2, .serif { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    h1 {
      font-size: clamp(36px, 5vw, 58px); font-weight: 400; letter-spacing: -0.03em; line-height: 1.05;
    }
    h1 em { font-style: italic; color: var(--accent); transition: color 0.6s ease; }
    .lede { color: var(--muted); max-width: 52ch; margin-top: 10px; line-height: 1.5; }
    .grid {
      display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px;
    }
    .card {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 24px 40px color-mix(in srgb, var(--shadow) 35%, transparent);
      padding: 22px;
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }
    h2 { font-size: 22px; font-weight: 500; margin-bottom: 14px; letter-spacing: -0.02em; }
    .plane-wrap { position: relative; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; touch-action: none; cursor: crosshair; }
    #plane {
      width: 100%; height: 100%; display: block;
      background:
        linear-gradient(to top, #808080, transparent),
        linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    }
    .puck {
      position: absolute; width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transform: translate(-50%, -50%); pointer-events: none;
      transition: transform 0.12s ease;
    }
    .plane-wrap.drag .puck { transform: translate(-50%, -50%) scale(1.18); }
    .lightness { margin-top: 14px; }
    .lightness label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    #light {
      width: 100%; appearance: none; height: 12px; border-radius: 999px; outline: none;
    }
    #light::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chips button {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer;
    }
    .chips button.on {
      background: var(--accent); color: #fff; border-color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .swatch {
      aspect-ratio: 3/4; border-radius: 14px; position: relative; overflow: hidden; cursor: pointer;
      border: 0; padding: 0; animation: pop 0.45s ease both;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }
    .swatch:nth-child(2) { animation-delay: 0.05s; }
    .swatch:nth-child(3) { animation-delay: 0.1s; }
    .swatch:nth-child(4) { animation-delay: 0.15s; }
    .swatch:nth-child(5) { animation-delay: 0.2s; }
    @keyframes pop { from { transform: translateY(10px) scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
    .swatch:hover { transform: translateY(-4px); box-shadow: 0 16px 28px rgba(0,0,0,0.16); }
    .swatch .meta {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 8px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.38));
      text-align: left; color: #fff;
    }
    .swatch.light .meta { background: linear-gradient(transparent, rgba(255,255,255,0.7)); color: #111; }
    .swatch .hex { font-weight: 700; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; display: block; }
    .swatch .cap { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; opacity: 0.85; }
    .swatch .role { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
    .copy-ico { position: absolute; top: 8px; right: 8px; opacity: 0; font-size: 12px; }
    .swatch:hover .copy-ico { opacity: 1; }
    .pairs { display: flex; flex-direction: column; gap: 8px; }
    .pair {
      display: grid; grid-template-columns: 48px 1fr auto auto; gap: 10px; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--line);
    }
    .aa { width: 44px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-family: Georgia, serif; font-size: 16px; }
    .pair .names { font-size: 12px; }
    .pair code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
    .pill { font-size: 10px; letter-spacing: 0.06em; padding: 4px 8px; border-radius: 999px; font-weight: 600; }
    .pill.aaa { background: #d8f3dc; color: #1b5e20; }
    .pill.aa { background: #e3f2fd; color: #0d47a1; }
    .pill.aal { background: #fff8e1; color: #f57f17; }
    .pill.fail { background: #ffebee; color: #b71c1c; }
    .preview {
      border-radius: 14px; padding: 18px; background: var(--pv-bg); color: var(--pv-ink);
      transition: background 0.6s ease, color 0.6s ease;
    }
    .preview h3 { font-size: 18px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pv-accent); margin-right: 6px; }
    .bar { height: 6px; background: color-mix(in srgb, var(--pv-ink) 12%, transparent); border-radius: 99px; margin: 12px 0; }
    .bar i { display: block; height: 100%; width: 62%; background: var(--pv-primary); border-radius: inherit; transition: background 0.6s ease; }
    .btns { display: flex; gap: 8px; margin-top: 10px; }
    .btns button, .export-row button {
      border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 12px;
    }
    .pri { background: var(--pv-primary); color: var(--pv-surface); border: 0; }
    .ghost { background: transparent; border: 1px solid color-mix(in srgb, var(--pv-ink) 25%, transparent); color: inherit; }
    .tags { display: flex; gap: 6px; margin-top: 10px; }
    .tags span { font-size: 11px; padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--pv-accent) 22%, transparent); }
    .export-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .export-row button { border: 1px solid var(--line); background: #fff; }
    textarea {
      width: 100%; min-height: 160px; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px; border-radius: 10px; border: 1px solid var(--line); padding: 10px; resize: vertical;
      background: #fff;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1a1a1a; color: #fff; border-radius: 999px; padding: 8px 14px;
      display: none; align-items: center; gap: 8px; font-size: 13px; z-index: 9;
    }
    .toast.show { display: flex; transform: translateX(-50%); }
    .toast i { width: 12px; height: 12px; border-radius: 2px; display: block; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .swatches { grid-template-columns: repeat(3, 1fr); } }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Spectrum <em>Palette Studio</em></h1>
      <p class="lede">Tune a base colour, harvest a harmony, and watch the page itself take on the hue. Copy HEX, check contrast, export CSS.</p>
    </header>
    <div class="grid">
      <div>
        <section class="card">
          <h2>Base color</h2>
          <div class="plane-wrap" id="plane-wrap" tabindex="0">
            <div id="plane"></div>
            <div class="puck" id="puck"></div>
          </div>
          <div class="lightness">
            <label for="light">Lightness</label>
            <input type="range" id="light" min="8" max="92" value="52">
          </div>
        </section>
        <section class="card" style="margin-top:18px">
          <h2>Harmony</h2>
          <div class="chips" id="chips">
            <button type="button" data-rule="Analogous" class="on">Analogous</button>
            <button type="button" data-rule="Complementary">Complementary</button>
            <button type="button" data-rule="Triadic">Triadic</button>
            <button type="button" data-rule="Split-complementary">Split-complementary</button>
            <button type="button" data-rule="Monochrome">Monochrome</button>
          </div>
          <div class="swatches" id="swatches"></div>
        </section>
      </div>
      <div>
        <section class="card">
          <h2>Contrast check</h2>
          <div class="pairs" id="pairs"></div>
        </section>
        <section class="card" style="margin-top:18px">
          <h2>Live preview</h2>
          <div class="preview" id="preview">
            <h3><span class="dot"></span>Marigold Studio — Autumn collection is live</h3>
            <div class="bar"><i></i></div>
            <div class="btns">
              <button class="pri" type="button">Shop now</button>
              <button class="ghost" type="button">Lookbook</button>
            </div>
            <div class="tags"><span>wool</span><span>ochre</span><span>limited</span></div>
          </div>
        </section>
        <section class="card" style="margin-top:18px">
          <h2>Export</h2>
          <div class="export-row">
            <button type="button" id="shuffle">Shuffle</button>
            <button type="button" id="copycss">Copy CSS</button>
          </div>
          <textarea id="cssout" readonly></textarea>
        </section>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><i id="toast-sw"></i><span id="toast-tx">Copied</span></div>
  <script>
  (function () {
    "use strict";
    if (typeof window === "undefined" || typeof document === "undefined") return;
    function qs(sel, root) {
      try { return (root || document).querySelector(sel); } catch (e) { return null; }
    }
    function qsa(sel, root) {
      try { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); } catch (e) { return []; }
    }
    function init() {
      var H = 212, S = 62, L = 52;
      var rule = "Analogous";
      var palette = {};
      var wrap = qs("#plane-wrap");
      var puck = qs("#puck");
      var light = qs("#light");
      var swatches = qs("#swatches");
      var pairs = qs("#pairs");
      var cssout = qs("#cssout");
      var toast = qs("#toast");
      var toastSw = qs("#toast-sw");
      var toastTx = qs("#toast-tx");
      var preview = qs("#preview");

      function hslStr(h, s, l) { return "hsl(" + Math.round(h) + ", " + Math.round(s) + "%, " + Math.round(l) + "%)"; }
      function hslToRgb(h, s, l) {
        s /= 100; l /= 100;
        var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
      }
      function toHex(h, s, l) {
        var rgb = hslToRgb(((h % 360) + 360) % 360, s, l);
        function hex(n) { var t = n.toString(16); return t.length < 2 ? "0" + t : t; }
        return ("#" + hex(rgb[0]) + hex(rgb[1]) + hex(rgb[2])).toUpperCase();
      }
      function lum(rgb) {
        function f(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
        return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
      }
      function contrast(a, b) {
        var L1 = lum(hslToRgb(a.h, a.s, a.l)), L2 = lum(hslToRgb(b.h, b.s, b.l));
        var hi = Math.max(L1, L2), lo = Math.min(L1, L2);
        return (hi + 0.05) / (lo + 0.05);
      }
      function wrapHue(h) { return ((h % 360) + 360) % 360; }
      function col(h, s, l) { return { h: wrapHue(h), s: s, l: l }; }

      function harmony() {
        var p = { Primary: col(H, S, L) };
        if (rule === "Analogous") {
          p.Secondary = col(H + 28, S * 0.86, L + 4);
          p.Accent = col(H - 32, Math.min(80, S + 8), L - 2);
        } else if (rule === "Complementary") {
          p.Secondary = col(H + 180, S * 0.8, L);
          p.Accent = col(H + 180, S * 0.55, L + 12);
        } else if (rule === "Triadic") {
          p.Secondary = col(H + 120, S * 0.82, L);
          p.Accent = col(H + 240, S * 0.78, L + 4);
        } else if (rule === "Split-complementary") {
          p.Secondary = col(H + 150, S * 0.8, L);
          p.Accent = col(H + 210, S * 0.78, L + 2);
        } else {
          p.Secondary = col(H, Math.max(8, S - 28), Math.min(86, L + 16));
          p.Accent = col(H, Math.min(90, S + 10), Math.max(18, L - 18));
        }
        p.Surface = col(H, Math.max(8, S * 0.18), 96);
        p.Ink = col(H, Math.max(10, S * 0.35), 14);
        return p;
      }

      function grade(ratio) {
        if (ratio >= 7) return { t: "AAA", c: "aaa" };
        if (ratio >= 4.5) return { t: "AA", c: "aa" };
        if (ratio >= 3) return { t: "AA Large", c: "aal" };
        return { t: "Fail", c: "fail" };
      }

      function render() {
        document.documentElement.style.setProperty("--h", String(Math.round(H)));
        document.documentElement.style.setProperty("--s", Math.round(S) + "%");
        document.documentElement.style.setProperty("--l", Math.round(L) + "%");
        if (light) {
          light.style.background = "linear-gradient(90deg, " + hslStr(H, S, 8) + ", " + hslStr(H, S, 92) + ")";
        }
        if (puck && wrap) {
          puck.style.left = (H / 360 * 100) + "%";
          puck.style.top = ((1 - S / 100) * 100) + "%";
          puck.style.background = hslStr(H, S, L);
        }
        palette = harmony();
        if (swatches) {
          swatches.innerHTML = "";
          ["Primary", "Secondary", "Accent", "Surface", "Ink"].forEach(function (role) {
            var c = palette[role];
            var hex = toHex(c.h, c.s, c.l);
            var rgb = hslToRgb(c.h, c.s, c.l);
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "swatch" + (c.l > 62 ? " light" : "");
            btn.style.background = hex;
            btn.innerHTML = "<span class='copy-ico'>⧉</span><span class='meta'><span class='role'>" + role + "</span><span class='hex'>" + hex + "</span><span class='cap'>rgb(" + rgb.join(", ") + ")<br>hsl(" + Math.round(c.h) + ", " + Math.round(c.s) + "%, " + Math.round(c.l) + "%)</span></span>";
            btn.addEventListener("click", function () { copyHex(hex); });
            swatches.appendChild(btn);
          });
        }
        if (pairs) {
          var checks = [
            ["Ink", "Surface"], ["Primary", "Surface"], ["Surface", "Primary"],
            ["Ink", "Primary"], ["Surface", "Ink"], ["Accent", "Surface"]
          ];
          pairs.innerHTML = checks.map(function (pr) {
            var fg = palette[pr[0]], bg = palette[pr[1]];
            var ratio = contrast(fg, bg);
            var g = grade(ratio);
            var fgH = toHex(fg.h, fg.s, fg.l), bgH = toHex(bg.h, bg.s, bg.l);
            return "<div class='pair'><div class='aa' style='color:" + fgH + ";background:" + bgH + "'>Aa</div><div class='names'>" + pr[0].toLowerCase() + " on " + pr[1].toLowerCase() + "<br><code>" + fgH + " / " + bgH + "</code></div><div>" + ratio.toFixed(2) + "</div><span class='pill " + g.c + "'>" + g.t + "</span></div>";
          }).join("");
        }
        if (preview) {
          preview.style.setProperty("--pv-bg", toHex(palette.Surface.h, palette.Surface.s, palette.Surface.l));
          preview.style.setProperty("--pv-ink", toHex(palette.Ink.h, palette.Ink.s, palette.Ink.l));
          preview.style.setProperty("--pv-primary", toHex(palette.Primary.h, palette.Primary.s, palette.Primary.l));
          preview.style.setProperty("--pv-accent", toHex(palette.Accent.h, palette.Accent.s, palette.Accent.l));
          preview.style.setProperty("--pv-surface", toHex(palette.Surface.h, palette.Surface.s, palette.Surface.l));
        }
        if (cssout) {
          cssout.value = ":root {\n  /* " + rule + " · base " + toHex(H, S, L) + " */\n" +
            "  --color-primary: " + toHex(palette.Primary.h, palette.Primary.s, palette.Primary.l) + "; /* " + hslStr(palette.Primary.h, palette.Primary.s, palette.Primary.l) + " */\n" +
            "  --color-secondary: " + toHex(palette.Secondary.h, palette.Secondary.s, palette.Secondary.l) + "; /* " + hslStr(palette.Secondary.h, palette.Secondary.s, palette.Secondary.l) + " */\n" +
            "  --color-accent: " + toHex(palette.Accent.h, palette.Accent.s, palette.Accent.l) + "; /* " + hslStr(palette.Accent.h, palette.Accent.s, palette.Accent.l) + " */\n" +
            "  --color-surface: " + toHex(palette.Surface.h, palette.Surface.s, palette.Surface.l) + "; /* " + hslStr(palette.Surface.h, palette.Surface.s, palette.Surface.l) + " */\n" +
            "  --color-ink: " + toHex(palette.Ink.h, palette.Ink.s, palette.Ink.l) + "; /* " + hslStr(palette.Ink.h, palette.Ink.s, palette.Ink.l) + " */\n}";
        }
      }

      function copyHex(hex) {
        function show() {
          if (toastSw) toastSw.style.background = hex;
          if (toastTx) toastTx.textContent = hex + " copied";
          if (toast) { toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 1600); }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(hex).then(show).catch(show);
        } else show();
      }

      function setFromEvent(e) {
        if (!wrap) return;
        var r = wrap.getBoundingClientRect();
        var x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        var y = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
        H = x * 360;
        S = (1 - y) * 100;
        render();
      }
      if (wrap) {
        var drag = false;
        wrap.addEventListener("pointerdown", function (e) {
          drag = true; wrap.classList.add("drag"); setFromEvent(e);
          try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
        });
        wrap.addEventListener("pointermove", function (e) { if (drag) setFromEvent(e); });
        wrap.addEventListener("pointerup", function () { drag = false; wrap.classList.remove("drag"); });
        wrap.addEventListener("keydown", function (e) {
          var step = e.shiftKey ? 10 : 2;
          if (e.key === "ArrowLeft") { H = wrapHue(H - step); }
          else if (e.key === "ArrowRight") { H = wrapHue(H + step); }
          else if (e.key === "ArrowUp") { S = Math.min(100, S + step); }
          else if (e.key === "ArrowDown") { S = Math.max(0, S - step); }
          else return;
          e.preventDefault();
          render();
        });
      }
      if (light) light.addEventListener("input", function () { L = Number(light.value); render(); });
      qsa("#chips button").forEach(function (b) {
        b.addEventListener("click", function () {
          rule = b.getAttribute("data-rule") || "Analogous";
          qsa("#chips button").forEach(function (x) { x.classList.toggle("on", x === b); });
          render();
        });
      });
      var sh = qs("#shuffle");
      if (sh) sh.addEventListener("click", function () {
        H = Math.random() * 360;
        S = 42 + Math.random() * 38;
        L = 42 + Math.random() * 18;
        if (light) light.value = String(Math.round(L));
        render();
      });
      var cc = qs("#copycss");
      if (cc) cc.addEventListener("click", function () {
        var txt = cssout ? cssout.value : "";
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
        if (toastTx) toastTx.textContent = "CSS copied";
        if (toast) { toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 1600); }
      });
      render();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
  </script>
</body>
</html>
