<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RAIN.TYPE — Digital Rain Reimagined as Typographic Art</title>
<style>
:root {
  --bg-color: #04100c;
  --head-color: #e8fff3;
  --mid-color: #5cffb0;
  --tail-color: #0b6b46;
  --hud-bg: rgba(4, 16, 12, 0.72);
  --hud-border: rgba(92, 255, 176, 0.28);
  --hud-text: #e8fff3;
  --hud-muted: rgba(232, 255, 243, 0.6);
  --accent-glow: rgba(92, 255, 176, 0.4);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-color);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color: var(--hud-text);
  transition: background-color 0.4s ease;
}

canvas#rain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  display: block;
  cursor: crosshair;
}

.vignette {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 80%, rgba(0, 0, 0, 0.88) 100%);
}

.hud-panel {
  position: absolute;
  top: 24px;
  left: 24px;
  z-index: 10;
  width: 320px;
  max-width: calc(100vw - 48px);
  background: var(--hud-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--hud-border);
  padding: 16px 18px;
  border-radius: 2px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 0 12px var(--accent-glow);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
}

/* Bracket corners */
.hud-panel::before, .hud-panel::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  border-color: var(--mid-color);
  pointer-events: none;
}
.hud-panel::before {
  top: -1px;
  left: -1px;
  border-top: 2px solid var(--mid-color);
  border-left: 2px solid var(--mid-color);
}
.hud-panel::after {
  bottom: -1px;
  right: -1px;
  border-bottom: 2px solid var(--mid-color);
  border-right: 2px solid var(--mid-color);
}

.hud-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--hud-border);
}

.hud-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--head-color);
  display: flex;
  align-items: center;
}

.cursor-block {
  display: inline-block;
  width: 7px;
  height: 12px;
  margin-left: 6px;
  background-color: var(--mid-color);
  animation: blink 1.1s infinite steps(1);
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.hud-group {
  margin-bottom: 14px;
}

.hud-label {
  color: var(--hud-muted);
  font-size: 10px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}

.palettes {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.swatch-btn {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  padding: 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: center;
  transition: all 0.2s;
}

.swatch-btn:hover {
  border-color: var(--head-color);
  transform: translateY(-1px);
}

.swatch-btn.active {
  border-color: var(--head-color);
  box-shadow: 0 0 8px var(--mid-color);
  background: rgba(255, 255, 255, 0.05);
}

.swatch-bar {
  width: 100%;
  height: 6px;
  border-radius: 1px;
}

.swatch-name {
  font-size: 8px;
  color: var(--hud-text);
  white-space: nowrap;
}

.control-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.15);
  outline: none;
  border-radius: 2px;
  margin: 6px 0;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  background: var(--head-color);
  box-shadow: 0 0 6px var(--mid-color);
  cursor: pointer;
  border-radius: 1px;
  transition: transform 0.15s;
}

input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.3);
}

.cmd-box {
  display: flex;
  align-items: center;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--hud-border);
  padding: 4px 8px;
  border-radius: 2px;
  gap: 6px;
}

.cmd-box:focus-within {
  border-color: var(--mid-color);
  box-shadow: 0 0 8px var(--accent-glow);
}

.cmd-prefix {
  color: var(--mid-color);
  font-weight: bold;
}

.cmd-input {
  background: transparent;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 11px;
  color: var(--head-color);
  width: 100%;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.cmd-input::placeholder {
  color: var(--hud-muted);
  text-transform: lowercase;
}

.status-line {
  margin-top: 10px;
  font-size: 10px;
  color: var(--mid-color);
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-bullet {
  width: 4px;
  height: 4px;
  background: var(--mid-color);
  border-radius: 50%;
  box-shadow: 0 0 4px var(--mid-color);
}

.footer-info {
  position: absolute;
  z-index: 10;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--hud-muted);
  pointer-events: none;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.bottom-left {
  bottom: 20px;
  left: 24px;
  max-width: 320px;
  line-height: 1.4;
}

.bottom-right {
  bottom: 20px;
  right: 24px;
  text-align: right;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: reduce) {
  .cursor-block {
    animation: none;
    opacity: 1;
  }
}

@media (max-width: 600px) {
  .hud-panel {
    top: 12px;
    left: 12px;
    width: calc(100vw - 24px);
    max-width: none;
    padding: 12px 14px;
  }
  .bottom-left {
    display: none;
  }
  .bottom-right {
    bottom: 12px;
    right: 14px;
    font-size: 9px;
  }
}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="vignette"></div>

<div class="hud-panel">
  <div class="hud-header">
    <div class="hud-title">RAIN.TYPE <span class="cursor-block"></span></div>
    <span style="font-size:9px; color:var(--hud-muted);">SYS.060</span>
  </div>

  <div class="hud-group">
    <div class="hud-label">
      <span>Color Swatch</span>
      <span>[1-4]</span>
    </div>
    <div class="palettes" id="paletteList"></div>
  </div>

  <div class="control-row">
    <div class="hud-label">
      <span>Stream Density</span>
      <span id="densityVal">85%</span>
    </div>
    <input type="range" id="densitySlider" min="10" max="100" value="85">
  </div>

  <div class="control-row">
    <div class="hud-label">
      <span>Speed Modifier</span>
      <span id="speedVal">1.0×</span>
    </div>
    <input type="range" id="speedSlider" min="0.2" max="2.5" step="0.05" value="1.0">
  </div>

  <div class="hud-group" style="margin-bottom:6px;">
    <div class="hud-label">Message Stream</div>
    <div class="cmd-box">
      <span class="cmd-prefix">&gt;</span>
      <input type="text" id="cmdInput" class="cmd-input" placeholder="type phrase &amp; press enter" maxlength="40" spellcheck="false" autocomplete="off">
    </div>
  </div>

  <div class="status-line" id="statusLine">
    <span class="status-bullet"></span>
    <span id="statusText">Rain cascade idle</span>
  </div>
</div>

<div class="footer-info bottom-left">
  60 Curated Glyphs: 24 Invented Ideographs, 10 Numerals, 26 Monospace Capitals. Pre-rendered 14-stop luminosity atlas.
</div>

<div class="footer-info bottom-right">
  <div id="statGrid">GRID: -- × --</div>
  <div id="statStreams">STREAMS: -- ACTIVE</div>
  <div id="statFps">FPS: 60.0</div>
</div>

<script>
/**
 * RAIN.TYPE — Typographic Art Digital Rain
 */

const PALETTES = [
  { id: 'jade', name: 'Jade', bg: '#04100c', head: '#e8fff3', mid: '#5cffb0', tail: '#0b6b46' },
  { id: 'amber', name: 'Amber', bg: '#0d0903', head: '#fff3d6', mid: '#ffb347', tail: '#7a4a0a' },
  { id: 'ice', name: 'Ice', bg: '#050912', head: '#f4fbff', mid: '#8fd3ff', tail: '#1f4f7a' },
  { id: 'rose', name: 'Rose', bg: '#0f050a', head: '#ffe9f1', mid: '#ff6fa3', tail: '#7a1f45' }
];

let activePaletteIdx = 0;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// 24 custom constructed glyphs on 10x10 coordinate space
const CUSTOM_PATHS = [
  "M 5,1 L 5,9 M 1,4 L 9,4 M 2,8 L 8,8",       // Cross & double base
  "M 2,2 L 8,2 L 8,8 L 2,8 Z M 5,2 L 5,8",     // Box with central divider
  "M 2,2 L 8,2 L 5,6 L 5,9",                   // T-junction hook
  "M 2,2 L 8,2 L 3,8 L 8,8",                   // Z chevron variant
  "M 2,3 L 5,1 L 8,3 L 8,7 L 5,9 L 2,7 Z",     // Hexagonal seed
  "M 2,2 L 2,8 M 5,1 L 5,9 M 8,2 L 8,8",       // Tri-verticals
  "M 2,2 L 8,2 L 5,5 M 2,8 L 5,5 L 8,8",       // Inward arrows
  "M 2,2 L 5,5 L 2,8 M 8,2 L 5,5 L 8,8",       // Facing chevrons
  "M 1,3 L 9,3 M 3,1 L 3,9 M 7,1 L 7,9",       // Gate / Torii variant
  "M 2,5 L 5,2 L 8,5 L 5,8 Z M 5,1 L 5,9",     // Diamond pierced
  "M 2,3 L 8,3 M 5,3 L 2,9 M 5,3 L 8,9",       // Radiating leg hook
  "M 2,2 L 8,2 L 8,6 L 2,6 L 2,9 L 8,9",       // Serpentine labyrinth
  "M 2,1 L 2,9 L 8,9 M 8,1 L 8,5 L 5,5",       // Offset brackets
  "M 5,1 L 9,5 L 5,9 L 1,5 Z",                 // Clean lozenge
  "M 2,2 L 5,8 L 8,2 M 2,5 L 8,5",             // Cross-bar inverted apex
  "M 2,2 L 8,8 M 8,2 L 2,8 M 5,1 L 5,9",       // Eight-fold stellar
  "M 2,2 L 8,2 L 8,9 M 2,5 L 6,5",             // High-mast key
  "M 5,1 L 5,9 M 2,4 L 5,1 L 8,4",             // Upward arrow spine
  "M 2,3 L 8,3 L 5,9 M 2,7 L 8,7",             // Dual shelf acute
  "M 3,1 L 7,1 L 7,7 L 3,7 Z M 5,7 L 5,9",     // Padlock core
  "M 1,2 L 9,8 M 1,8 L 9,2",                   // Angular saltire
  "M 2,2 L 8,2 L 2,8 L 8,8 Z",                 // Hourglass contour
  "M 2,1 L 8,1 M 5,1 L 2,6 L 8,6 L 5,9",       // Hooked spindle
  "M 2,4 L 5,1 L 8,4 L 5,7 Z M 5,7 L 5,10"     // Spired drop
];

// Combine to create the 60 glyph definitions
const GLYPHS = [];
CUSTOM_PATHS.forEach(p => GLYPHS.push({ type: 'path', path: new Path2D(p) }));
for (let i = 0; i < 10; i++) GLYPHS.push({ type: 'char', char: String(i) });
for (let i = 65; i <= 90; i++) GLYPHS.push({ type: 'char', char: String.fromCharCode(i) });

const NUM_GLYPHS = GLYPHS.length; // 60
const NUM_LEVELS = 14;

// Canvas & Grid State
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d', { alpha: false });

let dpr = window.devicePixelRatio || 1;
let cellWidth = 22;
let cellHeight = 26;
let cols = 0;
let rows = 0;

// Streams & Grid Buffers
let streams = [];
let gridGlyphs = null;
let gridBright = null;
let gridLocked = null; // null or { charGlyphIdx, scale, targetRow, lockedTime, dissolving, dissolveTime }

// Performance Sprite Atlas
let atlasCanvas = document.createElement('canvas');
let atlasCtx = atlasCanvas.getContext('2d', { alpha: true });
let atlasCellW = 0;
let atlasCellH = 0;

// Settings & Controls
let density = prefersReducedMotion ? 0.35 : 0.85;
let speedMod = prefersReducedMotion ? 0.35 : 1.0;

// Message Mode State
let messageState = {
  text: '',
  active: false,
  targetCols: [],
  targetRow: 0,
  resolvedCount: 0,
  totalCount: 0,
  phase: 'idle', // 'idle', 'resolving', 'holding', 'dissolving'
  holdTimer: 0
};

// UI Elements
const paletteListEl = document.getElementById('paletteList');
const densitySlider = document.getElementById('densitySlider');
const densityVal = document.getElementById('densityVal');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const cmdInput = document.getElementById('cmdInput');
const statusText = document.getElementById('statusText');
const statGrid = document.getElementById('statGrid');
const statStreams = document.getElementById('statStreams');
const statFps = document.getElementById('statFps');

// Interpolate hex colors
function parseHex(hex) {
  let c = parseInt(hex.slice(1), 16);
  return [(c >> 16) & 255, (c >> 8) & 255, c & 255];
}

function lerpColor(c1, c2, t) {
  return [
    Math.round(c1[0] + (c2[0] - c1[0]) * t),
    Math.round(c1[1] + (c2[1] - c1[1]) * t),
    Math.round(c1[2] + (c2[2] - c1[2]) * t)
  ];
}

function buildAtlas() {
  const pal = PALETTES[activePaletteIdx];
  const rgbHead = parseHex(pal.head);
  const rgbMid = parseHex(pal.mid);
  const rgbTail = parseHex(pal.tail);

  // Atlas resolution per cell based on screen cell dimensions
  atlasCellW = Math.ceil(cellWidth * dpr);
  atlasCellH = Math.ceil(cellHeight * dpr);

  atlasCanvas.width = atlasCellW * NUM_LEVELS;
  atlasCanvas.height = atlasCellH * NUM_GLYPHS;

  atlasCtx.clearRect(0, 0, atlasCanvas.width, atlasCanvas.height);

  for (let g = 0; g < NUM_GLYPHS; g++) {
    const glyph = GLYPHS[g];

    for (let l = 0; l < NUM_LEVELS; l++) {
      const norm = l / (NUM_LEVELS - 1); // 0 = tail, 1 = head
      let rgb, alpha;

      if (norm < 0.45) {
        const t = norm / 0.45;
        rgb = lerpColor(rgbTail, rgbMid, t);
        alpha = 0.15 + t * 0.85; // Low brightness has alpha fade
      } else {
        const t = (norm - 0.45) / 0.55;
        rgb = lerpColor(rgbMid, rgbHead, t);
        alpha = 1.0;
      }

      const colorStr = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      const destX = l * atlasCellW;
      const destY = g * atlasCellH;

      atlasCtx.save();
      atlasCtx.translate(destX, destY);

      // Brightest head level carries glowing shadow
      if (l === NUM_LEVELS - 1) {
        atlasCtx.shadowColor = pal.mid;
        atlasCtx.shadowBlur = 8 * dpr;
      } else if (l >= NUM_LEVELS - 3) {
        atlasCtx.shadowColor = pal.tail;
        atlasCtx.shadowBlur = 3 * dpr;
      }

      atlasCtx.fillStyle = colorStr;
      atlasCtx.strokeStyle = colorStr;
      atlasCtx.lineWidth = 1.8 * dpr;
      atlasCtx.lineCap = 'round';
      atlasCtx.lineJoin = 'round';

      if (glyph.type === 'char') {
        const fontSize = Math.floor(atlasCellH * 0.72);
        atlasCtx.font = `bold ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
        atlasCtx.textAlign = 'center';
        atlasCtx.textBaseline = 'middle';
        atlasCtx.fillText(glyph.char, atlasCellW / 2, atlasCellH / 2 + 1 * dpr);
      } else {
        // Path2D on a 10-unit grid
        const padX = atlasCellW * 0.22;
        const padY = atlasCellH * 0.2;
        const innerW = atlasCellW - padX * 2;
        const innerH = atlasCellH - padY * 2;

        atlasCtx.save();
        atlasCtx.translate(padX, padY);
        atlasCtx.scale(innerW / 10, innerH / 10);
        atlasCtx.stroke(glyph.path);
        atlasCtx.restore();
      }

      atlasCtx.restore();
    }
  }
}

function updateThemeCSS() {
  const pal = PALETTES[activePaletteIdx];
  const root = document.documentElement;
  root.style.setProperty('--bg-color', pal.bg);
  root.style.setProperty('--head-color', pal.head);
  root.style.setProperty('--mid-color', pal.mid);
  root.style.setProperty('--tail-color', pal.tail);
  root.style.setProperty('--hud-border', pal.mid + '44');
  root.style.setProperty('--hud-bg', pal.bg + 'ba');
  root.style.setProperty('--accent-glow', pal.mid + '33');
}

function setPalette(index) {
  activePaletteIdx = index;
  document.querySelectorAll('.swatch-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx === index);
  });
  updateThemeCSS();
  buildAtlas();
}

function resizeGrid() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  dpr = window.devicePixelRatio || 1;

  if (w <= 600) {
    cellWidth = 18;
    cellHeight = 22;
  } else if (w >= 2000) {
    cellWidth = 26;
    cellHeight = 32;
  } else {
    cellWidth = 22;
    cellHeight = 27;
  }

  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);

  const prevCols = cols;
  const prevRows = rows;

  cols = Math.ceil(w / cellWidth);
  rows = Math.ceil(h / cellHeight);

  // Preserve & init buffers
  const newGlyphs = new Int16Array(cols * rows);
  const newBright = new Float32Array(cols * rows);
  const newLocked = new Array(cols * rows).fill(null);

  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      const idx = c * rows + r;
      if (c < prevCols && r < prevRows) {
        const oldIdx = c * prevRows + r;
        newGlyphs[idx] = gridGlyphs ? gridGlyphs[oldIdx] : Math.floor(Math.random() * NUM_GLYPHS);
        newBright[idx] = gridBright ? gridBright[oldIdx] : 0;
        newLocked[idx] = gridLocked ? gridLocked[oldIdx] : null;
      } else {
        newGlyphs[idx] = Math.floor(Math.random() * NUM_GLYPHS);
        newBright[idx] = 0;
        newLocked[idx] = null;
      }
    }
  }

  gridGlyphs = newGlyphs;
  gridBright = newBright;
  gridLocked = newLocked;

  // Initialize stream columns
  streams = [];
  for (let c = 0; c < cols; c++) {
    streams.push({
      col: c,
      head: -Math.random() * rows,
      speed: 6 + Math.random() * 10, // rows/sec
      active: Math.random() < density,
      targetLockRow: -1
    });
  }

  buildAtlas();
  statGrid.textContent = `GRID: ${cols} × ${rows}`;
}

function triggerMessage(text) {
  const clean = text.toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim();
  if (!clean) return;

  const length = Math.min(clean.length, 40, cols - 2);
  const startCol = Math.max(1, Math.floor((cols - length) / 2));
  const targetRow = Math.floor(rows * 0.46);

  messageState = {
    text: clean.slice(0, length),
    active: true,
    targetCols: [],
    targetRow: targetRow,
    resolvedCount: 0,
    totalCount: length,
    phase: 'resolving',
    holdTimer: 0
  };

  statusText.textContent = `Resolving 0 / ${length}`;

  for (let i = 0; i < length; i++) {
    const char = clean[i];
    const colIdx = startCol + i;
    const cellIdx = colIdx * rows + targetRow;

    // Remove old lock if any
    gridLocked[cellIdx] = null;

    if (char === ' ') {
      messageState.totalCount--;
      continue;
    }

    let glyphIndex = -1;
    for (let g = 0; g < NUM_GLYPHS; g++) {
      if (GLYPHS[g].type === 'char' && GLYPHS[g].char === char) {
        glyphIndex = g;
        break;
      }
    }
    if (glyphIndex === -1) glyphIndex = 30; // fallback

    messageState.targetCols.push({
      col: colIdx,
      charIndex: glyphIndex,
      char: char,
      resolved: false
    });

    // Wake and reposition stream above row
    const stream = streams[colIdx];
    stream.active = true;
    stream.targetLockRow = targetRow;
    stream.head = Math.min(stream.head, -2 - Math.random() * 8);
    stream.speed = 11 + Math.random() * 6; // Swift arrival
  }
}

function releaseLocks(instant = false) {
  if (!messageState.active) return;

  if (instant) {
    for (let i = 0; i < cols * rows; i++) {
      gridLocked[i] = null;
    }
    messageState.active = false;
    messageState.phase = 'idle';
    statusText.textContent = 'Rain cascade idle';
    return;
  }

  messageState.phase = 'dissolving';
  statusText.textContent = 'Dissolving message...';

  const now = performance.now();
  messageState.targetCols.forEach(tc => {
    const idx = tc.col * rows + messageState.targetRow;
    if (gridLocked[idx]) {
      gridLocked[idx].dissolving = true;
      gridLocked[idx].dissolveTime = now + Math.random() * 1600; // Released at random time over 1.6s
    }
  });
}

// Render Loop
let lastTime = performance.now();
let fpsFrames = 0;
let fpsLastTime = lastTime;

function frame(time) {
  requestAnimationFrame(frame);

  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  // FPS metric
  fpsFrames++;
  if (time - fpsLastTime >= 500) {
    const fps = (fpsFrames * 1000) / (time - fpsLastTime);
    statFps.textContent = `FPS: ${fps.toFixed(1)}`;
    fpsFrames = 0;
    fpsLastTime = time;
  }

  // Fade decay factor: e^(-1.6 * dt)
  const decay = Math.exp(-1.6 * dt);
  const pal = PALETTES[activePaletteIdx];

  // Tail flicker: ~15% swap glyph
  const allowFlicker = !prefersReducedMotion;

  let activeStreamsCount = 0;

  // Update Streams
  for (let c = 0; c < cols; c++) {
    const s = streams[c];

    if (!s.active) {
      if (Math.random() < density * 0.015) s.active = true;
      continue;
    }

    activeStreamsCount++;
    const prevHead = s.head;
    s.head += s.speed * speedMod * dt;

    const startRow = Math.max(0, Math.floor(prevHead));
    const endRow = Math.min(rows - 1, Math.floor(s.head));

    for (let r = startRow; r <= endRow; r++) {
      const idx = c * rows + r;

      // Lock stream head check
      if (s.targetLockRow === r) {
        const tc = messageState.targetCols.find(t => t.col === c);
        if (tc && !tc.resolved) {
          tc.resolved = true;
          messageState.resolvedCount++;
          gridLocked[idx] = {
            charGlyphIdx: tc.charIndex,
            scaleAnim: 1.7,
            startTime: time,
            dissolving: false,
            dissolveTime: 0
          };
          s.targetLockRow = -1; // Done locking
          statusText.textContent = `Resolving ${messageState.resolvedCount} / ${messageState.totalCount}`;

          if (messageState.resolvedCount >= messageState.totalCount) {
            messageState.phase = 'holding';
            messageState.holdTimer = time;
            statusText.textContent = 'Locked · holding (4.5s)';
          }
        }
      }

      // If cell is locked, streams skip altering its glyph
      if (gridLocked[idx]) {
        continue;
      }

      gridGlyphs[idx] = Math.floor(Math.random() * NUM_GLYPHS);
      gridBright[idx] = 1.0;
    }

    // Reset when stream leaves bottom
    if (s.head >= rows + 12) {
      s.head = -Math.random() * 10;
      s.speed = 6 + Math.random() * 10;
      s.active = Math.random() < density;
    }

    // Tail flicker randomly across column
    if (allowFlicker && Math.random() < 0.15) {
      const randR = Math.floor(Math.random() * rows);
      const fIdx = c * rows + randR;
      if (!gridLocked[fIdx] && gridBright[fIdx] > 0.08) {
        gridGlyphs[fIdx] = Math.floor(Math.random() * NUM_GLYPHS);
      }
    }
  }

  statStreams.textContent = `STREAMS: ${activeStreamsCount} ACTIVE`;

  // Message mode state handling
  if (messageState.active) {
    if (messageState.phase === 'holding') {
      const elapsed = (time - messageState.holdTimer) / 1000;
      const left = Math.max(0, 4.5 - elapsed).toFixed(1);
      statusText.textContent = `Locked · holding (${left}s)`;
      if (elapsed >= 4.5) {
        releaseLocks();
      }
    } else if (messageState.phase === 'dissolving') {
      let stillLocked = 0;
      for (let i = 0; i < cols * rows; i++) {
        const lk = gridLocked[i];
        if (lk) {
          if (lk.dissolving && time >= lk.dissolveTime) {
            gridLocked[i] = null;
          } else {
            stillLocked++;
          }
        }
      }
      if (stillLocked === 0) {
        messageState.active = false;
        messageState.phase = 'idle';
        statusText.textContent = 'Rain cascade idle';
      }
    }
  }

  // Render to canvas
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const drawW = atlasCellW;
  const drawH = atlasCellH;

  for (let c = 0; c < cols; c++) {
    const colX = Math.round(c * cellWidth * dpr);

    for (let r = 0; r < rows; r++) {
      const idx = c * rows + r;
      const locked = gridLocked[idx];

      if (locked) {
        // Locked glyph rendering
        const glyphIdx = locked.charGlyphIdx;
        const progress = Math.min(1.0, (time - locked.startTime) / 350);
        // Pop scale from 1.7 to 1.0
        const scale = 1.0 + 0.7 * Math.pow(1 - progress, 2);

        // Soft halo pulse
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.005);
        const colY = Math.round(r * cellHeight * dpr);

        ctx.save();
        ctx.translate(colX + drawW / 2, colY + drawH / 2);
        if (scale !== 1.0) ctx.scale(scale, scale);

        // Bright halo
        ctx.shadowColor = pal.head;
        ctx.shadowBlur = (10 + pulse * 8) * dpr;

        // Draw top brightest glyph from atlas
        const sx = (NUM_LEVELS - 1) * atlasCellW;
        const sy = glyphIdx * atlasCellH;
        ctx.drawImage(atlasCanvas, sx, sy, drawW, drawH, -drawW / 2, -drawH / 2, drawW, drawH);

        // Thin underline in head colour
        ctx.shadowBlur = 4 * dpr;
        ctx.fillStyle = pal.head;
        const ulY = drawH / 2 - 2 * dpr;
        ctx.fillRect(-drawW * 0.38, ulY, drawW * 0.76, 2 * dpr);

        ctx.restore();

        // Keep local brightness up
        gridBright[idx] = 1.0;
        continue;
      }

      // Normal fading cell
      let b = gridBright[idx];
      if (b <= 0.02) continue;

      b *= decay;
      gridBright[idx] = b;

      const level = Math.min(NUM_LEVELS - 1, Math.floor(b * NUM_LEVELS));
      const g = gridGlyphs[idx];

      const sx = level * atlasCellW;
      const sy = g * atlasCellH;
      const colY = Math.round(r * cellHeight * dpr);

      ctx.drawImage(atlasCanvas, sx, sy, drawW, drawH, colX, colY, drawW, drawH);
    }
  }
}

// Build Swatch Selector in HUD
function initHUD() {
  paletteListEl.innerHTML = '';
  PALETTES.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = `swatch-btn ${idx === activePaletteIdx ? 'active' : ''}`;
    btn.innerHTML = `
      <div class="swatch-bar" style="background: linear-gradient(90deg, ${p.head}, ${p.mid}, ${p.tail})"></div>
      <span class="swatch-name">${p.name}</span>
    `;
    btn.onclick = () => setPalette(idx);
    paletteListEl.appendChild(btn);
  });

  densitySlider.value = Math.round(density * 100);
  densityVal.textContent = `${densitySlider.value}%`;
  densitySlider.addEventListener('input', (e) => {
    density = parseInt(e.target.value, 10) / 100;
    densityVal.textContent = `${e.target.value}%`;
    streams.forEach(s => {
      s.active = Math.random() < density;
    });
  });

  speedSlider.value = speedMod;
  speedVal.textContent = `${speedMod.toFixed(1)}×`;
  speedSlider.addEventListener('input', (e) => {
    speedMod = parseFloat(e.target.value);
    speedVal.textContent = `${speedMod.toFixed(1)}×`;
  });

  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const val = cmdInput.value;
      if (val.trim()) {
        triggerMessage(val);
        cmdInput.blur();
      }
    }
  });

  // Clicking canvas releases message or triggers dynamic pulse
  canvas.addEventListener('pointerdown', (e) => {
    if (messageState.active) {
      releaseLocks(true);
    } else {
      // Spawn extra streams nearby
      const col = Math.floor((e.clientX / window.innerWidth) * cols);
      for (let dc = -2; dc <= 2; dc++) {
        const c = col + dc;
        if (c >= 0 && c < cols) {
          streams[c].active = true;
          streams[c].head = 0;
          streams[c].speed = 14 + Math.random() * 8;
        }
      }
    }
  });

  // Keyboard shortcut 1-4 for palettes
  window.addEventListener('keydown', (e) => {
    if (document.activeElement === cmdInput) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= 4) {
      setPalette(num - 1);
    }
  });

  window.addEventListener('resize', () => {
    resizeGrid();
  });
}

// Initialization sequence
window.addEventListener('DOMContentLoaded', () => {
  initHUD();
  updateThemeCSS();
  resizeGrid();
  requestAnimationFrame(frame);

  // Demo phrase auto-resolve after 2 seconds
  setTimeout(() => {
    if (!messageState.active) {
      cmdInput.value = 'TYPE IS RAIN';
      triggerMessage('TYPE IS RAIN');
    }
  }, 2000);
});
</script>
