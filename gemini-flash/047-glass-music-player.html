<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen — Glass Music Player</title>
  <style>
    :root {
      --a1: #ff7a59;
      --a2: #ffd166;
      --a3: #7b61ff;
      --text-main: #f6f3ff;
      --text-muted: rgba(246, 243, 255, 0.62);
      --font-serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --spring-timing: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b0a14;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-sans);
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background System */
    .aurora-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .aurora-radial-wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, color-mix(in srgb, var(--a1) 28%, transparent), transparent 60%),
        radial-gradient(circle at 85% 80%, color-mix(in srgb, var(--a3) 32%, transparent), transparent 65%);
      transition: background 1200ms ease;
    }

    .aurora-disc {
      position: absolute;
      width: 130vmax;
      height: 130vmax;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      background: conic-gradient(from 0deg, var(--a1), var(--a2), var(--a3), var(--a1));
      border-radius: 50%;
      filter: blur(70px);
      animation: spin-aurora 90s linear infinite;
      opacity: 0.65;
      transition: background 1200ms ease;
    }

    @keyframes spin-aurora {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .aurora-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(11, 10, 20, 0.4) 0%, rgba(11, 10, 20, 0.95) 80%);
    }

    .grain-layer {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
      mix-blend-mode: overlay;
    }

    /* Glass Slab Container */
    .player-frame {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100dvh;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      display: flex;
      flex-direction: column;
      padding: 16px 24px 20px;
      overflow: hidden;
    }

    /* Sheen Overlay */
    .player-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 60%);
      pointer-events: none;
      border-radius: inherit;
    }

    .notch-pill {
      display: none;
      width: 110px;
      height: 24px;
      background: #000;
      border-radius: 12px;
      margin: -4px auto 12px;
      flex-shrink: 0;
    }

    @media (min-width: 761px) {
      .player-frame {
        width: 420px;
        height: 860px;
        border-radius: 44px;
      }
      .notch-pill {
        display: block;
      }
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .top-bar-title {
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .glass-btn-round {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s, transform 0.15s;
    }

    .glass-btn-round:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }
    .glass-btn-round:active {
      transform: scale(0.95);
    }

    /* Hero Section */
    .hero-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      position: relative;
      flex-shrink: 0;
    }

    .vinyl-stage {
      position: relative;
      width: 116px;
      height: 116px;
      flex-shrink: 0;
    }

    .vinyl-record {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, transparent 38%, rgba(0,0,0,0.85) 40%, #0d0d12 42%),
        repeating-radial-gradient(circle at center, #111 0px, #111 1.5px, #1c1a24 2px, #0f0e16 3px);
      position: relative;
      box-shadow: 0 10px 24px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(0deg);
      transition: transform 0.3s ease;
    }

    .playing .vinyl-record {
      animation: spin-vinyl 4s linear infinite;
    }

    @keyframes spin-vinyl {
      to { transform: rotate(360deg); }
    }

    /* Specular Record Sheen */
    .vinyl-record::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 45deg,
        rgba(255,255,255,0.15) 0deg,
        transparent 60deg,
        rgba(255,255,255,0.1) 180deg,
        transparent 240deg,
        rgba(255,255,255,0.15) 360deg
      );
      pointer-events: none;
    }

    .vinyl-label {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--a1), var(--a2), var(--a3), var(--a1));
      border: 2px solid #000;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 1200ms ease;
    }

    .vinyl-center-hole {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0b0a14;
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* Tonearm */
    .tonearm {
      position: absolute;
      top: -4px;
      right: -8px;
      width: 44px;
      height: 68px;
      transform-origin: 36px 8px;
      transform: rotate(-32deg);
      transition: transform 700ms var(--spring-timing);
      pointer-events: none;
      z-index: 5;
    }

    .playing .tonearm {
      transform: rotate(-12deg);
    }

    .tonearm-base {
      position: absolute;
      top: 0;
      right: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #444;
      border: 2px solid #777;
    }

    .tonearm-rod {
      position: absolute;
      top: 8px;
      right: 7px;
      width: 3px;
      height: 52px;
      background: linear-gradient(to bottom, #aaa, #eee, #888);
      border-radius: 2px;
      transform: rotate(14deg);
      transform-origin: top center;
    }

    .tonearm-head {
      position: absolute;
      bottom: -6px;
      left: -5px;
      width: 8px;
      height: 14px;
      background: #222;
      border-radius: 2px;
      border: 1px solid #555;
    }

    /* Hero Meta */
    .hero-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .song-title {
      font-family: var(--font-serif);
      font-size: 24px;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .artist-name {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 2px;
    }

    .album-line {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--a1);
      transition: color 1200ms ease;
      margin-bottom: 10px;
    }

    /* Equalizer */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }

    .eq-bar {
      width: 3px;
      height: 15%;
      border-radius: 2px;
      background: var(--a1);
      transition: background 1200ms ease;
      transform-origin: bottom;
    }

    .playing .eq-bar {
      animation: bounce-eq 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { animation-duration: 0.7s; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { animation-duration: 0.6s; animation-delay: 0.15s; }
    .eq-bar:nth-child(4) { animation-duration: 1.1s; animation-delay: 0.4s; }
    .eq-bar:nth-child(5) { animation-duration: 0.85s; animation-delay: 0.05s; }
    .eq-bar:nth-child(6) { animation-duration: 0.65s; animation-delay: 0.25s; }
    .eq-bar:nth-child(7) { animation-duration: 1.0s; animation-delay: 0.35s; }
    .eq-bar:nth-child(8) { animation-duration: 0.75s; animation-delay: 0.2s; }

    @keyframes bounce-eq {
      0% { height: 15%; }
      100% { height: 100%; }
    }

    /* Progress Track */
    .progress-section {
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .progress-track-wrapper {
      position: relative;
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      position: relative;
      overflow: visible;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--a1), var(--a2));
      border-radius: 4px;
      pointer-events: none;
      transition: background 1200ms ease;
    }

    .progress-knob {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      pointer-events: none;
    }

    .progress-track-wrapper:hover .progress-knob,
    .progress-track-wrapper.scrubbing .progress-knob {
      transform: translate(-50%, -50%) scale(1.4);
      box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.45);
    }

    .time-readout {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .ctrl-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      position: relative;
      transition: color 0.2s, transform 0.15s;
    }

    .ctrl-icon-btn:hover {
      color: var(--text-main);
      transform: scale(1.1);
    }
    .ctrl-icon-btn:active {
      transform: scale(0.92);
    }

    .ctrl-icon-btn.active {
      color: var(--a1);
    }

    .play-pause-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--a1), var(--a2));
      border: none;
      color: #0b0a14;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--a1) 45%, transparent);
      transition: transform 0.2s var(--spring-timing), box-shadow 0.3s, background 1200ms ease;
    }

    .play-pause-btn:hover {
      transform: scale(1.06);
    }
    .play-pause-btn:active {
      transform: scale(0.94);
    }

    /* Like Button & Burst */
    .like-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .like-btn svg {
      transition: transform 0.3s var(--spring-timing);
    }

    .like-btn.liked svg {
      fill: #ff3366;
      stroke: #ff3366;
      animation: like-bounce 0.45s var(--spring-timing);
    }

    @keyframes like-bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.45); }
      100% { transform: scale(1); }
    }

    .particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .particle.animate {
      animation: particle-fly 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes particle-fly {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
        opacity: 0;
      }
    }

    /* Volume Slider */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .vol-icon {
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .volume-track-wrapper {
      flex: 1;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }

    .volume-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      position: relative;
    }

    .volume-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 75%;
      background: var(--text-main);
      border-radius: 4px;
    }

    .volume-readout {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      width: 26px;
      text-align: right;
    }

    /* Track List */
    .tracklist-container {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 0 -8px;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
    }

    /* Fade Masks */
    .tracklist-mask {
      overflow-y: auto;
      height: 100%;
      padding: 4px 0;
      mask-image: linear-gradient(to bottom, transparent 0%, black 6%, black 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 6%, black 94%, transparent 100%);
      scrollbar-width: none;
    }

    .tracklist-mask::-webkit-scrollbar {
      display: none;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .track-row:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .track-row.active {
      background: rgba(255, 255, 255, 0.14);
    }

    .track-idx {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      width: 18px;
      display: flex;
      justify-content: center;
    }

    .track-row.active .track-idx {
      color: var(--a1);
      font-weight: 700;
      transition: color 1200ms ease;
    }

    .track-color-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-row.active .track-name {
      font-weight: 600;
    }

    /* Tiny Row Equalizer */
    .row-eq {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      margin-right: 6px;
    }

    .track-row.active .row-eq {
      display: flex;
    }

    .row-eq-bar {
      width: 2px;
      height: 30%;
      background: var(--a1);
      border-radius: 1px;
      transition: background 1200ms ease;
    }

    .playing .track-row.active .row-eq-bar {
      animation: row-eq-anim 0.6s ease-in-out infinite alternate;
    }
    .track-row.active .row-eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .track-row.active .row-eq-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes row-eq-anim {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    .track-duration {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .aurora-disc,
      .playing .vinyl-record,
      .playing .eq-bar,
      .playing .track-row.active .row-eq-bar,
      .like-btn.liked svg,
      .particle.animate {
        animation: none !important;
      }
      .track-row, .tonearm, .glass-btn-round, .ctrl-icon-btn, .play-pause-btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Backdrop -->
  <div class="aurora-container">
    <div class="aurora-radial-wash"></div>
    <div class="aurora-disc"></div>
    <div class="aurora-vignette"></div>
    <div class="grain-layer"></div>
  </div>

  <!-- Glass Device Shell -->
  <main class="player-frame" id="player">
    <div class="notch-pill"></div>

    <!-- Top Navigation -->
    <header class="top-bar">
      <button class="glass-btn-round" title="Back" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <span class="top-bar-title">Now Playing</span>
      <button class="glass-btn-round" title="Menu" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1.5"/><circle cx="6" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>
        </svg>
      </button>
    </header>

    <!-- Hero Showcase -->
    <section class="hero-row">
      <div class="vinyl-stage">
        <div class="vinyl-record">
          <div class="vinyl-label">
            <div class="vinyl-center-hole"></div>
          </div>
        </div>
        <div class="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearm-rod">
            <div class="tonearm-head"></div>
          </div>
        </div>
      </div>
      <div class="hero-meta">
        <h1 class="song-title" id="track-title">Salt &amp; Static</h1>
        <div class="artist-name">Ondine Vale</div>
        <div class="album-line">Lumen (2026)</div>
        <div class="equalizer" aria-hidden="true">
          <div class="eq-bar"></div><div class="eq-bar"></div>
          <div class="eq-bar"></div><div class="eq-bar"></div>
          <div class="eq-bar"></div><div class="eq-bar"></div>
          <div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
      </div>
    </section>

    <!-- Progress Controls -->
    <section class="progress-section">
      <div class="progress-track-wrapper" id="progress-wrapper" tabindex="0" role="slider" aria-label="Playback Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
          <div class="progress-knob" id="progress-knob"></div>
        </div>
      </div>
      <div class="time-readout">
        <span id="time-current">0:00</span>
        <span id="time-total">3:42</span>
      </div>
    </section>

    <!-- Playback Controls -->
    <section class="controls-row">
      <button class="ctrl-icon-btn" id="shuffle-btn" title="Shuffle" aria-label="Shuffle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
        </svg>
      </button>
      <button class="ctrl-icon-btn" id="prev-btn" title="Previous" aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button class="play-pause-btn" id="play-btn" title="Play/Pause" aria-label="Play">
        <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>
        <svg id="pause-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/>
        </svg>
      </button>
      <button class="ctrl-icon-btn" id="next-btn" title="Next" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
      <div class="like-wrapper">
        <button class="ctrl-icon-btn like-btn" id="like-btn" title="Like track" aria-label="Like track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Volume Bar -->
    <section class="volume-row">
      <span class="vol-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </span>
      <div class="volume-track-wrapper" id="volume-wrapper" tabindex="0" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75">
        <div class="volume-bar-bg">
          <div class="volume-bar-fill" id="volume-fill"></div>
        </div>
      </div>
      <span class="volume-readout" id="volume-val">75%</span>
    </section>

    <!-- Scrollable Tracklist -->
    <section class="tracklist-container">
      <div class="tracklist-mask" id="tracklist">
        <!-- Rendered via JS -->
      </div>
    </section>
  </main>

  <script>
    const TRACKS = [
      { id: 0, title: "Salt & Static", durationSec: 222, durationStr: "3:42", colors: ["#ff7a59", "#ffd166", "#7b61ff"] },
      { id: 1, title: "Harbour Lights (Late)", durationSec: 254, durationStr: "4:14", colors: ["#4cc9f0", "#f72585", "#3a0ca3"] },
      { id: 2, title: "Paper Moons", durationSec: 198, durationStr: "3:18", colors: ["#e0aaff", "#c77dff", "#7b2cbf"] },
      { id: 3, title: "Glasshouse", durationSec: 241, durationStr: "4:01", colors: ["#80ed99", "#38a3a5", "#22577a"] },
      { id: 4, title: "Nineteen Winters", durationSec: 263, durationStr: "4:23", colors: ["#90e0ef", "#00b4d8", "#0077b6"] },
      { id: 5, title: "Tidal Arithmetic", durationSec: 187, durationStr: "3:07", colors: ["#ff99c8", "#fcf6bd", "#d0f4de"] },
      { id: 6, title: "Streetlamp Choir", durationSec: 236, durationStr: "3:56", colors: ["#f3c053", "#e2711d", "#cc2936"] },
      { id: 7, title: "Lumen (Reprise)", durationSec: 259, durationStr: "4:19", colors: ["#a8dadc", "#f1faee", "#1d3557"] }
    ];

    let currentTrackIdx = 0;
    let isPlaying = false;
    let currentTime = 0;
    let isScrubbing = false;
    let isShuffle = false;
    let likes = new Set();
    let volume = 0.75;
    let lastAnimTimestamp = null;

    // Elements
    const playerEl = document.getElementById('player');
    const trackTitleEl = document.getElementById('track-title');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const likeBtn = document.getElementById('like-btn');
    const likeWrapper = document.querySelector('.like-wrapper');
    const progressWrapper = document.getElementById('progress-wrapper');
    const progressFill = document.getElementById('progress-fill');
    const progressKnob = document.getElementById('progress-knob');
    const timeCurrentEl = document.getElementById('time-current');
    const timeTotalEl = document.getElementById('time-total');
    const tracklistEl = document.getElementById('tracklist');
    const volumeWrapper = document.getElementById('volume-wrapper');
    const volumeFill = document.getElementById('volume-fill');
    const volumeVal = document.getElementById('volume-val');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderTracklist() {
      tracklistEl.innerHTML = "";
      TRACKS.forEach((track, index) => {
        const row = document.createElement('div');
        row.className = `track-row ${index === currentTrackIdx ? 'active' : ''}`;
        row.setAttribute('role', 'button');
        row.setAttribute('tabindex', '0');
        row.innerHTML = `
          <div class="track-idx">${index + 1}</div>
          <div class="track-color-dot" style="background: ${track.colors[0]}; box-shadow: 0 0 8px ${track.colors[0]}88;"></div>
          <div class="track-info">
            <div class="track-name">${track.title}</div>
          </div>
          <div class="row-eq">
            <div class="row-eq-bar"></div>
            <div class="row-eq-bar"></div>
            <div class="row-eq-bar"></div>
          </div>
          <div class="track-duration">${track.durationStr}</div>
        `;

        row.addEventListener('click', () => {
          loadTrack(index, true);
        });

        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            loadTrack(index, true);
          }
        });

        tracklistEl.appendChild(row);
      });
    }

    function updateThemeColors(colors) {
      document.documentElement.style.setProperty('--a1', colors[0]);
      document.documentElement.style.setProperty('--a2', colors[1]);
      document.documentElement.style.setProperty('--a3', colors[2]);
    }

    function loadTrack(index, startPlaying = false) {
      currentTrackIdx = index;
      const track = TRACKS[currentTrackIdx];
      currentTime = 0;
      trackTitleEl.textContent = track.title;
      timeTotalEl.textContent = track.durationStr;
      updateProgressUI(0);
      updateThemeColors(track.colors);

      // Update active track row
      document.querySelectorAll('.track-row').forEach((row, i) => {
        row.classList.toggle('active', i === currentTrackIdx);
      });

      // Update Like Status
      likeBtn.classList.toggle('liked', likes.has(currentTrackIdx));

      if (startPlaying) {
        setPlaybackState(true);
      }
    }

    function setPlaybackState(play) {
      isPlaying = play;
      playerEl.classList.toggle('playing', isPlaying);
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
      playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      lastAnimTimestamp = null;
    }

    function togglePlayback() {
      setPlaybackState(!isPlaying);
    }

    function updateProgressUI(timeSec) {
      const track = TRACKS[currentTrackIdx];
      const pct = Math.min(100, Math.max(0, (timeSec / track.durationSec) * 100));
      progressFill.style.width = `${pct}%`;
      progressKnob.style.left = `${pct}%`;
      timeCurrentEl.textContent = formatTime(timeSec);
      progressWrapper.setAttribute('aria-valuenow', Math.round(pct));
    }

    // Animation / Progress Loop
    function playbackLoop(timestamp) {
      if (isPlaying && !isScrubbing) {
        if (!lastAnimTimestamp) lastAnimTimestamp = timestamp;
        const delta = (timestamp - lastAnimTimestamp) / 1000;
        lastAnimTimestamp = timestamp;

        currentTime += delta;
        const track = TRACKS[currentTrackIdx];

        if (currentTime >= track.durationSec) {
          nextTrack();
        } else {
          updateProgressUI(currentTime);
        }
      } else {
        lastAnimTimestamp = null;
      }
      requestAnimationFrame(playbackLoop);
    }
    requestAnimationFrame(playbackLoop);

    function nextTrack() {
      let nextIdx;
      if (isShuffle) {
        nextIdx = Math.floor(Math.random() * TRACKS.length);
        if (nextIdx === currentTrackIdx && TRACKS.length > 1) {
          nextIdx = (nextIdx + 1) % TRACKS.length;
        }
      } else {
        nextIdx = (currentTrackIdx + 1) % TRACKS.length;
      }
      loadTrack(nextIdx, isPlaying);
    }

    function prevTrack() {
      if (currentTime > 3) {
        currentTime = 0;
        updateProgressUI(0);
      } else {
        const prevIdx = (currentTrackIdx - 1 + TRACKS.length) % TRACKS.length;
        loadTrack(prevIdx, isPlaying);
      }
    }

    // Like Button Burst Animation
    function createLikeBurst() {
      const burstColors = ['#ff3366', '#ffd166', '#ff7a59', '#ff99c8'];
      const numParticles = 10;
      for (let i = 0; i < numParticles; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (i / numParticles) * Math.PI * 2 + (Math.random() * 0.2 - 0.1);
        const dist = 32 + Math.random() * 20;
        const dx = Math.cos(angle) * dist + 'px';
        const dy = Math.sin(angle) * dist + 'px';
        p.style.setProperty('--dx', dx);
        p.style.setProperty('--dy', dy);
        p.style.backgroundColor = burstColors[Math.floor(Math.random() * burstColors.length)];
        likeWrapper.appendChild(p);

        p.classList.add('animate');
        p.addEventListener('animationend', () => p.remove());
      }
    }

    function toggleLike() {
      if (likes.has(currentTrackIdx)) {
        likes.delete(currentTrackIdx);
        likeBtn.classList.remove('liked');
      } else {
        likes.add(currentTrackIdx);
        likeBtn.classList.add('liked');
        createLikeBurst();
      }
    }

    // Pointer Scrubbing for Progress
    function handleProgressScrub(e) {
      const rect = progressWrapper.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const track = TRACKS[currentTrackIdx];
      currentTime = pos * track.durationSec;
      updateProgressUI(currentTime);
    }

    progressWrapper.addEventListener('pointerdown', (e) => {
      isScrubbing = true;
      progressWrapper.classList.add('scrubbing');
      progressWrapper.setPointerCapture(e.pointerId);
      handleProgressScrub(e);
    });

    progressWrapper.addEventListener('pointermove', (e) => {
      if (isScrubbing) handleProgressScrub(e);
    });

    function endProgressScrub(e) {
      if (isScrubbing) {
        isScrubbing = false;
        progressWrapper.classList.remove('scrubbing');
        try { progressWrapper.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    progressWrapper.addEventListener('pointerup', endProgressScrub);
    progressWrapper.addEventListener('pointercancel', endProgressScrub);

    // Keyboard Arrow Seeking on progress bar
    progressWrapper.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        currentTime = Math.min(TRACKS[currentTrackIdx].durationSec, currentTime + 5);
        updateProgressUI(currentTime);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        currentTime = Math.max(0, currentTime - 5);
        updateProgressUI(currentTime);
      }
    });

    // Volume Scrubbing
    let isVolScrubbing = false;
    function handleVolumeScrub(e) {
      const rect = volumeWrapper.getBoundingClientRect();
      volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const pct = Math.round(volume * 100);
      volumeFill.style.width = `${pct}%`;
      volumeVal.textContent = `${pct}%`;
      volumeWrapper.setAttribute('aria-valuenow', pct);
    }

    volumeWrapper.addEventListener('pointerdown', (e) => {
      isVolScrubbing = true;
      volumeWrapper.setPointerCapture(e.pointerId);
      handleVolumeScrub(e);
    });

    volumeWrapper.addEventListener('pointermove', (e) => {
      if (isVolScrubbing) handleVolumeScrub(e);
    });

    function endVolScrub(e) {
      if (isVolScrubbing) {
        isVolScrubbing = false;
        try { volumeWrapper.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    volumeWrapper.addEventListener('pointerup', endVolScrub);
    volumeWrapper.addEventListener('pointercancel', endVolScrub);

    // Keyboard Accessibility for Volume
    volumeWrapper.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        volume = Math.min(1, volume + 0.05);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        volume = Math.max(0, volume - 0.05);
      }
      const pct = Math.round(volume * 100);
      volumeFill.style.width = `${pct}%`;
      volumeVal.textContent = `${pct}%`;
      volumeWrapper.setAttribute('aria-valuenow', pct);
    });

    // Global Key Events
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayback();
      }
    });

    // Event Listeners for UI Controls
    playBtn.addEventListener('click', togglePlayback);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    likeBtn.addEventListener('click', toggleLike);

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
      shuffleBtn.style.color = isShuffle ? 'var(--a1)' : '';
    });

    // Initialize View
    renderTracklist();
    loadTrack(0, false);
  </script>
</body>
</html>
