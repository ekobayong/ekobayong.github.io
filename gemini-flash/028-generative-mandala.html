<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kaleido — Symmetric Mandala Studio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    :root {
      --bg-center: #1a1b1e;
      --bg-edges: #0d0e10;
      --amber: #f0b35a;
      --amber-glow: rgba(240, 179, 90, 0.35);
      --text-muted: #8b8c91;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-edges);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #stage-container {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-edges) 100%);
      overflow: hidden;
    }
    canvas#mandala {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
    }
    /* Brand Top-Left */
    .brand {
      position: absolute;
      top: 24px;
      left: 28px;
      pointer-events: none;
      z-index: 10;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .brand p {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }
    /* Status Top-Right */
    .status-panel {
      position: absolute;
      top: 24px;
      right: 28px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #aaa;
      text-align: right;
      pointer-events: none;
      z-index: 10;
      background: rgba(13, 14, 16, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .status-panel .highlight {
      color: var(--amber);
      font-weight: 600;
    }
    /* Floating Toolbar */
    .toolbar-container {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      padding: 6px 10px;
      border-radius: 9999px;
      box-shadow: var(--glass-shadow);
    }
    .btn {
      background: transparent;
      border: 1px solid transparent;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      height: 38px;
      padding: 0 14px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.05s ease;
      position: relative;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .btn.active-state {
      background: rgba(240, 179, 90, 0.15);
      border-color: rgba(240, 179, 90, 0.4);
      color: var(--amber);
    }
    .btn.auto-active {
      background: var(--amber);
      color: #0d0e10;
      font-weight: 600;
      box-shadow: 0 0 16px var(--amber-glow);
    }
    .btn.auto-active svg {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }
    /* Popovers */
    .popover-anchor {
      position: relative;
    }
    .popover {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(22, 23, 27, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px;
      box-shadow: var(--glass-shadow);
      display: flex;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
    }
    .popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    /* Symmetry Chips */
    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 8px 13px;
      font-size: 13px;
      font-family: ui-monospace, monospace;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .chip.selected {
      background: var(--amber);
      border-color: var(--amber);
      color: #0d0e10;
    }
    /* Palette Swatches */
    .palette-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 60px;
    }
    .palette-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .palette-btn.selected {
      border-color: var(--amber);
      background: rgba(240, 179, 90, 0.12);
    }
    .swatch-bar {
      width: 44px;
      height: 18px;
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
    }
    .swatch-seg {
      flex: 1;
      height: 100%;
    }
    .swatch-drift {
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }
    .palette-name {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }
    .palette-btn.selected .palette-name {
      color: var(--amber);
      font-weight: 600;
    }
    /* Responsive */
    @media (max-width: 720px) {
      .btn span { display: none; }
      .btn { padding: 0 10px; }
      .brand { top: 16px; left: 16px; }
      .status-panel { top: 16px; right: 16px; font-size: 10px; padding: 6px 10px; }
      .toolbar-container { bottom: 18px; width: 92%; }
      .toolbar { justify-content: space-around; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="mandala"></canvas>
    <div id="vignette"></div>
  </div>

  <div class="brand">
    <h1>Kaleido</h1>
    <p>Symmetric Mandala Studio</p>
  </div>

  <div class="status-panel">
    <div>Symmetry: <span id="stat-sym" class="highlight">12</span></div>
    <div>Mirror: <span id="stat-mir" class="highlight">ON</span></div>
    <div>Palette: <span id="stat-pal" class="highlight">Drift</span></div>
    <div>Strokes: <span id="stat-str" class="highlight">0</span></div>
  </div>

  <div class="toolbar-container">
    <div class="toolbar">
      <!-- Auto Draw Toggle -->
      <button class="btn" id="btn-auto" title="Toggle Auto-Draw (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
        <span>Auto-Draw</span>
      </button>

      <div class="divider"></div>

      <!-- Symmetry Popover Button -->
      <div class="popover-anchor">
        <button class="btn" id="btn-sym" title="Set Symmetry Segments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
            <line x1="12" y1="22" x2="12" y2="15.5"></line>
            <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
          </svg>
          <span>Symmetry</span>
        </button>
        <div class="popover" id="pop-sym">
          <div class="chip" data-sym="6">6</div>
          <div class="chip" data-sym="8">8</div>
          <div class="chip selected" data-sym="12">12</div>
          <div class="chip" data-sym="16">16</div>
        </div>
      </div>

      <!-- Mirror Toggle -->
      <button class="btn active-state" id="btn-mir" title="Toggle Mirror (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3"></line>
          <path d="M8 8L3 12L8 16V8Z"></path>
          <path d="M16 8L21 12L16 16V8Z"></path>
        </svg>
        <span>Mirror</span>
      </button>

      <!-- Palette Popover Button -->
      <div class="popover-anchor">
        <button class="btn" id="btn-pal" title="Select Color Palette">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
          </svg>
          <span>Palette</span>
        </button>
        <div class="popover" id="pop-pal">
          <div class="palette-btn selected" data-palette="drift">
            <div class="swatch-bar swatch-drift"></div>
            <span class="palette-name">Drift</span>
          </div>
          <div class="palette-btn" data-palette="ember">
            <div class="swatch-bar">
              <span class="swatch-seg" style="background:#ffb347"></span>
              <span class="swatch-seg" style="background:#ff7a3a"></span>
              <span class="swatch-seg" style="background:#ff5e3a"></span>
              <span class="swatch-seg" style="background:#e0335a"></span>
              <span class="swatch-seg" style="background:#c81d5a"></span>
            </div>
            <span class="palette-name">Ember</span>
          </div>
          <div class="palette-btn" data-palette="lagoon">
            <div class="swatch-bar">
              <span class="swatch-seg" style="background:#a7f3d0"></span>
              <span class="swatch-seg" style="background:#5eead4"></span>
              <span class="swatch-seg" style="background:#22d3ee"></span>
              <span class="swatch-seg" style="background:#3b82f6"></span>
              <span class="swatch-seg" style="background:#1e3a8a"></span>
            </div>
            <span class="palette-name">Lagoon</span>
          </div>
          <div class="palette-btn" data-palette="gilded">
            <div class="swatch-bar">
              <span class="swatch-seg" style="background:#fff6d5"></span>
              <span class="swatch-seg" style="background:#f7dd9a"></span>
              <span class="swatch-seg" style="background:#f0b35a"></span>
              <span class="swatch-seg" style="background:#c98a2c"></span>
              <span class="swatch-seg" style="background:#7a4b12"></span>
            </div>
            <span class="palette-name">Gilded</span>
          </div>
          <div class="palette-btn" data-palette="ivory">
            <div class="swatch-bar">
              <span class="swatch-seg" style="background:#ffffff"></span>
              <span class="swatch-seg" style="background:#e5e7eb"></span>
              <span class="swatch-seg" style="background:#cbd5e1"></span>
              <span class="swatch-seg" style="background:#94a3b8"></span>
              <span class="swatch-seg" style="background:#64748b"></span>
            </div>
            <span class="palette-name">Ivory</span>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Undo -->
      <button class="btn" id="btn-undo" title="Undo Last Stroke (Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
        </svg>
        <span>Undo</span>
      </button>

      <!-- Clear -->
      <button class="btn" id="btn-clear" title="Clear Canvas (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 1-2h6c1 0 1 1 1 2v2"></path>
        </svg>
        <span>Clear</span>
      </button>

      <!-- Save PNG -->
      <button class="btn" id="btn-save" title="Save Artwork as PNG (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Save</span>
      </button>
    </div>
  </div>

  <script>
    // State
    const state = {
      symmetry: 12,
      mirror: true,
      palette: 'drift', // drift, ember, lagoon, gilded, ivory
      hue: 180,
      strokes: [], // Array of stroke objects
      autoDraw: false
    };

    const PALETTES = {
      ember: ['#ffb347', '#ff7a3a', '#ff5e3a', '#e0335a', '#c81d5a'],
      lagoon: ['#a7f3d0', '#5eead4', '#22d3ee', '#3b82f6', '#1e3a8a'],
      gilded: ['#fff6d5', '#f7dd9a', '#f0b35a', '#c98a2c', '#7a4b12'],
      ivory: ['#ffffff', '#f1f5f9', '#e2e8f0', '#cbd5e1', '#94a3b8']
    };

    // Canvas setup
    const canvas = document.getElementById('mandala');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      redrawAll();
    }
    window.addEventListener('resize', resize);

    // Current pointer stroke
    let currentStroke = null;
    let lastPointTime = 0;
    let filteredWidth = 4;

    function getPointerOffset(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
      return {
        x: clientX - rect.left - width / 2,
        y: clientY - rect.top - height / 2,
        time: performance.now()
      };
    }

    function calculateWidth(p1, p2) {
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const dt = Math.max(p2.time - p1.time, 8);
      const speed = dist / dt; // px per ms
      // Map speed: 0 -> 14px, 3+ -> 1.2px
      const targetWidth = Math.max(1.2, Math.min(14, 14 - speed * 4.2));
      filteredWidth = filteredWidth * 0.65 + targetWidth * 0.35;
      return filteredWidth;
    }

    function getNextColor(stepIndex) {
      if (state.palette === 'drift') {
        state.hue = (state.hue + 0.6) % 360;
        return `hsl(${state.hue.toFixed(1)}, 85%, 62%)`;
      }
      const list = PALETTES[state.palette];
      return list[stepIndex % list.length];
    }

    // High quality replicated rendering
    function renderReplicatedSegment(p0, p1, p2, widthVal, color, sym, mirror, targetCtx = ctx, scale = dpr) {
      targetCtx.save();
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';
      targetCtx.strokeStyle = color;
      targetCtx.shadowColor = color;
      targetCtx.shadowBlur = 6 * scale;
      targetCtx.lineWidth = widthVal * scale;
      targetCtx.globalAlpha = 0.92;

      // Midpoints for smooth quadratic bezier curve
      const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
      const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

      const cx = targetCtx.canvas.width / 2;
      const cy = targetCtx.canvas.height / 2;

      const angleStep = (Math.PI * 2) / sym;
      for (let i = 0; i < sym; i++) {
        const theta = i * angleStep;

        // Base symmetry branch
        targetCtx.save();
        targetCtx.translate(cx, cy);
        targetCtx.rotate(theta);

        targetCtx.beginPath();
        targetCtx.moveTo(mid1.x * scale, mid1.y * scale);
        targetCtx.quadraticCurveTo(p1.x * scale, p1.y * scale, mid2.x * scale, mid2.y * scale);
        targetCtx.stroke();

        // Mirrored branch
        if (mirror) {
          targetCtx.scale(1, -1);
          targetCtx.beginPath();
          targetCtx.moveTo(mid1.x * scale, mid1.y * scale);
          targetCtx.quadraticCurveTo(p1.x * scale, p1.y * scale, mid2.x * scale, mid2.y * scale);
          targetCtx.stroke();
        }
        targetCtx.restore();
      }

      targetCtx.restore();
    }

    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const stroke of state.strokes) {
        if (stroke.points.length < 2) continue;
        for (let i = 1; i < stroke.points.length - 1; i++) {
          renderReplicatedSegment(
            stroke.points[i - 1],
            stroke.points[i],
            stroke.points[i + 1],
            stroke.widths[i],
            stroke.colors[i],
            stroke.symmetry,
            stroke.mirror,
            ctx,
            dpr
          );
        }
      }
      updateStatus();
    }

    // Pointer Events Handling
    canvas.addEventListener('pointerdown', (e) => {
      if (state.autoDraw) toggleAutoDraw(false);
      closeAllPopovers();
      const pt = getPointerOffset(e);
      filteredWidth = 5;
      currentStroke = {
        symmetry: state.symmetry,
        mirror: state.mirror,
        points: [pt, pt],
        widths: [filteredWidth, filteredWidth],
        colors: [getNextColor(0), getNextColor(1)]
      };
      state.strokes.push(currentStroke);
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!currentStroke) return;
      const pt = getPointerOffset(e);
      const prev = currentStroke.points[currentStroke.points.length - 1];
      const dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);
      if (dist < 3) return; // ignore micro shakes

      const w = calculateWidth(prev, pt);
      const c = getNextColor(currentStroke.points.length);
      currentStroke.points.push(pt);
      currentStroke.widths.push(w);
      currentStroke.colors.push(c);

      const len = currentStroke.points.length;
      if (len >= 3) {
        renderReplicatedSegment(
          currentStroke.points[len - 3],
          currentStroke.points[len - 2],
          currentStroke.points[len - 1],
          currentStroke.widths[len - 2],
          currentStroke.colors[len - 2],
          currentStroke.symmetry,
          currentStroke.mirror
        );
      }
    });

    const endPointer = (e) => {
      if (!currentStroke) return;
      const len = currentStroke.points.length;
      if (len >= 3) {
        // Complete tail
        renderReplicatedSegment(
          currentStroke.points[len - 2],
          currentStroke.points[len - 1],
          currentStroke.points[len - 1],
          currentStroke.widths[len - 1],
          currentStroke.colors[len - 1],
          currentStroke.symmetry,
          currentStroke.mirror
        );
      }
      currentStroke = null;
      updateStatus();
    };

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    // Auto-draw System (Value-noise based algorithmic generator)
    let autoAnimId = null;
    let autoStroke = null;
    let autoSamplesLeft = 0;
    let autoRingIndex = 0;
    let autoAngle = 0;
    let autoAngVel = 0.02;
    let autoRadius = 150;
    let autoNoiseOffset = 0;

    // Fast 1D smooth value-noise
    function noise1D(x) {
      const i = Math.floor(x);
      const f = x - i;
      const u = f * f * (3 - 2 * f);
      const n0 = Math.sin(i * 127.1 + 311.7) * 43758.5453123;
      const n1 = Math.sin((i + 1) * 127.1 + 311.7) * 43758.5453123;
      const v0 = n0 - Math.floor(n0);
      const v1 = n1 - Math.floor(n1);
      return (v0 * (1.0 - u) + v1 * u) * 2 - 1;
    }

    function initAutoStroke() {
      const minDim = Math.min(width, height);
      // 5 distinct concentric rings
      const rings = [0.12, 0.22, 0.32, 0.42, 0.52];
      autoRadius = rings[autoRingIndex % rings.length] * minDim;
      autoRingIndex++;
      autoSamplesLeft = Math.floor(120 + Math.random() * 160);
      autoAngVel = (0.012 + Math.random() * 0.024) * (Math.random() > 0.5 ? 1 : -1);
      filteredWidth = 1.5 + Math.random() * 5.5;

      const p = {
        x: Math.cos(autoAngle) * autoRadius,
        y: Math.sin(autoAngle) * autoRadius,
        time: performance.now()
      };

      autoStroke = {
        symmetry: state.symmetry,
        mirror: state.mirror,
        points: [p, p],
        widths: [filteredWidth, filteredWidth],
        colors: [getNextColor(0), getNextColor(1)]
      };
      state.strokes.push(autoStroke);
    }

    function stepAutoDraw() {
      if (!state.autoDraw) return;

      if (!autoStroke || autoSamplesLeft <= 0) {
        initAutoStroke();
      }

      autoNoiseOffset += 0.045;
      autoAngle += autoAngVel;

      const wobble = noise1D(autoNoiseOffset) * (autoRadius * 0.28);
      const curR = Math.max(10, autoRadius + wobble);
      const pt = {
        x: Math.cos(autoAngle) * curR,
        y: Math.sin(autoAngle) * curR,
        time: performance.now()
      };

      const prev = autoStroke.points[autoStroke.points.length - 1];
      const w = calculateWidth(prev, pt);
      const c = getNextColor(autoStroke.points.length);

      autoStroke.points.push(pt);
      autoStroke.widths.push(w);
      autoStroke.colors.push(c);
      autoSamplesLeft--;

      const len = autoStroke.points.length;
      if (len >= 3) {
        renderReplicatedSegment(
          autoStroke.points[len - 3],
          autoStroke.points[len - 2],
          autoStroke.points[len - 1],
          autoStroke.widths[len - 2],
          autoStroke.colors[len - 2],
          autoStroke.symmetry,
          autoStroke.mirror
        );
      }

      if (autoSamplesLeft <= 0) {
        updateStatus();
      }

      autoAnimId = requestAnimationFrame(stepAutoDraw);
    }

    function toggleAutoDraw(force) {
      state.autoDraw = typeof force === 'boolean' ? force : !state.autoDraw;
      const btn = document.getElementById('btn-auto');
      if (state.autoDraw) {
        btn.classList.add('auto-active');
        closeAllPopovers();
        autoStroke = null;
        autoAngle = Math.random() * Math.PI * 2;
        autoRingIndex = Math.floor(Math.random() * 5);
        autoAnimId = requestAnimationFrame(stepAutoDraw);
      } else {
        btn.classList.remove('auto-active');
        if (autoAnimId) cancelAnimationFrame(autoAnimId);
        autoStroke = null;
      }
    }

    // UI Status Update
    function updateStatus() {
      document.getElementById('stat-sym').textContent = state.symmetry;
      document.getElementById('stat-mir').textContent = state.mirror ? 'ON' : 'OFF';
      document.getElementById('stat-pal').textContent = state.palette.charAt(0).toUpperCase() + state.palette.slice(1);
      document.getElementById('stat-str').textContent = state.strokes.length;
    }

    // Popover Management
    const popSym = document.getElementById('pop-sym');
    const popPal = document.getElementById('pop-pal');
    const btnSym = document.getElementById('btn-sym');
    const btnPal = document.getElementById('btn-pal');

    function closeAllPopovers() {
      popSym.classList.remove('open');
      popPal.classList.remove('open');
    }

    btnSym.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = popSym.classList.contains('open');
      closeAllPopovers();
      if (!wasOpen) popSym.classList.add('open');
    });

    btnPal.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = popPal.classList.contains('open');
      closeAllPopovers();
      if (!wasOpen) popPal.classList.add('open');
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.popover') && !e.target.closest('.btn')) {
        closeAllPopovers();
      }
    });

    // Symmetry Chip Select
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        state.symmetry = parseInt(chip.dataset.sym, 10);
        updateStatus();
        closeAllPopovers();
      });
    });

    // Palette Select
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.palette = btn.dataset.palette;
        updateStatus();
        closeAllPopovers();
      });
    });

    // Mirror Toggle
    const btnMir = document.getElementById('btn-mir');
    btnMir.addEventListener('click', () => {
      state.mirror = !state.mirror;
      btnMir.classList.toggle('active-state', state.mirror);
      updateStatus();
    });

    // Undo
    const btnUndo = document.getElementById('btn-undo');
    function undo() {
      if (state.strokes.length > 0) {
        state.strokes.pop();
        redrawAll();
      }
    }
    btnUndo.addEventListener('click', undo);

    // Clear
    const btnClear = document.getElementById('btn-clear');
    function clearCanvas() {
      state.strokes = [];
      redrawAll();
    }
    btnClear.addEventListener('click', clearCanvas);

    // Auto Button Click
    document.getElementById('btn-auto').addEventListener('click', () => toggleAutoDraw());

    // Save PNG
    const btnSave = document.getElementById('btn-save');
    function saveCanvas() {
      const off = document.createElement('canvas');
      off.width = canvas.width;
      off.height = canvas.height;
      const octx = off.getContext('2d');

      // 1. Draw radial gradient background
      const cx = off.width / 2;
      const cy = off.height / 2;
      const maxR = Math.hypot(cx, cy);
      const radGrad = octx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
      radGrad.addColorStop(0, '#1a1b1e');
      radGrad.addColorStop(1, '#0d0e10');
      octx.fillStyle = radGrad;
      octx.fillRect(0, 0, off.width, off.height);

      // 2. Composite all strokes
      for (const stroke of state.strokes) {
        if (stroke.points.length < 2) continue;
        for (let i = 1; i < stroke.points.length - 1; i++) {
          renderReplicatedSegment(
            stroke.points[i - 1],
            stroke.points[i],
            stroke.points[i + 1],
            stroke.widths[i],
            stroke.colors[i],
            stroke.symmetry,
            stroke.mirror,
            octx,
            dpr
          );
        }
      }

      // 3. Composite 55% vignette darkening
      const vigGrad = octx.createRadialGradient(cx, cy, maxR * 0.4, cx, cy, maxR);
      vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
      octx.fillStyle = vigGrad;
      octx.fillRect(0, 0, off.width, off.height);

      // Download
      const link = document.createElement('a');
      link.download = `kaleido-mandala-${Date.now()}.png`;
      link.href = off.toDataURL('image/png');
      link.click();
    }
    btnSave.addEventListener('click', saveCanvas);

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const key = e.key.toUpperCase();
      if (key === 'ESCAPE') {
        closeAllPopovers();
      } else if (key === 'A') {
        toggleAutoDraw();
      } else if (key === 'C') {
        clearCanvas();
      } else if (key === 'Z') {
        undo();
      } else if (key === 'S') {
        saveCanvas();
      } else if (key === 'M') {
        state.mirror = !state.mirror;
        btnMir.classList.toggle('active-state', state.mirror);
        updateStatus();
      }
    });

    // Initialize
    resize();
    updateStatus();
  </script>
</body>
</html>
