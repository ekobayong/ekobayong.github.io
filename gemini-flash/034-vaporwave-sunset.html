<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＬＵＮＡＲ ＷＩＮＤ — Vaporwave Sunset Scene</title>
<style>
  :root {
    --pink: #ff71ce;
    --cyan: #01cdfe;
    --mint: #05ffa1;
    --violet: #b967ff;
    --yellow: #fffb96;
    --night: #12002a;
    --sky-top: #0a0020;
    --sky-mid: #2b0a5e;
    --sky-low: #7a2a9e;
    --grid-speed: 4s;
    --mouse-x: 0;
    --mouse-y: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--night);
    font-family: system-ui, -apple-system, sans-serif;
  }

  .viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, 
      var(--sky-top) 0%, 
      var(--sky-mid) 32%, 
      var(--sky-low) 52%, 
      var(--pink) 64.5%, 
      var(--night) 64.6%, 
      var(--night) 100%);
  }

  /* Starfield */
  .star {
    position: absolute;
    border-radius: 50%;
    animation: twinkle var(--dur, 4s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1.3); }
  }

  /* Horizon Haze */
  .horizon-haze {
    position: absolute;
    top: 60%;
    left: 0;
    width: 100%;
    height: 12%;
    background: linear-gradient(180deg, transparent, rgba(255, 113, 206, 0.45), transparent);
    filter: blur(6px);
    pointer-events: none;
    z-index: 5;
  }

  /* Sun & Glow Container */
  .sun-wrap {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, 0);
    width: min(46vmin, 380px);
    height: min(46vmin, 380px);
    animation: sunDrift 40s ease-in-out infinite alternate;
    z-index: 2;
    pointer-events: none;
  }
  @keyframes sunDrift {
    0% { top: 20%; }
    100% { top: calc(20% + 4vh); }
  }

  .sun-glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: 
      0 0 80px 30px var(--pink),
      0 0 200px 80px rgba(255, 251, 150, 0.6);
  }

  .sun-body {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(180deg, 
      var(--yellow) 0%, 
      #ffb347 45%, 
      var(--pink) 75%, 
      var(--violet) 100%);
    -webkit-mask-image: linear-gradient(180deg,
      #000 0%,
      #000 52%,
      transparent 52%, transparent 55%,
      #000 55%, #000 63%,
      transparent 63%, transparent 67%,
      #000 67%, #000 73.5%,
      transparent 73.5%, transparent 78.5%,
      #000 78.5%, #000 83%,
      transparent 83%, transparent 89%,
      #000 89%, #000 92%,
      transparent 92%, transparent 100%);
    mask-image: linear-gradient(180deg,
      #000 0%,
      #000 52%,
      transparent 52%, transparent 55%,
      #000 55%, #000 63%,
      transparent 63%, transparent 67%,
      #000 67%, #000 73.5%,
      transparent 73.5%, transparent 78.5%,
      #000 78.5%, #000 83%,
      transparent 83%, transparent 89%,
      #000 89%, #000 92%,
      transparent 92%, transparent 100%);
  }

  /* Ground Perspective Grid */
  .scene {
    position: absolute;
    top: 64.5%;
    left: 0;
    width: 100%;
    height: 35.5%;
    perspective: 520px;
    perspective-origin: 50% 40%;
    overflow: hidden;
    z-index: 4;
  }

  .floor {
    position: absolute;
    top: 0;
    left: -100%;
    width: 300%;
    height: 130%;
    transform-origin: 50% 0%;
    transform: rotateX(72deg);
    background-color: var(--night);
    background-image: 
      linear-gradient(90deg, transparent calc(50% - 1px), #00ffff calc(50% - 1px), #00ffff calc(50% + 1px), transparent calc(50% + 1px)),
      repeating-linear-gradient(90deg, var(--cyan) 0px, var(--cyan) 2px, transparent 2px, transparent 80px),
      repeating-linear-gradient(180deg, var(--pink) 0px, var(--pink) 2px, transparent 2px, transparent 80px);
    background-size: 100% 100%, 80px 100%, 100% 80px;
    animation: gridScroll var(--grid-speed) linear infinite;
  }
  @keyframes gridScroll {
    0% { background-position: 0 0, 0 0, 0 0; }
    100% { background-position: 0 0, 0 0, 0 80px; }
  }

  .floor-fade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, 
      rgba(255, 113, 206, 0.75) 0%, 
      rgba(185, 103, 255, 0.2) 20%, 
      rgba(18, 0, 42, 0.4) 60%, 
      rgba(10, 0, 32, 0.95) 100%);
  }

  .floor-checker {
    position: absolute;
    bottom: -15vmin;
    left: calc(50% - 30vmin);
    width: 60vmin;
    height: 60vmin;
    border-radius: 50%;
    transform: rotateX(74deg);
    background: repeating-conic-gradient(var(--violet) 0% 12%, transparent 12% 24%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 70%);
    opacity: 0.5;
    animation: spinChecker 40s linear infinite;
    pointer-events: none;
  }
  @keyframes spinChecker {
    0% { transform: rotateX(74deg) rotate(0deg); }
    100% { transform: rotateX(74deg) rotate(360deg); }
  }

  /* SVG Palms */
  .palm {
    position: absolute;
    bottom: 33%;
    width: 22vw;
    min-width: 220px;
    max-width: 380px;
    height: auto;
    z-index: 10;
    pointer-events: none;
    transform-origin: bottom center;
    filter: drop-shadow(0 0 10px rgba(255, 113, 206, 0.4));
  }
  .palm-left {
    left: -2vw;
    animation: swayLeft 6s ease-in-out infinite alternate;
  }
  .palm-right {
    right: -2vw;
    transform: scaleX(-1);
    animation: swayRight 7s ease-in-out infinite alternate -2s;
  }
  @keyframes swayLeft {
    0% { transform: rotate(-1.3deg); }
    100% { transform: rotate(1.3deg); }
  }
  @keyframes swayRight {
    0% { transform: scaleX(-1) rotate(-1.3deg); }
    100% { transform: scaleX(-1) rotate(1.3deg); }
  }

  /* Bust Layer */
  .bust-layer {
    position: absolute;
    top: 28%;
    right: 22%;
    width: clamp(140px, 16vw, 260px);
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 0 25px rgba(185, 103, 255, 0.7));
    animation: bustFloat 9s ease-in-out infinite alternate;
  }
  @keyframes bustFloat {
    0% { transform: translate3d(0, -22px, 0) rotate(-2deg); }
    100% { transform: translate3d(0, 22px, 0) rotate(2deg); }
  }

  /* Title & Text */
  .header-group {
    position: absolute;
    top: 46%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 8;
    width: 100%;
    pointer-events: none;
  }

  .chrome-title {
    font-family: Palatino, 'Palatino Linotype', 'Iowan Old Style', Georgia, serif;
    font-size: clamp(30px, 8.5vw, 132px);
    font-weight: 900;
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 1;
    background: linear-gradient(180deg, 
      #ffffff 0%, 
      var(--cyan) 25%, 
      #063a55 49%, 
      #ffffff 51%, 
      var(--pink) 78%, 
      var(--violet) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.6);
    filter: 
      drop-shadow(0 4px 0 var(--violet))
      drop-shadow(0 8px 0 #180038)
      drop-shadow(0 0 22px var(--cyan));
    animation: shimmerTitle 6s ease-in-out infinite alternate;
  }
  @keyframes shimmerTitle {
    0% {
      filter: 
        drop-shadow(0 4px 0 var(--violet))
        drop-shadow(0 8px 0 #180038)
        drop-shadow(0 0 22px var(--cyan));
    }
    100% {
      filter: 
        drop-shadow(0 4px 0 var(--violet))
        drop-shadow(0 8px 0 #180038)
        drop-shadow(0 0 22px var(--pink));
    }
  }

  .subtitle {
    font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
    font-size: clamp(10px, 1.6vw, 22px);
    color: var(--mint);
    margin-top: 14px;
    letter-spacing: 0.55em;
    text-shadow: 0 0 10px var(--mint), 0 0 20px rgba(5, 255, 161, 0.4);
  }

  .top-caption {
    position: absolute;
    top: 24px;
    right: 28px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
    z-index: 12;
  }

  /* Retro OS Window */
  .retro-win {
    position: absolute;
    bottom: 24px;
    left: 24px;
    width: 320px;
    background-color: #c0c0c0;
    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    box-shadow: 1px 1px 0px #000000, 6px 6px 18px rgba(0, 0, 0, 0.65);
    z-index: 20;
    font-size: 11px;
    color: #000;
  }

  .win-titlebar {
    height: 24px;
    background: linear-gradient(90deg, #000080, #1084d0);
    padding: 2px 3px 2px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .win-title-left {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .win-icon {
    width: 14px;
    height: 14px;
    background: linear-gradient(135deg, var(--pink), var(--cyan));
    border: 1px solid #fff;
  }

  .win-controls {
    display: flex;
    gap: 2px;
  }

  .win-btn {
    width: 16px;
    height: 14px;
    background: #c0c0c0;
    border-top: 1px solid #fff;
    border-left: 1px solid #fff;
    border-right: 1px solid #404040;
    border-bottom: 1px solid #404040;
    font-size: 9px;
    line-height: 12px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    color: #000;
  }
  .win-btn:active {
    border-top: 1px solid #404040;
    border-left: 1px solid #404040;
    border-right: 1px solid #fff;
    border-bottom: 1px solid #fff;
  }

  .win-menu {
    display: flex;
    gap: 12px;
    padding: 3px 6px;
    border-bottom: 1px solid #808080;
    background: #c0c0c0;
  }
  .win-menu span u {
    text-decoration: underline;
  }

  .win-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .lcd-screen {
    background: #000000;
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
    padding: 6px 8px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    line-height: 1.45;
  }
  .lcd-screen .lbl {
    color: var(--pink);
    margin-right: 4px;
    font-size: 9px;
  }
  .lcd-screen .val {
    color: var(--mint);
    text-shadow: 0 0 4px var(--mint);
  }
  .lcd-screen .lcd-row {
    display: flex;
    justify-content: space-between;
  }

  .progress-bar-border {
    height: 14px;
    background: #fff;
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #fff;
    border-bottom: 1px solid #fff;
    padding: 1px;
    overflow: hidden;
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background-color: #000080;
    background-image: repeating-linear-gradient(
      -45deg,
      #1084d0 0px,
      #1084d0 6px,
      #000080 6px,
      #000080 12px
    );
    animation: progFlow 20s linear infinite;
    animation-play-state: paused;
  }
  @keyframes progFlow {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  .win-actions {
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }

  .ui-btn {
    flex: 1;
    height: 24px;
    background: #c0c0c0;
    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    font-family: system-ui, sans-serif;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .ui-btn:active, .ui-btn.pressed {
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
    background: #b5b5b5;
    padding: 1px 0 0 1px;
  }

  .win-statusbar {
    margin-top: 4px;
    display: flex;
    gap: 4px;
  }
  .sb-cell {
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #fff;
    border-bottom: 1px solid #fff;
    padding: 2px 6px;
    font-size: 10px;
  }
  .sb-cell.cell-main {
    flex: 1;
  }
  .sb-cell.cell-mode {
    width: 65px;
    text-align: center;
  }

  /* Responsive & Accessibility */
  @media (max-width: 768px) {
    .top-caption { display: none; }
    .bust-layer {
      width: 120px;
      right: 10%;
      top: 32%;
    }
    .retro-win {
      bottom: 12px;
      left: 12px;
      width: calc(100% - 24px);
      max-width: 320px;
    }
    .chrome-title {
      font-size: clamp(28px, 12vw, 64px);
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 0.35em;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="viewport" id="viewport">

  <!-- Twinkling Stars -->
  <div class="star" style="top:12%; left:14%; width:3px; height:3px; background:var(--yellow); --dur:3.2s;"></div>
  <div class="star" style="top:22%; left:28%; width:2px; height:2px; background:#ffffff; --dur:4.5s;"></div>
  <div class="star" style="top:8%;  left:42%; width:3px; height:3px; background:var(--cyan); --dur:5.1s;"></div>
  <div class="star" style="top:31%; left:18%; width:2px; height:2px; background:var(--violet); --dur:3.8s;"></div>
  <div class="star" style="top:15%; left:65%; width:3px; height:3px; background:#ffffff; --dur:4.0s;"></div>
  <div class="star" style="top:28%; left:82%; width:2px; height:2px; background:var(--yellow); --dur:6.0s;"></div>
  <div class="star" style="top:9%;  left:88%; width:3px; height:3px; background:var(--cyan); --dur:3.5s;"></div>
  <div class="star" style="top:38%; left:8%;  width:2px; height:2px; background:var(--pink); --dur:4.8s;"></div>
  <div class="star" style="top:44%; left:89%; width:3px; height:3px; background:var(--violet); --dur:5.5s;"></div>
  <div class="star" style="top:19%; left:52%; width:2px; height:2px; background:#ffffff; --dur:2.9s;"></div>

  <!-- Memories Caption -->
  <div class="top-caption">ＭＥＭＯＲＩＥＳ / ＯＦ　ＴＯＭＯＲＲＯＷ</div>

  <!-- Glowing Sliced Sun -->
  <div class="sun-wrap" id="sunWrap">
    <div class="sun-glow"></div>
    <div class="sun-body"></div>
  </div>

  <!-- Classical Marble Bust -->
  <div class="bust-layer" id="bustWrap">
    <svg viewBox="0 0 160 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#e2d9f3" />
          <stop offset="100%" stop-color="#b967ff" />
        </linearGradient>
      </defs>
      <!-- Base Plinth -->
      <polygon points="45,200 115,200 125,215 35,215" fill="url(#marble)"/>
      <polygon points="55,182 105,182 110,200 50,200" fill="url(#marble)"/>
      <!-- Shoulders & Chest -->
      <path d="M25,178 C35,145 52,140 60,136 L100,136 C108,140 125,145 135,178 C115,186 45,186 25,178 Z" fill="url(#marble)"/>
      <!-- Neck -->
      <path d="M68,110 L92,110 L95,140 L65,140 Z" fill="url(#marble)"/>
      <!-- Head -->
      <ellipse cx="80" cy="85" rx="30" ry="38" fill="url(#marble)"/>
      <!-- Ears -->
      <ellipse cx="49" cy="86" rx="4" ry="9" fill="url(#marble)"/>
      <ellipse cx="111" cy="86" rx="4" ry="9" fill="url(#marble)"/>
      <!-- Hair Cap -->
      <path d="M48,80 C46,45 65,36 80,36 C95,36 114,45 112,80 C104,56 94,52 80,52 C66,52 56,56 48,80 Z" fill="#9d4edd"/>
      <path d="M47,74 C58,62 72,62 80,68 C88,62 102,62 113,74 C108,60 94,54 80,54 C66,54 52,60 47,74 Z" fill="#ffffff" opacity="0.6"/>
      <!-- Facial Features -->
      <path d="M68,76 Q74,74 78,76" stroke="#5a189a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M84,76 Q88,74 94,76" stroke="#5a189a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M80,77 L78,94 L85,94" stroke="#5a189a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M74,103 Q80,106 87,103" stroke="#5a189a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </svg>
  </div>

  <!-- Title and Subtitle -->
  <div class="header-group" id="headerGroup">
    <h1 class="chrome-title">ＬＵＮＡＲ　ＷＩＮＤ</h1>
    <div class="subtitle">Ｓ Ｉ Ｄ Ｅ　Ｂ　·　１ ９ ９ ５</div>
  </div>

  <!-- 3D Grid Floor Horizon -->
  <div class="scene">
    <div class="floor" id="gridFloor"></div>
    <div class="floor-fade"></div>
    <div class="floor-checker"></div>
  </div>

  <!-- Horizon Glow Line -->
  <div class="horizon-haze"></div>

  <!-- Palm Trees Left and Right -->
  <svg class="palm palm-left" viewBox="0 0 260 380" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Trunk -->
    <path d="M30,380 Q90,260 135,160 Q138,154 135,148 Q125,152 118,165 Q75,260 10,380 Z" fill="var(--night)"/>
    <!-- Fronds -->
    <path d="M135,152 Q90,130 10,140 Q70,165 133,156 Z" fill="var(--night)"/>
    <path d="M135,150 Q110,90 35,70 Q75,115 133,153 Z" fill="var(--night)"/>
    <path d="M136,148 Q140,65 95,15 Q115,80 136,149 Z" fill="var(--night)"/>
    <path d="M138,148 Q180,65 215,25 Q175,85 139,150 Z" fill="var(--night)"/>
    <path d="M139,150 Q215,95 255,80 Q200,125 140,154 Z" fill="var(--night)"/>
    <path d="M138,153 Q220,145 260,175 Q195,165 137,157 Z" fill="var(--night)"/>
    <path d="M136,155 Q175,190 220,230 Q170,195 134,159 Z" fill="var(--night)"/>
  </svg>

  <svg class="palm palm-right" viewBox="0 0 260 380" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Trunk -->
    <path d="M30,380 Q90,260 135,160 Q138,154 135,148 Q125,152 118,165 Q75,260 10,380 Z" fill="var(--night)"/>
    <!-- Fronds -->
    <path d="M135,152 Q90,130 10,140 Q70,165 133,156 Z" fill="var(--night)"/>
    <path d="M135,150 Q110,90 35,70 Q75,115 133,153 Z" fill="var(--night)"/>
    <path d="M136,148 Q140,65 95,15 Q115,80 136,149 Z" fill="var(--night)"/>
    <path d="M138,148 Q180,65 215,25 Q175,85 139,150 Z" fill="var(--night)"/>
    <path d="M139,150 Q215,95 255,80 Q200,125 140,154 Z" fill="var(--night)"/>
    <path d="M138,153 Q220,145 260,175 Q195,165 137,157 Z" fill="var(--night)"/>
    <path d="M136,155 Q175,190 220,230 Q170,195 134,159 Z" fill="var(--night)"/>
  </svg>

  <!-- Windows 95 Style Audio/Speed Panel -->
  <div class="retro-win" role="region" aria-label="Media Player Panel">
    <div class="win-titlebar">
      <div class="win-title-left">
        <div class="win-icon"></div>
        <span>Lunar Wind Player</span>
      </div>
      <div class="win-controls">
        <div class="win-btn">_</div>
        <div class="win-btn">□</div>
        <div class="win-btn">×</div>
      </div>
    </div>
    <div class="win-menu">
      <span><u>F</u>ile</span>
      <span><u>V</u>iew</span>
      <span><u>O</u>ptions</span>
      <span><u>H</u>elp</span>
    </div>
    <div class="win-body">
      <div class="lcd-screen">
        <div class="lcd-row">
          <div><span class="lbl">TRACK:</span><span class="val">SIDE-B.MID</span></div>
          <div><span class="val" id="lcdClock">00:00:00</span></div>
        </div>
        <div class="lcd-row" style="margin-top: 2px;">
          <div><span class="lbl">SPEED:</span><span class="val" id="speedLabel">CRUISE (1.0x)</span></div>
          <div><span class="lbl">GRID:</span><span class="val" id="gridStatus">SYNCHRONIZED</span></div>
        </div>
      </div>

      <div class="progress-bar-border">
        <div class="progress-fill" id="progFill"></div>
      </div>

      <div class="win-actions">
        <button class="ui-btn" id="btnPlay" aria-pressed="false">▶ Play</button>
        <button class="ui-btn" id="btnSlow">◂◂ Slow</button>
        <button class="ui-btn" id="btnFast">▸▸ Fast</button>
      </div>

      <div class="win-statusbar">
        <div class="sb-cell cell-main" id="statusMessage">FM Synth Ready</div>
        <div class="sb-cell cell-mode">44.1 kHz</div>
      </div>
    </div>
  </div>

</div>

<script>
  // Speed profiles config
  const SPEEDS = [
    { name: 'DRIFT',  sec: 12.0, mult: '0.3x' },
    { name: 'CRUISE', sec: 4.0,  mult: '1.0x' },
    { name: 'RUSH',   sec: 1.4,  mult: '2.8x' },
    { name: 'HYPER',  sec: 0.5,  mult: '8.0x' }
  ];

  let speedIdx = 1; // Start at CRUISE
  let isPlaying = false;
  let elapsedSec = 0;
  let clockTimer = null;

  // DOM elements
  const root = document.documentElement;
  const btnPlay = document.getElementById('btnPlay');
  const btnSlow = document.getElementById('btnSlow');
  const btnFast = document.getElementById('btnFast');
  const progFill = document.getElementById('progFill');
  const lcdClock = document.getElementById('lcdClock');
  const speedLabel = document.getElementById('speedLabel');
  const statusMessage = document.getElementById('statusMessage');

  const sunWrap = document.getElementById('sunWrap');
  const bustWrap = document.getElementById('bustWrap');
  const headerGroup = document.getElementById('headerGroup');

  function updateSpeedVisuals() {
    const cur = SPEEDS[speedIdx];
    root.style.setProperty('--grid-speed', cur.sec + 's');
    speedLabel.textContent = `${cur.name} (${cur.mult})`;
  }

  function setSpeed(newIdx) {
    speedIdx = Math.max(0, Math.min(SPEEDS.length - 1, newIdx));
    updateSpeedVisuals();
    statusMessage.textContent = `Warp Engine: ${SPEEDS[speedIdx].name}`;
  }

  function formatTime(totalSec) {
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    btnPlay.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');

    if (isPlaying) {
      btnPlay.classList.add('pressed');
      btnPlay.innerHTML = '❚❚ Pause';
      progFill.style.animationPlayState = 'running';
      statusMessage.textContent = 'Audio Streaming (DirectSound)';
      setSpeed(2); // Jump to RUSH on play

      clockTimer = setInterval(() => {
        elapsedSec++;
        lcdClock.textContent = formatTime(elapsedSec);
      }, 1000);
    } else {
      btnPlay.classList.remove('pressed');
      btnPlay.innerHTML = '▶ Play';
      progFill.style.animationPlayState = 'paused';
      statusMessage.textContent = 'Playback Paused';
      setSpeed(1); // Return to CRUISE on pause

      if (clockTimer) {
        clearInterval(clockTimer);
        clockTimer = null;
      }
    }
  }

  btnPlay.addEventListener('click', togglePlay);
  btnSlow.addEventListener('click', () => setSpeed(speedIdx - 1));
  btnFast.addEventListener('click', () => setSpeed(speedIdx + 1));

  // Initialize
  updateSpeedVisuals();

  // Mouse Parallax (fine pointers only, disabled under reduced-motion)
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isFinePointer = window.matchMedia('(pointer: fine)').matches;

  if (!reducedMotion && isFinePointer) {
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    window.addEventListener('mousemove', (e) => {
      // Normalize from -1 to 1
      targetX = (e.clientX / window.innerWidth) * 2 - 1;
      targetY = (e.clientY / window.innerHeight) * 2 - 1;
    });

    function renderParallax() {
      // Smooth lerp
      curX += (targetX - curX) * 0.05;
      curY += (targetY - curY) * 0.05;

      // Sun shifts slightly down/up and away
      sunWrap.style.transform = `translate(calc(-50% + ${-curX * 16}px), ${-curY * 12}px)`;

      // Classical bust tracks gently
      bustWrap.style.transform = `translate3d(${curX * 22}px, ${curY * 16}px, 0)`;

      // Title shifts opposite with subtle 3D rotateY
      headerGroup.style.transform = `translate(calc(-50% + ${curX * 18}px), calc(-50% + ${curY * 14}px)) rotateY(${curX * 4}deg)`;

      requestAnimationFrame(renderParallax);
    }
    requestAnimationFrame(renderParallax);
  }
</script>
</body>
</html>
