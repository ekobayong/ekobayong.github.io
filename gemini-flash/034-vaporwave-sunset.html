<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ＬＵＮＡＲ　ＷＩＮＤ — Vaporwave Sunset</title>
  <style>
    /* ==========================================================================
       CSS VARIABLES & BASE RESET
       ========================================================================== */
    :root {
      --hot-pink: #ff71ce;
      --cyan: #01cdfe;
      --mint: #05ffa1;
      --violet: #b967ff;
      --pale-yellow: #fffb96;
      --night-purple: #12002a;
      --sky-stop-1: #0a0020;
      --sky-stop-2: #2b0a5e;
      --sky-stop-3: #7a2a9e;
      --dark-teal: #063a55;
      --sun-orange: #ffb347;

      /* Interactive grid scroll speed (default 4s) */
      --grid-speed: 4s;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--night-purple);
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================================
       VIEWPORT CONTAINER & SKY GRADIENT
       ========================================================================== */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Sky: vertical gradient from near-black indigo (#0a0020) through violet (#2b0a5e, #7a2a9e)
         to hot pink (#ff71ce) at horizon (63–66%), then a hard cut to night purple (#12002a) */
      background: linear-gradient(
        to bottom,
        var(--sky-stop-1) 0%,
        var(--sky-stop-2) 35%,
        var(--sky-stop-3) 53%,
        var(--hot-pink) 65%,
        var(--night-purple) 65%,
        var(--night-purple) 100%
      );
    }

    /* ==========================================================================
       STARS (Upper 66%, Twinkling alternating opacity)
       ========================================================================== */
    .stars-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 66%;
      pointer-events: none;
      z-index: 2;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      animation: starTwinkle ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      0% {
        opacity: 0.15;
        transform: scale(0.7);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.35);
      }
      100% {
        opacity: 0.3;
        transform: scale(0.85);
      }
    }

    /* 10 scattered stars in white, yellow, cyan, violet on upper 66% */
    .star-1  { top: 10%; left: 12%; width: 3px; height: 3px; background: radial-gradient(circle, #ffffff 30%, transparent 80%); animation-duration: 4.6s; animation-delay: 0.2s; }
    .star-2  { top: 22%; left: 28%; width: 4px; height: 4px; background: radial-gradient(circle, var(--pale-yellow) 30%, transparent 80%); animation-duration: 5.8s; animation-delay: 1.4s; }
    .star-3  { top: 7%;  left: 45%; width: 3px; height: 3px; background: radial-gradient(circle, var(--cyan) 30%, transparent 80%); animation-duration: 3.9s; animation-delay: 0.7s; }
    .star-4  { top: 18%; left: 63%; width: 4px; height: 4px; background: radial-gradient(circle, var(--violet) 30%, transparent 80%); animation-duration: 6.2s; animation-delay: 2.1s; }
    .star-5  { top: 31%; left: 79%; width: 3px; height: 3px; background: radial-gradient(circle, #ffffff 30%, transparent 80%); animation-duration: 4.8s; animation-delay: 1.6s; }
    .star-6  { top: 44%; left: 88%; width: 4px; height: 4px; background: radial-gradient(circle, var(--pale-yellow) 30%, transparent 80%); animation-duration: 5.3s; animation-delay: 0.5s; }
    .star-7  { top: 15%; left: 85%; width: 3px; height: 3px; background: radial-gradient(circle, var(--cyan) 30%, transparent 80%); animation-duration: 4.2s; animation-delay: 2.9s; }
    .star-8  { top: 38%; left: 14%; width: 4px; height: 4px; background: radial-gradient(circle, var(--violet) 30%, transparent 80%); animation-duration: 6.5s; animation-delay: 3.4s; }
    .star-9  { top: 49%; left: 22%; width: 3px; height: 3px; background: radial-gradient(circle, #ffffff 30%, transparent 80%); animation-duration: 3.7s; animation-delay: 1.9s; }
    .star-10 { top: 57%; left: 71%; width: 3px; height: 3px; background: radial-gradient(circle, var(--pale-yellow) 30%, transparent 80%); animation-duration: 4.7s; animation-delay: 2.6s; }

    /* ==========================================================================
       SUN & SUN GLOW (min(46vmin, 380px), mask-image stripes, 40s drift)
       ========================================================================== */
    .sun-anchor {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(46vmin, 380px);
      height: min(46vmin, 380px);
      pointer-events: none;
      z-index: 3;
    }

    /* Drift animation: drifts down 4vh over 40s and back */
    .sun-drift {
      width: 100%;
      height: 100%;
      animation: sunDrift 40s ease-in-out infinite alternate;
    }

    @keyframes sunDrift {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(4vh);
      }
    }

    .sun-parallax-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    /* Separate glow element behind sun carrying two layered box-shadows:
       pink 80px/30px spread and yellow 200px/80px */
    .sun-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 80px 30px var(--hot-pink),
        0 0 200px 80px var(--pale-yellow);
      opacity: 0.88;
      pointer-events: none;
    }

    /* Sun disc with vertical gradient from pale yellow through orange to pink and violet
       and mask-image horizontal stripes:
       solid until 52%, then alternating transparent and opaque bands that grow wider toward bottom:
       (52–55, 63–67, 73.5–78.5, 83–89, 92–100 transparent) */
    .sun-disc {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(
        to bottom,
        var(--pale-yellow) 0%,
        var(--sun-orange) 38%,
        var(--hot-pink) 72%,
        var(--violet) 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000000 0%,
        #000000 52%,
        transparent 52%,
        transparent 55%,
        #000000 55%,
        #000000 63%,
        transparent 63%,
        transparent 67%,
        #000000 67%,
        #000000 73.5%,
        transparent 73.5%,
        transparent 78.5%,
        #000000 78.5%,
        #000000 83%,
        transparent 83%,
        transparent 89%,
        #000000 89%,
        #000000 92%,
        transparent 92%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        #000000 0%,
        #000000 52%,
        transparent 52%,
        transparent 55%,
        #000000 55%,
        #000000 63%,
        transparent 63%,
        transparent 67%,
        #000000 67%,
        #000000 73.5%,
        transparent 73.5%,
        transparent 78.5%,
        #000000 78.5%,
        #000000 83%,
        transparent 83%,
        transparent 89%,
        #000000 89%,
        #000000 92%,
        transparent 92%,
        transparent 100%
      );
    }

    /* ==========================================================================
       HORIZON HAZE BAND (60–72%, blur(6px))
       ========================================================================== */
    .horizon-haze {
      position: absolute;
      top: 60%;
      height: 12%;
      left: -10vw;
      width: 120vw;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255, 113, 206, 0.45) 30%,
        rgba(255, 113, 206, 0.75) 50%,
        rgba(255, 113, 206, 0.35) 75%,
        transparent 100%
      );
      filter: blur(6px);
      pointer-events: none;
      z-index: 6;
    }

    /* ==========================================================================
       GROUND & 3D CSS PLANE (.floor inside .scene)
       ========================================================================== */
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      perspective: 520px;
      perspective-origin: 50% 40%;
      overflow: hidden;
      pointer-events: none;
      z-index: 4;
    }

    .floor {
      position: absolute;
      top: 66%;
      left: 50%;
      width: 300%;
      height: 130%;
      transform-origin: 50% 0%;
      transform: translateX(-50%) rotateX(72deg);
      background-color: var(--night-purple);
      /* Background stacks:
         1) Bright cyan vertical centre line
         2) Repeating cyan vertical grid (2px every 80px)
         3) Repeating pink horizontal grid (2px every 80px) */
      background-image:
        linear-gradient(90deg, transparent calc(50% - 1.5px), var(--cyan) calc(50% - 1.5px), var(--cyan) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
        repeating-linear-gradient(90deg, var(--cyan) 0px, var(--cyan) 2px, transparent 2px, transparent 80px),
        repeating-linear-gradient(0deg, var(--hot-pink) 0px, var(--hot-pink) 2px, transparent 2px, transparent 80px);
      background-size:
        100% 100%,
        100% 100%,
        100% 80px;
      background-position:
        center top,
        calc(50% - 1px) top,
        0 0;
      /* Animated scrolling toward the viewer seamlessly */
      animation: gridScroll var(--grid-speed, 4s) linear infinite;
    }

    @keyframes gridScroll {
      0% {
        background-position:
          center top,
          calc(50% - 1px) top,
          0 0px;
      }
      100% {
        background-position:
          center top,
          calc(50% - 1px) top,
          0 80px;
      }
    }

    /* Floor fade gradient adding pink glow at horizon & darkening to bottom edge */
    .floor-fade {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(255, 113, 206, 0.85) 0%,
        rgba(255, 113, 206, 0.4) 10%,
        rgba(18, 0, 42, 0.25) 35%,
        rgba(18, 0, 42, 0.75) 70%,
        var(--night-purple) 98%
      );
    }

    /* Rotating checkered accent: 60vmin circle at bottom centre,
       repeating-conic-gradient violet checkerboard (12% cells), rotateX(74deg),
       radial mask to feather edges, spinning 360deg every 40s at 50% opacity */
    .checkered-accent-wrap {
      position: absolute;
      bottom: -15vmin;
      left: 50%;
      transform: translateX(-50%) rotateX(74deg);
      transform-origin: 50% 50%;
      pointer-events: none;
      z-index: 5;
    }

    .checkered-accent-disc {
      width: 60vmin;
      height: 60vmin;
      border-radius: 50%;
      background: repeating-conic-gradient(
        var(--violet) 0% 6%,
        transparent 6% 12%
      );
      -webkit-mask-image: radial-gradient(circle, #000000 35%, transparent 70%);
      mask-image: radial-gradient(circle, #000000 35%, transparent 70%);
      opacity: 0.5;
      animation: spinChecker 40s linear infinite;
    }

    @keyframes spinChecker {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* ==========================================================================
       PALMS (Inline SVG, ~22vw wide, anchored at bottom 33% at each edge)
       ========================================================================== */
    .palm-container {
      position: absolute;
      bottom: 27%;
      width: 22vw;
      min-width: 150px;
      max-width: 320px;
      pointer-events: none;
      z-index: 7;
    }

    .palm-left {
      left: -1vw;
      transform-origin: 20% 100%;
      animation: palmSwayLeft 7s ease-in-out infinite alternate;
    }

    .palm-right {
      right: -1vw;
      transform-origin: 20% 100%;
      /* Mirrored with scaleX(-1) and offset in phase */
      animation: palmSwayRight 7s ease-in-out infinite alternate;
      animation-delay: -3.5s;
    }

    @keyframes palmSwayLeft {
      0% {
        transform: rotate(-1.3deg);
      }
      100% {
        transform: rotate(1.3deg);
      }
    }

    @keyframes palmSwayRight {
      0% {
        transform: scaleX(-1) rotate(-1.3deg);
      }
      100% {
        transform: scaleX(-1) rotate(1.3deg);
      }
    }

    .palm-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 7px rgba(255, 113, 206, 0.45));
    }

    /* ==========================================================================
       CLASSICAL BUST (Inline SVG, right of centre at 28% from top)
       ========================================================================== */
    .bust-anchor {
      position: absolute;
      top: 28%;
      left: 71%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 8;
    }

    .bust-parallax-wrap {
      will-change: transform;
    }

    /* Floating ±22px with ±2deg rotation over 9s, glowing violet via drop-shadow */
    .bust-float {
      animation: bustFloating 9s ease-in-out infinite alternate;
      filter:
        drop-shadow(0 0 16px var(--violet))
        drop-shadow(0 0 35px rgba(185, 103, 255, 0.6));
    }

    @keyframes bustFloating {
      0% {
        transform: translateY(-22px) rotate(-2deg);
      }
      100% {
        transform: translateY(22px) rotate(2deg);
      }
    }

    .bust-svg {
      width: min(24vw, 220px);
      height: auto;
      display: block;
    }

    /* ==========================================================================
       TYPOGRAPHY: TITLE, SUBTITLE, CAPTIONS
       ========================================================================== */
    /* Top right Japanese-style spaced caption */
    .top-caption {
      position: absolute;
      top: 24px;
      right: 32px;
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: clamp(10px, 1.2vw, 13px);
      color: var(--pale-yellow);
      letter-spacing: 0.28em;
      text-shadow: 0 0 10px rgba(255, 251, 150, 0.5);
      opacity: 0.88;
      z-index: 15;
      pointer-events: none;
    }

    /* Centred at 46% height */
    .title-anchor {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 9;
    }

    .title-parallax-wrap {
      display: inline-block;
      will-change: transform;
    }

    /* Chrome effect: vertical gradient white -> cyan -> dark teal (#063a55) at 49%
       -> hard white at 51% -> pink -> violet, clipped to text with background-clip: text,
       plus 1px semi-white text-stroke, and 3 stacked drop-shadow filters */
    .chrome-title {
      font-family: Palatino, 'Palatino Linotype', 'Iowan Old Style', Georgia, serif;
      font-weight: 700;
      font-size: clamp(30px, 8.5vw, 132px);
      letter-spacing: 0.04em;
      line-height: 1.05;
      white-space: nowrap;
      margin: 0;
      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        var(--cyan) 32%,
        var(--dark-teal) 49%,
        #ffffff 51%,
        var(--hot-pink) 76%,
        var(--violet) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.72);
      /* 3 stacked drop-shadow filters with 6s cyan->pink glow shimmer */
      animation: chromeGlowShimmer 6s ease-in-out infinite alternate;
      padding: 6px 16px;
    }

    @keyframes chromeGlowShimmer {
      0% {
        filter:
          drop-shadow(0 4px 0 var(--violet))
          drop-shadow(0 8px 0 var(--night-purple))
          drop-shadow(0 0 22px var(--cyan));
      }
      100% {
        filter:
          drop-shadow(0 4px 0 var(--violet))
          drop-shadow(0 8px 0 var(--night-purple))
          drop-shadow(0 0 22px var(--hot-pink));
      }
    }

    /* Mint mono subtitle with wide letterspacing & mint text-shadow */
    .subtitle {
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: clamp(11px, 1.7vw, 22px);
      color: var(--mint);
      letter-spacing: 0.38em;
      margin-top: 14px;
      text-shadow:
        0 0 8px var(--mint),
        0 0 20px rgba(5, 255, 161, 0.45);
      text-transform: uppercase;
    }

    /* ==========================================================================
       RETRO FAUX-OS WINDOW (Windows 95 style, 320px, bottom-left)
       ========================================================================== */
    .retro-window {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 320px;
      background: #c0c0c0;
      /* Bevelled 2px borders (#fff top/left, #404040 bottom/right) */
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      /* 1px black and 6px translucent offset shadows */
      box-shadow:
        1px 1px 0px 1px #000000,
        6px 6px 16px rgba(0, 0, 0, 0.65);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 30;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Title bar: navy -> blue gradient */
    .win-titlebar {
      background: linear-gradient(90deg, #000080, #1084d0);
      padding: 3px 4px 3px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: bold;
      letter-spacing: 0.3px;
      cursor: grab;
    }

    .win-titlebar:active {
      cursor: grabbing;
    }

    .win-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Pink/cyan gradient icon */
    .win-icon {
      width: 14px;
      height: 14px;
      background: linear-gradient(135deg, var(--hot-pink), var(--cyan));
      border: 1px solid #ffffff;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .win-controls {
      display: flex;
      gap: 2px;
    }

    /* Bevelled _ □ × buttons */
    .win-ctrl-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 1px solid #000000;
      border-bottom: 1px solid #000000;
      box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080;
      color: #000000;
      font-size: 9px;
      font-weight: bold;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
    }

    .win-ctrl-btn:active {
      border-top: 1px solid #000000;
      border-left: 1px solid #000000;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      box-shadow: inset 1px 1px #808080;
      padding-top: 1px;
      padding-left: 1px;
    }

    /* Menu row with underlined first letters */
    .win-menu-row {
      display: flex;
      gap: 12px;
      padding: 3px 8px;
      font-size: 11px;
      color: #000000;
      border-bottom: 1px solid #808080;
    }

    .win-menu-item {
      cursor: default;
    }

    .win-menu-item:hover {
      background: #000080;
      color: #ffffff;
    }

    .win-body {
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* Black LCD display in mono mint text with pink labels */
    .win-lcd {
      background: #000000;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 6px 8px;
      font-family: ui-monospace, 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.45;
    }

    .lcd-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lcd-pink {
      color: var(--hot-pink);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .lcd-mint {
      color: var(--mint);
      text-shadow: 0 0 6px rgba(5, 255, 161, 0.7);
      font-weight: 600;
    }

    /* Striped navy progress bar that fills over 20s */
    .progress-container {
      height: 13px;
      background: #ffffff;
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        -45deg,
        #000080 0px,
        #000080 6px,
        #1084d0 6px,
        #1084d0 12px
      );
      transition: width 0.1s linear;
    }

    /* Three bevelled buttons ▶ Play, ◂◂ Slow, ▸▸ Fast */
    .win-transport-buttons {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      flex: 1;
      padding: 4px 2px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      color: #000000;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .win-btn:active,
    .win-btn.pressed,
    .win-btn[aria-pressed="true"] {
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px #808080, inset -1px -1px #dfdfdf;
      padding-top: 5px;
      padding-left: 3px;
      background: #b5b5b5;
    }

    /* Two-cell status bar */
    .win-statusbar {
      display: flex;
      gap: 3px;
      font-size: 10px;
    }

    .status-cell {
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 2px 5px;
      color: #000000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-left {
      flex: 2;
    }

    .status-right {
      flex: 1;
      text-align: right;
    }

    /* Restored taskbar button when window is closed */
    .retro-taskbar-restore {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: none;
      z-index: 30;
      padding: 5px 12px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: 1px 1px 0px 1px #000000;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================================================
       RESPONSIVE DESIGN & ACCESSIBILITY
       ========================================================================== */
    @media (max-width: 768px) {
      .top-caption {
        display: none !important;
      }
      .bust-anchor {
        top: 25%;
        left: 78%;
      }

    /* Under prefers-reduced-motion: disable all keyframe animations & parallax */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;

  <!-- ==========================================================================
       JAVASCRIPT INTERACTIVITY & PARALLAX
       ========================================================================== -->
  <script>
    (function () {
      'use strict';

      // Elements
      const root = document.documentElement;
      const btnPlay = document.getElementById('btn-play');
      const btnSlow = document.getElementById('btn-slow');
      const btnFast = document.getElementById('btn-fast');
      const lcdClock = document.getElementById('lcd-clock');
      const lcdSpeed = document.getElementById('lcd-speed');
      const statusLeft = document.getElementById('status-left');
      const progressBar = document.getElementById('progress-bar');
      const progressContainer = document.querySelector('.progress-container');

      const retroWindow = document.getElementById('retro-window');
      const winTitlebar = document.getElementById('win-titlebar');
      const winBody = document.getElementById('win-body');
      const btnMinimize = document.getElementById('btn-minimize');
      const btnMaximize = document.getElementById('btn-maximize');
      const btnClose = document.getElementById('btn-close');
      const btnRestore = document.getElementById('btn-restore');
      const menuHelp = document.getElementById('menu-help');

      const titleParallax = document.getElementById('title-parallax');
      const bustParallax = document.getElementById('bust-parallax');
      const sunParallax = document.getElementById('sun-parallax');

      // Four grid speed levels:
      // DRIFT (12s), CRUISE (4s), RUSH (1.4s), HYPER (0.5s)
      const SPEED_LEVELS = [
        { name: 'DRIFT',  seconds: 12,  cssVal: '12s',  mult: '0.33x' },
        { name: 'CRUISE', seconds: 4,   cssVal: '4s',   mult: '1.0x' },
        { name: 'RUSH',   seconds: 1.4, cssVal: '1.4s', mult: '2.9x' },
        { name: 'HYPER',  seconds: 0.5, cssVal: '0.5s', mult: '8.0x' }
      ];

      let currentLevelIndex = 1; // Default: CRUISE
      let isPlaying = false;
      let elapsedMs = 0;
      let lastTimestamp = null;
      let clockInterval = null;

      // Update grid speed and LCD readouts
      function setSpeedLevel(index) {
        currentLevelIndex = Math.max(0, Math.min(SPEED_LEVELS.length - 1, index));
        const level = SPEED_LEVELS[currentLevelIndex];
        root.style.setProperty('--grid-speed', level.cssVal);
        lcdSpeed.textContent = level.mult + ' (' + level.name + ')';
        statusLeft.textContent = (isPlaying ? 'PLAYING' : 'PAUSED') + ' // ' + level.name;
      }

      // Format milliseconds as HH:MM:SS
      function formatTime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSec % 60).padStart(2, '0');
        return hrs + ':' + mins + ':' + secs;
      }

      // Audio Context for authentic warm vintage vaporwave synth pad
      let audioCtx = null;
      let synthGain = null;
      let oscillators = [];

      function initSynth() {
        if (audioCtx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          audioCtx = new AudioContext();

          // Master gain
          synthGain = audioCtx.createGain();
          synthGain.gain.setValueAtTime(0, audioCtx.currentTime);

          // Warm vintage analog low-pass filter
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(820, audioCtx.currentTime);
          filter.Q.setValueAtTime(2.2, audioCtx.currentTime);

          // Filter LFO for subtle analog VHS drift
          const lfo = audioCtx.createOscillator();
          const lfoGain = audioCtx.createGain();
          lfo.frequency.setValueAtTime(0.18, audioCtx.currentTime);
          lfoGain.gain.setValueAtTime(140, audioCtx.currentTime);
          lfo.connect(filter.frequency);
          lfo.start();

          // Dream chord frequencies: D3, A3, F#4, C#5 (Dmaj7 classic vaporwave chord)
          const freqs = [146.83, 220.00, 369.99, 554.37];
          freqs.forEach(function (freq, i) {
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = i % 2 === 0 ? 'sawtooth' : 'triangle';
            // Slight vintage detune
            osc.detune.setValueAtTime((i - 1.5) * 6, audioCtx.currentTime);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            oscGain.gain.setValueAtTime(0.022, audioCtx.currentTime);
            osc.connect(filter);
            osc.start();
            oscillators.push(osc);
          });

          filter.connect(synthGain);
          synthGain.connect(audioCtx.destination);
        } catch (e) {
          console.warn('Web Audio synthesis unavailable:', e);
        }
      }

      function startAudio() {
        initSynth();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (synthGain && audioCtx) {
          synthGain.gain.cancelScheduledValues(audioCtx.currentTime);
          synthGain.gain.setValueAtTime(synthGain.gain.value, audioCtx.currentTime);
          synthGain.gain.linearRampToValueAtTime(0.065, audioCtx.currentTime + 0.6);
        }
      }

      function stopAudio() {
        if (synthGain && audioCtx) {
          synthGain.gain.cancelScheduledValues(audioCtx.currentTime);
          synthGain.gain.setValueAtTime(synthGain.gain.value, audioCtx.currentTime);
          synthGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        }
      }

      // Play / Pause toggle
      function togglePlay() {
        isPlaying = !isPlaying;
        btnPlay.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');

        if (isPlaying) {
          btnPlay.textContent = '❚❚ Pause';
          btnPlay.classList.add('pressed');
          // Jumping grid to "RUSH" speed (index 2: 1.4s)
          setSpeedLevel(2);
          startAudio();

          // Start progress & clock animation
          lastTimestamp = performance.now();
          if (!clockInterval) {
            clockInterval = requestAnimationFrame(updatePlayback);
          }
        } else {
          btnPlay.textContent = '▶ Play';
          btnPlay.classList.remove('pressed');
          // Pausing returns to "CRUISE" speed (index 1: 4s)
          setSpeedLevel(1);
          stopAudio();

          if (clockInterval) {
            cancelAnimationFrame(clockInterval);
            clockInterval = null;
          }
          lastTimestamp = null;
        }
      }

      // Clock & progress bar update loop (runs only while playing)
      function updatePlayback(now) {
        if (!isPlaying) return;

        if (lastTimestamp) {
          const delta = now - lastTimestamp;
          elapsedMs += delta;

          // Update LCD clock
          lcdClock.textContent = formatTime(elapsedMs);

          // Progress bar fills over 20s (20000 ms loop)
          const loopPeriod = 20000;
          const currentProgress = (elapsedMs % loopPeriod) / loopPeriod;
          const pct = (currentProgress * 100).toFixed(1);
          progressBar.style.width = pct + '%';
          progressContainer.setAttribute('aria-valuenow', (currentProgress * 20).toFixed(1));
        }

        lastTimestamp = now;
        clockInterval = requestAnimationFrame(updatePlayback);
      }

      // Transport button event listeners
      btnPlay.addEventListener('click', togglePlay);

      btnSlow.addEventListener('click', function () {
        setSpeedLevel(currentLevelIndex - 1);
      });

      btnFast.addEventListener('click', function () {
        setSpeedLevel(currentLevelIndex + 1);
      });

      // Window controls (_ □ ×)
      let isMinimized = false;
      let isMaximized = false;

      btnMinimize.addEventListener('click', function () {
        isMinimized = !isMinimized;
        winBody.style.display = isMinimized ? 'none' : 'flex';
      });

      btnMaximize.addEventListener('click', function () {
        isMaximized = !isMaximized;
        if (isMaximized) {
          retroWindow.style.transform = 'scale(1.1)';
          retroWindow.style.transformOrigin = 'bottom left';
        } else {
          retroWindow.style.transform = 'none';
        }
      });

      btnClose.addEventListener('click', function () {
        retroWindow.style.display = 'none';
        btnRestore.style.display = 'block';
      });

      btnRestore.addEventListener('click', function () {
        retroWindow.style.display = 'block';
        btnRestore.style.display = 'none';
      });

      menuHelp.addEventListener('click', function () {
        alert('LUNAR WIND PLAYER v1.0\n(c) 1995 NEON AUDIO SYSTEMS\nClick Play to rush into the horizon.');
      });

      // Simple draggable title bar
      let isDragging = false;
      let dragStartX, dragStartY, windowStartLeft, windowStartBottom;

      winTitlebar.addEventListener('mousedown', function (e) {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;

        const rect = retroWindow.getBoundingClientRect();
        windowStartLeft = rect.left;
        windowStartBottom = window.innerHeight - rect.bottom;

        retroWindow.style.left = windowStartLeft + 'px';
        retroWindow.style.bottom = windowStartBottom + 'px';
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;

        const newLeft = Math.max(8, Math.min(window.innerWidth - retroWindow.offsetWidth - 8, windowStartLeft + dx));
        const newBottom = Math.max(8, Math.min(window.innerHeight - retroWindow.offsetHeight - 8, windowStartBottom - dy));

        retroWindow.style.left = newLeft + 'px';
        retroWindow.style.bottom = newBottom + 'px';
      });

      window.addEventListener('mouseup', function () {
        isDragging = false;
      });

      // ==========================================================================
      // LERPED MOUSE PARALLAX (Fine Pointers only, disabled on reduced motion)
      // ==========================================================================
      const isFinePointer = window.matchMedia('(pointer: fine)').matches;
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (isFinePointer && !prefersReducedMotion) {
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        window.addEventListener('mousemove', function (e) {
          // Normalized coordinates: -1 to 1
          targetX = (e.clientX / window.innerWidth - 0.5) * 2;
          targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function parallaxLoop() {
          // Smooth lerp (0.055 factor)
          currentX += (targetX - currentX) * 0.055;
          currentY += (targetY - currentY) * 0.055;

          // Shifts title (with slight rotateY)
          if (titleParallax) {
            titleParallax.style.transform =
              'translate3d(' + (currentX * 18).toFixed(2) + 'px, ' + (currentY * 12).toFixed(2) + 'px, 0) ' +
              'rotateY(' + (currentX * 8).toFixed(2) + 'deg) rotateX(' + (-currentY * 4).toFixed(2) + 'deg)';
          }

          // Shifts bust in opposite direction
          if (bustParallax) {
            bustParallax.style.transform =
              'translate3d(' + (-currentX * 22).toFixed(2) + 'px, ' + (-currentY * 15).toFixed(2) + 'px, 0)';
          }

          // Shifts sun in opposite direction
          if (sunParallax) {
            sunParallax.style.transform =
              'translate3d(' + (-currentX * 12).toFixed(2) + 'px, ' + (-currentY * 8).toFixed(2) + 'px, 0)';
          }

          requestAnimationFrame(parallaxLoop);
        }

        requestAnimationFrame(parallaxLoop);
      }

      // Initialize default speed
      setSpeedLevel(1);

    })();
  </script>
</body>
