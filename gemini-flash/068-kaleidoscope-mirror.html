<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kaleidoscope — Antique Brass Eyepiece</title>
  <style>
    /* Reset & Base Setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0c0a;
    }

    body {
      background-color: #0e0c0a;
      background-image: radial-gradient(circle at 50% 50%, #241c14 0%, #15110d 48%, #0e0c0a 82%);
      color: #e9dcc4;
      font-family: Georgia, "Iowan Old Style", Palatino, "Book Antiqua", serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 16px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      position: relative;
    }

    /* SVG Felt Noise Overlay */
    .felt-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: overlay;
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }

    /* Header Styling */
    .kaleido-header {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      margin-top: 4px;
    }

    .title {
      font-family: Georgia, "Iowan Old Style", Palatino, "Book Antiqua", serif;
      font-size: clamp(1.4rem, 3.2vw, 2.1rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      color: #f3d58a;
      text-shadow: 
        0 2px 4px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(201, 154, 60, 0.35);
    }

    .telemetry-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .system-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: rgba(233, 220, 196, 0.5);
    }

    .telemetry-sep {
      color: rgba(201, 154, 60, 0.4);
      font-size: 0.75rem;
    }

    /* Center Eyepiece Stage */
    .instrument-stage {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    /* The Eyepiece: sized min(88vw, 74vh) centered in viewport with deep drop shadow */
    .eyepiece {
      position: relative;
      width: min(88vw, 74vh);
      height: min(88vw, 74vh);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      box-shadow: 
        0 30px 75px rgba(0, 0, 0, 0.94),
        0 14px 28px rgba(0, 0, 0, 0.75),
        inset 0 2px 4px rgba(243, 213, 138, 0.4),
        0 0 0 1px rgba(90, 58, 12, 0.6);
      transform-origin: center center;
    }

    /* Eyepiece slow sheen: outer conic-gradient of brass tones rotating once every 40s */
    .eyepiece-sheen {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #f3d58a 0deg,
        #c99a3c 45deg,
        #9c6a1e 115deg,
        #5a3a0c 180deg,
        #9c6a1e 245deg,
        #c99a3c 315deg,
        #f3d58a 360deg
      );
      animation: sheenRotate 40s linear infinite;
      z-index: 1;
    }

    @keyframes sheenRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Knurling: ::before layer of repeating-conic-gradient hairlines masked to outer band */
    .eyepiece::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(243, 213, 138, 0.45) 0deg 0.5deg,
        rgba(30, 16, 4, 0.75) 0.5deg 1deg
      );
      -webkit-mask: radial-gradient(circle, transparent 88%, black 89%, black 99.5%, transparent 100%);
      mask: radial-gradient(circle, transparent 88%, black 89%, black 99.5%, transparent 100%);
    }

    /* Machined Lip: ::after inner ring with second conic gradient and inset shadows */
    .eyepiece::after {
      content: '';
      position: absolute;
      inset: 4.2%;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      background: conic-gradient(
        from 180deg,
        #8b5a15 0deg,
        #f3d58a 65deg,
        #5a3a0c 180deg,
        #f3d58a 275deg,
        #8b5a15 360deg
      );
      box-shadow: 
        inset 0 3px 6px rgba(243, 213, 138, 0.65),
        inset 0 -4px 9px rgba(18, 9, 2, 0.95),
        0 0 12px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(85, 50, 12, 0.85);
    }

    /* Circular Lens: inset 7% clips the canvas */
    .lens-assembly {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      overflow: hidden;
      z-index: 4;
      cursor: grab;
      background: #000;
      box-shadow: 
        inset 0 6px 24px rgba(0, 0, 0, 0.98),
        0 0 0 2px rgba(50, 28, 6, 0.95),
        0 0 20px rgba(0, 0, 0, 0.9);
    }

    .lens-assembly:active {
      cursor: grabbing;
    }

    #displayCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    /* Vignette overlay: darkens toward edge, adds soft elliptical highlight at upper-left */
    .lens-vignette {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      background: 
        radial-gradient(ellipse 65% 52% at 28% 22%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 40%, transparent 65%),
        radial-gradient(circle at center, transparent 60%, rgba(14, 10, 8, 0.35) 78%, rgba(5, 3, 2, 0.9) 100%);
      box-shadow: inset 0 0 24px 8px rgba(0, 0, 0, 0.7);
    }

    /* Diagonal glint band drifting back and forth over 9s */
    .lens-glint {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      border-radius: 0;
      pointer-events: none;
      z-index: 6;
      background: linear-gradient(
        125deg,
        transparent 43%,
        rgba(255, 255, 255, 0.06) 47%,
        rgba(255, 255, 255, 0.24) 50%,
        rgba(255, 255, 255, 0.06) 53%,
        transparent 57%
      );
      animation: glintDrift 9s ease-in-out infinite;
    }

    @keyframes glintDrift {
      0% {
        transform: translate(-30%, -30%);
        opacity: 0.55;
      }
      50% {
        transform: translate(30%, 30%);
        opacity: 0.95;
      }
      100% {
        transform: translate(-30%, -30%);
        opacity: 0.55;
      }
    }

    /* Eyepiece tactile physical shake animation */
    .eyepiece.eyepiece-shaking {
      animation: eyepieceShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes eyepieceShake {
      0% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.018) rotate(-1.5deg) translate(-3px, 3px); }
      30% { transform: scale(0.985) rotate(1.8deg) translate(4px, -3px); }
      45% { transform: scale(1.012) rotate(-1.2deg) translate(-3px, -2px); }
      60% { transform: scale(0.992) rotate(0.9deg) translate(3px, 2px); }
      75% { transform: scale(1.006) rotate(-0.5deg) translate(-1px, 1px); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Eyepiece micro hint */
    .eyepiece-hint {
      position: absolute;
      bottom: -22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(233, 220, 196, 0.4);
      pointer-events: none;
      text-align: center;
      width: 100%;
    }

    /* Footer Controls in Brass-Gradient Segmented Pills */
    .kaleido-footer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      max-width: 960px;
      margin-bottom: 2px;
    }

    .control-cluster {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cluster-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(233, 220, 196, 0.5);
    }

    .brass-segmented-group {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(180deg, #24170a 0%, #130a03 100%);
      padding: 3px;
      border-radius: 9999px;
      border: 1px solid #6e4c1e;
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.85),
        0 1px 1px rgba(243, 213, 138, 0.15);
      gap: 2px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      border-radius: 9999px;
      padding: 5px 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(233, 220, 196, 0.65);
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      outline: none;
    }

    .pill-btn:hover {
      color: #f3d58a;
      background: rgba(243, 213, 138, 0.08);
    }

    .pill-btn.active {
      background: linear-gradient(180deg, #d8a741 0%, #8b5b15 100%);
      color: #170d03;
      font-weight: 700;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.65),
        0 2px 5px rgba(0, 0, 0, 0.55);
      text-shadow: 0 1px 0 rgba(255, 235, 170, 0.4);
    }

    /* Palette Swatch Dot Icons */
    .swatch-disc {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .swatch-jewel {
      background: conic-gradient(#7b1fa2, #c2185b, #0288d1, #f9a825, #7b1fa2);
    }
    .swatch-pastel {
      background: conic-gradient(#f8bbd0, #b3e5fc, #c8e6c9, #fff59d, #f8bbd0);
    }
    .swatch-neon {
      background: conic-gradient(#39ff14, #ff073a, #00f0ff, #ff00e6, #39ff14);
    }
    .swatch-autumn {
      background: conic-gradient(#8b2500, #daa520, #556b2f, #cd5c5c, #8b2500);
    }

    /* Shard Density Slider Container */
    .slider-pill-box {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(180deg, #24170a 0%, #130a03 100%);
      padding: 3px 12px;
      border-radius: 9999px;
      border: 1px solid #6e4c1e;
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.85),
        0 1px 1px rgba(243, 213, 138, 0.15);
      gap: 9px;
      height: 31px;
    }

    .slider-val-badge {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #f3d58a;
      min-width: 18px;
      text-align: right;
    }

    /* Brass Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      width: 82px;
      cursor: pointer;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 5px;
      background: linear-gradient(180deg, #160c04 0%, #2f1b08 100%);
      border-radius: 3px;
      border: 1px solid #634114;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 15px;
      width: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff1c7 0%, #d4a53d 45%, #76470e 100%);
      border: 1px solid #3c2105;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.55);
      margin-top: -5px;
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type=range]::-moz-range-track {
      height: 5px;
      background: linear-gradient(180deg, #160c04 0%, #2f1b08 100%);
      border-radius: 3px;
      border: 1px solid #634114;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    input[type=range]::-moz-range-thumb {
      height: 15px;
      width: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff1c7 0%, #d4a53d 45%, #76470e 100%);
      border: 1px solid #3c2105;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    /* Standalone Shake Pill Button */
    .shake-btn {
      background: linear-gradient(180deg, #3a240c 0%, #1d1104 100%);
      border: 1px solid #8e6220;
      border-radius: 9999px;
      padding: 5px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f3d58a;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 
        inset 0 1px 1px rgba(243, 213, 138, 0.35),
        0 2px 5px rgba(0, 0, 0, 0.65);
      transition: all 0.18s ease;
      height: 31px;
    }

    .shake-btn:hover {
      background: linear-gradient(180deg, #573711 0%, #291705 100%);
      box-shadow: 
        inset 0 1px 2px rgba(243, 213, 138, 0.55),
        0 3px 8px rgba(0, 0, 0, 0.75);
      transform: translateY(-1px);
    }

    .shake-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.85);
    }

    .shake-icon {
      flex-shrink: 0;
    }

    /* Reduced Motion Constraints */
    @media (prefers-reduced-motion: reduce) {
      .eyepiece-sheen {
        animation: none !important;
      }
      .lens-glint {
        animation: none !important;
        display: none !important;
      }
      .eyepiece.eyepiece-shaking {
        animation: none !important;
      }
    }

    /* Compact Screen Adaptations */
    @media (max-width: 640px) {
      body {
        padding: 8px 10px 10px;
      }
      .title {
        font-size: 1.35rem;
      }
      .pill-btn {
        padding: 4px 8px;
        font-size: 0.62rem;
        letter-spacing: 0.14em;
      }
      .cluster-title {
        display: none;
      }
      input[type=range] {
        width: 65px;
      }
      .kaleido-footer {
        gap: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Felt Texture Noise Filter -->
  <svg class="felt-overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="feltNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#feltNoise)" />
  </svg>

  <!-- Header -->
  <header class="kaleido-header">
    <h1 class="title">Kaleidoscope</h1>
    <div class="telemetry-bar">
      <span class="system-label" id="headerFolds">8-Fold Symmetry</span>
      <span class="telemetry-sep">✦</span>
      <span class="system-label" id="headerShards">24 Active Shards</span>
    </div>
  </header>

  <!-- Instrument Stage & Antique Brass Eyepiece -->
  <main class="instrument-stage">
    <div class="eyepiece" id="eyepiece">
      <div class="eyepiece-sheen" aria-hidden="true"></div>
      
      <div class="lens-assembly" id="lensAssembly" title="Drag to turn · Double-click to shake">
        <canvas id="displayCanvas"></canvas>
        <div class="lens-vignette" aria-hidden="true"></div>
        <div class="lens-glint" aria-hidden="true"></div>
      </div>

      <div class="eyepiece-hint">Drag to turn · Double-click to shake</div>
    </div>
  </main>

  <!-- Footer Controls in Brass-Gradient Segmented Pills -->
  <footer class="kaleido-footer">
    
    <!-- Folds Group -->
    <div class="control-cluster">
      <span class="cluster-title">Folds</span>
      <div class="brass-segmented-group" id="foldsGroup" role="radiogroup" aria-label="Fold count">
        <button class="pill-btn" data-folds="6" role="radio" aria-checked="false">6</button>
        <button class="pill-btn active" data-folds="8" role="radio" aria-checked="true">8</button>
        <button class="pill-btn" data-folds="10" role="radio" aria-checked="false">10</button>
        <button class="pill-btn" data-folds="12" role="radio" aria-checked="false">12</button>
      </div>
    </div>

    <!-- Palette Swatches Group -->
    <div class="control-cluster">
      <span class="cluster-title">Palette</span>
      <div class="brass-segmented-group" id="paletteGroup" role="radiogroup" aria-label="Palette selection">
        <button class="pill-btn active" data-palette="jewel" role="radio" aria-checked="true">
          <span class="swatch-disc swatch-jewel"></span>Jewel
        </button>
        <button class="pill-btn" data-palette="pastel" role="radio" aria-checked="false">
          <span class="swatch-disc swatch-pastel"></span>Pastel
        </button>
        <button class="pill-btn" data-palette="neon" role="radio" aria-checked="false">
          <span class="swatch-disc swatch-neon"></span>Neon
        </button>
        <button class="pill-btn" data-palette="autumn" role="radio" aria-checked="false">
          <span class="swatch-disc swatch-autumn"></span>Autumn
        </button>
      </div>
    </div>

    <!-- Shard Density Slider -->
    <div class="control-cluster">
      <span class="cluster-title">Density</span>
      <div class="slider-pill-box">
        <input type="range" id="shardSlider" min="6" max="40" value="24" step="1" aria-label="Shard density">
        <span class="slider-val-badge" id="shardCountVal">24</span>
      </div>
    </div>

    <!-- Shake Button -->
    <button id="shakeBtn" class="shake-btn" title="Rebuild shapes with a 3x velocity kick (or double-click lens)">
      <svg class="shake-icon" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
      </svg>
      Shake
    </button>

  </footer>

  <script>
    (function () {
      'use strict';

      // --- Palette Definitions ---
      const PALETTES = {
        jewel: {
          name: 'Jewel',
          colors: ['#7b1fa2', '#c2185b', '#0288d1', '#00897b', '#f9a825', '#3949ab', '#e53935'],
          bg: '#07050d',
          compositeMode: 'screen'
        },
        pastel: {
          name: 'Pastel',
          colors: ['#f8bbd0', '#b3e5fc', '#c8e6c9', '#fff59d', '#e1bee7', '#ffe0b2', '#b2dfdb'],
          bg: '#f7f1e6',
          compositeMode: 'multiply'
        },
        neon: {
          name: 'Neon',
          colors: ['#39ff14', '#ff073a', '#00f0ff', '#ff9d00', '#ff00e6', '#c6ff00', '#7a5cff'],
          bg: '#020206',
          compositeMode: 'lighter'
        },
        autumn: {
          name: 'Autumn',
          colors: ['#8b2500', '#d2691e', '#daa520', '#556b2f', '#a0522d', '#cd5c5c', '#f4a460'],
          bg: '#1a0f08',
          compositeMode: 'source-over'
        }
      };

      // --- State Variables ---
      let currentFolds = 8;
      let currentPaletteName = 'jewel';
      let targetShardCount = 24;
      let shapes = [];

      // Reduced motion tracking
      const reducedMotionMedia = window.matchMedia('(prefers-reduced-motion: reduce)');
      let isReducedMotion = reducedMotionMedia.matches;
      reducedMotionMedia.addEventListener('change', (e) => {
        isReducedMotion = e.matches;
      });

      // Canvas elements
      const displayCanvas = document.getElementById('displayCanvas');
      const displayCtx = displayCanvas.getContext('2d');
      const lensAssembly = document.getElementById('lensAssembly');
      const eyepieceEl = document.getElementById('eyepiece');

      // Hidden source canvas: 1.5x lens diameter
      const sourceCanvas = document.createElement('canvas');
      const sourceCtx = sourceCanvas.getContext('2d');

      // UI elements
      const headerFolds = document.getElementById('headerFolds');
      const headerShards = document.getElementById('headerShards');
      const shardSlider = document.getElementById('shardSlider');
      const shardCountVal = document.getElementById('shardCountVal');
      const shakeBtn = document.getElementById('shakeBtn');
      const foldButtons = document.querySelectorAll('#foldsGroup .pill-btn');
      const paletteButtons = document.querySelectorAll('#paletteGroup .pill-btn');

      // Dimensions & DPR
      let cssLensSize = 300;
      let drawRadius = 150;
      let srcW = 450;
      let srcH = 450;
      let dpr = 1;

      // Interaction & Animation
      let globalAngle = 0;
      let targetPointerOx = 0;
      let targetPointerOy = 0;
      let currentOx = 0;
      let currentOy = 0;
      let shakeKick = 1.0;
      let lastTime = performance.now();
      let totalTime = 0;

      // Helper: parse hex to rgba with alpha
      function hexToRgba(hex, alpha) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      // --- Shape Generator ---
      function createRandomShape() {
        const type = Math.random() < 0.5 ? 'blob' : 'shard';
        const pal = PALETTES[currentPaletteName];
        
        const colorA = pal.colors[Math.floor(Math.random() * pal.colors.length)];
        let colorB = pal.colors[Math.floor(Math.random() * pal.colors.length)];
        if (pal.colors.length > 1 && colorB === colorA) {
          colorB = pal.colors[(pal.colors.indexOf(colorA) + 1) % pal.colors.length];
        }

        // Random position on source canvas
        const x = Math.random() * srcW;
        const y = Math.random() * srcH;

        // Small drift velocity
        const speed = 14 + Math.random() * 24; // px/sec
        const moveAngle = Math.random() * Math.PI * 2;
        const vx = Math.cos(moveAngle) * speed;
        const vy = Math.sin(moveAngle) * speed;

        // Size relative to radius
        const baseRadius = drawRadius * (0.09 + Math.random() * 0.16);

        // Rotation
        const angle = Math.random() * Math.PI * 2;
        const vRot = (Math.random() - 0.5) * 0.45; // rad/sec

        // Breathing sine phase & frequency
        const breathPhase = Math.random() * Math.PI * 2;
        const breathSpeed = 0.9 + Math.random() * 1.3;

        if (type === 'blob') {
          const hlAngle = Math.random() * Math.PI * 2;
          const hlDist = 0.28 + Math.random() * 0.2;
          return {
            type: 'blob',
            x, y, vx, vy,
            baseRadius,
            angle, vRot,
            breathPhase, breathSpeed,
            colorA, colorB,
            hlOffsetX: Math.cos(hlAngle) * hlDist,
            hlOffsetY: Math.sin(hlAngle) * hlDist
          };
        } else {
          // Shard: 3 to 6 sides with jittered vertices
          const sides = 3 + Math.floor(Math.random() * 4);
          const vertices = [];
          const step = (Math.PI * 2) / sides;
          for (let s = 0; s < sides; s++) {
            const vAngle = s * step + (Math.random() - 0.5) * (step * 0.42);
            const rDist = baseRadius * (0.65 + Math.random() * 0.65);
            vertices.push({ angle: vAngle, rDist });
          }
          const gradAngle = Math.random() * Math.PI * 2;
          return {
            type: 'shard',
            x, y, vx, vy,
            baseRadius,
            angle, vRot,
            breathPhase, breathSpeed,
            colorA, colorB,
            sides,
            vertices,
            gradAngle
          };
        }
      }

      // Populate or update shapes to target count without resetting the rest
      function syncShapeDensity(targetCount) {
        targetShardCount = Math.max(6, Math.min(40, targetCount));
        const currentCount = shapes.length;

        if (targetShardCount > currentCount) {
          const toAdd = targetShardCount - currentCount;
          for (let i = 0; i < toAdd; i++) {
            shapes.push(createRandomShape());
          }
        } else if (targetShardCount < currentCount) {
          shapes.length = targetShardCount;
        }

        shardSlider.value = targetShardCount;
        shardCountVal.textContent = targetShardCount;
        headerShards.textContent = `${targetShardCount} Active Shards`;
      }

      // Rebuild all shapes with randomized properties
      function rebuildAllShapes() {
        const count = shapes.length || targetShardCount;
        shapes = [];
        for (let i = 0; i < count; i++) {
          shapes.push(createRandomShape());
        }
      }

      // Update shape colors when palette changes
      function applyPaletteToExistingShapes() {
        const pal = PALETTES[currentPaletteName];
        for (const s of shapes) {
          s.colorA = pal.colors[Math.floor(Math.random() * pal.colors.length)];
          let cB = pal.colors[Math.floor(Math.random() * pal.colors.length)];
          if (pal.colors.length > 1 && cB === s.colorA) {
            cB = pal.colors[(pal.colors.indexOf(s.colorA) + 1) % pal.colors.length];
          }
          s.colorB = cB;
        }
      }

      // Shake action: rebuild shapes + brief 3x velocity kick + physical eyepiece jolt
      function performShake() {
        shakeKick = 3.0;
        rebuildAllShapes();

        // Mechanical jolt on brass rim
        eyepieceEl.classList.remove('eyepiece-shaking');
        void eyepieceEl.offsetWidth; // Force CSS reflow
        eyepieceEl.classList.add('eyepiece-shaking');
        setTimeout(() => {
          eyepieceEl.classList.remove('eyepiece-shaking');
        }, 460);
      }

      // --- Resize Observer & Canvas Sizing ---
      function handleResize() {
        const rect = lensAssembly.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        cssLensSize = rect.width;
        drawRadius = cssLensSize / 2;

        dpr = Math.min(window.devicePixelRatio || 1, 2.5);

        // Display canvas
        displayCanvas.width = Math.round(cssLensSize * dpr);
        displayCanvas.height = Math.round(cssLensSize * dpr);

        // Source canvas: 1.5x lens diameter
        srcW = cssLensSize * 1.5;
        srcH = cssLensSize * 1.5;
        sourceCanvas.width = Math.round(srcW * dpr);
        sourceCanvas.height = Math.round(srcH * dpr);

        // If shapes empty, populate initial set
        if (shapes.length === 0) {
          syncShapeDensity(targetShardCount);
        }
      }

      const ro = new ResizeObserver(() => {
        handleResize();
      });
      ro.observe(lensAssembly);

      // --- Pointer & Touch Interaction ---
      function updatePointerOffset(clientX, clientY) {
        const rect = lensAssembly.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        // Reach span across screen
        const maxSpan = Math.max(window.innerWidth, window.innerHeight) * 0.45;
        const nx = Math.max(-1, Math.min(1, (clientX - centerX) / maxSpan));
        const ny = Math.max(-1, Math.min(1, (clientY - centerY) / maxSpan));

        // Source offset is ±25% of radius on each axis
        targetPointerOx = nx * (drawRadius * 0.25);
        targetPointerOy = ny * (drawRadius * 0.25);
      }

      window.addEventListener('pointermove', (e) => {
        updatePointerOffset(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches && e.touches.length > 0) {
          updatePointerOffset(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      // Lens double-click triggers Shake
      lensAssembly.addEventListener('dblclick', (e) => {
        e.preventDefault();
        performShake();
      });

      // Shake button
      shakeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        performShake();
      });

      // Shard Density Slider
      shardSlider.addEventListener('input', (e) => {
        syncShapeDensity(parseInt(e.target.value, 10));
      });

      // Fold selection buttons
      foldButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          foldButtons.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-checked', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-checked', 'true');

          currentFolds = parseInt(btn.dataset.folds, 10);
          headerFolds.textContent = `${currentFolds}-Fold Symmetry`;
        });
      });

      // Palette selection buttons
      paletteButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          paletteButtons.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-checked', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-checked', 'true');

          currentPaletteName = btn.dataset.palette;
          applyPaletteToExistingShapes();
        });
      });

      // --- Rendering Routine ---
      function renderSource() {
        sourceCtx.save();
        sourceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const pal = PALETTES[currentPaletteName];

        // Background
        sourceCtx.fillStyle = pal.bg;
        sourceCtx.fillRect(0, 0, srcW, srcH);

        // Composite mode
        sourceCtx.globalCompositeOperation = pal.compositeMode;

        // Render shapes
        for (let i = 0; i < shapes.length; i++) {
          const s = shapes[i];
          const breath = 1.0 + 0.08 * Math.sin(totalTime * s.breathSpeed + s.breathPhase);
          const r = s.baseRadius * breath;

          if (s.type === 'blob') {
            // Gradient blob with offset highlight
            const hlX = s.x + s.hlOffsetX * r;
            const hlY = s.y + s.hlOffsetY * r;
            const grad = sourceCtx.createRadialGradient(
              hlX, hlY, r * 0.04,
              s.x, s.y, r
            );
            grad.addColorStop(0, s.colorA);
            grad.addColorStop(0.52, s.colorB);
            grad.addColorStop(1, hexToRgba(s.colorB, 0));

            sourceCtx.fillStyle = grad;
            sourceCtx.beginPath();
            sourceCtx.arc(s.x, s.y, r, 0, Math.PI * 2);
            sourceCtx.fill();
          } else {
            // Polygonal shard with linear gradient and faint white stroke
            sourceCtx.save();
            sourceCtx.translate(s.x, s.y);
            sourceCtx.rotate(s.angle);

            const cosG = Math.cos(s.gradAngle) * r;
            const sinG = Math.sin(s.gradAngle) * r;
            const linGrad = sourceCtx.createLinearGradient(-cosG, -sinG, cosG, sinG);
            linGrad.addColorStop(0, s.colorA);
            linGrad.addColorStop(1, s.colorB);

            sourceCtx.fillStyle = linGrad;
            sourceCtx.strokeStyle = 'rgba(255, 255, 255, 0.42)';
            sourceCtx.lineWidth = 1.1;

            sourceCtx.beginPath();
            const verts = s.vertices;
            for (let v = 0; v < verts.length; v++) {
              const vx = Math.cos(verts[v].angle) * (verts[v].rDist * breath);
              const vy = Math.sin(verts[v].angle) * (verts[v].rDist * breath);
              if (v === 0) sourceCtx.moveTo(vx, vy);
              else sourceCtx.lineTo(vx, vy);
            }
            sourceCtx.closePath();
            sourceCtx.fill();
            sourceCtx.stroke();

            sourceCtx.restore();
          }
        }

        sourceCtx.restore();
      }

      function renderKaleidoscope() {
        displayCtx.save();
        displayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const cx = cssLensSize / 2;
        const cy = cssLensSize / 2;

        displayCtx.translate(cx, cy);
        displayCtx.rotate(globalAngle);

        const a = (Math.PI * 2) / currentFolds;

        // Render N symmetrical wedges
        for (let i = 0; i < currentFolds; i++) {
          displayCtx.save();

          // Clip sector of angle 2π/N (extended by 0.004 rad total: ±0.002 rad to hide seams)
          displayCtx.beginPath();
          displayCtx.moveTo(0, 0);
          displayCtx.arc(0, 0, drawRadius + 5, i * a - 0.002, (i + 1) * a + 0.002);
          displayCtx.closePath();
          displayCtx.clip();

          // Mirroring transform:
          // Even wedges: rotate by i·a
          // Odd wedges: reflect across line at angle (i+1)·a/2 -> rotate(c), scale(1,-1), rotate(-c)
          if (i % 2 === 0) {
            displayCtx.rotate(i * a);
          } else {
            const c = ((i + 1) * a) / 2;
            displayCtx.rotate(c);
            displayCtx.scale(1, -1);
            displayCtx.rotate(-c);
          }

          // Draw source canvas centered with smoothed offset (ox, oy)
          displayCtx.drawImage(
            sourceCanvas,
            -srcW / 2 + currentOx,
            -srcH / 2 + currentOy,
            srcW,
            srcH
          );

          displayCtx.restore();
        }

        // Thin overlay-blended white lines along wedge edges suggesting mirror facets
        displayCtx.save();
        displayCtx.globalCompositeOperation = 'overlay';
        displayCtx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
        displayCtx.lineWidth = 1.0;

        for (let i = 0; i < currentFolds; i++) {
          const edgeAngle = i * a;
          displayCtx.beginPath();
          displayCtx.moveTo(0, 0);
          displayCtx.lineTo(Math.cos(edgeAngle) * drawRadius, Math.sin(edgeAngle) * drawRadius);
          displayCtx.stroke();
        }

        // Faint central convergence point
        displayCtx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        displayCtx.beginPath();
        displayCtx.arc(0, 0, 2, 0, Math.PI * 2);
        displayCtx.fill();

        displayCtx.restore();

        displayCtx.restore();
      }

      // --- Main Animation Loop ---
      function animate(now) {
        requestAnimationFrame(animate);

        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;
        totalTime += dt;

        // Auto rotation: 0.06 rad/s (stopped if reduced motion)
        if (!isReducedMotion) {
          globalAngle += 0.06 * dt;
        }

        // Velocity kick decay from shake
        if (shakeKick > 1.0) {
          shakeKick += (1.0 - shakeKick) * Math.min(1.0, dt * 2.8);
          if (shakeKick < 1.008) shakeKick = 1.0;
        }

        // Shape drift speed: slowed to 30% on reduced motion
        const speedMult = (isReducedMotion ? 0.3 : 1.0) * shakeKick;

        // Update shape physics & wrap at edges
        for (let i = 0; i < shapes.length; i++) {
          const s = shapes[i];
          s.x += s.vx * speedMult * dt;
          s.y += s.vy * speedMult * dt;
          s.angle += s.vRot * speedMult * dt;

          const pad = s.baseRadius * 1.5;
          if (s.x < -pad) s.x += srcW + 2 * pad;
          else if (s.x > srcW + pad) s.x -= srcW + 2 * pad;

          if (s.y < -pad) s.y += srcH + 2 * pad;
          else if (s.y > srcH + pad) s.y -= srcH + 2 * pad;
        }

        // Gentle sine wandering so pattern never freezes
        const wanderAmp = drawRadius * 0.07;
        const wanderX = Math.sin(totalTime * 0.46) * wanderAmp + Math.cos(totalTime * 0.21) * (wanderAmp * 0.4);
        const wanderY = Math.cos(totalTime * 0.39) * wanderAmp + Math.sin(totalTime * 0.25) * (wanderAmp * 0.4);

        const targetX = targetPointerOx + wanderX;
        const targetY = targetPointerOy + wanderY;

        // Exponential smoothing for hand turning
        const ease = 1.0 - Math.exp(-dt * 4.8);
        currentOx += (targetX - currentOx) * ease;
        currentOy += (targetY - currentOy) * ease;

        // Draw frames
        renderSource();
        renderKaleidoscope();
      }

      // Initial size and kick off loop
      handleResize();
      requestAnimationFrame(animate);

    })();
  </script>
</body>
</html>
