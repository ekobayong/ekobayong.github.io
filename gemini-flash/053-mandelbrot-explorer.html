<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandelbrot Explorer — Progressive Fractal Renderer</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  :root {
    --bg: #07080c;
    --panel-bg: rgba(14, 16, 24, 0.78);
    --panel-border: rgba(255, 255, 255, 0.09);
    --amber: #f0b35a;
    --amber-glow: rgba(240, 179, 90, 0.35);
    --text-primary: #f0eee8;
    --text-muted: #8a8d98;
    --spring: cubic-bezier(0.2, 0.9, 0.3, 1.3);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #viewport {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    display: block;
  }
  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber), 0 0 20px var(--amber-glow);
    z-index: 100;
    pointer-events: none;
    transition: width 0.08s linear, opacity 0.3s ease;
    opacity: 0;
  }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 12px;
    position: absolute;
    z-index: 20;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
  }
  #brand-panel {
    top: 20px;
    left: 20px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: auto;
  }
  .cardioid-icon {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: var(--amber);
    stroke-width: 1.8;
    filter: drop-shadow(0 0 6px var(--amber-glow));
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16.5px;
    font-weight: 400;
    letter-spacing: 0.2px;
    color: var(--text-primary);
    line-height: 1.15;
  }
  .brand-text p {
    font-size: 8.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 2px;
  }
  #hud-panel {
    top: 20px;
    right: 20px;
    padding: 12px 16px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    pointer-events: auto;
    min-width: 250px;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .hud-val {
    color: var(--text-primary);
    text-align: right;
  }
  .hud-amber {
    color: var(--amber);
    font-weight: 600;
  }
  #gesture-hint {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    font-size: 10.5px;
    color: rgba(240, 238, 232, 0.55);
    white-space: nowrap;
    transition: opacity 0.8s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #gesture-hint.faded {
    opacity: 0;
  }
  #dock-panel {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: calc(100vw - 40px);
  }
  .bookmarks-container {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .bookmarks-container::-webkit-scrollbar {
    display: none;
  }
  .bookmark-card {
    position: relative;
    width: 112px;
    height: 72px;
    border-radius: 7px;
    overflow: hidden;
    flex-shrink: 0;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #0d0f15;
    transition: transform 0.3s var(--spring), border-color 0.2s ease, box-shadow 0.25s ease;
  }
  .bookmark-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: rgba(240, 179, 90, 0.45);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
  }
  .bookmark-card.active {
    border-color: var(--amber);
    box-shadow: 0 0 12px var(--amber-glow);
  }
  .bookmark-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }
  .bookmark-label {
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    padding: 16px 6px 4px 6px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
    font-size: 10px;
    font-weight: 500;
    color: #f7f6f2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .segmented-control {
    display: inline-flex;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 7px;
    padding: 2.5px;
    gap: 2px;
  }
  .segmented-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .segmented-btn:hover {
    color: var(--text-primary);
  }
  .segmented-btn.active {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .swatch-ultra { background: linear-gradient(135deg, #000764, #206bcb, #edffff, #ffaa00); }
  .swatch-ember { background: linear-gradient(135deg, #5a0c06, #c83c0a, #ffaa28, #fff0c8); }
  .swatch-ice   { background: linear-gradient(135deg, #0a286e, #3c8cdc, #c8f0ff, #ffffff); }
  .swatch-mono  { background: linear-gradient(135deg, #08080a, #88888e, #f0eee8); }

  .actions-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 7px;
    color: var(--text-primary);
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 27px;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .btn:active {
    transform: scale(0.97);
  }
  .stepper-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    min-width: 44px;
    text-align: center;
    color: var(--amber);
  }
  @media (max-width: 760px) {
    #hud-panel {
      position: static;
      border: none;
      background: transparent;
      padding: 0;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      font-size: 10px;
      line-height: 1.4;
      min-width: unset;
      width: 100%;
    }
    #gesture-hint {
      display: none;
    }
    #dock-panel {
      bottom: 12px;
      width: calc(100vw - 24px);
      max-width: unset;
      padding: 10px;
      gap: 8px;
    }
    .bookmark-card {
      width: 92px;
      height: 60px;
    }
    .bookmark-label {
      font-size: 9px;
      padding-top: 10px;
    }
    .controls-row {
      justify-content: center;
    }
    #brand-panel {
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      gap: 10px;
    }
    .brand-text h1 {
      font-size: 14px;
    }
    .brand-text p {
      font-size: 7.5px;
    }
  }
</style>
</head>
<body>

<canvas id="viewport"></canvas>
<div id="progress-bar"></div>

<div class="panel" id="brand-panel">
  <svg class="cardioid-icon" viewBox="0 0 32 32">
    <!-- Smooth stylized cardioid path -->
    <path d="M 22 16 C 22 10.5 17.5 7 12 7 C 6 7 2 11.5 2 16 C 2 20.5 6 25 12 25 C 17.5 25 22 21.5 22 16 Z" opacity="0.2" fill="var(--amber)"/>
    <path d="M 27 16 C 27 9.5 21 4.5 13.5 4.5 C 5 4.5 1 10.5 1 16 C 1 21.5 5 27.5 13.5 27.5 C 21 27.5 27 22.5 27 16 Z M 14 6 C 19 6 23 10.5 23 16 C 23 21.5 19 26 14 26 C 9 26 4.5 21.5 4.5 16 C 4.5 10.5 9 6 14 6 Z"/>
  </svg>
  <div class="brand-text">
    <h1>Mandelbrot Explorer</h1>
    <p>Progressive Fractal Engine</p>
  </div>
</div>

<div class="panel" id="hud-panel">
  <div class="hud-row"><span>Re</span><span class="hud-val" id="hud-re">−0.750000000000</span></div>
  <div class="hud-row"><span>Im</span><span class="hud-val" id="hud-im">+0.000000000000</span></div>
  <div class="hud-row"><span>Zoom</span><span class="hud-val hud-amber" id="hud-zoom">1.00×</span></div>
  <div class="hud-row"><span>Max Iter</span><span class="hud-val" id="hud-iter">120</span></div>
  <div class="hud-row"><span>Frame</span><span class="hud-val" id="hud-time">0 ms</span></div>
  <div class="hud-row"><span>Threads</span><span class="hud-val" id="hud-threads">4</span></div>
  <div id="gesture-hint">Click / Drag to explore · Scroll to zoom</div>
</div>

<div class="panel" id="dock-panel">
  <div class="bookmarks-container" id="bookmarks-bar"></div>
  <div class="controls-row">
    <div class="segmented-control" id="palette-control">
      <button class="segmented-btn active" data-palette="ultra"><span class="swatch swatch-ultra"></span>Ultra</button>
      <button class="segmented-btn" data-palette="ember"><span class="swatch swatch-ember"></span>Ember</button>
      <button class="segmented-btn" data-palette="ice"><span class="swatch swatch-ice"></span>Ice</button>
      <button class="segmented-btn" data-palette="mono"><span class="swatch swatch-mono"></span>Mono</button>
    </div>

    <div class="actions-group">
      <button class="btn" id="iter-dec" title="Decrease iterations (−)">Iter −</button>
      <span class="stepper-val" id="iter-mult-label">×1.0</span>
      <button class="btn" id="iter-inc" title="Increase iterations (+)">Iter +</button>
    </div>

    <div class="actions-group">
      <button class="btn" id="btn-zoom-out" title="Zoom out (Esc)">Zoom Out</button>
      <button class="btn" id="btn-reset" title="Reset view (R)">Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // --- Worker Kernel Code String ---
  const WORKER_KERNEL_SRC = `
    const PALETTE_DEFINITIONS = {
      ultra: [
        { t: 0.0,  c: [0, 7, 100] },
        { t: 0.16, c: [32, 107, 203] },
        { t: 0.42, c: [237, 255, 255] },
        { t: 0.64, c: [255, 170, 0] },
        { t: 0.85, c: [0, 2, 0] },
        { t: 1.0,  c: [0, 7, 100] }
      ],
      ember: [
        { t: 0.0,  c: [10, 4, 2] },
        { t: 0.20, c: [90, 12, 6] },
        { t: 0.40, c: [200, 60, 10] },
        { t: 0.65, c: [255, 170, 40] },
        { t: 0.85, c: [255, 240, 200] },
        { t: 0.95, c: [60, 10, 20] },
        { t: 1.0,  c: [10, 4, 2] }
      ],
      ice: [
        { t: 0.0,  c: [2, 6, 20] },
        { t: 0.22, c: [10, 40, 110] },
        { t: 0.48, c: [60, 140, 220] },
        { t: 0.72, c: [200, 240, 255] },
        { t: 0.88, c: [255, 255, 255] },
        { t: 0.96, c: [30, 20, 70] },
        { t: 1.0,  c: [2, 6, 20] }
      ],
      mono: [
        { t: 0.0,  c: [8, 8, 10] },
        { t: 0.5,  c: [240, 238, 232] },
        { t: 1.0,  c: [8, 8, 10] }
      ]
    };

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    const PALETTE_CACHE = {};
    function getPalette(name) {
      if (PALETTE_CACHE[name]) return PALETTE_CACHE[name];
      const stops = PALETTE_DEFINITIONS[name] || PALETTE_DEFINITIONS.ultra;
      const lut = new Uint32Array(2048);
      for (let i = 0; i < 2048; i++) {
        const u = i / 2048;
        let s = 0;
        while (s < stops.length - 2 && stops[s + 1].t < u) {
          s++;
        }
        const p0 = stops[s];
        const p1 = stops[s + 1];
        const f = smoothstep(p0.t, p1.t, u);
        const r = Math.round(p0.c[0] + (p1.c[0] - p0.c[0]) * f);
        const g = Math.round(p0.c[1] + (p1.c[1] - p0.c[1]) * f);
        const b = Math.round(p0.c[2] + (p1.c[2] - p0.c[2]) * f);
        lut[i] = (255 << 24) | (b << 16) | (g << 8) | r;
      }
      PALETTE_CACHE[name] = lut;
      return lut;
    }

    const LN2 = Math.LN2;
    const LOG2 = Math.log(2);

    function renderBand(params) {
      const {
        cx, cy, span, aspect,
        fullW, fullH,
        step, yStart, yEnd,
        maxIter, paletteName
      } = params;

      const bandW = Math.ceil(fullW / step);
      const bandH = yEnd - yStart;
      const buf = new ArrayBuffer(bandW * bandH * 4);
      const pixels = new Uint32Array(buf);
      const palette = getPalette(paletteName);

      const dx = span / fullW;
      const x0 = cx - (span * 0.5);
      const y0 = cy - (span * aspect * 0.5);

      let idx = 0;
      for (let by = yStart; by < yEnd; by++) {
        const py = by * step;
        const ci = y0 + py * dx;
        const ci2 = ci * ci;

        for (let bx = 0; bx < bandW; bx++) {
          const px = bx * step;
          const cr = x0 + px * dx;

          // Cardioid test
          const q = (cr - 0.25) * (cr - 0.25) + ci2;
          if (q * (q + (cr - 0.25)) <= 0.25 * ci2) {
            pixels[idx++] = 0xFF000000;
            continue;
          }
          // Period-2 bulb test
          const cr1 = cr + 1.0;
          if (cr1 * cr1 + ci2 <= 0.0625) {
            pixels[idx++] = 0xFF000000;
            continue;
          }

          // Escape-time iteration
          let zr = 0.0;
          let zi = 0.0;
          let zr2 = 0.0;
          let zi2 = 0.0;
          let n = 0;

          // Bailout radius 256 -> radius squared = 65536
          while (zr2 + zi2 <= 65536.0 && n < maxIter) {
            zi = 2.0 * zr * zi + ci;
            zr = zr2 - zi2 + cr;
            zr2 = zr * zr;
            zi2 = zi * zi;
            n++;
          }

          if (n >= maxIter) {
            pixels[idx++] = 0xFF000000;
          } else {
            const mod2 = zr2 + zi2;
            const log_zn = Math.log(mod2) * 0.5;
            const nu = n + 1.0 - (Math.log(log_zn / LOG2) / LOG2);
            const colorIdx = (Math.floor(Math.sqrt(Math.max(0, nu)) * 96.0 + 240.0) % 2048 + 2048) % 2048;
            pixels[idx++] = palette[colorIdx];
          }
        }
      }

      return { buf, bandW, bandH };
    }

    if (typeof self !== 'undefined' && typeof self.postMessage === 'function') {
      self.onmessage = function(e) {
        const data = e.data;
        const res = renderBand(data);
        self.postMessage({
          renderId: data.renderId,
          step: data.step,
          yStart: data.yStart,
          bandH: res.bandH,
          bandW: res.bandW,
          buf: res.buf
        }, [res.buf]);
      };
    }
  `;

  // --- Bookmarks Configuration ---
  const BOOKMARKS = [
    { id: 'overview',  name: 'Overview',        cx: -0.75,       cy: 0.0,         span: 3.4 },
    { id: 'seahorse',  name: 'Seahorse Valley', cx: -0.7435669,  cy: 0.1314023,   span: 0.0022 },
    { id: 'elephant',  name: 'Elephant Valley', cx: 0.2749,      cy: 0.00655,     span: 0.012 },
    { id: 'triple',    name: 'Triple Spiral',   cx: -0.088,      cy: 0.654,       span: 0.012 },
    { id: 'spiral',    name: 'Spiral',          cx: -0.16070135, cy: 1.0375665,   span: 0.0012 },
    { id: 'minibrot',  name: 'Mini-brot',       cx: -1.7548776,  cy: 0.0,         span: 0.028 }
  ];

  const ITER_FACTORS = [0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0];

  // --- State ---
  const state = {
    cx: -0.75,
    cy: 0.0,
    span: 3.4,
    palette: 'ultra',
    iterFactorIdx: 2, // 1.0
    renderId: 0,
    activeBookmark: 'overview',
    hintShown: true
  };

  // --- DOM Elements ---
  const canvas = document.getElementById('viewport');
  const ctx = canvas.getContext('2d', { alpha: false });
  const progressBar = document.getElementById('progress-bar');
  const hudRe = document.getElementById('hud-re');
  const hudIm = document.getElementById('hud-im');
  const hudZoom = document.getElementById('hud-zoom');
  const hudIter = document.getElementById('hud-iter');
  const hudTime = document.getElementById('hud-time');
  const hudThreads = document.getElementById('hud-threads');
  const gestureHint = document.getElementById('gesture-hint');
  const bookmarksBar = document.getElementById('bookmarks-bar');
  const paletteBtns = document.querySelectorAll('.segmented-btn');
  const iterMultLabel = document.getElementById('iter-mult-label');
  const iterDecBtn = document.getElementById('iter-dec');
  const iterIncBtn = document.getElementById('iter-inc');
  const btnZoomOut = document.getElementById('btn-zoom-out');
  const btnReset = document.getElementById('btn-reset');

  // Offscreen canvas for fast band stamping
  const bandCanvas = document.createElement('canvas');
  const bandCtx = bandCanvas.getContext('2d', { willReadFrequently: false });

  // Worker Thread Pool setup
  const numWorkers = Math.max(2, Math.min(8, navigator.hardwareConcurrency || 4));
  hudThreads.textContent = String(numWorkers);

  let workers = [];
  let workerBlobUrl = null;
  let fallbackRenderer = null;

  try {
    const blob = new Blob([WORKER_KERNEL_SRC], { type: 'application/javascript' });
    workerBlobUrl = URL.createObjectURL(blob);
    for (let i = 0; i < numWorkers; i++) {
      const w = new Worker(workerBlobUrl);
      w.onmessage = onWorkerMessage;
      workers.push(w);
    }
  } catch (err) {
    console.warn('Worker initialization failed, using main-thread fallback', err);
    workers = [];
    fallbackRenderer = new Function(`${WORKER_KERNEL_SRC}; return renderBand;`)();
  }

  // --- Task Queue Management ---
  const PASS_STEPS = [8, 4, 2, 1];
  let queue = [];
  let totalBandsInRender = 0;
  let completedBandsInRender = 0;
  let renderStartTime = 0;
  let workerBusy = new Array(numWorkers).fill(false);

  function getDepth(span) {
    return Math.max(0, Math.log2(3.4 / span));
  }

  function calculateMaxIter(span) {
    const depth = getDepth(span);
    const base = 120 + 90 * Math.pow(depth, 1.15);
    const factor = ITER_FACTORS[state.iterFactorIdx];
    return Math.min(12000, Math.round(base * factor));
  }

  function updateHUD() {
    hudRe.textContent = (state.cx >= 0 ? '+' : '') + state.cx.toFixed(12);
    hudIm.textContent = (state.cy >= 0 ? '+' : '') + state.cy.toFixed(12);
    const zoomVal = 3.4 / state.span;
    if (zoomVal >= 1000) {
      hudZoom.textContent = zoomVal.toExponential(2) + '×';
    } else {
      hudZoom.textContent = zoomVal.toFixed(2) + '×';
    }
    hudIter.textContent = String(calculateMaxIter(state.span));
    iterMultLabel.textContent = `×${ITER_FACTORS[state.iterFactorIdx].toFixed(1)}`;
  }

  function markInteraction() {
    if (state.hintShown) {
      state.hintShown = false;
      gestureHint.classList.add('faded');
    }
  }

  // Dispatch work to queue or fallback
  function startRender(preservePixels = true) {
    state.renderId++;
    const curId = state.renderId;
    queue = [];
    workerBusy.fill(false);

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fullW = canvas.width;
    const fullH = canvas.height;
    const aspect = fullH / fullW;
    const maxIter = calculateMaxIter(state.span);

    // Build queued passes
    PASS_STEPS.forEach(step => {
      const stepH = Math.ceil(fullH / step);
      // Coarse: 1 band per worker; Final (step=1): 4 bands per worker
      const numBands = (step === 1) ? (numWorkers * 4) : numWorkers;
      const rowsPerBand = Math.ceil(stepH / numBands);

      for (let b = 0; b < numBands; b++) {
        const yStart = b * rowsPerBand;
        if (yStart >= stepH) break;
        const yEnd = Math.min(stepH, (b + 1) * rowsPerBand);

        queue.push({
          renderId: curId,
          cx: state.cx,
          cy: state.cy,
          span: state.span,
          aspect,
          fullW,
          fullH,
          step,
          yStart,
          yEnd,
          maxIter,
          paletteName: state.palette
        });
      }
    });

    totalBandsInRender = queue.length;
    completedBandsInRender = 0;
    renderStartTime = performance.now();

    progressBar.style.opacity = '1';
    progressBar.style.width = '0%';

    updateHUD();

    if (workers.length > 0) {
      // Pump initial tasks to workers
      for (let i = 0; i < workers.length; i++) {
        pumpWorker(i);
      }
    } else {
      runFallbackBatch();
    }
  }

  function pumpWorker(workerIdx) {
    if (workerBusy[workerIdx]) return;
    if (queue.length === 0) return;
    const task = queue.shift();
    workerBusy[workerIdx] = true;
    workers[workerIdx].postMessage(task);
  }

  function drawBandToCanvas(bandData) {
    const { step, yStart, bandW, bandH, buf } = bandData;
    if (bandCanvas.width !== bandW || bandCanvas.height !== bandH) {
      bandCanvas.width = bandW;
      bandCanvas.height = bandH;
    }
    const imgData = new ImageData(new Uint8ClampedArray(buf), bandW, bandH);
    bandCtx.putImageData(imgData, 0, 0);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      bandCanvas,
      0, 0, bandW, bandH,
      0, yStart * step, bandW * step, bandH * step
    );
  }

  function onWorkerMessage(e) {
    const data = e.data;
    const workerIdx = workers.indexOf(this);
    if (workerIdx !== -1) {
      workerBusy[workerIdx] = false;
    }

    if (data.renderId !== state.renderId) {
      return; // Stale packet
    }

    drawBandToCanvas(data);

    completedBandsInRender++;
    const progress = (completedBandsInRender / totalBandsInRender) * 100;
    progressBar.style.width = `${progress}%`;

    if (completedBandsInRender >= totalBandsInRender) {
      const elapsed = Math.round(performance.now() - renderStartTime);
      hudTime.textContent = `${elapsed} ms`;
      progressBar.style.opacity = '0';
    } else {
      if (workerIdx !== -1) {
        pumpWorker(workerIdx);
      }
    }
  }

  function runFallbackBatch() {
    const batchStart = performance.now();
    while (queue.length > 0 && performance.now() - batchStart < 16) {
      const task = queue.shift();
      if (task.renderId !== state.renderId) return;
      const res = fallbackRenderer(task);
      drawBandToCanvas({
        step: task.step,
        yStart: task.yStart,
        bandW: res.bandW,
        bandH: res.bandH,
        buf: res.buf
      });
      completedBandsInRender++;
    }

    const progress = (completedBandsInRender / totalBandsInRender) * 100;
    progressBar.style.width = `${progress}%`;

    if (queue.length > 0) {
      requestAnimationFrame(runFallbackBatch);
    } else {
      const elapsed = Math.round(performance.now() - renderStartTime);
      hudTime.textContent = `${elapsed} ms`;
      progressBar.style.opacity = '0';
    }
  }

  // --- Resize Canvas to Viewport ---
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const newW = Math.round(window.innerWidth * dpr);
    const newH = Math.round(window.innerHeight * dpr);

    if (canvas.width !== newW || canvas.height !== newH) {
      // Retain previous image visually during resize if possible
      const temp = document.createElement('canvas');
      temp.width = canvas.width;
      temp.height = canvas.height;
      temp.getContext('2d').drawImage(canvas, 0, 0);

      canvas.width = newW;
      canvas.height = newH;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;

      ctx.imageSmoothingEnabled = false;
      if (temp.width > 0 && temp.height > 0) {
        ctx.drawImage(temp, 0, 0, newW, newH);
      }
      startRender();
    }
  }

  // --- Navigation & Live Bitmap Transforms ---
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let snapshotCanvas = null;

  function takeSnapshot() {
    if (!snapshotCanvas) {
      snapshotCanvas = document.createElement('canvas');
    }
    snapshotCanvas.width = canvas.width;
    snapshotCanvas.height = canvas.height;
    snapshotCanvas.getContext('2d').drawImage(canvas, 0, 0);
  }

  function screenToComplex(px, py) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fullW = canvas.width;
    const fullH = canvas.height;
    const aspect = fullH / fullW;
    const dx = state.span / fullW;
    const x0 = state.cx - (state.span * 0.5);
    const y0 = state.cy - (state.span * aspect * 0.5);
    return {
      r: x0 + (px * dpr) * dx,
      i: y0 + (py * dpr) * dx
    };
  }

  function zoomAtScreenPoint(clientX, clientY, factor, animate = false) {
    markInteraction();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mx = clientX * dpr;
    const my = clientY * dpr;
    const fullW = canvas.width;
    const fullH = canvas.height;
    const aspect = fullH / fullW;

    const oldSpan = state.span;
    const newSpan = state.span * factor;

    // Keep point invariant: P_new = P_old
    const x0 = state.cx - (oldSpan * 0.5);
    const y0 = state.cy - (oldSpan * aspect * 0.5);
    const pointR = x0 + (mx / fullW) * oldSpan;
    const pointI = y0 + (my / fullH) * (oldSpan * aspect);

    const targetCx = pointR - (mx / fullW - 0.5) * newSpan;
    const targetCy = pointI - (my / fullH - 0.5) * (newSpan * aspect);

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (animate && !prefersReducedMotion) {
      takeSnapshot();
      const startTime = performance.now();
      const duration = 300;
      const initialScale = 1.0;
      const targetScale = 1.0 / factor;

      function animStep(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);
        // Ease out cubic
        const ease = 1 - Math.pow(1 - progress, 3);
        const curScale = initialScale + (targetScale - initialScale) * ease;

        ctx.save();
        ctx.fillStyle = '#07080c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.translate(mx, my);
        ctx.scale(curScale, curScale);
        ctx.translate(-mx, -my);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(snapshotCanvas, 0, 0);
        ctx.restore();

        if (progress < 1) {
          requestAnimationFrame(animStep);
        } else {
          state.cx = targetCx;
          state.cy = targetCy;
          state.span = newSpan;
          startRender();
        }
      }
      requestAnimationFrame(animStep);
    } else {
      // Instant transform scale to avoid flicker
      takeSnapshot();
      const scale = 1.0 / factor;
      ctx.save();
      ctx.fillStyle = '#07080c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.translate(mx, my);
      ctx.scale(scale, scale);
      ctx.translate(-mx, -my);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(snapshotCanvas, 0, 0);
      ctx.restore();

      state.cx = targetCx;
      state.cy = targetCy;
      state.span = newSpan;
      startRender();
    }
  }

  // Pointer & Drag Handlers
  let pointerDownPos = { x: 0, y: 0 };
  let hasDragged = false;

  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0 || e.button === 2) {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      isDragging = false;
      hasDragged = false;
    }
  });

  window.addEventListener('mousemove', (e) => {
    const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
    if (!isDragging && dist > 5 && (e.buttons === 1 || e.buttons === 2)) {
      isDragging = true;
      hasDragged = true;
      markInteraction();
      takeSnapshot();
      canvas.style.cursor = 'grabbing';
    }

    if (isDragging) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const dx = (e.clientX - dragStartX) * dpr;
      const dy = (e.clientY - dragStartY) * dpr;

      ctx.fillStyle = '#07080c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(snapshotCanvas, dx, dy);
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (isDragging) {
      isDragging = false;
      canvas.style.cursor = 'crosshair';
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const totalDx = (e.clientX - dragStartX) * dpr;
      const totalDy = (e.clientY - dragStartY) * dpr;
      const aspect = canvas.height / canvas.width;
      const factorX = state.span / canvas.width;

      state.cx -= totalDx * factorX;
      state.cy -= totalDy * factorX;
      startRender();
      return;
    }

    // Click navigation
    if (!hasDragged && (e.target === canvas)) {
      if (e.button === 0) {
        if (e.shiftKey) {
          zoomAtScreenPoint(e.clientX, e.clientY, 2.5, true);
        } else {
          zoomAtScreenPoint(e.clientX, e.clientY, 1 / 2.5, true);
        }
      } else if (e.button === 2) {
        zoomAtScreenPoint(e.clientX, e.clientY, 2.5, true);
      }
    }
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Wheel Zoom with Debounced Scale
  let wheelTimeout = null;
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    markInteraction();
    const factor = Math.exp(e.deltaY * 0.0018);

    takeSnapshot();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mx = e.clientX * dpr;
    const my = e.clientY * dpr;
    const fullW = canvas.width;
    const fullH = canvas.height;
    const aspect = fullH / fullW;

    const oldSpan = state.span;
    const newSpan = state.span * factor;

    const x0 = state.cx - (oldSpan * 0.5);
    const y0 = state.cy - (oldSpan * aspect * 0.5);
    const pointR = x0 + (mx / fullW) * oldSpan;
    const pointI = y0 + (my / fullH) * (oldSpan * aspect);

    state.cx = pointR - (mx / fullW - 0.5) * newSpan;
    state.cy = pointI - (my / fullH - 0.5) * (newSpan * aspect);
    state.span = newSpan;

    // Blit transformed snapshot
    const scale = 1.0 / factor;
    ctx.save();
    ctx.fillStyle = '#07080c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.translate(mx, my);
    ctx.scale(scale, scale);
    ctx.translate(-mx, -my);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(snapshotCanvas, 0, 0);
    ctx.restore();

    clearTimeout(wheelTimeout);
    wheelTimeout = setTimeout(() => {
      startRender();
    }, 16);
  }, { passive: false });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') {
      if (e.key !== 'Escape') return;
    }
    markInteraction();
    switch (e.key) {
      case 'r':
      case 'R':
        resetToDefault();
        break;
      case '=':
      case '+':
        incIterations();
        break;
      case '-':
      case '_':
        decIterations();
        break;
      case '1':
        setPalette('ultra');
        break;
      case '2':
        setPalette('ember');
        break;
      case '3':
        setPalette('ice');
        break;
      case '4':
        setPalette('mono');
        break;
      case 'Escape':
        zoomAtScreenPoint(window.innerWidth / 2, window.innerHeight / 2, 2.5, true);
        break;
    }
  });

  // --- UI Controls ---
  function setPalette(name) {
    if (state.palette === name) return;
    state.palette = name;
    paletteBtns.forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-palette') === name);
    });
    startRender();
  }

  paletteBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setPalette(btn.getAttribute('data-palette'));
    });
  });

  function incIterations() {
    if (state.iterFactorIdx < ITER_FACTORS.length - 1) {
      state.iterFactorIdx++;
      updateHUD();
      startRender();
    }
  }

  function decIterations() {
    if (state.iterFactorIdx > 0) {
      state.iterFactorIdx--;
      updateHUD();
      startRender();
    }
  }

  iterIncBtn.addEventListener('click', incIterations);
  iterDecBtn.addEventListener('click', decIterations);

  btnZoomOut.addEventListener('click', () => {
    zoomAtScreenPoint(window.innerWidth / 2, window.innerHeight / 2, 2.5, true);
  });

  function resetToDefault() {
    const b = BOOKMARKS[0];
    state.cx = b.cx;
    state.cy = b.cy;
    state.span = b.span;
    state.iterFactorIdx = 2;
    setActiveBookmarkCard(b.id);
    startRender();
  }

  btnReset.addEventListener('click', resetToDefault);

  // --- Bookmark Management & Thumbnail Generation ---
  function setActiveBookmarkCard(id) {
    state.activeBookmark = id;
    document.querySelectorAll('.bookmark-card').forEach(card => {
      card.classList.toggle('active', card.dataset.id === id);
    });
  }

  function createThumbWorker() {
    try {
      return new Worker(workerBlobUrl);
    } catch {
      return null;
    }
  }

  function generateThumbnail(b, imgElement) {
    const thumbW = 224;
    const thumbH = 144;
    const task = {
      renderId: 9999,
      cx: b.cx,
      cy: b.cy,
      span: b.span,
      aspect: thumbH / thumbW,
      fullW: thumbW,
      fullH: thumbH,
      step: 1,
      yStart: 0,
      yEnd: thumbH,
      maxIter: Math.min(320, calculateMaxIter(b.span)),
      paletteName: 'ultra'
    };

    const tWorker = createThumbWorker();
    if (tWorker) {
      tWorker.onmessage = (e) => {
        const { buf, bandW, bandH } = e.data;
        const off = document.createElement('canvas');
        off.width = bandW;
        off.height = bandH;
        off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf), bandW, bandH), 0, 0);
        imgElement.src = off.toDataURL();
        tWorker.terminate();
      };
      tWorker.postMessage(task);
    } else if (fallbackRenderer) {
      const res = fallbackRenderer(task);
      const off = document.createElement('canvas');
      off.width = res.bandW;
      off.height = res.bandH;
      off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(res.buf), res.bandW, res.bandH), 0, 0);
      imgElement.src = off.toDataURL();
    }
  }

  function initBookmarks() {
    bookmarksBar.innerHTML = '';
    BOOKMARKS.forEach(b => {
      const card = document.createElement('div');
      card.className = 'bookmark-card' + (b.id === state.activeBookmark ? ' active' : '');
      card.dataset.id = b.id;

      const img = document.createElement('img');
      img.className = 'bookmark-thumb';
      img.alt = b.name;

      const label = document.createElement('div');
      label.className = 'bookmark-label';
      label.textContent = b.name;

      card.appendChild(img);
      card.appendChild(label);
      bookmarksBar.appendChild(card);

      card.addEventListener('click', () => {
        markInteraction();
        state.cx = b.cx;
        state.cy = b.cy;
        state.span = b.span;
        setActiveBookmarkCard(b.id);
        startRender();
      });

      // Lazy render thumbnail
      setTimeout(() => generateThumbnail(b, img), 50);
    });
  }

  // --- Window Resize & Initialization ---
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 60);
  });

  initBookmarks();
  resizeCanvas();
})();
</script>
</body>
</html>
