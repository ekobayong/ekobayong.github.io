<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mandelbrot Explorer</title>
  <style>
    /* Reset & Base Setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(14, 16, 24, 0.78);
      --panel-border: rgba(255, 255, 255, 0.09);
      --amber: #f0b35a;
      --amber-glow: rgba(240, 179, 90, 0.45);
      --text-main: #f3f4f6;
      --text-muted: rgba(255, 255, 255, 0.52);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      touch-action: none;
    }

    /* Main Render Canvas */
    #fractal-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
      z-index: 1;
    }

    /* Top Glowing Progress Bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber), 0 0 4px var(--amber);
      z-index: 9999;
      pointer-events: none;
      transition: width 0.08s ease-out, opacity 0.3s ease;
      opacity: 0;
    }
    #progress-bar.active {
      opacity: 1;
    }

    /* Common Frosted Glass Panel */
    .glass-panel {
      position: fixed;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 10;
      pointer-events: auto;
    }

    /* Brand Panel (Top-Left) */
    #brand-panel {
      top: 18px;
      left: 18px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px var(--amber-glow));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.015em;
      color: #ffffff;
      line-height: 1.15;
    }

    .brand-subtitle {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.2;
    }

    /* HUD Panel (Top-Right) */
    #hud-panel {
      top: 18px;
      right: 18px;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: auto auto;
      gap: 3px 12px;
      align-items: baseline;
    }

    .hud-label {
      color: var(--text-muted);
      font-size: 11px;
      text-align: left;
    }

    .hud-val {
      color: #ffffff;
      font-weight: 500;
    }

    .hud-val.amber {
      color: var(--amber);
      font-weight: 600;
      text-shadow: 0 0 8px rgba(240, 179, 90, 0.4);
    }

    /* Gesture Hint Line */
    .gesture-hint {
      margin-top: 8px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.02em;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 6px;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      pointer-events: none;
    }

    .gesture-hint.faded {
      opacity: 0;
    }

    /* Bottom Dock Panel */
    #dock-panel {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      max-width: calc(100vw - 36px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dock-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Horizontally Scrolling Bookmarks Row */
    .bookmarks-row {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }

    .bookmarks-row::-webkit-scrollbar {
      height: 4px;
    }
    .bookmarks-row::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }

    .bookmark-btn {
      position: relative;
      width: 112px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0d0f17;
      cursor: pointer;
      outline: none;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.3), border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .bookmark-btn:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(240, 179, 90, 0.6);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), 0 0 10px rgba(240, 179, 90, 0.25);
    }

    .bookmark-btn.active {
      border: 1.5px solid var(--amber);
      box-shadow: 0 0 14px rgba(240, 179, 90, 0.45);
    }

    .bookmark-canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .bookmark-label-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 6px 4px;
      background: linear-gradient(to top, rgba(8, 10, 16, 0.92) 0%, rgba(8, 10, 16, 0.4) 65%, transparent 100%);
      font-size: 10px;
      font-weight: 500;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Controls Divider */
    .dock-divider {
      width: 1px;
      height: 48px;
      background: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    /* Dock Controls Toolbar */
    .dock-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Segmented Palette Control */
    .segmented-control {
      display: flex;
      background: rgba(8, 10, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .segmented-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 9px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      outline: none;
    }

    .segmented-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .segmented-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(240, 179, 90, 0.5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .palette-swatch {
      width: 13px;
      height: 8px;
      border-radius: 2px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .swatch-ultra {
      background: linear-gradient(to right, #000764, #206bcb, #edffff, #ffaa00, #000200);
    }
    .swatch-ember {
      background: linear-gradient(to right, #0a0402, #5a0c06, #c83c0a, #ffaa28, #fff0c8, #3c0a14);
    }
    .swatch-ice {
      background: linear-gradient(to right, #020614, #0a286e, #3c8cdc, #c8f0ff, #ffffff, #1e1446);
    }
    .swatch-mono {
      background: linear-gradient(to right, #08080a, #f0eee8, #08080a);
    }

    /* Stepper & Action Buttons */
    .ctrl-group {
      display: flex;
      align-items: center;
      background: rgba(8, 10, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 2px 4px;
      gap: 2px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #ffffff;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.18s ease;
      outline: none;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(240, 179, 90, 0.4);
      box-shadow: 0 0 8px rgba(240, 179, 90, 0.2);
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 14px;
      font-weight: bold;
      line-height: 1;
    }

    .iter-display {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 0 8px;
      color: var(--amber);
      font-weight: 600;
      min-width: 44px;
      text-align: center;
    }

    /* Responsive Styles (< 760px) */
    @media (max-width: 760px) {
      #brand-panel {
        top: 12px;
        left: 12px;
        padding: 8px 12px;
      }
      .brand-title {
        font-size: 15px;
      }
      .brand-subtitle {
        font-size: 7.5px;
      }

      #hud-panel {
        top: auto;
        right: 12px;
        left: 12px;
        bottom: calc(180px);
        align-items: center;
        text-align: center;
        padding: 8px 12px;
      }
      .hud-grid {
        grid-template-columns: repeat(3, auto);
        gap: 2px 10px;
        font-size: 10px;
      }
      .gesture-hint {
        display: none;
      }

      #dock-panel {
        bottom: 10px;
        width: calc(100vw - 20px);
        max-width: 100vw;
        padding: 8px;
        gap: 8px;
      }
      .dock-container {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .dock-divider {
        display: none;
      }
      .bookmark-btn {
        width: 92px;
        height: 60px;
      }
      .dock-tools {
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Progress Bar -->
  <div id="progress-bar"></div>

  <!-- Fullscreen Fractal Canvas -->
  <canvas id="fractal-canvas"></canvas>

  <!-- Top-Left Brand Panel -->
  <div id="brand-panel" class="glass-panel">
    <!-- Amber Cardioid SVG Mark -->
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none">
      <path d="M 18.5 12 C 18.5 6.5 13.5 3.5 8 5.8 C 3.5 7.8 3 16.2 8 18.2 C 13.5 20.5 18.5 17.5 18.5 12 Z" stroke="#f0b35a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="5" cy="12" r="2.2" fill="rgba(240, 179, 90, 0.25)" stroke="#f0b35a" stroke-width="1.2" />
    </svg>
    <div class="brand-text">
      <div class="brand-title">Mandelbrot Explorer</div>
      <div class="brand-subtitle">Interactive Multi-Threaded Kernel</div>
    </div>
  </div>

  <!-- Top-Right HUD Panel -->
  <div id="hud-panel" class="glass-panel">
    <div class="hud-grid">
      <span class="hud-label">Re</span>
      <span id="hud-re" class="hud-val">-0.750000000000</span>
      <span class="hud-label">Im</span>
      <span id="hud-im" class="hud-val">+0.000000000000</span>
      <span class="hud-label">Zoom</span>
      <span id="hud-zoom" class="hud-val amber">1.00×</span>
      <span class="hud-label">Iter</span>
      <span id="hud-iter" class="hud-val">120 (×1.0)</span>
      <span class="hud-label">Render</span>
      <span id="hud-render" class="hud-val">0 ms</span>
      <span class="hud-label">Engine</span>
      <span id="hud-workers" class="hud-val">4 Workers</span>
    </div>
    <div id="gesture-hint" class="gesture-hint">
      Left-click zoom in · Shift/Right-click zoom out · Drag pan · Wheel zoom · R reset · 1-4 palettes
    </div>
  </div>

  <!-- Bottom Dock Panel -->
  <div id="dock-panel" class="glass-panel">
    <div class="dock-container">
      <!-- Six Bookmarks Carousel -->
      <div class="bookmarks-row" id="bookmarks-row">
        <!-- Bookmark buttons generated dynamically -->
      </div>

      <div class="dock-divider"></div>

      <!-- Controls Toolbar -->
      <div class="dock-tools">
        <!-- Palette Segmented Control -->
        <div class="segmented-control" id="palette-control">
          <button class="segmented-btn active" data-palette="0" title="Ultra Fractal Ramp (Key: 1)">
            <span class="palette-swatch swatch-ultra"></span>Ultra
          </button>
          <button class="segmented-btn" data-palette="1" title="Ember Warm Ramp (Key: 2)">
            <span class="palette-swatch swatch-ember"></span>Ember
          </button>
          <button class="segmented-btn" data-palette="2" title="Ice Cool Ramp (Key: 3)">
            <span class="palette-swatch swatch-ice"></span>Ice
          </button>
          <button class="segmented-btn" data-palette="3" title="Mono Architectural (Key: 4)">
            <span class="palette-swatch swatch-mono"></span>Mono
          </button>
        </div>

        <!-- Iteration Stepper -->
        <div class="ctrl-group">
          <button id="btn-iter-dec" class="ctrl-btn icon-btn" title="Decrease Iterations (− key)">−</button>
          <span id="iter-mult-label" class="iter-display">×1.0</span>
          <button id="btn-iter-inc" class="ctrl-btn icon-btn" title="Increase Iterations (+ key)">+</button>
        </div>

        <!-- Zoom Out & Reset Buttons -->
        <button id="btn-zoom-out" class="ctrl-btn" title="Zoom Out ×2.5 (Esc or Shift-Click)">Zoom −</button>
        <button id="btn-reset" class="ctrl-btn" title="Reset to Overview (R key)">↺ Reset</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      /* --- Bookmarks Configuration --- */
      const BOOKMARKS = [
        { name: 'Overview', cx: -0.75, cy: 0.0, span: 3.4 },
        { name: 'Seahorse Valley', cx: -0.7435669, cy: 0.1314023, span: 0.0022 },
        { name: 'Elephant Valley', cx: 0.2749, cy: 0.00655, span: 0.012 },
        { name: 'Triple Spiral', cx: -0.088, cy: 0.654, span: 0.012 },
        { name: 'Spiral', cx: -0.16070135, cy: 1.0375665, span: 0.0012 },
        { name: 'Mini-brot', cx: -1.7548776, cy: 0.0, span: 0.028 }
      ];

      /* --- Iteration Multipliers --- */
      const MULTIPLIERS = [0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0];
      let multiplierIndex = 2; // Default 1.0

      /* --- Explorer State --- */
      let currentCenterX = BOOKMARKS[0].cx;
      let currentCenterY = BOOKMARKS[0].cy;
      let currentSpan = BOOKMARKS[0].span;
      let currentPaletteId = 0;
      let currentRenderId = 0;
      let renderStartTime = 0;
      let totalBands = 0;
      let completedBands = 0;
      let activeJobsQueue = [];
      let isFirstGesture = true;
      let isZoomAnimating = false;

      /* --- DOM Elements --- */
      const canvas = document.getElementById('fractal-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const progressBar = document.getElementById('progress-bar');
      const hudRe = document.getElementById('hud-re');
      const hudIm = document.getElementById('hud-im');
      const hudZoom = document.getElementById('hud-zoom');
      const hudIter = document.getElementById('hud-iter');
      const hudRender = document.getElementById('hud-render');
      const hudWorkers = document.getElementById('hud-workers');
      const gestureHint = document.getElementById('gesture-hint');
      const bookmarksRow = document.getElementById('bookmarks-row');
      const paletteButtons = document.querySelectorAll('#palette-control .segmented-btn');
      const iterMultLabel = document.getElementById('iter-mult-label');
      const btnIterDec = document.getElementById('btn-iter-dec');
      const btnIterInc = document.getElementById('btn-iter-inc');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnReset = document.getElementById('btn-reset');

      /* Offscreen buffer for blitting bands and gesture snapshots */
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d', { alpha: false });
      const snapshotCanvas = document.createElement('canvas');
      const snapshotCtx = snapshotCanvas.getContext('2d', { alpha: false });

      /* --- Worker Kernel Source Code --- */
      const KERNEL_STRING = `
        function buildPalette(stops) {
          const table = new Uint32Array(2048);
          for (let i = 0; i < 2048; i++) {
            const u = i / 2048;
            let j = 0;
            while (j < stops.length - 2 && stops[j + 1].pos <= u) {
              j++;
            }
            const s0 = stops[j];
            const s1 = stops[j + 1];
            const range = s1.pos - s0.pos;
            const t = range > 0 ? (u - s0.pos) / range : 0;
            const smoothT = t * t * (3.0 - 2.0 * t);
            const r = Math.round(s0.r + (s1.r - s0.r) * smoothT);
            const g = Math.round(s0.g + (s1.g - s0.g) * smoothT);
            const b = Math.round(s0.b + (s1.b - s0.b) * smoothT);
            table[i] = (255 << 24) | (b << 16) | (g << 8) | r;
          }
          return table;
        }

        const PALETTE_DEFINITIONS = [
          // Ultra (#000764 -> #206bcb -> #edffff -> #ffaa00 -> #000200)
          [
            { pos: 0.000, r: 0, g: 7, b: 100 },
            { pos: 0.160, r: 32, g: 107, b: 203 },
            { pos: 0.420, r: 237, g: 255, b: 255 },
            { pos: 0.642, r: 255, g: 170, b: 0 },
            { pos: 0.857, r: 0, g: 2, b: 0 },
            { pos: 1.000, r: 0, g: 7, b: 100 }
          ],
          // Ember (#0a0402 -> #5a0c06 -> #c83c0a -> #ffaa28 -> #fff0c8 -> #3c0a14)
          [
            { pos: 0.000, r: 10, g: 4, b: 2 },
            { pos: 0.200, r: 90, g: 12, b: 6 },
            { pos: 0.400, r: 200, g: 60, b: 10 },
            { pos: 0.650, r: 255, g: 170, b: 40 },
            { pos: 0.850, r: 255, g: 240, b: 200 },
            { pos: 0.950, r: 60, g: 10, b: 20 },
            { pos: 1.000, r: 10, g: 4, b: 2 }
          ],
          // Ice (#020614 -> #0a286e -> #3c8cdc -> #c8f0ff -> #ffffff -> #1e1446)
          [
            { pos: 0.000, r: 2, g: 6, b: 20 },
            { pos: 0.200, r: 10, g: 40, b: 110 },
            { pos: 0.420, r: 60, g: 140, b: 220 },
            { pos: 0.650, r: 200, g: 240, b: 255 },
            { pos: 0.850, r: 255, g: 255, b: 255 },
            { pos: 0.950, r: 30, g: 20, b: 70 },
            { pos: 1.000, r: 2, g: 6, b: 20 }
          ],
          // Mono (#08080a -> #f0eee8 -> #08080a)
          [
            { pos: 0.000, r: 8, g: 8, b: 10 },
            { pos: 0.500, r: 240, g: 238, b: 232 },
            { pos: 1.000, r: 8, g: 8, b: 10 }
          ]
        ];

        const ALL_PALETTES = PALETTE_DEFINITIONS.map(buildPalette);

        function computeMandelbrotBand(params) {
          const { startY, endY, w, h, fullW, fullH, centerX, centerY, span, ySpan, maxIter, paletteId, passStep } = params;
          const bandH = endY - startY;
          const buffer = new ArrayBuffer(w * bandH * 4);
          const buf32 = new Uint32Array(buffer);
          const palette = ALL_PALETTES[paletteId || 0];
          const bailout2 = 65536.0; // 256^2

          for (let y = startY; y < endY; y++) {
            const rowOffset = (y - startY) * w;
            const py = (y + 0.5) * passStep;
            const ci = centerY - (py / fullH - 0.5) * ySpan;

            for (let x = 0; x < w; x++) {
              const px = (x + 0.5) * passStep;
              const cr = centerX + (px / fullW - 0.5) * span;

              // Cardioid interior test: q*(q + (cr - 0.25)) <= 0.25*ci^2
              const xSub = cr - 0.25;
              const y2 = ci * ci;
              const q = xSub * xSub + y2;
              if (q * (q + xSub) <= 0.25 * y2) {
                buf32[rowOffset + x] = 0xFF000000;
                continue;
              }

              // Period-2 bulb test: (cr + 1.0)^2 + ci^2 <= 0.0625
              const xAdd = cr + 1.0;
              if (xAdd * xAdd + y2 <= 0.0625) {
                buf32[rowOffset + x] = 0xFF000000;
                continue;
              }

              // Main escape-time loop
              let zx = 0.0, zy = 0.0;
              let zx2 = 0.0, zy2 = 0.0;
              let n = 0;

              while (zx2 + zy2 <= bailout2 && n < maxIter) {
                zy = 2.0 * zx * zy + ci;
                zx = zx2 - zy2 + cr;
                zx2 = zx * zx;
                zy2 = zy * zy;
                n++;
              }

              if (n >= maxIter) {
                buf32[rowOffset + x] = 0xFF000000; // Interior black
              } else {
                // Continuous escape-time: nu = n + 1 - log2(log|z|)
                const logZn = 0.5 * Math.log(zx2 + zy2);
                const nu = n + 1.0 - Math.log2(logZn);
                // floor((√nu · 96 + 240) mod 2048)
                const pIdx = ((Math.floor(Math.sqrt(Math.max(0.0, nu)) * 96.0 + 240.0) % 2048) + 2048) % 2048;
                buf32[rowOffset + x] = palette[pIdx];
              }
            }
          }
          return buffer;
        }
      `;

      /* Full Worker script */
      const WORKER_SCRIPT = `
        ${KERNEL_STRING}
        self.onmessage = function(e) {
          const data = e.data;
          const buffer = computeMandelbrotBand(data);
          self.postMessage({
            renderId: data.renderId,
            passStep: data.passStep,
            bandIndex: data.bandIndex,
            startY: data.startY,
            endY: data.endY,
            w: data.w,
            isThumbnail: data.isThumbnail || false,
            thumbIndex: data.thumbIndex,
            buffer: buffer
          }, [buffer]);
        };
      `;

      /* --- Worker Pool Initialization with Fallback --- */
      const threadCount = Math.max(2, Math.min(8, navigator.hardwareConcurrency || 4));
      let workers = [];
      let isFallback = false;
      let fallbackKernel = null;

      try {
        const blob = new Blob([WORKER_SCRIPT], { type: 'application/javascript' });
        const workerBlobUrl = URL.createObjectURL(blob);
        for (let i = 0; i < threadCount; i++) {
          const w = new Worker(workerBlobUrl);
          w.onmessage = handleWorkerResponse;
          w.onerror = handleWorkerError;
          workers.push(w);
        }
        hudWorkers.textContent = `${threadCount} Workers`;
      } catch (err) {
        console.warn('Web Workers unavailable; activating main-thread fallback.', err);
        activateFallback();
      }

      function activateFallback() {
        isFallback = true;
        workers = [];
        fallbackKernel = new Function('params', `${KERNEL_STRING}\nreturn computeMandelbrotBand(params);`);
        hudWorkers.textContent = 'Fallback (Main)';
      }

      function handleWorkerError(err) {
        console.warn('Worker error encountered, falling back to main-thread kernel.', err);
        if (!isFallback) {
          activateFallback();
          startRender();
        }
      }

      /* --- UI Bookmark Elements Creation --- */
      const bookmarkCanvases = [];
      const bookmarkButtons = [];

      BOOKMARKS.forEach((bm, index) => {
        const btn = document.createElement('button');
        btn.className = `bookmark-btn ${index === 0 ? 'active' : ''}`;
        btn.title = `${bm.name}\nRe: ${bm.cx}\nIm: ${bm.cy}\nSpan: ${bm.span}`;

        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.className = 'bookmark-canvas';
        thumbCanvas.width = 224;
        thumbCanvas.height = 144;
        bookmarkCanvases.push(thumbCanvas);

        const label = document.createElement('div');
        label.className = 'bookmark-label-overlay';
        label.textContent = bm.name;

        btn.appendChild(thumbCanvas);
        btn.appendChild(label);

        btn.addEventListener('click', () => {
          dismissHint();
          currentCenterX = bm.cx;
          currentCenterY = bm.cy;
          currentSpan = bm.span;
          startRender();
        });

        bookmarksRow.appendChild(btn);
        bookmarkButtons.push(btn);
      });

      /* --- Thumbnail Rendering --- */
      function renderThumbnails() {
        BOOKMARKS.forEach((bm, index) => {
          const depth = Math.max(0, Math.log2(3.4 / bm.span));
          const maxIter = Math.min(800, Math.max(60, Math.round((120 + 90 * Math.pow(depth, 1.15)) * 0.75)));
          const w = 224;
          const h = 144;
          const ySpan = bm.span * (144 / 224);

          const job = {
            renderId: -1,
            passStep: 1,
            bandIndex: 0,
            startY: 0,
            endY: h,
            w: w,
            h: h,
            fullW: w,
            fullH: h,
            centerX: bm.cx,
            centerY: bm.cy,
            span: bm.span,
            ySpan: ySpan,
            maxIter: maxIter,
            paletteId: currentPaletteId,
            isThumbnail: true,
            thumbIndex: index
          };

          if (isFallback) {
            setTimeout(() => {
              const buffer = fallbackKernel(job);
              paintThumbnail(index, buffer, w, h);
            }, index * 20);
          } else {
            const worker = workers[index % workers.length];
            worker.postMessage(job);
          }
        });
      }

      function paintThumbnail(thumbIndex, buffer, w, h) {
        const thumbCanvas = bookmarkCanvases[thumbIndex];
        if (!thumbCanvas) return;
        const tCtx = thumbCanvas.getContext('2d');
        const imgData = new ImageData(new Uint8ClampedArray(buffer), w, h);
        tCtx.putImageData(imgData, 0, 0);
      }

      /* --- DPR & Canvas Resizing --- */
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.round(window.innerWidth * dpr);
        const h = Math.round(window.innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          startRender();
        }
      }

      window.addEventListener('resize', resizeCanvas);

      /* --- Active Bookmark State Checker --- */
      function updateActiveBookmark() {
        BOOKMARKS.forEach((bm, i) => {
          const dSpan = Math.abs(currentSpan - bm.span) / bm.span;
          const dX = Math.abs(currentCenterX - bm.cx) / currentSpan;
          const dY = Math.abs(currentCenterY - bm.cy) / currentSpan;
          if (dSpan < 0.15 && dX < 0.08 && dY < 0.08) {
            bookmarkButtons[i].classList.add('active');
          } else {
            bookmarkButtons[i].classList.remove('active');
          }
        });
      }

      /* --- Progressive Render Scheduler --- */
      function startRender() {
        currentRenderId++;
        const renderId = currentRenderId;
        renderStartTime = performance.now();
        completedBands = 0;
        activeJobsQueue = [];

        // Depth & iterations calculation
        const depth = Math.max(0, Math.log2(3.4 / currentSpan));
        const baseIter = 120 + 90 * Math.pow(depth, 1.15);
        const mult = MULTIPLIERS[multiplierIndex];
        const maxIter = Math.min(12000, Math.max(50, Math.round(baseIter * mult)));

        // Geometry setup
        const fullW = canvas.width;
        const fullH = canvas.height;
        const ySpan = currentSpan * (fullH / fullW);

        // Update HUD
        updateActiveBookmark();
        hudRe.textContent = (currentCenterX >= 0 ? '+' : '') + currentCenterX.toFixed(12);
        hudIm.textContent = (currentCenterY >= 0 ? '+' : '') + currentCenterY.toFixed(12);

        const zoomVal = 3.4 / currentSpan;
        if (zoomVal >= 1000) {
          hudZoom.textContent = zoomVal.toExponential(2).replace('+', '') + '×';
        } else if (zoomVal >= 10) {
          hudZoom.textContent = zoomVal.toFixed(1) + '×';
        } else {
          hudZoom.textContent = zoomVal.toFixed(2) + '×';
        }

        hudIter.textContent = `${maxIter} (×${mult.toFixed(1)})`;
        iterMultLabel.textContent = `×${mult.toFixed(1)}`;

        // Progress bar start
        progressBar.style.width = '0%';
        progressBar.classList.add('active');

        // Queue progressive passes: 8, 4, 2, 1
        const effectiveWorkers = isFallback ? 4 : workers.length;
        const passes = [8, 4, 2, 1];

        passes.forEach(step => {
          const w = Math.ceil(fullW / step);
          const h = Math.ceil(fullH / step);
          const numBands = (step === 1) ? (4 * effectiveWorkers) : effectiveWorkers;

          for (let k = 0; k < numBands; k++) {
            const startY = Math.floor(k * h / numBands);
            const endY = Math.floor((k + 1) * h / numBands);
            activeJobsQueue.push({
              renderId,
              passStep: step,
              bandIndex: k,
              startY,
              endY,
              w,
              h,
              fullW,
              fullH,
              centerX: currentCenterX,
              centerY: currentCenterY,
              span: currentSpan,
              ySpan,
              maxIter,
              paletteId: currentPaletteId,
              isThumbnail: false
            });
          }
        });

        totalBands = activeJobsQueue.length;

        if (isFallback) {
          runFallbackSlice(renderId);
        } else {
          // Feed initial jobs to workers
          for (let i = 0; i < workers.length; i++) {
            if (activeJobsQueue.length === 0) break;
            const job = activeJobsQueue.shift();
            workers[i].postMessage(job);
          }
        }
      }

      /* Worker message listener */
      function handleWorkerResponse(e) {
        const data = e.data;
        if (data.isThumbnail) {
          paintThumbnail(data.thumbIndex, data.buffer, data.w, data.endY - data.startY);
          return;
        }

        // Discard stale bands
        if (data.renderId !== currentRenderId) return;

        drawBand(data);
        completedBands++;

        // Progress bar update
        const pct = Math.round((completedBands / totalBands) * 100);
        progressBar.style.width = `${pct}%`;

        // Render time in HUD
        hudRender.textContent = `${Math.round(performance.now() - renderStartTime)} ms`;

        // Feed next job
        if (activeJobsQueue.length > 0) {
          const nextJob = activeJobsQueue.shift();
          this.postMessage(nextJob);
        } else if (completedBands === totalBands) {
          setTimeout(() => {
            progressBar.classList.remove('active');
          }, 180);
        }
      }

      /* Fallback asynchronous time-sliced queue */
      function runFallbackSlice(renderId) {
        if (renderId !== currentRenderId) return;
        const sliceStartTime = performance.now();

        while (activeJobsQueue.length > 0 && (performance.now() - sliceStartTime) < 12) {
          const job = activeJobsQueue.shift();
          const buffer = fallbackKernel(job);
          drawBand({
            passStep: job.passStep,
            startY: job.startY,
            endY: job.endY,
            w: job.w,
            buffer: buffer
          });
          completedBands++;
        }

        const pct = Math.round((completedBands / totalBands) * 100);
        progressBar.style.width = `${pct}%`;
        hudRender.textContent = `${Math.round(performance.now() - renderStartTime)} ms`;

        if (activeJobsQueue.length > 0) {
          requestAnimationFrame(() => runFallbackSlice(renderId));
        } else {
          setTimeout(() => {
            progressBar.classList.remove('active');
          }, 180);
        }
      }

      /* Draw band to canvas with nearest-neighbor scaling */
      function drawBand(data) {
        const { passStep, startY, endY, w, buffer } = data;
        const bandH = endY - startY;
        if (bandH <= 0 || w <= 0) return;

        tempCanvas.width = w;
        tempCanvas.height = bandH;
        const imgData = new ImageData(new Uint8ClampedArray(buffer), w, bandH);
        tempCtx.putImageData(imgData, 0, 0);

        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
          tempCanvas,
          0, 0, w, bandH,
          0, startY * passStep, w * passStep, bandH * passStep
        );
      }

      /* --- Navigation & Gestures --- */
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let hasDragged = false;

      function dismissHint() {
        if (isFirstGesture) {
          isFirstGesture = false;
          gestureHint.classList.add('faded');
        }
      }

      /* Cancel current rendering queue */
      function cancelQueue() {
        currentRenderId++;
        activeJobsQueue = [];
      }

      /* Snapshot canvas to buffer */
      function saveSnapshot() {
        snapshotCanvas.width = canvas.width;
        snapshotCanvas.height = canvas.height;
        snapshotCtx.imageSmoothingEnabled = false;
        snapshotCtx.drawImage(canvas, 0, 0);
      }

      /* Click zoom animation: 300ms cubic ease-out */
      function animateClickZoom(screenX, screenY, factor, onComplete) {
        dismissHint();
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          onComplete();
          return;
        }

        isZoomAnimating = true;
        cancelQueue();
        saveSnapshot();

        const startT = performance.now();
        const duration = 300;
        const cx = screenX * dpr;
        const cy = screenY * dpr;

        function step(now) {
          const elapsed = now - startT;
          const p = Math.min(1.0, elapsed / duration);
          // Cubic ease-out: 1 - (1 - p)^3
          const ease = 1.0 - Math.pow(1.0 - p, 3.0);
          const currentScale = 1.0 + (factor - 1.0) * ease;

          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.translate(cx, cy);
          ctx.scale(currentScale, currentScale);
          ctx.translate(-cx, -cy);
          ctx.drawImage(snapshotCanvas, 0, 0);
          ctx.restore();

          if (p < 1.0) {
            requestAnimationFrame(step);
          } else {
            isZoomAnimating = false;
            onComplete();
          }
        }
        requestAnimationFrame(step);
      }

      /* Pointer down */
      canvas.addEventListener('pointerdown', (e) => {
        dismissHint();
        if (isZoomAnimating) return;

        // Shift-click or Right-click zooms out
        if (e.button === 2 || (e.button === 0 && e.shiftKey)) {
          e.preventDefault();
          const targetX = e.clientX;
          const targetY = e.clientY;

          animateClickZoom(targetX, targetY, 1.0 / 2.5, () => {
            const fullW = canvas.width;
            const fullH = canvas.height;
            const ySpan = currentSpan * (fullH / fullW);
            const cr = currentCenterX + (targetX * dpr / fullW - 0.5) * currentSpan;
            const ci = currentCenterY - (targetY * dpr / fullH - 0.5) * ySpan;

            currentSpan *= 2.5;
            const newYSpan = currentSpan * (fullH / fullW);
            currentCenterX = cr - (targetX * dpr / fullW - 0.5) * currentSpan;
            currentCenterY = ci + (targetY * dpr / fullH - 0.5) * newYSpan;
            startRender();
          });
          return;
        }

        if (e.button === 0) {
          isDragging = true;
          hasDragged = false;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          saveSnapshot();
        }
      });

      /* Pointer move: live pan translation */
      window.addEventListener('pointermove', (e) => {
        if (!isDragging || isZoomAnimating) return;
        const dx = (e.clientX - dragStartX) * dpr;
        const dy = (e.clientY - dragStartY) * dpr;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          hasDragged = true;
          cancelQueue();

          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(snapshotCanvas, dx, dy);

          // Update HUD coordinates live during pan
          const fullW = canvas.width;
          const fullH = canvas.height;
          const ySpan = currentSpan * (fullH / fullW);
          const liveCenterX = currentCenterX - (dx / fullW) * currentSpan;
          const liveCenterY = currentCenterY + (dy / fullH) * ySpan;
          hudRe.textContent = (liveCenterX >= 0 ? '+' : '') + liveCenterX.toFixed(12);
          hudIm.textContent = (liveCenterY >= 0 ? '+' : '') + liveCenterY.toFixed(12);
        }
      });

      /* Pointer up */
      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;

        if (hasDragged) {
          const dx = (e.clientX - dragStartX) * dpr;
          const dy = (e.clientY - dragStartY) * dpr;
          const fullW = canvas.width;
          const fullH = canvas.height;
          const ySpan = currentSpan * (fullH / fullW);

          currentCenterX -= (dx / fullW) * currentSpan;
          currentCenterY += (dy / fullH) * ySpan;
          startRender();
        } else if (e.button === 0 && !e.shiftKey) {
          // Left click: zoom in ×2.5 at cursor
          const targetX = e.clientX;
          const targetY = e.clientY;

          animateClickZoom(targetX, targetY, 2.5, () => {
            const fullW = canvas.width;
            const fullH = canvas.height;
            const ySpan = currentSpan * (fullH / fullW);
            const cr = currentCenterX + (targetX * dpr / fullW - 0.5) * currentSpan;
            const ci = currentCenterY - (targetY * dpr / fullH - 0.5) * ySpan;

            currentSpan /= 2.5;
            const newYSpan = currentSpan * (fullH / fullW);
            currentCenterX = cr - (targetX * dpr / fullW - 0.5) * currentSpan;
            currentCenterY = ci + (targetY * dpr / fullH - 0.5) * newYSpan;
            startRender();
          });
        }
      });

      /* Context menu prevention */
      window.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      /* Wheel Zoom */
      let wheelDebounceTimer = null;

      window.addEventListener('wheel', (e) => {
        dismissHint();
        if (isZoomAnimating) return;
        e.preventDefault();

        cancelQueue();
        saveSnapshot();

        const factor = Math.exp(-e.deltaY * 0.0018);
        const clampedFactor = Math.max(0.2, Math.min(5.0, factor));
        const cx = e.clientX * dpr;
        const cy = e.clientY * dpr;

        // Instant scaling of existing frame
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.translate(cx, cy);
        ctx.scale(clampedFactor, clampedFactor);
        ctx.translate(-cx, -cy);
        ctx.drawImage(snapshotCanvas, 0, 0);
        ctx.restore();

        // Update complex coordinates
        const fullW = canvas.width;
        const fullH = canvas.height;
        const ySpan = currentSpan * (fullH / fullW);
        const cr = currentCenterX + (cx / fullW - 0.5) * currentSpan;
        const ci = currentCenterY - (cy / fullH - 0.5) * ySpan;

        currentSpan /= clampedFactor;
        const newYSpan = currentSpan * (fullH / fullW);
        currentCenterX = cr - (cx / fullW - 0.5) * currentSpan;
        currentCenterY = ci + (cy / fullH - 0.5) * newYSpan;

        clearTimeout(wheelDebounceTimer);
        wheelDebounceTimer = setTimeout(() => {
          startRender();
        }, 16);
      }, { passive: false });

      /* --- Keyboard Shortcuts --- */
      window.addEventListener('keydown', (e) => {
        dismissHint();
        const key = e.key;

        if (key === 'r' || key === 'R') {
          // Reset
          currentCenterX = BOOKMARKS[0].cx;
          currentCenterY = BOOKMARKS[0].cy;
          currentSpan = BOOKMARKS[0].span;
          startRender();
        } else if (key === '+' || key === '=') {
          // Increase iterations
          if (multiplierIndex < MULTIPLIERS.length - 1) {
            multiplierIndex++;
            startRender();
          }
        } else if (key === '-' || key === '_') {
          // Decrease iterations
          if (multiplierIndex > 0) {
            multiplierIndex--;
            startRender();
          }
        } else if (key === '1' || key === '2' || key === '3' || key === '4') {
          // Select palette
          selectPalette(parseInt(key, 10) - 1);
        } else if (key === 'Escape') {
          // Zoom out ×2.5 from center
          animateClickZoom(window.innerWidth / 2, window.innerHeight / 2, 1.0 / 2.5, () => {
            currentSpan *= 2.5;
            startRender();
          });
        }
      });

      /* Palette selection handler */
      function selectPalette(id) {
        if (id < 0 || id > 3 || id === currentPaletteId) return;
        currentPaletteId = id;
        paletteButtons.forEach((btn, idx) => {
          btn.classList.toggle('active', idx === currentPaletteId);
        });
        startRender();
        renderThumbnails();
      }

      paletteButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dismissHint();
          selectPalette(parseInt(btn.getAttribute('data-palette'), 10));
        });
      });

      /* Stepper Buttons */
      btnIterDec.addEventListener('click', () => {
        dismissHint();
        if (multiplierIndex > 0) {
          multiplierIndex--;
          startRender();
        }
      });

      btnIterInc.addEventListener('click', () => {
        dismissHint();
        if (multiplierIndex < MULTIPLIERS.length - 1) {
          multiplierIndex++;
          startRender();
        }
      });

      /* Zoom Out & Reset Buttons */
      btnZoomOut.addEventListener('click', () => {
        dismissHint();
        animateClickZoom(window.innerWidth / 2, window.innerHeight / 2, 1.0 / 2.5, () => {
          currentSpan *= 2.5;
          startRender();
        });
      });

      btnReset.addEventListener('click', () => {
        dismissHint();
        currentCenterX = BOOKMARKS[0].cx;
        currentCenterY = BOOKMARKS[0].cy;
        currentSpan = BOOKMARKS[0].span;
        startRender();
      });

      /* --- Initialization --- */
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);

      startRender();
      renderThumbnails();

    })();
  </script>
</body>
</html>
