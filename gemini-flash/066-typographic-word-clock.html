<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typographic Word Clock &amp; Time Poem</title>
<style>
  :root {
    --bg-a: #070a16;
    --bg-b: #0f1630;
    --bg-c: #241c3d;
    --star-opacity: 1;

    --accent: #ffd68a;
    --accent-glow: rgba(255, 214, 138, 0.55);
    --accent-dim: rgba(255, 214, 138, 0.18);

    --cell-size: clamp(16px, min(5.1vw, 5.8vh), 56px);
    --font-sans: "Helvetica Neue", "Avenir Next", Futura, "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-serif: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
  }

  [data-theme="ember"] {
    --accent: #ffd68a;
    --accent-glow: rgba(255, 214, 138, 0.6);
    --accent-dim: rgba(255, 214, 138, 0.2);
  }
  [data-theme="moon"] {
    --accent: #e6f0ff;
    --accent-glow: rgba(230, 240, 255, 0.7);
    --accent-dim: rgba(230, 240, 255, 0.22);
  }
  [data-theme="verdigris"] {
    --accent: #a8f0d4;
    --accent-glow: rgba(168, 240, 212, 0.65);
    --accent-dim: rgba(168, 240, 212, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background-color: var(--bg-a);
    color: #e8ecf2;
    font-family: var(--font-sans);
    overflow-x: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 1rem 1.5rem;
    transition: background-color 1s ease;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Layered Sky Background */
  .sky-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 70%, var(--bg-b) 100%);
    transition: background 0.8s linear;
  }
  .sky-horizon {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse 130% 65% at 50% 102%, var(--bg-c) 0%, transparent 75%);
    transition: background 0.8s linear;
  }

  /* Star Field */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: var(--star-opacity);
    transition: opacity 1.2s ease;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #ffffff 90%, transparent),
      radial-gradient(1.2px 1.2px at 28% 42%, rgba(255,255,255,0.9) 90%, transparent),
      radial-gradient(1px 1px at 44% 12%, rgba(255,255,255,0.7) 90%, transparent),
      radial-gradient(1.4px 1.4px at 67% 24%, #ffffff 90%, transparent),
      radial-gradient(1px 1px at 83% 38%, rgba(255,255,255,0.8) 90%, transparent),
      radial-gradient(1.5px 1.5px at 91% 15%, #ffffff 90%, transparent),
      radial-gradient(1px 1px at 18% 72%, rgba(255,255,255,0.6) 90%, transparent),
      radial-gradient(1.3px 1.3px at 35% 85%, #ffffff 90%, transparent),
      radial-gradient(1px 1px at 52% 64%, rgba(255,255,255,0.7) 90%, transparent),
      radial-gradient(1.2px 1.2px at 78% 79%, #ffffff 90%, transparent),
      radial-gradient(1px 1px at 8% 54%, rgba(255,255,255,0.5) 90%, transparent),
      radial-gradient(1.5px 1.5px at 62% 48%, rgba(255,255,255,0.85) 90%, transparent),
      radial-gradient(1px 1px at 95% 62%, rgba(255,255,255,0.7) 90%, transparent);
    background-size: 100% 100%;
  }

  /* Grain Texture */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: 0.045;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Shower Canvas */
  #rainCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    width: 100%;
    height: 100%;
  }

  /* Content Wrapper */
  .layout {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
  }

  /* Header */
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.2rem 0.6rem;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.62);
  }

  .header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .digital-readout {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.16em;
    font-size: 0.86rem;
    text-shadow: 0 0 10px var(--accent-glow);
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  .segmented-control {
    display: inline-flex;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 2px;
  }
  .seg-btn {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.55);
    font-family: inherit;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 3px 9px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .seg-btn.active {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .theme-toggle {
    display: flex;
    gap: 6px;
  }
  .theme-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active {
    border-color: #ffffff;
    box-shadow: 0 0 8px currentColor;
  }
  .theme-dot[data-t="ember"] { background: #ffd68a; color: #ffd68a; }
  .theme-dot[data-t="moon"] { background: #e6f0ff; color: #e6f0ff; }
  .theme-dot[data-t="verdigris"] { background: #a8f0d4; color: #a8f0d4; }

  /* Clock Frame */
  .clock-frame-wrap {
    position: relative;
    padding: 16px;
    cursor: pointer;
  }

  .clock-frame {
    position: relative;
    background: rgba(8, 10, 20, 0.36);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: clamp(14px, 2.5vw, 24px);
    box-shadow:
      0 24px 60px -12px rgba(0, 0, 0, 0.65),
      0 4px 16px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  /* Thin corner brackets */
  .bracket {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--accent);
    border-style: solid;
    pointer-events: none;
    transition: border-color 0.4s ease;
  }
  .bracket-tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .bracket-br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

  /* Corner Minutes */
  .minute-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    transition: all 0.45s ease;
  }
  .minute-dot.active {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow), 0 0 3px #fff;
  }
  .mdot-1 { top: 8px; left: 8px; }
  .mdot-2 { top: 8px; right: 8px; }
  .mdot-3 { bottom: 8px; right: 8px; }
  .mdot-4 { bottom: 8px; left: 8px; }

  /* Word Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(11, var(--cell-size));
    grid-template-rows: repeat(10, var(--cell-size));
    gap: clamp(4px, 0.8vw, 8px);
    justify-content: center;
    align-content: center;
  }

  .letter {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    font-size: calc(var(--cell-size) * 0.72);
    font-weight: 800;
    line-height: 1;
    color: rgba(255, 255, 255, 0.1);
    transition: color 0.4s cubic-bezier(0.2, 0, 0, 1), text-shadow 0.4s cubic-bezier(0.2, 0, 0, 1);
  }

  .letter.active {
    color: var(--accent);
    text-shadow:
      0 0 12px var(--accent-glow),
      0 0 24px var(--accent-glow),
      0 0 38px var(--accent-dim);
  }

  /* Poem Section */
  .poem-container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 1rem;
    min-height: 5.6rem;
  }

  .poem-viewport {
    position: relative;
    width: 100%;
    height: 3.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poem-line {
    position: absolute;
    width: 100%;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 24px);
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.88);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(8px);
    filter: blur(5px);
    transition: opacity 2.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 2.4s cubic-bezier(0.16, 1, 0.3, 1),
                filter 2.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }

  .poem-line.active {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  .poem-meta {
    font-size: 0.68rem;
    font-variant-caps: all-small-caps;
    letter-spacing: 0.28em;
    color: var(--accent);
    margin-top: 0.2rem;
    opacity: 0.75;
    transition: color 0.4s ease;
  }

  /* Controls Section */
  .controls {
    width: 100%;
    max-width: 580px;
    background: rgba(8, 10, 20, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 0.75rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .slider-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
  }

  .slider {
    flex: 1;
    appearance: none;
    -webkit-appearance: none;
    height: 4px;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 2px;
    outline: none;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: ew-resize;
    box-shadow: 0 0 10px var(--accent-glow);
    transition: transform 0.15s ease, background-color 0.4s ease;
  }
  .slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: ew-resize;
    border: none;
    box-shadow: 0 0 10px var(--accent-glow);
    transition: transform 0.15s ease, background-color 0.4s ease;
  }

  .now-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.75);
    font-family: inherit;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .now-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
  }
  .now-btn.is-live {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Reduced Motion */
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    .poem-line {
      filter: none !important;
      transform: none !important;
      transition: opacity 0.2s ease !important;
    }
  }
</style>
</head>
<body data-theme="ember">

  <div class="sky-layer"></div>
  <div class="sky-horizon"></div>
  <div class="stars"></div>
  <div class="grain"></div>
  <canvas id="rainCanvas"></canvas>

  <div class="layout">
    <!-- Header -->
    <header>
      <div class="header-left">
        <span class="digital-readout" id="digitalReadout">--:--:--</span>
        <div class="segmented-control" role="group" aria-label="Hour Mode">
          <button class="seg-btn active" id="btn12" type="button">12H</button>
          <button class="seg-btn" id="btn24" type="button">24H</button>
        </div>
      </div>
      <div class="header-right">
        <div class="theme-toggle" title="Select glow theme">
          <button class="theme-dot active" data-t="ember" aria-label="Ember Theme"></button>
          <button class="theme-dot" data-t="moon" aria-label="Moon Theme"></button>
          <button class="theme-dot" data-t="verdigris" aria-label="Verdigris Theme"></button>
        </div>
      </div>
    </header>

    <!-- Word Clock Frame -->
    <div class="clock-frame-wrap" id="clockWrap" title="Click anywhere on the clock to evoke a new verse">
      <div class="clock-frame">
        <div class="bracket bracket-tl"></div>
        <div class="bracket bracket-br"></div>

        <div class="minute-dot mdot-1" id="mdot1"></div>
        <div class="minute-dot mdot-2" id="mdot2"></div>
        <div class="minute-dot mdot-3" id="mdot3"></div>
        <div class="minute-dot mdot-4" id="mdot4"></div>

        <div class="grid" id="clockGrid" aria-label="Word Clock Face">
          <!-- 11 x 10 letters injected dynamically -->
        </div>
      </div>
    </div>

    <!-- Time Poem -->
    <div class="poem-container">
      <div class="poem-viewport">
        <p class="poem-line active" id="poemA"></p>
        <p class="poem-line" id="poemB"></p>
      </div>
      <div class="poem-meta" id="poemMeta">DEEP NIGHT</div>
    </div>

    <!-- Time Travel Slider -->
    <div class="controls">
      <label for="timeSlider" class="slider-label">Time Travel</label>
      <input type="range" id="timeSlider" class="slider" min="0" max="1439" step="1" value="0">
      <button class="now-btn is-live" id="nowBtn" type="button">Now</button>
    </div>
  </div>

<script>
(() => {
  // Grid layout (11 cols x 10 rows)
  const RAW_GRID = [

  // Letter coordinate ranges: row, startCol, length
  const WORDS = {

    { m: 960,  a: [62,111,176], b: [169,160,200],c: [240,180,138],s: 0 },   // 4pm

  // Poetry Pools
  const POETRY_PERIODS = {

      span.textContent = rowStr[c];
      gridEl.appendChild(span);
      cellElements[r][c] = span;
    }
  }

  // Determine current period object and key
  function getPeriodInfo(totalMinutes) {
    const h = totalMinutes / 60;
    if (h >= 0 && h < 5) return { key: "deepNight", ...POETRY_PERIODS.deepNight };
    if (h >= 5 && h < 7.5) return { key: "dawn", ...POETRY_PERIODS.dawn };
    if (h >= 7.5 && h < 11.5) return { key: "morning", ...POETRY_PERIODS.morning };
    if (h >= 11.5 && h < 13.5) return { key: "midday", ...POETRY_PERIODS.midday };
    if (h >= 13.5 && h < 17.5) return { key: "afternoon", ...POETRY_PERIODS.afternoon };
    if (h >= 17.5 && h < 20) return { key: "dusk", ...POETRY_PERIODS.dusk };
    if (h >= 20 && h < 23) return { key: "evening", ...POETRY_PERIODS.evening };
    return { key: "deepNight", ...POETRY_PERIODS.deepNight };
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generatePoemLine(period) {
    const s = pickRandom(period.subjects);
    const v = pickRandom(period.verbs);
    const o = pickRandom(period.objects);
    return `${s} ${v} ${o}`;
  }

  function updatePoem(force = false) {
    const curMin = getCurrentMinutes();
    const period = getPeriodInfo(curMin);

    poemMeta.textContent = period.name.toUpperCase();

    const incoming = poemToggle ? poemA : poemB;
    const outgoing = poemToggle ? poemB : poemA;

    incoming.textContent = generatePoemLine(period);
    incoming.classList.add("active");
    outgoing.classList.remove("active");

    poemToggle = !poemToggle;
  }

  function resetPoemInterval() {
    if (poemTimer) clearInterval(poemTimer);
    poemTimer = setInterval(() => updatePoem(false), 18000);
  }

  // Sky interpolation
  function interpolateSky(minutes) {
    let s0 = SKY_STOPS[0], s1 = SKY_STOPS[1];
    for (let i = 0; i < SKY_STOPS.length - 1; i++) {
      if (minutes >= SKY_STOPS[i].m && minutes <= SKY_STOPS[i + 1].m) {
        s0 = SKY_STOPS[i];
        s1 = SKY_STOPS[i + 1];
        break;
      }
    }
    const t = (minutes - s0.m) / (s1.m - s0.m);
    const lerp = (v0, v1) => Math.round(v0 + (v1 - v0) * t);

    const ca = `rgb(${lerp(s0.a[0], s1.a[0])}, ${lerp(s0.a[1], s1.a[1])}, ${lerp(s0.a[2], s1.a[2])})`;
    const cb = `rgb(${lerp(s0.b[0], s1.b[0])}, ${lerp(s0.b[1], s1.b[1])}, ${lerp(s0.b[2], s1.b[2])})`;
    const cc = `rgb(${lerp(s0.c[0], s1.c[0])}, ${lerp(s0.c[1], s1.c[1])}, ${lerp(s0.c[2], s1.c[2])})`;
    const stars = (s0.s + (s1.s - s0.s) * t).toFixed(3);

    document.documentElement.style.setProperty("--bg-a", ca);
    document.documentElement.style.setProperty("--bg-b", cb);
    document.documentElement.style.setProperty("--bg-c", cc);
    document.documentElement.style.setProperty("--star-opacity", stars);
  }

  // Current logical time
  function getCurrentMinutes() {
    if (!isLive) return simulatedMinutes;
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes();
  }

  function getActiveWords(hours24, minutes) {
    const words = ["IT", "IS"];
    const remainder = minutes % 5;
    const roundedMin = minutes - remainder;

    let targetHour = hours24 % 12;
    if (targetHour === 0) targetHour = 12;

    const nextHour = (targetHour % 12) + 1;

    switch (roundedMin) {
      case 0:
        words.push(HOUR_MAP[targetHour], "OCLOCK");
        break;
      case 5:
        words.push("MFIVE", "PAST", HOUR_MAP[targetHour]);
        break;
      case 10:
        words.push("MTEN", "PAST", HOUR_MAP[targetHour]);
        break;
      case 15:
        words.push("A", "QUARTER", "PAST", HOUR_MAP[targetHour]);
        break;
      case 20:
        words.push("TWENTY", "PAST", HOUR_MAP[targetHour]);
        break;
      case 25:
        words.push("TWENTY", "MFIVE", "PAST", HOUR_MAP[targetHour]);
        break;
      case 30:
        words.push("HALF", "PAST", HOUR_MAP[targetHour]);
        break;
      case 35:
        words.push("TWENTY", "MFIVE", "TO", HOUR_MAP[nextHour]);
        break;
      case 40:
        words.push("TWENTY", "TO", HOUR_MAP[nextHour]);
        break;
      case 45:
        words.push("A", "QUARTER", "TO", HOUR_MAP[nextHour]);
        break;
      case 50:
        words.push("MTEN", "TO", HOUR_MAP[nextHour]);
        break;
      case 55:
        words.push("MFIVE", "TO", HOUR_MAP[nextHour]);
        break;
    }

    // In 12h mode, light up AM or PM
    if (!mode24) {
      words.push(hours24 >= 12 ? "PM" : "AM");
    }

    return words;
  }

  // Digital string
  function getDigitalString(hours24, minutes, seconds) {
    const pad = (n) => String(n).padStart(2, "0");
    if (mode24) {
      return `${pad(hours24)}:${pad(minutes)}:${pad(seconds)}`;
    } else {
      let h12 = hours24 % 12;
      if (h12 === 0) h12 = 12;
      const ampm = hours24 >= 12 ? "PM" : "AM";
      return `${pad(h12)}:${pad(minutes)}:${pad(seconds)} ${ampm}`;
    }
  }

  // Word Clock update
  function renderClock(triggerShowerOnChange = false) {
    const now = new Date();
    let hours24, minutes, seconds;

    if (isLive) {
      hours24 = now.getHours();
      minutes = now.getMinutes();
      seconds = now.getSeconds();
      timeSlider.value = hours24 * 60 + minutes;
    } else {
      hours24 = Math.floor(simulatedMinutes / 60);
      minutes = Math.floor(simulatedMinutes % 60);
      seconds = 0;
    }

    const totalMin = hours24 * 60 + minutes;

    // Digital readout
    readoutEl.textContent = getDigitalString(hours24, minutes, seconds);

    // Sky
    interpolateSky(totalMin);

    // Active words
    const activeWords = getActiveWords(hours24, minutes);
    const key = activeWords.sort().join("+") + (minutes % 5);

    if (key !== lastActiveKey) {
      if (triggerShowerOnChange && lastActiveKey !== "") {
        spawnShower();
      }
      lastActiveKey = key;

      // Reset all letters
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 11; c++) {
          cellElements[r][c].classList.remove("active");
        }
      }

      // Activate active words
      activeWords.forEach(wKey => {
        const [r, sc, len] = WORDS[wKey];
        for (let c = sc; c < sc + len; c++) {
          cellElements[r][c].classList.add("active");
        }
      });

      // Corner minute dots
      const extraMinutes = minutes % 5;
      mDots.forEach((dot, idx) => {
        if (idx < extraMinutes) {
          dot.classList.add("active");
        } else {
          dot.classList.remove("active");
        }
      });
    }
  }

  /* Falling Letters Shower */
  let lettersRain = [];
  const CHARACTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    rainCanvas.width = window.innerWidth * dpr;
    rainCanvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function spawnShower() {
    if (prefersReduced) return;
    const w = window.innerWidth;
    const count = 90;
    const accentColor = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#ffd68a";

    for (let i = 0; i < count; i++) {
      lettersRain.push({
        char: CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)],
        x: Math.random() * w,
        y: -10 - Math.random() * 80,
        vx: (Math.random() - 0.5) * 1.6,
        vy: 1.6 + Math.random() * 3.8,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.08,
        size: 14 + Math.random() * 20,
        alpha: 0.95,
        fadeDelay: 30 + Math.random() * 40,
        color: accentColor
      });
    }
  }

  function updateShower() {
    if (lettersRain.length === 0) return;

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const halfH = window.innerHeight * 0.58;

    for (let i = lettersRain.length - 1; i >= 0; i--) {
      const p = lettersRain[i];
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.vy += 0.07; // subtle gravity

      if (p.y > halfH) {
        p.alpha -= 0.024;
      }

      if (p.alpha <= 0.01) {
        lettersRain.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.font = `800 ${p.size}px -apple-system, sans-serif`;
      ctx.fillText(p.char, 0, 0);
      ctx.restore();
    }
  }

  // Animation Loop
  let lastSecond = -1;
  function tick() {
    const now = new Date();
    const curSec = now.getSeconds();

    if (isLive && curSec !== lastSecond) {
      lastSecond = curSec;
      // If minute rolls over to 0 seconds, trigger letter shower
      const isNewMinute = (curSec === 0);
      renderClock(isNewMinute);
    } else if (!isLive) {
      renderClock(false);
    }

    updateShower();
    requestAnimationFrame(tick);
  }

  // Event Listeners
  // 12/24 Mode
  btn12.addEventListener("click", () => {
    mode24 = false;
    btn12.classList.add("active");
    btn24.classList.remove("active");
    lastActiveKey = ""; // trigger re-render
    renderClock();
  });
  btn24.addEventListener("click", () => {
    mode24 = true;
    btn24.classList.add("active");
    btn12.classList.remove("active");
    lastActiveKey = ""; // trigger re-render
    renderClock();
  });

  // Themes
  document.querySelectorAll(".theme-dot").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".theme-dot").forEach(d => d.classList.remove("active"));
      btn.classList.add("active");
      const theme = btn.getAttribute("data-t");
      document.body.setAttribute("data-theme", theme);
    });
  });

  // Clock Wrap Click -> evoke new verse
  clockWrap.addEventListener("click", () => {
    updatePoem(true);
    resetPoemInterval();
    if (!prefersReduced) spawnShower();
  });

  // Slider Time Travel
  timeSlider.addEventListener("input", (e) => {
    isLive = false;
    nowBtn.classList.remove("is-live");
    simulatedMinutes = parseInt(e.target.value, 10);
    renderClock();
  });

  // "Now" Button
  nowBtn.addEventListener("click", () => {
    isLive = true;
    nowBtn.classList.add("is-live");
    renderClock();
    updatePoem();
    resetPoemInterval();
  });

  // Initialize
  renderClock(false);
  updatePoem();
  resetPoemInterval();
  requestAnimationFrame(tick);
})();
</script>
</body>
