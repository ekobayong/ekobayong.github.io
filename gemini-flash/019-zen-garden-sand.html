<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Karesansui — A Garden of Raked Sand</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #dccbab;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
    color: rgba(43, 36, 28, 0.88);
    cursor: none;
  }

  /* Viewport Vignette Inner Shadow */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    box-shadow: inset 0 0 80px rgba(74, 58, 38, 0.22), inset 0 0 160px rgba(45, 34, 20, 0.18);
  }

  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* UI Layer */
  .chrome {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    animation: fadeInChrome 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
  }
  @keyframes fadeInChrome {
    to { opacity: 1; }
  }

  /* Header Top-Left */
  header {
    top: clamp(24px, 4vw, 44px);
    left: clamp(24px, 4vw, 48px);
  }
  h1 {
    font-size: clamp(22px, 2.6vw, 34px);
    font-weight: 400;
    letter-spacing: 0.08em;
    color: rgba(38, 31, 23, 0.85);
    line-height: 1.15;
    text-shadow: 0 1px 2px rgba(255,250,236,0.5);
  }
  .meditation {
    margin-top: 6px;
    font-size: clamp(12px, 1.1vw, 14.5px);
    font-style: italic;
    letter-spacing: 0.03em;
    color: rgba(65, 53, 40, 0.65);
  }

  /* Vertical Callout Top-Right */
  .vertical-label {
    top: clamp(24px, 4vw, 44px);
    right: clamp(24px, 4vw, 48px);
    writing-mode: vertical-rl;
    font-size: 11.5px;
    letter-spacing: 0.42em;
    color: rgba(43, 36, 28, 0.55);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .vertical-rule {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, rgba(43,36,28,0.4), transparent);
  }

  /* Center Hint */
  #hint {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(13px, 1.2vw, 15px);
    letter-spacing: 0.18em;
    font-style: italic;
    color: rgba(54, 44, 32, 0.48);
    transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    white-space: nowrap;
  }

  /* Bottom-Right Hanko Seal */
  .hanko {
    bottom: clamp(24px, 4vw, 40px);
    right: clamp(24px, 4vw, 44px);
    width: 36px;
    height: 36px;
    background: #b3402a;
    color: #f7ede2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-serif, serif;
    font-size: 20px;
    font-weight: 600;
    border-radius: 4px;
    transform: rotate(-3deg);
    box-shadow: 0 2px 6px rgba(78, 30, 20, 0.25), inset 0 0 4px rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.18);
  }

  /* Bottom-Left Controls */
  .toolbar {
    bottom: clamp(24px, 4vw, 40px);
    left: clamp(24px, 4vw, 48px);
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: auto;
  }

  .pill-group {
    display: flex;
    background: rgba(230, 218, 196, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 3px;
    border-radius: 999px;
    border: 1px solid rgba(138, 117, 91, 0.22);
    box-shadow: 0 4px 14px rgba(60, 48, 33, 0.08);
  }

  .tine-btn {
    border: none;
    background: transparent;
    padding: 7px 13px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 3.5px;
    cursor: none;
    transition: background 0.25s, transform 0.15s;
  }
  .tine-btn .bar {
    width: 2px;
    height: 14px;
    background-color: rgba(56, 46, 35, 0.75);
    border-radius: 1px;
    transition: background-color 0.2s;
  }
  .tine-btn.active {
    background: #2b241c;
  }
  .tine-btn.active .bar {
    background-color: #e8dbc3;
  }

  .smooth-btn {
    border: 1px solid rgba(138, 117, 91, 0.28);
    background: rgba(230, 218, 196, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: rgba(43, 36, 28, 0.85);
    padding: 8px 18px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13.5px;
    letter-spacing: 0.05em;
    position: relative;
    overflow: hidden;
    cursor: none;
    box-shadow: 0 4px 14px rgba(60, 48, 33, 0.08);
  }
  .smooth-btn span {
    position: relative;
    z-index: 2;
    transition: color 0.3s;
  }
  .smooth-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #2b241c;
    transform: translateX(-101%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
  }
  .smooth-btn:hover::before {
    transform: translateX(0);
  }
  .smooth-btn:hover span {
    color: #f3e9d7;
  }

  /* Custom Rake SVG Cursor */
  #cursor {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    transition: opacity 0.2s ease;
  }

  /* Responsive Rules */
  @media (max-width: 640px) {
    .meditation, #hint, #cursor {
      display: none !important;
    }
    body {
      cursor: auto;
    }
    .tine-btn, .smooth-btn {
      cursor: pointer;
    }
    .vertical-label {
      top: auto;
      bottom: 96px;
      left: clamp(24px, 4vw, 48px);
      right: auto;
      writing-mode: horizontal-tb;
      letter-spacing: 0.16em;
      gap: 10px;
    }
    .vertical-rule {
      width: 32px;
      height: 1px;
      background: linear-gradient(to right, rgba(43,36,28,0.4), transparent);
    }
  }
</style>
</head>
<body>
<div id="vignette"></div>

<header class="chrome">
  <h1>Karesansui</h1>
  <p class="meditation">patterns in sand, quiet mind, space between stones</p>
</header>

<div class="chrome vertical-label">
  <span>枯山水 raked sand · three stones · one afternoon</span>
  <div class="vertical-rule"></div>
</div>

<div id="hint" class="chrome">drag to rake · move the stones · let it be</div>

<div class="chrome hanko">静</div>

<div class="chrome toolbar">
  <div class="pill-group" id="tine-selector">
    <button class="tine-btn" data-tines="1" aria-label="1 tine">
      <div class="bar"></div>
    </button>
    <button class="tine-btn active" data-tines="3" aria-label="3 tines">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </button>
    <button class="tine-btn" data-tines="5" aria-label="5 tines">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </button>
  </div>
  <button class="smooth-btn" id="smooth-btn"><span>Smooth sand</span></button>
</div>

<svg id="cursor" width="60" height="60" viewBox="0 0 60 60">
  <circle id="cursor-ring" cx="30" cy="30" r="14" fill="none" stroke="rgba(56, 46, 35, 0.45)" stroke-width="1.2" stroke-dasharray="2 2" />
  <g id="cursor-tines" stroke="rgba(56, 46, 35, 0.7)" stroke-width="1.5" stroke-linecap="round"></g>
</svg>

<canvas id="canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const cursor = document.getElementById('cursor');
  const cursorRing = document.getElementById('cursor-ring');
  const cursorTines = document.getElementById('cursor-tines');
  const hint = document.getElementById('hint');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0;
  let height = 0;
  let dpr = 1;

  // Offscreen layers
  let sandCanvas = document.createElement('canvas');
  let sandCtx = sandCanvas.getContext('2d');
  let grooveCanvas = document.createElement('canvas');
  let grooveCtx = grooveCanvas.getContext('2d');

  let tineCount = 3;
  let activeStone = null;
  let isRaking = false;
  let lastPointer = { x: 0, y: 0 };
  let stoneDragOffset = { x: 0, y: 0 };
  let hasInteracted = false;

  // Smoothing animation transition
  let smoothingAlpha = 0;
  let isSmoothing = false;

  // Stones configuration
  const stones = [
    { u: 0.30, v: 0.46, rxRatio: 0.082, ryRatio: 0.054, rot: -0.35, colorDark: '#1a1714', colorMid: '#443c34', colorLight: '#63594e' },
    { u: 0.68, v: 0.38, rxRatio: 0.098, ryRatio: 0.068, rot: 0.6,   colorDark: '#171513', colorMid: '#3c362f', colorLight: '#584f45' },
    { u: 0.54, v: 0.72, rxRatio: 0.068, ryRatio: 0.046, rot: 0.1,   colorDark: '#1e1a16', colorMid: '#4b433b', colorLight: '#695e53' }
  ];

  function getStoneMetrics(s) {
    const minDim = Math.min(width, height);
    return {
      x: s.u * width,
      y: s.v * height,
      rx: Math.max(24, s.rxRatio * minDim),
      ry: Math.max(16, s.ryRatio * minDim),
      rot: s.rot
    };
  }

  // Check point in oriented ellipse
  function isPointInsideStone(px, py, pad = 0) {
    for (let i = 0; i < stones.length; i++) {
      const sm = getStoneMetrics(stones[i]);
      const dx = px - sm.x;
      const dy = py - sm.y;
      const cos = Math.cos(-sm.rot);
      const sin = Math.sin(-sm.rot);
      const lx = dx * cos - dy * sin;
      const ly = dx * sin + dy * cos;
      const ex = sm.rx + pad;
      const ey = sm.ry + pad;
      if ((lx * lx) / (ex * ex) + (ly * ly) / (ey * ey) <= 1) {
        return { hit: true, stone: stones[i], index: i, sm };
      }
    }
    return { hit: false };
  }

  // Setup Sand Base Layer
  function buildSandLayer() {
    sandCanvas.width = width * dpr;
    sandCanvas.height = height * dpr;
    sandCtx.save();
    sandCtx.scale(dpr, dpr);

    // 1. Diagonal Linear Gradient
    const grad = sandCtx.createLinearGradient(0, 0, width, height);
    grad.addColorStop(0, '#e9dcc3');
    grad.addColorStop(0.5, '#e4d4b8');
    grad.addColorStop(1, '#dccbab');
    sandCtx.fillStyle = grad;
    sandCtx.fillRect(0, 0, width, height);

    // 2. Grain Tile
    const grainCanvas = document.createElement('canvas');
    grainCanvas.width = 256;
    grainCanvas.height = 256;
    const gCtx = grainCanvas.getContext('2d');
    const imgData = gCtx.createImageData(256, 256);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const isLight = Math.random() > 0.48;
      const shade = isLight ? 255 : 30;
      const alpha = Math.pow(Math.random(), 2.4) * 0.38;
      d[i] = shade;
      d[i + 1] = shade;
      d[i + 2] = shade;
      d[i + 3] = Math.floor(alpha * 255);
    }
    gCtx.putImageData(imgData, 0, 0);

    const pattern = sandCtx.createPattern(grainCanvas, 'repeat');
    sandCtx.fillStyle = pattern;
    sandCtx.fillRect(0, 0, width, height);

    // 3. Six large soft radial washes
    const washes = [
      { x: 0.18 * width, y: 0.22 * height, r: 0.45 * Math.max(width, height), color: 'rgba(255,248,232,0.32)' }, // warm light
      { x: 0.82 * width, y: 0.28 * height, r: 0.48 * Math.max(width, height), color: 'rgba(180,158,130,0.22)' }, // cool shadow
      { x: 0.45 * width, y: 0.50 * height, r: 0.52 * Math.max(width, height), color: 'rgba(255,246,230,0.25)' }, // warm light
      { x: 0.15 * width, y: 0.80 * height, r: 0.42 * Math.max(width, height), color: 'rgba(172,150,124,0.20)' }, // shadow
      { x: 0.85 * width, y: 0.85 * height, r: 0.50 * Math.max(width, height), color: 'rgba(255,249,235,0.28)' }, // warm light
      { x: 0.52 * width, y: 0.92 * height, r: 0.38 * Math.max(width, height), color: 'rgba(165,142,116,0.18)' }  // shadow
    ];

    washes.forEach(w => {
      const rg = sandCtx.createRadialGradient(w.x, w.y, 0, w.x, w.y, w.r);
      rg.addColorStop(0, w.color);
      rg.addColorStop(1, 'rgba(200, 180, 150, 0)');
      sandCtx.fillStyle = rg;
      sandCtx.beginPath();
      sandCtx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
      sandCtx.fill();
    });

    sandCtx.restore();
  }

  // Draw an embossed groove stroke segment
  function drawGrooveSegment(gContext, x1, y1, x2, y2) {
    gContext.lineCap = 'round';
    gContext.lineJoin = 'round';

    // Shadow stroke (offset +1.1 toward bottom-right)
    gContext.strokeStyle = 'rgba(96, 74, 46, 0.30)';
    gContext.lineWidth = 3.2;
    gContext.beginPath();
    gContext.moveTo(x1 + 0.78, y1 + 0.78);
    gContext.lineTo(x2 + 0.78, y2 + 0.78);
    gContext.stroke();

    // Highlight ridge (offset -1.3 toward top-left)
    gContext.strokeStyle = 'rgba(255, 250, 236, 0.55)';
    gContext.lineWidth = 2.2;
    gContext.beginPath();
    gContext.moveTo(x1 - 0.92, y1 - 0.92);
    gContext.lineTo(x2 - 0.92, y2 - 0.92);
    gContext.stroke();

    // Groove floor
    gContext.strokeStyle = 'rgba(120, 96, 62, 0.28)';
    gContext.lineWidth = 1.6;
    gContext.beginPath();
    gContext.moveTo(x1, y1);
    gContext.lineTo(x2, y2);
    gContext.stroke();
  }

  // Pre-rake initial patterns
  function preRakeSand() {
    grooveCtx.save();
    grooveCtx.scale(dpr, dpr);

    // 1. Slow 3-tine sine wave across upper fifth
    const startY = height * 0.18;
    const wavePoints = [];
    const steps = Math.ceil(width / 3);
    for (let i = 0; i <= steps; i++) {
      const px = (i / steps) * width;
      const py = startY + Math.sin(px * 0.0055) * 22 + Math.cos(px * 0.0022) * 12;
      wavePoints.push({ x: px, y: py });
    }

    for (let tine = -1; tine <= 1; tine++) {
      const offset = tine * 9;
      for (let i = 0; i < wavePoints.length - 1; i++) {
        const p1 = wavePoints[i];
        const p2 = wavePoints[i + 1];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;

        const x1 = p1.x + nx * offset;
        const y1 = p1.y + ny * offset;
        const x2 = p2.x + nx * offset;
        const y2 = p2.y + ny * offset;

        if (!isPointInsideStone(x1, y1, 6).hit && !isPointInsideStone(x2, y2, 6).hit) {
          drawGrooveSegment(grooveCtx, x1, y1, x2, y2);
        }
      }
    }

    // 2. Concentric elliptical ripples around each stone
    stones.forEach(s => {
      const sm = getStoneMetrics(s);
      [18, 27, 36].forEach(pad => {
        const segs = 90;
        let lastPt = null;
        for (let j = 0; j <= segs; j++) {
          const theta = (j / segs) * Math.PI * 2;
          const cos = Math.cos(sm.rot);
          const sin = Math.sin(sm.rot);
          const a = sm.rx + pad;
          const b = sm.ry + pad;
          const ex = a * Math.cos(theta);
          const ey = b * Math.sin(theta);
          const px = sm.x + (ex * cos - ey * sin);
          const py = sm.y + (ex * sin + ey * cos);

          if (lastPt) {
            drawGrooveSegment(grooveCtx, lastPt.x, lastPt.y, px, py);
          }
          lastPt = { x: px, y: py };
        }
      });
    });

    grooveCtx.restore();
  }

  // Resize handler
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    // Create / recreate groove layer
    const tempGroove = document.createElement('canvas');
    if (grooveCanvas.width > 0) {
      tempGroove.width = grooveCanvas.width;
      tempGroove.height = grooveCanvas.height;
      tempGroove.getContext('2d').drawImage(grooveCanvas, 0, 0);
    }

    grooveCanvas.width = width * dpr;
    grooveCanvas.height = height * dpr;

    buildSandLayer();

    if (tempGroove.width > 0) {
      grooveCtx.drawImage(tempGroove, 0, 0, grooveCanvas.width, grooveCanvas.height);
    } else {
      preRakeSand();
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // Pointer Movement and Raking
  function stepRake(fromX, fromY, toX, toY) {
    const dist = Math.hypot(toX - fromX, toY - fromY);
    if (dist < 0.5) return;

    grooveCtx.save();
    grooveCtx.scale(dpr, dpr);

    const stepSize = 4;
    const steps = Math.max(1, Math.ceil(dist / stepSize));
    const center = (tineCount - 1) / 2;

    for (let s = 0; s < steps; s++) {
      const t1 = s / steps;
      const t2 = (s + 1) / steps;
      const sx1 = fromX + (toX - fromX) * t1;
      const sy1 = fromY + (toY - fromY) * t1;
      const sx2 = fromX + (toX - fromX) * t2;
      const sy2 = fromY + (toY - fromY) * t2;

      const segDx = sx2 - sx1;
      const segDy = sy2 - sy1;
      const segLen = Math.hypot(segDx, segDy) || 1;
      const nx = -segDy / segLen;
      const ny = segDx / segLen;

      for (let t = 0; t < tineCount; t++) {
        const offset = (t - center) * 9;
        const p1x = sx1 + nx * offset;
        const p1y = sy1 + ny * offset;
        const p2x = sx2 + nx * offset;
        const p2y = sy2 + ny * offset;

        // Skip tines hitting any stone (+ 6px pad)
        if (isPointInsideStone(p1x, p1y, 6).hit || isPointInsideStone(p2x, p2y, 6).hit) {
          continue;
        }

        drawGrooveSegment(grooveCtx, p1x, p1y, p2x, p2y);
      }
    }

    grooveCtx.restore();
  }

  // Pointer Events
  function hideHint() {
    if (!hasInteracted) {
      hasInteracted = true;
      hint.style.opacity = '0';
      setTimeout(() => { hint.remove(); }, 1200);
    }
  }

  window.addEventListener('pointerdown', (e) => {
    hideHint();
    const hitTest = isPointInsideStone(e.clientX, e.clientY, 4);
    if (hitTest.hit) {
      activeStone = hitTest.stone;
      const sm = hitTest.sm;
      stoneDragOffset.x = e.clientX - sm.x;
      stoneDragOffset.y = e.clientY - sm.y;
      cursorRing.setAttribute('stroke', '#b3402a');
      cursorRing.setAttribute('stroke-width', '2');
    } else {
      isRaking = true;
      lastPointer = { x: e.clientX, y: e.clientY };
    }
  });

  window.addEventListener('pointermove', (e) => {
    cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;

    if (activeStone) {
      activeStone.u = (e.clientX - stoneDragOffset.x) / width;
      activeStone.v = (e.clientY - stoneDragOffset.y) / height;
    } else if (isRaking) {
      stepRake(lastPointer.x, lastPointer.y, e.clientX, e.clientY);
      lastPointer = { x: e.clientX, y: e.clientY };
    }
  });

  function stopAction() {
    activeStone = null;
    isRaking = false;
    cursorRing.setAttribute('stroke', 'rgba(56, 46, 35, 0.45)');
    cursorRing.setAttribute('stroke-width', '1.2');
  }

  window.addEventListener('pointerup', stopAction);
  window.addEventListener('pointercancel', stopAction);

  // Update Custom Cursor Glyphs
  function updateCursorTines() {
    cursorTines.innerHTML = '';
    const center = (tineCount - 1) / 2;
    for (let i = 0; i < tineCount; i++) {
      const offset = (i - center) * 6;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', (30 + offset).toString());
      line.setAttribute('y1', '24');
      line.setAttribute('x2', (30 + offset).toString());
      line.setAttribute('y2', '36');
      cursorTines.appendChild(line);
    }
  }
  updateCursorTines();

  // Tine Selector Buttons
  document.querySelectorAll('.tine-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.tine-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tineCount = parseInt(btn.dataset.tines, 10);
      updateCursorTines();
    });
  });

  // Smooth Sand Button
  const smoothBtn = document.getElementById('smooth-btn');
  smoothBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    hideHint();
    if (prefersReducedMotion) {
      grooveCtx.clearRect(0, 0, grooveCanvas.width, grooveCanvas.height);
    } else {
      isSmoothing = true;
      smoothingAlpha = 1;
    }
  });

  // Render Stones
  function drawStones() {
    stones.forEach(s => {
      const sm = getStoneMetrics(s);
      ctx.save();
      ctx.translate(sm.x, sm.y);
      ctx.rotate(sm.rot);

      // 1. Soft Light Sand Ring at Base
      ctx.beginPath();
      ctx.ellipse(0, 0, sm.rx + 5, sm.ry + 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 250, 238, 0.18)';
      ctx.fill();

      // 2. Blurred Contact Shadow
      ctx.save();
      ctx.shadowColor = 'rgba(38, 28, 18, 0.55)';
      ctx.shadowBlur = 22;
      ctx.shadowOffsetX = 6;
      ctx.shadowOffsetY = 10;
      ctx.beginPath();
      ctx.ellipse(0, 0, sm.rx, sm.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#221e1a';
      ctx.fill();
      ctx.restore();

      // 3. Radial Gradient Stone Body
      const grad = ctx.createRadialGradient(
        -sm.rx * 0.35, -sm.ry * 0.4, sm.rx * 0.1,
        0, 0, Math.max(sm.rx, sm.ry)
      );
      grad.addColorStop(0, s.colorLight);
      grad.addColorStop(0.45, s.colorMid);
      grad.addColorStop(1, s.colorDark);

      ctx.beginPath();
      ctx.ellipse(0, 0, sm.rx, sm.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Stone Subtle Inner Rim Shadow
      ctx.strokeStyle = 'rgba(20, 16, 12, 0.4)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 4. Specular Sheen near upper-left
      ctx.beginPath();
      ctx.ellipse(-sm.rx * 0.36, -sm.ry * 0.38, sm.rx * 0.42, sm.ry * 0.28, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fill();

      ctx.restore();
    });
  }

  // Draw Drift Branch Shadow
  function drawBranchShadow(timeSec) {
    ctx.save();

    // Harmonic subtle sway periods (~60s to 180s)
    const t = prefersReducedMotion ? 0 : timeSec;
    const sway1 = Math.sin(t * (Math.PI * 2 / 74)) * 14 + Math.sin(t * (Math.PI * 2 / 41)) * 6;
    const sway2 = Math.cos(t * (Math.PI * 2 / 92)) * 12 + Math.sin(t * (Math.PI * 2 / 53)) * 5;
    const leafSway = Math.sin(t * (Math.PI * 2 / 28)) * 8;

    const originX = width * 0.98 + sway2 * 0.5;
    const originY = -40 + sway1 * 0.3;

    ctx.fillStyle = '#3a2c1a';
    ctx.strokeStyle = '#3a2c1a';
    ctx.globalAlpha = 0.16;

    if (ctx.filter !== undefined) {
      ctx.filter = 'blur(9px)';
    } else {
      ctx.shadowColor = '#3a2c1a';
      ctx.shadowBlur = 14;
    }

    // Main Limb Bezier (26px)
    ctx.lineWidth = 26;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(originX, originY);
    const p1x = width * 0.76 + sway1;
    const p1y = height * 0.20 + sway2;
    const p2x = width * 0.52 + sway2;
    const p2y = height * 0.32 + sway1;
    const endX = width * 0.35 + sway1 * 1.2;
    const endY = height * 0.40 + sway2 * 1.2;
    ctx.bezierCurveTo(p1x, p1y, p2x, p2y, endX, endY);
    ctx.stroke();

    // Secondary Limb 1 (12px)
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    const b1x = width * 0.62 + sway2;
    const b1y = height * 0.08 + sway1;
    ctx.quadraticCurveTo(width * 0.70, height * 0.12, b1x, b1y);
    ctx.stroke();

    // Secondary Limb 2 (12px)
    ctx.beginPath();
    ctx.moveTo(p2x, p2y);
    const b2x = width * 0.44 + sway1;
    const b2y = height * 0.48 + sway2;
    ctx.quadraticCurveTo(width * 0.48, height * 0.38, b2x, b2y);
    ctx.stroke();

    // Leaf Clusters (5 ellipses)
    const clusters = [
      { x: b1x - 10 + leafSway, y: b1y - 8, rx: 42, ry: 26, rot: 0.3 },
      { x: endX - 12, y: endY + leafSway * 0.8, rx: 55, ry: 34, rot: -0.4 },
      { x: endX + 38, y: endY - 24, rx: 46, ry: 28, rot: 0.6 },
      { x: b2x + 14, y: b2y + 12 - leafSway, rx: 48, ry: 30, rot: -0.2 },
      { x: p2x + 20, y: p2y - 32 + leafSway * 0.5, rx: 40, ry: 24, rot: 0.5 }
    ];

    clusters.forEach(c => {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.rx, c.ry, c.rot, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  // Animation Frame Loop
  function frame(timestamp) {
    const timeSec = timestamp * 0.001;

    // Handle Sand Smoothing fade
    if (isSmoothing) {
      smoothingAlpha -= 0.024;
      grooveCtx.save();
      grooveCtx.globalCompositeOperation = 'destination-out';
      grooveCtx.fillStyle = 'rgba(0, 0, 0, 0.075)';
      grooveCtx.fillRect(0, 0, grooveCanvas.width, grooveCanvas.height);
      grooveCtx.restore();

      if (smoothingAlpha <= 0) {
        grooveCtx.clearRect(0, 0, grooveCanvas.width, grooveCanvas.height);
        isSmoothing = false;
      }
    }

    // Composite scene
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Sand Base
    ctx.drawImage(sandCanvas, 0, 0);

    // 2. Grooves
    ctx.drawImage(grooveCanvas, 0, 0);

    // 3. Tree Branch Shadow
    drawBranchShadow(timeSec);

    // 4. Draggable Stones
    drawStones();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
