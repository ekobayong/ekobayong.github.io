<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Karesansui — A Garden of Raked Sand</title>
  <style>
    /* ==========================================================================
       KARESANSUI (枯山水) — A Zen Garden of Raked Sand
       Serif system typography stack:
       Iowan Old Style, Palatino, Georgia, ui-serif, serif
       ========================================================================== */

    :root {
      --ink: #2b241c;
      --ink-dim: rgba(43, 36, 28, 0.55);
      --ink-faint: rgba(43, 36, 28, 0.32);
      --ink-border: rgba(43, 36, 28, 0.16);
      --sand-light: #e9dcc3;
      --sand-mid: #e4d4b8;
      --sand-deep: #dccbab;
      --vermilion: #b3402a;
      --vermilion-glow: rgba(179, 64, 42, 0.35);
      --ease-zen: cubic-bezier(0.22, 1, 0.36, 1);
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--sand-mid);
      font-family: var(--font-serif);
      color: var(--ink);
      touch-action: none;
    }

    /* Screen Canvas */
    #garden-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: none;
    }

    /* Inner box-shadow frame vignette on the whole viewport */
    .viewport-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      box-shadow: 
        inset 0 0 60px rgba(43, 36, 28, 0.22),
        inset 0 0 160px rgba(43, 36, 28, 0.16);
      border: 1px solid rgba(43, 36, 28, 0.08);
    }

    /* Subtle paper wash grain texture on the viewport */
    .texture-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.18;
      mix-blend-mode: multiply;
      background-image: radial-gradient(rgba(43, 36, 28, 0.08) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    /* ==========================================================================
       CHROME & UI ELEMENTS
       All chrome fades up on load with cubic-bezier(0.22, 1, 0.36, 1)
       ========================================================================== */

    .chrome-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .interactive {
      pointer-events: auto;
    }

    @keyframes fadeUpIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .anim-fade-up {
      animation: fadeUpIn 1.35s var(--ease-zen) forwards;
    }

    /* Top-Left Header */
    .header-group {
      position: absolute;
      top: clamp(24px, 4.5vh, 44px);
      left: clamp(24px, 4.5vw, 48px);
      display: flex;
      flex-direction: column;
      animation-delay: 0.1s;
    }

    .garden-title {
      font-size: clamp(22px, 2.6vw, 34px);
      letter-spacing: 0.08em;
      font-weight: 500;
      line-height: 1.15;
      color: var(--ink);
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .garden-title span.kanji {
      font-size: 0.78em;
      letter-spacing: 0.12em;
      margin-left: 8px;
      opacity: 0.65;
      font-weight: 400;
    }

    .meditation {
      font-size: clamp(12.5px, 1.15vw, 14.5px);
      font-style: italic;
      letter-spacing: 0.03em;
      color: var(--ink-dim);
      margin-top: 5px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: opacity 0.4s ease;
    }

    /* Top-Right Vertical Label */
    .vertical-label-wrap {
      position: absolute;
      top: clamp(24px, 4.5vh, 44px);
      right: clamp(24px, 4.5vw, 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation-delay: 0.25s;
    }

    .vertical-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 13px;
      letter-spacing: 0.42em;
      color: var(--ink-dim);
      line-height: 1.6;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .vertical-rule {
      width: 1px;
      height: 52px;
      margin-top: 14px;
      background: linear-gradient(to bottom, rgba(43, 36, 28, 0.45), transparent);
    }

    /* Centered Hint */
    .hint-wrap {
      position: absolute;
      bottom: clamp(28px, 5vh, 46px);
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity 0.8s var(--ease-zen), transform 0.8s var(--ease-zen);
      animation-delay: 0.4s;
    }

    .hint {
      font-size: 12.5px;
      letter-spacing: 0.18em;
      color: rgba(43, 36, 28, 0.52);
      text-transform: lowercase;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .hint-wrap.dismissed {
      opacity: 0 !important;
      transform: translate(-50%, 10px) !important;
    }

    /* Bottom-Left Toolbar */
    .toolbar-wrap {
      position: absolute;
      bottom: clamp(24px, 4.5vh, 44px);
      left: clamp(24px, 4.5vw, 48px);
      display: flex;
      align-items: center;
      gap: 14px;
      animation-delay: 0.35s;
    }

    /* Pill group of 3 toggle buttons */
    .tine-pill-group {
      display: inline-flex;
      align-items: center;
      background: rgba(233, 220, 195, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px;
      border-radius: 9999px;
      border: 1px solid var(--ink-border);
      box-shadow: 
        0 2px 8px rgba(43, 36, 28, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .tine-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 34px;
      border: none;
      outline: none;
      background: transparent;
      border-radius: 9999px;
      cursor: pointer;
      color: var(--ink);
      transition: background-color 0.28s var(--ease-zen), 
                  color 0.28s var(--ease-zen),
                  box-shadow 0.28s var(--ease-zen);
    }

    .tine-btn svg {
      width: 22px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      transition: stroke 0.28s var(--ease-zen);
    }

    /* Pressed / active state inverts to ink with sand-colored lines */
    .tine-btn.active {
      background-color: var(--ink);
      color: var(--sand-light);
      box-shadow: 0 1px 5px rgba(43, 36, 28, 0.35);
    }

    .tine-btn:not(.active):hover {
      background-color: rgba(43, 36, 28, 0.08);
    }

    /* Smooth Sand Pill Button: ink fill wipes in from left on hover */
    .btn-smooth {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 40px;
      padding: 0 20px;
      border-radius: 9999px;
      background: rgba(233, 220, 195, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--ink-border);
      color: var(--ink);
      font-family: inherit;
      font-size: 13.5px;
      letter-spacing: 0.06em;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      box-shadow: 
        0 2px 8px rgba(43, 36, 28, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: color 0.4s var(--ease-zen), border-color 0.4s var(--ease-zen);
      z-index: 1;
    }

    .btn-smooth::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--ink);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s var(--ease-zen);
      z-index: -1;
    }

    .btn-smooth:hover::before {
      transform: scaleX(1);
    }

    .btn-smooth:hover {
      color: var(--sand-light);
      border-color: var(--ink);
    }

    .btn-smooth:active {
      transform: scale(0.98);
    }

    /* Audio toggle icon button */
    .btn-sound {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(233, 220, 195, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--ink-border);
      color: var(--ink-dim);
      cursor: pointer;
      outline: none;
      transition: all 0.28s var(--ease-zen);
      box-shadow: 0 2px 8px rgba(43, 36, 28, 0.08);
    }

    .btn-sound:hover {
      color: var(--ink);
      background: rgba(233, 220, 195, 0.9);
    }

    .btn-sound.muted {
      color: rgba(43, 36, 28, 0.3);
    }

    /* Bottom-Right Vermilion Seal (静) rotated -3° */
    .seal-wrap {
      position: absolute;
      bottom: clamp(24px, 4.5vh, 44px);
      right: clamp(24px, 4.5vw, 48px);
      animation-delay: 0.45s;
    }

    .vermilion-seal {
      width: 44px;
      height: 44px;
      background-color: var(--vermilion);
      border-radius: 3px;
      transform: rotate(-3deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        1px 2px 7px rgba(179, 64, 42, 0.3),
        0 1px 3px rgba(43, 36, 28, 0.2);
      border: 1.2px solid rgba(255, 230, 215, 0.35);
      position: relative;
      cursor: default;
      transition: transform 0.4s var(--ease-zen), box-shadow 0.4s var(--ease-zen);
    }

    .vermilion-seal:hover {
      transform: rotate(0deg) scale(1.06);
      box-shadow: 
        2px 4px 12px rgba(179, 64, 42, 0.42),
        0 2px 4px rgba(43, 36, 28, 0.25);
    }

    .vermilion-seal .seal-char {
      font-size: 26px;
      line-height: 1;
      color: #fff9f0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Source Han Serif", serif;
      font-weight: bold;
      text-shadow: 0 0 1px rgba(0, 0, 0, 0.3);
    }

    .vermilion-seal .inner-border {
      position: absolute;
      inset: 2px;
      border: 1px dashed rgba(255, 255, 255, 0.28);
      border-radius: 2px;
      pointer-events: none;
    }

    /* Custom SVG Cursor */
    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.25s ease;
      will-change: transform, left, top;
    }

    .custom-cursor.active {
      opacity: 1;
    }

    .custom-cursor svg {
      display: block;
      overflow: visible;
    }

    .custom-cursor circle.ring {
      fill: none;
      stroke: rgba(43, 36, 28, 0.38);
      stroke-width: 1.2;
      transition: stroke 0.22s ease, stroke-width 0.22s ease, r 0.22s var(--ease-zen);
    }

    .custom-cursor.dragging-stone circle.ring {
      stroke: var(--vermilion);
      stroke-width: 1.9;
      filter: drop-shadow(0 0 4px var(--vermilion-glow));
    }

    .custom-cursor line.tine {
      stroke: rgba(43, 36, 28, 0.45);
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: stroke 0.22s ease;
    }

    .custom-cursor.dragging-stone line.tine {
      opacity: 0;
    }

    /* ==========================================================================
       RESPONSIVE DESIGN (<= 640px)
       Under 640px: hide paragraph, hint, and custom cursor;
       move vertical label above toolbar.
       ========================================================================== */

    @media (max-width: 640px) {
      .meditation {
        display: none;
      }

      .hint-wrap {
        display: none;
      }

      .custom-cursor {
        display: none !important;
      }

      #garden-canvas {
        cursor: auto;
      }

      /* Move vertical label above toolbar */
      .vertical-label-wrap {
        top: auto;
        bottom: 94px;
        right: auto;
        left: 24px;
        flex-direction: row-reverse;
        align-items: center;
        gap: 12px;
      }

      .vertical-label {
        writing-mode: horizontal-tb;
        letter-spacing: 0.14em;
        font-size: 11.5px;
      }

      .vertical-rule {
        width: 32px;
        height: 1px;
        margin-top: 0;
        background: linear-gradient(to right, rgba(43, 36, 28, 0.4), transparent);
      }

      .toolbar-wrap {
        bottom: 24px;
        left: 20px;
        gap: 8px;
      }

      .seal-wrap {
        bottom: 24px;
        right: 20px;
      }

      .header-group {
        top: 20px;
        left: 20px;
      }

      .tine-pill-group {
        padding: 2px;
      }

      .tine-btn {
        width: 36px;
        height: 32px;
      }

      .btn-smooth {
        height: 36px;
        padding: 0 14px;
        font-size: 12.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Sand Canvas -->
  <canvas id="garden-canvas"></canvas>

  <!-- Vignette Overlay -->
  <div class="viewport-vignette"></div>
  <div class="texture-overlay"></div>

  <!-- Chrome Interface -->
  <div class="chrome-layer">
    
    <!-- Top-Left Title & Meditation -->
    <header class="header-group anim-fade-up">
      <h1 class="garden-title">Karesansui<span class="kanji">枯山水</span></h1>
      <p class="meditation">Form is emptiness, stillness is form — raked in sand, released in wind.</p>
    </header>

    <!-- Top-Right Vertical Label -->
    <aside class="vertical-label-wrap anim-fade-up">
      <div class="vertical-label">枯山水 raked sand · three stones · one afternoon</div>
      <div class="vertical-rule"></div>
    </aside>

    <!-- Centered Instruction Hint -->
    <div id="hint-wrap" class="hint-wrap anim-fade-up">
      <div class="hint">drag to rake · move the stones · let it be</div>
    </div>

    <!-- Bottom-Left Toolbar -->
    <nav class="toolbar-wrap anim-fade-up interactive" aria-label="Garden Controls">
      <!-- 1, 3, 5 Tine Selector -->
      <div class="tine-pill-group" role="radiogroup" aria-label="Rake Tine Count">
        <button id="btn-tine-1" class="tine-btn" role="radio" aria-checked="false" aria-label="1 tine rake" title="1 Tine">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="3" x2="12" y2="21" />
          </svg>
        </button>
        <button id="btn-tine-3" class="tine-btn active" role="radio" aria-checked="true" aria-label="3 tine rake" title="3 Tines">
          <svg viewBox="0 0 24 24">
            <line x1="6" y1="3" x2="6" y2="21" />
            <line x1="12" y1="3" x2="12" y2="21" />
            <line x1="18" y1="3" x2="18" y2="21" />
          </svg>
        </button>
        <button id="btn-tine-5" class="tine-btn" role="radio" aria-checked="false" aria-label="5 tine rake" title="5 Tines">
          <svg viewBox="0 0 24 24">
            <line x1="4" y1="3" x2="4" y2="21" />
            <line x1="8" y1="3" x2="8" y2="21" />
            <line x1="12" y1="3" x2="12" y2="21" />
            <line x1="16" y1="3" x2="16" y2="21" />
            <line x1="20" y1="3" x2="20" y2="21" />
          </svg>
        </button>
      </div>

      <!-- Smooth Sand Button -->
      <button id="btn-smooth" class="btn-smooth" title="Reset grooves to smooth sand">
        <span>Smooth sand</span>
      </button>

      <!-- Ambient Sound Button -->
      <button id="btn-sound" class="btn-sound muted" title="Toggle gentle sand audio" aria-label="Toggle sound">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line class="sound-mute-line" x1="23" y1="9" x2="17" y2="15"></line>
          <line class="sound-mute-line" x1="17" y1="9" x2="23" y2="15"></line>
          <path class="sound-wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07" style="display: none;"></path>
          <path class="sound-wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14" style="display: none;"></path>
        </svg>
      </button>
    </nav>

    <!-- Bottom-Right Vermilion Seal (静) -->
    <div class="seal-wrap anim-fade-up">
      <div class="vermilion-seal" title="静 (Sei) — Stillness, Serenity">
        <div class="inner-border"></div>
        <span class="seal-char">静</span>
      </div>
    </div>
  </div>

  <!-- Custom SVG Cursor -->
  <div id="custom-cursor" class="custom-cursor">
    <svg id="cursor-svg" width="80" height="80" viewBox="-40 -40 80 80">
      <circle id="cursor-ring" class="ring" cx="0" cy="0" r="18"></circle>
      <g id="cursor-tine-lines"></g>
    </svg>
  </div>

  <script>
    /* ==========================================================================
       KARESANSUI ENGINE
       ========================================================================== */
    (function () {
      'use strict';

      // --- Device & Animation Settings ---
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let prefersReducedMotion = reducedMotionQuery.matches;
      reducedMotionQuery.addEventListener('change', (e) => {
        prefersReducedMotion = e.matches;
      });

      // --- Canvas Setup ---
      const canvas = document.getElementById('garden-canvas');
      const ctx = canvas.getContext('2d');

      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let viewWidth = window.innerWidth;
      let viewHeight = window.innerHeight;

      // Offscreen Sand Base Canvas (static background rebuilt on resize)
      let sandCanvas = document.createElement('canvas');
      let sandCtx = sandCanvas.getContext('2d');

      // Offscreen Groove Layer Canvas (persistent raked grooves)
      let grooveCanvas = document.createElement('canvas');
      let grooveCtx = grooveCanvas.getContext('2d');

      // --- State ---
      let currentTines = 3;
      let isRaking = false;
      let lastPointerPos = null;
      let hintDismissed = false;

      // --- Stones Configuration ---
      // Rotations: -0.35, 0.6, 0.1 rad
      // Sizes proportional to min(viewport)
      let stones = [
        {
          id: 0,
          rxRel: 0.092,
          ryRel: 0.064,
          rot: -0.35,
          color: '#5b544b',
          xRel: 0.33,
          yRel: 0.48,
          x: 0,
          y: 0,
          rx: 0,
          ry: 0
        },
        {
          id: 1,
          rxRel: 0.068,
          ryRel: 0.048,
          rot: 0.6,
          color: '#4e463d',
          xRel: 0.43,
          yRel: 0.60,
          x: 0,
          y: 0,
          rx: 0,
          ry: 0
        },
        {
          id: 2,
          rxRel: 0.052,
          ryRel: 0.038,
          rot: 0.1,
          color: '#655c52',
          xRel: 0.72,
          yRel: 0.63,
          x: 0,
          y: 0,
          rx: 0,
          ry: 0
        }
      ];

      let draggedStone = null;
      let dragOffset = { x: 0, y: 0 };

      // --- Audio Engine (Procedural Sand Friction) ---
      let audioCtx = null;
      let soundEnabled = false;
      let rakeGain = null;
      let noiseNode = null;

      function initAudio() {
        if (audioCtx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          audioCtx = new AudioContext();

          // Generate 2 seconds of pinkish noise for sand whispering
          const bufferSize = audioCtx.sampleRate * 2;
          const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.06;
            b6 = white * 0.115926;
          }

          noiseNode = audioCtx.createBufferSource();
          noiseNode.buffer = noiseBuffer;
          noiseNode.loop = true;

          // Bandpass filter for soft sand grains brushing
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1100;
          filter.Q.value = 1.4;

          rakeGain = audioCtx.createGain();
          rakeGain.gain.setValueAtTime(0, audioCtx.currentTime);

          noiseNode.connect(filter);
          filter.connect(rakeGain);
          rakeGain.connect(audioCtx.destination);
          noiseNode.start(0);
        } catch (e) {
          // Audio not supported or blocked
        }
      }

      function setRakeSound(active, speed = 1) {
        if (!soundEnabled || !rakeGain || !audioCtx) return;
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const targetVol = active ? Math.min(0.045, 0.015 + speed * 0.015) : 0;
        rakeGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.06);
      }

      function playStoneTap() {
        if (!soundEnabled || !audioCtx) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
          g.gain.setValueAtTime(0.06, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.13);
        } catch (e) {}
      }

      // --- Mulberry32 Seeded PRNG for Sand Grain Texture ---
      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // --- Build 256px Seeded Sand Grain Tile ---
      let grainPattern = null;
      function buildGrainTile() {
        const grainCanvas = document.createElement('canvas');
        grainCanvas.width = 256;
        grainCanvas.height = 256;
        const gctx = grainCanvas.getContext('2d');
        const imgData = gctx.createImageData(256, 256);
        const data = imgData.data;
        const rng = mulberry32(0x9a8f3c);

        for (let i = 0; i < 256 * 256; i++) {
          const r = rng();
          // Alpha follows power-2.4 curve so most grains are faint, few are crisp
          const alphaCurve = Math.pow(r, 2.4);
          const alpha = Math.floor(alphaCurve * 84); // max ~0.33 alpha
          const isDark = rng() > 0.46;
          const idx = i * 4;

          if (isDark) {
            // Dark mineral grain
            data[idx] = 78;
            data[idx + 1] = 62;
            data[idx + 2] = 45;
          } else {
            // Crisp quartz / light sand grain
            data[idx] = 255;
            data[idx + 1] = 250;
            data[idx + 2] = 236;
          }
          data[idx + 3] = alpha;
        }

        gctx.putImageData(imgData, 0, 0);
        grainPattern = sandCtx.createPattern(grainCanvas, 'repeat');
      }

      // --- Build Sand Bed (Diagonal gradient + grain + 6 radial washes) ---
      function buildSandBed() {
        sandCanvas.width = viewWidth * dpr;
        sandCanvas.height = viewHeight * dpr;
        sandCtx.save();
        sandCtx.scale(dpr, dpr);

        // 1. Diagonal linear gradient from #e9dcc3 through #e4d4b8 to #dccbab
        const grad = sandCtx.createLinearGradient(0, 0, viewWidth, viewHeight);
        grad.addColorStop(0, '#e9dcc3');
        grad.addColorStop(0.5, '#e4d4b8');
        grad.addColorStop(1, '#dccbab');
        sandCtx.fillStyle = grad;
        sandCtx.fillRect(0, 0, viewWidth, viewHeight);

        // 2. Grain pattern overlay
        if (!grainPattern) {
          buildGrainTile();
        }
        sandCtx.fillStyle = grainPattern;
        sandCtx.fillRect(0, 0, viewWidth, viewHeight);

        // 3. Six large soft radial washes alternating warm-light and cool-shadow
        const maxDim = Math.max(viewWidth, viewHeight);
        const washes = [
          { x: 0.22 * viewWidth, y: 0.24 * viewHeight, r: 0.44 * maxDim, warm: true },
          { x: 0.76 * viewWidth, y: 0.20 * viewHeight, r: 0.52 * maxDim, warm: false },
          { x: 0.48 * viewWidth, y: 0.52 * viewHeight, r: 0.46 * maxDim, warm: true },
          { x: 0.16 * viewWidth, y: 0.76 * viewHeight, r: 0.50 * maxDim, warm: false },
          { x: 0.84 * viewWidth, y: 0.72 * viewHeight, r: 0.54 * maxDim, warm: true },
          { x: 0.45 * viewWidth, y: 0.92 * viewHeight, r: 0.42 * maxDim, warm: false }
        ];

        washes.forEach((wash) => {
          const rGrad = sandCtx.createRadialGradient(
            wash.x, wash.y, 0,
            wash.x, wash.y, wash.r
          );
          if (wash.warm) {
            rGrad.addColorStop(0, 'rgba(255, 252, 240, 0.20)');
            rGrad.addColorStop(0.55, 'rgba(255, 250, 235, 0.08)');
            rGrad.addColorStop(1, 'rgba(255, 250, 235, 0)');
          } else {
            rGrad.addColorStop(0, 'rgba(130, 110, 88, 0.13)');
            rGrad.addColorStop(0.6, 'rgba(130, 110, 88, 0.04)');
            rGrad.addColorStop(1, 'rgba(130, 110, 88, 0)');
          }
          sandCtx.fillStyle = rGrad;
          sandCtx.fillRect(0, 0, viewWidth, viewHeight);
        });

        sandCtx.restore();
      }

      // --- Stone Geometries & Hit Testing ---
      function updateStonePositions() {
        const minDim = Math.min(viewWidth, viewHeight);
        stones.forEach((s) => {
          s.rx = Math.round(minDim * s.rxRel);
          s.ry = Math.round(minDim * s.ryRel);
          // Retain current position if already placed, otherwise set relative
          if (!s.initialized) {
            s.x = Math.round(viewWidth * s.xRel);
            s.y = Math.round(viewHeight * s.yRel);
            s.initialized = true;
          }
        });
      }

      // Check if point falls inside any stone (with optional pad)
      function isPointInStone(px, py, pad = 6) {
        for (let i = 0; i < stones.length; i++) {
          const s = stones[i];
          const dx = px - s.x;
          const dy = py - s.y;
          const cos = Math.cos(-s.rot);
          const sin = Math.sin(-s.rot);
          const lx = dx * cos - dy * sin;
          const ly = dx * sin + dy * cos;
          const rx = s.rx + pad;
          const ry = s.ry + pad;
          if ((lx * lx) / (rx * rx) + (ly * ly) / (ry * ry) <= 1.0) {
            return s;
          }
        }
        return null;
      }

      // --- Embossed Stroke Drawing ---
      // Light from top-left:
      // Shadow offset +1.1px toward bottom-right in rgba(96,74,46,0.30), lineWidth 3.2
      // Highlight ridge offset -1.3px toward top-left in rgba(255,250,236,0.55), lineWidth 2.2
      // Groove floor offset 0 in rgba(120,96,62,0.28), lineWidth 1.6
      const SHADOW_OFFSET = 1.1 / Math.SQRT2; // ~0.778px
      const HIGHLIGHT_OFFSET = -1.3 / Math.SQRT2; // ~-0.919px

      function drawEmbossedSegment(gCtx, sx, sy, ex, ey) {
        // 1. Shadow stroke offset +1.1px toward bottom-right
        gCtx.beginPath();
        gCtx.moveTo(sx + SHADOW_OFFSET, sy + SHADOW_OFFSET);
        gCtx.lineTo(ex + SHADOW_OFFSET, ey + SHADOW_OFFSET);
        gCtx.lineWidth = 3.2;
        gCtx.strokeStyle = 'rgba(96,74,46,0.30)';
        gCtx.lineCap = 'round';
        gCtx.stroke();

        // 2. Highlight ridge offset -1.3px toward top-left
        gCtx.beginPath();
        gCtx.moveTo(sx + HIGHLIGHT_OFFSET, sy + HIGHLIGHT_OFFSET);
        gCtx.lineTo(ex + HIGHLIGHT_OFFSET, ey + HIGHLIGHT_OFFSET);
        gCtx.lineWidth = 2.2;
        gCtx.strokeStyle = 'rgba(255,250,236,0.55)';
        gCtx.lineCap = 'round';
        gCtx.stroke();

        // 3. Groove floor
        gCtx.beginPath();
        gCtx.moveTo(sx, sy);
        gCtx.lineTo(ex, ey);
        gCtx.lineWidth = 1.6;
        gCtx.strokeStyle = 'rgba(120,96,62,0.28)';
        gCtx.lineCap = 'round';
        gCtx.stroke();
      }

      // --- Multi-Tine Rake Path Subdivider ---
      // Subdividing fast moves into 4px steps so strokes stay continuous
      function rakePath(p0, p1, tineCount) {
        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.2) return;

        const steps = Math.max(1, Math.ceil(dist / 4));
        const center = (tineCount - 1) / 2;

        let prev = p0;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const curr = {
            x: p0.x + dx * t,
            y: p0.y + dy * t
          };

          const segDx = curr.x - prev.x;
          const segDy = curr.y - prev.y;
          const segLen = Math.hypot(segDx, segDy);
          if (segLen < 0.001) {
            prev = curr;
            continue;
          }

          // Perpendicular normal
          const nx = -segDy / segLen;
          const ny = segDx / segLen;

          for (let k = 0; k < tineCount; k++) {
            const offset = (k - center) * 9;
            const sx = prev.x + nx * offset;
            const sy = prev.y + ny * offset;
            const ex = curr.x + nx * offset;
            const ey = curr.y + ny * offset;

            // Tines whose endpoints fall inside a stone (with 6px pad) are skipped
            if (isPointInStone(sx, sy, 6) || isPointInStone(ex, ey, 6)) {
              continue;
            }

            drawEmbossedSegment(grooveCtx, sx, sy, ex, ey);
          }
          prev = curr;
        }
      }

      // --- Pre-Raking Initial Scene ---
      // On load:
      // 1. Three concentric elliptical ripple rings around each stone
      // 2. Slow 3-tine sine wave crossing the upper fifth of the garden
      function preRakeInitialScene() {
        grooveCanvas.width = viewWidth * dpr;
        grooveCanvas.height = viewHeight * dpr;
        grooveCtx.save();
        grooveCtx.scale(dpr, dpr);

        // Pre-rake ripples around each stone
        stones.forEach((s) => {
          const ripplePads = [13, 23, 33];
          ripplePads.forEach((pad) => {
            const rx = s.rx + pad;
            const ry = s.ry + pad;
            const numPoints = Math.max(72, Math.floor((rx + ry) * 0.9));
            let prevPoint = null;

            for (let i = 0; i <= numPoints; i++) {
              const theta = (i / numPoints) * Math.PI * 2;
              const lx = rx * Math.cos(theta);
              const ly = ry * Math.sin(theta);
              // Rotate by stone's rotation
              const cos = Math.cos(s.rot);
              const sin = Math.sin(s.rot);
              const gx = s.x + lx * cos - ly * sin;
              const gy = s.y + lx * sin + ly * cos;

              const currPoint = { x: gx, y: gy };
              if (prevPoint) {
                // Check if segment crosses inside ANY OTHER stone
                const inOtherStone = stones.some((other) => {
                  if (other.id === s.id) return false;
                  const odx1 = prevPoint.x - other.x;
                  const ody1 = prevPoint.y - other.y;
                  const oCos1 = Math.cos(-other.rot);
                  const oSin1 = Math.sin(-other.rot);
                  const olx1 = odx1 * oCos1 - ody1 * oSin1;
                  const oly1 = odx1 * oSin1 + ody1 * oCos1;
                  const in1 = (olx1 * olx1) / ((other.rx + 6) ** 2) + (oly1 * oly1) / ((other.ry + 6) ** 2) <= 1;

                  const odx2 = currPoint.x - other.x;
                  const ody2 = currPoint.y - other.y;
                  const olx2 = odx2 * oCos1 - ody2 * oSin1;
                  const oly2 = odx2 * oSin1 + ody2 * oCos1;
                  const in2 = (olx2 * olx2) / ((other.rx + 6) ** 2) + (oly2 * oly2) / ((other.ry + 6) ** 2) <= 1;

                  return in1 || in2;
                });

                if (!inOtherStone) {
                  drawEmbossedSegment(
                    grooveCtx,
                    prevPoint.x, prevPoint.y,
                    currPoint.x, currPoint.y
                  );
                }
              }
              prevPoint = currPoint;
            }
          });
        });

        // Pre-rake slow 3-tine sine wave across the upper fifth
        const waveBaseY = viewHeight * 0.17;
        const waveAmp = Math.min(22, viewHeight * 0.035);
        const waveFreq = (Math.PI * 2) / (viewWidth * 0.62);

        let wavePrev = {
          x: -30,
          y: waveBaseY + waveAmp * Math.sin(-30 * waveFreq)
        };

        for (let x = -26; x <= viewWidth + 30; x += 3.5) {
          const y = waveBaseY + waveAmp * Math.sin(x * waveFreq + 0.3) + Math.cos(x * waveFreq * 0.5) * 4;
          const waveCurr = { x, y };
          rakePath(wavePrev, waveCurr, 3);
          wavePrev = waveCurr;
        }

        grooveCtx.restore();
      }

      // --- Smooth Sand Transition ---
      let isSmoothing = false;
      function smoothSand() {
        if (isSmoothing) return;
        dismissHint();

        if (prefersReducedMotion) {
          preRakeInitialScene();
          return;
        }

        isSmoothing = true;
        const duration = 650;
        const startTime = performance.now();

        // Snapshot current grooves
        const snap = document.createElement('canvas');
        snap.width = grooveCanvas.width;
        snap.height = grooveCanvas.height;
        const sctx = snap.getContext('2d');
        sctx.drawImage(grooveCanvas, 0, 0);

        function step(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          // Ease-out
          const easeProgress = 1 - Math.pow(1 - progress, 3);
          const alpha = 1 - easeProgress;

          grooveCtx.clearRect(0, 0, grooveCanvas.width, grooveCanvas.height);
          grooveCtx.save();
          grooveCtx.globalAlpha = alpha;
          grooveCtx.drawImage(snap, 0, 0);
          grooveCtx.restore();

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            grooveCtx.clearRect(0, 0, grooveCanvas.width, grooveCanvas.height);
            preRakeInitialScene();
            isSmoothing = false;
          }
        }
        requestAnimationFrame(step);
      }

      // --- Render Stones ---
      // Blurred contact shadow (shadowBlur 22, offset 6/10)
      // Radial gradient body from warm charcoal to near-black
      // 18%-alpha specular sheen ellipse near upper-left
      // Faint light sand ring at base
      function renderStones(targetCtx) {
        stones.forEach((s) => {
          targetCtx.save();
          targetCtx.translate(s.x, s.y);
          targetCtx.rotate(s.rot);

          // 1. Blurred contact shadow
          targetCtx.save();
          targetCtx.shadowColor = 'rgba(28, 20, 13, 0.44)';
          targetCtx.shadowBlur = 22;
          targetCtx.shadowOffsetX = 6;
          targetCtx.shadowOffsetY = 10;
          targetCtx.beginPath();
          targetCtx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
          targetCtx.fillStyle = 'rgba(28, 20, 13, 0.48)';
          targetCtx.fill();
          targetCtx.restore();

          // 2. Faint light sand ring at the base
          targetCtx.beginPath();
          targetCtx.ellipse(0, 0, s.rx + 2.4, s.ry + 2.4, 0, 0, Math.PI * 2);
          targetCtx.lineWidth = 2.8;
          targetCtx.strokeStyle = 'rgba(255, 248, 230, 0.36)';
          targetCtx.stroke();

          // 3. Radial gradient stone body (warm charcoal to near-black)
          targetCtx.beginPath();
          targetCtx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
          const bodyGrad = targetCtx.createRadialGradient(
            -s.rx * 0.28, -s.ry * 0.28, s.rx * 0.06,
            0, 0, Math.max(s.rx, s.ry) * 1.05
          );
          bodyGrad.addColorStop(0, s.color);
          bodyGrad.addColorStop(0.55, '#342e27');
          bodyGrad.addColorStop(1, '#14110e'); // near-black
          targetCtx.fillStyle = bodyGrad;
          targetCtx.fill();

          // 4. 18%-alpha specular sheen ellipse near upper-left
          targetCtx.save();
          targetCtx.beginPath();
          targetCtx.ellipse(
            -s.rx * 0.30, -s.ry * 0.30,
            s.rx * 0.44, s.ry * 0.28,
            -0.18, 0, Math.PI * 2
          );
          const sheenGrad = targetCtx.createRadialGradient(
            -s.rx * 0.30, -s.ry * 0.30, 0,
            -s.rx * 0.30, -s.ry * 0.30, s.rx * 0.44
          );
          sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
          sheenGrad.addColorStop(0.7, 'rgba(255, 255, 255, 0.08)');
          sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          targetCtx.fillStyle = sheenGrad;
          targetCtx.fill();
          targetCtx.restore();

          // Subtle natural stone edge definition
          targetCtx.beginPath();
          targetCtx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
          targetCtx.lineWidth = 1;
          targetCtx.strokeStyle = 'rgba(20, 16, 12, 0.38)';
          targetCtx.stroke();

          targetCtx.restore();
        });
      }

      // --- Ambient Swaying Branch Shadow ---
      // Extremely slow shadow from upper right
      // canvas filter blur(9px) (shadowBlur fallback) at 16% alpha in #3a2c1a
      // 26px main limb bezier, two 12px secondary limbs, five leaf-cluster ellipses
      // Periods of roughly a minute to several minutes
      function renderAmbientShadow(targetCtx, timeSec) {
        targetCtx.save();

        // Apply blur: filter blur(9px) or shadowBlur fallback
        const supportsFilter = typeof targetCtx.filter === 'string';
        if (supportsFilter) {
          targetCtx.filter = 'blur(9px)';
          targetCtx.globalAlpha = 0.16;
          targetCtx.fillStyle = '#3a2c1a';
          targetCtx.strokeStyle = '#3a2c1a';
        } else {
          targetCtx.shadowColor = 'rgba(58, 44, 26, 0.16)';
          targetCtx.shadowBlur = 9;
          targetCtx.fillStyle = 'rgba(58, 44, 26, 0.16)';
          targetCtx.strokeStyle = 'rgba(58, 44, 26, 0.16)';
        }

        // Extremely slow swaying harmonics (periods: 62s, 114s, 168s, 82s)
        const t = prefersReducedMotion ? 0 : timeSec;
        const swayMain = Math.sin(t * (Math.PI * 2 / 62)) * 16 + Math.sin(t * (Math.PI * 2 / 114)) * 9;
        const swaySub1 = Math.sin(t * (Math.PI * 2 / 82) + 1.2) * 12 + Math.cos(t * (Math.PI * 2 / 168)) * 7;
        const swaySub2 = Math.cos(t * (Math.PI * 2 / 70) + 2.5) * 10 + Math.sin(t * (Math.PI * 2 / 94)) * 6;
        const leafFlutter = Math.sin(t * 0.18) * 4 + Math.cos(t * 0.08) * 3;

        // Origin at upper right
        const rootX = viewWidth + 40;
        const rootY = -20;

        // Main limb bezier (26px)
        const mCp1X = viewWidth * 0.88 + swayMain * 0.6;
        const mCp1Y = viewHeight * 0.12 + swayMain * 0.3;
        const mCp2X = viewWidth * 0.74 + swayMain * 1.1;
        const mCp2Y = viewHeight * 0.22 + swayMain * 0.5;
        const mEndX = viewWidth * 0.62 + swayMain * 1.4;
        const mEndY = viewHeight * 0.32 + swayMain * 0.7;

        targetCtx.beginPath();
        targetCtx.moveTo(rootX, rootY);
        targetCtx.bezierCurveTo(mCp1X, mCp1Y, mCp2X, mCp2Y, mEndX, mEndY);
        targetCtx.lineWidth = 26;
        targetCtx.lineCap = 'round';
        targetCtx.stroke();

        // Secondary limb 1 (12px): branches off mid main-limb downwards
        const s1StartX = mCp1X * 0.4 + mCp2X * 0.6;
        const s1StartY = mCp1Y * 0.4 + mCp2Y * 0.6;
        const s1CpX = s1StartX - viewWidth * 0.08 + swaySub1;
        const s1CpY = s1StartY + viewHeight * 0.10 + swaySub1 * 0.5;
        const s1EndX = s1StartX - viewWidth * 0.15 + swaySub1 * 1.2;
        const s1EndY = s1StartY + viewHeight * 0.18 + swaySub1 * 0.7;

        targetCtx.beginPath();
        targetCtx.moveTo(s1StartX, s1StartY);
        targetCtx.quadraticCurveTo(s1CpX, s1CpY, s1EndX, s1EndY);
        targetCtx.lineWidth = 12;
        targetCtx.lineCap = 'round';
        targetCtx.stroke();

        // Secondary limb 2 (12px): branches near tip leftwards
        const s2StartX = mCp2X * 0.3 + mEndX * 0.7;
        const s2StartY = mCp2Y * 0.3 + mEndY * 0.7;
        const s2CpX = s2StartX - viewWidth * 0.09 + swaySub2;
        const s2CpY = s2StartY - viewHeight * 0.04 + swaySub2 * 0.4;
        const s2EndX = s2StartX - viewWidth * 0.18 + swaySub2 * 1.1;
        const s2EndY = s2StartY + viewHeight * 0.02 + swaySub2 * 0.6;

        targetCtx.beginPath();
        targetCtx.moveTo(s2StartX, s2StartY);
        targetCtx.quadraticCurveTo(s2CpX, s2CpY, s2EndX, s2EndY);
        targetCtx.lineWidth = 12;
        targetCtx.lineCap = 'round';
        targetCtx.stroke();

        // Five leaf-cluster ellipses
        const leafClusters = [
          { x: mEndX, y: mEndY, rx: 38, ry: 24, rot: 0.3 + leafFlutter * 0.02 },
          { x: s1EndX, y: s1EndY, rx: 34, ry: 22, rot: -0.4 + leafFlutter * 0.03 },
          { x: s1CpX * 0.5 + s1EndX * 0.5, y: s1CpY * 0.5 + s1EndY * 0.5, rx: 28, ry: 19, rot: 0.1 - leafFlutter * 0.02 },
          { x: s2EndX, y: s2EndY, rx: 36, ry: 23, rot: -0.2 + leafFlutter * 0.025 },
          { x: s2CpX * 0.6 + s2EndX * 0.4, y: s2CpY * 0.6 + s2EndY * 0.4, rx: 30, ry: 20, rot: 0.5 + leafFlutter * 0.02 }
        ];

        leafClusters.forEach((cl) => {
          targetCtx.beginPath();
          targetCtx.ellipse(cl.x, cl.y, cl.rx, cl.ry, cl.rot, 0, Math.PI * 2);
          targetCtx.fill();
        });

        targetCtx.restore();
      }

      // --- Main Render Loop ---
      function render(timeMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw pre-rendered Sand Bed
        ctx.drawImage(sandCanvas, 0, 0);

        // 2. Draw persistent Groove Layer
        ctx.drawImage(grooveCanvas, 0, 0);

        // 3. Render Stones on top (each frame)
        ctx.save();
        ctx.scale(dpr, dpr);
        renderStones(ctx);

        // 4. Render Ambient Branch Shadow
        renderAmbientShadow(ctx, timeMs / 1000);
        ctx.restore();

        requestAnimationFrame(render);
      }

      // --- Resize Handling ---
      function handleResize() {
        const oldWidth = viewWidth;
        const oldHeight = viewHeight;
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = viewWidth * dpr;
        canvas.height = viewHeight * dpr;

        // Re-scale stone positions to new viewport
        if (oldWidth > 0 && oldHeight > 0) {
          const scaleX = viewWidth / oldWidth;
          const scaleY = viewHeight / oldHeight;
          stones.forEach((s) => {
            s.x = Math.round(s.x * scaleX);
            s.y = Math.round(s.y * scaleY);
          });
        }
        updateStonePositions();

        buildSandBed();

        // Copy existing grooves scaled to new dimensions
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = grooveCanvas.width;
        tempCanvas.height = grooveCanvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(grooveCanvas, 0, 0);

        grooveCanvas.width = viewWidth * dpr;
        grooveCanvas.height = viewHeight * dpr;
        grooveCtx.save();
        grooveCtx.drawImage(tempCanvas, 0, 0, grooveCanvas.width, grooveCanvas.height);
        grooveCtx.restore();
      }

      // --- Custom SVG Cursor Management ---
      const cursorEl = document.getElementById('custom-cursor');
      const cursorRing = document.getElementById('cursor-ring');
      const cursorTinesG = document.getElementById('cursor-tine-lines');

      function updateCursorShape() {
        // Clear old tine tick lines
        while (cursorTinesG.firstChild) {
          cursorTinesG.removeChild(cursorTinesG.firstChild);
        }

        let radius = 12;
        if (currentTines === 3) radius = 18;
        if (currentTines === 5) radius = 26;

        cursorRing.setAttribute('r', radius);

        const center = (currentTines - 1) / 2;
        for (let k = 0; k < currentTines; k++) {
          const xOff = (k - center) * 9;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('class', 'tine');
          line.setAttribute('x1', xOff);
          line.setAttribute('y1', -7);
          line.setAttribute('x2', xOff);
          line.setAttribute('y2', 7);
          cursorTinesG.appendChild(line);
        }
      }

      function setCursorPos(x, y) {
        cursorEl.style.left = x + 'px';
        cursorEl.style.top = y + 'px';
        if (!cursorEl.classList.contains('active')) {
          cursorEl.classList.add('active');
        }
      }

      function dismissHint() {
        if (!hintDismissed) {
          hintDismissed = true;
          const hintWrap = document.getElementById('hint-wrap');
          if (hintWrap) {
            hintWrap.classList.add('dismissed');
          }
        }
      }

      // --- Pointer / Touch Interactions ---
      function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      function onPointerDown(e) {
        if (e.target !== canvas) return;
        e.preventDefault();
        dismissHint();
        initAudio();

        const pos = getPointerPos(e);
        lastPointerPos = pos;

        // Check if pointer hit a stone (search in reverse draw order)
        const hitStone = isPointInStone(pos.x, pos.y, 4);
        if (hitStone) {
          draggedStone = hitStone;
          dragOffset.x = pos.x - hitStone.x;
          dragOffset.y = pos.y - hitStone.y;

          // Bring dragged stone to front
          const idx = stones.indexOf(hitStone);
          if (idx > -1) {
            stones.splice(idx, 1);
            stones.push(hitStone);
          }

          cursorEl.classList.add('dragging-stone');
          playStoneTap();
        } else {
          // Pointer-down on sand begins raking
          isRaking = true;
          setRakeSound(true, 1);
        }
      }

      function onPointerMove(e) {
        const pos = getPointerPos(e);
        setCursorPos(e.clientX, e.clientY);

        if (draggedStone) {
          draggedStone.x = Math.max(draggedStone.rx, Math.min(viewWidth - draggedStone.rx, pos.x - dragOffset.x));
          draggedStone.y = Math.max(draggedStone.ry, Math.min(viewHeight - draggedStone.ry, pos.y - dragOffset.y));
        } else if (isRaking && lastPointerPos) {
          const speed = Math.hypot(pos.x - lastPointerPos.x, pos.y - lastPointerPos.y);
          rakePath(lastPointerPos, pos, currentTines);
          lastPointerPos = pos;
          setRakeSound(true, speed);
        }
      }

      function onPointerUp(e) {
        if (draggedStone) {
          playStoneTap();
          draggedStone = null;
          cursorEl.classList.remove('dragging-stone');
        }
        if (isRaking) {
          isRaking = false;
          lastPointerPos = null;
          setRakeSound(false);
        }
      }

      // --- Toolbar Controls ---
      const tineBtns = {
        1: document.getElementById('btn-tine-1'),
        3: document.getElementById('btn-tine-3'),
        5: document.getElementById('btn-tine-5')
      };

      function setTineCount(count) {
        currentTines = count;
        Object.keys(tineBtns).forEach((key) => {
          const btn = tineBtns[key];
          const isActive = parseInt(key, 10) === count;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-checked', isActive ? 'true' : 'false');
        });
        updateCursorShape();
      }

      tineBtns[1].addEventListener('click', () => setTineCount(1));
      tineBtns[3].addEventListener('click', () => setTineCount(3));
      tineBtns[5].addEventListener('click', () => setTineCount(5));

      document.getElementById('btn-smooth').addEventListener('click', smoothSand);

      // Sound toggle
      const btnSound = document.getElementById('btn-sound');
      const soundMuteLines = btnSound.querySelectorAll('.sound-mute-line');
      const soundWaves = btnSound.querySelectorAll('.sound-wave-1, .sound-wave-2');

      btnSound.addEventListener('click', () => {
        initAudio();
        soundEnabled = !soundEnabled;
        btnSound.classList.toggle('muted', !soundEnabled);
        soundMuteLines.forEach(l => l.style.display = soundEnabled ? 'none' : 'block');
        soundWaves.forEach(w => w.style.display = soundEnabled ? 'block' : 'none');
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      });

      // Window blur/leave
      window.addEventListener('blur', () => {
        if (isRaking) {
          isRaking = false;
          setRakeSound(false);
        }
        draggedStone = null;
        cursorEl.classList.remove('dragging-stone');
      });

      document.body.addEventListener('mouseleave', () => {
        cursorEl.classList.remove('active');
        if (isRaking) {
          isRaking = false;
          setRakeSound(false);
        }
      });

      // --- Attach Event Listeners ---
      window.addEventListener('resize', handleResize);
      window.addEventListener('pointerdown', onPointerDown, { passive: false });
      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('pointerup', onPointerUp, { passive: true });
      window.addEventListener('pointercancel', onPointerUp, { passive: true });

      // Prevent gestures from scrolling on mobile
      window.addEventListener('touchmove', (e) => {
        if (e.target === canvas) e.preventDefault();
      }, { passive: false });

      // --- Initialization ---
      handleResize();
      updateCursorShape();
      preRakeInitialScene();
      requestAnimationFrame(render);

    })();
  </script>
</body>
</html>
