<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Valley of Paper</title>
  <style>
    /* -------------------------------------------------------------
       DESIGN SYSTEM TOKENS & COLOR PALETTES
       ------------------------------------------------------------- */
    :root {
      /* Dusk Palette Defaults */
      --sky-top: #3b2a5c;
      --sky-mid: #c9698a;
      --sky-bot: #f7b26a;

      --sun: #ffd28a;
      --cloud: #f7d5c4;

      --sheet-1: #8b6a9c; /* Far jagged mountains */
      --sheet-2: #6a4f83; /* Mid mountains */
      --sheet-3: #4f3a6b; /* Rolling hills with small pines */
      --sheet-4: #3a2a54; /* Nearer hills with swaying pines */
      --sheet-5: #2b1f44; /* Front ridge with cabin */
      --sheet-6: #1c1533; /* Foreground ground strip with deer */
      --sheet-7: #130f26; /* Deepest foreground ground base */

      /* Paper UI Palette */
      --paper-bg: #f6ead6;
      --paper-ink: #3b2a2a;
      --paper-tape: rgba(246, 240, 226, 0.72);

      /* Dynamic Slider-driven Parameters */
      --stars: 0;
      --sun-y: 0px;
      --moon-y: 0px;
      --window-glow: rgba(255, 200, 110, 0.15);
      --window-spill: rgba(255, 180, 80, 0.08);

      /* Parallax Offsets */
      --mx: 0px;
      --my: 0px;

      /* Font Stacks */
      --font-rounded: ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Segoe UI', system-ui, sans-serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Roboto Mono', 'Courier New', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--sky-bot);
      font-family: var(--font-sans);
      color: var(--paper-ink);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* -------------------------------------------------------------
       VIEWPORT & BACKGROUND SKY GRADIENT
       ------------------------------------------------------------- */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bot) 100%);
      transition: background 0.6s ease;
    }

    /* Subtle paper texture overlay across sky */
    .viewport::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: radial-gradient(#fff 1px, transparent 1px), radial-gradient(#000 1px, transparent 1px);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
      mix-blend-mode: overlay;
    }

    /* -------------------------------------------------------------
       SCENE SVG & OVERSIZED PARALLAX SIZING
       viewBox 0 0 1600 900, preserveAspectRatio xMidYMax slice,
       oversized by ~6% on each side so parallax never reveals edges.
       ------------------------------------------------------------- */
    .scene-svg {
      position: absolute;
      left: -6%;
      top: -6%;
      width: 112%;
      height: 112%;
      overflow: visible;
      pointer-events: none;
      shape-rendering: geometricPrecision;
    }

    /* -------------------------------------------------------------
       LAYER SHADOWS & PARALLAX TRANSFORMATIONS
       - Distant sheets: drop-shadow(0 10px 8px rgba(20,10,40,0.35))
       - Two nearest sheets: deeper 18px 14px shadow
       - 0.9s ease-out transform transition for buttery glides
       ------------------------------------------------------------- */
    .paper-layer {
      transform: translate(calc(var(--mx, 0px) * var(--p, 1)), calc(var(--my, 0px) * var(--p, 1)));
      transition: transform 0.9s cubic-bezier(0.18, 0.9, 0.32, 1);
      will-change: transform;
    }

    /* Sheet fill transitions for buttery scrubbing */
    .sheet-path,
    .mountain-facet,
    .pine-shape,
    .deer-element,
    .cabin-part,
    .cloud-path,
    .sun-body {
      transition: fill 0.6s cubic-bezier(0.2, 0, 0.1, 1), stroke 0.6s cubic-bezier(0.2, 0, 0.1, 1);
    }

    /* Drop-Shadow Styles per Layer */
    .shadow-distant {
      filter: drop-shadow(0 10px 8px rgba(20, 10, 40, 0.35));
    }

    .shadow-near {
      filter: drop-shadow(0 18px 14px rgba(18, 8, 36, 0.48));
    }

    .shadow-foreground {
      filter: drop-shadow(0 18px 14px rgba(12, 5, 24, 0.58));
    }

    .shadow-cloud {
      filter: drop-shadow(0 8px 7px rgba(20, 10, 40, 0.28));
    }

    .shadow-celestial {
      filter: drop-shadow(0 8px 12px rgba(25, 12, 45, 0.3));
    }

    /* -------------------------------------------------------------
       LAYER (1): TWINKLING STARS
       Driven by --stars (fades in between 35% and 85% of the slider)
       ------------------------------------------------------------- */
    #stars-layer {
      opacity: var(--stars, 0);
      transition: opacity 0.6s ease;
    }

    .star {
      animation: star-twinkle var(--twinkle-dur, 2.5s) ease-in-out infinite alternate;
      animation-delay: var(--twinkle-delay, 0s);
      transform-origin: center;
    }

    @keyframes star-twinkle {
      0% {
        opacity: var(--base-op, 0.7);
        transform: scale(0.75);
      }
      100% {
        opacity: calc(var(--base-op, 0.7) * 0.15);
        transform: scale(0.4);
      }
    }

    /* -------------------------------------------------------------
       LAYER (2) & (3): SUN & MOON
       --sun-y (sun descends 620px), --moon-y (moon rises 700px)
       ------------------------------------------------------------- */
    .sun-group {
      transform: translate(0px, var(--sun-y, 0px));
      transition: transform 0.6s cubic-bezier(0.2, 0, 0.1, 1);
    }

    .moon-group {
      transform: translate(0px, var(--moon-y, 0px));
      transition: transform 0.6s cubic-bezier(0.2, 0, 0.1, 1);
    }

    /* -------------------------------------------------------------
       LAYER (4): THREE DRIFTING PAPER CLOUDS
       translateX keyframes on 140–190s loops
       ------------------------------------------------------------- */
    .cloud-drift-1 {
      animation: drift-cloud-1 150s linear infinite;
    }

    .cloud-drift-2 {
      animation: drift-cloud-2 185s linear infinite;
    }

    .cloud-drift-3 {
      animation: drift-cloud-3 165s linear infinite;
    }

    @keyframes drift-cloud-1 {
      0% { transform: translateX(-420px); }
      100% { transform: translateX(1850px); }
    }

    @keyframes drift-cloud-2 {
      0% { transform: translateX(-480px); }
      100% { transform: translateX(1920px); }
    }

    @keyframes drift-cloud-3 {
      0% { transform: translateX(-440px); }
      100% { transform: translateX(1880px); }
    }

    /* -------------------------------------------------------------
       LAYER (8): NEARER HILLS SWAYING PINES
       Sway ±0.8° on a 6s ease loop, each with a staggered delay
       ------------------------------------------------------------- */
    .pine-sway {
      animation: pine-swaying 6s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }

    @keyframes pine-swaying {
      0% {
        transform: rotate(-0.8deg);
      }
      100% {
        transform: rotate(0.8deg);
      }
    }

    /* -------------------------------------------------------------
       CABIN DETAILS & WINDOW GLOW
       ------------------------------------------------------------- */
    .window-lit {
      fill: var(--window-glow);
      transition: fill 0.6s ease;
    }

    .window-spill-light {
      fill: var(--window-spill);
      transition: fill 0.6s ease;
    }

    /* -------------------------------------------------------------
       PAPER UI COMPONENTS
       ------------------------------------------------------------- */
    .paper-card {
      position: absolute;
      background: var(--paper-bg);
      color: var(--paper-ink);
      border-radius: 6px;
      box-shadow: 0 14px 28px rgba(15, 10, 25, 0.28), 0 4px 10px rgba(15, 10, 25, 0.16);
      transition: background 0.6s ease, color 0.6s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
      z-index: 100;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: auto;
    }

    /* Top-left Paper Label */
    .title-card {
      top: clamp(16px, 3.2vw, 36px);
      left: clamp(16px, 3.2vw, 36px);
      padding: clamp(16px, 2vw, 24px) clamp(20px, 2.4vw, 30px);
      transform: rotate(-1.2deg);
      cursor: default;
      animation: ui-entrance 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) backwards;
    }

    .title-card:hover {
      transform: translateY(-2px) rotate(0deg);
      box-shadow: 0 18px 36px rgba(15, 10, 25, 0.32), 0 6px 14px rgba(15, 10, 25, 0.2);
    }

    /* Translucent strip of paper tape over top edge */
    .title-card .tape-strip {
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%) rotate(0.6deg);
      width: 82px;
      height: 22px;
      background: var(--paper-tape);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-left: 2px dashed rgba(185, 170, 150, 0.5);
      border-right: 2px dashed rgba(185, 170, 150, 0.5);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      pointer-events: none;
    }

    .title-card h1 {
      margin: 0;
      font-family: var(--font-rounded);
      font-size: clamp(1.5rem, 3.4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.015em;
      line-height: 1.1;
    }

    .title-card p {
      margin: 8px 0 0 0;
      font-size: clamp(0.65rem, 1.1vw, 0.76rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      opacity: 0.78;
    }

    /* Bottom-right Paper Panel */
    .control-panel {
      bottom: clamp(16px, 3.2vw, 36px);
      right: clamp(16px, 3.2vw, 36px);
      width: min(390px, calc(100vw - 32px));
      padding: clamp(16px, 2vw, 22px) clamp(18px, 2.2vw, 24px);
      transform: rotate(0.8deg);
      animation: ui-entrance 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) 0.15s backwards;
    }

    .control-panel:hover {
      transform: translateY(-2px) rotate(0deg);
      box-shadow: 0 18px 36px rgba(15, 10, 25, 0.32), 0 6px 14px rgba(15, 10, 25, 0.2);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title {
      font-family: var(--font-rounded);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .clock-readout {
      font-family: var(--font-mono);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(0, 0, 0, 0.05);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* Slider track & thumb */
    .slider-wrapper {
      position: relative;
      margin: 8px 0 6px 0;
    }

    .time-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      outline: none;
      background: linear-gradient(to right, #ffd28a 0%, #f7b26a 25%, #c9698a 50%, #4f3a6b 75%, #0f1c44 100%);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    /* WebKit Thumb */
    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--paper-bg);
      border: 3px solid #3b2a2a;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      cursor: grab;
      transition: border-width 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .time-slider::-webkit-slider-thumb:hover {
      border-width: 4.5px;
      transform: scale(1.14);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
    }

    .time-slider:active::-webkit-slider-thumb {
      cursor: grabbing;
      transform: scale(1.08);
    }

    /* Firefox Thumb */
    .time-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--paper-bg);
      border: 3px solid #3b2a2a;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      cursor: grab;
      transition: border-width 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .time-slider::-moz-range-thumb:hover {
      border-width: 4.5px;
      transform: scale(1.14);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
    }

    .time-slider:active::-moz-range-thumb {
      cursor: grabbing;
      transform: scale(1.08);
    }

    .tick-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.75;
      margin-top: 6px;
    }

    .hint-line {
      margin-top: 10px;
      font-size: 0.68rem;
      opacity: 0.6;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* Device-Tilt Pill Button (for iOS / coarse pointers) */
    .tilt-pill-btn {
      position: absolute;
      top: clamp(16px, 3.2vw, 36px);
      right: clamp(16px, 3.2vw, 36px);
      background: var(--paper-bg);
      color: var(--paper-ink);
      border: 1px solid rgba(0, 0, 0, 0.12);
      outline: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-family: var(--font-rounded);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 18px rgba(20, 10, 35, 0.22);
      cursor: pointer;
      transform: rotate(1deg);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      z-index: 105;
      pointer-events: auto;
    }

    .tilt-pill-btn:hover {
      transform: translateY(-2px) rotate(0deg);
      box-shadow: 0 12px 24px rgba(20, 10, 35, 0.3);
    }

    /* UI Cards Entrance Animation */
    @keyframes ui-entrance {
      from {
        opacity: 0;
        transform: translateY(22px) rotate(0deg);
      }
      to {
        opacity: 1;
      }
    }

    /* Responsive Under 640px */
    @media (max-width: 640px) {
      .control-panel {
        left: 16px;
        right: 16px;
        width: calc(100% - 32px);
        transform: rotate(0deg);
        bottom: 16px;
      }
      .control-panel:hover {
        transform: translateY(-2px) rotate(0deg);
      }
      .title-card {
        transform: rotate(0deg);
      }
      .title-card:hover {
        transform: translateY(-2px) rotate(0deg);
      }
    }

    /* -------------------------------------------------------------
       ACCESSIBILITY & PREFERS-REDUCED-MOTION
       Under prefers-reduced-motion, cloud drift, tree sway, star
       twinkle, entrance animations, and the smoothing loop are
       disabled (the slider still recolours everything).
       ------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .cloud-drift-1,
      .cloud-drift-2,
      .cloud-drift-3 {
        animation: none !important;
      }

      .pine-sway {
        animation: none !important;
      }

      .star {
        animation: none !important;
      }

      .title-card,
      .control-panel {
        animation: none !important;
        transition: background 0.6s ease, color 0.6s ease !important;
      }

      .paper-layer {
        transform: none !important;
        transition: fill 0.6s ease !important;
      }
    }
  </style>
</head>
<body>
  <main class="viewport" id="viewport">

    <!-- =========================================================
         INLINE SCENE SVG
         viewBox 0 0 1600 900, preserveAspectRatio xMidYMax slice,
         oversized by ~6% on each side so parallax never reveals edges.
         ========================================================= -->
    <svg
      class="scene-svg"
      viewBox="0 0 1600 900"
      preserveAspectRatio="xMidYMax slice"
      aria-label="Valley of Paper Landscape"
      role="img"
    >
      <defs>
        <!-- REUSABLE PINE SYMBOL -->
        <!-- Center trunk at 0, base at 0, height 88, tiered paper silhouette -->
        <symbol id="pine" viewBox="-26 -90 52 90">
          <path
            class="pine-shape"
            d="M 0 -88
               L 11 -64 L 6 -65
               L 18 -42 L 12 -43
               L 25 -17 L 5 -17
               L 4 0 L -4 0
               L -5 -17 L -25 -17
               L -12 -43 L -18 -42
               L -6 -65 L -11 -64 Z"
            fill="currentColor"
          />
        </symbol>

        <!-- WIDE RADIAL GLOW FOR SUN -->
        <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--sun)" stop-opacity="0.8"/>
          <stop offset="30%" stop-color="var(--sun)" stop-opacity="0.4"/>
          <stop offset="65%" stop-color="var(--sun)" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="var(--sun)" stop-opacity="0"/>
        </radialGradient>

        <!-- SOFT MOON GLOW -->
        <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.5"/>
          <stop offset="45%" stop-color="#fff4d4" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#fff4d4" stop-opacity="0"/>
        </radialGradient>

        <!-- CRESCENT PAPER MOON MASK (Disc with a masked bite) -->
        <mask id="moon-bite-mask">
          <!-- White reveals full disc -->
          <circle cx="0" cy="0" r="35" fill="#ffffff" />
          <!-- Black bite cuts away inner crescent curve -->
          <circle cx="13" cy="-7" r="29" fill="#000000" />
        </mask>

        <!-- CABIN WINDOW GROUND SPILL GRADIENT -->
        <radialGradient id="window-spill-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb854" stop-opacity="0.6"/>
          <stop offset="60%" stop-color="#ff9030" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#ff9030" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- =======================================================
           (1) STARS LAYER (--p: 0.10)
           140 tiny twinkling stars generated dynamically by JS
           ======================================================= -->
      <g id="stars-layer" class="paper-layer" style="--p: 0.10;">
        <g id="stars-group"></g>
      </g>

      <!-- =======================================================
           (2) PAPER SUN LAYER (--p: 0.16)
           70px disc with wide radial glow that sinks 620px
           ======================================================= -->
      <g id="sun-layer" class="paper-layer" style="--p: 0.16;">
        <g class="sun-group shadow-celestial">
          <!-- Radial glow halo (320px diameter) -->
          <circle cx="380" cy="220" r="160" fill="url(#sun-glow)" />
          <!-- 70px paper cut disc (r=35) -->
          <circle class="sun-body" cx="380" cy="220" r="35" fill="var(--sun)" />
          <!-- Subtle layered paper rim -->
          <circle cx="380" cy="220" r="34" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
        </g>
      </g>

      <!-- =======================================================
           (3) CRESCENT PAPER MOON LAYER (--p: 0.22)
           Disc with a masked bite that rises 700px
           ======================================================= -->
      <g id="moon-layer" class="paper-layer" style="--p: 0.22;">
        <!-- Base positioned at y=840; rising 700px brings it up to y=140 -->
        <g class="moon-group shadow-celestial" transform="translate(1220, 840)">
          <!-- Moon soft glow halo -->
          <circle cx="0" cy="0" r="105" fill="url(#moon-glow)" />
          <!-- Paper crescent cut card -->
          <circle cx="0" cy="0" r="35" fill="#fff9eb" mask="url(#moon-bite-mask)" />
          <!-- Subtle inner crescent accent edge -->
          <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" mask="url(#moon-bite-mask)" />
        </g>
      </g>

      <!-- =======================================================
           (4) THREE DRIFTING PAPER CLOUDS (--p: 0.28)
           Cubic-bezier blob paths on 140–190s loops
           ======================================================= -->
      <g id="clouds-layer" class="paper-layer shadow-cloud" style="--p: 0.28;">
        <!-- Cloud 1: High sky, loop 150s, negative delay for natural spread -->
        <g class="cloud-drift-1" style="animation-delay: -52s;">
          <path
            class="cloud-path"
            d="M 60 70
               C 60 46, 88 30, 118 35
               C 134 16, 172 14, 200 32
               C 226 18, 266 24, 282 48
               C 312 44, 342 62, 338 88
               C 350 106, 338 126, 314 130
               C 290 135, 78 135, 52 124
               C 32 116, 28 90, 60 70 Z"
            fill="var(--cloud)"
            transform="translate(180, 50) scale(1.05)"
          />
        </g>

        <!-- Cloud 2: Mid-high sky, loop 185s, negative delay -->
        <g class="cloud-drift-2" style="animation-delay: -118s;">
          <path
            class="cloud-path"
            d="M 70 80
               C 64 50, 102 32, 134 44
               C 156 18, 202 14, 234 36
               C 264 22, 308 30, 326 56
               C 362 54, 396 78, 390 110
               C 406 130, 390 154, 358 158
               C 326 162, 92 162, 64 150
               C 38 138, 32 104, 70 80 Z"
            fill="var(--cloud)"
            transform="translate(860, 135) scale(0.92)"
          />
        </g>

        <!-- Cloud 3: Lower sky, loop 165s, negative delay -->
        <g class="cloud-drift-3" style="animation-delay: -28s;">
          <path
            class="cloud-path"
            d="M 50 65
               C 48 40, 78 26, 106 34
               C 124 12, 162 10, 188 28
               C 214 14, 250 20, 268 42
               C 296 40, 326 58, 322 84
               C 334 100, 324 120, 298 124
               C 272 130, 68 130, 46 118
               C 26 108, 22 82, 50 65 Z"
            fill="var(--cloud)"
            transform="translate(480, 210) scale(0.85)"
          />
        </g>
      </g>

      <!-- =======================================================
           (5) FAR JAGGED MOUNTAINS (Sheet 1, --p: 0.42)
           drop-shadow(0 10px 8px rgba(20,10,40,0.35))
           ======================================================= -->
      <g id="sheet-1" class="paper-layer shadow-distant" style="--p: 0.42;">
        <path
          class="sheet-path mountain-shape"
          d="M -100 1000
             L -100 480
             L 60 425
             L 170 460
             L 290 375
             L 380 412
             L 500 325
             L 620 395
             L 730 338
             L 820 375
             L 950 305
             L 1070 388
             L 1190 330
             L 1300 382
             L 1430 315
             L 1550 405
             L 1700 355
             L 1700 1000 Z"
          fill="var(--sheet-1)"
        />
        <!-- Paper crease light facet highlights -->
        <polygon
          class="mountain-facet"
          points="290,375 380,412 335,465 240,430"
          fill="rgba(255,255,255,0.06)"
        />
        <polygon
          class="mountain-facet"
          points="500,325 620,395 560,455 440,405"
          fill="rgba(255,255,255,0.06)"
        />
        <polygon

  <!-- =========================================================
       LOGIC SCRIPT
       - Smoothstep hex color interpolation
       - Custom properties management
       - Exponential smoothing RAF loop for parallax
       - Device tilt & touch panning fallback
       - Seeded random stars generation
       ========================================================= -->
  <script>
    (function () {
      'use strict';

      /* -----------------------------------------------------------
         PALETTE CONFIGURATION
         Exact Dusk & Night hex pairs from prompt specification
         ----------------------------------------------------------- */
      const PALETTES = {
        skyTop:   ['#3b2a5c', '#050a1e'],
        skyMid:   ['#c9698a', '#0f1c44'],
        skyBot:   ['#f7b26a', '#24356a'],
        sun:      ['#ffd28a', '#ff9a5a'],
        cloud:    ['#f7d5c4', '#3a4a7a'],
        sheet1:   ['#8b6a9c', '#2b3a6b'],
        sheet2:   ['#6a4f83', '#1f2c55'],
        sheet3:   ['#4f3a6b', '#182243'],
        sheet4:   ['#3a2a54', '#111935'],
        sheet5:   ['#2b1f44', '#0c122a'],
        sheet6:   ['#1c1533', '#080c1f'],
        sheet7:   ['#130f26', '#050815'],
        paperBg:  ['#f6ead6', '#dfd0be'],
        paperInk: ['#3b2a2a', '#22161f']
      };

      // Fast RGB parsing
      function parseHex(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      const PARSED = {};
      for (const [key, [dusk, night]] of Object.entries(PALETTES)) {
        PARSED[key] = {
          dusk: parseHex(dusk),
          night: parseHex(night)
        };
      }

      function lerpRgb(rgb1, rgb2, t) {
        const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * t);
        const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * t);
        const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function smoothstep(x) {
        const t = Math.max(0, Math.min(1, x));
        return t * t * (3 - 2 * t);
      }

      /* -----------------------------------------------------------
         DOM REFERENCES
         ----------------------------------------------------------- */
      const root = document.documentElement;
      const slider = document.getElementById('time-slider');
      const clockReadout = document.getElementById('clock-readout');
      const starsGroup = document.getElementById('stars-group');

      /* -----------------------------------------------------------
         (1) GENERATE 140 TINY TWINKLING STARS (SEEDED RANDOM)
         ----------------------------------------------------------- */
      function initStars() {
        if (!starsGroup) return;

        // Mulberry32-style deterministic PRNG
        let seed = 9823415;
        function seededRandom() {
          seed = (seed * 1664525 + 1013904223) % 4294967296;
          return seed / 4294967296;
        }

        const fragment = document.createDocumentFragment();
        const count = 140;

        for (let i = 0; i < count; i++) {
          const cx = Math.round(20 + seededRandom() * 1560);
          // Distribute across upper sky with natural tapering
          const cy = Math.round(15 + Math.pow(seededRandom(), 1.3) * 410);
          const r = (0.75 + seededRandom() * 1.5).toFixed(2);
          const baseOp = (0.35 + seededRandom() * 0.65).toFixed(2);
          const dur = (1.8 + seededRandom() * 2.8).toFixed(2);
          const delay = (-seededRandom() * 4.0).toFixed(2);

          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', cx);
          circle.setAttribute('cy', cy);
          circle.setAttribute('r', r);
          circle.setAttribute('fill', '#fffbf2');
          circle.classList.add('star');
          circle.style.setProperty('--base-op', baseOp);
          circle.style.setProperty('--twinkle-dur', `${dur}s`);
          circle.style.setProperty('--twinkle-delay', `${delay}s`);

          fragment.appendChild(circle);
        }

        starsGroup.appendChild(fragment);
      }

      /* -----------------------------------------------------------
         TIME OF DAY UPDATE (SLIDER 0–1000)
         - Linearly interpolates each hex pair with a smoothstep curve
         - Drives --stars (fades in between 35% and 85% of slider)
         - Drives --sun-y (sun descends 620px)
         - Drives --moon-y (moon rises 700px)
         - Drives cabin window glow: faint rgba(255,200,110,0.15)
           to bright rgba(255,160,70,1.0)
         - Live monospace clock: 18:40 to 23:59
         ----------------------------------------------------------- */
      function setTimeOfDay(val) {
        const t = val / 1000;
        const s = smoothstep(t);

        // Interpolate colors
        root.style.setProperty('--sky-top', lerpRgb(PARSED.skyTop.dusk, PARSED.skyTop.night, s));
        root.style.setProperty('--sky-mid', lerpRgb(PARSED.skyMid.dusk, PARSED.skyMid.night, s));
        root.style.setProperty('--sky-bot', lerpRgb(PARSED.skyBot.dusk, PARSED.skyBot.night, s));
        root.style.setProperty('--sun',     lerpRgb(PARSED.sun.dusk,    PARSED.sun.night,    s));
        root.style.setProperty('--cloud',   lerpRgb(PARSED.cloud.dusk,  PARSED.cloud.night,  s));
        root.style.setProperty('--sheet-1', lerpRgb(PARSED.sheet1.dusk, PARSED.sheet1.night, s));
        root.style.setProperty('--sheet-2', lerpRgb(PARSED.sheet2.dusk, PARSED.sheet2.night, s));
        root.style.setProperty('--sheet-3', lerpRgb(PARSED.sheet3.dusk, PARSED.sheet3.night, s));
        root.style.setProperty('--sheet-4', lerpRgb(PARSED.sheet4.dusk, PARSED.sheet4.night, s));
        root.style.setProperty('--sheet-5', lerpRgb(PARSED.sheet5.dusk, PARSED.sheet5.night, s));
        root.style.setProperty('--sheet-6', lerpRgb(PARSED.sheet6.dusk, PARSED.sheet6.night, s));
        root.style.setProperty('--sheet-7', lerpRgb(PARSED.sheet7.dusk, PARSED.sheet7.night, s));
        root.style.setProperty('--paper-bg', lerpRgb(PARSED.paperBg.dusk, PARSED.paperBg.night, s));
        root.style.setProperty('--paper-ink', lerpRgb(PARSED.paperInk.dusk, PARSED.paperInk.night, s));

        // Stars: fades in between 35% and 85% of slider
        let starsVal = 0;
        if (t <= 0.35) {
          starsVal = 0;
        } else if (t >= 0.85) {
          starsVal = 1;
        } else {
          const starProgress = (t - 0.35) / (0.85 - 0.35);
          starsVal = smoothstep(starProgress);
        }
        root.style.setProperty('--stars', starsVal.toFixed(3));

        // Sun descends 620px
        const sunY = (s * 620).toFixed(1);
        root.style.setProperty('--sun-y', `${sunY}px`);

        // Moon rises 700px
        const moonY = (-s * 700).toFixed(1);
        root.style.setProperty('--moon-y', `${moonY}px`);

        // Cabin window glow: faint rgba(255,200,110,0.15) to bright rgba(255,160,70,1.0)
        const winG = Math.round(200 + (160 - 200) * s);
        const winB = Math.round(110 + (70 - 110) * s);
        const winA = (0.15 + (1.0 - 0.15) * s).toFixed(3);
        root.style.setProperty('--window-glow', `rgba(255, ${winG}, ${winB}, ${winA})`);
        root.style.setProperty('--window-spill', `rgba(255, ${winG - 20}, 60, ${(winA * 0.35).toFixed(3)})`);

        // Monospace clock: runs from 18:40 to 23:59
        // 18:40 = 1120 minutes, 23:59 = 1439 minutes
        const totalMinutes = Math.round(1120 + t * (1439 - 1120));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        clockReadout.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
      }

      slider.addEventListener('input', (e) => {
        setTimeOfDay(parseFloat(e.target.value));
      });

      /* -----------------------------------------------------------
         PARALLAX SYSTEM
         Pointer position (normalised −1..1) sets target offset up to 40px;
         smoothed each frame with exponential easing (6% per frame)
         and written to --mx/--my; vertical movement is 60% of horizontal.
         ----------------------------------------------------------- */
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let reducedMotion = prefersReducedMotion.matches;

      prefersReducedMotion.addEventListener('change', (e) => {
        reducedMotion = e.matches;
        if (reducedMotion) {
          targetX = 0;
          targetY = 0;
          currentX = 0;
          currentY = 0;
          root.style.setProperty('--mx', '0px');
          root.style.setProperty('--my', '0px');
        }
      });

      // Pointer Move (Mouse & Stylus)
      window.addEventListener('pointermove', (e) => {
        if (reducedMotion || e.pointerType === 'touch') return;
        const normX = (e.clientX / window.innerWidth) * 2 - 1;
        const normY = (e.clientY / window.innerHeight) * 2 - 1;
        targetX = Math.max(-1, Math.min(1, normX)) * 40;
        targetY = Math.max(-1, Math.min(1, normY)) * 24; // 60% of 40px
      });

      window.addEventListener('pointerleave', () => {
        if (reducedMotion) return;
        targetX = 0;
        targetY = 0;
      });

      /* -----------------------------------------------------------
         DEVICE TILT PARALLAX & TOUCH-DRAG FALLBACK
         - Centred on a 45° holding angle
         - iOS displays "Enable tilt parallax" pill button calling
           DeviceOrientationEvent.requestPermission()
         - Other coarse devices attach listener directly
         - Touch-drag pans when no tilt data is present
         ----------------------------------------------------------- */
      let hasTiltData = false;

      function handleOrientation(e) {
        if (reducedMotion || e.beta === null || e.gamma === null) return;
        hasTiltData = true;

        // Centred on 45° holding angle for pitch (beta)
        const deltaBeta = e.beta - 45;
        const clampedBeta = Math.max(-30, Math.min(30, deltaBeta));
        const clampedGamma = Math.max(-30, Math.min(30, e.gamma));

        const normX = clampedGamma / 30; // -1 to 1
        const normY = clampedBeta / 30;  // -1 to 1

        targetX = normX * 40;
        targetY = normY * 24;
      }

      function attachOrientationListener() {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      // Detect iOS / coarse pointer device
      const isCoarse = window.matchMedia('(pointer: coarse)').matches;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isIOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const tiltBtn = document.createElement('button');
        tiltBtn.className = 'tilt-pill-btn';
        tiltBtn.textContent = 'Enable tilt parallax';
        tiltBtn.setAttribute('aria-label', 'Enable device tilt parallax');
        document.body.appendChild(tiltBtn);

        tiltBtn.addEventListener('click', async () => {
          try {
            const permissionState = await DeviceOrientationEvent.requestPermission();
            if (permissionState === 'granted') {
              attachOrientationListener();
              tiltBtn.remove();
            }
          } catch (err) {
            console.warn('Orientation permission error:', err);
          }
        });
      } else if (isCoarse && window.DeviceOrientationEvent) {
        attachOrientationListener();
      }

      // Touch-drag Pan Fallback (when no tilt data active)
      let touchStartX = 0;
      let touchStartY = 0;
      let isTouching = false;

      window.addEventListener('touchstart', (e) => {
        if (reducedMotion || hasTiltData) return;
        if (e.target.closest('#control-panel, #title-card, .tilt-pill-btn, input')) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        isTouching = true;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isTouching || hasTiltData || reducedMotion) return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const maxRange = Math.min(window.innerWidth, window.innerHeight) * 0.45;
        const normX = Math.max(-1, Math.min(1, dx / maxRange));
        const normY = Math.max(-1, Math.min(1, dy / maxRange));
        targetX = normX * 40;
        targetY = normY * 24;
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!isTouching) return;
        isTouching = false;
        if (!hasTiltData) {
          targetX = 0;
          targetY = 0;
        }
      });

      /* -----------------------------------------------------------
         EXPONENTIAL EASING RAF LOOP (6% PER FRAME)
         ----------------------------------------------------------- */
      function renderParallax() {
        if (!reducedMotion) {
          currentX += (targetX - currentX) * 0.06;
          currentY += (targetY - currentY) * 0.06;
          root.style.setProperty('--mx', `${currentX.toFixed(2)}px`);
          root.style.setProperty('--my', `${currentY.toFixed(2)}px`);
        }
        requestAnimationFrame(renderParallax);
      }

      /* -----------------------------------------------------------
         INITIALIZE
         ----------------------------------------------------------- */
      initStars();
      setTimeOfDay(0);
      requestAnimationFrame(renderParallax);

    })();
  </script>
</body>
</html>
