<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Meridian — An Isometric CSS City Block</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --s: 1;
    --night: 0;
    --shx: 0.5;
    --shy: 0.5;
    --sh-op: 0.45;
    --sky1: #5faaff;
    --sky2: #e1f2ff;
    --sun-x: 50%;
    --sun-y: 15%;
    --sun-op: 1;
    --moon-x: 50%;
    --moon-y: 85%;
    --moon-op: 0;
    --rain-op: 0;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    perspective: 1200px;
    transition: background 0.1s linear;
  }

  /* Star Field */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: var(--night);
    background-image: 
      radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 100px 150px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 240px 80px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 450px 120px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 600px 220px, #fff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 750px 90px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 850px 300px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 980px 180px, #fff, rgba(0,0,0,0)),
      radial-gradient(1px 1px at 1100px 80px, #fff, rgba(0,0,0,0)),
      radial-gradient(1.5px 1.5px at 1300px 240px, #fff, rgba(0,0,0,0));
    background-size: 550px 350px;
    z-index: 1;
    transition: opacity 0.4s ease;
  }

  /* Celestial Bodies */
  .celestial {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    transform: translate(-50%, -50%);
  }
  .sun {
    width: 60px;
    height: 60px;
    left: var(--sun-x);
    top: var(--sun-y);
    opacity: var(--sun-op);
    background: radial-gradient(circle, #fff7d9 0%, #ffc83b 60%, rgba(255, 170, 0, 0) 100%);
    box-shadow: 0 0 40px #ffbb00, 0 0 80px #ffa60088;
  }
  .moon {
    width: 44px;
    height: 44px;
    left: var(--moon-x);
    top: var(--moon-y);
    opacity: var(--moon-op);
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e2e8f0 70%, #cbd5e1 100%);
    box-shadow: 0 0 25px rgba(255,255,255,0.7), 0 0 50px rgba(200,225,255,0.3);
  }

  /* Soft Clouds */
  .cloud-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 100px;
    opacity: calc((1 - var(--night) * 0.75) * 0.85);
    filter: blur(12px);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .c1 {
    width: 220px; height: 60px; top: 12%; left: -250px;
    animation-duration: 95s;
  }
  .c1::before { width: 90px; height: 90px; top: -45px; left: 35px; }
  .c1::after { width: 70px; height: 70px; top: -30px; left: 105px; }

  .c2 {
    width: 320px; height: 80px; top: 28%; left: -350px;
    animation-duration: 125s; animation-delay: -40s;
  }
  .c2::before { width: 130px; height: 130px; top: -65px; left: 50px; }
  .c2::after { width: 100px; height: 100px; top: -45px; left: 160px; }

  .c3 {
    width: 180px; height: 50px; top: 48%; left: -200px;
    animation-duration: 110s; animation-delay: -75s;
  }
  .c3::before { width: 70px; height: 70px; top: -35px; left: 30px; }
  .c3::after { width: 60px; height: 60px; top: -25px; left: 85px; }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 400px)); }
  }

  /* Rain Overlay */
  .rain-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: var(--rain-op);
    transition: opacity 0.5s ease;
  }
  .rain-layer {
    position: absolute;
    inset: -100px;
    background-image: repeating-linear-gradient(105deg, 
      rgba(255,255,255,0) 0%, 
      rgba(255,255,255,0) 92%, 
      rgba(200,230,255,0.4) 94%, 
      rgba(255,255,255,0) 96%);
    background-size: 80px 180px;
    animation: rainDrop 0.65s linear infinite;
  }
  .rain-layer.l2 {
    background-size: 110px 240px;
    animation-duration: 0.5s;
    animation-delay: -0.2s;
    opacity: 0.7;
  }
  @keyframes rainDrop {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-30px, 180px); }
  }

  /* World Viewport & Stage */
  .stage-wrap {
    position: relative;
    z-index: 10;
    transform: scale(var(--s));
    transform-origin: center center;
    transition: transform 0.15s ease-out;
  }

  .stage {
    position: relative;
    width: 540px;
    height: 540px;
    transform: rotateX(60deg) rotateZ(45deg);
    transform-style: preserve-3d;
  }

  /* Ground Plane */
  .ground {
    position: absolute;
    inset: 0;
    border-radius: 36px;
    background-color: #b9d59a;
    background-image:
      /* Cream dashed lines - vertical & horizontal road */
      linear-gradient(90deg, transparent 48.5%, #f4edd3 48.5%, #f4edd3 51.5%, transparent 51.5%),
      linear-gradient(0deg, transparent 48.5%, #f4edd3 48.5%, #f4edd3 51.5%, transparent 51.5%),
      /* Asphalt cross */
      linear-gradient(90deg, transparent 225px, #5b5f6b 225px, #5b5f6b 315px, transparent 315px),
      linear-gradient(0deg, transparent 225px, #5b5f6b 225px, #5b5f6b 315px, transparent 315px),
      /* Sidewalk borders */
      linear-gradient(90deg, transparent 221px, #d9d3c7 221px, #d9d3c7 319px, transparent 319px),
      linear-gradient(0deg, transparent 221px, #d9d3c7 221px, #d9d3c7 319px, transparent 319px);
    background-size: 
      12px 28px, 28px 12px, 
      100% 100%, 100% 100%, 
      100% 100%, 100% 100%;
    background-position: 
      267px 0, 0 267px, 
      0 0, 0 0, 
      0 0, 0 0;
    background-repeat: repeat-y, repeat-x, no-repeat, no-repeat, no-repeat, no-repeat;
    box-shadow: 
      0 0 0 6px #c9c2b4,
      0 0 0 12px #b0a797,
      25px 25px 40px rgba(0, 0, 0, 0.35),
      45px 45px 80px rgba(12, 16, 40, 0.45);
    transform-style: preserve-3d;
  }

  /* Ground Night Tint & Wetness Overlay */
  .ground::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 40px;
    background: rgba(18, 24, 66, 0.88);
    opacity: var(--night);
    pointer-events: none;
    transition: opacity 0.2s linear;
  }

  .ground-wet {
    position: absolute;
    inset: -6px;
    border-radius: 40px;
    background: rgba(10, 20, 40, 0.35);
    opacity: var(--rain-op);
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  /* Foilage / Trees */
  .tree {
    position: absolute;
    width: 24px;
    height: 24px;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .tree-trunk {
    position: absolute;
    width: 6px;
    height: 6px;
    left: 9px;
    top: 9px;
    background: #5a3d28;
    border-radius: 50%;
    transform: translateZ(4px);
  }
  .tree-crown {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #a2dc90 0%, #6ba859 60%, #3d6e37 100%);
    box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
    transform: translateZ(14px);
  }
  .tree-crown::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(18, 24, 66, 0.8);
    opacity: var(--night);
  }

  /* Cars */
  .car {
    position: absolute;
    width: 26px;
    height: 14px;
    border-radius: 4px;
    transform-style: preserve-3d;
    transform: translateZ(2px);
    box-shadow: 1px 2px 4px rgba(0,0,0,0.4);
  }
  .car::before {
    /* Headlight */
    content: '';
    position: absolute;
    right: -2px;
    top: 2px;
    bottom: 2px;
    width: 4px;
    border-radius: 2px;
    background: #fff;
    box-shadow: 4px 0 calc(5px + var(--night) * 10px) calc(2px + var(--night) * 4px) rgba(255, 255, 200, 0.9);
  }
  .car::after {
    /* Taillight */
    content: '';
    position: absolute;
    left: -2px;
    top: 2px;
    bottom: 2px;
    width: 3px;
    border-radius: 2px;
    background: #ff2222;
    box-shadow: -2px 0 calc(3px + var(--night) * 8px) calc(1px + var(--night) * 3px) rgba(255, 30, 30, 0.85);
  }
  .car-roof {
    position: absolute;
    inset: 2px 5px;
    background: rgba(0,0,0,0.2);
    border-radius: 2px;
  }

  .car-coral { background: #ff6e67; animation: carLaneE 8.5s linear infinite; top: 240px; }
  .car-teal  { background: #38bdf8; animation: carLaneW 11s linear infinite; top: 284px; }
  .car-yellow{ background: #facc15; animation: carLaneS 9.5s linear infinite; left: 242px; }
  .car-periwinkle { background: #a5b4fc; animation: carLaneN 12s linear infinite; left: 284px; }

  @keyframes carLaneE {
    0% { transform: translateX(-40px) translateZ(2px); }
    100% { transform: translateX(560px) translateZ(2px); }
  }
  @keyframes carLaneW {
    0% { transform: translateX(560px) rotate(180deg) translateZ(2px); }
    100% { transform: translateX(-40px) rotate(180deg) translateZ(2px); }
  }
  @keyframes carLaneS {
    0% { transform: translateY(-40px) rotate(90deg) translateZ(2px); }
    100% { transform: translateY(560px) rotate(90deg) translateZ(2px); }
  }
  @keyframes carLaneN {
    0% { transform: translateY(560px) rotate(-90deg) translateZ(2px); }
    100% { transform: translateY(-40px) rotate(-90deg) translateZ(2px); }
  }

  /* Dynamic Footprint Shadows */
  .shadow-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transform-style: preserve-3d;
  }
  .b-shadow {
    position: absolute;
    left: calc(var(--x) * 1px);
    top: calc(var(--y) * 1px);
    width: calc(var(--w) * 1px);
    height: calc(var(--d) * 1px);
    background: #111422;
    filter: blur(8px);
    transform-origin: 0 0;
    transform: translate(
      calc(var(--shx) * (var(--h) / 100) * 22px),
      calc(var(--shy) * (var(--h) / 100) * 22px)
    );
    opacity: var(--sh-op);
    border-radius: 4px;
    transition: transform 0.1s linear, opacity 0.2s linear;
  }

  /* Building Slots */
  .slot {
    position: absolute;
    left: calc(var(--x) * 1px);
    top: calc(var(--y) * 1px);
    width: calc(var(--w) * 1px);
    height: calc(var(--d) * 1px);
    transform-style: preserve-3d;
    cursor: pointer;
    outline: none;
    transition: transform 0.45s cubic-bezier(0.2, 1.3, 0.3, 1);
  }

  .slot:hover, .slot:focus-visible {
    transform: translateZ(24px);
    z-index: 500 !important;
  }

  /* Tooltip Paper Tag */
  .tag {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) translateZ(calc(var(--h) * 1px + 28px)) rotateZ(-45deg) rotateX(-60deg);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    padding: 7px 12px;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.1);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    z-index: 1000;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }
  .tag-title {
    font-size: 12px;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.2;
  }
  .tag-meta {
    font-size: 10px;
    font-weight: 500;
    color: #64748b;
    margin-top: 1px;
  }
  .slot:hover .tag, .slot:focus-visible .tag {
    opacity: 1;
    transform: translate(-50%, -50%) translateZ(calc(var(--h) * 1px + 40px)) rotateZ(-45deg) rotateX(-60deg);
  }

  /* Building Faces */
  .face {
    position: absolute;
    transform-origin: 0 0;
    backface-visibility: visible;
  }

  .face-top {
    left: 0;
    top: 0;
    width: calc(var(--w) * 1px);
    height: calc(var(--d) * 1px);
    background: var(--c);
    transform: translateZ(calc(var(--h) * 1px));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45), inset 0 0 12px rgba(0,0,0,0.08);
  }
  .face-top::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(18, 24, 66, 0.85);
    opacity: var(--night);
    transition: opacity 0.2s linear;
  }

  .face-south {
    left: 0;
    top: 0;
    width: calc(var(--w) * 1px);
    height: calc(var(--h) * 1px);
    background: var(--c);
    transform: translateY(calc(var(--d) * 1px)) translateZ(calc(var(--h) * 1px)) rotateX(-90deg);
    filter: brightness(0.96);
  }

  .face-east {
    left: 0;
    top: 0;
    width: calc(var(--d) * 1px);
    height: calc(var(--h) * 1px);
    background: var(--c);
    transform: translateX(calc(var(--w) * 1px)) translateZ(calc(var(--h) * 1px)) rotateZ(90deg) rotateX(-90deg);
    filter: brightness(0.74);
  }

  /* Night Shading Tint on Vertical Faces */
  .face-south::before, .face-east::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(18, 24, 66, 0.85);
    opacity: var(--night);
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.2s linear;
  }

  /* Doors */
  .door {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 18px;
    background: #2b3342;
    border-radius: 3px 3px 0 0;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    z-index: 3;
  }

  /* Window Grids */
  .windows {
    position: absolute;
    inset: 8px 6px;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    gap: 4px;
    z-index: 2;
  }

  .win {
    position: relative;
    border-radius: 1.5px;
    background: linear-gradient(135deg, #a3c9e8 0%, #6891bd 100%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .win::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #ffd58a;
    opacity: 0;
    box-shadow: 0 0 6px #ffa733;
    transition: opacity 0.4s ease;
  }

  .win.v-cream::after {
    background: #ffe9b8;
    box-shadow: 0 0 6px #ffe099;
  }
  .win.v-cool::after {
    background: #cfe6ff;
    box-shadow: 0 0 6px #9bc8ff;
  }

  .win.on::after {
    opacity: calc(var(--night) * 0.96);
  }

  /* Neon Marquee on Night Market */
  .neon-marquee {
    position: absolute;
    left: 50%;
    top: -16px;
    transform: translateX(-50%) translateZ(46px) rotateZ(-45deg) rotateX(-60deg);
    background: #2a2038;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #ff5fb8;
    box-shadow: 0 0 8px rgba(255, 95, 184, 0.4);
    pointer-events: none;
    z-index: 300;
    animation: neonBob 3.5s ease-in-out infinite alternate;
  }
  .neon-marquee span {
    font-family: "Georgia", "Times New Roman", serif;
    font-style: italic;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #ff5fb8;
    text-shadow: 
      0 0 2px #fff,
      0 0 6px #ff5fb8,
      0 0 12px #ff007f;
    animation: neonFlicker 4s steps(1) infinite;
  }

  @keyframes neonBob {
    0% { transform: translateX(-50%) translateZ(46px) rotateZ(-45deg) rotateX(-60deg) translateY(0); }
    100% { transform: translateX(-50%) translateZ(46px) rotateZ(-45deg) rotateX(-60deg) translateY(-4px); }
  }
  @keyframes neonFlicker {
    0%, 100% { opacity: 1; }
    42% { opacity: 0.85; }
    43% { opacity: 0.3; }
    44% { opacity: 1; }
    78% { opacity: 1; }
    79% { opacity: 0.4; }
    80% { opacity: 0.9; }
  }

  /* HUD / Interface */
  .hud-clock {
    position: fixed;
    top: 20px;
    right: 24px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 18px;
    border-radius: 30px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    z-index: 1000;
    color: #1e293b;
  }
  .clock-time {
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 20px;
    font-weight: 700;
    min-width: 76px;
  }
  .clock-phase {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    color: #64748b;
  }

  .toolbar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 6px;
    border-radius: 40px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    z-index: 1000;
  }

  .btn {
    border: none;
    background: transparent;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: #334155;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.9);
    color: #0f172a;
  }
  .btn:focus-visible {
    box-shadow: 0 0 0 2px #3b82f6;
  }
  .btn[aria-pressed="true"] {
    background: #1e293b;
    color: #fff;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  /* Reduced Motion */
  @media (prefers-reduced-motion: reduce) {
    .cloud, .car, .neon-marquee, .neon-marquee span, .rain-layer {
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <!-- Assistive Live Region -->
  <div id="live-announcer" class="sr-only" aria-live="polite"></div>

  <!-- Background Sky Atmosphere Elements -->
  <div class="stars" aria-hidden="true"></div>
  <div class="celestial sun" aria-hidden="true"></div>
  <div class="celestial moon" aria-hidden="true"></div>

  <div class="cloud-layer" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <div class="rain-overlay" aria-hidden="true">
    <div class="rain-layer l1"></div>
    <div class="rain-layer l2"></div>
  </div>

  <!-- Isometric Viewport -->
  <div class="stage-wrap" id="stage-wrap">
    <div class="stage">
      
      <!-- Ground Floor -->
      <div class="ground">
        <div class="ground-wet"></div>

        <!-- Trees -->
        <div class="tree" style="left: 30px; top: 30px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 170px; top: 180px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 480px; top: 40px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 340px; top: 180px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 40px; top: 340px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 180px; top: 480px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 480px; top: 350px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>
        <div class="tree" style="left: 350px; top: 470px;"><div class="tree-trunk"></div><div class="tree-crown"></div></div>

        <!-- Cars -->
        <div class="car car-coral" aria-hidden="true"><div class="car-roof"></div></div>
        <div class="car car-teal" aria-hidden="true"><div class="car-roof"></div></div>
        <div class="car car-yellow" aria-hidden="true"><div class="car-roof"></div></div>
        <div class="car car-periwinkle" aria-hidden="true"><div class="car-roof"></div></div>
      </div>

      <!-- Footprint Shadows Layer -->
      <div class="shadow-layer" id="shadow-layer" aria-hidden="true"></div>

      <!-- Buildings Slot Layer -->
      <!-- NW Quadrant -->
      <div class="slot" tabindex="0" role="button" data-name="Harbor Tower" data-floors="22" data-desc="Commercial Offices"
           style="--x: 35; --y: 65; --w: 75; --d: 75; --h: 220; --c: #a9b7c9;" data-rows="14" data-cols="4"></div>
      
      <div class="slot" tabindex="0" role="button" data-name="Marigold Flats" data-floors="12" data-desc="Residential Lofts"
           style="--x: 125; --y: 35; --w: 75; --d: 55; --h: 120; --c: #e9c1a0;" data-rows="8" data-cols="4"></div>

      <div class="slot" tabindex="0" role="button" data-name="Linden Court" data-floors="9" data-desc="Townhouses"
           style="--x: 125; --y: 110; --w: 65; --d: 65; --h: 90; --c: #b9d4c2;" data-rows="6" data-cols="4"></div>

      <!-- NE Quadrant -->
      <div class="slot" tabindex="0" role="button" data-name="The Prism" data-floors="16" data-desc="Design Incubator"

      <div class="slot" tabindex="0" role="button" data-name="Cobalt Works" data-floors="11" data-desc="Co-working Space"
           style="--x: 430; --y: 65; --w: 65; --d: 90; --h: 110; --c: #9fb8d8;" data-rows="7" data-cols="4"></div>

      <!-- SW Quadrant -->
      <div class="slot" tabindex="0" role="button" data-name="Pillow Bank" data-floors="8" data-desc="Financial Trust"
           style="--x: 45; --y: 345; --w: 80; --d: 60; --h: 80; --c: #e8dcc4;" data-rows="5" data-cols="5"></div>

      <div class="slot" tabindex="0" role="button" data-name="Ferris Apartments" data-floors="15" data-desc="Micro-apartments"
           style="--x: 140; --y: 345; --w: 55; --d: 80; --h: 150; --c: #dcb3b8;" data-rows="10" data-cols="3"></div>

      <div class="slot" tabindex="0" role="button" data-name="Saltbox Studios" data-floors="7" data-desc="Audio & Art Lab"
           style="--x: 55; --y: 425; --w: 70; --d: 65; --h: 70; --c: #c3ccb0;" data-rows="4" data-cols="4"></div>

      <!-- SE Quadrant -->
      <div class="slot" tabindex="0" role="button" data-name="Aurora Spire" data-floors="26" data-desc="Luxury Penthouse & Observatory"
           style="--x: 345; --y: 345; --w: 60; --d: 60; --h: 260; --c: #a8cfd0;" data-rows="18" data-cols="3"></div>

      <div class="slot" tabindex="0" role="button" data-name="Tin Roof Diner" data-floors="3" data-desc="24/7 Breakfast Club"
           style="--x: 425; --y: 345; --w: 75; --d: 45; --h: 35; --c: #ecd9a1;" data-rows="2" data-cols="5"></div>

      <div class="slot" tabindex="0" role="button" data-name="Meridian House" data-floors="18" data-desc="Municipal Archive"
           style="--x: 390; --y: 410; --w: 90; --d: 75; --h: 180; --c: #cfc5d6;" data-rows="12" data-cols="5"></div>

    </div>
  </div>

  <!-- HUD Interface -->
  <header class="hud-clock">
    <span class="clock-time" id="clock-time">12:00 PM</span>
    <span class="clock-phase" id="clock-phase">High Noon</span>
  </header>

  <nav class="toolbar" aria-label="Controls">
    <button class="btn" id="btn-pause" aria-pressed="false">Pause</button>
    <button class="btn" id="btn-rain" aria-pressed="false">Rain</button>
    <button class="btn" id="btn-skip">Skip Phase</button>
  </nav>

<script>
  /* --- Viewport Scale Calculation --- */
  function updateScale() {
    const minD = Math.min(window.innerWidth, window.innerHeight);
    let s = minD / 760;
    s = Math.max(0.42, Math.min(1.7, s));
    document.documentElement.style.setProperty('--s', s.toFixed(3));
  }
  window.addEventListener('resize', updateScale);
  updateScale();

  /* --- Construct Building Faces & Footprint Shadows --- */
  const shadowLayer = document.getElementById('shadow-layer');
  const slots = document.querySelectorAll('.slot');
  const announcer = document.getElementById('live-announcer');

  slots.forEach((slot) => {
    const name = slot.dataset.name;
    const floors = slot.dataset.floors;
    const desc = slot.dataset.desc;
    const rows = parseInt(slot.dataset.rows, 10) || 4;
    const cols = parseInt(slot.dataset.cols, 10) || 4;

    slot.setAttribute('aria-label', `${name}, ${floors} floors, ${desc}`);

    // Create shadow element
    const shadow = document.createElement('div');
    shadow.className = 'b-shadow';
    shadow.style.setProperty('--x', slot.style.getPropertyValue('--x'));
    shadow.style.setProperty('--y', slot.style.getPropertyValue('--y'));
    shadow.style.setProperty('--w', slot.style.getPropertyValue('--w'));
    shadow.style.setProperty('--d', slot.style.getPropertyValue('--d'));
    shadow.style.setProperty('--h', slot.style.getPropertyValue('--h'));
    shadowLayer.appendChild(shadow);

    // Create 3D faces
    const topFace = document.createElement('div');
    topFace.className = 'face face-top';

    const southFace = document.createElement('div');
    southFace.className = 'face face-south';
    southFace.style.setProperty('--cols', cols);
    southFace.style.setProperty('--rows', rows);

    const eastFace = document.createElement('div');
    eastFace.className = 'face face-east';
    eastFace.style.setProperty('--cols', Math.max(2, Math.round(cols * 0.75)));
    eastFace.style.setProperty('--rows', rows);

    // Door on South Face
    const door = document.createElement('div');
    door.className = 'door';
    southFace.appendChild(door);

    // Window Grids Helper
    function buildWindows(container, count) {
      const winGrid = document.createElement('div');
      winGrid.className = 'windows';
      for (let i = 0; i < count; i++) {
        const w = document.createElement('div');
        w.className = 'win';
        const rand = Math.random();
        if (rand < 0.15) w.classList.add('v-cream');
        else if (rand < 0.3) w.classList.add('v-cool');
        if (Math.random() < 0.55) w.classList.add('on');
        winGrid.appendChild(w);
      }
      container.appendChild(winGrid);
    }

    buildWindows(southFace, rows * cols);
    buildWindows(eastFace, rows * Math.max(2, Math.round(cols * 0.75)));

    // Tooltip Tag
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = `<div class="tag-title">${name}</div><div class="tag-meta">${floors} Floors • ${desc}</div>`;

    slot.appendChild(topFace);
    slot.appendChild(southFace);
    slot.appendChild(eastFace);
    slot.appendChild(tag);

    // Marquee on Night Market
    if (name === 'Night Market') {
      const marquee = document.createElement('div');
      marquee.className = 'neon-marquee';
      marquee.innerHTML = '<span>NIGHT MARKET</span>';
      slot.appendChild(marquee);
    }

    // Hover / Focus Voice Over
    slot.addEventListener('mouseenter', () => announce(name, floors, desc));
    slot.addEventListener('focus', () => announce(name, floors, desc));
  });

  function announce(name, floors, desc) {
    announcer.textContent = `${name}, ${floors} floors, ${desc}`;
  }

  /* --- Day / Night Cycle Interpolator --- */
  // 9 distinct phases over 120,000ms (2 minutes)
  const CYCLE_DURATION = 120000;
  let cycleTime = 40000; // start near high noon
  let isPaused = false;
  let isRaining = false;

  const keyframes = [
    { t: 0.00, sky1: [12, 16, 40],   sky2: [30, 34, 70],   night: 1,    phase: "Midnight",       shx: 0,    shy: 0,   shop: 0.1 },
    { t: 0.18, sky1: [32, 28, 68],   sky2: [72, 45, 95],   night: 0.85, phase: "Deep Dawn",      shx: -1.2, shy: 0.4, shop: 0.2 },
    { t: 0.25, sky1: [95, 60, 110],  sky2: [220, 120, 100],night: 0.45, phase: "Sunrise",        shx: -1.6, shy: 0.6, shop: 0.4 },
    { t: 0.32, sky1: [255, 150, 110],sky2: [255, 215, 170],night: 0.15, phase: "Golden Morning", shx: -1.1, shy: 0.5, shop: 0.5 },
    { t: 0.50, sky1: [95, 170, 255], sky2: [225, 242, 255],night: 0,    phase: "High Noon",      shx: 0.2,  shy: 0.2, shop: 0.45 },
    { t: 0.68, sky1: [120, 180, 250],sky2: [255, 220, 180],night: 0.1,   phase: "Late Afternoon", shx: 1.0,  shy: 0.4, shop: 0.45 },
    { t: 0.75, sky1: [255, 120, 80], sky2: [240, 170, 100],night: 0.35, phase: "Amber Dusk",     shx: 1.6,  shy: 0.6, shop: 0.4 },
    { t: 0.82, sky1: [120, 50, 110], sky2: [55, 30, 80],   night: 0.75, phase: "Plum Evening",   shx: 1.2,  shy: 0.3, shop: 0.25 },
    { t: 1.00, sky1: [12, 16, 40],   sky2: [30, 34, 70],   night: 1,    phase: "Midnight",       shx: 0,    shy: 0,   shop: 0.1 }
  ];

  function smoothstep(min, max, value) {
    const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
    return x * x * (3 - 2 * x);
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function lerpColor(c1, c2, t) {
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t))
    ];
  }

  const clockTimeEl = document.getElementById('clock-time');
  const clockPhaseEl = document.getElementById('clock-phase');

  let lastRaf = performance.now();

  function tick(now) {
    const dt = now - lastRaf;
    lastRaf = now;

    if (!isPaused) {
      cycleTime = (cycleTime + dt) % CYCLE_DURATION;
    }

    const progress = cycleTime / CYCLE_DURATION;

    // Find keyframe interval
    let k1 = keyframes[0];
    let k2 = keyframes[keyframes.length - 1];
    for (let i = 0; i < keyframes.length - 1; i++) {
      if (progress >= keyframes[i].t && progress <= keyframes[i + 1].t) {
        k1 = keyframes[i];
        k2 = keyframes[i + 1];
        break;
      }
    }

    const span = k2.t - k1.t;
    const factor = span === 0 ? 0 : smoothstep(0, 1, (progress - k1.t) / span);

    // Interpolate parameters
    const sky1 = lerpColor(k1.sky1, k2.sky1, factor);
    const sky2 = lerpColor(k1.sky2, k2.sky2, factor);
    const night = lerp(k1.night, k2.night, factor);
    const shx = lerp(k1.shx, k2.shx, factor);
    const shy = lerp(k1.shy, k2.shy, factor);
    const shop = isRaining ? 0.15 : lerp(k1.shop, k2.shop, factor);

    // Apply Root CSS vars
    const root = document.documentElement;
    root.style.setProperty('--sky1', `rgb(${sky1[0]},${sky1[1]},${sky1[2]})`);
    root.style.setProperty('--sky2', `rgb(${sky2[0]},${sky2[1]},${sky2[2]})`);
    root.style.setProperty('--night', night.toFixed(3));
    root.style.setProperty('--shx', shx.toFixed(3));
    root.style.setProperty('--shy', shy.toFixed(3));
    root.style.setProperty('--sh-op', shop.toFixed(3));

    // Celestial positions (Sun rises at 0.25 East->West, Moon rises at 0.75)
    // Map progress to Sun Arc [0.2 -> 0.8]
    const sunProg = (progress - 0.2) / 0.6; // 0 to 1 during day
    if (sunProg >= 0 && sunProg <= 1) {
      const sunRad = sunProg * Math.PI;
      const sunX = 15 + sunProg * 70;
      const sunY = 85 - Math.sin(sunRad) * 72;
      const sunOp = Math.sin(sunRad) * 1.2;
      root.style.setProperty('--sun-x', `${sunX}%`);
      root.style.setProperty('--sun-y', `${sunY}%`);
      root.style.setProperty('--sun-op', Math.max(0, Math.min(1, sunOp)).toFixed(2));
    } else {
      root.style.setProperty('--sun-op', '0');
    }

    // Moon Arc
    const moonProg = (progress < 0.25) ? (progress + 0.75) : ((progress - 0.25) / 1.0);
    const moonNorm = ((progress + 0.3) % 1.0);
    const moonRad = moonNorm * Math.PI;
    const moonX = 15 + moonNorm * 70;
    const moonY = 85 - Math.sin(moonRad) * 70;
    const moonOp = Math.sin(moonRad) * 1.1;
    root.style.setProperty('--moon-x', `${moonX}%`);
    root.style.setProperty('--moon-y', `${moonY}%`);
    root.style.setProperty('--moon-op', Math.max(0, Math.min(1, (moonOp * night))).toFixed(2));

    // Simulated Clock formatting
    const totalSimMinutes = Math.floor(progress * 1440);
    const hours24 = Math.floor(totalSimMinutes / 60);
    const mins = totalSimMinutes % 60;
    const period = hours24 >= 12 ? 'PM' : 'AM';
    const displayHours = hours24 % 12 === 0 ? 12 : hours24 % 12;
    const displayMins = mins < 10 ? '0' + mins : mins;

    clockTimeEl.textContent = `${displayHours}:${displayMins} ${period}`;
    clockPhaseEl.textContent = k1.phase;

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* --- Random Window Light Sparkler --- */
  const allWindows = Array.from(document.querySelectorAll('.win'));
  setInterval(() => {
    if (document.hidden) return;
    for (let i = 0; i < 4; i++) {
      const target = allWindows[Math.floor(Math.random() * allWindows.length)];
      if (target) {
        target.classList.toggle('on');
      }
    }
  }, 380);

  /* --- Toolbar Actions & Shortcuts --- */
  const pauseBtn = document.getElementById('btn-pause');
  const rainBtn = document.getElementById('btn-rain');
  const skipBtn = document.getElementById('btn-skip');

  function togglePause() {
    isPaused = !isPaused;
    pauseBtn.setAttribute('aria-pressed', isPaused ? 'true' : 'false');
    pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
  }

  function toggleRain() {
    isRaining = !isRaining;
    rainBtn.setAttribute('aria-pressed', isRaining ? 'true' : 'false');
    document.documentElement.style.setProperty('--rain-op', isRaining ? '1' : '0');
  }

  function skipPhase() {
    // Skip to next Day or Night phase
    const progress = cycleTime / CYCLE_DURATION;
    if (progress < 0.45 || progress > 0.85) {
      // It is currently night/dusk -> Skip to midday
      cycleTime = CYCLE_DURATION * 0.48;
    } else {
      // It is currently day -> Skip to deep night
      cycleTime = CYCLE_DURATION * 0.96;
    }
  }

  pauseBtn.addEventListener('click', togglePause);
  rainBtn.addEventListener('click', toggleRain);
  skipBtn.addEventListener('click', skipPhase);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePause();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      toggleRain();
    }
  });

  // Honor Reduced Motion System Setting
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    isPaused = true;
    pauseBtn.setAttribute('aria-pressed', 'true');
    pauseBtn.textContent = 'Resume';
  }
</script>
</body>
</html>
