<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Composer — A De Stijl Generator</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --mondrian-red: #d7301f;
      --mondrian-blue: #1e4d9b;
      --mondrian-yellow: #f2c40f;
      --mondrian-black: #161616;
      --mondrian-white: #f6f3ec;
      --gutter-black: #1a1a1a;
      --ease-mondrian: cubic-bezier(0.65, 0, 0.25, 1);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 80px;
      font-family: Georgia, 'Iowan Old Style', Palatino, serif;
      background:
        radial-gradient(ellipse 65% 55% at 50% 22%, rgba(255, 248, 230, 0.75) 0%, rgba(255, 248, 230, 0) 70%),
        linear-gradient(to bottom, #cfc8bb 0%, #d9d3c7 45%, #c8c1b3 78%, #6b6358 78%, #5a5248 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      color: #1a1a1a;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.02) 0px, rgba(0, 0, 0, 0.02) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: multiply;
      z-index: 100;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      z-index: 10;
    }

    header h1 {
      font-size: 2.1rem;
      font-weight: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #222;
      margin-bottom: 4px;
    }

    header p {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #555;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 34px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.4);
      padding: 12px 24px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 2px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      backdrop-filter: blur(4px);
    }

    .btn {
      position: relative;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 18px;
      background: #faf7f0;
      color: #1a1a1a;
      border: 2px solid #1a1a1a;
      box-shadow: 4px 4px 0 #1a1a1a;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      transition: color 200ms ease, transform 100ms ease, box-shadow 100ms ease;
      z-index: 1;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      transform: translateY(100%);
      transition: transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: -1;
    }

    .btn:hover {
      color: #faf7f0;
    }

    .btn:hover::before {
      transform: translateY(0);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #1a1a1a;
    }

    .btn.active {
      background: #1a1a1a;
      color: #f2c40f;
    }

    .btn.active::before {
      transform: translateY(0);
      background: #1a1a1a;
    }

    .control-slider {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #222;
      font-weight: 600;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 6px;
      background: #2a2a2a;
      outline: none;
      border-radius: 0;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--mondrian-red);
      border: 2px solid #1a1a1a;
      cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: var(--mondrian-red);
      border: 2px solid #1a1a1a;
      cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      border-radius: 0;
    }

    /* Easel & Outer Frame */
    .frame-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .easel-frame {
      width: min(92vw, 720px);
      height: min(92vw, 720px);
      background: linear-gradient(135deg, #2b2b2b 0%, #0d0d0d 35%, #202020 70%, #050505 100%);
      padding: min(4.5vw, 34px);
      box-shadow: 
        0 28px 65px rgba(0, 0, 0, 0.48),
        0 10px 24px rgba(0, 0, 0, 0.32),
        inset 0 0 0 2px rgba(255, 255, 255, 0.12),
        inset 0 0 15px rgba(0, 0, 0, 0.95);
      position: relative;
      transition: transform 900ms var(--ease-mondrian);
      will-change: transform;
    }

    /* Diagonal Glass Glare */
    .easel-frame::after {
      content: "";
      position: absolute;
      inset: min(4.5vw, 34px);
      background: linear-gradient(125deg, 
        rgba(255, 255, 255, 0.18) 0%, 
        rgba(255, 255, 255, 0.08) 26%, 
        rgba(255, 255, 255, 0) 45%, 
        rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      z-index: 15;
    }

    /* Mondrian Grid Canvas */
    .painting-grid {
      width: 100%;
      height: 100%;
      background-color: var(--gutter-black);
      display: grid;
      gap: 10px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
      transition: grid-template-columns 1100ms var(--ease-mondrian), grid-template-rows 1100ms var(--ease-mondrian);
    }

    .painting-grid.breathing {
      transition: none !important;
    }

    /* Cells */
    .grid-cell {
      border: none;
      outline: none;
      margin: 0;
      padding: 0;
      cursor: pointer;
      position: relative;
      background-color: var(--mondrian-white);
      transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), background-color 380ms ease, opacity 400ms ease;
      will-change: transform, background-color;
      display: block;
    }

    .grid-cell:hover {
      transform: scale(0.985);
      z-index: 2;
    }

    .grid-cell.cell-enter {
      opacity: 0;
      transform: scale(0.88);
    }

    .grid-cell.cell-visible {
      opacity: 1;
      transform: scale(1);
    }

    .grid-cell.cell-visible:hover {
      transform: scale(0.985);
    }

    /* Cell Texture and Sheens */
    .grid-cell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.015) 0px, rgba(0, 0, 0, 0.015) 1px, transparent 1px, transparent 2px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.015) 0px, rgba(0, 0, 0, 0.015) 1px, transparent 1px, transparent 2px);
      opacity: 1;
    }

    .grid-cell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(0, 0, 0, 0.12) 100%);
      opacity: 0;
      transition: opacity 380ms ease;
    }

    .grid-cell[data-color="red"] { background-color: var(--mondrian-red); }
    .grid-cell[data-color="blue"] { background-color: var(--mondrian-blue); }
    .grid-cell[data-color="yellow"] { background-color: var(--mondrian-yellow); }
    .grid-cell[data-color="black"] { background-color: var(--mondrian-black); }
    .grid-cell[data-color="white"] { background-color: var(--mondrian-white); }

    .grid-cell[data-color="red"]::after,
    .grid-cell[data-color="blue"]::after,
    .grid-cell[data-color="yellow"]::after,
    .grid-cell[data-color="black"]::after {
      opacity: 1;
    }

    /* Museum Wall Plate */
    .wall-plate {
      margin-top: 36px;
      background: linear-gradient(to bottom right, #faf7f0, #f3efe6);
      border: 1px solid #c9c2b4;
      padding: 18px 28px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12), inset 0 0 10px rgba(255, 255, 255, 0.7);
      position: relative;
      min-width: 290px;
      max-width: 480px;
      text-align: left;
    }

    /* Screws */
    .plate-screw {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b5ad9e;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.7);
      top: 50%;
      transform: translateY(-50%);
    }

    .plate-screw::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 1px;
      width: 4px;
      height: 1px;
      background: #4a443b;
    }

    .plate-screw.left { left: 10px; transform: translateY(-50%) rotate(34deg); }
    .plate-screw.right { right: 10px; transform: translateY(-50%) rotate(-48deg); }

    .plate-content {
      transition: opacity 320ms ease;
      opacity: 1;
    }

    .plate-content.updating {
      opacity: 0;
    }

    .plate-artist {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 5px;
    }

    .plate-title {
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.35;
      color: #0f0f0f;
      margin-bottom: 4px;
    }

    .plate-meta {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 0.63rem;
      color: #6a645b;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .easel-frame,
      .painting-grid,
      .grid-cell,
      .btn,
      .plate-content {
        transition: none !important;
        animation: none !important;
      }
      .grid-cell.cell-enter {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Composer</h1>
    <p>A De Stijl Generative System</p>
  </header>

  <div class="controls">
    <button class="btn" id="btn-new" title="Shortcut: N">New Composition</button>
    <div class="control-slider">
      <label for="depth-slider">Depth</label>
      <input type="range" id="depth-slider" min="2" max="7" value="5">
      <span id="depth-display" style="width: 14px; font-variant-numeric: tabular-nums;">5</span>
    </div>
    <button class="btn" id="btn-animate" title="Shortcut: A">Animate</button>
  </div>

  <div class="frame-assembly">
    <div class="easel-frame" id="easel-frame">
      <div class="painting-grid" id="grid-canvas"></div>
    </div>

    <div class="wall-plate">
      <div class="plate-screw left"></div>
      <div class="plate-screw right"></div>
      <div class="plate-content" id="plate-content">
        <div class="plate-artist">Piet Anonymous (b. 1872)</div>
        <div class="plate-title" id="art-title">Composition No. I</div>
        <div class="plate-meta" id="art-meta">1921 &bull; Oil on canvas &bull; 72 &times; 72 cm</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const GRID_SIZE = 16;
      const gridCanvas = document.getElementById('grid-canvas');
      const easelFrame = document.getElementById('easel-frame');
      const depthSlider = document.getElementById('depth-slider');
      const depthDisplay = document.getElementById('depth-display');
      const btnNew = document.getElementById('btn-new');
      const btnAnimate = document.getElementById('btn-animate');
      const artTitle = document.getElementById('art-title');
      const artMeta = document.getElementById('art-meta');
      const plateContent = document.getElementById('plate-content');

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let maxDepth = parseInt(depthSlider.value, 10);
      let baseCols = [];
      let baseRows = [];
      let isBreathing = false;
      let animFrameId = null;
      let animStartTime = 0;
      const COLOR_CYCLE = ['white', 'red', 'blue', 'yellow', 'black'];

      function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function generateTrackWeights() {
        const weights = [];
        for (let i = 0; i < GRID_SIZE; i++) {
          const roll = Math.random();
          let w;
          if (roll < 0.14) {
            w = 0.45 + Math.random() * 0.25; // Narrow
          } else if (roll < 0.32) {
            w = 1.5 + Math.random() * 0.7;  // Broad
          } else {
            w = 0.8 + Math.random() * 0.5;  // Moderate standard
          }
          weights.push(w);
        }
        return weights;
      }

      function createSubdivision(x1, x2, y1, y2, depth) {
        const width = x2 - x1;
        const height = y2 - y1;

        // Leaf condition
        if (depth >= maxDepth || (width <= 1 && height <= 1)) {
          return [{ x1, x2, y1, y2 }];
        }

        // Generous planes: randomly leave larger squares unsplit
        if (depth >= 2 && width >= 3 && height >= 3 && Math.random() < 0.20) {
          return [{ x1, x2, y1, y2 }];
        }

        // Axis choice biased heavily toward the longer side
        let splitHoriz = false;
        if (width === 1) splitHoriz = true;
        else if (height === 1) splitHoriz = false;
        else {
          const pHoriz = height / (width + height);
          splitHoriz = Math.random() < pHoriz;
        }

        const size = splitHoriz ? height : width;
        if (size <= 1) {
          return [{ x1, x2, y1, y2 }];
        }

        // Cut near golden ratio (0.382 or 0.618 with jitter)
        const golden = Math.random() < 0.5 ? 0.382 : 0.618;
        const jitter = (Math.random() - 0.5) * 0.30;
        let cutRatio = Math.max(0.18, Math.min(0.82, golden + jitter));
        let cutOffset = Math.round(size * cutRatio);
        cutOffset = Math.max(1, Math.min(size - 1, cutOffset));

        if (splitHoriz) {
          const splitY = y1 + cutOffset;
          return [
            ...createSubdivision(x1, x2, y1, splitY, depth + 1),
            ...createSubdivision(x1, x2, splitY, y2, depth + 1)
          ];
        } else {
          const splitX = x1 + cutOffset;
          return [
            ...createSubdivision(x1, splitX, y1, y2, depth + 1),
            ...createSubdivision(splitX, x2, y1, y2, depth + 1)
          ];
        }
      }

      function assignPalette(rects) {
        // 16% - 28% painted, rest off-white
        const colorTargetRatio = 0.16 + Math.random() * 0.12;
        const targetColorCount = Math.max(1, Math.round(rects.length * colorTargetRatio));
        
        // Pick distinct planes for color
        const indices = rects.map((_, i) => i);
        // Shuffle
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }

        const colorMap = new Map();
        const primaries = ['red', 'blue', 'yellow'];
        
        for (let k = 0; k < rects.length; k++) {
          const idx = indices[k];
          if (k < targetColorCount) {
            const roll = Math.random();
            if (roll < 0.07) {
              colorMap.set(idx, 'black');
            } else {
              colorMap.set(idx, randomChoice(primaries));
            }
          } else {
            colorMap.set(idx, 'white');
          }
        }
        return colorMap;
      }

      function generateRomanNumeral() {
        const numerals = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
        return randomChoice(numerals);
      }

      function updateWallPlate(colorDistribution) {
        plateContent.classList.add('updating');

        setTimeout(() => {
          const present = [];
          if (colorDistribution.red) present.push('Red');
          if (colorDistribution.yellow) present.push('Yellow');
          if (colorDistribution.blue) present.push('Blue');
          if (colorDistribution.black && present.length < 2) present.push('Black');

          let titleStr = '';
          const styleRoll = Math.random();
          const num = generateRomanNumeral();

          if (present.length === 0) {
            titleStr = `Composition in White and Black`;
          } else if (styleRoll < 0.45) {
            let colorList = '';
            if (present.length === 1) colorList = present[0];
            else if (present.length === 2) colorList = `${present[0]} and ${present[1]}`;
            else colorList = `${present.slice(0, -1).join(', ')} and ${present[present.length - 1]}`;
            titleStr = `Composition No. ${num} with ${colorList}`;
          } else if (styleRoll < 0.75) {
            titleStr = `Tableau ${num} with ${present.join(' and ')}`;
          } else {
            titleStr = `Composition with Large Plane of ${present[0]}`;
          }

          const year = 1919 + Math.floor(Math.random() * 24); // 1919-1942
          artTitle.textContent = titleStr;
          artMeta.innerHTML = `${year} &bull; Oil on canvas &bull; 72 &times; 72 cm`;
          plateContent.classList.remove('updating');
        }, prefersReducedMotion ? 0 : 320);
      }

      function buildComposition() {
        baseCols = generateTrackWeights();
        baseRows = generateTrackWeights();

        // Apply grid track sizes
        gridCanvas.style.gridTemplateColumns = baseCols.map(w => `${w.toFixed(3)}fr`).join(' ');
        gridCanvas.style.gridTemplateRows = baseRows.map(w => `${w.toFixed(3)}fr`).join(' ');

        // Subtle easel rotation ±0.6 deg
        if (!prefersReducedMotion) {
          const rot = ((Math.random() - 0.5) * 1.2).toFixed(2);
          easelFrame.style.transform = `rotate(${rot}deg)`;
        }

        const rects = createSubdivision(0, GRID_SIZE, 0, GRID_SIZE, 0);
        const palette = assignPalette(rects);

        const counts = { red: 0, blue: 0, yellow: 0, black: 0 };
        gridCanvas.innerHTML = '';

        rects.forEach((r, idx) => {
          const cell = document.createElement('button');
          cell.className = 'grid-cell';
          cell.setAttribute('type', 'button');
          cell.setAttribute('aria-label', `Grid block at column ${r.x1 + 1} to ${r.x2 + 1}, row ${r.y1 + 1} to ${r.y2 + 1}`);

          cell.style.gridColumnStart = (r.x1 + 1);
          cell.style.gridColumnEnd = (r.x2 + 1);
          cell.style.gridRowStart = (r.y1 + 1);
          cell.style.gridRowEnd = (r.y2 + 1);

          const color = palette.get(idx) || 'white';
          cell.dataset.color = color;
          if (counts[color] !== undefined) counts[color]++;

          // Cycle color on click
          cell.addEventListener('click', (e) => {
            e.stopPropagation();
            const curr = cell.dataset.color || 'white';
            const next = COLOR_CYCLE[(COLOR_CYCLE.indexOf(curr) + 1) % COLOR_CYCLE.length];
            cell.dataset.color = next;
          });

          // Staggered reveal animation
          if (!prefersReducedMotion) {
            cell.classList.add('cell-enter');
            gridCanvas.appendChild(cell);
            setTimeout(() => {
              cell.classList.add('cell-visible');
              cell.classList.remove('cell-enter');
            }, idx * 28);
          } else {
            cell.classList.add('cell-visible');
            gridCanvas.appendChild(cell);
          }
        });

        updateWallPlate(counts);
      }

      // Breathing Animation Logic
      function breathingLoop(timestamp) {
        if (!isBreathing) return;
        if (!animStartTime) animStartTime = timestamp;
        const t = (timestamp - animStartTime) * 0.001;

        // Modulate column and row tracks with layered sine waves
        const cols = baseCols.map((base, i) => {
          const slow = Math.sin(t * 0.7 + i * 0.45) * 0.16;
          const fast = Math.sin(t * 1.8 + i * 0.85) * 0.06;
          return Math.max(0.2, base * (1 + slow + fast));
        });

        const rows = baseRows.map((base, i) => {
          const slow = Math.cos(t * 0.65 + i * 0.50) * 0.16;
          const fast = Math.sin(t * 1.6 + i * 0.95) * 0.06;
          return Math.max(0.2, base * (1 + slow + fast));
        });

        gridCanvas.style.gridTemplateColumns = cols.map(w => `${w.toFixed(3)}fr`).join(' ');
        gridCanvas.style.gridTemplateRows = rows.map(w => `${w.toFixed(3)}fr`).join(' ');

        animFrameId = requestAnimationFrame(breathingLoop);
      }

      function startBreathing() {
        if (prefersReducedMotion) return;
        isBreathing = true;
        btnAnimate.classList.add('active');
        btnAnimate.textContent = 'Stop';
        gridCanvas.classList.add('breathing');
        animStartTime = 0;
        animFrameId = requestAnimationFrame(breathingLoop);
      }

      function stopBreathing() {
        isBreathing = false;
        btnAnimate.classList.remove('active');
        btnAnimate.textContent = 'Animate';
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
        // Smoothly return to original base proportions
        gridCanvas.classList.remove('breathing');
        gridCanvas.style.gridTemplateColumns = baseCols.map(w => `${w.toFixed(3)}fr`).join(' ');
        gridCanvas.style.gridTemplateRows = baseRows.map(w => `${w.toFixed(3)}fr`).join(' ');
      }

      function toggleBreathing() {
        if (isBreathing) {
          stopBreathing();
        } else {
          startBreathing();
        }
      }

      // Event Listeners
      btnNew.addEventListener('click', () => {
        if (isBreathing) stopBreathing();
        buildComposition();
      });

      btnAnimate.addEventListener('click', toggleBreathing);

      depthSlider.addEventListener('input', (e) => {
        maxDepth = parseInt(e.target.value, 10);
        depthDisplay.textContent = maxDepth;
        if (isBreathing) stopBreathing();
        buildComposition();
      });

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        const key = e.key.toLowerCase();
        if (key === 'n') {
          if (isBreathing) stopBreathing();
          buildComposition();
        } else if (key === 'a') {
          toggleBreathing();
        }
      });

      // Initial execution
      buildComposition();
    })();
  </script>
</body>
</html>
