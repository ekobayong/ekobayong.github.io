<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Major Arcana — Three-Card Tarot Spread</title>
  <style>
    :root {
      --bg-burgundy: #380a16;
      --bg-dark: #190309;
      --gold-main: #d9b45b;
      --gold-pale: #f3dc9a;
      --gold-glow: rgba(243, 220, 154, 0.45);
      --rose: #c9a58c;
      --ink-dark: #150f1c;
      --ink-mid: #251a30;
      --card-w: clamp(84px, 12.5vw, 140px);
      --card-h: calc(var(--card-w) * 1.66);
      --slot-w: calc(var(--card-w) + 12px);
      --slot-h: calc(var(--card-h) + 12px);
      --font-serif: "Iowan Old Style", "Palatino Linotype", "Palatino", "Georgia", serif;
      --transition-slow: 1.1s cubic-bezier(0.2, 0.8, 0.25, 1);
      --transition-flight: 0.85s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (max-width: 600px) {
      :root {
        --card-w: 24vw;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-burgundy);
      background-image:
        radial-gradient(ellipse at 50% -5%, rgba(255, 200, 120, 0.35) 0%, rgba(255, 180, 80, 0.15) 30%, transparent 70%),
        radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(10, 2, 5, 0.85) 100%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 5px),
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.3) 0px, rgba(0, 0, 0, 0.3) 1px, transparent 1px, transparent 5px),
        radial-gradient(circle at 50% 30%, #4a0f1e 0%, #2c0812 70%, #150207 100%);
      font-family: var(--font-serif);
      color: var(--gold-pale);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 1.5rem 1rem 4rem;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Candle glow flicker */
    .candle-aura {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 210, 140, 0.28) 0%, rgba(255, 170, 70, 0.08) 50%, transparent 80%);
      filter: blur(45px);
      pointer-events: none;
      z-index: 1;
      animation: flicker 3.2s infinite alternate ease-in-out;
    }

    @keyframes flicker {
      0% { opacity: 0.75; transform: translateX(-50%) scale(0.96, 0.94); }
      35% { opacity: 0.92; transform: translateX(-50%) scale(1.03, 1.05); }
      60% { opacity: 0.8; transform: translateX(-49.5%) scale(0.98, 1); }
      80% { opacity: 1; transform: translateX(-50.5%) scale(1.05, 1.02); }
      100% { opacity: 0.85; transform: translateX(-50%) scale(1.01, 0.97); }
    }

    header {
      text-align: center;
      z-index: 2;
      margin-bottom: 1.8rem;
    }

    h1 {
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      letter-spacing: 0.22em;
      font-variant: small-caps;
      text-transform: lowercase;
      color: var(--gold-pale);
      text-shadow: 0 0 16px var(--gold-glow), 0 0 32px rgba(217, 180, 91, 0.25);
      font-weight: 400;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-style: italic;
      font-size: clamp(0.95rem, 1.8vw, 1.25rem);
      color: var(--rose);
      letter-spacing: 0.08em;
      margin-bottom: 1.2rem;
    }

    .rule-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: clamp(240px, 50vw, 420px);
      margin: 0 auto;
    }
    .rule-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
    }
    .rule-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold-main);
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--gold-pale);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      z-index: 2;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: var(--font-serif);
      font-variant: small-caps;
      text-transform: lowercase;
      letter-spacing: 0.15em;
      font-size: 0.95rem;
      background: rgba(30, 8, 16, 0.6);
      border: 1px solid var(--gold-main);
      color: var(--gold-pale);
      padding: 0.6rem 1.4rem;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 8px rgba(217, 180, 91, 0.1);
    }

    .btn:hover, .btn:focus-visible {
      background: rgba(60, 16, 32, 0.85);
      border-color: var(--gold-pale);
      box-shadow: 0 0 16px var(--gold-glow), inset 0 0 12px rgba(243, 220, 154, 0.25);
      outline: none;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      border-color: #55333e;
    }

    /* Spread Arena */
    .spread-slots-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(1rem, 3.5vw, 3rem);
      width: min(94vw, 980px);
      margin-bottom: 2rem;
      z-index: 2;
    }

    .slot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slot-label {
      font-variant: small-caps;
      letter-spacing: 0.18em;
      font-size: clamp(0.85rem, 1.4vw, 1.05rem);
      color: var(--gold-main);
      margin-bottom: 0.75rem;
      text-shadow: 0 0 10px rgba(217, 180, 91, 0.3);
    }

    .slot-frame {
      width: var(--slot-w);
      height: var(--slot-h);
      border: 1.5px dashed rgba(217, 180, 91, 0.38);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 3, 7, 0.35);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      position: relative;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .slot-frame.occupied {
      border-style: solid;
      border-color: rgba(217, 180, 91, 0.15);
    }

    .slot-frame::after {
      content: '✧';
      color: rgba(217, 180, 91, 0.2);
      font-size: 1.4rem;
    }
    .slot-frame.occupied::after {
      display: none;
    }

    /* Interpretation text panel */
    .reading-panel {
      margin-top: 1rem;
      width: 100%;
      min-height: 120px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      font-size: clamp(0.8rem, 1.1vw, 0.92rem);
      line-height: 1.55;
      color: #ebdcd0;
      padding: 0.5rem;
      background: radial-gradient(ellipse at center, rgba(35, 10, 20, 0.7) 0%, transparent 80%);
      border-radius: 4px;
    }

    .reading-panel.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .card-title-rev {
      font-variant: small-caps;
      color: var(--gold-pale);
      font-size: 1rem;
      margin-bottom: 0.2rem;
      letter-spacing: 0.1em;
    }

    .card-keywords {
      font-style: italic;
      color: var(--rose);
      font-size: 0.82rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
    }

    /* Card Fan & Stage */
    .deck-stage {
      position: relative;
      width: 100%;
      height: 380px;
      margin-top: 1rem;
      z-index: 10;
      perspective: 1600px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    @media (max-width: 600px) {
      .deck-stage {
        height: 290px;
      }
    }

    .card {
      position: absolute;
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 7px;
      cursor: pointer;
      transform-style: preserve-3d;
      transform-origin: 50% 260%;
      transition: transform 0.65s cubic-bezier(0.2, 0.85, 0.3, 1), box-shadow 0.4s ease, opacity 0.6s ease;
      touch-action: manipulation;
      outline: none;
    }

    .card.fanned:hover, .card.fanned:focus-visible {
      margin-top: -22px;
      z-index: 99 !important;
    }

    .card.in-slot {
      cursor: default;
      transform-origin: center center;
    }

    .card.dimmed {
      opacity: 0.22;
      filter: saturate(0.4) brightness(0.6);
      pointer-events: none;
    }

    /* 3D Faces */
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform var(--transition-slow);
      border-radius: 7px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card.flipped.reversed .card-inner {
      transform: rotateY(180deg) rotateZ(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 7px;
      overflow: hidden;
    }

    /* Back Face */
    .card-back {
      background: #380716;
      border: 1px solid #7d5926;
      z-index: 2;
      transform: rotateY(0deg);
    }

    .card-back svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Front Face */
    .card-front {
      background: radial-gradient(circle at 50% 40%, var(--ink-mid) 0%, var(--ink-dark) 100%);
      transform: rotateY(180deg);
      border: 1px solid #8f692b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      color: var(--gold-main);
      box-sizing: border-box;
      position: relative;
    }

    .front-border {
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(217, 180, 91, 0.4);
      border-radius: 4px;
      pointer-events: none;
    }
    .front-border::after {
      content: '';
      position: absolute;
      inset: 2px;
      border: 0.5px dashed rgba(217, 180, 91, 0.25);
      border-radius: 2px;
    }

    .card-numeral {
      font-size: clamp(0.65rem, 1vw, 0.8rem);
      letter-spacing: 0.15em;
      margin-top: 4px;
      color: var(--gold-pale);
      z-index: 1;
    }

    .card-art {
      width: 82%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .card-art svg {
      width: 100%;
      height: 100%;
      stroke: var(--gold-main);
      fill: none;
      filter: drop-shadow(0 0 3px rgba(217, 180, 91, 0.4));
    }

    .card-name {
      font-variant: small-caps;
      text-transform: lowercase;
      font-size: clamp(0.55rem, 0.9vw, 0.72rem);
      letter-spacing: 0.12em;
      margin-bottom: 4px;
      text-align: center;
      color: var(--gold-pale);
      line-height: 1.15;
      padding: 0 4px;
      z-index: 1;
    }

    /* Gold foil shimmer */
    .foil-shimmer {
      position: absolute;
      inset: -50%;
      background: linear-gradient(
        115deg,
        transparent 35%,
        rgba(255, 235, 170, 0) 42%,
        rgba(255, 235, 170, 0.45) 50%,
        rgba(255, 235, 170, 0) 58%,
        transparent 65%
      );
      mix-blend-mode: screen;
      transform: translateX(-150%) rotate(25deg);
      pointer-events: none;
      z-index: 10;
    }

    .card.shimmer .foil-shimmer {
      animation: sweep 1.3s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    }

    .card-front:hover .foil-shimmer {
      animation: sweep 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    }

    @keyframes sweep {
      0% { transform: translateX(-120%) rotate(25deg); }
      100% { transform: translateX(120%) rotate(25deg); }
    }

    /* Screen-reader accessible live announcer */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .candle-aura { animation: none; }
      .card { transition: transform 0.1s ease, opacity 0.1s ease !important; }
      .card-inner { transition: transform 0.1s ease !important; }
      .foil-shimmer { display: none; }
      .reading-panel { transition: opacity 0.1s ease; }
    }
  </style>
</head>
<body>

  <div class="candle-aura" aria-hidden="true"></div>

  <header>
    <h1>The Major Arcana</h1>
    <div class="subtitle">A Three-Card Spread of Past, Present, &amp; Future</div>
    <div class="rule-wrap" aria-hidden="true">
      <div class="rule-line"></div>
      <div class="rule-diamond"></div>
      <div class="rule-line"></div>
    </div>
  </header>

  <nav class="controls" aria-label="Deck controls">
    <button id="btn-shuffle" class="btn">Shuffle</button>
    <button id="btn-draw" class="btn">Draw Three</button>
    <button id="btn-gather" class="btn" disabled>Gather the Deck</button>
  </nav>

  <main class="spread-slots-container" aria-label="Tarot Spread Table">
    <div class="slot-col">
      <div class="slot-label" id="lbl-past">Past</div>
      <div class="slot-frame" id="slot-0" role="region" aria-labelledby="lbl-past"></div>
      <div class="reading-panel" id="reading-0" aria-live="polite"></div>
    </div>

    <div class="slot-col">
      <div class="slot-label" id="lbl-present">Present</div>
      <div class="slot-frame" id="slot-1" role="region" aria-labelledby="lbl-present"></div>
      <div class="reading-panel" id="reading-1" aria-live="polite"></div>
    </div>

    <div class="slot-col">
      <div class="slot-label" id="lbl-future">Future</div>
      <div class="slot-frame" id="slot-2" role="region" aria-labelledby="lbl-future"></div>
      <div class="reading-panel" id="reading-2" aria-live="polite"></div>
    </div>
  </main>

  <div class="deck-stage" id="deck-stage" aria-label="The 22 Major Arcana cards deck"></div>

  <div id="announcer" class="sr-only" aria-live="assertive"></div>

  <!-- SVG Global Assets -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <!-- Lattice pattern for back -->
      <pattern id="card-lattice" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="none" stroke="#68471e" stroke-width="0.75"/>
        <circle cx="6" cy="6" r="0.8" fill="#d9b45b"/>
      </pattern>

      <!-- Corner flourish unit -->
      <path id="corner-flourish" d="M 5,5 Q 16,7 18,18 Q 14,11 7,12 Q 11,9 5,5 Z" fill="#d9b45b"/>

      <!-- Single Rosette Petal -->
      <path id="rosette-petal" d="M 0,0 C -4,-10 -6,-16 0,-24 C 6,-16 4,-10 0,0 Z" fill="none" stroke="#d9b45b" stroke-width="0.8"/>

      <!-- Unified Card Back Symbol -->
      <symbol id="tarot-back" viewBox="0 0 100 166">
        <radialGradient id="back-glow" cx="50%" cy="50%" r="65%">
          <stop offset="0%" stop-color="#4d0f22"/>
          <stop offset="70%" stop-color="#24050d"/>
          <stop offset="100%" stop-color="#120206"/>
        </radialGradient>
        <rect width="100" height="166" rx="6" fill="url(#back-glow)"/>
        <rect x="4" y="4" width="92" height="158" rx="4" fill="url(#card-lattice)"/>
        <rect x="5" y="5" width="90" height="156" rx="4" fill="none" stroke="#8c6b32" stroke-width="1.2"/>
        <rect x="7.5" y="7.5" width="85" height="151" rx="3" fill="none" stroke="#e5c875" stroke-width="0.6" stroke-dasharray="2 1.5"/>

        <!-- Corners -->
        <use href="#corner-flourish" x="0" y="0"/>
        <use href="#corner-flourish" transform="translate(100, 0) scale(-1, 1)"/>
        <use href="#corner-flourish" transform="translate(0, 166) scale(1, -1)"/>
        <use href="#corner-flourish" transform="translate(100, 166) scale(-1, -1)"/>

        <!-- Center Rosette -->
        <g transform="translate(50, 83)">
          <circle r="26" fill="#1b0309" stroke="#9e7b39" stroke-width="1"/>
          <circle r="23" fill="none" stroke="#d9b45b" stroke-width="0.5" stroke-dasharray="1 1"/>
          <g>
            <use href="#rosette-petal" />
            <use href="#rosette-petal" transform="rotate(45)" />
            <use href="#rosette-petal" transform="rotate(90)" />
            <use href="#rosette-petal" transform="rotate(135)" />
            <use href="#rosette-petal" transform="rotate(180)" />
            <use href="#rosette-petal" transform="rotate(225)" />
            <use href="#rosette-petal" transform="rotate(270)" />
            <use href="#rosette-petal" transform="rotate(315)" />
          </g>
          <circle r="4.5" fill="#2d0813" stroke="#f3dc9a" stroke-width="0.8"/>
          <circle r="1.5" fill="#f3dc9a"/>
          <!-- Little Stars around -->
          <polygon points="0,-20 1,-17 4,-17 2,-15 3,-12 0,-14 -3,-12 -2,-15 -4,-17 -1,-17" fill="#f3dc9a"/>
          <polygon points="0,20 1,17 4,17 2,15 3,12 0,14 -3,12 -2,15 -4,17 -1,17" fill="#f3dc9a"/>
        </g>
      </symbol>

      <!-- 22 Arcana Card Art Symbols -->
      <!-- 0: The Fool -->
      <symbol id="art-0" viewBox="0 0 100 100">
        <path d="M 15 90 L 35 60 L 55 90 Z" fill="#d9b45b" fill-opacity="0.2" stroke-width="1.5"/>
        <path d="M 28 70 L 80 40" stroke-width="1.5"/>
        <circle cx="80" cy="40" r="4" fill="#d9b45b"/>
        <circle cx="78" cy="22" r="12" stroke-width="1.2" stroke-dasharray="2 2"/>
        <path d="M 78 6 L 78 12 M 78 32 L 78 38 M 62 22 L 68 22 M 88 22 L 94 22" stroke-width="1.5"/>
        <path d="M 38 65 Q 45 55 52 68" stroke-width="1.2"/>
      </symbol>

      <!-- I: The Magician -->
      <symbol id="art-1" viewBox="0 0 100 100">
        <!-- Lemniscate -->
        <path d="M 32 30 C 20 18, 20 42, 32 30 C 44 18, 56 42, 68 30 C 80 18, 80 42, 68 30 C 56 18, 44 42, 32 30 Z" stroke-width="1.6"/>
        <line x1="20" y1="70" x2="80" y2="70" stroke-width="2"/>
        <line x1="26" y1="70" x2="26" y2="92" stroke-width="1.5"/>
        <line x1="74" y1="70" x2="74" y2="92" stroke-width="1.5"/>
        <polygon points="50,48 55,62 45,62" stroke-width="1.4"/>
        <circle cx="34" cy="62" r="4" stroke-width="1.3"/>
        <line x1="64" y1="56" x2="70" y2="65" stroke-width="1.4"/>
      </symbol>

      <!-- II: The High Priestess -->
      <symbol id="art-2" viewBox="0 0 100 100">
        <rect x="22" y="24" width="12" height="62" stroke-width="1.5"/>
        <rect x="66" y="24" width="12" height="62" stroke-width="1.5"/>
        <text x="28" y="58" font-size="9" fill="#d9b45b" text-anchor="middle" font-family="serif">B</text>
        <text x="72" y="58" font-size="9" fill="#d9b45b" text-anchor="middle" font-family="serif">J</text>
        <path d="M 44 32 A 10 10 0 0 0 56 32 A 7 7 0 0 1 44 32" stroke-width="1.5" fill="#d9b45b" fill-opacity="0.3"/>
        <circle cx="50" cy="54" r="8" stroke-width="1.4"/>
        <path d="M 40 76 Q 50 72 60 76" stroke-width="1.3"/>
      </symbol>

      <!-- III: The Empress -->
      <symbol id="art-3" viewBox="0 0 100 100">
        <!-- Venus glyph -->
        <circle cx="50" cy="38" r="14" stroke-width="1.6"/>
        <line x1="50" y1="52" x2="50" y2="76" stroke-width="1.8"/>
        <line x1="38" y1="64" x2="62" y2="64" stroke-width="1.8"/>
        <!-- Wheat stalks -->
        <path d="M 28 85 Q 32 65 24 55 M 24 55 Q 35 60 30 75" stroke-width="1.2"/>
        <path d="M 72 85 Q 68 65 76 55 M 76 55 Q 65 60 70 75" stroke-width="1.2"/>
        <polygon points="50,14 53,19 58,19 54,22 56,27 50,24 44,27 46,22 42,19 47,19" fill="#d9b45b"/>
      </symbol>

      <!-- IV: The Emperor -->
      <symbol id="art-4" viewBox="0 0 100 100">
        <path d="M 26 84 L 26 34 L 74 34 L 74 84 Z" stroke-width="1.6"/>
        <!-- Ram horns -->
        <path d="M 26 34 C 18 20 32 16 34 26" stroke-width="1.6"/>
        <path d="M 74 34 C 82 20 68 16 66 26" stroke-width="1.6"/>
        <circle cx="50" cy="46" r="6" stroke-width="1.3"/>
        <line x1="50" y1="52" x2="50" y2="78" stroke-width="1.5"/>
        <line x1="42" y1="60" x2="58" y2="60" stroke-width="1.5"/>
        <line x1="20" y1="84" x2="80" y2="84" stroke-width="2"/>
      </symbol>

      <!-- V: The Hierophant -->
      <symbol id="art-5" viewBox="0 0 100 100">
        <!-- Papal Cross -->
        <line x1="50" y1="18" x2="50" y2="76" stroke-width="2"/>
        <line x1="35" y1="30" x2="65" y2="30" stroke-width="2"/>
        <line x1="40" y1="40" x2="60" y2="40" stroke-width="1.6"/>
        <line x1="43" y1="50" x2="57" y2="50" stroke-width="1.3"/>
        <!-- Crossed Keys -->
        <line x1="36" y1="84" x2="64" y2="66" stroke-width="1.4"/>
        <line x1="36" y1="66" x2="64" y2="84" stroke-width="1.4"/>
        <circle cx="35" cy="85" r="3" stroke-width="1.2"/>

    // Build the DOM Cards
    function buildDeck() {
      stage.innerHTML = '';
      deckCards = [];

      TAROT_DECK.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `${data.roman}: ${data.name}. Click to draw.`);
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-back">
              <svg><use href="#tarot-back"></use></svg>
            </div>
            <div class="card-face card-front">

              </div>
              <div class="card-name">${data.name}</div>
              <div class="foil-shimmer" aria-hidden="true"></div>
            </div>
          </div>
        `;

        // Card Click / Enter Key Interaction
        card.addEventListener('click', () => handleCardClick(index));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleCardClick(index);
          }
        });

        stage.appendChild(card);
        deckCards.push({
          element: card,
          data: data,
          inSlot: null,
          isReversed: false,
          baseRot: 0,
          baseX: 0
        });
      });

    // Calculate layout fan
    function layoutFan(stagger = true) {
      const count = deckCards.length;
      const stageW = stage.clientWidth;
      const arcSpread = Math.min(68, stageW / 12);
      const startAngle = -arcSpread / 2;
      const stepAngle = arcSpread / (count - 1);

      deckCards.forEach((c, i) => {
        if (c.inSlot !== null) return;
        c.element.classList.remove('in-slot');
        c.element.classList.add('fanned');

        const angle = startAngle + (stepAngle * i);
        c.baseRot = angle;
        c.element.style.zIndex = i + 1;
        
        if (stagger) {
          setTimeout(() => {
            if (c.inSlot === null) {
              c.element.style.transform = `rotate(${angle}deg)`;
            }
          }, i * 22);
        } else {
          c.element.style.transform = `rotate(${angle}deg)`;
        }
      });
    }

    // Shuffle
    async function shuffleDeck() {
      if (isAnimating) return;
      isAnimating = true;
      btnShuffle.disabled = true;
      btnDraw.disabled = true;
      btnGather.disabled = true;
      announce("Shuffling the deck.");

      // Collapse into stack
      deckCards.forEach(c => {
        if (c.inSlot === null) {
          c.element.style.transform = `rotate(0deg) translate(0, 0)`;
        }
      });

      await sleep(400);

      // Randomize array order
      for (let i = deckCards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = deckCards[i];
        deckCards[i] = deckCards[j];
        deckCards[j] = temp;
      }

      // Re-index DOM children for visual layer ordering
      deckCards.forEach(c => stage.appendChild(c.element));

      await sleep(250);
      layoutFan(true);
      await sleep(countRemaining() * 22 + 400);

      isAnimating = false;
      btnShuffle.disabled = false;
      btnDraw.disabled = false;
      btnGather.disabled = slots.every(s => s === null);
      announce("Deck shuffled and fanned.");
    }

    function countRemaining() {
      return deckCards.filter(c => c.inSlot === null).length;
    }

    function getNextSlot() {
      for (let i = 0; i < 3; i++) {
        if (slots[i] === null) return i;
      }
      return -1;
    }

    // Draw single card into designated slot
    async function drawCardToSlot(cardIndex, slotIndex) {
      const cardObj = deckCards[cardIndex];
      const slotEl = document.getElementById(`slot-${slotIndex}`);
      const readingEl = document.getElementById(`reading-${slotIndex}`);
      const slotNames = ["Past", "Present", "Future"];

      slots[slotIndex] = cardIndex;
      cardObj.inSlot = slotIndex;
      slotEl.classList.add('occupied');
      cardObj.element.classList.remove('fanned');
      cardObj.element.classList.add('in-slot');
      cardObj.element.removeAttribute('tabindex');

      // 30% Reversed chance
      const isReversed = Math.random() < 0.3;
      cardObj.isReversed = isReversed;

      // Coordinate matching between Stage & Target Slot
      const stageRect = stage.getBoundingClientRect();
      const slotRect = slotEl.getBoundingClientRect();

      const targetX = (slotRect.left + slotRect.width / 2) - (stageRect.left + stageRect.width / 2);
      const targetY = (slotRect.top + slotRect.height / 2) - stageRect.top - (cardObj.element.offsetHeight / 2);

      cardObj.element.style.zIndex = 200 + slotIndex;
      cardObj.element.style.transition = `transform var(--transition-flight)`;
      cardObj.element.style.transform = `translate(${targetX}px, ${targetY}px) rotate(0deg)`;

      await sleep(850);

      // Flip the Card & trigger Foil
      if (isReversed) {
        cardObj.element.classList.add('reversed');
      }
      cardObj.element.classList.add('flipped');
      cardObj.element.classList.add('shimmer');

      // Update Reading panel
      const data = cardObj.data;
      const readingText = isReversed ? data.reversed : data.upright;
      const orientationLabel = isReversed ? "Reversed" : "Upright";

      readingEl.innerHTML = `
        <div class="card-title-rev">${data.name} <span style="font-size:0.75em; opacity:0.8;">(${orientationLabel})</span></div>
        <div class="card-keywords">${data.keywords}</div>
        <p>${readingText}</p>
      `;
      readingEl.classList.add('revealed');

      announce(`${slotNames[slotIndex]} card revealed: ${data.name}, ${orientationLabel}. ${readingText}`);

      // Check if all 3 slots filled
      if (slots.every(s => s !== null)) {
        deckCards.forEach(c => {
          if (c.inSlot === null) c.element.classList.add('dimmed');
        });
        btnDraw.disabled = true;
      }
      btnGather.disabled = false;
    }

    async function handleCardClick(cardIndex) {
      if (isAnimating) return;
      const cardObj = deckCards[cardIndex];
      if (cardObj.inSlot !== null) return;

      const slotIdx = getNextSlot();
      if (slotIdx === -1) return;

      isAnimating = true;
      btnShuffle.disabled = true;
      btnDraw.disabled = true;
      btnGather.disabled = true;

      await drawCardToSlot(cardIndex, slotIdx);

      isAnimating = false;
      btnShuffle.disabled = false;
      btnDraw.disabled = slots.every(s => s !== null);
      btnGather.disabled = false;
    }

    // Draw 3 sequentially
    async function drawThree() {
      if (isAnimating) return;
      let emptySlot = getNextSlot();
      if (emptySlot === -1) return;

      isAnimating = true;
      btnShuffle.disabled = true;
      btnDraw.disabled = true;
      btnGather.disabled = true;

      while (emptySlot !== -1) {
        // Pick available random card
        const available = deckCards.map((c, i) => (c.inSlot === null ? i : null)).filter(v => v !== null);
        if (available.length === 0) break;

        const pickedIndex = available[Math.floor(Math.random() * available.length)];
        await drawCardToSlot(pickedIndex, emptySlot);
        await sleep(650);
        emptySlot = getNextSlot();
      }

      isAnimating = false;
      btnShuffle.disabled = false;
      btnDraw.disabled = slots.every(s => s !== null);
      btnGather.disabled = false;
    }

    // Gather & Reset Spread
    async function gatherDeck() {
      if (isAnimating) return;
      isAnimating = true;
      announce("Gathering all cards back into the deck.");
      btnShuffle.disabled = true;
      btnDraw.disabled = true;
      btnGather.disabled = true;

      // Hide reading text
      for (let i = 0; i < 3; i++) {
        document.getElementById(`reading-${i}`).classList.remove('revealed');
        document.getElementById(`slot-${i}`).classList.remove('occupied');
      }

      // Unflip in-slot cards first
      deckCards.forEach(c => {
        if (c.inSlot !== null) {
          c.element.classList.remove('flipped', 'reversed', 'shimmer');
        }
        c.element.classList.remove('dimmed');
      });

      await sleep(700);

      // Return everyone to stage origin
      deckCards.forEach(c => {
        c.inSlot = null;
        c.element.classList.remove('in-slot');
        c.element.classList.add('fanned');
        c.element.setAttribute('tabindex', '0');
        c.element.style.transition = `transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)`;
        c.element.style.transform = `translate(0, 0) rotate(0deg)`;
      });
      slots = [null, null, null];

      await sleep(850);
      layoutFan(true);
      await sleep(countRemaining() * 22 + 400);

      isAnimating = false;
      btnShuffle.disabled = false;
      btnDraw.disabled = false;
      btnGather.disabled = true;
      announce("The deck is gathered and ready.");
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Window resize handler: adjusts fan & slot positions dynamically
    window.addEventListener('resize', () => {
      if (isAnimating) return;
      
      // Update fanned cards
      layoutFan(false);

      // Update in-slot positions if active
      slots.forEach((cardIdx, slotIdx) => {
        if (cardIdx !== null) {
          const cardObj = deckCards[cardIdx];
          const slotEl = document.getElementById(`slot-${slotIdx}`);
          const stageRect = stage.getBoundingClientRect();
          const slotRect = slotEl.getBoundingClientRect();

          const targetX = (slotRect.left + slotRect.width / 2) - (stageRect.left + stageRect.width / 2);
          const targetY = (slotRect.top + slotRect.height / 2) - stageRect.top - (cardObj.element.offsetHeight / 2);
          cardObj.element.style.transform = `translate(${targetX}px, ${targetY}px) rotate(0deg)`;
        }
      });
    });

    // Event Listeners
    btnShuffle.addEventListener('click', shuffleDeck);
    btnDraw.addEventListener('click', drawThree);
    btnGather.addEventListener('click', gatherDeck);

    // Initial setup
    buildDeck();
    layoutFan(true);
  </script>
</body>
</html>
