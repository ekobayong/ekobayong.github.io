<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahel Meridian — Desert Dunes at Golden Hour</title>
  <style>
    :root {
      --sky-top: #5d8fb5;
      --sky-mid: #e8b86b;
      --sky-bot: #f8dca4;
      --sun-color: #fff6d2;
      --sun-glow: rgba(255, 235, 175, 0.6);
      --haze-color: rgba(248, 220, 164, 0.45);
      --dune-1: #f1d9a8;
      --dune-2: #e4b982;
      --dune-3: #d59b62;
      --dune-4: #bd7a48;
      --dune-5: #9a5a35;
      --dune-6: #6e3b24;
      --sand-tint: #f1d9a8;
      --stars-opacity: 0;
      --sun-opacity: 1;
      --sun-x: 66%;
      --sun-y: 22%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
    }

    /* Celestial & Atmospheric layers */
    #starfield {
      position: absolute;
      inset: 0;
      opacity: var(--stars-opacity);
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.4s linear;
    }

    .sun-container {
      position: absolute;
      left: var(--sun-x);
      top: var(--sun-y);
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: var(--sun-opacity);
      z-index: 2;
      pointer-events: none;
      filter: url(#heat-shimmer);
      will-change: left, top, opacity;
    }

    .sun-disc {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--sun-color);
      box-shadow: 0 0 45px 15px var(--sun-glow), 0 0 110px 45px var(--sun-glow);
    }

    .haze-band {
      position: absolute;
      bottom: 22%;
      left: 0;
      width: 100%;
      height: 28%;
      background: linear-gradient(180deg, transparent 0%, var(--haze-color) 45%, transparent 100%);
      filter: blur(28px);
      z-index: 3;
      pointer-events: none;
    }

    /* Dunes */
    .dune-svg {
      position: absolute;
      bottom: 0;
      left: -5%;
      width: 110%;
      height: 68%;
      pointer-events: none;
      will-change: transform;
    }

    .dune-svg path {
      transition: fill 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #dune-layer-1 { z-index: 4; height: 52%; filter: url(#heat-shimmer); }
    #dune-layer-2 { z-index: 5; height: 50%; }
    #dune-layer-3 { z-index: 6; height: 48%; }
    #dune-layer-4 { z-index: 7; height: 46%; }
    #dune-layer-5 { z-index: 9; height: 42%; }
    #dune-layer-6 { z-index: 10; height: 38%; }

    /* Caravan Layer */
    .caravan-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 46%;
      z-index: 8;
      pointer-events: none;
    }

    .caravan-track {
      position: absolute;
      bottom: 26%;
      left: 0;
      width: 100%;
      height: 120px;
    }

    .caravan-group {
      position: absolute;
      display: flex;
      align-items: flex-end;
      gap: 28px;
      animation: caravanMarch 110s linear infinite;
    }

    @keyframes caravanMarch {
      0% { transform: translateX(-450px); }
      100% { transform: translateX(105vw); }
    }

    .camel-wrap {
      transform-origin: bottom center;
    }
    .camel-wrap:nth-child(1) { animation: camelBob 1.4s ease-in-out infinite alternate; }
    .camel-wrap:nth-child(2) { animation: camelBob 1.4s ease-in-out 0.35s infinite alternate; }
    .camel-wrap:nth-child(3) { animation: camelBob 1.4s ease-in-out 0.7s infinite alternate; }
    .camel-wrap:nth-child(4) { animation: camelBob 1.4s ease-in-out 1.05s infinite alternate; }

    @keyframes camelBob {
      0% { transform: translateY(0) rotate(0.4deg); }
      100% { transform: translateY(-3.5px) rotate(-0.6deg); }
    }

    .caravan-svg {
      display: block;
      fill: var(--dune-4);
      transition: fill 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Canvas streaks */
    #sand-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 11;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* Typography & Header */
    .header-banner {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      margin: 0 auto;
      text-align: center;
      z-index: 12;
      pointer-events: none;
      will-change: transform;
    }

    .title-main {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(22px, 3.8vw, 46px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(255, 250, 240, 0.94);
      text-shadow: 0 2px 14px rgba(30, 15, 5, 0.45);
      display: inline-block;
      transform: scaleX(1.12);
      margin-bottom: 8px;
    }

    .title-rule {
      width: clamp(180px, 42vw, 480px);
      height: 1px;
      margin: 0 auto 9px auto;
      background: linear-gradient(90deg, transparent, rgba(255, 245, 220, 0.65), transparent);
    }

    .title-sub {
      font-family: "Iowan Old Style", Georgia, serif;
      font-style: italic;
      font-size: clamp(11px, 1.25vw, 14.5px);
      letter-spacing: 0.08em;
      color: rgba(255, 245, 225, 0.78);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }

    /* Wind Status readout */
    .wind-readout {
      position: absolute;
      top: 28px;
      right: 32px;
      z-index: 12;
      font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      letter-spacing: 0.16em;
      color: rgba(255, 245, 225, 0.85);
      background: rgba(45, 28, 16, 0.32);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 235, 200, 0.22);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }

    /* Glass Control Panel */
    .control-panel {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 22px;
      background: rgba(48, 28, 18, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 235, 205, 0.28);
      border-radius: 36px;
      box-shadow: 0 12px 36px rgba(10, 5, 2, 0.38);
      color: #fdf5ea;
    }

    .panel-label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(255, 235, 205, 0.75);
      white-space: nowrap;
    }

    .clock-display {
      font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      min-width: 52px;
      text-align: center;
      color: #fff6d8;
    }

    .slider-track-wrap {
      display: flex;
      align-items: center;
      width: clamp(140px, 20vw, 220px);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #f8dca4 0%, #e3894e 45%, #b2496a 75%, #1c1837 100%);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ffeab0;
      border: 2px solid #b86235;
      box-shadow: 0 0 8px rgba(255, 240, 180, 0.9);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    input[type="range"]::-moz-range-thumb {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ffeab0;
      border: 2px solid #b86235;
      box-shadow: 0 0 8px rgba(255, 240, 180, 0.9);
      cursor: pointer;
    }

    .ctrl-btn {
      background: rgba(255, 235, 205, 0.14);
      border: 1px solid rgba(255, 235, 205, 0.26);
      color: #fff5e0;
      padding: 6px 13px;
      border-radius: 16px;
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 235, 205, 0.26);
      border-color: rgba(255, 235, 205, 0.45);
    }

    /* prefers-reduced-motion overrides */
    @media (prefers-reduced-motion: reduce) {
      .camel-wrap { animation: none !important; }
      .caravan-group { animation: none !important; transform: translateX(20vw) !important; }
      .sun-container, #dune-layer-1 { filter: none !important; }
    }
  </style>
</head>
<body>

  <!-- SVG Filter for atmospheric heat shimmer -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="heat-shimmer" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" result="noise">
          <animate attributeName="baseFrequency" dur="7s" values="0.012 0.05; 0.018 0.07; 0.012 0.05" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" xChannelSelector="R" yChannelSelector="G" scale="6">
          <animate attributeName="scale" dur="4.5s" values="5; 9; 5" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>
    </defs>
  </svg>

  <div id="viewport">
    <canvas id="starfield"></canvas>

    <div class="sun-container" id="sun-layer">
      <div class="sun-disc"></div>
    </div>

    <div class="haze-band"></div>

    <!-- Dune 1 (Furthest, affected by heat shimmer) -->
    <svg class="dune-svg" id="dune-layer-1" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path fill="var(--dune-1)" d="M0,280 C260,260 520,320 820,290 C1140,260 1380,310 1600,270 L1600,600 L0,600 Z"/>
    </svg>

    <!-- Dune 2 -->
    <svg class="dune-svg" id="dune-layer-2" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path fill="var(--dune-2)" d="M0,320 C340,350 620,280 940,330 C1220,380 1440,300 1600,325 L1600,600 L0,600 Z"/>
    </svg>

    <!-- Dune 3 -->
    <svg class="dune-svg" id="dune-layer-3" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path fill="var(--dune-3)" d="M0,370 C240,340 540,410 880,360 C1200,320 1410,390 1600,375 L1600,600 L0,600 Z"/>
    </svg>

    <!-- Dune 4 & Caravan Layer -->
    <svg class="dune-svg" id="dune-layer-4" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path fill="var(--dune-4)" d="M0,420 C310,440 680,380 1020,430 C1280,470 1480,410 1600,430 L1600,600 L0,600 Z"/>
    </svg>

    <div class="caravan-layer" id="caravan-layer">
      <div class="caravan-track">
        <div class="caravan-group">
          <!-- Lead Camel with Rider -->
          <div class="camel-wrap">
            <svg class="caravan-svg" width="96" height="88" viewBox="0 0 105 96">
              <!-- Rider -->
              <path d="M48,15 C45,15 43,18 43,21 C43,24 45,26 48,26 C51,26 53,24 53,21 C53,18 51,15 48,15 Z M42,26 L54,26 L56,39 L40,39 Z M53,39 L57,48 L53,49 L49,41 Z"/>
              <!-- Camel Body & Head -->
              <path d="M8,78 L14,78 L24,53 L33,52 L42,78 L48,78 L37,49 C44,48 51,46 56,43 C62,40 66,35 69,25 C70,22 73,12 77,8 C79,6 83,6 86,7 C88,8 91,10 90,13 C89,15 86,16 83,16 C80,18 78,22 77,28 C74,38 67,48 59,51 L64,78 L70,78 L76,52 L83,78 L89,78 L81,46 C77,44 68,43 62,45 C56,36 49,33 42,34 C36,34 30,38 27,42 C22,43 17,45 13,48 Z"/>
              <line x1="86" y1="12" x2="105" y2="40" stroke="currentColor" stroke-width="0.75" stroke-dasharray="1 1"/>
            </svg>
          </div>

          <!-- Camel 2 -->
          <div class="camel-wrap">
            <svg class="caravan-svg" width="90" height="82" viewBox="0 0 100 90">
              <path d="M8,74 L14,74 L23,49 L32,48 L40,74 L46,74 L36,46 C42,45 49,43 54,40 C60,37 64,32 67,23 C68,20 71,11 75,7 C77,5 81,5 84,6 C86,7 88,9 87,12 C86,14 83,15 80,15 C77,17 75,20 74,26 C71,36 64,45 56,48 L61,74 L67,74 L73,49 L79,74 L85,74 L77,43 C73,41 65,40 59,42 C53,34 46,31 40,32 C34,32 28,36 25,40 C20,41 15,43 12,46 Z"/>
              <line x1="84" y1="11" x2="105" y2="35" stroke="currentColor" stroke-width="0.75" stroke-dasharray="1 1"/>
            </svg>
          </div>

          <!-- Camel 3 (Young calf, smaller scale) -->
          <div class="camel-wrap" style="transform: scale(0.68) translateY(18px);">
            <svg class="caravan-svg" width="80" height="74" viewBox="0 0 100 90">
              <path d="M8,74 L14,74 L23,49 L32,48 L40,74 L46,74 L36,46 C42,45 49,43 54,40 C60,37 64,32 67,23 C68,20 71,11 75,7 C77,5 81,5 84,6 C86,7 88,9 87,12 C86,14 83,15 80,15 C77,17 75,20 74,26 C71,36 64,45 56,48 L61,74 L67,74 L73,49 L79,74 L85,74 L77,43 C73,41 65,40 59,42 C53,34 46,31 40,32 C34,32 28,36 25,40 C20,41 15,43 12,46 Z"/>
              <line x1="84" y1="11" x2="110" y2="30" stroke="currentColor" stroke-width="0.75" stroke-dasharray="1 1"/>
            </svg>
          </div>

          <!-- Camel 4 -->
          <div class="camel-wrap">
            <svg class="caravan-svg" width="88" height="80" viewBox="0 0 100 90">
              <path d="M8,74 L14,74 L23,49 L32,48 L40,74 L46,74 L36,46 C42,45 49,43 54,40 C60,37 64,32 67,23 C68,20 71,11 75,7 C77,5 81,5 84,6 C86,7 88,9 87,12 C86,14 83,15 80,15 C77,17 75,20 74,26 C71,36 64,45 56,48 L61,74 L67,74 L73,49 L79,74 L85,74 L77,43 C73,41 65,40 59,42 C53,34 46,31 40,32 C34,32 28,36 25,40 C20,41 15,43 12,46 Z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Dune 5 -->
    <svg class="dune-svg" id="dune-layer-5" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path fill="var(--dune-5)" d="M0,450 C380,400 710,500 1080,440 C1360,400 1510,460 1600,450 L1600,600 L0,600 Z"/>
    </svg>

    <!-- Dune 6 (Foreground) -->
    <svg class="dune-svg" id="dune-layer-6" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path fill="var(--dune-6)" d="M0,480 C260,530 620,450 960,510 C1320,560 1500,490 1600,495 L1600,600 L0,600 Z"/>
    </svg>

    <!-- Canvas for blowing sand streaks -->
    <canvas id="sand-canvas"></canvas>

    <!-- Title and Coordinates -->
    <header class="header-banner" id="header-layer">
      <h1 class="title-main">Sahel Meridian</h1>
      <div class="title-rule"></div>
      <p class="title-sub">Where the ergs meet the evening — 16° 14′ N, 0° 02′ W</p>
    </header>

    <!-- Wind Gauge -->
    <div class="wind-readout" id="wind-text">WIND ESE · 14 kn</div>

    <!-- Time of Day / Controls Panel -->
    <div class="control-panel">
      <span class="panel-label">TIME OF DAY</span>
      <div class="slider-track-wrap">
        <input type="range" id="time-slider" min="0" max="1" step="0.001" value="0">
      </div>
      <div class="clock-display" id="clock">16:40</div>
      <button class="ctrl-btn" id="pause-btn" aria-label="Pause or resume sunset cycle">
        <span id="pause-icon">⏸</span>
        <span id="pause-text">Pause</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Color Palette Definition
      const keyframes = [
        {
          t: 0.0,
          skyTop: [93, 143, 181],
          skyMid: [232, 184, 107],
          skyBot: [248, 220, 164],
          dunes: [
            [241, 217, 168],
            [228, 185, 130],
            [213, 155, 98],
            [189, 122, 72],
            [154, 90, 53],
            [110, 59, 36]
          ],
          sun: [255, 246, 210],
          sunGlow: [255, 235, 175],
          haze: [248, 220, 164, 0.45],
          sandTint: [241, 217, 168],
          stars: 0.0,
          sunAlpha: 1.0
        },
        {
          t: 0.35,
          skyTop: [63, 94, 140],
          skyMid: [227, 137, 78],
          skyBot: [246, 185, 117],
          dunes: [
            [225, 188, 144],
            [210, 155, 108],
            [192, 126, 79],
            [167, 98, 59],
            [134, 72, 43],
            [94, 46, 28]
          ],
          sun: [255, 220, 160],
          sunGlow: [255, 180, 110],
          haze: [246, 185, 117, 0.4],
          sandTint: [225, 188, 144],
          stars: 0.0,
          sunAlpha: 0.95
        },
        {
          t: 0.62,
          skyTop: [38, 48, 90],
          skyMid: [178, 73, 106],
          skyBot: [239, 138, 90],
          dunes: [
            [186, 138, 124],
            [166, 109, 98],
            [145, 84, 75],
            [122, 63, 56],
            [95, 45, 42],
            [68, 30, 28]
          ],
          sun: [255, 178, 106],
          sunGlow: [230, 110, 70],
          haze: [239, 138, 90, 0.3],
          sandTint: [186, 138, 124],
          stars: 0.35,
          sunAlpha: 0.65
        },
        {
          t: 0.82,
          skyTop: [18, 26, 59],
          skyMid: [90, 47, 90],
          skyBot: [201, 97, 63],
          dunes: [
            [130, 100, 108],
            [112, 79, 87],
            [94, 59, 68],
            [77, 43, 52],
            [59, 30, 38],
            [40, 19, 26]
          ],
          sun: [255, 140, 75],
          sunGlow: [200, 70, 40],
          haze: [201, 97, 63, 0.2],
          sandTint: [130, 100, 108],
          stars: 0.75,
          sunAlpha: 0.1
        },
        {
          t: 1.0,
          skyTop: [7, 10, 26],
          skyMid: [28, 24, 55],
          skyBot: [74, 42, 58],
          dunes: [
            [92, 74, 74],
            [75, 59, 62],
            [59, 44, 49],
            [44, 31, 37],
            [30, 20, 25],
            [18, 12, 16]
          ],
          sun: [180, 70, 40],
          sunGlow: [120, 30, 20],
          haze: [74, 42, 58, 0.1],
          sandTint: [92, 74, 74],
          stars: 1.0,
          sunAlpha: 0.0
        }
      ];

      // Smoothstep interpolation helper
      function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpArr(a, b, t) {
        return a.map((val, i) => lerp(val, b[i], t));
      }

      function rgb(arr) {
        return `rgb(${Math.round(arr[0])}, ${Math.round(arr[1])}, ${Math.round(arr[2])})`;
      }

      function rgba(arr, a) {
        return `rgba(${Math.round(arr[0])}, ${Math.round(arr[1])}, ${Math.round(arr[2])}, ${a})`;
      }

      // Render State
      let progress = 0; // 0 to 1
      let cycleDirection = 1;
      let isPaused = prefersReducedMotion;
      const cycleDuration = 60000; // 60 seconds ping pong
      let lastTime = performance.now();

      // UI References
      const slider = document.getElementById('time-slider');
      const clockEl = document.getElementById('clock');
      const pauseBtn = document.getElementById('pause-btn');
      const pauseIcon = document.getElementById('pause-icon');
      const pauseText = document.getElementById('pause-text');
      const windText = document.getElementById('wind-text');
      const root = document.documentElement;

      // Update palette based on progress
      function applyProgress(p) {
        // Find surrounding keyframes
        let k1 = keyframes[0];
        let k2 = keyframes[keyframes.length - 1];

        for (let i = 0; i < keyframes.length - 1; i++) {
          if (p >= keyframes[i].t && p <= keyframes[i + 1].t) {
            k1 = keyframes[i];
            k2 = keyframes[i + 1];
            break;
          }
        }

        const localT = smoothstep(k1.t, k2.t, p);

        // Interpolate colors
        const skyTop = lerpArr(k1.skyTop, k2.skyTop, localT);
        const skyMid = lerpArr(k1.skyMid, k2.skyMid, localT);
        const skyBot = lerpArr(k1.skyBot, k2.skyBot, localT);
        const sun = lerpArr(k1.sun, k2.sun, localT);
        const sunGlow = lerpArr(k1.sunGlow, k2.sunGlow, localT);
        const sandTint = lerpArr(k1.sandTint, k2.sandTint, localT);
        const stars = lerp(k1.stars, k2.stars, localT);
        const sunAlpha = lerp(k1.sunAlpha, k2.sunAlpha, localT);

        root.style.setProperty('--sky-top', rgb(skyTop));
        root.style.setProperty('--sky-mid', rgb(skyMid));
        root.style.setProperty('--sky-bot', rgb(skyBot));
        root.style.setProperty('--sun-color', rgb(sun));
        root.style.setProperty('--sun-glow', rgba(sunGlow, 0.65));
        root.style.setProperty('--haze-color', rgba(skyBot, 0.45));
        root.style.setProperty('--sand-tint', rgb(sandTint));
        root.style.setProperty('--stars-opacity', stars.toFixed(3));
        root.style.setProperty('--sun-opacity', sunAlpha.toFixed(3));

        for (let d = 0; d < 6; d++) {
          const col = lerpArr(k1.dunes[d], k2.dunes[d], localT);
          root.style.setProperty(`--dune-${d + 1}`, rgb(col));
        }

        // Sun Diagonal Position: (66%, 22%) to (42%, 70%)
        const sunX = lerp(66, 42, p);
        const sunY = lerp(22, 70, p);
        root.style.setProperty('--sun-x', `${sunX.toFixed(2)}%`);
        root.style.setProperty('--sun-y', `${sunY.toFixed(2)}%`);

        // Monospace Clock 16:40 (1000 mins) to 20:12 (1212 mins)
        const totalMinutes = lerp(1000, 1212, p);
        const hours = Math.floor(totalMinutes / 60);
        const mins = Math.floor(totalMinutes % 60);
        clockEl.textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        
        slider.value = p;
      }

      // Slider drag handling
      slider.addEventListener('input', (e) => {
        isPaused = true;
        updatePauseState();
        progress = parseFloat(e.target.value);
        applyProgress(progress);
      });

      // Pause/Resume handling
      function updatePauseState() {
        if (isPaused) {
          pauseIcon.textContent = '▶';
          pauseText.textContent = 'Play';
        } else {
          pauseIcon.textContent = '⏸';
          pauseText.textContent = 'Pause';
        }
      }

      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        updatePauseState();
      });

      if (isPaused) updatePauseState();

      // Starfield Canvas
      const starCanvas = document.getElementById('starfield');
      const starCtx = starCanvas.getContext('2d');
      const starsList = [];

      function initStars() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        starCanvas.width = w;
        starCanvas.height = h;
        starsList.length = 0;
        const count = Math.floor((w * h) / 3800);
        for (let i = 0; i < count; i++) {
          starsList.push({
            x: Math.random() * w,
            y: Math.random() * h * 0.72,
            radius: Math.random() * 1.3 + 0.3,
            baseAlpha: Math.random() * 0.75 + 0.25,
            blinkSpeed: Math.random() * 0.003 + 0.001
          });
        }
      }

      function drawStars(now) {
        starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
        for (let star of starsList) {
          const shimmer = Math.sin(now * star.blinkSpeed) * 0.25;
          const alpha = Math.max(0, Math.min(1, star.baseAlpha + shimmer));
          starCtx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          starCtx.beginPath();
          starCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          starCtx.fill();
        }
      }

      // Wind-blown Sand Streaks Canvas
      const sandCanvas = document.getElementById('sand-canvas');
      const sandCtx = sandCanvas.getContext('2d');
      const STREAK_COUNT = 260;
      const streaks = [];
      let gust = 1.0;
      let targetGust = 1.0;
      let lastGustUpdate = 0;

      function initStreaks() {
        const dpr = window.devicePixelRatio || 1;
        sandCanvas.width = window.innerWidth * dpr;
        sandCanvas.height = window.innerHeight * dpr;
        sandCtx.scale(dpr, dpr);

        streaks.length = 0;
        for (let i = 0; i < STREAK_COUNT; i++) {
          streaks.push(createStreak(true));
        }
      }

      function createStreak(randomX) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        return {
          x: randomX ? Math.random() * w : -60 - Math.random() * 100,
          y: h * 0.35 + Math.random() * (h * 0.65),
          len: Math.random() * 26 + 14,
          speed: Math.random() * 3.8 + 2.5,
          alpha: Math.random() * 0.45 + 0.15,
          swayFreq: Math.random() * 0.02 + 0.005,
          swayAmp: Math.random() * 1.5 + 0.5
        };
      }

      function renderSand(now) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        sandCtx.clearRect(0, 0, w, h);

        // Interpolate gust
        gust += (targetGust - gust) * 0.03;

        // Current pale sand color for streaks
        sandCtx.strokeStyle = getComputedStyle(root).getPropertyValue('--sand-tint').trim() || '#f1d9a8';
        sandCtx.lineWidth = 1.1;

        for (let i = 0; i < streaks.length; i++) {
          const s = streaks[i];
          s.x += s.speed * gust;
          s.y += Math.sin(now * s.swayFreq) * s.swayAmp;

          if (s.x > w + 80) {
            streaks[i] = createStreak(false);
          }

          sandCtx.globalAlpha = s.alpha * Math.min(1, (s.x + 30) / 100);
          sandCtx.beginPath();
          sandCtx.moveTo(s.x, s.y);
          sandCtx.lineTo(s.x + s.len * (gust * 0.8), s.y + 0.5);
          sandCtx.stroke();
        }
      }

      // Parallax System
      const layers = [
        { el: document.getElementById('sun-layer'), mult: -6 },
        { el: document.getElementById('header-layer'), mult: -12 },
        { el: document.getElementById('dune-layer-1'), mult: 8 },
        { el: document.getElementById('dune-layer-2'), mult: 18 },
        { el: document.getElementById('dune-layer-3'), mult: 32 },
        { el: document.getElementById('dune-layer-4'), mult: 48 },
        { el: document.getElementById('caravan-layer'), mult: 48 },
        { el: document.getElementById('dune-layer-5'), mult: 65 },
        { el: document.getElementById('dune-layer-6'), mult: 82 }
      ];

      let targetMouseX = 0;
      let targetMouseY = 0;
      let currentMouseX = 0;
      let currentMouseY = 0;

      window.addEventListener('mousemove', (e) => {
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = (e.clientY / window.innerHeight) * 2 - 1;
        targetMouseX = nx;
        targetMouseY = ny;
      });

      window.addEventListener('deviceorientation', (e) => {
        if (e.gamma !== null && e.beta !== null) {
          targetMouseX = Math.max(-1, Math.min(1, e.gamma / 30));
          targetMouseY = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
        }
      });

      // Resize observer
      window.addEventListener('resize', () => {
        initStars();
        initStreaks();
      });

      initStars();
      initStreaks();
      applyProgress(0);

      // Main Loop
      function tick(now) {
        const dt = now - lastTime;
        lastTime = now;

        // Advance 60-second ping pong cycle
        if (!isPaused && !prefersReducedMotion) {
          progress += (dt / cycleDuration) * cycleDirection;
          if (progress >= 1) {
            progress = 1;
            cycleDirection = -1;
          } else if (progress <= 0) {
            progress = 0;
            cycleDirection = 1;
          }
          applyProgress(progress);
        }

        // Parallax easing
        currentMouseX += (targetMouseX - currentMouseX) * 0.055;
        currentMouseY += (targetMouseY - currentMouseY) * 0.055;

        for (let i = 0; i < layers.length; i++) {
          const l = layers[i];
          const tx = currentMouseX * l.mult;
          const ty = currentMouseY * (l.mult * 0.35);
          l.el.style.transform = `translate3d(${tx.toFixed(1)}px, ${ty.toFixed(1)}px, 0)`;
        }

        // Draw Starfield & Sand canvas
        drawStars(now);
        if (!prefersReducedMotion) {
          renderSand(now);
        }

        // Periodic Wind Gust and Readout Updates (every 2.0s)
        if (now - lastGustUpdate > 2000) {
          lastGustUpdate = now;
          targetGust = 0.8 + Math.random() * 0.7;
          const knots = Math.round(11 + targetGust * 5.2);
          windText.textContent = `WIND ESE · ${knots} kn`;
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
