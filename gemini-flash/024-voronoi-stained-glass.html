<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose of Cells — Voronoi Stained-Glass Window</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  :root {
    --gold: #d7b36a;
    --gold-dim: #947b45;
    --bg-dark: #17140f;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    background-color: #1a1715;
    color: #e8d6a2;
  }

  /* Grid Layout: Header, Scene, Footer */
  .viewport {
    display: grid;
    grid-template-rows: auto 1fr auto;
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Wall & Ambience */
  .wall {
    position: absolute;
    inset: 0;
    bottom: 26vh;
    background: 
      radial-gradient(circle at 50% 45%, rgba(215, 179, 106, 0.14) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(10, 8, 7, 0.92) 95%),
      linear-gradient(45deg, rgba(0,0,0,0.15) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.15) 75%, rgba(0,0,0,0.15)),
      linear-gradient(-45deg, rgba(0,0,0,0.15) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.15) 75%, rgba(0,0,0,0.15)),
      linear-gradient(to bottom, #3a3531, #2b2724 55%, #1d1a18);
    background-size: 100% 100%, 100% 100%, 4px 4px, 4px 4px, 100% 100%;
    z-index: 1;
  }

  /* Ashlar Brick Courses overlay */
  .wall::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to bottom, transparent 90px, #17140f 90px, #17140f 92px),
      linear-gradient(to right, transparent 218px, #17140f 218px, #17140f 220px),
      linear-gradient(to right, transparent 218px, #17140f 218px, #17140f 220px);
    background-size: 220px 92px, 220px 184px, 220px 184px;
    background-position: 0 0, 0 0, 110px 92px;
    opacity: 0.65;
    pointer-events: none;
  }

  /* Floor Band */
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 26vh;
    background: linear-gradient(to bottom, #14110f, #0d0b0a);
    border-top: 2px solid #080706;
    perspective: 450px;
    z-index: 2;
    overflow: hidden;
  }

  .floor-flagstones {
    position: absolute;
    inset: 0;
    background: 
      repeating-linear-gradient(90deg, transparent, transparent 140px, rgba(0,0,0,0.4) 140px, rgba(0,0,0,0.4) 142px),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,0,0,0.3) 40px, rgba(0,0,0,0.3) 42px);
    transform: rotateX(60deg);
    transform-origin: 50% 0%;
    opacity: 0.45;
  }

  /* Reflected Glass Projection Canvas */
  #floorCanvas {
    position: absolute;
    top: -15%;
    left: 50%;
    transform: translateX(-50%) rotateX(62deg) scaleY(-1);
    transform-origin: 50% 0%;
    filter: blur(22px) saturate(2.4) contrast(1.1);
    opacity: 0.55;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 3;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 1.2rem 1rem 0.4rem;
    pointer-events: none;
  }

  h1 {
    font-size: 1.45rem;
    font-weight: 400;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 25px rgba(215, 179, 106, 0.3);
  }

  p.subtitle {
    font-size: 0.86rem;
    font-style: italic;
    letter-spacing: 0.08em;
    color: #a89f91;
    margin-top: 0.25rem;
  }

  /* Scene Container */
  .scene {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 0.5rem 1rem;
  }

  .window-frame {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 35px rgba(0,0,0,0.95)) drop-shadow(0 15px 25px rgba(0,0,0,0.9));
  }

  #windowCanvas {
    display: block;
    cursor: crosshair;
  }

  /* Footer Controls */
  footer {
    position: relative;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    padding: 0.8rem 1rem 1.2rem;
  }

  .controls-group {
    display: inline-flex;
    background: rgba(23, 20, 15, 0.75);
    border: 1px solid rgba(215, 179, 106, 0.25);
    border-radius: 40px;
    padding: 3px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
  }

  button {
    background: transparent;
    border: none;
    outline: none;
    color: #c5baa8;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    padding: 0.5rem 1rem;
    border-radius: 30px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    transition: all 0.22s ease-out;
  }

  button:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  button.active {
    color: var(--gold);
    background: rgba(215, 179, 106, 0.15);
    box-shadow: inset 0 0 8px rgba(215, 179, 106, 0.2);
  }

  .swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 4px rgba(0,0,0,0.8);
  }

  .swatch-chartres { background: #233fa8; box-shadow: 0 0 5px #2b64c8; }
  .swatch-autumn { background: #c25a1c; box-shadow: 0 0 5px #e8b23a; }
  .swatch-emerald { background: #158a4a; box-shadow: 0 0 5px #3fbf9a; }

  .btn-regen {
    background: rgba(23, 20, 15, 0.85);
    border: 1px solid var(--gold-dim);
    border-radius: 30px;
    padding: 0.55rem 1.25rem;
    color: var(--gold);
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }

  .btn-regen:hover {
    background: var(--gold);
    color: #17130f;
    box-shadow: 0 0 14px rgba(215, 179, 106, 0.5);
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="wall"></div>
  <div class="floor">
    <div class="floor-flagstones"></div>
    <canvas id="floorCanvas"></canvas>
  </div>

  <header>
    <h1>Rose of Cells</h1>
    <p class="subtitle">Lancet Stained Glass &bull; Click to Plant New Crystal</p>
  </header>

  <main class="scene">
    <div class="window-frame">
      <canvas id="windowCanvas"></canvas>
    </div>
  </main>

  <footer>
    <div class="controls-group">
      <button class="active" data-palette="Chartres">
        <span class="swatch swatch-chartres"></span>Chartres
      </button>
      <button data-palette="Autumn">
        <span class="swatch swatch-autumn"></span>Autumn
      </button>
      <button data-palette="Emerald">
        <span class="swatch swatch-emerald"></span>Emerald
      </button>
    </div>
    <button id="btnRegen" class="btn-regen" title="Shortcut: R">
      Regenerate
    </button>
  </footer>
</div>

<script>
(() => {
  // Palettes specification
  const PALETTES = {
    Chartres: [
      '#1b2f8f', '#233fa8', '#1a4fb5', '#2b64c8',
      '#8f1626', '#a91f30', '#c0392b',
      '#d8b25c', '#e8d6a2', '#4b2a7a', '#f1f0e8', '#1d6e6b'
    ],
    Autumn: [
      '#a33d13', '#c25a1c', '#d9931c', '#e8b23a',
      '#7a2a12', '#6b6a1f', '#8e8a2e', '#4d2b1a',
      '#e9c98a', '#b3471a', '#5b3a1e', '#d97c2b'
    ],
    Emerald: [
      '#0b4a2a', '#0f6b3c', '#158a4a', '#1e8f7a',
      '#2ea78c', '#116d5a', '#3fbf9a', '#0d3c3a',
      '#0a2f26', '#c9a44b', '#e6d38a', '#f0ead2'
    ]
  };

  let currentPaletteName = 'Chartres';
  let sites = []; // {x, y, color}
  let voronoiPolygons = []; // Array of { site, poly }

  // Canvas elements & contexts
  const canvas = document.getElementById('windowCanvas');
  const ctx = canvas.getContext('2d');
  const floorCanvas = document.getElementById('floorCanvas');
  const floorCtx = floorCanvas.getContext('2d');

  // Offscreen static glass layer & snapshot layer for animation
  let glassCanvas = document.createElement('canvas');
  let glassCtx = glassCanvas.getContext('2d');
  let snapshotCanvas = document.createElement('canvas');
  let snapshotCtx = snapshotCanvas.getContext('2d');

  let W = 0, H = 0; // Logical dimensions (CSS pixels)
  let dpr = 1;

  // Animation states
  let growingPane = null; // { poly, site, startTime, duration }
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Gothic Arch Geometry Utility
  function getSpringingY(h) {
    return h * 0.42;
  }

  function isInsideGothicArch(px, py, w, h) {
    if (px < 0 || px > w || py < 0 || py > h) return false;
    const sy = getSpringingY(h);
    if (py >= sy) return true; // Lower rectangular portion
    // Upper gothic arcs: radius = w, centers at (0, sy) and (w, sy)
    const d1 = Math.hypot(px - 0, py - sy);
    const d2 = Math.hypot(px - w, py - sy);
    return (d1 <= w && d2 <= w);
  }

  function pathGothicArch(context, w, h) {
    const sy = getSpringingY(h);
    context.beginPath();
    context.moveTo(0, h);
    context.lineTo(0, sy);
    // Left arc: center at (w, sy), radius w, sweeps from PI towards apex
    // Apex is at (w/2, sy - sqrt(w^2 - (w/2)^2)) = (w/2, sy - w*sqrt(3)/2)
    const startAngleL = Math.PI;
    const endAngleL = Math.PI + Math.PI / 6; // 210 deg
    context.arc(w, sy, w, startAngleL, endAngleL, false);

    // Right arc: center at (0, sy), radius w, sweeps from -60 deg (11*PI/6) to 0
    const startAngleR = 2 * Math.PI - Math.PI / 3; // 300 deg
    const endAngleR = 0;
    context.arc(0, sy, w, startAngleR, endAngleR, false);

    context.lineTo(w, h);
    context.closePath();
  }

  // Polygon centroid
  function getCentroid(pts) {
    let area = 0, cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      const j = (i + 1) % pts.length;
      const f = pts[i].x * pts[j].y - pts[j].x * pts[i].y;
      area += f;
      cx += (pts[i].x + pts[j].x) * f;
      cy += (pts[i].y + pts[j].y) * f;
    }
    area *= 0.5;
    if (Math.abs(area) < 1e-5) return pts[0] ? { x: pts[0].x, y: pts[0].y } : { x: 0, y: 0 };
    return { x: cx / (6 * area), y: cy / (6 * area) };
  }

  // Half-plane clipping: Sutherland-Hodgman
  function clipPolygonByHalfPlane(poly, p0, n) {
    const out = [];
    if (poly.length === 0) return out;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i];
      const b = poly[(i + 1) % poly.length];
      const da = (a.x - p0.x) * n.x + (a.y - p0.y) * n.y;
      const db = (b.x - p0.x) * n.x + (b.y - p0.y) * n.y;

      if (da >= 0) {
        out.push(a);
        if (db < 0) {
          const t = da / (da - db);
          out.push({ x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) });
        }
      } else if (db >= 0) {
        const t = da / (da - db);
        out.push({ x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) });
      }
    }
    return out;
  }

  function computeVoronoiCells() {
    voronoiPolygons = [];
    const baseBox = [
      { x: 0, y: 0 },
      { x: W, y: 0 },
      { x: W, y: H },
      { x: 0, y: H }
    ];

    for (let i = 0; i < sites.length; i++) {
      let poly = baseBox;
      const si = sites[i];

      for (let j = 0; j < sites.length; j++) {
        if (i === j) continue;
        const sj = sites[j];
        const mid = { x: (si.x + sj.x) * 0.5, y: (si.y + sj.y) * 0.5 };
        const normal = { x: sj.x - si.x, y: sj.y - si.y };
        // Normal points from si to sj. Keep halfplane where (P - mid) . (-normal) >= 0
        poly = clipPolygonByHalfPlane(poly, mid, { x: -normal.x, y: -normal.y });
        if (poly.length === 0) break;
      }
      voronoiPolygons.push({ site: si, poly });
    }
  }

  // Poisson-like candidate scattering
  function generateSeeds() {
    const area = W * H;
    // Scale count: between 26 and 70 based on area (roughly 400x700 -> 48)
    const targetCount = Math.round(Math.min(70, Math.max(26, area / 5800)));
    const minDist = Math.sqrt(area / targetCount) * 0.75;
    const newSites = [];
    const palette = PALETTES[currentPaletteName];
    let attempts = 0;

    while (newSites.length < targetCount && attempts < 2400) {
      attempts++;
      const rx = Math.random() * (W - 20) + 10;
      const ry = Math.random() * (H - 20) + 10;
      if (!isInsideGothicArch(rx, ry, W, H)) continue;

      let tooClose = false;
      for (let s of newSites) {
        if (Math.hypot(s.x - rx, s.y - ry) < minDist) {
          tooClose = true;
          break;
        }
      }
      if (!tooClose) {
        newSites.push({
          x: rx,
          y: ry,
          color: palette[Math.floor(Math.random() * palette.length)]
        });
      }
    }
    sites = newSites;
    computeVoronoiCells();
  }

  // Color utilities
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function rgbString(r, g, b, a = 1) {
    return `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${a})`;
  }

  function lerpColor(c1, c2, t) {
    return {
      r: c1.r + (c2.r - c1.r) * t,
      g: c1.g + (c2.g - c1.g) * t,
      b: c1.b + (c2.b - c1.b) * t
    };
  }

  // Glass Pane Rendering
  function renderSinglePane(targetCtx, poly, site, scale = 1, centroid = null) {
    if (poly.length < 3) return;
    targetCtx.save();

    targetCtx.beginPath();
    if (scale < 1 && centroid) {
      for (let i = 0; i < poly.length; i++) {
        const px = centroid.x + (poly[i].x - centroid.x) * scale;
        const py = centroid.y + (poly[i].y - centroid.y) * scale;
        if (i === 0) targetCtx.moveTo(px, py);
        else targetCtx.lineTo(px, py);
      }
    } else {
      targetCtx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) {
        targetCtx.lineTo(poly[i].x, poly[i].y);
      }
    }
    targetCtx.closePath();

    // Clip to individual pane
    targetCtx.save();
    targetCtx.clip();

    // Color gradient setup
    const baseRgb = hexToRgb(site.color);
    const white = { r: 255, g: 255, b: 255 };
    const black = { r: 0, g: 0, b: 0 };
    const tintHighlight = lerpColor(baseRgb, white, 0.32);
    const rimDark = lerpColor(baseRgb, black, 0.55);

    // Bounding radius of polygon from site
    let maxR = 40;
    for (let p of poly) {
      const d = Math.hypot(p.x - site.x, p.y - site.y);
      if (d > maxR) maxR = d;
    }

    const hx = site.x - maxR * 0.22;
    const hy = site.y - maxR * 0.22;

    const radGrad = targetCtx.createRadialGradient(hx, hy, 2, site.x, site.y, maxR * 1.05);
    radGrad.addColorStop(0, rgbString(tintHighlight.r, tintHighlight.g, tintHighlight.b, 0.98));
    radGrad.addColorStop(0.35, site.color);
    radGrad.addColorStop(1, rgbString(rimDark.r, rimDark.g, rimDark.b, 1));

    targetCtx.fillStyle = radGrad;
    targetCtx.fill();

    // Diagonal Glass Grain / Streaks
    targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.09)';
    targetCtx.lineWidth = 1.8;
    const streakSpacing = 7;
    const diagTotal = W + H;
    targetCtx.beginPath();
    for (let l = -H; l < diagTotal; l += streakSpacing) {
      targetCtx.moveTo(l, 0);
      targetCtx.lineTo(l + H, H);
    }
    targetCtx.stroke();

    targetCtx.restore(); // Restore clip

    // Lead Cames (Borders)
    // Dark lead line 6px
    targetCtx.lineJoin = 'round';
    targetCtx.lineCap = 'round';
    targetCtx.lineWidth = 6;
    targetCtx.strokeStyle = '#17130f';
    targetCtx.stroke();

    // Pale lead highlight (1.2px) offset slightly inside
    targetCtx.lineWidth = 1.2;
    targetCtx.strokeStyle = 'rgba(215, 205, 190, 0.38)';
    targetCtx.stroke();

    targetCtx.restore();
  }

  function redrawGlassLayer() {
    glassCtx.save();
    glassCtx.setTransform(1, 0, 0, 1, 0, 0);
    glassCtx.clearRect(0, 0, glassCanvas.width, glassCanvas.height);
    glassCtx.scale(dpr, dpr);

    // Arch clipping
    pathGothicArch(glassCtx, W, H);
    glassCtx.clip();

    // Backdrop fill (depth behind glass)
    glassCtx.fillStyle = '#0f0c0a';
    glassCtx.fillRect(0, 0, W, H);

    // Draw Voronoi panes
    for (const cell of voronoiPolygons) {
      renderSinglePane(glassCtx, cell.poly, cell.site);
    }

    // Outer lead border of the gothic window
    pathGothicArch(glassCtx, W, H);
    glassCtx.lineWidth = 8;
    glassCtx.strokeStyle = '#17130f';
    glassCtx.stroke();

    glassCtx.lineWidth = 1.5;
    glassCtx.strokeStyle = 'rgba(255, 245, 220, 0.3)';
    glassCtx.stroke();

    glassCtx.restore();
  }

  function resize() {
    const scene = document.querySelector('.scene');
    const availW = Math.min(window.innerWidth - 32, 640);
    const availH = scene.clientHeight - 20;

    let targetW = availW;
    let targetH = targetW * 1.75;

    if (targetH > availH) {
      targetH = availH;
      targetW = targetH / 1.75;
    }

    W = Math.round(targetW);
    H = Math.round(targetH);
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;

    glassCanvas.width = canvas.width;
    glassCanvas.height = canvas.height;

    snapshotCanvas.width = canvas.width;
    snapshotCanvas.height = canvas.height;

    floorCanvas.width = Math.round(W * 0.95);
    floorCanvas.height = Math.round(H * 0.95);
    floorCanvas.style.width = `${W * 0.95}px`;
    floorCanvas.style.height = `${H * 0.95}px`;

    generateSeeds();
    redrawGlassLayer();
  }

  // Recolour existing panes
  function applyPalette(paletteName) {
    currentPaletteName = paletteName;
    const colors = PALETTES[paletteName];
    for (let s of sites) {
      s.color = colors[Math.floor(Math.random() * colors.length)];
    }
    redrawGlassLayer();
  }

  // Animation Loop: Sunlight sweep & dynamic compositing
  let startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;

    // Clear main canvas
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr);

    // 1. Render Glass Base
    if (growingPane) {
      const animElapsed = now - growingPane.startTime;
      const rawT = Math.min(1, animElapsed / growingPane.duration);
      // Cubic ease-out
      const t = 1 - Math.pow(1 - rawT, 3);

      // Draw previous state snapshot
      ctx.drawImage(snapshotCanvas, 0, 0, W, H);

      // Draw expanding pane
      ctx.save();
      pathGothicArch(ctx, W, H);
      ctx.clip();
      renderSinglePane(ctx, growingPane.poly, growingPane.site, t, growingPane.centroid);
      ctx.restore();

      if (rawT >= 1) {
        growingPane = null;
        redrawGlassLayer();
      }
    } else {
      ctx.drawImage(glassCanvas, 0, 0, W, H);
    }

    // 2. Slow diagonal sweep of sunlight
    if (!prefersReducedMotion) {
      const sunPeriod = 9000; // 9 seconds
      const sunPhase = (elapsed % sunPeriod) / sunPeriod;
      // Slanted band passing from top-left to bottom-right
      const offset = -H * 0.8 + sunPhase * (H * 2.2);

      ctx.save();
      pathGothicArch(ctx, W, H);
      ctx.clip();

      const sunGrad = ctx.createLinearGradient(0, offset, W * 0.85, offset + H * 0.7);
      sunGrad.addColorStop(0, 'rgba(255, 250, 235, 0)');
      sunGrad.addColorStop(0.4, 'rgba(255, 245, 220, 0.05)');
      sunGrad.addColorStop(0.5, 'rgba(255, 250, 235, 0.26)');
      sunGrad.addColorStop(0.6, 'rgba(255, 245, 220, 0.05)');
      sunGrad.addColorStop(1, 'rgba(255, 250, 235, 0)');

      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = sunGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = sunGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.restore();
    }

    // 3. Update Floor Projection (copy downscaled main window)
    floorCtx.clearRect(0, 0, floorCanvas.width, floorCanvas.height);
    floorCtx.drawImage(canvas, 0, 0, floorCanvas.width, floorCanvas.height);

    requestAnimationFrame(animate);
  }

  // Click Interaction: Plant new seed and animate expansion
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    if (!isInsideGothicArch(clickX, clickY, W, H)) return;

    // Snapshot current state for seamless growth transition
    snapshotCtx.setTransform(1, 0, 0, 1, 0, 0);
    snapshotCtx.clearRect(0, 0, snapshotCanvas.width, snapshotCanvas.height);
    snapshotCtx.drawImage(canvas, 0, 0);

    const palette = PALETTES[currentPaletteName];
    const newSite = {
      x: clickX,
      y: clickY,
      color: palette[Math.floor(Math.random() * palette.length)]
    };

    sites.push(newSite);
    computeVoronoiCells();

    // Find the polygon for the new site
    const addedCell = voronoiPolygons[voronoiPolygons.length - 1];
    const centroid = getCentroid(addedCell.poly);

    if (prefersReducedMotion) {
      redrawGlassLayer();
    } else {
      growingPane = {
        poly: addedCell.poly,
        site: addedCell.site,
        centroid: centroid,
        startTime: performance.now(),
        duration: 620
      };
    }
  });

  // UI Palette Buttons
  const palButtons = document.querySelectorAll('[data-palette]');
  palButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      palButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyPalette(btn.dataset.palette);
    });
  });

  // Regenerate Button & Keybind
  function triggerRegenerate() {
    growingPane = null;
    generateSeeds();
    redrawGlassLayer();
  }

  document.getElementById('btnRegen').addEventListener('click', triggerRegenerate);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
      triggerRegenerate();
    }
  });

  // Init & Resize Watcher
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
