<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERCURY — Liquid Metal Metaballs</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #101113;
    color: #e0e2e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #bg-canvas, #main-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #grain-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.07;
    mix-blend-mode: overlay;
    background-repeat: repeat;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    z-index: 2;
  }
  .ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(20px, 3.5vw, 48px);
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, Monaco, "Liberation Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .label-right {
    display: inline;
  }
  .center-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    text-align: center;
    pointer-events: none;
  }
  .title {
    font-weight: 200;
    font-size: clamp(48px, 13.5vw, 300px);
    letter-spacing: 0.05em;
    color: #ffffff;
    line-height: 1;
    margin: 0;
    padding: 0;
    mix-blend-mode: difference;
    animation: titleReveal 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .hint {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.28em;
    opacity: 0.45;
    transition: opacity 0.8s ease-out;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    gap: 24px;
  }
  .footer-desc {
    max-width: 440px;
    font-size: 12px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.04em;
  }
  .stats {
    text-align: right;
    white-space: nowrap;
  }
  @keyframes titleReveal {
    0% {
      opacity: 0;
      filter: blur(24px);
      letter-spacing: 0.28em;
      transform: scale(1.04);
    }
    100% {
      opacity: 1;
      filter: blur(0px);
      letter-spacing: 0.05em;
      transform: scale(1);
    }
  }
  @media (max-width: 640px) {
    .label-right { display: none; }
    .footer-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .stats { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title {
      animation: none;
      opacity: 1;
      filter: none;
      letter-spacing: 0.05em;
      transform: none;
    }
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="main-canvas"></canvas>
<div id="grain-overlay"></div>

<div class="ui-layer">
  <header class="top-row mono">
    <span>Liquid metal study &middot; 05</span>
    <span class="label-right">Metaball field &middot; environment mapped</span>
  </header>

  <div class="center-stage">
    <h1 class="title">MERCURY</h1>
    <div id="hint-text" class="hint mono">Move to attract &middot; click to add</div>
  </div>

  <footer class="footer-row">
    <p class="footer-desc">
      Analytic field boundary threshold with sub-pixel gradient smoothing, environment lookup horizon reflection, and contact occlusion.
    </p>
    <div id="stats" class="stats mono">FPS 60 &middot; BODIES 7 &middot; SCALE 50%</div>
  </footer>
</div>

<script>
(function() {
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bgCanvas = document.getElementById('bg-canvas');
  const bgCtx = bgCanvas.getContext('2d');
  const mainCanvas = document.getElementById('main-canvas');
  const mainCtx = mainCanvas.getContext('2d', { alpha: true });
  const statsEl = document.getElementById('stats');
  const hintEl = document.getElementById('hint-text');

  let width = window.innerWidth;
  let height = window.innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  // Field scaling
  let bufferScale = 0.45;
  const minBufferScale = 0.28;
  const maxBufferScale = 0.60;
  const maxFieldPixels = 420000;

  let offWidth = Math.floor(width * bufferScale);
  let offHeight = Math.floor(height * bufferScale);
  let offCanvas = document.createElement('canvas');
  let offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
  let offImgData, offBuf32;

  // Lighting & Environment
  const keyLight = [-0.45, -0.62, 0.64];
  const kLen = Math.hypot(...keyLight);
  keyLight[0] /= kLen; keyLight[1] /= kLen; keyLight[2] /= kLen;

  function smoothstep(e0, e1, x) {
    let t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  function lerpColor(c1, c2, t) {
    return [
      c1[0] + (c2[0] - c1[0]) * t,
      c1[1] + (c2[1] - c1[1]) * t,
      c1[2] + (c2[2] - c1[2]) * t
    ];
  }

  const stops = [
    { p: 0.00, c: [14, 15, 18] },
    { p: 0.24, c: [40, 42, 48] },
    { p: 0.45, c: [88, 90, 96] },
    { p: 0.495, c: [210, 208, 204] },
    { p: 0.500, c: [250, 250, 252] },
    { p: 0.505, c: [210, 208, 204] },
    { p: 0.62, c: [190, 196, 206] },
    { p: 0.78, c: [128, 137, 150] },
    { p: 0.90, c: [72, 78, 90] },
    { p: 1.00, c: [26, 28, 34] }
  ];

  const envLUT = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    let t = i / 255;
    let col = stops[0].c;
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].p && t <= stops[s + 1].p) {
        let f = smoothstep(stops[s].p, stops[s + 1].p, t);
        col = lerpColor(stops[s].c, stops[s + 1].c, f);
        break;
      }
    }
    envLUT[i * 3 + 0] = Math.round(col[0]);
    envLUT[i * 3 + 1] = Math.round(col[1]);
    envLUT[i * 3 + 2] = Math.round(col[2]);
  }

  // Bodies simulation
  class Body {
    constructor(x, y, r, birth = false) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.targetR = r;
      this.r = birth ? 1 : r;
      this.seed = Math.random() * 1000;
      this.birthTime = birth ? performance.now() : 0;
      this.duration = 900;
    }
    updateRadius(now) {
      if (this.birthTime > 0) {
        let elapsed = now - this.birthTime;
        let progress = Math.min(1, elapsed / this.duration);
        this.r = Math.max(1, this.targetR * smoothstep(0, 1, progress));
        if (progress >= 1) this.birthTime = 0;
      }
    }
  }

  let bodies = [];

  function getBaseRadius() {
    const minDim = Math.min(width, height);
    return minDim * (0.09 + Math.random() * 0.10);
  }

  function initBodies() {
    bodies = [];
    const count = width < 600 ? 5 : 7;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const dist = Math.min(width, height) * 0.22;
      const bx = width * 0.5 + Math.cos(angle) * dist + (Math.random() - 0.5) * 40;
      const by = height * 0.48 + Math.sin(angle) * dist * 0.7 + (Math.random() - 0.5) * 40;
      bodies.push(new Body(bx, by, getBaseRadius(), false));
    }
  }

  // Resizing and Buffer Allocation
  function renderBackground() {
    bgCanvas.width = width * dpr;
    bgCanvas.height = height * dpr;
    bgCtx.resetTransform();
    bgCtx.scale(dpr, dpr);

    const grad = bgCtx.createRadialGradient(
      width * 0.5, height * 0.45, Math.min(width, height) * 0.05,
      width * 0.5, height * 0.45, Math.max(width, height) * 0.75
    );
    grad.addColorStop(0, '#232428');
    grad.addColorStop(0.55, '#1b1c1f');
    grad.addColorStop(1, '#101113');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, width, height);

    // Floor gradient
    const floorH = height * 0.38;
    const floorY = height - floorH;
    const fGrad = bgCtx.createLinearGradient(0, floorY, 0, height);
    fGrad.addColorStop(0, 'rgba(10, 11, 13, 0)');
    fGrad.addColorStop(1, 'rgba(7, 8, 10, 0.7)');
    bgCtx.fillStyle = fGrad;
    bgCtx.fillRect(0, floorY, width, floorH);
  }

  function updateBufferDims() {
    offWidth = Math.max(80, Math.floor(width * bufferScale));
    offHeight = Math.max(60, Math.floor(height * bufferScale));
    if (offWidth * offHeight > maxFieldPixels) {
      let ratio = Math.sqrt(maxFieldPixels / (offWidth * offHeight));
      offWidth = Math.floor(offWidth * ratio);
      offHeight = Math.floor(offHeight * ratio);
    }
    offCanvas.width = offWidth;
    offCanvas.height = offHeight;
    offImgData = offCtx.createImageData(offWidth, offHeight);
    offBuf32 = new Uint32Array(offImgData.data.buffer);
  }

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    mainCanvas.width = width * dpr;
    mainCanvas.height = height * dpr;

    renderBackground();
    updateBufferDims();

    if (bodies.length === 0) {
      initBodies();
    } else {
      bodies.forEach(b => {
        b.targetR = Math.min(width, height) * (0.09 + (b.seed % 0.10));
        if (b.birthTime === 0) b.r = b.targetR;
      });
    }

    if (prefersReducedMotion) {
      staticRun();
    }
  }

  // Pointer Interaction
  const pointer = {
    x: width / 2,
    y: height / 2,
    active: false,
    targetActive: 0,
    smoothActive: 0
  };
  let interacted = false;

  function markInteracted() {
    if (!interacted) {
      interacted = true;
      hintEl.style.opacity = '0';
    }
  }

  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
    pointer.targetActive = 1.0;
    markInteracted();
    if (prefersReducedMotion) requestAnimationFrame(render);
  });

  window.addEventListener('pointerleave', () => {
    pointer.targetActive = 0.0;
  });

  window.addEventListener('pointerdown', (e) => {
    markInteracted();
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    if (bodies.length >= 12) bodies.shift();
    bodies.push(new Body(pointer.x, pointer.y, getBaseRadius(), true));
    if (prefersReducedMotion) requestAnimationFrame(render);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR') {
      initBodies();
      if (prefersReducedMotion) staticRun();
    } else if (e.code === 'Space') {
      paused = !paused;
    }
  });

  window.addEventListener('resize', resize);

  let paused = false;

  function stepPhysics(timeSec, dt) {
    pointer.smoothActive += (pointer.targetActive - pointer.smoothActive) * 0.08;

    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];

      // Layered wander forces
      const t = timeSec * 0.8 + b.seed;
      const wanderX = (Math.sin(t * 1.3) + Math.cos(t * 0.67 + 1.2)) * 0.38;
      const wanderY = (Math.cos(t * 1.1) + Math.sin(t * 0.83 + 2.1)) * 0.38;
      b.vx += wanderX;
      b.vy += wanderY;

      // Soft center pull
      const cx = width * 0.5;
      const cy = height * 0.48;
      b.vx += (cx - b.x) * 0.00032;
      b.vy += (cy - b.y) * 0.00032;

      // Pointer pull
      if (pointer.smoothActive > 0.001) {
        const dx = pointer.x - b.x;
        const dy = pointer.y - b.y;
        const dist = Math.hypot(dx, dy) + 1.0;
        const pForce = (1 / (1 + dist * 0.005)) * 0.85 * pointer.smoothActive;
        b.vx += (dx / dist) * pForce;
        b.vy += (dy / dist) * pForce;
      }
    }

    // Pairwise breathing repulsion
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const b1 = bodies[i];
        const b2 = bodies[j];
        const dx = b2.x - b1.x;
        const dy = b2.y - b1.y;
        const dist = Math.hypot(dx, dy) || 1;
        const targetDist = (b1.r + b2.r) * 0.85;
        if (dist < targetDist) {
          const overlap = (targetDist - dist) / targetDist;
          const repulse = overlap * overlap * 0.95;
          const nx = dx / dist;
          const ny = dy / dist;
          b1.vx -= nx * repulse;
          b1.vy -= ny * repulse;
          b2.vx += nx * repulse;
          b2.vy += ny * repulse;
        }
      }
    }

    // Integrate & bounce
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      b.vx *= 0.985;
      b.vy *= 0.985;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      const pad = b.r * 0.6;
      if (b.x < pad) { b.x = pad; b.vx = Math.abs(b.vx) * 0.8; }
      if (b.x > width - pad) { b.x = width - pad; b.vx = -Math.abs(b.vx) * 0.8; }
      if (b.y < pad) { b.y = pad; b.vy = Math.abs(b.vy) * 0.8; }
      if (b.y > height - pad) { b.y = height - pad; b.vy = -Math.abs(b.vy) * 0.8; }
    }
  }

  // Draw contact shadows on floor
  function drawContactShadows() {
    mainCtx.save();
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      const floorDist = Math.max(10, (height * 0.88) - b.y);
      const intensity = Math.max(0, 1 - (floorDist / (height * 0.6)));
      if (intensity <= 0) continue;

      const shadowWidth = b.r * (1.2 + (1 - intensity) * 0.5);
      const shadowHeight = shadowWidth * 0.22;
      const shadowY = Math.min(height - 18, b.y + b.r * 0.92 + (height - b.y) * 0.08);

      const grad = mainCtx.createRadialGradient(
        b.x, shadowY, 0,
        b.x, shadowY, shadowWidth
      );
      const alpha = 0.55 * intensity;
      grad.addColorStop(0, `rgba(0, 0, 0, ${alpha.toFixed(3)})`);
      grad.addColorStop(0.5, `rgba(4, 5, 7, ${(alpha * 0.45).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      mainCtx.fillStyle = grad;
      mainCtx.beginPath();
      mainCtx.ellipse(b.x, shadowY, shadowWidth, shadowHeight, 0, 0, Math.PI * 2);
      mainCtx.fill();
    }
    mainCtx.restore();
  }

  // Metaball Field Pixel Evaluation
  function computeChromeField() {
    const scaleX = offWidth / width;
    const scaleY = offHeight / height;
    const nBodies = bodies.length;
    const localBodies = new Float64Array(nBodies * 3);

    for (let i = 0; i < nBodies; i++) {
      localBodies[i * 3 + 0] = bodies[i].x * scaleX;
      localBodies[i * 3 + 1] = bodies[i].y * scaleY;
      // Scaled radius in buffer coordinates
      const rBuffer = bodies[i].r * ((scaleX + scaleY) * 0.5);
      localBodies[i * 3 + 2] = rBuffer * rBuffer;
    }

    const eps = 1.0;
    let pIdx = 0;

    for (let y = 0; y < offHeight; y++) {
      for (let x = 0; x < offWidth; x++) {
        let f = 0;
        let gx = 0;
        let gy = 0;

        for (let i = 0; i < nBodies; i++) {
          const bx = localBodies[i * 3 + 0];
          const by = localBodies[i * 3 + 1];
          const r2 = localBodies[i * 3 + 2];

          const dx = x - bx;
          const dy = y - by;
          const d2 = dx * dx + dy * dy + eps;

          const invD2 = 1.0 / d2;
          const contrib = r2 * invD2;
          f += contrib;

          const dContrib = -2.0 * contrib * invD2;
          gx += dContrib * dx;
          gy += dContrib * dy;
        }

        if (f < 0.35) {
          offBuf32[pIdx++] = 0;
          continue;
        }

        const gradMag = Math.sqrt(gx * gx + gy * gy) || 0.0001;

        // Anti-alias edge: alpha = (f - 1)/|∇f| + 0.5 clamped to 0..1
        let alpha = (f - 1.0) / gradMag + 0.5;
        if (alpha <= 0.0) {
          offBuf32[pIdx++] = 0;
          continue;
        }
        if (alpha > 1.0) alpha = 1.0;

        // Surface normal
        // Tilt magnitude: (1/f)^1.6
        const tilt = Math.min(1.0, Math.pow(1.0 / Math.max(1.0, f), 1.6));
        const invGrad = 1.0 / gradMag;
        const normGx = gx * invGrad;
        const normGy = gy * invGrad;

        const xyLen = Math.min(0.9999, tilt);
        const nx = normGx * xyLen;
        const ny = normGy * xyLen;
        const nz = Math.sqrt(Math.max(0.0, 1.0 - (nx * nx + ny * ny)));

        // View vector V = (0, 0, 1)
        // Reflected vector R = V - 2*(V·N)*N = (-2*nz*nx, -2*nz*ny, 1 - 2*nz*nz)
        const twoNz = 2.0 * nz;
        const rx = -twoNz * nx;
        const ry = -twoNz * ny;
        const rz = 1.0 - twoNz * nz;

        // Sample Environment LUT by reflected Y mapped to 0..255
        const lutT = Math.max(0, Math.min(255, Math.floor(((ry * 0.5) + 0.5) * 255)));
        const lutIdx = lutT * 3;
        let cr = envLUT[lutIdx];
        let cg = envLUT[lutIdx + 1];
        let cb = envLUT[lutIdx + 2];

        // Left-to-right studio falloff based on reflected X
        const studioFade = 0.88 + 0.24 * (rx * 0.5 + 0.5);
        cr *= studioFade;
        cg *= studioFade;
        cb *= studioFade;

        // Cool-tinted Fresnel rim proportional to tilt^3
        const rim = tilt * tilt * tilt;
        cr += rim * 45;
        cg += rim * 62;
        cb += rim * 92;

        // Key light specular highlight: raised to 48th power
        const rDotL = rx * keyLight[0] + ry * keyLight[1] + rz * keyLight[2];
        if (rDotL > 0.0) {
          // rDotL^48 via exponentiation
          const spec = Math.pow(rDotL, 48) * 230;
          cr += spec;
          cg += spec;
          cb += spec;
        }

        // Faint diffuse term
        const nDotL = Math.max(0.0, nx * keyLight[0] + ny * keyLight[1] + nz * keyLight[2]);
        const diff = nDotL * 22;
        cr += diff;
        cg += diff;
        cb += diff;

        const aInt = (alpha * 255) | 0;
        const rInt = Math.min(255, cr | 0);
        const gInt = Math.min(255, cg | 0);
        const bInt = Math.min(255, cb | 0);

        offBuf32[pIdx++] = (aInt << 24) | (bInt << 16) | (gInt << 8) | rInt;
      }
    }

    offCtx.putImageData(offImgData, 0, 0);
  }

  function composite() {
    mainCtx.resetTransform();
    mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
    mainCtx.scale(dpr, dpr);

    drawContactShadows();

    mainCtx.imageSmoothingEnabled = true;
    mainCtx.imageSmoothingQuality = 'high';
    mainCtx.drawImage(offCanvas, 0, 0, width, height);
  }

  // Reduced motion pre-calculation
  function staticRun() {
    const fixedDt = 1.0;
    const totalTicks = Math.floor(4.0 / (1.0 / 60.0));
    let mockTime = 0;
    for (let step = 0; step < totalTicks; step++) {
      mockTime += 0.016;
      bodies.forEach(b => b.updateRadius(mockTime * 1000));
      stepPhysics(mockTime, fixedDt);
    }
    computeChromeField();
    composite();
    statsEl.textContent = `STATIC · BODIES ${bodies.length} · SCALE ${Math.round(bufferScale * 100)}%`;
  }

  // Dynamic Scale & FPS regulation
  let frameCount = 0;
  let lastTime = performance.now();
  let slowFrames = 0;
  let fastFrames = 0;
  let displayFps = 60;
  let fpsTimer = 0;

  function render(now) {
    if (!prefersReducedMotion) {
      requestAnimationFrame(render);
    }

    if (paused) return;

    const dtMs = Math.min(60, now - lastTime);
    lastTime = now;
    const dt = dtMs / 16.666;

    // Buffer scale adaptation
    if (dtMs > 26) {
      slowFrames++;
      fastFrames = 0;
      if (slowFrames >= 20) {
        if (bufferScale > minBufferScale) {
          bufferScale = Math.max(minBufferScale, bufferScale * 0.85);
          updateBufferDims();
        }
        slowFrames = 0;
      }
    } else {
      if (dtMs < 14) {
        fastFrames++;
        if (fastFrames >= 240) {
          if (bufferScale < maxBufferScale) {
            bufferScale = Math.min(maxBufferScale, bufferScale * 1.10);
            updateBufferDims();
          }
          fastFrames = 0;
        }
      } else {
        fastFrames = Math.max(0, fastFrames - 1);
      }
      slowFrames = Math.max(0, slowFrames - 1);
    }

    frameCount++;
    fpsTimer += dtMs;
    if (fpsTimer >= 500) {
      displayFps = Math.round((frameCount * 1000) / fpsTimer);
      frameCount = 0;
      fpsTimer = 0;
      statsEl.textContent = `FPS ${displayFps} · BODIES ${bodies.length} · SCALE ${Math.round(bufferScale * 100)}%`;
    }

    bodies.forEach(b => b.updateRadius(now));
    stepPhysics(now * 0.001, dt);
    computeChromeField();
    composite();
  }

  resize();

  if (prefersReducedMotion) {
    staticRun();
  } else {
    requestAnimationFrame((t) => {
      lastTime = t;
      render(t);
    });
  }
})();
</script>
</body>
</html>
