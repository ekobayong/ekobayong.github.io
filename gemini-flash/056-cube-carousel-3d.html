<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halden &amp; Voss — Hexagonal Prism Project Carousel</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-dark: #17181a;
    --concrete-mid: #2a2b2d;
    --concrete-light: #3b3d40;
    --steel: #8b96a3;
    --steel-light: #c3cad2;
    --amber: #e39b3a;
    --amber-deep: #b86f1c;
    --paper: #efe9df;
    
    --face-w: 340px;
    --face-h: 482px; /* 1:1.417 */
    --apothem: 294.44px; /* 340 * 0.866 */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  @media (max-width: 768px) {
    :root {
      --face-w: 240px;
      --face-h: 340px;
      --apothem: 207.84px;
    }
  }

  body {
    background-color: var(--bg-dark);
    color: var(--paper);
    font-family: var(--sans);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  /* SVG Noise & Ambient Glow */
  .noise-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.14;
    mix-blend-mode: overlay;
    background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
  }

  .ambient-light {
    position: fixed;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(140px);
    opacity: 0.22;
    transition: background-color 0.8s ease;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--amber) 0%, transparent 70%);
  }

  /* Header */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 90px;
    padding: 0 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--paper);
  }

  .brand-mark {
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--amber);
    transform: rotate(45deg);
    transition: transform 0.4s ease;
  }
  .brand:hover .brand-mark {
    transform: rotate(135deg);
  }

  .brand-title {
    font-family: var(--serif);
    font-size: 1.15rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 400;
  }

  nav ul {
    display: flex;
    list-style: none;
    gap: 36px;
  }

  nav a {
    color: var(--steel-light);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    position: relative;
    padding-bottom: 4px;
    transition: color 0.3s ease;
  }

  nav a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 1px;
    background-color: var(--amber);
    transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }

  nav a:hover {
    color: var(--paper);
  }
  nav a:hover::after {
    width: 100%;
  }

  /* 3D Stage */
  .stage-container {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: grab;
    touch-action: none;
    perspective: 1700px;
    perspective-origin: 50% calc(50% - 70px);
    z-index: 10;
  }

  .stage-container:active {
    cursor: grabbing;
  }

  .prism-assembly {
    position: relative;
    width: var(--face-w);
    height: var(--face-h);
    transform-style: preserve-3d;
  }

  .prism {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .prism-reflection {
    position: absolute;
    top: calc(var(--face-h) + 6px);
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: scaleY(-1);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 75%);
    mask-image: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 75%);
    filter: blur(4px) saturate(0.6);
    opacity: 0.55;
    pointer-events: none;
  }

  /* Face Geometry & Visuals */
  .face {
    position: absolute;
    inset: 0;
    width: var(--face-w);
    height: var(--face-h);
    background-color: #1a1b1e;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px 28px;
  }

  .face-shade {
    position: absolute;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.05s linear;
  }

  .face-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Abstract Project Artworks */
  .art-1 {
    background: radial-gradient(circle at 70% 30%, #2a2a2e 0%, #131416 80%);
  }
  .art-1::before {
    content: '';
    position: absolute;
    top: 25%;
    right: -10%;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    border: 32px solid var(--amber);
    opacity: 0.85;
    filter: drop-shadow(0 0 25px rgba(227,155,58,0.25));
  }

  .art-2 {
    background: linear-gradient(135deg, #1d1e22 0%, #111214 100%);
  }
  .art-2::before {
    content: '';
    position: absolute;
    bottom: -15%;
    left: -20%;
    width: 140%;
    height: 85%;
    background: #09090b;
    clip-path: polygon(0 20%, 100% 100%, 0 100%);
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  .art-2::after {
    content: '';
    position: absolute;
    bottom: 25%;
    left: 20%;
    width: 2px;
    height: 120px;
    background: var(--amber);
    transform: rotate(-35deg);
  }

  .art-3 {
    background: #17181c;
  }
  .art-3::before {
    content: '';
    position: absolute;
    inset: -50%;
    background: linear-gradient(75deg, transparent 40%, rgba(227, 155, 58, 0.15) 45%, rgba(239, 233, 223, 0.7) 50%, transparent 54%);
    transform: rotate(-15deg);
  }
  .art-3::after {
    content: '';
    position: absolute;
    top: 38%;
    left: 45%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #efe9df 0%, #8b96a3 70%, #2a2b2d 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .art-4 {
    background: #141517;
    background-image: 
      linear-gradient(rgba(139, 150, 163, 0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 150, 163, 0.12) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .art-4::after {
    content: '';
    position: absolute;
    top: 40%;
    left: 30%;
    width: 95px;
    height: 95px;
    background: var(--amber);
    box-shadow: 14px 14px 0 #000;
  }

  .art-5 {
    background: radial-gradient(circle at 50% 60%, #5e2f0d 0%, #20130c 55%, #121315 90%);
  }
  .art-5::before, .art-5::after {
    content: '';
    position: absolute;
    border: 1px solid rgba(227, 155, 58, 0.4);
  }
  .art-5::before {
    top: 28%;
    left: 18%;
    width: 60%;
    height: 48%;
  }
  .art-5::after {
    top: 34%;
    left: 26%;
    width: 58%;
    height: 46%;
    border-color: rgba(239, 233, 223, 0.7);
    background: rgba(184, 111, 28, 0.12);
    backdrop-filter: blur(2px);
  }

  .art-6 {
    background: #e8e2d5;
  }
  .art-6-poly {
    position: absolute;
    bottom: 0;
    left: 15%;
    width: 70%;
    height: 44%;
    background: #18191b;
    clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 0% 100%, 0% 40%);
  }
  .art-6-needle {
    position: absolute;
    bottom: 43%;
    left: 50%;
    width: 2px;
    height: 120px;
    background: var(--amber-deep);
    transform: translateX(-50%);
  }

  /* Poster Typography */
  .face-content {
    position: relative;
    z-index: 2;
    pointer-events: none;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .art-6 ~ .face-content {
    color: #17181a;
  }

  .poster-numeral {
    position: absolute;
    top: -18px;
    left: -12px;
    font-family: var(--serif);
    font-size: calc(var(--face-w) * 0.62);
    line-height: 0.85;
    font-weight: 300;
    opacity: 0.13;
    pointer-events: none;
  }
  .art-6 ~ .face-content .poster-numeral {
    color: #000;
    opacity: 0.08;
  }

  .poster-meta {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    opacity: 0.85;
  }

  .poster-title-box {
    margin-top: auto;
    margin-bottom: 24px;
  }

  .poster-title {
    font-family: var(--serif);
    font-size: 1.85rem;
    line-height: 1.1;
    font-weight: 400;
  }

  .poster-title em {
    font-style: italic;
    color: var(--amber);
    font-family: var(--serif);
  }
  .art-6 ~ .face-content .poster-title em {
    color: var(--amber-deep);
  }

  .poster-category {
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 6px;
  }

  /* Info Panel (Bottom Left) */
  .info-panel {
    position: fixed;
    bottom: 54px;
    left: 54px;
    width: 380px;
    z-index: 40;
    pointer-events: none;
  }

  .info-kicker {
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .mask-wrap {
    overflow: hidden;
  }

  .info-title {
    font-family: var(--serif);
    font-size: 2.3rem;
    line-height: 1.08;
    font-weight: 400;
    margin-bottom: 14px;
    color: var(--paper);
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.55s ease;
  }

  .info-desc {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--steel-light);
    margin-bottom: 20px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.05s, opacity 0.55s ease 0.05s;
  }

  .info-facts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 16px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.1s, opacity 0.55s ease 0.1s;
  }

  .fact-item h5 {
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .fact-item p {
    font-size: 0.75rem;
    color: var(--paper);
    font-weight: 400;
  }

  .text-slide-out {
    transform: translateY(105%);
    opacity: 0;
  }

  /* Counter (Right) */
  .counter-display {
    position: fixed;
    right: 54px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    font-family: var(--serif);
  }

  .counter-active {
    font-size: 1.8rem;
    color: var(--paper);
  }

  .counter-bar {
    width: 1px;
    height: 48px;
    background: rgba(255,255,255,0.2);
  }

  .counter-total {
    font-size: 0.95rem;
    color: var(--steel);
  }

  /* Indicators (Bottom Center) */
  .indicators {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 40;
  }

  .indicator-track {
    width: 32px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
  }

  .indicator-line {
    width: 16px;
    height: 2px;
    background-color: var(--concrete-light);
    transition: width 0.4s ease, background-color 0.4s ease;
    border-radius: 1px;
  }

  .indicator-track:hover .indicator-line {
    background-color: var(--steel);
  }

  .indicator-track.active .indicator-line {
    width: 32px;
    background-color: var(--amber);
  }

  /* Responsive styling */
  @media (max-width: 900px) {
    header {
      padding: 0 24px;
    }
    nav ul {
      display: none;
    }
    .info-panel {
      bottom: 90px;
      left: 24px;
      right: 24px;
      width: auto;
    }
    .info-desc {
      display: none;
    }
    .counter-display {
      display: none;
    }
    .indicators {
      bottom: 24px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="noise-overlay"></div>
<div class="ambient-light" id="ambientLight"></div>

<header>
  <a href="#" class="brand" aria-label="Halden &amp; Voss Architecture">
    <div class="brand-mark"></div>
    <span class="brand-title">Halden &amp; Voss</span>
  </a>
  <nav>
    <ul>
      <li><a href="#projects">Work</a></li>
      <li><a href="#profile">Studio</a></li>
      <li><a href="#monographs">Archive</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="stage-container" id="stage" aria-label="3D Hexagonal Project Carousel">
  <div class="prism-assembly">
    <div class="prism" id="prism"></div>
    <div class="prism-reflection" id="prismReflection"></div>
  </div>
</main>

<aside class="info-panel" aria-live="polite">
  <div class="info-kicker" id="infoIndex">Project 01 / 06</div>
  <div class="mask-wrap">
    <h2 class="info-title" id="infoTitle">Aura Pavilion</h2>
  </div>
  <div class="mask-wrap">
    <p class="info-desc" id="infoDesc">
      A circular bronze sanctuary poised over granite tidal pools, calibrated to focus coastal twilight through fine structural apertures.
    </p>
  </div>
  <div class="mask-wrap">
    <div class="info-facts" id="infoFacts">
      <div class="fact-item">
        <h5>Client</h5>
        <p id="factClient">Oslo Kommune</p>
      </div>
      <div class="fact-item">
        <h5>Material</h5>
        <p id="factMaterial">Patinated Bronze</p>
      </div>
      <div class="fact-item">
        <h5>Status</h5>
        <p id="factStatus">Built 2024</p>
      </div>
    </div>
  </div>
</aside>

<div class="counter-display" aria-hidden="true">
  <span class="counter-active" id="counterCurrent">01</span>
  <div class="counter-bar"></div>
  <span class="counter-total">06</span>
</div>

<nav class="indicators" id="indicators" aria-label="Project selection"></nav>

<script>
(function() {
  const PROJECTS = [
    {
      id: '01',
      title: 'Aura <em>Pavilion</em>',
      titlePlain: 'Aura Pavilion',
      city: 'Oslo, NO',
      year: '2024',
      category: 'Public Installation',
      color: '#e39b3a',
      desc: 'A circular bronze sanctuary poised over granite tidal pools, calibrated to focus coastal twilight through fine structural apertures.',
      client: 'Oslo Kommune',
      material: 'Bronze & Terrazzo',
      status: 'Built 2024',
      artClass: 'art-1'
    },
    {
      id: '02',
      title: 'Monolith <em>House</em>',
      titlePlain: 'Monolith House',
      city: 'Bergen, NO',
      year: '2023',
      category: 'Residential',
      color: '#c3cad2',
      desc: 'Carved basalt volumes embedded directly into the steep western fjords, providing extreme shelter with minimal envelope impact.',
      client: 'Private Foundation',
      material: 'Black Gabbro',
      status: 'Built 2023',
      artClass: 'art-2'
    },
    {
      id: '03',
      title: 'Vind <em>Observatory</em>',
      titlePlain: 'Vind Observatory',
      city: 'Tromsø, NO',
      year: '2023',
      category: 'Research Facility',
      color: '#8b96a3',
      desc: 'An aerodynamic timber sphere designed to deflect Arctic gales while providing silent acoustic observation platforms for deep sky monitoring.',
      client: 'Nordic Science Council',
      material: 'Larch & Titanium',
      status: 'Built 2023',
      artClass: 'art-3'
    },
    {
      id: '04',
      title: 'Grid <em>Logistics</em>',
      titlePlain: 'Grid Logistics',
      city: 'Rotterdam, NL',
      year: '2022',
      category: 'Infrastructure',
      color: '#e39b3a',
      desc: 'A modular hyper-rational automated freight terminal clad in micro-perforated steel, turning logistical mechanics into urban rhythm.',
      client: 'Havenbedrijf',
      material: 'Galvanized Steel',
      status: 'Built 2022',
      artClass: 'art-4'
    },
    {
      id: '05',
      title: 'Kupfer <em>Atelier</em>',
      titlePlain: 'Kupfer Atelier',
      city: 'Basel, CH',
      year: '2021',
      category: 'Studio & Gallery',
      color: '#b86f1c',
      desc: 'Stacked intersecting galleries wrapped in hot-rolled copper leaf that ages dynamically against surrounding concrete industrial zones.',
      client: 'Kupfer Stiftung',
      material: 'Oxidized Copper',
      status: 'Built 2021',
      artClass: 'art-5'
    },
    {
      id: '06',
      title: 'Spire <em>Sanctuary</em>',
      titlePlain: 'Spire Sanctuary',
      city: 'Kyoto, JP',
      year: '2020',
      category: 'Sacred Architecture',
      color: '#efe9df',
      desc: 'A quiet timber assembly anchored by an ultra-slender polished brass needle, establishing a meditative axis inside an ancient cedar grove.',
      client: 'Zen Heritage Trust',
      material: 'Charred Cedar & Brass',
      status: 'Built 2020',
      artClass: 'art-6'
    }
  ];

  const prism = document.getElementById('prism');
  const prismReflection = document.getElementById('prismReflection');
  const stage = document.getElementById('stage');
  const indicatorsContainer = document.getElementById('indicators');
  const ambientLight = document.getElementById('ambientLight');

  const infoIndex = document.getElementById('infoIndex');
  const infoTitle = document.getElementById('infoTitle');
  const infoDesc = document.getElementById('infoDesc');
  const infoFacts = document.getElementById('infoFacts');
  const counterCurrent = document.getElementById('counterCurrent');
  const factClient = document.getElementById('factClient');
  const factMaterial = document.getElementById('factMaterial');
  const factStatus = document.getElementById('factStatus');

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Build faces inside prism and reflection
  function buildFaces(target, isReflection = false) {
    PROJECTS.forEach((p, i) => {
      const face = document.createElement('div');
      face.className = 'face';
      face.dataset.index = i;

      let extraArt = '';
      if (p.artClass === 'art-6') {
        extraArt = '<div class="art-6-poly"></div><div class="art-6-needle"></div>';
      }

      face.innerHTML = `
        <div class="face-bg ${p.artClass}">${extraArt}</div>
        <div class="face-content">
          <div class="poster-numeral">${p.id}</div>
          <div class="poster-meta">
            <span>${p.city}</span>
            <span>${p.year}</span>
          </div>
          <div class="poster-title-box">
            <div class="poster-title">${p.title}</div>
            <div class="poster-category">${p.category}</div>
          </div>
        </div>
        <div class="face-shade"></div>
      `;

      if (!isReflection) {
        face.addEventListener('click', (e) => {
          if (hasDragged) return;
          rotateToIndex(i);
        });
      }

      target.appendChild(face);
    });
  }

  buildFaces(prism);
  buildFaces(prismReflection, true);

  // Indicators
  PROJECTS.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = `indicator-track ${i === 0 ? 'active' : ''}`;
    btn.setAttribute('aria-label', `Go to project ${i + 1}`);
    btn.innerHTML = `<span class="indicator-line"></span>`;
    btn.addEventListener('click', () => rotateToIndex(i));
    indicatorsContainer.appendChild(btn);
  });

  // Geometry configuration
  function getApothem() {
    const w = window.innerWidth <= 768 ? 240 : 340;
    return w * 0.8660254; // tan(60) / 2 = 0.866
  }

  function layoutFaces() {
    const apothem = getApothem();
    const faceEls = prism.querySelectorAll('.face');
    const reflEls = prismReflection.querySelectorAll('.face');

    faceEls.forEach((el, i) => {
      el.style.transform = `rotateY(${i * 60}deg) translateZ(${apothem}px)`;
    });
    reflEls.forEach((el, i) => {
      el.style.transform = `rotateY(${i * 60}deg) translateZ(${apothem}px)`;
    });
  }

  layoutFaces();
  window.addEventListener('resize', layoutFaces);

  // Physics state
  let currentAngle = 0;
  let targetAngle = 0;
  let velocity = 0;
  let activeIndex = 0;

  const stiffness = 42;
  const damping = 9.5;

  let isDragging = false;
  let startX = 0;
  let lastDragX = 0;
  let lastDragTime = 0;
  let dragVelocity = 0;
  let hasDragged = false;

  function updateShading(angle) {
    const shades = prism.querySelectorAll('.face-shade');
    const reflShades = prismReflection.querySelectorAll('.face-shade');

    shades.forEach((shade, i) => {
      const faceAngleRad = ((angle + i * 60) * Math.PI) / 180;
      // Front facing is cos(faceAngleRad) == 1
      const cosVal = Math.cos(faceAngleRad);
      // Intensity 0 at direct front, up to 0.85 when facing side/back
      const darkness = Math.max(0, Math.min(0.85, (1 - cosVal) * 0.6));
      shade.style.opacity = darkness;
      if (reflShades[i]) {
        reflShades[i].style.opacity = Math.min(0.9, darkness + 0.1);
      }
    });
  }

  function updateAmbientLight(angle) {
    const rad = (angle * Math.PI) / 180;
    const xOffset = Math.sin(rad) * 180;
    const yOffset = Math.cos(rad * 2) * 90;
    ambientLight.style.left = `calc(50% + ${xOffset}px)`;
    ambientLight.style.top = `calc(45% + ${yOffset}px)`;
  }

  function getNearestIndex(angle) {
    let rawIndex = Math.round(-angle / 60) % 6;
    if (rawIndex < 0) rawIndex += 6;
    return rawIndex;
  }

  function setInfoContent(index) {
    if (index === activeIndex) return;
    activeIndex = index;
    const project = PROJECTS[index];

    // Indicator update
    const dots = indicatorsContainer.querySelectorAll('.indicator-track');
    dots.forEach((d, idx) => d.classList.toggle('active', idx === index));

    // Counter
    counterCurrent.textContent = project.id;
    infoIndex.textContent = `Project ${project.id} / 06`;

    // Ambient glow color
    ambientLight.style.background = `radial-gradient(circle, ${project.color} 0%, transparent 70%)`;

    if (prefersReduced) {
      infoTitle.innerHTML = project.title;
      infoDesc.textContent = project.desc;
      factClient.textContent = project.client;
      factMaterial.textContent = project.material;
      factStatus.textContent = project.status;
      return;
    }

    // Slide transition
    infoTitle.classList.add('text-slide-out');
    infoDesc.classList.add('text-slide-out');
    infoFacts.classList.add('text-slide-out');

    setTimeout(() => {
      infoTitle.innerHTML = project.title;
      infoDesc.textContent = project.desc;
      factClient.textContent = project.client;
      factMaterial.textContent = project.material;
      factStatus.textContent = project.status;

      infoTitle.classList.remove('text-slide-out');
      infoDesc.classList.remove('text-slide-out');
      infoFacts.classList.remove('text-slide-out');
    }, 250);
  }

  function rotateToIndex(index) {
    // Determine shortest angular distance to target index
    const currentNearest = Math.round(-targetAngle / 60);
    let diff = (index - (currentNearest % 6)) % 6;
    if (diff > 3) diff -= 6;
    if (diff < -3) diff += 6;
    targetAngle = -(currentNearest + diff) * 60;
  }

  // Animation Loop
  let lastTimestamp = performance.now();

  function animate(now) {
    const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
    lastTimestamp = now;

    if (!isDragging) {
      if (prefersReduced) {
        currentAngle = targetAngle;
        velocity = 0;
      } else {
        const displacement = targetAngle - currentAngle;
        const springForce = displacement * stiffness;
        const dampingForce = -velocity * damping;
        const acceleration = springForce + dampingForce;

        velocity += acceleration * dt;
        currentAngle += velocity * dt;
      }
    }

    // Apply rotation
    prism.style.transform = `rotateY(${currentAngle}deg)`;
    prismReflection.style.transform = `scaleY(-1) rotateY(${currentAngle}deg)`;

    updateShading(currentAngle);
    updateAmbientLight(currentAngle);

    const nearest = getNearestIndex(currentAngle);
    if (nearest !== activeIndex && Math.abs(velocity) < 60) {
      setInfoContent(nearest);
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

  // Drag Interaction
  stage.addEventListener('pointerdown', (e) => {
    isDragging = true;
    hasDragged = false;
    startX = e.clientX;
    lastDragX = e.clientX;
    lastDragTime = performance.now();
    dragVelocity = 0;
    velocity = 0;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - lastDragX;
    const now = performance.now();
    const dt = Math.max(now - lastDragTime, 1);

    if (Math.abs(e.clientX - startX) > 4) {
      hasDragged = true;
    }

    currentAngle += deltaX * 0.35;
    targetAngle = currentAngle;
    dragVelocity = (deltaX / dt) * 1000 * 0.35;

    lastDragX = e.clientX;
    lastDragTime = now;
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;

    // Apply inertia snapping clamp to ±2.5 faces (150deg)
    const inertia = Math.max(-150, Math.min(150, dragVelocity * 0.35));
    const projectedAngle = currentAngle + inertia;

    // Snap to nearest 60deg
    targetAngle = Math.round(projectedAngle / 60) * 60;
  });

  // Wheel / Trackpad
  let wheelTimeout = null;
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(delta) < 4) return;

    if (!wheelTimeout) {
      if (delta > 0) {
        targetAngle -= 60;
      } else {
        targetAngle += 60;
      }
      wheelTimeout = setTimeout(() => {
        wheelTimeout = null;
      }, 160);
    }
  }, { passive: false });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') {
      targetAngle -= 60;
    } else if (e.key === 'ArrowLeft') {
      targetAngle += 60;
    } else if (['1','2','3','4','5','6'].includes(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      rotateToIndex(idx);
    }
  });

})();
</script>
</body>
</html>
