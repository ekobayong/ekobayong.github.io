<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jumpgate — Hyperspace Warp Tunnel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
      color: #7fc4ff;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      background: #000000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .cinematic-bar {
      position: absolute;
      left: 0;
      width: 100%;
      height: 6vh;
      background-color: #000000;
      z-index: 20;
      pointer-events: none;
    }
    .cinematic-bar.top { top: 0; border-bottom: 1px solid rgba(61, 139, 255, 0.15); }
    .cinematic-bar.bottom { bottom: 0; border-top: 1px solid rgba(61, 139, 255, 0.15); }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.5) 75%, rgba(0, 0, 0, 0.95) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 11;
      mix-blend-mode: overlay;
    }

    #flash {
      position: absolute;
      inset: 0;
      background-color: #f4f8ff;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.08s ease-out;
    }

    .hud-layer {
      position: absolute;
      inset: 6vh 0 6vh 0;
      pointer-events: none;
      z-index: 15;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      text-shadow: 0 0 8px rgba(127, 196, 255, 0.6);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .hud-center-top {
      text-align: center;
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
    }
    .title {
      font-size: 1.25rem;
      font-weight: 200;
      letter-spacing: 0.5em;
      color: #f4f8ff;
      margin-bottom: 0.25rem;
      text-indent: 0.5em;
    }
    .instruction {
      font-size: 0.65rem;
      color: #3d8bff;
      opacity: 0.85;
      transition: opacity 1s ease;
      letter-spacing: 0.2em;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      position: relative;
    }

    .gauge-container {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 320px;
    }
    .speed-number {
      font-size: 3.5rem;
      font-weight: 200;
      line-height: 1;
      color: #f4f8ff;
      letter-spacing: 0.05em;
      transition: text-shadow 0.1s;
    }
    .speed-number.supercharged {
      text-shadow: 0 0 20px #f4f8ff, 0 0 35px #7fc4ff;
    }
    .speed-unit {
      font-size: 0.9rem;
      color: #7fc4ff;
      margin-left: 0.25rem;
    }
    .stage-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: #8a5cff;
      margin-top: 0.25rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .bar-track {
      width: 100%;
      height: 3px;
      background: rgba(61, 139, 255, 0.2);
      position: relative;
      overflow: hidden;
      border-radius: 1.5px;
    }
    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #3d8bff, #8a5cff 60%, #f4f8ff);
      box-shadow: 0 0 8px #7fc4ff;
    }

    .data-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      line-height: 1.3;
    }
    .data-row {
      display: flex;
      gap: 0.75rem;
    }
    .data-label {
      color: #3d8bff;
      min-width: 90px;
    }
    .data-value {
      color: #f4f8ff;
    }

    .reticle-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      pointer-events: none;
      z-index: 12;
      opacity: 0.85;
    }
    .reticle-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .ring-outer {
      transform-origin: center;
      animation: spinCW 14s linear infinite;
    }
    .ring-inner {
      transform-origin: center;
      animation: spinCCW 22s linear infinite;
    }
    .reticle-dot {
      animation: dotPulse 2s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.6); opacity: 1; filter: drop-shadow(0 0 4px #7fc4ff); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-outer, .ring-inner, .reticle-dot {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="warp-canvas"></canvas>
  </div>
  <div class="cinematic-bar top"></div>
  <div class="cinematic-bar bottom"></div>
  <div class="vignette-overlay"></div>
  <div class="scanlines"></div>
  <div id="flash"></div>

  <div class="reticle-wrap">
    <svg class="reticle-svg" viewBox="-80 -80 160 160">
      <circle class="ring-outer" cx="0" cy="0" r="54" fill="none" stroke="#3d8bff" stroke-width="1" stroke-dasharray="14 10 32 10" stroke-opacity="0.6"/>
      <circle class="ring-inner" cx="0" cy="0" r="32" fill="none" stroke="#7fc4ff" stroke-width="1.2" stroke-dasharray="6 24 18 12" stroke-opacity="0.7"/>
      <!-- Crosshairs -->
      <line x1="-65" y1="0" x2="-45" y2="0" stroke="#8a5cff" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="45" y1="0" x2="65" y2="0" stroke="#8a5cff" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="0" y1="-65" x2="0" y2="-45" stroke="#8a5cff" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="0" y1="45" x2="0" y2="65" stroke="#8a5cff" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle class="reticle-dot" cx="0" cy="0" r="2.5" fill="#f4f8ff"/>
    </svg>
  </div>

  <div class="hud-layer">
    <div class="hud-top">
      <div class="data-group">
        <div class="data-row"><span class="data-label">VECTOR</span><span class="data-value">092.4//+18.7</span></div>
        <div class="data-row"><span class="data-label">GATE ID</span><span class="data-value">JG-EPSILON-9</span></div>
        <div class="data-row"><span class="data-label">HULL INT</span><span class="data-value" id="hud-hull">100.0%</span></div>
      </div>
      <div class="hud-center-top">
        <div class="title">JUMPGATE</div>
        <div class="instruction" id="hud-prompt">HOLD SPACEBAR OR TOUCH/CLICK TO ENGAGE WARP</div>
      </div>
      <div class="data-group" style="text-align: right;">
        <div class="data-row" style="justify-content: flex-end;"><span class="data-label">DRIVE</span><span class="data-value" id="hud-drive">IDLE</span></div>
        <div class="data-row" style="justify-content: flex-end;"><span class="data-label">STARS</span><span class="data-value" id="hud-stars">0</span></div>
        <div class="data-row" style="justify-content: flex-end;"><span class="data-label">FPS</span><span class="data-value" id="hud-fps">60</span></div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="data-group">
        <div class="data-row"><span class="data-label">DIST LY</span><span class="data-value" id="hud-dist">0.0000</span></div>
        <div class="data-row"><span class="data-label">TIME</span><span class="data-value" id="hud-time">00:00.0</span></div>
      </div>

      <div class="gauge-container">
        <div>
          <span class="speed-number" id="hud-speed">0.00</span>
          <span class="speed-unit">c</span>
        </div>
        <div class="stage-label" id="hud-stage">SUBLIGHT</div>
        <div class="bar-track">
          <div class="bar-fill" id="hud-bar"></div>
        </div>
      </div>

      <div class="data-group" style="text-align: right;">
        <div class="data-row" style="justify-content: flex-end;"><span class="data-label">DISP DEV</span><span class="data-value" id="hud-shake">0.00px</span></div>
        <div class="data-row" style="justify-content: flex-end;"><span class="data-label">CHROMA</span><span class="data-value" id="hud-chroma">STABLE</span></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('warp-canvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');
    const hudPrompt = document.getElementById('hud-prompt');
    const hudSpeed = document.getElementById('hud-speed');
    const hudStage = document.getElementById('hud-stage');
    const hudBar = document.getElementById('hud-bar');
    const hudDrive = document.getElementById('hud-drive');
    const hudHull = document.getElementById('hud-hull');
    const hudStars = document.getElementById('hud-stars');
    const hudFps = document.getElementById('hud-fps');
    const hudDist = document.getElementById('hud-dist');
    const hudTime = document.getElementById('hud-time');
    const hudShake = document.getElementById('hud-shake');
    const hudChroma = document.getElementById('hud-chroma');

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let width = 0;
    let height = 0;
    let dpr = 1;
    let cx = 0;
    let cy = 0;

    const FOCAL_LENGTH = 420;
    const Z_MIN = 20;
    const Z_MAX = 3000;
    const RING_COUNT = 14;

    let speed = 0.0;
    let targetSpeed = 0.0;
    let hasEngaged = false;
    let flashTriggered = false;
    let distanceLy = 0;
    let startTime = performance.now();
    let lastTime = startTime;
    let frameCount = 0;
    let lastFpsUpdate = startTime;

    // Colors
    const COLOR_VIOLET = '#8a5cff';
    const COLOR_BLUE = '#3d8bff';
    const COLOR_ICE = '#7fc4ff';
    const COLOR_WHITE = '#f4f8ff';

    // Stars
    let stars = [];
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      cx = (width * dpr) / 2;
      cy = (height * dpr) / 2;

      const area = width * height;
      const count = Math.round(Math.min(1400, Math.max(350, area / 1100)));
      initStars(count);
      hudStars.textContent = count;
    }

    function initStars(count) {
      stars = [];
      for (let i = 0; i < count; i++) {
        const p = Math.random();
        let color = COLOR_WHITE;
        if (p < 0.12) color = COLOR_VIOLET;
        else if (p < 0.67) color = COLOR_BLUE;
        else color = COLOR_ICE;

        // Spread stars in an open cylindrical ring around vanishing line
        const ang = Math.random() * Math.PI * 2;
        const rad = 200 + Math.pow(Math.random(), 0.6) * 1600;

        stars.push({
          x: Math.cos(ang) * rad,
          y: Math.sin(ang) * rad,
          z: Math.random() * (Z_MAX - Z_MIN) + Z_MIN,
          size: Math.random() * 1.5 + 0.8,
          color: color
        });
      }
    }

    // Tunnel Rings
    const rings = [];
    for (let i = 0; i < RING_COUNT; i++) {
      rings.push({
        z: Z_MIN + (i / RING_COUNT) * (Z_MAX - Z_MIN),
        rot: (i * Math.PI) / 7
      });
    }

    // Input Handlers
    function setThrust(state) {
      targetSpeed = state ? 1.0 : 0.0;
      if (state && !hasEngaged) {
        hasEngaged = true;
        hudPrompt.style.opacity = '0';
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        setThrust(true);
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        setThrust(false);
      }
    });
    window.addEventListener('mousedown', () => setThrust(true));
    window.addEventListener('mouseup', () => setThrust(false));
    window.addEventListener('touchstart', (e) => { e.preventDefault(); setThrust(true); }, { passive: false });
    window.addEventListener('touchend', (e) => { e.preventDefault(); setThrust(false); }, { passive: false });
    window.addEventListener('resize', resize);

    function getOctagonVertices(radius, rot) {
      const pts = [];
      for (let i = 0; i < 8; i++) {
        const a = rot + (i * Math.PI) / 4;
        pts.push({
          x: Math.cos(a) * radius,
          y: Math.sin(a) * radius
        });
      }
      return pts;
    }

    function render(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Speed Easing (Faster ramp up, smooth coast down)
      const easeFactor = targetSpeed > speed ? 1.4 * dt : 0.65 * dt;
      speed += (targetSpeed - speed) * easeFactor;

      // Flash Trigger around 0.93
      if (speed >= 0.93 && !flashTriggered) {
        flashEl.style.opacity = '0.9';
        setTimeout(() => { flashEl.style.opacity = '0'; }, 100);
        flashTriggered = true;
      } else if (speed < 0.88) {
        flashTriggered = false;
      }

      // Distance & HUD metrics
      const cVelocity = speed * 9.99;
      distanceLy += (cVelocity * dt * 0.18);
      const elapsed = (now - startTime) / 1000;
      const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const secs = (elapsed % 60).toFixed(1).padStart(4, '0');
      hudTime.textContent = `${mins}:${secs}`;
      hudDist.textContent = distanceLy.toFixed(4);

      // Camera Shake
      let shakeX = 0;
      let shakeY = 0;
      let shakeVal = 0;
      if (!prefersReducedMotion && speed > 0.75) {
        const shakeNorm = (speed - 0.75) / 0.25;
        shakeVal = Math.pow(shakeNorm, 1.8) * 6;
        shakeX = (Math.random() - 0.5) * shakeVal * dpr;
        shakeY = (Math.random() - 0.5) * shakeVal * dpr;
      }
      hudShake.textContent = `${(shakeVal).toFixed(2)}px`;
      hudChroma.textContent = speed > 0.75 ? `ACTIVE (+${((speed-0.75)*24).toFixed(1)}px)` : 'STABLE';

      // Drive State Text
      if (speed > 0.96) hudDrive.textContent = 'HYPERDRIVE [MAX]';
      else if (targetSpeed === 1.0) hudDrive.textContent = 'BURN >> WARP';
      else if (speed > 0.05) hudDrive.textContent = 'COAST DECAY';
      else hudDrive.textContent = 'IDLE';

      // Speed and Stage HUD
      hudSpeed.textContent = cVelocity.toFixed(2);
      if (speed >= 0.97) {
        hudSpeed.classList.add('supercharged');
      } else {
        hudSpeed.classList.remove('supercharged');
      }

      let stage = 'SUBLIGHT';
      if (speed > 0.92) stage = 'HYPERSPACE THRESHOLD';
      else if (speed > 0.65) stage = 'WARP FIELD ACCELERATION';
      else if (speed > 0.25) stage = 'WARP ENTRY PHASE';
      hudStage.textContent = stage;
      hudBar.style.width = `${Math.min(100, Math.max(0, speed * 100))}%`;

      // Hull Integrity drops to ~97.4% under max hyperwarp strain
      const hull = 100 - (speed > 0.8 ? (speed - 0.8) * 13 : 0);
      hudHull.textContent = `${hull.toFixed(1)}%`;
      if (hull < 98.5) hudHull.style.color = '#8a5cff';
      else hudHull.style.color = '#f4f8ff';

      // Canvas Fade (Trail Persistence decreases fade alpha)
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const fadeAlpha = 0.35 - (speed * 0.24); // 0.35 down to 0.11
      ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0.08, fadeAlpha)})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center with shake
      ctx.translate(cx + shakeX, cy + shakeY);

      // Core Vanishing Glow
      const glowRadius = (40 + Math.pow(speed, 2.5) * 480) * dpr;
      const coreGrad = ctx.createRadialGradient(0, 0, 2 * dpr, 0, 0, glowRadius);
      coreGrad.addColorStop(0, `rgba(244, 248, 255, ${0.4 + speed * 0.6})`);
      coreGrad.addColorStop(0.2, `rgba(127, 196, 255, ${0.35 + speed * 0.45})`);
      coreGrad.addColorStop(0.55, `rgba(61, 139, 255, ${0.15 + speed * 0.3})`);
      coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // "lighter" Blend mode for optical neon hyper-luminance
      ctx.globalCompositeOperation = 'lighter';

      // 1. Render Tunnel Rings & Struts
      const ringRadius = 450 * dpr;
      const baseTunnelSpeed = 40 + Math.pow(speed, 2) * 3400;
      const ringZStep = (Z_MAX - Z_MIN) / RING_COUNT;

      for (let i = 0; i < rings.length; i++) {
        const ring = rings[i];
        ring.z -= baseTunnelSpeed * dt;
        ring.rot += (0.15 + speed * 1.8) * dt;

        if (ring.z < Z_MIN) {
          ring.z += (Z_MAX - Z_MIN);
        }
      }

      // Sort rings back to front for proper strut drawing
      rings.sort((a, b) => b.z - a.z);

      for (let i = 0; i < rings.length; i++) {
        const ring = rings[i];
        const scale = (FOCAL_LENGTH * dpr) / ring.z;
        const pts = getOctagonVertices(ringRadius * scale, ring.rot);

        // Ring Glow & Stroke
        const ringAlpha = Math.min(1, Math.max(0.05, (ring.z - Z_MIN) / 600)) * (1 - (ring.z / Z_MAX));
        ctx.strokeStyle = `rgba(61, 139, 255, ${ringAlpha * 0.85})`;
        ctx.shadowColor = COLOR_BLUE;
        ctx.shadowBlur = (4 + speed * 10) * dpr;
        ctx.lineWidth = Math.max(1, 1.8 * scale);

        ctx.beginPath();
        for (let j = 0; j < 8; j++) {
          const pt = pts[j];
          if (j === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        ctx.stroke();

        // Longitudinal struts between alternating rings
        if (i < rings.length - 1 && (i % 2 === 0)) {
          const nextRing = rings[i + 1];
          const nextScale = (FOCAL_LENGTH * dpr) / nextRing.z;
          const nextPts = getOctagonVertices(ringRadius * nextScale, nextRing.rot);

          ctx.strokeStyle = `rgba(138, 92, 255, ${ringAlpha * 0.35})`;
          ctx.shadowColor = COLOR_VIOLET;
          ctx.shadowBlur = (2 + speed * 6) * dpr;
          ctx.lineWidth = Math.max(0.7, 1.2 * scale);

          ctx.beginPath();
          for (let k = 0; k < 8; k += 2) {
            ctx.moveTo(pts[k].x, pts[k].y);
            ctx.lineTo(nextPts[k].x, nextPts[k].y);
          }
          ctx.stroke();
        }
      }

      // 2. Render Stars
      const starZSpeed = 50 + Math.pow(speed, 2) * 5200;
      const tailMultiplier = 0.0006 + Math.pow(speed, 1.8) * 0.085;
      const chromaShift = speed > 0.75 ? Math.pow((speed - 0.75) / 0.25, 2) * 6 * dpr : 0;

      ctx.lineCap = 'round';

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.z -= starZSpeed * dt;

        if (s.z < Z_MIN) {
          s.z = Z_MAX - Math.random() * 80;
          const ang = Math.random() * Math.PI * 2;
          const rad = 150 + Math.pow(Math.random(), 0.7) * 1650;
          s.x = Math.cos(ang) * rad;
          s.y = Math.sin(ang) * rad;
        }

        const currentScale = (FOCAL_LENGTH * dpr) / s.z;
        const px = s.x * currentScale;
        const py = s.y * currentScale;

        // Calculate tail position along ray to origin
        const tailZ = s.z + (starZSpeed * tailMultiplier * (s.z * 0.1));
        const tailScale = (FOCAL_LENGTH * dpr) / tailZ;
        const tx = s.x * tailScale;
        const ty = s.y * tailScale;

        const starAlpha = Math.min(1, Math.max(0.1, 1 - (s.z / Z_MAX)));
        const strokeW = Math.max(0.8, s.size * currentScale * 0.85);

        ctx.lineWidth = strokeW;
        ctx.shadowBlur = (speed > 0.6 ? 6 : 2) * dpr;

        // Chromatic split at high velocity (> 0.75)
        if (chromaShift > 0.5) {
          const shift = chromaShift * currentScale;

          // Red-offset ray
          ctx.strokeStyle = `rgba(255, 60, 90, ${starAlpha * 0.7})`;
          ctx.shadowColor = 'rgba(255, 60, 90, 0.8)';
          ctx.beginPath();
          ctx.moveTo(px - shift, py);
          ctx.lineTo(tx - shift, ty);
          ctx.stroke();

          // Blue-offset ray
          ctx.strokeStyle = `rgba(61, 139, 255, ${starAlpha * 0.7})`;
          ctx.shadowColor = COLOR_BLUE;
          ctx.beginPath();
          ctx.moveTo(px + shift, py);
          ctx.lineTo(tx + shift, ty);
          ctx.stroke();
        }

        // Primary Star Streak
        ctx.strokeStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(tx, ty);
        ctx.stroke();
      }

      ctx.restore();

      // FPS tracking
      frameCount++;
      if (now - lastFpsUpdate >= 500) {
        hudFps.textContent = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
        frameCount = 0;
        lastFpsUpdate = now;
      }

      requestAnimationFrame(render);
    }

    // Initialize and run
    resize();
    requestAnimationFrame(render);
  </script>
</body>
