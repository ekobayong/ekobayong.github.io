<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vector Horizon — Endless Wireframe Terrain Flight</title>
<style>
  :root {
    --accent: #19f0ff;
    --accent-glow: rgba(25, 240, 255, 0.4);
    --bg-hud: rgba(5, 12, 22, 0.65);
    --border-hud: rgba(25, 240, 255, 0.25);
    --text-dim: #8fa3b8;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #010409;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  canvas {
    display: block; width: 100vw; height: 100vh;
    touch-action: none;
  }
  .hud-panel {
    position: absolute;
    background: var(--bg-hud);
    border: 1px solid var(--border-hud);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 6px;
    padding: 10px 14px;
    color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.02);
    pointer-events: auto;
  }
  .mono {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    font-variant-numeric: tabular-nums;
  }
  #telemetry {
    top: 18px; left: 18px; width: 190px;
  }
  .hud-title {
    font-size: 9px; letter-spacing: 2px; color: var(--text-dim);
    margin-bottom: 6px; font-weight: 700; text-transform: uppercase;
  }
  .metric-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 3px 0; font-size: 11px;
  }
  .metric-label { color: var(--text-dim); font-size: 10px; }
  .metric-val {
    color: var(--accent); font-weight: bold; font-size: 12px;
    text-shadow: 0 0 8px var(--accent-glow);
  }
  #controls-top {
    top: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .segmented {
    display: flex; background: rgba(0,0,0,0.5); border: 1px solid var(--border-hud);
    border-radius: 4px; overflow: hidden;
  }
  .seg-btn {
    background: transparent; border: none; outline: none;
    color: var(--text-dim); font-size: 10px; font-weight: 600;
    padding: 6px 10px; cursor: pointer; transition: all 0.15s ease;
    letter-spacing: 0.5px;
  }
  .seg-btn:not(:last-child) { border-right: 1px solid var(--border-hud); }
  .seg-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .seg-btn.active {
    background: var(--accent); color: #000;
    box-shadow: 0 0 10px var(--accent-glow); font-weight: 700;
  }
  #flight-inst {
    bottom: 18px; right: 18px;
    display: flex; gap: 14px; align-items: center;
  }
  .throttle-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .throttle-track {
    width: 14px; height: 90px; background: rgba(0,0,0,0.6);
    border: 1px solid var(--border-hud); border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .throttle-fill {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
    height: 50%;
  }
  .gyro-wrap {
    width: 90px; height: 90px; position: relative;
    border-radius: 50%; overflow: hidden;
    border: 2px solid var(--border-hud); background: #000;
  }
  #gyro-svg { width: 100%; height: 100%; }
  #help-banner {
    position: absolute; bottom: 18px; left: 18px;
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px;
    pointer-events: none; opacity: 0.8;
  }
  #pause-overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 5, 12, 0.55); backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #fff; font-size: 24px; font-weight: bold; letter-spacing: 6px;
    text-shadow: 0 0 15px var(--accent); pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="telemetry" class="hud-panel">
  <div class="hud-title mono">Telemetry System</div>
  <div class="metric-row"><span class="metric-label mono">ALT (m)</span><span id="m-alt" class="metric-val mono">0000</span></div>
  <div class="metric-row"><span class="metric-label mono">SPD (kn)</span><span id="m-spd" class="metric-val mono">000</span></div>
  <div class="metric-row"><span class="metric-label mono">HDG (&deg;)</span><span id="m-hdg" class="metric-val mono">000</span></div>
  <div class="metric-row"><span class="metric-label mono">DIST (km)</span><span id="m-dst" class="metric-val mono">00.0</span></div>
</div>

<div id="controls-top">
  <div class="segmented" id="palette-sel">
    <button class="seg-btn active" data-pal="0">TRON</button>
    <button class="seg-btn" data-pal="1">SYNTH</button>
    <button class="seg-btn" data-pal="2">AMBER</button>
    <button class="seg-btn" data-pal="3">BLUEPRINT</button>
  </div>
  <div class="segmented">
    <button class="seg-btn active" id="btn-wire">WIRE</button>
    <button class="seg-btn" id="btn-solid">SOLID</button>
    <button class="seg-btn" id="btn-pause">&#10074;&#10074;</button>
  </div>
</div>

<div id="flight-inst" class="hud-panel">
  <div class="throttle-wrap">
    <div class="metric-label mono">THR</div>
    <div class="throttle-track"><div id="throttle-bar" class="throttle-fill"></div></div>
  </div>
  <div class="gyro-wrap">
    <svg id="gyro-svg" viewBox="0 0 100 100">
      <defs>
        <clipPath id="gyro-clip">
          <circle cx="50" cy="50" r="48" />
        </clipPath>
      </defs>
      <g clip-path="url(#gyro-clip)">
        <g id="gyro-rot">
          <rect id="gyro-sky" x="-100" y="-100" width="300" height="150" fill="#122538"/>
          <rect id="gyro-gnd" x="-100" y="50" width="300" height="150" fill="#040910"/>
          <line x1="-100" y1="50" x2="200" y2="50" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
          <line x1="30" y1="35" x2="70" y2="35" stroke="#fff" stroke-width="1" opacity="0.4"/>
          <line x1="40" y1="20" x2="60" y2="20" stroke="#fff" stroke-width="1" opacity="0.4"/>
          <line x1="30" y1="65" x2="70" y2="65" stroke="#fff" stroke-width="1" opacity="0.4"/>
          <line x1="40" y1="80" x2="60" y2="80" stroke="#fff" stroke-width="1" opacity="0.4"/>
        </g>
      </g>
      <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <path d="M 25 50 L 42 50 L 46 56 L 54 56 L 58 50 L 75 50" fill="none" stroke="#ffeb3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="2" fill="#ffeb3b"/>
    </svg>
  </div>
</div>

<div id="help-banner" class="mono">
  MOUSE / TOUCH DRAG: STEER &amp; THROTTLE &bull; ARROWS: STEER/THR &bull; WHEEL: SPEED &bull; SPACE: PAUSE
</div>

<div id="pause-overlay" class="mono">&mdash; PAUSED &mdash;</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

  const PALETTES = [
    {
      name: 'Tron',
      skyTop: '#010409',
      skyHoriz: '#052a36',
      line: '25, 240, 255',
      glow: '#19f0ff',
      sun0: '#ffb347',
      sun1: '#ff3d81',
      star: '#8cefff',
      accent: '#19f0ff',
      cssGlow: 'rgba(25, 240, 255, 0.4)'
    },
    {
      name: 'Synth',
      skyTop: '#0b0018',
      skyHoriz: '#4a0f6a',
      line: '255, 43, 214',
      glow: '#ff2bd6',
      sun0: '#ffe259',
      sun1: '#ff2bd6',
      star: '#ffe3fa',
      accent: '#ff2bd6',
      cssGlow: 'rgba(255, 43, 214, 0.4)'
    },
    {
      name: 'Amber',
      skyTop: '#050300',
      skyHoriz: '#2a1600',
      line: '255, 176, 0',
      glow: '#ffb000',
      sun0: '#fff1c4',
      sun1: '#ff8c00',
      star: '#ffdf99',
      accent: '#ffb000',
      cssGlow: 'rgba(255, 176, 0, 0.4)'
    },
    {
      name: 'Blueprint',
      skyTop: '#062052',
      skyHoriz: '#12407f',
      line: '219, 233, 255',
      glow: '#a8cdfc',
      sun0: '#ffffff',
      sun1: '#549eff',
      star: '#ffffff',
      accent: '#82b7ff',
      cssGlow: 'rgba(130, 183, 255, 0.4)'
    }
  ];

  let curPalIdx = 0;
  let pal = PALETTES[0];
  let isSolid = false;
  let isPaused = false;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const perm = new Uint8Array(512);
  const pBase = new Uint8Array(256);
  for (let i = 0; i < 256; i++) pBase[i] = i;
  let seed = 0x9e3779b9;
  for (let i = 255; i > 0; i--) {
    seed = (seed ^ (seed << 13)) >>> 0;
    seed = (seed ^ (seed >>> 17)) >>> 0;
    seed = (seed ^ (seed << 5)) >>> 0;
    const j = seed % (i + 1);
    const tmp = pBase[i]; pBase[i] = pBase[j]; pBase[j] = tmp;
  }
  for (let i = 0; i < 512; i++) perm[i] = pBase[i & 255];

  const fade = t => t * t * (3 - 2 * t);
  const hash2d = (x, y) => perm[(x & 255) + perm[y & 255]] / 255.0;

  function valNoise(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const u = fade(xf);
    const v = fade(yf);
    const d00 = hash2d(xi, yi);
    const d10 = hash2d(xi + 1, yi);
    const d01 = hash2d(xi, yi + 1);
    const d11 = hash2d(xi + 1, yi + 1);
    const nx0 = d00 + u * (d10 - d00);
    const nx1 = d01 + u * (d11 - d01);
    return nx0 + v * (nx1 - nx0);
  }

  function fbm(x, y) {
    let t = 0, amp = 0.55, freq = 1.0;
    for (let i = 0; i < 3; i++) {
      t += valNoise(x * freq, y * freq) * amp;
      freq *= 2.05;
      amp *= 0.48;
    }
    return t;
  }

  const COLS = 64;
  const ROWS = 48;
  const VERT_COUNT = COLS * ROWS;
  const projX = new Float32Array(VERT_COUNT);
  const projY = new Float32Array(VERT_COUNT);
  const worldY = new Float32Array(VERT_COUNT);
  const worldZ = new Float32Array(VERT_COUNT);

  const STARS_COUNT = 160;
  const starsX = new Float32Array(STARS_COUNT);
  const starsY = new Float32Array(STARS_COUNT);
  const starsPhase = new Float32Array(STARS_COUNT);
  for (let i = 0; i < STARS_COUNT; i++) {
    starsX[i] = Math.random();
    starsY[i] = Math.random() * 0.42;
    starsPhase[i] = Math.random() * Math.PI * 2;
  }

  const SPEED_LINES = 32;
  const spdAng = new Float32Array(SPEED_LINES);
  const spdLen = new Float32Array(SPEED_LINES);
  const spdSpeed = new Float32Array(SPEED_LINES);
  for (let i = 0; i < SPEED_LINES; i++) {
    spdAng[i] = Math.random() * Math.PI * 2;
    spdLen[i] = 0.1 + Math.random() * 0.9;
    spdSpeed[i] = 0.8 + Math.random() * 1.5;
  }

  let width = 0, height = 0, dpr = 1;
  let throttle = 0.45;
  let targetThrottle = 0.45;
  let steer = 0;
  let targetSteer = 0;
  let bank = 0;
  let posX = 0;
  let posZ = 0;
  let distanceTraveled = 0;
  let lastTime = performance.now();
  let lastHudUpdate = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.resetTransform();
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function sampleTerrain(gx, gz) {
    const vOffset = Math.sin(gz * 0.05) * 14.0 + Math.sin(gz * 0.015) * 32.0;
    const dFromValley = Math.abs(gx - vOffset);
    const valleyFactor = Math.min(1.0, Math.pow(Math.max(0, (dFromValley - 10.0) / 45.0), 1.6));
    const noise = fbm(gx * 0.022, gz * 0.022);
    const mountain = Math.pow(noise, 1.8) * 140.0;
    return mountain * valleyFactor - 6.0;
  }

  window.addEventListener('mousemove', e => {
    const nx = (e.clientX / width) * 2 - 1;
    targetSteer = nx * 1.35;
  });

  window.addEventListener('wheel', e => {
    targetThrottle = Math.max(0.05, Math.min(1.0, targetThrottle - e.deltaY * 0.0008));
  }, { passive: true });

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.code === 'Space') {
      isPaused = !isPaused;
      document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
      document.getElementById('btn-pause').classList.toggle('active', isPaused);
    }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  let touchStartX = 0;
  let touchStartY = 0;
  window.addEventListener('touchstart', e => {
    if (e.target.closest('.hud-panel') || e.target.closest('#controls-top')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (e.target.closest('.hud-panel') || e.target.closest('#controls-top')) return;
    const tx = e.touches[0].clientX;
    const ty = e.touches[0].clientY;
    const dx = (tx - touchStartX) / (width * 0.35);
    const dy = (touchStartY - ty) / (height * 0.35);
    targetSteer = Math.max(-1.5, Math.min(1.5, dx * 1.5));
    targetThrottle = Math.max(0.05, Math.min(1.0, targetThrottle + dy * 0.02));
    touchStartX = tx;
    touchStartY = ty;
  }, { passive: true });

  window.addEventListener('touchend', () => { targetSteer = 0; });

  function setPalette(idx) {
    curPalIdx = idx;
    pal = PALETTES[idx];
    document.documentElement.style.setProperty('--accent', pal.accent);
    document.documentElement.style.setProperty('--accent-glow', pal.cssGlow);
    document.documentElement.style.setProperty('--border-hud', pal.glow + '44');
    document.querySelectorAll('#palette-sel .seg-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === idx);
    });
  }

  document.querySelectorAll('#palette-sel .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => setPalette(parseInt(btn.dataset.pal, 10)));
  });

  const btnWire = document.getElementById('btn-wire');
  const btnSolid = document.getElementById('btn-solid');
  const btnPause = document.getElementById('btn-pause');

  btnWire.addEventListener('click', () => {
    isSolid = false;
    btnWire.classList.add('active');
    btnSolid.classList.remove('active');
  });
  btnSolid.addEventListener('click', () => {
    isSolid = true;
    btnSolid.classList.add('active');
    btnWire.classList.remove('active');
  });
  btnPause.addEventListener('click', () => {
    isPaused = !isPaused;
    document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
    btnPause.classList.toggle('active', isPaused);
  });

  const mAlt = document.getElementById('m-alt');
  const mSpd = document.getElementById('m-spd');
  const mHdg = document.getElementById('m-hdg');
  const mDst = document.getElementById('m-dst');
  const throttleBar = document.getElementById('throttle-bar');
  const gyroRot = document.getElementById('gyro-rot');
  const gyroSky = document.getElementById('gyro-sky');
  const gyroGnd = document.getElementById('gyro-gnd');

  function render(time) {
    requestAnimationFrame(render);
    const dt = Math.min((time - lastTime) * 0.001, 0.1);
    lastTime = time;

    if (!isPaused) {
      if (keys['ArrowLeft'] || keys['a']) targetSteer = -1.2;
      else if (keys['ArrowRight'] || keys['d']) targetSteer = 1.2;
      else if (!('ontouchstart' in window) && !keys['ArrowLeft'] && !keys['ArrowRight']) {
        targetSteer *= 0.95;
      }

      if (keys['ArrowUp'] || keys['w']) targetThrottle = Math.min(1.0, targetThrottle + 0.5 * dt);
      if (keys['ArrowDown'] || keys['s']) targetThrottle = Math.max(0.05, targetThrottle - 0.5 * dt);

      steer += (targetSteer - steer) * Math.min(1, 8.0 * dt);
      throttle += (targetThrottle - throttle) * Math.min(1, 5.0 * dt);
      bank += (steer * 0.38 - bank) * Math.min(1, 7.0 * dt);

      const maxSpeed = prefersReduced ? 120 : 260;
      const speed = 30 + throttle * maxSpeed;
      posX += steer * speed * 0.4 * dt;
      posZ += speed * dt;
      distanceTraveled += (speed * dt) / 1000;
    }

    const groundH = sampleTerrain(posX, posZ + 8.0);
    const swayX = prefersReduced ? 0 : Math.sin(time * 0.0015) * 1.5;
    const swayY = prefersReduced ? 0 : Math.sin(time * 0.0022) * 1.2;
    const targetCamY = groundH + 20.0 + (1.0 - throttle) * 6.0 + swayY;
    const camX = posX + swayX;
    const camY = targetCamY;
    const camZ = posZ;

    const horizY = height * 0.42;
    const focal = Math.max(width, height) * 0.72;
    const cosB = Math.cos(bank);
    const sinB = Math.sin(bank);
    const cx = width * 0.5;
    const cy = horizY;

    // 1. Sky Gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, pal.skyTop);
    skyGrad.addColorStop(0.42, pal.skyHoriz);
    skyGrad.addColorStop(0.65, pal.skyTop);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // 2. Stars
    ctx.fillStyle = pal.star;
    for (let i = 0; i < STARS_COUNT; i++) {
      const sx = starsX[i] * width;
      const sy = starsY[i] * height;
      const tw = (Math.sin(time * 0.003 + starsPhase[i]) + 1.0) * 0.5;
      ctx.globalAlpha = 0.2 + 0.8 * tw;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.globalAlpha = 1.0;

    // 3. Synthwave Sun
    const sunR = Math.min(width, height) * 0.18;
    const sunCx = width * 0.5;
    const sunCy = horizY - sunR * 0.25;

    ctx.save();
    ctx.beginPath();
    ctx.arc(sunCx, sunCy, sunR * 1.3, 0, Math.PI * 2);
    const sunGlow = ctx.createRadialGradient(sunCx, sunCy, sunR * 0.6, sunCx, sunCy, sunR * 1.35);
    sunGlow.addColorStop(0, pal.sun1);
    sunGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = sunGlow;
    ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(sunCx, sunCy, sunR, 0, Math.PI * 2);
    ctx.clip();

    const sunGrad = ctx.createLinearGradient(sunCx, sunCy - sunR, sunCx, sunCy + sunR);
    sunGrad.addColorStop(0, pal.sun0);
    sunGrad.addColorStop(1, pal.sun1);
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunCx - sunR, sunCy - sunR, sunR * 2, sunR * 2);

    const sliceCount = 9;
    ctx.fillStyle = pal.skyTop;
    for (let i = 0; i < sliceCount; i++) {
      const frac = i / sliceCount;
      const sy = sunCy + (frac * sunR * 1.05);
      const sh = 1.5 + frac * 8.0;
      ctx.fillRect(sunCx - sunR, sy, sunR * 2, sh);
    }
    ctx.restore();

    // 4. Terrain projection
    const nearZ = 8.0;
    const farZ = 240.0;
    const spanX = 260.0;

    for (let r = 0; r < ROWS; r++) {
      const normR = r / (ROWS - 1);
      const zDepth = nearZ + Math.pow(normR, 1.85) * (farZ - nearZ);
      const wz = camZ + zDepth;

      for (let c = 0; c < COLS; c++) {
        const normC = (c / (COLS - 1)) * 2.0 - 1.0;
        const wx = camX + normC * (spanX * (zDepth / farZ * 0.85 + 0.25));
        const wy = sampleTerrain(wx, wz);

        const idx = r * COLS + c;
        worldY[idx] = wy;
        worldZ[idx] = zDepth;

        const rx = wx - camX;
        const ry = -(wy - camY);
        const rz = zDepth;

        const invZ = focal / rz;
        const sx = cx + rx * invZ;
        const sy = cy + ry * invZ;

        const dx = sx - cx;
        const dy = sy - cy;
        projX[idx] = cx + (dx * cosB - dy * sinB);
        projY[idx] = cy + (dx * sinB + dy * cosB);
      }
    }

    // 5. Render Terrain Mesh
    ctx.save();
    if (isSolid) {
      for (let r = ROWS - 2; r >= 0; r--) {
        for (let c = 0; c < COLS - 1; c++) {
          const i0 = r * COLS + c;
          const i1 = r * COLS + (c + 1);
          const i2 = (r + 1) * COLS + (c + 1);
          const i3 = (r + 1) * COLS + c;

          const zMid = (worldZ[i0] + worldZ[i2]) * 0.5;
          const fog = Math.max(0, 1.0 - Math.pow(zMid / farZ, 1.1));

          const slope = (worldY[i1] - worldY[i0]) * 0.2 + (worldY[i3] - worldY[i0]) * 0.4;
          const light = Math.max(0.1, Math.min(1.0, 0.4 + slope * 0.05));
          const colAlpha = fog * light * 0.9;

          ctx.beginPath();
          ctx.moveTo(projX[i0], projY[i0]);
          ctx.lineTo(projX[i1], projY[i1]);
          ctx.lineTo(projX[i2], projY[i2]);
          ctx.lineTo(projX[i3], projY[i3]);
          ctx.closePath();

          ctx.fillStyle = `rgba(${pal.line}, ${colAlpha * 0.35})`;
          ctx.fill();
          ctx.strokeStyle = `rgba(${pal.line}, ${fog * 0.25})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    } else {
      // Wireframe occlusion + row lines
      for (let r = ROWS - 2; r >= 0; r--) {
        ctx.beginPath();
        const startIdx = r * COLS;
        ctx.moveTo(projX[startIdx], projY[startIdx]);
        for (let c = 1; c < COLS; c++) {
          ctx.lineTo(projX[startIdx + c], projY[startIdx + c]);
        }
        const nextStart = (r + 1) * COLS;
        for (let c = COLS - 1; c >= 0; c--) {
          ctx.lineTo(projX[nextStart + c], projY[nextStart + c]);
        }
        ctx.closePath();
        ctx.fillStyle = pal.skyTop;
        ctx.fill();

        const zRow = worldZ[startIdx];
        const fog = Math.max(0, 1.0 - Math.pow(zRow / farZ, 1.1));
        ctx.beginPath();
        ctx.moveTo(projX[startIdx], projY[startIdx]);
        for (let c = 1; c < COLS; c++) {
          ctx.lineTo(projX[startIdx + c], projY[startIdx + c]);
        }
        ctx.strokeStyle = `rgba(${pal.line}, ${fog * 0.85})`;
        ctx.lineWidth = Math.max(0.8, (1.0 - zRow / farZ) * 2.2);
        ctx.stroke();
      }

      // Column lines
      for (let c = 0; c < COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(projX[c], projY[c]);
        for (let r = 1; r < ROWS; r++) {
          ctx.lineTo(projX[r * COLS + c], projY[r * COLS + c]);
        }
        const pNearY = projY[c];
        const pFarY = projY[(ROWS - 1) * COLS + c];
        const colGrad = ctx.createLinearGradient(0, pNearY, 0, pFarY);
        colGrad.addColorStop(0, `rgba(${pal.line}, 0.9)`);
        colGrad.addColorStop(0.7, `rgba(${pal.line}, 0.35)`);
        colGrad.addColorStop(1, `rgba(${pal.line}, 0.0)`);
        ctx.strokeStyle = colGrad;
        ctx.lineWidth = 1.0;
        ctx.stroke();
      }

      // Near row bright pulse
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(projX[0], projY[0]);
      for (let c = 1; c < COLS; c++) ctx.lineTo(projX[c], projY[c]);
      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // 6. Horizon Glow Strip
    const hStrip = ctx.createLinearGradient(0, horizY - 14, 0, horizY + 14);
    hStrip.addColorStop(0, 'transparent');
    hStrip.addColorStop(0.5, pal.skyHoriz);
    hStrip.addColorStop(1, 'transparent');
    ctx.fillStyle = hStrip;
    ctx.fillRect(0, horizY - 14, width, 28);

    // 7. Warp speed lines
    if (throttle > 0.62) {
      const warpIntensity = (throttle - 0.62) / 0.38;
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      for (let i = 0; i < SPEED_LINES; i++) {
        spdLen[i] += spdSpeed[i] * warpIntensity * dt * 2.5;
        if (spdLen[i] > 1.0) spdLen[i] = 0.05;
        const rad = spdLen[i] * Math.max(width, height) * 0.75;
        const len = 30 + spdLen[i] * 90;
        const a = spdAng[i] + bank * 0.5;
        const x1 = cx + Math.cos(a) * rad;
        const y1 = cy + Math.sin(a) * rad;
        const x2 = cx + Math.cos(a) * (rad + len);
        const y2 = cy + Math.sin(a) * (rad + len);

        ctx.globalAlpha = warpIntensity * spdLen[i] * 0.65;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 8. Vignette & Scanlines
    const vig = ctx.createRadialGradient(cx, cy, height * 0.3, cx, cy, Math.max(width, height) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    for (let y = 0; y < height; y += 4) {
      ctx.fillRect(0, y, width, 1.5);
    }

    // HUD throttled update (~80ms)
    if (time - lastHudUpdate > 80) {
      lastHudUpdate = time;
      mAlt.textContent = Math.round(camY * 10).toString().padStart(4, '0');
      mSpd.textContent = Math.round(30 + throttle * 260).toString().padStart(3, '0');
      let hdg = Math.round((posX * 2.5) % 360);
      if (hdg < 0) hdg += 360;
      mHdg.textContent = hdg.toString().padStart(3, '0');
      mDst.textContent = distanceTraveled.toFixed(1).padStart(4, '0');
      throttleBar.style.height = `${(throttle * 100).toFixed(0)}%`;

      const degBank = (-bank * 180 / Math.PI).toFixed(2);
      const pitchY = ((throttle - 0.5) * 35).toFixed(2);
      gyroRot.setAttribute('transform', `rotate(${degBank} 50 50) translate(0, ${pitchY})`);
      gyroSky.setAttribute('fill', pal.skyHoriz);
      gyroGnd.setAttribute('fill', pal.skyTop);
    }
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
