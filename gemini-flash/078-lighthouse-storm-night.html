<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Keeper's Light — A Lighthouse in a Night Storm</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --intensity: 0.55;
      --sky-top: #050a14;
      --sky-mid: #0b1a30;
      --sky-bot: #12314a;
      --gold-light: #ffd98a;
      --gold-warm: #ffb347;
      --cottage-gold: #ffe7a8;
      --cottage-deep: #e59b2c;
      --sea-deep: #03111b;
      --sea-mid: #0a2a3a;
      --sea-top: #10384a;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--sky-top);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bot) 82%);
    }

    /* Screen shake */
    .shake {
      animation: thunderRumble 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes thunderRumble {
      10%, 90% { transform: translate3d(-2px, 3px, 0) rotate(-0.2deg); }
      20%, 80% { transform: translate3d(4px, -3px, 0) rotate(0.4deg); }
      30%, 50%, 70% { transform: translate3d(-6px, 5px, 0) rotate(-0.5deg); }
      40%, 60% { transform: translate3d(6px, -4px, 0) rotate(0.3deg); }
    }

    /* Moon & Glow */
    .celestial-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .moon-wrap {
      position: absolute;
      top: 8%;
      right: 14%;
      width: 90px;
      height: 90px;
    }

    .moon-halo {
      position: absolute;
      top: -110px;
      left: -110px;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233, 241, 247, 0.18) 0%, rgba(143, 162, 177, 0.06) 45%, transparent 72%);
      filter: blur(14px);
    }

    .moon-disc {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e9f1f7 0%, #b8c9d6 55%, #8fa2b1 100%);
      box-shadow: 0 0 45px rgba(233, 241, 247, 0.45);
      position: relative;
    }

    .moon-crater {
      position: absolute;
      background: rgba(118, 137, 153, 0.22);
      border-radius: 50%;
    }
    .mc1 { width: 22px; height: 18px; top: 22px; left: 38px; }
    .mc2 { width: 14px; height: 14px; top: 48px; left: 24px; }
    .mc3 { width: 28px; height: 20px; top: 46px; left: 46px; }

    /* Cloud Layers */
    .cloud-svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65%;
      pointer-events: none;
      overflow: hidden;
    }

    .clouds-far {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      animation: driftFar calc(120s / var(--cloud-speed-factor, 1)) linear infinite;
    }

    .clouds-near {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      animation: driftNear calc(70s / var(--cloud-speed-factor, 1)) linear infinite;
    }

    @keyframes driftFar {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes driftNear {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* SVG Ground & Scenery */
    #scenery-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 10;
    }

    /* Rotating Light Beam Elements */
    #beam-anchor {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 18;
    }

    .light-source-disc {
      position: absolute;
      top: -16px;
      left: -16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7db 0%, var(--gold-light) 40%, rgba(255, 179, 71, 0.4) 70%, transparent 100%);
      filter: blur(1px);
      box-shadow: 0 0 25px rgba(255, 217, 138, 0.9), 0 0 65px rgba(255, 179, 71, 0.6);
      animation: pulseGlow 2.8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.85; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .beam-conic {
      position: absolute;
      top: -120vmax;
      left: -120vmax;
      width: 240vmax;
      height: 240vmax;
      border-radius: 50%;
      mix-blend-mode: screen;
      pointer-events: none;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* Primary beam layer */
    .beam-core {
      background: conic-gradient(
        from -8deg at 50% 50%,
        transparent 0deg,
        rgba(255, 235, 180, 0.03) 4deg,
        rgba(255, 217, 138, 0.42) 8deg,
        rgba(255, 235, 180, 0.03) 12deg,
        transparent 16deg,
        transparent 360deg
      );
      filter: blur(14px);
    }

    /* Secondary soft halo beam layer */
    .beam-halo {
      background: conic-gradient(
        from -14deg at 50% 50%,
        transparent 0deg,
        rgba(255, 179, 71, 0.04) 7deg,
        rgba(255, 217, 138, 0.14) 14deg,
        rgba(255, 179, 71, 0.04) 21deg,
        transparent 28deg,
        transparent 360deg
      );
      filter: blur(30px);
    }

    /* Rain & Particles Canvas */
    #storm-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    /* Lightning Flash Elements */
    #lightning-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(220, 236, 255, 0);
      pointer-events: none;
      z-index: 40;
      transition: background-color 0.05s ease-out;
    }

    #lightning-overlay.strike-flash {
      background-color: rgba(225, 240, 255, 0.88);
      box-shadow: inset 0 0 120px rgba(255, 255, 255, 0.95);
    }

    #lightning-overlay.strike-flash-soft {
      background-color: rgba(180, 215, 255, 0.45);
      box-shadow: inset 0 0 70px rgba(200, 230, 255, 0.6);
    }

    /* Typography & UI */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    .title-card {
      position: absolute;
      top: 42px;
      left: 48px;
      pointer-events: auto;
      max-width: 440px;
    }

    .title-card h1 {
      font-family: "Iowan Old Style", "Apple Garamond", "Baskerville", "Georgia", "Palatino", serif;
      font-size: 2.3rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: #e9f0f8;
      text-shadow: 0 2px 14px rgba(3, 10, 20, 0.8);
    }

    .title-card h1 em {
      font-style: italic;
      color: var(--gold-light);
      text-shadow: 0 0 16px rgba(255, 217, 138, 0.5);
    }

    .title-card p {
      font-family: "Iowan Old Style", "Georgia", serif;
      font-size: 0.98rem;
      font-style: italic;
      color: #9cb2c6;
      margin-top: 8px;
      line-height: 1.45;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .log-line {
      position: absolute;
      bottom: 40px;
      left: 48px;
      font-family: "Iowan Old Style", "Georgia", "Palatino", serif;
      font-style: italic;
      font-size: 0.95rem;
      color: #8da4b8;
      max-width: 500px;
      line-height: 1.5;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* Control Panel */
    .control-panel {
      position: absolute;
      bottom: 36px;
      right: 42px;
      width: 320px;
      background: rgba(5, 12, 24, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 20px 22px;
      pointer-events: auto;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #92a9be;
    }

    .panel-val {
      font-family: "SF Mono", "Consolas", "Courier New", monospace;
      font-size: 0.8rem;
      color: var(--gold-light);
    }

    .slider-track-wrap {
      position: relative;
      margin: 8px 0 10px 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #18465d 0%, #308299 50%, #d8e9ef 100%);
      outline: none;
      cursor: pointer;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe9b8 0%, #ffbe53 60%, #b87a1d 100%);
      box-shadow: 0 0 12px rgba(255, 190, 83, 0.9), 0 2px 4px rgba(0,0,0,0.6);
      border: 1px solid #fff1cc;
      cursor: grab;
      transition: transform 0.1s ease;
    }

    input[type="range"]:active::-webkit-slider-thumb {
      cursor: grabbing;
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe9b8 0%, #ffbe53 60%, #b87a1d 100%);
      box-shadow: 0 0 12px rgba(255, 190, 83, 0.9), 0 2px 4px rgba(0,0,0,0.6);
      border: 1px solid #fff1cc;
      cursor: grab;
    }

    .scale-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #61778c;
      margin-bottom: 16px;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 14px;
    }

    .tele-cell {
      display: flex;
      flex-direction: column;
    }

    .tele-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #657c91;
      margin-bottom: 2px;
    }

    .tele-val {
      font-family: "SF Mono", "Consolas", "Courier New", monospace;
      font-size: 0.85rem;
      color: #c4d7e8;
      font-weight: 500;
    }

    .tele-unit {
      font-size: 0.68rem;
      color: #7b93a8;
      margin-left: 2px;
    }

    .click-hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.64rem;
      color: #556c80;
      letter-spacing: 0.05em;
    }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .clouds-far, .clouds-near {
        animation: none !important;
      }
      .shake {
        animation: none !important;
      }
      .light-source-disc {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <!-- Lightning strike white-out canvas/screen overlay -->
    <div id="lightning-overlay"></div>

    <!-- Celestial Moon -->
    <div class="celestial-layer">
      <div class="moon-wrap">
        <div class="moon-halo"></div>
        <div class="moon-disc">
          <div class="moon-crater mc1"></div>
          <div class="moon-crater mc2"></div>
          <div class="moon-crater mc3"></div>
        </div>
      </div>
    </div>

    <!-- SVG Clouds -->
    <div class="cloud-svg-layer">
      <svg class="clouds-far" viewBox="0 0 3200 450" preserveAspectRatio="none">
        <defs>
          <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="32" />
          </filter>
        </defs>
        <g filter="url(#blurFar)" fill="#1a2c44" opacity="0.65">
          <ellipse cx="250" cy="120" rx="340" ry="110" />
          <ellipse cx="680" cy="190" rx="420" ry="130" />
          <ellipse cx="1200" cy="110" rx="360" ry="105" />
          <ellipse cx="1650" cy="170" rx="460" ry="140" />
          <ellipse cx="2100" cy="120" rx="380" ry="115" />
          <ellipse cx="2600" cy="190" rx="440" ry="130" />
          <ellipse cx="3050" cy="100" rx="320" ry="95" />
        </g>
      </svg>
      <svg class="clouds-near" viewBox="0 0 3200 450" preserveAspectRatio="none">
        <defs>
          <filter id="blurNear" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="24" />
          </filter>
        </defs>
        <g filter="url(#blurNear)" fill="#0f1d30" opacity="0.82">
          <ellipse cx="180" cy="240" rx="280" ry="90" />
          <ellipse cx="620" cy="220" rx="390" ry="120" />
          <ellipse cx="1080" cy="270" rx="340" ry="100" />
          <ellipse cx="1520" cy="230" rx="430" ry="130" />
          <ellipse cx="2050" cy="260" rx="360" ry="110" />
          <ellipse cx="2540" cy="220" rx="410" ry="125" />
          <ellipse cx="3000" cy="250" rx="320" ry="95" />
        </g>
      </svg>
    </div>

    <!-- Scenery: Rocks, Headland, Cottage & Lighthouse -->
    <svg id="scenery-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
      <defs>
        <!-- Rock Gradients -->
        <linearGradient id="rockGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#24303f" />
          <stop offset="40%" stop-color="#151e29" />
          <stop offset="100%" stop-color="#070b12" />
        </linearGradient>
        <linearGradient id="rockGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a2533" />
          <stop offset="70%" stop-color="#0c121b" />
          <stop offset="100%" stop-color="#04070a" />
        </linearGradient>

        <!-- Lighthouse Body Gradient -->
        <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6c7480" />
          <stop offset="26%" stop-color="#e8ebef" />
          <stop offset="68%" stop-color="#b3bac4" />
          <stop offset="100%" stop-color="#4c535d" />
        </linearGradient>

        <!-- Red Band Gradient -->
        <linearGradient id="redBandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#5a1c1c" />
          <stop offset="28%" stop-color="#c13a34" />
          <stop offset="65%" stop-color="#9a2c28" />
          <stop offset="100%" stop-color="#451414" />
        </linearGradient>

        <!-- Lantern Roof Gradient -->
        <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#222b35" />
          <stop offset="35%" stop-color="#4e5c6e" />
          <stop offset="100%" stop-color="#151b22" />
        </linearGradient>

        <!-- Sea Gradients -->
        <linearGradient id="seaGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#10384a" stop-opacity="0.85" />
          <stop offset="50%" stop-color="#0a2a3a" />
          <stop offset="100%" stop-color="#03111b" />
        </linearGradient>
        <linearGradient id="seaGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#13475d" stop-opacity="0.95" />
          <stop offset="35%" stop-color="#0b2c3d" />
          <stop offset="100%" stop-color="#020a10" />
        </linearGradient>

        <!-- Clip Path for Tower Bands -->
        <clipPath id="towerClip">
          <polygon points="1235,310 1265,310 1282,620 1218,620" />
        </clipPath>

        <!-- Window Glow Filter -->
        <filter id="cottageHalo" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
        </filter>
      </defs>

      <!-- Distant Sea Layer (Behind Headland Base) -->
      <path id="sea-wave-back" fill="url(#seaGradBack)" d="M0,660 L1600,660 L1600,900 L0,900 Z" />

      <!-- Rocky Headland Promontory -->
      <g id="headland-rocks">
        <!-- Far back rocky ridge -->
        <polygon points="980,690 1060,590 1140,560 1230,520 1340,550 1480,630 1600,680 1600,900 960,900" fill="#131c26" />
        
        <!-- Main massive headland -->
        <polygon points="1020,740 1090,620 1160,530 1220,490 1300,500 1380,545 1460,610 1560,670 1600,720 1600,900 1020,900" fill="url(#rockGrad1)" />

        <!-- Cliff facets and ledges -->
        <polygon points="1160,530 1220,490 1280,505 1250,560 1190,570" fill="#2b3949" opacity="0.6" />
        <polygon points="1220,490 1330,510 1360,550 1290,545 1250,560" fill="#1b2532" />
        <polygon points="1090,620 1160,530 1190,570 1140,650" fill="#0d141e" />
        <polygon points="1190,570 1250,560 1280,640 1200,660" fill="url(#rockGrad2)" />
        <polygon points="1280,505 1380,545 1330,620 1270,590" fill="#222f3e" opacity="0.75" />
        <polygon points="1380,545 1460,610 1400,670 1320,630" fill="#151f2b" />
        <polygon points="1040,710 1130,660 1180,740 1070,780" fill="#1a2430" />
        <polygon points="1180,740 1290,700 1350,790 1220,830" fill="#0d141d" />

        <!-- Sea crashing shelf at base -->
        <polygon points="1060,780 1160,730 1280,760 1390,750 1480,810 1550,860 1050,860" fill="#0c131a" />
      </g>

      <!-- Keeper's Cottage on the Slope -->
      <g id="cottage" transform="translate(1120, 480)">
        <!-- Cottage Silhouette -->
        <polygon points="30,45 68,18 106,45 106,75 30,75" fill="#18222d" />
        <!-- Cottage Roof -->
        <polygon points="24,46 68,14 112,46 104,49 68,22 32,49" fill="#2d3a49" />
        <!-- Chimney -->
        <rect x="88" y="16" width="10" height="20" fill="#18222d" />
        <rect x="86" y="14" width="14" height="4" fill="#364556" />

        <!-- Warm Glowing Window with Halos -->
        <!-- Soft Outer Halo -->
        <circle cx="58" cy="56" r="28" fill="url(#cottageWindowHaloGrad)" filter="url(#cottageHalo)" opacity="0.7">
          <animate attributeName="opacity" values="0.6;0.8;0.5;0.75;0.6" dur="3.6s" repeatCount="indefinite" />
        </circle>
        
        <!-- Window Pane Glow -->
        <rect x="50" y="48" width="16" height="15" rx="2" fill="#ffe7a8">
          <animate attributeName="fill" values="#ffe7a8;#ffd276;#ffebad;#e59b2c;#ffe7a8" dur="4.2s" repeatCount="indefinite" />
        </rect>
        
        <!-- Window Mullions -->
        <line x1="58" y1="48" x2="58" y2="63" stroke="#2a1f10" stroke-width="1.8" />
        <line x1="50" y1="55" x2="66" y2="55" stroke="#2a1f10" stroke-width="1.8" />
      </g>

      <!-- Radial Gradient for Cottage Glow -->
      <radialGradient id="cottageWindowHaloGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#e59b2c" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#e59b2c" stop-opacity="0" />
      </radialGradient>

      <!-- Lighthouse Tower Construction -->
      <g id="lighthouse-station">
        <!-- Foundation Base -->
        <polygon points="1212,625 1288,625 1294,642 1206,642" fill="#18202b" />

        <!-- Main Tapered Tower Shaft -->
        <polygon points="1235,310 1265,310 1282,620 1218,620" fill="url(#towerGrad)" />

        <!-- Red Daymark Bands clipped to Tower -->
        <g clip-path="url(#towerClip)">
          <!-- Top Band -->
          <polygon points="1225,360 1275,360 1278,410 1222,410" fill="url(#redBandGrad)" />
          <!-- Middle Band -->
          <polygon points="1218,460 1282,460 1285,510 1215,510" fill="url(#redBandGrad)" />
          <!-- Bottom Band -->
          <polygon points="1212,560 1288,560 1290,610 1210,610" fill="url(#redBandGrad)" />
        </g>

        <!-- Arched Heavy Entrance Door -->
        <path d="M1245,618 L1245,586 Q1250,578 1255,586 L1255,618 Z" fill="#11161d" />
        <circle cx="1253" cy="602" r="1" fill="#b09358" />

        <!-- Slit Tower Windows -->
        <rect x="1248" y="380" width="4" height="9" rx="1.5" fill="#121820" />
        <rect x="1248" y="480" width="4" height="9" rx="1.5" fill="#121820" />

        <!-- Gallery Deck & Corbeling -->
        <polygon points="1226,312 1274,312 1280,305 1220,305" fill="#323b47" />
        <rect x="1223" y="303" width="54" height="3" fill="#202731" />

        <!-- Gallery Safety Railing -->
        <line x1="1220" y1="295" x2="1280" y2="295" stroke="#445263" stroke-width="2" />
        <line x1="1224" y1="303" x2="1224" y2="295" stroke="#445263" stroke-width="1.5" />
        <line x1="1234" y1="303" x2="1234" y2="295" stroke="#445263" stroke-width="1.5" />
        <line x1="1244" y1="303" x2="1244" y2="295" stroke="#445263" stroke-width="1.5" />
        <line x1="1256" y1="303" x2="1256" y2="295" stroke="#445263" stroke-width="1.5" />
        <line x1="1266" y1="303" x2="1266" y2="295" stroke="#445263" stroke-width="1.5" />
        <line x1="1276" y1="303" x2="1276" y2="295" stroke="#445263" stroke-width="1.5" />

        <!-- Glowing Lantern Room Glass -->
        <rect x="1233" y="272" width="34" height="31" fill="#ffefa8" opacity="0.9" />
        
        <!-- The Focal Lamp Core Target Point for HTML Beam Anchor -->
        <ellipse id="lantern-focal-point" cx="1250" cy="287" rx="8" ry="11" fill="#ffffff" />

        <!-- Lantern Room Mullions & Framing -->
        <rect x="1232" y="270" width="36" height="3" fill="#2c3642" />
        <line x1="1233" y1="272" x2="1233" y2="303" stroke="#222b35" stroke-width="2" />
        <line x1="1244" y1="272" x2="1244" y2="303" stroke="#222b35" stroke-width="2" />
        <line x1="1256" y1="272" x2="1256" y2="303" stroke="#222b35" stroke-width="2" />
        <line x1="1267" y1="272" x2="1267" y2="303" stroke="#222b35" stroke-width="2" />

        <!-- Conical Lantern Roof & Ventilator Ball / Lightning Rod -->
        <polygon points="1228,272 1272,272 1250,238" fill="url(#roofGrad)" />
        <polygon points="1231,272 1269,272 1250,240" stroke="#10151b" stroke-width="1" fill="none" />
        <circle cx="1250" cy="236" r="4" fill="#323d4a" />
        <line x1="1250" y1="234" x2="1250" y2="216" stroke="#b0bac4" stroke-width="1.8" />
      </g>

      <!-- Front Fore Sea Layer with Surging Dynamic Waves -->
      <path id="sea-wave-front" fill="url(#seaGradFront)" d="M0,710 L1600,710 L1600,900 L0,900 Z" />
      <!-- Crest Foam Stroke Path -->
      <path id="sea-foam-line" fill="none" stroke="#77aabf" stroke-width="2.5" opacity="0.75" d="M0,710 L1600,710" />
    </svg>

    <!-- Anchored Rotating Lamp Light Rig (Screen Space) -->
    <div id="beam-anchor">
      <!-- Glow sphere right on the lamp lens -->
      <div class="light-source-disc"></div>
      
      <!-- Rotating Beam Wedges -->
      <div id="beam-core-rotator" class="beam-conic beam-core"></div>
      <div id="beam-halo-rotator" class="beam-conic beam-halo"></div>
    </div>

    <!-- Canvas: Dynamic Rain, Illuminated Drops & Wave Spray Particles -->
    <canvas id="storm-canvas"></canvas>

    <!-- Aesthetic HUD & Controls -->
    <div class="ui-layer">
      <!-- Title & Poetry -->
      <div class="title-card">
        <h1>The Keeper's <em>Light</em></h1>
        <p>A solitary sentinel against the gathering tempest.</p>
      </div>

      <!-- Keeper's Journal Log -->
      <div class="log-line" id="keeper-log">
        Log: "Glass steady at 29.30. Heavy breakers driving onto Black Spit."
      </div>

      <!-- Frosted Control Panel -->
      <div class="control-panel">
        <div class="panel-header">
          <span class="panel-title">Storm Intensity</span>
          <span class="panel-val" id="intensity-percent">55%</span>
        </div>

        <div class="slider-track-wrap">
          <input type="range" id="intensity-slider" min="0" max="1" step="0.01" value="0.55" aria-label="Storm intensity">
        </div>

        <div class="scale-row">
          <span>Calm</span>
          <span>Moderate</span>
          <span>Severe Gale</span>
        </div>

        <div class="telemetry-grid">
          <div class="tele-cell">
            <span class="tele-label">Wind</span>
            <div><span class="tele-val" id="wind-speed">38</span><span class="tele-unit">kt</span></div>
          </div>
          <div class="tele-cell">
            <span class="tele-label">Swell</span>
            <div><span class="tele-val" id="swell-height">4.2</span><span class="tele-unit">m</span></div>
          </div>
          <div class="tele-cell">
            <span class="tele-label">Precip</span>
            <div><span class="tele-val" id="precip-rate">18</span><span class="tele-unit">mm/h</span></div>
          </div>
        </div>

        <div class="click-hint">Click scene to summon lightning</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // --- State & Constants ---
      let intensity = 0.55;
      let beamAngle = 0; // in degrees
      const BEAM_ROTATION_SPEED = 38; // deg per sec
      let lastTimestamp = performance.now();

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // DOM Elements
      const viewport = document.getElementById("viewport");
      const beamAnchor = document.getElementById("beam-anchor");
      const beamCore = document.getElementById("beam-core-rotator");
      const beamHalo = document.getElementById("beam-halo-rotator");
      const focalPointEl = document.getElementById("lantern-focal-point");
      const canvas = document.getElementById("storm-canvas");
      const ctx = canvas.getContext("2d");
      const lightningOverlay = document.getElementById("lightning-overlay");

      const waveBackPath = document.getElementById("sea-wave-back");
      const waveFrontPath = document.getElementById("sea-wave-front");
      const foamLinePath = document.getElementById("sea-foam-line");

      // UI inputs
      const slider = document.getElementById("intensity-slider");
      const percentDisp = document.getElementById("intensity-percent");
      const windDisp = document.getElementById("wind-speed");
      const swellDisp = document.getElementById("swell-height");
      const precipDisp = document.getElementById("precip-rate");
      const logDisp = document.getElementById("keeper-log");

      // Journal log variations
      const logs = [
        "Calm swell. Lantern mantle burns clear and sweet over quiet shoals.",
        "A light sea fog rolls past the bluff; oil lamps trimmed and steady.",
        "Freshening breeze out of the WNW. Breakers sounding upon the outer bar.",
        "Glass steady at 29.30. Heavy breakers driving onto Black Spit.",
        "Squalls beating against the high panes. Salt crust thick upon the lantern.",
        "Whole gale raging. Iron gallery shudders as sea bursts over the headland!"
      ];

      // Screen space lighthouse anchor coordinates
      let anchorScreenX = window.innerWidth * 0.78;
      let anchorScreenY = window.innerHeight * 0.32;

      function updateAnchorPosition() {
        if (!focalPointEl) return;
        const rect = focalPointEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          anchorScreenX = rect.left + rect.width / 2;
          anchorScreenY = rect.top + rect.height / 2;
          beamAnchor.style.transform = `translate3d(${anchorScreenX}px, ${anchorScreenY}px, 0)`;
        }
      }

      // --- Particle Systems ---
      let drops = [];
      let sprays = [];

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
        updateAnchorPosition();
        initDrops();
      }

      function initDrops() {
        const baseCount = prefersReducedMotion ? 40 : Math.round(60 + intensity * 1400);
        drops = [];
        for (let i = 0; i < baseCount; i++) {
          drops.push({
            x: Math.random() * (window.innerWidth + 400) - 200,
            y: Math.random() * window.innerHeight,
            len: 8 + Math.random() * 18,
            speed: 12 + Math.random() * 15,
            z: Math.random(), // depth
            illuminate: false
          });
        }
      }

      function createSprayBurst(x, y, count, power) {
        if (sprays.length > 280) return; // budget guard
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.3 - (intensity * 0.35); // drift with wind
          const spd = (2.5 + Math.random() * 6.5) * (0.8 + power * 0.7);
          sprays.push({
            x: x + (Math.random() - 0.5) * 40,
            y: y + (Math.random() - 0.5) * 15,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 1.2 + Math.random() * 2.6,
            life: 1.0,
            decay: 0.015 + Math.random() * 0.025
          });
        }
      }

      // --- Wave Generation (Sum of 3 Sine Waves) ---
      let wavePhase = 0;
      function buildWavePath(baseY, amp, len, speedMult, phaseOffset) {
        const w = 1600;
        const step = 20;
        let d = `M 0 ${baseY}`;
        const t = wavePhase * speedMult + phaseOffset;

        for (let x = 0; x <= w; x += step) {
          const y1 = Math.sin(x * 0.007 + t) * amp;
          const y2 = Math.sin(x * 0.014 - t * 0.8) * (amp * 0.45);
          const y3 = Math.sin(x * 0.028 + t * 1.4) * (amp * 0.2);
          const y = baseY + y1 + y2 + y3;
          d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
        }

        const dFoam = d;
        d += ` L 1600 900 L 0 900 Z`;
        return { fillPath: d, foamPath: dFoam };
      }

      // --- Lightning System ---
      let lightningTimer = null;

      function scheduleLightning() {
        if (lightningTimer) clearTimeout(lightningTimer);
        // Only strike above 15% intensity
        if (intensity < 0.15) return;

        // Interval inversely proportional to intensity: 15% -> ~18s, 100% -> ~2.8s
        const minTime = 2200;
        const maxTime = Math.max(3000, 24000 - intensity * 21000);
        const nextDelay = minTime + Math.random() * (maxTime - minTime);

        lightningTimer = setTimeout(() => {
          triggerLightning();
          scheduleLightning();
        }, nextDelay);
      }

      function triggerLightning() {
        if (intensity < 0.12) return;

        // Visual flash sequence: flash, brief gap, second flash
        lightningOverlay.className = "strike-flash";
        setTimeout(() => {
          lightningOverlay.className = "";
          setTimeout(() => {
            lightningOverlay.className = "strike-flash-soft";
            setTimeout(() => {
              lightningOverlay.className = "";
            }, 110);
          }, 70);
        }, 80);

        // Thunder rumbling screen shake delayed by 450 - 950ms (simulating sound travel distance)
        const rumbleDelay = 450 + Math.random() * 500;
        setTimeout(() => {
          if (!prefersReducedMotion) {
            viewport.classList.remove("shake");
            void viewport.offsetWidth; // re-trigger reflow
            viewport.classList.add("shake");
            setTimeout(() => viewport.classList.remove("shake"), 700);
          }
        }, rumbleDelay);
      }

      // --- Telemetry & UI Updates ---
      function updateUI() {
        percentDisp.textContent = Math.round(intensity * 100) + "%";
        
        // Knots: 8kt (calm) to 68kt (violent storm)
        const windKnots = Math.round(8 + intensity * 60);
        windDisp.textContent = windKnots;

        // Swell: 0.8m to 9.6m
        const swellM = (0.8 + intensity * 8.8).toFixed(1);
        swellDisp.textContent = swellM;

        // Rain: 0mm/h to 55mm/h
        const rainMm = Math.round(intensity * 55);
        precipDisp.textContent = rainMm;

        // Log sentence
        const logIndex = Math.min(logs.length - 1, Math.floor(intensity * logs.length));
        logDisp.textContent = `Log: "${logs[logIndex]}"`;

        // CSS Variables for cloud speed & wind sway
        const cloudFactor = (0.3 + intensity * 2.2).toFixed(2);
        document.documentElement.style.setProperty("--cloud-speed-factor", cloudFactor);
      }

      slider.addEventListener("input", (e) => {
        intensity = parseFloat(e.target.value);
        updateUI();
        initDrops();
        scheduleLightning();
      });

      window.addEventListener("click", (e) => {
        // Prevent triggering lightning if clicking inside the control panel
        if (e.target.closest(".control-panel")) return;
        triggerLightning();
      });

      window.addEventListener("resize", () => {
        resizeCanvas();
      });

      // --- Animation Loop ---
      function render(timestamp) {
        const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
        lastTimestamp = timestamp;

        // 1. Advance Beam Angle
        if (!prefersReducedMotion) {
          beamAngle = (beamAngle + BEAM_ROTATION_SPEED * dt) % 360;
        }

        // Beam points eastward/down into sea when angle is ~40° to 170°, 
        // fades as it faces directly toward or away
        const rad = (beamAngle * Math.PI) / 180;
        // Project onto viewer direction for perspective opacity fade
        const facingFactor = Math.cos(rad);
        const beamOpacity = 0.35 + 0.65 * Math.abs(Math.sin(rad));

        beamCore.style.transform = `rotate(${beamAngle}deg)`;
        beamHalo.style.transform = `rotate(${beamAngle}deg)`;
        beamCore.style.opacity = beamOpacity;
        beamHalo.style.opacity = beamOpacity * 0.9;

        // 2. Animate Ocean Waves via SVG
        const waveAmp = 12 + intensity * 32;
        const waveSpeed = (0.8 + intensity * 2.2) * dt;
        wavePhase += waveSpeed;

        const backWaveData = buildWavePath(665, waveAmp * 0.75, 1600, 0.7, 1.2);
        const frontWaveData = buildWavePath(718, waveAmp, 1600, 1.0, 0);

        waveBackPath.setAttribute("d", backWaveData.fillPath);
        waveFrontPath.setAttribute("d", frontWaveData.fillPath);
        foamLinePath.setAttribute("d", frontWaveData.foamPath);

        // 3. Spontaneous Wave Crest Spray near Headland base (rocks x: 1040 - 1280)
        if (Math.random() < 0.12 + intensity * 0.45) {
          const sprayX = window.innerWidth * (0.64 + Math.random() * 0.16);
          const sprayY = window.innerHeight * (0.78 + Math.random() * 0.08);
          createSprayBurst(sprayX, sprayY, Math.round(3 + intensity * 12), intensity);
        }

        // 4. Canvas Rendering (Rain & Spray)
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        // Wind angle drift: -15deg (calm) to -42deg (severe gale)
        const windTilt = -0.28 - intensity * 0.46;
        const windXStep = Math.sin(windTilt);
        const windYStep = Math.cos(windTilt);

        // Calculate current beam sector in 2D screen coordinates
        const beamNormAngle = (beamAngle % 360);

        // Rain streak count dynamically scaled
        const activeCount = prefersReducedMotion ? 40 : Math.round(60 + intensity * 1400);

        // Draw Rain
        ctx.lineWidth = 1.25;
        for (let i = 0; i < activeCount; i++) {
          let drop = drops[i];
          if (!drop) continue;

          const fallSpeed = (drop.speed + intensity * 24);
          drop.x += windXStep * fallSpeed;
          drop.y += windYStep * fallSpeed;

          // Wrap boundaries
          if (drop.y > window.innerHeight) {
            drop.y = -drop.len * 2;
            drop.x = Math.random() * (window.innerWidth + 480) - 180;
          }
          if (drop.x < -200) {
            drop.x = window.innerWidth + 100;
          }

          // Beam illumination check
          // Vector from light anchor to drop
          const dx = drop.x - anchorScreenX;
          const dy = drop.y - anchorScreenY;
          let dropAngle = Math.atan2(dy, dx) * (180 / Math.PI);
          if (dropAngle < 0) dropAngle += 360;

          // Difference between beam heading and drop angle
          let angleDiff = Math.abs(beamNormAngle - dropAngle);
          if (angleDiff > 180) angleDiff = 360 - angleDiff;

          const inBeamWedge = angleDiff < 14;

          // Every 3rd drop in the beam flares in warm golden light
          if (inBeamWedge && (i % 3 === 0)) {
            ctx.strokeStyle = `rgba(255, 224, 155, ${0.45 + intensity * 0.4})`;
            ctx.lineWidth = 1.8;
          } else {
            ctx.strokeStyle = `rgba(164, 196, 222, ${0.16 + drop.z * 0.22})`;
            ctx.lineWidth = 1.1;
          }

          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(
            drop.x - windXStep * drop.len,
            drop.y - windYStep * drop.len
          );
          ctx.stroke();
        }

        // Draw Spray Particles
        for (let j = sprays.length - 1; j >= 0; j--) {
          const sp = sprays[j];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += 0.22; // Gravity
          sp.life -= sp.decay;

          if (sp.life <= 0 || sp.y > window.innerHeight) {
            sprays.splice(j, 1);
            continue;
          }

          ctx.fillStyle = `rgba(195, 224, 240, ${(sp.life * 0.65).toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(render);
      }

      // --- Initialization ---
      resizeCanvas();
      updateUI();
      scheduleLightning();
      requestAnimationFrame(render);

      // Re-anchor when fonts or rendering settle
      setTimeout(updateAnchorPosition, 150);
      setTimeout(updateAnchorPosition, 800);
    })();
  </script>
</body>
</html>
