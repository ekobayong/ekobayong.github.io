<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organic Wave Lab</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Avenir Next", "Segoe UI", Roboto, sans-serif;
      --panel-bg: rgba(14, 16, 24, 0.42);
      --panel-border: rgba(255, 255, 255, 0.12);
      --panel-ink: #f0f3fa;
      --panel-muted: rgba(240, 243, 250, 0.55);
      --panel-highlight: #f0c98a;
      --panel-input-bg: rgba(255, 255, 255, 0.08);
      --panel-input-border: rgba(255, 255, 255, 0.15);
      --panel-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.56), 0 18px 36px -18px rgba(0, 0, 0, 0.4);
      --blur-val: 18px;
    }

    body.light-theme {
      --panel-bg: rgba(255, 252, 248, 0.65);
      --panel-border: rgba(0, 0, 0, 0.08);
      --panel-ink: #221c16;
      --panel-muted: rgba(34, 28, 22, 0.6);
      --panel-highlight: #b05e19;
      --panel-input-bg: rgba(0, 0, 0, 0.05);
      --panel-input-border: rgba(0, 0, 0, 0.12);
      --panel-shadow: 0 30px 60px -12px rgba(90, 70, 50, 0.2), 0 18px 36px -18px rgba(90, 70, 50, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03050f;
      font-family: var(--font);
      color: var(--panel-ink);
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: block;
    }

    /* Ambient Brand Title */
    .brand-title {
      position: fixed;
      top: 28px;
      left: 32px;
      font-size: 26px;
      letter-spacing: 0.12em;
      font-weight: 200;
      color: var(--panel-ink);
      z-index: 5;
      pointer-events: none;
      text-transform: uppercase;
      transition: color 0.4s ease, opacity 0.4s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .brand-title span {
      color: var(--panel-highlight);
      font-weight: 300;
    }

    /* Glass Column Side Panel */
    #panel {
      position: fixed;
      top: 24px;
      right: 28px;
      bottom: 24px;
      width: 370px;
      max-width: calc(100vw - 48px);
      background: var(--panel-bg);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      box-shadow: var(--panel-shadow);
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, background 0.4s, color 0.4s;
    }

    #panel.hidden {
      transform: translateX(410px);
      opacity: 0;
      pointer-events: none;
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .panel-scroll::-webkit-scrollbar-thumb {
      background: var(--panel-border);
      border-radius: 4px;
    }

    /* Section headers */
    .section-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
      color: var(--panel-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Presets Pills */
    .preset-group {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .preset-btn {
      background: var(--panel-input-bg);
      border: 1px solid var(--panel-input-border);
      color: var(--panel-ink);
      font-size: 11px;
      padding: 8px 4px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
      text-align: center;
    }
    .preset-btn:hover {
      background: rgba(255,255,255,0.14);
    }
    .preset-btn[aria-pressed="true"] {
      background: var(--panel-ink);
      color: #0c0e14;
      font-weight: 600;
      border-color: var(--panel-ink);
    }
    body.light-theme .preset-btn[aria-pressed="true"] {
      color: #ffffff;
      background: var(--panel-ink);
    }

    /* Toggles Grid */
    .toggles-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .toggle-card {
      background: var(--panel-input-bg);
      border: 1px solid var(--panel-input-border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-card span {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .switch-track {
      width: 34px;
      height: 18px;
      background: rgba(120, 120, 128, 0.3);
      border-radius: 20px;
      position: relative;
      transition: background 0.25s;
    }
    .switch-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .toggle-card.active .switch-track {
      background: var(--panel-highlight);
    }
    .toggle-card.active .switch-track::after {
      transform: translateX(16px);
      background: #000;
    }

    /* Layer Chips list */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layer-chip {
      background: var(--panel-input-bg);
      border: 1px solid var(--panel-input-border);
      border-radius: 12px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .layer-chip.active {
      border-color: var(--panel-highlight);
      background: rgba(255, 255, 255, 0.12);
    }
    body.light-theme .layer-chip.active {
      background: rgba(0, 0, 0, 0.08);
    }
    .chip-grip {
      font-size: 14px;
      color: var(--panel-muted);
      cursor: grab;
      line-height: 1;
    }
    .chip-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 10px currentColor;
    }
    .chip-name {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.03em;
      flex: 1;
    }
    .chip-stats {
      font-family: monospace;
      font-size: 10.5px;
      color: var(--panel-muted);
      margin-right: 4px;
    }
    .chip-btn {
      background: transparent;
      border: none;
      color: var(--panel-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .chip-btn:hover {
      color: var(--panel-ink);
      background: rgba(255,255,255,0.1);
    }

    /* Control block for selected layer */
    .controls-block {
      background: var(--panel-input-bg);
      border: 1px solid var(--panel-input-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .param-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .param-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--panel-muted);
      letter-spacing: 0.05em;
    }
    .param-meta .val-readout {
      font-family: monospace;
      font-size: 11px;
      color: var(--panel-ink);
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(120, 120, 128, 0.3);
      outline: none;
      margin: 6px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--panel-ink);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
    }
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.3);
    }
    input[type="range"]:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--panel-border);
      border-radius: 8px;
    }
    .color-hex {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* Action Buttons */
    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .btn {
      background: var(--panel-input-bg);
      border: 1px solid var(--panel-input-border);
      color: var(--panel-ink);
      font-size: 11.5px;
      letter-spacing: 0.06em;
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255,255,255,0.15);
    }
    .btn-primary {
      background: var(--panel-ink);
      color: #090a0f;
      border-color: var(--panel-ink);
      grid-column: span 2;
    }
    body.light-theme .btn-primary {
      color: #ffffff;
    }

    /* Floating Hide / Show Button */
    #toggle-panel-btn {
      position: fixed;
      bottom: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--panel-bg);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border: 1px solid var(--panel-border);
      color: var(--panel-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--panel-shadow);
      z-index: 20;
      transition: transform 0.2s, background 0.3s;
    }
    #toggle-panel-btn:hover {
      transform: scale(1.06);
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      opacity: 0;
      background: rgba(14, 16, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 0.05em;
      pointer-events: none;
      z-index: 100;
      transition: transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 720px) {
      .brand-title {
        font-size: 18px;
        top: 18px;
        left: 20px;
      }
      #panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        height: 65vh;
        border-radius: 24px 24px 0 0;
        border-bottom: none;
        transform: translateY(0);
      }
      #panel.hidden {
        transform: translateY(100%);
      }
      #toggle-panel-btn {
        bottom: 18px;
        right: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="brand-title">Organic <span>Wave</span> Lab</div>
  <canvas id="viewport"></canvas>

  <aside id="panel" role="region" aria-label="Wave Controls">
    <div class="panel-scroll">
      <div>
        <div class="section-label">Aesthetic Presets</div>
        <div class="preset-group" role="group" aria-label="Presets">
          <button class="preset-btn" data-preset="dunes" aria-pressed="false">Dunes</button>
          <button class="preset-btn" data-preset="aurora" aria-pressed="true">Aurora</button>
          <button class="preset-btn" data-preset="tide" aria-pressed="false">Tide</button>
          <button class="preset-btn" data-preset="silk" aria-pressed="false">Silk</button>
          <button class="preset-btn" data-preset="nebula" aria-label="Nebula" aria-pressed="false">Nebula</button>
        </div>
      </div>

      <div class="toggles-row">
        <div class="toggle-card" id="flow-card" title="Pause / Resume flow (Space)">
          <span>Flow</span>
          <div class="switch-track"></div>
        </div>
        <div class="toggle-card" id="harmony-card" title="Lock layer frequencies to harmonic ratios">
          <span>Harmony</span>
          <div class="switch-track"></div>
        </div>
      </div>

      <div id="harmony-slider-row" class="param-row" style="display: none;">
        <div class="param-meta">
          <span>FUNDAMENTAL ƒ</span>
          <span class="val-readout" id="fundamental-val">1.20</span>
        </div>
        <input type="range" id="fundamental-input" min="0.2" max="4.0" step="0.05" value="1.2">
      </div>

      <div>
        <div class="section-label">
          <span>Wave Stack (Back → Front)</span>
          <span style="font-size:9px;">[Alt+↑/↓ Reorder]</span>
        </div>
        <div class="layer-list" id="layer-list"></div>
      </div>

      <div class="controls-block" id="selected-controls">
        <div class="section-label" style="margin-bottom:2px;">
          <span>Selected Layer</span>
          <span id="selected-name-badge" style="color:var(--panel-highlight)">Crest</span>
        </div>

        <div class="param-row">
          <div class="param-meta">
            <span>AMPLITUDE</span>
            <span class="val-readout" id="amp-val">60px</span>
          </div>
          <input type="range" id="amp-input" min="5" max="180" step="1">
        </div>

        <div class="param-row" id="freq-param-row">
          <div class="param-meta">
            <span>FREQUENCY</span>
            <span class="val-readout" id="freq-val">1.00</span>
          </div>
          <input type="range" id="freq-input" min="0.2" max="4.0" step="0.02">
        </div>

        <div class="param-row">
          <div class="param-meta">
            <span>PHASE</span>
            <span class="val-readout" id="phase-val">0.00 π</span>
          </div>
          <input type="range" id="phase-input" min="0" max="2" step="0.02">
        </div>

        <div class="param-row">
          <div class="param-meta">
            <span>SPEED</span>
            <span class="val-readout" id="speed-val">0.80</span>
          </div>
          <input type="range" id="speed-input" min="-3.0" max="3.0" step="0.05">
        </div>

        <div class="param-row">
          <div class="param-meta">
            <span>BASELINE</span>
            <span class="val-readout" id="baseline-val">50%</span>
          </div>
          <input type="range" id="baseline-input" min="5" max="95" step="0.5">
        </div>

        <div class="color-picker-row">
          <span class="section-label" style="margin:0;">LAYER COLOUR</span>
          <div class="color-picker-wrap">
            <input type="color" id="color-input" value="#36f2b5">
            <span class="color-hex" id="color-hex-val">#36F2B5</span>
          </div>
        </div>
      </div>

      <div class="action-group">
        <button class="btn" id="add-layer-btn">+ Add Layer</button>
        <button class="btn" id="surprise-btn">Surprise Me</button>
        <button class="btn btn-primary" id="export-svg-btn">Export SVG</button>
      </div>
    </div>
  </aside>

  <button id="toggle-panel-btn" title="Toggle Panel (H)" aria-label="Toggle Panel">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M3 12h18"/>
    </svg>
  </button>

  <div id="toast" role="status" aria-live="polite">Notification</div>

  <script>
    (function () {
      'use strict';

      // --- Presets Data ---
      const PRESETS = {
        dunes: {
          name: 'Dunes',
          theme: 'light',
          bg: ['#f2e4cf', '#c9a27a'],
          blendMode: 'normal',
          gradientStyle: 'shade',
          layers: [
            { name: 'Drift', amp: 75, freq: 0.8, phase: 0.2, speed: 0.4, base: 36, color: '#e9cfa8', visible: true },
            { name: 'Swell', amp: 90, freq: 1.1, phase: 0.9, speed: -0.3, base: 48, color: '#d4a86f', visible: true },
            { name: 'Dune', amp: 105, freq: 0.9, phase: 1.8, speed: 0.5, base: 60, color: '#b7804a', visible: true },
            { name: 'Ridge', amp: 120, freq: 1.3, phase: 2.7, speed: 0.35, base: 72, color: '#8a5a33', visible: true },
            { name: 'Bed', amp: 135, freq: 1.6, phase: 0.4, speed: -0.4, base: 84, color: '#5b3a22', visible: true }
          ]
        },
        aurora: {
          name: 'Aurora',
          theme: 'dark',
          bg: ['#03050f', '#0b1b2b'],
          blendMode: 'screen',
          gradientStyle: 'fade',
          layers: [
            { name: 'Curtain', amp: 110, freq: 0.65, phase: 0.0, speed: 0.5, base: 32, color: '#36f2b5', visible: true },
            { name: 'Glow', amp: 95, freq: 1.05, phase: 1.2, speed: -0.45, base: 44, color: '#3ac8ff', visible: true },
            { name: 'Haze', amp: 85, freq: 1.45, phase: 2.1, speed: 0.6, base: 56, color: '#a86cff', visible: true },
            { name: 'Veil', amp: 70, freq: 1.85, phase: 3.0, speed: -0.35, base: 68, color: '#ff6ad5', visible: true },
            { name: 'Ribbon', amp: 60, freq: 2.25, phase: 0.7, speed: 0.55, base: 80, color: '#1ef0d8', visible: true }
          ]
        },
        tide: {
          name: 'Tide',
          theme: 'light',
          bg: ['#dfeaf1', '#7fa4bd'],
          blendMode: 'multiply',
          gradientStyle: 'shade',
          layers: [
            { name: 'Spray', amp: 55, freq: 0.85, phase: 0.0, speed: 0.7, base: 32, color: '#bcd8e6', visible: true },
            { name: 'Foam', amp: 70, freq: 1.15, phase: 1.1, speed: -0.5, base: 45, color: '#8fbccd', visible: true },
            { name: 'Surge', amp: 85, freq: 1.4, phase: 2.3, speed: 0.65, base: 58, color: '#5792ad', visible: true },
            { name: 'Undertow', amp: 100, freq: 1.7, phase: 0.5, speed: -0.6, base: 70, color: '#2b6582', visible: true },
            { name: 'Abyss', amp: 115, freq: 2.0, phase: 1.6, speed: 0.4, base: 82, color: '#123a52', visible: true }
          ]
        },
        silk: {
          name: 'Silk',
          theme: 'dark',
          bg: ['#1a1520', '#3a2740'],
          blendMode: 'screen',
          gradientStyle: 'fade',
          layers: [
            { name: 'Gossamer', amp: 80, freq: 0.75, phase: 0.3, speed: 0.3, base: 34, color: '#f7c9d8', visible: true },
            { name: 'Satin', amp: 95, freq: 1.05, phase: 1.4, speed: -0.35, base: 46, color: '#c9b8f5', visible: true },
            { name: 'Chiffon', amp: 75, freq: 1.35, phase: 2.5, speed: 0.4, base: 58, color: '#9fd6f0', visible: true },
            { name: 'Organza', amp: 85, freq: 1.7, phase: 0.8, speed: -0.25, base: 70, color: '#f6e3b4', visible: true },
            { name: 'Velvet', amp: 70, freq: 2.1, phase: 1.9, speed: 0.3, base: 82, color: '#e9a5c9', visible: true }
          ]
        },
        nebula: {
          name: 'Nebula',
          theme: 'dark',
          bg: ['#050208', '#150a26'],
          blendMode: 'lighter',
          gradientStyle: 'fade',
          layers: [
            { name: 'Corona', amp: 90, freq: 0.6, phase: 0.0, speed: 0.45, base: 30, color: '#5a1a8c', visible: true },
            { name: 'Core', amp: 80, freq: 0.9, phase: 1.1, speed: -0.4, base: 42, color: '#c026a6', visible: true },
            { name: 'Stardust', amp: 75, freq: 1.25, phase: 2.2, speed: 0.55, base: 54, color: '#ff4f7a', visible: true },
            { name: 'Plasma', amp: 65, freq: 1.6, phase: 0.6, speed: -0.5, base: 66, color: '#3b3cff', visible: true },
            { name: 'Flare', amp: 60, freq: 1.95, phase: 1.8, speed: 0.35, base: 78, color: '#ffb26a', visible: true },
            { name: 'Pulse', amp: 50, freq: 2.3, phase: 2.9, speed: -0.3, base: 88, color: '#22e0ff', visible: true }
          ]
        }
      };

      const HARMONIC_RATIOS = [1.0, 1.5, 2.0, 1.25, 1.66667, 2.5];
      const LAYER_NAMES = ['Crest', 'Swell', 'Drift', 'Undertow', 'Haze', 'Bed'];

      // --- Application State ---
      const state = {
        presetKey: 'aurora',
        bg: ['#03050f', '#0b1b2b'],
        blendMode: 'screen',
        gradientStyle: 'fade',
        flow: true,
        harmony: false,
        fundamental: 1.2,
        selectedIndex: 0,
        layers: JSON.parse(JSON.stringify(PRESETS.aurora.layers)),
        bumping: []
      };

      // Check motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        state.flow = false;
      }

      // --- DOM Elements ---
      const canvas = document.getElementById('viewport');
      const ctx = canvas.getContext('2d');
      const panel = document.getElementById('panel');
      const togglePanelBtn = document.getElementById('toggle-panel-btn');
      const toastEl = document.getElementById('toast');
      const layerListEl = document.getElementById('layer-list');
      const flowCard = document.getElementById('flow-card');
      const harmonyCard = document.getElementById('harmony-card');
      const harmonySliderRow = document.getElementById('harmony-slider-row');
      const fundamentalInput = document.getElementById('fundamental-input');
      const fundamentalVal = document.getElementById('fundamental-val');

      // Layer Controls
      const selectedNameBadge = document.getElementById('selected-name-badge');
      const ampInput = document.getElementById('amp-input');
      const ampVal = document.getElementById('amp-val');
      const freqInput = document.getElementById('freq-input');
      const freqVal = document.getElementById('freq-val');
      const freqParamRow = document.getElementById('freq-param-row');
      const phaseInput = document.getElementById('phase-input');
      const phaseVal = document.getElementById('phase-val');
      const speedInput = document.getElementById('speed-input');
      const speedVal = document.getElementById('speed-val');
      const baselineInput = document.getElementById('baseline-input');
      const baselineVal = document.getElementById('baseline-val');
      const colorInput = document.getElementById('color-input');
      const colorHexVal = document.getElementById('color-hex-val');

      // Buttons
      const addLayerBtn = document.getElementById('add-layer-btn');
      const surpriseBtn = document.getElementById('surprise-btn');
      const exportSvgBtn = document.getElementById('export-svg-btn');
      const presetButtons = document.querySelectorAll('.preset-btn');

      let width = 0;
      let height = 0;
      let dpr = 1;
      let time = 0;
      let lastTimestamp = performance.now();
      let toastTimer = null;

      // --- Helpers ---
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
      }

      function hexToRgb(hex) {
        let c = hex.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        return {
          r: (num >> 16) & 255,
          g: (num >> 8) & 255,
          b: num & 255
        };
      }

      function shadeColor(hex, factor) {
        const { r, g, b } = hexToRgb(hex);
        return `rgb(${Math.round(r * factor)}, ${Math.round(g * factor)}, ${Math.round(b * factor)})`;
      }

      function hexToRgba(hex, alpha) {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      // --- Canvas Sizing ---
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      // --- Theme & Presets ---
      function applyPreset(key) {
        const p = PRESETS[key];
        if (!p) return;
        state.presetKey = key;
        state.bg = [...p.bg];
        state.blendMode = p.blendMode;
        state.gradientStyle = p.gradientStyle;
        state.layers = JSON.parse(JSON.stringify(p.layers));
        state.selectedIndex = Math.min(state.selectedIndex, state.layers.length - 1);

        if (p.theme === 'light') {
          document.body.classList.add('light-theme');
        } else {
          document.body.classList.remove('light-theme');
        }

        presetButtons.forEach(btn => {
          btn.setAttribute('aria-pressed', btn.dataset.preset === key ? 'true' : 'false');
        });

        renderLayerList();
        updateSelectedControlsUI();
        toast(`Applied ${p.name} preset`);
      }

      presetButtons.forEach(btn => {
        btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
      });

      // --- Render Layer Chips ---
      function renderLayerList() {
        layerListEl.innerHTML = '';
        state.layers.forEach((layer, idx) => {
          const chip = document.createElement('div');
          chip.className = `layer-chip ${idx === state.selectedIndex ? 'active' : ''}`;
          chip.setAttribute('draggable', 'true');
          chip.dataset.index = idx;

          const freqDisplay = state.harmony
            ? (state.fundamental * HARMONIC_RATIOS[idx % HARMONIC_RATIOS.length]).toFixed(2)
            : layer.freq.toFixed(2);

          chip.innerHTML = `
            <span class="chip-grip" title="Drag to reorder">⋮⋮</span>
            <div class="chip-swatch" style="background: ${layer.color}; color: ${layer.color};"></div>
            <div class="chip-name">${layer.name}</div>
            <div class="chip-stats">ƒ${freqDisplay} · ${Math.round(layer.amp)}p</div>
            <button class="chip-btn toggle-vis" title="Toggle visibility" aria-label="Toggle visibility">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:${layer.visible ? 1 : 0.3}">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <button class="chip-btn delete-layer" title="Delete layer" aria-label="Delete layer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          `;

          // Select layer
          chip.addEventListener('click', (e) => {
            if (e.target.closest('.chip-btn')) return;
            state.selectedIndex = idx;
            renderLayerList();
            updateSelectedControlsUI();
          });

          // Visibility Toggle
          chip.querySelector('.toggle-vis').addEventListener('click', (e) => {
            e.stopPropagation();
            layer.visible = !layer.visible;
            renderLayerList();
          });

          // Delete Layer
          chip.querySelector('.delete-layer').addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.layers.length <= 1) {
              toast("Can't remove the sole surviving wave.");
              return;
            }
            state.layers.splice(idx, 1);
            if (state.selectedIndex >= state.layers.length) {
              state.selectedIndex = state.layers.length - 1;
            }
            renderLayerList();
            updateSelectedControlsUI();
            toast("Wave layer removed");
          });

          // Drag Reordering
          chip.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', idx);
            chip.style.opacity = '0.5';
          });
          chip.addEventListener('dragend', () => {
            chip.style.opacity = '1';
          });
          chip.addEventListener('dragover', (e) => {
            e.preventDefault();
          });
          chip.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (!isNaN(fromIdx) && fromIdx !== idx) {
              const moved = state.layers.splice(fromIdx, 1)[0];
              state.layers.splice(idx, 0, moved);
              state.selectedIndex = idx;
              renderLayerList();
              updateSelectedControlsUI();
            }
          });

          layerListEl.appendChild(chip);
        });
      }

      function updateSelectedControlsUI() {
        const layer = state.layers[state.selectedIndex];
        if (!layer) return;

        selectedNameBadge.textContent = layer.name;
        ampInput.value = layer.amp;
        ampVal.textContent = `${Math.round(layer.amp)}px`;

        freqInput.value = layer.freq;
        freqVal.textContent = layer.freq.toFixed(2);
        freqInput.disabled = state.harmony;

        phaseInput.value = layer.phase;
        phaseVal.textContent = `${Number(layer.phase).toFixed(2)} π`;

        speedInput.value = layer.speed;
        speedVal.textContent = Number(layer.speed).toFixed(2);

        baselineInput.value = layer.base;
        baselineVal.textContent = `${Math.round(layer.base)}%`;

        colorInput.value = layer.color;
        colorHexVal.textContent = layer.color.toUpperCase();
      }

      // --- Selected Layer Input Listeners ---
      ampInput.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.layers[state.selectedIndex].amp = val;
        ampVal.textContent = `${Math.round(val)}px`;
        renderLayerList();
      });

      freqInput.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.layers[state.selectedIndex].freq = val;
        freqVal.textContent = val.toFixed(2);
        renderLayerList();
      });

      phaseInput.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.layers[state.selectedIndex].phase = val;
        phaseVal.textContent = `${val.toFixed(2)} π`;
      });

      speedInput.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.layers[state.selectedIndex].speed = val;
        speedVal.textContent = val.toFixed(2);
      });

      baselineInput.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.layers[state.selectedIndex].base = val;
        baselineVal.textContent = `${Math.round(val)}%`;
      });

      colorInput.addEventListener('input', (e) => {
        const val = e.target.value;
        state.layers[state.selectedIndex].color = val;
        colorHexVal.textContent = val.toUpperCase();
        renderLayerList();
      });

      // --- Toggles ---
      function setFlow(active) {
        state.flow = active;
        flowCard.classList.toggle('active', state.flow);
      }
      flowCard.addEventListener('click', () => {
        setFlow(!state.flow);
        toast(state.flow ? "Flow resumed" : "Flow frozen");
      });

      function setHarmony(active) {
        state.harmony = active;
        harmonyCard.classList.toggle('active', state.harmony);
        harmonySliderRow.style.display = state.harmony ? 'flex' : 'none';
        freqInput.disabled = state.harmony;
        renderLayerList();
        toast(state.harmony ? "Harmonic lock engaged" : "Per-layer frequency unlocked");
      }
      harmonyCard.addEventListener('click', () => setHarmony(!state.harmony));

      fundamentalInput.addEventListener('input', (e) => {
        state.fundamental = parseFloat(e.target.value);
        fundamentalVal.textContent = state.fundamental.toFixed(2);
        renderLayerList();
      });

      // --- Alt + Arrow Key Navigation / Shortcut ---
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;

        if (e.code === 'Space') {
          e.preventDefault();
          setFlow(!state.flow);
        } else if (e.key.toLowerCase() === 'h' && !e.altKey && !e.metaKey && !e.ctrlKey) {
          panel.classList.toggle('hidden');
        } else if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
          e.preventDefault();
          const cur = state.selectedIndex;
          if (e.key === 'ArrowUp' && cur > 0) {
            const moved = state.layers.splice(cur, 1)[0];
            state.layers.splice(cur - 1, 0, moved);
            state.selectedIndex = cur - 1;
            renderLayerList();
            updateSelectedControlsUI();
          } else if (e.key === 'ArrowDown' && cur < state.layers.length - 1) {
            const moved = state.layers.splice(cur, 1)[0];
            state.layers.splice(cur + 1, 0, moved);
            state.selectedIndex = cur + 1;
            renderLayerList();
            updateSelectedControlsUI();
          }
        }
      });

      togglePanelBtn.addEventListener('click', () => {
        panel.classList.toggle('hidden');
      });

      // --- Add Layer ---
      addLayerBtn.addEventListener('click', () => {
        if (state.layers.length >= 6) {
          toast("Six is harmonic perfection. More would be decadent.");
          return;
        }
        const idx = state.layers.length;
        const name = LAYER_NAMES[idx] || `Wave ${idx + 1}`;
        const prev = state.layers[idx - 1] || { amp: 70, freq: 1.2, base: 50 };
        const newLayer = {
          name: name,
          amp: Math.max(30, Math.min(160, prev.amp * (0.85 + Math.random() * 0.3))),
          freq: parseFloat((prev.freq * 1.25).toFixed(2)),
          phase: parseFloat((Math.random() * 2).toFixed(2)),
          speed: parseFloat(((Math.random() - 0.5) * 1.2).toFixed(2)),
          base: Math.min(92, prev.base + 10),
          color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'),
          visible: true
        };
        state.layers.push(newLayer);
        state.selectedIndex = state.layers.length - 1;
        renderLayerList();
        updateSelectedControlsUI();
        toast(`Added layer: ${name}`);
      });

      // --- Surprise Me ---
      surpriseBtn.addEventListener('click', () => {
        const count = Math.random() > 0.4 ? 5 : 6;
        const baseHue = Math.random() * 360;
        const palette = [];
        for (let i = 0; i < count; i++) {
          const h = (baseHue + i * (360 / count * 0.4) + (Math.random() * 30 - 15)) % 360;
          const s = 65 + Math.random() * 25;
          const l = 50 + Math.random() * 25;
          palette.push(`hsl(${Math.round(h)}, ${Math.round(s)}%, ${Math.round(l)}%)`);
        }

        // Convert HSL to Hex
        const dummy = document.createElement('div');
        const hexPalette = palette.map(hsl => {
          dummy.style.color = hsl;
          document.body.appendChild(dummy);
          const cs = window.getComputedStyle(dummy).color;
          document.body.removeChild(dummy);
          const m = cs.match(/\d+/g);
          return '#' + m.slice(0, 3).map(n => parseInt(n).toString(16).padStart(2, '0')).join('');
        });

        const newLayers = [];
        for (let i = 0; i < count; i++) {
          newLayers.push({
            name: LAYER_NAMES[i] || `Wave ${i + 1}`,
            amp: Math.round(45 + Math.random() * 85),
            freq: parseFloat((0.5 + i * 0.35 + Math.random() * 0.2).toFixed(2)),
            phase: parseFloat((Math.random() * 2).toFixed(2)),
            speed: parseFloat(((Math.random() > 0.5 ? 1 : -1) * (0.2 + Math.random() * 0.6)).toFixed(2)),
            base: Math.round(28 + (i / count) * 60),
            color: hexPalette[i],
            visible: true
          });
        }
        state.layers = newLayers;
        state.selectedIndex = 0;
        presetButtons.forEach(b => b.setAttribute('aria-pressed', 'false'));
        renderLayerList();
        updateSelectedControlsUI();
        toast("Harmonised new organic composition");
      });

      // --- Interactive Pointer Deformation (Gaussian Bumps) ---
      let isPointerDown = false;
      let lastPointerY = 0;
      let lastPointerX = 0;

      function onPointerDown(e) {
        if (e.target !== canvas) return;
        isPointerDown = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      }

      function onPointerMove(e) {
        if (!isPointerDown) return;
        const deltaY = e.clientY - lastPointerY;
        const deltaX = Math.abs(e.clientX - lastPointerX);
        if (Math.abs(deltaY) > 0.5 || deltaX > 0.5) {
          state.bumping.push({
            x: e.clientX,
            y: e.clientY,
            strength: Math.max(-120, Math.min(120, deltaY * 2.2)),
            radiusX: 110,
            radiusY: 160,
            birth: performance.now(),
            duration: 1100
          });
        }
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      }

      function onPointerUp() {
        isPointerDown = false;
      }

      window.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);

      // --- Wave Math Function ---
      function evaluateWaveSurface(layer, index, x, t, w, h, bumps, now) {
        const freq = state.harmony
          ? state.fundamental * HARMONIC_RATIOS[index % HARMONIC_RATIOS.length]
          : layer.freq;

        const k = (2 * Math.PI * freq) / w;
        const omega = layer.speed * 1.5;
        const phaseShift = layer.phase * Math.PI;

        // Sum of 3 sines: fundamental, 2.17x at 38%, 4.3x at 16%
        const theta = k * x + omega * t + phaseShift;
        const s1 = Math.sin(theta);
        const s2 = 0.38 * Math.sin(theta * 2.17 + 0.8);
        const s3 = 0.16 * Math.sin(theta * 4.3 + 1.6);
        const norm = 1.0 + 0.38 + 0.16;

        let y = (layer.base / 100) * h + ((s1 + s2 + s3) / norm) * layer.amp;

        // Apply interactive pointer gaussian bumps
        const baselineY = (layer.base / 100) * h;
        for (let i = 0; i < bumps.length; i++) {
          const b = bumps[i];
          const age = now - b.birth;
          if (age >= b.duration) continue;

          const progress = age / b.duration;
          const decay = Math.exp(-progress * 3.5) * (1 - progress);

          // Proximity to layer baseline
          const distY = Math.abs(baselineY - b.y);
          const weightY = Math.exp(- (distY * distY) / (2 * b.radiusY * b.radiusY));

          // Horizontal gaussian distance
          const distX = x - b.x;
          const weightX = Math.exp(- (distX * distX) / (2 * b.radiusX * b.radiusX));

          y += b.strength * decay * weightX * weightY;
        }

        return y;
      }

      // --- Animation Loop ---
      function draw(timestamp) {
        requestAnimationFrame(draw);

        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (state.flow) {
          time += dt;
        }

        // Clean expired bumps
        const now = performance.now();
        state.bumping = state.bumping.filter(b => now - b.birth < b.duration);

        ctx.save();
        ctx.scale(dpr, dpr);

        // 1. Background Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
        bgGrad.addColorStop(0, state.bg[0]);
        bgGrad.addColorStop(1, state.bg[1]);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // 2. Soft Radial Light in upper left
        const radialGrad = ctx.createRadialGradient(width * 0.18, height * 0.18, 10, width * 0.2, height * 0.2, width * 0.85);
        radialGrad.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
        radialGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.03)');
        radialGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = radialGrad;
        ctx.fillRect(0, 0, width, height);

        // 3. Faint Vignette
        const vignette = ctx.createRadialGradient(width / 2, height / 2, width * 0.35, width / 2, height / 2, width * 0.85);
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.36)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);

        // 4. Wave Layers
        ctx.globalCompositeOperation = state.blendMode;

        const samples = 220;
        const step = width / (samples - 1);

        for (let l = 0; l < state.layers.length; l++) {
          const layer = state.layers[l];
          if (!layer.visible) continue;

          // Sample heights
          const points = [];
          for (let i = 0; i < samples; i++) {
            const x = i * step;
            const y = evaluateWaveSurface(layer, l, x, time, width, height, state.bumping, now);
            points.push({ x, y });
          }

          // Build path with quadratic mid-point smoothing
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);

          for (let i = 0; i < points.length - 1; i++) {
            const p0 = points[i];
            const p1 = points[i + 1];
            const midX = (p0.x + p1.x) / 2;
            const midY = (p0.y + p1.y) / 2;
            ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
          }
          ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);

          // Close to bottom
          ctx.lineTo(width, height + 10);
          ctx.lineTo(0, height + 10);
          ctx.closePath();

          // Fill Gradient
          const baselineY = (layer.base / 100) * height;
          const fillGrad = ctx.createLinearGradient(0, baselineY - layer.amp * 1.3, 0, height);
          if (state.gradientStyle === 'fade') {
            fillGrad.addColorStop(0, hexToRgba(layer.color, 0.95));
            fillGrad.addColorStop(0.7, hexToRgba(layer.color, 0.35));
            fillGrad.addColorStop(1, hexToRgba(layer.color, 0.0));
          } else {
            fillGrad.addColorStop(0, layer.color);
            fillGrad.addColorStop(1, shadeColor(layer.color, 0.55));
          }
          ctx.fillStyle = fillGrad;
          ctx.fill();

          // Hairline crest highlight (22-28% white)
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 0; i < points.length - 1; i++) {
            const p0 = points[i];
            const p1 = points[i + 1];
            const midX = (p0.x + p1.x) / 2;
            const midY = (p0.y + p1.y) / 2;
            ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
          }
          ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1.25;
          ctx.stroke();
        }

        ctx.restore();
      }

      requestAnimationFrame(draw);

      // --- Export SVG ---
      exportSvgBtn.addEventListener('click', () => {
        const svgW = width;
        const svgH = height;
        const samples = 220;
        const step = svgW / (samples - 1);
        const now = performance.now();

        let defs = `
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${state.bg[0]}"/>
            <stop offset="100%" stop-color="${state.bg[1]}"/>
          </linearGradient>
        `;

        state.layers.forEach((layer, l) => {
          if (!layer.visible) return;
          const baselineY = (layer.base / 100) * svgH;
          const y1 = Math.max(0, baselineY - layer.amp * 1.3);
          if (state.gradientStyle === 'fade') {
            defs += `
            <linearGradient id="layerGrad${l}" x1="0" y1="${y1}" x2="0" y2="${svgH}" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="${layer.color}" stop-opacity="0.95"/>
              <stop offset="70%" stop-color="${layer.color}" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="${layer.color}" stop-opacity="0"/>
            </linearGradient>`;
          } else {
            defs += `
            <linearGradient id="layerGrad${l}" x1="0" y1="${y1}" x2="0" y2="${svgH}" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="${layer.color}"/>
              <stop offset="100%" stop-color="${shadeColor(layer.color, 0.55)}"/>
            </linearGradient>`;
          }
        });

        defs += `</defs>`;

        let layersSvg = '';
        state.layers.forEach((layer, l) => {
          if (!layer.visible) return;

          const points = [];
          for (let i = 0; i < samples; i++) {
            const x = i * step;
            const y = evaluateWaveSurface(layer, l, x, time, svgW, svgH, state.bumping, now);
            points.push({ x: Number(x.toFixed(1)), y: Number(y.toFixed(1)) });
          }

          let pathData = `M ${points[0].x} ${points[0].y}`;
          for (let i = 0; i < points.length - 1; i++) {
            const p0 = points[i];
            const p1 = points[i + 1];
            const midX = ((p0.x + p1.x) / 2).toFixed(1);
            const midY = ((p0.y + p1.y) / 2).toFixed(1);
            pathData += ` Q ${p0.x} ${p0.y}, ${midX} ${midY}`;
          }
          pathData += ` L ${points[points.length - 1].x} ${points[points.length - 1].y}`;
          const crestPathData = pathData;
          pathData += ` L ${svgW} ${svgH + 10} L 0 ${svgH + 10} Z`;

          layersSvg += `
          <g style="mix-blend-mode: ${state.blendMode};">
            <path d="${pathData}" fill="url(#layerGrad${l})" />
            <path d="${crestPathData}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.25" />
          </g>`;
        });

        const svgContent = `<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}">
  ${defs}
  <rect width="${svgW}" height="${svgH}" fill="url(#bgGrad)" />
  ${layersSvg}
</svg>`;

        const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `organic-wave-lab-${state.presetKey}-${Date.now()}.svg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        toast("SVG composition downloaded");
      });

      // --- Initialisation ---
      setFlow(state.flow);
      renderLayerList();
      updateSelectedControlsUI();

    })();
  </script>
</body>
</html>
