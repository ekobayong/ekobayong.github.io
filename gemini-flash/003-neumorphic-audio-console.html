<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softdesk 4 — Neumorphic Audio Console</title>
<style>
:root {
  --bg: #e0e5ec;
  --bg-light: #e6ebf2;
  --sh-light: #ffffff;
  --sh-dark: #a3b1c6;
  --sh-darker: #8d9bb0;
  
  --txt-main: #3d4a5c;
  --txt-muted: #6b7a90;
  --txt-dim: #97a4b8;
  
  --accent-coral: #ff7a59;
  --accent-teal: #4fd1c5;
  --accent-red: #ff4d4d;
  
  --led-green: #5ee36a;
  --led-amber: #ffc857;
  --led-red: #ff4d4d;
  --led-off: rgba(163, 177, 198, 0.25);
  
  --shadow-raised-lg: 9px 9px 18px var(--sh-dark), -9px -9px 18px var(--sh-light);
  --shadow-raised-sm: 5px 5px 10px var(--sh-dark), -5px -5px 10px var(--sh-light);
  --shadow-inset-lg: inset 9px 9px 18px var(--sh-dark), inset -9px -9px 18px var(--sh-light);
  --shadow-inset-sm: inset 5px 5px 10px var(--sh-dark), inset -5px -5px 10px var(--sh-light);
  --shadow-inset-xs: inset 2px 2px 5px var(--sh-dark), inset -2px -2px 5px var(--sh-light);

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background-color: var(--bg);
  color: var(--txt-main);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px;
  overflow-x: hidden;
}

.console-container {
  width: 100%;
  max-width: 1240px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Header */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  border-radius: 24px;
  background: var(--bg);
  box-shadow: var(--shadow-raised-sm);
}

.brand-icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-icon svg {
  fill: var(--accent-teal);
  filter: drop-shadow(1px 1px 1px var(--sh-dark));
}

.brand-titles h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--txt-main);
  line-height: 1.1;
}

.brand-titles p {
  font-size: 0.75rem;
  color: var(--txt-muted);
  font-weight: 500;
  letter-spacing: 0.03em;
}

.sys-pill {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border-radius: 20px;
  background: var(--bg);
  box-shadow: var(--shadow-inset-sm);
  color: var(--txt-muted);
  display: flex;
  gap: 16px;
}

.sys-pill span strong {
  color: var(--txt-main);
  font-weight: 600;
}

/* Grid Layout */
.mixer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 1.25fr;
  gap: 24px;
  width: 100%;
}

/* Strips Base */
.strip {
  background: var(--bg);
  border-radius: 28px;
  padding: 24px 18px;
  box-shadow: var(--shadow-raised-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  position: relative;
}

.strip-name {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--txt-muted);
}

.knob-row {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  align-items: center;
}

.knob-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.knob-label {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--txt-dim);
  margin-top: 6px;
  letter-spacing: 0.05em;
}

.knob-val-readout {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--txt-muted);
  margin-top: 2px;
}

/* Rotary Knob Component */
.knob-outer {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--bg);
  box-shadow: var(--shadow-raised-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  touch-action: none;
  cursor: ns-resize;
  outline: none;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.knob-outer:focus-visible {
  box-shadow: var(--shadow-raised-sm), 0 0 0 2px var(--accent-teal);
}

.knob-outer.dragging {
  box-shadow: var(--shadow-inset-sm);
  transform: scale(0.97);
}

.knob-arc-layer {
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  pointer-events: none;
  background: conic-gradient(
    from -135deg,
    var(--accent-teal) 0deg,
    var(--accent-teal) calc(var(--deg, 0) + 135deg),
    transparent calc(var(--deg, 0) + 135deg),
    transparent 360deg
  );
  -webkit-mask: radial-gradient(transparent calc(50% - 3px), black calc(50% - 2.5px), black 50%, transparent 51%);
  mask: radial-gradient(transparent calc(50% - 3px), black calc(50% - 2.5px), black 50%, transparent 51%);
}

.knob-face {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--bg-light), var(--bg));
  box-shadow: var(--shadow-raised-sm);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(calc(var(--deg, 0) * 1deg));
}

.knob-outer.dragging .knob-face {
  box-shadow: var(--shadow-inset-xs);
}

.knob-pointer {
  position: absolute;
  top: 4px;
  width: 3.5px;
  height: 12px;
  border-radius: 2px;
  background-color: var(--accent-coral);
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

/* Master Knob Variant */
.strip-master .knob-outer {
  width: 82px;
  height: 82px;
}
.strip-master .knob-face {
  width: 58px;
  height: 58px;
}

/* Toggles (Mute / Solo) */
.switch-row {
  display: flex;
  gap: 12px;
  width: 100%;
  justify-content: center;
}

.toggle-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.toggle-lbl {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--txt-dim);
}

.toggle-switch {
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--shadow-inset-xs);
  position: relative;
  cursor: pointer;
  outline: none;
  border: none;
  padding: 0;
  transition: box-shadow 0.2s;
}

.toggle-switch:focus-visible {
  box-shadow: var(--shadow-inset-xs), 0 0 0 2px var(--accent-teal);
}

.toggle-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg-light);
  box-shadow: var(--shadow-raised-sm);
  position: absolute;
  top: 3px;
  left: 3px;
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s ease;
}

.toggle-switch[aria-pressed="true"] .toggle-thumb {
  transform: translateX(16px);
  background: var(--accent-coral);
}

/* Fader & Meter Deck */
.deck-row {
  display: flex;
  gap: 14px;
  height: 220px;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.fader-trough {
  width: 42px;
  height: 100%;
  border-radius: 21px;
  background: var(--bg);
  box-shadow: var(--shadow-inset-lg);
  position: relative;
  touch-action: none;
  cursor: ns-resize;
  outline: none;
}

.fader-trough:focus-visible {
  box-shadow: var(--shadow-inset-lg), 0 0 0 2px var(--accent-teal);
}

.fader-track-line {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 24px;
  bottom: 24px;
  width: 4px;
  background: var(--sh-darker);
  border-radius: 2px;
  overflow: hidden;
}

.fader-track-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: calc(var(--pos, 0.7) * 100%);
  background: var(--accent-teal);
}

.fader-cap {
  position: absolute;
  left: 4px;
  right: 4px;
  height: 46px;
  bottom: calc(var(--pos, 0.7) * (100% - 46px));
  border-radius: 8px;
  background: linear-gradient(180deg, var(--bg-light), var(--bg));
  box-shadow: var(--shadow-raised-sm);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  transition: box-shadow 0.1s ease;
}

.fader-cap.dragging {
  box-shadow: var(--shadow-inset-sm);
}

.fader-cap .grip {
  width: 18px;
  height: 2px;
  background: var(--sh-darker);
  border-radius: 1px;
}

/* LED Meter */
.meter-pill {
  width: 18px;
  height: 100%;
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--shadow-inset-sm);
  display: flex;
  flex-direction: column-reverse;
  justify-content: space-between;
  padding: 6px 3px;
  position: relative;
}

.meter-seg {
  width: 100%;
  height: 9px;
  border-radius: 2px;
  background-color: var(--led-off);
  transition: background-color 0.05s ease;
}

.meter-seg.on.green { background-color: var(--led-green); box-shadow: 0 0 4px var(--led-green); }
.meter-seg.on.amber { background-color: var(--led-amber); box-shadow: 0 0 4px var(--led-amber); }
.meter-seg.on.red { background-color: var(--led-red); box-shadow: 0 0 4px var(--led-red); }

.meter-seg.peak.green { background-color: var(--led-green); }
.meter-seg.peak.amber { background-color: var(--led-amber); }
.meter-seg.peak.red { background-color: var(--led-red); }

/* Master Dual Meter Deck */
.master-deck-row {
  display: flex;
  gap: 12px;
  align-items: center;
  height: 220px;
}

.readout-pill {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 6px 14px;
  border-radius: 14px;
  background: var(--bg);
  box-shadow: var(--shadow-inset-xs);
  color: var(--txt-main);
  text-align: center;
  width: 84px;
}

/* Master Section Specifics */
.strip-master {
  align-items: stretch;
}

.master-header {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

.timecode-display {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 10px 18px;
  border-radius: 16px;
  background: var(--bg);
  box-shadow: var(--shadow-inset-sm);
  color: var(--txt-main);
  text-align: center;
  width: 100%;
}

.transport-bar {
  display: flex;
  justify-content: space-between;
  width: 100%;
  gap: 8px;
}

.transport-btn {
  flex: 1;
  aspect-ratio: 1;
  border-radius: 12px;
  background: var(--bg);
  box-shadow: var(--shadow-raised-sm);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  outline: none;
  transition: all 0.1s ease;
  color: var(--txt-muted);
}

.transport-btn:focus-visible {
  box-shadow: var(--shadow-raised-sm), 0 0 0 2px var(--accent-teal);
}

.transport-btn:active, .transport-btn.active {
  box-shadow: var(--shadow-inset-sm);
  transform: scale(0.96);
}

.transport-btn.btn-play.active svg {
  fill: var(--accent-teal);
}

.transport-btn.btn-rec.active svg {
  fill: var(--accent-red);
}

.scenes-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.scene-btn-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

.scene-btn {
  flex: 1;
  padding: 8px 4px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  border-radius: 10px;
  background: var(--bg);
  box-shadow: var(--shadow-raised-sm);
  border: none;
  color: var(--txt-muted);
  cursor: pointer;
  outline: none;
  transition: all 0.15s ease;
}

.scene-btn:focus-visible {
  box-shadow: var(--shadow-raised-sm), 0 0 0 2px var(--accent-teal);
}

.scene-btn.selected {
  box-shadow: var(--shadow-inset-xs);
  color: var(--accent-coral);
  font-weight: 800;
}

/* Instructions & Legend */
.help-line {
  font-size: 0.78rem;
  color: var(--txt-dim);
  text-align: center;
  line-height: 1.6;
  margin-top: 4px;
}

kbd {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 2px 6px;
  background: var(--bg);
  box-shadow: var(--shadow-raised-sm);
  border-radius: 4px;
  color: var(--txt-muted);
  margin: 0 2px;
}

/* Responsiveness */
@media (max-width: 1000px) {
  .mixer-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .strip-master {
    grid-column: span 2;
  }
}

@media (max-width: 480px) {
  .mixer-grid {
    grid-template-columns: 1fr;
  }
  .strip-master {
    grid-column: span 1;
  }
  .sys-pill {
    flex-wrap: wrap;
  }
}

@media (min-width: 1800px) {
  .console-container {
    max-width: 1540px;
  }
  .knob-outer {
    width: 84px;
    height: 84px;
  }
  .knob-face {
    width: 60px;
    height: 60px;
  }
  .strip-name {
    font-size: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>

<div class="console-container">
  <header>
    <div class="brand-badge">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <rect x="2" y="10" width="3.5" height="11" rx="1.5" />
          <rect x="8.2" y="4" width="3.5" height="17" rx="1.5" />
          <rect x="14.5" y="7" width="3.5" height="14" rx="1.5" />
          <rect x="20.7" y="1" width="3.5" height="20" rx="1.5" />
        </svg>
      </div>
      <div class="brand-titles">
        <h1>Softdesk 4</h1>
        <p>Neumorphic Console Interface</p>
      </div>
    </div>
    <div class="sys-pill">
      <span>SR: <strong>48.0 kHz</strong></span>
      <span>BUF: <strong>128 smp</strong></span>
      <span id="cpu-metric">CPU: <strong>-- %</strong></span>
    </div>
  </header>

  <main class="mixer-grid" id="mixer-grid">
    <!-- Generated dynamically via JS -->
  </main>

  <footer class="help-line">
    Interact: Click &amp; drag vertically on knobs/faders. Hold <kbd>Shift</kbd> for fine control. Use <kbd>&uarr;</kbd> <kbd>&darr;</kbd> or mouse wheel to nudge. <kbd>Home</kbd> / <kbd>End</kbd> for min/max. Double-click to reset defaults. Press <kbd>Space</kbd> anywhere to Play/Pause.
  </footer>
</div>

<script>
(function() {
  const CHANNELS = [
    { id: 0, name: 'Vocal',  gain: 75, pan: 0,   mute: false, solo: false, fader: 0.78, peak: 0 },
    { id: 1, name: 'Keys',   gain: 60, pan: -30, mute: false, solo: false, fader: 0.65, peak: 0 },
    { id: 2, name: 'Bass',   gain: 85, pan: 0,   mute: false, solo: false, fader: 0.82, peak: 0 },
    { id: 3, name: 'Drums',  gain: 90, pan: 15,  mute: false, solo: false, fader: 0.70, peak: 0 }
  ];

  const SCENES = {
    verse:  [0.72, 0.60, 0.80, 0.68],
    chorus: [0.85, 0.78, 0.88, 0.84],
    bridge: [0.55, 0.70, 0.50, 0.40]
  };

  const MASTER = {
    width: 100, // 0 to 200%
    fader: 0.85,
    peakL: 0,
    peakR: 0,
    selectedScene: null
  };

  const TRANSPORT = {
    playing: true,
    recording: false,
    frame: 0
  };

  // Construct UI
  const grid = document.getElementById('mixer-grid');

  function makeKnob(id, label, min, max, val, def, unit) {
    const deg = ((val - min) / (max - min)) * 270 - 135;
    return `
      <div class="knob-cell">
        <div class="knob-outer" id="${id}" tabindex="0" role="slider"
             data-min="${min}" data-max="${max}" data-val="${val}" data-def="${def}" data-unit="${unit}"
             aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${val}" aria-label="${label}"
             style="--deg: ${deg};">
          <div class="knob-arc-layer"></div>
          <div class="knob-face">
            <div class="knob-pointer"></div>
          </div>
        </div>
        <div class="knob-label">${label}</div>
        <div class="knob-val-readout" id="${id}-readout">${formatKnobValue(val, unit)}</div>
      </div>
    `;
  }

  function formatKnobValue(val, unit) {
    if (unit === '%') return `${Math.round(val)}%`;
    if (unit === 'pan') {
      const v = Math.round(val);
      if (v === 0) return 'C';
      return v < 0 ? `L ${Math.abs(v)}` : `R ${v}`;
    }
    return Math.round(val);
  }

  function renderChannelStrip(ch) {
    let segs = '';
    for (let i = 0; i < 14; i++) {
      let colorClass = 'green';
      if (i >= 12) colorClass = 'red';
      else if (i >= 9) colorClass = 'amber';
      segs += `<div class="meter-seg ${colorClass}" data-idx="${i}"></div>`;
    }

    return `
      <div class="strip strip-channel" id="strip-${ch.id}" data-id="${ch.id}">
        <div class="strip-name">${ch.name}</div>
        <div class="knob-row">
          ${makeKnob(`ch-${ch.id}-gain`, 'Gain', 0, 100, ch.gain, 70, '%')}
          ${makeKnob(`ch-${ch.id}-pan`, 'Pan', -50, 50, ch.pan, 0, 'pan')}
        </div>
        <div class="switch-row">
          <div class="toggle-wrap">
            <button class="toggle-switch btn-mute" id="ch-${ch.id}-mute" role="switch" aria-checked="false" aria-pressed="false" aria-label="${ch.name} Mute">
              <div class="toggle-thumb"></div>
            </button>
            <div class="toggle-lbl">Mute</div>
          </div>
          <div class="toggle-wrap">
            <button class="toggle-switch btn-solo" id="ch-${ch.id}-solo" role="switch" aria-checked="false" aria-pressed="false" aria-label="${ch.name} Solo">
              <div class="toggle-thumb"></div>
            </button>
            <div class="toggle-lbl">Solo</div>
          </div>
        </div>
        <div class="deck-row">
          <div class="fader-trough" id="ch-${ch.id}-fader" tabindex="0" role="slider"
               aria-valuemin="0" aria-valuemax="1" aria-valuenow="${ch.fader}" aria-label="${ch.name} Volume"
               style="--pos: ${ch.fader};">
            <div class="fader-track-line">
              <div class="fader-track-fill"></div>
            </div>
            <div class="fader-cap">
              <div class="grip"></div><div class="grip"></div><div class="grip"></div>
            </div>
          </div>
          <div class="meter-pill" id="ch-${ch.id}-meter">
            ${segs}
          </div>
        </div>
        <div class="readout-pill" id="ch-${ch.id}-db">${posToDb(ch.fader)}</div>
      </div>
    `;
  }

  function renderMasterStrip() {
    let segsL = '', segsR = '';
    for (let i = 0; i < 14; i++) {
      let colorClass = 'green';
      if (i >= 12) colorClass = 'red';
      else if (i >= 9) colorClass = 'amber';
      segsL += `<div class="meter-seg ${colorClass}" data-idx="${i}"></div>`;
      segsR += `<div class="meter-seg ${colorClass}" data-idx="${i}"></div>`;
    }

    return `
      <div class="strip strip-master" id="strip-master">
        <div class="strip-name" style="text-align: center;">Master Out</div>
        <div class="master-header">
          <div class="timecode-display" id="timecode">00:00:00.00</div>
          <div class="transport-bar">
            <button class="transport-btn" id="btn-rtz" title="Return to Zero" aria-label="Return to zero">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6L11 12l8 6V6zM7 6v12h2V6H7z"/></svg>
            </button>
            <button class="transport-btn" id="btn-stop" title="Stop" aria-label="Stop">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            </button>
            <button class="transport-btn btn-play active" id="btn-play" title="Play" aria-label="Play">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
            </button>
            <button class="transport-btn btn-rec" id="btn-rec" title="Record" aria-label="Record">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
            </button>
          </div>
          <div class="scenes-wrap">
            <div class="scene-btn-row">
              <button class="scene-btn" data-scene="verse">Verse</button>
              <button class="scene-btn" data-scene="chorus">Chorus</button>
              <button class="scene-btn" data-scene="bridge">Bridge</button>
            </div>
          </div>
        </div>
        <div class="knob-row" style="margin: 4px 0;">
          ${makeKnob('master-width', 'Width', 0, 200, MASTER.width, 100, '%')}
        </div>
        <div class="master-deck-row" style="justify-content: center;">
          <div class="meter-pill" id="master-meter-l">${segsL}</div>
          <div class="fader-trough" id="master-fader" tabindex="0" role="slider"
               aria-valuemin="0" aria-valuemax="1" aria-valuenow="${MASTER.fader}" aria-label="Master Volume"
               style="--pos: ${MASTER.fader};">
            <div class="fader-track-line">
              <div class="fader-track-fill"></div>
            </div>
            <div class="fader-cap">
              <div class="grip"></div><div class="grip"></div><div class="grip"></div>
            </div>
          </div>
          <div class="meter-pill" id="master-meter-r">${segsR}</div>
        </div>
        <div style="display:flex; justify-content:center;">
          <div class="readout-pill" id="master-db">${posToDb(MASTER.fader)}</div>
        </div>
      </div>
    `;
  }

  function posToDb(pos) {
    if (pos <= 0.001) return '-inf dB';
    let db;
    if (pos < 0.75) {
      db = -60 + (pos / 0.75) * 60; // 0 to 0.75 -> -60dB to 0dB
    } else {
      db = ((pos - 0.75) / 0.25) * 6; // 0.75 to 1.0 -> 0dB to +6dB
    }
    const sign = db > 0.05 ? '+' : '';
    return `${sign}${db.toFixed(1)} dB`;
  }

  // Populate HTML
  let fullHtml = '';
  CHANNELS.forEach(ch => { fullHtml += renderChannelStrip(ch); });
  fullHtml += renderMasterStrip();
  grid.innerHTML = fullHtml;

  // Knob Logic
  function initKnobs() {
    document.querySelectorAll('.knob-outer').forEach(knob => {
      let isDragging = false;
      let startY = 0;
      let startVal = 0;

      function updateKnob(val, commit = true) {
        const min = parseFloat(knob.dataset.min);
        const max = parseFloat(knob.dataset.max);
        const unit = knob.dataset.unit;
        val = Math.max(min, Math.min(max, val));
        knob.dataset.val = val;
        knob.setAttribute('aria-valuenow', Math.round(val));
        const deg = ((val - min) / (max - min)) * 270 - 135;
        knob.style.setProperty('--deg', deg);
        const readout = document.getElementById(`${knob.id}-readout`);
        if (readout) readout.innerText = formatKnobValue(val, unit);

        // state linkage
        if (knob.id.startsWith('ch-')) {
          const parts = knob.id.split('-');
          const idx = parseInt(parts[1], 10);
          const prop = parts[2];
          CHANNELS[idx][prop] = val;
        } else if (knob.id === 'master-width') {
          MASTER.width = val;
        }
      }

      knob.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startVal = parseFloat(knob.dataset.val);
        knob.classList.add('dragging');
        knob.setPointerCapture(e.pointerId);
      });

      knob.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaY = startY - e.clientY;
        const range = parseFloat(knob.dataset.max) - parseFloat(knob.dataset.min);
        const travel = e.shiftKey ? 900 : 180;
        const valChange = (deltaY / travel) * range;
        updateKnob(startVal + valChange);
      });

      function stopDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        knob.classList.remove('dragging');
        try { knob.releasePointerCapture(e.pointerId); } catch(err){}
      }

      knob.addEventListener('pointerup', stopDrag);
      knob.addEventListener('pointercancel', stopDrag);

      knob.addEventListener('wheel', (e) => {
        e.preventDefault();
        const min = parseFloat(knob.dataset.min);
        const max = parseFloat(knob.dataset.max);
        const range = max - min;
        const step = (e.shiftKey ? 0.005 : 0.02) * range;
        const cur = parseFloat(knob.dataset.val);
        updateKnob(e.deltaY < 0 ? cur + step : cur - step);
      }, { passive: false });

      knob.addEventListener('keydown', (e) => {
        const min = parseFloat(knob.dataset.min);
        const max = parseFloat(knob.dataset.max);
        const range = max - min;
        const step = (e.shiftKey ? 0.01 : 0.05) * range;
        const cur = parseFloat(knob.dataset.val);

        if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
          e.preventDefault();
          updateKnob(cur + step);
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
          e.preventDefault();
          updateKnob(cur - step);
        } else if (e.key === 'Home') {
          e.preventDefault();
          updateKnob(min);
        } else if (e.key === 'End') {
          e.preventDefault();
          updateKnob(max);
        }
      });

      knob.addEventListener('dblclick', () => {
        updateKnob(parseFloat(knob.dataset.def));
      });
    });
  }

  // Fader Logic
  function setFaderPos(faderEl, pos, triggerSync = true) {
    pos = Math.max(0, Math.min(1, pos));
    faderEl.style.setProperty('--pos', pos);
    faderEl.setAttribute('aria-valuenow', pos.toFixed(2));

    const isMaster = faderEl.id === 'master-fader';
    const dbElId = isMaster ? 'master-db' : faderEl.id.replace('-fader', '-db');
    const dbEl = document.getElementById(dbElId);
    if (dbEl) dbEl.innerText = posToDb(pos);

    if (triggerSync) {
      if (isMaster) {
        MASTER.fader = pos;
      } else {
        const idx = parseInt(faderEl.id.split('-')[1], 10);
        CHANNELS[idx].fader = pos;
        clearSceneSelection();
      }
    }
  }

  function initFaders() {
    document.querySelectorAll('.fader-trough').forEach(fader => {
      let isDragging = false;
      const cap = fader.querySelector('.fader-cap');

      function calculatePos(clientY) {
        const rect = fader.getBoundingClientRect();
        const capH = 46;
        const troughTravel = rect.height - capH;
        const clickY = clientY - rect.top - (capH / 2);
        const ratio = 1 - (clickY / troughTravel);
        return Math.max(0, Math.min(1, ratio));
      }

      fader.addEventListener('pointerdown', (e) => {
        isDragging = true;
        cap.classList.add('dragging');
        fader.setPointerCapture(e.pointerId);
        setFaderPos(fader, calculatePos(e.clientY));
      });

      fader.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        setFaderPos(fader, calculatePos(e.clientY));
      });

      function stopFaderDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        cap.classList.remove('dragging');
        try { fader.releasePointerCapture(e.pointerId); } catch(err){}
      }

      fader.addEventListener('pointerup', stopFaderDrag);
      fader.addEventListener('pointercancel', stopFaderDrag);

      fader.addEventListener('wheel', (e) => {
        e.preventDefault();
        const step = e.shiftKey ? 0.005 : 0.03;
        const cur = parseFloat(fader.style.getPropertyValue('--pos') || 0.7);
        setFaderPos(fader, e.deltaY < 0 ? cur + step : cur - step);
      }, { passive: false });

      fader.addEventListener('keydown', (e) => {
        const step = e.shiftKey ? 0.01 : 0.05;
        const cur = parseFloat(fader.style.getPropertyValue('--pos') || 0.7);
        if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
          e.preventDefault();
          setFaderPos(fader, cur + step);
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
          e.preventDefault();
          setFaderPos(fader, cur - step);
        } else if (e.key === 'Home') {
          e.preventDefault();
          setFaderPos(fader, 0);
        } else if (e.key === 'End') {
          e.preventDefault();
          setFaderPos(fader, 1);
        }
      });

      fader.addEventListener('dblclick', () => {
        setFaderPos(fader, 0.75); // unity / default
      });
    });
  }

  // Toggles (Mute / Solo)
  function initSwitches() {
    CHANNELS.forEach(ch => {
      const muteBtn = document.getElementById(`ch-${ch.id}-mute`);
      const soloBtn = document.getElementById(`ch-${ch.id}-solo`);

      muteBtn.addEventListener('click', () => {
        ch.mute = !ch.mute;
        muteBtn.setAttribute('aria-pressed', ch.mute);
        muteBtn.setAttribute('aria-checked', ch.mute);
      });

      soloBtn.addEventListener('click', () => {
        ch.solo = !ch.solo;
        soloBtn.setAttribute('aria-pressed', ch.solo);
        soloBtn.setAttribute('aria-checked', ch.solo);
      });
    });
  }

  // Transport
  const playBtn = document.getElementById('btn-play');
  const stopBtn = document.getElementById('btn-stop');
  const rtzBtn = document.getElementById('btn-rtz');
  const recBtn = document.getElementById('btn-rec');

  function setPlayState(play) {
    TRANSPORT.playing = play;
    if (play) {
      playBtn.classList.add('active');
      stopBtn.classList.remove('active');
    } else {
      playBtn.classList.remove('active');
      stopBtn.classList.add('active');
      setTimeout(() => stopBtn.classList.remove('active'), 200);
    }
  }

  playBtn.addEventListener('click', () => setPlayState(true));
  stopBtn.addEventListener('click', () => setPlayState(false));

  rtzBtn.addEventListener('click', () => {
    TRANSPORT.frame = 0;
    updateTimecode(0);
    rtzBtn.classList.add('active');
    setTimeout(() => rtzBtn.classList.remove('active'), 150);
  });

  recBtn.addEventListener('click', () => {
    TRANSPORT.recording = !TRANSPORT.recording;
    recBtn.classList.toggle('active', TRANSPORT.recording);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      setPlayState(!TRANSPORT.playing);
    }
  });

  function updateTimecode(frameIndex) {
    const fps = 25;
    const totalSeconds = Math.floor(frameIndex / fps);
    const ff = frameIndex % fps;
    const s = totalSeconds % 60;
    const m = Math.floor(totalSeconds / 60) % 60;
    const h = Math.floor(totalSeconds / 3600);

    const pad = (n) => String(n).padStart(2, '0');
    document.getElementById('timecode').innerText = `${pad(h)}:${pad(m)}:${pad(s)}.${pad(ff)}`;
  }

  // Scene Recalls with Smooth Interpolation
  let sceneAnimId = null;
  function clearSceneSelection() {
    MASTER.selectedScene = null;
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('selected'));
  }

  function recallScene(sceneKey) {
    const targets = SCENES[sceneKey];
    if (!targets) return;

    MASTER.selectedScene = sceneKey;
    document.querySelectorAll('.scene-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.scene === sceneKey);
    });

    const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (isReduced) {
      targets.forEach((pos, idx) => {
        const el = document.getElementById(`ch-${idx}-fader`);
        setFaderPos(el, pos, true);
      });
      return;
    }

    if (sceneAnimId) cancelAnimationFrame(sceneAnimId);

    const starts = CHANNELS.map(ch => ch.fader);
    const startTime = performance.now();
    const duration = 600;

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function anim(now) {
      const elapsed = now - startTime;
      const progress = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(progress);

      CHANNELS.forEach((ch, idx) => {
        const cur = starts[idx] + (targets[idx] - starts[idx]) * eased;
        const el = document.getElementById(`ch-${idx}-fader`);
        setFaderPos(el, cur, false);
        ch.fader = cur;
      });

      if (progress < 1) {
        sceneAnimId = requestAnimationFrame(anim);
      } else {
        sceneAnimId = null;
      }
    }
    sceneAnimId = requestAnimationFrame(anim);
  }

  document.querySelectorAll('.scene-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      recallScene(btn.dataset.scene);
    });
  });

  // Audio Signal Engine & Meters Simulation
  let lastTime = performance.now();
  let timecodeAccumulator = 0;
  let cpuFluct = 3.2;

  function updateMetersVisual(meterEl, level, peakVal) {
    const segs = meterEl.children;
    const activeCount = Math.round(level * 14);
    const peakIdx = Math.min(13, Math.floor(peakVal * 14));

    for (let i = 0; i < 14; i++) {
      const seg = segs[i];
      if (i < activeCount) {
        seg.classList.add('on');
      } else {
        seg.classList.remove('on');
      }

      if (i === peakIdx && peakVal > 0.05) {
        seg.classList.add('peak');
      } else {
        seg.classList.remove('peak');
      }
    }
  }

  function audioLoop(currentTime) {
    const dt = (currentTime - lastTime) / 1000;
    lastTime = currentTime;

    // Timecode advancement at 25 fps
    if (TRANSPORT.playing) {
      timecodeAccumulator += dt;
      const frameDelta = Math.floor(timecodeAccumulator * 25);
      if (frameDelta > 0) {
        TRANSPORT.frame += frameDelta;
        timecodeAccumulator -= frameDelta / 25;
        updateTimecode(TRANSPORT.frame);
      }
      cpuFluct += (Math.random() * 0.4 - 0.2);
      cpuFluct = Math.max(2.1, Math.min(6.8, cpuFluct));
      document.getElementById('cpu-metric').innerHTML = `CPU: <strong>${cpuFluct.toFixed(1)}%</strong>`;
    } else {
      document.getElementById('cpu-metric').innerHTML = `CPU: <strong>0.8%</strong>`;
    }

    const anySolo = CHANNELS.some(c => c.solo);
    let masterSumL = 0;
    let masterSumR = 0;

    const t = currentTime / 1000;

    CHANNELS.forEach((ch, i) => {
      let sig = 0;
      if (TRANSPORT.playing) {
        // synthesize rich periodic activity
        const baseFreq = [1.2, 2.4, 0.8, 3.2][i];
        const env = (Math.sin(t * baseFreq) + 1) * 0.5;
        const beat = Math.pow((Math.sin(t * Math.PI * 2) + 1) * 0.5, 6);
        const jitter = Math.sin(t * 19 + i * 3) * 0.08;
        const raw = (env * 0.65 + beat * 0.35 + jitter);
        
        const gainScaled = ch.gain / 100;
        sig = raw * gainScaled * ch.fader;

        // Mute / Solo logic
        const audible = anySolo ? (ch.solo && !ch.mute) : !ch.mute;
        if (!audible) sig = 0;
      }

      // Smooth decay for peaks
      ch.peak = Math.max(sig, ch.peak - dt * 0.8);
      const chMeterEl = document.getElementById(`ch-${ch.id}-meter`);
      updateMetersVisual(chMeterEl, sig, ch.peak);

      // Stereo panning into master sum
      const panNorm = (ch.pan + 50) / 100; // 0..1
      const panL = Math.cos(panNorm * Math.PI * 0.5);
      const panR = Math.sin(panNorm * Math.PI * 0.5);

      masterSumL += sig * panL;
      masterSumR += sig * panR;
    });

    // Master bus processing: Stereo Width (Mid/Side)
    let mid = (masterSumL + masterSumR) * 0.5;
    let side = (masterSumR - masterSumL) * 0.5;
    const widthFactor = MASTER.width / 100;
    side *= widthFactor;

    let finalL = (mid - side) * MASTER.fader;
    let finalR = (mid + side) * MASTER.fader;

    if (!TRANSPORT.playing) {
      finalL = 0;
      finalR = 0;
    }

    // Master peaks
    MASTER.peakL = Math.max(finalL, MASTER.peakL - dt * 0.8);
    MASTER.peakR = Math.max(finalR, MASTER.peakR - dt * 0.8);

    const meterLEl = document.getElementById('master-meter-l');
    const meterREl = document.getElementById('master-meter-r');
    updateMetersVisual(meterLEl, finalL, MASTER.peakL);
    updateMetersVisual(meterREl, finalR, MASTER.peakR);

    requestAnimationFrame(audioLoop);
  }

  // Initialize
  initKnobs();
  initFaders();
  initSwitches();
  requestAnimationFrame(audioLoop);
})();
</script>
</body>
</html>
