<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation — Interactive Particle Field</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-base: #060b1f;
      --bg-vignette: #03061a;
      --periwinkle: #a9b4ff;
      --periwinkle-rgb: 169, 180, 255;
      --text-main: rgba(236, 239, 255, 0.9);
      --text-dim: rgba(169, 180, 255, 0.55);
      --panel-bg: rgba(6, 11, 31, 0.55);
      --panel-border: rgba(236, 239, 255, 0.18);
      --cubic-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: crosshair;
    }

    /* Ambient Background Layer */
    .viewport-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(120, 90, 200, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(66, 79, 160, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, transparent 40%, var(--bg-vignette) 100%);
      z-index: 1;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    /* Staggered Settle In Animation */
    @keyframes settleIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: clamp(1.5rem, 3.5vw, 3rem);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header telemetry"
        ". ."
        "legend controls";
    }

    .ui-interactive {
      pointer-events: auto;
    }

    /* Top Left: Header */
    .header-block {
      grid-area: header;
      align-self: start;
      animation: settleIn 2.4s var(--ease-out) 0.15s both;
    }

    h1.title {
      font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      font-size: clamp(2.6rem, 8vw, 7.5rem);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: 0.18em;
      color: rgba(245, 247, 255, 0.96);
      text-shadow: 0 0 28px rgba(169, 180, 255, 0.35);
      margin-bottom: 0.85rem;
    }

    .subtitle {
      font-family: "SF Mono", Monaco, "Cascadia Code", "Lucida Console", monospace;
      font-size: clamp(0.65rem, 1.1vw, 0.78rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
      margin-left: 4px;
    }

    /* Top Right: Telemetry */
    .telemetry-block {
      grid-area: telemetry;
      align-self: start;
      text-align: right;
      font-family: "SF Mono", Monaco, "Cascadia Code", "Lucida Console", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      line-height: 1.8;
      color: var(--text-dim);
      background: rgba(6, 11, 31, 0.3);
      padding: 0.6rem 0.9rem;
      border-radius: 4px;
      border: 1px solid rgba(236, 239, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: settleIn 2.4s var(--ease-out) 0.35s both;
    }

    .telemetry-block span.val {
      color: rgba(245, 247, 255, 0.95);
      font-weight: 500;
      min-width: 3.5ch;
      display: inline-block;
    }

    /* Bottom Left: Legend */
    .legend-block {
      grid-area: legend;
      align-self: end;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      font-family: "SF Mono", Monaco, "Cascadia Code", "Lucida Console", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      animation: settleIn 2.4s var(--ease-out) 0.55s both;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .legend-glyph {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .glyph-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff, 0 0 16px var(--periwinkle);
    }

    .glyph-thread {
      width: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--periwinkle), transparent);
    }

    .glyph-ripple {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--periwinkle);
      opacity: 0.85;
      position: relative;
    }
    .glyph-ripple::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Bottom Right: Control Panel */
    .control-panel {
      grid-area: controls;
      align-self: end;
      justify-self: end;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      padding: 1.3rem 1.4rem;
      width: 290px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 16px 36px rgba(0, 3, 14, 0.55);
      animation: settleIn 2.4s var(--ease-out) 0.75s both;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "SF Mono", Monaco, "Cascadia Code", "Lucida Console", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .control-header span.value-indicator {
      color: var(--text-main);
    }

    /* Custom Slider */
    .slider-container {
      position: relative;
      height: 20px;
      display: flex;
      align-items: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: transparent;
      outline: none;
      cursor: pointer;
      margin: 0;
    }

    /* Slider Track fill trick */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 1px;
      background: rgba(236, 239, 255, 0.15);
      border-radius: 1px;
    }
    input[type="range"]::-moz-range-track {
      height: 1px;
      background: rgba(236, 239, 255, 0.15);
      border-radius: 1px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(169, 180, 255, 0.75);
      margin-top: -5.5px;
      transition: transform 0.3s var(--cubic-spring);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(169, 180, 255, 0.75);
      transition: transform 0.3s var(--cubic-spring);
    }

    input[type="range"]:hover::-webkit-slider-thumb {
      transform: scale(1.35);
    }
    input[type="range"]:hover::-moz-range-thumb {
      transform: scale(1.35);
    }

    /* Segmented Switch */
    .segmented-control {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(236, 239, 255, 0.05);
      border: 1px solid rgba(236, 239, 255, 0.12);
      border-radius: 3px;
      padding: 2px;
      cursor: pointer;
      height: 32px;
    }

    .segmented-control button {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: "SF Mono", Monaco, "Cascadia Code", "Lucida Console", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .segmented-control button.active {
      color: #ffffff;
    }

    .segmented-pill {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc(50% - 2px);
      background: rgba(169, 180, 255, 0.18);
      border: 1px solid rgba(169, 180, 255, 0.4);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(169, 180, 255, 0.15);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
      pointer-events: none;
    }

    .segmented-control[data-state="repel"] .segmented-pill {
      transform: translateX(100%);
    }

    /* Responsive Adaptation */
    @media (max-width: 640px) {
      .ui-layer {
        padding: 1.25rem;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto;
        grid-template-areas:
          "header"
          "telemetry"
          "."
          "controls";
        gap: 1rem;
      }
      .telemetry-block {
        text-align: left;
        justify-self: start;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0.8rem;
      }
      .legend-block {
        display: none;
      }
      .control-panel {
        width: 100%;
        justify-self: stretch;
      }
      h1.title {
        font-size: clamp(2.4rem, 13vw, 4rem);
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .header-block,
      .telemetry-block,
      .legend-block,
      .control-panel {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
      .segmented-pill {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="viewport-backdrop"></div>
  <canvas id="canvas"></canvas>

  <main class="ui-layer">
    <header class="header-block">
      <h1 class="title">Constellation</h1>
      <span class="subtitle">Field study no. 006 · a slow gravity</span>
    </header>

    <aside class="telemetry-block">
      <div>PARTICLES <span class="val" id="stat-particles">000</span></div>
      <div>THREADS <span class="val" id="stat-threads">0000</span></div>
      <div>TEMPO <span class="val" id="stat-fps">60</span> FPS</div>
    </aside>

    <section class="legend-block" aria-label="Constellation Legend">
      <div class="legend-item">
        <div class="legend-glyph"><div class="glyph-dot"></div></div>
        <span>Aperture Core</span>
      </div>
      <div class="legend-item">
        <div class="legend-glyph"><div class="glyph-thread"></div></div>
        <span>Resonant Bridge</span>
      </div>
      <div class="legend-item">
        <div class="legend-glyph"><div class="glyph-ripple"></div></div>
        <span>Wave Impulse</span>
      </div>
    </section>

    <section class="control-panel ui-interactive">
      <div class="control-group">
        <div class="control-header">
          <label for="slider-dist">Bridge Span</label>
          <span class="value-indicator" id="dist-display">120 px</span>
        </div>
        <div class="slider-container">
          <input type="range" id="slider-dist" min="40" max="260" step="1" value="120">
        </div>
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Well Influence</span>
        </div>
        <div class="segmented-control" id="force-toggle" data-state="attract" role="radiogroup">
          <div class="segmented-pill"></div>
          <button type="button" class="active" data-val="attract" role="radio" aria-checked="true">Attract</button>
          <button type="button" data-val="repel" role="radio" aria-checked="false">Repel</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Canvas setup
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      // Telemetry elements
      const statParticles = document.getElementById('stat-particles');
      const statThreads = document.getElementById('stat-threads');
      const statFps = document.getElementById('stat-fps');
      const distSlider = document.getElementById('slider-dist');
      const distDisplay = document.getElementById('dist-display');
      const forceToggle = document.getElementById('force-toggle');

      let width = 0;
      let height = 0;
      let dpr = 1;

      // Configuration state
      let connectionDistance = parseInt(distSlider.value, 10);
      let forceMode = 'attract'; // 'attract' | 'repel'

      // Pointer tracking
      const mouse = {
        x: -9999,
        y: -9999,
        active: false,
        pulse: 0
      };

      // Sim caches
      let particles = [];
      let ripples = [];
      const MARGIN = 20;

      // Spatial Grid
      class SpatialHash {
        constructor(cellSize) {
          this.cellSize = cellSize;
          this.grid = new Map();
        }

        clear(cellSize) {
          this.cellSize = cellSize;
          this.grid.clear();
        }

        _key(cx, cy) {
          return `${cx},${cy}`;
        }

        insert(p, index) {
          const cx = Math.floor(p.x / this.cellSize);
          const cy = Math.floor(p.y / this.cellSize);
          const key = this._key(cx, cy);
          let cell = this.grid.get(key);
          if (!cell) {
            cell = [];
            this.grid.set(key, cell);
          }
          cell.push(index);
        }

        queryNeighbors(p, cx, cy) {
          const neighbors = [];
          for (let ox = -1; ox <= 1; ox++) {
            for (let oy = -1; oy <= 1; oy++) {
              const cell = this.grid.get(this._key(cx + ox, cy + oy));
              if (cell) {
                for (let i = 0; i < cell.length; i++) {
                  neighbors.push(cell[i]);
                }
              }
            }
          }
          return neighbors;
        }
      }

      const grid = new SpatialHash(connectionDistance);

      class Particle {
        constructor(x, y, vx, vy) {
          this.x = x ?? Math.random() * width;
          this.y = y ?? Math.random() * height;
          this.vx = vx ?? (Math.random() - 0.5) * 0.45;
          this.vy = vy ?? (Math.random() - 0.5) * 0.45;
          this.baseRadius = Math.random() * 1.0 + 1.1; // 1.1 - 2.1
          this.isTinted = Math.random() > 0.45; // White or soft periwinkle
          this.phase = Math.random() * Math.PI * 2;
          this.phaseSpeed = 0.02 + Math.random() * 0.025;
          this.noiseSeedX = Math.random() * 1000;
          this.noiseSeedY = Math.random() * 1000;
        }

        update(deltaScale) {
          this.phase += this.phaseSpeed * deltaScale;

          if (!prefersReducedMotion) {
            // Pseudo-curl noise current based on sinusoidal combinations
            this.noiseSeedX += 0.0035 * deltaScale;
            this.noiseSeedY += 0.0035 * deltaScale;
            const curlX = Math.sin(this.noiseSeedY * 1.8 + this.y * 0.002) * 0.16;
            const curlY = Math.cos(this.noiseSeedX * 1.8 + this.x * 0.002) * 0.16;

            this.vx += curlX * 0.08 * deltaScale;
            this.vy += curlY * 0.08 * deltaScale;

            // Fluid drag keeps motion perpetual but calm
            this.vx *= 0.985;
            this.vy *= 0.985;

            // Never fall fully still
            const speed = Math.hypot(this.vx, this.vy);
            const minSpeed = 0.18;
            if (speed < minSpeed && speed > 0.0001) {
              this.vx = (this.vx / speed) * minSpeed;
              this.vy = (this.vy / speed) * minSpeed;
            }

            this.x += this.vx * deltaScale;
            this.y += this.vy * deltaScale;

            // Wrap around edges with margin
            if (this.x < -MARGIN) this.x = width + MARGIN;
            else if (this.x > width + MARGIN) this.x = -MARGIN;

            if (this.y < -MARGIN) this.y = height + MARGIN;
            else if (this.y > height + MARGIN) this.y = -MARGIN;
          }
        }
      }

      class Ripple {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 0;
          this.maxRadius = Math.max(width, height) * 0.48;
          this.life = 1.0;
          this.speed = 3.6; // px per tick
          this.pushedIndices = new Set();
        }

        update(deltaScale) {
          this.radius += this.speed * deltaScale;
          this.life -= (deltaScale / 96); // ~1.6s at 60fps
          return this.life > 0;
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        // Compute particle count scaled to area: roughly 1 per 5200 sq px, bounded [90, 420]
        const targetCount = Math.max(90, Math.min(420, Math.floor((width * height) / 5200)));

        if (particles.length === 0) {
          for (let i = 0; i < targetCount; i++) {
            particles.push(new Particle());
          }
        } else {
          while (particles.length < targetCount) {
            particles.push(new Particle());
          }
          if (particles.length > targetCount) {
            particles.splice(targetCount);
          }
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      // Interactions
      function handlePointerMove(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      }

      function handlePointerLeave() {
        mouse.active = false;
      }

      function triggerRipple(x, y) {
        ripples.push(new Ripple(x, y));

        // Birth four fresh particles flung outward
        for (let i = 0; i < 4; i++) {
          const angle = (Math.PI * 2 * i) / 4 + (Math.random() - 0.5) * 0.5;
          const burstSpeed = 2.4 + Math.random() * 2.2;
          const vx = Math.cos(angle) * burstSpeed;
          const vy = Math.sin(angle) * burstSpeed;
          particles.push(new Particle(x + Math.cos(angle) * 6, y + Math.sin(angle) * 6, vx, vy));
        }
      }

      window.addEventListener('pointermove', handlePointerMove, { passive: true });
      window.addEventListener('pointerdown', (e) => {
        // Prevent trigger if clicking on interactive elements
        if (e.target.closest('.ui-interactive')) return;
        handlePointerMove(e);
        triggerRipple(e.clientX, e.clientY);
      });
      window.addEventListener('pointerleave', handlePointerLeave, { passive: true });

      // Controls interaction
      distSlider.addEventListener('input', (e) => {
        connectionDistance = parseInt(e.target.value, 10);
        distDisplay.textContent = `${connectionDistance} px`;
      });

      forceToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const val = btn.dataset.val;
        forceMode = val;
        forceToggle.setAttribute('data-state', val);
        forceToggle.querySelectorAll('button').forEach(b => {
          const isActive = b === btn;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-checked', isActive);
        });
      });

      // Frame loops and metrics
      let lastTime = performance.now();
      let frameCounter = 0;
      let fpsTimer = 0;

      function frame(now) {
        requestAnimationFrame(frame);

        const dt = Math.min((now - lastTime), 100);
        lastTime = now;
        const deltaScale = dt / 16.666;

        // Telemetry FPS update
        frameCounter++;
        fpsTimer += dt;
        if (fpsTimer >= 480) {
          const currentFps = Math.round((frameCounter * 1000) / fpsTimer);
          statFps.textContent = currentFps;
          statParticles.textContent = String(particles.length).padStart(3, '0');
          fpsTimer = 0;
          frameCounter = 0;
        }

        // Mouse pulse animation
        mouse.pulse = (mouse.pulse + 0.03 * deltaScale) % (Math.PI * 2);

        // Ripple lifecycle & wavefront physics push
        for (let rIdx = ripples.length - 1; rIdx >= 0; rIdx--) {
          const rip = ripples[rIdx];
          const alive = rip.update(deltaScale);

          // Force blast as wavefront passes particle
          const waveRadius = rip.radius;
          const waveThick = 24;

          for (let pIdx = 0; pIdx < particles.length; pIdx++) {
            const p = particles[pIdx];
            const dx = p.x - rip.x;
            const dy = p.y - rip.y;
            const d = Math.hypot(dx, dy);

            if (Math.abs(d - waveRadius) < waveThick) {
              const pairKey = `${rIdx}_${pIdx}`;
              if (!rip.pushedIndices.has(pairKey)) {
                rip.pushedIndices.add(pairKey);
                const pushMag = (1.8 * rip.life);
                const nx = d > 0.001 ? (dx / d) : 1;
                const ny = d > 0.001 ? (dy / d) : 0;
                p.vx += nx * pushMag;
                p.vy += ny * pushMag;
              }
            }
          }

          if (!alive) {
            ripples.splice(rIdx, 1);
          }
        }

        // Particle dynamics & Gravity well
        const reach = 220;
        const reachSq = reach * reach;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          if (mouse.active && !prefersReducedMotion) {
            const mdx = mouse.x - p.x;
            const mdy = mouse.y - p.y;
            const distSq = mdx * mdx + mdy * mdy;

            if (distSq < reachSq && distSq > 4) {
              const d = Math.sqrt(distSq);
              // Quadratic falloff: (1 - d/reach)^2
              const falloff = Math.pow(1 - (d / reach), 2);
              const accel = falloff * 0.42 * deltaScale;
              const dir = forceMode === 'attract' ? 1 : -1.8; // Repel is punchier

              p.vx += (mdx / d) * accel * dir;
              p.vy += (mdy / d) * accel * dir;
            }
          }

          p.update(deltaScale);
        }

        // Clear Canvas
        ctx.fillStyle = '#060b1f';
        ctx.fillRect(0, 0, width, height);

        // Spatial Hash populate
        const cellSize = Math.max(connectionDistance, 40);
        grid.clear(cellSize);
        for (let i = 0; i < particles.length; i++) {
          grid.insert(particles[i], i);
        }

        // Connect pairs with hairline threads
        ctx.lineWidth = 0.8;
        let threadCount = 0;
        const maxDistSq = connectionDistance * connectionDistance;
        const checkedPairs = new Set();

        for (let i = 0; i < particles.length; i++) {
          const p1 = particles[i];
          const cx = Math.floor(p1.x / cellSize);
          const cy = Math.floor(p1.y / cellSize);
          const neighbors = grid.queryNeighbors(p1, cx, cy);

          for (let n = 0; n < neighbors.length; n++) {
            const j = neighbors[n];
            if (i >= j) continue; // Single pair evaluation

            const p2 = particles[j];
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dSq = dx * dx + dy * dy;

            if (dSq < maxDistSq) {
              threadCount++;
              const d = Math.sqrt(dSq);
              // Squared falloff
              const norm = 1 - (d / connectionDistance);
              const alpha = (norm * norm) * 0.72;

              ctx.strokeStyle = `rgba(169, 180, 255, ${alpha.toFixed(3)})`;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
        statThreads.textContent = String(threadCount).padStart(4, '0');

        // Draw Expanding Ripples
        for (let r = 0; r < ripples.length; r++) {
          const rip = ripples[r];
          const alphaBase = rip.life;

          // Outer Periwinkle Ring
          ctx.beginPath();
          ctx.arc(rip.x, rip.y, Math.max(1, rip.radius), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(169, 180, 255, ${(alphaBase * 0.75).toFixed(3)})`;
          ctx.lineWidth = 1.4;
          ctx.stroke();

          // Inner White Ring at 40% of the alpha, slightly lagging
          if (rip.radius > 6) {
            ctx.beginPath();
            ctx.arc(rip.x, rip.y, Math.max(1, rip.radius - 5), 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${(alphaBase * 0.40).toFixed(3)})`;
            ctx.lineWidth = 1.0;
            ctx.stroke();
          }
        }

        // Draw Soft Pulsing Halo for Cursor
        if (mouse.active) {
          const pulseScale = Math.sin(mouse.pulse) * 0.12 + 0.95;
          const haloRadius = reach * 0.42 * pulseScale;
          const haloGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, haloRadius);
          
          if (forceMode === 'attract') {
            haloGrad.addColorStop(0, 'rgba(169, 180, 255, 0.085)');
            haloGrad.addColorStop(0.65, 'rgba(120, 140, 255, 0.025)');
            haloGrad.addColorStop(1, 'transparent');
          } else {
            haloGrad.addColorStop(0, 'rgba(255, 140, 170, 0.09)');
            haloGrad.addColorStop(0.65, 'rgba(220, 100, 140, 0.025)');
            haloGrad.addColorStop(1, 'transparent');
          }

          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(mouse.x, mouse.y, haloRadius, 0, Math.PI * 2);
          ctx.fill();

          // Subtle center ring
          ctx.beginPath();
          ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.fill();
        }

        // Draw Particles
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          // Twinkle factor: 0.7 to 1.3
          const twinkle = 0.75 + Math.sin(p.phase) * 0.25;
          const radius = p.baseRadius * twinkle;
          const haloRadius = radius * 6.0;

          // Radial Gradient Halo
          const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloRadius);
          const colorCore = p.isTinted ? 'rgba(169, 180, 255, ' : 'rgba(255, 255, 255, ';
          const colorHalo = p.isTinted ? 'rgba(120, 140, 255, ' : 'rgba(169, 180, 255, ';

          halo.addColorStop(0, colorCore + (0.95 * twinkle) + ')');
          halo.addColorStop(0.25, colorHalo + (0.35 * twinkle) + ')');
          halo.addColorStop(1, 'transparent');

          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(p.x, p.y, haloRadius, 0, Math.PI * 2);
          ctx.fill();

          // Punctate sharp core
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.6, radius * 0.65), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      requestAnimationFrame(frame);
    })();
  </script>
