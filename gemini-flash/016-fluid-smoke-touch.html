<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ether — Fluid Smoke Canvas</title>
  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04050a;
      color: #e8e6f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Simulation Canvas */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: crosshair;
      z-index: 1;
    }

    /* Radial Vignette Overlay */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: multiply;
      background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(4, 5, 10, 0.45) 70%, rgba(2, 3, 7, 0.94) 100%);
      z-index: 5;
    }

    /* Entrance Animation Keyframes */
    @keyframes entranceRise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Title & Tagline */
    .title-group {
      position: fixed;
      top: clamp(24px, 4.5vw, 44px);
      left: clamp(24px, 4.5vw, 48px);
      z-index: 10;
      pointer-events: none;
      animation: entranceRise 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .title {
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: 0.14em;
      background: linear-gradient(180deg, #ffffff 0%, #b7c4ff 52%, #6d7fd6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(138, 212, 255, 0.42)) drop-shadow(0 0 38px rgba(109, 127, 214, 0.28));
    }

    .tagline {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(232, 230, 242, 0.55);
      margin-top: 6px;
      margin-left: 2px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Centered Bottom Hint */
    .bottom-hint {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: rgba(210, 222, 255, 0.7);
      text-shadow: 0 0 12px rgba(138, 212, 255, 0.4);
      animation: breath 3.8s ease-in-out infinite alternate;
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bottom-hint.dismissed {
      opacity: 0 !important;
      transform: translate(-50%, 10px) !important;
      animation: none !important;
    }

    @keyframes breath {
      0% {
        opacity: 0.32;
        transform: translate(-50%, 0);
      }
      100% {
        opacity: 0.85;
        transform: translate(-50%, -3px);
      }
    }

    /* Frosted Glass HUD Card */
    .hud-card {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 270px;
      padding: 18px 20px;
      background: rgba(14, 16, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-radius: 18px;
      box-shadow: 0 24px 48px -8px rgba(0, 0, 0, 0.75), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: entranceRise 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Header Row */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2px;
    }

    .hud-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: rgba(232, 230, 242, 0.75);
    }

    .hud-fps {
      font-size: 12px;
      font-weight: 600;
      color: #8ad4ff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      text-shadow: 0 0 10px rgba(138, 212, 255, 0.45);
    }

    /* Sliders */
    .sliders-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(232, 230, 242, 0.65);
      letter-spacing: 0.04em;
    }

    .slider-val {
      font-size: 11px;
      font-weight: 500;
      color: #8ad4ff;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Custom Range Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      background: transparent;
      cursor: pointer;
      margin: 0;
      padding: 0;
    }

    input[type="range"]:focus {
      outline: none;
    }

    /* Track */
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #3a4970 0%, #8ad4ff 100%);
      border-radius: 1px;
      border: none;
    }

    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #3a4970 0%, #8ad4ff 100%);
      border-radius: 1px;
      border: none;
    }

    /* Thumb */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #8ad4ff, 0 0 20px rgba(138, 212, 255, 0.6);
      margin-top: -6px;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease;
      cursor: grab;
    }

    input[type="range"]:hover::-webkit-slider-thumb,
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.25);
      box-shadow: 0 0 14px #8ad4ff, 0 0 24px rgba(138, 212, 255, 0.85);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      box-shadow: 0 0 10px #8ad4ff, 0 0 20px rgba(138, 212, 255, 0.6);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease;
      cursor: grab;
    }

    input[type="range"]:hover::-moz-range-thumb,
    input[type="range"]:active::-moz-range-thumb {
      transform: scale(1.25);
      box-shadow: 0 0 14px #8ad4ff, 0 0 24px rgba(138, 212, 255, 0.85);
    }

    /* Actions Row */
    .actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
    }

    /* Custom Buttons with Pointer Tracking Highlight */
    .hud-btn {
      position: relative;
      flex: 1;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(232, 230, 242, 0.9);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.25s, background-color 0.25s, color 0.25s, box-shadow 0.25s;
    }

    .hud-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle 42px at var(--mx, 50%) var(--my, 50%), rgba(138, 212, 255, 0.32), transparent 75%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .hud-btn:hover::before {
      opacity: 1;
    }

    .hud-btn:hover {
      border-color: rgba(138, 212, 255, 0.35);
      color: #ffffff;
    }

    .hud-btn.active {
      border-color: rgba(138, 212, 255, 0.45);
      background: rgba(138, 212, 255, 0.12);
      color: #ffffff;
      box-shadow: inset 0 0 12px rgba(138, 212, 255, 0.15);
    }

    .btn-indicator {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .hud-btn.active .btn-indicator {
      background: #8ad4ff;
      box-shadow: 0 0 8px #8ad4ff;
    }

    /* Swatch Circle */
    .swatch-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .hue-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      background-color: hsl(190, 95%, 55%);
      box-shadow: 0 0 12px hsl(190, 95%, 55%);
      transition: background-color 0.08s linear, box-shadow 0.08s linear;
    }

    /* Responsive Phone View (< 480px) */
    @media (max-width: 480px) {
      .hud-card {
        left: 16px;
        right: 16px;
        bottom: 16px;
        width: auto;
        border-radius: 16px;
        padding: 16px 18px;
      }

      .bottom-hint {
        bottom: 220px;
        width: 90%;
        text-align: center;
      }

      .title-group {
        top: 20px;
        left: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Simulation Canvas -->
  <canvas id="canvas"></canvas>

  <!-- Multiply-blended radial vignette overlay -->
  <div class="vignette"></div>

  <!-- Title & Tagline -->
  <div class="title-group">
    <h1 class="title">Ether</h1>
    <div class="tagline">a fluid you can touch</div>
  </div>

  <!-- Bottom Hint -->
  <div id="bottom-hint" class="bottom-hint">
    drag anywhere to breathe color into the void
  </div>

  <!-- Frosted Glass HUD Card -->
  <div class="hud-card">
    <div class="hud-header">
      <span class="hud-title">Stable fluids · 96²</span>
      <span id="fps-display" class="hud-fps">60 FPS</span>
    </div>

    <div class="sliders-group">
      <!-- Brightness Slider -->
      <div class="slider-container">
        <div class="slider-meta">
          <label for="slider-brightness">Brightness</label>
          <span id="val-brightness" class="slider-val">1.40</span>
        </div>
        <input id="slider-brightness" type="range" min="0.4" max="3.0" step="0.05" value="1.40">
      </div>

      <!-- Dissipation Slider -->
      <div class="slider-container">
        <div class="slider-meta">
          <label for="slider-dissipation">Dissipation</label>
          <span id="val-dissipation" class="slider-val">0.988</span>
        </div>
        <input id="slider-dissipation" type="range" min="0.94" max="0.999" step="0.001" value="0.988">
      </div>
    </div>

    <!-- Actions Row -->
    <div class="actions-row">
      <button id="btn-clear" class="hud-btn" type="button">Clear</button>
      <button id="btn-auto" class="hud-btn active" type="button">
        <span class="btn-indicator"></span>Auto
      </button>
      <div class="swatch-wrap" title="Current dye hue">
        <div id="hue-swatch" class="hue-swatch"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* --- Simulation Dimensions --- */
      const N = 96;
      const stride = N + 2;
      const totalCells = stride * stride;

      /* --- Fluid Solver Arrays (Jos Stam) --- */
      const u = new Float32Array(totalCells);
      const v = new Float32Array(totalCells);
      const u0 = new Float32Array(totalCells);
      const v0 = new Float32Array(totalCells);

      // Separate dye channels (Red, Green, Blue)
      const r = new Float32Array(totalCells);
      const g = new Float32Array(totalCells);
      const b = new Float32Array(totalCells);
      const r0 = new Float32Array(totalCells);
      const g0 = new Float32Array(totalCells);
      const b0 = new Float32Array(totalCells);

      /* --- Simulation Parameters --- */
      const dt = 0.1;
      const visc = 0.00002;
      const diff = 0.00001;
      let dissipation = 0.988;
      let brightness = 1.40;

      /* --- State Variables --- */
      let autoEnabled = true;
      let currentHue = 195;
      let hintDismissed = false;

      // Check prefers-reduced-motion
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reducedMotionQuery.matches) {
        autoEnabled = false;
      }

      /* --- DOM Elements --- */
      const canvas = document.getElementById('canvas');
      const screenCtx = canvas.getContext('2d');
      const bottomHint = document.getElementById('bottom-hint');
      const fpsDisplay = document.getElementById('fps-display');
      const sliderBrightness = document.getElementById('slider-brightness');
      const valBrightness = document.getElementById('val-brightness');
      const sliderDissipation = document.getElementById('slider-dissipation');
      const valDissipation = document.getElementById('val-dissipation');
      const btnClear = document.getElementById('btn-clear');
      const btnAuto = document.getElementById('btn-auto');
      const hueSwatch = document.getElementById('hue-swatch');

      // Update button auto initial UI state
      if (!autoEnabled) {
        btnAuto.classList.remove('active');
      }

      /* --- Offscreen 96x96 Canvas Buffer --- */
      const offCanvas = document.createElement('canvas');
      offCanvas.width = N;
      offCanvas.height = N;
      const offCtx = offCanvas.getContext('2d', { willReadFrequently: false });
      const imgData = offCtx.createImageData(N, N);
      const imgBytes = imgData.data;

      /* --- Screen Dimensions & Viewport Fit --- */
      let cssW = window.innerWidth;
      let cssH = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Cover-fit geometry in CSS units
      let drawScale = 1;
      let drawW = 96;
      let drawH = 96;
      let drawX = 0;
      let drawY = 0;

      function resize() {
        cssW = window.innerWidth;
        cssH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);

        // Calculate cover-fit in CSS pixels
        drawScale = Math.max(cssW / N, cssH / N);
        drawW = N * drawScale;
        drawH = N * drawScale;
        drawX = (cssW - drawW) * 0.5;
        drawY = (cssH - drawH) * 0.5;

        // Ensure high-quality scaling
        screenCtx.imageSmoothingEnabled = true;
        screenCtx.imageSmoothingQuality = 'high';
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      /* --- Jos Stam 2D Stable Fluids Core Functions --- */
      function IX(i, j) {
        return i + j * stride;
      }

      function set_bnd(b, x) {
        for (let i = 1; i <= N; i++) {
          x[IX(0, i)]     = (b === 1) ? -x[IX(1, i)] : x[IX(1, i)];
          x[IX(N + 1, i)] = (b === 1) ? -x[IX(N, i)] : x[IX(N, i)];
          x[IX(i, 0)]     = (b === 2) ? -x[IX(i, 1)] : x[IX(i, 1)];
          x[IX(i, N + 1)] = (b === 2) ? -x[IX(i, N)] : x[IX(i, N)];
        }
        x[IX(0, 0)]         = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
        x[IX(0, N + 1)]     = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
        x[IX(N + 1, 0)]     = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
        x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
      }

      function lin_solve(b, x, x0, a, c, iter) {
        const invC = 1.0 / c;
        for (let k = 0; k < iter; k++) {
          for (let j = 1; j <= N; j++) {
            const row = j * stride;
            const rowUp = row - stride;
            const rowDown = row + stride;
            for (let i = 1; i <= N; i++) {
              x[row + i] = (x0[row + i] + a * (x[row + i - 1] + x[row + i + 1] + x[rowUp + i] + x[rowDown + i])) * invC;
            }
          }
          set_bnd(b, x);
        }
      }

      function project(u_field, v_field, p, div, iter) {
        const h = 1.0 / N;
        for (let j = 1; j <= N; j++) {
          const row = j * stride;
          for (let i = 1; i <= N; i++) {
            div[row + i] = -0.5 * h * (
              u_field[row + i + 1] - u_field[row + i - 1] +
              v_field[row + stride + i] - v_field[row - stride + i]
            );
            p[row + i] = 0;
          }
        }
        set_bnd(0, div);
        set_bnd(0, p);

        lin_solve(0, p, div, 1, 4, iter);

        for (let j = 1; j <= N; j++) {
          const row = j * stride;
          for (let i = 1; i <= N; i++) {
            u_field[row + i] -= 0.5 * (p[row + i + 1] - p[row + i - 1]) * N;
            v_field[row + i] -= 0.5 * (p[row + stride + i] - p[row - stride + i]) * N;
          }
        }
        set_bnd(1, u_field);
        set_bnd(2, v_field);
      }

      function advect(b, d, d0, u_field, v_field, dtStep) {
        const dt0 = dtStep * N;
        for (let j = 1; j <= N; j++) {
          const row = j * stride;
          for (let i = 1; i <= N; i++) {
            let xPos = i - dt0 * u_field[row + i];
            let yPos = j - dt0 * v_field[row + i];

            if (xPos < 0.5) xPos = 0.5;
            if (xPos > N + 0.5) xPos = N + 0.5;
            const i0 = Math.floor(xPos);
            const i1 = i0 + 1;

            if (yPos < 0.5) yPos = 0.5;
            if (yPos > N + 0.5) yPos = N + 0.5;
            const j0 = Math.floor(yPos);
            const j1 = j0 + 1;

            const s1 = xPos - i0;
            const s0 = 1.0 - s1;
            const t1 = yPos - j0;
            const t0 = 1.0 - t1;

            const row0 = j0 * stride;
            const row1 = j1 * stride;

            d[row + i] = s0 * (t0 * d0[row0 + i0] + t1 * d0[row1 + i0]) +
                         s1 * (t0 * d0[row0 + i1] + t1 * d0[row1 + i1]);
          }
        }
        set_bnd(b, d);
      }

      /* --- Fluid Simulation Step --- */
      function fluidStep() {
        // 1. Diffuse velocity (few Gauss-Seidel iterations, e.g. 4)
        const aVel = dt * visc * N * N;
        lin_solve(1, u0, u, aVel, 1 + 4 * aVel, 4);
        lin_solve(2, v0, v, aVel, 1 + 4 * aVel, 4);

        // 2. Project to enforce incompressibility (16 pressure iterations)
        project(u0, v0, u, v, 16);

        // 3. Semi-Lagrangian advect velocity by itself
        advect(1, u, u0, u0, v0, dt);
        advect(2, v, v0, u0, v0, dt);

        // 4. Project again (16 pressure iterations)
        project(u, v, u0, v0, 16);

        // 5. Gentle 0.995 global velocity damping
        for (let i = 0; i < totalCells; i++) {
          u[i] *= 0.995;
          v[i] *= 0.995;
        }

        // 6. Diffuse & advect dye channels
        const aDye = dt * diff * N * N;

        // Red channel
        lin_solve(0, r0, r, aDye, 1 + 4 * aDye, 4);
        advect(0, r, r0, u, v, dt);

        // Green channel
        lin_solve(0, g0, g, aDye, 1 + 4 * aDye, 4);
        advect(0, g, g0, u, v, dt);

        // Blue channel
        lin_solve(0, b0, b, aDye, 1 + 4 * aDye, 4);
        advect(0, b, b0, u, v, dt);

        // 7. Multiply dye by dissipation factor
        for (let i = 0; i < totalCells; i++) {
          r[i] *= dissipation;
          g[i] *= dissipation;
          b[i] *= dissipation;
        }
      }

      /* --- Color Helpers: HSL to RGB --- */
      function hslToRgb(h, s, l) {
        h = (h % 360 + 360) % 360;
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = l - c / 2;
        let rVal = 0, gVal = 0, bVal = 0;

        if (h < 60) {
          rVal = c; gVal = x; bVal = 0;
        } else if (h < 120) {
          rVal = x; gVal = c; bVal = 0;
        } else if (h < 180) {
          rVal = 0; gVal = c; bVal = x;
        } else if (h < 240) {
          rVal = 0; gVal = x; bVal = c;
        } else if (h < 300) {
          rVal = x; gVal = 0; bVal = c;
        } else {
          rVal = c; gVal = 0; bVal = x;
        }

        return [rVal + m, gVal + m, bVal + m];
      }

      /* --- Gaussian Splat Injection --- */
      function addSplat(cx, cy, radius, rVal, gVal, bVal, velX, velY) {
        const minI = Math.max(1, Math.floor(cx - radius));
        const maxI = Math.min(N, Math.ceil(cx + radius));
        const minJ = Math.max(1, Math.floor(cy - radius));
        const maxJ = Math.min(N, Math.ceil(cy + radius));
        const r2 = radius * radius;
        const twoSigma2 = 2 * (radius * 0.45) * (radius * 0.45);

        for (let j = minJ; j <= maxJ; j++) {
          const row = j * stride;
          const dy = j - cy;
          for (let i = minI; i <= maxI; i++) {
            const dx = i - cx;
            const d2 = dx * dx + dy * dy;
            if (d2 <= r2) {
              const weight = Math.exp(-d2 / twoSigma2);
              const idx = row + i;
              r[idx] += rVal * weight;
              g[idx] += gVal * weight;
              b[idx] += bVal * weight;
              u[idx] += velX * weight;
              v[idx] += velY * weight;
            }
          }
        }
      }

      /* --- Opening Scene Seed: 24 Cyan-Blue Splats Ring --- */
      function seedInitialBloom() {
        const count = 24;
        const ringRadius = N * 0.23;
        const centerX = (N + 1) * 0.5;
        const centerY = (N + 1) * 0.5;

        for (let k = 0; k < count; k++) {
          const angle = (k / count) * Math.PI * 2;
          const px = centerX + Math.cos(angle) * ringRadius;
          const py = centerY + Math.sin(angle) * ringRadius;

          // Outward pointing velocity
          const outwardSpeed = 14.0;
          const vx = Math.cos(angle) * outwardSpeed;
          const vy = Math.sin(angle) * outwardSpeed;

          // Cyan-blue hues: 180 to 225 deg
          const hue = 185 + Math.sin(k * 0.75) * 22;
          const [cr, cg, cb] = hslToRgb(hue, 0.95, 0.55);

          addSplat(px, py, 3.8, cr * 0.9, cg * 0.9, cb * 0.9, vx, vy);
        }
      }

      /* --- Ambient Orbiting Emitters --- */
      let emitterTime = 0;
      function updateAmbientEmitters(dtSec) {
        if (!autoEnabled || reducedMotionQuery.matches) return;

        emitterTime += dtSec;
        const centerX = (N + 1) * 0.5;
        const centerY = (N + 1) * 0.5;

        // Emitter 1: clockwise orbit
        const ang1 = emitterTime * 0.48;
        const rad1 = N * 0.27;
        const x1 = centerX + Math.cos(ang1) * rad1;
        const y1 = centerY + Math.sin(ang1) * rad1;
        const vx1 = -Math.sin(ang1) * 5.2;
        const vy1 = Math.cos(ang1) * 5.2;
        const [r1, g1, b1] = hslToRgb(currentHue + 95, 0.95, 0.55);
        addSplat(x1, y1, 2.6, r1 * 0.14, g1 * 0.14, b1 * 0.14, vx1, vy1);

        // Emitter 2: counter-clockwise orbit with subtle radial pulsation
        const ang2 = -emitterTime * 0.38 + 2.2;
        const rad2 = N * (0.33 + 0.04 * Math.sin(emitterTime * 0.35));
        const x2 = centerX + Math.cos(ang2) * rad2;
        const y2 = centerY + Math.sin(ang2) * rad2;
        const vx2 = Math.sin(ang2) * 4.6;
        const vy2 = -Math.cos(ang2) * 4.6;
        const [r2, g2, b2] = hslToRgb(currentHue + 215, 0.95, 0.55);
        addSplat(x2, y2, 2.8, r2 * 0.12, g2 * 0.12, b2 * 0.12, vx2, vy2);
      }

      /* --- Pointer & Touch Interaction Handling --- */
      let isPointerDown = false;
      let hasPointer = false;
      let lastClientX = 0;
      let lastClientY = 0;

      function screenToSim(screenX, screenY) {
        const normX = (screenX - drawX) / drawW;
        const normY = (screenY - drawY) / drawH;
        return {
          x: 1 + normX * (N - 1),
          y: 1 + normY * (N - 1)
        };
      }

      function handlePointerDown(e) {
        if (e.target && e.target.closest && e.target.closest('.hud-card')) return;

        isPointerDown = true;
        hasPointer = true;
        lastClientX = e.clientX;
        lastClientY = e.clientY;

        // Permanently dismiss hint
        if (!hintDismissed) {
          hintDismissed = true;
          bottomHint.classList.add('dismissed');
        }

        const sim = screenToSim(e.clientX, e.clientY);
        const [cr, cg, cb] = hslToRgb(currentHue, 0.95, 0.55);
        addSplat(sim.x, sim.y, 4.0, cr * 1.1, cg * 1.1, cb * 1.1, 0, 0);
      }

      function handlePointerMove(e) {
        if (e.target && e.target.closest && e.target.closest('.hud-card')) {
          if (!isPointerDown) return;
        }

        const clientX = e.clientX;
        const clientY = e.clientY;

        if (!hasPointer) {
          lastClientX = clientX;
          lastClientY = clientY;
          hasPointer = true;
          return;
        }

        const deltaX = clientX - lastClientX;
        const deltaY = clientY - lastClientY;
        lastClientX = clientX;
        lastClientY = clientY;

        const screenDist = Math.hypot(deltaX, deltaY);
        if (screenDist < 0.2) return;

        const sim = screenToSim(clientX, clientY);
        const [cr, cg, cb] = hslToRgb(currentHue, 0.95, 0.55);

        // Simulation delta in grid units
        const simDx = (deltaX / drawW) * N;
        const simDy = (deltaY / drawH) * N;
        const gridSpeed = Math.hypot(simDx, simDy);

        if (isPointerDown) {
          // Drag velocity comes from pointer deltas scaled by 8
          const velX = simDx * 8.0;
          const velY = simDy * 8.0;

          // Faster drags produce larger splats
          const splatRadius = Math.min(8.5, 2.8 + gridSpeed * 0.65);
          const dyeAmount = Math.min(2.0, 0.85 + gridSpeed * 0.15);

          addSplat(sim.x, sim.y, splatRadius, cr * dyeAmount, cg * dyeAmount, cb * dyeAmount, velX, velY);
        } else {
          // Hovering without pressing leaves a very faint trail so canvas feels alive
          const hoverRadius = 2.2;
          const hoverDye = 0.08;
          const hoverVelX = simDx * 1.8;
          const hoverVelY = simDy * 1.8;

          addSplat(sim.x, sim.y, hoverRadius, cr * hoverDye, cg * hoverDye, cb * hoverDye, hoverVelX, hoverVelY);
        }
      }

      function handlePointerUp() {
        isPointerDown = false;
      }

      function handlePointerLeave() {
        isPointerDown = false;
        hasPointer = false;
      }

      window.addEventListener('pointerdown', handlePointerDown, { passive: true });
      window.addEventListener('pointermove', handlePointerMove, { passive: true });
      window.addEventListener('pointerup', handlePointerUp, { passive: true });
      window.addEventListener('pointercancel', handlePointerUp, { passive: true });
      window.addEventListener('pointerleave', handlePointerLeave, { passive: true });

      /* --- Button Radial Highlight Tracking (--mx / --my) --- */
      const hudButtons = document.querySelectorAll('.hud-btn');
      hudButtons.forEach(btn => {
        btn.addEventListener('pointermove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          btn.style.setProperty('--mx', `${x}px`);
          btn.style.setProperty('--my', `${y}px`);
        });
      });

      /* --- Sliders & Actions Listeners --- */
      sliderBrightness.addEventListener('input', (e) => {
        brightness = parseFloat(e.target.value);
        valBrightness.textContent = brightness.toFixed(2);
      });

      sliderDissipation.addEventListener('input', (e) => {
        dissipation = parseFloat(e.target.value);
        valDissipation.textContent = dissipation.toFixed(3);
      });

      btnClear.addEventListener('click', () => {
        u.fill(0);
        v.fill(0);
        u0.fill(0);
        v0.fill(0);
        r.fill(0);
        g.fill(0);
        b.fill(0);
        r0.fill(0);
        g0.fill(0);
        b0.fill(0);
      });

      btnAuto.addEventListener('click', () => {
        autoEnabled = !autoEnabled;
        btnAuto.classList.toggle('active', autoEnabled);
      });

      /* --- Render Loop --- */
      let lastTime = performance.now();
      let frameCount = 0;
      let lastFpsTime = lastTime;

      // Seed opening bloom
      seedInitialBloom();

      function frame(now) {
        requestAnimationFrame(frame);

        const dtSec = Math.min(0.06, (now - lastTime) * 0.001);
        lastTime = now;

        // FPS Readout
        frameCount++;
        if (now - lastFpsTime >= 250) {
          const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
          fpsDisplay.textContent = `${fps} FPS`;
          frameCount = 0;
          lastFpsTime = now;
        }

        // Hue cycle continuously (approx 26 deg/sec)
        currentHue = (currentHue + dtSec * 26) % 360;

        // Update swatch color
        const roundedHue = Math.round(currentHue);
        hueSwatch.style.backgroundColor = `hsl(${roundedHue}, 95%, 55%)`;
        hueSwatch.style.boxShadow = `0 0 12px hsl(${roundedHue}, 95%, 55%)`;

        // Update ambient emitters
        updateAmbientEmitters(dtSec);

        // Fluid simulation solver step
        fluidStep();

        // Write dye grid into 96x96 ImageData with nocturnal base #04050a
        let ptr = 0;
        const bMult = brightness * 255;

        for (let j = 1; j <= N; j++) {
          const row = j * stride;
          for (let i = 1; i <= N; i++) {
            const idx = row + i;

            // #04050a corresponds to RGB(4, 5, 10)
            const rVal = 4 + r[idx] * bMult;
            const gVal = 5 + g[idx] * bMult;
            const bVal = 10 + b[idx] * bMult;

            imgBytes[ptr++] = rVal > 255 ? 255 : (rVal < 0 ? 0 : rVal);
            imgBytes[ptr++] = gVal > 255 ? 255 : (gVal < 0 ? 0 : gVal);
            imgBytes[ptr++] = bVal > 255 ? 255 : (bVal < 0 ? 0 : bVal);
            imgBytes[ptr++] = 255;
          }
        }

        offCtx.putImageData(imgData, 0, 0);

        // Render scaled buffer to cover-fit screen canvas
        screenCtx.save();
        screenCtx.imageSmoothingEnabled = true;
        screenCtx.imageSmoothingQuality = 'high';
        screenCtx.scale(dpr, dpr);
        screenCtx.drawImage(offCanvas, drawX, drawY, drawW, drawH);
        screenCtx.restore();
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
