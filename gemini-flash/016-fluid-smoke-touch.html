<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ether — Fluid Smoke Canvas</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #04050a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #e8e6f2;
}

#canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background: radial-gradient(circle at 50% 50%, rgba(4, 5, 10, 0) 40%, rgba(4, 5, 10, 0.78) 100%);
  mix-blend-mode: multiply;
}

header {
  position: absolute;
  top: clamp(24px, 4vw, 44px);
  left: clamp(24px, 4vw, 44px);
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transform: translateY(14px);
  animation: entrance 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
}

h1 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: clamp(34px, 5vw, 64px);
  font-weight: 400;
  letter-spacing: 0.14em;
  line-height: 1.1;
  background: linear-gradient(180deg, #ffffff 0%, #b7c4ff 55%, #6d7fd6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(109, 127, 214, 0.45));
}

.tagline {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.32em;
  color: rgba(232, 230, 242, 0.55);
  margin-top: 6px;
  padding-left: 2px;
}

.hint {
  position: absolute;
  bottom: 34px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  pointer-events: none;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: rgba(232, 230, 242, 0.6);
  white-space: nowrap;
  animation: breathe 3.6s ease-in-out infinite alternate;
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.hint.hidden {
  opacity: 0 !important;
  transform: translate(-50%, 8px) !important;
}

.hud-card {
  position: absolute;
  bottom: clamp(20px, 3vw, 36px);
  right: clamp(20px, 3vw, 36px);
  z-index: 10;
  width: 290px;
  background: rgba(14, 16, 28, 0.55);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid rgba(255, 255, 255, 0.10);
  box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.65), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
  border-radius: 18px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  transform: translateY(14px);
  animation: entrance 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
}

.hud-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(232, 230, 242, 0.7);
  font-weight: 500;
}

.fps {
  font-variant-numeric: tabular-nums;
  color: #8ad4ff;
  font-weight: 600;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: rgba(232, 230, 242, 0.6);
  text-transform: uppercase;
}

.control-val {
  font-variant-numeric: tabular-nums;
  color: rgba(232, 230, 242, 0.95);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, #6d7fd6, #8ad4ff);
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 10px rgba(138, 212, 255, 0.8), 0 1px 3px rgba(0, 0, 0, 0.5);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}

input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 10px rgba(138, 212, 255, 0.8), 0 1px 3px rgba(0, 0, 0, 0.5);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}

input[type="range"]:hover::-webkit-slider-thumb {
  transform: scale(1.25);
}
input[type="range"]:hover::-moz-range-thumb {
  transform: scale(1.25);
}

.hud-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 2px;
}

.btn {
  position: relative;
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 8px 12px;
  color: rgba(232, 230, 242, 0.85);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  outline: none;
  transition: border-color 0.25s, color 0.25s, background 0.25s;
}

.btn::before {
  content: "";
  position: absolute;
  top: var(--my, 50%);
  left: var(--mx, 50%);
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

.btn:hover::before {
  opacity: 1;
}

.btn:hover {
  border-color: rgba(255, 255, 255, 0.25);
  color: #fff;
}

.btn.active {
  background: rgba(109, 127, 214, 0.25);
  border-color: rgba(138, 212, 255, 0.4);
  color: #fff;
}

.swatch {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 0 10px var(--swatch-color, #8ad4ff);
  background-color: var(--swatch-color, #8ad4ff);
  flex-shrink: 0;
  transition: background-color 0.1s linear, box-shadow 0.1s linear;
}

@keyframes entrance {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0% { opacity: 0.28; }
  100% { opacity: 0.72; }
}

@media (max-width: 480px) {
  .hud-card {
    left: 16px;
    right: 16px;
    bottom: 16px;
    width: auto;
  }
  .hint {
    bottom: 232px;
    font-size: 11px;
    width: 90%;
    text-align: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  header, .hud-card {
    animation: none;
    opacity: 1;
    transform: none;
  }
  .hint {
    animation: none;
    opacity: 0.5;
  }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="vignette"></div>

<header>
  <h1>Ether</h1>
  <div class="tagline">a fluid you can touch</div>
</header>

<div class="hint" id="hint">drag anywhere to breathe color into the void</div>

<aside class="hud-card" aria-label="Fluid Controls">
  <div class="hud-header">
    <span>Stable fluids · 96²</span>
    <span class="fps" id="fps-display">60 fps</span>
  </div>

  <div class="control-group">
    <div class="control-label">
      <span>Brightness</span>
      <span class="control-val" id="val-brightness">1.40</span>
    </div>
    <input type="range" id="slider-brightness" min="0.4" max="3.0" step="0.05" value="1.40">
  </div>

  <div class="control-group">
    <div class="control-label">
      <span>Dissipation</span>
      <span class="control-val" id="val-dissipation">0.988</span>
    </div>
    <input type="range" id="slider-dissipation" min="0.940" max="0.999" step="0.001" value="0.988">
  </div>

  <div class="hud-actions">
    <button class="btn" id="btn-clear">Clear</button>
    <button class="btn active" id="btn-auto">Auto</button>
    <div class="swatch" id="hue-swatch"></div>
  </div>
</aside>

<script>
(function() {
  const N = 96;
  const SIZE = (N + 2) * (N + 2);

  const u = new Float32Array(SIZE);
  const v = new Float32Array(SIZE);
  const u_prev = new Float32Array(SIZE);
  const v_prev = new Float32Array(SIZE);

  const r = new Float32Array(SIZE);
  const g = new Float32Array(SIZE);
  const b = new Float32Array(SIZE);
  const r_prev = new Float32Array(SIZE);
  const g_prev = new Float32Array(SIZE);
  const b_prev = new Float32Array(SIZE);

  function IX(i, j) {
    return i + (N + 2) * j;
  }

  function set_bnd(b_flag, x) {
    for (let i = 1; i <= N; i++) {
      x[IX(0, i)] = b_flag === 1 ? -x[IX(1, i)] : x[IX(1, i)];
      x[IX(N + 1, i)] = b_flag === 1 ? -x[IX(N, i)] : x[IX(N, i)];
      x[IX(i, 0)] = b_flag === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
      x[IX(i, N + 1)] = b_flag === 2 ? -x[IX(i, N)] : x[IX(i, N)];
    }
    x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
    x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
    x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
    x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
  }

  function lin_solve(b_flag, x, x0, a, c, iters) {
    const invC = 1.0 / c;
    for (let k = 0; k < iters; k++) {
      for (let j = 1; j <= N; j++) {
        let row = j * (N + 2);
        for (let i = 1; i <= N; i++) {
          x[row + i] = (x0[row + i] + a * (x[row + i - 1] + x[row + i + 1] + x[row - (N + 2) + i] + x[row + (N + 2) + i])) * invC;
        }
      }
      set_bnd(b_flag, x);
    }
  }

  function diffuse(b_flag, x, x0, diff, dt, iters) {
    const a = dt * diff * N * N;
    lin_solve(b_flag, x, x0, a, 1 + 4 * a, iters);
  }

  function advect(b_flag, d, d0, u_vel, v_vel, dt) {
    const dt0 = dt * N;
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        let x = i - dt0 * u_vel[IX(i, j)];
        let y = j - dt0 * v_vel[IX(i, j)];
        if (x < 0.5) x = 0.5;
        if (x > N + 0.5) x = N + 0.5;
        let i0 = Math.floor(x);
        let i1 = i0 + 1;
        if (y < 0.5) y = 0.5;
        if (y > N + 0.5) y = N + 0.5;
        let j0 = Math.floor(y);
        let j1 = j0 + 1;
        let s1 = x - i0;
        let s0 = 1 - s1;
        let t1 = y - j0;
        let t0 = 1 - t1;
        d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                      s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
      }
    }
    set_bnd(b_flag, d);
  }

  function project(u_vel, v_vel, p, div) {
    const invN = 1.0 / N;
    for (let j = 1; j <= N; j++) {
      let row = j * (N + 2);
      for (let i = 1; i <= N; i++) {
        div[row + i] = -0.5 * invN * (u_vel[row + i + 1] - u_vel[row + i - 1] + v_vel[row + (N + 2) + i] - v_vel[row - (N + 2) + i]);
        p[row + i] = 0;
      }
    }
    set_bnd(0, div);
    set_bnd(0, p);

    lin_solve(0, p, div, 1, 4, 16);

    for (let j = 1; j <= N; j++) {
      let row = j * (N + 2);
      for (let i = 1; i <= N; i++) {
        u_vel[row + i] -= 0.5 * N * (p[row + i + 1] - p[row + i - 1]);
        v_vel[row + i] -= 0.5 * N * (p[row + (N + 2) + i] - p[row - (N + 2) + i]);
      }
    }
    set_bnd(1, u_vel);
    set_bnd(2, v_vel);
  }

  let brightness = 1.40;
  let dissipation = 0.988;
  const visc = 0.00002;
  const diff = 0.00001;
  const dt = 0.1;

  function step() {
    diffuse(1, u_prev, u, visc, dt, 4);
    diffuse(2, v_prev, v, visc, dt, 4);
    project(u_prev, v_prev, u, v);
    advect(1, u, u_prev, u_prev, v_prev, dt);
    advect(2, v, v_prev, u_prev, v_prev, dt);
    project(u, v, u_prev, v_prev);

    for (let i = 0; i < SIZE; i++) {
      u[i] *= 0.995;
      v[i] *= 0.995;
    }

    diffuse(0, r_prev, r, diff, dt, 4);
    advect(0, r, r_prev, u, v, dt);

    diffuse(0, g_prev, g, diff, dt, 4);
    advect(0, g, g_prev, u, v, dt);

    diffuse(0, b_prev, b, diff, dt, 4);
    advect(0, b, b_prev, u, v, dt);

    for (let i = 0; i < SIZE; i++) {
      r[i] *= dissipation;
      g[i] *= dissipation;
      b[i] *= dissipation;
    }
  }

  function hslToRgb(h, s, l) {
    h = (h % 360 + 360) % 360;
    let c = (1 - Math.abs(2 * l - 1)) * s;
    let x = c * (1 - Math.abs((h / 60) % 2 - 1));
    let m = l - c / 2;
    let r1 = 0, g1 = 0, b1 = 0;
    if (h < 60) { r1 = c; g1 = x; }
    else if (h < 120) { r1 = x; g1 = c; }
    else if (h < 180) { g1 = c; b1 = x; }
    else if (h < 240) { g1 = x; b1 = c; }
    else if (h < 300) { r1 = x; b1 = c; }
    else { r1 = c; b1 = x; }
    return [(r1 + m), (g1 + m), (b1 + m)];
  }

  function addSplat(cx, cy, radius, rgb, velX, velY, density) {
    const r2 = radius * radius;
    const minI = Math.max(1, Math.floor(cx - radius * 2.5));
    const maxI = Math.min(N, Math.ceil(cx + radius * 2.5));
    const minJ = Math.max(1, Math.floor(cy - radius * 2.5));
    const maxJ = Math.min(N, Math.ceil(cy + radius * 2.5));

    for (let j = minJ; j <= maxJ; j++) {
      let row = j * (N + 2);
      for (let i = minI; i <= maxI; i++) {
        let dx = i - cx;
        let dy = j - cy;
        let dist2 = dx * dx + dy * dy;
        let falloff = Math.exp(-dist2 / (2 * r2));
        if (falloff > 0.001) {
          let idx = row + i;
          let amt = falloff * density;
          r[idx] += rgb[0] * amt;
          g[idx] += rgb[1] * amt;
          b[idx] += rgb[2] * amt;
          u[idx] += velX * falloff;
          v[idx] += velY * falloff;
        }
      }
    }
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  const offscreen = document.createElement('canvas');
  offscreen.width = N;
  offscreen.height = N;
  const offCtx = offscreen.getContext('2d', { alpha: false });
  const imgData = offCtx.createImageData(N, N);
  const data = imgData.data;

  for (let i = 3; i < N * N * 4; i += 4) {
    data[i] = 255;
  }

  let width = 0, height = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
  window.addEventListener('resize', resize);
  resize();

  function screenToGrid(x, y) {
    let size = Math.max(width, height);
    let offX = (width - size) / 2;
    let offY = (height - size) / 2;
    let normX = (x - offX) / size;
    let normY = (y - offY) / size;
    return {
      x: 1 + normX * (N - 1),
      y: 1 + normY * (N - 1)
    };
  }

  let currentHue = 200;
  let isPointerDown = false;
  let lastPos = null;
  const hintEl = document.getElementById('hint');
  const swatchEl = document.getElementById('hue-swatch');

  function updateSwatch() {
    let [cr, cg, cb] = hslToRgb(currentHue, 0.95, 0.55);
    let colorStr = `rgb(${Math.round(cr * 255)}, ${Math.round(cg * 255)}, ${Math.round(cb * 255)})`;
    swatchEl.style.setProperty('--swatch-color', colorStr);
  }
  updateSwatch();

  function onPointerInteract(x, y, isDrag) {
    let gridPos = screenToGrid(x, y);
    if (!lastPos) lastPos = { ...gridPos };

    let dx = gridPos.x - lastPos.x;
    let dy = gridPos.y - lastPos.y;
    let speed = Math.sqrt(dx * dx + dy * dy);

    let rgb = hslToRgb(currentHue, 0.95, 0.55);

    if (isDrag) {
      let splatRadius = Math.min(6.5, Math.max(2.0, 2.0 + speed * 1.8));
      let vx = dx * 8.0;
      let vy = dy * 8.0;
      addSplat(gridPos.x, gridPos.y, splatRadius, rgb, vx, vy, 1.3);
    } else {
      addSplat(gridPos.x, gridPos.y, 1.4, rgb, dx * 1.5, dy * 1.5, 0.12);
    }

    lastPos = gridPos;
  }

  function handleStart(e) {
    isPointerDown = true;
    hintEl.classList.add('hidden');
    let x = e.clientX || (e.touches && e.touches[0].clientX);
    let y = e.clientY || (e.touches && e.touches[0].clientY);
    lastPos = screenToGrid(x, y);
    let rgb = hslToRgb(currentHue, 0.95, 0.55);
    addSplat(lastPos.x, lastPos.y, 3.2, rgb, 0, 0, 1.4);
  }

  function handleMove(e) {
    let x = e.clientX || (e.touches && e.touches[0].clientX);
    let y = e.clientY || (e.touches && e.touches[0].clientY);
    if (x === undefined || y === undefined) return;
    onPointerInteract(x, y, isPointerDown);
  }

  function handleEnd() {
    isPointerDown = false;
    lastPos = null;
  }

  window.addEventListener('pointerdown', handleStart, { passive: true });
  window.addEventListener('pointermove', handleMove, { passive: true });
  window.addEventListener('pointerup', handleEnd, { passive: true });
  window.addEventListener('pointercancel', handleEnd, { passive: true });

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let autoEnabled = !prefersReducedMotion;
  let autoOrbitTime = 0;

  const btnAuto = document.getElementById('btn-auto');
  if (prefersReducedMotion) {
    btnAuto.classList.remove('active');
  }

  btnAuto.addEventListener('click', (e) => {
    e.stopPropagation();
    autoEnabled = !autoEnabled;
    btnAuto.classList.toggle('active', autoEnabled);
  });

  document.getElementById('btn-clear').addEventListener('click', (e) => {
    e.stopPropagation();
    u.fill(0);
    v.fill(0);
    r.fill(0);
    g.fill(0);
    b.fill(0);
    u_prev.fill(0);
    v_prev.fill(0);
    r_prev.fill(0);
    g_prev.fill(0);
    b_prev.fill(0);
  });

  const sBrightness = document.getElementById('slider-brightness');
  const vBrightness = document.getElementById('val-brightness');
  sBrightness.addEventListener('input', (e) => {
    brightness = parseFloat(e.target.value);
    vBrightness.textContent = brightness.toFixed(2);
  });

  const sDissipation = document.getElementById('slider-dissipation');
  const vDissipation = document.getElementById('val-dissipation');
  sDissipation.addEventListener('input', (e) => {
    dissipation = parseFloat(e.target.value);
    vDissipation.textContent = dissipation.toFixed(3);
  });

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('pointermove', (e) => {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      btn.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });
  });

  function seedBloom() {
    const center = (N + 1) / 2;
    const count = 24;
    const ringRadius = 15;
    for (let i = 0; i < count; i++) {
      let angle = (i / count) * Math.PI * 2;
      let px = center + Math.cos(angle) * ringRadius;
      let py = center + Math.sin(angle) * ringRadius;
      let hue = 185 + Math.sin(i * 0.4) * 35;
      let rgb = hslToRgb(hue, 0.95, 0.55);
      let outwardVel = 4.2;
      let vx = Math.cos(angle) * outwardVel;
      let vy = Math.sin(angle) * outwardVel;
      addSplat(px, py, 2.8, rgb, vx, vy, 1.6);
    }
  }
  seedBloom();

  let lastTime = performance.now();
  let frameCount = 0;
  let fpsTimer = 0;
  const fpsDisplay = document.getElementById('fps-display');

  function render() {
    const now = performance.now();
    const delta = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    frameCount++;
    fpsTimer += delta;
    if (fpsTimer >= 0.5) {
      let fps = Math.round(frameCount / fpsTimer);
      fpsDisplay.textContent = fps + ' fps';
      frameCount = 0;
      fpsTimer = 0;
    }

    currentHue = (currentHue + delta * 24) % 360;
    updateSwatch();

    if (autoEnabled) {
      autoOrbitTime += delta * 1.1;
      const center = (N + 1) / 2;

      let r1 = 20 + Math.sin(autoOrbitTime * 0.7) * 6;
      let x1 = center + Math.cos(autoOrbitTime) * r1;
      let y1 = center + Math.sin(autoOrbitTime) * r1;
      let vx1 = -Math.sin(autoOrbitTime) * 3.2;
      let vy1 = Math.cos(autoOrbitTime) * 3.2;
      let rgb1 = hslToRgb(currentHue + 40, 0.95, 0.55);
      addSplat(x1, y1, 2.2, rgb1, vx1, vy1, 0.42);

      let r2 = 24 + Math.cos(autoOrbitTime * 0.5) * 8;
      let x2 = center + Math.cos(-autoOrbitTime * 0.75 + 2.0) * r2;
      let y2 = center + Math.sin(-autoOrbitTime * 0.75 + 2.0) * r2;
      let vx2 = Math.sin(-autoOrbitTime * 0.75 + 2.0) * 3.0;
      let vy2 = -Math.cos(-autoOrbitTime * 0.75 + 2.0) * 3.0;
      let rgb2 = hslToRgb(currentHue + 190, 0.95, 0.55);
      addSplat(x2, y2, 2.5, rgb2, vx2, vy2, 0.42);
    }

    step();

    let p = 0;
    let bMult = brightness * 255;
    for (let j = 1; j <= N; j++) {
      let row = j * (N + 2);
      for (let i = 1; i <= N; i++) {
        let idx = row + i;
        let pr = r[idx] * bMult;
        let pg = g[idx] * bMult;
        let pb = b[idx] * bMult;
        data[p] = pr > 255 ? 255 : (pr < 0 ? 0 : pr);
        data[p + 1] = pg > 255 ? 255 : (pg < 0 ? 0 : pg);
        data[p + 2] = pb > 255 ? 255 : (pb < 0 ? 0 : pb);
        p += 4;
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    ctx.save();
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let drawSize = Math.max(canvas.width, canvas.height);
    let ox = (canvas.width - drawSize) / 2;
    let oy = (canvas.height - drawSize) / 2;
    ctx.drawImage(offscreen, 0, 0, N, N, ox, oy, drawSize, drawSize);
    ctx.restore();

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
