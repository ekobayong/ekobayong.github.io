<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Night Window — Rain on Glass</title>
  <style>
    /* -------------------------------------------------------------
       DESIGN SYSTEM & RESET
       ------------------------------------------------------------- */
    :root {
      --bg-void: #05070f;
      --ink: #e9e4da;
      --ink-muted: rgba(233, 228, 218, 0.65);
      --ink-subtle: rgba(233, 228, 218, 0.40);
      --amber: #ffb35c;
      --amber-glow: rgba(255, 179, 92, 0.35);
      --fog-color: rgb(206, 219, 232);
      --pill-bg: rgba(13, 16, 26, 0.68);
      --pill-border: rgba(255, 255, 255, 0.12);
      --font-display: Georgia, "Times New Roman", serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-void);
      font-family: var(--font-ui);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* -------------------------------------------------------------
       VIEWPORT & SASH FRAME CONTAINER
       ------------------------------------------------------------- */
    #window-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-void);
    }

    /* Main rendering canvas */
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
      z-index: 1;
    }

    /* -------------------------------------------------------------
       ROOM REFLECTION: MIRRORED INLINE SVG LAMP & CORNER GLOW
       ------------------------------------------------------------- */
    .corner-glow {
      position: absolute;
      right: -8vw;
      bottom: -8vh;
      width: 48vw;
      height: 48vh;
      min-width: 360px;
      min-height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle at 70% 70%, rgba(255, 170, 75, 0.15) 0%, rgba(255, 140, 50, 0.08) 42%, rgba(255, 100, 30, 0) 75%);
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
      animation: lampBreathe 7s ease-in-out infinite;
    }

    .room-reflection {
      position: absolute;
      right: 5vw;
      bottom: 6vh;
      width: 220px;
      height: 340px;
      pointer-events: none;
      z-index: 3;
      opacity: 0.32;
      filter: blur(1.5px);
      mix-blend-mode: screen;
      animation: lampBreathe 7s ease-in-out infinite;
      transform-origin: 75% 85%;
    }

    .room-lamp {
      width: 100%;
      height: 100%;
      display: block;
      /* Mirrored reflection effect */
      transform: scaleX(-1);
    }

    @keyframes lampBreathe {
      0%, 100% {
        transform: scale(1) translateY(0);
        opacity: 0.30;
      }
      50% {
        transform: scale(1.025) translateY(-2px);
        opacity: 0.36;
      }
    }

    /* -------------------------------------------------------------
       WINDOW VIGNETTE & SASH FRAMING
       ------------------------------------------------------------- */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 50%, rgba(3, 5, 12, 0.45) 80%, rgba(2, 3, 8, 0.85) 100%);
    }

    .sash-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      /* Multi-layered beveled wood frame */
      box-shadow:
        inset 0 0 0 14px #120d09,
        inset 0 0 0 16px #2b1f15,
        inset 0 0 0 19px #0c0806,
        inset 0 0 38px 24px rgba(0, 0, 0, 0.90),
        inset 0 0 12px 6px rgba(0, 0, 0, 0.96);
    }

    /* Wood-grain gradient overlay on the sash border */
    .sash-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 14px solid transparent;
      border-image: linear-gradient(135deg, #241710 0%, #150e09 35%, #2a1b12 65%, #140d08 100%) 14;
      pointer-events: none;
      opacity: 0.9;
    }

    /* Warm bottom sill highlight from room lamp */
    .sash-sill-highlight {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 179, 92, 0.05) 0%, rgba(255, 179, 92, 0.28) 65%, rgba(255, 215, 150, 0.45) 85%, rgba(255, 179, 92, 0.15) 100%);
      pointer-events: none;
    }

    /* -------------------------------------------------------------
       WIPER SQUEEGEE ANIMATION BAR
       ------------------------------------------------------------- */
    .wiper-blade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      left: -20px;
      pointer-events: none;
      z-index: 8;
      display: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .wiper-blade.active {
      display: block;
      opacity: 1;
    }

    .wiper-line {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #5a6675 0%, #a2b4c7 40%, #ffffff 50%, #8799ac 70%, #465362 100%);
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.6),
        4px 0 16px rgba(0, 0, 0, 0.8),
        -6px 0 14px rgba(206, 219, 232, 0.5);
    }

    .wiper-mist {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -14px;
      width: 14px;
      background: linear-gradient(90deg, rgba(206, 219, 232, 0) 0%, rgba(255, 255, 255, 0.45) 100%);
      filter: blur(1px);
    }

    /* -------------------------------------------------------------
       HUD HEADER
       ------------------------------------------------------------- */
    .hud-header {
      position: absolute;
      top: 32px;
      left: 36px;
      z-index: 12;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    }

    .hud-title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: 2.1rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      line-height: 1.1;
    }

    .hud-subtitle {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0.92;
      margin-top: 1px;
    }

    .hud-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--ink-muted);
    }

    .hud-clock {
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-divider {
      opacity: 0.35;
      font-size: 0.75rem;
    }

    .hud-weather {
      font-style: normal;
      color: var(--ink-muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* -------------------------------------------------------------
       GESTURE HINT
       ------------------------------------------------------------- */
    .gesture-hint {
      position: absolute;
      top: 124px;
      left: 38px;
      z-index: 12;
      pointer-events: none;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      color: var(--ink-subtle);
      transition: opacity 1.2s ease;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .gesture-hint.faded {
      opacity: 0;
    }

    /* -------------------------------------------------------------
       FROSTED CONTROLS PILL
       ------------------------------------------------------------- */
    .controls-pill {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 22px;
      background: var(--pill-bg);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--pill-border);
      border-radius: 9999px;
      padding: 10px 24px;
      box-shadow:
        0 14px 40px -10px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      opacity: 1;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s ease;
    }

    .controls-pill.idle {
      opacity: 0.35;
    }

    .controls-pill:hover,
    .controls-pill:focus-within {
      opacity: 1 !important;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 125px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-muted);
      cursor: pointer;
    }

    .control-val {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    /* Slider input styling */
    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .slider:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber-glow);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--amber);
      border: none;
      box-shadow: 0 0 10px var(--amber-glow);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 14px var(--amber);
    }

    .slider::-moz-range-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 14px var(--amber);
    }

    /* Button Group */
    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 18px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--ink);
      padding: 7px 15px;
      border-radius: 9999px;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .pill-btn:active {
      transform: translateY(1px);
      background: rgba(255, 255, 255, 0.12);
    }

    .pill-btn.primary-btn {
      background: rgba(255, 179, 92, 0.22);
      border-color: rgba(255, 179, 92, 0.45);
      color: #fff2e0;
    }

    .pill-btn.primary-btn:hover {
      background: rgba(255, 179, 92, 0.35);
      border-color: rgba(255, 179, 92, 0.7);
      box-shadow: 0 0 12px rgba(255, 179, 92, 0.3);
    }

    .pill-btn.sound-active {
      background: rgba(110, 180, 255, 0.22);
      border-color: rgba(110, 180, 255, 0.45);
      color: #ebf4ff;
    }

    /* -------------------------------------------------------------
       MEDIA QUERIES & ACCESSIBILITY
       ------------------------------------------------------------- */
    @media (max-width: 820px) {
      .controls-pill {
        bottom: 20px;
        gap: 14px;
        padding: 8px 16px;
        max-width: calc(100vw - 32px);
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 24px;
      }
      .control-group {
        min-width: 105px;
      }
      .btn-group {
        border-left: none;
        padding-left: 0;
      }
      .hud-header {
        top: 24px;
        left: 24px;
      }
      .hud-title {
        font-size: 1.7rem;
      }
      .hud-weather {
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .corner-glow,
      .room-reflection {
        animation: none !important;
      }
      .controls-pill,
      .gesture-hint {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Full Viewport Window Container -->
  <main id="window-stage" role="main">

    <!-- Single Fixed Canvas -->
    <canvas id="canvas" aria-label="Rain on fogged window simulation"></canvas>

    <!-- Warm corner ambient glow from room -->
    <div class="corner-glow" aria-hidden="true"></div>

    <!-- Mirrored inline-SVG lamp (trapezoid shade #ffd9a3->#ff9b3c, radial bulb glow, dark stem and base) -->
    <aside class="room-reflection" aria-hidden="true">
      <svg class="room-lamp" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff8d4" stop-opacity="1" />
            <stop offset="35%" stop-color="#ffb35c" stop-opacity="0.8" />
            <stop offset="75%" stop-color="#ff8e36" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#ff8e36" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="shade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffd9a3" />
            <stop offset="55%" stop-color="#ffb35c" />
            <stop offset="100%" stop-color="#ff9b3c" />
          </linearGradient>
          <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#14110e" />
            <stop offset="50%" stop-color="#3d2f24" />
            <stop offset="100%" stop-color="#19130f" />
          </linearGradient>
        </defs>

        <!-- Lamp Warm Glow Aura -->
        <circle cx="100" cy="115" r="95" fill="url(#bulb-glow)" />

        <!-- Trapezoid Shade -->
        <polygon points="68,58 132,58 158,132 42,132" fill="url(#shade-grad)" />

        <!-- Shade Rim Highlights -->
        <ellipse cx="100" cy="132" rx="58" ry="10" fill="#ffe0b2" opacity="0.65" />
        <ellipse cx="100" cy="132" rx="54" ry="7" fill="#ff9b3c" opacity="0.85" />
        <ellipse cx="100" cy="58" rx="32" ry="6" fill="#8c6239" />
        <circle cx="100" cy="50" r="5" fill="#d4af37" />

        <!-- Lamp Stem -->
        <rect x="96" y="134" width="8" height="122" rx="4" fill="url(#stem-grad)" />
        <path d="M 94,180 Q 100,190 106,180" stroke="#ffe0b2" stroke-width="1.5" fill="none" opacity="0.4" />

        <!-- Base -->
        <path d="M 58,264 C 58,250 142,250 142,264 L 152,274 C 152,278 48,278 48,274 Z" fill="url(#stem-grad)" />
        <ellipse cx="100" cy="274" rx="52" ry="5" fill="#0d0a08" />
      </svg>
    </aside>

    <!-- Edge Vignette -->
    <div class="vignette" aria-hidden="true"></div>

    <!-- Wooden Window Sash Frame with Sill Highlight -->
    <div class="sash-frame" aria-hidden="true">
      <div class="sash-sill-highlight"></div>
    </div>

    <!-- Wiper Blade Squeegee Line -->
    <div id="wiper-blade" class="wiper-blade" aria-hidden="true">
      <div class="wiper-line"></div>
      <div class="wiper-mist"></div>
    </div>

    <!-- HUD Overlay -->
    <header class="hud-header">
      <h1 class="hud-title">Night Window</h1>
      <p class="hud-subtitle">Observation Deck · Rain &amp; Condensation</p>
      <div class="hud-status-row">
        <span class="hud-clock" id="live-clock" title="Local time">00:00:00</span>
        <span class="hud-divider">/</span>
        <span class="hud-weather" id="weather-text">Steady night shower · Gusting 14 kt</span>
      </div>
    </header>

    <!-- Interaction Gesture Hint -->
    <div id="gesture-hint" class="gesture-hint">
      <span>Drag to wipe fog · Click pane to add heavy drop</span>
    </div>

    <!-- Frosted Controls Pill -->
    <nav class="controls-pill" id="controls-pill" aria-label="Simulation controls">
      <!-- Rain Intensity Slider -->
      <div class="control-group">
        <label for="slider-rain" class="control-label">
          <span>Rain</span>
          <span class="control-val" id="val-rain">54%</span>
        </label>
        <input type="range" id="slider-rain" min="0" max="100" value="54" class="slider" aria-label="Rain intensity">
      </div>

      <!-- Condensation Slider -->
      <div class="control-group">
        <label for="slider-fog" class="control-label">
          <span>Fog</span>
          <span class="control-val" id="val-fog">100%</span>
        </label>
        <input type="range" id="slider-fog" min="0" max="200" value="100" class="slider" aria-label="Fog condensation rate">
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button type="button" id="btn-wipe" class="pill-btn primary-btn" title="Sweep wiper blade across window">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>Wipe All</span>
        </button>

        <button type="button" id="btn-heavy-drop" class="pill-btn" title="Add heavy droplet">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <span>Add Drop</span>
        </button>

        <button type="button" id="btn-sound" class="pill-btn" title="Toggle procedural rain sound" aria-pressed="false">
          <svg id="sound-icon-off" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          <svg id="sound-icon-on" style="display:none" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span id="sound-text">Sound</span>
        </button>
      </div>
    </nav>
  </main>

  <script>
    (function () {
      'use strict';

      // -------------------------------------------------------------
      // CONSTANTS & PALETTES
      // -------------------------------------------------------------
      // 8 bokeh sprite colors as specified
      const BOKEH_COLORS = [
        'rgb(255, 178, 82)',  // Sodium amber
        'rgb(255, 233, 190)', // Warm white
        'rgb(110, 180, 255)', // Cool blue
        'rgb(255, 96, 140)',  // Neon pink
        'rgb(90, 240, 190)',  // Mint
        'rgb(200, 120, 255)', // Violet
        'rgb(255, 125, 45)',  // Neon amber-orange
        'rgb(255, 215, 90)'   // Golden beacon yellow
      ];

      // Weather status lines matching intensity slider
      const WEATHER_TIERS = [
        { max: 15, text: 'Gentle mist on cold double pane · Air calm' },
        { max: 35, text: 'Light drizzle · Beading on cold glass · Breeze 6 kt' },
        { max: 65, text: 'Steady night shower · Streaking glass · Gusting 14 kt' },
        { max: 85, text: 'Heavy downpour · Active rivulets · Wind 22 kt SSE' },
        { max: 100, text: 'Violent cloudburst · Torrents on pane · Storm advisory' }
      ];

      // -------------------------------------------------------------
      // DOM ELEMENTS & GLOBAL CANVAS SETUP
      // -------------------------------------------------------------
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      const liveClockEl = document.getElementById('live-clock');
      const weatherTextEl = document.getElementById('weather-text');
      const sliderRain = document.getElementById('slider-rain');
      const sliderFog = document.getElementById('slider-fog');
      const valRainEl = document.getElementById('val-rain');
      const valFogEl = document.getElementById('val-fog');
      const btnWipe = document.getElementById('btn-wipe');
      const btnHeavyDrop = document.getElementById('btn-heavy-drop');
      const btnSound = document.getElementById('btn-sound');
      const soundIconOff = document.getElementById('sound-icon-off');
      const soundIconOn = document.getElementById('sound-icon-on');
      const soundText = document.getElementById('sound-text');
      const controlsPill = document.getElementById('controls-pill');
      const gestureHint = document.getElementById('gesture-hint');
      const wiperBladeEl = document.getElementById('wiper-blade');

      let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
        reducedMotion = e.matches;
      });

      // Sizing variables
      let width = 0;
      let height = 0;
      let dpr = 1;
      let cityW = 0;
      let cityH = 0;

      // -------------------------------------------------------------
      // THREE OFFSCREEN LAYERS
      // -------------------------------------------------------------
      // 1. Static blurred skyline layer
      const skylineCanvas = document.createElement('canvas');
      const skylineCtx = skylineCanvas.getContext('2d');

      // 2. Small (0.5x) live city layer
      const cityCanvas = document.createElement('canvas');
      const cityCtx = cityCanvas.getContext('2d');

      // 3. Full-resolution condensation fog layer
      const fogCanvas = document.createElement('canvas');
      const fogCtx = fogCanvas.getContext('2d');

      // -------------------------------------------------------------
      // PRE-RENDERED BOKEH SPRITES (8 colors x 4 sizes)
      // -------------------------------------------------------------
      const bokehSprites = [];
      const SPRITE_SIZES = [8, 16, 26, 38];

      function initBokehSprites() {
        bokehSprites.length = 0;
        for (let c = 0; c < BOKEH_COLORS.length; c++) {
          const color = BOKEH_COLORS[c];
          bokehSprites[c] = [];
          for (let s = 0; s < SPRITE_SIZES.length; s++) {
            const rad = SPRITE_SIZES[s];
            const size = rad * 2;
            const sprCanvas = document.createElement('canvas');
            sprCanvas.width = size;
            sprCanvas.height = size;
            const sprCtx = sprCanvas.getContext('2d');

            const grad = sprCtx.createRadialGradient(rad, rad, 0, rad, rad, rad);
            // Core white/hot spot
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            grad.addColorStop(0.28, color.replace('rgb', 'rgba').replace(')', ', 0.85)'));
            grad.addColorStop(0.65, color.replace('rgb', 'rgba').replace(')', ', 0.35)'));
            grad.addColorStop(1, color.replace('rgb', 'rgba').replace(')', ', 0)'));

            sprCtx.fillStyle = grad;
            sprCtx.beginPath();
            sprCtx.arc(rad, rad, rad, 0, Math.PI * 2);
            sprCtx.fill();

            bokehSprites[c][s] = { canvas: sprCanvas, radius: rad };
          }
        }
      }
      initBokehSprites();

      // -------------------------------------------------------------
      // PROCEDURAL CITY DATA: LIGHTS, BEACONS & STREAKS
      // -------------------------------------------------------------
      const cityLights = [];
      const highBeacons = [];
      const cityRainStreaks = [];

      function initCityData(cW, cH) {
        cityLights.length = 0;
        highBeacons.length = 0;
        cityRainStreaks.length = 0;

        // 1. Lit windows in a 14x18 px lattice on skyline buildings
        // (Scaled to cityCanvas resolution: step ≈ 7x9 px)
        const stepX = 7;
        const stepY = 9;
        const horizonY = cH * 0.76;

        // Sample building window columns
        for (let x = 8; x < cW - 8; x += stepX) {
          // Architectural skyline profile
          const normX = x / cW;
          const skylineHeightFactor = 0.32 + 0.35 * Math.sin(normX * Math.PI) * (0.8 + 0.4 * Math.sin(normX * 18));
          const buildingTop = cH * (1 - skylineHeightFactor);

          // Place lattice windows
          for (let y = buildingTop + 6; y < horizonY + 20; y += stepY) {
            // Approx 35% of windows lit
            if (Math.sin(x * 12.3 + y * 45.7) > 0.32) {
              const colorIdx = Math.random() < 0.65 ? 0 : (Math.random() < 0.5 ? 1 : (Math.random() < 0.6 ? 2 : 4));
              cityLights.push({
                x: x + (Math.random() - 0.5) * 1.5,
                y: y + (Math.random() - 0.5) * 1.5,
                colorIdx: colorIdx,
                sizeIdx: 0, // small sprite (rad 8)
                baseAlpha: 0.45 + Math.random() * 0.45,
                phase: Math.random() * Math.PI * 2,
                speed: 0.8 + Math.random() * 2.2,
                radius: 2.2 + Math.random() * 1.8
              });
            }
          }
        }

        // 2. 46 large street/signage discs (radius 9-26 px on screen -> 4.5-13 px on cityCanvas) clustered low
        for (let i = 0; i < 46; i++) {
          const u = i / 46;
          const x = (u * cW + (Math.random() - 0.5) * 40 + cW) % cW;
          const y = horizonY + 6 + Math.random() * (cH - horizonY - 14);
          const colorIdx = Math.floor(Math.random() * BOKEH_COLORS.length);
          const sizeIdx = 1 + Math.floor(Math.random() * 3); // rad 16, 26, or 38
          const rad = 4.5 + Math.random() * 8.5;

          cityLights.push({
            x: x,
            y: y,
            colorIdx: colorIdx,
            sizeIdx: sizeIdx,
            baseAlpha: 0.55 + Math.random() * 0.4,
            phase: Math.random() * Math.PI * 2,
            speed: 1.2 + Math.random() * 2.5,
            radius: rad
          });
        }

        // 3. A dozen (12) high beacons atop towers
        for (let b = 0; b < 12; b++) {
          const bx = ((b + 0.5) / 12) * cW + (Math.random() - 0.5) * 25;
          const by = cH * (0.22 + Math.random() * 0.28);
          highBeacons.push({
            x: bx,
            y: by,
            colorIdx: b % 2 === 0 ? 0 : 7, // Amber or Golden
            sizeIdx: 1,
            baseAlpha: 0.9,
            pulseSpeed: 2.4 + (b % 4) * 0.5,
            phase: b * 0.7,
            radius: 5
          });
        }

        // 4. Seventy (70) faint diagonal rain streaks behind the glass
        for (let r = 0; r < 70; r++) {
          cityRainStreaks.push({
            x: Math.random() * cW,
            y: Math.random() * cH,
            len: 12 + Math.random() * 22,
            vx: 1.2 + Math.random() * 0.8,
            vy: 11 + Math.random() * 8,
            alpha: 0.06 + Math.random() * 0.08
          });
        }
      }

      // -------------------------------------------------------------
      // PROCEDURAL STATIC BLURRED SKYLINE
      // -------------------------------------------------------------
      function renderStaticSkyline() {
        const w = skylineCanvas.width;
        const h = skylineCanvas.height;

        // Sky gradient: #04060f -> #0b1024 -> #2a1b2c -> #3a2418
        const skyGrad = skylineCtx.createLinearGradient(0, 0, 0, h);
        skyGrad.addColorStop(0.00, '#04060f');
        skyGrad.addColorStop(0.42, '#0b1024');
        skyGrad.addColorStop(0.74, '#2a1b2c');
        skyGrad.addColorStop(1.00, '#3a2418');

        skylineCtx.fillStyle = skyGrad;
        skylineCtx.fillRect(0, 0, w, h);

        // Procedural skyline of dark rectangles (rgb ≈ 8-18)
        // Rendered with blur filter so it reads as out-of-focus masses
        skylineCtx.save();
        skylineCtx.filter = 'blur(14px)';

        // Tier 1: Distant low-contrast silhouettes (rgb ≈ 8-12)
        skylineCtx.fillStyle = 'rgb(9, 12, 18)';
        for (let x = 0; x < w; x += 35 + Math.random() * 45) {
          const bW = 35 + Math.random() * 55;
          const bH = h * (0.28 + Math.random() * 0.28);
          skylineCtx.fillRect(x, h - bH, bW, bH);
        }

        // Tier 2: Midground towers with spires & crowns (rgb ≈ 12-15)
        skylineCtx.fillStyle = 'rgb(13, 16, 24)';
        for (let x = 10; x < w; x += 55 + Math.random() * 60) {
          const bW = 45 + Math.random() * 70;
          const bH = h * (0.35 + Math.random() * 0.35);
          skylineCtx.fillRect(x, h - bH, bW, bH);

          // Spire / antenna
          if (Math.random() < 0.45) {
            const spireW = 3 + Math.random() * 3;
            const spireH = 25 + Math.random() * 45;
            skylineCtx.fillRect(x + bW * 0.5 - spireW * 0.5, h - bH - spireH, spireW, spireH);
          }
        }

        // Tier 3: Foreground deep masses (rgb ≈ 16-18)
        skylineCtx.fillStyle = 'rgb(17, 20, 30)';
        for (let x = -20; x < w + 40; x += 80 + Math.random() * 90) {
          const bW = 75 + Math.random() * 110;
          const bH = h * (0.22 + Math.random() * 0.30);
          skylineCtx.fillRect(x, h - bH, bW, bH);
        }

        skylineCtx.restore();
      }

      // -------------------------------------------------------------
      // CONDENSATION FOG LAYER
      // -------------------------------------------------------------
      function initFogLayer() {
        const w = fogCanvas.width;
        const h = fogCanvas.height;

        fogCtx.save();
        fogCtx.clearRect(0, 0, w, h);

        // Filled with rgb(206,219,232), slightly thinner near center
        const radGrad = fogCtx.createRadialGradient(w * 0.5, h * 0.52, h * 0.1, w * 0.5, h * 0.52, Math.max(w, h) * 0.72);
        radGrad.addColorStop(0.0, 'rgba(206, 219, 232, 0.82)');
        radGrad.addColorStop(0.65, 'rgba(206, 219, 232, 0.94)');
        radGrad.addColorStop(1.0, 'rgba(206, 219, 232, 1.0)');

        fogCtx.fillStyle = radGrad;
        fogCtx.fillRect(0, 0, w, h);
        fogCtx.restore();
      }

      // -------------------------------------------------------------
      // RAINDROP SYSTEM & REFRACTIVE LENS SIMULATION
      // -------------------------------------------------------------
      // Drop array
      const drops = [];

      // Max capacity to maintain solid 60 FPS
      const MAX_DROPS = 450;

      class Drop {
        constructor(x, y, r, isMover = false) {
          this.x = x;
          this.y = y;
          this.r = r;
          this.rx = r;
          this.ry = r;
          this.isMover = isMover;
          this.vx = 0;
          this.vy = isMover ? 1.2 + Math.random() * 0.8 : 0;
          // Personal release radius (4.6 - 7.5 px)
          this.releaseRadius = 4.6 + Math.random() * 2.9;
          this.wobblePhase = Math.random() * Math.PI * 2;
          this.trailCounter = Math.random() * 10;
          this.swellCounter = Math.random() * 30;
        }
      }

      function spawnBead(x, y, r) {
        if (drops.length >= MAX_DROPS) return;
        drops.push(new Drop(x, y, r, false));
      }

      function spawnHeavyDrop(x, y) {
        const r = 5.2 + Math.random() * 2.2;
        const d = new Drop(x, y, r, true);
        d.vy = 1.6;
        drops.push(d);
      }

      // Seed initial droplets across pane
      function seedInitialDrops() {
        drops.length = 0;
        const count = Math.min(220, Math.floor((width * height) / 14000));
        for (let i = 0; i < count; i++) {
          const x = 20 + Math.random() * (width - 40);
          const y = 20 + Math.random() * (height - 40);
          const r = 1.0 + Math.random() * 3.4;
          drops.push(new Drop(x, y, r, false));
        }
      }

      // -------------------------------------------------------------
      // CONDENSATION WIPING WITH POINTER
      // -------------------------------------------------------------
      let pointerDown = false;
      let lastPointerX = null;
      let lastPointerY = null;

      function wipeFogAt(x, y, prevX, prevY) {
        // Radius ≈ 6% of the short side
        const brushR = Math.max(18, Math.min(width, height) * 0.06);

        fogCtx.save();
        fogCtx.globalCompositeOperation = 'destination-out';

        // Interpolate between pointer samples so fast swipes stay continuous
        const dx = x - prevX;
        const dy = y - prevY;
        const dist = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.ceil(dist / (brushR * 0.35)));

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const ix = prevX + dx * t;
          const iy = prevY + dy * t;

          const wipeGrad = fogCtx.createRadialGradient(ix, iy, brushR * 0.2, ix, iy, brushR);
          wipeGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
          wipeGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.7)');
          wipeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          fogCtx.fillStyle = wipeGrad;
          fogCtx.beginPath();
          fogCtx.arc(ix, iy, brushR, 0, Math.PI * 2);
          fogCtx.fill();

          // Knock small beads off within brush radius
          for (let d = drops.length - 1; d >= 0; d--) {
            const drop = drops[d];
            if (Math.hypot(drop.x - ix, drop.y - iy) < brushR * 0.85) {
              drops.splice(d, 1);
            }
          }
        }

        fogCtx.restore();
      }

      // -------------------------------------------------------------
      // WIPER "WIPE ALL" SQUEEGEE ANIMATION
      // -------------------------------------------------------------
      const wiperState = {
        active: false,
        startTime: 0,
        duration: 820 // sweeps across in under a second
      };

      function triggerWipeAll() {
        if (wiperState.active) return;
        wiperState.active = true;
        wiperState.startTime = performance.now();
        wiperBladeEl.classList.add('active');
      }

      // -------------------------------------------------------------
      // AUDIO SYSTEM (PROCEDURAL WEB AUDIO RAIN SYNTHESIZER)
      // -------------------------------------------------------------
      let audioCtx = null;
      let rainGainNode = null;
      let soundEnabled = false;

      function initAudio() {
        if (audioCtx) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();

          // Continuous brown/pink filtered rain noise buffer
          const bufferSize = audioCtx.sampleRate * 2;
          const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let lastOut = 0.0;

          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + 0.02 * white) / 1.02;
            lastOut = output[i];
            output[i] *= 3.5;
          }

          const whiteNoise = audioCtx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;

          // Bandpass filter to emulate rain on double-pane glass
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1100;
          filter.Q.value = 0.7;

          rainGainNode = audioCtx.createGain();
          rainGainNode.gain.value = 0.0;

          whiteNoise.connect(filter);
          filter.connect(rainGainNode);
          rainGainNode.connect(audioCtx.destination);

          whiteNoise.start(0);

          // Patter generator: subtle droplet ticks
          setInterval(() => {
            if (!soundEnabled || !audioCtx) return;
            const intensity = sliderRain.value / 100;
            if (Math.random() < intensity * 0.6) {
              playDropletTick();
            }
          }, 80);

        } catch (e) {
          console.warn('Web Audio not supported', e);
        }
      }

      function playDropletTick() {
        if (!audioCtx || !soundEnabled) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const freq = 1600 + Math.random() * 1800;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);

          gain.gain.setValueAtTime(0.04 * Math.random(), audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.045);
        } catch (err) {}
      }

      function toggleSound() {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        soundEnabled = !soundEnabled;
        btnSound.setAttribute('aria-pressed', String(soundEnabled));

        if (soundEnabled) {
          btnSound.classList.add('sound-active');
          soundIconOff.style.display = 'none';
          soundIconOn.style.display = 'inline-block';
          soundText.textContent = 'Mute';
          if (rainGainNode) {
            rainGainNode.gain.setTargetAtTime(0.22 * (sliderRain.value / 100), audioCtx.currentTime, 0.15);
          }
        } else {
          btnSound.classList.remove('sound-active');
          soundIconOff.style.display = 'inline-block';
          soundIconOn.style.display = 'none';
          soundText.textContent = 'Sound';
          if (rainGainNode) {
            rainGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
          }
        }
      }

      // -------------------------------------------------------------
      // SIZING & RESIZE HANDLER
      // -------------------------------------------------------------
      function handleResize() {
        const winW = window.innerWidth;
        const winH = window.innerHeight;

        // devicePixelRatio-aware sizing (capped at 2, reduced if pixel area > 7MP)
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const totalPixels = winW * winH * dpr * dpr;
        if (totalPixels > 7000000) {
          dpr = Math.min(dpr, Math.sqrt(7000000 / (winW * winH)));
        }

        width = Math.max(320, Math.round(winW * dpr));
        height = Math.max(240, Math.round(winH * dpr));

        canvas.width = width;
        canvas.height = height;

        // Static skyline at full res
        skylineCanvas.width = width;
        skylineCanvas.height = height;
        renderStaticSkyline();

        // Small live city layer at 0.5x
        cityW = Math.max(160, Math.round(width * 0.5));
        cityH = Math.max(120, Math.round(height * 0.5));
        cityCanvas.width = cityW;
        cityCanvas.height = cityH;
        initCityData(cityW, cityH);

        // Full-resolution fog layer
        fogCanvas.width = width;
        fogCanvas.height = height;
        initFogLayer();

        seedInitialDrops();
      }

      window.addEventListener('resize', handleResize);
      handleResize();

      // -------------------------------------------------------------
      // INTERACTION & IDLE FADE HANDLERS
      // -------------------------------------------------------------
      let idleTimeout = null;
      function pokeActive() {
        controlsPill.classList.remove('idle');
        clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => {
          controlsPill.classList.add('idle');
        }, 3400);
      }

      // Track pointer on canvas
      function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * dpr,
          y: (e.clientY - rect.top) * dpr
        };
      }

      canvas.addEventListener('pointerdown', (e) => {
        pokeActive();
        gestureHint.classList.add('faded');
        pointerDown = true;
        const pos = getCanvasPos(e);
        lastPointerX = pos.x;
        lastPointerY = pos.y;
        wipeFogAt(pos.x, pos.y, pos.x, pos.y);
      });

      window.addEventListener('pointermove', (e) => {
        pokeActive();
        if (!pointerDown) return;
        const pos = getCanvasPos(e);
        if (lastPointerX !== null && lastPointerY !== null) {
          wipeFogAt(pos.x, pos.y, lastPointerX, lastPointerY);
        }
        lastPointerX = pos.x;
        lastPointerY = pos.y;
      });

      window.addEventListener('pointerup', () => {
        pointerDown = false;
        lastPointerX = null;
        lastPointerY = null;
      });

      window.addEventListener('pointercancel', () => {
        pointerDown = false;
        lastPointerX = null;
        lastPointerY = null;
      });

      // Click on the glass adds a heavy drop
      canvas.addEventListener('click', (e) => {
        pokeActive();
        const pos = getCanvasPos(e);
        spawnHeavyDrop(pos.x, pos.y);
      });

      // UI Control inputs
      sliderRain.addEventListener('input', () => {
        pokeActive();
        valRainEl.textContent = `${sliderRain.value}%`;
        updateWeatherText();
        if (soundEnabled && rainGainNode && audioCtx) {
          rainGainNode.gain.setTargetAtTime(0.22 * (sliderRain.value / 100), audioCtx.currentTime, 0.1);
        }
      });

      sliderFog.addEventListener('input', () => {
        pokeActive();
        valFogEl.textContent = `${sliderFog.value}%`;
      });

      btnWipe.addEventListener('click', (e) => {
        e.stopPropagation();
        pokeActive();
        triggerWipeAll();
      });

      btnHeavyDrop.addEventListener('click', (e) => {
        e.stopPropagation();
        pokeActive();
        spawnHeavyDrop(width * (0.2 + Math.random() * 0.6), 15);
      });

      btnSound.addEventListener('click', (e) => {
        e.stopPropagation();
        pokeActive();
        toggleSound();
      });

      function updateWeatherText() {
        const val = parseInt(sliderRain.value, 10);
        for (const tier of WEATHER_TIERS) {
          if (val <= tier.max) {
            weatherTextEl.textContent = tier.text;
            break;
          }
        }
      }

      // Live clock updater
      function updateLiveClock() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        liveClockEl.textContent = `${hrs}:${mins}:${secs}`;
      }
      setInterval(updateLiveClock, 1000);
      updateLiveClock();

      // Fade gesture hint after 6s automatically
      setTimeout(() => {
        gestureHint.classList.add('faded');
      }, 6000);

      pokeActive();

      // -------------------------------------------------------------
      // MAIN ANIMATION LOOP
      // -------------------------------------------------------------
      let lastTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);

        const dt = Math.min(0.08, (now - lastTime) / 1000);
        lastTime = now;

        const rainIntensity = sliderRain.value / 100;
        const fogRate = sliderFog.value / 100;

        // -----------------------------------------------------------
        // 1. UPDATE LIVE CITY LAYER (0.5x)
        // -----------------------------------------------------------
        // Draw static blurred skyline onto cityCanvas
        cityCtx.drawImage(skylineCanvas, 0, 0, cityW, cityH);

        // Draw Bokeh Lights
        for (let i = 0; i < cityLights.length; i++) {
          const l = cityLights[i];
          if (!reducedMotion) {
            l.phase += l.speed * dt;
          }

          let alpha = l.baseAlpha;
          if (!reducedMotion) {
            const twinkle = 0.78 + 0.22 * Math.sin(l.phase);
            // Occasional flicker
            const flicker = Math.random() < 0.008 ? (0.35 + Math.random() * 0.4) : 1.0;
            alpha *= twinkle * flicker;
          }

          cityCtx.globalAlpha = Math.max(0, Math.min(1, alpha));
          const spr = bokehSprites[l.colorIdx][l.sizeIdx];
          cityCtx.drawImage(spr.canvas, l.x - l.radius, l.y - l.radius, l.radius * 2, l.radius * 2);
        }

        // Draw High Beacons
        for (let b = 0; b < highBeacons.length; b++) {
          const beacon = highBeacons[b];
          let alpha = 0.85;
          if (!reducedMotion) {
            beacon.phase += beacon.pulseSpeed * dt;
            const pulse = (Math.sin(beacon.phase) + 1) * 0.5;
            alpha = Math.pow(pulse, 4); // Sharp beacon blink
          }
          cityCtx.globalAlpha = alpha;
          const spr = bokehSprites[beacon.colorIdx][beacon.sizeIdx];
          cityCtx.drawImage(spr.canvas, beacon.x - beacon.radius, beacon.y - beacon.radius, beacon.radius * 2, beacon.radius * 2);
        }

        // 70 Faint Diagonal Rain Streaks behind the glass
        cityCtx.strokeStyle = 'rgba(220, 235, 255, 0.10)';
        cityCtx.lineWidth = 1;
        cityCtx.beginPath();
        for (let s = 0; s < cityRainStreaks.length; s++) {
          const streak = cityRainStreaks[s];
          streak.x += streak.vx * (rainIntensity * 0.8 + 0.5);
          streak.y += streak.vy * (rainIntensity * 0.8 + 0.5);

          // Wrap around edges
          if (streak.y > cityH) {
            streak.y = -streak.len;
            streak.x = Math.random() * cityW;
          }
          if (streak.x > cityW) {
            streak.x = 0;
          }

          cityCtx.moveTo(streak.x, streak.y);
          cityCtx.lineTo(streak.x - streak.vx * 1.8, streak.y - streak.len);
        }
        cityCtx.stroke();
        cityCtx.globalAlpha = 1.0;

        // -----------------------------------------------------------
        // 2. SIMULATION: CONDENSATION RE-FOGGING & RAINDROPS
        // -----------------------------------------------------------
        // Every frame adds back rgba(206,219,232,0.0045) so wiped areas slowly re-fog
        if (fogRate > 0) {
          fogCtx.save();
          fogCtx.globalCompositeOperation = 'source-over';
          fogCtx.fillStyle = `rgba(206, 219, 232, ${0.0045 * fogRate})`;
          fogCtx.fillRect(0, 0, width, height);
          fogCtx.restore();
        }

        // Wiper Blade animation pass
        if (wiperState.active) {
          const elapsed = now - wiperState.startTime;
          const progress = Math.min(1.0, elapsed / wiperState.duration);

          const wiperCssX = progress * window.innerWidth;
          wiperBladeEl.style.left = `${wiperCssX}px`;

          const wiperCanvasX = progress * width;
          // Clear fog along wiper path
          fogCtx.save();
          fogCtx.clearRect(0, 0, wiperCanvasX, height);
          fogCtx.restore();

          // Remove droplets passed by the wiper
          for (let d = drops.length - 1; d >= 0; d--) {
            if (drops[d].x <= wiperCanvasX + 15) {
              drops.splice(d, 1);
            }
          }

          if (progress >= 1.0) {
            wiperState.active = false;
            wiperBladeEl.classList.remove('active');
          }
        }

        // Drizzle settling tied to intensity slider
        if (rainIntensity > 0.02 && Math.random() < rainIntensity * 1.1) {
          const spawnCount = Math.floor(1 + Math.random() * (rainIntensity * 2.5));
          for (let k = 0; k < spawnCount; k++) {
            spawnBead(Math.random() * width, Math.random() * height, 1.0 + Math.random() * 1.3);
          }
        }

        // Runoff drops from the top window frame
        if (rainIntensity > 0.18 && Math.random() < rainIntensity * 0.28) {
          spawnHeavyDrop(Math.random() * width, 5);
        }

        // Update drops simulation
        fogCtx.save();
        fogCtx.globalCompositeOperation = 'destination-out';

        for (let i = drops.length - 1; i >= 0; i--) {
          const drop = drops[i];

          // Resting bead behavior
          if (!drop.isMover) {
            drop.swellCounter += dt;
            // Resting beads swell randomly
            if (drop.swellCounter > 0.8) {
              drop.swellCounter = 0;
              if (Math.random() < 0.22 * rainIntensity) {
                drop.r += 0.04 + Math.random() * 0.08;
                drop.rx = drop.r;
                drop.ry = drop.r;
              }
            }

            // Let go once they exceed personal release radius (4.6 - 7.5 px)
            if (drop.r >= drop.releaseRadius) {
              drop.isMover = true;
              drop.vy = 0.8 + Math.random() * 0.6;
            }
          }

          // Mover (sliding drop) behavior
          if (drop.isMover) {
            // Size-dependent terminal velocity
            const vTerm = (2.2 + drop.r * 1.15) * (0.6 + rainIntensity * 0.6);
            drop.vy = Math.min(vTerm, drop.vy + 0.24);

            // Sideways wobble & meander
            drop.wobblePhase += 0.07 * drop.vy;
            drop.vx = Math.sin(drop.wobblePhase) * (0.35 + drop.r * 0.09) + (Math.random() - 0.5) * 0.25;

            const prevY = drop.y;
            drop.x += drop.vx;
            drop.y += drop.vy;

            // Stretch vertically with speed
            const stretch = 1 + drop.vy * 0.12;
            drop.ry = drop.r * stretch;
            drop.rx = drop.r / Math.sqrt(stretch);

            // Sliding drops clear condensation along their path, leaving clear streaks that re-fog
            fogCtx.beginPath();
            fogCtx.ellipse(drop.x, drop.y, drop.rx * 1.12, drop.ry * 1.08, 0, 0, Math.PI * 2);
            fogCtx.fill();

            // Leave a trail of small beads while losing mass
            drop.trailCounter += drop.vy;
            if (drop.trailCounter > (15 + Math.random() * 18)) {
              drop.trailCounter = 0;
              const trailR = 0.8 + Math.random() * 0.7;
              spawnBead(drop.x - drop.vx * 1.2, prevY - drop.ry * 0.6, trailR);
              // Mass reduction
              drop.r = Math.sqrt(Math.max(1.1, drop.r * drop.r - trailR * trailR));
            }

            // Absorb any bead or drop they touch (radius combined by area: sqrt(r1^2 + r2^2))
            for (let j = drops.length - 1; j >= 0; j--) {
              if (i === j) continue;
              const other = drops[j];
              const dist = Math.hypot(drop.x - other.x, drop.y - other.y);
              if (dist < drop.rx + other.rx) {
                drop.r = Math.sqrt(drop.r * drop.r + other.r * other.r);
                drop.vy += 0.7; // Sudden acceleration burst upon absorbing mass
                drops.splice(j, 1);
                if (j < i) i--;
              }
            }

            // Convert back to bead once they shrink below 2.4 px
            if (drop.r < 2.4) {
              drop.isMover = false;
              drop.vx = 0;
              drop.vy = 0;
              drop.rx = drop.r;
              drop.ry = drop.r;
            }

            // Remove drops past bottom edge
            if (drop.y > height + 30) {
              drops.splice(i, 1);
            }
          }
        }
        fogCtx.restore();

        // -----------------------------------------------------------
        // 3. MAIN CANVAS COMPOSITING
        // -----------------------------------------------------------
        // Clear main canvas
        ctx.clearRect(0, 0, width, height);

        // Layer 1: Live City View (scaled from 0.5x cityCanvas)
        ctx.drawImage(cityCanvas, 0, 0, width, height);

        // Layer 2: Condensation Layer composited at 70% alpha
        ctx.globalAlpha = 0.70;
        ctx.drawImage(fogCanvas, 0, 0, width, height);
        ctx.globalAlpha = 1.0;

        // Layer 3: Raindrops on the glass (Refractive Lenses)
        // A. First render tiny beads under 2.4 px (fast two-circle rendering)
        for (let i = 0; i < drops.length; i++) {
          const drop = drops[i];
          if (drop.r < 2.4) {
            // Dark rim / shadow circle
            ctx.fillStyle = 'rgba(12, 18, 28, 0.42)';
            ctx.beginPath();
            ctx.arc(drop.x, drop.y + 0.3, drop.r, 0, Math.PI * 2);
            ctx.fill();

            // Offset upper-left specular highlight dot
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.arc(drop.x - drop.r * 0.35, drop.y - drop.r * 0.35, Math.max(0.65, drop.r * 0.38), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // B. Render refractive drops >= 2.4 px
        for (let i = 0; i < drops.length; i++) {
          const drop = drops[i];
          if (drop.r >= 2.4) {
            const rx = drop.rx;
            const ry = drop.ry;

            // 1. Soft dark shadow under the drop on the fog
            const shX = drop.x + rx * 0.18;
            const shY = drop.y + ry * 0.26;
            const shR = Math.max(rx, ry) * 1.5;
            const shGrad = ctx.createRadialGradient(shX, shY, 0, shX, shY, shR);
            shGrad.addColorStop(0, 'rgba(4, 8, 16, 0.45)');
            shGrad.addColorStop(0.55, 'rgba(4, 8, 16, 0.18)');
            shGrad.addColorStop(1, 'rgba(4, 8, 16, 0)');

            ctx.fillStyle = shGrad;
            ctx.beginPath();
            ctx.ellipse(shX, shY, rx * 1.35, ry * 1.35, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. Refraction: clip ellipse, draw city canvas flipped vertically (scale(1,-1)) and minified by factor of 2.3
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(drop.x, drop.y, rx, ry, 0, 0, Math.PI * 2);
            ctx.clip();

            ctx.translate(drop.x, drop.y);
            ctx.scale(1 / 2.3, -1 / 2.3);
            ctx.drawImage(cityCanvas, -drop.x, -drop.y, width, height);

            ctx.restore();

            // 3. Over the refraction:
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(drop.x, drop.y, rx, ry, 0, 0, Math.PI * 2);
            ctx.clip();

            // Faint white lift
            ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
            ctx.fill();

            // Radial rim shadow darkening to 42% at the edge
            const maxR = Math.max(rx, ry);
            const rimGrad = ctx.createRadialGradient(drop.x, drop.y, maxR * 0.35, drop.x, drop.y, maxR);
            rimGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
            rimGrad.addColorStop(0.70, 'rgba(0, 0, 0, 0.15)');
            rimGrad.addColorStop(1, 'rgba(0, 0, 0, 0.42)');

            ctx.fillStyle = rimGrad;
            ctx.fill();

            // Offset specular highlight at the upper-left
            const hlX = drop.x - rx * 0.36;
            const hlY = drop.y - ry * 0.36;
            const hlR = Math.min(rx, ry) * 0.48;
            const hlGrad = ctx.createRadialGradient(hlX, hlY, 0, hlX, hlY, hlR);
            hlGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            hlGrad.addColorStop(0.42, 'rgba(255, 245, 220, 0.65)');
            hlGrad.addColorStop(1, 'rgba(255, 245, 220, 0)');

            ctx.fillStyle = hlGrad;
            ctx.beginPath();
            ctx.ellipse(hlX, hlY, rx * 0.42, ry * 0.28, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Subtle bottom-right caustic internal rim
            const cbX = drop.x + rx * 0.32;
            const cbY = drop.y + ry * 0.32;
            const cbR = Math.min(rx, ry) * 0.42;
            const cbGrad = ctx.createRadialGradient(cbX, cbY, 0, cbX, cbY, cbR);
            cbGrad.addColorStop(0, 'rgba(255, 215, 160, 0.25)');
            cbGrad.addColorStop(1, 'rgba(255, 215, 160, 0)');

            ctx.fillStyle = cbGrad;
            ctx.beginPath();
            ctx.ellipse(cbX, cbY, rx * 0.35, ry * 0.24, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }
        }
      }

      requestAnimationFrame(animate);

    })();
  </script>
</body>
</html>
