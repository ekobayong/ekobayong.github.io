<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Window — Rain on Glass</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #05070f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e9e4da;
  }
  #viewport-frame {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas#mainCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }
  /* Room Reflection & Ambience */
  .room-reflection-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
  }
  .warm-glow {
    position: absolute;
    top: -15vw;
    right: -15vw;
    width: 65vw;
    height: 65vw;
    background: radial-gradient(circle, rgba(255, 179, 92, 0.28) 0%, rgba(255, 130, 45, 0.12) 40%, rgba(5, 7, 15, 0) 75%);
    border-radius: 50%;
    filter: blur(40px);
    animation: lampBreathe 7s ease-in-out infinite alternate;
  }
  .lamp-reflection {
    position: absolute;
    top: 6%;
    right: 7%;
    width: 220px;
    height: 380px;
    opacity: 0.32;
    filter: blur(1.5px);
    transform: scaleX(-1);
    animation: lampBreathe 7s ease-in-out infinite alternate;
  }
  @keyframes lampBreathe {
    0% { opacity: 0.26; transform: scaleX(-1) translateY(0px); }
    100% { opacity: 0.38; transform: scaleX(-1) translateY(-3px); }
  }
  /* Dark Wooden Window Frame & Vignette */
  .window-sash-frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    box-shadow: 
      inset 0 0 120px 40px rgba(2, 3, 8, 0.85),
      inset 0 0 40px 10px rgba(4, 5, 12, 0.95),
      inset 0 0 0 16px #120e0c,
      inset 0 0 0 20px #241c17,
      inset 0 0 0 24px #0a0807;
    background: 
      radial-gradient(ellipse at center, transparent 65%, rgba(2, 3, 6, 0.7) 100%),
      repeating-linear-gradient(90deg, transparent 0, rgba(0,0,0,0.03) 2px, transparent 4px);
  }
  /* Heads-Up Display */
  .hud-header {
    position: absolute;
    top: 36px;
    left: 44px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 14px rgba(0,0,0,0.85);
  }
  .hud-title {
    font-family: "Georgia", serif;
    font-style: italic;
    font-size: 2.2rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: #f7f4ee;
    line-height: 1.1;
  }
  .hud-subtitle {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: #ffb35c;
    margin-top: 5px;
  }
  .hud-status {
    margin-top: 14px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: #b8c4d6;
    display: flex;
    gap: 16px;
  }
  .hud-status span.accent {
    color: #ffb35c;
  }
  /* Controls UI */
  .controls-pill {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: rgba(18, 24, 38, 0.45);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 9999px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 22px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    opacity: 0.35;
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s ease;
  }
  .controls-pill:hover, .controls-pill:focus-within {
    opacity: 1;
    transform: translateX(-50%) translateY(-2px);
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    font-weight: 500;
    color: #ccd6e4;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .control-group label {
    cursor: pointer;
  }
  .range-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 95px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.2);
    outline: none;
    cursor: pointer;
  }
  .range-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffb35c;
    box-shadow: 0 0 8px rgba(255, 179, 92, 0.8);
    cursor: pointer;
  }
  .btn-action {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e9e4da;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-action:hover {
    background: rgba(255, 179, 92, 0.25);
    border-color: #ffb35c;
    color: #fff;
  }
  .instruction-hint {
    position: absolute;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(233, 228, 218, 0.45);
    transition: opacity 0.5s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .warm-glow, .lamp-reflection {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div id="viewport-frame">
  <canvas id="mainCanvas"></canvas>

  <div class="room-reflection-layer">
    <div class="warm-glow"></div>
    <svg class="lamp-reflection" viewBox="0 0 100 180">
      <defs>
        <linearGradient id="shadeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd9a3" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#ff9b3c" stop-opacity="0.9" />
        </linearGradient>
        <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="35%" stop-color="#ffbe6b" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#ff8926" stop-opacity="0" />
        </radialGradient>
      </defs>
      <!-- Cord & Finial -->
      <line x1="50" y1="0" x2="50" y2="40" stroke="#1f1815" stroke-width="2" />
      <polygon points="50,38 46,45 54,45" fill="#423023" />
      <!-- Bulb light halo -->
      <circle cx="50" cy="74" r="38" fill="url(#bulbGlow)" />
      <!-- Shade -->
      <polygon points="32,45 68,45 84,86 16,86" fill="url(#shadeGrad)" stroke="#c27329" stroke-width="1.2" />
      <!-- Stem and base below -->
      <line x1="50" y1="86" x2="50" y2="152" stroke="#251a14" stroke-width="4" stroke-linecap="round" />
      <ellipse cx="50" cy="154" rx="26" ry="7" fill="#1b130f" stroke="#3d2a1e" stroke-width="1.5" />
      <!-- Table top rim reflection -->
      <line x1="5" y1="162" x2="95" y2="162" stroke="rgba(255, 179, 92, 0.3)" stroke-width="2" stroke-linecap="round" />
    </svg>
  </div>

  <div class="window-sash-frame"></div>

  <header class="hud-header">
    <h1 class="hud-title">Night Window</h1>
    <div class="hud-subtitle">Quiet Solitude &bull; City Rain</div>
    <div class="hud-status">
      <div id="clockDisplay">00:00:00</div>
      <div id="weatherDisplay" class="accent">Steady Gentle Rain</div>
    </div>
  </header>

  <div class="instruction-hint" id="hintPrompt">Wipe glass to clear fog &bull; Click to add heavy drop</div>

  <div class="controls-pill">
    <div class="control-group">
      <label for="intensitySlider">Rain</label>
      <input type="range" id="intensitySlider" class="range-slider" min="1" max="100" value="48">
    </div>
    <div class="control-group">
      <label for="steamSlider">Mist</label>
      <input type="range" id="steamSlider" class="range-slider" min="1" max="100" value="45">
    </div>
    <button class="btn-action" id="btnWipe">Wipe All</button>
  </div>
</div>

<script>
(() => {
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Clock
  const clockEl = document.getElementById('clockDisplay');
  const weatherEl = document.getElementById('weatherDisplay');
  const sliderRain = document.getElementById('intensitySlider');
  const sliderMist = document.getElementById('steamSlider');
  const btnWipe = document.getElementById('btnWipe');
  const hintPrompt = document.getElementById('hintPrompt');

  function updateClock() {
    const d = new Date();
    clockEl.textContent = d.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();

  function updateWeatherText() {
    const val = parseInt(sliderRain.value, 10);
    if (val < 20) weatherEl.textContent = "Distant Sparse Drizzle";
    else if (val < 45) weatherEl.textContent = "Soft Evening Rain";
    else if (val < 75) weatherEl.textContent = "Steady Downpour";
    else weatherEl.textContent = "Torrential Autumn Storm";
  }
  sliderRain.addEventListener('input', updateWeatherText);
  updateWeatherText();

  // Canvas & Resolution setup
  const mainCanvas = document.getElementById('mainCanvas');
  const ctx = mainCanvas.getContext('2d', { alpha: false });

  let width = 0;
  let height = 0;
  let dpr = 1;

  // Offscreen Canvas Layers
  const cityCanvas = document.createElement('canvas');
  const cityCtx = cityCanvas.getContext('2d');

  const blurSkylineCanvas = document.createElement('canvas');
  const blurSkylineCtx = blurSkylineCanvas.getContext('2d');

  const fogCanvas = document.createElement('canvas');
  const fogCtx = fogCanvas.getContext('2d');

  // Pre-rendered light sprites
  const lightColors = [
    'rgb(255,178,82)',   // Sodium amber
    'rgb(255,233,190)',  // Warm white
    'rgb(110,180,255)',  // Cool blue
    'rgb(255,96,140)',   // Neon pink
    'rgb(90,240,190)',   // Mint
    'rgb(200,120,255)',  // Violet
    'rgb(255,200,110)',  // Rich amber
    'rgb(140,210,255)'   // Cyan
  ];
  const spriteMap = [];

  function buildSprites() {
    spriteMap.length = 0;
    const sizes = [12, 24, 48, 72];
    for (const color of lightColors) {
      const variants = [];
      for (const rad of sizes) {
        const c = document.createElement('canvas');
        c.width = rad * 2;
        c.height = rad * 2;
        const cx = c.getContext('2d');
        const g = cx.createRadialGradient(rad, rad, 0, rad, rad, rad);
        g.addColorStop(0, color.replace('rgb', 'rgba').replace(')', ', 0.95)'));
        g.addColorStop(0.3, color.replace('rgb', 'rgba').replace(')', ', 0.6)'));
        g.addColorStop(0.7, color.replace('rgb', 'rgba').replace(')', ', 0.18)'));
        g.addColorStop(1, color.replace('rgb', 'rgba').replace(')', ', 0)'));
        cx.fillStyle = g;
        cx.beginPath();
        cx.arc(rad, rad, rad, 0, Math.PI * 2);
        cx.fill();
        variants.push({ canvas: c, rad: rad });
      }
      spriteMap.push(variants);
    }
  }
  buildSprites();

  // City Scene Data
  interface BokehLight {
    x: number;
    y: number;
    sizeIdx: number;
    colorIdx: number;
    freq: number;
    phase: number;
    flicker: boolean;
    alpha: number;
  }
  let bokehLights = [];
  let streakRain = [];

  function resizeLayers() {
    const rawDpr = window.devicePixelRatio || 1;
    let effectiveDpr = Math.min(2, rawDpr);
    const rawArea = window.innerWidth * window.innerHeight * effectiveDpr * effectiveDpr;
    if (rawArea > 7e6) {
      effectiveDpr = Math.sqrt(7e6 / (window.innerWidth * window.innerHeight));
    }
    dpr = effectiveDpr;

    width = Math.floor(window.innerWidth * dpr);
    height = Math.floor(window.innerHeight * dpr);

    mainCanvas.width = width;
    mainCanvas.height = height;

    // Fog Layer (Full Resolution)
    fogCanvas.width = width;
    fogCanvas.height = height;
    initFog(true);

    // Live City Layer (0.5x Scale)
    cityCanvas.width = Math.max(10, Math.floor(width * 0.5));
    cityCanvas.height = Math.max(10, Math.floor(height * 0.5));

    // Static Blurred Skyline Layer (0.5x)
    blurSkylineCanvas.width = cityCanvas.width;
    blurSkylineCanvas.height = cityCanvas.height;
    renderStaticSkyline();

    initBokehAndStreaks();
  }

  function initFog(full = false) {
    fogCtx.save();
    if (full) {
      fogCtx.fillStyle = 'rgb(206, 219, 232)';
      fogCtx.fillRect(0, 0, width, height);

      // Naturally thinner condensation near center from indoor air draft
      const g = fogCtx.createRadialGradient(width * 0.5, height * 0.52, width * 0.1, width * 0.5, height * 0.5, width * 0.7);
      g.addColorStop(0, 'rgba(0,0,0,0.18)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      fogCtx.globalCompositeOperation = 'destination-out';
      fogCtx.fillStyle = g;
      fogCtx.fillRect(0, 0, width, height);
    }
    fogCtx.restore();
  }

  function renderStaticSkyline() {
    const sw = blurSkylineCanvas.width;
    const sh = blurSkylineCanvas.height;
    const bctx = blurSkylineCtx;

    // Sky gradient: #04060f -> #0b1024 -> #2a1b2c -> #3a2418
    const sky = bctx.createLinearGradient(0, 0, 0, sh);
    sky.addColorStop(0.0, '#04060f');
    sky.addColorStop(0.45, '#0b1024');
    sky.addColorStop(0.82, '#2a1b2c');
    sky.addColorStop(1.0, '#3a2418');
    bctx.fillStyle = sky;
    bctx.fillRect(0, 0, sw, sh);

    // Generate dark buildings
    bctx.save();
    if (bctx.filter) bctx.filter = 'blur(6px)';

    let currX = 0;
    while (currX < sw) {
      const bWidth = 35 + Math.random() * 85;
      const bHeight = sh * (0.28 + Math.random() * 0.42);
      const bY = sh - bHeight;
      const lum = Math.floor(8 + Math.random() * 11); // rgb 8-18
      bctx.fillStyle = `rgb(${lum}, ${lum + 2}, ${lum + 6})`;
      bctx.fillRect(currX, bY, bWidth, bHeight);

      // Spire or water tower
      if (Math.random() > 0.6) {
        bctx.fillRect(currX + bWidth * 0.45, bY - 18, Math.max(2, bWidth * 0.1), 18);
      }
      currX += bWidth - (Math.random() * 8); // slight overlap
    }
    bctx.restore();
  }

  function initBokehAndStreaks() {
    const sw = cityCanvas.width;
    const sh = cityCanvas.height;
    bokehLights = [];

    // 1. Lit windows in building lattice (14x18 px lattice)
    const latticeCols = Math.floor(sw / 18);
    for (let c = 0; c < latticeCols; c++) {
      if (Math.random() > 0.82) continue; // Alley gaps
      const colX = c * 18 + 8;
      const topY = sh * (0.35 + Math.random() * 0.25);
      for (let y = topY; y < sh - 20; y += 14) {
        if (Math.random() < 0.42) { // window lit probability
          const colIdx = Math.random() < 0.75 ? 0 : (Math.random() < 0.6 ? 1 : 2);
          bokehLights.push({
            x: colX + (Math.random() * 4 - 2),
            y: y + (Math.random() * 3 - 1.5),
            sizeIdx: 0, // 12px rad
            colorIdx: colIdx,
            freq: 0.8 + Math.random() * 3.5,
            phase: Math.random() * Math.PI * 2,
            flicker: Math.random() < 0.15,
            alpha: 0.4 + Math.random() * 0.55
          });
        }
      }
    }

    // 2. 46 large street/signage discs low down
    for (let i = 0; i < 46; i++) {
      bokehLights.push({
        x: Math.random() * sw,
        y: sh * (0.75 + Math.random() * 0.24),
        sizeIdx: Math.floor(1 + Math.random() * 3), // 24 to 72px
        colorIdx: Math.floor(Math.random() * lightColors.length),
        freq: 0.5 + Math.random() * 2.0,
        phase: Math.random() * Math.PI * 2,
        flicker: Math.random() < 0.25,
        alpha: 0.5 + Math.random() * 0.45
      });
    }

    // 3. Dozen high beacons atop skyline
    for (let i = 0; i < 12; i++) {
      bokehLights.push({
        x: (i / 12) * sw + (Math.random() * 40 - 20),
        y: sh * (0.28 + Math.random() * 0.2),
        sizeIdx: 0,
        colorIdx: Math.random() < 0.7 ? 3 : 0, // red/pink or amber beacon
        freq: 2.5 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
        flicker: false,
        alpha: 0.85
      });
    }

    // Rain streaks behind glass (70 faint diagonal streaks)
    streakRain = [];
    for (let i = 0; i < 70; i++) {
      streakRain.push({
        x: Math.random() * sw * 1.3,
        y: Math.random() * sh,
        len: 25 + Math.random() * 45,
        speed: 16 + Math.random() * 22,
        alpha: 0.04 + Math.random() * 0.08
      });
    }
  }

  function renderCityLayer(time) {
    const sw = cityCanvas.width;
    const sh = cityCanvas.height;

    // Blit pre-blurred skyline base
    cityCtx.globalCompositeOperation = 'source-over';
    cityCtx.drawImage(blurSkylineCanvas, 0, 0);

    // Behind-glass diagonal falling rain streaks
    cityCtx.lineWidth = 1;
    cityCtx.strokeStyle = 'rgba(215, 230, 255, 0.08)';
    const streakSlope = 0.24; // slight wind tilt
    for (const s of streakRain) {
      s.y += s.speed;
      s.x += s.speed * streakSlope;
      if (s.y > sh + s.len) {
        s.y = -s.len;
        s.x = Math.random() * sw * 1.4 - sw * 0.2;
      }
      cityCtx.beginPath();
      cityCtx.strokeStyle = `rgba(200, 225, 255, ${s.alpha})`;
      cityCtx.moveTo(s.x, s.y);
      cityCtx.lineTo(s.x - s.len * streakSlope, s.y - s.len);
      cityCtx.stroke();
    }

    // Draw Bokeh Lights with twinkling
    cityCtx.globalCompositeOperation = 'screen';
    for (const b of bokehLights) {
      let lum = b.alpha;
      if (!reducedMotion) {
        const sineMod = Math.sin(time * b.freq + b.phase);
        lum += sineMod * 0.22;
        if (b.flicker && Math.random() < 0.04) {
          lum *= 0.35;
        }
      }
      lum = Math.max(0.08, Math.min(1.0, lum));

      const spriteObj = spriteMap[b.colorIdx][b.sizeIdx];
      const rad = spriteObj.rad;
      cityCtx.globalAlpha = lum;
      cityCtx.drawImage(spriteObj.canvas, b.x - rad, b.y - rad);
    }
    cityCtx.globalAlpha = 1.0;
  }

  // Droplet Physics Simulation
  class Drop {
    constructor(x, y, r, isMover = false) {
      this.x = x;
      this.y = y;
      this.r = r;
      this.isMover = isMover;
      this.vy = 0;
      this.vx = 0;
      this.wobblePhase = Math.random() * Math.PI * 2;
      this.releaseRadius = 4.6 + Math.random() * 2.9; // 4.6 - 7.5 px
      this.stretch = 1;
      this.trailCounter = 0;
    }
  }

  let beads = [];
  let wipeSweepX = null; // for "Wipe All" effect

  function spawnInitialDrizzle() {
    beads = [];
    const count = Math.floor((width * height) / 9000);
    for (let i = 0; i < count; i++) {
      const r = 0.8 + Math.random() * 3.4;
      beads.push(new Drop(Math.random() * width, Math.random() * height, r));
    }
  }

  function addHeavyDrop(x, y) {
    const r = 6.8 + Math.random() * 3.5;
    const drop = new Drop(x, y, r, true);
    drop.vy = 2.5 + Math.random() * 3;
    beads.push(drop);

    // Clear condensation immediately at impact point
    fogCtx.save();
    fogCtx.globalCompositeOperation = 'destination-out';
    fogCtx.beginPath();
    fogCtx.arc(x, y, r * 2.8, 0, Math.PI * 2);
    fogCtx.fill();
    fogCtx.restore();
  }

  function updateDrops(dt) {
    const intensity = parseInt(sliderRain.value, 10) / 100;
    const spawnRate = intensity * 1.8;

    // Natural settlement
    if (Math.random() < spawnRate) {
      const r = 0.8 + Math.random() * 2.6;
      beads.push(new Drop(Math.random() * width, Math.random() * height, r));
    }

    // Dynamic condensation regeneration
    const mistStrength = (parseInt(sliderMist.value, 10) / 100) * 0.0075 + 0.001;
    fogCtx.fillStyle = `rgba(206, 219, 232, ${mistStrength})`;
    fogCtx.fillRect(0, 0, width, height);

    // Handle Wipe Sweep animation
    if (wipeSweepX !== null) {
      const sweepSpeed = width * 1.8 * dt;
      const prevX = wipeSweepX;
      wipeSweepX += sweepSpeed;

      // Erase fog
      fogCtx.save();
      fogCtx.globalCompositeOperation = 'destination-out';
      fogCtx.fillStyle = '#000';
      fogCtx.fillRect(prevX - 10, 0, sweepSpeed + 25, height);
      fogCtx.restore();

      // Clear drops
      beads = beads.filter(b => b.x > wipeSweepX || b.x < prevX - 30);

      if (wipeSweepX > width + 50) {
        wipeSweepX = null;
      }
    }

    fogCtx.save();
    fogCtx.globalCompositeOperation = 'destination-out';

    const moversToSpawnTrails = [];

    for (let i = 0; i < beads.length; i++) {
      const d = beads[i];

      if (!d.isMover) {
        // Slow natural swell
        if (Math.random() < 0.004 * intensity) {
          d.r += 0.12 + Math.random() * 0.18;
        }
        if (d.r >= d.releaseRadius) {
          d.isMover = true;
          d.vy = 1.0 + Math.random() * 2.0;
        }
      } else {
        // Mover dynamics
        // Terminal velocity proportional to mass (approx r^1.4)
        const vTerm = Math.min(15, 3.5 + Math.pow(d.r, 1.35) * 0.85);
        d.vy += (vTerm - d.vy) * (0.04 + Math.random() * 0.03);

        // Wobble sideways
        d.wobblePhase += 0.22;
        d.vx = Math.sin(d.wobblePhase) * (d.vy * 0.16);

        d.x += d.vx;
        d.y += d.vy;

        d.stretch = Math.min(2.4, 1 + d.vy * 0.065);

        // Clear fog path
        fogCtx.beginPath();
        fogCtx.ellipse(d.x, d.y, d.r * 1.8, d.r * d.stretch * 1.6, 0, 0, Math.PI * 2);
        fogCtx.fill();

        // Trail of droplets
        d.trailCounter += d.vy;
        if (d.trailCounter > (18 + Math.random() * 22)) {
          d.trailCounter = 0;
          const trailR = 0.7 + Math.random() * 1.4;
          moversToSpawnTrails.push(new Drop(d.x + (Math.random() * 3 - 1.5), d.y - d.r * d.stretch, trailR));
          // mass loss
          d.r = Math.max(1.5, Math.sqrt(Math.max(1, d.r * d.r - trailR * trailR * 1.5)));
        }

        // Drop shrinking below bead threshold settles
        if (d.r < 2.4 && d.vy < 3.0) {
          d.isMover = false;
          d.stretch = 1;
        }
      }
    }
    fogCtx.restore();

    if (moversToSpawnTrails.length > 0) {
      beads.push(...moversToSpawnTrails);
    }

    // Merging & Absorption: Collisions between Movers & Beads or large drops
    for (let i = 0; i < beads.length; i++) {
      const d1 = beads[i];
      if (!d1.isMover) continue;

      for (let j = 0; j < beads.length; j++) {
        if (i === j) continue;
        const d2 = beads[j];
        const dx = d1.x - d2.x;
        const dy = d1.y - d2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < (d1.r * d1.stretch + d2.r)) {
          // Absorb by area
          const area1 = Math.PI * d1.r * d1.r;
          const area2 = Math.PI * d2.r * d2.r;
          d1.r = Math.min(18, Math.sqrt((area1 + area2) / Math.PI));
          d1.vy = Math.min(16, d1.vy + 0.3); // slight kick
          // remove d2
          beads.splice(j, 1);
          if (j < i) i--;
          j--;
        }
      }
    }

    // Remove drops leaving screen
    beads = beads.filter(d => d.y - d.r * 2 < height + 40 && d.x > -50 && d.x < width + 50);
  }

  function drawRefractiveDrop(d) {
    const rx = d.r;
    const ry = d.r * (d.isMover ? d.stretch : 1);

    // A. Tiny beads under 2.4 px: Fast 2-circle rendering
    if (rx < 2.4) {
      // Dark contact rim
      ctx.fillStyle = 'rgba(20, 25, 35, 0.45)';
      ctx.beginPath();
      ctx.arc(d.x, d.y + 0.5, rx, 0, Math.PI * 2);
      ctx.fill();

      // Highlight core
      ctx.fillStyle = 'rgba(235, 245, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(d.x - rx * 0.3, d.y - ry * 0.3, rx * 0.6, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    ctx.save();

    // Soft dark ambient drop shadow on fog
    ctx.beginPath();
    ctx.ellipse(d.x + 1, d.y + 2, rx + 1.2, ry + 1.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(5, 8, 18, 0.38)';
    ctx.fill();

    // Clip to droplet body
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    // Refraction: Inverted, minified city view
    // scale(1, -1) flipped vertically, minified 2.3x
    const mag = 2.3;
    const srcW = (rx * 2) * mag * 0.5; // accounts for 0.5x cityCanvas
    const srcH = (ry * 2) * mag * 0.5;
    const srcX = Math.max(0, Math.min(cityCanvas.width - srcW, (d.x * 0.5) - (srcW * 0.5)));
    const srcY = Math.max(0, Math.min(cityCanvas.height - srcH, (d.y * 0.5) - (srcH * 0.5)));

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.scale(1, -1);
    ctx.drawImage(
      cityCanvas,
      srcX, srcY, srcW, srcH,
      -rx, -ry, rx * 2, ry * 2
    );
    ctx.restore();

    // Faint white glass lift inside drop
    ctx.fillStyle = 'rgba(220, 235, 255, 0.12)';
    ctx.fill();

    // Radial rim shadow darkening to 42% at the outer edge
    const rim = ctx.createRadialGradient(d.x, d.y, rx * 0.35, d.x, d.y, rx);
    rim.addColorStop(0, 'rgba(10, 15, 25, 0)');
    rim.addColorStop(0.7, 'rgba(10, 15, 25, 0.15)');
    rim.addColorStop(1, 'rgba(10, 15, 25, 0.42)');
    ctx.fillStyle = rim;
    ctx.fill();

    // Offset upper-left specular glint
    const hlX = d.x - rx * 0.36;
    const hlY = d.y - ry * 0.36;
    const hlRad = rx * 0.45;
    const hlGrad = ctx.createRadialGradient(hlX, hlY, 0, hlX, hlY, hlRad);
    hlGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
    hlGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.5)');
    hlGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = hlGrad;
    ctx.beginPath();
    ctx.ellipse(hlX, hlY, hlRad, hlRad * 0.75, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    // Subtle bottom bounce highlight from streetlights
    const bhlY = d.y + ry * 0.55;
    const bhlGrad = ctx.createRadialGradient(d.x, bhlY, 0, d.x, bhlY, rx * 0.6);
    bhlGrad.addColorStop(0, 'rgba(255, 200, 130, 0.35)');
    bhlGrad.addColorStop(1, 'rgba(255, 200, 130, 0)');
    ctx.fillStyle = bhlGrad;
    ctx.beginPath();
    ctx.arc(d.x, bhlY, rx * 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Pointer Interaction (Wiping glass & knocking off beads)
  let isPointerDown = false;
  let lastPtrX = null;
  let lastPtrY = null;

  function wipeAt(px, py, prevX, prevY) {
    hintPrompt.style.opacity = '0';
    const wipeRadius = Math.min(width, height) * 0.065;

    fogCtx.save();
    fogCtx.globalCompositeOperation = 'destination-out';

    // Interpolate samples for continuous smooth finger trail
    const dx = px - prevX;
    const dy = py - prevY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const steps = Math.max(1, Math.floor(dist / (wipeRadius * 0.35)));

    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const ix = prevX + dx * t;
      const iy = prevY + dy * t;

      const g = fogCtx.createRadialGradient(ix, iy, wipeRadius * 0.2, ix, iy, wipeRadius);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.7, 'rgba(0,0,0,0.85)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      fogCtx.fillStyle = g;
      fogCtx.beginPath();
      fogCtx.arc(ix, iy, wipeRadius, 0, Math.PI * 2);
      fogCtx.fill();
    }
    fogCtx.restore();

    // Knock small beads off wipe path
    beads = beads.filter(b => {
      const dsq = (b.x - px) * (b.x - px) + (b.y - py) * (b.y - py);
      return dsq > (wipeRadius * 0.9) * (wipeRadius * 0.9);
    });
  }

  function getCanvasCoords(e) {
    const r = mainCanvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) * dpr;
    const cy = (e.clientY - r.top) * dpr;
    return [cx, cy];
  }

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.controls-pill')) return;
    isPointerDown = true;
    const [cx, cy] = getCanvasCoords(e);
    lastPtrX = cx;
    lastPtrY = cy;
    wipeAt(cx, cy, cx, cy);
  });

  window.addEventListener('pointermove', (e) => {
    if (!isPointerDown) return;
    const [cx, cy] = getCanvasCoords(e);
    wipeAt(cx, cy, lastPtrX, lastPtrY);
    lastPtrX = cx;
    lastPtrY = cy;
  });

  window.addEventListener('pointerup', () => {
    isPointerDown = false;
  });

  // Clicking on glass adds a heavy drop
  mainCanvas.addEventListener('click', (e) => {
    const [cx, cy] = getCanvasCoords(e);
    addHeavyDrop(cx, cy);
  });

  // Wipe All Action
  btnWipe.addEventListener('click', () => {
    wipeSweepX = 0;
  });

  // Main Render Loop
  let lastTime = 0;
  function animate(timestamp) {
    const timeSec = timestamp * 0.001;
    const dt = Math.min(0.05, timeSec - lastTime || 0.016);
    lastTime = timeSec;

    // 1. Update & Render city canvas
    renderCityLayer(timeSec);

    // 2. Update drop positions & mist regeneration
    updateDrops(dt);

    // 3. Draw City to Screen
    ctx.drawImage(cityCanvas, 0, 0, width, height);

    // 4. Composite Condensation Fog at 70% opacity
    ctx.save();
    ctx.globalAlpha = 0.70;
    ctx.drawImage(fogCanvas, 0, 0);
    ctx.restore();

    // 5. Draw Refractive Raindrops on top of glass/fog
    for (let i = 0; i < beads.length; i++) {
      drawRefractiveDrop(beads[i]);
    }

    requestAnimationFrame(animate);
  }

  // Initialization & Resize Listener
  window.addEventListener('resize', () => {
    resizeLayers();
    spawnInitialDrizzle();
  });

  resizeLayers();
  spawnInitialDrizzle();
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
