<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — A CSS 3D Solar System</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  :root {
    --bg-dark: #02030a;
    --amber: #ffb52e;
    --text: #e8ecf5;
    --text-dim: #9aa4bf;
    --glass-bg: rgba(10, 14, 30, 0.72);
    --glass-border: 1px solid rgba(255, 255, 255, 0.10);
    --font-serif: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", Palatino, Georgia, serif;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: var(--font-sans);
    color: var(--text);
    touch-action: none;
  }

  /* Nebulae background */
  #cosmos {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(circle at 12% 88%, rgba(60, 30, 120, 0.25) 0%, transparent 60%),
      radial-gradient(circle at 88% 12%, rgba(20, 70, 120, 0.22) 0%, transparent 60%);
  }

  #stars-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* 3D Scene Viewport */
  .viewport {
    position: absolute;
    inset: 0;
    perspective: 1400px;
    display: grid;
    place-items: center;
    overflow: hidden;
    z-index: 2;
    cursor: grab;
  }
  .viewport:active {
    cursor: grabbing;
  }

  .camera-pivot {
    position: absolute;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* Celestial Base Elements */
  .orbit-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 0 12px rgba(120, 170, 255, 0.08), inset 0 0 8px rgba(120, 170, 255, 0.05);
    transform-style: preserve-3d;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }

  .orbital-carrier {
    position: absolute;
    top: 0;
    left: 0;
    transform-style: preserve-3d;
    width: 0;
    height: 0;
  }

  .planet-anchor {
    position: absolute;
    transform-style: preserve-3d;
    width: 0;
    height: 0;
  }

  /* Hitboxes and Disc Billboards */
  .celestial-target {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 12px;
    outline: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    pointer-events: auto;
  }
  .celestial-target:focus-visible .disc {
    outline: 2px solid var(--amber);
    outline-offset: 4px;
  }

  .disc {
    position: relative;
    border-radius: 50%;
    transform-style: preserve-3d;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
    overflow: hidden;
    pointer-events: none;
  }

  /* Terminator dynamic overlay */
  .disc::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    background: radial-gradient(circle at var(--lit-x, 50%) var(--lit-y, 50%), transparent 35%, rgba(0, 0, 3, 0.88) 78%, rgba(0, 0, 0, 0.98) 100%);
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  /* The Sun */
  .sun-body {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fff9d6 0%, #ffe28a 25%, #ffb428 55%, #ff7a12 80%, #ff4d00 100%);
    box-shadow:
      0 0 35px #ffb428,
      0 0 85px rgba(255, 122, 18, 0.7),
      0 0 180px rgba(255, 77, 0, 0.45),
      0 0 320px rgba(255, 50, 0, 0.25);
    position: relative;
    transform-style: preserve-3d;
    animation: sunPulse 5s ease-in-out infinite alternate;
  }
  .sun-body::after { display: none; }

  .corona {
    position: absolute;
    inset: -45px;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(14px);
    opacity: 0.65;
  }
  .corona-1 {
    background: conic-gradient(from 0deg, transparent, #ff9f1c, transparent, #ff3800, transparent, #ffd000, transparent);
    animation: spinCorona 24s linear infinite;
  }
  .corona-2 {
    inset: -65px;
    background: conic-gradient(from 180deg, transparent, #ff3c00, rgba(255,200,0,0.4), transparent, #ff7b00, transparent);
    animation: spinCoronaRev 34s linear infinite;
    opacity: 0.45;
  }

  @keyframes spinCorona { 100% { transform: rotate(360deg); } }
  @keyframes spinCoronaRev { 100% { transform: rotate(-360deg); } }
  @keyframes sunPulse {
    0% { filter: brightness(0.96) drop-shadow(0 0 10px rgba(255,180,40,0.5)); }
    100% { filter: brightness(1.08) drop-shadow(0 0 35px rgba(255,100,0,0.8)); }
  }

  /* Planet Aesthetics */
  /* Mercury */
  .mercury-disc {
    width: 10px;
    height: 10px;
    background: radial-gradient(circle at 40% 40%, #cfc9bf 0%, #88827a 60%, #46423d 100%);
  }
  .mercury-disc::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(30,28,26,0.5) 12%, transparent 16%),
      radial-gradient(circle at 70% 65%, rgba(30,28,26,0.4) 18%, transparent 22%);
  }

  /* Venus */
  .venus-disc {
    width: 17px;
    height: 17px;
    background:
      repeating-linear-gradient(42deg, transparent, transparent 3px, rgba(156, 106, 58, 0.25) 4px, transparent 6px),
      radial-gradient(circle at 35% 35%, #f6e3b4 0%, #e2be84 45%, #9c6a3a 100%);
  }

  /* Earth & Moon */
  .earth-disc {
    width: 19px;
    height: 19px;
    background:
      radial-gradient(circle at 65% 25%, rgba(255,255,255,0.7) 0%, transparent 22%),
      radial-gradient(ellipse at 30% 40%, #4a9a3e 0%, #3c8a3a 35%, transparent 40%),
      radial-gradient(ellipse at 70% 70%, #3c8a3a 0%, #2f6f2e 45%, transparent 50%),
      radial-gradient(circle at 50% 50%, #3b7be0 0%, #1f50a6 65%, #0a2a66 100%);
  }
  .moon-orbit-wrap {
    position: absolute;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .moon-carrier {
    position: absolute;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .moon-disc {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f0f0f2, #7a7a82);
    box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }

  /* Mars */
  .mars-disc {
    width: 12px;
    height: 12px;
    background:
      radial-gradient(circle at 50% 95%, #ffffff 0%, #fff 8%, transparent 12%),
      radial-gradient(ellipse at 45% 55%, #3d1407 0%, transparent 45%),
      radial-gradient(circle at 40% 40%, #e6845a 0%, #b24823 60%, #6a2810 100%);
  }

  /* Jupiter */
  .jupiter-disc {
    width: 44px;
    height: 44px;
    background:
      radial-gradient(ellipse 7px 4px at 68% 68%, #c8583c 0%, #8b2b14 85%, transparent 100%),
      repeating-linear-gradient(
        0deg,
        #d7bd9c 0px, #d7bd9c 3px,
        #b18866 3px, #b18866 6px,
        #ecdcc7 6px, #ecdcc7 9px,
        #a56b4d 9px, #a56b4d 13px,
        #cfa781 13px, #cfa781 17px
      );
  }

  /* Saturn & Ring */
  .saturn-disc {
    width: 38px;
    height: 38px;
    background: repeating-linear-gradient(
      0deg,
      #eedeb8 0px, #eedeb8 3px,
      #d1b888 3px, #d1b888 6px,
      #bfa16a 6px, #bfa16a 8px,
      #e5cfa4 8px, #e5cfa4 12px
    );
  }
  .saturn-ring {
    position: absolute;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    margin-top: -48px;
    margin-left: -48px;
    pointer-events: none;
    transform: rotateX(74deg);
    background: radial-gradient(
      transparent 0%,
      transparent 48%,
      rgba(150, 125, 80, 0.4) 49%,
      rgba(215, 192, 140, 0.8) 58%,
      rgba(70, 55, 30, 0.9) 63%,
      rgba(0, 0, 0, 0.8) 64%,
      rgba(20, 15, 10, 0.2) 66%,
      rgba(195, 170, 125, 0.75) 67%,
      rgba(150, 125, 85, 0.4) 73%,
      transparent 75%
    );
  }

  /* Uranus */
  .uranus-disc {
    width: 24px;
    height: 24px;
    background: radial-gradient(circle at 40% 40%, #d6f6f7 0%, #85d0d8 50%, #3a9aa3 100%);
  }

  /* Neptune */
  .neptune-disc {
    width: 23px;
    height: 23px;
    background:
      repeating-linear-gradient(20deg, transparent 0, transparent 4px, rgba(255,255,255,0.06) 5px, transparent 7px),
      radial-gradient(circle at 35% 35%, #6d95f5 0%, #305ec7 55%, #142f8f 100%);
  }

  /* Overhead Billboard Tags */
  .planet-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.14em;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    text-shadow: 0 1px 4px rgba(0,0,0,0.95);
  }
  .show-labels .planet-label {
    opacity: 1;
  }

  /* Header Branding */
  .brand-header {
    position: absolute;
    top: 24px;
    left: 28px;
    z-index: 10;
    pointer-events: none;
  }
  .brand-title {
    font-family: var(--font-serif);
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand-title span {
    color: var(--amber);
  }
  .brand-tagline {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Toolbar */
  .toolbar-container {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--glass-bg);
    border: var(--glass-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 8px 18px;
    border-radius: 9999px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .control-group label {
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .speed-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px rgba(255, 181, 46, 0.8);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .speed-slider::-webkit-slider-thumb:hover {
    transform: scale(1.25);
  }

  .speed-readout {
    min-width: 32px;
    font-variant-numeric: tabular-nums;
  }

  .divider {
    width: 1px;
    height: 18px;
    background: rgba(255, 255, 255, 0.14);
  }

  .btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text);
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 9999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
  }
  .btn:focus-visible {
    outline: 2px solid var(--amber);
  }
  .btn[aria-pressed="true"] {
    background: rgba(255, 181, 46, 0.18);
    border-color: var(--amber);
    color: #fff;
  }

  /* Info Glass Panel (Sidebar / Bottom sheet) */
  .info-drawer {
    position: absolute;
    top: 24px;
    right: 28px;
    width: 330px;
    max-height: calc(100vh - 48px);
    background: var(--glass-bg);
    border: var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 24px;
    z-index: 20;
    transform: translateX(380px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    opacity: 0;
    pointer-events: none;
    overflow-y: auto;
    box-shadow: -10px 10px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .info-drawer.open {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }

  .drawer-close {
    position: absolute;
    top: 18px;
    right: 18px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .drawer-close:hover {
    color: var(--text);
    background: rgba(255,255,255,0.08);
  }

  .drawer-type {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--amber);
    font-weight: 600;
  }
  .drawer-name {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 400;
    line-height: 1.1;
    margin-top: -8px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }
  .stat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .stat-val {
    font-size: 13px;
    font-weight: 600;
  }

  .drawer-fact {
    font-size: 13px;
    line-height: 1.55;
    color: #c0c6d8;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 14px;
  }

  /* Responsive Bottom Sheet */
  @media (max-width: 640px) {
    .info-drawer {
      top: auto;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 60vh;
      transform: translateY(100%);
      border-radius: 20px 20px 0 0;
      padding: 20px;
    }
    .info-drawer.open {
      transform: translateY(0);
    }
    .toolbar-container {
      bottom: 16px;
      gap: 10px;
      padding: 6px 14px;
      transform: translateX(-50%) scale(0.92);
    }
    .brand-header {
      top: 16px;
      left: 18px;
    }
  }

  /* Accessibility / Reduced Motion */
  @media (prefers-reduced-motion: reduce) {
    .sun-body {
      animation: none !important;
    }
    .corona {
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <!-- Sky Backdrops -->
  <div id="cosmos"></div>
  <canvas id="stars-canvas"></canvas>

  <!-- Title Branding -->
  <header class="brand-header">
    <h1 class="brand-title">Orbit<span>.</span></h1>
    <p class="brand-tagline">CSS 3D Planetary Model</p>
  </header>

  <!-- 3D Stage -->
  <main class="viewport" id="viewport" aria-label="Interactive 3D Solar System">
    <div class="camera-pivot" id="camera">

      <!-- Orbit Path Rings -->
      <div class="orbit-ring" style="width: 210px; height: 210px; transform: translate(-50%, -50%) rotateX(97deg);"></div>
      <div class="orbit-ring" style="width: 280px; height: 280px; transform: translate(-50%, -50%) rotateX(93.4deg);"></div>
      <div class="orbit-ring" style="width: 360px; height: 360px; transform: translate(-50%, -50%) rotateX(90deg);"></div>
      <div class="orbit-ring" style="width: 444px; height: 444px; transform: translate(-50%, -50%) rotateX(91.9deg);"></div>
      <div class="orbit-ring" style="width: 600px; height: 600px; transform: translate(-50%, -50%) rotateX(91.3deg);"></div>
      <div class="orbit-ring" style="width: 760px; height: 760px; transform: translate(-50%, -50%) rotateX(92.5deg);"></div>
      <div class="orbit-ring" style="width: 900px; height: 900px; transform: translate(-50%, -50%) rotateX(90.8deg);"></div>
      <div class="orbit-ring" style="width: 1024px; height: 1024px; transform: translate(-50%, -50%) rotateX(91.8deg);"></div>

      <!-- Center: The Sun -->
      <button class="celestial-target" data-body="sun" aria-label="Sun details" style="z-index: 5;">
        <div class="corona corona-1"></div>
        <div class="corona corona-2"></div>
        <div class="sun-body disc"></div>
        <span class="planet-label">Sun</span>
      </button>

      <!-- Planetary Carriers -->
      <!-- Mercury -->
      <div class="orbital-carrier" id="carrier-mercury">
        <div class="planet-anchor" id="anchor-mercury">
          <button class="celestial-target" data-body="mercury" aria-label="Mercury details">
            <div class="disc mercury-disc" id="disc-mercury"></div>
            <span class="planet-label">Mercury</span>
          </button>
        </div>
      </div>

      <!-- Venus -->
      <div class="orbital-carrier" id="carrier-venus">
        <div class="planet-anchor" id="anchor-venus">
          <button class="celestial-target" data-body="venus" aria-label="Venus details">
            <div class="disc venus-disc" id="disc-venus"></div>
            <span class="planet-label">Venus</span>
          </button>
        </div>
      </div>

      <!-- Earth -->
      <div class="orbital-carrier" id="carrier-earth">
        <div class="planet-anchor" id="anchor-earth">
          <button class="celestial-target" data-body="earth" aria-label="Earth details">
            <div class="disc earth-disc" id="disc-earth"></div>
            <span class="planet-label">Earth</span>
          </button>
          <!-- Moon -->
          <div class="moon-orbit-wrap">
            <div class="moon-carrier" id="carrier-moon">
              <div class="planet-anchor" style="transform: translateX(18px);">
                <div class="disc moon-disc" id="disc-moon"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mars -->
      <div class="orbital-carrier" id="carrier-mars">
        <div class="planet-anchor" id="anchor-mars">
          <button class="celestial-target" data-body="mars" aria-label="Mars details">
            <div class="disc mars-disc" id="disc-mars"></div>
            <span class="planet-label">Mars</span>
          </button>
        </div>
      </div>

      <!-- Jupiter -->
      <div class="orbital-carrier" id="carrier-jupiter">
        <div class="planet-anchor" id="anchor-jupiter">
          <button class="celestial-target" data-body="jupiter" aria-label="Jupiter details">
            <div class="disc jupiter-disc" id="disc-jupiter"></div>
            <span class="planet-label">Jupiter</span>
          </button>
        </div>
      </div>

      <!-- Saturn -->
      <div class="orbital-carrier" id="carrier-saturn">
        <div class="planet-anchor" id="anchor-saturn">
          <button class="celestial-target" data-body="saturn" aria-label="Saturn details">
            <div class="saturn-ring" id="ring-saturn"></div>
            <div class="disc saturn-disc" id="disc-saturn"></div>
            <span class="planet-label">Saturn</span>
          </button>
        </div>
      </div>

      <!-- Uranus -->
      <div class="orbital-carrier" id="carrier-uranus">
        <div class="planet-anchor" id="anchor-uranus">
          <button class="celestial-target" data-body="uranus" aria-label="Uranus details">
            <div class="disc uranus-disc" id="disc-uranus"></div>
            <span class="planet-label">Uranus</span>
          </button>
        </div>
      </div>

      <!-- Neptune -->
      <div class="orbital-carrier" id="carrier-neptune">
        <div class="planet-anchor" id="anchor-neptune">
          <button class="celestial-target" data-body="neptune" aria-label="Neptune details">
            <div class="disc neptune-disc" id="disc-neptune"></div>
            <span class="planet-label">Neptune</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Controls Deck -->
  <nav class="toolbar-container" aria-label="Simulation Controls">
    <div class="control-group">
      <label for="speed-range">Speed</label>
      <input type="range" id="speed-range" class="speed-slider" min="0" max="40" step="0.5" value="1">
      <span class="speed-readout" id="speed-display">1×</span>
    </div>
    <div class="divider"></div>
    <button class="btn" id="labels-btn" aria-pressed="false">Labels</button>
    <button class="btn" id="reset-btn">Reset</button>
  </nav>

  <!-- Planet Info Sheet -->
  <aside class="info-drawer" id="info-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
    <button class="drawer-close" id="drawer-close-btn" aria-label="Close panel">✕</button>
    <div>
      <span class="drawer-type" id="d-type">Star</span>
      <h2 class="drawer-name" id="drawer-title">Sun</h2>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Diameter</div>
        <div class="stat-val" id="d-diam">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Day Length</div>
        <div class="stat-val" id="d-day">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Year Length</div>
        <div class="stat-val" id="d-year">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Moons</div>
        <div class="stat-val" id="d-moons">—</div>
      </div>
      <div class="stat-card" style="grid-column: span 2;">
        <div class="stat-label">Mean Temperature</div>
        <div class="stat-val" id="d-temp">—</div>
      </div>
    </div>
    <p class="drawer-fact" id="d-fact"></p>
  </aside>

<script>
  /* -------------------------------------------------------------
     ASTRONOMICAL & STATE CONFIGURATION
  ------------------------------------------------------------- */
  const PLANET_DATA = {
    sun: {
      type: "Yellow Dwarf Star",
      name: "Sun",
      diameter: "1,392,700 km",
      day: "25–35 Earth days",
      year: "—",
      moons: "8 planets",
      temp: "5,505 °C (surface)",
      fact: "The Sun contains 99.86% of all mass in the Solar System. Its core fuses roughly 600 million tons of hydrogen into helium every second, fueling life on Earth."
    },
    mercury: {
      type: "Terrestrial Planet",
      name: "Mercury",
      diameter: "4,879 km",
      day: "58.6 Earth days",
      year: "88 Earth days",
      moons: "0",
      temp: "167 °C (-180 to 430°C)",
      fact: "Mercury experiences extreme temperature swings because it has virtually no atmosphere to trap heat. Its cratered surface closely resembles Earth's Moon."
    },
    venus: {
      type: "Terrestrial Planet",
      name: "Venus",
      diameter: "12,104 km",
      day: "243 Earth days",
      year: "225 Earth days",
      moons: "0",
      temp: "464 °C",
      fact: "Venus spins backwards compared to most planets and its day lasts longer than its year. A runaway greenhouse effect makes it the hottest planet in the Solar System."
    },
    earth: {
      type: "Terrestrial Planet",
      name: "Earth",
      diameter: "12,742 km",
      day: "24 hours",
      year: "365.25 days",
      moons: "1",
      temp: "15 °C",
      fact: "The only known world harboring life, liquid oceans, and active plate tectonics. Earth's atmosphere protects the surface from meteoroids and solar radiation."
    },
    mars: {
      type: "Terrestrial Planet",
      name: "Mars",
      diameter: "6,779 km",
      day: "24h 37m",
      year: "687 Earth days",
      moons: "2",
      temp: "-65 °C",
      fact: "Mars hosts Olympus Mons, the largest volcano in the Solar System, and Valles Marineris, a canyon system that dwarf Earth's Grand Canyon in scale."
    },
    jupiter: {
      type: "Gas Giant",
      name: "Jupiter",
      diameter: "139,820 km",
      day: "9h 56m",
      year: "11.86 Earth years",
      moons: "95",
      temp: "-110 °C",
      fact: "More than twice as massive as all other planets combined, Jupiter’s famous Great Red Spot is a persistent anticyclonic storm larger than Earth."
    },
    saturn: {
      type: "Gas Giant",
      name: "Saturn",
      diameter: "116,460 km",
      day: "10h 33m",
      year: "29.45 Earth years",
      moons: "146",
      temp: "-140 °C",
      fact: "Saturn possesses the most extensive ring system, composed mostly of ice particles, rocky debris and dust. It is the least dense planet—it would float in water."
    },
    uranus: {
      type: "Ice Giant",
      name: "Uranus",
      diameter: "50,724 km",
      day: "17h 14m",
      year: "84 Earth years",
      moons: "28",
      temp: "-195 °C",
      fact: "Uranus rotates tilted on its side at an angle of 98 degrees, likely due to an ancient collision. It has the coldest planetary atmosphere in our system."
    },
    neptune: {
      type: "Ice Giant",
      name: "Neptune",
      diameter: "49,244 km",
      day: "16h 06m",
      year: "164.8 Earth years",
      moons: "16",
      temp: "-200 °C",
      fact: "Neptune experiences supersonic winds exceeding 2,100 km/h. It was the first planet located via mathematical predictions rather than empirical observation."
    }
  };

  // Base constants: 1 Earth Year = 12 real seconds at 1x speed
  const EARTH_YEAR_SECONDS = 12;
  const PLANET_CONFIGS = [
    { id: 'mercury', radius: 105, inc: 7.0, periodRatio: 0.2408 },
    { id: 'venus',   radius: 140, inc: 3.4, periodRatio: 0.6152 },
    { id: 'earth',   radius: 180, inc: 0.0, periodRatio: 1.0000 },
    { id: 'mars',    radius: 222, inc: 1.9, periodRatio: 1.8808 },
    { id: 'jupiter', radius: 300, inc: 1.3, periodRatio: 11.862 },
    { id: 'saturn',  radius: 380, inc: 2.5, periodRatio: 29.457 },
    { id: 'uranus',  radius: 450, inc: 0.8, periodRatio: 84.011 },
    { id: 'neptune', radius: 512, inc: 1.8, periodRatio: 164.79 }
  ];

  // Global Interactive State
  let cameraPitch = 62;
  let cameraYaw = 0;
  let cameraScale = 1;
  let userInteracted = false;
  let simSpeed = 1;
  let isDragging = false;
  let prevMousePos = { x: 0, y: 0 };
  let currentSimSeconds = 0;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* -------------------------------------------------------------
     CANVAS STARFIELD
  ------------------------------------------------------------- */
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let galaxies = [];

  function initStarfield() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    const starCount = Math.floor((width * height) / 1800);
    stars = [];
    const colors = ['#ffffff', '#e2eaff', '#fff5eb', '#ffe3b0'];

    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() < 0.85 ? Math.random() * 0.9 + 0.3 : Math.random() * 1.6 + 0.8,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.75 + 0.25
      });
    }

    galaxies = [];
    for (let i = 0; i < 4; i++) {
      galaxies.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radiusX: Math.random() * 18 + 10,
        radiusY: Math.random() * 6 + 3,
        angle: Math.random() * Math.PI
      });
    }
  }

  function drawStarfield() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Distant galaxies
    ctx.save();
    for (const g of galaxies) {
      ctx.beginPath();
      ctx.ellipse(g.x, g.y, g.radiusX, g.radiusY, g.angle, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(180, 200, 255, 0.08)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();

    // Stars
    for (const s of stars) {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.alpha;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  window.addEventListener('resize', () => {
    initStarfield();
    drawStarfield();
  });
  initStarfield();
  drawStarfield();

  /* -------------------------------------------------------------
     DOM REFERENCES CACHE
  ------------------------------------------------------------- */
  const cameraEl = document.getElementById('camera');
  const viewport = document.getElementById('viewport');
  const speedSlider = document.getElementById('speed-range');
  const speedDisplay = document.getElementById('speed-display');
  const labelsBtn = document.getElementById('labels-btn');
  const resetBtn = document.getElementById('reset-btn');
  const infoDrawer = document.getElementById('info-drawer');
  const closeDrawerBtn = document.getElementById('drawer-close-btn');

  // Cache planet DOM elements
  const planetElements = PLANET_CONFIGS.map(cfg => ({
    ...cfg,
    carrier: document.getElementById(`carrier-${cfg.id}`),
    anchor: document.getElementById(`anchor-${cfg.id}`),
    disc: document.getElementById(`disc-${cfg.id}`)
  }));

  const moonCarrier = document.getElementById('carrier-moon');
  const moonDisc = document.getElementById('disc-moon');
  const saturnRing = document.getElementById('ring-saturn');

  /* -------------------------------------------------------------
     ANIMATION LOOP & ORBIT COMPUTATION
  ------------------------------------------------------------- */
  let lastTimestamp = performance.now();

  function tick(timestamp) {
    const dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    // Camera auto-yaw drift
    if (!userInteracted && !reducedMotion) {
      cameraYaw = (cameraYaw + 1.5 * dt) % 360;
    }

    // Advance simulation time
    currentSimSeconds += dt * simSpeed;

    // Apply Camera Transform
    cameraEl.style.transform = `scale3d(${cameraScale}, ${cameraScale}, ${cameraScale}) rotateX(${cameraPitch}deg) rotateY(${cameraYaw}deg)`;

    // Update Planets
    for (const p of planetElements) {
      const periodInSecs = EARTH_YEAR_SECONDS * p.periodRatio;
      const angle = ((currentSimSeconds % periodInSecs) / periodInSecs) * 360;

      // Position carrier around inclined plane
      p.carrier.style.transform = `rotateX(${p.inc}deg) rotateY(${angle}deg)`;
      p.anchor.style.transform = `translateX(${p.radius}px)`;

      // Billboard transformation: cancel carrier inclination, orbit angle, and camera rotation
      p.disc.style.transform = `rotateY(${-angle}deg) rotateX(${-p.inc}deg) rotateY(${-cameraYaw}deg) rotateX(${-cameraPitch}deg)`;

      // Calculate lit-facing variable for shadow shader
      // Radian orbit angle around Sun
      const theta = (angle * Math.PI) / 180;
      // Relative offset from Sun in carrier plane
      const lx = -Math.cos(theta);
      const ly = Math.sin(theta) * 0.5; // projected angle compensation
      const litX = 50 + lx * 38;
      const litY = 50 + ly * 38;
      p.disc.style.setProperty('--lit-x', `${litX}%`);
      p.disc.style.setProperty('--lit-y', `${litY}%`);
    }

    // Saturn Ring Tilt Billboarding
    if (saturnRing) {
      saturnRing.style.transform = `rotateX(74deg)`;
    }

    // Moon Orbit (Earth Year = 365.25 days, Moon orbit = 27.3 Earth-days)
    if (moonCarrier && moonDisc) {
      const moonPeriod = EARTH_YEAR_SECONDS * (27.3 / 365.25);
      const moonAngle = ((currentSimSeconds % moonPeriod) / moonPeriod) * 360;
      moonCarrier.style.transform = `rotateY(${moonAngle}deg)`;
      moonDisc.style.transform = `rotateY(${-moonAngle}deg) rotateY(${-cameraYaw}deg) rotateX(${-cameraPitch}deg)`;
      moonDisc.style.setProperty('--lit-x', '35%');
      moonDisc.style.setProperty('--lit-y', '40%');
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* -------------------------------------------------------------
     INTERACTION & CONTROLS
  ------------------------------------------------------------- */
  // Pointer Dragging
  viewport.addEventListener('pointerdown', (e) => {
    // Ignore clicks originating on buttons or inputs
    if (e.target.closest('.celestial-target') || e.target.closest('.toolbar-container') || e.target.closest('.info-drawer')) {
      return;
    }
    isDragging = true;
    userInteracted = true;
    prevMousePos = { x: e.clientX, y: e.clientY };
    viewport.setPointerCapture(e.pointerId);
  });

  viewport.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;

    cameraYaw = (cameraYaw + dx * 0.4) % 360;
    cameraPitch = Math.max(2, Math.min(89, cameraPitch - dy * 0.35));

    prevMousePos = { x: e.clientX, y: e.clientY };
  });

  viewport.addEventListener('pointerup', (e) => {
    if (isDragging) {
      isDragging = false;
      try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  });

  viewport.addEventListener('pointercancel', () => { isDragging = false; });

  // Wheel Pitch Adjustment
  viewport.addEventListener('wheel', (e) => {
    userInteracted = true;
    e.preventDefault();
    cameraPitch = Math.max(2, Math.min(89, cameraPitch + e.deltaY * 0.05));
  }, { passive: false });

  // UI: Speed Range
  speedSlider.addEventListener('input', (e) => {
    simSpeed = parseFloat(e.target.value);
    speedDisplay.textContent = `${simSpeed}×`;
  });

  // UI: Toggle Labels
  labelsBtn.addEventListener('click', () => {
    const isPressed = labelsBtn.getAttribute('aria-pressed') === 'true';
    const newState = !isPressed;
    labelsBtn.setAttribute('aria-pressed', String(newState));
    viewport.classList.toggle('show-labels', newState);
  });

  // UI: Reset View
  resetBtn.addEventListener('click', () => {
    cameraPitch = 62;
    cameraYaw = 0;
    cameraScale = 1;
    simSpeed = 1;
    speedSlider.value = 1;
    speedDisplay.textContent = '1×';
    userInteracted = false;
  });

  /* -------------------------------------------------------------
     INFO DRAWER & SELECTION
  ------------------------------------------------------------- */
  function openInfo(bodyKey) {
    const data = PLANET_DATA[bodyKey];
    if (!data) return;

    document.getElementById('d-type').textContent = data.type;
    document.getElementById('drawer-title').textContent = data.name;
    document.getElementById('d-diam').textContent = data.diameter;
    document.getElementById('d-day').textContent = data.day;
    document.getElementById('d-year').textContent = data.year;
    document.getElementById('d-moons').textContent = data.moons;
    document.getElementById('d-temp').textContent = data.temp;
    document.getElementById('d-fact').textContent = data.fact;

    infoDrawer.classList.add('open');
    infoDrawer.setAttribute('aria-hidden', 'false');
  }

  function closeInfo() {
    infoDrawer.classList.remove('open');
    infoDrawer.setAttribute('aria-hidden', 'true');
  }

  closeDrawerBtn.addEventListener('click', closeInfo);

  document.querySelectorAll('.celestial-target').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const body = btn.getAttribute('data-body');
      openInfo(body);
    });
  });

  // Global Keydown (Escape)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeInfo();
    }
  });
</script>
</body>
</html>
