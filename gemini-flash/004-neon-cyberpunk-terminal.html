<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KESTREL//OS — Neon Cyberpunk Boot Terminal</title>
<style>
  :root {
    --bg-base: #05060a;
    --bg-glow: #10142a;
    --neon-magenta: #ff2bd6;
    --neon-cyan: #00f0ff;
    --amber: #ffb830;
    --mint: #5cff8a;
    --dim-slate: #6b7390;
    --pale-blue: #d8e6ff;
    --panel-bg: rgba(10, 12, 22, 0.82);
    --border-alpha: rgba(0, 240, 255, 0.28);
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-base);
    background-image: radial-gradient(circle at 50% 0%, var(--bg-glow) 0%, var(--bg-base) 75%);
    color: var(--pale-blue);
    font-family: var(--font-mono);
    height: 100vh;
    overflow: hidden;
    position: relative;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* CRT Overlays */
  .crt-scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.35) 0px,
      rgba(0, 0, 0, 0.35) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 100;
    mix-blend-mode: multiply;
  }

  .crt-sweep {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 0%, rgba(0, 240, 255, 0.04) 50%, transparent 100%);
    background-size: 100% 200px;
    animation: sweep 7s linear infinite;
    z-index: 101;
  }

  .crt-flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.015);
    z-index: 102;
    animation: flicker 0.12s steps(2, start) infinite;
  }

  .crt-vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.85) 100%);
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7);
    z-index: 103;
  }

  /* 3D Perspective Neon Grid Floor */
  .perspective-container {
    position: fixed;
    bottom: -80px;
    left: 0;
    right: 0;
    height: 35vh;
    perspective: 450px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
  }

  .grid-floor {
    width: 200%;
    height: 200%;
    position: absolute;
    left: -50%;
    bottom: 0;
    background-image: 
      linear-gradient(to right, rgba(0, 240, 255, 0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 43, 214, 0.22) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: rotateX(62deg);
    transform-origin: 50% 100%;
    animation: gridScroll 2.2s linear infinite;
  }

  @keyframes sweep {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
  }

  @keyframes flicker {
    0% { opacity: 0.96; }
    50% { opacity: 1.04; }
    100% { opacity: 0.98; }
  }

  @keyframes gridScroll {
    0% { background-position: 0 0; }
    100% { background-position: 0 40px; }
  }

  /* App Structure */
  #app-root {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    padding: 16px;
    gap: 16px;
    box-sizing: border-box;
  }

  /* Chamfered Header Panel */
  header {
    background: var(--panel-bg);
    border: 1px solid var(--border-alpha);
    clip-path: polygon(
      0 0, 
      calc(100% - 20px) 0, 
      100% 20px, 
      100% 100%, 
      20px 100%, 
      0 calc(100% - 20px)
    );
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.12), inset 0 0 10px rgba(0, 240, 255, 0.05);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  .title-wrap {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .title {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.18em;
    color: var(--neon-cyan);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.2);
    display: inline-block;
    position: relative;
  }

  .title .slash {
    color: var(--neon-magenta);
    text-shadow: 0 0 8px rgba(255, 43, 214, 0.7);
  }

  .title-sub {
    font-size: 0.75rem;
    color: var(--dim-slate);
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  /* Chromatic aberration glitch */
  .glitching {
    animation: glitchAnim 0.42s steps(2, end) forwards;
  }

  @keyframes glitchAnim {
    0% {
      transform: translate(0);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      clip-path: inset(0 0 0 0);
    }
    20% {
      transform: translate(-3px, 1px) skewX(4deg);
      text-shadow: -3px 0 var(--neon-magenta), 3px 0 var(--neon-cyan);
      clip-path: inset(25% 0 35% 0);
    }
    40% {
      transform: translate(2px, -2px) skewX(-3deg);
      text-shadow: 3px 0 var(--neon-magenta), -3px 0 var(--neon-cyan);
      clip-path: inset(65% 0 10% 0);
    }
    60% {
      transform: translate(-1px, 2px) skewX(2deg);
      text-shadow: -2px 0 var(--neon-cyan), 2px 0 var(--neon-magenta);
      clip-path: inset(10% 0 75% 0);
    }
    80% {
      transform: translate(2px, 0);
      text-shadow: 2px 0 var(--neon-magenta), -2px 0 var(--neon-cyan);
      clip-path: inset(45% 0 40% 0);
    }
    100% {
      transform: translate(0);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
      clip-path: inset(0 0 0 0);
    }
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--dim-slate);
  }

  .status-item .val {
    color: var(--pale-blue);
  }

  .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 6px var(--mint);
    animation: pulseLed 1.4s infinite ease-in-out;
  }

  @keyframes pulseLed {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px var(--mint)); }
    50% { opacity: 0.3; filter: none; }
  }

  /* Main Panels */
  main {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 16px;
    min-height: 0;
  }

  .hud-panel {
    background: var(--panel-bg);
    border: 1px solid var(--border-alpha);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.08), inset 0 0 15px rgba(0, 0, 0, 0.5);
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }

  /* Floating cut-in label */
  .hud-panel::before {
    content: attr(data-label);
    position: absolute;
    top: -9px;
    left: 20px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--neon-magenta);
    background: #080a14;
    padding: 0 8px;
    border: 1px solid rgba(255, 43, 214, 0.4);
    box-shadow: 0 0 8px rgba(255, 43, 214, 0.2);
    text-transform: uppercase;
    z-index: 2;
  }

  /* Corner brackets */
  .hud-panel .bracket {
    position: absolute;
    width: 8px;
    height: 8px;
    border-color: var(--neon-cyan);
    pointer-events: none;
  }
  .hud-panel .b-tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
  .hud-panel .b-tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
  .hud-panel .b-bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
  .hud-panel .b-br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

  /* Console Panel */
  .console-container {
    min-height: 0;
    cursor: text;
  }

  .log-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.85rem;
    line-height: 1.45;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: rgba(0, 240, 255, 0.3) transparent;
  }

  .log-area::-webkit-scrollbar {
    width: 5px;
  }
  .log-area::-webkit-scrollbar-thumb {
    background: rgba(0, 240, 255, 0.3);
    border-radius: 2px;
  }

  .log-line {
    white-space: pre-wrap;
  }

  .ts {
    color: var(--dim-slate);
    margin-right: 10px;
    font-size: 0.8rem;
  }

  .ascii-banner {
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    font-size: 0.72rem;
    line-height: 1.1;
    margin: 8px 0;
    user-select: none;
    font-weight: 700;
  }

  .tag-ok {
    color: var(--mint);
    text-shadow: 0 0 6px rgba(92, 255, 138, 0.4);
    font-weight: bold;
  }

  .tag-warn {
    color: var(--amber);
    text-shadow: 0 0 6px rgba(255, 184, 48, 0.4);
    font-weight: bold;
  }

  .tag-err {
    color: #ff3355;
    text-shadow: 0 0 6px rgba(255, 51, 85, 0.4);
    font-weight: bold;
  }

  /* Inline Progress Bar */
  .progress-wrap {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 3px 0;
    width: 100%;
    max-width: 440px;
  }

  .progress-rail {
    flex: 1;
    height: 8px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(0, 240, 255, 0.25);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
    box-shadow: 0 0 10px rgba(255, 43, 214, 0.6);
    transition: width 0.08s ease-out;
  }

  .progress-val {
    font-size: 0.75rem;
    color: var(--neon-cyan);
    min-width: 45px;
  }

  /* Command Prompt */
  .prompt-row {
    display: flex;
    align-items: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(0, 240, 255, 0.15);
    font-size: 0.85rem;
  }

  .prompt-label {
    color: var(--neon-magenta);
    text-shadow: 0 0 8px rgba(255, 43, 214, 0.6);
    font-weight: bold;
    white-space: nowrap;
    margin-right: 8px;
  }

  .prompt-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: inherit;
    color: #fff;
    caret-color: var(--neon-cyan);
    text-shadow: 0 0 4px rgba(255, 255, 255, 0.4);
  }

  /* Typing caret */
  .cursor-block {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--neon-cyan);
    vertical-align: middle;
    margin-left: 2px;
    box-shadow: 0 0 8px var(--neon-cyan);
    animation: blinkCaret 0.8s infinite;
  }

  @keyframes blinkCaret {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Help & Subsystem Tables */
  .term-table {
    margin: 6px 0;
    border-collapse: collapse;
    width: 100%;
    max-width: 580px;
  }

  .term-table td {
    padding: 3px 12px 3px 0;
    vertical-align: top;
  }

  .term-cmd {
    color: var(--neon-cyan);
    font-weight: bold;
  }

  /* Sidebar */
  .sidebar-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
    overflow: hidden;
  }

  .canvas-wrap {
    width: 100%;
    height: 180px;
    position: relative;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(0, 240, 255, 0.12);
  }

  #core-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .canvas-readout {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 0.65rem;
    color: var(--neon-magenta);
    letter-spacing: 0.08em;
    pointer-events: none;
  }

  .gauges {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .gauge-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .gauge-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
  }

  .gauge-label {
    color: var(--dim-slate);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .gauge-val {
    color: var(--neon-cyan);
    font-weight: bold;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
  }

  .gauge-bar-track {
    height: 4px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 43, 214, 0.2);
    position: relative;
  }

  .gauge-bar-fill {
    height: 100%;
    background: var(--neon-magenta);
    box-shadow: 0 0 8px rgba(255, 43, 214, 0.6);
    transition: width 0.4s ease;
  }

  /* Hex Dump */
  .hex-container {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hex-title {
    font-size: 0.7rem;
    color: var(--dim-slate);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .hex-stream {
    flex: 1;
    overflow: hidden;
    font-size: 0.68rem;
    line-height: 1.35;
    position: relative;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
  }

  .hex-row {
    display: flex;
    gap: 8px;
    white-space: pre;
  }

  .hex-addr {
    color: var(--neon-magenta);
  }

  .hex-bytes {
    color: var(--dim-slate);
  }

  .hex-hi {
    color: var(--neon-cyan);
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
    font-weight: bold;
  }

  .hex-ascii {
    color: var(--pale-blue);
    opacity: 0.75;
  }

  /* High resolutions */
  @media (min-height: 1080px) and (min-width: 1800px) {
    .canvas-wrap {
      height: 240px;
    }
  }

  /* Responsive styling */
  @media (max-width: 860px) {
    body {
      overflow-y: auto;
      height: auto;
    }
    #app-root {
      height: auto;
      display: flex;
      flex-direction: column;
    }
    main {
      grid-template-columns: 1fr;
    }
    .console-container {
      height: 60vh;
    }
    .sidebar-container {
      height: auto;
    }
    .hex-stream {
      height: 240px;
    }
    .status-item.hide-sm {
      display: none;
    }
  }

  @media (max-width: 480px) {
    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .progress-wrap {
      max-width: 250px;
    }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .crt-sweep,
    .crt-flicker,
    .grid-floor,
    .led,
    .cursor-block {
      animation: none !important;
    }
    .glitching {
      animation: none !important;
    }
  }
</style>
</head>
<body>

  <div class="crt-scanlines"></div>
  <div class="crt-sweep"></div>
  <div class="crt-flicker"></div>
  <div class="crt-vignette"></div>

  <div class="perspective-container">
    <div class="grid-floor"></div>
  </div>

  <div id="app-root">
    <header>
      <div class="title-wrap">
        <div class="title" id="hdr-title">KESTREL<span class="slash">//</span>OS</div>
        <div class="title-sub">v9.4.1 Nightjar</div>
      </div>
      <div class="status-row">
        <div class="status-item">
          <div class="led"></div>
          <span>SEC:</span>
          <span class="val">ENCRYPTED</span>
        </div>
        <div class="status-item hide-sm">
          <span>NODE:</span>
          <span class="val">NJ-7704</span>
        </div>
        <div class="status-item">
          <span>UTC:</span>
          <span class="val" id="live-clock">00:00:00</span>
        </div>
      </div>
    </header>

    <main>
      <!-- Console Section -->
      <section class="hud-panel console-container" data-label="Primary Console" id="console-click-target">
        <div class="bracket b-tl"></div>
        <div class="bracket b-tr"></div>
        <div class="bracket b-bl"></div>
        <div class="bracket b-br"></div>

        <div class="log-area" id="terminal-log"></div>

        <div class="prompt-row">
          <span class="prompt-label">operator@kestrel:~$</span>
          <input type="text" id="term-input" class="prompt-input" autocomplete="off" spellcheck="false" disabled>
        </div>
      </section>

      <!-- Telemetry Sidebar -->
      <aside class="hud-panel sidebar-container" data-label="Telemetry">
        <div class="bracket b-tl"></div>
        <div class="bracket b-tr"></div>
        <div class="bracket b-bl"></div>
        <div class="bracket b-br"></div>

        <div class="canvas-wrap" id="canvas-container">
          <canvas id="core-canvas"></canvas>
          <div class="canvas-readout" id="poly-readout">θ: 000°</div>
        </div>

        <div class="gauges">
          <div class="gauge-row">
            <div class="gauge-meta">
              <span class="gauge-label">Core Temp</span>
              <span class="gauge-val" id="val-temp">41.8°C</span>
            </div>
            <div class="gauge-bar-track">
              <div class="gauge-bar-fill" id="bar-temp" style="width: 42%;"></div>
            </div>
          </div>
          <div class="gauge-row">
            <div class="gauge-meta">
              <span class="gauge-label">Flux Drift</span>
              <span class="gauge-val" id="val-flux">1.042 Wb</span>
            </div>
            <div class="gauge-bar-track">
              <div class="gauge-bar-fill" id="bar-flux" style="width: 68%;"></div>
            </div>
          </div>
        </div>

        <div class="hex-container">
          <div class="hex-title">Memory · 0x7f3a</div>
          <div class="hex-stream" id="hex-stream"></div>
        </div>
      </aside>
    </main>
  </div>

<script>
  /* --- Live Clock --- */
  function updateClock() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('live-clock').textContent = 
      `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* --- Glitch Trigger --- */
  const hdrTitle = document.getElementById('hdr-title');
  function triggerHeaderGlitch() {
    hdrTitle.classList.remove('glitching');
    void hdrTitle.offsetWidth; // trigger reflow
    hdrTitle.classList.add('glitching');
    setTimeout(() => hdrTitle.classList.remove('glitching'), 420);
  }

  function scheduleGlitch() {
    const delay = Math.random() * (8500 - 2500) + 2500;
    setTimeout(() => {
      triggerHeaderGlitch();
      scheduleGlitch();
    }, delay);
  }
  scheduleGlitch();

  /* --- Terminal & Boot Sequence --- */
  const termLog = document.getElementById('terminal-log');
  const termInput = document.getElementById('term-input');
  const consoleTarget = document.getElementById('console-click-target');

  consoleTarget.addEventListener('click', () => {
    if (!termInput.disabled) {
      termInput.focus();
    }
  });

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function getTimestamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    return `[${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}.${ms}]`;
  }

  const ASCII_BANNER = 
` ██████╗██╗  ██╗███████╗███████╗██████╗ ███████╗██╗     
 ██╔══██╗██║ ██╔╝██╔════╝██╔════╝╚════██╗██╔════╝██║     
 ██████╦╝█████╦╝ █████╗  ███████╗ █████╔╝█████╗  ██║     
 ██╔══██╗██╔═██╗ ██╔══╝  ╚════██║ ╚═══██╗██╔══╝  ██║     
 ██████╦╝██║ ██╗ ███████╗███████║██████╔╝███████╗███████╗
 ╚═════╝ ╚═╝ ╚═╝ ╚══════╝╚══════╝╚═════╝ ╚══════╝╚══════╝`;

  function scrollConsole() {
    termLog.scrollTop = termLog.scrollHeight;
  }

  function appendRawLine(html) {
    const div = document.createElement('div');
    div.className = 'log-line';
    div.innerHTML = html;
    termLog.appendChild(div);
    scrollConsole();
    return div;
  }

  // Type line with blinking cursor at the tail
  function typeLine(text, tagHtml = '', speed = 14) {
    return new Promise(resolve => {
      const line = document.createElement('div');
      line.className = 'log-line';
      const tsSpan = `<span class="ts">${getTimestamp()}</span>`;
      line.innerHTML = `${tsSpan}<span class="text-content"></span><span class="cursor-block"></span>`;
      termLog.appendChild(line);
      scrollConsole();

      if (prefersReduced) {
        line.querySelector('.text-content').textContent = text;
        const c = line.querySelector('.cursor-block');
        if (c) c.remove();
        if (tagHtml) line.innerHTML += ` ${tagHtml}`;
        scrollConsole();
        resolve();
        return;
      }

      const textSpan = line.querySelector('.text-content');
      let idx = 0;

      function step() {
        if (idx < text.length) {
          // Burst 2 chars sometimes
          let take = (Math.random() > 0.82 && idx + 2 <= text.length) ? 2 : 1;
          textSpan.textContent += text.slice(idx, idx + take);
          idx += take;
          scrollConsole();
          let jitter = Math.random() * 12 - 5;
          setTimeout(step, Math.max(5, speed + jitter));
        } else {
          const c = line.querySelector('.cursor-block');
          if (c) c.remove();
          if (tagHtml) line.innerHTML += ` ${tagHtml}`;
          scrollConsole();
          resolve();
        }
      }
      step();
    });
  }

  // Animated Progress bar line
  function runProgressBar(label, duration = 900) {
    return new Promise(resolve => {
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `
        <span class="ts">${getTimestamp()}</span>
        <span>${label}</span>
        <div class="progress-wrap">
          <div class="progress-rail"><div class="progress-fill"></div></div>
          <div class="progress-val">0%</div>
        </div>
      `;
      termLog.appendChild(line);
      scrollConsole();

      const fill = line.querySelector('.progress-fill');
      const val = line.querySelector('.progress-val');

      if (prefersReduced) {
        fill.style.width = '100%';
        val.textContent = '100%';
        resolve();
        return;
      }

      let start = null;
      function frame(timestamp) {
        if (!start) start = timestamp;
        let progress = Math.min((timestamp - start) / duration, 1);
        let pct = Math.floor(progress * 100);
        fill.style.width = `${pct}%`;
        val.textContent = `${pct}%`;
        scrollConsole();

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          setTimeout(resolve, 80);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function executeBoot() {
    const bannerEl = document.createElement('pre');
    bannerEl.className = 'ascii-banner';
    bannerEl.textContent = ASCII_BANNER;
    termLog.appendChild(bannerEl);
    scrollConsole();

    await new Promise(r => setTimeout(r, prefersReduced ? 0 : 250));
    await typeLine('Initiating cold bootstrap [UEFI x86_64]...', '<span class="tag-ok">[ OK ]</span>');
    await typeLine('Mounting virtual sysfs & neural device trees...', '<span class="tag-ok">[ OK ]</span>');
    await typeLine('Establishing quantum entangler loopback (0.0.0.0)...', '<span class="tag-ok">[ OK ]</span>');
    await runProgressBar('Hydrating memory lattice', 950);
    await typeLine('Calibrating flux sensors [T-delta +/- 0.003K]...', '<span class="tag-ok">[ OK ]</span>');
    await typeLine('Decrypting security ring 0 keystore...', '<span class="tag-ok">[ OK ]</span>');
    await typeLine('Probing peripheral bus: sub-cluster 0x09 node silent.', '<span class="tag-warn">[WARN]</span>');
    await runProgressBar('Loading operator profile', 850);
    await typeLine('Nightjar runtime environment active.', '<span class="tag-ok">[ OK ]</span>');
    
    appendRawLine(`<span style="color:var(--neon-cyan); text-shadow:0 0 8px rgba(0,240,255,0.4)">` +
      `System ready. Type <b style="color:#fff">help</b> for command catalogue.</span>\n`);

    termInput.disabled = false;
    termInput.focus();
  }

  setTimeout(executeBoot, 300);

  /* --- Command Execution & History --- */
  const history = [];
  let historyIdx = -1;

  const COMMANDS = {
    help: () => {
      return `
<table class="term-table">
  <tr><td class="term-cmd">help</td><td>Display available operating subroutines</td></tr>
  <tr><td class="term-cmd">status</td><td>Query vital subsystems & hardware bus states</td></tr>
  <tr><td class="term-cmd">scan</td><td>Engage radar lattice & spectral frequency sweep</td></tr>
  <tr><td class="term-cmd">about</td><td>Print runtime architecture manifest</td></tr>
  <tr><td class="term-cmd">clear</td><td>Flush primary viewport buffer</td></tr>
</table>`;
    },
    status: () => {
      return `
<table class="term-table">
  <tr><td class="term-cmd">ION CORE</td><td>ONLINE · 99.82% sync</td><td class="tag-ok">[ OK ]</td></tr>
  <tr><td class="term-cmd">NEURAL BUS</td><td>ALLOCATED · zero parity drift</td><td class="tag-ok">[ OK ]</td></tr>
  <tr><td class="term-cmd">OPTIC BUS</td><td>THROTTLED · 42.1 Gbps</td><td class="tag-warn">[WARN]</td></tr>
  <tr><td class="term-cmd">SEC DAEMON</td><td>LOCKDOWN ENABLED</td><td class="tag-ok">[ OK ]</td></tr>
</table>`;
    },
    about: () => {
      return `KESTREL//OS — Edition Nightjar v9.4.1\nArchitecture: Pure Single-File Web Shell (Zero External Assets)\nSubsystem: Neural DOM Hybrid Synthesis · Operator Level 4`;
    },
    clear: () => {
      termLog.innerHTML = '';
      return '';
    }
  };

  async function handleScan() {
    termInput.disabled = true;
    appendRawLine(`<span class="ts">${getTimestamp()}</span>Engaging wide-band orbital sweep...`);
    await runProgressBar('Scanning spectral bands [3.4 - 12.8 GHz]', 1300);
    await typeLine('SIG#0xFA31  [Ghost Fleet Beacon]      -74 dBm', '<span class="tag-ok">[CIVILIAN]</span>', 10);
    await typeLine('SIG#0x88C0  [Kestrel Relay Relay-09]   -41 dBm', '<span class="tag-ok">[TELEMETRY]</span>', 10);
    await typeLine('SIG#0x101B  [UNKNOWN ENCRYPTED BURST]  -92 dBm', '<span class="tag-warn">[UNKNOWN]</span>', 10);
    appendRawLine(`<span class="ts">${getTimestamp()}</span>Sweep terminated: 3 targets resolved. Primary matrix notified.`);
    triggerHeaderGlitch();
    termInput.disabled = false;
    termInput.focus();
  }

  termInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const raw = termInput.value.trim();
      termInput.value = '';

      if (!raw) return;

      history.push(raw);
      historyIdx = history.length;

      // Echo command
      appendRawLine(`<span class="prompt-label">operator@kestrel:~$</span> ${raw}`);

      const cmd = raw.toLowerCase();

      if (cmd === 'scan') {
        await handleScan();
      } else if (COMMANDS[cmd]) {
        const out = COMMANDS[cmd]();
        if (out) appendRawLine(out);
      } else {
        appendRawLine(`<span class="tag-err">Command unrecognised: "${raw}". Enter "help" for instructions.</span>`);
      }
      scrollConsole();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIdx > 0) {
        historyIdx--;
        termInput.value = history[historyIdx];
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIdx < history.length - 1) {
        historyIdx++;
        termInput.value = history[historyIdx];
      } else {
        historyIdx = history.length;
        termInput.value = '';
      }
    }
  });

  /* --- 3D Wireframe Icosahedron Canvas --- */
  const canvas = document.getElementById('core-canvas');
  const ctx = canvas.getContext('2d');
  const polyReadout = document.getElementById('poly-readout');

  // Golden ratio
  const phi = (1 + Math.sqrt(5)) / 2;
  const baseVertices = [
    [-1,  phi, 0], [ 1,  phi, 0], [-1, -phi, 0], [ 1, -phi, 0],
    [ 0, -1,  phi], [ 0,  1,  phi], [ 0, -1, -phi], [ 0,  1, -phi],
    [ phi, 0, -1], [ phi, 0,  1], [-phi, 0, -1], [-phi, 0,  1]
  ].map(v => {
    // Normalise
    const len = Math.hypot(...v);
    return [v[0] / len, v[1] / len, v[2] / len];
  });

  const icosaEdges = [
    [0,11],[0,5],[0,1],[0,7],[0,10],
    [1,5],[1,9],[1,8],[1,7],
    [2,11],[2,4],[2,3],[2,6],[2,10],
    [3,4],[3,9],[3,8],[3,6],
    [4,5],[4,9],[4,11],
    [5,9],
    [6,7],[6,8],[6,10],
    [7,8],
    [8,9],
    [10,11]
  ];

  let rotX = 0.4;
  let rotY = 0.5;
  let arcRot = 0;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function renderWireframe() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;

    ctx.resetTransform();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;
    const scale = Math.min(w, h) * 0.36;

    // Outer magenta ring
    ctx.strokeStyle = 'rgba(255, 43, 214, 0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, scale * 1.18, 0, Math.PI * 2);
    ctx.stroke();

    // Rotating dashed cyan arc
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(arcRot);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.7)';
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, scale * 1.28, 0, Math.PI * 1.4);
    ctx.stroke();
    ctx.restore();

    // Rotate vertices
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

    const projected = baseVertices.map(v => {
      // Y-axis rotation
      let x1 = v[0] * cosY - v[2] * sinY;
      let y1 = v[1];
      let z1 = v[0] * sinY + v[2] * cosY;
      // X-axis rotation
      let x2 = x1;
      let y2 = y1 * cosX - z1 * sinX;
      let z2 = y1 * sinX + z1 * cosX;

      // Perspective projection
      const cameraDistance = 2.4;
      const fov = 1 / (cameraDistance - z2);
      return {
        x: cx + x2 * scale * fov,
        y: cy + y2 * scale * fov,
        z: z2
      };
    });

    // Edges depth sorted
    icosaEdges.forEach(([i, j]) => {
      const p1 = projected[i];
      const p2 = projected[j];
      const midZ = (p1.z + p2.z) / 2;
      const alpha = Math.max(0.12, (midZ + 1.2) / 2.2);

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = `rgba(0, 240, 255, ${alpha.toFixed(2)})`;
      ctx.lineWidth = alpha > 0.65 ? 1.8 : 1;
      if (alpha > 0.75) {
        ctx.shadowColor = 'rgba(0, 240, 255, 0.7)';
        ctx.shadowBlur = 6;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // Magenta vertices
    projected.forEach(p => {
      const alpha = (p.z + 1.2) / 2.2;
      ctx.fillStyle = `rgba(255, 43, 214, ${Math.max(0.3, alpha).toFixed(2)})`;
      ctx.shadowColor = 'rgba(255, 43, 214, 0.8)';
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, alpha > 0.6 ? 2.5 : 1.8, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // Angle readout
    const deg = Math.floor(((rotY * 180 / Math.PI) % 360 + 360) % 360);
    polyReadout.textContent = `θ: ${String(deg).padStart(3, '0')}°`;

    if (!prefersReduced) {
      rotX += 0.007;
      rotY += 0.012;
      arcRot -= 0.016;
      requestAnimationFrame(renderWireframe);
    }
  }
  renderWireframe();

  /* --- Telemetry Gauges Update --- */
  const valTemp = document.getElementById('val-temp');
  const barTemp = document.getElementById('bar-temp');
  const valFlux = document.getElementById('val-flux');
  const barFlux = document.getElementById('bar-flux');

  setInterval(() => {
    const temp = (41 + Math.random() * 4.2).toFixed(1);
    const tempPct = Math.min(100, Math.max(10, ((temp - 35) / 25) * 100));
    valTemp.textContent = `${temp}°C`;
    barTemp.style.width = `${tempPct}%`;

    const flux = (0.95 + Math.random() * 0.22).toFixed(3);
    const fluxPct = Math.min(100, Math.max(10, ((flux - 0.8) / 0.5) * 100));
    valFlux.textContent = `${flux} Wb`;
    barFlux.style.width = `${fluxPct}%`;
  }, 1400);

  /* --- Memory Hex Dump --- */
  const hexContainer = document.getElementById('hex-stream');
  const HEX_ROWS = 14;
  let baseAddr = 0x7F3A;

  function genHexRow(addr) {
    const addrStr = '0x' + addr.toString(16).toUpperCase().padStart(4, '0');
    let bytesHtml = '';
    let asciiStr = '';

    for (let i = 0; i < 8; i++) {
      const b = Math.floor(Math.random() * 256);
      const isHi = Math.random() < 0.12;
      const bStr = b.toString(16).toUpperCase().padStart(2, '0');
      
      if (isHi) {
        bytesHtml += `<span class="hex-hi">${bStr}</span> `;
      } else {
        bytesHtml += `${bStr} `;
      }

      // ASCII printable
      asciiStr += (b >= 33 && b <= 126) ? String.fromCharCode(b) : '·';
    }

    return `<div class="hex-row"><span class="hex-addr">${addrStr}</span> <span class="hex-bytes">${bytesHtml}</span><span class="hex-ascii">${asciiStr}</span></div>`;
  }

  // Populate initial rows
  for (let i = 0; i < HEX_ROWS; i++) {
    hexContainer.innerHTML += genHexRow(baseAddr + i * 8);
  }

  // Recycle stream
  setInterval(() => {
    baseAddr = (baseAddr + 8) & 0xFFFF;
    const newRow = document.createElement('div');
    newRow.innerHTML = genHexRow(baseAddr + (HEX_ROWS - 1) * 8);
    const first = newRow.firstElementChild;
    hexContainer.appendChild(first);

    if (hexContainer.children.length > HEX_ROWS) {
      hexContainer.removeChild(hexContainer.firstElementChild);
    }
  }, prefersReduced ? 1500 : 220);

</script>
