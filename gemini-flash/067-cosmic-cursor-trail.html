<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stardust — Cosmic Cursor Trail</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    position: absolute; top: 0; left: 0; z-index: 1;
  }
  @media (pointer: fine) {
    body { cursor: none; }
  }
  #custom-cursor {
    position: fixed; top: 0; left: 0; width: 14px; height: 14px;
    margin-left: -7px; margin-top: -7px;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    pointer-events: none; z-index: 9999;
    mix-blend-mode: difference;
    transform: translate3d(-100px, -100px, 0);
    transition: width 0.2s cubic-bezier(0.1, 0.9, 0.2, 1),
                height 0.2s cubic-bezier(0.1, 0.9, 0.2, 1),
                margin 0.2s cubic-bezier(0.1, 0.9, 0.2, 1),
                border-color 0.2s;
  }
  #custom-cursor.vortex {
    width: 48px; height: 48px; margin-left: -24px; margin-top: -24px;
    border-style: dashed;
    animation: cursorSpin 2.5s linear infinite;
  }
  @keyframes cursorSpin { 100% { transform: translate3d(var(--cx), var(--cy), 0) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #custom-cursor.vortex { animation: none; }
  }
  @media (max-width: 640px), (pointer: coarse) {
    #custom-cursor { display: none !important; }
  }
  .ui-layer {
    position: absolute; z-index: 10; pointer-events: none;
  }
  header {
    top: 28px; left: 32px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400; font-size: 26px; letter-spacing: 0.5px;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
  }
  h2 {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 3px; color: rgba(255, 255, 255, 0.45);
    margin-top: 3px;
  }
  #hint {
    top: 32px; right: 32px; text-align: right;
    font-size: 11px; letter-spacing: 0.8px;
    color: rgba(255, 255, 255, 0.4);
    transition: opacity 1.2s ease-out;
  }
  #hint span {
    display: inline-block; padding: 2px 6px;
    background: rgba(255, 255, 255, 0.08); border-radius: 4px;
    margin: 0 2px; color: rgba(255, 255, 255, 0.7);
  }
  .pill-container {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    pointer-events: auto;
  }
  .pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    background: rgba(14, 14, 22, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 32px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
  .group {
    display: flex; align-items: center; gap: 4px;
  }
  .sep {
    width: 1px; height: 18px; background: rgba(255, 255, 255, 0.12);
    margin: 0 4px;
  }
  button {
    background: transparent; border: none; outline: none;
    color: rgba(255, 255, 255, 0.6);
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 10px; border-radius: 18px;
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; transition: all 0.2s ease;
  }
  button:hover {
    color: #fff; background: rgba(255, 255, 255, 0.08);
  }
  button.active {
    background: #fff; color: #0a0a10;
  }
  button.active .swatch {
    border-color: rgba(0, 0, 0, 0.3);
  }
  button.active svg path, button.active svg line {
    stroke: #0a0a10;
  }
  .swatch {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  svg {
    width: 13px; height: 13px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  @media (max-width: 640px) {
    header { top: 18px; left: 20px; }
    #hint { display: none; }
    .pill-container { bottom: 16px; width: calc(100% - 32px); max-width: 440px; }
    .pill { justify-content: space-around; width: 100%; padding: 4px 6px; }
    button { padding: 8px 10px; }
    button .label { display: none; }
    .sep { margin: 0 1px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="custom-cursor"></div>

<header class="ui-layer">
  <h1>Stardust</h1>
  <h2>Cosmic Cursor Trail</h2>
</header>

<div id="hint" class="ui-layer">
  Move to draw &bull; Hold to vortex<br>
  Keys <span>1-4</span> <span>C</span> <span>S</span>
</div>

<div class="ui-layer pill-container">
  <nav class="pill" aria-label="Painting Controls">
    <div class="group" id="brush-group">
      <button class="active" data-brush="dust" title="Dust (Key 1)">
        <span class="swatch" style="background:#9fd8ff;"></span>
        <span class="label">Dust</span>
      </button>
      <button data-brush="ribbons" title="Ribbons (Key 2)">
        <span class="swatch" style="background:#ff9fe5;"></span>
        <span class="label">Ribbons</span>
      </button>
      <button data-brush="embers" title="Embers (Key 3)">
        <span class="swatch" style="background:#ffb060;"></span>
        <span class="label">Embers</span>
      </button>
      <button data-brush="ink" title="Ink (Key 4)">
        <span class="swatch" style="background:#e8e8f0;"></span>
        <span class="label">Ink</span>
      </button>
    </div>

    <div class="sep"></div>

    <div class="group" id="fade-group">
      <button data-fade="0.012" title="Slow Fade">
        <svg viewBox="0 0 14 14"><line x1="2" y1="12" x2="12" y2="12" stroke-dasharray="1 3"/></svg>
      </button>
      <button class="active" data-fade="0.045" title="Medium Fade">
        <svg viewBox="0 0 14 14"><line x1="2" y1="12" x2="12" y2="12" stroke-dasharray="2.5 2"/></svg>
      </button>
      <button data-fade="0.14" title="Fast Fade">
        <svg viewBox="0 0 14 14"><line x1="2" y1="12" x2="12" y2="12"/></svg>
      </button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button id="btn-clear" title="Clear Canvas (Key C)">
        <svg viewBox="0 0 16 16"><path d="M3 4h10M6 4V2.5A.5.5 0 0 1 6.5 2h3a.5.5 0 0 1 .5.5V4M5 4v9.5a.5.5 0 0 0 .5.5h5a.5.5 0 0 0 .5-.5V4"/></svg>
      </button>
      <button id="btn-save" title="Save PNG (Key S)">
        <svg viewBox="0 0 16 16"><path d="M2.5 10v3.5a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5V10M8 2v8M5 7l3 3 3-3"/></svg>
      </button>
    </div>
  </nav>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const cursorEl = document.getElementById('custom-cursor');
  const hintEl = document.getElementById('hint');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, dpr = 1;
  let activeBrush = 'dust';
  let fadeSpeed = prefersReduced ? 0.08 : 0.045;
  let globalHue = 190;
  let hasMoved = false;

  const pointer = {
    x: window.innerWidth * 0.5,
    y: window.innerHeight * 0.5,
    px: window.innerWidth * 0.5,
    py: window.innerHeight * 0.5,
    vx: 0, vy: 0,
    down: false,
    downTime: 0,
    active: false,
    idleTimer: 0
  };

  const comet = {
    x: pointer.x,
    y: pointer.y,
    vx: 0,
    vy: 0,
    trail: []
  };

  const particles = [];
  const shockwaves = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    
    const temp = document.createElement('canvas');
    temp.width = canvas.width;
    temp.height = canvas.height;
    const tctx = temp.getContext('2d');
    if (canvas.width > 0 && canvas.height > 0) {
      tctx.drawImage(canvas, 0, 0);
    }

    width = w; height = h;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    if (temp.width > 0) {
      ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, width, height);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function spawnParticle(x, y, vx, vy, brush) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * (brush === 'embers' ? 3.5 : 2.5);
    const kickX = Math.cos(angle) * speed;
    const kickY = Math.sin(angle) * speed;
    const jitterHue = (globalHue + (Math.random() * 36 - 18) + 360) % 360;

    let p = {
      x, y, px: x, py: y,
      vx: vx * 0.35 + kickX,
      vy: vy * 0.35 + kickY,
      brush,
      life: 1.0,
      decay: 0.015,
      size: 1.5,
      seed: Math.random() * 100,
      hue: jitterHue,
      sat: 85,
      light: 68
    };

    if (brush === 'dust') {
      p.size = 0.6 + Math.random() * 1.6;
      p.decay = 0.01 + Math.random() * 0.014;
      p.drag = 0.94;
    } else if (brush === 'ribbons') {
      p.size = 1.2;
      p.decay = 0.005 + Math.random() * 0.006;
      p.drag = 0.96;
      p.sat = 95;
    } else if (brush === 'embers') {
      p.size = 1.0 + Math.random() * 2.2;
      p.decay = 0.02 + Math.random() * 0.03;
      p.drag = 0.93;
      p.hue = 8 + Math.random() * 34;
      p.light = 60 + Math.random() * 25;
      p.vy -= 1.2;
    } else if (brush === 'ink') {
      p.size = 6.0 + Math.random() * 16.0;
      p.decay = 0.006 + Math.random() * 0.008;
      p.drag = 0.88;
      p.light = 86;
      p.sat = 6;
    }
    particles.push(p);
  }

  function emitSegment(x1, y1, x2, y2, vx, vy, brush) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const dist = Math.hypot(dx, dy);
    const steps = Math.min(Math.max(1, Math.floor(dist / 3)), 40);
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      spawnParticle(x1 + dx * t, y1 + dy * t, vx, vy, brush);
    }
  }

  window.addEventListener('pointermove', (e) => {
    if (!hasMoved) {
      hasMoved = true;
      hintEl.style.opacity = '0';
    }
    pointer.active = true;
    pointer.idleTimer = 0;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    updateCursorPos(pointer.x, pointer.y);
  });

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.pill-container')) return;
    pointer.down = true;
    pointer.downTime = performance.now();
    pointer.active = true;
    pointer.idleTimer = 0;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    updateCursorPos(pointer.x, pointer.y);
    cursorEl.classList.add('vortex');
  });

  window.addEventListener('pointerup', () => {
    if (pointer.down) {
      const duration = Math.min((performance.now() - pointer.downTime) / 1000, 1.2);
      releaseVortex(duration);
    }
    pointer.down = false;
    cursorEl.classList.remove('vortex');
  });

  function updateCursorPos(x, y) {
    cursorEl.style.setProperty('--cx', `${x}px`);
    cursorEl.style.setProperty('--cy', `${y}px`);
    if (!cursorEl.classList.contains('vortex')) {
      cursorEl.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }
  }

  function releaseVortex(duration) {
    const strength = 6 + duration * 14;
    const count = Math.floor(160 + (duration / 1.2) * 260);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const dx = p.x - pointer.x;
      const dy = p.y - pointer.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 320 && dist > 1) {
        const factor = (1 - dist / 320) * strength;
        p.vx += (dx / dist) * factor;
        p.vy += (dy / dist) * factor;
      }
    }

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (2 + Math.random() * 12) * (0.4 + duration * 0.8);
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const r = Math.random() * 20;
      spawnParticle(pointer.x + Math.cos(angle) * r, pointer.y + Math.sin(angle) * r, vx, vy, activeBrush);
    }

    shockwaves.push({
      x: pointer.x,
      y: pointer.y,
      radius: 8,
      maxRadius: 180 + duration * 160,
      alpha: 0.9,
      hue: globalHue
    });
  }

  let lastTime = performance.now();
  let ghostTime = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    globalHue = (globalHue + 14 * dt) % 360;

    // Pointer Idle & Ghost Mode
    pointer.idleTimer += dt;
    if (pointer.idleTimer > 2.6) {
      ghostTime += dt;
      const A = width * 0.32;
      const B = height * 0.28;
      const cx = width * 0.5;
      const cy = height * 0.5;
      const gx = cx + A * Math.sin(3 * ghostTime * 0.5 + Math.PI / 2) + Math.sin(ghostTime * 2.1) * 35;
      const gy = cy + B * Math.sin(2 * ghostTime * 0.5) + Math.cos(ghostTime * 1.7) * 25;
      pointer.x = gx;
      pointer.y = gy;
      updateCursorPos(pointer.x, pointer.y);
    }

    pointer.vx = pointer.x - pointer.px;
    pointer.vy = pointer.y - pointer.py;

    // Movement spawn
    if (Math.hypot(pointer.vx, pointer.vy) > 0.1) {
      emitSegment(pointer.px, pointer.py, pointer.x, pointer.y, pointer.vx, pointer.vy, activeBrush);
    }

    // Spring comet head (stiffness 120, damping 0.82)
    const k = 120;
    const d = 0.82;
    const ax = (pointer.x - comet.x) * k;
    const ay = (pointer.y - comet.y) * k;
    comet.vx = (comet.vx + ax * dt) * Math.pow(d, dt * 60);
    comet.vy = (comet.vy + ay * dt) * Math.pow(d, dt * 60);
    comet.x += comet.vx * dt;
    comet.y += comet.vy * dt;

    comet.trail.unshift({ x: comet.x, y: comet.y });
    if (comet.trail.length > 28) comet.trail.pop();

    // Vortex hold logic
    if (pointer.down) {
      const holdTime = (now - pointer.downTime) / 1000;
      const progress = Math.min(holdTime / 1.2, 1.0);
      const vortexRadius = 260;
      const pull = (120 + progress * 340) * dt;
      const swirl = (260 + progress * 580) * dt;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const dx = pointer.x - p.x;
        const dy = pointer.y - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < vortexRadius && dist > 1) {
          const norm = (1 - dist / vortexRadius);
          const nx = dx / dist;
          const ny = dy / dist;
          p.vx += (nx * pull - ny * swirl) * norm;
          p.vy += (ny * pull + nx * swirl) * norm;
        }
      }

      for (let i = 0; i < 4; i++) {
        const rad = Math.random() * 60 + 10;
        const ang = Math.random() * Math.PI * 2;
        const px = pointer.x + Math.cos(ang) * rad;
        const py = pointer.y + Math.sin(ang) * rad;
        spawnParticle(px, py, -Math.sin(ang) * 4, Math.cos(ang) * 4, activeBrush);
      }
    }

    // Canvas fading
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(0, 0, 0, ${fadeSpeed})`;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();

    // Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      p.vx *= p.drag;
      p.vy *= p.drag;
      p.px = p.x;
      p.py = p.y;
      p.x += p.vx;
      p.y += p.vy;

      if (p.brush === 'dust') {
        p.x += Math.sin(now * 0.005 + p.seed) * 0.35;
        p.y += Math.cos(now * 0.005 + p.seed) * 0.35;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const a = p.life;
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${a * 0.85})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${a * 0.15})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (p.brush === 'ribbons') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${p.life * 0.7})`;
        ctx.lineWidth = p.size * p.life;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.restore();

      } else if (p.brush === 'embers') {
        p.vy -= 0.06; // Buoyancy
        p.vx += (Math.random() - 0.5) * 0.4;
        const flicker = (Math.sin(now * 0.02 + p.seed * 10) + 1) * 0.5;
        const a = p.life * (0.5 + 0.5 * flicker);

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `hsla(${p.hue}, 95%, ${p.light}%, ${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.6 + p.life * 0.5), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (p.brush === 'ink') {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${p.life * 0.035})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Draw Comet Head and Trail
    if (comet.trail.length > 1) {
      const compHue = (globalHue + 180) % 360;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = comet.trail.length - 1; i > 0; i--) {
        const p1 = comet.trail[i];
        const p2 = comet.trail[i - 1];
        const prog = 1 - (i / comet.trail.length);
        ctx.strokeStyle = `hsla(${compHue}, 90%, ${50 + prog * 45}%, ${prog * 0.6})`;
        ctx.lineWidth = Math.max(0.6, prog * 5.5);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      // Hot white head
      const hx = comet.trail[0].x;
      const hy = comet.trail[0].y;
      const grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, 18);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.2, `hsla(${compHue}, 90%, 80%, 0.6)`);
      grad.addColorStop(0.6, `hsla(${compHue}, 80%, 60%, 0.15)`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(hx, hy, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += (sw.maxRadius - sw.radius) * 0.12 + 2.0;
      sw.alpha *= 0.91;
      if (sw.alpha < 0.01) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `hsla(${sw.hue}, 80%, 75%, ${sw.alpha})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    pointer.px = pointer.x;
    pointer.py = pointer.y;
  }
  requestAnimationFrame(loop);

  // UI Handlers
  const brushButtons = document.querySelectorAll('#brush-group button');
  brushButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setBrush(btn.getAttribute('data-brush'));
    });
  });

  function setBrush(type) {
    activeBrush = type;
    brushButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-brush') === type));
  }

  const fadeButtons = document.querySelectorAll('#fade-group button');
  fadeButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setFade(parseFloat(btn.getAttribute('data-fade')));
    });
  });

  function setFade(speed) {
    fadeSpeed = prefersReduced ? Math.max(0.08, speed) : speed;
    fadeButtons.forEach(b => b.classList.toggle('active', Math.abs(parseFloat(b.getAttribute('data-fade')) - speed) < 0.001));
  }

  document.getElementById('btn-clear').addEventListener('click', (e) => {
    e.stopPropagation();
    clearCanvas();
  });

  function clearCanvas() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    particles.length = 0;
    shockwaves.length = 0;
    comet.trail.length = 0;
  }

  document.getElementById('btn-save').addEventListener('click', (e) => {
    e.stopPropagation();
    saveCanvas();
  });

  function saveCanvas() {
    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const link = document.createElement('a');
    link.download = `stardust-${timestamp}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const key = e.key.toLowerCase();
    if (key === '1') setBrush('dust');
    if (key === '2') setBrush('ribbons');
    if (key === '3') setBrush('embers');
    if (key === '4') setBrush('ink');
    if (key === 'c') clearCanvas();
    if (key === 's') saveCanvas();
  });
})();
</script>
</body>
</html>
