<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nami no Yume — Animated Ukiyo-e Seascape</title>
<style>
  :root {
    --desk-bg: #2a231d;
    --paper: #efe3c6;
    --red-seal: #b8322a;
    --dark-ink: #0b1d33;
    --ui-text: #dfd3ba;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    min-height: 100vh;
    background-color: var(--desk-bg);
    background-image: radial-gradient(circle at 50% 40%, #3e342b 0%, #201a15 85%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px 40px;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    overflow-x: hidden;
  }

  .print-stage {
    position: relative;
    width: 100%;
    max-width: 1080px;
    filter: drop-shadow(0 35px 45px rgba(0, 0, 0, 0.75))
            drop-shadow(0 12px 18px rgba(0, 0, 0, 0.45));
    border-radius: 2px;
  }

  svg.ukiyo-e {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
    background-color: var(--paper);
    border-radius: 2px;
    cursor: crosshair;
  }

  /* Misregister layers on hover */
  .reg-blue, .reg-foam, .reg-key, .reg-seal {
    transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .print-stage:hover .reg-blue {
    transform: translate(5px, -3px);
  }
  .print-stage:hover .reg-foam {
    transform: translate(-4px, 2px);
  }
  .print-stage:hover .reg-key {
    transform: translate(2px, 3px);
  }
  .print-stage:hover .reg-seal {
    transform: translate(-3px, -2px) rotate(-1deg);
  }

  .controls {
    display: flex;
    gap: 20px;
    margin-top: 35px;
  }
  .btn {
    background: transparent;
    border: 1px solid rgba(223, 211, 186, 0.35);
    color: var(--ui-text);
    padding: 9px 24px;
    font-family: inherit;
    font-size: 1.05rem;
    font-style: italic;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 30px;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    background: rgba(42, 35, 29, 0.4);
    backdrop-filter: blur(4px);
  }
  .btn:hover {
    border-color: rgba(223, 211, 186, 0.85);
    color: #fff;
    background: rgba(223, 211, 186, 0.12);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  }
  .btn.active {
    background: rgba(184, 50, 42, 0.85);
    border-color: #f6efdc;
    color: #f6efdc;
  }

  @media (max-width: 600px) {
    .controls { gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 7px 16px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="print-stage">
  <svg class="ukiyo-e" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Horizontal paper fiber turbulence -->
      <filter id="paper-fibers" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.9" numOctaves="3" result="noise" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0 0.55  0 0 0 0.09 0"/>
      </filter>

      <!-- Global fine grain overlay -->
      <filter id="woodblock-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
        <feColorMatrix type="saturate" values="0" result="desat"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.18"/>
        </feComponentTransfer>
      </filter>

      <!-- Ink bleed filter for seal stamp -->
      <filter id="ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology operator="dilate" radius="0.8" in="SourceGraphic" result="dilated"/>
        <feGaussianBlur in="dilated" stdDeviation="0.4" result="blurred"/>
        <feMerge>
          <feMergeNode in="blurred"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Carved water diagonal stripes pattern -->
      <pattern id="diagonal-stripes" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#0a1a2b" stroke-width="1.3" opacity="0.16" />
      </pattern>

      <!-- Sky gradient -->
      <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e9dcb9" />
        <stop offset="42%" stop-color="#d6ceb5" />
        <stop offset="68%" stop-color="#b6c2bf" />
        <stop offset="100%" stop-color="#9fb0b3" />
      </linearGradient>

      <!-- Mountain gradients -->
      <linearGradient id="fuji-body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#efe3c6" />
        <stop offset="26%" stop-color="#697d95" />
        <stop offset="70%" stop-color="#3f5470" />
        <stop offset="100%" stop-color="#243345" />
      </linearGradient>

      <!-- Wave Prussian-blue Gradients -->
      <linearGradient id="grad-wave-back" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6f9cc2" />
        <stop offset="45%" stop-color="#3d6d9a" />
        <stop offset="100%" stop-color="#1b3a5c" />
      </linearGradient>

      <linearGradient id="grad-wave-mid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a7ba8" />
        <stop offset="40%" stop-color="#2f5a86" />
        <stop offset="100%" stop-color="#132c47" />
      </linearGradient>

      <linearGradient id="grad-wave-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a6b98" />
        <stop offset="35%" stop-color="#1b3a5c" />
        <stop offset="90%" stop-color="#0f2540" />
      </linearGradient>
    </defs>

    <!-- Base Paper Sheet & Sky -->
    <rect width="1200" height="800" fill="#efe3c6" />
    <rect width="1200" height="520" fill="url(#sky-grad)" />

    <!-- Paper fibers layer -->
    <rect width="1200" height="800" filter="url(#paper-fibers)" pointer-events="none" />

    <!-- Pale Sun Disc -->
    <circle cx="980" cy="190" r="82" fill="#fffcf0" opacity="0.32" />

    <!-- Distant Mountain (Fuji silhouette) -->
    <g id="mountain-group">
      <!-- Slopes -->
      <path d="M 450,530 Q 560,400 584,240 L 616,240 Q 640,400 750,530 Z" fill="url(#fuji-body)" />
      <!-- Snow cap flutes -->
      <path d="M 584,240 Q 590,295 580,330 Q 592,305 600,345 Q 608,300 620,332 Q 610,285 616,240 Z" fill="#efe3c6" opacity="0.95" />
      <path d="M 588,240 L 600,310 L 612,240 Z" fill="#fffef7" opacity="0.75" />
    </g>

    <!-- Wind-blown cloud strokes -->
    <g fill="none" stroke="#e8dfcb" stroke-linecap="round" opacity="0.55">
      <path d="M 280,310 C 370,305 460,320 540,310" stroke-width="6" />
      <path d="M 330,328 C 410,323 480,335 520,330" stroke-width="3" />
      <path d="M 680,290 C 760,285 880,300 970,290" stroke-width="7" />
      <path d="M 720,310 C 790,305 870,320 930,312" stroke-width="3.5" />
      <path d="M 120,240 C 220,235 340,250 420,242" stroke-width="4.5" />
    </g>

    <!-- MISREGISTER GROUP: BLUE PRINTS (Waves & Boats) -->
    <g class="reg-blue">
      <!-- Back Wave Layer -->
      <path id="wave-back-path" fill="url(#grad-wave-back)" />
      <path id="wave-back-stripe" fill="url(#diagonal-stripes)" />

      <!-- Back Swell Rowing Boats -->
      <g id="boats-container"></g>

      <!-- Middle Wave Layer -->
      <path id="wave-mid-path" fill="url(#grad-wave-mid)" />
      <path id="wave-mid-stripe" fill="url(#diagonal-stripes)" />

      <!-- Front Wave Layer -->
      <path id="wave-front-path" fill="url(#grad-wave-front)" />
      <path id="wave-front-stripe" fill="url(#diagonal-stripes)" />
    </g>

    <!-- MISREGISTER GROUP: KEY LINE LAYER (Edges) -->
    <g class="reg-key">
      <path id="wave-front-keyline" fill="none" stroke="#0b1d33" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- MISREGISTER GROUP: FOAM CLAWS & RIM LAYER -->
    <g class="reg-foam" id="foam-group">
      <!-- Mid-layer foam rim & claws -->
      <path id="foam-mid-rim" fill="none" stroke="#f6efdc" stroke-width="4" stroke-linecap="round" />
      <g id="foam-mid-claws"></g>

      <!-- Front-layer foam rim & great wave claws -->
      <path id="foam-front-rim" fill="none" stroke="#f6efdc" stroke-width="5" stroke-linecap="round" />
      <g id="foam-front-claws"></g>

      <!-- Free-drifting sea spray flecks -->
      <g id="flecks-container"></g>
    </g>

    <!-- MISREGISTER GROUP: RED SEAL STAMP -->
    <g class="reg-seal" transform="translate(68, 62)">
      <g filter="url(#ink-bleed)">
        <!-- Outer Stamp Box -->
        <rect x="0" y="0" width="82" height="114" rx="6" fill="#b8322a" />
        <!-- Inner Carved White Border -->
        <rect x="5.5" y="5.5" width="71" height="103" rx="4" fill="none" stroke="#efe3c6" stroke-width="1.8" />
        <!-- Seal Text in Cream Serif Caps -->
        <text x="41" y="27" fill="#efe3c6" font-family="'Palatino Linotype', Georgia, serif" font-weight="bold" font-size="14" letter-spacing="2" text-anchor="middle">NAMI</text>
        <text x="41" y="51" fill="#efe3c6" font-family="'Palatino Linotype', Georgia, serif" font-weight="bold" font-size="14" letter-spacing="2" text-anchor="middle">NO</text>
        <text x="41" y="75" fill="#efe3c6" font-family="'Palatino Linotype', Georgia, serif" font-weight="bold" font-size="14" letter-spacing="2" text-anchor="middle">YUME</text>
        <text x="41" y="99" fill="#efe3c6" font-family="'Palatino Linotype', Georgia, serif" font-weight="bold" font-size="10.5" letter-spacing="1.5" text-anchor="middle">MMXXVI</text>
      </g>
    </g>

    <!-- RIGHT EDGE INSCRIPTION (Cartouche) -->
    <g id="inscription" transform="translate(1120, 75)">
      <!-- Japanese Vertical Title: 波の夢 -->
      <text x="0" y="30" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Iowan Old Style', Georgia, serif"
            font-size="34" font-weight="bold" fill="#0b1d33" style="writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0.35em;">波の夢</text>
      <!-- Subtitle Romanized Vertical Caption -->
      <text x="-26" y="32" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-style="italic"
            font-size="12.5" fill="#203248" style="writing-mode: vertical-rl; letter-spacing: 0.18em;">Nami no Yume — Sea of Dreams</text>
    </g>

    <!-- Woodblock Multiply Grain Filter Top-Layer -->
    <rect width="1200" height="800" filter="url(#woodblock-grain)" style="mix-blend-mode: multiply;" pointer-events="none" />
  </svg>
</div>

<div class="controls">
  <button class="btn" id="btn-calm">Calm sea</button>
  <button class="btn" id="btn-storm">Rising storm</button>
  <button class="btn" id="btn-hold">Hold the block</button>
</div>

<script>
(function() {
  // Check for reduced motion
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // DOM Elements
  const waveBackPath = document.getElementById('wave-back-path');
  const waveBackStripe = document.getElementById('wave-back-stripe');
  const waveMidPath = document.getElementById('wave-mid-path');
  const waveMidStripe = document.getElementById('wave-mid-stripe');
  const waveFrontPath = document.getElementById('wave-front-path');
  const waveFrontStripe = document.getElementById('wave-front-stripe');
  const waveFrontKey = document.getElementById('wave-front-keyline');
  const foamMidRim = document.getElementById('foam-mid-rim');
  const foamFrontRim = document.getElementById('foam-front-rim');
  const foamMidClaws = document.getElementById('foam-mid-claws');
  const foamFrontClaws = document.getElementById('foam-front-claws');
  const boatsContainer = document.getElementById('boats-container');
  const flecksContainer = document.getElementById('flecks-container');

  const btnCalm = document.getElementById('btn-calm');
  const btnStorm = document.getElementById('btn-storm');
  const btnHold = document.getElementById('btn-hold');

  // Animation State
  let isFrozen = false;
  let targetMultiplier = 1.0;
  let currentMultiplier = 1.0;
  let time = 0;
  let lastTimestamp = 0;

  // Boats Setup (x positions on back wave)
  const boats = [
    { x: 380, baseScale: 0.8 },
    { x: 670, baseScale: 0.85 },
    { x: 910, baseScale: 0.75 }
  ];

  // Spray Flecks Setup (46 drifting flecks)
  const FLECK_COUNT = 46;
  const flecks = [];
  for (let i = 0; i < FLECK_COUNT; i++) {
    flecks.push({
      x: 180 + Math.random() * 880,
      y: 350 + Math.random() * 320,
      vx: 0.6 + Math.random() * 1.5,
      vy: -(0.8 + Math.random() * 1.8),
      size: 1.2 + Math.random() * 3.4,
      life: Math.random(),
      rate: 0.003 + Math.random() * 0.007
    });
  }

  // Wave harmonic evaluation function
  function evalWave(x, t, layer, ampMul) {
    if (layer === 0) {
      // Back wave
      const y0 = 475;
      const h1 = Math.sin(x * 0.0068 + t * 1.2) * 22;
      const h2 = Math.sin(x * 0.014 - t * 1.6 + 1.2) * 11;
      const h3 = Math.cos(x * 0.024 + t * 0.8) * 5;
      return y0 + (h1 + h2 + h3) * ampMul;
    } else if (layer === 1) {
      // Middle wave
      const y0 = 535;
      const h1 = Math.sin(x * 0.0082 - t * 1.5 + 2.0) * 32;
      const h2 = Math.sin(x * 0.016 + t * 1.1 + 0.5) * 16;
      const h3 = Math.cos(x * 0.031 - t * 2.1) * 7;
      return y0 + (h1 + h2 + h3) * ampMul;
    } else {
      // Front wave with asymmetric great crest
      const y0 = 615;
      const h1 = Math.sin(x * 0.0062 + t * 1.6 + 3.8) * 44;
      const h2 = Math.sin(x * 0.0135 - t * 1.4) * 24;
      const h3 = Math.cos(x * 0.026 + t * 2.3) * 10;

      // Great crest breathing Gaussian on left
      const crestMean = 310 + Math.sin(t * 0.7) * 45;
      const dx = x - crestMean;
      // Asymmetric standard deviation (steeper on leading/right edge)
      const sigma = dx < 0 ? 150 : 85;
      const gauss = Math.exp(-(dx * dx) / (2 * sigma * sigma));
      const breatheHeight = 330 + Math.sin(t * 1.1) * 28;
      const crest = -gauss * breatheHeight;

      return y0 + ((h1 + h2 + h3) * 0.65 + crest) * ampMul;
    }
  }

  // Detect crests (local minima of y)
  function findCrests(step, layer, ampMul, t) {
    const crests = [];
    const xMin = 40;
    const xMax = 1160;
    for (let x = xMin; x <= xMax; x += step) {
      const yL = evalWave(x - step, t, layer, ampMul);
      const yC = evalWave(x, t, layer, ampMul);
      const yR = evalWave(x + step, t, layer, ampMul);
      if (yC < yL && yC < yR) {
        // Local peak in wave height (crest)
        const prominence = Math.max(yL - yC, yR - yC);
        crests.push({ x, y: yC, prominence });
      }
    }
    return crests;
  }

  // Build claw SVG snippet
  function renderClaws(crests, direction) {
    let html = '';
    crests.forEach(c => {
      // Finger count based on crest height prominence
      const fingerCount = c.prominence > 4.5 ? 5 : (c.prominence > 2 ? 4 : 3);
      const baseScale = Math.min(Math.max(c.prominence * 1.7, 9), 32);

      for (let i = 0; i < fingerCount; i++) {
        const angleOffset = (i - (fingerCount - 1) / 2) * 0.38;
        const mainAngle = (direction > 0 ? 0.35 : 2.8) + angleOffset;
        let cx = c.x + (i - (fingerCount - 1) / 2) * 8;
        let cy = c.y + Math.abs(i - 2) * 2;
        let r = baseScale * 0.36;

        // Draw segmented curling hook fingers made of shrinking circles
        for (let seg = 0; seg < 4; seg++) {
          html += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${Math.max(r, 1.4).toFixed(1)}" fill="#f6efdc" />`;
          cx += Math.cos(mainAngle + seg * 0.5 * direction) * (r * 1.25);
          cy -= Math.sin(0.8 - seg * 0.45) * (r * 1.3);
          r *= 0.68;
        }
      }
    });
    return html;
  }

  // Render Japanese traditional wooden skiff (Choki-bune style)
  function renderBoats(t, ampMul) {
    let svg = '';
    boats.forEach(b => {
      const x = b.x;
      const y = evalWave(x, t, 0, ampMul);
      const dy = (evalWave(x + 4, t, 0, ampMul) - evalWave(x - 4, t, 0, ampMul)) / 8;
      const slopeAngle = Math.atan(dy) * (180 / Math.PI);
      const rockAngle = Math.sin(t * 2.2 + x) * 5.5;
      const totalAngle = slopeAngle * 0.85 + rockAngle;

      svg += `<g transform="translate(${x}, ${y - 4}) rotate(${totalAngle.toFixed(2)}) scale(${b.baseScale})">
        <!-- Hull -->
        <path d="M -54,-2 C -24,8 24,8 54,-4 C 44,7 -35,9 -54,-2 Z" fill="#9e7c53" stroke="#0b1d33" stroke-width="1.6" />
        <path d="M -48,-1 C -20,4 20,4 46,-2" stroke="#684a29" stroke-width="1.4" fill="none" />
        <!-- 4 Hunched Rowers -->
        <g fill="#435e7a" stroke="#0b1d33" stroke-width="1.1">
          <!-- Rower 1 -->
          <circle cx="-32" cy="-10" r="3.6" fill="#efe3c6" />
          <path d="M -35,-8 C -33,-3 -26,-2 -27,-7 Z" />
          <!-- Rower 2 -->
          <circle cx="-13" cy="-11" r="3.6" fill="#efe3c6" />
          <path d="M -16,-9 C -14,-4 -7,-3 -8,-8 Z" />
          <!-- Rower 3 -->
          <circle cx="7" cy="-12" r="3.6" fill="#efe3c6" />
          <path d="M 4,-10 C 6,-5 13,-4 12,-9 Z" />
          <!-- Rower 4 -->
          <circle cx="27" cy="-13" r="3.6" fill="#efe3c6" />
          <path d="M 24,-11 C 26,-6 33,-5 32,-10 Z" />
        </g>
        <!-- Oars -->
        <line x1="-30" y1="-5" x2="-44" y2="15" stroke="#efe3c6" stroke-width="1.6" />
        <line x1="-11" y1="-6" x2="-25" y2="14" stroke="#efe3c6" stroke-width="1.6" />
        <line x1="9" y1="-7" x2="-5" y2="13" stroke="#efe3c6" stroke-width="1.6" />
        <line x1="29" y1="-8" x2="15" y2="12" stroke="#efe3c6" stroke-width="1.6" />
      </g>`;
    });
    boatsContainer.innerHTML = svg;
  }

  // Update spray flecks
  function updateFlecks(dt) {
    let svg = '';
    flecks.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;
      f.life += f.rate;
      if (f.life > 1 || f.y < 160 || f.x > 1200) {
        f.life = 0;
        f.x = 100 + Math.random() * 450;
        f.y = 480 + Math.random() * 250;
      }
      // Fade in then out
      const alpha = Math.sin(f.life * Math.PI) * 0.85;
      svg += `<circle cx="${f.x.toFixed(1)}" cy="${f.y.toFixed(1)}" r="${f.size.toFixed(1)}" fill="#f6efdc" opacity="${alpha.toFixed(2)}" />`;
    });
    flecksContainer.innerHTML = svg;
  }

  // Generate SVG path coordinate strings
  function buildWaveGeometry(layer, t, ampMul, step = 14) {
    let d = `M 0,${evalWave(0, t, layer, ampMul).toFixed(1)} `;
    let rimD = `M 0,${evalWave(0, t, layer, ampMul).toFixed(1)} `;
    for (let x = step; x <= 1200; x += step) {
      const y = evalWave(x, t, layer, ampMul).toFixed(1);
      d += `L ${x},${y} `;
      rimD += `L ${x},${y} `;
    }
    // Seal bottom box
    d += 'L 1200,800 L 0,800 Z';
    return { fillPath: d, rimPath: rimD };
  }

  // Main animation frame
  function render(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
    lastTimestamp = timestamp;

    if (!isFrozen && !prefersReduced) {
      // Smooth amplitude easing
      currentMultiplier += (targetMultiplier - currentMultiplier) * 0.04;
      time += dt;
    }

    // 1. Update Back Wave
    const waveBackGeo = buildWaveGeometry(0, time, currentMultiplier, 18);
    waveBackPath.setAttribute('d', waveBackGeo.fillPath);
    waveBackStripe.setAttribute('d', waveBackGeo.fillPath);

    // 2. Update Boats on Back wave
    renderBoats(time, currentMultiplier);

    // 3. Update Middle Wave & Foam
    const waveMidGeo = buildWaveGeometry(1, time, currentMultiplier, 14);
    waveMidPath.setAttribute('d', waveMidGeo.fillPath);
    waveMidStripe.setAttribute('d', waveMidGeo.fillPath);
    foamMidRim.setAttribute('d', waveMidGeo.rimPath);

    const midCrests = findCrests(22, 1, currentMultiplier, time);
    foamMidClaws.innerHTML = renderClaws(midCrests, 1);

    // 4. Update Front Wave, Claws & Dark Key-Line
    const waveFrontGeo = buildWaveGeometry(2, time, currentMultiplier, 10);
    waveFrontPath.setAttribute('d', waveFrontGeo.fillPath);
    waveFrontStripe.setAttribute('d', waveFrontGeo.fillPath);
    waveFrontKey.setAttribute('d', waveFrontGeo.rimPath);
    foamFrontRim.setAttribute('d', waveFrontGeo.rimPath);

    const frontCrests = findCrests(20, 2, currentMultiplier, time);
    foamFrontClaws.innerHTML = renderClaws(frontCrests, 1);

    // 5. Update Flecks
    if (!isFrozen && !prefersReduced) {
      updateFlecks(dt);
    }

    if (!prefersReduced) {
      requestAnimationFrame(render);
    }
  }

  // Interactive Buttons
  btnCalm.addEventListener('click', () => {
    targetMultiplier = 0.45;
    btnCalm.classList.add('active');
    btnStorm.classList.remove('active');
  });

  btnStorm.addEventListener('click', () => {
    targetMultiplier = 1.6;
    btnStorm.classList.add('active');
    btnCalm.classList.remove('active');
  });

  btnHold.addEventListener('click', () => {
    isFrozen = !isFrozen;
    btnHold.classList.toggle('active', isFrozen);
    btnHold.textContent = isFrozen ? 'Release block' : 'Hold the block';
  });

  // Start animation loop or single frame for reduced motion
  requestAnimationFrame(render);

  if (prefersReduced) {
    targetMultiplier = 1.0;
    currentMultiplier = 1.0;
    render(100);
  }
})();
</script>
