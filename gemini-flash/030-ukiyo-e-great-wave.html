<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>波の夢 · Nami no Yume — Ukiyo-e Animated Seascape</title>
  <style>
    /* -------------------------------------------------------------
       RESET & ROOT VARIABLES
       ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --desk-base: #2a231d;
      --desk-lift: #44362b;
      --desk-deep: #15110d;
      --paper-cream: #efe3c6;
      --paper-warm: #f6efdc;
      --ink-dark: #0b1d33;
      --seal-red: #b8322a;
      --serif-stack: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      --jp-serif: 'Yu Mincho', 'Hiragino Mincho ProN', 'MS Mincho', 'Songti SC', serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--desk-base);
      background-image: 
        radial-gradient(ellipse 75% 60% at 50% 38%, var(--desk-lift) 0%, var(--desk-base) 58%, var(--desk-deep) 100%),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 48px);
      background-attachment: fixed;
      color: var(--paper-warm);
      font-family: var(--serif-stack);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* -------------------------------------------------------------
       STAGE & PRINT SHEET
       ------------------------------------------------------------- */
    .desk-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1240px;
    }

    .print-frame {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 3 / 2;
      background-color: var(--paper-cream);
      border-radius: 2px;
      cursor: crosshair;
      box-shadow:
        0 35px 80px -15px rgba(0, 0, 0, 0.88),
        0 18px 36px -10px rgba(0, 0, 0, 0.7),
        0 4px 12px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 240, 215, 0.08),
        inset 0 0 35px rgba(185, 150, 100, 0.12);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Subtle paper edge highlight */
    .print-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
      border-radius: 2px;
    }

    .ukiyo-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      shape-rendering: geometricPrecision;
    }

    /* -------------------------------------------------------------
       WOODBLOCK REGISTRATION SHIFT (HOVER EFFECT)
       Over 0.9s:
       - Blue block: +5px, -3px
       - Foam block: -4px, +2px
       - Key block:  +2px, +3px
       - Seal stamp: -3px, -2px with 1-deg rotation
       ------------------------------------------------------------- */
    .block-blue,
    .block-foam,
    .block-key,
    .block-seal {
      transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .print-frame:hover .block-blue {
      transform: translate(5px, -3px);
    }

    .print-frame:hover .block-foam {
      transform: translate(-4px, 2px);
    }

    .print-frame:hover .block-key {
      transform: translate(2px, 3px);
    }

    .print-frame:hover .block-seal {
      transform: translate(-3px, -2px) rotate(1deg);
      transform-origin: 96px 108px;
    }

    /* -------------------------------------------------------------
       CONTROLS BAR
       ------------------------------------------------------------- */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .woodblock-btn {
      appearance: none;
      background: #1e1814;
      background-image: linear-gradient(180deg, #2c231c 0%, #1a1410 100%);
      color: #dfd3ba;
      border: 1px solid #4a3c30;
      border-radius: 4px;
      padding: 0.65rem 1.6rem;
      font-family: var(--serif-stack);
      font-size: 1.05rem;
      font-style: italic;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
      position: relative;
    }

    .woodblock-btn:hover {
      background-image: linear-gradient(180deg, #372c23 0%, #221b15 100%);
      color: #f7ecd5;
      border-color: #6e5845;
      transform: translateY(-1.5px);
      box-shadow: 
        0 7px 16px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .woodblock-btn:active {
      transform: translateY(1px);
      box-shadow: 
        0 2px 5px rgba(0, 0, 0, 0.6),
        inset 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    .woodblock-btn.is-active {
      background-image: linear-gradient(180deg, #16120e 0%, #251e17 100%);
      color: #e5b382;
      border-color: #8c6742;
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.8),
        0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .woodblock-btn.is-active::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #d49a5b;
      box-shadow: 0 0 6px rgba(212, 154, 91, 0.8);
    }

    .woodblock-btn:focus-visible {
      outline: 2px solid #b88652;
      outline-offset: 3px;
    }

    .meta-caption {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: #8a7866;
      font-style: italic;
      text-align: center;
    }

    .meta-caption span {
      opacity: 0.75;
      padding: 0 0.5rem;
    }

    /* -------------------------------------------------------------
       PREFERS-REDUCED-MOTION
       ------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .block-blue,
      .block-foam,
      .block-key,
      .block-seal {
        transition: none !important;
        transform: none !important;
      }
      .woodblock-btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <main class="desk-stage">
    <!-- 3:2 Edo-period woodblock sheet (1200x800 viewBox) -->
    <div class="print-frame" id="printFrame" role="region" aria-label="Original Edo-period animated woodblock print: Nami no Yume">
      <svg 
        id="ukiyoSvg" 
        class="ukiyo-svg" 
        viewBox="0 0 1200 800" 
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink">

        <defs>
          <!-- 1. Sky Gradient: pale straw (#e9dcb9) -> grey-beige -> cool sea-grey (#9fb0b3) at horizon -->
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e9dcb9" />
            <stop offset="28%" stop-color="#e2d6b3" />
            <stop offset="52%" stop-color="#c5c3b6" />
            <stop offset="76%" stop-color="#9fb0b3" />
            <stop offset="100%" stop-color="#8fa2a6" />
          </linearGradient>

          <!-- 2. Mountain Gradient: cream snow to slate (#3f5470) -->
          <linearGradient id="mountainGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#fbf7ee" />
            <stop offset="22%" stop-color="#f0e9d6" />
            <stop offset="38%" stop-color="#b4c0cd" />
            <stop offset="55%" stop-color="#677c95" />
            <stop offset="85%" stop-color="#4a5e78" />
            <stop offset="100%" stop-color="#3f5470" />
          </linearGradient>

          <!-- 3. Faint Sun Disc Radial Gradient -->
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f9f1de" stop-opacity="0.75" />
            <stop offset="60%" stop-color="#f4e4c4" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#e9dcb9" stop-opacity="0" />
          </radialGradient>

          <!-- 4. Prussian-blue Gradations -->
          <!-- Back wave: #6f9cc2 -> #3d6d9a -> #1b3a5c -->
          <linearGradient id="waveBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6f9cc2" />
            <stop offset="45%" stop-color="#3d6d9a" />
            <stop offset="100%" stop-color="#1b3a5c" />
          </linearGradient>

          <!-- Middle wave: #4a7ba8 -> #2f5a86 -> #132c47 -->
          <linearGradient id="waveMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4a7ba8" />
            <stop offset="42%" stop-color="#2f5a86" />
            <stop offset="100%" stop-color="#132c47" />
          </linearGradient>

          <!-- Front wave: #3a6b98 -> #1b3a5c -> #0f2540 -->
          <linearGradient id="waveFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3a6b98" />
            <stop offset="38%" stop-color="#1b3a5c" />
            <stop offset="100%" stop-color="#0f2540" />
          </linearGradient>

          <!-- 5. Diagonal Carved Water Stripes Pattern -->
          <pattern id="diagonalStripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="14" stroke="#f6efdc" stroke-width="1.6" stroke-opacity="0.26" />
            <line x1="7" y1="0" x2="7" y2="14" stroke="#061324" stroke-width="0.9" stroke-opacity="0.18" />
          </pattern>

          <!-- 6. Anisotropic Paper Fibres Filter (feTurbulence) -->
          <filter id="paperFibresFilter" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.003 0.18" numOctaves="3" result="fibres" />
            <feColorMatrix type="matrix" 
              values="0 0 0 0 0.82
                      0 0 0 0 0.74
                      0 0 0 0 0.58
                      0 0 0 0.14 0" in="fibres" result="fibreColored" />
            <feComposite operator="in" in2="SourceGraphic" />
          </filter>

          <!-- 7. Red Seal Stamp Ink-Bleed Filter (feMorphology dilate + slight blur) -->
          <filter id="inkBleedFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feMorphology operator="dilate" radius="0.8" in="SourceGraphic" result="dilated" />
            <feGaussianBlur stdDeviation="0.65" in="dilated" result="blurred" />
            <feMerge>
              <feMergeNode in="blurred" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- 8. Multiply-mode Grain Layer Filter (fractalNoise at baseFrequency 0.9, saturate 0, alpha slope 0.18) -->
          <filter id="grainFilter" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
            <feColorMatrix type="saturate" values="0" in="noise" result="desat" />
            <feComponentTransfer in="desat" result="alphaSlope">
              <feFuncR type="identity" />
              <feFuncG type="identity" />
              <feFuncB type="identity" />
              <feFuncA type="linear" slope="0.18" />
            </feComponentTransfer>
            <feBlend mode="multiply" in="SourceGraphic" in2="alphaSlope" />
          </filter>

          <!-- Oshiokuri-bune Cargo Boat Template (Back swell) -->
          <g id="rowboatDef">
            <!-- Sleek cedar hull with ukiyo-e wood tones -->
            <path d="M -36,0 C -22,7 22,7 36,-1 L 34,-4 C 18,1 -16,1 -32,-3 Z" fill="#885b32" stroke="#0b1d33" stroke-width="1.3" stroke-linejoin="round" />
            <path d="M -32,-3 L 34,-4" stroke="#442812" stroke-width="1.8" />
            <path d="M -36,0 L -40,-4 L -35,-4 Z" fill="#6a4422" stroke="#0b1d33" stroke-width="1" />
            <!-- Rowers 1 to 4: hunched forward with indigo robes and straw sashes -->
            <!-- Rower 1 (aft) -->
            <ellipse cx="-16" cy="-6" rx="3.5" ry="4.5" transform="rotate(32 -16 -6)" fill="#203d5c" stroke="#0b1d33" stroke-width="0.9" />
            <circle cx="-13.5" cy="-10.5" r="2.2" fill="#dcb88d" stroke="#0b1d33" stroke-width="0.8" />
            <path d="M -15,-12 Q -13,-12.8 -12,-11" stroke="#0b1d33" stroke-width="0.9" fill="none" />
            <line x1="-15" y1="-5" x2="-26" y2="7" stroke="#754e28" stroke-width="1.2" stroke-linecap="round" />
            <!-- Rower 2 -->
            <ellipse cx="-6" cy="-6" rx="3.5" ry="4.5" transform="rotate(32 -6 -6)" fill="#203d5c" stroke="#0b1d33" stroke-width="0.9" />
            <circle cx="-3.5" cy="-10.5" r="2.2" fill="#dcb88d" stroke="#0b1d33" stroke-width="0.8" />
            <path d="M -5,-12 Q -3,-12.8 -2,-11" stroke="#0b1d33" stroke-width="0.9" fill="none" />
            <line x1="-5" y1="-5" x2="-16" y2="7" stroke="#754e28" stroke-width="1.2" stroke-linecap="round" />
            <!-- Rower 3 -->
            <ellipse cx="4" cy="-6" rx="3.5" ry="4.5" transform="rotate(32 4 -6)" fill="#203d5c" stroke="#0b1d33" stroke-width="0.9" />
            <circle cx="6.5" cy="-10.5" r="2.2" fill="#dcb88d" stroke="#0b1d33" stroke-width="0.8" />
            <path d="M 5,-12 Q 7,-12.8 8,-11" stroke="#0b1d33" stroke-width="0.9" fill="none" />
            <line x1="5" y1="-5" x2="-6" y2="7" stroke="#754e28" stroke-width="1.2" stroke-linecap="round" />
            <!-- Rower 4 (bow) -->
            <ellipse cx="14" cy="-6" rx="3.5" ry="4.5" transform="rotate(32 14 -6)" fill="#203d5c" stroke="#0b1d33" stroke-width="0.9" />
            <circle cx="16.5" cy="-10.5" r="2.2" fill="#dcb88d" stroke="#0b1d33" stroke-width="0.8" />
            <path d="M 15,-12 Q 17,-12.8 18,-11" stroke="#0b1d33" stroke-width="0.9" fill="none" />
            <line x1="15" y1="-5" x2="4" y2="7" stroke="#754e28" stroke-width="1.2" stroke-linecap="round" />
          </g>
        </defs>

        <!-- =========================================================
             LAYER GROUP: BASE (Paper, Sky, Sun, Mountain, Clouds)
             ========================================================= -->
        <g id="baseBlock" class="block-base">
          <!-- Warm cream paper substrate (#efe3c6) -->
          <rect width="1200" height="800" fill="#efe3c6" />

          <!-- Sky gradient band running to cool sea-grey at horizon -->
          <rect width="1200" height="560" fill="url(#skyGrad)" />

          <!-- Horizontal paper fibres via anisotropic turbulence -->
          <rect width="1200" height="800" filter="url(#paperFibresFilter)" opacity="0.65" />

          <!-- Faint sun disc upper right -->
          <circle cx="980" cy="165" r="62" fill="url(#sunGrad)" />

          <!-- Distant snow-capped mountain centred behind swells -->
          <!-- Flank Base and Peak: Fuji-like profile centred at X=615 -->
          <g id="mountainGroup">
            <!-- Mountain silhouette with snow cap gradient to slate (#3f5470) -->
            <path d="M 440,510 
                     C 510,480 560,370 590,302 
                     C 597,286 605,282 615,282 
                     C 625,282 633,286 640,302 
                     C 670,370 720,480 790,510 
                     Z" 
                  fill="url(#mountainGrad)" />

            <!-- Stylized ukiyo-e snow tongues cascading down the ridges -->
            <path d="M 590,302 
                     L 594,332 L 599,320 L 604,342 L 609,325 
                     L 615,350 L 621,326 L 626,344 L 631,322 
                     L 636,334 L 640,302 
                     C 633,286 625,282 615,282 
                     C 605,282 597,286 590,302 Z" 
                  fill="#fdfbf7" opacity="0.95" />

            <!-- Distant mountain key line -->
            <path d="M 440,510 
                     C 510,480 560,370 590,302 
                     C 597,286 605,282 615,282 
                     C 625,282 633,286 640,302 
                     C 670,370 720,480 790,510" 
                  fill="none" stroke="#2a384b" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

            <!-- Wind-blown stylized horizontal cloud strokes trailing across mountain -->
            <g id="cloudStrokes" fill="#efe7d4" fill-opacity="0.55">
              <path d="M 370,410 C 430,404 490,416 570,412 C 540,419 460,422 370,410 Z" />
              <path d="M 660,395 C 730,388 810,402 890,398 C 830,406 740,407 660,395 Z" />
              <path d="M 460,452 C 540,446 620,458 710,454 C 640,461 550,463 460,452 Z" />
              <path d="M 280,360 C 350,354 430,364 510,360 C 450,367 360,368 280,360 Z" />
              <path d="M 720,345 C 780,340 850,349 920,346 C 870,352 790,353 720,345 Z" />
            </g>
          </g>
        </g>

        <!-- =========================================================
             LAYER GROUP: BLUE BLOCK (Prussian-blue Wave Gradations)
             Slips +5px, -3px on hover
             ========================================================= -->
        <g id="blueBlock" class="block-blue">
          <!-- Back Wave Prussian Blue Fill -->
          <path id="waveBackPath" fill="url(#waveBackGrad)" />

          <!-- Middle Wave Prussian Blue Fill -->
          <path id="waveMidPath" fill="url(#waveMidGrad)" />

          <!-- Front Wave Prussian Blue Fill -->
          <path id="waveFrontPath" fill="url(#waveFrontGrad)" />
        </g>

        <!-- =========================================================
             LAYER GROUP: FOAM BLOCK (Carved Stripes, Foam Rims, Foam Claws, Flecks)
             Slips -4px, +2px on hover
             ========================================================= -->
        <g id="foamBlock" class="block-foam">
          <!-- Overlaid diagonal carved woodblock water stripes -->
          <path id="waveBackStripes" fill="url(#diagonalStripes)" />
          <path id="waveMidStripes" fill="url(#diagonalStripes)" />
          <path id="waveFrontStripes" fill="url(#diagonalStripes)" />

          <!-- Dynamic foam rims along the wave crests (Cream #f6efdc) -->
          <path id="foamRimBack" fill="#f6efdc" opacity="0.88" />
          <path id="foamRimMid" fill="#f6efdc" opacity="0.92" />
          <path id="foamRimFront" fill="#f6efdc" opacity="0.98" />

          <!-- Dynamic Foam Claws: curling fingers made of shrinking circles hooking forward -->
          <g id="foamClawsGroup"></g>

          <!-- 46 Foam Flecks drifting up and forward -->
          <g id="foamFlecksGroup"></g>
        </g>

        <!-- =========================================================
             LAYER GROUP: KEY BLOCK (Key-lines, Rowboats, Cartouche)
             Slips +2px, +3px on hover
             ========================================================= -->
        <g id="keyBlock" class="block-key">
          <!-- Three small wooden boats sitting on the back swell -->
          <g id="boatGroup0" transform="translate(420, 450)"></g>
          <g id="boatGroup1" transform="translate(730, 470)"></g>
          <g id="boatGroup2" transform="translate(980, 455)"></g>

          <!-- Front wave dark 2.5px key-line edge in #0b1d33 -->
          <path id="waveFrontKeyline" fill="none" stroke="#0b1d33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Middle wave fine key-line edge -->
          <path id="waveMidKeyline" fill="none" stroke="#0b1d33" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

          <!-- Vertical Japanese Title Placard & Romanised Caption (Right edge) -->
          <g id="titleCartouche" transform="translate(1085, 60)">
            <!-- Outer ink border box -->
            <rect x="0" y="0" width="76" height="260" fill="#f5ede0" stroke="#0b1d33" stroke-width="2" />
            <!-- Inner thin border line -->
            <rect x="4" y="4" width="68" height="252" fill="none" stroke="#0b1d33" stroke-width="0.8" stroke-dasharray="8 2" />

            <!-- Vertical Japanese title: "波の夢" in bold upright serif -->
            <text x="44" y="32" 
                  fill="#0b1d33" 
                  font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'MS Mincho', 'Songti SC', 'Iowan Old Style', serif" 
                  font-size="28" 
                  font-weight="900" 
                  style="writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0.32em;">波の夢</text>

            <!-- Smaller mixed-orientation vertical romanised caption beside it -->
            <text x="18" y="24" 
                  fill="#475b72" 
                  font-family="'Iowan Old Style', Palatino, Georgia, serif" 
                  font-size="9.5" 
                  font-weight="600" 
                  font-style="italic"
                  style="writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 0.18em;">NAMI NO YUME · SEASCAPE</text>
          </g>
        </g>

        <!-- =========================================================
             LAYER GROUP: SEAL STAMP (Top-left Red Seal Stamp)
             Slips -3px, -2px with 1-deg rotation on hover
             ========================================================= -->
        <g id="sealBlock" class="block-seal">
          <g id="redSealStamp" transform="translate(68, 65)">
            <!-- Red seal background in #b8322a with ink-bleed filter -->
            <rect x="0" y="0" width="64" height="88" rx="3" ry="3" fill="#b8322a" filter="url(#inkBleedFilter)" />
            <!-- Inner cream border -->
            <rect x="4" y="4" width="56" height="80" rx="2" ry="2" fill="none" stroke="#f6efdc" stroke-width="1.4" opacity="0.9" />
            <!-- Seal Text: NAMI / NO / YUME / MMXXVI in cream capitals -->
            <g fill="#f6efdc" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-weight="800" font-size="10.5" text-anchor="middle" letter-spacing="0.14em">
              <text x="32" y="23">NAMI</text>
              <text x="32" y="40">NO</text>
              <text x="32" y="57">YUME</text>
              <text x="32" y="74" font-size="8.5" font-weight="700">MMXXVI</text>
            </g>
          </g>
        </g>

        <!-- =========================================================
             LAYER: FINAL MULTIPLY-MODE GRAIN OVERLAY
             (fractalNoise at baseFrequency 0.9, saturate 0, alpha slope 0.18)
             ========================================================= -->
        <rect width="1200" height="800" filter="url(#grainFilter)" style="mix-blend-mode: multiply; pointer-events: none;" />

      </svg>
    </div>

    <!-- Controls below the print: three italic serif buttons -->
    <nav class="controls-bar" aria-label="Seascape atmospheric controls">
      <button type="button" id="btnCalm" class="woodblock-btn" aria-pressed="false">
        <em>Calm sea</em>
      </button>
      <button type="button" id="btnStorm" class="woodblock-btn" aria-pressed="false">
        <em>Rising storm</em>
      </button>
      <button type="button" id="btnHold" class="woodblock-btn" aria-pressed="false">
        <em>Hold the block</em>
      </button>
    </nav>

    <p class="meta-caption">
      <em>Mokuhanga Woodblock Impression</em>
      <span>·</span>
      <em>Hover sheet for registration shift</em>
      <span>·</span>
      <em>Edo Horizon MMXXVI</em>
    </p>
  </main>

  <!-- =============================================================
       JAVASCRIPT: MATHEMATICAL WAVE HARMONICS, FLECK DRIFT & BOATS
       ============================================================= -->
  <script>
    (function () {
      'use strict';

      // -------------------------------------------------------------
      // CONFIGURATION & DOM ELEMENTS
      // -------------------------------------------------------------
      const svg = document.getElementById('ukiyoSvg');
      const waveBackPath = document.getElementById('waveBackPath');
      const waveMidPath = document.getElementById('waveMidPath');
      const waveFrontPath = document.getElementById('waveFrontPath');
      const waveBackStripes = document.getElementById('waveBackStripes');
      const waveMidStripes = document.getElementById('waveMidStripes');
      const waveFrontStripes = document.getElementById('waveFrontStripes');
      const waveFrontKeyline = document.getElementById('waveFrontKeyline');
      const waveMidKeyline = document.getElementById('waveMidKeyline');
      const foamRimBack = document.getElementById('foamRimBack');
      const foamRimMid = document.getElementById('foamRimMid');
      const foamRimFront = document.getElementById('foamRimFront');
      const foamClawsGroup = document.getElementById('foamClawsGroup');
      const foamFlecksGroup = document.getElementById('foamFlecksGroup');
      const boatGroup0 = document.getElementById('boatGroup0');
      const boatGroup1 = document.getElementById('boatGroup1');
      const boatGroup2 = document.getElementById('boatGroup2');
      const btnCalm = document.getElementById('btnCalm');
      const btnStorm = document.getElementById('btnStorm');
      const btnHold = document.getElementById('btnHold');

      // Populate boat instances from template
      const boatDef = document.getElementById('rowboatDef');
      [boatGroup0, boatGroup1, boatGroup2].forEach(grp => {
        const clone = boatDef.cloneNode(true);
        clone.removeAttribute('id');
        grp.appendChild(clone);
      });

      // Simulation State
      let time = 0;
      let isPaused = false;
      let globalAmp = 1.0;
      let targetAmp = 1.0;
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // -------------------------------------------------------------
      // 46 FOAM FLECKS
      // "Forty-six foam flecks drift up and forward, fading in and out"
      // -------------------------------------------------------------
      const FLECK_COUNT = 46;
      const flecks = [];
      const fleckElements = [];

      for (let i = 0; i < FLECK_COUNT; i++) {
        // Distribute initial lifespans
        const fleck = {
          x: 140 + Math.random() * 420,
          y: 260 + Math.random() * 240,
          vx: 1.2 + Math.random() * 2.2,
          vy: -(0.8 + Math.random() * 1.9),
          radius: 1.5 + Math.random() * 2.8,
          life: Math.random(),
          speed: 0.005 + Math.random() * 0.008,
          wobblePhase: Math.random() * Math.PI * 2
        };
        flecks.push(fleck);

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('fill', '#f6efdc');
        circle.setAttribute('stroke', '#0b1d33');
        circle.setAttribute('stroke-width', '0.45');
        foamFlecksGroup.appendChild(circle);
        fleckElements.push(circle);
      }

      function resetFleck(fleck, greatCrestX, greatCrestY) {
        // Respawn predominantly from the great crest and breaking swells
        if (Math.random() < 0.78) {
          fleck.x = greatCrestX - 35 + (Math.random() - 0.3) * 110;
          fleck.y = greatCrestY + Math.random() * 55;
          fleck.vx = 1.4 + Math.random() * 2.4;
          fleck.vy = -(1.0 + Math.random() * 2.2);
        } else {
          // Occasional mid-crest fleck
          fleck.x = 620 + Math.random() * 480;
          fleck.y = 440 + Math.random() * 80;
          fleck.vx = 1.0 + Math.random() * 1.8;
          fleck.vy = -(0.7 + Math.random() * 1.5);
        }
        fleck.life = 0;
        fleck.radius = 1.4 + Math.random() * 2.6;
        fleck.speed = 0.005 + Math.random() * 0.008;
      }

      // -------------------------------------------------------------
      // THREE SINE HARMONICS PER LAYER + ASYMMETRIC GAUSSIAN CREST
      // Points computed every frame by JavaScript
      // -------------------------------------------------------------
      const WIDTH = 1200;
      const STEP = 6;
      const POINT_COUNT = Math.floor(1240 / STEP) + 1; // spanning x: -20 to 1220

      // Compute Back Wave Height at coordinate x
      function getBackWaveY(x, t, amp) {
        // Base Y: 465
        // Three sine harmonics with different speeds and directions
        const h1 = 14.0 * Math.sin(0.014 * x + t * 0.75);
        const h2 = 8.5 * Math.sin(0.026 * x - t * 0.52);
        const h3 = 4.8 * Math.sin(0.052 * x + t * 1.15);
        return 465 - (h1 + h2 + h3) * amp;
      }

      // Compute Middle Wave Height at coordinate x
      function getMidWaveY(x, t, amp) {
        // Base Y: 530
        const h1 = 26.0 * Math.sin(0.012 * x + t * 0.88);
        const h2 = 14.5 * Math.sin(0.024 * x + t * 1.35);
        const h3 = 7.0 * Math.sin(0.048 * x - t * 0.65);
        // Swelling mid-range ridge
        const midSwell = 36.0 * Math.exp(-Math.pow((x - (710 + 40 * Math.sin(t * 0.6))), 2) / (2 * 115 * 115));
        return 530 - (h1 + h2 + h3 + midSwell) * amp;
      }

      // Compute Front Wave Height & Great Crest at coordinate x
      function getFrontWaveData(x, t, amp) {
        // Base Y: 615
        const h1 = 30.0 * Math.sin(0.0105 * x + t * 0.82);
        const h2 = 16.0 * Math.sin(0.0210 * x + t * 1.28);
        const h3 = 8.5 * Math.sin(0.0420 * x + t * 0.95);

        // Asymmetric Gaussian "great crest" 330 units tall on the left:
        // "breathes slightly and is steeper on its leading edge so it appears to curl forward"
        const crestX = 295 + 18 * Math.sin(t * 0.85);
        const breath = 18.0 * Math.sin(t * 1.25);
        const crestHeight = (330.0 + breath) * amp;

        const dx = x - crestX;
        // Asymmetric widths: gentle rise on trailing left, steep plunging leading right
        const sigma = (dx < 0) ? 175.0 : 82.0;
        const gaussian = Math.exp(- (dx * dx) / (2 * sigma * sigma));

        // Forward curling overhang shaping:
        // When dx > 0 (leading face), crest leans forward toward the right
        let curlBonus = 0;
        if (dx > 0 && dx < 110) {
          curlBonus = 32.0 * Math.sin((dx / 110.0) * Math.PI) * gaussian;
        }

        const y = 615 - (gaussian * crestHeight + curlBonus) - (h1 + h2 + h3) * amp;
        return { y, crestX, crestHeight, isGreatCrestRegion: gaussian > 0.45 };
      }

      // -------------------------------------------------------------
      // BUILD SVG PATHS & FOAM MESHES
      // -------------------------------------------------------------
      function updateWaves() {
        const xStart = -20;
        const xEnd = 1220;

        // Collect point buffers
        const ptsBack = [];
        const ptsMid = [];
        const ptsFront = [];
        let greatCrestX = 295;
        let greatCrestY = 285;
        let minFrontY = 9999;

        for (let i = 0; i <= POINT_COUNT; i++) {
          const x = xStart + i * STEP;
          if (x > xEnd + STEP) break;

          const yBack = getBackWaveY(x, time, globalAmp);
          const yMid = getMidWaveY(x, time, globalAmp);
          const frontData = getFrontWaveData(x, time, globalAmp);

          ptsBack.push({ x, y: yBack });
          ptsMid.push({ x, y: yMid });
          ptsFront.push({ x, y: frontData.y });

          if (frontData.y < minFrontY) {
            minFrontY = frontData.y;
            greatCrestX = frontData.crestX;
            greatCrestY = frontData.y;
          }
        }

        // 1. Build Wave Solid Filled Paths (down to bottom y=830)
        let dBack = `M -20,830 L -20,${ptsBack[0].y.toFixed(1)}`;
        let dMid = `M -20,830 L -20,${ptsMid[0].y.toFixed(1)}`;
        let dFront = `M -20,830 L -20,${ptsFront[0].y.toFixed(1)}`;
        let dFrontKey = `M -20,${ptsFront[0].y.toFixed(1)}`;
        let dMidKey = `M -20,${ptsMid[0].y.toFixed(1)}`;

        for (let i = 1; i < ptsBack.length; i++) {
          const xb = ptsBack[i].x.toFixed(1);
          const yb = ptsBack[i].y.toFixed(1);
          dBack += ` L ${xb},${yb}`;

          const xm = ptsMid[i].x.toFixed(1);
          const ym = ptsMid[i].y.toFixed(1);
          dMid += ` L ${xm},${ym}`;
          dMidKey += ` L ${xm},${ym}`;

          const xf = ptsFront[i].x.toFixed(1);
          const yf = ptsFront[i].y.toFixed(1);
          dFront += ` L ${xf},${yf}`;
          dFrontKey += ` L ${xf},${yf}`;
        }

        dBack += ` L 1220,830 Z`;
        dMid += ` L 1220,830 Z`;
        dFront += ` L 1220,830 Z`;

        // Update Wave Paths & Overlaid Carved Stripe Copies
        waveBackPath.setAttribute('d', dBack);
        waveBackStripes.setAttribute('d', dBack);

        waveMidPath.setAttribute('d', dMid);
        waveMidStripes.setAttribute('d', dMid);
        waveMidKeyline.setAttribute('d', dMidKey);

        waveFrontPath.setAttribute('d', dFront);
        waveFrontStripes.setAttribute('d', dFront);
        waveFrontKeyline.setAttribute('d', dFrontKey);

        // 2. Build Foam Rims along the Crests (Cream #f6efdc)
        foamRimBack.setAttribute('d', buildFoamRimPath(ptsBack, 448, 7));
        foamRimMid.setAttribute('d', buildFoamRimPath(ptsMid, 508, 12));
        foamRimFront.setAttribute('d', buildFrontFoamRim(ptsFront, greatCrestX, greatCrestY));

        // 3. Detect Crests & Generate Foam Claws
        // "clusters of three to five curling fingers made of shrinking circles hooking in the wave's direction of travel"
        renderFoamClaws(ptsFront, ptsMid, greatCrestX, greatCrestY);

        // 4. Update Three Small Wooden Boats on the Back Swell
        updateBoats();

        // 5. Update 46 Foam Flecks
        updateFlecks(greatCrestX, greatCrestY);
      }

      // Build scalloped foam ribbon along upper crest contours
      function buildFoamRimPath(pts, thresholdY, depth) {
        let path = '';
        let inRim = false;
        let segPts = [];

        for (let i = 0; i < pts.length; i++) {
          const pt = pts[i];
          if (pt.y < thresholdY) {
            if (!inRim) {
              inRim = true;
              segPts = [pt];
            } else {
              segPts.push(pt);
            }
          } else if (inRim) {
            inRim = false;
            if (segPts.length > 2) {
              path += renderRimSegment(segPts, depth) + ' ';
            }
          }
        }
        if (inRim && segPts.length > 2) {
          path += renderRimSegment(segPts, depth);
        }
        return path;
      }

      function renderRimSegment(seg, depth) {
        // Forward trace along wave top
        let d = `M ${seg[0].x.toFixed(1)},${seg[0].y.toFixed(1)}`;
        for (let i = 1; i < seg.length; i++) {
          d += ` L ${seg[i].x.toFixed(1)},${seg[i].y.toFixed(1)}`;
        }
        // Return trace with scalloped foam lower boundary
        for (let i = seg.length - 1; i >= 0; i--) {
          const scallop = Math.sin((i / (seg.length - 1 || 1)) * Math.PI) * depth;
          const sy = (seg[i].y + scallop + 2.5).toFixed(1);
          d += ` L ${seg[i].x.toFixed(1)},${sy}`;
        }
        d += ' Z';
        return d;
      }

      // Special rich foam lip along the towering Great Crest
      function buildFrontFoamRim(pts, crestX, crestY) {
        const seg = [];
        for (let i = 0; i < pts.length; i++) {
          const pt = pts[i];
          // Near crest
          if (pt.x > crestX - 180 && pt.x < crestX + 115) {
            seg.push(pt);
          }
        }
        if (seg.length < 3) return '';

        let d = `M ${seg[0].x.toFixed(1)},${seg[0].y.toFixed(1)}`;
        for (let i = 1; i < seg.length; i++) {
          d += ` L ${seg[i].x.toFixed(1)},${seg[i].y.toFixed(1)}`;
        }
        // Thick churning foam froth under the curl
        for (let i = seg.length - 1; i >= 0; i--) {
          const factor = Math.sin((i / (seg.length - 1)) * Math.PI);
          const froth = factor * (22.0 * globalAmp) + (Math.sin(seg[i].x * 0.15 + time * 2) * 3);
          d += ` L ${seg[i].x.toFixed(1)},${(seg[i].y + froth + 3).toFixed(1)}`;
        }
        d += ' Z';
        return d;
      }

      // -------------------------------------------------------------
      // FOAM CLAWS GENERATOR
      // Clusters of 3 to 5 curling fingers made of shrinking circles
      // hooking in the wave's direction of travel; scales with prominence
      // -------------------------------------------------------------
      function renderFoamClaws(ptsFront, ptsMid, greatCrestX, greatCrestY) {
        let svgHtml = '';

        // 1. Towering Great Crest Claws (Multiple clusters cascading along the curling lip)
        const greatProminence = Math.max(30, 615 - greatCrestY);
        const greatScale = Math.min(2.4, (greatProminence / 140.0) * globalAmp);

        // Positions along the curling crest
        const clawAnchors = [
          { x: greatCrestX - 60, y: greatCrestY + 28, angle: 0.15, fingers: 4, scale: greatScale * 0.8 },
          { x: greatCrestX - 25, y: greatCrestY + 8,  angle: 0.35, fingers: 5, scale: greatScale * 0.95 },
          { x: greatCrestX + 8,  y: greatCrestY + 2,  angle: 0.55, fingers: 5, scale: greatScale * 1.05 },
          { x: greatCrestX + 42, y: greatCrestY + 16, angle: 0.82, fingers: 4, scale: greatScale * 0.9 },
          { x: greatCrestX + 78, y: greatCrestY + 45, angle: 1.15, fingers: 3, scale: greatScale * 0.75 },
          { x: greatCrestX + 105, y: greatCrestY + 88, angle: 1.45, fingers: 3, scale: greatScale * 0.6 }
        ];

        clawAnchors.forEach(anchor => {
          svgHtml += generateClawCluster(anchor.x, anchor.y, anchor.angle, anchor.fingers, anchor.scale);
        });

        // 2. Middle Layer Detected Crests Claws
        // Find local peaks on middle wave
        for (let i = 2; i < ptsMid.length - 2; i += 4) {
          const prev = ptsMid[i - 2].y;
          const curr = ptsMid[i].y;
          const next = ptsMid[i + 2].y;

          if (curr < prev && curr < next && curr < 495) {
            const prom = 530 - curr;
            const midScale = Math.max(0.4, Math.min(1.2, (prom / 55.0) * globalAmp));
            // Crest traveling forward to right
            svgHtml += generateClawCluster(ptsMid[i].x, curr + 2, 0.45, 3, midScale);
          }
        }

        // 3. Front wave minor secondary crest
        for (let i = 5; i < ptsFront.length - 5; i += 5) {
          const pt = ptsFront[i];
          if (pt.x > 750 && pt.x < 1120) {
            const prev = ptsFront[i - 3].y;
            const curr = pt.y;
            const next = ptsFront[i + 3].y;
            if (curr < prev && curr < next && curr < 580) {
              const prom = 615 - curr;
              const scale = Math.max(0.4, Math.min(1.3, (prom / 65.0) * globalAmp));
              svgHtml += generateClawCluster(pt.x, curr + 2, 0.5, 3, scale);
            }
          }
        }

        foamClawsGroup.innerHTML = svgHtml;
      }

      // Generate a single claw cluster: 3 to 5 curling fingers made of shrinking circles
      function generateClawCluster(cx, cy, baseAngle, fingerCount, scale) {
        let clusterHtml = `<g class="claw-cluster">`;
        const spreadStep = 0.28; // radians between fingers

        for (let f = 0; f < fingerCount; f++) {
          const fingerOffset = (f - (fingerCount - 1) / 2) * spreadStep;
          let angle = baseAngle + fingerOffset;
          let px = cx;
          let py = cy;

          // 5 shrinking circles per curling finger
          const circleCount = 5;
          const stepDist = 6.2 * scale;
          const initialR = 4.8 * scale;

          for (let c = 0; c < circleCount; c++) {
            const tCircle = c / (circleCount - 1);
            const radius = Math.max(0.8, initialR * (1.0 - tCircle * 0.68));

            // Circle element in cream #f6efdc with subtle ink edge
            clusterHtml += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${radius.toFixed(1)}" fill="#f6efdc" stroke="#0b1d33" stroke-width="0.5" />`;

            // Hook in the wave's direction of travel (curves forward and downward)
            const curlRate = (0.22 + tCircle * 0.28);
            angle += curlRate;
            px += Math.cos(angle) * stepDist;
            py += Math.sin(angle) * stepDist;
          }
        }
        clusterHtml += `</g>`;
        return clusterHtml;
      }

      // -------------------------------------------------------------
      // THREE SMALL WOODEN BOATS ON THE BACK SWELL
      // "translated to the wave surface and rotated by local slope plus gentle rocking sine"
      // -------------------------------------------------------------
      const boats = [
        { group: boatGroup0, x: 430, phase: 0.0, rockFreq: 2.3 },
        { group: boatGroup1, x: 740, phase: 2.1, rockFreq: 1.9 },
        { group: boatGroup2, x: 990, phase: 4.2, rockFreq: 2.5 }
      ];

      function updateBoats() {
        boats.forEach(boat => {
          const x = boat.x;
          // Calculate surface height
          const y = getBackWaveY(x, time, globalAmp);

          // Calculate local slope dy/dx
          const delta = 4;
          const yLeft = getBackWaveY(x - delta, time, globalAmp);
          const yRight = getBackWaveY(x + delta, time, globalAmp);
          const slope = (yRight - yLeft) / (2 * delta);
          const slopeAngleDeg = Math.atan(slope) * (180 / Math.PI);

          // Gentle rocking sine
          const rockingDeg = Math.sin(time * boat.rockFreq + boat.phase) * (4.5 * globalAmp);
          const totalAngle = slopeAngleDeg + rockingDeg;

          // Apply translation and rotation
          boat.group.setAttribute('transform', `translate(${x.toFixed(1)}, ${(y - 1.5).toFixed(1)}) rotate(${totalAngle.toFixed(2)})`);
        });
      }

      // -------------------------------------------------------------
      // 46 FOAM FLECKS LIFECYCLE
      // Drift up and forward, fading in and out
      // -------------------------------------------------------------
      function updateFlecks(greatCrestX, greatCrestY) {
        for (let i = 0; i < FLECK_COUNT; i++) {
          const fleck = flecks[i];
          const elem = fleckElements[i];

          if (!isPaused) {
            fleck.life += fleck.speed;
            if (fleck.life >= 1.0) {
              resetFleck(fleck, greatCrestX, greatCrestY);
            }

            // Drift up and forward with sinusoidal flutter
            fleck.wobblePhase += 0.04;
            const wobbleX = Math.sin(fleck.wobblePhase) * 0.4;
            const wobbleY = Math.cos(fleck.wobblePhase * 1.3) * 0.3;

            fleck.x += (fleck.vx + wobbleX) * (0.6 + globalAmp * 0.4);
            fleck.y += (fleck.vy + wobbleY) * (0.6 + globalAmp * 0.4);
          }

          // Smooth bell opacity curve: fades in from 0, peaks at 0.88, fades out to 0
          const opacity = Math.sin(fleck.life * Math.PI) * 0.88;
          elem.setAttribute('cx', fleck.x.toFixed(1));
          elem.setAttribute('cy', fleck.y.toFixed(1));
          elem.setAttribute('r', fleck.radius.toFixed(1));
          elem.setAttribute('opacity', opacity.toFixed(2));
        }
      }

      // -------------------------------------------------------------
      // MAIN ANIMATION LOOP
      // -------------------------------------------------------------
      function animate() {
        if (!isPaused) {
          time += 0.018;
        }

        // Smoothly ease global amplitude multiplier toward target
        const diff = targetAmp - globalAmp;
        if (Math.abs(diff) > 0.001) {
          globalAmp += diff * 0.045;
        } else {
          globalAmp = targetAmp;
        }

        updateWaves();

        if (!prefersReducedMotion) {
          requestAnimationFrame(animate);
        }
      }

      // -------------------------------------------------------------
      // CONTROLS & EVENT LISTENERS
      // - "Calm sea" eases amplitude multiplier to 0.45
      // - "Rising storm" eases amplitude multiplier to 1.6
      // - "Hold the block" freezes time
      // -------------------------------------------------------------
      btnCalm.addEventListener('click', function () {
        if (targetAmp === 0.45) {
          targetAmp = 1.0;
          this.classList.remove('is-active');
          this.setAttribute('aria-pressed', 'false');
        } else {
          targetAmp = 0.45;
          this.classList.add('is-active');
          this.setAttribute('aria-pressed', 'true');
          btnStorm.classList.remove('is-active');
          btnStorm.setAttribute('aria-pressed', 'false');
        }
      });

      btnStorm.addEventListener('click', function () {
        if (targetAmp === 1.6) {
          targetAmp = 1.0;
          this.classList.remove('is-active');
          this.setAttribute('aria-pressed', 'false');
        } else {
          targetAmp = 1.6;
          this.classList.add('is-active');
          this.setAttribute('aria-pressed', 'true');
          btnCalm.classList.remove('is-active');
          btnCalm.setAttribute('aria-pressed', 'false');
        }
      });

      btnHold.addEventListener('click', function () {
        isPaused = !isPaused;
        this.classList.toggle('is-active', isPaused);
        this.setAttribute('aria-pressed', isPaused ? 'true' : 'false');
        this.querySelector('em').textContent = isPaused ? 'Release block' : 'Hold the block';
      });

      // Initialize
      if (prefersReducedMotion) {
        // Render single static impression
        time = 1.65;
        globalAmp = 1.0;
        updateWaves();
      } else {
        requestAnimationFrame(animate);
      }

    })();
  </script>
</body>
</html>
