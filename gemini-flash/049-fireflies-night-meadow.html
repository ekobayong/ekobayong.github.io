<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Meadow — Fireflies</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #05081a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: none;
  }

  #scene-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #05081a 0%, #0d1a3d 35%, #1a2f52 70%, #22344f 100%);
    transition: filter 1.4s ease, opacity 1.4s ease;
  }

  /* Sky glow wash */
  .moonglow-wash {
    position: absolute;
    top: -15vh;
    right: -10vw;
    width: 75vw;
    height: 75vw;
    max-width: 900px;
    max-height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 245, 215, 0.14) 0%, rgba(200, 220, 255, 0.05) 45%, rgba(5, 8, 26, 0) 75%);
    pointer-events: none;
    transition: opacity 1.4s ease;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: star-twinkle 6s ease-in-out infinite alternate;
  }

  @keyframes star-twinkle {
    0% { opacity: 0.55; transform: scale(0.9); }
    100% { opacity: 0.95; transform: scale(1.15); }
  }

  /* Moon */
  .moon-wrapper {
    position: absolute;
    top: clamp(24px, 5vh, 60px);
    right: clamp(30px, 8vw, 120px);
    width: clamp(64px, 10vw, 130px);
    height: clamp(64px, 10vw, 130px);
    transition: opacity 1.4s ease, transform 1.4s ease;
    pointer-events: none;
  }

  .moon {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbf0 0%, #ede3c8 50%, #d9cfb4 100%);
    box-shadow: 0 0 40px rgba(255, 245, 215, 0.55), 0 0 140px rgba(255, 240, 200, 0.25);
    position: relative;
    overflow: hidden;
  }

  .crater {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(185, 175, 150, 0.35) 0%, rgba(185, 175, 150, 0) 75%);
  }

  /* Hills */
  .hills-svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 52%;
    pointer-events: none;
  }

  /* Mist bands */
  .mist-container {
    position: absolute;
    bottom: 4%;
    left: 0;
    width: 100%;
    height: 38%;
    pointer-events: none;
    overflow: hidden;
    transition: opacity 1.4s ease;
  }

  .mist {
    position: absolute;
    width: 250%;
    height: 55px;
    border-radius: 50%;
    filter: blur(14px);
    background: radial-gradient(ellipse at center, rgba(175, 198, 222, 0.22) 0%, rgba(160, 185, 215, 0.08) 55%, rgba(10, 18, 40, 0) 80%);
    opacity: 0.9;
  }

  .mist-1 {
    bottom: 16%;
    left: -75%;
    animation: drift-left 40s linear infinite alternate;
  }

  .mist-2 {
    bottom: 5%;
    left: -60%;
    height: 70px;
    background: radial-gradient(ellipse at center, rgba(190, 210, 235, 0.18) 0%, rgba(150, 175, 205, 0.06) 60%, rgba(10, 18, 40, 0) 80%);
    animation: drift-right 55s linear infinite alternate;
  }

  @keyframes drift-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(35%); }
  }

  @keyframes drift-right {
    0% { transform: translateX(0); }
    100% { transform: translateX(-35%); }
  }

  /* Meadow Grass Layers */
  .meadow-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 44%;
    pointer-events: none;
  }

  .blade {
    transform-origin: bottom center;
    transform-box: fill-box;
    animation-name: sway;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    animation-direction: alternate;
  }

  @keyframes sway {
    0% { transform: rotate(-3.5deg) skewX(-2deg); }
    100% { transform: rotate(3.5deg) skewX(2deg); }
  }

  /* Fireflies Canvas */
  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* Interactive Breeze Pointer Halo */
  #cursor-breeze {
    position: fixed;
    top: 0;
    left: 0;
    width: 120px;
    height: 120px;
    margin-left: -60px;
    margin-top: -60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 255, 106, 0.06) 0%, rgba(200, 240, 255, 0.03) 40%, rgba(255, 255, 255, 0) 70%);
    pointer-events: none;
    z-index: 25;
    transform: translate(-999px, -999px);
    transition: opacity 0.3s ease;
  }

  /* Captions & UI */
  .caption {
    position: absolute;
    top: clamp(30px, 8vh, 80px);
    left: clamp(24px, 7vw, 90px);
    pointer-events: none;
    opacity: 0;
    animation: fade-caption 4s ease-out 1.2s forwards;
    z-index: 20;
  }

  @keyframes fade-caption {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 0.92; transform: translateY(0); }
  }

  .caption-title {
    font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif;
    font-style: italic;
    font-size: clamp(1.25rem, 2.3vw, 2.1rem);
    font-weight: 400;
    color: #eaf1fa;
    text-shadow: 0 2px 14px rgba(0, 5, 20, 0.85);
    letter-spacing: 0.015em;
    margin-bottom: 7px;
  }

  .caption-sub {
    font-size: clamp(0.68rem, 0.95vw, 0.82rem);
    text-transform: uppercase;
    font-variant: all-small-caps;
    letter-spacing: 0.22em;
    color: #8da4c4;
    opacity: 0.85;
  }

  /* UI Bottom Bar */
  .bottom-bar {
    position: absolute;
    bottom: clamp(18px, 3.5vh, 32px);
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 clamp(24px, 5vw, 60px);
    z-index: 30;
    pointer-events: none;
  }

  .firefly-counter {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    color: #8fa6c5;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.85;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }

  .counter-num {
    color: #d4ff6a;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    margin-left: 4px;
    letter-spacing: 0.05em;
  }

  /* Moon Phase Pill Button */
  .toggle-btn {
    pointer-events: auto;
    cursor: pointer;
    background: rgba(14, 25, 48, 0.65);
    border: 1px solid rgba(145, 175, 215, 0.25);
    border-radius: 9999px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #cdd9e9;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    transition: all 0.35s ease;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
  }

  .toggle-btn:hover {
    background: rgba(22, 38, 70, 0.8);
    border-color: rgba(180, 205, 245, 0.4);
    color: #ffffff;
    box-shadow: 0 4px 22px rgba(0, 0, 0, 0.55), 0 0 12px rgba(212, 255, 106, 0.15);
  }

  .phase-icon {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    position: relative;
    background: #fff8e7;
    box-shadow: 0 0 8px #fff4d0;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* New Moon State Modifier */
  .new-moon-active #scene-container {
    filter: brightness(0.62) saturate(0.68) contrast(1.04);
  }

  .new-moon-active .moon-wrapper {
    opacity: 0.07;
    transform: scale(0.96);
  }

  .new-moon-active .moonglow-wash {
    opacity: 0;
  }

  .new-moon-active .mist-container {
    opacity: 0.45;
  }

  .new-moon-active .star {
    opacity: 1 !important;
    filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.7));
  }

  .new-moon-active .phase-icon {
    background: transparent;
    box-shadow: -3px 1px 0 0.5px #cfdcf0;
    border-radius: 50%;
  }

  /* Reduced Motion */
  @media (prefers-reduced-motion: reduce) {
    .blade, .mist, .star {
      animation: none !important;
    }
    .caption {
      opacity: 0.92;
      animation: none;
    }
  }
</style>
</head>
<body>

<div id="scene-container">
  <div class="moonglow-wash" id="moonglow"></div>
  <div id="stars-field"></div>

  <!-- Moon -->
  <div class="moon-wrapper" id="moon">
    <div class="moon">
      <div class="crater" style="top: 28%; left: 24%; width: 24%; height: 24%;"></div>
      <div class="crater" style="top: 52%; left: 45%; width: 34%; height: 34%;"></div>
      <div class="crater" style="top: 20%; left: 62%; width: 18%; height: 18%;"></div>
      <div class="crater" style="top: 65%; left: 20%; width: 16%; height: 16%;"></div>
      <div class="crater" style="top: 40%; left: 74%; width: 14%; height: 14%;"></div>
    </div>
  </div>

  <!-- Rolling Hills (SVG) -->
  <svg class="hills-svg" viewBox="0 0 1440 600" preserveAspectRatio="none">
    <defs>
      <linearGradient id="hillFarGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1b2c4d"/>
        <stop offset="100%" stop-color="#101c36"/>
      </linearGradient>
      <linearGradient id="hillNearGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0f1a31"/>
        <stop offset="100%" stop-color="#080f21"/>
      </linearGradient>
    </defs>
    <!-- Far hill -->
    <path d="M 0,260 Q 380,140 760,240 T 1440,190 L 1440,600 L 0,600 Z" fill="url(#hillFarGrad)"/>
    <!-- Near hill -->
    <path d="M 0,350 Q 420,270 880,360 T 1440,320 L 1440,600 L 0,600 Z" fill="url(#hillNearGrad)"/>
  </svg>

  <!-- Mist Layers -->
  <div class="mist-container">
    <div class="mist mist-1"></div>
    <div class="mist mist-2"></div>
  </div>

  <!-- Grass SVG Layers -->
  <svg class="meadow-layer" id="meadow-far" style="opacity: 0.55; filter: blur(0.6px);" preserveAspectRatio="none"></svg>
  <svg class="meadow-layer" id="meadow-mid" preserveAspectRatio="none"></svg>
  <svg class="meadow-layer" id="meadow-near" preserveAspectRatio="none"></svg>
</div>

<!-- Fireflies Interactive Canvas -->
<canvas id="canvas"></canvas>

<!-- Gentle breeze mouse disc -->
<div id="cursor-breeze"></div>

<!-- Poetic Caption -->
<div class="caption">
  <div class="caption-title">The field remembers every small light.</div>
  <div class="caption-sub">a night meadow &middot; late june</div>
</div>

<!-- Controls / Bottom Bar -->
<div class="bottom-bar">
  <div class="firefly-counter">
    Fireflies <span class="counter-num" id="counter-val">0</span>
  </div>

  <button class="toggle-btn" id="phase-toggle" aria-label="Toggle Moon Phase">
    <span class="phase-icon" id="phase-icon"></span>
    <span id="phase-label">Full Moon</span>
  </button>
</div>

<script>
(function () {
  'use strict';

  // --- Pseudo Random Generator (LCG) for deterministic, stable meadow ---
  function createLCG(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function () {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  // --- 1. Star Field Generator (15 stars) ---
  const starsContainer = document.getElementById('stars-field');
  const starColors = ['#ffffff', '#cfd8ff', '#ffe9c4'];
  const starLCG = createLCG(4291);

  for (let i = 0; i < 15; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const top = (starLCG() * 48).toFixed(2);
    const left = (starLCG() * 98).toFixed(2);
    const size = (starLCG() * 1.8 + 1.2).toFixed(1);
    const color = starColors[Math.floor(starLCG() * starColors.length)];
    const dur = (starLCG() * 4 + 4).toFixed(1);
    const delay = (starLCG() * -8).toFixed(1);

    star.style.top = top + 'vh';
    star.style.left = left + 'vw';
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.background = `radial-gradient(circle, ${color} 0%, rgba(255,255,255,0) 80%)`;
    star.style.animationDuration = dur + 's';
    star.style.animationDelay = delay + 's';
    starsContainer.appendChild(star);
  }

  // --- 2. Meadow Procedural Generation ---
  const meadowFar = document.getElementById('meadow-far');
  const meadowMid = document.getElementById('meadow-mid');
  const meadowNear = document.getElementById('meadow-near');

  function generateGrassBlades(svgEl, count, color, seed, minH, maxH, minDur, maxDur) {
    const lcg = createLCG(seed);
    const width = 1440;
    const height = 400;
    svgEl.setAttribute('viewBox', `0 0 ${width} ${height}`);
    const frag = document.createDocumentFragment();

    for (let i = 0; i < count; i++) {
      // spread across width with jitter
      const x = (i / (count - 1)) * width + (lcg() - 0.5) * (width / count * 1.6);
      const bladeHeight = minH + lcg() * (maxH - minH);
      const baseWidth = 3.5 + lcg() * 4.5;
      const lean = (lcg() - 0.5) * 65;
      const yBase = height;
      const tipY = height - bladeHeight;
      const tipX = x + lean;
      const ctrlX = x + lean * 0.45 + (lcg() - 0.5) * 15;
      const ctrlY = height - bladeHeight * 0.55;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const d = `M ${x - baseWidth * 0.5} ${yBase} Q ${ctrlX} ${ctrlY} ${tipX} ${tipY} Q ${ctrlX + baseWidth * 0.25} ${ctrlY} ${x + baseWidth * 0.5} ${yBase} Z`;
      path.setAttribute('d', d);
      path.setAttribute('fill', color);
      path.classList.add('blade');

      const swayDur = (minDur + lcg() * (maxDur - minDur)).toFixed(2);
      const swayDelay = (-lcg() * 8).toFixed(2);
      path.style.animationDuration = swayDur + 's';
      path.style.animationDelay = swayDelay + 's';

      frag.appendChild(path);
    }
    svgEl.appendChild(frag);
  }

  // 140 far blades, 120 mid, 90 near
  generateGrassBlades(meadowFar, 140, '#0b1530', 101, 140, 240, 6.0, 9.0);
  generateGrassBlades(meadowMid, 120, '#070f24', 307, 180, 290, 5.0, 7.5);
  generateGrassBlades(meadowNear, 90, '#03081a', 509, 210, 360, 4.0, 6.2);

  // --- 3. Firefly Simulation & Canvas Setup ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const counterVal = document.getElementById('counter-val');
  const breezeEl = document.getElementById('cursor-breeze');

  let width = 0;
  let height = 0;
  let dpr = 1;
  let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => {
    prefersReducedMotion = e.matches;
  });

  const mouse = { x: -9999, y: -9999, active: false };
  let isNewMoon = false;

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    breezeEl.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
    breezeEl.style.transform = 'translate(-999px, -999px)';
  });

  class Firefly {
    constructor(x, y, isBurst = false) {
      this.x = x ?? Math.random() * width;
      this.y = y ?? (height * 0.28 + Math.random() * (height * 0.62));
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.heading = Math.random() * Math.PI * 2;
      this.headingSpeed = (Math.random() - 0.5) * 0.08;
      this.speed = 0.45 + Math.random() * 0.75;
      this.baseRadius = 1.6 + Math.random() * 1.5;
      this.hue = 78 + Math.random() * 12; // #d4ff6a yellow-green family: 78 - 90
      this.pulseRate = 0.015 + Math.random() * 0.035;
      this.pulsePhase = Math.random() * Math.PI * 2;
      
      this.isBurst = isBurst;
      this.life = 1.0;
      this.lifeFade = isBurst ? 1 / (17 * 60) : 0; // fade over ~17 seconds
      if (isBurst) {
        const burstAngle = Math.random() * Math.PI * 2;
        const burstForce = 2.0 + Math.random() * 4.5;
        this.vx = Math.cos(burstAngle) * burstForce;
        this.vy = Math.sin(burstAngle) * burstForce;
      }
    }

    update() {
      const motionFactor = prefersReducedMotion ? 0.3 : 1.0;

      // Pulse progression
      this.pulsePhase += this.pulseRate * motionFactor;
      
      // Steering & Wandering
      this.heading += this.headingSpeed * motionFactor;
      if (Math.random() < 0.04) {
        this.headingSpeed = (Math.random() - 0.5) * 0.09;
      }

      // Meadow vertical band nudge: 28% to 90%
      const topBound = height * 0.28;
      const bottomBound = height * 0.92;
      if (this.y < topBound) {
        this.vy += (topBound - this.y) * 0.0015;
      } else if (this.y > bottomBound) {
        this.vy -= (this.y - bottomBound) * 0.0025;
      }

      // Horizontal bounds gentle bounce
      if (this.x < 30) this.vx += 0.06;
      if (this.x > width - 30) this.vx -= 0.06;

      // Normal wander forward force
      const forwardForce = 0.09 * motionFactor;
      this.vx += Math.cos(this.heading) * forwardForce;
      this.vy += Math.sin(this.heading) * forwardForce;

      // Mouse Breeze avoidance (150px range, falls off linearly)
      if (mouse.active) {
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        const repelRadius = 150;
        if (dist < repelRadius && dist > 0.01) {
          const force = (1 - dist / repelRadius) * 0.55;
          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;
        }
      }

      // Damp velocity at 0.94
      this.vx *= 0.94;
      this.vy *= 0.94;

      this.x += this.vx * motionFactor;
      this.y += this.vy * motionFactor;

      if (this.isBurst) {
        this.life -= this.lifeFade;
      }
    }

    draw(ctx) {
      if (this.life <= 0) return;

      // Brightness squared sine: spends most time dim, blooms briefly
      const sinVal = Math.sin(this.pulsePhase);
      const rawIntensity = Math.pow(Math.max(0, sinVal), 2.2);
      
      // When moon is New, flies read slightly brighter
      const moonBoost = isNewMoon ? 1.25 : 1.0;
      let alpha = rawIntensity * moonBoost * this.life;
      if (alpha <= 0.01) return;
      alpha = Math.min(1, alpha);

      const r = this.baseRadius;
      const haloRadius = r * 10;

      // Radial Halo Gradient
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, haloRadius);
      grad.addColorStop(0, `hsla(${this.hue}, 100%, 75%, ${alpha * 0.85})`);
      grad.addColorStop(0.2, `hsla(${this.hue}, 95%, 60%, ${alpha * 0.45})`);
      grad.addColorStop(0.55, `hsla(${this.hue}, 90%, 50%, ${alpha * 0.12})`);
      grad.addColorStop(1, `hsla(${this.hue}, 85%, 45%, 0)`);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, haloRadius, 0, Math.PI * 2);
      ctx.fill();

      // Sharp bright core
      ctx.fillStyle = `rgba(255, 255, 240, ${Math.min(1, alpha * 1.3)})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0.7, r * 0.65), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  let fireflies = [];

  function calcTargetCount() {
    const area = window.innerWidth * window.innerHeight;
    // Scale count between 28 and 90 across standard viewports
    const count = Math.round(28 + Math.min(1, Math.max(0, (area - 360000) / (2560000 - 360000))) * 62);
    return Math.min(90, Math.max(28, count));
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const target = calcTargetCount();
    while (fireflies.filter(f => !f.isBurst).length < target) {
      fireflies.push(new Firefly());
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // Burst spawn on tap / click
  function spawnSwarm(clickX, clickY) {
    const count = Math.floor(14 + Math.random() * 10); // 14 to 23
    for (let i = 0; i < count; i++) {
      fireflies.push(new Firefly(clickX, clickY, true));
    }
  }

  window.addEventListener('pointerdown', (e) => {
    // Prevent spawning if clicking the toggle button
    if (e.target.closest('#phase-toggle')) return;
    spawnSwarm(e.clientX, e.clientY);
  });

  // Animation Loop
  function loop() {
    ctx.clearRect(0, 0, width, height);

    // Target balance for ambient flies
    const ambientTarget = calcTargetCount();
    const currentAmbient = fireflies.filter(f => !f.isBurst).length;
    if (currentAmbient < ambientTarget && Math.random() < 0.05) {
      fireflies.push(new Firefly());
    }

    // Update and draw
    for (let i = fireflies.length - 1; i >= 0; i--) {
      const f = fireflies[i];
      f.update();
      f.draw(ctx);
      if (f.isBurst && f.life <= 0) {
        fireflies.splice(i, 1);
      }
    }

    counterVal.textContent = fireflies.length;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // --- 4. Moon Phase Toggle Interaction ---
  const phaseBtn = document.getElementById('phase-toggle');
  const phaseLabel = document.getElementById('phase-label');
  const body = document.body;

  phaseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isNewMoon = !isNewMoon;
    if (isNewMoon) {
      body.classList.add('new-moon-active');
      phaseLabel.textContent = 'New Moon';
    } else {
      body.classList.remove('new-moon-active');
      phaseLabel.textContent = 'Full Moon';
    }
  });

})();
</script>
</body>
</html>
