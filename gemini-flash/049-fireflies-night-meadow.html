<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A Night Meadow · Late June</title>
  <style>
    /* Reset & Base Setup */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05081a;
      cursor: none;
    }

    /* Outer Viewport Container */
    #scene-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      contain: layout paint size;
    }

    /* Scene Filter Wrapper for Moon Phase Dimming Transition (1.4s) */
    #scene-atmosphere {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: filter 1.4s cubic-bezier(0.4, 0, 0.2, 1);
      filter: brightness(1) saturate(1);
    }

    .new-moon #scene-atmosphere {
      filter: brightness(0.68) saturate(0.60);
    }

    /* Vertical Sky Gradient: #05081a at top -> #0d1a3d -> #1a2f52 -> #22344f at horizon */
    #sky-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        #05081a 0%,
        #0d1a3d 32%,
        #1a2f52 64%,
        #22344f 100%
      );
      z-index: 1;
    }

    /* Moonglow Wash in Upper Right */
    #moonglow {
      position: absolute;
      top: -12vw;
      right: -8vw;
      width: clamp(420px, 62vw, 820px);
      height: clamp(420px, 62vw, 820px);
      border-radius: 50%;
      background: radial-gradient(
        circle at 58% 42%,
        rgba(255, 251, 240, 0.17) 0%,
        rgba(245, 238, 215, 0.08) 32%,
        rgba(210, 225, 250, 0.025) 60%,
        transparent 76%
      );
      pointer-events: none;
      transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      mix-blend-mode: screen;
      z-index: 2;
    }

    .new-moon #moonglow {
      opacity: 0;
    }

    /* Stars Field (15 tiny radial-gradient stars) */
    #stars-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: starTwinkle var(--twinkle-dur, 5s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
      transition: opacity 1.4s ease, filter 1.4s ease;
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.9);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.15);
      }
    }

    .new-moon .star {
      opacity: 0.95 !important;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.9));
    }

    /* Full Moon with clamp(64px, 9vw, 130px), Craters & Two-layer Glow */
    #moon {
      position: absolute;
      top: clamp(28px, 6vh, 68px);
      right: clamp(36px, 8.5vw, 120px);
      width: clamp(64px, 9vw, 130px);
      height: clamp(64px, 9vw, 130px);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%, #fffbf0 0%, #f6f0dd 46%, #d9cfb4 100%);
      box-shadow:
        0 0 40px rgba(255, 251, 240, 0.48),
        0 0 140px rgba(255, 243, 212, 0.26);
      transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 1.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      overflow: hidden;
      pointer-events: none;
      z-index: 4;
    }

    .new-moon #moon {
      opacity: 0.05;
      box-shadow: none;
    }

    /* Faint crater dimples on the moon */
    .crater {
      position: absolute;
      border-radius: 50%;
      background: rgba(162, 148, 122, 0.16);
      box-shadow: inset 1px 1px 2px rgba(85, 75, 55, 0.24);
      filter: blur(0.5px);
    }

    /* Rolling SVG Hill Silhouettes in Lower Half */
    #hills-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: clamp(260px, 48vh, 520px);
      pointer-events: none;
      z-index: 5;
    }

    /* Mist Bands (Blurred 14px, ~20% alpha, drifting in opposite directions) */
    .mist-band {
      position: absolute;
      pointer-events: none;
      filter: blur(14px);
      will-change: transform;
      transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      z-index: 6;
    }

    #mist-1 {
      bottom: clamp(130px, 24vh, 250px);
      left: -25vw;
      width: 150vw;
      height: clamp(75px, 13vh, 125px);
      background: radial-gradient(
        ellipse 65% 50% at 50% 50%,
        rgba(185, 205, 230, 0.20) 0%,
        rgba(160, 185, 215, 0.14) 48%,
        rgba(135, 165, 195, 0.03) 76%,
        transparent 100%
      );
      animation: mistDrift1 40s ease-in-out infinite alternate;
    }

    #mist-2 {
      bottom: clamp(65px, 14vh, 155px);
      left: -35vw;
      width: 170vw;
      height: clamp(85px, 15vh, 145px);
      background: radial-gradient(
        ellipse 70% 50% at 50% 50%,
        rgba(195, 215, 235, 0.20) 0%,
        rgba(170, 195, 225, 0.13) 50%,
        rgba(140, 175, 205, 0.03) 80%,
        transparent 100%
      );
      animation: mistDrift2 55s ease-in-out infinite alternate;
    }

    @keyframes mistDrift1 {
      0% { transform: translateX(-5vw); }
      100% { transform: translateX(8vw); }
    }

    @keyframes mistDrift2 {
      0% { transform: translateX(7vw); }
      100% { transform: translateX(-6vw); }
    }

    .new-moon .mist-band {
      opacity: 0.32; /* Thins down mist to ~6.5% alpha */
    }

    /* Meadow Grass Layers (Inline SVG, Tapered quadratic curves) */
    #grass-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: clamp(230px, 39vh, 420px);
      pointer-events: none;
      z-index: 7;
    }

    #grass-svg path {
      transform-box: fill-box;
      transform-origin: bottom center;
      will-change: transform;
    }

    /* Keyframe sway for meadow blades: rotate/skew around base (-3.5deg to +3.5deg) */
    @keyframes bladeSway {
      0%, 100% {
        transform: rotate(-3.5deg) skewX(-1.5deg);
      }
      50% {
        transform: rotate(3.5deg) skewX(1.5deg);
      }
    }

    /* Fireflies Canvas (Full Screen) */
    #fireflies-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
    }

    /* Breeze Cursor (120px translucent soft disc following mouse) */
    #breeze-cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(195, 225, 255, 0.09) 0%,
        rgba(170, 205, 245, 0.035) 50%,
        transparent 70%
      );
      z-index: 9;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    /* Poetic Caption (Fades in over 4s after 1.2s delay) */
    #caption-container {
      position: absolute;
      top: clamp(28px, 6vh, 64px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      animation: captionFade 4s cubic-bezier(0.25, 1, 0.5, 1) 1.2s forwards;
      max-width: 90vw;
    }

    @keyframes captionFade {
      0% {
        opacity: 0;
        transform: translate(-50%, 8px);
      }
      100% {
        opacity: 0.95;
        transform: translate(-50%, 0);
      }
    }

    .caption-quote {
      font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif;
      font-style: italic;
      font-size: clamp(17px, 2.3vw, 26px);
      font-weight: 300;
      color: #edf3fd;
      letter-spacing: 0.025em;
      text-shadow: 0 2px 14px rgba(2, 6, 18, 0.85);
      margin-bottom: 7px;
    }

    .caption-sub {
      font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif;
      font-variant: small-caps;
      text-transform: lowercase;
      letter-spacing: 0.24em;
      font-size: clamp(10px, 1.1vw, 13px);
      color: rgba(190, 212, 245, 0.72);
      text-shadow: 0 1px 8px rgba(2, 6, 18, 0.8);
    }

    /* UI Controls & Badges (System Sans, wide letter spacing) */
    .ui-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      line-height: 1;
    }

    /* Bottom Pill Button for Moon Phase Toggle */
    #moon-toggle-btn {
      position: absolute;
      bottom: clamp(20px, 3.8vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      border-radius: 999px;
      background: rgba(13, 26, 61, 0.55);
      border: 1px solid rgba(185, 210, 245, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #d2e1f8;
      box-shadow: 0 4px 22px rgba(2, 6, 20, 0.45);
      cursor: pointer;
      outline: none;
      z-index: 12;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }

    #moon-toggle-btn:hover {
      background: rgba(19, 36, 82, 0.75);
      border-color: rgba(210, 230, 255, 0.4);
      box-shadow: 0 4px 26px rgba(0, 10, 30, 0.65);
    }

    #moon-toggle-btn:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* Tiny Phase Dot (Glowing disc in Full Moon, Crescent in New Moon) */
    .phase-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fffbf0;
      box-shadow: 0 0 8px rgba(255, 251, 240, 0.9), 0 0 2px #fff;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .new-moon .phase-dot {
      background: transparent;
      border-radius: 50%;
      box-shadow: inset 3.5px 1px 0 0 #d0e0f8, 0 0 6px rgba(180, 210, 250, 0.5);
    }

    /* Live Counter Badge at Bottom Right */
    #counter-badge {
      position: absolute;
      bottom: clamp(20px, 3.8vh, 32px);
      right: clamp(20px, 3vw, 40px);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(5, 12, 30, 0.45);
      border: 1px solid rgba(160, 190, 230, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(200, 222, 250, 0.78);
      pointer-events: none;
      z-index: 12;
    }

    .counter-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d4ff6a;
      box-shadow: 0 0 6px #d4ff6a;
    }

    /* Interactive Hint Badge at Bottom Left */
    #hint-badge {
      position: absolute;
      bottom: clamp(20px, 3.8vh, 32px);
      left: clamp(20px, 3vw, 40px);
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(5, 12, 30, 0.35);
      border: 1px solid rgba(160, 190, 230, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(180, 205, 235, 0.55);
      pointer-events: none;
      z-index: 12;
    }

    @media (max-width: 768px) {
      #hint-badge {
        display: none;
      }
      #counter-badge {
        right: 50%;
        transform: translateX(50%);
        bottom: 74px;
      }
    }

    /* Prefers-reduced-motion Support */
    @media (prefers-reduced-motion: reduce) {
      #grass-svg path,
      .mist-band,
      .star,
      #caption-container {
        animation: none !important;
      }
      #caption-container {
        opacity: 0.95 !important;
        transform: translate(-50%, 0) !important;
      }
      .star {
        opacity: 0.75 !important;
      }
    }
  </style>
</head>
<body>

  <div id="scene-container">
    <!-- Atmospheric Scene Layer with Filter Transition for New Moon -->
    <div id="scene-atmosphere">
      <!-- Sky Gradient -->
      <div id="sky-background"></div>

      <!-- Wide Radial Moonglow Wash -->
      <div id="moonglow"></div>

      <!-- 15 Twinkling Stars -->
      <div id="stars-layer" aria-hidden="true"></div>

      <!-- Full Moon with Craters & Soft Glow -->
      <div id="moon" aria-label="Moon">
        <div class="crater" style="top: 24%; left: 30%; width: 22%; height: 20%;"></div>
        <div class="crater" style="top: 50%; left: 52%; width: 17%; height: 16%;"></div>
        <div class="crater" style="top: 60%; left: 28%; width: 26%; height: 24%;"></div>
        <div class="crater" style="top: 34%; left: 66%; width: 13%; height: 12%;"></div>
        <div class="crater" style="top: 16%; left: 54%; width: 14%; height: 13%;"></div>
      </div>

      <!-- Rolling SVG Hills Silhouettes -->
      <svg id="hills-svg" viewBox="0 0 1440 500" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="hillFarGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1b2c4d" />
            <stop offset="100%" stop-color="#101c36" />
          </linearGradient>
          <linearGradient id="hillNearGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0f1a31" />
            <stop offset="100%" stop-color="#080f21" />
          </linearGradient>
        </defs>

        <!-- Far Hill Silhouette (#1b2c4d -> #101c36) -->
        <path d="M 0 210
                 C 280 160, 520 280, 780 200
                 C 1020 130, 1260 250, 1440 180
                 L 1440 500 L 0 500 Z"
              fill="url(#hillFarGrad)" />

        <!-- Near Hill Silhouette (#0f1a31 -> #080f21) -->
        <path d="M 0 320
                 C 320 360, 560 270, 820 310
                 C 1080 350, 1280 280, 1440 310
                 L 1440 500 L 0 500 Z"
              fill="url(#hillNearGrad)" />
      </svg>

      <!-- Two Drifting Blurred Mist Bands -->
      <div id="mist-1" class="mist-band" aria-hidden="true"></div>
      <div id="mist-2" class="mist-band" aria-hidden="true"></div>

      <!-- Three Meadow Grass Layers Generated at Runtime via Inline SVG -->
      <svg id="grass-svg" viewBox="0 0 1440 380" preserveAspectRatio="none" aria-hidden="true">
        <g id="grass-far" style="filter: blur(0.8px); opacity: 0.55;"></g>
        <g id="grass-mid"></g>
        <g id="grass-near"></g>
      </svg>
    </div>

    <!-- Full-screen Canvas for Fireflies -->
    <canvas id="fireflies-canvas"></canvas>

    <!-- Gentle Breeze Pointer Follower Disc -->
    <div id="breeze-cursor" aria-hidden="true"></div>

    <!-- Poetic Caption -->
    <header id="caption-container">
      <h1 class="caption-quote">The field remembers every small light.</h1>
      <p class="caption-sub">a night meadow · late june</p>
    </header>

    <!-- Interactive Bottom UI Controls -->
    <nav aria-label="Scene controls">
      <!-- Moon Phase Toggle Pill Button -->
      <button id="moon-toggle-btn" class="ui-text" type="button" aria-pressed="false" aria-label="Toggle moon phase between Full Moon and New Moon">
        <span class="phase-dot" aria-hidden="true"></span>
        <span id="phase-label">Full Moon</span>
      </button>

      <!-- Live Firefly Count Badge -->
      <div id="counter-badge" class="ui-text" role="status" aria-live="polite">
        <span class="counter-dot" aria-hidden="true"></span>
        <span id="counter-text">0 fireflies</span>
      </div>

      <!-- Touch/Click Hint Badge -->
      <div id="hint-badge" class="ui-text">
        tap or click to scatter
      </div>
    </nav>
  </div>

  <script>
    (function() {
      'use strict';

      /* --- Simple LCG (Linear Congruential Generator) for Stable Runtime Grass --- */
      class LCG {
        constructor(seed = 19840625) {
          this.state = seed >>> 0;
        }
        next() {
          this.state = (Math.imul(1664525, this.state) + 1013904223) >>> 0;
          return this.state / 4294967296;
        }
      }

      /* --- Generate Fifteen Twinkling Stars --- */
      const starsLayer = document.getElementById('stars-layer');
      const starDefs = [
        { x: 7,  y: 11, color: '#ffffff', size: 2.2, dur: 4.2, delay: -1.2 },
        { x: 17, y: 22, color: '#cfd8ff', size: 2.6, dur: 5.6, delay: -3.4 },
        { x: 26, y: 8,  color: '#ffe9c4', size: 2.4, dur: 3.8, delay: -0.8 },
        { x: 34, y: 26, color: '#ffffff', size: 2.0, dur: 6.2, delay: -4.5 },
        { x: 43, y: 14, color: '#cfd8ff', size: 2.8, dur: 4.8, delay: -2.3 },
        { x: 52, y: 7,  color: '#ffe9c4', size: 2.1, dur: 5.1, delay: -3.7 },
        { x: 60, y: 21, color: '#ffffff', size: 2.5, dur: 4.5, delay: -1.9 },
        { x: 69, y: 13, color: '#cfd8ff', size: 2.0, dur: 6.0, delay: -5.0 },
        { x: 11, y: 34, color: '#ffe9c4', size: 2.3, dur: 5.7, delay: -2.6 },
        { x: 22, y: 40, color: '#ffffff', size: 2.2, dur: 4.0, delay: -0.4 },
        { x: 47, y: 33, color: '#cfd8ff', size: 2.6, dur: 5.3, delay: -3.2 },
        { x: 57, y: 41, color: '#ffe9c4', size: 2.0, dur: 4.6, delay: -1.7 },
        { x: 88, y: 36, color: '#ffffff', size: 2.4, dur: 5.9, delay: -4.1 },
        { x: 94, y: 18, color: '#cfd8ff', size: 2.1, dur: 4.3, delay: -2.8 },
        { x: 76, y: 39, color: '#ffe9c4', size: 2.7, dur: 5.0, delay: -0.9 }
      ];

      starDefs.forEach(s => {
        const starEl = document.createElement('div');
        starEl.className = 'star';
        starEl.style.left = s.x + '%';
        starEl.style.top = s.y + '%';
        starEl.style.width = s.size + 'px';
        starEl.style.height = s.size + 'px';
        starEl.style.background = `radial-gradient(circle, ${s.color} 0%, rgba(255,255,255,0.6) 45%, transparent 100%)`;
        starEl.style.setProperty('--twinkle-dur', s.dur + 's');
        starEl.style.setProperty('--twinkle-delay', s.delay + 's');
        starsLayer.appendChild(starEl);
      });

      /* --- Generate Three Meadow Grass Layers with Tapered Quadratic Curves --- */
      function generateMeadow() {
        const lcg = new LCG(20260904);
        const layers = [
          {
            id: 'grass-far',
            count: 140,
            color: '#0b1530',
            heightMin: 80,
            heightMax: 155,
            widthMin: 2.4,
            widthMax: 3.8,
            leanMax: 24,
            durMin: 6.2,
            durMax: 8.0
          },
          {
            id: 'grass-mid',
            count: 120,
            color: '#070f24',
            heightMin: 125,
            heightMax: 235,
            widthMin: 3.4,
            widthMax: 5.4,
            leanMax: 30,
            durMin: 5.0,
            durMax: 6.8
          },
          {
            id: 'grass-near',
            count: 90,
            color: '#03081a',
            heightMin: 185,
            heightMax: 325,
            widthMin: 4.8,
            widthMax: 7.6,
            leanMax: 38,
            durMin: 4.0,
            durMax: 5.4
          }
        ];

        const svgWidth = 1440;
        const svgHeight = 380;

        layers.forEach(layer => {
          const group = document.getElementById(layer.id);
          group.innerHTML = '';

          for (let i = 0; i < layer.count; i++) {
            const progress = i / (layer.count - 1);
            const jitter = (lcg.next() - 0.5) * (svgWidth / layer.count) * 1.3;
            const x = Math.max(0, Math.min(svgWidth, progress * svgWidth + jitter));
            const y = svgHeight + (lcg.next() - 0.5) * 6;

            const h = layer.heightMin + lcg.next() * (layer.heightMax - layer.heightMin);
            const w = layer.widthMin + lcg.next() * (layer.widthMax - layer.widthMin);
            const lean = (lcg.next() - 0.5) * (layer.leanMax * 2);

            const x0 = x - w / 2;
            const x1 = x + w / 2;
            const tipX = x + lean;
            const tipY = y - h;

            // Quadratic bezier control points shaping natural blade arc
            const ctrlX1 = x - w * 0.35 + lean * 0.45;
            const ctrlY1 = y - h * 0.58;
            const ctrlX2 = x + w * 0.35 + lean * 0.55;
            const ctrlY2 = y - h * 0.52;

            const d = `M ${x0.toFixed(1)} ${y0.toFixed(1)} ` +
                      `Q ${ctrlX1.toFixed(1)} ${ctrlY1.toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)} ` +
                      `Q ${ctrlX2.toFixed(1)} ${ctrlY2.toFixed(1)} ${x1.toFixed(1)} ${y0.toFixed(1)} Z`;

            const dur = layer.durMin + lcg.next() * (layer.durMax - layer.durMin);
            const delay = lcg.next() * 8.0;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            path.setAttribute('fill', layer.color);
            path.style.transformBox = 'fill-box';
            path.style.transformOrigin = 'bottom center';
            path.style.animation = `bladeSway ${dur.toFixed(2)}s ease-in-out infinite`;
            path.style.animationDelay = `-${delay.toFixed(2)}s`;

            group.appendChild(path);
          }
        });
      }

      generateMeadow();

      /* --- Moon Phase Toggle Interaction --- */
      const sceneContainer = document.getElementById('scene-container');
      const toggleBtn = document.getElementById('moon-toggle-btn');
      const phaseLabel = document.getElementById('phase-label');
      let isNewMoon = false;

      toggleBtn.addEventListener('click', () => {
        isNewMoon = !isNewMoon;
        if (isNewMoon) {
          sceneContainer.classList.add('new-moon');
          toggleBtn.setAttribute('aria-pressed', 'true');
          phaseLabel.textContent = 'New Moon';
        } else {
          sceneContainer.classList.remove('new-moon');
          toggleBtn.setAttribute('aria-pressed', 'false');
          phaseLabel.textContent = 'Full Moon';
        }
      });

      /* --- Fireflies Canvas Physics & Wandering Steering --- */
      const canvas = document.getElementById('fireflies-canvas');
      const ctx = canvas.getContext('2d');
      const counterText = document.getElementById('counter-text');
      const breezeCursor = document.getElementById('breeze-cursor');

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const mouse = {
        x: width / 2,
        y: height / 2,
        active: false
      };

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        adjustBaseFireflies();
      }

      window.addEventListener('resize', resizeCanvas);

      /* Check Prefers Reduced Motion */
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => {
        prefersReducedMotion = e.matches;
      });

      class Firefly {
        constructor(options = {}) {
          this.x = options.x !== undefined ? options.x : Math.random() * width;
          this.y = options.y !== undefined ? options.y : height * (0.32 + Math.random() * 0.55);
          this.vx = options.vx !== undefined ? options.vx : (Math.random() - 0.5) * 0.8;
          this.vy = options.vy !== undefined ? options.vy : (Math.random() - 0.5) * 0.8;

          this.heading = options.heading !== undefined ? options.heading : Math.random() * Math.PI * 2;
          this.wanderRate = 0.18 + Math.random() * 0.14;
          this.thrust = 0.22 + Math.random() * 0.12;

          this.phase = Math.random() * Math.PI * 2;
          this.pulseRate = 0.016 + Math.random() * 0.022; // Individual pulse rate
          this.brightness = 0;

          this.radius = 1.5 + Math.random() * 1.1; // Body radius
          this.hue = 78 + Math.random() * 12; // HSL Hue 78-90 (#d4ff6a yellow-green family)

          this.isSwarm = !!options.isSwarm;
          this.bornAt = options.bornAt || performance.now();
          this.lifetime = (16.5 + Math.random() * 1.0) * 1000; // ~17 seconds
          this.swarmAlpha = 1.0;
          this.dead = false;
        }

        update(now) {
          const timeScale = prefersReducedMotion ? 0.25 : 1.0;

          // Swarm expiration and fade handling (~17s)
          if (this.isSwarm) {
            const age = now - this.bornAt;
            const remaining = this.lifetime - age;
            if (remaining <= 0) {
              this.dead = true;
              return;
            }
            // Fade out smoothly over final 4.5 seconds
            this.swarmAlpha = Math.max(0, Math.min(1, remaining / 4500));
          }

          // Random-walk heading
          this.heading += (Math.random() - 0.5) * this.wanderRate;

          // Meadow band boundary steering (between 28% and 90% of screen height)
          const topBand = height * 0.28;
          const bottomBand = height * 0.90;
          if (this.y < topBand) {
            const target = Math.PI / 2;
            this.heading += (target - this.heading) * 0.09;
          } else if (this.y > bottomBand) {
            const target = -Math.PI / 2;
            this.heading += (target - this.heading) * 0.09;
          }

          // Horizontal bounds steering
          const leftBound = width * 0.04;
          const rightBound = width * 0.96;
          if (this.x < leftBound) {
            this.heading += (0 - this.heading) * 0.09;
          } else if (this.x > rightBound) {
            this.heading += (Math.PI - this.heading) * 0.09;
          }

          // Wander velocity acceleration
          this.vx += Math.cos(this.heading) * this.thrust;
          this.vy += Math.sin(this.heading) * this.thrust;

          // Gentle breeze push from mouse/pointer (linear falloff within 150px)
          if (mouse.active) {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 150 && dist > 0.1) {
              const force = (1 - dist / 150) * 1.7;
              this.vx += (dx / dist) * force;
              this.vy += (dy / dist) * force;
            }
          }

          // Velocity damping at 0.94 per frame
          this.vx *= 0.94;
          this.vy *= 0.94;

          this.x += this.vx * timeScale;
          this.y += this.vy * timeScale;

          // Pulse: Brightness follows squared sine so flies spend most time dim and bloom briefly
          this.phase += this.pulseRate * timeScale;
          if (this.phase > Math.PI * 2) {
            this.phase -= Math.PI * 2;
          }
          const rawSine = Math.max(0, Math.sin(this.phase));
          this.brightness = rawSine * rawSine;
        }

        render() {
          const bloomFactor = (isNewMoon ? 1.35 : 1.0) * this.swarmAlpha;
          const effBrightness = this.brightness * bloomFactor;
          if (effBrightness <= 0.005) return;

          const haloRadius = this.radius * 10;

          // Radial-gradient halo ten times body radius in hsl hue 78-90
          const haloGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, haloRadius);
          haloGrad.addColorStop(0, `hsla(${this.hue.toFixed(1)}, 100%, 75%, ${(0.75 * effBrightness).toFixed(3)})`);
          haloGrad.addColorStop(0.35, `hsla(${this.hue.toFixed(1)}, 95%, 65%, ${(0.28 * effBrightness).toFixed(3)})`);
          haloGrad.addColorStop(0.7, `hsla(${this.hue.toFixed(1)}, 90%, 55%, ${(0.07 * effBrightness).toFixed(3)})`);
          haloGrad.addColorStop(1, `hsla(${this.hue.toFixed(1)}, 90%, 50%, 0)`);

          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, haloRadius, 0, Math.PI * 2);
          ctx.fill();

          // Bright small core
          const coreRadius = Math.max(0.9, this.radius * 0.85);
          const coreGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, coreRadius);
          coreGrad.addColorStop(0, `hsla(65, 100%, 96%, ${(0.95 * effBrightness).toFixed(3)})`);
          coreGrad.addColorStop(0.5, `hsla(${this.hue.toFixed(1)}, 100%, 85%, ${(0.7 * effBrightness).toFixed(3)})`);
          coreGrad.addColorStop(1, `hsla(${this.hue.toFixed(1)}, 100%, 70%, 0)`);

          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, coreRadius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const baseFlies = [];
      const swarmFlies = [];

      function getTargetBaseCount() {
        // Count scales with viewport area (28-90)
        const area = width * height;
        const count = Math.round(28 + (area / 2200000) * 55);
        return Math.max(28, Math.min(90, count));
      }

      function adjustBaseFireflies() {
        const target = getTargetBaseCount();
        while (baseFlies.length < target) {
          baseFlies.push(new Firefly());
        }
        while (baseFlies.length > target) {
          baseFlies.pop();
        }
        updateCounterDisplay();
      }

      function updateCounterDisplay() {
        const total = baseFlies.length + swarmFlies.length;
        counterText.textContent = `${total} fireflies`;
      }

      /* Release Swarm of 14-23 Fireflies on Click/Tap */
      function spawnSwarm(originX, originY) {
        const count = Math.floor(14 + Math.random() * 10); // 14 to 23
        const now = performance.now();
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.0 + Math.random() * 4.2;
          const fly = new Firefly({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            heading: angle,
            isSwarm: true,
            bornAt: now
          });
          swarmFlies.push(fly);
        }
        updateCounterDisplay();
      }

      // Pointer tracking & breeze cursor interaction
      function handlePointerMove(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
        breezeCursor.style.transform = `translate(${mouse.x}px, ${mouse.y}px) translate(-50%, -50%)`;
        breezeCursor.style.opacity = '1';
      }

      window.addEventListener('pointermove', handlePointerMove, { passive: true });

      window.addEventListener('pointerdown', e => {
        // Prevent click when toggling moon button
        if (e.target.closest('#moon-toggle-btn')) return;
        handlePointerMove(e);
        spawnSwarm(e.clientX, e.clientY);
      });

      document.body.addEventListener('pointerleave', () => {
        mouse.active = false;
        breezeCursor.style.opacity = '0';
      });

      /* --- Main Render & Physics Loop --- */
      function animate() {
        const now = performance.now();

        // Clear canvas
        ctx.clearRect(0, 0, width, height);

        // Lighter compositing for glowing halos
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        // Update & Render Base Fireflies
        for (let i = 0; i < baseFlies.length; i++) {
          baseFlies[i].update(now);
          baseFlies[i].render();
        }

        // Update & Render Swarm Fireflies
        let hasDead = false;
        for (let i = 0; i < swarmFlies.length; i++) {
          const fly = swarmFlies[i];
          fly.update(now);
          if (fly.dead) {
            hasDead = true;
          } else {
            fly.render();
          }
        }

        if (hasDead) {
          for (let i = swarmFlies.length - 1; i >= 0; i--) {
            if (swarmFlies[i].dead) {
              swarmFlies.splice(i, 1);
            }
          }
          updateCounterDisplay();
        }

        ctx.restore();
        requestAnimationFrame(animate);
      }

      // Initialize
      resizeCanvas();
      requestAnimationFrame(animate);

    })();
  </script>
</body>
</html>
