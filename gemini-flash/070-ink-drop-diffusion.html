<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sumi — Ink Drops in Still Water</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #e7edf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: crosshair;
    touch-action: none;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #bgCanvas {
    z-index: 1;
  }

  #inkCanvas {
    z-index: 2;
    mix-blend-mode: multiply;
  }

  /* Typography & Header Overlay */
  .header {
    position: absolute;
    top: clamp(24px, 4vw, 44px);
    left: clamp(24px, 4vw, 48px);
    z-index: 10;
    pointer-events: none;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .rule-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
  }

  .ink-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #1f2a6b;
    transition: background-color 0.4s ease;
    margin-bottom: 8px;
  }

  .vertical-rule {
    width: 1px;
    height: 70px;
    background: linear-gradient(to bottom, rgba(30,30,40,0.35), rgba(30,30,40,0));
  }

  .title-group {
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    font-weight: 400;
    font-size: clamp(22px, 2.6vw, 34px);
    letter-spacing: 0.04em;
    color: #1a2024;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: rgba(30, 40, 50, 0.55);
    margin-top: 6px;
    font-weight: 500;
  }

  .kanji-caption {
    position: absolute;
    top: clamp(24px, 4vw, 44px);
    right: clamp(24px, 4vw, 48px);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: rgba(30, 40, 50, 0.35);
    pointer-events: none;
    z-index: 10;
  }

  /* Center Hint */
  .hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-style: italic;
    font-size: clamp(16px, 1.8vw, 21px);
    letter-spacing: 0.08em;
    color: rgba(30, 45, 55, 0.42);
    pointer-events: none;
    z-index: 10;
    animation: breathe 3.6s ease-in-out infinite;
    transition: opacity 1.2s ease;
  }

  .hint.hidden {
    opacity: 0 !important;
    animation: none;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.99); }
    50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.01); }
  }

  /* Drop Counter */
  .counter-box {
    position: absolute;
    bottom: clamp(20px, 3.5vw, 32px);
    right: clamp(24px, 4vw, 48px);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(30, 40, 50, 0.45);
    font-weight: 500;
    pointer-events: none;
    z-index: 10;
  }

  /* UI Pill */
  .dock {
    position: absolute;
    bottom: clamp(18px, 3vw, 28px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 10px 30px -5px rgba(20, 30, 40, 0.08), 0 2px 6px rgba(20, 30, 40, 0.03);
    border-radius: 999px;
    padding: 6px 14px 6px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 20;
  }

  .swatches {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 2px;
  }

  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    outline: none;
    border: none;
    background-color: transparent;
    padding: 0;
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  .swatch::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-color: var(--c);
    box-shadow: inset 0 1.5px 3px rgba(0, 0, 0, 0.45), inset 0 -1.5px 2px rgba(255, 255, 255, 0.25);
  }

  .swatch::after {
    content: '';
    position: absolute;
    inset: -3.5px;
    border-radius: 50%;
    border: 1.5px solid var(--c);
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  .swatch:hover {
    transform: scale(1.08);
  }

  .swatch.active::after {
    opacity: 0.9;
    transform: scale(1);
  }

  .divider {
    width: 1px;
    height: 20px;
    background: rgba(30, 40, 50, 0.14);
  }

  /* Segmented Toggle */
  .segmented-control {
    display: flex;
    background: rgba(20, 30, 40, 0.06);
    border-radius: 999px;
    padding: 2.5px;
    position: relative;
  }

  .segmented-btn {
    border: none;
    background: none;
    padding: 4px 10px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(30, 40, 55, 0.55);
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    z-index: 2;
    transition: color 0.2s ease;
  }

  .segmented-btn.active {
    color: #1a2024;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }

  /* Drain Button */
  .action-btn {
    border: none;
    background: none;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(30, 40, 55, 0.7);
    cursor: pointer;
    padding: 5px 12px;
    border-radius: 999px;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background: rgba(20, 30, 40, 0.06);
    color: #1a2024;
  }

  .action-btn.pulsing {
    animation: drain-pulse 1.2s infinite alternate ease-in-out;
    color: #c8402a;
  }

  @keyframes drain-pulse {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.05); opacity: 1; background: rgba(200, 64, 42, 0.12); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hint {
      animation: none;
      opacity: 0.45;
    }
    .action-btn.pulsing {
      animation: none;
      text-decoration: underline;
    }
  }

  @media (max-width: 680px) {
    .dock {
      gap: 8px;
      padding: 5px 10px;
    }
    .kanji-caption {
      display: none;
    }
    .swatch {
      width: 22px;
      height: 22px;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="rule-wrapper">
    <div class="ink-indicator" id="inkDot"></div>
    <div class="vertical-rule"></div>
  </div>
  <div class="title-group">
    <h1>Sumi</h1>
    <div class="subtitle">ink drops in water</div>
  </div>
</div>

<div class="kanji-caption">墨 · still water · slow breath</div>
<div class="hint" id="centerHint">touch the water</div>
<div class="counter-box" id="counterBox">Drops: 0</div>

<div class="dock">
  <div class="swatches" id="swatchesContainer"></div>
  <div class="divider"></div>
  <div class="segmented-control">
    <button class="segmented-btn active" id="btnWater" data-mode="water">Water</button>
    <button class="segmented-btn" id="btnPaper" data-mode="paper">Paper</button>
  </div>
  <div class="divider"></div>
  <button class="action-btn" id="btnDrain">Drain</button>
</div>

<canvas id="bgCanvas"></canvas>
<canvas id="inkCanvas"></canvas>

<script>
(function() {
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const INKS = [
    { name: 'Indigo', hex: '#1f2a6b', r: 31, g: 42, b: 107 },
    { name: 'Vermilion', hex: '#c8402a', r: 200, g: 64, b: 42 },
    { name: 'Sepia', hex: '#6b4a2b', r: 107, g: 74, b: 43 },
    { name: 'Black', hex: '#14141a', r: 20, g: 20, b: 26 },
    { name: 'Teal', hex: '#157a7a', r: 21, g: 122, b: 122 }
  ];

  let currentInkIndex = 0;
  let currentMode = 'water'; // 'water' or 'paper'
  let dropCount = 0;
  let isDraining = false;
  let drainTimeRemaining = 0;
  const DRAIN_DURATION = reducedMotion ? 2.5 : 7.0;

  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const inkCanvas = document.getElementById('inkCanvas');
  const inkCtx = inkCanvas.getContext('2d');

  let bufferCanvas = document.createElement('canvas');
  let bufferCtx = bufferCanvas.getContext('2d');

  let width = 0;
  let height = 0;
  let dpr = 1;

  // Pre-baked Sprites
  const spriteMap = new Map(); // key: `${inkIndex}_${mode}_${isInitialBlot}`

  function createInkSprite(ink, mode, isBlot = false) {
    const sCanvas = document.createElement('canvas');
    const size = 64;
    sCanvas.width = size;
    sCanvas.height = size;
    const sCtx = sCanvas.getContext('2d');
    const half = size / 2;
    const grad = sCtx.createRadialGradient(half, half, 0, half, half, half);

    const { r, g, b } = ink;
    if (isBlot) {
      grad.addColorStop(0, `rgba(${r},${g},${b}, 0.28)`);
      grad.addColorStop(0.35, `rgba(${r},${g},${b}, 0.16)`);
      grad.addColorStop(0.7, `rgba(${r},${g},${b}, 0.05)`);
      grad.addColorStop(1, `rgba(${r},${g},${b}, 0)`);
    } else if (mode === 'water') {
      grad.addColorStop(0, `rgba(${r},${g},${b}, 0.09)`);
      grad.addColorStop(0.4, `rgba(${r},${g},${b}, 0.055)`);
      grad.addColorStop(0.75, `rgba(${r},${g},${b}, 0.02)`);
      grad.addColorStop(1, `rgba(${r},${g},${b}, 0)`);
    } else {
      // Paper feathered
      grad.addColorStop(0, `rgba(${r},${g},${b}, 0.065)`);
      grad.addColorStop(0.3, `rgba(${r},${g},${b}, 0.04)`);
      grad.addColorStop(0.65, `rgba(${r},${g},${b}, 0.015)`);
      grad.addColorStop(1, `rgba(${r},${g},${b}, 0)`);
    }

    sCtx.fillStyle = grad;
    sCtx.beginPath();
    sCtx.arc(half, half, half, 0, Math.PI * 2);
    sCtx.fill();
    return sCanvas;
  }

  function bakeAllSprites() {
    spriteMap.clear();
    INKS.forEach((ink, idx) => {
      spriteMap.set(`${idx}_water_false`, createInkSprite(ink, 'water', false));
      spriteMap.set(`${idx}_water_true`, createInkSprite(ink, 'water', true));
      spriteMap.set(`${idx}_paper_false`, createInkSprite(ink, 'paper', false));
      spriteMap.set(`${idx}_paper_true`, createInkSprite(ink, 'paper', true));
    });
  }
  bakeAllSprites();

  // 3D Perlin Noise Implementation
  const permutation = [
    151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,
    8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,
    35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,
    134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,
    55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,
    18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,
    250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,
    189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,
    172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,
    228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,
    107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,
    138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180
  ];
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) {
    p[i] = permutation[i];
    p[256 + i] = permutation[i];
  }

  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(t, a, b) { return a + t * (b - a); }
  function grad(hash, x, y, z) {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }

  function perlin3d(x, y, z) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    const Z = Math.floor(z) & 255;
    x -= Math.floor(x);
    y -= Math.floor(y);
    z -= Math.floor(z);
    const u = fade(x);
    const v = fade(y);
    const w = fade(z);

    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
    const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;

    return lerp(w,
      lerp(v,
        lerp(u, grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z)),
        lerp(u, grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z))
      ),
      lerp(v,
        lerp(u, grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1)),
        lerp(u, grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1))
      )
    );
  }

  // Double-scale curl noise with central differences
  function sampleNoisePotential(x, y, z) {
    // fine 42px scale, coarse 240px scale
    const fine = perlin3d(x / 42, y / 42, z);
    const coarse = perlin3d(x / 240, y / 240, z * 0.4);
    return fine * 0.7 + coarse * 1.5;
  }

  function getCurl(x, y, z) {
    const eps = 2.0;
    const n_y1 = sampleNoisePotential(x, y + eps, z);
    const n_y2 = sampleNoisePotential(x, y - eps, z);
    const n_x1 = sampleNoisePotential(x + eps, y, z);
    const n_x2 = sampleNoisePotential(x - eps, y, z);
    // Curl in 2D: (dPsi/dy, -dPsi/dx)
    const vx = (n_y1 - n_y2) / (2 * eps) * 60;
    const vy = -(n_x1 - n_x2) / (2 * eps) * 60;
    return { x: vx, y: vy };
  }

  // Particle System
  class Particle {
    constructor(x, y, vx, vy, inkIdx, maxLife, baseSize, isBlot = false, mode = 'water') {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.inkIdx = inkIdx;
      this.life = 0;
      this.maxLife = maxLife;
      this.baseSize = baseSize;
      this.isBlot = isBlot;
      this.mode = mode;
    }

    step(dt, timeZ) {
      this.life += dt;
      const progress = this.life / this.maxLife;

      if (this.mode === 'water') {
        const curl = getCurl(this.x, this.y, timeZ);
        // Swirl around center
        const cx = width / 2;
        const cy = height / 2;
        const dx = this.x - cx;
        const dy = this.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) + 1;
        const swirlMag = reducedMotion ? 0 : 7.0;
        const sx = (-dy / dist) * swirlMag;
        const sy = (dx / dist) * swirlMag;

        this.vx += (curl.x + sx) * dt;
        this.vy += (curl.y + sy) * dt;
        this.vx *= Math.pow(0.965, dt * 60);
        this.vy *= Math.pow(0.965, dt * 60);
      } else {
        // Paper mode: less motion, high friction
        const curl = getCurl(this.x, this.y, timeZ * 0.5);
        this.vx += curl.x * 0.3 * dt;
        this.vy += curl.y * 0.3 * dt;
        this.vx *= Math.pow(0.90, dt * 60);
        this.vy *= Math.pow(0.90, dt * 60);
      }

      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return progress < 1.0;
    }

    render(ctx) {
      const p = this.life / this.maxLife;
      let alpha;
      if (this.mode === 'water') {
        alpha = (1.0 - p) * 0.85;
      } else {
        alpha = (1.0 - p) * 0.65;
      }
      if (alpha <= 0.001) return;

      const sizeGrow = 1.0 + p * (this.mode === 'water' ? 2.4 : 1.3);
      const renderSize = this.baseSize * sizeGrow;

      const sprite = spriteMap.get(`${this.inkIdx}_${this.mode}_${this.isBlot}`);
      if (!sprite) return;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.drawImage(
        sprite,
        this.x - renderSize / 2,
        this.y - renderSize / 2,
        renderSize,
        renderSize
      );
      ctx.restore();
    }
  }

  let particles = [];

  function spawnDrop(x, y) {
    const hint = document.getElementById('centerHint');
    if (hint && !hint.classList.contains('hidden')) {
      hint.classList.add('hidden');
    }

    dropCount++;
    document.getElementById('counterBox').textContent = `Drops: ${dropCount}`;

    // Particle count scaled by viewport area (standard ~1920x1080 -> scale = 1)
    const area = width * height;
    const areaScale = Math.min(1.4, Math.max(0.65, Math.sqrt(area / (1440 * 900))));
    const count = Math.floor((380 + Math.random() * 240) * areaScale);

    const isWater = currentMode === 'water';
    const speedMin = isWater ? 30 : 14;
    const speedMax = isWater ? 120 : 40;

    // Center impact blot stamp
    const blotCount = isWater ? 16 : 24;
    for (let i = 0; i < blotCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * (isWater ? 10 : 7);
      const bx = x + Math.cos(angle) * dist;
      const by = y + Math.sin(angle) * dist;
      const life = 2.0 + Math.random() * 2.0;
      const bSpeed = Math.random() * 12;
      particles.push(new Particle(
        bx, by,
        Math.cos(angle) * bSpeed,
        Math.sin(angle) * bSpeed,
        currentInkIndex,
        life,
        18 + Math.random() * 24,
        true,
        currentMode
      ));
    }

    // Main particle cloud
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = speedMin + Math.random() * (speedMax - speedMin);
      // Bias slightly outward from pointer
      const initialOffset = Math.random() * (isWater ? 9 : 5);
      const px = x + Math.cos(angle) * initialOffset;
      const py = y + Math.sin(angle) * initialOffset;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const life = 4.0 + Math.random() * 6.0; // 4 to 10 seconds
      const baseSize = isWater ? (14 + Math.random() * 18) : (10 + Math.random() * 14);

      particles.push(new Particle(
        px, py,
        vx, vy,
        currentInkIndex,
        life,
        baseSize,
        false,
        currentMode
      ));
    }
  }

  // Paint Backgrounds
  function paintWaterBackground() {
    bgCtx.save();
    bgCtx.setTransform(1, 0, 0, 1, 0, 0);
    const grad = bgCtx.createRadialGradient(
      width / 2, height / 2, 0,
      width / 2, height / 2, Math.max(width, height) * 0.72
    );
    grad.addColorStop(0, '#f1f5f6');
    grad.addColorStop(0.55, '#e3eaee');
    grad.addColorStop(1, '#cfd9df');

    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, width, height);

    // 40 faint white elliptical caustic rings
    bgCtx.fillStyle = 'rgba(255, 255, 255, 0.06)';
    bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    bgCtx.lineWidth = 1.5;

    for (let i = 0; i < 40; i++) {
      const cx = (0.05 + 0.9 * ((i * 37) % 100) / 100) * width;
      const cy = (0.05 + 0.9 * ((i * 73) % 100) / 100) * height;
      const rx = 35 + ((i * 29) % 130);
      const ry = rx * (0.35 + ((i * 19) % 30) / 100);
      const rotation = ((i * 47) % 360) * (Math.PI / 180);

      bgCtx.beginPath();
      bgCtx.ellipse(cx, cy, rx, ry, rotation, 0, Math.PI * 2);
      bgCtx.stroke();
    }
    bgCtx.restore();
  }

  function paintPaperBackground() {
    bgCtx.save();
    bgCtx.setTransform(1, 0, 0, 1, 0, 0);
    bgCtx.fillStyle = '#f3ead8';
    bgCtx.fillRect(0, 0, width, height);

    // 60 soft mottling gradients in warm tan
    for (let i = 0; i < 60; i++) {
      const mx = ((i * 43) % 100) / 100 * width;
      const my = ((i * 89) % 100) / 100 * height;
      const rad = 120 + ((i * 53) % 240);
      const mGrad = bgCtx.createRadialGradient(mx, my, 0, mx, my, rad);
      mGrad.addColorStop(0, 'rgba(195, 170, 135, 0.14)');
      mGrad.addColorStop(1, 'rgba(195, 170, 135, 0)');
      bgCtx.fillStyle = mGrad;
      bgCtx.beginPath();
      bgCtx.arc(mx, my, rad, 0, Math.PI * 2);
      bgCtx.fill();
    }

    // Thousands of short random fibres
    const numFibres = Math.floor((width * height) / 480);
    let seed = 1234567;
    function rand() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    for (let i = 0; i < numFibres; i++) {
      const fx = rand() * width;
      const fy = rand() * height;
      const len = 3 + rand() * 10;
      const ang = rand() * Math.PI * 2;
      const isWhite = rand() > 0.55;

      bgCtx.strokeStyle = isWhite ? 'rgba(255, 255, 255, 0.35)' : 'rgba(120, 95, 60, 0.12)';
      bgCtx.lineWidth = 0.5 + rand() * 0.8;
      bgCtx.beginPath();
      bgCtx.moveTo(fx, fy);
      // slight curved fibre
      const cpx = fx + Math.cos(ang) * (len * 0.5) + (rand() - 0.5) * 3;
      const cpy = fy + Math.sin(ang) * (len * 0.5) + (rand() - 0.5) * 3;
      const ex = fx + Math.cos(ang) * len;
      const ey = fy + Math.sin(ang) * len;
      bgCtx.quadraticCurveTo(cpx, cpy, ex, ey);
      bgCtx.stroke();
    }
    bgCtx.restore();
  }

  function repaintBackground() {
    if (currentMode === 'water') {
      paintWaterBackground();
    } else {
      paintPaperBackground();
    }
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;

    // Sync buffer canvas with current ink drawing before resize
    const hasExistingInk = inkCanvas.width > 0 && inkCanvas.height > 0;
    let tempCanvas;
    if (hasExistingInk) {
      tempCanvas = document.createElement('canvas');
      tempCanvas.width = inkCanvas.width;
      tempCanvas.height = inkCanvas.height;
      tempCanvas.getContext('2d').drawImage(inkCanvas, 0, 0);
    }

    bgCanvas.width = Math.floor(width * dpr);
    bgCanvas.height = Math.floor(height * dpr);
    bgCtx.scale(dpr, dpr);

    inkCanvas.width = Math.floor(width * dpr);
    inkCanvas.height = Math.floor(height * dpr);

    bufferCanvas.width = Math.floor(width * dpr);
    bufferCanvas.height = Math.floor(height * dpr);

    if (tempCanvas) {
      inkCtx.save();
      inkCtx.drawImage(tempCanvas, 0, 0, inkCanvas.width, inkCanvas.height);
      inkCtx.restore();
    }

    repaintBackground();
  }

  window.addEventListener('resize', resize);

  // Main Loop Variables
  let lastTime = performance.now();
  let timeZ = 0;

  function renderLoop(now) {
    requestAnimationFrame(renderLoop);
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    timeZ += dt * 0.08;

    // Handle Drain Process
    if (isDraining) {
      drainTimeRemaining -= dt;
      inkCtx.save();
      inkCtx.setTransform(1, 0, 0, 1, 0, 0);
      inkCtx.globalCompositeOperation = 'destination-out';
      // removes 1.8% of ink per frame (~60fps)
      const fadeRate = 1.0 - Math.pow(1.0 - 0.018, dt * 60);
      inkCtx.fillStyle = `rgba(0, 0, 0, ${fadeRate})`;
      inkCtx.fillRect(0, 0, inkCanvas.width, inkCanvas.height);
      inkCtx.restore();

      if (drainTimeRemaining <= 0) {
        isDraining = false;
        inkCtx.save();
        inkCtx.setTransform(1, 0, 0, 1, 0, 0);
        inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
        inkCtx.restore();
        particles = [];
        const btn = document.getElementById('btnDrain');
        btn.classList.remove('pulsing');
      }
    }

    // Water mode whole-canvas subtle diffusion swirl
    if (currentMode === 'water' && !reducedMotion) {
      bufferCtx.setTransform(1, 0, 0, 1, 0, 0);
      bufferCtx.globalCompositeOperation = 'copy';
      bufferCtx.drawImage(inkCanvas, 0, 0);

      const hw = inkCanvas.width / 2;
      const hh = inkCanvas.height / 2;
      const wobbleX = Math.sin(now * 0.001) * 0.14 * dpr;
      const wobbleY = Math.cos(now * 0.0013) * 0.14 * dpr;

      inkCtx.save();
      inkCtx.setTransform(1, 0, 0, 1, 0, 0);
      inkCtx.globalCompositeOperation = 'copy';
      inkCtx.translate(hw + wobbleX, hh + wobbleY);
      inkCtx.rotate(0.0002);
      inkCtx.scale(1.0004, 1.0004);
      inkCtx.drawImage(bufferCanvas, -hw, -hh);
      inkCtx.restore();
    }

    // Step and Draw Active Particles
    if (particles.length > 0) {
      inkCtx.save();
      inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      inkCtx.globalCompositeOperation = 'multiply';

      const surviving = [];
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.step(dt, timeZ)) {
          p.render(inkCtx);
          surviving.push(p);
        }
      }
      particles = surviving;
      inkCtx.restore();
    }
  }

  // Pointer & Drag Support
  let isPointerDown = false;
  let lastDropTime = 0;
  const DRAG_INTERVAL = 220; // ms

  function handlePointerDown(e) {
    if (e.target.closest('.dock')) return;
    isPointerDown = true;
    const rect = inkCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    spawnDrop(x, y);
    lastDropTime = performance.now();
  }

  function handlePointerMove(e) {
    if (!isPointerDown) return;
    if (e.target.closest('.dock')) return;
    const now = performance.now();
    if (now - lastDropTime >= DRAG_INTERVAL) {
      const rect = inkCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      spawnDrop(x, y);
      lastDropTime = now;
    }
  }

  function handlePointerUp() {
    isPointerDown = false;
  }

  window.addEventListener('pointerdown', handlePointerDown);
  window.addEventListener('pointermove', handlePointerMove);
  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);

  // UI Construction & Interactions
  const swatchesContainer = document.getElementById('swatchesContainer');
  const inkDot = document.getElementById('inkDot');
  const btnWater = document.getElementById('btnWater');
  const btnPaper = document.getElementById('btnPaper');
  const btnDrain = document.getElementById('btnDrain');

  function selectInk(index) {
    currentInkIndex = (index + INKS.length) % INKS.length;
    const buttons = swatchesContainer.querySelectorAll('.swatch');
    buttons.forEach((b, idx) => {
      b.classList.toggle('active', idx === currentInkIndex);
    });
    inkDot.style.backgroundColor = INKS[currentInkIndex].hex;
  }

  INKS.forEach((ink, idx) => {
    const btn = document.createElement('button');
    btn.className = 'swatch' + (idx === 0 ? ' active' : '');
    btn.style.setProperty('--c', ink.hex);
    btn.setAttribute('aria-label', ink.name);
    btn.setAttribute('title', `${ink.name} (${idx + 1})`);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      selectInk(idx);
    });
    swatchesContainer.appendChild(btn);
  });

  function setMode(mode) {
    if (currentMode === mode) return;
    currentMode = mode;
    btnWater.classList.toggle('active', mode === 'water');
    btnPaper.classList.toggle('active', mode === 'paper');
    repaintBackground();
  }

  btnWater.addEventListener('click', (e) => {
    e.stopPropagation();
    setMode('water');
  });

  btnPaper.addEventListener('click', (e) => {
    e.stopPropagation();
    setMode('paper');
  });

  function startDrain() {
    if (isDraining) return;
    isDraining = true;
    drainTimeRemaining = DRAIN_DURATION;
    btnDrain.classList.add('pulsing');
  }

  btnDrain.addEventListener('click', (e) => {
    e.stopPropagation();
    startDrain();
  });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const key = e.key;
    if (key >= '1' && key <= '5') {
      selectInk(parseInt(key, 10) - 1);
    } else if (key === 'p' || key === 'P') {
      setMode(currentMode === 'water' ? 'paper' : 'water');
    } else if (key === 'd' || key === 'D') {
      startDrain();
    }
  });

  // Init
  resize();
  selectInk(0);
  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
