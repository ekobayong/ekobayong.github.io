<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apiary Studio — Honeycomb Hexagonal Navigation</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --amber-top: #4A2606;
      --amber-mid: #2A1604;
      --amber-deep: #150A02;
      --honey-gold: #F0A83A;
      --honey-dark: #C47A18;
      --honey-light: #FFD27A;
      --honey-pale: #FFF0C8;
      --ink-dark: #1C0F03;
      --wax-dark-1: #6B3A0A;
      --wax-dark-2: #3D2005;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 15%, var(--amber-top) 0%, var(--amber-mid) 50%, var(--amber-deep) 100%);
      font-family: var(--font-serif);
      color: var(--honey-pale);
      perspective: 1200px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient Sweep Layer */
    .light-sweep {
      position: fixed;
      inset: -100% -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(125deg, 
        transparent 38%, 
        rgba(255, 210, 122, 0.04) 44%,
        rgba(255, 210, 122, 0.22) 48%, 
        rgba(255, 240, 200, 0.38) 50%, 
        rgba(255, 210, 122, 0.22) 52%, 
        rgba(255, 210, 122, 0.04) 56%, 
        transparent 62%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 10;
      animation: ambientSweep 14s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      transform: translate3d(-20%, -20%, 0);
    }

    @keyframes ambientSweep {
      0% { transform: translate3d(-40%, -40%, 0); }
      50% { transform: translate3d(15%, 15%, 0); }
      100% { transform: translate3d(-40%, -40%, 0); }
    }

    /* Brand Header */
    .brand-block {
      position: fixed;
      top: 32px;
      left: 36px;
      z-index: 30;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #FFF6E5;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .brand-title span {
      font-style: italic;
      font-weight: 400;
      color: var(--honey-light);
      margin-left: 4px;
    }

    .brand-tagline {
      font-family: var(--font-sans);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: rgba(255, 210, 122, 0.65);
      margin-top: 6px;
    }

    /* Hint Footer */
    .hint-bar {
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 210, 122, 0.45);
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.4s ease;
    }

    /* Honeycomb Viewport & Matrix */
    #viewport {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 5;
    }

    #viewport.dimmed {
      opacity: 0.22;
      pointer-events: none;
    }

    .hex-cell {
      position: absolute;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: linear-gradient(145deg, var(--wax-dark-1), var(--wax-dark-2));
      transform-origin: center center;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
      cursor: default;
      outline: none;
      will-change: transform, filter;
    }

    .hex-cell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 240, 200, 0.12) 0%, transparent 60%);
      pointer-events: none;
      clip-path: inherit;
    }

    .hex-cell::after {
      content: "";
      position: absolute;
      inset: 3px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.05), transparent 70%);
      border: 1px solid rgba(255, 210, 122, 0.08);
      pointer-events: none;
    }

    /* Navigation Hex Cells */
    .hex-cell.is-nav {
      cursor: pointer;
      background: radial-gradient(circle at 45% 35%, #FFDF94 0%, var(--honey-gold) 48%, var(--honey-dark) 100%);
      box-shadow: inset 0 0 16px rgba(255, 245, 215, 0.4);
    }

    .hex-cell.is-nav::before {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, transparent 65%);
    }

    .hex-cell.is-nav::after {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: transparent;
    }

    .hex-cell.is-nav:focus-visible {
      filter: drop-shadow(0 0 14px rgba(255, 240, 200, 0.95)) brightness(1.2);
    }

    .nav-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ink-dark);
      pointer-events: none;
      z-index: 2;
    }

    .nav-inner svg {
      width: 22px;
      height: 22px;
      stroke: var(--ink-dark);
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.3));
      transition: transform 0.3s ease;
    }

    .nav-inner span {
      font-family: var(--font-sans);
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin-left: 0.22em;
    }

    .hex-cell.is-nav:hover .nav-inner svg {
      transform: scale(1.12);
    }

    /* Morphing Modal Panel */
    #morph-panel {
      position: fixed;
      z-index: 100;
      background: #231204;
      border: 1px solid rgba(255, 210, 122, 0.25);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8), 0 0 40px rgba(240, 168, 58, 0.15);
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      will-change: left, top, width, height, clip-path, border-radius, opacity;
    }

    #morph-panel.active {
      pointer-events: auto;
      opacity: 1;
    }

    #morph-panel.animating {
      transition: left 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  top 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  height 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  clip-path 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease;
    }

    .panel-container {
      position: absolute;
      inset: 0;
      padding: 56px 64px 48px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.4s ease 0.35s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
    }

    #morph-panel.active.expanded .panel-container {
      opacity: 1;
      transform: translateY(0);
    }

    .panel-kicker {
      font-family: var(--font-sans);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: var(--honey-light);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-kicker::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--honey-gold);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      display: inline-block;
    }

    .panel-title {
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.05;
      font-weight: 500;
      color: #FFF6E5;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .panel-body {
      font-size: 17px;
      line-height: 1.65;
      color: rgba(255, 240, 200, 0.85);
      margin-bottom: 32px;
      max-width: 680px;
    }

    .panel-body p + p {
      margin-top: 16px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      list-style: none;
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 210, 122, 0.15);
    }

    .tag-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--honey-light);
      background: rgba(255, 210, 122, 0.08);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 210, 122, 0.15);
    }

    .tag-hex {
      width: 6px;
      height: 7px;
      background: var(--honey-gold);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }

    /* Round Close Button */
    .close-btn {
      position: absolute;
      top: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 210, 122, 0.08);
      border: 1px solid rgba(255, 210, 122, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--honey-light);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s, border-color 0.2s;
      outline: none;
    }

    .close-btn:hover {
      transform: rotate(90deg) scale(1.08);
      background: rgba(255, 210, 122, 0.2);
      border-color: var(--honey-light);
    }

    .close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* Prefers Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .light-sweep {
        animation: none;
        transform: translate3d(0, 0, 0);
      }
      .hex-cell {
        transition: none !important;
      }
      #morph-panel.animating {
        transition: opacity 0.2s ease !important;
      }
      .panel-container {
        transition: opacity 0.2s ease !important;
      }
      .close-btn {
        transition: none !important;
      }
    }

    @media (max-width: 600px) {
      .panel-container {
        padding: 40px 28px;
      }
      .panel-title {
        font-size: 32px;
      }
      .brand-block {
        top: 20px;
        left: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="light-sweep"></div>

  <header class="brand-block">
    <div class="brand-title">Apiary<span>Studio</span></div>
    <div class="brand-tagline">Architectural &amp; Digital Systems</div>
  </header>

  <main id="viewport" aria-label="Honeycomb Navigation Matrix"></main>

  <div class="hint-bar" id="hint-bar">Traverse the comb &bull; Select a cell to expand</div>

  <div id="morph-panel" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="close-btn" id="close-modal" aria-label="Close details panel">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="panel-container" id="panel-content"></div>
  </div>

  <script>
    (function () {
      const viewport = document.getElementById('viewport');
      const morphPanel = document.getElementById('morph-panel');
      const panelContent = document.getElementById('panel-content');
      const closeModalBtn = document.getElementById('close-modal');
      const hintBar = document.getElementById('hint-bar');

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const NAV_SECTIONS = [
        {
          id: 'work',
          kicker: 'Cell 01 · Selected Commissions',
          title: 'Monolithic digital & spatial forms.',
          paragraphs: [
            'We construct high-density identities, spatial brand architectures, and tactile web interfaces for institutions seeking resonance rather than mere exposure.',
            'Recent endeavors include the kinetic solar pavilion for the Kyoto Triennale and the real-time algorithmic identity for the Zurich Acoustic Pavilion.'
          ],
          tags: ['Spatial Computing', 'Identity Systems', 'Generative Architecture', 'Creative Direction'],
          icon: `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>`
        },
        {
          id: 'studio',
          kicker: 'Cell 02 · Atelier & Philosophy',
          title: 'Structured like wax, poured like sun.',
          paragraphs: [
            'Apiary operates as an interdisciplinary guild of typographers, computational designers, and architectural theorists based across Basel and London.',
            'We reject the disposable velocity of software trends in pursuit of balanced geometric harmony, durable substrates, and timeless typographic weight.'
          ],
          tags: ['Guild Structure', 'Physical Atelier', 'Material Research', 'Typography'],
          icon: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`
        },
        {
          id: 'journal',
          kicker: 'Cell 03 · Notes from the Comb',
          title: 'Essays on tactile interfaces & light.',
          paragraphs: [
            'Critical writing spanning the physics of natural tessellation, screen-space luminance falloff, and structural durability in modern browser runtimes.',
            'Our quarterly pamphlet, "Viscosity", examines how high-inertia motion models humanize mathematical surfaces on flat glass monitors.'
          ],
          tags: ['Publications', 'Mathematical Optics', 'Essays', 'Quarterly Review'],
          icon: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`
        },
        {
          id: 'lab',
          kicker: 'Cell 04 · Experiments & Artifacts',
          title: 'Speculative prototypes & shaders.',
          paragraphs: [
            'The Apiary Lab builds non-commercial browser experiments exploring custom WebGL tessellation, magnetic field simulations, and procedural typography.',
            'Open-source frameworks developed here form the bedrock of our commercial client builds, rigorously tested for performance and tactile spring mechanics.'
          ],
          tags: ['WebGL Shaders', 'Spring Mechanics', 'Open Source', 'Micro-Interactions'],
          icon: `<svg viewBox="0 0 24 24"><path d="M10 2v7.31L4.69 18.2A2 2 0 0 0 6.4 21h11.2a2 2 0 0 0 1.71-2.8L14 9.31V2"></path></svg>`
        },
        {
          id: 'people',
          kicker: 'Cell 05 · The Collective',
          title: 'Craftsmen, mathematicians, authors.',
          paragraphs: [
            'Our fellowship comprises eight partners with cross-disciplinary proficiencies spanning computational geometry, foundry typography, and organic chemistry.',
            'We preserve an intentionally compact roster to maintain direct authorship across all commissions, ensuring that every project is sculpted by senior hands.'
          ],
          tags: ['8 Fellows', 'Atelier Hierarchy', 'Direct Authorship', 'London / Basel'],
          icon: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`
        },
        {
          id: 'contact',
          kicker: 'Cell 06 · Transmissions',
          title: 'Initiate a dialogue or visit.',
          paragraphs: [
            'We accept four comprehensive commissions each calendar year. Direct your correspondence to our London salon or initiate an encrypted transmission.',
            'Inquiries regarding architectural installations, brand identities, or guest lectures: hello@apiary-studio.design / +44 (0)20 7946 0831.'
          ],
          tags: ['Encrypted Dispatch', 'London Salon', '4 Commissions / Year', 'Press Pack'],
          icon: `<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>`
        }
      ];

      // Hex geometry relative offsets around center (q, r) in axial coordinates
      const NAV_OFFSETS = [
        { dq: 0, dr: -1, sectionIndex: 0 }, // Top
        { dq: 1, dr: -1, sectionIndex: 1 }, // Top Right
        { dq: 1, dr: 0,  sectionIndex: 2 }, // Bottom Right
        { dq: 0, dr: 1,  sectionIndex: 3 }, // Bottom
        { dq: -1, dr: 1, sectionIndex: 4 }, // Bottom Left
        { dq: -1, dr: 0, sectionIndex: 5 }  // Top Left
      ];

      let hexWidth = 100;
      let hexHeight = hexWidth * 1.1547;
      let cells = [];
      let centerCell = null;
      let activeCell = null;
      let isModalOpen = false;

      // Cursor state & Lissajous idle
      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let idleTime = 0;
      let isIdle = false;
      let lissajousT = 0;

      function getHexWidth() {
        const w = window.innerWidth;
        if (w >= 3840) return 180;
        if (w >= 1600) return 132;
        if (w >= 1024) return 100;
        if (w >= 640) return 82;
        return 64;
      }

      function buildGrid() {
        viewport.innerHTML = '';
        cells = [];

        hexWidth = getHexWidth();
        hexHeight = hexWidth * 1.1547;

        const gapX = 4;
        const gapY = 3;
        const colStep = (hexWidth * 0.75) + gapX;
        const rowStep = hexHeight + gapY;

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        const cols = Math.ceil(screenW / colStep) + 5;
        const rows = Math.ceil(screenH / rowStep) + 5;

        const midCol = Math.floor(cols / 2);
        const midRow = Math.floor(rows / 2);

        const originX = (screenW - (cols * colStep)) / 2;
        const originY = (screenH - (rows * rowStep)) / 2;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = originX + (c * colStep);
            const y = originY + (r * rowStep) + ((c % 2 === 1) ? rowStep * 0.5 : 0);

            const cellEl = document.createElement('div');
            cellEl.className = 'hex-cell';
            cellEl.style.width = `${hexWidth}px`;
            cellEl.style.height = `${hexHeight}px`;
            cellEl.style.left = `${x}px`;
            cellEl.style.top = `${y}px`;

            const cellData = {
              el: cellEl,
              col: c,
              row: r,
              x: x + hexWidth / 2,
              y: y + hexHeight / 2,
              baseLeft: x,
              baseTop: y,
              width: hexWidth,
              height: hexHeight,
              isNav: false,
              navData: null
            };

            // Identify center cell
            if (c === midCol && r === midRow) {
              centerCell = cellData;
            }

            viewport.appendChild(cellEl);
            cells.push(cellData);
          }
        }

        // Attach Nav items to immediate neighbors of center
        if (centerCell) {
          const isOddCol = (centerCell.col % 2 === 1);
          
          NAV_OFFSETS.forEach(offset => {
            let targetCol = centerCell.col + offset.dq;
            let targetRow = centerCell.row + offset.dr;

            // Axial to offset row adjustments
            if (offset.dq !== 0) {
              if (isOddCol && offset.dq === 1 && offset.dr === -1) targetRow = centerCell.row;
              if (isOddCol && offset.dq === -1 && offset.dr === 1) targetRow = centerCell.row + 1;
              if (!isOddCol && offset.dq === 1 && offset.dr === 0) targetRow = centerCell.row - 1;
              if (!isOddCol && offset.dq === -1 && offset.dr === 0) targetRow = centerCell.row - 1;
            }

            const target = cells.find(c => c.col === targetCol && c.row === targetRow);
            if (target) {
              target.isNav = true;
              target.navData = NAV_SECTIONS[offset.sectionIndex];
              target.el.classList.add('is-nav');
              target.el.setAttribute('tabindex', '0');
              target.el.setAttribute('role', 'button');
              target.el.setAttribute('aria-label', `${target.navData.id.toUpperCase()}: ${target.navData.title}`);

              target.el.innerHTML = `
                <div class="nav-inner">
                  ${target.navData.icon}
                  <span>${target.navData.id}</span>
                </div>
              `;

              target.el.addEventListener('click', () => openModal(target));
              target.el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  openModal(target);
                }
              });
            }
          });
        }
      }

      function updateHexPhysics(targetX, targetY) {
        if (isModalOpen) return;

        const maxDist = hexWidth * 3.2;

        for (let i = 0; i < cells.length; i++) {
          const c = cells[i];
          const dx = targetX - c.x;
          const dy = targetY - c.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDist) {
            // Smoothstep falloff
            const norm = dist / maxDist;
            const factor = 1 - (norm * norm * (3 - 2 * norm));

            const lift = factor * 34;
            const scale = 0.96 + (factor * 0.06);
            const brightness = 1 + (factor * 0.55);
            const saturate = 1 + (factor * 0.3);

            // Tilt toward pointer
            const rotX = -(dy / maxDist) * 14 * factor;
            const rotY = (dx / maxDist) * 14 * factor;

            c.el.style.transform = `translate3d(0, 0, ${lift.toFixed(1)}px) scale(${scale.toFixed(3)}) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
            c.el.style.filter = `brightness(${brightness.toFixed(2)}) saturate(${saturate.toFixed(2)})`;
          } else {
            c.el.style.transform = 'translate3d(0, 0, 0) scale(0.96) rotateX(0deg) rotateY(0deg)';
            c.el.style.filter = 'brightness(1) saturate(1)';
          }
        }
      }

      function renderPanel(data) {
        panelContent.innerHTML = `
          <div class="panel-kicker">${data.kicker}</div>
          <h2 class="panel-title">${data.title}</h2>
          <div class="panel-body">
            ${data.paragraphs.map(p => `<p>${p}</p>`).join('')}
          </div>
          <ul class="tag-list">
            ${data.tags.map(tag => `
              <li class="tag-item">
                <span class="tag-hex"></span>
                <span>${tag}</span>
              </li>
            `).join('')}
          </ul>
        `;
      }

      function openModal(cell) {
        if (isModalOpen) return;
        isModalOpen = true;
        activeCell = cell;

        renderPanel(cell.navData);

        const hexClip = 'polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)';
        const rectClip = 'polygon(0% 0%, 100% 0%, 100% 100%, 100% 100%, 0% 100%, 0% 0%)';

        // Target geometry: 880x620 or responsive
        const targetW = Math.min(880, window.innerWidth - 32);
        const targetH = Math.min(620, window.innerHeight - 40);
        const targetLeft = (window.innerWidth - targetW) / 2;
        const targetTop = (window.innerHeight - targetH) / 2;

        // Stage 1: Anchor precisely over source cell
        morphPanel.classList.remove('animating', 'expanded');
        morphPanel.style.left = `${cell.baseLeft}px`;
        morphPanel.style.top = `${cell.baseTop}px`;
        morphPanel.style.width = `${cell.width}px`;
        morphPanel.style.height = `${cell.height}px`;
        morphPanel.style.clipPath = hexClip;
        morphPanel.style.borderRadius = '0px';
        morphPanel.classList.add('active');
        morphPanel.setAttribute('aria-hidden', 'false');

        // Hide clicked cell and hint
        cell.el.style.opacity = '0';
        viewport.classList.add('dimmed');
        hintBar.style.opacity = '0';

        // Force browser reflow
        void morphPanel.offsetWidth;

        // Stage 2: Morph to central card
        if (!prefersReducedMotion) {
          morphPanel.classList.add('animating');
        }

        requestAnimationFrame(() => {
          morphPanel.style.left = `${targetLeft}px`;
          morphPanel.style.top = `${targetTop}px`;
          morphPanel.style.width = `${targetW}px`;
          morphPanel.style.height = `${targetH}px`;
          morphPanel.style.clipPath = rectClip;
          morphPanel.style.borderRadius = '24px';
          morphPanel.classList.add('expanded');
          closeModalBtn.focus();
        });
      }

      function closeModal() {
        if (!isModalOpen || !activeCell) return;

        const hexClip = 'polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)';

        morphPanel.classList.remove('expanded');

        if (!prefersReducedMotion) {
          morphPanel.classList.add('animating');
        }

        morphPanel.style.left = `${activeCell.baseLeft}px`;
        morphPanel.style.top = `${activeCell.baseTop}px`;
        morphPanel.style.width = `${activeCell.width}px`;
        morphPanel.style.height = `${activeCell.height}px`;
        morphPanel.style.clipPath = hexClip;
        morphPanel.style.borderRadius = '0px';

        viewport.classList.remove('dimmed');
        hintBar.style.opacity = '1';

        setTimeout(() => {
          morphPanel.classList.remove('active', 'animating');
          morphPanel.setAttribute('aria-hidden', 'true');
          if (activeCell) {
            activeCell.el.style.opacity = '1';
            activeCell.el.focus();
            activeCell = null;
          }
          isModalOpen = false;
        }, prefersReducedMotion ? 50 : 700);
      }

      // Event Listeners
      window.addEventListener('pointermove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        idleTime = 0;
        isIdle = false;
        if (!isModalOpen) {
          updateHexPhysics(mouse.x, mouse.y);
        }
      });

      closeModalBtn.addEventListener('click', closeModal);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isModalOpen) {
          closeModal();
        }
      });

      let resizeDebounce;
      window.addEventListener('resize', () => {
        clearTimeout(resizeDebounce);
        resizeDebounce = setTimeout(() => {
          if (isModalOpen) closeModal();
          buildGrid();
        }, 150);
      });

      // Phantom Cursor Loop (Lissajous path after 4 seconds idle)
      function loop() {
        idleTime += 0.016;

        if (idleTime >= 4 && !prefersReducedMotion) {
          isIdle = true;
        }

        if (isIdle && !isModalOpen) {
          lissajousT += 0.018;
          const w = window.innerWidth;
          const h = window.innerHeight;
          const cx = w / 2;
          const cy = h / 2;

          // 3:2 Lissajous curve
          const px = cx + (Math.sin(lissajousT * 0.8) * (w * 0.32));
          const py = cy + (Math.sin(lissajousT * 1.2) * (h * 0.28));

          updateHexPhysics(px, py);
        }

        requestAnimationFrame(loop);
      }

      // Initialize
      buildGrid();
      updateHexPhysics(mouse.x, mouse.y);
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
