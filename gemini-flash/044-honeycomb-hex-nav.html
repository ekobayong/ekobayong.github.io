<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apiary Studio — Biomimetic Interaction & Tactile Spatial Systems</title>
  <style>
    /* ==========================================================================
       RESET & ROOT VARIABLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-amber-dark: #150A02;
      --bg-amber-mid: #2A1604;
      --bg-amber-light: #4A2606;
      --honey-gold: #F0A83A;
      --honey-gold-dark: #C47A18;
      --honey-pale: #FFD27A;
      --honey-bright: #FFF0C8;
      --ink-dark: #1C0F03;
      --wax-dark-1: #6B3A0A;
      --wax-dark-2: #3D2005;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-amber-dark);
      background: radial-gradient(circle at 18% 18%, var(--bg-amber-light) 0%, var(--bg-amber-mid) 52%, var(--bg-amber-dark) 100%);
      font-family: var(--font-sans);
      color: #FFF2D6;
      perspective: 1200px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ==========================================================================
       LIGHT SWEEP OVERLAY (Sinusoidal Ease Every 14s)
       ========================================================================== */
    .light-sweep {
      position: fixed;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 8;
      background: linear-gradient(
        135deg,
        rgba(255, 210, 122, 0) 0%,
        rgba(255, 210, 122, 0) 44%,
        rgba(255, 210, 122, 0.16) 47%,
        rgba(255, 240, 200, 0.88) 50%,
        rgba(255, 210, 122, 0.26) 53%,
        rgba(255, 210, 122, 0) 56%,
        rgba(255, 210, 122, 0) 100%
      );
      transform: translate3d(-65%, -65%, 0);
      animation: sweepPass 14s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes sweepPass {
      0% {
        transform: translate3d(-75%, -75%, 0);
        opacity: 0.1;
      }
      15% {
        opacity: 0.85;
      }
      50% {
        transform: translate3d(20%, 20%, 0);
        opacity: 1;
      }
      85% {
        opacity: 0.85;
      }
      100% {
        transform: translate3d(-75%, -75%, 0);
        opacity: 0.1;
      }
    }

    /* ==========================================================================
       BRAND HEADER (Top-Left)
       ========================================================================== */
    .brand-block {
      position: fixed;
      top: 36px;
      left: 44px;
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.015em;
      color: #FFF3DB;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85), 0 0 30px rgba(74, 38, 6, 0.6);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title .brand-main {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand-title .brand-sub {
      font-style: italic;
      font-weight: 400;
      color: var(--honey-pale);
      text-shadow: 0 0 16px rgba(255, 210, 122, 0.4);
    }

    .brand-tagline {
      margin-top: 8px;
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 210, 122, 0.72);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    /* ==========================================================================
       BOTTOM INTERACTION HINT LINE
       ========================================================================== */
    .comb-hint-line {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 9px 24px;
      background: rgba(26, 14, 4, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 210, 122, 0.22);
      border-radius: 40px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 240, 200, 0.18);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 225, 160, 0.85);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .comb-hint-line.is-hidden {
      opacity: 0;
      transform: translate(-50%, 14px);
    }

    .hint-hex-glyph {
      width: 9px;
      height: 10px;
      background: var(--honey-gold);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 8px rgba(240, 168, 58, 0.8);
      display: inline-block;
    }

    /* ==========================================================================
       HONEYCOMB SCENE CONTAINER
       ========================================================================== */
    .comb-scene {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      transform-style: preserve-3d;
      pointer-events: auto;
      transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1),
                  filter 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .comb-scene.is-dimmed {
      opacity: 0.22;
      filter: brightness(0.6) saturate(0.8);
      pointer-events: none;
    }

    /* ==========================================================================
       HEXAGON CELL STYLES
       ========================================================================== */
    .hex-cell {
      position: absolute;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: linear-gradient(150deg, var(--wax-dark-1) 0%, #522B07 45%, var(--wax-dark-2) 100%);
      transform-origin: center center;
      transform-style: preserve-3d;
      transform: translate3d(0, 0, 0px) scale(0.96) rotateX(0deg) rotateY(0deg);
      filter: brightness(1) saturate(1);
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                  filter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                  opacity 0.45s ease;
      will-change: transform, filter;
      contain: layout style;
    }

    /* Diagonal Highlight Overlay */
    .hex-cell::after {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: linear-gradient(135deg, rgba(255, 235, 180, 0.16) 0%, rgba(255, 210, 122, 0.04) 42%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* Inner Rim Inset 3px with the Same Clip */
    .hex-cell::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: radial-gradient(circle at 48% 36%, #221103 0%, #140802 65%, #0A0401 100%);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.92), inset 0 -1px 3px rgba(255, 180, 50, 0.15);
      pointer-events: none;
      z-index: 1;
    }

    /* Hidden source hex during modal morph */
    .hex-cell.is-active-source {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* ==========================================================================
       CENTER HUB CELL (The Nucleus of the Comb)
       ========================================================================== */
    .hex-cell.hex-hub {
      background: linear-gradient(145deg, #7A420C 0%, #522805 50%, #2A1303 100%);
      z-index: 4;
    }

    .hex-cell.hex-hub::before {
      background: radial-gradient(circle at 50% 45%, #2B1403 0%, #160801 70%, #0B0401 100%);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.95), inset 0 0 12px rgba(240, 168, 58, 0.12);
    }

    .hub-content {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.9;
    }

    .hub-icon {
      width: 28%;
      height: 28%;
      margin-bottom: 5px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
    }

    .hub-label {
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: var(--honey-gold);
      text-shadow: 0 0 10px rgba(240, 168, 58, 0.5), 0 1px 3px rgba(0, 0, 0, 0.9);
      line-height: 1;
    }

    /* ==========================================================================
       NAVIGATION BUTTON HEXES (Work, Studio, Journal, Lab, People, Contact)
       ========================================================================== */
    .hex-cell.hex-nav {
      cursor: pointer;
      background: linear-gradient(150deg, var(--honey-gold) 0%, #DE8F20 48%, var(--honey-gold-dark) 100%);
      box-shadow: 0 6px 24px rgba(240, 168, 58, 0.28), 0 0 20px rgba(240, 168, 58, 0.15);
      z-index: 5;
      outline: none;
    }

    /* Honey-gold pale radial sheen */
    .hex-cell.hex-nav::after {
      background: radial-gradient(circle at 44% 30%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 240, 200, 0.25) 45%, transparent 75%);
    }

    /* Nav inner rim */
    .hex-cell.hex-nav::before {
      background: linear-gradient(160deg, #FFC46B 0%, var(--honey-gold) 35%, #BD7313 100%);
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(110, 50, 0, 0.4);
    }

    .hex-nav-content {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10% 6%;
      pointer-events: none;
    }

    .hex-nav-icon {
      width: 28px;
      height: 28px;
      stroke: var(--ink-dark);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      margin-bottom: 7px;
      filter: drop-shadow(0 1px 2px rgba(255, 240, 200, 0.5));
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .hex-nav-label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dark);
      line-height: 1;
      text-shadow: 0 1px 2px rgba(255, 245, 220, 0.6);
    }

    /* Hover Brightens */
    .hex-cell.hex-nav:hover {
      filter: brightness(1.24) saturate(1.15) !important;
    }

    .hex-cell.hex-nav:hover .hex-nav-icon {
      transform: translateY(-2px);
    }

    /* Keyboard Focus Ring */
    .hex-cell.hex-nav:focus-visible {
      filter: brightness(1.3) saturate(1.2) !important;
    }

    .hex-cell.hex-nav:focus-visible::after {
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 240, 200, 0.4) 55%, transparent 80%);
      box-shadow: inset 0 0 0 3px #FFF8E6, 0 0 24px rgba(255, 240, 200, 0.9);
    }

    /* ==========================================================================
       MORPHING CONTENT PANEL MODAL
       ========================================================================== */
    .modal-panel {
      position: fixed;
      z-index: 100;
      display: none;
      overflow: hidden;
      background: linear-gradient(140deg, rgba(38, 19, 4, 0.98) 0%, rgba(24, 11, 2, 0.99) 55%, rgba(14, 6, 1, 1) 100%);
      border: 1px solid rgba(255, 210, 122, 0.32);
      box-shadow: 0 35px 85px rgba(0, 0, 0, 0.88),
                  0 0 60px rgba(240, 168, 58, 0.18),
                  inset 0 1px 0 rgba(255, 240, 200, 0.25);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      will-change: top, left, width, height, clip-path, border-radius;
      box-sizing: border-box;
    }

    .modal-scroll-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 60px 68px 52px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(18px);
      scrollbar-width: thin;
      scrollbar-color: rgba(240, 168, 58, 0.4) transparent;
    }

    .modal-scroll-container::-webkit-scrollbar {
      width: 6px;
    }

    .modal-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(240, 168, 58, 0.4);
      border-radius: 4px;
    }

    /* Close Button (Rotates 90 degrees on hover) */
    .modal-close-btn {
      position: absolute;
      top: 26px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(28, 14, 4, 0.85);
      border: 1px solid rgba(255, 210, 122, 0.35);
      color: var(--honey-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                  background 0.25s ease,
                  border-color 0.25s ease,
                  color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .modal-close-btn:hover {
      transform: rotate(90deg);
      background: rgba(240, 168, 58, 0.25);
      border-color: var(--honey-pale);
      color: var(--honey-bright);
      box-shadow: 0 0 16px rgba(240, 168, 58, 0.4);
    }

    .modal-close-btn:focus-visible {
      outline: 2px solid var(--honey-pale);
      outline-offset: 3px;
    }

    .modal-close-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }

    /* Panel Typography */
    .panel-kicker {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--honey-gold);
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .panel-kicker::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 9px;
      background: var(--honey-gold);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 8px rgba(240, 168, 58, 0.6);
    }

    .panel-title {
      font-family: var(--font-serif);
      font-size: clamp(34px, 4.4vw, 56px);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.015em;
      color: #FFF4E0;
      margin: 0 0 28px 0;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
    }

    .panel-body {
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.76;
      color: #E2CCB5;
      max-width: 730px;
    }

    .panel-body p {
      margin-bottom: 20px;
    }

    .panel-body p:last-child {
      margin-bottom: 0;
    }

    /* Tag List (Bulleted with Tiny Hexagons) */
    .panel-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 36px;
      padding: 0;
      list-style: none;
    }

    .panel-tags li {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #FFD485;
      background: rgba(240, 168, 58, 0.09);
      border: 1px solid rgba(240, 168, 58, 0.24);
      padding: 7px 15px 7px 11px;
      border-radius: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .panel-tags .tag-hex-bullet {
      width: 8px;
      height: 9px;
      background: var(--honey-gold);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      margin-right: 9px;
      box-shadow: 0 0 6px rgba(240, 168, 58, 0.7);
      flex-shrink: 0;
    }

    /* ==========================================================================
       MEDIA QUERIES (Responsiveness & Preferences)
       ========================================================================== */
    @media (max-width: 768px) {
      .brand-block {
        top: 24px;
        left: 24px;
      }
      .brand-title {
        font-size: 26px;
      }
      .modal-scroll-container {
        padding: 44px 28px 36px;
      }
      .panel-title {
        font-size: 30px;
        margin-bottom: 20px;
      }
      .panel-body {
        font-size: 15px;
        line-height: 1.68;
      }
      .comb-hint-line {
        bottom: 18px;
        font-size: 10px;
        padding: 7px 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .light-sweep {
        animation: none !important;
        transform: translate3d(0, 0, 0) !important;
        opacity: 0.16 !important;
      }

      .hex-cell {
        transition: none !important;
      }

      .modal-panel,
      .modal-scroll-container,
      .comb-scene,
      .comb-hint-line,
      .modal-close-btn {
        transition-duration: 0.001s !important;
      }
    }
  </style>
</head>
<body>

  <!-- Brand Block Top-Left -->
  <header class="brand-block" role="banner">
    <h1 class="brand-title">
      <span class="brand-main">Apiary</span>
      <span class="brand-sub">Studio</span>
    </h1>
    <p class="brand-tagline">Architectural Interaction & Tactile Systems</p>
  </header>

  <!-- Diagonal Light Sweep -->
  <div class="light-sweep" aria-hidden="true"></div>

  <!-- Tessellated Honeycomb 3D Grid -->
  <main class="comb-scene" id="combScene" role="region" aria-label="Honeycomb interactive navigation"></main>

  <!-- Interaction Hint Line -->
  <div class="comb-hint-line" id="combHint">
    <span class="hint-hex-glyph" aria-hidden="true"></span>
    <span>Hover to palpate wax · Click a cell to inspect · Esc to close</span>
    <span class="hint-hex-glyph" aria-hidden="true"></span>
  </div>

  <!-- Morphing Content Panel -->
  <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close details panel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="modal-scroll-container" id="modalContent">
      <div class="panel-kicker" id="panelKicker">Cell 03 · Notes from the comb</div>
      <h2 class="panel-title" id="panelTitle">Title</h2>
      <div class="panel-body" id="panelBody"></div>
      <ul class="panel-tags" id="panelTags" aria-label="Keywords"></ul>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ==========================================================================
         STUDIO COPY & CONTENT ARCHIVE
         ========================================================================== */
      const NAV_SECTIONS = {
        work: {
          key: 'work',
          label: 'Work',
          iconSvg: `
            <svg viewBox="0 0 24 24" class="hex-nav-icon" aria-hidden="true">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>
              <line x1="12" y1="12" x2="12" y2="12.01"></line>
              <path d="M2 12.5h20"></path>
            </svg>`,
          kicker: 'Cell 01 · Selected Commissions',
          title: 'Kinetic Architecture & Tactile Interfaces',
          paragraphs: [
            'Apiary designs living spatial systems where physical matter and computational intelligence merge seamlessly. Over the past decade, our atelier has engineered responsive façades, biomimetic acoustic installations, and tactile computing environments for research institutions, cultural pavilions, and avant-garde architectural practices worldwide.',
            'From the Solarium Pavilion in Engadin—a double-curved hexagonal timber envelope that breathes and dilates according to diurnal solar flux—to the Amber Protocol haptic controller deployed in sound laboratories across Berlin and Kyoto, our work rejects cold sterile glass in favor of natural viscosities, resonant hardwoods, and warm beeswax acoustics.',
            'Every commission is prototyped at 1:1 physical scale in our Zurich workshop before code and microcontroller arrays are embedded into the structural joinery.'
          ],
          tags: [
            'Responsive Envelopes',
            'Biomimetic Geometry',
            'Haptic Hardware',
            'Solarium Pavilion',
            'Embedded Kinetics'
          ]
        },
        studio: {
          key: 'studio',
          label: 'Studio',
          iconSvg: `
            <svg viewBox="0 0 24 24" class="hex-nav-icon" aria-hidden="true">
              <path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"></path>
              <polyline points="9 22 9 13 15 13 15 22"></polyline>
            </svg>`,
          kicker: 'Cell 02 · Philosophy & Atelier',
          title: 'Crafting at the Threshold of Physical and Digital',
          paragraphs: [
            'Founded in 2018 at the confluence of carpentry, algorithmic botany, and embedded robotics, Apiary operates as an interdisciplinary guild. We believe the future of human interaction lies not in frictionless glass slabs, but in resistance, texture, warmth, and deliberate craft.',
            'Our studio occupies a converted 19th-century timber warehouse on the Limmat. Half timber mill, half clean-room electronics lab, the atelier houses multi-axis CNC mills beside traditional Japanese joinery benches, organic casting vats, and high-frequency sensor benches.',
            'Here, we treat software as a physical substance—something that must possess mass, inertia, surface tension, and memory. When an interface yields like warm wax under human touch, digital space ceases to feel foreign.'
          ],
          tags: [
            'Limmat Atelier',
            'Sensory Design',
            'Computational Joinery',
            'Material Epistemology',
            'Zero-Glass Interfaces'
          ]
        },
        journal: {
          key: 'journal',
          label: 'Journal',
          iconSvg: `
            <svg viewBox="0 0 24 24" class="hex-nav-icon" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="9" y1="7" x2="15" y2="7"></line>
              <line x1="9" y1="11" x2="15" y2="11"></line>
            </svg>`,
          kicker: 'Cell 03 · Notes from the comb',
          title: 'On the Viscosity of Digital Thought',
          paragraphs: [

          title: 'Commissions, Coordinates & Encrypted Frequencies',
          paragraphs: [

      /* ==========================================================================
         DOM ELEMENTS & STATE
         ========================================================================== */
      const combScene = document.getElementById('combScene');
      const combHint = document.getElementById('combHint');
      const modalPanel = document.getElementById('modalPanel');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalContent = document.getElementById('modalContent');
      const panelKicker = document.getElementById('panelKicker');
      const panelTitle = document.getElementById('panelTitle');
      const panelBody = document.getElementById('panelBody');
      const panelTags = document.getElementById('panelTags');

      let hexCells = [];
      let activeHexEl = null;
      let isModalOpen = false;
      let currentHexW = 100;
      let currentHexH = 115.47;

      // Pointer & Lissajous Wander State
      let lastInputTime = performance.now();
      let lastPointerX = window.innerWidth / 2;
      let lastPointerY = window.innerHeight / 2;
      let prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => {
        prefersReducedMotion = e.matches;
      });

      /* ==========================================================================
         RESPONSIVE HEX SIZING
         Phones: 64px, Tablets: 82px, Laptops: 100px, Wide: 132px, 4K: 180px
         ========================================================================== */
      function calculateHexWidth(viewportWidth) {
        if (viewportWidth < 600) return 64;
        if (viewportWidth < 1024) return 82;
        if (viewportWidth < 1600) return 100;
        if (viewportWidth < 2560) return 132;
        return 180;
      }

      /* ==========================================================================
         HONEYCOMB GRID GENERATION (Odd-r Pointy-Topped Layout)
         Rows offset by half a step with 4px gap and 3px vertical gap.
         ========================================================================== */
      function buildGrid() {
        combScene.innerHTML = '';
        hexCells = [];

        const vw = window.innerWidth;
        const vh = window.innerHeight;

        currentHexW = calculateHexWidth(vw);
        currentHexH = currentHexW * 1.1547005; // 2 / sqrt(3)

        const gapX = 4;
        const gapY = 3;
        const deltaX = currentHexW + gapX;
        const deltaY = 0.75 * currentHexH + gapY;

        const centerX = vw / 2;
        const centerY = vh / 2;

        const maxR = Math.ceil((vh / 2) / deltaY) + 2;
        const maxC = Math.ceil((vw / 2) / deltaX) + 2;

        /* Ring neighbor mapping around center (r=0, c=0):
           - Work: NW (r=-1, c=-1)
           - Studio: NE (r=-1, c=0)
           - Journal: E (r=0, c=1)
           - Lab: SE (r=1, c=0)
           - People: SW (r=1, c=-1)
           - Contact: W (r=0, c=-1)
        */
        const navMap = {
          '-1,-1': 'work',
          '-1,0': 'studio',
          '0,1': 'journal',
          '1,0': 'lab',
          '1,-1': 'people',
          '0,-1': 'contact'
        };

        const fragment = document.createDocumentFragment();

        for (let r = -maxR; r <= maxR; r++) {
          const rowTop = centerY - currentHexH / 2 + r * deltaY;
          const isOddRow = Math.abs(r) % 2 === 1;
          const rowShiftX = isOddRow ? 0.5 * deltaX : 0;

          for (let c = -maxC; c <= maxC; c++) {
            const cellLeft = centerX - currentHexW / 2 + c * deltaX + rowShiftX;
            const key = `${r},${c}`;

            const el = document.createElement('div');
            el.className = 'hex-cell';
            el.style.left = `${Math.round(cellLeft)}px`;
            el.style.top = `${Math.round(rowTop)}px`;
            el.style.width = `${Math.round(currentHexW)}px`;
            el.style.height = `${Math.round(currentHexH)}px`;

            // Hub center cell (r=0, c=0)
            if (r === 0 && c === 0) {
              el.classList.add('hex-hub');
              el.innerHTML = `
                <div class="hub-content" aria-hidden="true">
                  <svg class="hub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <polygon points="12 2 21 7 21 17 12 22 3 17 3 7" stroke="rgba(240,168,58,0.75)" fill="rgba(240,168,58,0.12)" />
                    <circle cx="12" cy="12" r="3.2" fill="#F0A83A" />
                    <line x1="12" y1="2" x2="12" y2="22" stroke="rgba(240,168,58,0.3)" />
                    <line x1="3" y1="7" x2="21" y2="17" stroke="rgba(240,168,58,0.3)" />
                    <line x1="3" y1="17" x2="21" y2="7" stroke="rgba(240,168,58,0.3)" />
                  </svg>
                  <span class="hub-label">APIARY</span>
                </div>`;
            }
            // Six Navigation Hexes
            else if (navMap[key]) {
              const navKey = navMap[key];
              const navData = NAV_SECTIONS[navKey];

              el.classList.add('hex-nav');
              el.setAttribute('role', 'button');
              el.setAttribute('tabindex', '0');
              el.setAttribute('aria-label', `Navigate to ${navData.label} section`);
              el.setAttribute('data-nav', navKey);

              el.innerHTML = `
                <div class="hex-nav-content">
                  ${navData.iconSvg}
                  <span class="hex-nav-label">${navData.label}</span>
                </div>`;

              // Click & Keyboard Enter/Space to Open Modal
              el.addEventListener('click', (evt) => {
                evt.stopPropagation();
                openNavModal(navKey, el);
              });

              el.addEventListener('keydown', (evt) => {
                if (evt.key === 'Enter' || evt.key === ' ') {
                  evt.preventDefault();
                  openNavModal(navKey, el);
                }
              });
            }

            fragment.appendChild(el);

            hexCells.push({
              el,
              cx: cellLeft + currentHexW / 2,
              cy: rowTop + currentHexH / 2,
              active: false
            });
          }
        }

        combScene.appendChild(fragment);
      }

      /* ==========================================================================
         POINTER PHYSICS & SMOOTHSTEP DISTANCE FALLOFF
         Radius: 3.2 hex widths
         Lift: translateZ up to 34px
         Scale: 0.96 to 1.02
         Brightness: 1.0 to 1.55
         Saturation: 1.0 to 1.3
         Tilt: rotateX / rotateY up to 14 deg toward cursor
         ========================================================================== */
      function applyCursorFalloff(pointerX, pointerY) {
        if (isModalOpen || prefersReducedMotion) return;

        const radius = 3.2 * currentHexW;
        const radiusSq = radius * radius;
        const tiltMax = 14;

        for (let i = 0; i < hexCells.length; i++) {
          const cell = hexCells[i];
          const dx = pointerX - cell.cx;
          const dy = pointerY - cell.cy;
          const distSq = dx * dx + dy * dy;

          if (distSq < radiusSq) {
            const dist = Math.sqrt(distSq);
            // Normalized smoothstep: u in [0, 1]
            const u = 1 - (dist / radius);
            const s = u * u * (3 - 2 * u); // Smoothstep curve

            const lift = s * 34;
            const scale = 0.96 + s * 0.06;
            const brightness = 1.0 + s * 0.55;
            const saturate = 1.0 + s * 0.30;

            const normX = dx / (dist || 1);
            const normY = dy / (dist || 1);
            const rotX = -normY * s * tiltMax;
            const rotY = normX * s * tiltMax;

            cell.el.style.transform = `translate3d(0, 0, ${lift.toFixed(2)}px) scale(${scale.toFixed(4)}) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`;
            cell.el.style.filter = `brightness(${brightness.toFixed(3)}) saturate(${saturate.toFixed(3)})`;
            cell.active = true;
          } else if (cell.active) {
            // Settle back like a wave through wax
            cell.el.style.transform = 'translate3d(0, 0, 0px) scale(0.96) rotateX(0deg) rotateY(0deg)';
            cell.el.style.filter = 'brightness(1) saturate(1)';
            cell.active = false;
          }
        }
      }

      /* ==========================================================================
         LISSAJOUS IDLE WANDER (Triggered after 4 seconds of idle pointer)
         ========================================================================== */
      function animLoop(now) {
        if (!isModalOpen && !prefersReducedMotion) {
          const idleTime = now - lastInputTime;

          if (idleTime > 4000) {
            const t = (idleTime - 4000) * 0.001; // elapsed seconds

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const rx = Math.min(window.innerWidth * 0.32, 460);
            const ry = Math.min(window.innerHeight * 0.28, 320);

            // Lissajous curve with smooth irrational frequency ratio
            const lx = cx + rx * Math.sin(0.44 * t);
            const ly = cy + ry * Math.sin(0.72 * t + 0.9);

            // Smooth transition from the last mouse position into the path over 1.4s
            const blend = Math.min(1, (idleTime - 4000) / 1400);
            const px = lastPointerX + (lx - lastPointerX) * blend;
            const py = lastPointerY + (ly - lastPointerY) * blend;

            applyCursorFalloff(px, py);
          }
        }
        requestAnimationFrame(animLoop);
      }
      requestAnimationFrame(animLoop);

      /* Pointer Events */
      window.addEventListener('pointermove', (e) => {
        lastInputTime = performance.now();
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        if (!isModalOpen && !prefersReducedMotion) {
          applyCursorFalloff(e.clientX, e.clientY);
        }
      }, { passive: true });

      window.addEventListener('pointerdown', (e) => {
        lastInputTime = performance.now();
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
      }, { passive: true });

      /* ==========================================================================
         MORPHING CONTENT PANEL MODAL
         - Starts exactly over the clicked hex (same size, same hex clip-path)
         - In 0.7s grows to a centred 880x620 card
         - 6-point clip-path interpolates into a rectangle, border-radius rounds to 24px
         - Comb dims to 22% opacity and flattens
         - Content fades up after 0.35s
         ========================================================================== */
      function openNavModal(navKey, sourceEl) {
        if (isModalOpen) return;
        isModalOpen = true;
        activeHexEl = sourceEl;

        const data = NAV_SECTIONS[navKey];
        if (!data) return;

        // Dim and flatten comb
        combScene.classList.add('is-dimmed');
        sourceEl.classList.add('is-active-source');
        combHint.classList.add('is-hidden');

        // Reset all hexes to baseline flat
        for (let i = 0; i < hexCells.length; i++) {
          const cell = hexCells[i];
          if (cell.active) {
            cell.el.style.transform = 'translate3d(0, 0, 0px) scale(0.96) rotateX(0deg) rotateY(0deg)';
            cell.el.style.filter = 'brightness(1) saturate(1)';
            cell.active = false;
          }
        }

        // Populate content
        panelKicker.textContent = data.kicker;
        panelTitle.textContent = data.title;

        panelBody.innerHTML = '';
        for (let i = 0; i < data.paragraphs.length; i++) {
          const p = document.createElement('p');
          p.textContent = data.paragraphs[i];
          panelBody.appendChild(p);
        }

        panelTags.innerHTML = '';
        for (let i = 0; i < data.tags.length; i++) {
          const li = document.createElement('li');
          const bullet = document.createElement('span');
          bullet.className = 'tag-hex-bullet';
          bullet.setAttribute('aria-hidden', 'true');
          li.appendChild(bullet);
          li.appendChild(document.createTextNode(data.tags[i]));
          panelTags.appendChild(li);
        }

        // 1. Initial State: Positioned exactly over the clicked hex
        const rect = sourceEl.getBoundingClientRect();
        modalPanel.style.transition = 'none';
        modalPanel.style.left = `${rect.left}px`;
        modalPanel.style.top = `${rect.top}px`;
        modalPanel.style.width = `${rect.width}px`;
        modalPanel.style.height = `${rect.height}px`;
        modalPanel.style.clipPath = 'polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)';
        modalPanel.style.borderRadius = '0px';
        modalPanel.style.boxShadow = 'none';
        modalPanel.style.display = 'block';

        modalContent.style.transition = 'none';
        modalContent.style.opacity = '0';
        modalContent.style.transform = 'translateY(22px)';
        modalContent.scrollTop = 0;

        // Force browser layout reflow
        void modalPanel.offsetHeight;

        // 2. Target State: Centred 880x620 card with rounded corners
        const targetW = Math.min(880, window.innerWidth - 36);
        const targetH = Math.min(620, window.innerHeight - 44);
        const targetLeft = Math.round((window.innerWidth - targetW) / 2);
        const targetTop = Math.round((window.innerHeight - targetH) / 2);

        const duration = prefersReducedMotion ? '0.01s' : '0.7s';
        const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';

        modalPanel.style.transition = `
          left ${duration} ${ease},
          top ${duration} ${ease},
          width ${duration} ${ease},
          height ${duration} ${ease},
          clip-path ${duration} ${ease},
          border-radius ${duration} ${ease},
          box-shadow ${duration} ${ease}
        `;

        modalPanel.style.left = `${targetLeft}px`;
        modalPanel.style.top = `${targetTop}px`;
        modalPanel.style.width = `${targetW}px`;
        modalPanel.style.height = `${targetH}px`;
        // 6-point clip-path smoothly morphing into full rectangle
        modalPanel.style.clipPath = 'polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%, 0% 100%, 0% 0%)';
        modalPanel.style.borderRadius = '24px';
        modalPanel.style.boxShadow = '0 35px 85px rgba(0, 0, 0, 0.88), 0 0 60px rgba(240, 168, 58, 0.18), inset 0 1px 0 rgba(255, 240, 200, 0.25)';

        // 3. Content Fades Up After 0.35s
        setTimeout(() => {
          if (!isModalOpen) return;
          const contentDuration = prefersReducedMotion ? '0.01s' : '0.42s';
          modalContent.style.transition = `opacity ${contentDuration} ease, transform ${contentDuration} cubic-bezier(0.16, 1, 0.3, 1)`;
          modalContent.style.opacity = '1';
          modalContent.style.transform = 'translateY(0)';
          modalCloseBtn.focus();
        }, prefersReducedMotion ? 10 : 350);
      }

      /* Shrink panel back into its cell and restore the comb */
      function closeModal() {
        if (!isModalOpen || !activeHexEl) return;

        // Content quick fade-out
        const contentDuration = prefersReducedMotion ? '0.01s' : '0.2s';
        modalContent.style.transition = `opacity ${contentDuration} ease, transform ${contentDuration} ease`;
        modalContent.style.opacity = '0';
        modalContent.style.transform = 'translateY(14px)';

        const rect = activeHexEl.getBoundingClientRect();
        const duration = prefersReducedMotion ? '0.01s' : '0.6s';
        const ease = 'cubic-bezier(0.2, 0.8, 0.2, 1)';

        modalPanel.style.transition = `
          left ${duration} ${ease},
          top ${duration} ${ease},
          width ${duration} ${ease},
          height ${duration} ${ease},
          clip-path ${duration} ${ease},
          border-radius ${duration} ${ease},
          box-shadow ${duration} ${ease}
        `;

        modalPanel.style.left = `${rect.left}px`;
        modalPanel.style.top = `${rect.top}px`;
        modalPanel.style.width = `${rect.width}px`;
        modalPanel.style.height = `${rect.height}px`;
        modalPanel.style.clipPath = 'polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)';
        modalPanel.style.borderRadius = '0px';
        modalPanel.style.boxShadow = 'none';

        combScene.classList.remove('is-dimmed');
        combHint.classList.remove('is-hidden');

        setTimeout(() => {
          modalPanel.style.display = 'none';
          if (activeHexEl) {
            activeHexEl.classList.remove('is-active-source');
            activeHexEl.focus();
            activeHexEl = null;
          }
          isModalOpen = false;
          lastInputTime = performance.now();
        }, prefersReducedMotion ? 20 : 600);
      }

      modalCloseBtn.addEventListener('click', closeModal);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isModalOpen) {
          closeModal();
        }
      });

      // Close when clicking outside the panel
      window.addEventListener('click', (e) => {
        if (isModalOpen && !modalPanel.contains(e.target) && !e.target.closest('.hex-nav')) {
          closeModal();
        }
      });

      /* ==========================================================================
         RESIZE RECALCULATION
         ========================================================================== */
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (isModalOpen) {
            const targetW = Math.min(880, window.innerWidth - 36);
            const targetH = Math.min(620, window.innerHeight - 44);
            modalPanel.style.left = `${Math.round((window.innerWidth - targetW) / 2)}px`;
            modalPanel.style.top = `${Math.round((window.innerHeight - targetH) / 2)}px`;
            modalPanel.style.width = `${targetW}px`;
            modalPanel.style.height = `${targetH}px`;
          }
          buildGrid();
        }, 120);
      }, { passive: true });

      // Initial Build
      buildGrid();
    })();
  </script>
