<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softdesk 4 — Neumorphic Audio Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#e0e5ec;--bg2:#e6ebf2;
  --hi:#ffffff;--sh:#a3b1c6;--sh2:#8d9bb0;
  --txt:#3d4a5c;--txt2:#6b7a90;--txt3:#97a4b8;
  --coral:#ff7a59;--teal:#4fd1c5;
  --green:#5ee36a;--amber:#ffc857;--red:#ff4d4d;
  --mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);
  min-height:100vh;padding:28px 20px 40px;
}
.raised{
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  box-shadow:9px 9px 18px var(--sh),-9px -9px 18px var(--hi);
}
.raised-sm{
  background:linear-gradient(145deg,var(--bg2),var(--bg));
  box-shadow:5px 5px 10px var(--sh),-5px -5px 10px var(--hi);
}
.recessed{
  background:var(--bg);
  box-shadow:inset 6px 6px 12px var(--sh),inset -6px -6px 12px var(--hi);
}
/* ---------- Header ---------- */
header{max-width:1200px;margin:0 auto 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 24px;border-radius:28px}
.badge{display:flex;align-items:center;gap:14px}
.badge h1{font-size:24px;font-weight:700}
.badge p{font-size:12.5px;color:var(--txt2)}
.readout{font-family:var(--mono);font-size:13px;color:var(--txt2);padding:10px 16px;border-radius:14px;letter-spacing:.03em}
.readout b{color:var(--teal);font-weight:600}
/* ---------- Console ---------- */
.console{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr) 1.28fr;gap:22px;align-items:start}
.strip{display:flex;flex-direction:column;gap:14px;padding:20px 14px;border-radius:28px;align-items:center}
.strip h2{font-size:13px;text-transform:uppercase;letter-spacing:.16em;color:var(--txt2)}
.knobs{display:flex;gap:18px;margin-top:4px}
/* ---------- Knob ---------- */
.knob{--v:.5;--min:-135;--max:135;position:relative;width:72px;height:72px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:ns-resize;touch-action:none;user-select:none}
.knob .cap{
  width:72px;height:72px;border-radius:50%;position:relative;cursor:pointer;touch-action:none;
}
.knob .disc{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(145deg,var(--bg2),var(--bg));box-shadow:9px 9px 18px var(--sh),-9px -9px 18px var(--hi);
  transition:box-shadow .15s,transform .15s;
}
.knob .inner{
  position:absolute;inset:16px;border-radius:50%;
  background:linear-gradient(145deg,#f4f7fb,var(--bg));box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi);
}
.knob .ptr{
  position:absolute;left:50%;top:9px;width:4px;height:18px;border-radius:2px;background:var(--coral);
  transform:translateX(-50%) rotate(calc(var(--v)*270deg - 135deg));transform-origin:50% 27px;
}
.knob .arc{
  position:absolute;inset:-5px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 66%,transparent 67%);
  mask:radial-gradient(circle,transparent 62%,#000 63% 66%,transparent 67%);
  background:conic-gradient(from 225deg,var(--teal) calc(var(--v)*270deg),rgba(0,0,0,0) 0);
}
.knob.dragging .disc{box-shadow:inset 6px 6px 12px var(--sh),inset -6px -6px 12px var(--hi);transform:scale(.97)}
.knob .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--txt2)}
.knob .val{font-family:var(--mono);font-size:11px;color:var(--coral)}
/* ---------- Toggle ---------- */
.tgl{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--txt2)}
.switch{width:44px;height:24px;border-radius:99px;position:relative;background:var(--bg);box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi);cursor:pointer;border:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:linear-gradient(145deg,#f4f7fb,var(--bg));box-shadow:3px 3px 6px var(--sh),-2px -2px 5px var(--hi);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.switch[aria-pressed="true"]{background:linear-gradient(145deg,#f8b3a0,#ffd9cc)}
.switch[aria-pressed="true"]::after{transform:translateX(20px);background:var(--coral)}
/* ---------- Fader ---------- */
.fader{--pos:.5;display:flex;flex-direction:column;align-items:center;gap:8px}
.trough{
  width:42px;height:170px;border-radius:24px;position:relative;background:var(--bg);
  box-shadow:inset 5px 5px 10px var(--sh),inset -5px -5px 10px var(--hi);cursor:pointer;touch-action:none;
}
.track{position:absolute;left:50%;top:9px;bottom:9px;width:5px;transform:translateX(-50%);border-radius:3px;background:#c3cddc;overflow:hidden}
.track::before{content:"";position:absolute;left:0;bottom:0;width:100%;height:calc(var(--pos)*100%);background:linear-gradient(0deg,#2fb9ab,var(--teal));border-radius:3px}
.cap{
  position:absolute;left:50%;top:calc((100% - 46px)*var(--pos));width:34px;height:46px;border-radius:10px;
  transform:translate(-50%,0);background:linear-gradient(145deg,var(--bg2),var(--bg));
  box-shadow:5px 5px 10px var(--sh),-5px -5px 10px var(--hi);cursor:grab;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.cap i{width:16px;height:2px;background:var(--txt3);border-radius:2px}
.cap.dragging{box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi);cursor:grabbing}
/* ---------- Meter ---------- */
.meter{display:flex;flex-direction:column;gap:8px;align-items:center}
.meter .tube{
  width:12px;height:88px;border-radius:8px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi);
  display:flex;flex-direction:column-reverse;gap:2px;padding:5px;overflow:hidden;
}
.meter .tube i{flex:1;border-radius:2px;background:#1d2431;transition:background .06s;opacity:.85}
.meter .tube i.onG{background:var(--green)}
.meter .tube i.onA{background:var(--amber)}
.meter .tube i.onR{background:var(--red)}
.db{font-family:var(--mono);font-size:12px;color:var(--coral);padding:6px 12px;border-radius:10px}
/* ---------- Master ---------- */
.master{display:flex;flex-direction:column;gap:16px;padding:20px 18px;border-radius:28px;align-items:center}
.timecode{font-family:var(--mono);font-size:20px;letter-spacing:.06em;color:var(--teal);padding:12px 18px;border-radius:14px;text-shadow:0 0 12px rgba(79,209,197,.35)}
.transport{display:flex;gap:10px}
.tbtn{
  width:52px;height:52px;border-radius:14px;border:none;cursor:pointer;font-size:17px;color:var(--txt2);
  background:linear-gradient(145deg,var(--bg2),var(--bg));box-shadow:5px 5px 10px var(--sh),-5px -5px 10px var(--hi);
  transition:all .12s;
}
.tbtn:active,.tbtn.pressed{box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi)}
.tbtn.play.playing{color:var(--teal);text-shadow:0 0 10px rgba(79,209,197,.6)}
.tbtn.rec.recording{color:var(--red);text-shadow:0 0 10px rgba(255,77,77,.6)}
/* scene buttons */
.scenes{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.scene{
  font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--txt2);
  border:none;padding:10px 16px;border-radius:12px;cursor:pointer;
  background:linear-gradient(145deg,var(--bg2),var(--bg));box-shadow:5px 5px 10px var(--sh),-5px -5px 10px var(--hi);
}
.scene.sel{color:var(--coral);box-shadow:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hi)}
/* ---------- Hint ---------- */
.hint{max-width:1200px;margin:26px auto 0;text-align:center;font-size:13px;color:var(--txt2);line-height:1.8}
kbd{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--sh);border-bottom-width:3px;border-radius:5px;padding:2px 7px;color:var(--txt)}
/* ---------- Responsive ---------- */
@media(min-width:1001px) and (max-width:1180px){.console{grid-template-columns:repeat(2,1fr)}
  .master{grid-column:span 2}}
@media(max-width:1000px){.console{grid-template-columns:1fr 1fr}
  .master{grid-column:span 2}}
@media(max-width:480px){.console{grid-template-columns:1fr}.master{grid-column:span 1}}
@media(min-width:1801px){
  body{font-size:17px}
  .knob{width:88px;height:88px}.knob .cap{width:88px;height:88px}
  .trough{width:52px;height:210px}.cap{width:42px;height:54px}
  .timecode{font-size:26px}
}
@media(prefers-reduced-motion:reduce){
  .strip,.tbtn,.switch,.cap,.scene{transition:none!important}
}
</style>
</head>
<body>

<header class="raised">
  <div class="badge">
    <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="6" y="16" width="8" height="22" rx="3" fill="#4fd1c5"/>
      <rect x="17" y="8" width="8" height="30" rx="3" fill="#ff7a59"/>
      <rect x="28" y="20" width="8" height="18" rx="3" fill="#9ab0e6"/>
      <rect x="39" y="12" width="8" height="26" rx="3" fill="#5ee36a"/>
    </svg>
    <div>
      <h1>Softdesk 4</h1>
      <p>Four-channel soft-UI audio mixer · in-page state only</p>
    </div>
  </div>
  <div class="readout recessed">48 kHz · 128 buf · CPU <b id="cpu">4.2</b>%</div>
</header>

<main class="console" id="console"></main>

<p class="hint">
  Drag a <kbd>knob</kbd> vertically (180px per full turn, <kbd>Shift</kbd> fine) · drag a <kbd>fader</kbd> ·
  wheel / <kbd>↑↓←→</kbd> adjust · <kbd>Home</kbd>/<kbd>End</kbd> extremes · double-click resets ·
  <kbd>Space</kbd> play/pause · click scene buttons to recall fader positions
</p>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var UI={vocal:{name:"Vocal",gain:.62,pan:0,mute:false,solo:false,fader:.62},
          keys:{name:"Keys",gain:.48,pan:.35,mute:false,solo:false,fader:.48},
          bass:{name:"Bass",gain:.55,pan:-.4,mute:false,solo:false,fader:.55},
          drums:{name:"Drums",gain:.5,pan:.05,mute:false,solo:false,fader:.5}};
  var master={gain:.82,width:.5};
  var scenes={Verse:{vocal:.72,keys:.4,bass:.6,drums:.5},Chorus:{vocal:.9,keys:.7,bass:.75,drums:.85},Bridge:{vocal:.45,keys:.8,bass:.35,drums:.3}};
  var playing=false,recording=false,t=0,last=performance.now();
  var cpu=4.2,peak={vocal:0,keys:0,bass:0,drums:0};
  var timecodeEl,soloAny=false;

  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
  function fmt(v){return Math.round(v*100)+"%"}

  // ---- build strips ----
  var consoleEl=document.getElementById("console");
  Object.keys(UI).forEach(function(key){
    var s=UI[key];
    var strip=el("section","strip raised");
    strip.appendChild(el("h2","",s.name));
    var knobs=el("div","knobs");
    knobs.appendChild(knobEl(key,"Gain",{v:s.gain,min:0,max:1,fmt:function(v){return fmt(v)}},"gain"));
    knobs.appendChild(knobEl(key,"Pan",{v:(s.pan+1)/2,min:0,max:1,map:function(v){return v*2-1},fmt:function(v){var p=v*2-1;return p<-.25?"L":p>.25?"R":"C"}},"pan"));
    strip.appendChild(knobs);
    var tg=el("div","",'<button class="switch" role="switch" aria-pressed="false" aria-label="Mute '+s.name+'"></button><span>Mute</span>');
    tg.className="tgl";
    strip.appendChild(tg);
    var tg2=el("div","",'<button class="switch" role="switch" aria-pressed="false" aria-label="Solo '+s.name+'"></button><span>Solo</span>');
    tg2.className="tgl";
    strip.appendChild(tg2);
    strip.appendChild(faderEl(key));
    var m=el("div","meter");
    var tube=el("div","tube");
    for(var i=0;i<14;i++)tube.appendChild(el("i"));
    tube.dataset.meter=key;
    m.appendChild(tube);
    m.appendChild(el("div","db recessed","-∞"));
    m.querySelector(".db").dataset.db=key;
    strip.appendChild(m);
    consoleEl.appendChild(strip);
  });

  // ---- master ----
  var masterEl=el("section","master raised");
  timecodeEl=el("div","timecode recessed","00:00:00.00");
  masterEl.appendChild(timecodeEl);
  var tp=el("div","transport");
  tp.innerHTML='<button class="tbtn" data-t="start" aria-label="Return to start">⏮</button>'+
    '<button class="tbtn" data-t="stop" aria-label="Stop">⏹</button>'+
    '<button class="tbtn play" data-t="play" aria-label="Play / pause">▶</button>'+
    '<button class="tbtn rec" data-t="rec" aria-label="Record">●</button>';
  masterEl.appendChild(tp);
  var mk=el("div","knobs");mk.appendChild(knobEl("master","Width",{v:master.width,min:0,max:1,fmt:function(v){return Math.round(v*100)+"%"}},"width"));
  masterEl.appendChild(mk);
  var mf=el("div","meter");
  var row=el("div","",'<span style="color:var(--txt3);font-size:11px">L</span>');
  var tubeL=el("div","tube");tubeL.style.height="150px";for(var i=0;i<14;i++)tubeL.appendChild(el("i"));tubeL.dataset.meter="L";
  var tubeR=el("div","tube");tubeR.style.height="150px";for(var i=0;i<14;i++)tubeR.appendChild(el("i"));tubeR.dataset.meter="R";
  var mrow=el("div","",'');
  mrow.className="transport";mrow.style.gap="10px";mrow.style.alignItems="center";
  mrow.appendChild(el("span","",'<span style="color:var(--txt3);font-size:11px">L</span>'));
  mrow.appendChild(tubeL);
  mrow.appendChild(el("span","",'<span style="color:var(--txt3);font-size:11px">R</span>'));
  mrow.appendChild(tubeR);
  masterEl.appendChild(mrow);
  masterEl.appendChild(el("div","db recessed","Master"));
  var sc=el("div","scenes");
  Object.keys(scenes).forEach(function(n){
    var b=el("button","scene",n);b.dataset.scene=n;sc.appendChild(b);
  });
  masterEl.appendChild(sc);
  consoleEl.appendChild(masterEl);

  // ---- knob/fader factories ----
  function knobEl(ch,label,cfg,kind){
    var k=el("div","knob");
    k.style.setProperty("--v",cfg.v);
    k.innerHTML='<div class="arc"></div><div class="cap"><div class="disc"></div><div class="inner"></div><div class="ptr"></div></div><span class="lbl">'+label+'</span><span class="val">'+(cfg.fmt?cfg.fmt(cfg.v):"")+'</span>';
    var valEl=k.querySelector(".val");
    var cap=k.querySelector(".cap");
    var drag=null;
    function apply(v,noEv){
      v=Math.max(0,Math.min(1,v));
      k.style.setProperty("--v",v);
      valEl.textContent=cfg.fmt?v===0&&cfg.min?cfg.fmt(0):cfg.fmt(v):"";
      if(ch==="master"&&kind==="width"){master.width=v;return}
      if(!UI[ch])return;
      var st=UI[ch];
      if(kind==="gain")st.gain=v;else st.pan=(cfg.map?cfg.map(v):v);
    }
    cap.addEventListener("pointerdown",function(e){
      drag={y:e.clientY,v:parseFloat(k.style.getPropertyValue("--v"))||cfg.v,shift:false};
      cap.setPointerCapture(e.pointerId);k.classList.add("dragging");
    });
    cap.addEventListener("pointermove",function(e){
      if(!drag)return;
      var fine=e.shiftKey?8:1;
      var nv=drag.v-(e.clientY-drag.y)/180*fine;
      apply(nv);
    });
    cap.addEventListener("pointerup",function(){drag=null;k.classList.remove("dragging")});
    cap.addEventListener("wheel",function(e){e.preventDefault();apply((parseFloat(k.style.getPropertyValue("--v"))||cfg.v)-e.deltaY/400*((k.classList.contains("fine"))?8:2560));apply((parseFloat(k.style.getPropertyValue("--v"))||cfg.v)+(e.deltaY<0?.03:-.03))});
    cap.addEventListener("wheel",function(e){e.preventDefault();var f=k.classList.contains("fine");
      apply((parseFloat(k.style.getPropertyValue("--v"))||cfg.v)+(e.deltaY<0?0.03*cfg.v:0)/(1));});
    cap.addEventListener("dblclick",function(){apply(cfg.def!=null?cfg.def:.5)});
    k.fine=cap;
    return k;
  }

  function faderEl(ch){
    var f=el("div","fader");
    f.style.setProperty("--pos",UI[ch].fader);
    var trough=el("div","trough");
    trough.innerHTML='<div class="track"></div><div class="cap"><i></i><i></i><i></i></div>';
    var cap=trough.querySelector(".cap");
    var drag=null;
    function apply(pos){
      pos=Math.max(0,Math.min(1,pos));
      f.style.setProperty("--pos",pos);
      UI[ch].fader=pos;
    }
    trough.addEventListener("pointerdown",function(e){
      drag=true;trough.setPointerCapture(e.pointerId);cap.classList.add("dragging");
      var r=trough.getBoundingClientRect();apply(1-(e.clientY-r.top)/r.height);
    });
    trough.addEventListener("pointermove",function(e){
      if(!drag)return;
      var r=trough.getBoundingClientRect();apply(1-(e.clientY-r.top)/r.height);
    });
    trough.addEventListener("pointerup",function(){drag=false;cap.classList.remove("dragging")});
    trough.addEventListener("dblclick",function(){apply(.65)});
    return f;
  }

  // toggles
  document.querySelectorAll(".strip").forEach(function(strip){
    var name=strip.querySelector("h2").textContent;
    var toggles=strip.querySelectorAll(".switch");
    toggles[0].addEventListener("click",function(){var on=this.getAttribute("aria-pressed")==="true"?"false":"true";this.setAttribute("aria-pressed",on);UI[name].mute=on==="true"});
    toggles[1].addEventListener("click",function(){var on=this.getAttribute("aria-pressed")==="true"?"false":"true";this.setAttribute("aria-pressed",on);UI[name].solo=on==="true";soloAny=Object.keys(UI).some(function(k2){return UI[k2].solo})});
  });

  // transport
  var tbtn=document.querySelectorAll(".tbtn");
  var playBtn=document.querySelector(".tbtn.play"),recBtn=document.querySelector(".tbtn.rec");
  tbtn.forEach(function(b){
    b.addEventListener("click",function(){
      var k=this.dataset.t;
      if(k==="start"){t=0}
      if(k==="stop"){playing=false;playBtn.classList.remove("playing");playBtn.textContent="▶"}
      if(k==="play"){playing=!playing;playBtn.classList.toggle("playing",playing);playBtn.textContent=playing?"❚❚":"▶"}
      if(k==="rec"&&playing){recording=!recording;recBtn.classList.toggle("recording",recording)}
    });
  });
  document.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();playBtn.click()}
  });

  // scenes animate faders over 600ms
  var sceneBtns=document.querySelectorAll(".scene");
  sceneBtns.forEach(function(b){
    b.addEventListener("click",function(){
      sceneBtns.forEach(function(x){x.classList.remove("sel")});
      b.classList.add("sel");
      var sc=scenes[b.dataset.scene];
      var anim=[];
      Object.keys(sc).forEach(function(ch2){anim.push({ch:ch2,from:UI[ch2].fader,to:sc[ch2]})});
      var t0=performance.now(),dur=RM?1:600;
      (function step(now){
        var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
        anim.forEach(function(a){UI[a.ch].fader=a.from+(a.to-a.from)*e});
        Object.keys(UI).forEach(function(ch2){
          var f=document.querySelector('.strip:has(h2)'); 
        });
        if(p<1)requestAnimationFrame(step);
      })(t0);
    });
  });

  // ---- rAF engine ----
  function chanSignal(ch,t){
    var s=UI[ch],i=Object.keys(UI).indexOf(ch);
    var env=0.55+0.3*Math.sin(t*0.7+i*1.7);
    var beat=0.22*Math.pow(Math.max(0,Math.sin(t*2.1+i*0.9)),6);
    var jit=(Math.random()-0.5)*0.16;
    var v=Math.max(0,Math.min(1,(env+beat+jit)*s.gain));
    return v;
  }
  function meterVal(ch){return peak[ch]}
  function drawMeters(){
    Object.keys(UI).forEach(function(ch){
      var tube=document.querySelector('[data-meter="'+ch+'"]');
      var db=document.querySelector('[data-db="'+ch+'"]');
      if(!tube)return;
      var lvl=peak[ch];
      var segs=tube.children.length;
      for(var i=0;i<segs;i++){
        var frac=(i+1)/segs;
        var on=lvl>=frac-0.03;
        var lit=tube.children[segs-1-i];
        lit.className="";
        if(on){lit.className=frac>0.86?"onR":frac>0.62?"onA":"onG"}
      }
      db.textContent=(lvl<=0.01?"-∞":(-60+Math.round(lvl*58))+" dB");
    });
    var L=(master.gain*(peak.vocal+peak.keys)*.5),R=(master.gain*(peak.bass+peak.drums)*.5);
    segsDraw(document.querySelector('[data-meter="L"]'),L);
    segsDraw(document.querySelector('[data-meter="R"]'),R);
  }
  function segsDraw(tube,lvl){
    if(!tube)return;
    var segs=tube.children.length;
    for(var i=0;i<segs;i++){
      var frac=(i+1)/segs;
      var lit=tube.children[segs-1-i];
      lit.className="";
      if(lvl>=frac-0.03){lit.className=frac>0.86?"onR":frac>0.62?"onA":"onG"}
    }
  }
  function loop(now){
    var dt=Math.min(0.1,(now-last)/1000);last=now;
    if(playing){
      t+=dt;
      Object.keys(UI).forEach(function(ch){
        var s=UI[ch];
        var audible=!s.mute&&(!soloAny||s.solo);
        peak[ch]=audible?chanSignal(ch,t):0;
      });
      cpu=Math.min(9.8,Math.max(1.6,cpu+(Math.random()-0.42)*0.9));
      var ss=(((t/60)|0)%60),mm=((t/60/60)|0),ff=(t*25|0)%25,hh=((t/3600)|0)||0;
      timecodeEl.textContent=(hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss+"."+(ff<10?"0":"")+ff;
    }else{
      Object.keys(UI).forEach(function(ch){peak[ch]=0});
      cpu=Math.max(0.4,cpu-0.35*dt*60);
    }
    document.getElementById("cpu").textContent=cpu.toFixed(1);
    // decay peaks
    Object.keys(UI).forEach(function(ch){peak[ch]=Math.max(0,peak[ch]-0.018)});
    drawMeters();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
