<title>The Elements arranged — 118</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --tile-c:#8fa3b8;--temp:293;
}
body{
  background:radial-gradient(70% 60% at 50% 0%,#222a3b,transparent 70%),#1b2130;
  color:#dfe4ee;font-family:ui-sans-serif,system-ui,sans-serif;min-height:100vh;
}
.wrap{max-width:1560px;margin:0 auto;padding:34px 26px 70px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:8px}
header h1{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-weight:400;font-size:clamp(26px,3.4vw,44px)}
header h1 em{font-style:italic;color:#8b95a8}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{
  background:rgba(30,37,52,.8);border:1px solid rgba(255,255,255,.12);border-radius:99px;color:#dfe4ee;
  padding:10px 16px 10px 38px;font-family:inherit;font-size:13px;outline:none;width:210px;
}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:rgba(255,255,255,.35)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.lchip{font-size:10.5px;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.12);cursor:pointer;letter-spacing:.04em;transition:all .2s;color:rgba(223,228,238,.8)}
.lchip:hover{transform:translateY(-2px)}
.lchip.pin{outline:2px solid rgba(255,255,255,.5)}
.lchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.seg2{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.seg2 button{border:none;background:none;color:rgba(223,228,238,.6);font-family:inherit;font-size:11px;
  padding:9px 16px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
.seg2 button.on{background:rgba(255,255,255,.12);color:#fff}
.temprow{display:flex;align-items:center;gap:10px;font-size:11px;color:rgba(223,228,238,.7)}
.temprow input{appearance:none;-webkit-appearance:none;width:150px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,#5aa7e0,#f0b46a);outline:none}
.temprow input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
.temprow b{font-family:ui-monospace,monospace;color:#fff;font-weight:400}
.footcount{font-size:11px;color:#8b95a8;margin:4px 0 14px;font-family:ui-monospace,monospace}
/* table */
.swrap{overflow-x:auto;padding-bottom:24px}
table.grid-t{display:grid;grid-template-columns:repeat(18,minmax(46px,1fr));gap:4px;min-width:920px;position:relative}
.tile{
  aspect-ratio:1.05/1;border-radius:8px;border:1px solid color-mix(in srgb,var(--tile-c) 28%,transparent);
  background:color-mix(in srgb,var(--tile-c) 16%,rgba(30,37,52,.75));
  color:#dfe4ee;cursor:pointer;position:relative;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:left;font-family:inherit;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,background .3s;
  border-top:2px solid var(--tile-c);margin-top:1px;
}
.tile:hover,.tile:focus,.tile.sel{transform:translateY(-5px) scale(1.07);z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.5);outline:none}
.tile.dim{opacity:.16}
.tile .an{font-size:9px;color:rgba(223,228,238,.55);font-variant-numeric:tabular-nums}
.tile .sym{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-size:19px;line-height:1}
.tile .nm{font-size:7.5px;color:rgba(223,228,238,.6);white-space:nowrap;overflow:hidden}
.tile.spot{grid-column:span 2}
.tile.placeholder{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.14);color:#8b95a8;
  display:grid;place-items:center;font-size:11px;cursor:default;box-shadow:none!important}
/* state recolour */
body.state-mode .tile{background:color-mix(in srgb,var(--tile-c) 55%,rgba(30,37,52,.7));border-top-color:var(--tile-c)}
/* detail card */
.dcard{
  position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:20;width:calc(7*46px + 6*4px + 60px);
  max-width:520px;min-width:320px;
  background:rgba(30,37,52,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.6);display:none;
}
.dcard.show{display:grid;grid-template-columns:150px 1fr;gap:18px}
.dcard .bohr{width:150px;height:150px}
.dcard .inf h3{font-family:Georgia,serif;font-size:30px;font-weight:400}
.dcard .inf .sub{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#8b95a8;margin:4px 0 10px}
.dcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
.dcard dt{color:#8b95a8}
.dcard dd{text-align:right;font-variant-numeric:tabular-nums}
.dcard .state{display:inline-flex;align-items:center;gap:6px;font-size:11px;margin-top:8px}
.dcard .state i{width:9px;height:9px;border-radius:50%;background:var(--dotc,#8fa3b8);box-shadow:0 0 8px var(--dotc,#8fa3b8)}
@media(max-width:900px){
  .dcard{position:fixed;left:0;right:0;top:auto;bottom:0;transform:none;width:auto;border-radius:16px 16px 0 0;
    max-height:60vh;overflow-y:auto}
}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

  function pos(n){
    if(n<=2)return{row:1,col:n};
    if(n<=10)return{row:2,col:n-2};
    if(n<=18)return{row:3,col:n-10};
    if(n<=36)return{row:4,col:n-18};

  function distribute(n){

  // mode
  var modeSeg=document.getElementById("modeSeg");
  modeSeg.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      modeSeg.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
      MODE=b.dataset.m;
      document.getElementById("tempRow").style.display=MODE==="state"?"flex":"none";
      document.body.classList.toggle("state-mode",MODE==="state");
      document.getElementById("tempR").disabled=MODE!=="state";
      recolor();
    });
  });
  document.getElementById("tempR").addEventListener("input",function(){
    tempK=+this.value;
    document.getElementById("tempV").textContent=tempK+" K";
    recolor();
  });
  function recolor(){
    document.querySelectorAll(".tile[data-n]").forEach(function(t){
      var n=+t.dataset.n;
      var e=E.find(function(x){return x[0]===n});
      if(MODE==="state"){
        var s=state(e,tempK);
        var col=s==="s"?"#8fa3b8":s==="l"?"#5aa7e0":"#f0b46a";
        t.style.setProperty("--tile-c",col);
        t.style.borderTopColor=col;
      }else{
        t.style.setProperty("--tile-c",CAT_COL[e[3]]||"#6f7580");
        t.style.borderTopColor="";
      }
    });
  }
  build();
  document.body.classList.add("state-mode");
  document.getElementById("modeSeg").querySelector('[data-m="state"]').classList.add("on");
  document.getElementById("modeSeg").querySelector('[data-m="cat"]').classList.remove("on");
  var tempRow=document.getElementById("tempRow");tempRow.style.display="flex";
  MODE="state";
  recolor();
  showCard(79,null);
})();
</script>
</body>
</html>
