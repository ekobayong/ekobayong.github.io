<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Small Joys — Ten Microinteractions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#17172b;--mute:#6f6f8a;--indigo:#4f46e5;--indigo2:#6366f1;--soft:#e0e7ff;--green:#16a34a;--red:#e11d48}
body{
  background:radial-gradient(40% 30% at 0% 0%,rgba(99,102,241,.12),transparent 60%),
  radial-gradient(36% 26% at 100% 0%,rgba(236,72,153,.07),transparent 60%),#f6f6fb;
  min-height:100vh;color:var(--ink);font-family:ui-sans-serif,system-ui,'Helvetica Neue',sans-serif;
}
.wrap{max-width:1180px;margin:0 auto;padding:60px 26px 90px}
h1{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-weight:400;font-size:clamp(34px,5vw,56px);text-align:center;letter-spacing:-.01em}
h1 em{font-style:italic}
.sub{text-align:center;color:var(--mute);font-size:14.5px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:46px}
.card{
  background:#fff;border:1px solid #e7e7f2;border-radius:22px;padding:26px 22px;
  box-shadow:0 6px 20px rgba(23,23,43,.05),0 20px 44px rgba(23,23,43,.04);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(23,23,43,.08),0 26px 54px rgba(99,102,241,.1)}
.stage{height:150px;display:grid;place-items:center;position:relative;overflow:hidden}
.caption{padding-top:16px;margin-top:16px;border-top:1px dashed #e0e0ec;display:flex;align-items:baseline;gap:10px}
.caption .idx{font-family:ui-monospace,monospace;font-size:10px;color:var(--indigo2);letter-spacing:.06em}
.caption b{font-size:14.5px}
.caption p{color:var(--mute);font-size:11.5px;margin-top:2px;width:100%}
footer{text-align:center;color:var(--mute);font-family:ui-monospace,monospace;font-size:11px;margin-top:50px;letter-spacing:.04em}
/* 01 magnetic */
.magbtn{
  position:relative;background:var(--indigo);color:#fff;border:none;border-radius:99px;padding:15px 34px;
  font:inherit;font-size:14px;cursor:pointer;will-change:transform;
}
.magbtn .lab{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
/* 02 liquid toggle */
.ltog{width:78px;height:42px;border-radius:99px;background:#e2e2ee;position:relative;cursor:pointer;border:none;transition:background .3s;padding:0}
.ltog .kn{position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(23,23,43,.24);animation:knobidle 0s}
.ltog[aria-pressed="true"]{background:var(--soft)}
.ltog[aria-pressed="true"] .kn{animation:knobgo .55s cubic-bezier(.34,1.56,.64,1) forwards;background:var(--indigo)}
@keyframes knobgo{
  0%{left:4px}
  35%{left:20px;transform:scaleX(1.55) scaleY(.82)}
  70%{left:42px;transform:scale(1)}
  100%{left:40px}
}
.ltog:not([aria-pressed="true"]) .kn{animation:knobbk .4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes knobbk{0%{left:40px}100%{left:4px}}
.onlbl{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9px;letter-spacing:.08em;color:var(--indigo);
  opacity:0;transition:opacity .3s .15s}
.ltog[aria-pressed="true"] .onlbl{opacity:1}
/* 03 checkbox */
.cbx{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:15px}
.cbx .box{width:28px;height:28px;border-radius:8px;border:2px solid #c9c9dc;position:relative;transition:all .25s;
  display:grid;place-items:center;flex:none;background:#fff}
.cbx .box svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24}
.cbx input{position:absolute;opacity:0}
.cbx input:checked~.box{background:var(--indigo);border-color:var(--indigo);transform:rotate(-4deg)}
.cbx input:checked~.box svg{stroke-dashoffset:0;transition:stroke-dashoffset .3s ease .08s}
.cbx input:checked~.lab{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--indigo);text-decoration-thickness:2px}
.cbx .lab{transition:color .3s}
/* 04 like */
.likebtn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute)}
.likebtn svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.8;transition:all .25s}
.likebtn.liked svg{fill:var(--red);stroke:var(--red);transform:scale(1.18)}
.likebtn .cnt{font-family:ui-monospace,monospace;font-size:13px;color:var(--mute)}
.part{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none}
/* 05 elastic slider */
.els{width:230px;position:relative;height:40px}
.elTrack{position:absolute;left:0;right:0;top:50%;height:6px;border-radius:99px;background:#e4e4f0;transform:translateY(-50%)}
.elFill{position:absolute;left:0;top:50%;height:6px;width:0;border-radius:99px;background:var(--indigo);transform:translateY(-50%)}
.elThumb{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--indigo);
  transform:translate(-50%,-50%);cursor:grab;box-shadow:0 3px 9px rgba(23,23,43,.25)}
.eltip{position:absolute;top:-26px;left:0;background:var(--ink);color:#fff;font-family:ui-monospace,monospace;font-size:10.5px;
  padding:3px 8px;border-radius:6px;opacity:0;transform:scale(.7);pointer-events:none}
.elThumb:active .eltip,.els.showtip .eltip{opacity:1;transform:scale(1)}
/* 06 tabs */
.tabs{display:flex;position:relative;background:#ececf6;border-radius:12px;padding:4px;width:230px}
.tind{position:absolute;top:4px;bottom:4px;border-radius:9px;background:#fff;box-shadow:0 2px 8px rgba(23,23,43,.16);transition:left .3s cubic-bezier(.34,1.56,.64,1),width .3s}
.tab{border:none;background:none;font:inherit;font-size:12.5px;color:var(--mute);padding:10px 18px;position:relative;z-index:1;cursor:pointer}
.tab.on{color:var(--indigo);font-weight:600}
/* 07 cursor lit card */
.lit{width:210px;height:110px;border-radius:16px;background:#fff;border:1px solid #e7e7f2;position:relative;overflow:hidden;cursor:pointer}
.lit::before{content:"";position:absolute;inset:0;border-radius:16px;padding:1.5px;background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%),var(--indigo),transparent 70%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s}
.lit:hover::before{opacity:1}
.lit::after{content:"";position:absolute;inset:0;border-radius:16px;background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%),rgba(99,102,241,.14),transparent 70%);opacity:0;transition:opacity .3s}
.lit:hover::after{opacity:1}
.lit .lc{position:absolute;left:18px;bottom:16px}
.lit .lc b{font-size:13px;display:block}
.lit .lc span{font-size:11px;color:var(--mute);display:block;margin-top:2px;transform:translateY(4px);opacity:0;transition:all .3s}
.lit .arrow{position:absolute;right:16px;top:16px;color:var(--indigo);transform:translateX(-6px);opacity:0;transition:all .3s}
.lit:hover .lc span{transform:none;opacity:1}
.lit:hover .arrow{transform:none;opacity:1}
/* 08 float label */
.flwrap{width:230px;position:relative}
.flwrap input{width:100%;border:1.5px solid #d4d4e2;border-radius:12px;padding:20px 16px 10px;font:inherit;font-size:14px;outline:none;transition:border-color .3s}
.flwrap label{position:absolute;left:16px;top:15px;color:var(--mute);font-size:13.5px;pointer-events:none;transition:all .25s}
.flwrap input:focus,.flwrap.filled input{border-color:var(--indigo)}
.flwrap input:focus+label,.flwrap.filled label{top:6px;font-size:10px;color:var(--indigo);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.flwrap.bad input{border-color:var(--red);animation:shake .48s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.flwrap.good input{border-color:var(--green)}
.flwrap .ok{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);width:0;opacity:0;transition:all .3s;
}
.flwrap.good .ok{width:22px;opacity:1}
.flwrap.good .ok svg{stroke:var(--green)}
/* 09 segmented spring */
.seg9{display:flex;background:#ececf6;border-radius:12px;padding:4px;position:relative}
.seg9 .pill9{position:absolute;top:4px;bottom:4px;border-radius:9px;background:#fff;box-shadow:0 2px 8px rgba(23,23,43,.16);
  left:4px;transition:left .35s cubic-bezier(.34,1.56,.64,1),width .35s}
.seg9 button{border:none;background:none;font:inherit;font-size:12.5px;padding:10px 16px;position:relative;z-index:1;cursor:pointer;color:var(--mute)}
.seg9 button.on{color:var(--indigo);font-weight:600}
/* 10 download */
.dlbtn{width:190px;height:52px;border-radius:99px;border:none;background:var(--indigo);color:#fff;font:inherit;font-size:14px;
  cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .5s cubic-bezier(.4,0,.2,1)}
.dlbtn .ring{position:absolute;width:36px;height:36px;opacity:0}
.dlbtn.busy{width:52px;border-radius:50%;padding:0}
.dlbtn.busy .ring{opacity:1;animation:ringrot 2.2s ease-out forwards}
@keyframes ringrot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.dlbtn.done{width:52px;border-radius:50%;background:var(--green);padding:0}
.dlbtn.done .ring{opacity:0}
.dlbtn.done svg.icon{display:block}
.dlbtn svg.icon{display:none}
@media(prefers-reduced-motion:reduce){
  .card,.magbtn .lab,.ltog .kn,.cbx .box,.likebtn svg,.tind,.lit,.flwrap label,.seg9 .pill9,.dlbtn{transition:none!important}
  .part,.ltog[aria-pressed="true"] .kn{animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Small joys, <em>ten of them.</em></h1>
  <p class="sub">Each card hides one handcrafted moment — the kind browsers forget to be good at.</p>
  <div class="grid" id="grid"></div>
</div>
<footer>springs k 160–220 · damping 16–22 · easing cubic-bezier(.34,1.56,.64,1) — reduced-motion snaps everything to its target</footer>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // spring integrator
  function makeSpring(k,d){
    return{x:0,v:0,target:0,k:k,d:d,acc:0.016,
      set(t){this.target=t},
      step(){var a=(this.target-this.x)*this.k-this.v*this.d;this.v+=a*this.acc;this.x+=this.v*this.acc;return this.x}};
  }
  function card(idx,name,desc,stageHtml,init){
    var c=document.createElement("div");
    c.className="card";
    c.innerHTML='<div class="stage">'+stageHtml+'</div><div class="caption"><span class="idx">'+String(idx).padStart(2,"0")+'</span><div><b>'+name+'</b><p>'+desc+'</p></div></div>';
    document.getElementById("grid").appendChild(c);
    if(init)init(c.querySelector(".stage"));
    return c;
  }
  // 01 magnetic button
  card(1,"Magnetic button","The body is pulled toward your cursor by two independent springs; the label drifts 35% further.",
    '<button class="magbtn" id="magBtn"><span class="lab">Hover near me</span></button>',
    function(stage){
      var b=stage.querySelector("#magBtn");
      var sx=makeSpring(180,18),sy=makeSpring(180,18);
      var lx=makeSpring(160,16),ly=makeSpring(160,16);
      stage.addEventListener("pointermove",function(e){
        var r=b.getBoundingClientRect(),sr=stage.getBoundingClientRect();
        var cx=r.left+r.width/2,cy=r.top+r.height/2;
        var dx=e.clientX-cx,dy=e.clientY-cy;
        if(Math.hypot(dx,dy)<140){
          sx.set(dx*0.35);sy.set(dy*0.35);lx.set(dx*0.35*1.35);ly.set(dy*0.35*1.35);
        }else{
          sx.set(0);sy.set(0);lx.set(0);ly.set(0);
        }
      });
      (function magLoop(){
        if(RM){b.style.transform="";return}
        b.style.transform="translate("+sx.step()+"px,"+sy.step()+"px)";
        var lab=b.querySelector(".lab");
        lab.style.transform="translate("+lx.step()*0.35+"px,"+ly.step()*0.35+"px)";
        requestAnimationFrame(magLoop);
      })();
    });
  // 02 liquid toggle
  card(2,"Liquid toggle","The knob stretches mid-travel — 1.55 wide, 0.82 tall — overshoots and settles, like a drop of mercury.",
    '<button class="ltog" id="ltog" aria-pressed="false"><span class="kn"></span><span class="onlbl">ON</span></button>',
    function(stage){
      var t=stage.querySelector("#ltog");
      t.style.position="relative";
      t.addEventListener("click",function(){
        var on=this.getAttribute("aria-pressed")==="true"?"false":"true";
        this.setAttribute("aria-pressed",on);
      });
    });
  // 03 checkbox
  card(3,"Checkbox with a drawn tick","The tick strokes in 80 ms after the box tilts −4°; the label remembers what you asked.",
    '<label class="cbx"><input type="checkbox"><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span><span class="lab">Send me the newsletter</span></label><input type="text" style="display:none">',
    null);
  // 04 like
  card(4,"Like with a burst","Twelve particles fly on their own vectors; the heart fills red, the counter keeps the score.",
    '<div style="position:relative"><button class="likebtn" id="likeBtn"><svg viewBox="0 0 24 24"><path d="M12 21C7 16 3 12.5 3 8.8 3 6 5 4 7.7 4c1.8 0 3.4 1 4.3 2.6C12.9 5 14.5 4 16.3 4 19 4 21 6 21 8.8c0 3.7-4 7.2-9 12.2z"/></svg><span class="cnt">124</span></button></div>',
    function(stage){
      var b=stage.querySelector("#likeBtn"),liked=false;
      var cols=["#e11d48","#f97316","#facc15","#6366f1","#22c55e","#f472b6"];
      b.addEventListener("click",function(){
        liked=!liked;
        b.classList.toggle("liked",liked);
        var cnt=+b.querySelector(".cnt").textContent;
        if(liked)cnt++;
        b.querySelector(".cnt").textContent=cnt;
        stage.querySelectorAll(".part").forEach(function(p){p.remove()});
        for(var i=0;i<12;i++){
          var p=document.createElement("span");
          p.className="part";
          var a=Math.random()*Math.PI*2,d=36+Math.random()*40;
          p.style.background=cols[i%cols.length];
          p.style.left="50%";p.style.top="52%";
          p.style.transform="translate(-50%,-50%)";
          p.style.marginLeft=Math.cos(a)*d+"px";
          p.style.marginTop=Math.sin(a)*d+"px";
          p.style.opacity="0";
          var anim=p.animate([
            {transform:"translate(-50%,-50%) scale(1)",opacity:1},
            {transform:"translate(calc(-50% + "+Math.cos(a)*d+"px), calc(-50% + "+Math.sin(a)*d+"px)) scale(0)",opacity:0}
          ],{duration:700+Math.random()*300,easing:"cubic-bezier(.34,1.56,.64,1)"});
          stage.appendChild(p);
          anim.onfinish=function(){this.effect.target.remove()};
        }
      });
    });
  // 05 elastic slider
  card(5,"Elastic slider","The thumb rides a spring and squashes with velocity; a dark tooltip pops up with overshoot.",
    '<div class="els" id="els"><div class="elFill"></div><div class="elThumb"><div class="eltip">50</div></div><div class="elTrack"></div></div>',
    function(stage){
      var els=stage.querySelector("#els"),thumb=els.querySelector(".elThumb"),fill=els.querySelector(".elFill"),tip=els.querySelector(".eltip");
      var spring=makeSpring(210,20);spring.set(0);
      var drag=false,val=50,showTip=false;
      function render(){
        var x=spring.step();
        var frac=Math.max(0,Math.min(230,x));
        thumb.style.left=frac+"px";
        fill.style.width=frac+"px";
        val=Math.round(frac/230*100);
        tip.textContent=val;
        var vel=spring.v/230*100;
        var sq=Math.max(0.7,Math.min(1.25,1-Math.abs(vel)*0.02));
        thumb.style.transform="translate(-50%,-50%) scale("+(vel>0?sq:1)+","+(vel>0?1:sq)+")";
        if(!drag&&Math.abs(spring.v)<0.5&&frac<=230&&frac>=0){}
        requestAnimationFrame(render);
      }
      thumb.addEventListener("pointerdown",function(e){
        drag=true;els.classList.add("showtip");
        var r=els.getBoundingClientRect();
        spring.set(Math.max(0,Math.min(230,e.clientX-r.left)));
        thumb.setPointerCapture(e.pointerId);
      });
      thumb.addEventListener("pointermove",function(e){
        if(!drag)return;
        var r=els.getBoundingClientRect();
        spring.set(Math.max(0,Math.min(230,e.clientX-r.left)));
      });
      window.addEventListener("pointerup",function(){drag=false});
      els.addEventListener("pointerdown",function(e){
        var r=els.getBoundingClientRect();
        spring.set(Math.max(0,Math.min(230,e.clientX-r.left)));
      });
      window.addEventListener("keydown",function(e){
        if(e.key==="ArrowRight"){spring.set(Math.min(230,spring.target+5))}
        if(e.key==="ArrowLeft"){spring.set(Math.max(0,spring.target-5))}
      });
      render();
    });
  // 06 ripple tabs
  card(6,"Ripple tabs","A 2 px indicator springs between tabs; a translucent ripple expands from the exact click point.",
    '<div class="tabs" id="tabs"><div class="tind"></div><button class="tab on">First</button><button class="tab">Second</button><button class="tab">Third</button></div>',
    function(stage){
      var tabs=stage.querySelector("#tabs"),ind=tabs.querySelector(".tind");
      function moveInd(btn){
        ind.style.left=btn.offsetLeft+"px";
        ind.style.width=btn.offsetWidth+"px";
      }
      moveInd(tabs.querySelector(".tab.on"));
      tabs.querySelectorAll(".tab").forEach(function(b){
        b.addEventListener("click",function(e){
          tabs.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});
          b.classList.add("on");
          moveInd(b);
          var r=b.getBoundingClientRect(),tr=tabs.getBoundingClientRect();
          var ripple=document.createElement("span");
          ripple.style.cssText="position:absolute;border-radius:50%;background:rgba(99,102,241,.18);pointer-events:none;left:"+(e.clientX-tr.left)+"px;top:"+(e.clientY-tr.top)+"px;width:10px;height:10px;transform:translate(-50%,-50%) scale(0)";
          tabs.appendChild(ripple);
          var anim=ripple.animate([
            {transform:"translate(-50%,-50%) scale(0)",opacity:1},
            {transform:"translate(-50%,-50%) scale(14)",opacity:0}
          ],{duration:500,easing:"cubic-bezier(.34,1.56,.64,1)"});
          anim.onfinish=function(){ripple.remove()};
        });
      });
    });
  // 07 cursor lit card
  card(7,"Cursor-lit card","A masked radial border and an inner glow follow your pointer; the copy rises, the arrow slides in.",
    '<div class="lit" id="lit"><span class="arrow">→</span><div class="lc"><b>Open the field notes</b><span>they are longer than this card</span></div></div>',
    function(stage){
      var lit=stage.querySelector("#lit");
      lit.addEventListener("pointermove",function(e){
        var r=lit.getBoundingClientRect();
        lit.style.setProperty("--mx",(e.clientX-r.left)+"px");
        lit.style.setProperty("--my",(e.clientY-r.top)+"px");
      });
    });
  // 08 float label
  card(8,"Floating label","The label shrinks to 74% on focus; Enter validates — failures shake, successes draw a check.",
    '<div class="flwrap" id="flwrap"><input id="flin" type="email" placeholder=" "><label for="flin">Email address</label><span class="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg></span></div>',
    function(stage){
      var w=stage.querySelector("#flwrap"),inp=stage.querySelector("#flin");
      function upd(){
        if(inp.value)w.classList.add("filled");else w.classList.remove("filled");
      }
      inp.addEventListener("input",upd);
      inp.addEventListener("keydown",function(e){
        if(e.key==="Enter"){
          e.preventDefault();
          var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(inp.value);
          w.classList.remove("bad","good");
          if(!ok){
            w.classList.add("bad");
            setTimeout(function(){w.classList.remove("bad")},600);
          }else{
            w.classList.add("good");
            setTimeout(function(){w.classList.remove("good")},2200);
          }
        }
      });
    });
  // 09 segmented spring
  card(9,"Rubber-band segmented","The white pill is a spring that widens while moving, stretching like rubber between segments.",
    '<div class="seg9" id="seg9"><div class="pill9"></div><button class="on">Day</button><button>Month</button><button>Year</button></div>',
    function(stage){
      var seg=stage.querySelector("#seg9"),pill=seg.querySelector(".pill9");
      var px=makeSpring(190,18),pw=makeSpring(190,18,true);
      function layout(btn){
        var w=btn.offsetWidth;
        px.set(btn.offsetLeft);pw.set(w);
      }
      var first=seg.querySelector("button.on");
      (function initPill(){pill.style.left=first.offsetLeft+"px";pill.style.width=first.offsetWidth+"px"})();
      seg.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click",function(){
          seg.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});
          b.classList.add("on");
          layout(b);
        });
      });
      (function pillLoop(){
        var x=px.step(),w=pw.step();
        var mov=Math.abs(px.v);
        w+=Math.min(28,mov*1.2);
        pill.style.left=x+"px";
        pill.style.width=w+"px";
        requestAnimationFrame(pillLoop);
      })();
    });
  // 10 download
  card(10,"Download that works for it","Collapses to a circle, spins a progress ring over 2.2 s, flips green and draws the check.",
    '<button class="dlbtn" id="dlbtn"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="94" stroke-dashoffset="94" id="ringArc"/></svg><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg><span id="dlLab">Download</span></button>',
    function(stage){
      var b=stage.querySelector("#dlbtn"),arc=stage.querySelector("#ringArc");
      b.addEventListener("click",function(){
        if(b.classList.contains("busy")||b.classList.contains("done"))return;
        b.classList.add("busy");
        b.querySelector("#dlLab").style.opacity=0;
        var t0=performance.now();
        (function spin(now){
          var t=Math.min(1,(now-t0)/2200);
          t=1-Math.pow(1-t,3);
          arc.setAttribute("stroke-dashoffset",94*(1-t));
          if(t<1)requestAnimationFrame(spin);
          else{
            b.classList.remove("busy");
            b.classList.add("done");
            setTimeout(function(){
              b.classList.remove("done");
              b.querySelector("#dlLab").style.opacity=1;
            },1800);
          }
        })(t0);
      });
    });
})();
</script>
</body>
</html>
