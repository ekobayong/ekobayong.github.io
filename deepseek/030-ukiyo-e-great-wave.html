<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波の夢 — Nami no Yume</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(60% 50% at 50% 0%,rgba(120,90,50,.18),transparent 65%),#2a231d;
  min-height:100vh;display:grid;place-items:center;padding:40px 16px 60px;
  font-family:'Iowan Old Style',Palatino,Georgia,serif;
}
.top{text-align:center;color:#d9cbb0;margin-bottom:26px}
.top .en{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:rgba(217,203,176,.55)}
.print{
  position:relative;width:min(92vw,1000px);aspect-ratio:3/2;overflow:hidden;
  background:#efe3c6;box-shadow:0 60px 110px rgba(0,0,0,.6);
}
.print svg{position:absolute;inset:0;width:100%;height:100%}
.print svg .layerb{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.print svg .layerf{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.print svg .layerk{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.print svg .layers{transition:transform .9s cubic-bezier(.4,0,.2,1)}
body.misprint .layerb{transform:translate(5px,-3px)}
body.misprint .layerf{transform:translate(-4px,2px)}
body.misprint .layerk{transform:translate(2px,3px)}
body.misprint .layers{transform:translate(-3px,-2px) rotate(1deg)}
/* buttons */
.controls{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap;justify-content:center}
.cbtn{font-family:Georgia,'Iowan Old Style',serif;font-style:italic;font-size:16px;color:#d9cbb0;
  background:none;border:1px solid rgba(217,203,176,.4);padding:13px 30px;cursor:pointer;transition:all .35s}
.cbtn:hover{border-color:#f0dcae;color:#fff;transform:translateY(-2px)}
.cbtn.on{border-color:#b8322a;color:#f0a99e}
.meta{color:rgba(217,203,176,.5);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:14px;text-align:center}
@media(max-width:640px){.cbtn{font-size:13px;padding:10px 16px}}
@media(prefers-reduced-motion:reduce){
  .print svg *{transition:none!important}
}
</style>
</head>
<body>
<p class="top en">an original ukiyo-e seascape · inspired by but not copying the great wave</p>
<div class="print" id="print">
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="fibre" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.25" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
      </filter>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      </filter>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9dcb9"/>
        <stop offset="0.55" stop-color="#d4c2a8"/>
        <stop offset="1" stop-color="#9fb0b3"/>
      </linearGradient>
      <linearGradient id="mnt" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6efdc"/>
        <stop offset="0.6" stop-color="#8fa0b4"/>
        <stop offset="1" stop-color="#3f5470"/>
      </linearGradient>
      <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6f9cc2"/><stop offset="0.5" stop-color="#3d6d9a"/><stop offset="1" stop-color="#1b3a5c"/>
      </linearGradient>
      <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a7ba8"/><stop offset="0.5" stop-color="#2f5a86"/><stop offset="1" stop-color="#132c47"/>
      </linearGradient>
      <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a6b98"/><stop offset="0.5" stop-color="#1b3a5c"/><stop offset="1" stop-color="#0f2540"/>
      </linearGradient>
      <pattern id="carve1" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
        <line x1="0" y1="0" x2="0" y2="14" stroke="#1b3a5c" stroke-width="3.2"/>
      </pattern>
      <pattern id="carve2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#0f2540" stroke-width="2.8"/>
      </pattern>
      <pattern id="carve3" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
        <line x1="0" y1="0" x2="0" y2="11" stroke="#0a1a30" stroke-width="2.6"/>
      </pattern>
    </defs>
    <g filter="url(#fibre)">
      <rect width="1200" height="800" fill="url(#sky)"/>
      <circle cx="970" cy="150" r="64" fill="#f0e3c2"/>
      <g transform="translate(600,300)">
        <path d="M-220 0 Q -80 -240 160 -60 Q 60 40 -160 10 Z" fill="url(#mnt)" opacity=".92"/>
      </g>
    </g>
    <!-- waves layers -->
    <g class="layerb">
      <path id="waveBack" fill="url(#w1)"/>
      <path id="waveBack2" fill="url(#carve1)" opacity=".8"/>
    </g>
    <g class="layerf">
      <path id="waveMid" fill="url(#w2)"/>
      <path id="waveMid2" fill="url(#carve2)" opacity=".75"/>
      <g id="boatG1"><g id="boat1"><path d="M0 0 L36 3 L30 14 L0 16 Z" fill="#4a3520"/><path d="M0 -12 Q10 -4 20 0 L4 3 Z" fill="#f0e3c2"/><g id="rowers1"><g class="row"><line x1="6" y1="0" x2="16" y2="-16" stroke="#3a2a18" stroke-width="2.6"/><line x1="16" y1="-16" x2="27" y2="-2" stroke="#3a2a18" stroke-width="2.6"/></g><g class="row"><line x1="12" y1="0" x2="18" y2="-18" stroke="#3a2a18" stroke-width="2.6"/><line x1="18" y1="-18" x2="30" y2="-4" stroke="#3a2a18" stroke-width="2.6"/></g><g class="row"><line x1="18" y1="0" x2="22" y2="-17" stroke="#3a2a18" stroke-width="2.6"/><line x1="22" y1="-17" x2="33" y2="-2" stroke="#3a2a18" stroke-width="2.6"/></g><g class="row"><line x1="24" y1="0" x2="25" y2="-15" stroke="#3a2a18" stroke-width="2.6"/><line x1="25" y1="-15" x2="36" y2="-3" stroke="#3a2a18" stroke-width="2.6"/></g></g></g></g>
    </g>
    <g class="layerk">
      <path id="waveFront" fill="url(#w3)"/>
      <path id="waveFront2" fill="url(#carve3)" opacity=".6"/>
      <path id="crest" fill="none" stroke="#0b1d33" stroke-width="2.5"/>
      <g id="foamClaws"></g>
    </g>
    <!-- flecks -->
    <g class="layerf" id="flecks"></g>
    <rect width="1200" height="800" filter="url(#grain)"/>
  </svg>
</div>

<div class="controls">
  <button class="cbtn" id="calmBtn">Calm sea</button>
  <button class="cbtn" id="stormBtn">Rising storm</button>
  <button class="cbtn on" id="holdBtn">Hold the block</button>
</div>
<div class="meta">hover the print · the colours slip out of register</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NS="http://www.w3.org/2000/svg";
  var amplitude=1,time=0,hold=false;
  // vertical Japanese title
  var titleTxt="波の夢";
  var svg=document.getElementById("scene");
  // add title marks
  var titleG=document.createElementNS(NS,"g");
  titleG.innerHTML='<text x="1150" y="60" font-family="Georgia,\'Iowan Old Style\',serif" font-size="40" font-weight="700" fill="#1b1a26" writing-mode="tb" letter-spacing="10">波の夢</text>'+
    '<text x="1112" y="140" font-family="Georgia,serif" font-size="15" fill="#1b1a26" writing-mode="tb" letter-spacing="4">N A M I&nbsp;&nbsp;N O&nbsp;&nbsp;Y U M E</text>';
  svg.insertBefore(titleG,svg.firstChild);
  var seal=document.createElementNS(NS,"g");
  seal.setAttribute("class","layers");
  seal.innerHTML='<g transform="translate(52,44) rotate(-4)"><rect x="0" y="0" width="86" height="118" fill="#b8322a" stroke="#f6efdc" stroke-width="5"/><text x="43" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="4" fill="#f6efdc">NAMI</text><text x="43" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="4" fill="#f6efdc">NO</text><text x="43" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="4" fill="#f6efdc">YUME</text><text x="43" y="106" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="3" fill="#f6efdc">MMXXVI</text></g>';
  svg.insertBefore(seal,svg.firstChild);

  var W=1200,H=800,h400=400;
  function waveY(x,base,amp,f1,f2,sp1,sp2,t,layer){
    var y=base
      +Math.sin(x*0.004*f1+t*sp1+layer)*amp*34
      +Math.sin(x*0.011*f2+t*sp2+layer*2)*amp*16
      +Math.sin(x*0.021+t*1.4)*amp*7;
    return y;
  }
  function buildPaths(){
    var t=hold?time:time;
    // back layer (base 330)
    var dBack="M0 800 L0 "+waveY(0,330,amp,1,2.2,0.5,0.9,t,0)+" ";
    for(var x=0;x<=W;x+=8)dBack+=("L"+x+" "+waveY(x,330,amp,1,2.2,0.5,0.9,t,0)+" ");
    dBack+="L1200 800 Z";
    // mid (base 430), notable swell for boats
    var dMid="M0 800 L0 "+waveY(0,430,amp,0.8,1.7,0.4,0.8,t,1.7)+" ";
    for(var x=0;x<=W;x+=8)dMid+=("L"+x+" "+waveY(x,430,amp,0.8,1.7,0.4,0.8,t,1.7)+" ");
    dMid+="L1200 800 Z";
    // front with great crest on left
    var dFront="M0 800 L0 "+crestY(0,t)+" ";
    for(var x=0;x<=W;x+=6)dFront+=("L"+x+" "+crestY(x,t)+" ");
    dFront+="L1200 800 Z";
    var cb=document.getElementById("waveBack");
    cb.setAttribute("d",dBack);
    document.getElementById("waveBack2").setAttribute("d",dBack);
    var cm=document.getElementById("waveMid");
    cm.setAttribute("d",dMid);
    document.getElementById("waveMid2").setAttribute("d",dMid);
    var cf=document.getElementById("waveFront");
    cf.setAttribute("d",dFront);
    document.getElementById("waveFront2").setAttribute("d",dFront);
    document.getElementById("crest").setAttribute("d","M0 "+crestY(0,t)+" L1200 "+crestY(1200,t));
    // foam claws at crests
    drawFoam(t);
    // boats on back swell
    positionBoat("boatG1",230,waveY(230,330,amp,1,2.2,0.5,0.9,t,0));
    // flecks
    drawFlecks(t);
  }
  function crestY(x,t){
    // asymmetric gaussian crest around x=280, 330 units tall
    var base=540; // front layer baseline
    var cx=270+Math.sin(t*0.2)*30;
    var g=Math.exp(-Math.pow((x-cx)/90,2));
    var crestAmp=amp*255*(1+0.12*Math.sin(t*0.8));
    // steeper leading edge: skew
    var skew=x<cx?(x-cx)*0.22:(x-cx)*0.6;
    var y=base-crestAmp*g+skew*Math.max(0,g)*0.5;
    // small ripples
    y+=Math.sin(x*0.006+t*1.1)*amp*22;
    y+=Math.sin(x*0.017+t*1.9+1)*amp*9;
    return y;
  }
  var claws=[];
  function drawFoam(t){
    var g=document.getElementById("foamClaws");
    g.innerHTML="";
    // detect crests across layers
    var xs=[270,520,700,940,1120];
    xs.forEach(function(x,i){
      var cy=crestY(x,t);
      var hgt=(cy<380)?1:0.6;
      var n=3+Math.floor(Math.random()*3);
      for(var c=0;c<n;c++){
        var cx2=x+ (Math.random()*50-25);
        var cy2=cy- (Math.random()*30-8);
        var r=6+Math.random()*10;
        var dir=(Math.random()<0.5?-1:1);
        var curl=g.createSVGPathSegList?0:0;
        var circ=document.createElementNS(NS,"circle");
        circ.setAttribute("cx",cx2);circ.setAttribute("cy",cy2);circ.setAttribute("r",r);
        circ.setAttribute("fill","#f6efdc");
        g.appendChild(circ);
        // curl finger: shrinking circles along direction
        for(var f2=1;f2<=3;f2++){
          var c3=document.createElementNS(NS,"circle");
          c3.setAttribute("cx",cx2+dir*f2*r*0.8);c3.setAttribute("cy",cy2+f2*r*0.5);
          c3.setAttribute("r",r*(1-f2*0.25));c3.setAttribute("fill","#f6efdc");
          c3.setAttribute("opacity",(1-f2*0.2));
          g.appendChild(c3);
        }
      }
      // foam rim along crest
      var rim=document.createElementNS(NS,"path");
      var d="M"+(x-46)+" "+(cy-2);
      for(var xx=x-46;xx<=x+46;xx+=12)d+=" L"+xx+" "+(crestY(xx,t)-3+Math.sin(xx*0.3+t*2)*3);
      rim.setAttribute("d",d);
      rim.setAttribute("stroke","#f6efdc");rim.setAttribute("stroke-width",5);rim.setAttribute("fill","none");
      rim.setAttribute("stroke-linecap","round");
      g.appendChild(rim);
    });
  }
  function positionBoat(id,x,y){
    var b=document.getElementById(id);
    b.setAttribute("transform","translate("+(x-10)+","+(y-6)+") rotate("+(Math.sin(time*0.5)*4)+")");
  }
  var flecks=[];(function(){for(var i=0;i<46;i++)flecks.push({x:Math.random()*W,y:300+Math.random()*200,life:0,max:4+Math.random()*6,sp:0.02+Math.random()*0.08})})();
  function drawFlecks(t){
    var g=document.getElementById("flecks");
    g.innerHTML="";
    flecks.forEach(function(f){
      f.life+=f.sp;
      if(f.life>f.max)f.life=0;
      var p=f.life/f.max;
      var y=f.y-p*120;
      var x=f.x+p*40;
      var a=Math.sin(p*Math.PI);
      var c=document.createElementNS(NS,"circle");
      c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",2+p*2);
      c.setAttribute("fill","#f6efdc");c.setAttribute("opacity",(a*0.7).toFixed(2));
      g.appendChild(c);
    });
  }
  function frame(){
    if(!hold)time+=0.016;
    buildPaths();
    if(!RM)requestAnimationFrame(frame);
  }
  // buttons
  function setAmp(a){
    var t0=performance.now();
    var from=amplitude;
    (function ease(now){
      var p=Math.min(1,(now-t0)/900);
      p=1-Math.pow(1-p,3);
      amplitude=from+(a-from)*p;
      if(p<1&&!RM)requestAnimationFrame(ease);
    })(t0);
  }
  document.getElementById("calmBtn").addEventListener("click",function(){
    setAmp(0.45);
    document.querySelectorAll(".cbtn").forEach(function(b){b.classList.remove("on")});
    this.classList.add("on");
  });
  document.getElementById("stormBtn").addEventListener("click",function(){
    setAmp(1.6);
    document.querySelectorAll(".cbtn").forEach(function(b){b.classList.remove("on")});
    this.classList.add("on");
  });
  document.getElementById("holdBtn").addEventListener("click",function(){
    hold=!hold;
    this.classList.toggle("on",hold);
  });
  // misprint on hover
  document.getElementById("print").addEventListener("pointerenter",function(){document.body.classList.add("misprint")});
  document.getElementById("print").addEventListener("pointerleave",function(){document.body.classList.remove("misprint")});
  buildPaths();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
