<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Meridian — An Isometric City Block</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sky1:#5faaff;--sky2:#e1f2ff;--night:0;--s:1;
  --sunx:0px;--suny:0px;--moonx:0px;--moony:0px;
}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,var(--sky1),var(--sky2));
  transition:background 1.2s ease;
  font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;color:#26324a;
}
.stars{position:fixed;inset:0;z-index:0;opacity:var(--night);transition:opacity 1.2s;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent 60%),
  radial-gradient(1px 1px at 25% 9%,#fff,transparent 60%),
  radial-gradient(2px 2px at 38% 26%,#ffe9c4,transparent 60%),
  radial-gradient(1px 1px at 52% 12%,#fff,transparent 60%),
  radial-gradient(1.5px 1.5px at 63% 22%,#fff,transparent 60%),
  radial-gradient(1px 1px at 74% 8%,#fff,transparent 60%),
  radial-gradient(1px 1px at 86% 19%,#fff,transparent 60%),
  radial-gradient(1.5px 1.5px at 94% 31%,#fff,transparent 60%)}
.sun{
  position:fixed;top:12%;left:14%;z-index:1;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff7cf,#ffd76b 70%,#ffb347);
  box-shadow:0 0 60px 20px rgba(255,215,107,.55);
  transform:translate(var(--sunx),var(--suny));transition:opacity 1.2s;opacity:calc(1 - var(--night)*0.92);
}
.moon{
  position:fixed;top:14%;right:16%;z-index:1;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f4f1e2,#cfc8b0 70%);
  box-shadow:0 0 40px 12px rgba(240,237,220,.35);
  transform:translate(var(--moonx),var(--moony));opacity:var(--night);
}
.stage{position:fixed;left:50%;top:54%;z-index:2;transform:translate(-50%,-50%) scale(var(--s))}
.city{position:relative;width:540px;height:540px;
  transform:rotateX(60deg) rotateZ(45deg);
  transform-style:preserve-3d;
  background:
    linear-gradient(90deg,transparent 0 128px,#5b5f6b 128px 134px,transparent 134px 270px,#5b5f6b 270px 276px,transparent 276px 412px,#5b5f6b 412px 418px,transparent 418px),
    linear-gradient(0deg,transparent 0 128px,#5b5f6b 128px 134px,transparent 134px 270px,#5b5f6b 270px 276px,transparent 276px 412px,#5b5f6b 412px 418px,transparent 418px),
    linear-gradient(45deg,transparent 0 44%,#d9d3c7 44% 56%,transparent 56%),
    linear-gradient(-45deg,transparent 0 44%,#d9d3c7 44% 56%,transparent 56%),
    #b9d59a;
  box-shadow:inset 0 0 0 12px #c9c2b4,0 60px 80px rgba(10,20,50,.35);
}
.city::after{content:"";position:absolute;inset:0;background:rgba(18,24,66,calc(var(--night)*0.5));pointer-events:none}
.dash{position:absolute;width:90px;height:2px;background:repeating-linear-gradient(90deg,#efe9da 0 10px,transparent 10px 20px)}
.dash.h1{left:0;top:131px}.dash.h2{left:270px;top:131px}.dash.v1{left:131px;top:0;transform:rotate(90deg);transform-origin:0 50%}.dash.v2{left:131px;top:270px;transform:rotate(90deg);transform-origin:0 50%}
/* buildings */
.slot{position:absolute;transform-style:preserve-3d}
.face{
  position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0)),var(--c);
}
.face.top{transform:translateZ(var(--h));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.face.south{transform:translateY(var(--d)) translateZ(var(--h)) rotateX(-90deg);filter:brightness(.96)}
.face.east{transform:translateX(var(--w)) translateZ(var(--h)) rotateZ(90deg) rotateX(-90deg);filter:brightness(.74)}
.wingrid{position:absolute;inset:0;display:grid;gap:6px 8px;padding:7px}
.wingrid i{
  border-radius:1.5px;
  background:linear-gradient(160deg,#dbe6ff,#9fb8e0 70%,#7c94bf);
  opacity:calc(1 - var(--night)*0.55);
  transition:background .8s;
}
.wingrid i.on{background:
  radial-gradient(circle at 40% 30%,#fff1c8 0 15%,rgba(255,213,138,.25) 45%,#ffd58a 100%),#ffd58a;
  box-shadow:0 0 6px rgba(255,213,138,.6);opacity:1}
.wingrid i.on.cool{background:#cfe6ff;box-shadow:0 0 6px rgba(207,230,255,.6)}
.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:16%;height:26%;background:linear-gradient(180deg,#2e2a26,#181515);border-radius:2px 2px 0 0}
.tag{
  position:absolute;z-index:20;background:rgba(255,255,255,.94);color:#22303f;border-radius:8px;
  padding:8px 12px;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;
  transform:rotateZ(-45deg) rotateX(-60deg) translateZ(-20px);
  box-shadow:0 6px 18px rgba(0,0,0,.3);transition:opacity .25s;
}
.tag b{display:block;font-size:11px;color:#7c8794;font-weight:500}
.building:hover .tag,.building:focus .tag{opacity:1}
.building{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,1.3,.3,1)}
.building:hover,.building:focus{transform:translateZ(24px);outline:none}
.shadow{position:absolute;left:calc(var(--shx)*-1);top:calc(var(--shy)*-1);width:100%;height:100%;
  background:rgba(20,30,60,.3);filter:blur(10px);transform:translate(var(--shx),var(--shy));opacity:calc(1 - var(--night)*0.55);pointer-events:none}
.neon{
  position:absolute;top:-64px;left:50%;transform:translate(-50%,0);z-index:30;
  background:#2a2038;color:#ff5fb8;font-family:Georgia,'Iowan Old Style',serif;font-style:italic;
  font-size:15px;padding:7px 18px;border-radius:6px;
  text-shadow:-2px -2px 0 rgba(255,95,184,.4),2px 2px 0 rgba(255,95,184,.4),0 0 14px rgba(255,95,184,.9);
  animation:neonBob 3s ease-in-out infinite,neonFlick 4.2s steps(2) infinite;
  box-shadow:0 0 24px rgba(255,95,184,.35);
}
@keyframes neonBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
@keyframes neonFlick{0%,88%,100%{opacity:1}89%{opacity:.35}91%{opacity:1}93%{opacity:.55}95%{opacity:1}}
/* cars */
.car{position:absolute;height:14px;width:26px;border-radius:5px;opacity:.95}
.car::before{content:"";position:absolute;left:2px;top:3px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,255,255,.75)}
.car::after{content:"";position:absolute;right:2px;top:3px;width:4px;height:4px;border-radius:50%;background:#ff4d3d;box-shadow:0 0 8px 3px rgba(255,77,61,calc(0.3 + var(--night)));opacity:calc(0.55 + var(--night)*0.45)}
/* toolbar */
.toolbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:99px;padding:10px 14px;box-shadow:0 12px 30px rgba(30,40,80,.25);flex-wrap:wrap;justify-content:center}
.tb{font-family:inherit;font-size:12.5px;font-weight:600;color:#26324a;background:none;border:none;padding:8px 16px;border-radius:99px;cursor:pointer;transition:background .25s}
.tb:hover{background:rgba(60,80,120,.1)}
.tb[aria-pressed="true"]{background:#26324a;color:#fff}
.clock{position:fixed;top:20px;right:24px;z-index:40;font-family:Georgia,'Iowan Old Style',serif;font-size:15px;color:#26324a;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);padding:8px 14px;border-radius:10px}
.clock b{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-family:ui-sans-serif,system-ui;color:#6b7a90;font-weight:600}
@media(max-width:720px){
  .toolbar{width:92vw}
}
@media(prefers-reduced-motion:reduce){
  .dash{animation:none!important}
  .car{animation:none!important}
  .neon{animation:none}
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="sun"></div>
<div class="moon"></div>
<div class="clock" id="clock"><b>Simulated time</b><span id="clockT">09:24 · morning</span></div>

<div class="stage"><div class="city" id="city"></div></div>

<div class="toolbar">
  <button class="tb" id="pauseBtn" aria-pressed="false">Pause cycle</button>
  <button class="tb" id="rainBtn" aria-pressed="false">Rain</button>
  <button class="tb" id="nightBtn">Skip to night</button>
  <button class="tb" id="dayBtn">Skip to day</button>
</div>
<div class="rain" id="rainLayer" style="position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity 1s"></div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root=document.documentElement;
  var paused=RM?true:false,cycleT=474; // seconds of 120s day cycle, start ~morning
  var DAY=120;
  var buildings=[
    {n:"Harbor Tower",c:"#a9b7c9",x:150,y:310,w:120,d:120,h:220,rows:9,use:"harbour tower · offices"},
    {n:"Marigold Flats",c:"#e9c1a0",x:60,y:60,w:90,d:90,h:120,rows:6,use:"flats · 12 dwellings"},
    {n:"Linden Court",c:"#b9d4c2",x:330,y:70,w:95,d:95,h:140,rows:7,use:"courtyard housing"},
    {n:"The Prism",c:"#c9bfe0",x:160,y:60,w:85,d:85,h:150,rows:7,use:"glassworks · ateliers"},
    {n:"Cobalt Works",c:"#9fb8d8",x:70,y:180,w:110,d:105,h:100,rows:5,use:"workshop · cobalt press"},
    {n:"Night Market",c:"#e6a49a",x:325,y:180,w:110,d:95,h:60,rows:3,use:"market hall · lanterns"},
    {n:"Pillow Bank",c:"#e8dcc4",x:150,y:180,w:90,d:80,h:85,rows:4,use:"savings · quiet"},
    {n:"Ferris Apartments",c:"#dcb3b8",x:60,y:320,w:90,d:80,h:110,rows:5,use:"flats · balconies"},
    {n:"Saltbox Studios",c:"#c3ccb0",x:290,y:320,w:95,d:90,h:70,rows:3,use:"studios · north light"},
    {n:"Aurora Spire",c:"#a8cfd0",x:330,y:380,w:105,d:100,h:260,rows:10,use:"observatory · tallest"},
    {n:"Tin Roof Diner",c:"#ecd9a1",x:160,y:400,w:95,d:80,h:55,rows:2,use:"diner · coffee"},
    {n:"Meridian House",c:"#cfc5d6",x:350,y:240,w:85,d:80,h:150,rows:7,use:"house · cream brick"}
  ];
  var city=document.getElementById("city");
  function build(){
    city.querySelectorAll(".building,.dash,.neon,.car").forEach(function(n){n.remove()});
    buildings.forEach(function(b,i){
      var slot=document.createElement("div");
      slot.className="slot building";
      slot.tabIndex=0;
      slot.dataset.name=b.n;slot.dataset.use=b.use;
      slot.style.left=b.x+"px";slot.style.top=b.y+"px";
      slot.style.setProperty("--w",b.w+"px");slot.style.setProperty("--d",b.d+"px");slot.style.setProperty("--h",b.h+"px");
      slot.style.setProperty("--c",b.c);
      var sh=Math.min(200,b.h*0.9);
      slot.style.setProperty("--shx",(-sh*0.62)+"px");
      slot.style.setProperty("--shy",(-sh*0.36)+"px");
      var shadow=document.createElement("div");shadow.className="shadow";slot.appendChild(shadow);
      var top=document.createElement("div");top.className="face top";slot.appendChild(top);
      var south=document.createElement("div");south.className="face south";slot.appendChild(south);
      var east=document.createElement("div");east.className="face east";slot.appendChild(east);
      // windows
      var cols=Math.max(2,Math.floor(b.w/26)),rows=Math.max(2,Math.floor(b.h/24));
      [south,east].forEach(function(face){
        var grid=document.createElement("div");grid.className="wingrid";
        grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
        for(var r=0;r<rows;r++)for(var c2=0;c2<cols;c2++){
          var wn=document.createElement("i");
          if(Math.random()<0.16)wn.className="on"+(Math.random()<0.25?" cool":"");
          grid.appendChild(wn);
        }
        face.appendChild(grid);
        var door=document.createElement("div");door.className="door";
        face.appendChild(door);
      });
      var tag=document.createElement("div");tag.className="tag";
      tag.innerHTML="<b>"+b.n+"</b>"+b.rows+" floors · "+b.use;
      slot.appendChild(tag);
      city.appendChild(slot);
      if(b.n==="Night Market"){
        var n2=document.createElement("div");n2.className="neon";n2.textContent="✦ Night Market ✦";
        slot.appendChild(n2);
      }
    });
    // cars
    var carDefs=[
      {cls:"coral",color:"#ff8a7a",dur:9,delay:0,road:"h",dir:1,pos:0},
      {cls:"teal",color:"#4ee6c7",dur:11,delay:3,road:"h",dir:-1,pos:54},
      {cls:"yellow",color:"#ffd166",dur:8,delay:6,road:"v",dir:1,pos:20},
      {cls:"peri",color:"#a9b4ff",dur:12,delay:1.5,road:"v",dir:-1,pos:70}
    ];
    carDefs.forEach(function(cd){
      var c=document.createElement("div");c.className="car";c.style.background=cd.color;
      if(cd.road==="h"){
        c.style.left=cd.pos+"px";
        c.style.top="127px";
        c.style.animation="carH "+cd.dur+"s linear "+cd.delay+"s infinite"+(cd.dir<0?" reverse":"");
        c.style.top=cd.dir>0?"124px":"132px";
      }else{
        c.style.left="127px";c.style.top=cd.pos+"px";
        c.style.animation="carV "+cd.dur+"s linear "+cd.delay+"s infinite"+(cd.dir<0?" reverse":"");
        c.style.left=cd.dir>0?"134px":"120px";
        c.style.transform="rotate(90deg)";
      }
      city.appendChild(c);
    });
  }
  // car keyframes
  var st=document.createElement("style");
  st.textContent="@keyframes carH{from{left:-40px}to{left:560px}}@keyframes carV{from{top:-40px}to{top:560px}}";
  document.head.appendChild(st);
  build();

  // day/night cycle
  var skyKeys=[
    {t:0,c1:"#0c1028",c2:"#1e2246"},
    {t:14,c1:"#20264f",c2:"#4a4a7a"},
    {t:24,c1:"#ff966e",c2:"#ffd7aa"},
    {t:34,c1:"#5faaff",c2:"#e1f2ff"},
    {t:64,c1:"#3f7fd0",c2:"#cfe4f0"},
    {t:76,c1:"#ffb26b",c2:"#ffe0b0"},
    {t:88,c1:"#6b4a7a",c2:"#b07a96"},
    {t:100,c1:"#0c1028",c2:"#1e2246"}
  ];
  function lerp(a,b,t){return a+(b-a)*t}
  function hexLerp(h1,h2,t){
    var a=parseInt(h1.slice(1),16),b2=parseInt(h2.slice(1),16);
    var r=Math.round(lerp((a>>16)&255,(b2>>16)&255,t));
    var g=Math.round(lerp((a>>8)&255,(b2>>8)&255,t));
    var bl=Math.round(lerp(a&255,b2&255,t));
    return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }
  function sky(tt){
    var keys=skyKeys;
    for(var i=0;i<keys.length-1;i++){
      var k1=keys[i],k2=keys[i+1];
      if(tt>=k1.t&&tt<=k2.t){
        var t=Math.min(1,Math.max(0,(tt-k1.t)/(k2.t-k1.t)));
        t=t*t*(3-2*t);
        root.style.setProperty("--sky1",hexLerp(k1.c1,k2.c1,t));
        root.style.setProperty("--sky2",hexLerp(k1.c2,k2.c2,t));
        // night: 0 at dawn (24), 1 at night (0/100)
        var night=1-Math.min(1,Math.max(0,(tt-22)/14))*Math.min(1,Math.max(0,(tt-14)/10));
        // simpler: night ramps between 88-100 and 0-14
        var nightV=0;
        if(tt>=88)nightV=Math.min(1,(tt-88)/12);
        if(tt<=14)nightV=Math.min(1,(14-tt)/14);
        nightV=Math.max(nightV,tt>=24&&tt<=88?0:nightV);
        nightV=Math.min(1,nightV);
        root.style.setProperty("--night",nightV);
        // sun arc
        var sunP=Math.min(1,Math.max(0,(tt-24)/52));
        root.style.setProperty("--sunx",(sunP*38)+"vw");
        root.style.setProperty("--suny",(Math.sin(sunP*Math.PI)*26)+"vh");
        root.style.setProperty("--moonx",((1-Math.min(1,Math.max(0,(tt-76)/22)))*30)+"vw");
        return;
      }
    }
  }
  function tick(dt){
    if(!paused)cycleT=(cycleT+dt)%DAY;
    sky(cycleT);
    var h=Math.floor(cycleT/DAY*24),m=Math.floor((cycleT%DAY/DAY*24)%1*60);
    var ph=h<6?"night":h<12?"morning":h<18?"afternoon":"evening";
    document.getElementById("clockT").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+" · "+ph;
    // flicker windows
    if(!RM&&Math.random()<0.4){
      var wins=city.querySelectorAll(".wingrid i");
      for(var i=0;i<2;i++){
        var w=wins[Math.floor(Math.random()*wins.length)];
        if(w&&w.parentElement.dataset.r)w.classList.toggle("on");
      }
    }
    if(!RM)requestAnimationFrame(function(now){tick(now-frame)});
  }
  var frame=performance.now();
  // rain layer
  var rainLayer=document.getElementById("rainLayer");
  rainLayer.style.background="repeating-linear-gradient(100deg,transparent 0 30px,rgba(180,200,235,.12) 30px 31px),repeating-linear-gradient(80deg,transparent 0 46px,rgba(170,195,230,.1) 46px 47px)";
  document.getElementById("rainBtn").addEventListener("click",function(){
    var on=this.getAttribute("aria-pressed")==="true"?"false":"true";
    this.setAttribute("aria-pressed",on);
    rainLayer.style.opacity=on==="true"?1:0;
  });
  document.getElementById("pauseBtn").addEventListener("click",function(){
    paused=!paused;
    this.setAttribute("aria-pressed",paused?"true":"false");
    this.textContent=paused?"Resume cycle":"Pause cycle";
  });
  document.getElementById("nightBtn").addEventListener("click",function(){cycleT=97});
  document.getElementById("dayBtn").addEventListener("click",function(){cycleT=40});
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();document.getElementById("pauseBtn").click()}
    if(e.key==="r"||e.key==="R")document.getElementById("rainBtn").click();
  });
  // scale to fit viewport
  function fit(){
    var s=Math.max(0.42,Math.min(1.7,Math.min(window.innerWidth/760,window.innerHeight/700)*1.08));
    root.style.setProperty("--s",s);
  }
  window.addEventListener("resize",fit);fit();
  // announce hover
  window.addEventListener("keydown",function(e){});
  if(RM){paused=true;document.getElementById("pauseBtn").setAttribute("aria-pressed","true");document.getElementById("pauseBtn").textContent="Paused"}
  sky(cycleT);
  requestAnimationFrame(function(now){frame=now;tick(0)});
})();
</script>
</body>
</html>
