<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marconi Meridian 55 — Bakelite Radio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(70% 50% at 50% 10%,rgba(90,60,30,.35),transparent 65%),#2d2119;
  background:#0a0705;
  background-image:radial-gradient(80% 60% at 50% 0%,#2d2119,#0a0705);
  min-height:100vh;display:grid;place-items:center;padding:40px 14px 60px;
  font-family:'Iowan Old Style',Palatino,Georgia,serif;color:#efe2c4;
}
.brandline{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:rgba(201,169,122,.5)}
/* cabinet */
.radio{
  position:relative;width:min(92vw,860px);aspect-ratio:16/10;
  background:linear-gradient(180deg,#7a4525,#5a2f18 45%,#3a1c0e);
  border-radius:42px 42px 26px 26px;
  box-shadow:inset 0 3px 2px rgba(255,220,180,.25),inset 0 -6px 12px rgba(0,0,0,.55),0 60px 110px rgba(0,0,0,.7);
  padding:34px 38px 30px;
  position:relative;overflow:hidden;
}
.radio::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(0,0,0,.08) 9px 10px);
  opacity:.6}
.radio::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 30%);}
.face{
  position:relative;z-index:2;height:100%;border-radius:24px;background:linear-gradient(180deg,#efe2c4,#d9c79f);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.35),inset 0 -2px 4px rgba(255,255,255,.5);
  display:grid;grid-template-rows:auto 1fr auto;padding:20px 22px 18px;
}
/* dial */
.dial{position:relative;height:88px;background:#1c1108;border-radius:12px;border:1px solid rgba(201,169,122,.7);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,200,120,.2),0 1px 0 rgba(255,255,255,.35);overflow:visible}
.dial .glow{position:absolute;inset:0;border-radius:12px;background:radial-gradient(60% 120% at 50% 100%,rgba(255,179,71,.5),transparent 75%);animation:glowflick 4s steps(2) infinite}
@keyframes glowflick{0%,90%,100%{opacity:1}93%{opacity:.6}95%{opacity:.85}}
.freqs{position:absolute;left:9%;right:9%;top:8px;display:flex;justify-content:space-between;color:#ffb347;font-family:ui-monospace,monospace;font-size:10.5px;text-shadow:0 0 8px rgba(255,179,71,.9)}
.ticks{position:absolute;left:9%;right:9%;top:28px;height:14px;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc((100% - 14px)/29),rgba(255,190,120,.75) calc((100% - 14px)/29) calc((100% - 14px)/29 + 1px));
  background-size:auto 14px}
.cities{position:absolute;left:9%;right:9%;top:46px;font-size:12.5px;font-style:italic;color:rgba(239,226,196,.45);display:flex;justify-content:space-between;letter-spacing:.04em}
.cities.l2{top:62px}
.cities .city{position:relative;white-space:nowrap;transition:color .4s,text-shadow .4s}
.cities .city.on{color:#fff;text-shadow:0 0 12px rgba(255,200,120,1),0 0 30px rgba(255,179,71,.7)}
.needle{position:absolute;left:16%;top:-4px;bottom:-6px;width:2px;background:#c8322a;box-shadow:0 0 10px rgba(255,60,40,.8)}
.needle::before{content:"";position:absolute;top:-3px;left:-5px;width:12px;height:8px;
  background:#c8322a;clip-path:polygon(50% 100%,100% 0,0 0)}
.bandlbl{position:absolute;right:14px;top:6px;font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.18em;color:rgba(255,179,71,.5)}
/* body row */
.bodyrow{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:14px;min-height:0}
@media(max-width:640px){.bodyrow{grid-template-columns:1fr}.radio{aspect-ratio:auto}.bodyrow .dialrow{order:2}}
/* grille */
.grille{position:relative;background:linear-gradient(180deg,#1c1108,#2a1a0c);border-radius:14px;border:2px solid rgba(201,169,122,.8);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.4);overflow:hidden;padding:10px;display:grid;place-items:center}
.grille .cloth{position:absolute;inset:10px;border-radius:8px;
  background:
    repeating-linear-gradient(45deg,rgba(201,169,122,.5) 0 2px,rgba(163,131,90,.2) 2px 4px),
    repeating-linear-gradient(-45deg,transparent 0 3px,rgba(150,120,80,.25) 3px 6px),
    repeating-linear-gradient(0deg,rgba(201,169,122,.5) 0 3px,rgba(163,131,90,.3) 3px 5px),
    #c9a97a;
  background-blend-mode:multiply}
.grille .emblem{position:relative;z-index:2;width:74px;height:74px}
/* display */
.display{position:relative;background:#050302;border-radius:12px;border:1px solid rgba(201,169,122,.6);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.95);overflow:hidden;display:flex;flex-direction:column}
.display canvas{width:100%;flex:1;display:block}
.stationcard{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(5,3,2,.82);text-align:center;padding:10px;gap:2px}
.stationcard.show{display:flex;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stationcard .sc{font-size:clamp(19px,2.6vw,28px);color:#fff1d6;letter-spacing:.06em}
.stationcard .fr{font-family:ui-monospace,monospace;font-size:12px;color:#e29a3d;margin-top:2px}
.stationcard .pr{font-style:italic;font-size:11.5px;color:rgba(255,241,214,.66);margin-top:6px;line-height:1.4;max-width:30ch}
.stationcard .lock{position:absolute;top:8px;right:10px;font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.2em;color:#5ee36a}
.searching{position:absolute;inset:0;display:none;place-items:center;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.3em;color:rgba(255,179,71,.7);text-transform:uppercase}
.searching.show{display:grid}
/* vu */
.vurow{display:flex;align-items:center;gap:12px;padding:8px 6px 0}
.vu{flex:1;background:linear-gradient(180deg,#efe2c4,#d9c79f);border-radius:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.vu svg{width:100%;display:block}
.vulabel{font-size:8px;letter-spacing:.2em;color:rgba(239,226,196,.5);writing-mode:vertical-rl;transform:rotate(180deg)}
/* knobs row */
.knobrow{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-top:12px}
.dial2{width:100%;}
.volk,.tunek{width:74px;height:74px;position:relative;cursor:ns-resize;touch-action:none;user-select:none}
.volk{width:58px;height:58px}
.knobcap{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3a3a3a,#151515 70%);
  box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.25);
}
.knobcap::before{content:"";position:absolute;inset:2px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.14) 0 6deg,transparent 6deg 12deg);
  -webkit-mask-image:radial-gradient(circle,#000 0 58%,transparent 60%);
  mask-image:radial-gradient(circle,#000 0 58%,transparent 60%)}
.knobcap::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:15px;background:#efe2c4;
  transform:translateX(-50%) rotate(var(--ka,0deg));transform-origin:50% 30px}
.knobrow .kline{width:2px;height:44px;background:rgba(201,169,122,.8);border-radius:2px;box-shadow:0 0 12px rgba(255,179,71,.6)}
.knobrow .klbls{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.24em;color:rgba(239,226,196,.5);text-transform:uppercase}
.knlbl{font-size:9px;letter-spacing:.2em;color:rgba(239,226,196,.55);text-transform:uppercase;text-align:center;margin-top:6px}
.vents{display:flex;gap:8px;justify-content:center;position:relative;height:26px}
.vents .slot{width:7px;border-radius:4px;background:linear-gradient(180deg,#3a2a14,#120c04);animation:ventbreathe 3s ease-in-out infinite;box-shadow:inset 0 0 6px rgba(255,160,60,.6)}
@keyframes ventbreathe{0%,100%{box-shadow:inset 0 0 6px rgba(255,160,60,.4)}50%{box-shadow:inset 0 0 12px rgba(255,160,60,.95)}}
.vents::after{content:"";position:absolute;left:10%;right:10%;bottom:-8px;height:14px;background:radial-gradient(60% 100% at 50% 50%,rgba(255,140,50,.4),transparent);filter:blur(8px)}
.powerwrap{display:flex;align-items:center;gap:14px}
.power{
  width:64px;height:30px;border-radius:99px;border:none;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#efe2c4,#d9c79f);box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.5);
  font-family:inherit;font-size:11px;letter-spacing:.14em;color:#3a2a14;text-transform:uppercase;
}
.power[aria-pressed="true"]{background:linear-gradient(180deg,#ffe9c4,#e8c47f);box-shadow:inset 0 2px 4px rgba(0,0,0,.2),0 0 16px rgba(255,179,71,.5)}
.powlabel{font-size:9px;letter-spacing:.2em;color:rgba(239,226,196,.5);text-transform:uppercase}
@media(max-width:640px){
  .radio{padding:22px 14px}
  .knobrow{grid-template-columns:1fr;gap:10px}
  .vents{display:none}
  .grille{min-height:120px}
}
@media(prefers-reduced-motion:reduce){.dial .glow{animation:none}.vents .slot{animation:none}}
</style>
</head>
<body>
<p class="brandline">Marconi Meridian 55 · 1955</p>
<div class="radio">
  <div class="face">
    <!-- dial -->
    <div class="dial">
      <div class="glow"></div>
      <div class="bandlbl">MW</div>
      <div class="freqs"><span>600</span><span>700</span><span>800</span><span>900</span><span>1000</span><span>1100</span><span>1200</span><span>1300</span><span>1400</span><span>1500</span></div>
      <div class="ticks"></div>
      <div class="cities"><span class="city">Madrid</span><span class="city">Luxembourg</span><span class="city">Hilversum</span><span class="city">Paris</span><span class="city">Lisbon</span><span class="city">Vienna</span></div>
      <div class="cities l2"><span class="city">Stockholm</span><span class="city">Athens</span><span class="city">Warsaw</span><span class="city">Oslo</span></div>
      <div class="needle" id="needle"></div>
    </div>

    <div class="bodyrow">
      <div class="grille">
        <div class="cloth"></div>
        <svg class="emblem" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="#c9a97a" stroke-width="2"/>
          <circle cx="40" cy="40" r="28" fill="none" stroke="#c9a97a" stroke-width="1"/>
          <path d="M40 12 L68 40 L40 68 L12 40 Z" fill="#a3835a"/>
          <text x="40" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#efe2c4">M</text>
        </svg>
      </div>
      <div class="display">
        <canvas id="noiseCv"></canvas>
        <div class="stationcard" id="stationCard">
          <span class="lock">● LOCKED</span>
          <div class="sc" id="stName">Madrid</div>
          <div class="fr" id="stFreq">738 kHz</div>
          <div class="pr" id="stProg">Tonight: the zarzuela hour, straight from the Teatro Real.</div>
        </div>
        <div class="searching" id="searching">searching</div>
        <div class="vurow">
          <div class="vu">
            <svg viewBox="0 0 200 40">
              <path d="M10 34 A 90 90 0 0 1 190 34" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
              <g stroke="rgba(0,0,0,.4)" stroke-width="1">
                <line x1="44" y1="34" x2="48" y2="30"/><line x1="54" y1="34" x2="58" y2="30"/>
                <line x1="144" y1="34" x2="148" y2="30"/><line x1="154" y1="34" x2="158" y2="30"/>
              </g>
              <path d="M105 34 A 65 65 0 0 1 170 30" fill="none" stroke="#c8322a" stroke-width="2" opacity=".8"/>
              <g id="vuNeedle">
                <line x1="100" y1="34" x2="100" y2="14" stroke="#1c1108" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="100" cy="34" r="3" fill="#1c1108"/>
              </g>
              <text x="80" y="11" font-family="monospace" font-size="8" fill="rgba(0,0,0,.5)">-20</text>
              <text x="150" y="11" font-family="monospace" font-size="8" fill="rgba(0,0,0,.5)">0</text>
            </svg>
          </div>
          <span class="vulabel">VU</span>
        </div>
      </div>
    </div>

    <div class="knobrow">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="volk" id="volKnob" tabindex="0" role="slider" aria-label="Volume" aria-valuenow="7" aria-valuemin="0" aria-valuemax="10"><div class="knobcap" style="--ka:${8*36}deg"></div></div>
        <div class="knlbl">Volume</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="vents" id="vents"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div>
        <div class="powerwrap" style="justify-content:center"><button class="power" id="powerBtn" aria-pressed="false">Power</button><span class="powlabel">valves warming</span></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="tunek" id="tuneKnob" tabindex="0" role="slider" aria-label="Tuning" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div class="knobcap" style="--ka:0deg"></div></div>
        <div class="knlbl">Tuning</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stations=[
    {name:"Madrid",f:"738 kHz",x:0.08,p:"Tonight: the zarzuela hour, straight from the Teatro Real."},
    {name:"Luxembourg",f:"1431 kHz",x:0.18,p:"A continental dance band; the announcer speaks four languages badly."},
    {name:"Hilversum",f:"675 kHz",x:0.27,p:"Dutch strings and the shipping forecast, read like a psalm."},
    {name:"Paris",f:"864 kHz",x:0.37,p:"Chanson after chanson; the applause is recorded, the melancholy is not."},
    {name:"Lisbon",f:"1296 kHz",x:0.46,p:"Fado from the Alfama — the radio equivalent of a lit window."},
    {name:"Vienna",f:"585 kHz",x:0.56,p:"A waltz orchestrion, then the news, read as if it were a waltz."},
    {name:"Stockholm",f:"702 kHz",x:0.66,p:"Winter jazz; between tracks, the sea keeps itself company."},
    {name:"Athens",f:"729 kHz",x:0.76,p:"Rebetiko records, slightly hissy, entirely necessary."},
    {name:"Warsaw",f:"1143 kHz",x:0.86,p:"A piano concerto lapping against the static."},
    {name:"Oslo",f:"950 kHz",x:0.945,p:"Fjord silence with occasional oboe — the last stop before the dark band."}
  ];
  var tune=0.5,vol=0.7,locked=-1;
  var noiseCv=document.getElementById("noiseCv"),nctx=noiseCv.getContext("2d");
  var NW=0,NH=0;
  function fitNoise(){
    var r=noiseCv.parentElement.getBoundingClientRect();
    NW=r.width;NH=r.height*0.72;
    noiseCv.width=NW;noiseCv.height=NH;
  }
  window.addEventListener("resize",fitNoise);fitNoise();
  function updateTune(){
    var needle=document.getElementById("needle");
    needle.style.left=(8+82*tune)+"%";
    // station lock
    var found=-1;
    for(var i=0;i<stations.length;i++){
      var sx=8+82*stations[i].x;
      if(Math.abs((tune*100)-(stations[i].x*100))<3.2){found=i;break}
    }
    locked=found;
    // cities highlight
    document.querySelectorAll(".city").forEach(function(c,j){c.classList.toggle("on",j===found)});
    var card=document.getElementById("stationCard"),search=document.getElementById("searching");
    if(found>=0){
      search.classList.remove("show");
      card.querySelector("#stName").textContent=stations[found].name;
      card.querySelector("#stFreq").textContent=stations[found].f;
      card.querySelector("#stProg").textContent=stations[found].p;
      card.classList.add("show");
    }else{
      card.classList.remove("show");
      search.classList.add("show");
    }
  }
  // noise render
  var scanY=0;
  function drawNoise(){
    var img=nctx.createImageData(Math.max(1,Math.floor(NW/2)),Math.max(1,Math.floor(NH/2)));
    for(var i=0;i<img.data.length;i+=4){
      if(locked>=0&&Math.random()<0.92){
        var v=16;
        img.data[i]=v;img.data[i+1]=8;img.data[i+2]=4;
      }else{
        var n=Math.random()*90;
        img.data[i]=120+n*0.4;img.data[i+1]=74+n*0.3;img.data[i+2]=30+n*0.15;
      }
      img.data[i+3]=255;
    }
    nctx.clearRect(0,0,NW,NH);
    nctx.imageSmoothingEnabled=true;
    nctx.drawImage(nctx.canvas===noiseCv?noiseCv:noiseCv,0,0);
    // simpler: put scaled
    var temp=document.createElement("canvas");
    temp.width=img.width;temp.height=img.height;
    temp.getContext("2d").putImageData(img,0,0);
    nctx.drawImage(temp,0,0,NW,NH);
    // scan band
    scanY+= (RM?4:14);
    if(scanY>NH)scanY=0;
    var g=nctx.createLinearGradient(0,scanY-20,0,scanY+20);
    g.addColorStop(0,"rgba(255,200,120,0)");
    g.addColorStop(.5,"rgba(255,200,120,.14)");
    g.addColorStop(1,"rgba(255,200,120,0)");
    nctx.fillStyle=g;nctx.fillRect(0,scanY-20,NW,40);
    // vu needle
    var base=locked>=0?0.5+0.35*Math.sin(performance.now()/800):0.15+Math.random()*0.5;
    var nd=document.getElementById("vuNeedle");
    var ang=base*(42)-21;
    nd.setAttribute("transform","rotate("+(-ang)+" 100 34)");
  }
  // knobs
  function knobDrag(el,cb){
    var start=null;
    el.addEventListener("pointerdown",function(e){
      start={y:e.clientY,val:cb(0,true)};
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove",function(e){
      if(!start)return;
      var v=Math.max(0,Math.min(1,start.val-(e.clientY-start.y)/180));
      cb(v,false);
    });
    el.addEventListener("pointerup",function(){start=null});
    el.addEventListener("wheel",function(e){
      e.preventDefault();
      cb(cb(0,true)+(e.deltaY<0?0.02:-0.02),false);
    });
    el.addEventListener("keydown",function(e){
      if(e.key==="ArrowUp"){e.preventDefault();cb(cb(0,true)+0.04,false)}
      if(e.key==="ArrowDown"){e.preventDefault();cb(cb(0,true)-0.04,false)}
    });
  }
  function updateVolume(v){
    vol=v;
    document.getElementById("volKnob").querySelector(".knobcap").style.setProperty("--ka",(-135+v*270)+"deg");
    if(vol<=0)document.getElementById("powerBtn").click();
  }
  knobDrag(document.getElementById("volKnob"),function(v,get){
    if(get)return vol;
    updateVolume(v);
    return vol;
  });
  knobDrag(document.getElementById("tuneKnob"),function(v,get){
    if(get)return tune;
    tune=v;
    document.getElementById("tuneKnob").querySelector(".knobcap").style.setProperty("--ka",(-135+v*270)+"deg");
    updateTune();
    return tune;
  });
  // power + web audio
  var AC=null,audioGain=null;
  var powerBtn=document.getElementById("powerBtn");
  powerBtn.addEventListener("click",function(){
    var on=this.getAttribute("aria-pressed")==="true"?"false":"true";
    this.setAttribute("aria-pressed",on);
    if(on==="true"&&!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      audioGain=AC.createGain();audioGain.gain.value=0;
      audioGain.connect(AC.destination);
      // mains hum
      var hum=AC.createOscillator();hum.frequency.value=50;
      var hum2=AC.createOscillator();hum2.type="triangle";hum2.frequency.value=100;
      var humG=AC.createGain();humG.gain.value=0.02;
      hum.connect(humG);hum2.connect(humG);humG.connect(audioGain);
      hum.start();hum2.start();
      // noise
      var bufferSize=2*AC.sampleRate;
      var buffer=AC.createBuffer(1,bufferSize,AC.sampleRate);
      var ch=buffer.getChannelData(0);
      for(var i=0;i<bufferSize;i++)ch[i]=Math.random()*2-1;
      var noise=AC.createBufferSource();noise.buffer=buffer;noise.loop=true;
      var noiseG=AC.createGain();noiseG.gain.value=0.03;
      noise.connect(noiseG);noiseG.connect(audioGain);
      noise.start();
      // pad for station
      padNode={};
      padNode.osc=AC.createOscillator();padNode.osc.frequency.value=220;
      padNode.lfo=AC.createOscillator();padNode.lfo.frequency.value=0.4;
      padNode.lfoG=AC.createGain();padNode.lfoG.gain.value=6;
      padNode.lfo.connect(padNode.lfoG);padNode.lfoG.connect(padNode.osc.frequency);
      padNode.pG=AC.createGain();padNode.pG.gain.value=0;
      padNode.osc.connect(padNode.pG);padNode.pG.connect(audioGain);
      padNode.osc.start();padNode.lfo.start();
    }
  });
  setInterval(function(){
    if(AC){
      var sig=locked>=0?0:vol;
      audioGain.gain.setTargetAtTime((1-vol)*0.0+ (powerBtn.getAttribute("aria-pressed")==="true"?0.04*vol:0),AC.currentTime,0.2);
      if(padNode.pG){
        padNode.pG.gain.setTargetAtTime(locked>=0?0.1*vol:0,AC.currentTime,1);
      }
    }
  },400);
  var padNode=null;
  // main loop
  setInterval(drawNoise, RM?200:50);
  updateTune();
  updateVolume(0.7);
  if(RM)drawNoise();
