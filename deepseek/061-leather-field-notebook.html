<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIELD NOTEBOOK — The Saltmarsh Walk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.015) 9px 13px),
  radial-gradient(70% 60% at 50% -10%,rgba(230,200,150,.12),transparent 60%),linear-gradient(180deg,#2a2118,#1c150e);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 16px 90px;
  font-family:Georgia,'Iowan Old Style',Palatino,serif;color:#d9cbb0;
}
.hd{text-align:center;margin-bottom:26px}
.hd .en{font-family:Georgia,serif;letter-spacing:.26em;font-size:12px;text-transform:uppercase;color:rgba(217,203,176,.7)}
.hd .hint{font-style:italic;font-size:13.5px;color:rgba(217,203,176,.55);margin-top:8px}
/* book scene */
.scene{position:relative;width:min(1080px,96vw);perspective:2200px}
.book{position:relative;width:100%;transform-style:preserve-3d;transform:rotateX(6deg);transition:transform .4s ease}
/* cover */
.cover{
  position:absolute;left:25%;top:0;width:75%;height:100%;transform-origin:left center;z-index:8;
  background:
    radial-gradient(60% 30% at 28% 8%,rgba(255,255,255,.16),transparent 60%),
    radial-gradient(60% 40% at 75% 95%,rgba(0,0,0,.5),transparent 70%),
    repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.015) 0 2px,transparent 2px 5px),
    linear-gradient(115deg,#7a4423,#6b3a1e 40%,#4a2410 80%,#2e1608);
  border-radius:10px 6px 6px 10px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.35);
  transition:transform 1.2s cubic-bezier(.65,.05,.36,1);
  padding:34px 30px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.cover::before{content:"";position:absolute;inset:12px;border:2px dashed #d9b98a;border-radius:6px;opacity:.7}
.cover .title{font-size:clamp(26px,3.4vw,44px);color:#3a1d0a;letter-spacing:.22em;text-transform:uppercase;
  text-shadow:1px 1px 0 rgba(255,255,255,.14),-1px -1px 0 rgba(0,0,0,.55);text-align:center}
.cover .orn{width:160px;height:1px;background:linear-gradient(90deg,transparent,#5a3418,#d9b98a,#5a3418,transparent);margin:16px 0 12px;
  box-shadow:0 1px 0 rgba(255,255,255,.12)}
.cover .sub{font-size:13px;color:#4a2a12;letter-spacing:.3em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(255,255,255,.1)}
.cover.clickable{cursor:pointer}
/* inner cover */
.inside{
  position:absolute;right:0;top:0;width:75%;height:100%;background:linear-gradient(135deg,#4a2a14,#2e1808);
  border-radius:4px 10px 10px 4px;z-index:1;
  box-shadow:inset 0 0 40px rgba(0,0,0,.5);
}
.inside .pocket{position:absolute;right:26px;top:40px;width:200px;height:240px;
  background:linear-gradient(180deg,#3a2010,#2a1608);border-radius:4px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4)}
.ifound{position:absolute;right:44px;top:52px;width:158px;background:#efe4cd;color:#3a2a18;border-radius:3px;
  padding:46px 14px 12px;text-align:center;transform:rotate(2.5deg);box-shadow:0 10px 24px rgba(0,0,0,.55);z-index:2}
.ifound b{display:block;font-size:9px;letter-spacing:.32em;text-transform:uppercase}
.ifound .st{font-size:11px;line-height:1.4;margin-top:8px;opacity:.7;font-style:italic}
/* elastic */
.elastic{position:absolute;left:1.2%;top:0;bottom:0;width:4.5%;z-index:20;
  background:linear-gradient(90deg,rgba(0,0,0,.4),#1a1008 40%,#382614 55%,rgba(0,0,0,.5));
  box-shadow:0 0 14px rgba(0,0,0,.6);transition:opacity 1s .3s,transform 1s .3s;border-radius:3px}
.book.open .elastic{opacity:0;transform:translateX(-40px)}
/* pages */
.pages{position:absolute;right:0;top:0;width:75%;height:100%;transform-style:preserve-3d;z-index:2}
.page-sheet{
  position:absolute;left:0;right:0;top:0;bottom:0;transform-style:preserve-3d;transform-origin:left center;
  transition:transform 1.1s cubic-bezier(.6,.05,.3,1),z-index 0s;cursor:pointer;
}
.page-sheet .pg{
  position:absolute;inset:0;background:linear-gradient(90deg,#eadfc6,#f4ead6 8%,#f4ead6);
  border-radius:2px 8px 8px 2px;
  box-shadow:inset 0 0 40px rgba(120,90,40,.12),inset -14px 0 30px rgba(60,40,10,.14),0 2px 6px rgba(0,0,0,.3);
  overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(120,140,180,.35) 27px 28px);
  transform-origin:left center;
}
.page-sheet .pg.front{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.page-sheet .pg.back{transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(120,140,180,.35) 27px 28px),linear-gradient(270deg,rgba(60,40,10,.1),transparent)}
.page-sheet .pg::before{content:"";position:absolute;top:0;bottom:0;left:64px;width:1px;background:rgba(180,40,40,.55)}
.page-sheet .pg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 60% at 100% 50%,rgba(80,60,20,.1),transparent 70%)}
.turnshadow{position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,20,5,.2),transparent 60%);opacity:0;pointer-events:none;z-index:5;transition:opacity .4s}
.page-sheet.turning .turnshadow{opacity:1}
.corner-tab{position:absolute;right:10px;bottom:8px;width:0;height:0;border-left:18px solid transparent;border-bottom:18px solid rgba(140,110,60,.35);pointer-events:none;transition:transform .3s}
.page-sheet:hover .corner-tab{transform:scale(1.25)}
/* writing */
.page-content{position:absolute;inset:0;padding:40px 70px 40px 90px;transform:translateZ(0)}
.page-content .date{font-size:13px;color:#1f3a6e;border-bottom:1.5px dotted rgba(31,58,110,.6);display:inline-block;padding-bottom:2px;margin-bottom:12px}
.page-content p{color:#1f3a6e;font-family:'Segoe Script','Bradley Hand','Brush Script MT','Snell Roundhand','Apple Chancery','Lucida Handwriting',cursive;
  font-size:clamp(15px,1.7vw,19px);line-height:27px;margin-bottom:10px}
.page-content p.tilt-l{transform:rotate(-.6deg)}
.page-content p.tilt-r{transform:rotate(.7deg)}
.page-content .pencil{color:#5a5148;font-style:italic;font-size:.92em}
.ephem{position:relative}
.polaroid{position:relative;display:inline-block;background:#fbf6ea;padding:8px 8px 30px;margin:6px 0 10px;transform:rotate(-2deg);
  box-shadow:0 8px 24px rgba(40,30,10,.35);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.polaroid:hover{transform:rotate(0) translateY(-4px)}
.polaroid .tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);width:80px;height:24px;
  background:rgba(255,236,170,.5);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.polaroid .photo{width:170px;height:130px;
  background:linear-gradient(180deg,#a8c4d8 0%,#d8e4ec 40%,#e8dcc0 42%,#7fa8b0 55%,#c9b48a 56%,#d9c9a8 100%)}
.polaroid .cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#1f3a6e;font-size:11px}
/* stain */
.stain{position:absolute;border-radius:50%;border:6px solid rgba(120,80,30,.12);outline:1px solid rgba(120,80,30,.06);outline-offset:3px;opacity:.6}
.stain.s1{width:70px;height:70px;left:-20px;bottom:40px;transform:rotate(14deg)}
.stain.s2{width:40px;height:40px;right:30px;top:60px;transform:rotate(-8deg)}
.inkblot{position:absolute;width:16px;height:12px;background:rgba(30,40,120,.8);border-radius:50% 60% 50% 40%;
  transform:rotate(20deg);opacity:.75}
/* controls */
.controls{display:flex;gap:14px;align-items:center;margin-top:26px;flex-wrap:wrap;justify-content:center}
.pnav{background:linear-gradient(180deg,#7a4a28,#4a2a12);color:#e8dcc0;border:none;border-radius:8px;
  font-family:Georgia,serif;font-size:14px;padding:12px 22px;cursor:pointer;
  box-shadow:0 4px 0 #2a1608,0 8px 18px rgba(0,0,0,.5);transition:all .15s}
.pnav:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1608}
.dots2{display:flex;gap:8px}
.dots2 i{width:9px;height:9px;border-radius:50%;background:rgba(217,203,176,.3);cursor:pointer;transition:all .3s}
.dots2 i.on{background:#e7b95a;transform:scale(1.3)}
.status{font-style:italic;font-size:13px;color:rgba(217,203,176,.65)}
@media(max-width:720px){
  .cover{padding:20px 14px}
  .inside .pocket,.ifound{display:none}
  .page-content{padding:30px 26px 30px 44px}
}
@media(prefers-reduced-motion:reduce){.cover,.page-sheet,.polaroid{transition:none}.book{transform:none}}
</style>
</head>
<body>
<div class="hd">
  <div class="en">Field Notebook</div>
  <div class="hint">click the cover to open · tap page corners to turn</div>
</div>

<div class="scene" id="scene">
  <div class="book" id="book">
    <div class="inside"><div class="pocket"></div></div>
    <div class="pages" id="pages"></div>
    <div class="cover clickable" id="cover">
      <div class="title">Field Notes</div>
      <div class="orn"></div>
      <div class="sub">The Saltmarsh Walk · Vol. III</div>
    </div>
    <div class="elastic"></div>
  </div>
</div>

<div class="controls">
  <button class="pnav" id="backBtn">◂ Back</button>
  <div class="dots2" id="pageDots"></div>
  <button class="pnav" id="nextBtn">Next ▸</button>
  <span class="status" id="status">Spread 1 of 4</span>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // spreads: 4 spreads, 2 pages each = 8 pages
  var pages=[
    {date:"Sat 12 Sep, misted harbour",
     html:'<p>We set out before the ebb, the harbour breathing slow and grey. The tide was a held breath; the gulls did nothing to help.</p><p class="tilt-r">Seven egrets on the mudflats, standing like punctuation that has forgotten its sentence.</p><p class="pencil">oystercatchers: three, calling in pairs, refusing to be photographed.</p>'},
    {date:"Sat 12 Sep · afternoon",
     html:'<p>The wreck on the shingle spit is down to a ribcage and a nameplate. The nameplate says none of the things the wreck would say.</p><p class="tilt-l">Seals on the sandbank arranged like commas in a slow sentence — a full stop at the end, watching me.</p><p class="pencil">count: 9. distance: forty yards. patience: theirs.</p>'},
    {date:"Sun 13 Sep · estuary",
     html:'<p>A metal-detectorist in the dunes explained the whole beach as a ledger we do not remember keeping. I believed him instantly and for free.</p>'+
     '<div class="polaroid"><span class="tape"></span><div class="photo"></div><div class="cap">the sandbar, from the dune path</div></div>'+
     '<p class="tilt-r">Sea lavender pressed between the tide tables. It will keep its colour longer than I will keep this pencil.</p>', stain:true},
    {date:"Sun 13 Sep · dusk",
     html:'<p>Redshank and curlew trading places across the saltmarsh like a conversation conducted entirely in doorways.</p><p>The light went amber, then plum, then gave up and let the moon finish the page.</p>'+
     '<p class="pencil">curlew: nine. redshank: more than I could count, which is the honest answer.</p>',
     blot:true},
    {date:"Mon 14 Sep · low tide, 6:41",
     html:'<p>Sea kale at the driffline, holding the beach together by sheer stubbornness. I ate one leaf—by advice—it tasted of the sea answering a letter.</p><p class="tilt-l">Stones skipped until the light arrived; I owe the last four skips to nothing but practice.</p>'},
    {date:"Mon 14 Sep · notes",
     html:'<p><b style="font-style:italic">to remember:</b></p><p class="pencil">— the tide does not wait for the sentence to finish</p><p class="pencil">— saltmarsh in October is the colour of damp tea</p><p class="pencil">— always take the second thermos</p><p class="pencil">— the seals will be there. they always are.</p>',
     blot:true},
    {date:"Tue 15 Sep · last walk",
     html:'<p>One last circuit, barefoot where the sand was warm. Bought a postcard of the lighthouse, addressed it to myself, wrote nothing on the back.</p>'+
     '<svg class="ephem" width="180" height="90" viewBox="0 0 180 90" style="display:block;margin:8px auto"><g fill="#c98f5a" opacity=".8"><ellipse cx="30" cy="70" rx="9" ry="14" transform="rotate(24 30 70)"/><ellipse cx="36" cy="64" rx="9" ry="10"/><ellipse cx="42" cy="70" rx="7" ry="12" transform="rotate(-20 42 70)"/></g><g fill="#9a7ccf" opacity=".85"><circle cx="100" cy="40" r="4"/><circle cx="112" cy="34" r="3.4"/><circle cx="124" cy="42" r="3.8"/><circle cx="106" cy="52" r="3"/><circle cx="118" cy="50" r="3.4"/></g><g fill="#e88ba4"><ellipse cx="150" cy="66" rx="8" ry="11" transform="rotate(12 150 66)"/><ellipse cx="160" cy="70" rx="7" ry="10" transform="rotate(-14 160 70)"/></g></svg>'+
     '<p class="pencil">filed: sea lavender, one pebble, the postcard. the pebble is the loudest.</p>'},
    {date:"things to remember",
     html:'<p class="pencil">the tides &amp; the bus times are the only clocks that matter<br>the seals are commas, the curlew is the full stop<br>the beach keeps the ledger; we only hold the pencil<br>output: walk. input: sea. balance: kept.</p>'}
  ];
  function build(){
    var pagesEl=document.getElementById("pages");
    pagesEl.innerHTML="";
    // 8 sheets (4 spreads x right/left?) — we model each page as a sheet: sheet i front=page i, back=page i+1? Simplest: 8 single sheets stacked, only right half visible at a time
    pages.forEach(function(p,i){
      var d=document.createElement("div");
      d.className="page-sheet";d.dataset.i=i;d.tabIndex=0;
      var stain=p.stain?'<span class="stain s1"></span>':"";
      var blot=p.blot?'<span class="inkblot" style="left:60%;top:30%"></span>':"";
      d.innerHTML='<div class="pg front"><div class="page-content"><div class="date">'+p.date+'</div>'+p.html+stain+blot+'<div class="corner-tab"></div></div>'+
        '<div class="turnshadow"></div></div>'+
        '<div class="pg back"><div class="page-content">'+(pages[i+1]||pages[0]).html+'<div class="corner-tab"></div></div>'+
        '<div class="turnshadow"></div></div>';
      pagesEl.appendChild(d);
    });
    // z-orders
    setZ();
  }
  var current=0; // top sheet index
  function setZ(){
    document.querySelectorAll(".page-sheet").forEach(function(s,i){
      if(i===current)s.style.zIndex=10;
      else if(i<current)s.style.zIndex=i+2;
      else s.style.zIndex=20-i;
      s.style.transform=i>current?"":i===current?"":"";
    });
  }
  function nextPage(){
    if(current>=pages.length-1)return;
    var s=document.querySelectorAll(".page-sheet")[current];
    s.classList.add("turning");
    s.style.transform="rotateY(-180deg)";
    s.style.zIndex=30;
    s.style.pointerEvents="none";
    setTimeout(function(){
      s.classList.remove("turning");
      s.style.transform="";s.style.zIndex=1;s.style.pointerEvents="";
      current++;
      setZ();
      updateStatus();
    },RM?10:1100);
  }
  function backPage(){
    if(current<=0)return;
    var prev=current-1;
    var s=document.querySelectorAll(".page-sheet")[prev];
    s.style.zIndex=40;
    s.style.transform="rotateY(-180deg)";
    s.style.pointerEvents="none";
    requestAnimationFrame(function(){
      setTimeout(function(){
        s.classList.add("turning");
        s.style.transition="transform 1.1s cubic-bezier(.6,.05,.3,1)";
        s.style.transform="";
        setTimeout(function(){
          s.classList.remove("turning");
          s.style.zIndex=10;s.style.pointerEvents="";
          current=prev;
          setZ();
          updateStatus();
        },RM?10:1100);
      },50);
    });
  }
  function updateStatus(){
    document.getElementById("status").textContent="Spread "+Math.floor(current/2+1)+" of "+Math.ceil(pages.length/2);
    document.querySelectorAll("#pageDots i").forEach(function(d,i){
      d.classList.toggle("on",Math.floor(i/2)===Math.floor(current/2));
    });
  }
  // cover open
  var book=document.getElementById("book"),cover=document.getElementById("cover");
  var opened=false;
  cover.addEventListener("click",function(){
    if(!opened){
      opened=true;
      cover.style.transform="rotateY(-178deg) translateZ(2px)";
      book.classList.add("open");
      setTimeout(function(){cover.classList.remove("clickable");cover.style.pointerEvents="none"},RM?10:900);
      statusUpdateOpen();
    }
  });
  function statusUpdateOpen(){updateStatus()}
  // nav
  document.getElementById("nextBtn").addEventListener("click",nextPage);
  document.getElementById("backBtn").addEventListener("click",backPage);
  // keyboard/swipe
  window.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight")nextPage();
    if(e.key==="ArrowLeft")backPage();
    if(e.key==="Enter"&&!opened)cover.click();
  });
  var txs=0,txe=0;
  document.getElementById("scene").addEventListener("pointerdown",function(e){
    var r=document.getElementById("scene").getBoundingClientRect();
    var x=e.clientX-r.left;
    if(x>r.width*0.75)txs=x;
  });
  document.getElementById("scene").addEventListener("pointerup",function(e){
    var r=document.getElementById("scene").getBoundingClientRect();
    if(txs&&e.clientX-r.left<txs-40)nextPage();
    txs=0;
  });
  // tilt toward mouse
  var scene=document.getElementById("scene");
  if(matchMedia("(pointer:fine)").matches&&!RM){
    scene.addEventListener("pointermove",function(e){
      var r=scene.getBoundingClientRect();
      var dx=(e.clientX-r.left)/r.width-0.5,dy=(e.clientY-r.top)/r.height-0.5;
      book.style.transform="rotateX("+(6-dy*4)+"deg) rotateY("+dx*6+"deg)";
    });
    scene.addEventListener("pointerleave",function(){book.style.transform="rotateX(6deg)"});
  }
  // dots
  var dots=document.getElementById("pageDots");
  for(var i=0;i<8;i++){
    var d=document.createElement("i");
    d.dataset.p=i;
    d.onclick=function(){
      while(current<+this.dataset.p)nextPage();
      while(current>+this.dataset.p)backPage();
    };
    dots.appendChild(d);
  }
  build();
  setZ();
  updateStatus();
})();
</script>
</body>
</html>
