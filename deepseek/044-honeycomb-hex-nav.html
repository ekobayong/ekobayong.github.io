<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apiary Studio — A Comb of Work</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(80% 70% at 30% 0%,#4a2606,transparent 70%),
  radial-gradient(70% 60% at 100% 100%,#2a1604,transparent 70%),
  radial-gradient(100% 100% at 50% 50%,#2a1604,#150a02);
  overflow:hidden;height:100vh;color:#f3e6c8;
  font-family:'Iowan Old Style',Palatino,Georgia,serif;
  perspective:1200px;
}
.sweep{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:screen;
  background:linear-gradient(112deg,transparent 0%,rgba(255,210,122,.16) 30%,rgba(255,240,200,.5) 50%,rgba(255,210,122,.16) 70%,transparent 100%);
  background-size:250% 100%;
  animation:sweepglide 14s ease-in-out infinite}
@keyframes sweepglide{0%{background-position:120% 0}50%{background-position:-20% 0}100%{background-position:120% 0}}
.comb{position:fixed;inset:0;z-index:2;transform-style:preserve-3d}
.hex{
  position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(150deg,#6b3a0a,#3d2005 70%);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s cubic-bezier(.2,.8,.2,1);
  cursor:default;
}
.hex::before{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,rgba(255,255,255,.09),transparent 40%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex::after{content:"";position:absolute;inset:3px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  border:1px solid rgba(255,220,150,.12);background:none}
/* nav hexes */
.hex.nav{
  background:linear-gradient(165deg,#f0a83a,#c47a18 80%);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:#1c0f03;
}
.hex.nav::before{background:radial-gradient(60% 50% at 40% 25%,rgba(255,255,255,.35),transparent 70%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex.nav:hover{filter:brightness(1.12)}
.hex.nav:focus{outline:none;filter:brightness(1.15);box-shadow:0 0 0 2px rgba(255,235,180,.7)}
.hex.nav svg{width:30%;height:30%;stroke:#1c0f03;fill:none;stroke-width:1.6}
.hex.nav .lbl{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
/* brand */
.brand{position:fixed;top:26px;left:30px;z-index:20;pointer-events:none}
.brand h1{font-size:clamp(26px,3vw,36px);font-weight:400;letter-spacing:.02em}
.brand h1 em{font-style:italic;color:rgba(255,180,80,.9)}
.brand p{font-family:ui-sans-serif,system-ui;font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(243,230,200,.5);margin-top:6px}
.hintline{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;
  font-family:ui-sans-serif,system-ui;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,230,200,.55);
  transition:opacity .6s}
/* panel */
.panel{
  position:fixed;z-index:30;background:linear-gradient(165deg,#f0a83a,#c47a18);
  color:#1c0f03;padding:40px 46px;box-shadow:0 50px 120px rgba(0,0,0,.6);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  overflow:hidden;
  transition:all .7s cubic-bezier(.2,.8,.2,1);
  visibility:hidden;
  display:flex;
}
body.panelopen .comb{filter:brightness(.22);transition:filter .5s}
body.panelopen .comb .hex{transform:translateZ(-60px)!important}
.panel.open{
  visibility:visible;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);border-radius:24px;
  left:50%!important;top:50%!important;width:min(880px,90vw)!important;height:auto!important;
  transform:translate(-50%,-50%) scale(1)!important;
}
.panel .content{opacity:0;transition:opacity .5s ease .35s;max-width:760px}
.panel.open .content{opacity:1}
.panel .kicker{font-family:ui-sans-serif,system-ui;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(28,15,3,.65);margin-bottom:14px}
.panel h2{font-size:clamp(34px,5vw,64px);font-weight:400;letter-spacing:.01em;line-height:1;margin-bottom:18px}
.panel .body p{font-size:16.5px;line-height:1.7;color:rgba(28,15,3,.85);margin-bottom:12px;max-width:66ch}
.panel .tags{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.panel .tags span{display:flex;align-items:center;gap:7px;font-family:ui-sans-serif,system-ui;font-size:12px;letter-spacing:.06em;color:rgba(28,15,3,.8)}
.panel .tags .hx{width:10px;height:10px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#1c0f03;flex:none}
.close{
  position:absolute;top:24px;right:28px;width:46px;height:46px;border-radius:50%;border:2px solid rgba(28,15,3,.5);
  background:none;color:#1c0f03;font-size:20px;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  opacity:0;pointer-events:none;z-index:5;
}
.panel.open .close{opacity:1;pointer-events:auto}
.close:hover{transform:rotate(90deg)}
.scrim{position:fixed;inset:0;background:rgba(10,5,0,.55);opacity:0;pointer-events:none;transition:opacity .5s;z-index:25}
body.panelopen .scrim{opacity:1}
@media(max-width:640px){
  .hintline{display:none}
  .brand{top:16px;left:18px}
  .panel{padding:26px 22px}
  .panel h2{font-size:32px}
  .panel .body p{font-size:14.5px}
}
@media(prefers-reduced-motion:reduce){.sweep{animation:none}.hex{transition:none}}
</style>
</head>
<body>
<div class="sweep"></div>
<div class="comb" id="comb"></div>
<div class="scrim" id="scrim"></div>
<div class="brand">
  <h1>Apiary <em>Studio</em></h1>
  <p>a design practice · work by the cell</p>
</div>
<div class="hintline" id="hint">six cells · choose one</div>

<div class="panel" id="panel">
  <button class="close" id="closeBtn" aria-label="Close">✕</button>
  <div class="content">
    <div class="kicker" id="pKick"></div>
    <h2 id="pTitle"></h2>
    <div class="body" id="pBody"></div>
    <div class="tags" id="pTags"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var content={
    Work:[
      "Work",
      "Cell 01 · Notes from the comb",
      "Apiary makes quiet things that hold a lot: annual reports that read like field guides, identity systems built from one good hexagon, and digital products that do not apologize for being calm. The studio runs on craftsmanship, crosswords, and an unreasonable fondness for margins.",
      ["Identity systems","Annual reports","Digital products"]
    ],
    Studio:[
      "Studio",
      "Cell 02 · The hive",
      "Eight designers, two writers and one very old beagle work from a first-floor atelier with windows on three sides. We take on a dozen projects a year and not one more. The work is better, and so is the honey.",
      ["8 designers","12 projects / year","Kyoto"]
    ],
    Journal:[
      "Journal",
      "Cell 03 · Notes from the comb",
      "Three short essays a month on the things we are thinking about: why every logo eventually becomes a hexagon, how to make a grid feel generous, and what bees can teach an art director about delegation.",
      ["Essays","Field notes","Reading lists"]
    ],
    Lab:[
      "Lab",
      "Cell 04 · Experiments",
      "The Apiary Lab is where we break our own rules on purpose: generative type, folded paper structures, and software that draws itself. Everything in the lab is released — you may keep whatever hatches.",
      ["Generative type","Paper structures","Open experiments"]
    ],
    People:[
      "People",
      "Cell 05 · The colony",
      "Led by founding partner Maren Halvorsen, the colony includes typographers, coders and one illustrator who only draws bees. Everyone here is also something else — a sailor, a beekeeper, a night-cook — because the best ideas arrive from the other life.",
      ["Maren Halvorsen","8 collaborators","Always hiring slowly"]
    ],
    Contact:[
      "Contact",
      "Cell 06 · Visitors welcome",
      "Drop by the atelier on Kiyamachi — the door with the bronze hive. Or write to hello@apiary.studio; the reply arrives within a day, usually with a drawing attached. Bees welcome; smoke not necessary.",
      ["hello@apiary.studio","Kyoto · Kiyamachi","+81 75 000 000"]
    ]
  };
  var icons={
    Work:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M9 7V5h6v2M3 12h18"/></svg>',
    Studio:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9M10 19v-5h4v5"/></svg>',
    Journal:'<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 3v15M11 8h6M11 12h6"/></svg>',
    Lab:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 11a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3L14 9V3"/><path d="M7.5 15h9"/></svg>',
    People:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c1-4 3-6 6-6s5 2 6 6M16 5a3.2 3.2 0 0 1 0 6M18 14c1.6.9 2.6 2.6 3 6"/></svg>',
    Contact:'<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 8l8 6 8-6"/></svg>'
  };
  var P={
    w:100,h:100,cols:0,rows:0,offsetX:0,offsetY:0,
    cells:[],navIdx:[]
  };
  var comb=document.getElementById("comb");
  function layout(){
    var vw=innerWidth,vh=innerHeight;
    var desk=vw>1600?132:vw>1100?100:vw>800?82:vw>600?64:52;
    P.w=desk;P.h=desk*1.1547;P.gapH=4;P.gapV=3;
    P.cols=Math.ceil(vw/(P.w+P.gapH))+2;
    P.rows=Math.ceil(vh/(P.h*0.75))+2;
    P.offsetX=(vw-P.cols*(P.w+P.gapH))/2+P.w/2;
    P.offsetY=(vh-P.rows*(P.h*0.75))/2+P.h/2;
    build();
  }
  function hexPos(col,row){
    var x=P.offsetX+col*(P.w+P.gapH)+(row%2)*(P.w+P.gapH)/2;
    var y=P.offsetY+row*(P.h*0.75+P.gapV);
    return{x:x,y:y};
  }
  function build(){
    comb.innerHTML="";
    P.cells=[];P.navIdx=[];
    var labels=["Work","Studio","Journal","Lab","People","Contact"];
    var centerCol=Math.floor((P.cols-1)/2),centerRow=Math.floor((P.rows-1)/2);
    // nav ring positions around center (center cell is empty wax)
    var ring=[[0,-1],[1,-.5],[1,.5],[0,1],[-1,.5],[-1,-.5]];
    for(var r=0;r<P.rows;r++){
      for(var c=0;c<P.cols;c++){
        var pos=hexPos(c,r);
        var d=document.createElement("div");
        d.className="hex";
        d.style.left=(pos.x-P.w/2)+"px";
        d.style.top=(pos.y-P.h/2)+"px";
        d.style.width=P.w+"px";d.style.height=P.h+"px";
        // is it nav?
        var ni=-1;
        ring.forEach(function(rp,i){
          var rc=centerCol+rp[0]*2, rr=centerRow+rp[1]*2;
          // rows offset: y offset for odd rows
          if((rr%2&&c===rc-0.5===false)){
          }
          // simpler: compute on offset coords
        });
        comb.appendChild(d);
        P.cells.push({el:d,row:r,col:c,x:pos.x,y:pos.y});
      }
    }
    // assign nav hexes at hex-distance ~2 from center
    var center={x:P.offsetX+centerCol*(P.w+P.gapH)+(centerRow%2)*(P.w+P.gapH)/2,
      y:P.offsetY+centerRow*(P.h*0.75+P.gapV)};
    var dists=P.cells.map(function(cell){
      var dx=cell.x-center.x,dy=cell.y-center.y;
      // axial approx
      return {cell:cell,d:Math.sqrt(dx*dx+dy*dy)};
    });
    dists.sort(function(a,b){return a.d-b.d});
    var ringCells=dists.filter(function(it){return it.d>P.w*0.6&&it.d<P.w*1.9});
    // pick six evenly around
    var chosen=ringCells.filter(function(it,idx){
      var a=Math.atan2(it.cell.y-center.y,it.cell.x-center.x);
      return idx%Math.max(1,Math.floor(ringCells.length/6))===0;
    }).slice(0,6);
    if(chosen.length<6){
      chosen=ringCells.slice(0,Math.min(6,ringCells.length));
    }
    chosen.forEach(function(it,i){
      var el=it.cell.el;
      el.classList.add("nav");
      el.innerHTML=icons[labels[i]]+'<span class="lbl">'+labels[i]+'</span>';
      el.tabIndex=0;
      el.addEventListener("click",function(){openMenu(labels[i],el)});
      el.addEventListener("keydown",function(e){
        if(e.key==="Enter"||e.key===" "){e.preventDefault();openMenu(labels[i],el)}
      });
    });
    idle();
  }
  // pointer ripple
  var mx=-9999,my=-9999,idleT=0,phantom=0;
  var fine=matchMedia("(pointer:fine)").matches;
  window.addEventListener("pointermove",function(e){
    if(document.body.classList.contains("panelopen"))return;
    mx=e.clientX;my=e.clientY;idleT=0;
    ripple();
  });
  function ripple(){
    var R=P.w*3.2;
    P.cells.forEach(function(cell){
      var dx2=cell.x-mx,dy2=cell.y-my;
      var d=Math.sqrt(dx2*dx2+dy2*dy2);
      var f=1-Math.min(1,d/R);
      f=f*f*(3-2*f);
      var el=cell.el;
      if(f<=0){el.style.transform="";el.style.filter="";return}
      var dxn=dx2/Math.max(1,d),dyn=dy2/Math.max(1,d);
      var ex=dx2>0?1:-1;
      var rotX=dyn*f*14,rotY=dxn*f*14;
      el.style.transform="translateZ("+(f*34)+"px) scale("+(0.96+0.06*f)+") rotateX("+rotX+"deg) rotateY("+rotY+"deg)";
      el.style.filter="brightness("+(1+f*0.55)+") saturate("+(1+f*0.3)+")";
    });
  }
  // idle phantom wander (Lissajous)
  function idle(){
    if(!fine||RM||document.body.classList.contains("panelopen"))return;
    if(idleT>4){
      phantom+=0.0016;
      mx=innerWidth/2+Math.sin(phantom*3+1.2)*innerWidth*0.28;
      my=innerHeight/2+Math.sin(phantom*2)*innerHeight*0.3;
      ripple();
    }
    idleT+=0.1;
    setTimeout(idle,100);
  }
  // panel open morph
  var panel=document.getElementById("panel");
  var openCell=null;
  function openMenu(name,el){
    var d=content[name];
    document.getElementById("pKick").textContent=d[0];
    document.getElementById("pTitle").textContent=d[1];
    document.getElementById("pBody").innerHTML=d[2].split(". ").map(function(s){return "<p>"+s+".</p>"}).join("");
    document.getElementById("pTags").innerHTML=d[3].map(function(t){return "<span><i class='hx'></i>"+t+"</span>"}).join("");
    // position over clicked hex
    var r=el.getBoundingClientRect();
    panel.style.left=r.left+"px";panel.style.top=r.top+"px";
    panel.style.width=r.width+"px";panel.style.height=r.height+"px";
    panel.style.transform="none";
    panel.style.visibility="visible";
    panel.classList.add("open");
    document.body.classList.add("panelopen");
    document.getElementById("hint").style.opacity=0;
    openCell=el;
    el.style.opacity=0;
  }
  function closeMenu(){
    panel.classList.remove("open");
    document.body.classList.remove("panelopen");
    document.getElementById("hint").style.opacity=1;
    setTimeout(function(){panel.style.visibility="hidden";panel.style.clipPath="";if(openCell)openCell.style.opacity=""},300);
    openCell=null;
  }
  document.getElementById("closeBtn").addEventListener("click",closeMenu);
  document.getElementById("scrim").addEventListener("click",closeMenu);
  window.addEventListener("keydown",function(e){
    if(e.key==="Escape")closeMenu();
  });
  window.addEventListener("resize",function(){layout()});
  layout();
})();
</script>
</body>
</html>
