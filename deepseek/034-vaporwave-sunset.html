<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＬＵＮＡＲ　ＷＩＮＤ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--grid-speed:4s;--grid-pos:0px}
html,body{height:100%;overflow:hidden}
body{
  background:#12002a;color:#fff;
  font-family:Palatino,'Iowan Old Style',Georgia,serif;overflow-x:hidden;
}
.scene{position:fixed;inset:0;perspective:520px;perspective-origin:50% 40%;overflow:hidden}
/* sky */
.sky{position:absolute;inset:0;
  background:linear-gradient(180deg,#0a0020 0%,#2b0a5e 38%,#7a2a9e 63%,#d81f8f 63.001%,#12002a 63.001%);
  background-size:100% 100%}
.star{position:absolute;border-radius:50%;width:3px;height:3px;animation:stw 3s ease-in-out infinite alternate}
@keyframes stw{from{opacity:.2}to{opacity:1}}
.haze{position:absolute;left:0;right:0;top:60%;height:14%;background:radial-gradient(60% 100% at 50% 0%,rgba(255,113,206,.45),transparent);filter:blur(6px)}
/* sun */
.sun{position:absolute;left:50%;top:20%;width:min(46vmin,380px);height:min(46vmin,380px);transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#fffb96 0%,#ffb347 40%,#ff71ce 66%,#b967ff 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 52% 55%,#000 55% 63%,transparent 63% 67%,#000 67% 73.5%,transparent 73.5% 78.5%,#000 78.5% 83%,transparent 83% 89%,#000 89% 92%,transparent 92% 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 52%,transparent 52% 55%,#000 55% 63%,transparent 63% 67%,#000 67% 73.5%,transparent 73.5% 78.5%,#000 78.5% 83%,transparent 83% 89%,#000 89% 92%,transparent 92% 100%);
  animation:sundrift 40s ease-in-out infinite alternate}
.sun.glow{position:absolute;left:50%;top:20%;width:min(46vmin,380px);height:min(46vmin,380px);transform:translate(-50%,-50%);
  background:transparent;
  box-shadow:0 0 80px 30px rgba(255,113,206,.35),0 0 200px 80px rgba(255,251,150,.18);
  animation:sundrift 40s ease-in-out infinite alternate;pointer-events:none}
@keyframes sundrift{from{transform:translate(-50%,-50%) translateY(0)}to{transform:translate(-50%,-50%) translateY(4vh)}}
/* floor */
.floor{
  position:absolute;top:66%;left:-100%;width:300%;height:130%;transform-origin:50% 0;
  transform:rotateX(72deg);
  background:
    linear-gradient(90deg,transparent 0 calc(50% - 2px),#01cdfe calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),
    repeating-linear-gradient(90deg,transparent 0 78px,#01cdfe 78px 80px),
    repeating-linear-gradient(0deg,transparent 0 78px,#ff71ce 78px 80px);
  background-position:0 0,0 0,0 var(--grid-pos);
  animation:gridmove var(--grid-speed) linear infinite,floorfade 0s;
  box-shadow:0 -30px 60px rgba(255,71,206,.4) inset}
@keyframes gridmove{to{background-position:0 0,0 0,0 calc(var(--grid-pos) + 80px)}}
.floor::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,71,206,.55),transparent 12%,rgba(0,0,0,.9) 100%)}
/* checkerboard */
.checker{position:absolute;left:50%;top:66%;width:60vmin;height:60vmin;transform:translate(-50%,80%) rotateX(74deg);
  background:repeating-conic-gradient(#b967ff 0 12%,transparent 12% 24%);
  -webkit-mask-image:radial-gradient(closest-side,transparent 30%,#000 62%,transparent 80%);
  mask-image:radial-gradient(closest-side,transparent 30%,#000 62%,transparent 80%);
  opacity:.5;animation:checkerspin 40s linear infinite}
@keyframes checkerspin{to{transform:translate(-50%,80%) rotateX(74deg) rotate(360deg)}}
/* palms */
.palms{position:absolute;bottom:33%;width:100%;pointer-events:none}
.palm{position:absolute;bottom:0;width:22vw;min-width:120px;animation:sway 6s ease-in-out infinite alternate;transform-origin:50% 100%}
.palm.p1{left:-2%}
.palm.p2{right:-2%;transform:scaleX(-1);animation:sway 6s ease-in-out -2.4s infinite alternate}
@keyframes sway{from{transform:rotate(-1.3deg)}to{transform:rotate(1.3deg)}}
/* title */
.title{position:fixed;left:0;right:0;top:46%;text-align:center;z-index:8;pointer-events:none}
.title h1{
  font-size:clamp(30px,8.5vw,132px);font-weight:700;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff 0%,#01cdfe 35%,#063a55 49%,#fff 51%,#ff71ce 70%,#b967ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.5);
  filter:drop-shadow(4px 4px 0 #b967ff) drop-shadow(8px 8px 0 #3d0a5e) drop-shadow(0 0 22px #01cdfe);
  animation:glowsub 6s ease-in-out infinite alternate;
  white-space:nowrap;
}
@keyframes glowsub{from{filter:drop-shadow(4px 4px 0 #b967ff) drop-shadow(8px 8px 0 #3d0a5e) drop-shadow(0 0 22px #01cdfe)}to{filter:drop-shadow(4px 4px 0 #b967ff) drop-shadow(8px 8px 0 #3d0a5e) drop-shadow(0 0 30px #ff71ce)}}
.subtitle{margin-top:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(12px,2.4vw,20px);letter-spacing:.5em;color:#05ffa1;text-shadow:0 0 14px rgba(5,255,161,.7)}
.caption{position:fixed;top:28px;right:30px;z-index:9;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.18em;color:rgba(5,255,161,.7);text-align:right;line-height:1.9}
/* bust */
.bust{position:fixed;right:16%;top:28%;width:min(26vw,250px);z-index:7;pointer-events:none;
  animation:floatb 9s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px rgba(185,103,255,.6))}
@keyframes floatb{from{transform:translateY(-22px) rotate(-2deg)}to{transform:translateY(22px) rotate(2deg)}}
/* retro window */
.retro{position:fixed;left:26px;bottom:26px;width:320px;z-index:10;
  background:#c0c0c0;color:#000;padding:0;font-family:ui-sans-serif,system-ui,sans-serif;
  box-shadow:inset -1px -1px 0 #404040,inset 1px 1px 0 #fff,4px 6px 0 rgba(0,0,0,.4),6px 10px 0 rgba(0,0,0,.3);
  border:1px solid #000;
}
.retro .tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:12px}
.retro .tb .icon{background:linear-gradient(135deg,#ff71ce,#01cdfe);width:15px;height:15px;border-radius:3px}
.retro .tb .btns{margin-left:auto;display:flex;gap:2px}
.retro .tb .b9{width:16px;height:14px;background:#c0c0c0;border:1px solid;border-color:#fff #404040 #404040 #fff;font-size:9px;text-align:center;line-height:12px;cursor:pointer}
.retro .menu{display:flex;gap:10px;padding:4px 8px;font-size:12px;border-bottom:1px solid #808080}
.retro .menu u{text-decoration:underline}
.lcd{background:#000;color:#05ffa1;margin:8px;padding:14px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;box-shadow:inset 0 0 12px rgba(0,0,0,.8)}
.lcd .row{display:flex;justify-content:space-between}
.lcd .lbl{color:#ff71ce}
.lcd .big{font-size:22px;text-align:center;letter-spacing:.12em;margin:6px 0;text-shadow:0 0 8px rgba(5,255,161,.8)}
.pbar{height:12px;background:repeating-linear-gradient(90deg,#000080 0 6px,#1a2a8a 6px 12px);margin:6px 8px;position:relative;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#0a3a8a 0 6px,#1a55b0 6px 12px);animation:pload 20s linear infinite}
@keyframes pload{to{width:100%}}
.retro .btns{display:flex;gap:8px;margin:8px;font-size:12px}
.retro .bb{border:1px solid;border-color:#fff #404040 #404040 #fff;background:#c0c0c0;padding:7px 12px;cursor:pointer;font-family:inherit;font-size:12px}
.retro .bb:active{border-color:#404040 #fff #fff #404040}
.retro .bb[aria-pressed="true"]{border-color:#404040 #fff #fff #404040;background:#aaa}
.sbar{display:flex;justify-content:space-between;margin:4px 8px 8px;font-size:11px;border-top:1px solid #808080;padding-top:4px}
@media(max-width:640px){
  .caption{display:none}
  .bust{right:4%;width:34vw}
  .retro{left:12px;right:12px;width:auto}
  .palm{width:30vw}
}
@media(prefers-reduced-motion:reduce){
  .star,.sun,.sun.glow,.floor,.checker,.palm,.title h1,.bust,.pbar i{animation:none}
}
</style>
</head>
<body>
<div class="scene">
  <div class="sky" id="sky"></div>
  <div class="sun glow"></div><div class="sun"></div>
  <div class="haze"></div>
  <div class="floor"></div>
  <div class="checker"></div>
  <div class="palms">
    <svg class="palm p1" viewBox="0 0 220 300" fill="none">
      <path d="M110 300 C105 200 100 120 90 40" stroke="#12002a" stroke-width="14" stroke-linecap="round"/>
      <path d="M90 40 C40 20 10 40 0 80 M90 40 C60 30 70 8 92 0 M90 40 C110 20 150 10 170 30 M90 40 C120 30 160 30 185 55 M90 40 C140 60 190 90 205 120" stroke="#12002a" stroke-width="9" stroke-linecap="round" fill="none"/>
      <ellipse cx="90" cy="30" rx="46" ry="18" fill="#12002a" transform="rotate(-20 90 30)"/>
    </svg>
    <svg class="palm p2" viewBox="0 0 220 300" fill="none">
      <path d="M110 300 C115 200 120 120 130 40" stroke="#12002a" stroke-width="14" stroke-linecap="round"/>
      <path d="M130 40 C80 20 50 40 40 80 M130 40 C100 30 110 8 132 0 M130 40 C150 20 190 10 210 30 M130 40 C160 30 200 30 225 55 M130 40 C180 60 230 90 245 120" stroke="#12002a" stroke-width="9" stroke-linecap="round" fill="none"/>
      <ellipse cx="130" cy="30" rx="46" ry="18" fill="#12002a" transform="rotate(20 130 30)"/>
    </svg>
  </div>
  <div class="bust">
    <svg viewBox="0 0 200 260">
      <defs><linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d8ccf2"/><stop offset="1" stop-color="#7a5ea8"/></linearGradient></defs>
      <rect x="30" y="235" width="140" height="25" fill="url(#marble)"/>
      <path d="M40 235 Q100 180 160 235 Z" fill="url(#marble)"/>
      <rect x="88" y="160" width="24" height="50" fill="url(#marble)"/>
      <ellipse cx="100" cy="150" rx="38" ry="44" fill="url(#marble)"/>
      <path d="M62 120 Q100 70 138 120 Q120 108 100 106 Q80 108 62 120 Z" fill="url(#marble)"/>
      <ellipse cx="100" cy="50" rx="30" ry="12" fill="url(#marble)"/>
      <circle cx="88" cy="96" r="6" fill="url(#marble)"/><circle cx="112" cy="96" r="6" fill="url(#marble)"/>
      <g stroke="#8a7ab8" stroke-width="2" opacity=".8" fill="none" stroke-linecap="round">
        <path d="M84 108 Q100 120 116 108"/>
        <path d="M97 130 L100 138"/>
        <path d="M99 138 Q103 144 106 142"/>
      </g>
    </svg>
  </div>
</div>

<div class="caption">ＭＥＭＯＲＩＥＳ / ＯＦ　ＴＯＭＯＲＲＯＷ<br>side b · 1995</div>

<div class="title">
  <h1>ＬＵＮＡＲ　ＷＩＮＤ</h1>
  <div class="subtitle">Ｓ Ｉ Ｄ Ｅ　Ｂ　·　１ ９ ９ ５</div>
</div>

<div class="retro" id="retro">
  <div class="tb"><span class="icon"></span><span>Lunar Wind Player</span><span class="btns"><span class="b9">─</span><span class="b9">□</span><span class="b9">✕</span></span></div>
  <div class="menu"><span><u>F</u>ile</span><span><u>V</u>iew</span><span><u>O</u>ptions</span><span><u>H</u>elp</span></div>
  <div class="lcd">
    <div class="row"><span class="lbl">NOW PLAYING</span><span>♫ LUNAR WIND -WIDE EDIT-</span></div>
    <div class="big" id="lcdTime">00:00:00</div>
    <div class="row"><span class="lbl">SPEED</span><span id="lcdSpeed">×1 CRUISE</span></div>
    <div class="row"><span class="lbl">GRID</span><span id="lcdGrid">CRUISE (4s)</span></div>
  </div>
  <div class="pbar"><i></i></div>
  <div class="btns">
    <button class="bb" id="playBtn">▶ Play</button>
    <button class="bb" id="slowBtn">◂◂ Slow</button>
    <button class="bb" id="fastBtn">▸▸ Fast</button>
  </div>
  <div class="sbar"><span>GRID DRIFT · LUNAR MODE</span><span>READY</span></div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var levels=[["DRIFT",12,"×0.3"],["CRUISE",4,"×1"],["RUSH",1.4,"×2.5"],["HYPER",0.5,"×8"]];
  var level=1,playing=false,clockT=0;
  var root=document.documentElement;
  var gridLbl=document.getElementById("lcdGrid"),speedLbl=document.getElementById("lcdSpeed");
  var timeEl=document.getElementById("lcdTime");
  function setLevel(l){
    level=(l+levels.length)%levels.length;
    root.style.setProperty("--grid-speed",levels[level][1]+"s");
    gridLbl.textContent=levels[level][0]+" ("+levels[level][1]+"s)";
    speedLbl.textContent="×1 "+levels[level][0];
  }
  var playBtn=document.getElementById("playBtn");
  function togglePlay(){
    playing=!playing;
    playBtn.setAttribute("aria-pressed",playing?"true":"false");
    playBtn.textContent=playing?"❚❚ Pause":"▶ Play";
    if(playing){setLevel(3);}
    else{setLevel(1);clockT=0}
  }
  playBtn.addEventListener("click",togglePlay);
  document.getElementById("slowBtn").addEventListener("click",function(){
    setLevel(level-1);
    if(playing)setLevel(level-1);
  });
  document.getElementById("fastBtn").addEventListener("click",function(){
    setLevel(playing?3:level+1);
  });
  // clock
  setInterval(function(){
    if(!playing)return;
    clockT++;
    var s=clockT%60,m=Math.floor(clockT/60)%60,h=Math.floor(clockT/3600);
    timeEl.textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  },1000);
  // stars
  var sky=document.getElementById("sky");
  var starCols=["#fff","#fffb96","#01cdfe","#b967ff"];
  for(var i=0;i<10;i++){
    var s=document.createElement("div");
    s.className="star";
    s.style.left=(Math.random()*90)+"%";
    s.style.top=(Math.random()*60)+"%";
    s.style.background=starCols[i%4];
    s.style.animationDelay=(-Math.random()*3)+"s";
    s.style.animationDuration=(2+Math.random()*3)+"s";
    sky.appendChild(s);
  }
  // parallax (fine pointers)
  var fine=matchMedia("(pointer:fine)").matches;
  var title=document.querySelector(".title h1");
  var bust=document.querySelector(".bust");
  var sun=document.querySelector(".sun"),sunG=document.querySelector(".sun.glow");
  var tx2=0,ty2=0,px3=0,py3=0;
  if(fine&&!RM){
    window.addEventListener("pointermove",function(e){
      tx2=(e.clientX/innerWidth-0.5)*2;
      ty2=(e.clientY/innerHeight-0.5)*2;
    });
    (function pl(){
      px3+=(tx2-px3)*0.06;py3+=(ty2-py3)*0.06;
      title.style.transform="translate("+(-px3*14)+"px,0) rotateY("+(px3*4)+"deg)";
      bust.style.marginLeft=(px3*18)+"px";
      sun.style.marginLeft=(-px3*10)+"px";
      sunG.style.marginLeft=(-px3*10)+"px";
      requestAnimationFrame(pl);
    })();
  }
})();
</script>
</body>
</html>
