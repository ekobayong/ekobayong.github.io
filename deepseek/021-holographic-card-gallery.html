<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelian Codex — Six Elemental Wards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d9b04c}
body{
  background:
    radial-gradient(70% 50% at 50% 0%,rgba(58,26,92,.85),transparent 70%),
    radial-gradient(60% 50% at 100% 100%,rgba(42,15,63,.8),transparent 70%),
    linear-gradient(180deg,#170b24,#0b0611);
  min-height:100vh;color:#efe8ff;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
  repeating-linear-gradient(65deg,rgba(255,255,255,.008) 0 2px,transparent 2px 7px)}
.wrap{max-width:1260px;margin:0 auto;padding:60px 34px 80px;position:relative;z-index:1}
.eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:18px}
h1{
  font-family:Georgia,Palatino,'Iowan Old Style',serif;font-weight:400;font-size:clamp(36px,5.6vw,72px);text-align:center;
  background:linear-gradient(180deg,#fff6d5,#d9b04c 55%,#8a6a1f);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;
}
h1 em{font-style:italic}
.lede{text-align:center;color:#b9a9d6;font-size:15px;margin-bottom:34px;font-family:Georgia,'Iowan Old Style',serif;font-style:italic}
.rule{width:170px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 44px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,280px);gap:56px;justify-content:center;perspective:1200px}
/* card */
.card{width:280px;height:400px;position:relative;transform-style:preserve-3d;cursor:pointer;
  --rx:0deg;--ry:0deg;--flip:0deg;--mx:50%;--my:50%;
  transition:transform 80ms linear;}
.card.leaving{transition:transform 550ms cubic-bezier(.2,.8,.2,1)}
@media(max-width:640px){.card{width:250px;height:358px}}
@media(max-width:360px){.card{width:228px;height:326px}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.55);}
.front{background:#221533}
.back{background:linear-gradient(160deg,#2b1a3e,#1a0f28);transform:rotateY(180deg);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
/* art */
.art{position:absolute;inset:0;overflow:hidden}
.art .bg{position:absolute;inset:0}
.foil{position:absolute;inset:0;background:linear-gradient(115deg,#ff4d4d,#ffd24d 20%,#4dff88 40%,#4dd2ff 60%,#8a4dff 80%,#ff4de1);
  background-size:300% 300%;mix-blend-mode:color-dodge;opacity:.38;transition:opacity .4s}
.spark{position:absolute;inset:0;mix-blend-mode:screen;opacity:.9}
.spark1{background-image:radial-gradient(rgba(255,255,255,.8) 1px,transparent 2px);background-size:34px 34px;background-position:calc(var(--mx)*1.6) calc(var(--my)*1.9)}
.spark2{background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 2px);background-size:19px 19px;background-position:calc(var(--mx)*-1.3) calc(var(--my)*1.1)}
.spark3{background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 2px);background-size:51px 51px;background-position:calc(var(--mx)*2.2) calc(var(--my)*-1.5)}
.glare{position:absolute;inset:0;background:radial-gradient(220px circle at var(--mx) var(--my),rgba(255,255,255,.38),transparent 70%);mix-blend-mode:overlay;opacity:0;transition:opacity .4s}
.card:hover .glare{opacity:1}
.card:hover .foil{opacity:.62}
.art svg.emblem{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);width:120px;height:120px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.card:hover .art svg.emblem{transform:translate(-50%,-50%) scale(1.08)}
/* frame */
.frame{position:absolute;inset:10px;border-radius:9px;pointer-events:none;
  border:2px solid transparent;
  background:linear-gradient(var(--mx),var(--my),#fff2c2 0%,#d9b04c 45%,#8a6a1f 100%) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  transition:background-position .2s}
.frame::after{content:"";position:absolute;inset:2px;border:1px solid rgba(255,255,255,.12);border-radius:7px}
/* tilt */
.card{transform:rotateX(var(--rx)) rotateY(calc(var(--ry) + var(--flip)))}
/* plate */
.plate{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(0deg,rgba(10,5,18,.92),rgba(10,5,18,.4) 70%,transparent);color:#efe8ff}
.plate .nm{display:flex;justify-content:space-between;align-items:baseline;font-family:Georgia,'Iowan Old Style',serif;font-size:19px}
.plate .nm span{font-family:ui-monospace,monospace;font-size:11px;color:var(--gold)}
.pill{display:inline-block;margin-top:6px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#0b0611;background:linear-gradient(90deg,#fff2c2,#d9b04c);padding:3px 9px;border-radius:99px;font-weight:700}
.stats{margin-top:10px;font-family:Georgia,serif;font-style:italic;font-size:11.5px;color:#c9b8e6}
.bars{display:flex;gap:10px;margin-top:8px}
.bars .b{flex:1}
.bars .b i{display:block;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin-top:3px}
.bars .b i::after{content:"";display:block;height:100%;width:0;background:linear-gradient(90deg,#fff2c2,#d9b04c);transition:width 1s cubic-bezier(.22,1,.36,1)}
.card.inview .bars .b i::after{width:calc(var(--v)*100%)}
.bars .b span{font-size:8px;letter-spacing:.2em;color:#9a86bc;text-transform:uppercase}
/* back face */
.back .bname{font-family:Georgia,'Iowan Old Style',serif;font-size:26px;color:var(--gold);text-align:center}
.back .origin{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:#b9a9d6;text-align:center;text-transform:uppercase}
.back .lore{font-family:Georgia,serif;font-style:italic;font-size:13.5px;line-height:1.6;color:#e2d4f5;flex:1;overflow:hidden}
.back .lore::first-letter{float:left;font-size:2.6em;line-height:.85;padding:4px 6px 0 0;color:var(--gold)}
.sigil{text-align:center}
.back .hint{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#9a86bc;text-align:center}
.back::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(217,176,76,.06) 0 2px,transparent 2px 8px);pointer-events:none}
.shimmerbar{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-120%);z-index:5;pointer-events:none}
.card.shimmer .shimmerbar{animation:shs 1.1s ease .3s}
@keyframes shs{to{transform:translateX(520%)}}
.shimmerbar{left:-60px}
@media(prefers-reduced-motion:reduce){
  .card{transition:none!important}
  .foil,.glare{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Aurelian Codex · Series I</p>
  <h1>Six <em>Elemental</em> Wards</h1>
  <p class="lede">Burnished foils struck from the memory of the Old Hours — tilt each ward to catch its light.</p>
  <div class="rule"></div>
  <div class="gallery" id="gallery"></div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cards=[
    {name:"Ignis",t:"Fire · Legendary",n:"01/06",g1:"#ff8c42",g2:"#c21807",em:"flame",
     lore:"The Ember Wyrm sleeps inside every fireplace that has ever lied about staying lit. Feed it nothing but attention."},
    {name:"Undine",t:"Water · Mythic",n:"02/06",g1:"#3ddad7",g2:"#12537e",em:"ripple",
     lore:"Of the Still Deep, she counts the drowned bells of a hundred harbours and keeps each one ringing."},
    {name:"Sylph",t:"Air · Rare",n:"03/06",g1:"#eaf6ff",g2:"#7db4e0",em:"wind",
     lore:"Herald of the High Wind; her laughter is what moves the weathervane when no one is watching."},
    {name:"Gnomon",t:"Earth · Rare",n:"04/06",g1:"#9ecf7a",g2:"#2c5231",em:"crystal",
     lore:"The Patient Stone has watched ten thousand dawns from the same root. It is not waiting. It is already here."},
    {name:"Fulgur",t:"Storm · Mythic",n:"05/06",g1:"#ffe45e",g2:"#7b3fb8",em:"bolt",
     lore:"The Split Second strikes twice in the same place, on purpose, to teach the sky that it can be counted on."},
    {name:"Umbra",t:"Void · Legendary",n:"06/06",g1:"#a98ad6",g2:"#1c1130",em:"orbits",
     lore:"The Kept Shadow was never banished; it merely agreed to stand behind the light and hold the edges true."}
  ];
  var emblems={
    flame:'<path d="M60 108 C30 80 34 44 62 18 C70 44 84 52 84 52 C106 28 96 74 96 74 C112 60 110 84 100 94 C92 102 74 114 60 108 Z" fill="#ffd98a"/><path d="M60 108 C44 94 44 74 58 58 C64 76 72 82 72 82 C86 66 86 92 78 100 C74 104 66 112 60 108 Z" fill="#fff4d9"/>',
    ripple:'<path d="M20 78 Q40 54 60 78 T100 78" stroke="#bfeeff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 92 Q50 68 70 92 T110 92" stroke="#8fd8f2" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/><circle cx="70" cy="52" r="7" fill="#e8fbff"/>',
    wind:'<path d="M14 52 Q40 40 66 52 T118 52" stroke="#ecf6ff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M22 70 Q48 58 76 70" stroke="#cddff2" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M18 34 Q42 22 68 34" stroke="#cddff2" stroke-width="3" fill="none" stroke-linecap="round"/>',
    crystal:'<path d="M70 22 L112 70 L70 118 L28 70 Z" fill="#d6ffc2"/><path d="M70 22 L70 118 M28 70 L112 70 M45 41 L45 99 M95 41 L95 99" stroke="#4f9e55" stroke-width="2.4"/>',
    bolt:'<path d="M78 14 L42 68 L64 68 L52 104 L94 52 L70 52 Z" fill="#fff0a0" stroke="#ffd23f" stroke-width="3" stroke-linejoin="round"/>',
    orbits:'<ellipse cx="70" cy="70" rx="48" ry="18" fill="none" stroke="#c9b0ff" stroke-width="3"/><ellipse cx="70" cy="70" rx="48" ry="18" fill="none" stroke="#e8dcff" stroke-width="1.6" transform="rotate(120 70 70)"/><ellipse cx="70" cy="70" rx="48" ry="18" fill="none" stroke="#e8dcff" stroke-width="1.6" transform="rotate(240 70 70)"/><circle cx="70" cy="70" r="13" fill="#171032"/>'
  };
  var gallery=document.getElementById("gallery");
  function t(x,y){return '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="'+y+'" stroke-width="5"/><circle cx="13" cy="13" r="11" fill="none" stroke="#000" stroke-width="1.4" opacity=".5"/></svg>'}
  cards.forEach(function(cd,i){
    var allTints=[["#ff6b3d","#c21807","#ffb58a","#7a1a0a"],["#3ddad7","#12537e","#bfeeff","#0a2f44"],["#eaf6ff","#7db4e0","#ffffff","#3d5f86"],["#9ecf7a","#2c5231","#d6ffc2","#142a18"],["#ffe45e","#7b3fb8","#fff9c9","#2a1352"],["#a98ad6","#1c1130","#e8dcff","#0f091f"]];
    var t1=allTints[i];
    var card=document.createElement("div");
    card.className="card";
    card.style.setProperty("--mx","50%");card.style.setProperty("--my","50%");
    card.tabIndex=0;
    card.setAttribute("aria-label",cd.name+", "+cd.t+" (flip to read)");
    card.innerHTML=
      '<div class="face front">'
        +'<div class="art">'
          +'<div class="bg" style="background:radial-gradient(120% 90% at 30% 20%,'+t1[0]+',transparent 60%),radial-gradient(120% 100% at 80% 90%,'+t1[1]+',transparent 65%),linear-gradient(160deg,#241735,#150d24)"></div>'
          +'<svg class="emblem" viewBox="0 0 140 140">'+emblems[cd.em]+'</svg>'
          +'<div class="spark spark1"></div><div class="spark spark2"></div><div class="spark spark3"></div>'
          +'<div class="foil"></div><div class="glare"></div>'
        +'</div>'
        +'<div class="frame"></div>'
        +'<div class="plate">'
          +'<div class="nm"><span>'+cd.n+'</span>'+cd.name+'</div>'
          +'<span class="pill">'+cd.t+'</span>'
          +'<div class="stats">"'+cd.lore.slice(0,52)+'…"</div>'
          +'<div class="bars"><div class="b"><span>Might</span><i style="--v:.'+((i*37)%9+2)+'"></i></div><div class="b"><span>Guard</span><i style="--v:.'+((i*53)%9+2)+'"></i></div><div class="b"><span>Swift</span><i style="--v:.'+((i*29)%9+2)+'"></i></div></div>'
        +'</div>'
      +'</div>'
      +'<div class="face back">'
        +'<div class="bname">'+cd.name+'</div>'
        +'<div class="origin">Found · the Obsidian Archive</div>'
        +'<div class="lore">'+cd.lore+'</div>'
        +'<div class="sigil">'+t(0,cd.t.includes("Legendary")?"#8a6a1f":"#d9b04c")+'</div>'
        +'<div class="hint">tap to return</div>'
      +'</div>';
    gallery.appendChild(card);
  });
  // tilt + flip
  var cardsAll=gallery.querySelectorAll(".card");
  cardsAll.forEach(function(c){
    var flipped=false,timeout=null;
    c.addEventListener("pointermove",function(e){
      var r=c.getBoundingClientRect();
      var px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
      c.style.setProperty("--mx",(px*100)+"%");
      c.style.setProperty("--my",(py*100)+"%");
      if(RM){c.style.setProperty("--ry","0deg");c.style.setProperty("--rx","0deg");return}
      var rotX=((py-0.5)*-2*16);
      var rotY=(px-0.5)*2*16;
      if(flipped)rotY=-rotY;
      c.style.transition="";
      c.classList.remove("leaving");
      c.style.setProperty("--rx",rotX+"deg");
      c.style.setProperty("--ry",rotY+"deg");
      if(timeout){clearTimeout(timeout)}
      timeout=setTimeout(function(){
        c.classList.add("leaving");
        c.style.transition="transform 550ms cubic-bezier(.2,.8,.2,1)";
        c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg");
      },600);
    });
    function flip(){
      flipped=!flipped;
      if(folded)return;
      c.style.setProperty("--flip",flipped?"180deg":"0deg");
      if(flipped&&!RM){
        var sb=document.createElement("div");sb.className="shimmerbar";
        c.appendChild(sb);
        setTimeout(function(){sb.remove()},1500);
      }
    }
    var folded=false;
    c.addEventListener("click",function(){
      if(RM||aTouch()){flip()}
    });
    c.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}
    });
    var dragStart=null;
    c.addEventListener("pointerdown",function(e){dragStart={x:e.clientX,y:e.clientY,t:Date.now()}});
    c.addEventListener("pointerup",function(e){
      if(aTouch()&&dragStart){
        var dx=Math.abs(e.clientX-dragStart.x),dy=Math.abs(e.clientY-dragStart.y);
        if(dx<8&&dy<8){flip()}
      }
    });
    function aTouch(){return matchMedia("(pointer:coarse)").matches}
  });
  // idle shimmer sweep one card every 3.2s
  if(!RM){
    setInterval(function(){
      var c=cardsAll[Math.floor(Math.random()*cardsAll.length)];
      var sb=document.createElement("div");sb.className="shimmerbar";
      c.appendChild(sb);
      setTimeout(function(){sb.remove()},1600);
    },3200);
  }
  // bars reveal on scroll
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("inview");io.unobserve(en.target)}});
  },{threshold:.3});
  cardsAll.forEach(function(c){io.observe(c)});
  if(RM)cardsAll.forEach(function(c){c.classList.add("inview")});
})();
</script>
</body>
</html>
