<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGC 7741 Meridian — Spiral Galaxy Observatory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#e8ecf5;font-family:system-ui,sans-serif;cursor:grab}
body.drag{cursor:grabbing}
canvas#gal{position:fixed;inset:0;display:block}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 110% at 50% 50%,transparent 55%,rgba(0,0,0,.65))}
/* HUD */
.hud{position:fixed;inset:0;pointer-events:none;z-index:4}
.designation{position:absolute;top:26px;left:32px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#6d7787;animation:fadein 2.4s ease both}
h1.title{position:absolute;top:44px;left:30px;font-family:'Iowan Old Style',Palatino,Georgia,serif;font-weight:400;
  font-size:clamp(30px,4.6vw,54px);letter-spacing:.01em;animation:fadein 2.4s ease .2s both}
h1.title em{font-style:italic;color:#ffd9a0;text-shadow:0 0 24px rgba(255,217,160,.4)}
.classp{position:absolute;top:112px;left:32px;font-family:'Iowan Old Style',Palatino,serif;font-style:italic;font-size:13.5px;color:rgba(232,236,245,.5);max-width:38ch;animation:fadein 2.4s ease .4s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* stats */
.stats{position:absolute;left:32px;bottom:30px;display:flex;gap:26px;flex-wrap:wrap;animation:fadein 2.4s ease .8s both}
.stat .v{font-family:ui-monospace,monospace;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.stat .k{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:#6d7787;margin-top:3px}
/* compass */
.comp{position:absolute;top:26px;right:30px;width:74px;height:74px;animation:fadein 2.4s ease .6s both}
/* side buttons */
.sidectl{position:absolute;right:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.gbtn{
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,217,160,.4);background:rgba(10,12,20,.6);
  backdrop-filter:blur(10px);color:#ffd9a0;font-size:19px;cursor:pointer;display:grid;place-items:center;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .25s;
}
.gbtn:hover{transform:scale(1.12);border-color:#ffd9a0}
.gbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.hint{position:fixed;bottom:14px;right:30px;z-index:5;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.24em;
  text-transform:uppercase;color:#4a5163;pointer-events:none;transition:opacity 1.5s}
@media(max-width:640px){
  .classp{display:none}
  .stats{left:20px;gap:16px}
}
@media(prefers-reduced-motion:reduce){h1.title,.classp,.stats,.comp{animation:none}}
</style>
</head>
<body>
<canvas id="gal"></canvas>
<div class="vig"></div>
<div class="hud">
  <div class="designation">Designation · NGC 7741 · VV 236 · SBm III</div>
  <h1 class="title">NGC 7741 <em>Meridian</em></h1>
  <p class="classp">A barred spiral in the dim outskirts of Pegasus — tilt it, spin it, and lose an hour in its arms.</p>
  <div class="comp"><svg viewBox="0 0 74 74">
    <circle cx="37" cy="37" r="34" fill="none" stroke="rgba(109,119,135,.5)"/>
    <circle cx="37" cy="37" r="26" fill="none" stroke="rgba(109,119,135,.3)"/>
    <line x1="37" y1="8" x2="37" y2="16" stroke="rgba(255,217,160,.8)" stroke-width="2"/>
    <g transform="rotate(45 37 37)"><line x1="37" y1="10" x2="37" y2="16" stroke="rgba(109,119,135,.6)"/></g>
    <g transform="rotate(135 37 37)"><line x1="37" y1="10" x2="37" y2="16" stroke="rgba(109,119,135,.6)"/></g>
    <g transform="rotate(-45 37 37)"><line x1="37" y1="10" x2="37" y2="16" stroke="rgba(109,119,135,.6)"/></g>
    <polygon id="compNeedle" points="37,20 34,37 37,33 40,37" fill="#ffd9a0"/>
    <circle cx="37" cy="37" r="2.5" fill="#ffd9a0"/>
  </svg></div>
  <div class="stats">
    <div class="stat"><div class="v" id="sParticles">0</div><div class="k">Particles</div></div>
    <div class="stat"><div class="v" id="sDist">0.00</div><div class="k">Distance · Mly</div></div>
    <div class="stat"><div class="v" id="sDiam">0.0</div><div class="k">Diameter · kly</div></div>
    <div class="stat"><div class="v" id="sTilt">62°</div><div class="k">Tilt</div></div>
    <div class="stat"><div class="v" id="sZoom">1.0×</div><div class="k">Zoom</div></div>
  </div>
</div>
<div class="sidectl">
  <button class="gbtn" id="zi" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
  <button class="gbtn" id="zo" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="gbtn" id="pauseBtn" title="Pause rotation" aria-pressed="false" aria-label="Pause rotation"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
  <button class="gbtn" id="resetBtn" title="Reset view" aria-label="Reset view"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></button>
</div>
<div class="hint" id="hint">drag to tilt · wheel to zoom · space to pause</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("gal"),ctx=cv.getContext("2d");
  var W=0,H=0,DPR=1;
  var N=RM?14000:42000;
  var pts=[],sprites=new Map();
  var yaw=0.6,pitch=62*Math.PI/180,zoom=1;
  var rotSpeed=0.12,rotOn=true;
  var targetZoom=1;
  // pre-render bg galaxies
  var bg=document.createElement("canvas"),bgc=bg.getContext("2d");
  var bgGal=[];
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    renderBG();
  }
  window.addEventListener("resize",resize);
  function renderBG(){
    bgc.canvas.width=Math.max(W,2);bgc.canvas.height=Math.max(H,2);
    bgc.clearRect(0,0,W,H);
    bgGal=[];
    // starfield
    var n=Math.round(W*H/2400);
    for(var i=0;i<n;i++){
      var x=Math.random()*W,y=Math.random()*H;
      bgc.fillStyle="rgba(255,255,255,"+(0.08+Math.random()*0.4)+")";
      bgc.beginPath();bgc.arc(x,y,Math.random()<0.03?1.2:0.4+Math.random()*0.7,0,7);bgc.fill();
    }
    // distant blurred galaxies
    for(var g2=0;g2<12;g2++){
      var ga={x:Math.random()*W,y:Math.random()*H,r:20+Math.random()*90,rot:Math.random()*Math.PI,
        c:Math.random()<0.5?"rgba(200,180,255,":"rgba(180,200,255,"};
      var g3=bgc.createRadialGradient(ga.x,ga.y,0,ga.x,ga.y,ga.r);
      g3.addColorStop(0,ga.c+".16)");g3.addColorStop(1,ga.c+"0)");
      bgc.save();
      bgc.translate(ga.x,ga.y);bgc.rotate(ga.rot);
      bgc.fillStyle=g3;
      bgc.beginPath();bgc.ellipse(0,0,ga.r,ga.r*0.34,0,0,7);bgc.fill();
      bgc.restore();
    }
  }
  // build galaxy
  function build(){
    pts=[];
    var rng=function(){var s=1234567;return function(){s=(s*1103515245+12345)>>>0;return s/4294967296}}();
    var R=340; // disk radius in px
    var bulge=Math.floor(N*0.18);
    for(var i=0;i<N;i++){
      var p={};
      if(i<bulge){
        // gaussian bulge
        var r=Math.abs(rng()*R*0.32),a=rng()*Math.PI*2;
        p.r=r;p.ang=a;p.h=(rng()*2-1)*R*0.05;
        p.size=0.5+rng()*0.8;p.bright=0.5+rng()*0.5;
        // core colors
        var t=r/(R*0.4);
        p.col=t<0.5?mixCol(0xFFEBBE,0xFFCD82,t*2):mixCol(0xFFCD82,0xDDCCFF,(t-0.5)*2);
        p.hot=false;
      }else{
        // two logarithmic arms
        var b=0.28;
        var arm=rng()<0.5?0:Math.PI;
        var theta=arm+Math.log(1+ (R*0.12 + rng()*R*0.9)*0.02)/ (b*3)*b*3;
        // simpler: r along arm
        var baseR=(R*0.02+Math.pow(rng(),1.3)*R*0.98);
        var ang2=arm+Math.log(1+baseR*0.02);
        // angular spread grows with radius
        var spread=(0.02+baseR/R*0.28)*(rng()*2-1);
        ang2+=spread;
        var ded=rng()*rng();
        p.r=baseR*(0.95+ded*0.1);
        p.ang=ang2;
        var th=Math.exp(-baseR/(R*0.32));
        p.h=(rng()*2-1)*R*0.06*th;
        var tr=baseR/R;
        p.col=tr<0.3?mixCol(0xFFEBBE,0xFFCD82,tr*3):tr<0.7?mixCol(0xCDD7FF,0x91C3FF,(tr-0.3)/0.4):
          mixCol(0xAA7882,0xD25058,(tr-0.7)/0.3);
        p.size=0.6+rng()*1.4;
        p.bright=0.5+rng()*0.5;
        p.hot=Math.random()<0.06;
        if(p.hot){p.size=2+rng()*2;p.bright=1}
      }
      p.baseAng=p.ang;
      p.rBase=p.r;
      pts.push(p);
    }
    startCount();
  }
  function mixCol(a,b,t){
    t=Math.max(0,Math.min(1,t));
    var ar=(a>>16)&255,ag2=(a>>8)&255,ab=a&255;
    var br=(b>>16)&255,bg2=(b>>8)&255,bb=b&255;
    return"rgb("+Math.round(ar+(br-ar)*t)+","+Math.round(ag2+(bg2-ag2)*t)+","+Math.round(ab+(bb-ab)*t)+")";
  }
  // sprite cache
  function getSprite(color,hot){
    var key=color+(hot?"h":"");
    if(sprites.has(key))return sprites.get(key);
    var s=document.createElement("canvas");s.width=s.height=32;
    var c=s.getContext("2d");
    var g=c.createRadialGradient(16,16,0,16,16,16);
    var rgb=color.match(/\d+/g);
    var core=hot?"255,255,255":rgb.join(",");
    g.addColorStop(0,"rgba("+core+",.95)");
    g.addColorStop(0.3,"rgba("+rgb.join(",")+",.5)");
    g.addColorStop(1,"rgba("+rgb.join(",")+",0)");
    c.fillStyle=g;c.fillRect(0,0,32,32);
    sprites.set(key,s);
    return s;
  }
  var time=0;
  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bg,0,0,W,H);
    // nebula dust
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    // core glow
    ctx.translate(W/2,H/2);
    ctx.globalAlpha=0.8;
    var core=ctx.createRadialGradient(0,0,0,0,0,R*0.5);
    core.addColorStop(0,"rgba(255,240,210,.5)");core.addColorStop(1,"rgba(255,240,210,0)");
    ctx.fillStyle=core;ctx.fillRect(-R,-R,R*2,R*2);
    ctx.globalAlpha=0.09;
    // dust ellipses along arms (approx static)
    ctx.restore();
    // rotate+project
    var ang=time*rotSpeed;
    var cp=Math.cos(pitch),sp=Math.sin(pitch);
    ctx.globalCompositeOperation="lighter";
    // draw
    var step=Math.max(1,Math.floor(pts.length/140000)); // batch
    for(var i=0;i<pts.length;i+=step){
      var p=pts[i];
      var a=p.baseAng+ang/(0.25+p.r/ (340*0.35));
      var r=p.r* (0.25+p.r/ (340*0.35))*(1/(0.25+p.r/R*0.75));
      // differential rotation: omega=0.35/(0.25+r)
      var rot=p.baseAng+ang*0.35/(0.25+p.r/R)*1.1;
      var cosA=Math.cos(rot),sinA=Math.sin(rot);
      // 3D disk: x,y in disk plane, z = height
      var x=(p.r*cosA)*zoom,y=(p.r*sinA)*zoom,z=p.h*zoom;
      // yaw about normal then tilt about X
      var cy=Math.cos(yaw),sy=Math.sin(yaw);
      var x2=x*cy - y*sy;
      var y2=x*sy + y*cy;
      // tilt about screen X axis
      var y3=y2*cp - z*sp;
      var z3=y2*sp + z*cp;
      if(z3>0){
        // depth scale slightly
        var depthScale=1/(1+z3*0.0006);
        var sx=x2*depthScale,sy=y3*depthScale;
        var px=W/2+sx,py=H/2+sy;
        if(px<-20||px>W+20||py<-20||py>H+20)continue;
        var sz=(p.size*2.4*depthScale);
        ctx.globalAlpha=p.bright*0.75*depthScale;
        ctx.drawImage(getSprite(p.col,p.hot),px-sz/2,py-sz/2,sz,sz);
      }
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation="source-over";
    document.getElementById("compNeedle").setAttribute("transform","rotate("+(-yaw*180/Math.PI)+" 37 37)");
  }
  function startCount(){
    // count up stats
    var t0=performance.now();
    (function step(now){
      var p=Math.min(1,(now-t0)/3200);
      var e=1-Math.pow(1-p,4);
      document.getElementById("sParticles").textContent=Math.round(N*e).toLocaleString();
      document.getElementById("sDist").textContent=(43*(0.6+0.4*e)).toFixed(2);
      document.getElementById("sDiam").textContent=(36*e).toFixed(1);
      if(p<1)requestAnimationFrame(step);
    })(t0);
  }
  // interaction
  var dragging=false,lx=0,ly=0;
  cv.addEventListener("pointerdown",function(e){
    dragging=true;lx=e.clientX;ly=e.clientY;
    document.body.classList.add("drag");
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove",function(e){
    if(!dragging)return;
    yaw+=(e.clientX-lx)*0.006;
    pitch=Math.max(0.02,Math.min(1.52,pitch-(e.clientY-ly)*0.004));
    lx=e.clientX;ly=e.clientY;
    document.getElementById("sTilt").textContent=Math.round(pitch*180/Math.PI)+"°";
  });
  window.addEventListener("pointerup",function(){dragging=false;document.body.classList.remove("drag")});
  cv.addEventListener("wheel",function(e){
    e.preventDefault();
    targetZoom=Math.max(0.35,Math.min(6,targetZoom*(e.deltaY<0?1.12:0.9)));
  },{passive:false});
  function pinch(){
    zoom+=(targetZoom-zoom)*0.1;
    document.getElementById("sZoom").textContent=zoom.toFixed(1)+"×";
  }
  document.getElementById("zi").addEventListener("click",function(){targetZoom=Math.min(6,targetZoom*1.35)});
  document.getElementById("zo").addEventListener("click",function(){targetZoom=Math.max(0.35,targetZoom/1.35)});
  var pauseBtn=document.getElementById("pauseBtn");
  pauseBtn.addEventListener("click",function(){
    rotOn=!rotOn;
    this.setAttribute("aria-pressed",rotOn?"false":"true");
  });
  document.getElementById("resetBtn").addEventListener("click",function(){
    yaw=0.6;pitch=62*Math.PI/180;targetZoom=1;
    document.getElementById("sTilt").textContent="62°";
  });
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();pauseBtn.click()}
  });
  // loop
  var last=performance.now();
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    if(rotOn)time+=dt;
    pinch();
    render();
    requestAnimationFrame(loop);
  }
  build();
  resize();
  requestAnimationFrame(loop);
  setTimeout(function(){document.getElementById("hint").style.opacity=0},6000);
})();
</script>
</body>
</html>
