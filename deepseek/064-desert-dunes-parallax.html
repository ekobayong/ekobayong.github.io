<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAHEL MERIDIAN — Dunes at Golden Hour</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sky1:#5d8fb5;--sky2:#e8b86b;--sky3:#f8dca4;
  --sun:#fff6d2;--glow:rgba(255,246,210,.6);
  --haze:rgba(240,200,150,.5);
  --d1:#f1d9a8;--d2:#e4b982;--d3:#d59b62;--d4:#bd7a48;--d5:#9a5a35;--d6:#6e3b24;
  --sand:#f8e3b0;--stars:0;--camel:#c2683a;
  --mx:0px;--my:0px;
}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));
  font-family:'Iowan Old Style',Palatino,Georgia,serif;transition:background 1s ease;
}
.stars{position:fixed;inset:0;opacity:var(--stars);pointer-events:none;transition:opacity 1s;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent 60%),
  radial-gradient(1px 1px at 28% 9%,#fff,transparent 60%),
  radial-gradient(2px 2px at 41% 24%,#ffe9c4,transparent 60%),
  radial-gradient(1px 1px at 55% 12%,#fff,transparent 60%),
  radial-gradient(1.5px 1.5px at 68% 21%,#fff,transparent 60%),
  radial-gradient(1px 1px at 80% 8%,#fff,transparent 60%),
  radial-gradient(1px 1px at 90% 27%,#fff,transparent 60%)}
.sun{
  position:fixed;left:66%;top:22%;width:min(15vw,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--sun),var(--sun) 60%,transparent 75%);
  box-shadow:0 0 90px 30px var(--glow),0 0 220px 90px var(--glow);
  transform:translate(var(--sx,0),var(--sy,0));transition:opacity 1s;z-index:1;
}
.haze2{position:fixed;left:0;right:0;top:52%;height:18%;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--haze));filter:blur(6px);transition:background 1s}
/* dunes */
.dunes{position:fixed;inset:0;z-index:3}
.dune{position:absolute;left:0;width:100%;overflow:hidden;pointer-events:none;
  transform:translate(var(--mx),var(--my))}
.dune.d1{top:56%;height:16%;transform:translate(calc(var(--mx)*0.2),calc(var(--my)*0.2))}
.dune.d2{top:58%;height:20%;}
.dune.d3{top:60%;height:24%}
.dune.d4{top:62%;height:28%}
.dune.d5{top:64%;height:32%}
.dune.d6{top:66%;height:38%}
.dune svg{width:100%;height:100%;display:block}
.dune svg path{fill:var(--d);transition:fill 1s ease}
.dune.far svg{filter:url(#shimmer)}
/* caravan */
.caravan{position:fixed;left:-20%;top:52%;z-index:4;pointer-events:none;
  animation:camwalk 110s linear infinite;transform:translate(var(--mx),var(--my));transition:opacity 1s}
@keyframes camwalk{from{left:-25%}to{left:105%}}
.caravan svg{width:28vw;min-width:220px;display:block}
.camel-g{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* sand canvas */
canvas#sand{position:fixed;inset:0;z-index:5;pointer-events:none;mix-blend-mode:screen}
/* title */
.title{position:absolute;left:0;right:0;top:9%;text-align:center;z-index:10;pointer-events:none;
  transform:translate(var(--mx),var(--my))}
.title h1{font-size:clamp(26px,4.6vw,54px);letter-spacing:.34em;text-transform:uppercase;font-weight:400;
  transform:scaleX(1.12);color:#2b1e3d;transition:color 1s}
.title .rule2{width:min(30vw,260px);height:1px;background:linear-gradient(90deg,transparent,#2b1e3d,transparent);margin:12px auto}
.title .sub{font-style:italic;font-size:14px;color:#4a2a2a;letter-spacing:.08em;transition:color 1s}
/* wind */
.wind{position:fixed;top:22px;right:26px;z-index:12;font-family:ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.22em;color:rgba(60,40,30,.75);text-transform:uppercase;text-align:right;transition:color 1s}
/* panel */
.panel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:16px;
  background:rgba(120,85,50,.35);backdrop-filter:blur(14px);border:1px solid rgba(255,235,200,.45);
  border-radius:18px;padding:14px 24px;color:#f8e8c8;flex-wrap:wrap;justify-content:center;
  box-shadow:0 24px 60px rgba(60,30,10,.4)}
.panel .lbl{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.clock2{font-family:ui-monospace,monospace;font-size:15px}
.panel input{appearance:none;-webkit-appearance:none;width:200px;height:5px;border-radius:3px;
  background:linear-gradient(90deg,#f8dca4,#e8a35c,#b26a4a,#5a3a54,#121a3b);outline:none}
.panel input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff3d6,#f5b942);border:2px solid #7a4a2a;cursor:pointer;box-shadow:0 0 12px rgba(255,220,150,.8)}
.pbtn{border:1px solid rgba(255,235,200,.5);background:none;color:#f8e8c8;font-family:ui-monospace,monospace;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:10px 18px;border-radius:99px;cursor:pointer;transition:all .3s}
.pbtn:hover{background:rgba(255,235,200,.18)}
@media(max-width:640px){.panel{left:10px;right:10px;transform:none}.wind{display:none}}
@media(prefers-reduced-motion:reduce){.caravan{animation:none}.dune.far svg *{animation:none}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="sun" id="sun"></div>
<div class="haze2"></div>
<div class="wind" id="wind">Wind ESE · 14 kn</div>

<div class="dunes" id="dunes"></div>
<div class="caravan" id="caravan"></div>
<canvas id="sand"></canvas>

<div class="title">
  <h1>SAHEL MERIDIAN</h1>
  <div class="rule2"></div>
  <div class="sub">Where the ergs meet the evening — 16° 14′ N, 0° 02′ W</div>
</div>

<div class="panel">
  <span class="lbl">Time of day</span>
  <input type="range" id="scrub" min="0" max="1000" value="120">
  <span class="clock2" id="clock2">17:12</span>
  <button class="pbtn" id="pauseBtn" aria-pressed="false">Pause</button>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var T=0.12,paused=RM,scrubbing=false;
  var gust=0.6,gustT=0;
  var keyframes=[
    {t:0,s1:"#5d8fb5",s2:"#e8b86b",s3:"#f8dca4",sun:"#fff6d2",haze:"rgba(240,200,150,.5)",
     d:["#f1d9a8","#e4b982","#d59b62","#bd7a48","#9a5a35","#6e3b24"],sand:"#f4dcae",camel:"#c2683a",stars:0,title:"#2b1e3d"},
    {t:0.35,s1:"#3f5e8c",s2:"#e3894e",s3:"#f6b975",sun:"#ffe9b8",haze:"rgba(230,160,110,.5)",
     d:["#e4b98e","#cf9f6b","#b8845a","#a06a45","#7f4d2c","#5a3018"],sand:"#ecc391",camel:"#b4572e",stars:0.15,title:"#2b1e3d"},
    {t:0.62,s1:"#26305a",s2:"#b2496a",s3:"#ef8a5a",sun:"#ffd9a0",haze:"rgba(200,110,120,.5)",
     d:["#b88aa0","#9a6d85","#7d5270","#5f3a5a","#462642","#2e1a30"],sand:"#c9957c",camel:"#8f4526",stars:0.55,title:"#f0e6dc"},
    {t:0.82,s1:"#121a3b",s2:"#5a2f5a",s3:"#c9613f",sun:"#ffb26a",haze:"rgba(160,80,100,.4)",
     d:["#8a6590","#6b4c78","#50365f","#3a264c","#281a3a","#181026"],sand:"#9c6f68",camel:"#6e3518",stars:0.85,title:"#eee4dc"},
    {t:1,s1:"#070a1a",s2:"#1c1837",s3:"#4a2a3a",sun:"#ff9a5a",haze:"rgba(120,60,90,.35)",
     d:["#5c4a4a","#463737","#342a2e","#241c22","#171322","#120c10"],sand:"#6d5755",camel:"#572b14",stars:1,title:"#e8dcd4"}
  ];
  function lerp(a,b,t){return a+(b-a)*t}
  function smooth(t){return t*t*(3-2*t)}
  function hexLerp(h1,h2,t){
    var a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
    var r=Math.round(lerp((a>>16)&255,(b>>16)&255,t));
    var g=Math.round(lerp((a>>8)&255,(b>>8)&255,t));
    var bl=Math.round(lerp(a&255,b&255,t));
    return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }
  function rgbaLerp(a,b,t){return "rgba("+a+")"}
  var current={};
  function apply(v){
    v=Math.max(0,Math.min(1,v));
    var root=document.documentElement;
    for(var i=0;i<keyframes.length-1;i++){
      var k1=keyframes[i],k2=keyframes[i+1];
      if(v>=k1.t&&v<=k2.t){
        var t=smooth((v-k1.t)/(k2.t-k1.t));
        root.style.setProperty("--sky1",hexLerp(k1.s1,k2.s1,t));
        root.style.setProperty("--sky2",hexLerp(k1.s2,k2.s2,t));
        root.style.setProperty("--sky3",hexLerp(k1.s3,k2.s3,t));
        root.style.setProperty("--sun",hexLerp(k1.sun,k2.sun,t));
        root.style.setProperty("--haze",interpHaze(k1.haze,k2.haze,t));
        root.style.setProperty("--sand",hexLerp(k1.sand,k2.sand,t));
        root.style.setProperty("--camel",hexLerp(k1.camel,k2.camel,t));
        root.style.setProperty("--stars",lerp(k1.stars,k2.stars,t));
        for(var d=0;d<6;d++){
          root.style.setProperty("--d"+(d+1),hexLerp(k1.d[d],k2.d[d],t));
        }
        root.style.setProperty("--titlecol",hexLerp(k1.title,k2.title,t));
        // sun position
        var sp=v*0.9; // from 66%,22% to 42%,70%
        root.style.setProperty("--sx",(66-sp*26.6)+"vw");
        root.style.setProperty("--sy",(22+sp*52)+"vh");
        // sun fades before dropping behind dunes
        var sunA=v<0.86?1:Math.max(0,1-(v-0.86)/0.14);
        document.getElementById("sun").style.opacity=sunA;
        root.style.setProperty("--titlecol",k1.title);
        document.querySelector(".title h1").style.color=hexLerp(k1.title,k2.title,t);
        document.querySelector(".title .sub").style.color=hexLerp(k1.title,k2.title,t);
        // clock 16:40 -> 20:12
        var mins=1000+v*212;
        var h=Math.floor(mins/60),m=Math.floor(mins%60);
        document.getElementById("clock2").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
        break;
      }
    }
  }
  function interpHaze(a,b,t){
    // both rgba()
    var ma=a.match(/rgba\(([\d.]+),([\d.]+),([\d.]+),([\d.]+)\)/);
    var mb=b.match(/rgba\(([\d.]+),([\d.]+),([\d.]+),([\d.]+)\)/);
    if(ma&&mb){
      return "rgba("+Math.round(lerp(+ma[1],+mb[1],t))+","+Math.round(lerp(+ma[2],+mb[2],t))+","+
        Math.round(lerp(+ma[3],+mb[3],t))+","+lerp(+ma[4],+mb[4],t).toFixed(2)+")";
    }
    return a;
  }
  // dunes
  var dunesEl=document.getElementById("dunes");
  var duneCols=["--d1","--d2","--d3","--d4","--d5","--d6"];
  duneCols.forEach(function(c,idx){
    var d=document.createElement("div");
    d.className="dune d"+(idx+1)+(idx===0?" far":"");
    d.innerHTML='<svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path d="'+ridge(idx)+' L1600 600 L0 600 Z" style="fill:var('+c+')"/></svg>';
    dunesEl.appendChild(d);
  });
  function ridge(idx){
    // smooth cubic ridges
    var y=300+idx*18;
    var pts="";
    var seed2=idx*7+3;
    for(var i=0;i<=16;i++){
      var x=i/16*1600;
      var yy=y+Math.sin(i*1.7+seed2)*34+Math.sin(i*0.7)*26+(idx%2?-20:20)+ (i===8?40:0);
      pts+= (i===0?"M":" L")+x.toFixed(0)+" "+yy.toFixed(0);
    }
    return pts;
  }
  // shimmer svg filter
  var shimmer=document.createElementNS("http://www.w3.org/2000/svg","svg");
  var defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML='<filter id="shimmer"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" result="n">'+
    '<animate attributeName="baseFrequency" values="0.012 0.05;0.02 0.045;0.012 0.05" dur="7s" repeatCount="indefinite"/></feTurbulence>'+
    '<feDisplacementMap in="SourceGraphic" in2="n" scale="6">'+
    '<animate attributeName="scale" values="5;9;5" dur="4.5s" repeatCount="indefinite"/></feDisplacementMap></filter>';
  var svgRoot=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svgRoot.setAttribute("style","position:absolute;width:0;height:0");
  svgRoot.appendChild(defs);
  document.body.insertBefore(svgRoot,document.body.firstChild);
  // caravan
  var car=document.getElementById("caravan");
  car.innerHTML='<svg viewBox="0 0 900 260">'+
    (function(){
      var s="";
      for(var c=0;c<4;c++){
        var x=60+c*170;
        s+='<g class="camel-g" style="animation-delay:'+(-c*0.35)+'s">'+
          '<ellipse cx="'+x+'" cy="140" rx="34" ry="20" fill="var(--camel)"/>'+
          '<ellipse cx="'+(x+30)+'" cy="115" rx="18" ry="26" fill="var(--camel)"/>'+
          '<rect x="'+(x+44)+'" y="96" width="38" height="16" rx="7" fill="var(--camel)"/>'+
          '<path d="M'+(x+14)+' 120 Q'+(x+10)+' 90 '+(x+8)+' 72 M'+(x-14)+' 120 Q'+(x-20)+' 96 '+(x-24)+' 78" stroke="var(--camel)" stroke-width="7" fill="none" stroke-linecap="round"/>'+
          '<path d="M'+(x-30)+' 138 l-10 22 M'+(x-16)+' 140 l-6 24 M'+(x+6)+' 158 l2 22 M'+(x+20)+' 150 l10 20" stroke="var(--camel)" stroke-width="8" stroke-linecap="round"/>'+
          '<path d="M'+(x+78)+' 80 q8 -20 0 -40 q-6 10 0 24" stroke="var(--camel)" stroke-width="6" fill="none" stroke-linecap="round"/>'+
          '</g>';
      }
      return s;
    })()+
    '</svg>';
  document.documentElement.style.setProperty("--camel","#c2683a");
  // sand streaks
  var sv2=document.getElementById("sand"),sctx=sv2.getContext("2d");
  var streaks=[],W=0,H=0,DPR=1;
  function resizeSand(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    sv2.width=W*DPR;sv2.height=H*DPR;
    sctx.setTransform(DPR,0,0,DPR,0,0);
    streaks=[];
    for(var i=0;i<260;i++){
      streaks.push({x:Math.random()*W,y:Math.random()*H,l:12+Math.random()*40,
        sp:30+Math.random()*70,s:0.5+Math.random()*1.2,ph:Math.random()*6,a:0.05+Math.random()*0.2});
    }
  }
  window.addEventListener("resize",resizeSand);
  function drawSand(dt){
    sctx.clearRect(0,0,W,H);
    sctx.strokeStyle="#f8e3b0";
    var col=document.documentElement.style.getPropertyValue("--sand")||"#f4dcae";
    for(var i=0;i<streaks.length;i++){
      var st=streaks[i];
      st.x+=st.sp*dt*(0.5+gust*1.6);
      st.ph+=dt;
      st.y+=Math.sin(st.ph*1.7)*6*dt;
      if(st.x>W+60)st.x=-60;
      sctx.globalAlpha=st.a*(0.4+gust*0.6);
      sctx.lineWidth=1+st.s*0.7;
      sctx.strokeStyle=col;
      sctx.beginPath();
      sctx.moveTo(st.x,st.y);
      sctx.lineTo(st.x-st.l*(0.5+gust),st.y-st.l*0.1);
      sctx.stroke();
    }
    sctx.globalAlpha=1;
  }
  // loop
  var last=performance.now(),windT=0;
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!paused&&!scrubbing){
      T+=dt*0.0083; // 60s loop
      if(T>1)T=0;
    }
    apply(T);
    gustT+=dt;
    gust=0.5+ Math.sin(gustT*0.5)*0.4+Math.sin(gustT*1.7)*0.15;
    if(!RM)drawSand(dt);
    windT+=dt;
    if(windT>2){
      windT=0;
      var dirs=["ESE","SE","SSE"];
      var sp2=Math.round(9+gust*10);
      document.getElementById("wind").textContent="Wind "+dirs[Math.floor(Math.random()*3)]+" · "+sp2+" kn";
    }
    requestAnimationFrame(loop);
  }
  // controls
  var scrub=document.getElementById("scrub");
  scrub.addEventListener("pointerdown",function(){scrubbing=true});
  window.addEventListener("pointerup",function(){scrubbing=false});
  scrub.addEventListener("input",function(){
    T=this.value/1000;
    paused=true;
    document.getElementById("pauseBtn").setAttribute("aria-pressed","true");
  });
  document.getElementById("pauseBtn").addEventListener("click",function(){
    paused=!paused;
    this.setAttribute("aria-pressed",paused?"true":"false");
  });
  // parallax
  var targetX=0,targetY=0,mx=0,my=0;
  var fine=matchMedia("(pointer:fine)").matches;
  var layers=[[.2,4],[.4,8],[.55,16],[.7,28],[.85,48],[1,80]];
  if(fine&&!RM){
    window.addEventListener("pointermove",function(e){
      targetX=(e.clientX/innerWidth-0.5)*2;
      targetY=(e.clientY/innerHeight-0.5)*2;
    });
    (function pl(){
      mx+=(targetX-mx)*0.08;my+=(targetY-my)*0.08;
      document.documentElement.style.setProperty("--mx",(-mx*30)+"px");
      document.documentElement.style.setProperty("--my",(-my*14)+"px");
      // per-layer offsets
      document.querySelectorAll(".dune").forEach(function(d,i){
        var f=layers[i]?layers[i][1]:20;
        d.style.transform="translateX("+(-mx*f)+"px) translateY("+(-my*f*0.6)+"px)";
      });
      document.querySelector(".title").style.transform="translateX("+mx*14+"px)";
      requestAnimationFrame(pl);
    })();
  }
  resizeSand();
  apply(0.12);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
