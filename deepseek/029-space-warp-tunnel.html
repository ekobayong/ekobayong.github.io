<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMPGATE — Hyperspace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#7fc4ff;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;cursor:crosshair}
#warp{position:fixed;inset:0;display:block}
.letterbox{position:fixed;left:0;right:0;height:6vh;background:#000;z-index:5;pointer-events:none}
.letterbox.t{top:0}.letterbox.b{bottom:0}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 110% at 50% 50%,transparent 60%,rgba(0,0,0,.85))}
.scan{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.5;mix-blend-mode:overlay;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.4) 3px 4px)}
/* title */
.hud{position:fixed;inset:0;pointer-events:none;z-index:7;font-size:11px;letter-spacing:.1em}
.titlebar{position:absolute;top:44px;left:0;right:0;text-align:center}
.titlebar h1{font-size:clamp(18px,3vw,30px);font-weight:200;letter-spacing:.5em;text-transform:uppercase;color:#7fc4ff;text-shadow:0 0 14px rgba(63,139,255,.7)}
.titlebar p{margin-top:8px;font-size:10px;letter-spacing:.34em;color:rgba(127,196,255,.6);transition:opacity 1.5s}
.corner{position:absolute;line-height:1.8;text-shadow:0 0 10px rgba(63,139,255,.6)}
.corner.tl{top:16px;left:18px}
.corner.tr{top:16px;right:18px;text-align:right}
.corner.bl{bottom:44px;left:18px}
.corner.br{bottom:44px;right:18px;text-align:right}
.corner b{color:#f4f8ff;font-weight:400}
.hot{color:#f4f8ff;text-shadow:0 0 12px rgba(244,248,255,.95)}
/* speed readout */
.speedbox{position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);text-align:center}
.speedbox .c{font-size:clamp(56px,10vw,120px);font-weight:200;color:#f4f8ff;text-shadow:0 0 30px rgba(63,139,255,.8);line-height:.9;font-variant-numeric:tabular-nums}
.speedbox .c small{font-size:.4em;color:rgba(127,196,255,.75)}
.speedbox .stage{font-size:10px;letter-spacing:.44em;text-transform:uppercase;color:#8a5cff;margin-top:8px}
.bar{width:min(360px,60vw);height:3px;background:rgba(127,196,255,.18);margin:12px auto 0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d8bff,#8a5cff);box-shadow:0 0 12px rgba(61,139,255,.8);transition:width .15s}
/* reticle */
.reticle{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;z-index:6;pointer-events:none}
.reticle circle{fill:none;stroke:rgba(127,196,255,.35);stroke-width:1;
  stroke-dasharray:12 10}
.reticle .r1{animation:sp1 14s linear infinite}
.reticle .r2{animation:sp2 22s linear infinite}
.reticle .r3{stroke-dasharray:2 14;animation:blink 1.2s ease-in-out infinite}
.reticle line{stroke:rgba(127,196,255,.5);stroke-width:1}
@keyframes sp1{to{transform:rotate(360deg)}}
@keyframes sp2{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){
  .reticle .r1,.reticle .r2{animation:none}
  .reticle .r3{animation:none}
}
</style>
</head>
<body>
<canvas id="warp"></canvas>
<div class="letterbox t"></div><div class="letterbox b"></div>
<div class="vig"></div><div class="scan"></div>
<svg class="reticle" viewBox="0 0 160 160" aria-hidden="true">
  <circle class="r1" cx="80" cy="80" r="52"/>
  <circle class="r2" cx="80" cy="80" r="64"/>
  <circle class="r3" cx="80" cy="80" r="4"/>
  <line x1="80" y1="6" x2="80" y2="20"/><line x1="80" y1="140" x2="80" y2="154"/>
  <line x1="6" y1="80" x2="20" y2="80"/><line x1="140" y1="80" x2="154" y2="80"/>
</svg>

<div class="hud">
  <div class="titlebar">
    <h1>JUMPGATE</h1>
    <p id="promptLine">HOLD MOUSE / SPACE TO ENGAGE WARP</p>
  </div>
  <div class="corner tl">
    VECTOR <b id="hVec">0.000</b><br>
    GATE <b>VERTEX-K7</b><br>
    DRIVE <b id="hDrive">IDLE</b>
  </div>
  <div class="corner tr">
    HULL <b id="hHull">100.0%</b><br>
    FPS <b id="hFps">60</b><br>
    STARS <b id="hStars">800</b>
  </div>
  <div class="corner bl">
    DIST <b id="hDist">0.0000</b> LY<br>
    T+ <b id="hTime">0:00</b><br>
    SHAKE <b id="hShake">0.0</b>
  </div>
  <div class="speedbox">
    <div class="c" id="hSpeed">0.00<small> c</small></div>
    <div class="stage" id="hStage">SUBLIGHT</div>
    <div class="bar"><i id="hBar"></i></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("warp"),ctx=cv.getContext("2d");
  var W=0,H=0,DPR=1;
  var stars=[],nStars=0;
  var speed=0,targetSpeed=0,throttle=0.06;
  var engaged=false;
  var t0=performance.now(),tElapsed=0,dist=0;
  var shake=0;
  var FOCAL=420;
  // rings
  var rings=[],nRings=14;
  var coreGlow=null;
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    nStars=Math.round(Math.max(350,Math.min(1400,W*H/2000)));
    stars=[];
    for(var i=0;i<nStars;i++){
      stars.push({
        x:(Math.random()*2-1)*W*1.4,
        y:(Math.random()*2-1)*H*1.4,
        z:200+Math.random()*2800,
        v:Math.random()<0.12?"#8a5cff":Math.random()<0.67?"#3d8bff":"#ffffff",
        s:0.4+Math.random()*0.9
      });
    }
    rings=[];
    var spread=Math.min(W,H)*0.55;
    for(var r=0;r<nRings;r++){
      rings.push({z:200+r*(2800/nRings),angle:r*0.7,spin:0.15+Math.random()*0.25,size:spread});
    }
  }
  window.addEventListener("resize",resize);
  function loop(now){
    var dt=Math.min(0.05,(now-(window.__lt||now))/1000);
    window.__lt=now;
    // speed easing
    if(engaged){targetSpeed=1}else{targetSpeed=0}
    speed+=(targetSpeed-speed)*(engaged?0.045:0.014);
    speed=Math.max(0.0001,speed);
    var zspeed=speed*speed*3800;
    tElapsed+=dt;dist+=speed*speed*0.35*dt;
    // shake
    shake=Math.max(0,shake-0.06);
    if(speed>0.75&&Math.random()<0.5)shake=Math.min(6,shake+0.35);
    var shx=(Math.random()*2-1)*shake,shy=(Math.random()*2-1)*shake;
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2+shx,H/2+shy);
    // core glow
    var bloom=speed;
    var g=ctx.createRadialGradient(0,0,0,0,0,40+bloom*420);
    g.addColorStop(0,"rgba(255,255,255,"+(0.1+bloom*0.62)+")");
    g.addColorStop(0.4,"rgba(127,196,255,"+(bloom*0.35)+")");
    g.addColorStop(1,"rgba(61,139,255,0)");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,0,40+bloom*420,0,7);ctx.fill();
    // stars
    ctx.globalCompositeOperation="lighter";
    ctx.lineCap="round";
    // fade based on speed for trails
    ctx.fillStyle="rgba(0,0,0,"+((1-speed*0.72)*0.28).toFixed(3)+")";
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.z-=zspeed*dt*14;
      if(s.z<60){s.z=200+Math.random()*2800;s.x=(Math.random()*2-1)*W*1.4;s.y=(Math.random()*2-1)*H*1.4}
      var k=FOCAL/Math.max(1,s.z);
      var px=s.x*k,py=s.y*k;
      // streak length proportional to speed
      var len=speed*600*k*0.55+1.2*k;
      var nx=px/Math.max(1,Math.abs(px)||1),ny=py/Math.max(1,Math.abs(py)||1);
      ctx.strokeStyle=s.v;ctx.globalAlpha=0.65+speed*0.3;
      ctx.lineWidth=(0.6+s.s)*k*0.25;
      // chromatic split over 75% speed
      if(speed>0.75){
        var off=Math.min(6,(speed-0.75)*24);
        var ox=Math.min(W/2,200);
        ctx.strokeStyle="#ff3040";
        ctx.beginPath();ctx.moveTo(px-off*k,py);ctx.lineTo(px+off*k-nx*len,py+off*k*0.4-ny*len);ctx.stroke();
        ctx.strokeStyle="#20b0ff";
        ctx.beginPath();ctx.moveTo(px+off*k,py);ctx.lineTo(px-off*k+nx*len,py+off*k*0.6+ny*len);ctx.stroke();
        ctx.strokeStyle=s.v;
      }
      ctx.beginPath();
      ctx.moveTo(px,py);
      ctx.lineTo(px-nx*len,py-ny*len);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    // rings
    for(var r=0;r<nRings;r++){
      var rg=rings[r];
      rg.z-=zspeed*dt*6;
      rg.angle+=rg.spin*(0.5+speed*3)*dt;
      if(rg.z<80){rg.z=200+Math.random()*2800}
      var k2=FOCAL/Math.max(1,rg.z);
      var sz=rg.size*k2*0.5;
      var ox=Math.cos(rg.angle)*8*k2,oy=Math.sin(rg.angle)*6*k2;
      var alpha=Math.max(0,Math.min(0.5,(2800-rg.z)/2800*0.9));
      ctx.strokeStyle="rgba(61,139,255,"+alpha.toFixed(3)+")";
      ctx.lineWidth=1.2*k2;
      ctx.shadowColor="rgba(61,139,255,0.8)";ctx.shadowBlur=8*k2*speed+2;
      ctx.beginPath();
      for(var a=0;a<8;a++){
        var aa=a/8*Math.PI*2+rg.angle;
        var px2=Math.cos(aa)*sz+ox,py2=Math.sin(aa)*sz*0.6+oy;
        if(a===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
      }
      ctx.closePath();ctx.stroke();
      ctx.shadowBlur=0;
      // struts
      if(r%2===0&&r<nRings-1){
        var rg2=rings[r+1];
        var k3=FOCAL/Math.max(1,rg2.z);
        var sz2=rg2.size*k3*0.5;
        var ox2=Math.cos(rg2.angle)*8*k3,oy2=Math.sin(rg2.angle)*6*k3;
        ctx.strokeStyle="rgba(138,92,255,"+(alpha*0.8).toFixed(3)+")";
        ctx.lineWidth=0.6*k2;
        for(var s2=0;s2<8;s2+=2){
          var a1=s2/8*Math.PI*2+rg.angle,a2=s2/8*Math.PI*2+rg2.angle;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a1)*sz+ox,Math.sin(a1)*sz*0.6+oy);
          ctx.lineTo(Math.cos(a2)*sz2+ox2,Math.sin(a2)*sz2*0.6+oy2);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
    ctx.globalCompositeOperation="source-over";
    updateHUD(now);
    requestAnimationFrame(loop);
  }
  function updateHUD(now){
    document.getElementById("hSpeed").innerHTML=speed.toFixed(2)+"<small> c</small>";
    var stage="SUBLIGHT";
    if(speed>0.93)stage="THRESHOLD";
    else if(speed>0.75)stage="HYPERSPACE";
    else if(speed>0.4)stage="WARP ENTRY";
    document.getElementById("hStage").textContent=stage;
    document.getElementById("hBar").style.width=(speed*100)+"%";
    document.getElementById("hVec").textContent=speed.toFixed(3);
    document.getElementById("hDrive").textContent=engaged?"BURN":speed>0.05?(speed>0.75?"MAX":"COAST"):"IDLE";
    if(speed>0.97)document.getElementById("hSpeed").classList.add("hot");
    else document.getElementById("hSpeed").classList.remove("hot");
    document.getElementById("hHull").textContent=(100-speed*4).toFixed(1)+"%";
    document.getElementById("hStars").textContent=stars.length;
    document.getElementById("hDist").textContent=dist.toFixed(4);
    var t=Math.floor(tElapsed);
    document.getElementById("hTime").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
    document.getElementById("hShake").textContent=shake.toFixed(1);
  }
  var fpsC=0,fpsT=0;
  setInterval(function(){
    var el=document.getElementById("hFps");
    el.textContent=Math.round(fpsC/Math.max(0.001,fpsT));
    fpsC=0;fpsT=0;
  },1000);
  // wrapping fps counter in loop
  var __loop=loop;
  function loopW(now){
    fpsC++;fpsT+=0.016;
    __loop(now);
  }
  // input
  window.addEventListener("pointerdown",function(){engaged=true});
  window.addEventListener("pointerup",function(){engaged=false});
  window.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();engaged=true}});
  window.addEventListener("keyup",function(e){if(e.code==="Space")engaged=false});
  // fade prompt after first engage
  var first=true;
  var origPointerDown=window.onpointerdown;
  window.addEventListener("pointerdown",function(){
    if(first){first=false;document.getElementById("promptLine").style.opacity=0}
  });
  if(RM){
    // no shake
    window.addEventListener("pointermove",function(){});
  }
  resize();
  requestAnimationFrame(loopW);
})();
</script>
</body>
</html>
