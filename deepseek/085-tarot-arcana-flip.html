<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Major Arcana — Three-Card Spread</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    radial-gradient(50% 34% at 50% 0%,rgba(255,200,120,.3),transparent 65%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
    radial-gradient(120% 110% at 50% 45%,transparent 55%,rgba(0,0,0,.65)),
    linear-gradient(180deg,#4a0f1e,#2c0812);
  min-height:100vh;color:#f3dc9a;font-family:'Iowan Old Style',Palatino,Georgia,serif;
  overflow-x:hidden;
}
.wrap{max-width:1200px;margin:0 auto;padding:26px 22px 30px}
header{text-align:center;margin-bottom:20px}
header h1{font-size:clamp(28px,4.4vw,52px);font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#f3dc9a;
  text-shadow:0 0 18px rgba(243,220,154,.4)}
header p{font-style:italic;color:#c9a58c;font-size:14px;margin-top:8px}
.rule{width:220px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#f3dc9a,transparent)}
/* slots */
.slots{display:flex;justify-content:center;gap:26px;margin:26px 0 10px;flex-wrap:wrap}
.slot{width:clamp(84px,13vw,150px);height:clamp(140px,21.5vw,250px);border:2px dashed rgba(243,220,154,.4);
  border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px;position:relative}
.slot .lbl2{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,220,154,.6)}
.slot.filled .lbl2{opacity:0}
.slot .reading{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);width:max-content;max-width:60vw;
  font-size:13px;color:#e6cfae;line-height:1.6;text-align:center;opacity:0;transition:opacity .8s}
.slot.filled .reading{opacity:1}
.slot .reading b{font-size:15px;color:#f3dc9a;display:block;margin-bottom:3px}
.slot .kw{display:block;font-style:italic;font-size:11px;color:#c9a58c;margin-top:4px}
/* stage */
.stage{position:relative;height:min(380px,62vh);margin-top:16px;perspective:1400px}
.deck{position:absolute;left:50%;top:50%;}
.card3{
  position:absolute;width:clamp(84px,13vw,150px);height:clamp(140px,21.5vw,250px);transform-style:preserve-3d;
  transform-origin:50% 260%;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),left .5s,top .5s,z-index .2s;
  filter:drop-shadow(0 14px 30px rgba(0,0,0,.5));
}
.card3 .flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.card3.flipped .flipper{transform:rotateY(180deg)}
.card3 .face3{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden}
.card3 .back3{
  background:radial-gradient(circle at 40% 40%,#6e2a44,#4a0f1e 70%);
  border:1px solid rgba(243,220,154,.6);
}
.card3 .back3 .filigree{position:absolute;inset:9px;border:1.5px solid rgba(243,220,154,.8);border-radius:6px;
  background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(243,220,154,.06) 12px 13px);}
.card3 .back3 .rosette{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60%;height:60%}
.card3 .front3{
  background:linear-gradient(180deg,#1b1424,#2a1d36);
  border:1px solid rgba(243,220,154,.7);
}
.card3 .front3 .frm{position:absolute;inset:8px;border:1px solid rgba(243,220,154,.5);border-radius:5px}
.card3 .front3 .rn{position:absolute;top:12px;left:14px;font-size:15px;color:#d9b45b}
.card3 .front3 .cn{position:absolute;bottom:11px;right:13px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#d9b45b}
.card3 .front3 .art3{position:absolute;inset:0;display:grid;place-items:center}
.card3 .front3 .art3 svg{width:55%;height:55%;filter:drop-shadow(0 0 6px rgba(217,180,91,.4))}
.card3:not(.in-hand):hover{transform:translateY(-18px)}
.card3.lift{transform:translateY(-18px)}
/* toolbar */
.toolbar{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.tbtn3{border:1px solid rgba(243,220,154,.5);background:rgba(20,10,20,.5);color:#f3dc9a;font-family:inherit;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:13px 26px;border-radius:99px;cursor:pointer;transition:all .3s;
  backdrop-filter:blur(8px)}
.tbtn3:hover{border-color:#f3dc9a;transform:translateY(-2px)}
.tbtn3:disabled{opacity:.4;cursor:default;transform:none}
.status{text-align:center;font-style:italic;color:#c9a58c;font-size:13.5px;margin-top:12px;min-height:20px}
@media(max-width:640px){
  .slots{gap:14px}
  .card3{width:26vw;height:43vw;font-size:12px}
  .toolbar{gap:8px}
}
@media(prefers-reduced-motion:reduce){.card3,.flipper{transition:none}.back3 .rosette{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Major Arcana</h1>
    <p>three cards, drawn honestly, from a shuffled deck of twenty-two</p>
    <div class="rule"></div>
  </header>

  <div class="slots" id="slots">
    <div class="slot" data-slot="0"><div class="reading"><b>—</b>waiting for the cards<span class="kw"></span></div><span class="lbl2">Past</span></div>
    <div class="slot" data-slot="1"><div class="reading"><b>—</b>waiting for the cards<span class="kw"></span></div><span class="lbl2">Present</span></div>
    <div class="slot" data-slot="2"><div class="reading"><b>—</b>waiting for the cards<span class="kw"></span></div><span class="lbl2">Future</span></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="toolbar">
    <button class="tbtn3" id="shuffleBtn">Shuffle</button>
    <button class="tbtn3" id="drawBtn">Draw three</button>
    <button class="tbtn3" id="gatherBtn">Gather the deck</button>
  </div>
  <div class="status" id="status">the deck waits</div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NAMES=["THE FOOL","THE MAGICIAN","THE HIGH PRIESTESS","THE EMPRESS","THE EMPEROR","THE HIEROPHANT","THE LOVERS","THE CHARIOT","STRENGTH","THE HERMIT","WHEEL OF FORTUNE","JUSTICE","THE HANGED MAN","DEATH","TEMPERANCE","THE DEVIL","THE TOWER","THE STAR","THE MOON","THE SUN","JUDGEMENT","THE WORLD"];
  var ROMAN=["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
  var ART =[
    '<svg viewBox="0 0 60 90"><path d="M10 40 q20 -70 44 -16" stroke="#d9b45b" stroke-width="2" fill="none"/><circle cx="46" cy="16" r="7" fill="#d9b45b" opacity=".8"/><path d="M10 62 q30 14 40 0" stroke="#d9b45b" stroke-width="1.5" fill="none"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M20 60 v-26 M24 34 q14 -6 10 -16 M30 60 v16 M38 38 q-4 12 6 14" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M14 46 h30" stroke="#d9b45b" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 60 90"><rect x="22" y="18" width="6" height="40" fill="#d9b45b" opacity=".6"/><rect x="32" y="18" width="6" height="40" fill="#d9b45b" opacity=".6"/><path d="M20 66 a10 10 0 0 0 20 0" stroke="#d9b45b" stroke-width="1.6" fill="none"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="30" r="10" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M16 44 h28 M20 50 h20 M24 56 h12" stroke="#d9b45b" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M30 16 l14 12 v26 h-28 v-26 z" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M20 54 h20 M24 48 h12" stroke="#d9b45b" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M22 40 h16 M30 40 v20 M26 60 h8" stroke="#d9b45b" stroke-width="1.6"/><circle cx="30" cy="22" r="7" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M14 40 h9 M37 40 h9" stroke="#d9b45b" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="22" r="8" fill="#d9b45b" opacity=".7"/><path d="M30 30 a12 16 0 0 0 -20 0 z" fill="#d9b45b" opacity=".7"/><path d="M12 52 q18 10 36 0" stroke="#d9b45b" stroke-width="1.6" fill="none"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="52" r="14" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M20 26 h20 M16 20 l6 6 M30 14 v10" stroke="#d9b45b" stroke-width="1.6"/><circle cx="12" cy="58" r="2.4" fill="#d9b45b"/><circle cx="48" cy="58" r="2.4" fill="#d9b45b"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M30 14 a15 18 0 1 1 -6 30" stroke="#d9b45b" stroke-width="1.6" fill="none"/><circle cx="18" cy="52" r="9" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M38 30 a6 7 0 1 0 6 7" stroke="#d9b45b" stroke-width="1.6" fill="none"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M30 60 l8 -28 -8 8 -8 -8 z" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M22 24 h16" stroke="#d9b45b" stroke-width="1.6" opacity=".5"/><path d="M10 70 h40" stroke="#d9b45b" stroke-width="1.2" opacity=".4"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="28" r="13" stroke="#d9b45b" stroke-width="1.6" fill="none"/><g stroke="#d9b45b" stroke-width="1.2"><line x1="30" y1="15" x2="30" y2="41"/><line x1="17" y1="28" x2="43" y2="28"/><line x1="46" y1="52" x2="34" y2="42" opacity=".5"/><line x1="14" y1="52" x2="26" y2="42" opacity=".5"/></g></svg>',
    '<svg viewBox="0 0 60 90"><line x1="18" y1="62" x2="42" y2="24" stroke="#d9b45b" stroke-width="1.8"/><line x1="16" y1="24" x2="44" y2="62" stroke="#d9b45b" stroke-width="1.8"/><circle cx="30" cy="22" r="5" fill="#d9b45b" opacity=".7"/><circle cx="30" cy="62" r="5" fill="#d9b45b" opacity=".7"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M22 18 l14 -4 l-4 14 l-14 4 z" stroke="#d9b45b" stroke-width="1.6" fill="none"/><circle cx="30" cy="52" r="13" stroke="#d9b45b" stroke-width="1.6" fill="none"/><circle cx="30" cy="52" r="6" fill="#d9b45b" opacity=".6"/><path d="M14 74 h32" stroke="#d9b45b" stroke-width="1.2" opacity=".5"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M18 44 l12 -6 l12 8" stroke="#d9b45b" stroke-width="1.8" fill="none"/><path d="M22 60 q16 8 16 14" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M14 22 a16 12 0 0 0 32 0" stroke="#d9b45b" stroke-width="1.6" fill="none"/><circle cx="30" cy="18" r="4" fill="#d9b45b" opacity=".8"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="34" r="12" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M28 44 l-8 14 h6 l-4 10 l14 -18 h-6 l8 -12 z" fill="#d9b45b" opacity=".8"/><path d="M16 26 h28 M18 22 q12 6 24 -4" stroke="#d9b45b" stroke-width="1.4" fill="none"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M30 14 l8 14 l-16 0 z" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M14 34 q18 8 32 0 l-4 12 h-24 z" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M8 74 h44" stroke="#d9b45b" stroke-width="1.2" opacity=".6"/><g stroke="#d9b45b" stroke-width="1"><line x1="14" y1="58" x2="46" y2="58"/><line x1="18" y1="62" x2="42" y2="62"/></g></svg>',
    '<svg viewBox="0 0 60 90"><path d="M12 62 h36 M14 58 h32 M16 54 h28" stroke="#d9b45b" stroke-width="1.4" opacity=".6"/><path d="M18 26 q4 -10 12 -10 q8 0 12 10" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M22 22 l2 32 M30 20 l1 34 M38 22 l-2 32" stroke="#d9b45b" stroke-width="1" opacity=".8"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="26" r="9" fill="#d9b45b" opacity=".85"/><path d="M30 35 v22 M24 40 h12" stroke="#d9b45b" stroke-width="1.6"/><path d="M12 62 q18 8 36 0" stroke="#d9b45b" stroke-width="1.4" fill="none" opacity=".7"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M12 50 q18 24 36 0 l4 8 h-44 z" stroke="#d9b45b" stroke-width="1.6" fill="none"/><path d="M16 34 h28 M18 40 h24" stroke="#d9b45b" stroke-width="1.4" opacity=".5"/><path d="M24 26 q6 -8 12 0" stroke="#d9b45b" stroke-width="1.4" fill="none"/></svg>',
    '<svg viewBox="0 0 60 90"><path d="M14 30 q16 -22 32 0 M14 30 h32 M14 30 v30" stroke="#d9b45b" stroke-width="1.4" fill="none"/><path d="M22 44 l4 4 l8 -10 l4 4" stroke="#d9b45b" stroke-width="1.2" fill="none"/><circle cx="24" cy="60" r="3" fill="#d9b45b" opacity=".7"/><circle cx="36" cy="60" r="3" fill="#d9b45b" opacity=".7"/></svg>',
    '<svg viewBox="0 0 60 90"><circle cx="30" cy="26" r="11" stroke="#d9b45b" stroke-width="1.6" fill="none"/><circle cx="30" cy="26" r="6" fill="#d9b45b" opacity=".6"/><g stroke="#d9b45b" stroke-width="1.2"><path d="M18 44 a12 12 0 0 0 24 0 M20 48 h20 M22 52 h16"/></g></svg>'
  ];
  var READ={
    upright:["a blank page — the courage to begin without a map, and the joy of that falling.",
      "the tools are on the table and the will is warm; make the first mark.",
      "hush — listen to what already knows. intuition before evidence, this once.",
      "nurture what you are growing; soil, patience, and the occasional stern word.",
      "boundaries drawn kindly are also love. stand on the roof you built.",
      "the lesson is old and the classroom is the day: learn it again, better.",
      "a meeting of true wills — choose each other, and then choose again.",
      "forward, wheels turning, even when the destination is only motion.",
      "gentleness is a form of strength with better manners. hold firm and soft.",
      "withdraw a while; the light you are looking for is behind you, feeding the path.",
      "the wheel turns — fortune respects momentum, so keep your hand on it.",
      "weigh it exactly; fairness is a craft and today you are the artisan.",
      "see it upside down for a while; the truth reads better inverted.",
      "what ends makes room. release it with ceremony, not with sorrow.",
      "blend, don't choose — the middle path is a real road, not a compromise.",
      "the chain is one you polished yourself; how much do you actually want it?",
      "the tower falls so the sky can enter. draft the ruins; they are load-bearing.",
      "after the storm, the water — hope is not naive, it is precise.",
      "the tide of the unconscious; go gently, and keep one lantern.",
      "warmth after weather. this one is yours, and it is allowed.",
      "the call has already been sounded; answer it with your whole voice.",
      "completion with no applause but your own — the circle is now a spiral."],
    reversed:["a leap taken twice — check the ground, then leap anyway, but check it.",
      "the trick is showing; the question is whose hand. look behind the curtain.",
      "the whisper drowned by noise; quiet the room and the answer repeats.",
      "over-watering; let the small thing dry out, then love it again.",
      "the fortress is chilly; leave one window open for the weather.",
      "the rote has outlived the lesson — break the ritual, keep the meaning.",
      "a chord that will not resolve; check your own tuning before the partner's.",
      "the brakes found their voice; pause is a gear, not a failure.",
      "force masquerading as courage; the soft route is sometimes the braver one.",
      "the cave is comfortable; the sun will wait, but not forever.",
      "the wheel stalls on a rock; a small push in any direction is still a direction.",
      "the scales have dust; clean them before the verdict, or the verdict cleans you.",
      "the rope too tight — cut one knot, never the love.",
      "holding on past the natural term; the green branch is behind you.",
      "the blend gone muddy; taste the extremes tonight and decide.",
      "the binding is comfortable now; that is precisely the warning.",
      "the blast was personal; build lower, build wider, and forgive the sky.",
      "hope deferred; the water remembers the way even when the stream is dry.",
      "the fog thickens; do not navigate on memory alone. ask.",
      "the sun behind a cloud of your own making; the weather is yours.",
      "the trumpet muted; the moment will re-pass if you do not."
    ]};
  var keywords=["new beginnings","manifestation","intuition","abundance","authority","tradition","union","victory","courage","solitude","cycles","accountability","surrender","transition","harmony","temptation","upheaval","hope","illusion","joy","awakening","completion"];
  // build deck
  var stage=document.getElementById("stage");
  var cards=[];
  NAMES.forEach(function(n,i){
    cards.push({idx:i,art:ART[i],rev:false,state:"deck",el:null});
  });
  var deckEl=document.createElement("div");
  deckEl.className="deck";
  stage.appendChild(deckEl);
  var shuffling=false;
  function buildCardsInDeck(){
    deckEl.innerHTML="";
    cards.forEach(function(c,i){
      var el=document.createElement("div");
      el.className="card3";
      el.style.zIndex=10-i;
      el.style.left="0px";el.style.top="0px";
      el.innerHTML='<div class="flipper"><div class="face3 back3"><div class="filigree"></div>'+
        '<svg class="rosette" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" stroke="#f3dc9a" stroke-width="1.2" fill="none"/>'+
        '<path d="M30 30 m-16 0 a16 16 0 0 1 32 0" fill="#f3dc9a" opacity=".35"/>'+
        '<g stroke="#f3dc9a" stroke-width=".8" opacity=".6"><line x1="6" y1="54" x2="10" y2="50"/><line x1="12" y1="54" x2="14" y2="50"/><line x1="46" y1="54" x2="50" y2="50"/><line x1="52" y1="54" x2="54" y2="50"/></g></svg>'+
        '</div><div class="face3 front3"><div class="frm"></div><span class="rn">'+ROMAN[c.idx]+'</span>'+
        '<div class="art3">'+c.art+'</div><span class="cn">'+NAMES[c.idx]+'</span></div></div>';
      c.el=el;
      deckEl.appendChild(el);
      el.addEventListener("click",function(){clickCard(c)});
      el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();clickCard(c)}});
      el.setAttribute("tabindex","0");
      el.setAttribute("role","button");
      el.setAttribute("aria-label",NAMES[c.idx]);
    });
  }
  function fanDeck(){
    var n=cards.length;
    var maxAngle=Math.min(34,2.2*n/2);
    cards.forEach(function(c,i){
      var el=c.el;
      var frac=i/(n-1)-0.5;
      var angle=frac*maxAngle;
      var x=Math.sin(frac*maxAngle*Math.PI/180)*300;
      el.style.left=x+"px";
      el.style.top=0+"px";
      el.style.transform="translate(-50%,-100%) rotate("+angle+"deg)";
      el.style.zIndex=i;
      el.classList.add("in-hand");
      el.dataset.state="deck";
    });
  }
  var slots=[document.querySelector('[data-slot="0"]'),document.querySelector('[data-slot="1"]'),document.querySelector('[data-slot="2"]')];
  var drawn=[];
  function shuffle(){
    if(shuffling)return;
    shuffling=true;
    cards.forEach(function(c){c.rev=Math.random()<0.3;c.state="deck";c.el.classList.add("flipped");c.el.classList.remove("lift");c.el.dataset.state="deck"});
    // randomize order
    for(var i=cards.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=cards[i];cards[i]=cards[j];cards[j]=t;
    }
    document.getElementById("status").textContent="shuffling…";
    setTimeout(function(){
      cards.forEach(function(c,i){
        // stack them compactly
        c.el.style.left="0px";c.el.style.top="-"+i*1.5+"px";
        c.el.style.transform="";
        c.el.classList.remove("in-hand");
      });
      setTimeout(function(){
        cards.forEach(function(c){c.el.classList.remove("flipped");c.el.dataset.state="deck"});
        fanDeck();
        document.getElementById("status").textContent="the deck is shuffled — draw three";
        document.getElementById("drawBtn").disabled=false;
        shuffling=false;
      },RM?0:500);
    },RM?0:1400);
  }
  function clickCard(c){
    if(c.state!=="deck")return;
    if(drawn.length>=3){status("the spread is full — gather the deck first");return}
    var slot=slots[drawn.length];
    var rect=c.el.getBoundingClientRect();
    var srect=slot.getBoundingClientRect();
    var dx=srect.left+ srect.width/2-rect.left-rect.width/2;
    var dy=srect.top+srect.height/2-rect.top-rect.height/2;
    c.state="flying";
    c.el.style.transition="left .5s cubic-bezier(.22,1,.36,1),top .5s cubic-bezier(.22,1,.36,1)";
    c.el.style.left=dx+"px";
    c.el.style.top=dy+"px";
    c.el.style.transform="translate(-50%,-100%) rotate(0deg)";
    var cc=c;
    setTimeout(function(){
      cc.el.classList.add("flipped");
      if(!RM){
        var foil=document.createElement("div");
        foil.style.cssText="position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.8) 48%,transparent 66%);transform:translateX(-120%);animation:foilsweeep .7s ease .2s forwards";
        cc.el.querySelector(".front3").appendChild(foil);
        setTimeout(function(){foil.remove()},1100);
      }
      cc.el.classList.add("lift");
      cc.state="slot";
      cc.el.dataset.state="slot";
      drawn.push(cc);
      slot.classList.add("filled");
      var r=cc.rev?"reversed":"upright";
      var reading=READ[r][cc.idx];
      var kw=keywords[cc.idx];
      slot.querySelector(".reading").innerHTML="<b>"+NAMES[cc.idx]+(cc.rev?" · reversed":"")+"</b>"+reading+'<span class="kw">'+kw+'</span>';
      status((drawn.length<3)?("card "+(drawn.length)+" of 3 revealed"):"the spread is complete — the rest of the deck dims");
      if(drawn.length===3){
        cards.forEach(function(c2){if(c2.state==="deck")c2.el.style.opacity=".25"});
        document.getElementById("drawBtn").disabled=true;
      }
    },RM?0:560);
  }
  function status(msg){document.getElementById("status").textContent=msg}
  function gather(){
    document.getElementById("drawBtn").disabled=false;
    cards.forEach(function(c){
      c.state="deck";
      c.el.style.transition="all .5s";
      c.el.style.opacity=1;
      c.el.classList.remove("flipped","lift");
      c.el.dataset.state="deck";
      c.el.style.left="0px";c.el.style.top="0px";
      c.el.style.transform="";
    });
    drawn.slice().forEach(function(c){
      var slot=slots[drawn.indexOf(c)];
      slot.classList.remove("filled");
      slot.querySelector(".reading").innerHTML="<b>—</b>waiting for the cards<span class='kw'></span>";
    });
    drawn=[];
    setTimeout(function(){
      cards.forEach(function(c,i){c.el.style.top="-"+i*1.5+"px"});
      setTimeout(function(){
        cards.forEach(function(c,i){c.el.style.top="0px";c.el.style.zIndex=10-i;c.el.style.opacity=1;c.el.style.left="0px"});
        fanDeck();
        status("the deck is gathered");
      },RM?0:400);
    },RM?0:300);
  }
  document.getElementById("shuffleBtn").addEventListener("click",shuffle);
  document.getElementById("drawBtn").addEventListener("click",function(){
    // pick next deck card and send to first empty slot
    var c=cards.find(function(x){return x.state==="deck"});
    if(c)clickCard(c);
  });
  document.getElementById("gatherBtn").addEventListener("click",gather);
  buildCardsInDeck();
  fanDeck();
  var st=document.createElement("style");
  st.textContent="@keyframes foilsweeep{to{transform:translateX(120%)}}";
  document.head.appendChild(st);
})();
</script>
</body>
</html>
