<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALEIDO — Symmetric Mandala Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--amber:#f0b35a}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(80% 70% at 50% 40%,#1a1b1e 0%,#0d0e10 75%);
  color:#d8d9de;font-family:ui-sans-serif,system-ui,sans-serif;touch-action:none;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(120% 110% at 50% 50%,transparent 60%,rgba(0,0,0,.55))}
canvas#stage{position:fixed;inset:0;z-index:1;display:block;touch-action:none}
/* header */
.brand{position:fixed;top:26px;left:30px;z-index:10;pointer-events:none}
.brand h1{font-weight:300;font-size:20px;letter-spacing:.32em;text-transform:uppercase}
.brand p{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#8b8c91;margin-top:6px}
.status{position:fixed;top:26px;right:30px;z-index:10;text-align:right;pointer-events:none;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;line-height:1.9;color:#8b8c91}
.status b{color:var(--amber);font-weight:400}
/* toolbar */
.toolbar{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:99px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.5);
  flex-wrap:wrap;justify-content:center;max-width:96vw;
}
.tbtn{
  border:1px solid rgba(255,255,255,.16);background:none;color:#d8d9de;font-family:inherit;
  font-size:12px;letter-spacing:.06em;padding:9px 14px;border-radius:99px;cursor:pointer;transition:all .25s;
  display:flex;align-items:center;gap:6px;
}
.tbtn:hover{border-color:var(--amber);color:#fff}
.tbtn[aria-pressed="true"]{background:rgba(240,179,90,.22);border-color:var(--amber);color:#fff}
.tbtn.amber[aria-pressed="true"]{background:var(--amber);color:#1a1b1e}
.tbtn .ic{width:12px;height:12px}
.pop{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(8px);
  background:rgba(24,25,29,.96);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px;
  display:none;gap:8px;flex-wrap:wrap;justify-content:center;min-width:160px;box-shadow:0 18px 40px rgba(0,0,0,.5);
  opacity:0;transition:opacity .25s,transform .25s}
.pop.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.chip{border:1px solid rgba(255,255,255,.2);background:none;color:#d8d9de;font-family:ui-monospace,monospace;font-size:11px;
  padding:7px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:rgba(240,179,90,.25);border-color:var(--amber);color:#fff}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.sw:hover{transform:scale(1.2)}
.sw.on{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--amber);transform:scale(1.12)}
.huewheel{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;
  background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.huewheel.on{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--amber)}
@media(max-width:640px){
  .brand{top:16px;left:16px}
  .status{top:16px;right:16px}
  .tbtn .txt{display:none}
  .tbtn{padding:9px 11px}
}
@media(prefers-reduced-motion:reduce){.toolbar{transition:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="brand">
  <h1>KALEIDO</h1>
  <p>symmetric mandala studio</p>
</div>
<div class="status">
  SYMMETRY <b id="stSym">12</b> · MIRROR <b id="stMirror">OFF</b><br>
  STROKES <b id="stStroke">0</b> · PALETTE <b id="stPal">EM B E R</b>
</div>

<div class="toolbar" id="toolbar">
  <button class="tbtn" id="clrBtn"><svg class="ic" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4"/></svg><span class="txt">Clear</span></button>
  <button class="tbtn" id="undBtn"><svg class="ic" viewBox="0 0 12 12"><path d="M5 2L2 5l3 3M2 5h5a3 3 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="txt">Undo</span></button>
  <button class="tbtn" id="saveBtn"><svg class="ic" viewBox="0 0 12 12"><path d="M6 1v6m0 0L3.5 4.5M6 7l2.5-2.5M2 10h8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="txt">Save PNG</span></button>
  <button class="tbtn" id="symBtn" aria-pressed="false"><span class="txt">Symmetry</span><span id="symLbl" style="color:var(--amber)">12</span>
    <div class="pop" id="symPop">
      <button class="chip" data-v="6">6</button><button class="chip" data-v="8">8</button>
      <button class="chip on" data-v="12">12</button><button class="chip" data-v="16">16</button>
    </div>
  </button>
  <button class="tbtn" id="mirBtn" aria-pressed="false"><span class="txt">Mirror</span><svg class="ic" viewBox="0 0 12 12"><path d="M6 1v10M2 4L6 1l4 3M2 8l4 3 4-3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
  <button class="tbtn" id="palBtn" aria-pressed="false"><span class="txt">Palette</span>
    <div class="pop" id="palPop">
      <button class="sw on" data-p="ember" style="background:linear-gradient(135deg,#ffb347,#ff5e3a,#c81d5a)" title="Ember"></button>
      <button class="sw" data-p="lagoon" style="background:linear-gradient(135deg,#a7f3d0,#22d3ee,#1e3a8a)" title="Lagoon"></button>
      <button class="sw" data-p="gilded" style="background:linear-gradient(135deg,#fff6d5,#f0b35a,#7a4b12)" title="Gilded"></button>
      <button class="sw" data-p="ivory" style="background:linear-gradient(135deg,#fff,#d8d4c8,#8a887e)" title="Ivory"></button>
      <button class="sw huewheel on" data-p="drift" title="Hue drift"></button>
    </div>
  </button>
  <button class="tbtn amber" id="autoBtn" aria-pressed="false"><span class="txt">Auto-draw</span></button>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("stage"),ctx=cv.getContext("2d");
  var W=0,H=0,DPR=1,centerX=0,centerY=0;
  // state
  var symmetry=12,mirror=false,palette="drift";
  var palettes={ember:["#ffb347","#ff7a3a","#ff5e3a","#e0335a","#c81d5a"],
    lagoon:["#a7f3d0","#5eead4","#22d3ee","#3b82f6","#1e3a8a"],
    gilded:["#fff6d5","#f7dd9a","#f0b35a","#c98a2c","#7a4b12"],
    ivory:["#f6f4ee","#d8d4c8","#c9c4b6","#b4afa0","#8a887e"]};
  var strokes=[],drawing=false,lastP=null,hue=210,autoOn=false;
  var prevW=0,prevH=0;
  function resize(){
    DPR=Math.min(3,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    centerX=W/2;centerY=H/2;
    // preserve drawing
    var tmp=document.createElement("canvas");
    tmp.width=cv.width;tmp.height=cv.height;
    tmp.getContext("2d").drawImage(cv,0,0);
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(tmp,0,0,W,H);
  }
  window.addEventListener("resize",resize);
  // redraw from strokes
  function redraw(){
    ctx.clearRect(0,0,W,H);
    strokes.forEach(function(st){renderStroke(st,1)});
  }
  function renderStroke(st,k){
    var n=symmetry,mult=(st.mirror?2:1);
    ctx.lineCap="round";ctx.lineJoin="round";
    for(var r=0;r<n;r++){
      var a=r/n*Math.PI*2;
      var pts=st.pts.map(function(p){return rot(p.x-centerX,p.y-centerY,a)});
      drawPts(pts,st);
      if(st.mirror){
        var m=pts.map(function(p){return mirrorP(p)});
        drawPts(m,st);
      }
    }
  }
  function rot(x,y,a){return{x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)}}
  function mirrorP(p){return{x:-p.x,y:p.y}}
  function drawPts(pts,st){
    if(pts.length<2)return;
    ctx.strokeStyle=st.color;ctx.shadowColor=st.color;ctx.shadowBlur=6;
    ctx.globalAlpha=0.92;
    ctx.beginPath();
    var m0=mid(pts[0],pts[1]);
    ctx.moveTo(m0.x+centerX,m0.y+centerY);
    for(var i=1;i<pts.length-1;i++){
      var m=mid(pts[i],pts[i+1]);
      ctx.quadraticCurveTo(pts[i].x+centerX,pts[i].y+centerY,m.x+centerX,m.y+centerY);
    }
    var lastP2=pts[pts.length-1];
    ctx.lineTo(lastP2.x+centerX,lastP2.y+centerY);
    ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
  // pointer
  cv.addEventListener("pointerdown",function(e){
    drawing=true;
    var p=getP(e);
    autoOn=false;updateAuto();
    var col=currentColor();
    // vary width lowpass
    strokes.push({pts:[p],color:col,w:14,lastW:14,ts:performance.now(),mirror:mirror});
    lastP=p;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove",function(e){
    var p=getP(e);
    if(drawing){
      var st=strokes[strokes.length-1];
      // speed-based width
      if(lastP){
        var dist=Math.hypot(p.x-lastP.x,p.y-lastP.y);
        var speed=dist/16;
        var target=Math.max(1.2,Math.min(14,14-(speed*3)));
        st.lastW=st.lastW*0.6+target*0.4;
        st.w=st.lastW;
        if(Math.random()<0.97)st.pts.push(p);
      }
      lastP=p;
      // render incrementally
      redraw();
    }
  });
  window.addEventListener("pointerup",function(){drawing=false;lastP=null;updateStatus();autoOn&&startAuto()});
  function getP(e){
    var r=cv.getBoundingClientRect();
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function currentColor(){
    if(palette==="drift"){
      hue=(hue+1.6)%360;
      return "hsl("+hue+",85%,62%)";
    }
    var arr=palettes[palette];
    return arr[Math.floor(Math.random()*arr.length)];
  }
  // ---------- auto-draw ----------
  var autoRAF=null;
  function valueNoise(x){
    var i=Math.floor(x),f=x-i;
    f=f*f*(3-2*f);
    return ((Math.sin(i*127.1)*43758.5453)%1+1)%1*(1-f)+((Math.sin((i+1)*127.1)*43758.5453)%1+1)%1*f;
  }
  function startAuto(){
    if(autoRAF)return;
    (function step(){
      if(!autoOn||document.hidden){autoRAF=null;return}
      var ring=Math.floor(Math.random()*5);
      var baseR=(ring/5)*Math.min(W,H)*0.42+Math.min(W,H)*0.05;
      var len=120+Math.floor(Math.random()*160);
      var dir=Math.random()<0.5?1:-1;
      var baseW=Math.max(1.2,1.5+Math.random()*2.5);
      var col=currentColor();
      var pts=[],t=rngT;
      rgbNow(hue);
      var ang0=Math.random()*Math.PI*2;
      var spread=Math.random()*Math.PI;
      for(var i=0;i<len;i++){
        var ang=ang0+dir*i*0.012*(1+Math.random()*0.6);
        var spd=0.1+Math.random()*0.5;
        var r2=baseR+ (valueNoise(i*0.35+ring)*2-1)*baseR*(0.12+Math.random()*0.2)*spd + Math.sin(i*0.05)*baseR*0.04;
        pts.push({x:Math.cos(ang)*r2,y:Math.sin(ang)*r2});
      }
      var autoCol=palette==="drift"?"hsl("+hue+",85%,62%)":palettes[palette][Math.floor(Math.random()*palettes[palette].length)];
      strokes.push({pts:pts,color:autoCol,w:baseW,lastW:baseW,ts:performance.now(),mirror:randomBool});
      if(strokes.length>400)strokes.splice(0,strokes.length-400);
      redraw();
      autoRAF=requestAnimationFrame(step);
    })();
  }
  var rngT=0,randomBool=false;
  function sig(x){return x}
  function rgbNow(h){}
  function updateAuto(){document.getElementById("autoBtn").setAttribute("aria-pressed",autoOn?"true":"false")}
  // toolbar
  var symVal=12;
  var symPop=document.getElementById("symPop");
  symPop.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click",function(){
      symPop.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")});
      c.classList.add("on");
      symmetry=+c.dataset.v;
      document.getElementById("symLbl").textContent=symmetry;
      updateStatus();
    });
  });
  document.getElementById("symBtn").addEventListener("click",function(e){
    e.stopPropagation();
    var open=symPop.classList.toggle("open");
    document.getElementById("palPop").classList.remove("open");
    document.getElementById("symBtn").setAttribute("aria-pressed",open?"true":"false");
  });
  document.getElementById("palBtn").addEventListener("click",function(e){
    e.stopPropagation();
    var open=document.getElementById("palPop").classList.toggle("open");
    document.getElementById("symPop").classList.remove("open");
    this.setAttribute("aria-pressed",open?"true":"false");
  });
  document.getElementById("palPop").querySelectorAll(".sw").forEach(function(s){
    s.addEventListener("click",function(){
      document.getElementById("palPop").querySelectorAll(".sw").forEach(function(x){x.classList.remove("on")});
      s.classList.add("on");
      palette=s.dataset.p;
      updateStatus();
    });
  });
  document.getElementById("mirBtn").addEventListener("click",function(){
    mirror=!mirror;
    this.setAttribute("aria-pressed",mirror?"true":"false");
    updateStatus();
  });
  document.getElementById("clrBtn").addEventListener("click",function(){strokes=[];redraw();updateStatus()});
  document.getElementById("undBtn").addEventListener("click",function(){strokes.pop();redraw();updateStatus()});
  document.getElementById("saveBtn").addEventListener("click",function(){
    var out=document.createElement("canvas");
    out.width=W*DPR;out.height=H*DPR;
    var oc2=out.getContext("2d");
    var g=oc2.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
    g.addColorStop(0,"#1a1b1e");g.addColorStop(1,"#0d0e10");
    oc2.fillStyle=g;oc2.fillRect(0,0,W,H);
    oc2.drawImage(cv,0,0);
    var a=document.createElement("a");
    a.download="kaleido-mandala.png";
    a.href=out.toDataURL();
    a.click();
  });
  var autoBtn=document.getElementById("autoBtn");
  autoBtn.addEventListener("click",function(){
    autoOn=!autoOn;
    updateAuto();
    if(autoOn)startAuto();
  });
  window.addEventListener("keydown",function(e){
    if(e.key==="a"||e.key==="A")autoBtn.click();
    if(e.key==="c"||e.key==="C")document.getElementById("clrBtn").click();
    if(e.key==="z"||e.key==="Z")document.getElementById("undBtn").click();
    if(e.key==="s"||e.key==="S")document.getElementById("saveBtn").click();
    if(e.key==="m"||e.key==="M")document.getElementById("mirBtn").click();
    if(e.key==="Escape"){symPop.classList.remove("open");document.getElementById("palPop").classList.remove("open")}
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest("#symBtn"))symPop.classList.remove("open");
    if(!e.target.closest("#palBtn"))document.getElementById("palPop").classList.remove("open");
  });
  function updateStatus(){
    document.getElementById("stSym").textContent=symmetry;
    document.getElementById("stMirror").textContent=mirror?"ON":"OFF";
    document.getElementById("stStroke").textContent=strokes.length;
    document.getElementById("stPal").textContent=(palette==="drift"?"DRIFT":palette.toUpperCase());
  }
  updateStatus();
  resize();
})();
</script>
</body>
</html>
