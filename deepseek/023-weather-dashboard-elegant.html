<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Ellery — Weather Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#fbe9c8;--bg2:#f4c98a;--bg3:#e8a35c;--ink:#3b2a14;
  --acc:#e07a1f;--acc2:#f6b352;--card:rgba(255,255,255,.55);
  --serif:Georgia,'Iowan Old Style',Palatino,serif;
  --sans:ui-sans-serif,system-ui;--mono:ui-monospace,Menlo,Consolas,monospace;
}
body[data-condition="cloudy"]{--bg1:#e9edf2;--bg2:#cfd8e3;--bg3:#aab8c9;--ink:#33445a;--acc:#5f7d9d;--acc2:#9db6d0}
body[data-condition="rain"]{--bg1:#cfe0ee;--bg2:#8fb1cf;--bg3:#4f78a3;--ink:#17324d;--acc:#2b6aa8;--acc2:#6f9cc8}
body[data-condition="snow"]{--bg1:#f7f9fc;--bg2:#e3ebf5;--bg3:#c8d6e8;--ink:#33455c;--acc:#6f8fb8;--acc2:#a9c2dd}
body[data-condition="storm"]{--bg1:#3a4256;--bg2:#232a3c;--bg3:#14192a;--ink:#eef1f7;--acc:#f0c45a;--card:rgba(255,255,255,.09)}
body{
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  color:var(--ink);font-family:var(--sans);min-height:100vh;transition:background .7s,color .7s;
}
.wrap{max-width:1400px;margin:0 auto;padding:36px 30px 60px}
/* header */
.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,40px);font-weight:400}
.head h1 em{font-style:italic}
.seg{display:flex;background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px}
.seg button{border:none;background:none;color:var(--ink);opacity:.65;font-family:inherit;font-size:12.5px;padding:9px 20px;border-radius:999px;cursor:pointer;transition:all .4s}
.seg button.on{background:var(--acc);color:#fff;opacity:1}
/* cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{grid-column:span 4;background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);
  border-radius:24px;padding:24px;box-shadow:0 18px 40px -18px rgba(0,0,0,.25);transition:transform .3s,box-shadow .3s,background .7s}
.card:hover{transform:translateY(-2px)}
.card.span8{grid-column:span 8}.card.span4{grid-column:span 4}.card.span12{grid-column:span 12}
@media(max-width:980px){.card.span8,.card.span4{grid-column:span 12}}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .card.span8,.card.span4,.card{grid-column:span 1}
}
.card h3{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);opacity:.55;margin-bottom:18px;font-family:var(--mono)}
/* current */
.cur{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.temp{font-family:var(--serif);font-size:clamp(64px,9vw,128px);line-height:.9;letter-spacing:-.03em;font-weight:400}
.desc{font-size:18px;margin:8px 0 4px}
.feels{font-size:13px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 26px;font-family:var(--mono);font-size:13px;margin-top:16px;width:100%}
.stats b{display:block;font-size:16px;font-weight:400}
/* wind compass */
.wind{position:relative;width:200px;height:200px;margin:6px auto}
.wind .tick{position:absolute;left:50%;top:50%}
.wn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;text-align:center;font-family:var(--mono);font-size:13px}
.wn b{display:block;font-size:26px;font-weight:400}
.wd{font-size:11px;opacity:.7;letter-spacing:.2em}
/* hourly */
.hourwrap{position:relative}
svg.hour{width:100%;height:auto;display:block}
#hTooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg1);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:5}
/* gauges */
.gauges{display:flex;flex-direction:column;gap:22px}
.gauge .gl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.gauge .gl b{font-weight:400;font-size:17px;font-family:var(--serif)}
.gauge svg{width:100%;height:64px}
/* 7 days */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:560px){.days{grid-template-columns:repeat(4,1fr)}}
.day{text-align:center;padding:12px 6px;border-radius:16px;transition:background .3s}
.day:hover{background:var(--card)}
.day .dn{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.day svg{width:34px;height:34px;margin:8px auto;display:block}
.day .hi{font-family:var(--serif);font-size:19px}
.day .lo{font-size:12px;opacity:.6;font-family:var(--mono)}
.rangebar{height:3px;background:rgba(0,0,0,.14);border-radius:2px;margin-top:8px;position:relative}
.rangebar i{position:absolute;top:-1px;height:5px;border-radius:3px;background:var(--acc)}
/* sun */
.sunwrap{position:relative;width:220px;height:150px;margin:8px auto}
.sunarc{position:absolute;inset:0}
.sunorb{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6d5,var(--acc));
  box-shadow:0 0 24px var(--acc);top:calc(50% - 11px - var(--sunoff,0px));left:calc(var(--sunx,50%) - 11px);transition:left .4s,top .4s}
.sunctrl{margin-top:16px;display:flex;align-items:center;gap:12px}
.sunctrl input{flex:1;appearance:none;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));outline:none}
.sunctrl input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:pointer}
.sunline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;opacity:.65;margin-top:6px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body data-condition="sunny">
<div class="wrap">
  <header class="head">
    <h1>Port Ellery <em>·</em> a coastal forecast</h1>
    <div class="seg" id="condSeg">
      <button data-c="sunny" class="on">Sunny</button>
      <button data-c="cloudy">Cloudy</button>
      <button data-c="rain">Rain</button>
      <button data-c="snow">Snow</button>
      <button data-c="storm">Storm</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var data={
    sunny:{t:22,fl:24,hi:27,lo:15,pre:0,wind:140,ws:12,sunrise:"06:14",sunset:"20:47",
      hours:[14,15,17,19,21,22,21,20,18,17,16,15,15,16,18,20,21,22,23,24,24,23,22,21]},
    cloudy:{t:16,fl:16,hi:19,lo:11,pre:10,wind:200,ws:18,sunrise:"06:22",sunset:"20:34",
      hours:[13,13,14,15,16,16,15,14,13,12,12,11,11,12,13,14,15,15,16,16,15,14,13,12]},
    rain:{t:11,fl:8,hi:13,lo:8,pre:85,wind:240,ws:27,sunrise:"06:30",sunset:"20:18",
      hours:[10,10,11,11,12,11,10,9,9,10,10,9,9,10,11,11,12,11,11,10,10,9,9,8]},
    snow:{t:2,fl:-3,hi:4,lo:-2,pre:70,wind:290,ws:15,sunrise:"07:32",sunset:"17:00",
      hours:[0,0,1,1,2,2,1,0,-1,-1,0,0,1,1,2,2,3,2,2,1,1,0,0,-1]},
    storm:{t:13,fl:10,hi:15,lo:9,pre:95,wind:320,ws:44,sunrise:"06:18",sunset:"20:42",
      hours:[12,13,13,14,13,12,11,10,10,11,12,13,14,15,15,14,14,13,13,12,12,11,11,10]}
  };
  var days={
    sunny:[[20,27],[21,28],[20,27],[18,25],[17,24],[18,26],[19,27]],
    cloudy:[[14,19],[13,18],[14,20],[15,21],[13,19],[12,18],[13,20]],
    rain:[[9,13],[8,12],[9,14],[10,15],[9,13],[8,12],[9,13]],
    snow:[[-2,4],[-3,3],[-1,5],[0,4],[-2,3],[-3,2],[-1,5]],
    storm:[[10,15],[9,14],[11,16],[10,15],[9,14],[8,13],[10,14]]
  };
  var icons={
    sun:'<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#e07a1f"/><g stroke="#e07a1f" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4" y1="4" x2="6" y2="6"/><line x1="18" y1="18" x2="20" y2="20"/><line x1="4" y1="20" x2="6" y2="18"/><line x1="18" y1="6" x2="20" y2="4"/></g></symbol>',
    cloud:'<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 17 18z" fill="#8ca3bd"/></symbol>',
    rain:'<symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 17 18z" fill="#5f7d9d"/><g stroke="#2b6aa8" stroke-width="1.8" stroke-linecap="round"><line x1="8" y1="20" x2="9" y2="22"/><line x1="12" y1="20" x2="13" y2="22"/><line x1="16" y1="20" x2="17" y2="22"/></g></symbol>',
    snow:'<symbol id="i-snow" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 17 18z" fill="#9db4cc"/><g stroke="#6f8fb8" stroke-width="1.4" stroke-linecap="round"><line x1="9" y1="20" x2="9" y2="22"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="9" y1="16" x2="9" y2="18"/></g></symbol>',
    storm:'<symbol id="i-storm" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 17 18z" fill="#59637a"/><polygon points="13,18 10,22 12,22 11,25 15,20 12.5,20 14.5,17" fill="#f0c45a"/></symbol>',
    partly:'<symbol id="i-partly" viewBox="0 0 24 24"><circle cx="8" cy="9" r="5" fill="#f6b352"/><path d="M12 17a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 0 1 22 17z" fill="#8ca3bd"/></symbol>'
  };
  var grid=document.getElementById("grid");
  function card(cls,h,body){return '<div class="card '+cls+'"><h3>'+h+'</h3>'+body+'</div>'}
  // build static structure
  grid.innerHTML=
    card("span8 curCard",'Current conditions · Port Ellery 50.1°N',
      '<div class="cur"><div><div class="temp" id="bigT">22°</div><div class="desc" id="desc">Sunny</div><div class="feels" id="feels">Feels like 24° · sea breeze</div></div>'+
      '<svg id="bigIcon" viewBox="0 0 200 200" style="width:200px;height:200px"></svg></div>'+
      '<div class="stats"><div>High <b id="hiT">27°</b></div><div>Low <b id="loT">15°</b></div><div>Precip <b id="preT">0%</b></div><div>Visibility <b>18 km</b></div><div>Humidity <b>62%</b></div><div>UV <b>5</b></div></div>')
    + card("span4",'Wind · 220° WSW','<div class="wind" id="windbox"><div class="wn" id="windinfo"><b id="ws">12</b><span>km/h</span><div class="wd" id="wd">NW · gusts 19</div></div></div>')
    + card("span8",'Next 24 hours · hourly chart','<div class="hourwrap"><svg class="hour" id="hourSvg" viewBox="0 0 800 220" preserveAspectRatio="none"></svg><div id="hTooltip"></div></div>')
    + card("span4",'Comfort · gauges',
      '<div class="gauges">'+gauge("Humidity",62)+gauge("UV index",5)+gauge("Pressure",1014)+'</div>')
    + card("span8",'Seven days','<div class="days" id="days"></div>')
    + card("span4",'Sun · 06:14 → 20:47','<div class="sunwrap" id="sunwrap"><div class="sunarc" id="sunarc"></div><div class="sunorb" id="sunorb"></div></div>'+
      '<div class="sunctrl"><input type="range" id="sunRange" min="0" max="1439" value="720" aria-label="Time of day"><span style="font-family:var(--mono);font-size:12px" id="sunTime">12:00</span></div>'+
      '<div class="sunline"><span id="sr">06:14</span><span id="ss">20:47</span></div>');
  function gauge(name,val){
    var r=38,c=2*Math.PI*r;
    return '<div class="gauge"><div class="gl"><span>'+name+'</span><b>'+val+'</b></div>'+
      '<svg viewBox="0 0 100 50"><path d="M8 44 A 42 42 0 0 1 92 44" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="8" stroke-linecap="round"/>'+
      '<path d="M8 44 A 42 42 0 0 1 92 44" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(c*0.5)+'" stroke-dashoffset="'+((1-val/100)*c*0.5).toFixed(1)+'"/></svg></div>';
  }
  // big animated icon
  function buildBigIcon(cond){
    var el=document.getElementById("bigIcon");
    var n="";
    if(cond==="sunny")n='<circle cx="100" cy="100" r="34" fill="url(#sunG)"><animate attributeName="r" values="32;36;32" dur="4s" repeatCount="indefinite"/></circle>'+
      '<g stroke="#e07a1f" stroke-width="6" stroke-linecap="round" id="sunRays">'+ray(12)+'</g>';
    if(cond==="cloudy")n='<path d="M55 130a26 26 0 0 1 0-52 34 34 0 0 1 66-8 30 30 0 0 1 4 60z" fill="url(#cloudG)">'+(RM?"":'<animateTransform attributeName="transform" type="translate" values="0 0;12 0;0 0" dur="10s" repeatCount="indefinite"/>')+'</path>'+
      '<path d="M95 150a20 20 0 0 1 0-40 26 26 0 0 1 50-6 23 23 0 0 1 3 46z" fill="url(#cloudG)" opacity=".85">'+(RM?"":'<animateTransform attributeName="transform" type="translate" values="0 0;-10 0;0 0" dur="7s" repeatCount="indefinite"/>')+'</path>';
    if(cond==="rain")n='<path d="M55 130a26 26 0 0 1 0-52 34 34 0 0 1 66-8 30 30 0 0 1 4 60z" fill="url(#cloudG)"/>'+streaks(5,".9s");
    if(cond==="snow")n='<path d="M55 130a26 26 0 0 1 0-52 34 34 0 0 1 66-8 30 30 0 0 1 4 60z" fill="url(#cloudG)"/>'+flakes(5);
    if(cond==="storm")n='<path d="M55 130a26 26 0 0 1 0-52 34 34 0 0 1 66-8 28 28 0 0 1 2 60z" fill="#4a5468"/>'+
      '<polygon points="108,128 92,152 100,152 96,166 118,144 106,144 114,138" fill="#f0c45a">'+(RM?"":'<animate attributeName="opacity" values="1;.2;1;.2;1" dur="3.6s" repeatCount="indefinite"/>')+'</polygon>';
    el.innerHTML='<defs><radialGradient id="sunG" cx=".4" cy=".35"><stop offset="0" stop-color="#fff6d5"/><stop offset="1" stop-color="#f6b352"/></radialGradient>'+
      '<linearGradient id="cloudG" x1="0" y1="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d5dde8"/></linearGradient></defs>'+n;
  }
  function ray(n){var s="";for(var i=0;i<n;i++){var a=i*30;var r1=115,r2=135;var x1=100+r1*Math.cos(a*Math.PI/180),y1=100+r1*Math.sin(a*Math.PI/180);var x2=100+r2*Math.cos(a*Math.PI/180),y2=100+r2*Math.sin(a*Math.PI/180);s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>'} 
    var rot=RM?"":"<animateTransform attributeName='transform' type='rotate' from='0 100 100' to='360 100 100' dur='40s' repeatCount='indefinite'/>";
    return '<g>'+s+rot+'</g>';}
  function streaks(n,d){
    var s="";for(var i=0;i<n;i++){
      var x=60+i*16,y=132+rnd(i)*20;
      s+='<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+26)+'" stroke="#2b6aa8" stroke-width="3.4" stroke-linecap="round">'+
        (RM?"":'<animate attributeName="y1" values="'+y+';'+(y+18)+';'+y+'" dur="'+(1.1-i*0.08)+'s" repeatCount="indefinite"/><animate attributeName="y2" values="'+(y+26)+';'+(y+44)+';'+(y+26)+'" dur="'+(1.1-i*0.08)+'s" repeatCount="indefinite"/>')+'</line>';
    }
    return s;
  }
  function flakes(n){
    var s="";for(var i=0;i<n;i++){
      var x=60+i*16,y=128+rnd(i+3)*22;
      s+='<g stroke="#6f8fb8" stroke-width="1.6" stroke-linecap="round">'+
        '<line x1="'+(x-4)+'" y1="'+y+'" x2="'+(x+4)+'" y2="'+y+'"/><line x1="'+x+'" y1="'+(y-4)+'" x2="'+x+'" y2="'+(y+4)+'"/>'+
        (RM?"":'<animateTransform attributeName="transform" type="translate" values="0 0;4 10;0 20" dur="3.4s" repeatCount="indefinite" keyTimes="0;.5;1"/>')+
        '</g>';
    }
    return s;
  }
  function rnd(i){i=i*2654435761%100;return Math.abs(Math.sin(i)*100)%100}
  // hourly chart
  var hourSvg=document.getElementById("hourSvg");
  function drawHourly(cond){
    var arr=data[cond].hours;
    var W2=800,Hh=220;
    // catmull-rom -> bezier
    var pts=arr.map(function(v,i){return{x:i/23*W2,y:Hh-(v-(-4))/(30-(-4))*(Hh-30)-10}});
    var d="M"+pts[0].x+" "+pts[0].y;
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      var c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
      var c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
      d+=" C"+c1x+" "+c1y+" "+c2x+" "+c2y+" "+p2.x+" "+p2.y;
    }
    var len=d.length;
    hourSvg.innerHTML='<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".34"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient>'+
      '<filter id="hgl"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="var(--acc)" flood-opacity=".3"/></filter></defs>'+
      '<g stroke="rgba(0,0,0,.10)" stroke-width="1">'+[40,100,160].map(function(y){return '<line x1="0" y1="'+y+'" x2="800" y2="'+y+'"/>'}).join("")+'</g>'+
      '<path d="'+d+' L800 220 L0 220 Z" fill="url(#hg)"/>'+
      '<path d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="2.4" filter="url(#hgl)" stroke-dasharray="'+len+'" stroke-dashoffset="'+(RM?0:len)+'">'+(RM?"":'<animate attributeName="stroke-dashoffset" from="'+len+'" to="0" dur="1.6s" fill="freeze"/>')+'</path>';
    // dots + labels
    var mins=[0,6,12,18],max=0,min=0;
    arr.forEach(function(v,i){if(v>arr[max])max=i;if(v<arr[min])min=i});
    [[max,"high"],[min,"low"]].forEach(function(m2){
      var p=pts[m2[0]];
      hourSvg.innerHTML+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--acc)" stroke="#fff" stroke-width="1.4"/>'+
        '<text x="'+p.x+'" y="'+(p.y-10)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">'+arr[m2[0]]+'°</text>';
    });
    mins.forEach(function(h){
      var x=h/23*W2;
      hourSvg.innerHTML+='<text x="'+x+'" y="214" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--ink)" opacity=".6">'+h+':00</text>';
    });
    // hover
    hourSvg.onmousemove=function(e){
      var r=hourSvg.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width*W2;
      var i=Math.max(0,Math.min(23,Math.round(x/(W2/24))));
      var p=pts[i];
      var t=document.getElementById("hTooltip");
      t.style.opacity=1;t.style.left=(p.x/W2*100)+"%";t.style.top=(p.y/220*100-16)+"%";
      t.textContent=i+":00 · "+arr[i]+"°";
    };
    hourSvg.onmouseleave=function(){document.getElementById("hTooltip").style.opacity=0};
  }
  // wind compass
  function drawWind(){
    var box=document.getElementById("windbox");
    var cond=document.body.dataset.condition,d=data[cond];
    var ticks="";for(var i=0;i<72;i++){var a=i*5*Math.PI/180;vis(a)}function vis(a){
      var r1=96,r2=(i%9===0)?82:90;
      ticks+='<line x1="'+(100+r1*Math.sin(a))+'" y1="'+(100-r1*Math.cos(a))+'" x2="'+(100+r2*Math.sin(a))+'" y2="'+(100-r2*Math.cos(a))+'" stroke="var(--ink)" stroke-opacity=".4" stroke-width="1"/>';
      if(i%18===0){ticks+='<text x="'+(100+72*Math.sin(a))+'" y="'+(100-72*Math.cos(a)+4)+'" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--ink)" opacity=".7">'+["N","E","S","W"][i/18]+'</text>'}
    }
    ticks+='<g transform="rotate('+(d.wind-90)+' 100 100)"><polygon points="100,18 108,96 100,88 92,96" fill="var(--acc)"/><polygon points="100,18 108,96 100,88" fill="none" stroke="var(--ink)" stroke-width="1"/></g>';
    box.innerHTML=ticks+'<div class="wn"><b id="ws2">'+d.ws+'</b><span>km/h</span><div class="wd">'+dirName(d.wind)+' · gusts '+Math.round(d.ws*1.6)+'</div></div>';
  }
  function dirName(d){var dirs=["N","NE","E","SE","S","SW","W","NW"];return dirs[Math.round(d/45)%8]}
  // days
  function drawDays(cond){
    var el=document.getElementById("days");
    var names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    var ids=["sun","cloud","rain","snow","storm","cloud","sun"];
    var arr=days[cond];
    var wmax=Math.max.apply(null,arr.map(function(x){return x[1]}));
    var wmin=Math.min.apply(null,arr.map(function(x){return x[0]}));
    el.innerHTML=arr.map(function(day,i){
      var pct=(day[1]-wmin)/(wmax-wmin);
      var left=(day[0]-wmin)/(wmax-wmin);
      return '<div class="day"><div class="dn">'+names[i]+'</div><svg viewBox="0 0 24 24"><use href="#i-'+ids[i]+'"/></svg>'+
        '<div class="hi">'+day[1]+'°</div><div class="lo">'+day[0]+'°</div>'+
        '<div class="rangebar"><i style="left:'+(left*100)+'%;width:'+Math.max(6,pct*100-left*100)+'%"></i></div></div>';
    }).join("");
  }
  // sun card
  function drawSun(cond){
    var d=data[cond];
    function min(s){var p=s.split(":");return +p[0]*60+ +p[1]}
    var sr=min(d.sunrise),ss=min(d.sunset);
    document.getElementById("sr").textContent=d.sunrise;
    document.getElementById("ss").textContent=d.sunset;
    var range=document.getElementById("sunRange");
    var lbl=document.getElementById("sunTime");
    function upd(min2){
      // arc
      var t=(min2-sr)/(ss-sr);
      var angle=Math.PI*(1-Math.min(1,Math.max(0,t)));
      var x=50+48*Math.cos(angle),y=130-48*Math.sin(angle);
      var arc='<path d="M2 130 A 110 110 0 0 1 218 130" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2" stroke-dasharray="6 6"/>';
      arc+='<path d="M2 130 A 110 110 0 0 1 '+(218*t)+' 130" ... >';
      arc+='<path d="M2 130 A 110 110 0 0 1 '+(2+216*t).toFixed(1)+' '+(130-216*Math.sin(Math.acos(2*(1-t)-1))).toFixed(0)+'' +
        ' fill="none" stroke="'+(t<1?'var(--acc2)':'var(--acc)')+'" stroke-width="4" stroke-linecap="round"/>';
      document.getElementById("sunarc").innerHTML='<svg viewBox="0 0 240 150" style="width:100%;height:100%">'+
        '<path d="M2 130 A 110 110 0 0 1 218 130" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="2" stroke-dasharray="7 7"/>'+
        '<path d="M2 130 A 110 110 0 0 1 '+(2+216*Math.min(1,Math.max(0,t))).toFixed(1)+' '+(t<=0?130:(130-216*Math.sin(Math.min(Math.PI,Math.max(0,t)*Math.PI)))).toFixed(0)+'" fill="none" stroke="var(--acc2)" stroke-width="5" stroke-linecap="round"/></svg>';
      var orb=document.getElementById("sunorb");
      if(t>0&&t<1){orb.style.opacity=1;orb.style.left=(x)+"%";orb.style.top=((y/150)*100)+"%"}else{orb.style.opacity=.25;orb.style.left=(t<0?"12%":"88%")+"%";orb.style.top="82%"}
      var h=Math.floor(min2/60),m=min2%60;
      lbl.textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
    }
    range.addEventListener("input",function(){upd(+this.value)});
    var now=new Date();var cur=now.getHours()*60+now.getMinutes();
    range.value=Math.max(sr,Math.min(ss,cur));
    upd(+range.value);
  }
  // condition switch
  var seg=document.getElementById("condSeg");
  function setCond(c){
    document.body.setAttribute("data-condition",c);
    seg.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.c===c)});
    var d=data[c];
    document.getElementById("bigT").textContent=d.t+"°";
    document.getElementById("desc").textContent=c[0].toUpperCase()+c.slice(1);
    document.getElementById("feels").textContent="Feels like "+d.fl+"° · "+(c==="storm"?"gale-force sea breeze":c==="rain"?"driving coastal rain":"coastal breeze");
    document.getElementById("hiT").textContent=d.hi+"°";
    document.getElementById("loT").textContent=d.lo+"°";
    document.getElementById("preT").textContent=d.pre+"%";
    document.getElementById("bigT").textContent=d.t+"°";
    buildBigIcon(c);
    drawHourly(c);
    drawWind();
    drawDays(c);
    drawSun(c);
  }
  seg.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){setCond(b.dataset.c)})});
  // init
  setCond("sunny");
  // sun range default current time handled in drawSun
})();
</script>
</body>
</html>
