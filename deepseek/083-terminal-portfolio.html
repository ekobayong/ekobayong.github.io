<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nova@portfolio — zsh</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#1b1f3a;--bg2:#3b2a6b;--bg3:#0f4c5c;--bg4:#08090f;
  --term:#0c0e16;--text:#e4e6f0;--text2:#8a8fa8;--green:#5ee65e;--cyan:#5fd7ff;--pink:#ff5fa2;--purple:#bd93f9;
}
body{
  min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(40% 40% at 20% 0%,rgba(59,42,107,.55),transparent 70%),
    radial-gradient(34% 30% at 90% 100%,rgba(15,76,92,.5),transparent 70%),
    linear-gradient(135deg,var(--bg1),var(--bg4));
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  display:grid;place-items:center;padding:46px 16px 90px;color:var(--text);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(36% 30% at 30% 26%,rgba(189,147,249,.12),transparent 70%),
  radial-gradient(30% 26% at 72% 74%,rgba(95,215,255,.1),transparent 70%);filter:blur(30px)}
/* window */
.win{position:relative;width:min(980px,96vw);max-height:min(680px,82vh);display:flex;flex-direction:column;
  background:var(--term);border-radius:14px;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04);overflow:hidden;z-index:2;
  transition:background .5s,color .5s;
}
.titlebar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.06);
  backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:5}
.lights{display:flex;gap:7px}
.lights i{width:12px;height:12px;border-radius:50%}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.tabs{display:flex;gap:4px;margin-left:14px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:11.5px;color:var(--text2);padding:7px 14px;border-radius:8px 8px 0 0;border:1px solid transparent;white-space:nowrap;cursor:default}
.tab.on{color:var(--text);border-color:rgba(255,255,255,.1);border-bottom-color:transparent;background:rgba(255,255,255,.04)}
/* body */
.termbody{flex:1;overflow-y:auto;padding:18px 20px 26px;line-height:1.55;font-size:13.5px;min-height:340px;scrollbar-width:thin;}
.promptline{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px 16px;border-top:1px solid rgba(255,255,255,.05)}
.promptline .ps .g{color:var(--green)}.promptline .ps .at{color:var(--text2)}.promptline .ps .d{color:var(--cyan)}.promptline .ps .gt{color:var(--pink);font-weight:700}
.promptline input{flex:1;min-width:120px;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13.5px}
.cursor-blink{display:inline-block;width:8px;height:15px;background:var(--text2);vertical-align:-2px;animation:cur 1.1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
.input-cursor{width:8px;height:15px;background:var(--cyan);display:inline-block;animation:cur 1.1s steps(2) infinite}
.out{white-space:pre-wrap;word-break:break-word}
.out .g{color:var(--green)}.out .c{color:var(--cyan)}.out .m{color:var(--pink)}.out .p{color:var(--purple)}
.out .dim{color:var(--text2)}
.err{color:#ff6b6b}
h3.cmdhead{color:var(--purple);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 6px}
kbd{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 6px;font-size:11px}
/* projects */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px}
.proj{border-left:3px solid var(--pc);background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;padding:14px;
  transform:translateY(0);opacity:0;transition:all .4s cubic-bezier(.22,1,.36,1)}
.proj.in{opacity:1;transform:none}
.proj:hover{transform:translateY(-4px);background:rgba(255,255,255,.07)}
.proj h4{font-size:14.5px;color:var(--text)}
.proj .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.proj .tags span{font-size:9px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--text2);letter-spacing:.08em}
.proj p{font-size:11.5px;color:var(--text2);margin-top:8px;line-height:1.5}
/* skills bars */
.skbar{margin:6px 0}
.skbar .skn{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;color:var(--text)}
.skbar .skn span{color:var(--text2)}
.skbar .track{height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.skbar .fill{height:100%;width:0;border-radius:4px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 3px,transparent 3px 5px),linear-gradient(90deg,var(--purple),var(--cyan));
  transition:width 1s cubic-bezier(.22,1,.36,1)}
/* matrix */
#matrixWrap{position:absolute;inset:0;z-index:10;display:none;background:#000}
#matrixWrap canvas{width:100%;height:100%;display:block}
/* tap pill */
.tappill{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);border:1px solid rgba(255,255,255,.2);
  background:rgba(12,14,22,.8);padding:10px 20px;border-radius:99px;font-size:12px;color:var(--cyan);
  animation:tpulse 1.8s ease-in-out infinite;display:none;z-index:30;cursor:pointer}
@keyframes tpulse{50%{opacity:.4}}
/* dock */
.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;padding:10px 14px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dock .app{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;
  background:linear-gradient(135deg,var(--ac1),var(--ac2));transition:transform .25s cubic-bezier(.34,1.56,.64,1),margin .25s}
.dock .app:hover{transform:translateY(-10px) scale(1.12);margin:0 4px}
.dock .app svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7}
.dock .app .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:rgba(12,14,22,.9);color:var(--text);font-size:10.5px;padding:5px 10px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.dock .app:hover .tip{opacity:1}
@media(max-width:640px){
  .win{height:calc(100dvh - 130px)}
  .tabs{display:none}
  .dock{inset-inline:12px;justify-content:space-around;left:auto;right:auto;transform:none;bottom:12px}
  .tappill{display:block}
}
@media(prefers-reduced-motion:reduce){.titlebar{transition:none}}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="tabs">
      <span class="tab on">nova@portfolio — zsh</span><span class="tab" data-tab="notes">notes.md</span><span class="tab" data-tab="log">server.log</span>
    </div>
  </div>
  <div class="termbody" id="body"></div>
  <div class="promptline">
    <span class="ps"><span class="g">nova</span><span class="at">@</span><span class="d">portfolio</span><span class="gt"> ❯ </span></span>
    <input id="cmd" autocomplete="off" spellcheck="false" aria-label="terminal">
    <span class="input-cursor"></span>
  </div>
</div>
<div class="tappill" id="tapPill">Tap to type</div>
<div class="dock" id="dock">
  <div class="app" data-c="finder" style="--ac1:#4a8df5;--ac2:#2b5bc0"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9h16M9 4v5"/></svg><span class="tip">Finder · help</span></div>
  <div class="app" data-c="projects" style="--ac1:#ff5fa2;--ac2:#a33cc0"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="7" height="7" rx="1.4"/><rect x="14" y="5" width="7" height="7" rx="1.4"/><rect x="3" y="15" width="7" height="5" rx="1.4"/><rect x="14" y="15" width="7" height="5" rx="1.4"/></svg><span class="tip">Projects</span></div>
  <div class="app" data-c="skills" style="--ac1:#5ee65e;--ac2:#1e9e4c"><svg viewBox="0 0 24 24"><path d="M4 18l5-8 4 5 3-4 4 7"/></svg><span class="tip">Skills</span></div>
  <div class="app" data-c="contact" style="--ac1:#5fd7ff;--ac2:#1e6fd6"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg><span class="tip">Contact</span></div>
  <div class="app" data-c="themes" style="--ac1:#bd93f9;--ac2:#6a4dbd"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span class="tip">Themes</span></div>
</div>
<div id="matrixWrap"></div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var body=document.getElementById("body"),cmd=document.getElementById("cmd");
  var history=[],hIdx=-1,busy=false;
  var THEMES={
    dracula:{"--term":"#282a36","--text":"#f8f8f2","--text2":"#8a8fa8","--green":"#50fa7b","--cyan":"#8be9fd","--pink":"#ff79c6","--purple":"#bd93f9","--bg1":"#1b1f3a","--bg2":"#3b2a6b","--bg3":"#0f4c5c","--bg4":"#08090f"},
    solarized:{"--term":"#002b36","--text":"#e0e0dc","--text2":"#839496","--green":"#859900","--cyan":"#2aa198","--pink":"#d33682","--purple":"#6c71c4","--bg1":"#1f3a39","--bg2":"#4b3c54","--bg3":"#0f4c44","--bg4":"#051014"},
    nord:{"--term":"#2e3440","--text":"#d8dee9","--text2":"#8cb0c8","--green":"#a3be8c","--cyan":"#88c0d0","--pink":"#bf616a","--purple":"#b48ead","--bg1":"#1c2331","--bg2":"#3b4252","--bg3":"#20546b","--bg4":"#0b0f17"},
    paper:{"--term":"#fbf8f1","--text":"#2b2b2b","--text2":"#6b6b6b","--green":"#5a9e5f","--cyan":"#2d7f9e","--pink":"#b3541e","--purple":"#7d4a9e","--bg1":"#e8e2d4","--bg2":"#cfc4b6","--bg3":"#8fb0a9","--bg4":"#ece7db"}
  };
  function out(html,cls){
    var d=document.createElement("div");
    d.className="out "+(cls||"");
    d.innerHTML=html;
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;
    return d;
  }
  function typeLogo(){
    var logo=[
      "  _  _  __   ____ _____ __",
      " | \\| | \\ \\ / // _ \\_   _|__",
      " | .` |  \\ V /|  __/ | |/ _ \\",
      " |_|\\_|   |_|  \\___| |_|\\___/",
      ""
    ];
    var el=out('<span class="p"></span>');
    var i=0,line=0;
    (function tick(){
      if(line>=logo.length){after();return}
      el.querySelector("span").textContent="";
      // build progressively
      var txt="";
      for(var l=0;l<=line;l++){
        var ln=logo[l];
        if(l===line){txt+=ln.slice(0,i)}
        else txt+=ln+"\n";
      }
      el.querySelector("span").textContent=txt;
      i+=1+ (Math.random()<0.3?1:0);
      if(i>logo[line].length){i=0;line++}
      setTimeout(tick,RM?0:1+Math.random()*4);
    })();
    function after(){
      out('<span class="dim">Last login: '+new Date().toLocaleString()+' on ttys001</span>');
      out('<span class="g">welcome back, nova.</span> <span class="dim">type</span> <span class="c">help</span> <span class="dim">to begin — or click the dock.</span>');
      enable();
    }
  }
  // (dockClick replaced by run(c) wiring below)
  var themeIdx=0;
  var CMDS={
    help:function(){
      out("<h3 class='cmdhead'>Commands</h3>"+
        "<span class='c'>about</span>        key/value profile<br>"+
        "<span class='c'>skills</span>       the useful vices<br>"+
        "<span class='c'>projects</span>     things I built &amp; kept<br>"+
        "<span class='c'>contact</span>      where the replies land<br>"+
        "<span class='c'>theme</span> &lt;name&gt;  dracula · solarized · nord · paper<br>"+
        "<span class='c'>matrix</span>       the easter egg (obligatory)<br>"+
        "<span class='c'>clear</span>        wipe the glass<br>"+
        "<span class='c'>history</span>      receipts<br>"+
        "<span class='c'>whoami</span> · <span class='c'>date</span> · <span class='c'>echo</span> · <span class='c'>ls</span> · <span class='c'>sudo</span>");
    },
    about:function(){
      out("⟶ <span class='g'>nova reyes</span> — creative engineer<br>"+
        "  <span class='dim'>role:</span>      builds small, precise things that glow<br>"+
        "  <span class='dim'>location:</span>  lisbon, pt (UTC+0 / +1)<br>"+
        "  <span class='dim'>stack:</span>     js · canvas · svg · electric prose<br>"+
        "  <span class='dim'>motto:</span>     <span class='p'>the polish is the feature</span>");
    },
    skills:function(){
      var sk=[["canvas &amp; webgl",92],["creative coding",88],["css/svg craft",90],["javascript/typescript",86],["interface design",78],["patience",99]];
      var el=out("");
      el.innerHTML="<h3 class='cmdhead'>Skills</h3>";
      sk.forEach(function(s,i){
        var row=document.createElement("div");
        row.className="skbar";
        row.innerHTML='<div class="skn"><span>'+s[0]+'</span><span>'+s[1]+'%</span></div><div class="track"><div class="fill" style="width:0"></div></div>';
        el.appendChild(row);
        setTimeout(function(){
          row.querySelector(".fill").style.width=s[1]+"%";
        },RM?0:120+i*120);
      });
    },
    projects:function(){
      var data=[
        {n:"Tidewater",c:"#5fd7ff",tags:["data viz","generative"],d:"a coastal reader that turns tide tables into silk."},
        {n:"Lantern",c:"#ff5fa2",tags:["product","webgl"],d:"a night lamp for the browser; dims with your day."},
        {n:"Fieldnotes",c:"#bd93f9",tags:["pwa","offline"],d:"a notebook that writes back, one line at a time."},
        {n:"Glasshouse",c:"#5ee65e",tags:["audio","canvas"],d:"a greenhouse for synthesised weather, all crescendo."}
      ];
      var el=out("");
      el.innerHTML="<h3 class='cmdhead'>Projects</h3><div class='projgrid'></div>";
      var grid=el.querySelector(".projgrid");
      data.forEach(function(p,i){
        var pr=document.createElement("div");
        pr.className="proj"+(RM?" in":"");
        pr.style.setProperty("--pc",p.c);
        pr.innerHTML="<h4>"+p.n+"</h4><div class='tags'>"+p.tags.map(function(t){return "<span>"+t+"</span>"}).join("")+"</div><p>"+p.d+"</p>";
        grid.appendChild(pr);
        setTimeout(function(){pr.classList.add("in")},RM?0:100+i*160);
      });
    },
    contact:function(){
      out("⟶ reach nova<br>"+
        "  <span class='dim'>email:</span>    nova@reyes.dev<br>"+
        "  <span class='dim'>github:</span>   /novareyes<br>"+
        "  <span class='dim'>mastodon:</span> @nova@mastodon.design<br>"+
        "  <span class='dim'>pgp:</span>      <span class='c'>9F2A 1B4C 77DE 08E1 3A6B</span>");
    },
    theme:function(args){
      if(!args[0]){
        out("usage: theme &lt;<span class='c'>dracula</span>|<span class='c'>solarized</span>|<span class='c'>nord</span>|<span class='c'>paper</span>&gt;");
        return;
      }
      var t=THEMES[args[0]];
      if(!t){out("<span class='err'>unknown theme: "+args[0]+"</span>");return}
      var root=document.documentElement;
      Object.keys(t).forEach(function(k){root.style.setProperty(k,t[k])});
      out("theme → <span class='p'>"+args[0]+"</span> ✓");
    },
    matrix:function(){
      launchMatrix();
    },
    clear:function(){body.innerHTML=""},
    history:function(){
      history.forEach(function(h,i){out("<span class='dim'>"+(i+1)+"</span>  "+h)});
    },
    whoami:function(){out("nova")},
    date:function(){out(new Date().toString())},
    echo:function(args){out(args.join(" "))},
    ls:function(){
      out("<span class='c'>work/</span>   <span class='c'>experiments/</span>   <span class='c'>music/</span>   <span class='p'>README.md</span>");
    },
    sudo:function(){
      out("<span class='dim'>nova is not in the sudoers file. this incident will be reported.</span>");
    }
  };
  function run(raw){
    var parts=raw.trim().split(/\s+/),c=parts[0];
    out("<span class='g'>➜</span> <span class='c'>"+raw+"</span>");
    if(!c)return;
    if(CMDS[c])CMDS[c](parts.slice(1));
    else if(c==="cd"){out("<span class='err'>cd: no such directory — this is a portfolio, not a filesystem.</span>")}
    else if(c==="open"){dockClick(parts[1]||"projects")}
    else out("<span class='err'>zsh: command not found: "+c+"</span>"+" — try <span class='c'>help</span>");
    body.scrollTop=body.scrollHeight;
  }
  function enable(){
    cmd.disabled=false;
    cmd.focus();
  }
  cmd.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      var v=cmd.value;cmd.value="";
      if(v.trim()){history.unshift(v)}
      hIdx=-1;
      run(v);
    }else if(e.key==="ArrowUp"){
      e.preventDefault();
      if(history.length){hIdx=Math.min(history.length-1,hIdx+1);cmd.value=history[hIdx]}
    }else if(e.key==="ArrowDown"){
      e.preventDefault();
      if(hIdx>0){hIdx--;cmd.value=history[hIdx]}else{hIdx=-1;cmd.value=""}
    }else if(e.key==="Tab"){
      e.preventDefault();
      var v=cmd.value.split(/\s+/);
      var names=Object.keys(CMDS);
      if(v.length===1){
        var m=names.filter(function(n){return n.startsWith(v[0])});
        if(m.length===1)cmd.value=m[0];
        else if(m.length>1)out("<span class='dim'>"+(v[0]?m.join("  "):names.join("  "))+"</span>");
      }else if(v[0]==="theme"&&v[1]){
        var themes=Object.keys(THEMES).filter(function(n){return n.startsWith(v[1])});
        if(themes.length===1)cmd.value="theme "+themes[0];
        else if(themes.length>1)out("<span class='dim'>"+themes.join("  ")+"</span>");
      }
    }else if(e.key==="l"&&(e.ctrlKey||e.metaKey)){
      e.preventDefault();body.innerHTML="";
    }else if(e.key==="c"&&e.ctrlKey){
      out("^C");
    }
  });
  window.addEventListener("keydown",function(e){
    if(e.ctrlKey&&e.key.toLowerCase()==="l"){body.innerHTML=""}
  });
  // dock
  var dockApps={finder:"help",projects:"projects",skills:"skills",contact:"contact",themes:function(){CMDS.theme(["nord"])}};
  function dockClick(c){
    if(dockApps[c]==="help")CMDS.help();
    else if(typeof dockApps[c]==="function")dockApps[c]();
    else if(CMDS[c])run(typeof c===type(c)?"":"");
    else if(c==="finder"){
      // treat as help
      CMDS.help();
    }else{
      run(c);
    }
  }
  document.querySelectorAll(".dock .app").forEach(function(a){
    a.addEventListener("click",function(){
      var c=a.dataset.c;
      if(c==="themes"){cycleTheme()}
      else{run(c)}
    });
  });
  var themeIdx=0;
  function cycleTheme(){
    var names=Object.keys(THEMES);
    themeIdx=(themeIdx+1)%names.length;
    CMDS.theme([names[themeIdx]]);
  }
  // matrix easter egg
  var mwrap=document.getElementById("matrixWrap");
  var mcv=document.createElement("canvas");
  mwrap.appendChild(mcv);
  var mctx=mcv.getContext("2d");
  var ms=null;
  function launchMatrix(){
    mwrap.style.display="block";
    var dpr=Math.min(2,devicePixelRatio||1);
    mcv.width=window.innerWidth*dpr;mcv.height=window.innerHeight*dpr;
    mctx.setTransform(dpr,0,0,dpr,0,0);
    var fs=16,cols=Math.ceil(window.innerWidth/fs);
    var drops=new Array(cols).fill(1);
    var glyphs="アカサタナハマヤラワ0123456789ABCDEF<>{}[]#$%&*+=";
    var green=THEMES[Object.keys(THEMES).find(function(k){return true})]?getComputedStyle(document.documentElement).getPropertyValue("--green"):"#50fa7b";
    var gCol=document.documentElement.style.getPropertyValue("--green")||"#50fa7b";
    var started=performance.now();
    (function frame(){
      mctx.fillStyle="rgba(0,0,0,.09)";
      mctx.fillRect(0,0,window.innerWidth,window.innerHeight);
      mctx.fillStyle=gCol;
      mctx.font=fs+"px monospace";
      for(var i=0;i<cols;i++){
        var ch=glyphs[Math.floor(Math.random()*glyphs.length)];
        mctx.fillText(ch,i*fs,drops[i]*fs);
        if(drops[i]*fs>window.innerHeight*0.75&&Math.random()>0.975)drops[i]=0;
        drops[i]++;
      }
      if(performance.now()-started>7000)return;
      requestAnimationFrame(frame);
    })();
    setTimeout(function(){
      mwrap.style.display="none";
      out("<span class='m'>you just watched the matrix recompile itself.</span> <span class='dim'>now shoo.</span>");
    },7200);
  }
  // tap pill
  document.getElementById("tapPill").addEventListener("click",function(){
    cmd.focus();
    this.style.display="none";
  });
  cmd.addEventListener("focus",function(){document.getElementById("tapPill").style.display="none"});
  // tabs (decorative)
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click",function(){
      document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});
      t.classList.add("on");
    });
  });
  // init
  cmd.disabled=true;
  typeLogo();
})();
</script>
</body>
