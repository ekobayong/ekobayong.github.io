<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Lab — six layers of living motion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--amber:#ffb347;--teal:#00c2a8}
body{
  background:radial-gradient(60% 46% at 50% 20%,#0e2a3a,transparent 70%),radial-gradient(50% 40% at 10% 100%,#16223c,transparent 70%),#06080f;
  color:#e8ecf2;min-height:100vh;overflow:hidden;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
canvas#waves{position:fixed;inset:0;display:block;touch-action:none}
.hud9{position:fixed;top:22px;left:26px;z-index:5;pointer-events:none}
.hud9 h1{font-family:Georgia,'Iowan Old Style',serif;font-weight:400;font-size:clamp(24px,3.2vw,40px);letter-spacing:.06em}
.hud9 h1 em{font-style:italic;color:var(--teal)}
.hud9 p{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(232,236,242,.5);margin-top:4px}
.layers9{position:fixed;right:22px;top:22px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.layer-chip{display:flex;align-items:center;gap:8px;background:rgba(10,16,26,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);
  border-radius:99px;padding:6px 12px;font-size:10px;color:rgba(232,236,242,.7);letter-spacing:.1em;cursor:pointer;pointer-events:auto;transition:all .25s}
.layer-chip:hover{border-color:rgba(255,179,71,.5)}
.layer-chip.off{opacity:.35}
.layer-chip .sw9{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.layer-chip b{color:var(--c);font-weight:400}
/* panel */
.panel9{
  position:fixed;left:26px;bottom:24px;z-index:8;width:290px;background:rgba(10,16,26,.78);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 16px 10px;pointer-events:auto;box-shadow:0 26px 60px rgba(0,0,0,.5);
  max-height:70vh;overflow-y:auto;
}
.panel9 h3{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:rgba(232,236,242,.5);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.panel9 h3 b{color:var(--amber);font-weight:400;font-variant-numeric:tabular-nums}
.chiplist{display:flex;flex-direction:column;gap:7px}
.layer-item{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;cursor:grab;background:rgba(255,255,255,.03);transition:background .25s}
.layer-item:hover{background:rgba(255,255,255,.07)}
.layer-item .grip{color:rgba(232,236,242,.3);cursor:grab;font-size:12px;letter-spacing:0;padding:0 2px}
.layer-item .sw9{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.layer-item .nm{font-size:12.5px;flex:1;font-family:Georgia,'Iowan Old Style',serif;letter-spacing:.02em}
.layer-item .freq{font-size:9px;color:rgba(232,236,242,.5)}
.layer-item .icbtns{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.layer-item:hover .icbtns{opacity:1}
.layer-item button{border:none;background:none;color:rgba(232,236,242,.7);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1}
.layer-item button:hover{color:var(--amber)}
.controls9{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.controls9 .sl9{display:flex;align-items:center;gap:6px;font-size:9.5px;color:rgba(232,236,242,.6);letter-spacing:.08em}
.controls9 input[type=range]{width:76px;appearance:none;-webkit-appearance:none;height:2px;background:rgba(255,255,255,.18);outline:none}
.controls9 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--amber);cursor:pointer}
.controls9 input[type=color]{width:24px;height:24px;border:1px solid rgba(255,255,255,.2);background:none;cursor:pointer;padding:0;border-radius:5px}
.addbtn{margin-left:auto;border:1px dashed rgba(255,179,71,.5);background:none;color:var(--amber);font-family:inherit;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border-radius:99px;cursor:pointer;transition:all .25s}
.addbtn:hover{background:rgba(255,179,71,.15)}
.p2row{display:flex;align-items:center;gap:9px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.pbtn{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:none;color:rgba(232,236,242,.8);
  font-family:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:8px 13px;border-radius:99px;cursor:pointer;transition:all .25s}
.pbtn:hover{border-color:var(--teal);color:var(--teal)}
.pbtn.on{background:rgba(0,194,168,.18);border-color:var(--teal);color:#bff3e8}
.floatbtn{position:fixed;right:22px;bottom:18px;z-index:9;border:none;background:var(--amber);color:#0a1008;font-family:inherit;
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:11px 18px;border-radius:99px;cursor:pointer;display:none;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.floatbtn svg{width:16px;height:16px}
.hint9{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,236,242,.4);z-index:6;pointer-events:none}
@media(max-width:640px){
  .panel9{left:12px;right:12px;bottom:12px;width:auto;max-height:44vh;display:none;position:fixed}
  .panel9.open{display:block}
  .floatbtn{display:block}
  .hint9{bottom:58px}
}
@media(prefers-reduced-motion:reduce){.layer-chip,.pbtn,.panel9{transition:none}}
</style>
</head>
<body>
<canvas id="waves"></canvas>
<div class="hud9"><h1>Wave <em>Lab</em></h1><p>six layers of living motion · 100</p></div>
<div class="layers9" id="layers9"></div>
<div class="panel9" id="panel9">
  <h3>Layers <b id="layCount">6</b></h3>
  <div class="chiplist" id="chipList"></div>
  <div class="controls9">
    <div class="sl9"><span>Amp</span><input type="range" id="ampR" min="0.1" max="160" value="46"></div>
    <div class="sl9"><span>Freq</span><input type="range" id="freqR" min="0.02" max="0.6" step="0.01" value="0.11"></div>
    <div class="sl9"><span>Phase π</span><input type="range" id="phaseR" min="0" max="200" value="0"></div>
    <input type="color" id="colorR" value="#ffb347">
    <button class="addbtn" id="addBtn">+ Layer</button>
  </div>
  <div class="p2row">
    <button class="pbtn on" id="surpriseBtn">✦ Surprise me</button>
    <button class="pbtn" id="hideBtn">Hide panel</button>
    <button class="pbtn" id="exportBtn">Export SVG</button>
  </div>
</div>
<button class="floatbtn" id="floatBtn"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<div class="hint9">drag to reorder · click a chip to mute · hold a point to sculpt the flow</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("waves"),ctx=cv.getContext("2d");
  var W=0,H=0,DPR=1;
  var layers=[
    {name:"Crest",color:"#ffb347",amp:26,freq:0.08,phase:0,vis:true,points:0},
    {name:"Swell",color:"#ff5fa2",amp:44,freq:0.05,phase:1.1,vis:true,points:0},
    {name:"Drift",color:"#00c2a8",amp:60,freq:0.11,phase:2.2,vis:true,points:0},
    {name:"Undertow",color:"#5fd7ff",amp:30,freq:0.16,phase:0.6,vis:true,points:0},
    {name:"Haze",color:"#c9a6ff",amp:80,freq:0.03,phase:3.1,vis:true,points:0},
    {name:"Bed",color:"#3a3f52",amp:18,freq:0.22,phase:4.2,vis:true,points:0}
  ];
  var t=0,paused=false;
  var selIdx=-1;
  var pointer={active:false,x:0,y:0,lastX:0,lastY:0};
  var pushDir=0;
  // ---------- streaming (stable) ----------
  var N=360;
  var yBuffers=[];
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize",function(){resize()});
  function yAt(l,xx,t2){
    var c=Math.cos(xx*l.freq+t2*l.phase);
    return Math.sin(xx*l.freq*0.7+t2*l.phase)*l.amp*1.4*c*0.5;
  }
  function buildBuffers(){
    yBuffers=layers.map(function(){return new Float32Array(N)});
    for(var l=0;l<layers.length;l++){
      for(var i=0;i<N;i++){
        var xx=i/(N-1)*13; // wavelength space
        yBuffers[l][i]=yAt(layers[l],xx,t)+ (Math.random()-0.5)*0.5;
      }
    }
  }
  // ---------- render ----------
  function render(){
    ctx.clearRect(0,0,W,H);
    // ocean base
    var bg=ctx.createLinearGradient(0,H*0.25,0,H);
    bg.addColorStop(0,"#0b1526");bg.addColorStop(.6,"#091120");bg.addColorStop(1,"#05080f");
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // layer stacking: draw from bottom (Bed) to top (Crest) so top layers appear nearer
    for(var li=layers.length-1;li>=0;li--){
      var l=layers[li];
      if(!l.vis)continue;
      var baseY=H*0.62 + (li-(layers.length-1)/2)*H*0.035;
      var pts=[];
      for(var i=0;i<N;i++){
        var x=i/(N-1)*W;
        var y=baseY + yBuffers[li][i];
        pts.push([x,y]);
      }
      // fill down
      ctx.beginPath();
      ctx.moveTo(0,H);
      for(var i2=0;i2<pts.length;i2++)ctx.lineTo(pts[i2][0],pts[i2][1]);
      ctx.lineTo(W,H);
      ctx.closePath();
      var xc=peg(li);
      var g=ctx.createLinearGradient(0,H*0.4,0,H);
      g.addColorStop(0,l.color);
      g.addColorStop(1,shade(l.color,-0.55));
      ctx.globalAlpha=0.35+0.15*(li/(layers.length-1));
      ctx.fillStyle=g;
      ctx.fill();
      // stroke
      ctx.globalAlpha=0.9;
      ctx.strokeStyle=l.color;
      ctx.shadowColor=l.color;ctx.shadowBlur=10;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(pts[0][0],pts[0][1]);
      for(var i3=1;i3<pts.length;i3++)ctx.lineTo(pts[i3][0],pts[i3][1]);
      ctx.stroke();
      ctx.shadowBlur=0;
      ctx.globalAlpha=1;
      // highlight flecks
      if(l.vis&&li===0){
        ctx.fillStyle="rgba(255,255,255,.55)";
        var flecks=Math.floor(W/60);
        for(var f2=0;f2<flecks;f2++){
          var fx=(f2*13.7+8)%W, fy=baseY+2+8*(Math.sin(fx*0.05+t*2)+1)/2;
          ctx.beginPath();ctx.arc(fx,fy,1.1,0,7);ctx.fill();
        }
      }
    }
  }
  function shade(hex,k){
    var n=parseInt(hex.slice(1),16);
    var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r*(1+k));g=Math.round(g*(1+k));b=Math.round(b*(1+k));
    return "rgb("+Math.max(0,r)+","+Math.max(0,g)+","+Math.max(0,b)+")";
  }
  function peg(li){return li}
  // ---------- update chips & panel ----------
  function renderChips(){
    var box=document.getElementById("layers9");
    box.innerHTML="";
    layers.forEach(function(l,i){
      var c=document.createElement("div");
      c.className="layer-chip"+(l.vis?"":" off");
      c.style.setProperty("--c",l.color);
      c.innerHTML='<span class="sw9"></span>'+l.name+' <b>'+(l.freq.toFixed(2))+'</b>';
      c.onclick=function(){
        l.vis=!l.vis;
        c.classList.toggle("off",!l.vis);
      };
      box.appendChild(c);
    });
    var list=document.getElementById("chipList");
    list.innerHTML="";
    layers.forEach(function(l,i){
      var d=document.createElement("div");
      d.className="layer-item"+(i===selIdx?" sel":"");
      d.draggable=true;
      d.style.setProperty("--c",l.color);
      d.innerHTML='<span class="grip">⠿</span><span class="sw9"></span><span class="nm">'+l.name+'</span><span class="freq">f '+l.freq.toFixed(2)+' · a '+Math.round(l.amp)+'</span>'+
        '<span class="icbtns"><button data-i="'+i+'" data-act="up">▲</button><button data-i="'+i+'" data-act="down">▼</button><button data-i="'+i+'" data-act="del">✕</button></span>';
      d.addEventListener("click",function(ev){
        if(ev.target.dataset.act){
          var i2=+ev.target.dataset.i,act=ev.target.dataset.act;
          if(act==="up"&&i2>0){var t=layers[i2];layers[i2]=layers[i2-1];layers[i2-1]=t}
          if(act==="down"&&i2<layers.length-1){var t=layers[i2];layers[i2]=layers[i2+1];layers[i2+1]=t}
          if(act==="del")layers.splice(i2,1);
          document.getElementById("layCount").textContent=layers.length;
          rebuildMod();
          renderChips();
          return;
        }
        selIdx=selIdx===i?-1:i;
        syncPanel();
        renderPanelHighlight();
      });
      d.addEventListener("dragstart",function(ev){
        ev.dataTransfer.setData("text/plain",i);
        d.style.opacity=.4;
      });
      d.addEventListener("dragend",function(){d.style.opacity=1});
      d.addEventListener("dragover",function(ev){ev.preventDefault()});
      d.addEventListener("drop",function(ev){
        ev.preventDefault();
        var from=+ev.dataTransfer.getData("text/plain");
        var to=i;
        if(from===to)return;
        var t=layers.splice(from,1)[0];
        layers.splice(to,0,t);
        renderChips();
        rebuildMod();
      });
      list.appendChild(d);
    });
  }
  function rebuildMod(){
    buildBuffers();
    var chips=document.querySelectorAll(".layer-chip");
    layers.forEach(function(l,i){});
  }
  function syncPanel(){
    if(selIdx<0||!layers[selIdx])return;
    var l=layers[selIdx];
    document.getElementById("ampR").value=l.amp;
    document.getElementById("freqR").value=l.freq;
    document.getElementById("phaseR").value=Math.round(l.phase/Math.PI*100);
    document.getElementById("colorR").value=l.color;
  }
  function renderPanelHighlight(){
    document.querySelectorAll(".layer-item").forEach(function(it,i){
      it.classList.toggle("sel",i===selIdx);
      it.style.outline= i===selIdx?"1px solid "+layers[i].color:"";
    });
  }
  document.getElementById("ampR").addEventListener("input",function(){
    if(selIdx>=0){layers[selIdx].amp=+this.value;rebuildMod()}
  });
  document.getElementById("freqR").addEventListener("input",function(){
    if(selIdx>=0){layers[selIdx].freq=+this.value;document.querySelectorAll(".layer-chip b")[selIdx]&&(document.querySelectorAll(".layer-chip b")[selIdx].textContent=layers[selIdx].freq.toFixed(2));rebuildMod()}
  });
  document.getElementById("phaseR").addEventListener("input",function(){
    if(selIdx>=0){layers[selIdx].phase=this.value/100*Math.PI;rebuildMod()}
  });
  document.getElementById("colorR").addEventListener("input",function(){
    if(selIdx>=0){layers[selIdx].color=this.value;renderChips();rebuildMod()}
  });
  document.getElementById("addBtn").addEventListener("click",function(){
    if(layers.length>=6){toast("six is the limit — the ocean says so");return}
    layers.push({name:"NewLayer",color:"#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0"),
      amp:30+Math.random()*50,freq:0.04+Math.random()*0.14,phase:Math.random()*6,vis:true});
    document.getElementById("layCount").textContent=layers.length;
    renderChips();rebuildMod();
  });
  document.getElementById("surpriseBtn").addEventListener("click",function(){
    layers.forEach(function(l){
      l.amp=Math.round((10+Math.random()*90)*10)/10;
      l.freq=0.05+Math.random()*0.2;
      l.phase=Math.random()*6.28;
      l.color="#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0");
      l.vis=true;
    });
    renderChips();rebuildMod();
    toast("oh, the ocean is feeling lucky");
  });
  document.getElementById("hideBtn").addEventListener("click",function(){
    document.getElementById("panel9").classList.remove("open");
    document.getElementById("floatBtn").style.display="block";
  });
  document.getElementById("floatBtn").addEventListener("click",function(){
    document.getElementById("panel9").classList.add("open");
    this.style.display="none";
  });
  document.getElementById("exportBtn").addEventListener("click",function(){
    // build an SVG of the current frame
    var svg=[];
    svg.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'">');
    for(var li=layers.length-1;li>=0;li--){
      var l=layers[li];
      if(!l.vis)continue;
      var baseY=H*0.62+(li-(layers.length-1)/2)*H*0.035;
      var d="M0 "+(H+10)+" L0 "+baseY;
      for(var i=0;i<N;i++){
        var x=i/(N-1)*W;
        var y=baseY+yBuffers[li][i];
        d+=" L"+x.toFixed(1)+" "+y.toFixed(1);
      }
      d+=" L"+W+" "+(H+10)+" Z";
      // downsample for file size
      svg.push('<path d="'+d+'" fill="'+shade(l.color,-0.5)+'" opacity=".8"/>');
      svg.push('<path d="'+d+'" fill="none" stroke="'+l.color+'" stroke-width="2"/>');
    }
    svg.push("</svg>");
    var blob=new Blob([svg.join("")],{type:"image/svg+xml"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="wave-lab-100.svg";
    a.click();
    toast("SVG exported — if the ocean were paper, this is it");
  });
  function toast(msg){
    var t=document.createElement("div");
    t.textContent=msg;
    t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0c1524;border:1px solid rgba(255,179,71,.4);padding:11px 20px;border-radius:99px;font-size:11px;z-index:30;opacity:0;transition:opacity .4s;pointer-events:none;color:#e8ecf2";
    document.body.appendChild(t);
    requestAnimationFrame(function(){t.style.opacity=1});
    setTimeout(function(){t.style.opacity=0;setTimeout(function(){t.remove()},450)},2200);
  }
  // pointer physics on the flow
  cv.addEventListener("pointermove",function(e){
    var r=cv.getBoundingClientRect();
    pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;
    var dx=pointer.x-pointer.lastX,dy=pointer.y-pointer.lastY;
    if(pointer.active&&!paused){
      var speed=Math.min(26,Math.hypot(dx,dy)*8);
      var t2=performance.now()/1000;
      layers.forEach(function(l,i){
        var probe=Math.sin(pointer.x*0.02+t2*2+i);
        yBuffers[i][Math.round(pointer.x/W*(N-1))]+= -speed*0.06*probe;
      });
    }
    pointer.lastX=pointer.x;pointer.lastY=pointer.y;
  });
  cv.addEventListener("pointerdown",function(e){
    pointer.active=true;
    pointer.lastX=e.clientX;pointer.lastY=e.clientY;
  });
  window.addEventListener("pointerup",function(){pointer.active=false});
  // main loop
  var last=performance.now();
  function shiftBuffers(){
    // streaming scroll: shift left slightly each frame
    for(var l=0;l<layers.length;l++){
      var buf=yBuffers[l];
      var shift=Math.max(1,Math.min(3,Math.round(1+layers[l].freq*6)));
      buf.copyWithin(0,shift,N-shift);
      var baseY=0;
      for(var i=N-shift;i<N;i++){
        var xx=i/(N-1)*13;
        buf[i]=yAt(layers[l],xx,t)+(Math.random()-0.5)*0.3;
      }
    }
  }
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!paused){
      t+=dt*(RM?0.3:1);
      shiftBuffers();
    }
    render();
    requestAnimationFrame(loop);
  }
  resize();
  buildBuffers();
  renderChips();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
