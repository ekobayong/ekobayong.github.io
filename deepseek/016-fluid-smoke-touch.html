<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ether — a fluid you can touch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#04050a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f2f0fa}
#fx{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.5))}
.title{
  position:fixed;top:30px;left:34px;z-index:3;pointer-events:none;
  font-family:Georgia,'Iowan Old Style',Palatino,serif;
  font-size:clamp(34px,5vw,64px);letter-spacing:.14em;font-weight:400;
  background:linear-gradient(180deg,#fff,#b7c4ff 55%,#6d7fd6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(80,180,255,.35));
  animation:rise 1.2s cubic-bezier(.22,1,.36,1) both;
}
.tagline{position:fixed;top:calc(30px + clamp(52px,7vw,88px));left:38px;z-index:3;pointer-events:none;
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(232,230,242,.55);
  animation:rise 1.2s cubic-bezier(.22,1,.36,1) .12s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hint{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;
  font-size:12.5px;letter-spacing:.1em;color:rgba(232,230,242,.6);text-align:center;
  animation:breath 3.6s ease-in-out infinite;
}
@keyframes breath{0%,100%{opacity:.45}50%{opacity:.95}}
.hint.gone{opacity:0;transition:opacity .8s;animation:none}
/* HUD */
.hud{
  position:fixed;bottom:24px;right:24px;z-index:4;
  background:rgba(14,16,28,.55);border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
  padding:18px 20px;width:250px;
  animation:rise 1.2s cubic-bezier(.22,1,.36,1) .2s both;
}
.hud .head{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,230,242,.5);margin-bottom:4px}
.hud .fps{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#8ad4ff;font-size:13px}
.ctrl{margin:10px 0}
.ctrl .row{display:flex;justify-content:space-between;font-size:11px;color:rgba(232,230,242,.75);margin-bottom:4px}
.ctrl .row b{font-family:ui-monospace,Menlo,Consolas,monospace;color:#8ad4ff;font-weight:500}
.slider{--p:50%;width:100%;appearance:none;-webkit-appearance:none;height:2px;border-radius:2px;outline:none;
  background:linear-gradient(90deg,#8ad4ff var(--p),rgba(255,255,255,.14) var(--p))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(138,212,255,.9);cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 12px rgba(138,212,255,.9)}
.slider:hover::-webkit-slider-thumb{transform:scale(1.25)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.act{
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
  color:#e9e8f4;font-family:inherit;font-size:11px;letter-spacing:.1em;border-radius:8px;padding:8px 14px;cursor:pointer;transition:background .25s;
}
.act::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s;
  background:radial-gradient(120px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.18),transparent 70%)}
.act:hover::after{opacity:1}
.act[aria-pressed="true"]{background:rgba(138,212,255,.22);border-color:#8ad4ff}
.swatch{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:conic-gradient(#ff5c8a,#ffc46b,#4ee6c7,#8b7dff,#ff5c8a);margin-left:auto}
@media(max-width:480px){
  .hud{left:0;right:0;bottom:0;width:auto;border-radius:18px 18px 0 0}
  .hint{bottom:150px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="vig"></div>
<h1 class="title">Ether</h1>
<p class="tagline">a fluid you can touch</p>
<div class="hint" id="hint">drag anywhere to breathe color into the void</div>

<div class="hud">
  <div class="head"><span>Stable fluids · 96²</span><span class="fps" id="fps">60 fps</span></div>
  <div class="ctrl">
    <div class="row"><span>Brightness</span><b id="briVal">1.40</b></div>
    <input type="range" class="slider" id="bri" min="0.4" max="3" step="0.01" value="1.40">
  </div>
  <div class="ctrl">
    <div class="row"><span>Dissipation</span><b id="disVal">0.988</b></div>
    <input type="range" class="slider" id="dis" min="0.94" max="0.999" step="0.001" value="0.988">
  </div>
  <div class="actions">
    <button class="act" id="clearBtn">Clear</button>
    <button class="act" id="autoBtn" aria-pressed="true">Auto</button>
    <span class="swatch" id="swatch" title="current dye hue"></span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("fx"),ctx=cv.getContext("2d");
  var N=96;
  var u,v,resU,resV;var r,g,b;
  var mouse={x:-9999,y:-9999,px:-9999,py:-9999,down:false,first:false};
  var hue=210,bloom=1.4,diss=0.988,autoOn=!RM;
  var brightness=1.40,dissipation=0.988;

  function setup(){
    u=new Float32Array(N*N);v=new Float32Array(N*N);resU=new Float32Array(N*N);resV=new Float32Array(N*N);
    r=new Float32Array(N*N);g=new Float32Array(N*N);b=new Float32Array(N*N);
    seedBloom();
  }
  function seedBloom(){
    // ring of 24 outward splats
    for(var i=0;i<24;i++){
      var a=i/24*Math.PI*2;
      var x=N/2+Math.cos(a)*N*0.16,y=N/2+Math.sin(a)*N*0.16;
      var h2=190+Math.random()*90;
      splat(x,y,Math.cos(a)*60,Math.sin(a)*60,14,h2);
    }
  }
  function idx(x,y){return y*N+x}
  function clamp(x,t){return x<0?0:x>t?t:x}
  function splat(x,y,dx,dy,radius,hue2){
    var h=document.getElementById("swatch");
    var rgb=hslRgb(hue2,95,55);
    var pr=Math.max(1,radius);
    for(var yy=Math.floor(y-pr);yy<=y+pr;yy++){
      for(var xx=Math.floor(x-pr);xx<=x+pr;xx++){
        if(xx<0||xx>=N||yy<0||yy>=N)continue;
        var d2=(xx-x)*(xx-x)+(yy-y)*(yy-y);
        if(d2>pr*pr)continue;
        var e=Math.exp(-d2/(pr*pr*0.6));
        var i=idx(xx,yy);
        u[i]+=dx*e;v[i]+=dy*e;
        r[i]+=rgb[0]*e*1.6;g[i]+=rgb[1]*e*1.6;b[i]+=rgb[2]*e*1.6;
      }
    }
  }
  function hslRgb(h,s,l){
    h/=360;s/=100;l/=100;
    var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h*6)%2-1)),m=l-c/2;
    var r2=0,c2=0,b2=0;
    if(h<1/6){r2=c;c2=x}else if(h<2/6){r2=x;c2=c}else if(h<3/6){c2=c;b2=x}else if(h<4/6){c2=x;b2=c}else if(h<5/6){r2=x;b2=c}else{r2=c;b2=x}
    return[(r2+m)*255,(c2+m)*255,(b2+m)*255];
  }
  function lin(x,y0,x1,y1,x2,y2){return y0+(y1-y0)*(x-x0)*(x-x0)}
  function ix(x,y){return (clamp(x,N-1)|0)+ (clamp(y,N-1)|0)*N}
  function step(){
    var dt=0.016;
    var d=dissipation;
    // velocity diffusion (few Gauss-Seidel)
    for(var k=0;k<4;k++){
      for(var yy=1;yy<N-1;yy++)for(var xx=1;xx<N-1;xx++){
        var i=idx(xx,yy);
        u[i]=(u[i]+u[idx(xx-1,yy)]+u[idx(xx+1,yy)]+u[idx(xx,yy-1)]+u[idx(xx,yy+1)])/5;
      }
    }
    // project
    project();
    // advect velocity
    for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++){
      var i=idx(xx,yy);
      var px=xx - dt*(u[i]*N),py=yy - dt*(v[i]*N);
      px=Math.max(0.5,Math.min(N-1.5,px));py=Math.max(0.5,Math.min(N-1.5,py));
      var x0=px|0,y0=py|0,x1=x0+1,y1=y0+1;
      var fx2=px-x0,fy2=py-y0;
      resU[i]=(1-fy2)*((1-fx2)*u[idx(x0,y0)]+fx2*u[idx(x1,y0)])+fy2*((1-fx2)*u[idx(x0,y1)]+fx2*u[idx(x1,y1)]);
      resV[i]=(1-fy2)*((1-fx2)*v[idx(x0,y0)]+fx2*v[idx(x1,y0)])+fy2*((1-fx2)*v[idx(x0,y1)]+fx2*v[idx(x1,y1)]);
    }
    var t=u;u=resU;resU=t;t=v;v=resV;resV=t;
    project();
    // advect dye
    for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++){
      var i=idx(xx,yy);
      var px=xx - dt*(u[i]*N),py=yy - dt*(v[i]*N);
      px=Math.max(0.5,Math.min(N-1.5,px));py=Math.max(0.5,Math.min(N-1.5,py));
      var x0=px|0,y0=py|0,x1=x0+1,y1=y0+1;
      var fx2=px-x0,fy2=py-y0;
      r[i]=d*((1-fy2)*((1-fx2)*r[idx(x0,y0)]+fx2*r[idx(x1,y0)])+fy2*((1-fx2)*r[idx(x0,y1)]+fx2*r[idx(x1,y1)]));
      g[i]=d*((1-fy2)*((1-fx2)*g[idx(x0,y0)]+fx2*g[idx(x1,y0)])+fy2*((1-fx2)*g[idx(x0,y1)]+fx2*g[idx(x1,y1)]));
      b[i]=d*((1-fy2)*((1-fx2)*b[idx(x0,y0)]+fx2*b[idx(x1,y0)])+fy2*((1-fx2)*b[idx(x0,y1)]+fx2*b[idx(x1,y1)]));
    }
    // velocity damping
    for(var i2=0;i2<u.length;i2++){u[i2]*=0.995;v[i2]*=0.995}
  }
  function project(){
    var iter=16;
    var p=new Float32Array(N*N),div=new Float32Array(N*N);
    for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++){
      var i=idx(xx,yy);
      div[i]=-0.5*(u[idx(xx+1< N?xx+1:N-1,yy)]-u[idx(xx-1>0?xx-1:0,yy)]+v[idx(xx,yy+1<N?yy+1:N-1)]-v[idx(xx,yy-1>0?yy-1:0)]);
    }
    for(var k=0;k<iter;k++){
      for(var yy=1;yy<N-1;yy++)for(var xx=1;xx<N-1;xx++){
        var i=idx(xx,yy);
        p[i]=(div[i]+p[idx(xx-1,yy)]+p[idx(xx+1,yy)]+p[idx(xx,yy-1)]+p[idx(xx,yy+1)])/4;
      }
    }
    for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++){
      var xa=xx>0?xx-1:0,xb=xx<N-1?xx+1:N-1,ya=yy>0?yy-1:0,yb=yy<N-1?yy+1:N-1;
      var i=idx(xx,yy);
      u[i]-=0.5*(p[idx(xb,yy)]-p[idx(xa,yy)]);
      v[i]-=0.5*(p[idx(xx,yb)]-p[idx(xx,ya)]);
    }
  }

  // render
  var off=document.createElement("canvas"),oc=off.getContext("2d");
  off.width=N;off.height=N;
  var img=oc.createImageData(N,N);
  var out=img.data;
  function render(){
    for(var i=0;i<r.length;i++){
      out[i*4]=Math.min(255,r[i]*brightness);
      out[i*4+1]=Math.min(255,g[i]*brightness);
      out[i*4+2]=Math.min(255,b[i]*brightness);
      out[i*4+3]=255;
    }
    oc.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    ctx.clearRect(0,0,W,H);
    var s=Math.max(W,H)/N;
    ctx.drawImage(off,(W-s*N)/2,(H-s*N)/2,s*N,s*N);
  }
  var W=0,H=0,DPR=1,theW=0,theH=0;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth;H=window.innerHeight;
    theW=W;theH=H;
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize",resize);

  // pointer
  cv.addEventListener("pointermove",function(e){
    var rect=cv.getBoundingClientRect();
    mouse.px=mouse.x;mouse.py=mouse.y;
    mouse.x=(e.clientX-rect.left)/rect.width*N;
    mouse.y=(e.clientY-rect.top)/rect.height*N;
    if(!mouse.first){hintGone()}
    if(!mouse.down&&!mouse.first){
      // faint hover trail
      splat(mouse.x,mouse.y,0,0,3,hue);
      mouse.first=true;
    }
  });
  cv.addEventListener("pointerdown",function(e){
    hintGone();
    var rect=cv.getBoundingClientRect();
    mouse.x=(e.clientX-rect.left)/rect.width*N;
    mouse.y=(e.clientY-rect.top)/rect.height*N;
    mouse.px=mouse.x;mouse.py=mouse.y;
    mouse.down=true;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointerup",function(){mouse.down=false});
  function hintGone(){
    var h=document.getElementById("hint");
    if(h&&!h.classList.contains("gone")){h.classList.add("gone")}
  }
  var emitTimer=0,emit2=0;
  function emitters(t){
    if(!autoOn)return;
    // two orbiting ambient emitters
    emitTimer+=0.35;emit2+=0.22;
    var x1=N/2+Math.cos(emitTimer)*N*0.3,y1=N/2+Math.sin(emitTimer)*N*0.25;
    var x2=N/2+Math.cos(emit2+3)*N*0.28,y2=N/2+Math.sin(emit2+1.6)*N*0.22;
    splat(x1,y1,Math.cos(emitTimer+1)*8,Math.sin(emitTimer+1)*8,4,hue+40);
    splat(x2,y2,Math.cos(emit2+2)*8,Math.sin(emit2+2)*8,4,hue+120);
  }
  var last=performance.now(),fpsC=0,fpsT=0;
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    // pointer dye
    if(mouse.down&&mouse.px>-5000){
      var dx=(mouse.x-mouse.px)*8,dy=(mouse.y-mouse.py)*8;
      var dist=Math.sqrt(dx*dx+dy*dy);
      for(var st=0;st<=1;st+=0.2){
        var px=mouse.px+(mouse.x-mouse.px)*st,py=mouse.py+(mouse.y-mouse.py)*st;
        splat(px,py,dx,dy,6,hue);
      }
    }else if(!mouse.down&&mouse.first&&!RM){
      splat(mouse.x,mouse.y,0,0,3,hue);
    }
    hue=(hue+0.7)%360;
    document.getElementById("swatch").style.background="conic-gradient(hsl("+hue+",95%,55%),hsl("+((hue+60)%360)+",95%,55%),hsl("+hue+",95%,55%))";
    emitters(now/1000);
    step();
    render();
    fpsC++;fpsT+=dt;
    if(fpsT>=0.5){
      document.getElementById("fps").textContent=Math.round(fpsC/fpsT)+" fps";
      fpsC=0;fpsT=0;
    }
    requestAnimationFrame(loop);
  }

  // controls
  var bri=document.getElementById("bri"),dis=document.getElementById("dis");
  function setBri(v){brightness=v;document.getElementById("briVal").textContent=v.toFixed(2);bri.style.setProperty("--p",((v-0.4)/2.6*100)+"%")}
  function setDis(v){dissipation=v;document.getElementById("disVal").textContent=v.toFixed(3);dis.style.setProperty("--p",((v-0.94)/0.059*100)+"%")}
  bri.addEventListener("input",function(){setBri(+this.value)});
  dis.addEventListener("input",function(){setDis(+this.value)});
  setBri(1.40);setDis(0.988);
  document.getElementById("clearBtn").addEventListener("click",function(){
    u.fill(0);v.fill(0);r.fill(0);g.fill(0);b.fill(0);
  });
  document.getElementById("autoBtn").addEventListener("click",function(){
    autoOn=!autoOn;
    this.setAttribute("aria-pressed",autoOn?"true":"false");
  });
  if(RM){autoOn=false;document.getElementById("autoBtn").setAttribute("aria-pressed","false")}

  resize();setup();
  hintGone();
  if(!RM)requestAnimationFrame(loop);else{for(var i=0;i<40;i++)step();render()}
  // still render on pointer moves with RM
})();
</script>
</body>
</html>
