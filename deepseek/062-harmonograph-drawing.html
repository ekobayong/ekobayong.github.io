<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HARMONOGRAPH — Pendulum Drawing Machine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brass:#c9a24a;--brass2:#f1d98a;--cream:#e9dfcb;--cream2:#a89e8a}
body{
  background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.12) 10px 12px),
  radial-gradient(70% 50% at 50% -8%,rgba(201,162,74,.18),transparent 65%),linear-gradient(180deg,#2c1810,#26140b 55%,#150a05);
  min-height:100vh;color:var(--cream);font-family:'Iowan Old Style',Palatino,Georgia,serif;
  background-attachment:fixed;
}
.wrap{max-width:1440px;margin:0 auto;padding:44px 30px 70px}
header{text-align:center;margin-bottom:30px}
header h1{font-size:clamp(24px,3.4vw,40px);letter-spacing:.18em;color:var(--brass2);text-transform:uppercase;font-weight:400;
  text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 30px rgba(241,217,138,.15)}
header .sub{font-style:italic;font-size:14.5px;color:var(--cream2);margin-top:8px}
header .orn{display:block;margin:14px auto 0}
.main{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
/* bed */
.bed{
  position:relative;background:linear-gradient(180deg,#5a3320,#3b1f12 55%,#2a150c);border-radius:14px;
  padding:20px;box-shadow:inset 0 2px 3px rgba(255,200,140,.2),inset 0 -8px 20px rgba(0,0,0,.55),0 30px 60px rgba(0,0,0,.5);
  border:1px solid rgba(201,162,74,.5);
}
.bed::before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,162,74,.4);border-radius:8px;pointer-events:none}
.screw3{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d68a,#a97f32 60%,#5a3c10);
  box-shadow:0 2px 4px rgba(0,0,0,.6)}
.screw3::after{content:"";position:absolute;left:3px;right:3px;top:7.5px;height:1.5px;background:#4a3008;transform:rotate(38deg)}
.screw3.a{top:18px;left:18px}.screw3.b{top:18px;right:18px}.screw3.c{bottom:18px;left:18px}.screw3.d{bottom:18px;right:18px}
.plate{
  position:relative;width:100%;aspect-ratio:16/10;background:radial-gradient(120% 100% at 50% 40%,#141720,#07080c 80%);
  border-radius:6px;box-shadow:inset 0 0 60px rgba(0,0,0,.8),0 0 0 2px rgba(201,162,74,.25);
  overflow:hidden;
}
.plate canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.paramread{position:absolute;top:12px;right:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--brass2);letter-spacing:.06em;line-height:1.7;z-index:3}
.platelabel{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.3em;color:rgba(241,217,138,.4);text-transform:uppercase;z-index:3}
/* control panel */
.panel{background:linear-gradient(180deg,#b78f3c,#8a6620 60%,#6e4f16);border-radius:12px;padding:16px;position:relative;
  box-shadow:inset 0 2px 1px rgba(255,240,180,.35),inset 0 -6px 14px rgba(0,0,0,.4),0 20px 44px rgba(0,0,0,.5)}
.subplate{
  background:linear-gradient(180deg,#d8c48a,#c2ab68);border:1px solid rgba(60,40,8,.6);border-radius:8px;
  padding:14px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 6px rgba(0,0,0,.2);
}
.subplate h3{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#3a2a08;margin-bottom:10px;
  text-shadow:1px 1px 0 rgba(255,255,255,.3)}
.param3{margin-bottom:8px}
.param3 .pl3{display:flex;justify-content:space-between;font-size:12px;color:#3a2a08;margin-bottom:2px}
.param3 .pl3 b{font-family:ui-monospace,monospace;font-size:10.5px;color:#4a3208;font-weight:400}
.param3 input{width:100%;appearance:none;-webkit-appearance:none;height:4px;border-radius:2px;background:#5a3c10;outline:none}
.param3 input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0d68a,#a97f32);border:1px solid #4a3008;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#3a2a08;cursor:pointer;margin:8px 0}
.chk input{accent-color:#7a5a1a}
.swatches2{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.sw2{width:24px;height:24px;border-radius:50%;border:2px solid rgba(60,40,8,.5);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.sw2:hover{transform:scale(1.2)}
.sw2.on{box-shadow:0 0 0 2px #4a3008,0 0 0 4px #c2ab68}
.buttons{display:flex;flex-direction:column;gap:8px}
.bigbtn,.pbtn2{
  border:none;border-radius:8px;padding:13px;font-family:Georgia,serif;font-size:14.5px;letter-spacing:.12em;cursor:pointer;
  background:linear-gradient(180deg,#3a2c14,#241a08);color:var(--brass2);
  box-shadow:0 3px 0 #120c04,0 6px 14px rgba(0,0,0,.4);transition:all .12s;
}
.bigbtn:active,.pbtn2:active{transform:translateY(3px);box-shadow:0 0 0 #120c04}
.bigbtn{background:linear-gradient(180deg,#7a1a0c,#4a0f06);color:#f5e2c8}
.pbtn2{font-size:12px;padding:10px}
.eqnote{font-style:italic;font-size:11.5px;color:#3a2a08;text-align:center;margin-top:6px;letter-spacing:.03em}
.smallrow{display:flex;gap:6px;flex-wrap:wrap}
.smallrow .pbtn2{flex:1;min-width:80px}
@media(prefers-reduced-motion:reduce){.bigbtn,.pbtn2{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Harmonograph</h1>
    <div class="sub">A drawing instrument of coupled, decaying pendulums — patent of the imagination, 1874</div>
    <svg class="orn" width="260" height="18" viewBox="0 0 260 18">
      <line x1="0" y1="9" x2="105" y2="9" stroke="#c9a24a"/><rect x="105" y="3" width="12" height="12" transform="rotate(45 111 9)" fill="none" stroke="#c9a24a"/>
      <circle cx="130" cy="9" r="4" fill="#c9a24a"/><rect x="143" y="3" width="12" height="12" transform="rotate(45 149 9)" fill="none" stroke="#c9a24a"/>
      <line x1="155" y1="9" x2="260" y2="9" stroke="#c9a24a"/>
    </svg>
  </header>

  <div class="main">
    <div class="bed">
      <span class="screw3 a"></span><span class="screw3 b"></span><span class="screw3 c"></span><span class="screw3 d"></span>
      <div class="plate">
        <canvas id="trace"></canvas><canvas id="pen"></canvas>
        <div class="paramread" id="paramread"></div>
        <div class="platelabel">Smoked Glass Plate · No. 7</div>
      </div>
    </div>

    <aside class="panel">
      <div class="subplate" id="subX">
        <h3>Lateral pendulum · x</h3>
        <div id="px"></div>
      </div>
      <div class="subplate" id="subY">
        <h3>Longitudinal pendulum · y</h3>
        <div id="py"></div>
      </div>
      <div class="subplate" id="subR">
        <h3>Rotary table</h3>
        <label class="chk"><input type="checkbox" id="rOn">Engage rotary table</label>
        <div id="pr"></div>
      </div>
      <div class="subplate">
        <h3>Ink &amp; motion</h3>
        <div class="param3"><div class="pl3"><span>Speed</span><b id="spdV2">1×</b></div>
          <input type="range" id="speedS" min="1" max="40" value="1"></div>
        <div class="swatches2" id="inks"></div>
      </div>
      <div class="subplate">
        <div class="buttons">
          <button class="bigbtn" id="drawBtn">Lower pen &amp; draw</button>
          <button class="pbtn2" id="liftBtn">Lift pen</button>
          <div class="smallrow">
            <button class="pbtn2" id="replayBtn">Replay</button>
            <button class="pbtn2" id="rndBtn">Randomize</button>
            <button class="pbtn2" id="clearBtn">Clear plate</button>
            <button class="pbtn2" id="exportBtn">Export PNG</button>
          </div>
        </div>
        <div class="eqnote">x(t) = Σ Aᵢ sin(fᵢt + φᵢ)·e^(−dᵢt)</div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var traceCv=document.getElementById("trace"),tctx=traceCv.getContext("2d");
  var penCv=document.getElementById("pen"),pctx=penCv.getContext("2d");
  var R=8.3;
  var W=0,H=0,DPR=1;
  var P={
    x:{f:2,p:0.4,d:0.004,a:1},
    y:{f:3,p:0.7,d:0.003,a:0.85},
    r:{on:false,f:0.5,p:0,d:0.01,a:0.5}
  };
  var params={x:{f:[1,6,0.1],p:[0,6.28,0.02],d:[0,0.02,0.0002],a:[0,1,0.02]},
    y:{f:[1,6,0.1],p:[0,6.28,0.02],d:[0,0.02,0.0002],a:[0,1,0.02]},
    r:{f:[0.2,2,0.05],p:[0,6.28,0.02],d:[0,0.02,0.0002],a:[0,1,0.02]}};
  var ink="#8ef7c3",rainbow=false,drawing=false,t=0,speed=1;
  var history=[],currentTrace=null;
  var inks2=["#8ef7c3","#6fd7ff","#ff7ab8","#ffc46b","#b48bff","#f2e9d2","rainbow"];
  // param sliders
  function buildSliders(){
    ["x","y","r"].forEach(function(ax){
      var els={f:"",p:"",d:"",a:""};
      ["f","p","d","a"].forEach(function(k){
        var name=ax==="r"?{f:"Freq",p:"Phase",d:"Damp",a:"Ampl"}[k]:{f:"Freq",p:"Phase",d:"Damp",a:"Ampl"}[k];
        var rng=params[ax][k];
        var div=document.createElement("div");
        div.className="param3";
        div.innerHTML='<div class="pl3"><span>'+name+'</span><b id="v-'+ax+k+'">'+P[ax][k].toFixed(k==="d"?3:2)+'</b></div>'+
          '<input type="range" min="'+rng[0]+'" max="'+rng[1]+'" step="'+rng[2]+'" value="'+P[ax][k]+'">';
        div.querySelector("input").addEventListener("input",function(){
          var v=+this.value;
          P[ax][k]=v;
          document.getElementById("v-"+ax+k).textContent=v.toFixed(k==="d"?3:2);
        });
        document.getElementById("sub"+ (ax==="x"?"X":ax==="y"?"Y":"R")).appendChild(div);
      });
    });
    document.getElementById("rOn").addEventListener("change",function(){
      P.r.on=this.checked;
    });
  }
  function buildInks(){
    var el=document.getElementById("inks");
    var cols=["#8ef7c3","#6fd7ff","#ff7ab8","#ffc46b","#b48bff","#f2e9d2"];
    cols.forEach(function(c,i){
      var s=document.createElement("button");
      s.className="sw2"+(c==="#8ef7c3"?" on":"");
      s.style.background=c;
      s.addEventListener("click",function(){
        document.querySelectorAll(".sw2").forEach(function(x){x.classList.remove("on")});
        s.classList.add("on");
        ink=c;rainbow=false;
      });
      el.appendChild(s);
    });
    var rbow=document.createElement("button");
    rbow.className="sw2";rbow.style.background="conic-gradient(#ff5c8a,#ffc46b,#8ef7c3,#6fd7ff,#b48bff,#ff5c8a)";
    rbow.title="rainbow";
    rbow.addEventListener("click",function(){
      document.querySelectorAll(".sw2").forEach(function(x){x.classList.remove("on")});
      rbow.classList.add("on");rainbow=true;
    });
    el.appendChild(rbow);
  }
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    var r=traceCv.parentElement.getBoundingClientRect();
    W=r.width;H=r.height;
    traceCv.width=W*DPR;traceCv.height=H*DPR;
    penCv.width=W*DPR;penCv.height=H*DPR;
    tctx.setTransform(DPR,0,0,DPR,0,0);
    pctx.setTransform(DPR,0,0,DPR,0,0);
    redrawHistory();
  }
  window.addEventListener("resize",function(){resize()});
  function redrawHistory(){
    tctx.clearRect(0,0,W,H);
    // graticule
    tctx.strokeStyle="rgba(241,217,138,.08)";tctx.lineWidth=1;
    var cx=W/2,cy=H/2;
    [40,90,150,220].forEach(function(r2){
      tctx.beginPath();tctx.arc(cx,cy,r2,0,7);tctx.stroke();
    });
    tctx.beginPath();tctx.moveTo(cx-260,cy);tctx.lineTo(cx+260,cy);tctx.stroke();
    tctx.beginPath();tctx.moveTo(cx,cy-170);tctx.lineTo(cx,cy+170);tctx.stroke();
    history.forEach(function(trace){
      drawTrace(trace,1);
    });
  }
  function drawTrace(tr,alphaMul){
    if(!tr.points)return;
    tctx.globalCompositeOperation="lighter";
    for(var i=1;i<tr.points.length;i++){
      var a=tr.points[i-1],b=tr.points[i];
      // wide glow pass
      tctx.strokeStyle=tr.color;tctx.globalAlpha=0.35*alphaMul;
      tctx.lineWidth=2.6;
      tctx.beginPath();tctx.moveTo(a.x,a.y);tctx.lineTo(b.x,b.y);tctx.stroke();
      tctx.strokeStyle=tr.color;tctx.globalAlpha=0.9*alphaMul;
      tctx.lineWidth=0.7;
      tctx.beginPath();tctx.moveTo(a.x,a.y);tctx.lineTo(b.x,b.y);tctx.stroke();
    }
    tctx.globalAlpha=1;
    tctx.globalCompositeOperation="source-over";
  }
  function scaled(){
    // map [-1,1]^2 to plate with margins
    var m=Math.min(W,H)*0.34;
    var mx=W/2,my=H/2;
    return{x:function(v){return mx+v*m},y:function(v){return my+v*m}};
  }
  function xy(t2){
    var sx=scaled();
    var g=P.x,t3=P.y,rr=P.r;
    var x=-1+g.a*Math.sin(g.f*t2+g.p)*Math.exp(-g.d*t2);
    x+= rr.on?rr.a*Math.exp(-rr.d*t2)*Math.cos(rr.f*t2)*0.4:0;
    var y=t3.a*Math.sin(t3.f*t2+t3.p)*Math.exp(-t3.d*t2);
    y+= rr.on?rr.a*Math.exp(-rr.d*t2)*Math.sin(rr.f*t2)*0.4:0;
    // scale to fit plate
    return{x:sx.x(-1+((x+1)/2)*2),y:sx.y(y)};
  }
  document.getElementById("drawBtn").addEventListener("click",function(){
    t=0;drawing=true;
    // clear current trace only
    if(!RM){} 
    currentTrace={points:[],color:rainbow?"hsl(0,80%,65%)":ink,dep:Date.now()};
    history.push(currentTrace);
    if(history.length>6)history.shift();
    advance(0);
  });
  var drawingT0=0;
  function advance(now){
    if(!drawing)return;
    var dt=0.012*speed;
    if(RM)speed=40;
    t+=dt;
    var p=xy(t);
    // map: our xy returns plate coords with scale; ensure fits
    var pts=currentTrace.points;
    var prev=pts.length?pts[pts.length-1]:null;
    if(!prev||Math.abs(prev.x-p.x)+Math.abs(prev.y-p.y)>0.1){
      pts.push({x:p.x,y:p.y});
    }
    var col=rainbow?"hsl("+((t*90)%360)+",80%,65%)":ink;
    currentTrace.color=col;
    // draw incrementally
    if(prev){
      tctx.globalCompositeOperation="lighter";
      tctx.strokeStyle=col;tctx.lineWidth=2.6;tctx.globalAlpha=0.35;
      tctx.beginPath();tctx.moveTo(prev.x,prev.y);tctx.lineTo(p.x,p.y);tctx.stroke();
      tctx.lineWidth=0.7;tctx.globalAlpha=0.9;
      tctx.stroke();
      tctx.globalAlpha=1;tctx.globalCompositeOperation="source-over";
    }
    // pen
    pctx.clearRect(0,0,W,H);
    pctx.fillStyle="#fff";
    pctx.shadowColor="#fff";pctx.shadowBlur=8;
    pctx.beginPath();pctx.arc(p.x,p.y,3,0,7);pctx.fill();
    pctx.shadowBlur=0;
    // pen arm
    pctx.strokeStyle="rgba(201,162,74,.6)";pctx.lineWidth=1;
    pctx.beginPath();pctx.moveTo(p.x,p.y);pctx.lineTo(W-10,10);pctx.stroke();
    updateReadout(t);
    if(t<260){
      requestAnimationFrame(advance);
    }else{
      drawing=false;
      pctx.clearRect(0,0,W,H);
      updateReadout(t);
    }
  }
  function updateReadout(tt){
    document.getElementById("paramread").innerHTML=
      "t "+tt.toFixed(2)+" s<br>f₁ "+P.x.f.toFixed(2)+" · f₂ "+P.y.f.toFixed(2)+"<br>"+
      (P.r.on?"rot "+P.r.f.toFixed(2)+" · ":"")+"ink "+(rainbow?"hue":ink);
  }
  document.getElementById("liftBtn").addEventListener("click",function(){
    drawing=false;
    pctx.clearRect(0,0,W,H);
  });
  document.getElementById("clearBtn").addEventListener("click",function(){
    drawing=false;history=[];currentTrace=null;
    redrawHistory();
  });
  document.getElementById("replayBtn").addEventListener("click",function(){
    var tr=currentTrace||history[history.length-1];
    if(!tr)return;
    t=0;drawing=true;
    var copy={points:[],color:tr.color};
    history.push(copy);
    if(history.length>6)history.shift();
    currentTrace=copy;
    // redraw others, replay points quickly
    (function repTicks(){
      t+=0.012*Math.max(1,speed);
      var p=xy(t);
      copy.points.push({x:p.x,y:p.y});
      var pts=copy.points;
      if(pts.length>1){
        tctx.globalCompositeOperation="lighter";
        tctx.strokeStyle=copy.color;tctx.lineWidth=.7;tctx.globalAlpha=.9;
        tctx.beginPath();tctx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);tctx.lineTo(p.x,p.y);tctx.stroke();
        tctx.globalAlpha=1;tctx.globalCompositeOperation="source-over";
      }
      if(t<260)requestAnimationFrame(repTicks);
    })();
  });
  document.getElementById("rndBtn").addEventListener("click",function(){
    var ratios=[[3,2],[4,3],[5,3],[5,4],[3,1],[7,5],[8,5],[9,7]];
    var r=ratios[Math.floor(Math.random()*ratios.length)];
    P.x.f=r[0];P.y.f=r[1]+(Math.random()-0.5)*0.06;
    P.x.p=Math.random()*6.28;P.y.p=Math.random()*6.28;
    P.x.d=0.004+Math.random()*0.004;P.y.d=0.003+Math.random()*0.004;
    P.x.a=0.8+Math.random()*0.2;P.y.a=0.7+Math.random()*0.3;
    P.r.on=Math.random()<0.5;
    P.r.f=0.3+Math.random()*0.5;P.r.d=0.01;P.r.a=0.3+Math.random()*0.4;
    var inks2b=["#8ef7c3","#6fd7ff","#ff7ab8","#ffc46b","#b48bff","#f2e9d2"];
    var chosen=inks2b[Math.floor(Math.random()*inks2b.length)];
    ink=chosen;rainbow=Math.random()<0.2;
    document.querySelectorAll(".sw2").forEach(function(s){s.classList.remove("on")});
    if(rainbow){document.querySelectorAll(".sw2")[6].classList.add("on")}
    else{
      var target=document.querySelectorAll(".sw2")[inks2b.indexOf(chosen)];
      if(target)target.classList.add("on");
    }
    // sync sliders
    syncSliders();
    // start drawing
    document.getElementById("clearBtn").click();
    document.getElementById("drawBtn").click();
  });
  function syncSliders(){
    ["x","y","r"].forEach(function(ax){
      ["f","p","d","a"].forEach(function(k){
        var sl=document.querySelector("#sub"+(ax==="x"?"X":ax==="y"?"Y":"R")+" input[type=range]:nth-of-type("+({f:1,p:2,d:3,a:4}[k])+")");
        // simpler: set values by finding matching labeled slider
        var inputs=document.querySelectorAll("#sub"+(ax==="x"?"X":ax==="y"?"Y":"R")+" .param3 input");
        var order2=["f","p","d","a"];
        var idx=order2.indexOf(k);
        if(inputs[idx]){inputs[idx].value=P[ax][k];document.getElementById("v-"+ax+k).textContent=P[ax][k].toFixed(k==="d"?3:2)}
      });
    });
    var ro=document.getElementById("rOn");ro.checked=P.r.on;
    document.getElementById("spdV2").textContent=speed+"×";
  }
  document.getElementById("speedS").addEventListener("input",function(){
    speed=+this.value;
    document.getElementById("spdV2").textContent=speed+"×";
  });
  document.getElementById("exportBtn").addEventListener("click",function(){
    var out=document.createElement("canvas");
    out.width=W*DPR;out.height=H*DPR;
    var c=out.getContext("2d");
    c.fillStyle="#0d0f14";c.fillRect(0,0,W*DPR,H*DPR);
    c.setTransform(DPR,0,0,DPR,0,0);
    c.drawImage(traceCv,0,0,W,H);
    var a=document.createElement("a");
    a.download="harmonograph-plate-7.png";
    a.href=out.toDataURL();
    a.click();
  });
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();document.getElementById("drawBtn").click()}
    if(e.key==="r"||e.key==="R")document.getElementById("rndBtn").click();
    if(e.key==="c"||e.key==="C")document.getElementById("clearBtn").click();
  });
  buildSliders();
  buildInks();
  resize();
  if(RM)speed=40;
  // start with a demo trace so the plate is never empty
  document.getElementById("drawBtn").click();
})();
</script>
</body>
</html>
