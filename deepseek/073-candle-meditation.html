<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Flame — Candle Breathing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --glow:1;
  --breath:1;
  --bend:0;
}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(70% 56% at 50% 62%,rgba(255,150,60,calc(var(--glow)*0.5)),transparent 70%),
    linear-gradient(180deg,#2a1710 0 46%,#1c0f0a 46% 58%,#241409 58% 100%),
    #120a07;
  color:#e9d8c3;min-height:100vh;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,ui-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
/* table plane */
.table{position:fixed;left:-20%;right:-20%;bottom:-24vh;height:60vh;pointer-events:none;z-index:0;
  transform:perspective(700px) rotateX(58deg);transform-origin:50% 0;
  background:linear-gradient(180deg,#2a1710,#1a0e08);
  box-shadow:0 -30px 60px rgba(0,0,0,.6)}
.table .pool{position:absolute;left:50%;top:20%;width:50vw;height:30vh;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(255,150,60,calc(var(--glow)*0.35)),transparent);
  filter:blur(24px)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 110% at 50% 45%,transparent 55%,rgba(0,0,0,.65))}
/* centre */
.stage{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:34px}
/* ring */
.ringwrap{position:relative;width:min(70vw,420px);aspect-ratio:1;display:grid;place-items:center;pointer-events:none}
.rring{position:absolute;inset:0}
.rring circle{fill:none}
.rring .base{stroke:rgba(233,216,195,.14);stroke-width:1.5}
.rring .dash{stroke:rgba(233,216,195,.3);stroke-width:1.5;stroke-dasharray:3 6;animation:rotSlow 40s linear infinite}
.rring .arc{stroke:#ffb56b;stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,181,107,.8))}
@keyframes rotSlow{to{transform:rotate(360deg)}}
/* candle */
.candlewrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.candle{position:relative;width:74px;height:210px;transform:translateY(18px)}
.wax{
  position:absolute;left:50%;top:0;transform:translateX(-50%);width:52px;height:200px;border-radius:5px 5px 3px 3px;
  background:linear-gradient(90deg,#c9a789 0%,#f2dcc2 18%,#fbe9d4 40%,#e3c5a6 75%,#b8977a 100%);
  box-shadow:inset 0 0 16px rgba(180,140,90,.4),inset -6px 0 14px rgba(150,110,70,.5);
}
.wax::before{content:"";position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:60px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#fbe9d4,#e8cba4 65%,#be9a72);
  box-shadow:0 0 14px rgba(255,220,160,calc(var(--glow)*0.5))}
.candle.lit .wax::before{background:radial-gradient(circle at 50% 30%,#fff3da,#ffd9a0 55%,#d9a86e)}
.drips{position:absolute;top:0;left:50%;pointer-events:none}
.drip{position:absolute;width:13px;background:linear-gradient(180deg,#fbe9d4,#d9b688);border-radius:4px;transform:translateX(-50%);
  height:var(--h,26px);animation:drp calc(90s + var(--i,0)*120s) linear infinite;transform-origin:top}
@keyframes drp{from{height:4px}to{height:var(--h,26px)}}
.drip.d1{left:-12px;--h:30px;--i:0}.drip.d2{left:6px;--h:22px;--i:1}.drip.d3{left:14px;--h:34px;--i:2}
.wick{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:3px;height:22px;background:#24150a;border-radius:2px}
.ember{position:absolute;left:50%;top:-16px;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,#fff3cf,#ff9b3d 55%,#cc4400);box-shadow:0 0 12px 5px rgba(255,150,60,.8);
  opacity:0;transition:opacity .3s}
.candle.lit .ember{opacity:1}
.candle.unlit-flame .wick{transition:transform 1s;transform:translateX(-50%) translateY(-4px) scaleY(.8)}
/* flame */
.flame{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%) scale(var(--breath)) ;transform-origin:bottom;
  width:46px;height:120px;opacity:1;pointer-events:none;
  filter:hue-rotate(calc(var(--time)*0.4deg))}
.flame .layer{position:absolute;left:50%;bottom:0;transform-origin:50% 100%;transform:translateX(-50%)}
.flame .f-glow{width:130px;height:170px;background:radial-gradient(closest-side,rgba(255,150,60,.85),transparent 72%);
  mix-blend-mode:screen;filter:blur(18px);animation:flickA 1.6s ease-in-out infinite}
.flame .f-out{width:44px;height:120px;border-radius:50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 70%,#ff6a20 20%,#f04a10 60%,#b33400);
  filter:blur(1.2px);animation:flickB 1.3s ease-in-out infinite}
.flame .f-mid{width:26px;height:78px;border-radius:50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 60%,#ffd28a 10%,#ffb347 60%,#e88a20);animation:flickC 1.1s ease-in-out infinite}
.flame .f-core{width:12px;height:40px;border-radius:50%/65% 65% 35% 35%;
  background:radial-gradient(circle at 50% 55%,#fffbe8 20%,#fff3cf 60%,#ffd98a);animation:flickD .9s ease-in-out infinite}
.flame .f-blue{width:16px;height:18px;border-radius:50%;background:radial-gradient(circle,#7fc4ff,#2a5aef 70%);
  bottom:-2px;filter:blur(1px)}
.f-candle{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:46px;height:120px;animation:none}
@keyframes flickA{0%,100%{transform:translateX(-50%) translate(0,0) scale(1)}25%{transform:translateX(-50%) translate(2px,-3px) scale(1.02)}50%{transform:translateX(-50%) translate(-2px,-1px) scale(.98)}75%{transform:translateX(-50%) translate(1px,-2px) scale(1.01)}}
@keyframes flickB{0%,100%{transform:translateX(-50%) translate(0,0) scale(1)}30%{transform:translateX(-50%) translate(2px,-4px) scale(1.03,.97)}55%{transform:translateX(-50%) translate(-2px,-2px) scale(.97,1.03)}80%{transform:translateX(-50%) translate(1px,-3px) scale(1.02)}}
@keyframes flickC{0%,100%{transform:translateX(-50%) translate(0,0) scale(1)}20%{transform:translateX(-50%) translate(-2px,-3px) scale(1.04,.96)}45%{transform:translateX(-50%) translate(2px,-1px) scale(.96,1.04)}70%{transform:translateX(-50%) translate(-1px,-4px) scale(1.03)}}
@keyframes flickD{0%,100%{transform:translateX(-50%) translate(0,0) scale(1)}35%{transform:translateX(-50%) translate(1.4px,-2px) scale(1.05)}65%{transform:translateX(-50%) translate(-1.4px,-1px) scale(.95)}}
.flame{transform:translateX(-50%) scale(calc(var(--breath) * (1 - 0.45*var(--bend)))) skewX(calc(-28deg * var(--bend))) rotate(calc(-14deg*var(--bend)))}
/* cues */
.cue{position:absolute;left:50%;top:50%;transform:translate(-50%,-88%);text-align:center;width:70%;pointer-events:none}
.cue .word{font-size:clamp(24px,3.6vw,40px);letter-spacing:.22em;text-transform:uppercase;
  text-shadow:0 0 30px rgba(255,181,107,.35);transition:opacity 1.2s ease,transform 1.2s ease;position:absolute;left:0;right:0;opacity:0}
.cue .word.show{opacity:1}
.cue .count{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.3em;color:rgba(233,216,195,.6);margin-top:44px;font-variant-numeric:tabular-nums}
/* controls */
.controls{position:fixed;bottom:26px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;z-index:10;flex-wrap:wrap;padding:0 14px}
.chips{display:flex;gap:8px}
.chip{border:1.5px solid rgba(233,216,195,.35);background:rgba(20,12,6,.5);color:#e9d8c3;font-family:inherit;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;border-radius:99px;cursor:pointer;transition:all .3s}
.chip:hover{border-color:#ffb56b}
.chip.on{background:rgba(255,181,107,.16);border-color:#ffb56b;color:#ffe3c0}
.begin{border:none;background:linear-gradient(180deg,#7a4a28,#4a2a12);color:#f5e6cf;font-family:inherit;
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:13px 30px;border-radius:99px;cursor:pointer;box-shadow:0 4px 0 #2a1608;transition:all .15s}
.begin:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1608}
.statusrow{position:fixed;top:22px;left:0;right:0;text-align:center;z-index:10;font-family:ui-monospace,monospace;
  font-size:11px;letter-spacing:.2em;color:rgba(233,216,195,.55);text-transform:uppercase}
.statusrow b{color:#ffb56b;font-weight:400}
.smallnote{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(233,216,195,.4);z-index:8;font-family:system-ui,sans-serif}
canvas#smoke{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(prefers-reduced-motion:reduce){.flame .layer{animation:none!important}.drip{animation:none}}
</style>
</head>
<body>
<canvas id="smoke"></canvas>
<div class="table"><div class="pool"></div></div>
<div class="vig"></div>
<div class="statusrow" id="status">ready · pick a pattern</div>

<div class="stage">
  <div class="ringwrap">
    <svg class="rring" viewBox="0 0 300 300">
      <circle class="base" cx="150" cy="150" r="140"/>
      <circle class="dash" cx="150" cy="150" r="124"/>
      <circle class="arc" id="arc" cx="150" cy="150" r="140" stroke-dasharray="880" stroke-dashoffset="880" transform="rotate(-90 150 150)"/>
    </svg>
    <div class="cue" id="cue">
      <div class="word" id="cueWord">Breathe in</div>
      <div class="count" id="cueCount">4</div>
    </div>
    <div class="candlewrap" id="candleWrap">
      <div class="candle lit" id="candle">
        <div class="wax">
          <div class="drips"><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span></div>
          <div class="wick"></div>
          <div class="ember"></div>
          <div class="flame">
            <div class="layer f-glow"></div>
            <div class="layer f-out"></div>
            <div class="layer f-mid"></div>
            <div class="layer f-core"></div>
            <div class="layer f-blue"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="chips" id="chips">
    <button class="chip on" data-p="478" data-l="Breathe in" data-a="4" data-h="7" data-e="8" data-r="0">4·7·8</button>
    <button class="chip" data-p="box" data-l="Breathe in" data-a="4" data-h="4" data-e="4" data-r="4">Box</button>
    <button class="chip" data-p="calm" data-l="Breathe in" data-a="5" data-h="0" data-e="7" data-r="2">Calm</button>
  </div>
  <button class="begin" id="beginBtn">Begin</button>
</div>
<div class="smallnote">hold the mouse or space to blow · or let it burn</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root=document.documentElement;
  var flame=document.querySelector(".flame");
  // generate random flicker keyframes
  (function(){
    var st="";
    var layers=[["f-glow",1.6],["f-out",1.3],["f-mid",1.1],["f-core",.9]];
    layers.forEach(function(l){
      var name="fl"+l[0].slice(2);
      var steps="";
      for(var i=0;i<8;i++){
        var tx=(Math.random()*4-2)* (l[0]==="f-core"?0.5:1);
        var sc=1+(Math.random()*0.06-0.03);
        var sk=(Math.random()*3-1.5);
        steps+=(i/8*100)+"%{transform:translateX(-50%) translate("+tx.toFixed(1)+"px,"+(Math.random()*3-1.5).toFixed(1)+"px) scale("+sc.toFixed(3)+") skewX("+sk.toFixed(1)+"deg)}";
      }
      st+="@keyframes "+name+"{"+steps+"}";
      st+="."+l[0]+"{animation:"+name+" "+(l[1])+"s ease-in-out infinite}";
    });
    var el=document.createElement("style");
    el.textContent=st;
    document.head.appendChild(el);
  })();
  // breathing
  var pattern={a:4,h:7,e:8,r:0,p:"478"};
  var sessionOn=false,sessionT=0,cycles=0,inSession=false;
  var phase="inhale",phaseT=0,breathV=1;
  var lit=true,blowT=0,blowF=false;
  var lightsOff=false;
  function phaseDurations(){
    return{inhale:pattern.a,hold:pattern.h,exhale:pattern.e,rest:pattern.r};
  }
  function phaseTotal(){var d=phaseDurations();return d.inhale+d.hold+d.exhale+d.rest}
  function start(){
    sessionOn=!sessionOn;
    document.getElementById("beginBtn").textContent=sessionOn?"Pause":"Begin";
    if(sessionOn){sessionT=0;cycles=0;phase="inhale";phaseT=0;breathV=1}
  }
  function tickBreath(dt){
    if(!sessionOn)return;
    sessionT+=dt;
    var d=phaseDurations();
    var ph=phase,wall=phaseTotal();
    phaseT+=dt;
    if(phase==="inhale"){
      var t=phaseT/d.inhale;t=Math.max(0,Math.min(1,t));
      breathV=0.78+(1.32-0.78)*(t*t*(3-2*t));
      if(phaseT>=d.inhale){phase="hold";phaseT=0}
    }else if(phase==="hold"){
      if(phaseT>=d.hold){phase="exhale";phaseT=0}
    }else if(phase==="exhale"){
      var t2=phaseT/d.exhale;t2=Math.max(0,Math.min(1,t2));
      breathV=1.32-(1.32-0.78)*(t2*t2*(3-2*t2));
      if(phaseT>=d.exhale){
        if(d.rest>0){phase="rest";phaseT=0}else{phase="inhale";phaseT=0;cycles++}
      }
    }else{
      if(phaseT>=d.rest){phase="inhale";phaseT=0;cycles++}
    }
    // cue
    var words={inhale:"Breathe in",hold:"Hold",exhale:"Breathe out",rest:"Rest"};
    showCue(words[phase],phase==="inhale"?d.inhale:phase==="hold"?d.hold:phase==="exhale"?d.exhale:d.rest);
    root.style.setProperty("--breath",breathV);
    // ring arc
    var frac=phaseT/(d[phase]||1);
    var base={inhale:0,hold:0.33,exhale:0.33,rest:0.75}[phase];
    var len=880*(base+(phase==="exhale"?0.41*(1-frac):phase==="inhale"?0.33*frac:phase==="hold"?0.33:0.25*(1-frac)));
    document.getElementById("arc").setAttribute("stroke-dashoffset",880-len);
    document.getElementById("status").innerHTML="session <b>"+fmtTime(sessionT)+"</b> · cycles <b>"+cycles+"</b>";
  }
  function showCue(word,count){
    var w=document.getElementById("cueWord");
    if(w.textContent!==word){
      w.classList.remove("show");
      setTimeout(function(){w.textContent=word;document.getElementById("cueCount").textContent=count;w.classList.add("show")},RM?0:400);
    }else{
      document.getElementById("cueCount").textContent=count;
    }
  }
  function fmtTime(t){var s=Math.floor(t);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
  // blow
  var blowHeld=0,blowing=false;
  function blowSet(on){
    if(!lit)return;
    blowing=on;
    if(!on)blowHeld=0;
  }
  function tickBlow(dt){
    if(sessionOn&&!blowF){} 
    if(blowing&&lit){
      blowT+=dt;
      var bend=Math.min(1,blowT/0.6);
      root.style.setProperty("--bend",bend);
      if(blowT>1.5)extinguish();
    }else if(!blowing){
      blowT=Math.max(0,blowT-dt*3);
      root.style.setProperty("--bend",Math.min(1,blowT/0.6));
    }
  }
  // smoke
  var smokeCv=document.getElementById("smoke"),sctx=smokeCv.getContext("2d");
  var smokes=[],SW=0,SH=0,DPR2=1;
  function resizeSmoke(){
    DPR2=Math.min(2,devicePixelRatio||1);
    SW=innerWidth;SH=innerHeight;
    smokeCv.width=SW*DPR2;smokeCv.height=SH*DPR2;
    sctx.setTransform(DPR2,0,0,DPR2,0,0);
  }
  window.addEventListener("resize",resizeSmoke);resizeSmoke();
  function extinguish(){
    if(!lit)return;
    lit=false;
    document.getElementById("candle").classList.remove("lit");
    // flame collapse
    flame.style.transition="transform 1.2s ease,opacity 1s ease";
    flame.style.transform="translateX(-50%) scale(0.05)";
    flame.style.opacity=0;
    root.style.setProperty("--glow",0);
    // smoke burst
    var r=document.getElementById("candleWrap").getBoundingClientRect();
    var cx=r.left+r.width/2,cy=r.top;
    for(var i=0;i<40;i++){
      smokes.push({x:cx,y:cy,vx:(Math.random()-0.5)*26,vy:-30-Math.random()*40,
        life:0,max:4+Math.random()*2,r:6+Math.random()*8,a:0.2+Math.random()*0.2});
    }
    doneSmokeAt=performance.now();
  }
  var doneSmokeAt=0;
  function relight(){
    if(lit)return;
    lit=true;
    document.getElementById("candle").classList.add("lit");
    flame.style.transition="transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s";
    flame.style.transform="translateX(-50%) scale(var(--breath))";
    flame.style.opacity=1;
    root.style.setProperty("--glow",1);
    root.style.setProperty("--bend",0);
  }
  document.getElementById("candleWrap").addEventListener("pointerdown",function(){
    if(!lit)relight();
  });
  window.addEventListener("pointerdown",function(e){
    if(e.target.closest("button,.candlewrap"))return;
    blowSet(true);
  });
  window.addEventListener("pointerup",function(){blowSet(false)});
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();if(lit)blowSet(true);else relight()}
  });
  window.addEventListener("keyup",function(e){if(e.code==="Space")blowSet(false)});
  // chips
  document.querySelectorAll("#chips .chip").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll("#chips .chip").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
      pattern={a:+b.dataset.a,h:+b.dataset.h,e:+b.dataset.e,r:+b.dataset.r,p:b.dataset.p};
      phase="inhale";phaseT=0;
    });
  });
  document.getElementById("beginBtn").addEventListener("click",start);
  // smoke loop
  function drawSmoke(dt){
    sctx.clearRect(0,0,SW,SH);
    for(var i=smokes.length-1;i>=0;i--){
      var s=smokes[i];
      s.life+=dt* (RM?0.3:1);
      s.vx+=Math.sin(s.life*2+i)*8*dt;
      s.x+=s.vx*dt;s.y+=s.vy*dt;
      var a=s.a*(1-s.life/s.max);
      var r2=s.r*(1+s.life*0.6);
      sctx.fillStyle="rgba(140,130,120,"+(a.toFixed(3))+")";
      sctx.beginPath();sctx.arc(s.x,s.y,r2,0,7);sctx.fill();
      if(s.life>s.max)smokes.splice(i,1);
    }
    if(!lit&&performance.now()-doneSmokeAt>5000)smokes=[];
  }
  // main
  var last=performance.now();
  var timeVar=0;
  function loop(now){
    var dt=Math.min(0.06,(now-last)/1000);last=now;
    timeVar+=dt;
    root.style.setProperty("--time",timeVar);
    tickBreath(dt);
    tickBlow(dt);
    drawSmoke(dt);
    requestAnimationFrame(loop);
  }
  // show idle cue
  showCue("Breathe in","4");
  var idleTest=setInterval(function(){
    if(!sessionOn){cycles=0;document.getElementById("status").innerHTML="ready · pick a pattern"}
  },500);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
