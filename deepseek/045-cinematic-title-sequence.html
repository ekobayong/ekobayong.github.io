<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Long Meridian (MCMXCIX)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#e8e2d6;font-family:'Iowan Old Style',Palatino,Georgia,serif}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.frame{
  position:relative;aspect-ratio:2.39/1;width:min(100vw,(100vh - 96px)*2.39);
  max-width:100vw;background:#000;overflow:hidden;
  box-shadow:0 0 120px rgba(0,0,0,.9);
}
.layer{position:absolute;inset:0}
/* fog */
.fog{position:absolute;left:0;right:0;top:30%;height:60%;border-radius:50%;filter:blur(40px);
  mix-blend-mode:screen;pointer-events:none}
.fog.f1{top:26%;left:-10%;right:-10%;background:radial-gradient(40% 60% at 50% 60%,rgba(120,125,140,.40),transparent 70%);
  animation:fogdrift 46s ease-in-out infinite alternate}
.fog.f2{top:34%;left:-16%;right:-16%;background:radial-gradient(46% 70% at 50% 50%,rgba(150,140,120,.38),transparent 70%);
  animation:fogdrift 52s ease-in-out -20s infinite alternate reverse}
@keyframes fogdrift{from{transform:translateX(-4%)}to{transform:translateX(5%)}}
.horizon{position:absolute;left:40%;right:40%;top:58%;height:1px;opacity:0;
  background:linear-gradient(90deg,transparent,#c9b48a 40%,#f2e8d2 50%,#c9b48a 60%,transparent);
  transform:scaleX(0);transform-origin:center}
/* grain */
.grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;z-index:50;pointer-events:none}
/* cast */
.cast{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}
.cast .names{text-align:center}
.cast .kicker{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:rgba(232,226,214,.55);margin-bottom:14px}
.cast .nm{font-size:clamp(26px,4.6vw,52px);letter-spacing:.32em;text-transform:uppercase;font-weight:400}
/* title */
.title{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;}
.title h1{
  font-size:clamp(34px,6.6vw,96px);font-weight:400;letter-spacing:.38em;text-transform:uppercase;
  background:linear-gradient(90deg,#e8e2d6,#fff 45%,#e8e2d6 55%,#e8e2d6);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:blur(6px);transform:translateX(0);
  margin:0 4vw;
  animation:none;
}
.title .filmby,.title .below{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:rgba(232,226,214,.8)}
.title .below{margin-top:10px}
.title .flare{position:absolute;left:50%;top:50%;width:70%;height:4px;transform:translate(-50%,-50%) rotate(-4deg);
  background:linear-gradient(90deg,transparent,rgba(255,220,150,.9),rgba(150,200,255,.4),transparent);
  filter:blur(3px);opacity:0}
/* credits */
.credits{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;opacity:0}
.credits .cred{text-align:center;margin:26px 0}
.credits .role{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:rgba(232,226,214,.6)}
.credits .who{font-size:clamp(20px,2.6vw,30px);letter-spacing:.3em;text-transform:uppercase;margin-top:6px}
.credits .closing{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(232,226,214,.75);margin-top:30px}
/* end */
.end{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;z-index:40}
.end p{font-style:italic;font-size:clamp(20px,2.8vw,34px);max-width:36ch;line-height:1.5;
  max-width:30ch;letter-spacing:.02em}
.replay{
  display:inline-block;margin-top:30px;background:none;border:1px solid rgba(232,226,214,.7);
  color:#e8e2d6;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.4em;text-transform:uppercase;
  padding:14px 30px;cursor:pointer;transition:all .4s;text-decoration:none;
}
.replay:hover{letter-spacing:.52em;background:#e8e2d6;color:#000}
/* control strip */
.strip{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(0,0,0,.55);opacity:.55;transition:opacity .4s;padding:10px 22px}
.strip:hover,.strip:focus-within{opacity:1}
.strip .chapters{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.strip .chap{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(232,226,214,.6);padding:7px 14px;cursor:pointer;border:1px solid transparent;transition:all .3s}
.strip .chap.on{color:#fff;border-color:rgba(255,255,255,.4)}
.timeline{position:relative;height:14px;margin:2px 8px;cursor:pointer}
.timeline .rail{position:absolute;left:0;right:0;top:6px;height:1px;background:rgba(255,255,255,.3)}
.timeline .progress{position:absolute;left:0;top:6px;height:1px;background:#e8e2d6;box-shadow:0 0 8px rgba(232,226,214,.6)}
.timeline .tick{position:absolute;top:3px;width:1px;height:9px;background:rgba(255,255,255,.35)}
.timeline .playhead{position:absolute;top:1px;width:11px;height:11px;border-radius:50%;background:#e8e2d6;
  box-shadow:0 0 12px rgba(232,226,214,.9)}
.transport{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:rgba(232,226,214,.8)}
.transport .cmds{display:flex;gap:10px}
.transport button{background:none;border:1px solid rgba(255,255,255,.35);color:#e8e2d6;font-family:inherit;font-size:10.5px;letter-spacing:.2em;padding:7px 14px;cursor:pointer}
.transport button:hover{border-color:#fff}
.hide{opacity:0!important;pointer-events:none}
@media(max-width:640px){.strip .chapters{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.fog{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <div class="fog f1"></div><div class="fog f2"></div>
    <div class="horizon" id="horizon"></div>
    <div class="cast" id="cast">
      <div class="names" id="castNames"></div>
    </div>
    <div class="title" id="title">
      <div class="flare" id="flare"></div>
      <div>
        <div class="filmby" id="filmby">A film by Ilse Varga</div>
        <h1 id="titleH1">THE LONG MERIDIAN</h1>
        <div class="below" id="below">AUTUMN · MCMXCIX</div>
      </div>
    </div>
    <div class="credits" id="credits"></div>
    <div class="end" id="end">
      <div>
        <p>"The meridian does not end. It only turns back toward the sea."</p>
        <button class="replay" id="replay2">Replay</button>
      </div>
    </div>
    <canvas class="grain" id="grain"></canvas>
  </div>
</div>

<div class="strip" id="strip">
  <div class="chapters" id="chapters">
    <button class="chap" data-c="dark">Dark</button>
    <button class="chap" data-c="cast">Cast</button>
    <button class="chap" data-c="title">Title</button>
    <button class="chap" data-c="credits">Credits</button>
    <button class="chap" data-c="end">End</button>
  </div>
  <div class="timeline" id="timeline">
    <div class="rail"></div>
    <div class="progress" id="tProgress"></div>
    <div class="tick" style="left:7%"></div><div class="tick" style="left:33%"></div>
    <div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div><div class="tick" style="left:92%"></div>
    <div class="playhead" id="playhead"></div>
  </div>
  <div class="transport">
    <span id="timecode">00:00:00 / 00:01:12</span>
    <span class="cmds">
      <button id="playBtn">❚❚ Pause</button>
      <button id="replayBtn">Replay</button>
    </span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR=72;
  var T=RM?24:0,playing=!RM;
  var frameEl=document.getElementById("frame");
  var castNames=document.getElementById("castNames");
  var creditsEl=document.getElementById("credits");
  // build cast list
  var castDefs=[["starring","Maren Solheim"],["with","Adaeze Okonkwo"],["and","Tomasz Wierzbicki"],["as the Cartographer","Juno Castellanos"]];
  function showCast(at){
    castNames.innerHTML="";
    castDefs.forEach(function(c,i){
      var d=document.createElement("div");
      d.style.cssText="opacity:0;transform:translateY(8px);transition:opacity .9s ease "+(i*0.15)+"s";
      d.innerHTML='<div class="kicker">'+c[0]+'</div><div class="nm">'+c[1]+'</div>';
      castNames.appendChild(d);
      requestAnimationFrame(function(){d.style.opacity=1;d.style.transform="none"});
    });
  }
  // credits
  var credDefs=[
    ["Casting","L. Amundsen"],["Music","The Nordic Philharmonic"],["Costume Designer","R. Hjelt"],
    ["Production Designer","V. Siltanen"],["Editor","E. Torp"],["Director of Photography","N. Brand"],
    ["Executive Producers","M. Varga · S. Kivi"],["Produced by","A. Lindgren"],["Written by","I. Varga"],
    ["Directed by","I. Varga"]
  ];
  function buildCredits(){
    creditsEl.innerHTML="";
    credDefs.forEach(function(c){
      var d=document.createElement("div");
      d.className="cred";
      d.style.cssText="opacity:0;transition:opacity 1s ease";
      d.innerHTML='<div class="role">'+c[0]+'</div><div class="who">'+c[1]+'</div>';
      creditsEl.appendChild(d);
    });
    var cl=document.createElement("div");
    cl.className="closing";cl.textContent="A production of Meridian Pictures · Nordlys Film";
    cl.style.cssText="opacity:0;transition:opacity 1s ease";
    creditsEl.appendChild(cl);
  }
  // grain canvas
  var gc2=document.getElementById("grain"),c2=gc2.getContext("2d");
  function fitGrain(){
    var r=frameEl.getBoundingClientRect();
    gc2.width=r.width/3;gc2.height=r.height/3;
  }
  window.addEventListener("resize",fitGrain);fitGrain();
  function grain(){
    if(RM&&Math.random()<0.75)return;
    var img=c2.createImageData(gc2.width,gc2.height);
    for(var i=0;i<img.data.length;i+=4){
      var v=90+Math.random()*120;
      img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;
    }
    c2.putImageData(img,0,0);
  }
  // camera drift
  function cameraDrift(t){
    var p=frameEl;
    var sx=Math.sin(t*0.11)*6,sy=Math.cos(t*0.09)*4;
    var breath=1+Math.sin(t*0.07)*0.008;
    var fl=fog1.style.transform;
  }
  var fog1=document.querySelector(".fog.f1"),fog2=document.querySelector(".fog.f2");
  function layers(t){
    // per-layer drift magnitudes
    var sx=Math.sin(t*0.11)*5,sy=Math.cos(t*0.09)*3.5;
    var b=1+Math.sin(t*0.07)*0.008;
    ["f1","f2"].forEach(function(f,i){
      var el=document.querySelector("."+f);
      var m=(i+1)*1.6;
      el.style.transform="translate("+(sx*m)+"px,"+(sy*m)+"px) scale("+b+")";
    });
  }
  // chapter logic
  var phaseEls={};
  function resetScene(){
    document.getElementById("cast").style.opacity=0;
    document.getElementById("title").style.opacity=0;
    document.getElementById("credits").style.opacity=0;
    document.getElementById("end").style.opacity=0;
    var h=document.getElementById("horizon");h.style.cssText="opacity:0;transform:scaleX(0)";
    document.getElementById("flare").style.opacity=0;
    document.getElementById("titleH1").style.cssText="filter:blur(6px)";
    document.getElementById("titleH1").style.letterSpacing=".38em";
    document.getElementById("titleH1").style.backgroundPosition="300% 0";
    document.getElementById("title").style.transform="translateY(0)";
    document.getElementById("castNames").innerHTML="";
    castNames.dataset.built=0;
    creditsEl.dataset.built=0;
  }
  function render(t){
    // chapters
    resetScene();
    // cast 5-24
    if(t>=5&&t<24){
      var c=document.getElementById("cast");
      c.style.opacity=1;
      if(!castNames.dataset.built){showCast(0);castNames.dataset.built=1}
      // horizon scales in
      var hp=Math.min(1,(t-5)/6);
      document.getElementById("horizon").style.cssText="opacity:"+hp+";transform:scaleX("+hp+")";
      // cast fade in/out
      var fade=1;
      if(t<8)fade=(t-5)/3;
      if(t>21)fade=Math.max(0,1-(t-21)/3);
      c.style.opacity=fade;
      buildFixed();
    }else if(t>=24&&t<36){
      var ti=document.getElementById("title");
      ti.style.opacity=1;
      var tp=(t-24)/5;
      tp=Math.min(1,tp);
      tp=tp*tp*(3-2*tp);
      var h1=document.getElementById("titleH1");
      h1.style.cssText="filter:blur("+(6-6*tp)+"px)";
      h1.style.letterSpacing=(0.10+0.28*tp)+"em";
      h1.style.backgroundPosition=((1-tp)*300)+"% 0";
      // flare passes behind
      var fl=Math.sin((t-24)/5*Math.PI)* (t<30?1:Math.max(0,1-(t-30)/4));
      document.getElementById("flare").style.opacity=fl>0.05?fl:0;
      document.getElementById("flare").style.transform="translate("+((t-24)*12-30)+"vw,-50%) rotate(-4deg)";
      // film by / below
      var f=document.getElementById("filmby"),b2=document.getElementById("below");
      f.style.opacity=Math.min(1,Math.max(0,(t-25.5)/1.2));
      b2.style.opacity=Math.min(1,Math.max(0,(t-27)/1.2));
      ti.style.opacity=Math.min(1,Math.max(0,1-(t-33)/3));
    }else if(t>=36&&t<64){
      var cr=document.getElementById("credits");
      cr.style.opacity=1;
      if(!creditsEl.dataset.built){buildCredits();creditsEl.dataset.built=1}
      var cy=(t-36)/28*100;
      // roll credits
      Array.prototype.slice.call(creditsEl.children).forEach(function(el,i){
        el.style.translate="0 "+(-cy*0.55*(0.6+i*0.06))+"px";
        setTimeout(function(){el.style.opacity=1},200);
      });
      cr.style.transform="translateY("+(-cy*0.3)+"px)";
    }else if(t>=64){
      var en=document.getElementById("end");
      en.style.opacity=Math.min(1,(t-64)/1.4);
    }
    // camera drift
    layers(t);
  }
  function buildFixed(){}
  // timeline mapping
  var chapters=[[0,"dark"],[5,"cast"],[24,"title"],[36,"credits"],[64,"end"],[72,"dark"]];
  function chapterAt(t){
    for(var i=chapters.length-1;i>=0;i--){if(t>=chapters[i][0])return chapters[i][1]}
    return "dark";
  }
  function updateUI(){
    var ch=chapterAt(T);
    document.querySelectorAll(".chap").forEach(function(b){b.classList.toggle("on",b.dataset.c===ch)});
    var pct=T/DUR*100;
    document.getElementById("tProgress").style.width=pct+"%";
    document.getElementById("playhead").style.left="calc("+pct+"% - 5px)";
    var s=Math.floor(T);
    var tc=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    document.getElementById("timecode").textContent="00:"+tc+" / 00:01:12";
  }
  // main loop
  var last=performance.now();
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    if(playing){
      T+=dt;
      if(T>=DUR){T=DUR;playing=false;document.getElementById("playBtn").textContent="▶ Play"}
    }
    render(T);
    updateUI();
    grain();
    requestAnimationFrame(loop);
  }
  // controls
  var strip=document.getElementById("strip");
  function setTime(t){
    T=Math.max(0,Math.min(DUR,t));
    render(T);updateUI();
    if(T>=DUR){T=DUR-0.01;playing=false;document.getElementById("playBtn").textContent="▶ Play"}
  }
  document.querySelectorAll(".chap").forEach(function(b){
    b.addEventListener("click",function(){
      var map={dark:0,cast:10,title:29,credits:45,end:68};
      setTime(map[b.dataset.c]);
    });
  });
  var timeline=document.getElementById("timeline");
  timeline.addEventListener("pointerdown",function(e){
    var r=timeline.getBoundingClientRect();
    setTime((e.clientX-r.left)/r.width*DUR);
  });
  document.getElementById("playBtn").addEventListener("click",function(){
    if(T>=DUR-0.05){T=0}
    playing=!playing;
    this.textContent=playing?"❚❚ Pause":"▶ Play";
  });
  function replay(){
    T=0;playing=true;document.getElementById("playBtn").textContent="❚❚ Pause";
  }
  document.getElementById("replayBtn").addEventListener("click",replay);
  document.getElementById("replay2").addEventListener("click",replay);
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();document.getElementById("playBtn").click()}
    if(e.key==="r"||e.key==="R")replay();
    if(e.key==="ArrowLeft")setTime(T-2);
    if(e.key==="ArrowRight")setTime(T+2);
  });
  // start at T=0
  render(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
