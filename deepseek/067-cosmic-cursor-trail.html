<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardust — Cosmic Cursor Trail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;cursor:none;font-family:system-ui,sans-serif}
@media(max-width:640px){body{cursor:auto}}
canvas#sky2{position:fixed;inset:0;display:block;touch-action:none;cursor:none}
@media(max-width:640px){canvas#sky2{touch-action:none}}
/* ring cursor */
.ring{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;pointer-events:none;z-index:30;
  transform:translate(-50%,-50%);mix-blend-mode:difference;display:none}
.ring .r{position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.9);border-radius:50%}
.ring .c{position:absolute;inset:7px;border:1px dashed rgba(255,255,255,.7);border-radius:50%}
.ring.hot{width:64px;height:64px}
.ring.hot .r{border-style:dashed;animation:ringspin 1.2s linear infinite}
.ring.hot .c{display:none}
@keyframes ringspin{to{transform:rotate(360deg)}}
@media(max-width:640px){.ring{display:none}}
/* UI */
.title3{position:fixed;top:24px;left:26px;z-index:10;pointer-events:none;color:#e8e8f0}
.title3 h1{font-family:Georgia,'Iowan Old Style',Palatino,serif;font-weight:400;font-size:26px;letter-spacing:.02em}
.title3 p{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:rgba(232,232,240,.5);margin-top:5px}
.hint3{position:fixed;top:24px;right:26px;z-index:10;pointer-events:none;text-align:right;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:rgba(232,232,240,.55);line-height:1.8;transition:opacity 1.5s}
.toolbar{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;align-items:center;
  background:rgba(14,14,22,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);
  border-radius:99px;padding:9px 12px;box-shadow:0 18px 50px rgba(0,0,0,.5);flex-wrap:wrap;justify-content:center;max-width:96vw;
}
.tbtn2{
  display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:none;color:rgba(232,232,240,.75);
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 14px;border-radius:99px;cursor:pointer;transition:all .2s;
}
.tbtn2:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.tbtn2.on{background:#e8e8f0;color:#111}
.tbtn2 .swd{width:10px;height:10px;border-radius:50%}
.tbtn2 svg{width:14px;height:14px}
.sep{width:1px;height:24px;background:rgba(255,255,255,.15)}
@media(max-width:640px){
  .title3 p,.hint3{display:none}
  .tbtn2 .lbl{display:none}
}
</style>
</head>
<body>
<canvas id="sky2"></canvas>
<div class="ring" id="ring"><div class="r"></div><div class="c"></div></div>
<div class="title3">
  <h1>Stardust</h1>
  <p>cosmic cursor trail · press &amp; hold for a vortex</p>
</div>
<div class="hint3" id="hint3">1-4 brushes · hold = vortex<br>C clear · S save</div>

<div class="toolbar" id="toolbar">
  <button class="tbtn2 on" data-b="dust"><span class="swd" style="background:#9fd8ff"></span><span class="lbl">Dust</span></button>
  <button class="tbtn2" data-b="ribbons"><span class="swd" style="background:#ff9fe5"></span><span class="lbl">Ribbons</span></button>
  <button class="tbtn2" data-b="embers"><span class="swd" style="background:#ffb060"></span><span class="lbl">Embers</span></button>
  <button class="tbtn2" data-b="ink"><span class="swd" style="background:#e8e8f0"></span><span class="lbl">Ink</span></button>
  <span class="sep"></span>
  <button class="tbtn2" data-b="fadeS" id="fadeSlow"><svg viewBox="0 0 14 14"><line x1="1" y1="7" x2="13" y2="7" stroke="currentColor"/><line x1="2" y1="10" x2="12" y2="10" stroke="currentColor" stroke-width=".6"/></svg></button>
  <button class="tbtn2 on" id="fadeMid" data-b="fadeM"><svg viewBox="0 0 14 14"><line x1="1" y1="7" x2="13" y2="7" stroke="currentColor"/></svg></button>
  <button class="tbtn2" id="fadeFast" data-b="fadeF"><svg viewBox="0 0 14 14"><line x1="1" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="2"/></svg></button>
  <span class="sep"></span>
  <button class="tbtn2" id="clearBtn"><svg viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <button class="tbtn2" id="saveBtn"><svg viewBox="0 0 14 14"><path d="M7 1v6m0 0L4.5 4.5M7 7l2.5-2.5M1 11h12" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("sky2"),ctx=cv.getContext("2d");
  var W=0,H=0,DPR=1;
  var particles=[],comet=[];
  var brush="dust",fade=0.045;
  var mouse={x:W/2,y:H/2,active:false,px:-1,py:-1,vx:0,vy:0};
  var holdT=0,holding=false,releasedAt=0;
  var hue=0,time=0,idleT=0,ghostCurve=0;
  var ring=document.getElementById("ring");
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    // preserve painting
    var tmp=document.createElement("canvas");
    tmp.width=cv.width;tmp.height=cv.height;
    tmp.getContext("2d").drawImage(cv,0,0);
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(tmp,0,0,W,H);
  }
  window.addEventListener("resize",resize);
  function spawn(x,y,vx2,vy2){
    var p={x:x,y:y,vx:vx2||(Math.random()-0.5)*40,vy:vy2||(Math.random()-0.5)*40,
      life:0,max:0.6+Math.random()*0.7,
      size:brush==="ink"?6+Math.random()*16:brush==="embers"?1.4+Math.random()*3:(brush==="dust"?0.6+Math.random()*1.6:1+Math.random()*2.4),
      hueVar:(Math.random()-0.5)*18,ph:Math.random()*6};
    particles.push(p);
    if(particles.length>9000)particles.splice(0,particles.length-9000);
  }
  function spawnAlong(x0,y0,x1,y1){
    var dx=x1-x0,dy=y1-y0;
    var len=Math.hypot(dx,dy)||1;
    var steps=Math.min(40,Math.max(1,Math.floor(len/3)));
    for(var i=1;i<=steps;i++){
      var x=x0+dx*(i/steps),y=y0+dy*(i/steps);
      // radial kick + inherited velocity fraction
      var a=Math.random()*Math.PI*2,k=(Math.random()-0.5)*60;
      spawn(x,y,dx/len*6*(i/steps)*3+Math.cos(a)*k,dy/len*6*(i/steps)*3+Math.sin(a)*k);
    }
  }
  var cometPos={x:W/2,y:H/2},cometVX=0,cometVY=0,targetCX=W/2,targetCY=H/2;
  function step(dt){
    time+=dt;
    hue=(hue+14*dt)%360;
    // comet spring
    var k2=120,damp=0.82;
    cometVX+=(targetCX-cometPos.x)*k2*dt*0.1;cometVX*=1-Math.min(1,damp*dt*6);
    cometVY+=(targetCY-cometPos.y)*k2*dt*0.1;cometVY*=1-Math.min(1,damp*dt*6);
    cometPos.x+=cometVX*dt;cometPos.y+=cometVY*dt;
    comet.push({x:cometPos.x,y:cometPos.y});
    if(comet.length>28)comet.shift();
    // particles
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.life+=dt;
      // drag
      var drag=brush==="ink"?0.92:brush==="embers"?0.97:0.985;
      p.vx*=Math.pow(drag,dt*60);p.vy*=Math.pow(drag,dt*60);
      if(brush==="embers")p.vy-=30*dt*(0.5+Math.random()*0.5);
      if(brush==="dust"){p.vx+=Math.sin(time*2+p.ph)*8*dt;p.vy+=Math.cos(time*1.7+p.ph)*8*dt}
      // vortex
      if(holdT>0.2){
        var dx=p.x-mouse.x,dy=p.y-mouse.y;
        var d2=Math.hypot(dx,dy)||1;
        if(d2<260){
          var f=holdT/1.2* (1-d2/260)*80*dt*8;
          // tangential swirl (grows)
          var swirl=holdT*220*(1-d2/260)*dt*2;
          p.vx+=(-dy/d2)*swirl +(dx/d2)* -f*0.5;
          p.vy+=(dx/d2)*swirl +(dy/d2)* -f*0.5;
        }
      }
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.life>p.max)p.vx*=0.9,p.vy*=0.9;
      if((p.life>p.max&&brush!=="ink")||(p.life>p.max+3)){
        particles.splice(i,1);
      }
    }
    // ghost cursor
    idleT+=dt;
    if(mouse.active)idleT=0;
    if(idleT>2.6&&!RM){
      ghostCurve+=dt*0.55;
      var A=W*0.28,B=H*0.25;
      targetCX=W/2+Math.sin(ghostCurve*3+Math.PI/2)*A+Math.sin(ghostCurve*0.7)*30;
      targetCY=H/2+Math.sin(ghostCurve*2)*B+Math.cos(ghostCurve*0.5)*18;
      mouse.px=targetCX;mouse.py=targetCY;
      // spawn
      if(Math.random()<0.8)spawnAlong(targetCX-Math.cos(ghostCurve)*3,targetCY-Math.sin(ghostCurve)*3,targetCX,targetCY);
    }
  }
  function paint(){
    // fade
    ctx.globalCompositeOperation="source-over";
    var f=Math.min(1,fade+ (RM?Math.max(0,0.08-fade):0));
    ctx.fillStyle="rgba(0,0,0,"+f+")";
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    // particles
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var a=Math.max(0,1-p.life/p.max);
      var h=(hue+p.hueVar+360)%360;
      if(brush==="ribbons"){
        ctx.strokeStyle="hsla("+h+",85%,68%,"+(a*0.7)+")";
        ctx.lineWidth=Math.max(0.5,p.size*0.4);
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.035,p.y-p.vy*0.035);ctx.stroke();
        continue;
      }
      if(brush==="ink"){
        if(p.life<0.06){ctx.fillStyle="rgba(120,120,140,"+(0.08+a*0.06)+")"}
        else{ctx.fillStyle="rgba(160,160,170,"+Math.min(0.10,a*0.08)+")"}
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*(0.4+a),0,7);ctx.fill();
        continue;
      }
      // dust & embers with halo
      ctx.globalCompositeOperation="lighter";
      var r=p.size*(brush==="embers"?3:3.2);
      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
      g.addColorStop(0,"hsla("+h+",90%,68%,"+((a*0.5).toFixed(2))+")");
      g.addColorStop(1,"hsla("+h+",90%,68%,0)");
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
      if(brush==="embers"){
        ctx.fillStyle="hsla("+h+",95%,70%,"+(a*0.9)+")";
      }else{
        ctx.fillStyle="hsla("+h+",90%,72%,"+(a*0.85)+")";
      }
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.4,p.size*0.5),0,7);ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
    // comet head trail
    if(comet.length>2){
      ctx.globalCompositeOperation="lighter";
      for(var c=0;c<comet.length;c++){
        var q=comet[c];
        var a2=c/comet.length;
        var h2=(hue+180)%360;
        ctx.strokeStyle="hsla("+h2+",80%,70%,"+(a2*a2*0.8)+")";
        ctx.lineWidth=0.6+a2*3.2;
        if(c>0){ctx.beginPath();ctx.moveTo(comet[c-1].x,comet[c-1].y);ctx.lineTo(q.x,q.y);ctx.stroke()}
      }
      // white hot head
      var hg=ctx.createRadialGradient(cometPos.x,cometPos.y,0,cometPos.x,cometPos.y,18);
      hg.addColorStop(0,"rgba(255,255,255,.95)");
      hg.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=hg;
      ctx.beginPath();ctx.arc(cometPos.x,cometPos.y,18,0,7);ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
    // shockwave
    if(releasedAt){
      var rt=(performance.now()-releasedAt)/1000;
      if(rt<0.8){
        var rr=40+rt*320;
        ctx.strokeStyle="rgba(255,255,255,"+((1-rt/0.8)*0.5)+")";
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(mouse.x,mouse.y,rr,0,7);ctx.stroke();
      }else{releasedAt=0}
    }
  }
  function mainLoop(now){
    var dt=Math.min(0.033,(now-(window.__lt2||now))/1000);
    window.__lt2=now;
    step(dt);
    paint();
    if(holding){
      // seed fresh particles near pointer
      for(var i=0;i<4;i++)spawn(mouse.x+(Math.random()-0.5)*20,mouse.y+(Math.random()-0.5)*20);
      holdT=Math.min(1.2,holdT+dt);
      ring.classList.add("hot");
    }else{
      holdT=0;
      ring.classList.remove("hot");
    }
    requestAnimationFrame(mainLoop);
  }
  // pointers
  cv.addEventListener("pointermove",function(e){
    var r=cv.getBoundingClientRect();
    mouse.px=mouse.x;mouse.py=mouse.y;
    mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
    if(!mouse.active){mouse.active=true;mouse.px=mouse.x;mouse.py=mouse.y}
    mouse.vx=mouse.x-mouse.px;mouse.vy=mouse.y-mouse.py;
    targetCX=mouse.x;targetCY=mouse.y;
    var hint=document.getElementById("hint3");
    if(hint.style.opacity!=="0")hint.style.opacity=0;
    // spawn with interpolation
    if(mouse.px>=0&&!holding){
      spawnAlong(mouse.px,mouse.py,mouse.x,mouse.y);
    }
    // ring
    ring.style.left=mouse.x+"px";ring.style.top=mouse.y+"px";
    if(matchMedia("(pointer:fine)").matches)ring.style.display="block";
  },{passive:true});
  cv.addEventListener("pointerdown",function(e){
    holding=true;holdT=0;releasedAt=0;
  });
  window.addEventListener("pointerup",function(e){
    if(holding){
      holding=false;
      // outward impulse
      var imp=Math.min(900,holdT*700);
      for(var i=0;i<particles.length;i++){
        var dx=particles[i].x-mouse.x,dy=particles[i].y-mouse.y;
        var d=Math.hypot(dx,dy)||1;
        if(d<260){particles[i].vx+=dx/d*imp*0.12*(1-d/260);particles[i].vy+=dy/d*imp*0.12*(1-d/260)}
      }
      // new sparks
      for(var s2=0;s2<200;s2++){
        var a=Math.random()*Math.PI*2;
        var sp=(120+Math.random()*380)+holdT*300;
        spawn(mouse.x,mouse.y,Math.cos(a)*sp,Math.sin(a)*sp);
      }
      releasedAt=performance.now();
    }
  });
  window.addEventListener("pointerout",function(){ring.style.display="none"});
  // brushes
  var brushMap=[["dust","#9fd8ff"],["ribbons","#ff9fe5"],["embers","#ffb060"],["ink","#e8e8f0"]];
  document.querySelectorAll(".tbtn2[data-b]").forEach(function(b){
    b.addEventListener("click",function(){
      if(b.id&&b.id.startsWith("fade"))return;
      document.querySelectorAll(".tbtn2[data-b]").forEach(function(x){
        if(x.id&&x.id.startsWith("fade"))return;
        x.classList.remove("on");
      });
      b.classList.add("on");
      brush=b.dataset.b;
    });
  });
  function setFade(f,btn){
    fade=f;
    document.querySelectorAll("#fadeSlow,#fadeMid,#fadeFast").forEach(function(x){x.classList.remove("on")});
    btn.classList.add("on");
  }
  document.getElementById("fadeSlow").addEventListener("click",function(){setFade(0.012,this)});
  document.getElementById("fadeMid").addEventListener("click",function(){setFade(0.045,this)});
  document.getElementById("fadeFast").addEventListener("click",function(){setFade(0.14,this)});
  document.getElementById("clearBtn").addEventListener("click",function(){
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    particles=[];
  });
  document.getElementById("saveBtn").addEventListener("click",function(){
    var a=document.createElement("a");
    a.download="stardust-"+Date.now()+".png";
    a.href=cv.toDataURL();
    a.click();
  });
  window.addEventListener("keydown",function(e){
    var k=e.key.toLowerCase();
    if(k==="1")clickBrush("dust");
    if(k==="2")clickBrush("ribbons");
    if(k==="3")clickBrush("embers");
    if(k==="4")clickBrush("ink");
    if(k==="c")document.getElementById("clearBtn").click();
    if(k==="s")document.getElementById("saveBtn").click();
  });
  function clickBrush(name){
    var b=document.querySelector('.tbtn2[data-b="'+name+'"]');
    if(b)b.click();
  }
  if(RM){fade=Math.max(fade,0.08);setFade(0.08,document.getElementById("fadeMid"))}
  resize();
  // initial particles to avoid empty screen
  for(var i=0;i<260;i++){
    spawn(Math.random()*W,Math.random()*H,(Math.random()-0.5)*20,(Math.random()-0.5)*20);
  }
  targetCX=W/2;targetCY=H/2;cometPos={x:W/2,y:H/2};
  requestAnimationFrame(mainLoop);
})();
</script>
</body>
</html>
