<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation — Field study no. 006</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% 20%,#060b1f 60%,#03061a);
  color:#eef2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.wash{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(80% 40% at 50% 110%,rgba(66,79,160,.22),transparent 70%),
  radial-gradient(50% 35% at 8% 0%,rgba(120,90,200,.10),transparent 70%);
  z-index:1}
canvas{position:fixed;inset:0;z-index:2;display:block}
.ui{position:fixed;inset:0;pointer-events:none;z-index:3}
/* header */
.title{
  position:absolute;top:34px;left:40px;
  font-family:'Iowan Old Style',Palatino,Georgia,serif;font-weight:300;
  font-size:clamp(2.6rem,8vw,7.5rem);letter-spacing:.18em;color:#dbe2ff;
  text-shadow:0 0 26px rgba(169,180,255,.35);
}
.sub{
  position:absolute;top:calc(34px + clamp(3.6rem, 10.4vw, 9.4rem));left:44px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:rgba(219,226,255,.5);
}
.stamp{
  position:absolute;top:34px;right:40px;text-align:right;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.18em;color:rgba(219,226,255,.62);line-height:2;
}
.legend{
  position:absolute;left:40px;bottom:36px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(219,226,255,.55);display:flex;gap:26px;
}
.legend .li{display:flex;align-items:center;gap:10px}
.glyph{width:14px;height:14px;position:relative;flex:none}
.glyph.dot::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(169,180,255,.8)}
.glyph.line{height:6px;align-self:center}
.glyph.line::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(169,180,255,.8)}
.glyph.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(169,180,255,.85);box-shadow:0 0 8px rgba(169,180,255,.4),inset 0 0 8px rgba(169,180,255,.4)}
/* panel */
.panel{
  position:absolute;right:40px;bottom:36px;pointer-events:auto;
  background:rgba(6,11,31,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(236,239,255,.18);border-radius:4px;padding:20px 22px;width:250px;
}
.panel h4{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(236,239,255,.55);margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.row label{font-size:12px;color:rgba(236,239,255,.72)}
.range{--p:120px;width:100%;appearance:none;-webkit-appearance:none;height:1px;background:linear-gradient(90deg,#a9b4ff var(--p),rgba(236,239,255,.22) var(--p));outline:none;margin:12px 0 2px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(169,180,255,.9);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 10px rgba(169,180,255,.9)}
.range:hover::-webkit-slider-thumb{transform:scale(1.35)}
.val{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#a9b4ff}
.seg{display:flex;background:rgba(236,239,255,.06);border-radius:3px;position:relative;padding:3px}
.seg .pill{position:absolute;top:3px;bottom:3px;width:50%;border-radius:2px;background:rgba(169,180,255,.22);left:0;transition:left .45s ease-out;margin:0}
.seg .opt{flex:1;text-align:center;font-size:11px;padding:6px 0;color:rgba(236,239,255,.7);cursor:pointer;position:relative;z-index:1;border:none;background:none;letter-spacing:.14em;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace}
.seg .opt.active{color:#fff}
/* settle animation */
.settle{animation:settle 2.4s cubic-bezier(.22,1,.36,1) both}
.settle.d1{animation-delay:.15s}.settle.d2{animation-delay:.3s}.settle.d3{animation-delay:.45s}.settle.d4{animation-delay:.6s}.settle.d5{animation-delay:.75s}
@keyframes settle{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@media(max-width:640px){
  .title{top:24px;left:20px}
  .sub{left:24px}
  .stamp{top:24px;right:20px}
  .legend{display:none}
  .panel{left:0;right:0;bottom:0;width:auto;border-radius:4px 4px 0 0;padding:14px 18px}
}
@media(prefers-reduced-motion:reduce){
  .settle{animation:none}
}
</style>
</head>
<body>
<div class="wash" aria-hidden="true"></div>
<canvas id="cvs"></canvas>
<div class="ui">
  <h1 class="title settle">Constellation</h1>
  <p class="sub settle d1">Field study no. 006 · a slow gravity</p>
  <div class="stamp settle d2" id="stamp">PARTICLES —<br>THREADS —<br>FPS —</div>
  <div class="legend settle d3">
    <span class="li"><span class="glyph dot"></span>Particle</span>
    <span class="li"><span class="glyph line"></span>Thread</span>
    <span class="li"><span class="glyph ring"></span>Ripple</span>
  </div>
  <div class="panel settle d4" id="panel">
    <h4>Field controls</h4>
    <div class="row"><label>Connection</label><span class="val" id="connVal">120</span></div>
    <input type="range" class="range" id="connRange" min="40" max="260" value="120" aria-label="Connection distance">
    <div class="seg" id="seg" role="group" aria-label="Field behaviour">
      <div class="pill" id="pill"></div>
      <button class="opt active" data-mode="attract">Attract</button>
      <button class="opt" data-mode="repel">Repel</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("cvs"),ctx=cv.getContext("2d");
  var W=0,H=0,DPR=1,conn=120,repel=false;
  var ps=[],threads=0;
  var mouse={x:-9999,y:-9999,down:false,boost:0};
  var ripples=[];
  var tGlobal=0,last=performance.now(),fpsEl=0;
  var stampEl=document.getElementById("stamp");

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    var n=Math.max(90,Math.min(420,Math.round(W*H/5200)));
    ps=[];
    for(var i=0;i<n;i++)ps.push(newP());
  }
  function newP(){
    return {
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,
      r:0.8+Math.random()*1.7,
      ph:Math.random()*Math.PI*2,sp:0.5+Math.random()*1.4,
      tint:Math.random()<0.5
    };
  }
  window.addEventListener("resize",resize);

  // spatial hash
  var cellSize=0,hash=new Map();
  function buildHash(){
    cellSize=conn+16;
    hash.clear();
    ps.forEach(function(p,i){
      var k=((p.x/cellSize)|0)+","+((p.y/cellSize)|0);
      var a=hash.get(k);if(!a){a=[];hash.set(k,a)}
      a.push(i);
    });
  }

  // cursor
  cv.addEventListener("pointermove",function(e){
    mouse.x=e.clientX;mouse.y=e.clientY;mouse.boost=1;
  });
  cv.addEventListener("pointerdown",function(e){
    mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY;
    ripples.push({x:e.clientX,y:e.clientY,r:0,maxR:90+Math.random()*60,t:0,inner:true,outer:true});
    // birth 4 particles
    for(var i=0;i<4;i++){
      var a=Math.random()*Math.PI*2,spd=50+Math.random()*90;
      ps.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:0.8+Math.random()*1.5,ph:Math.random()*7,sp:0.6+Math.random()*1.2,tint:Math.random()<.5});
    }
    if(ps.length>430){ps.splice(0,ps.length-430)}
  });
  window.addEventListener("pointerup",function(){mouse.down=false;mouse.boost=0});
  cv.addEventListener("pointerleave",function(){mouse.x=-9999;mouse.y=-9999});

  // controls
  var range=document.getElementById("connRange"),connVal=document.getElementById("connVal");
  function setConn(v){conn=v;connVal.textContent=v;range.style.setProperty("--p",((v-40)/220*100)+"%")}
  range.addEventListener("input",function(){setConn(+this.value)});
  setConn(120);
  var seg=document.getElementById("seg"),pill=document.getElementById("pill");
  function setSeg(btn){
    seg.querySelectorAll(".opt").forEach(function(o){o.classList.toggle("active",o===btn)});
    repel=btn.dataset.mode==="repel";
    pill.style.left=(btn===seg.children[1]?"50%":"0");
  }
  seg.querySelectorAll(".opt").forEach(function(b){b.addEventListener("click",function(){setSeg(b)})});

  function fieldForce(p){
    var dx=mouse.x-p.x,dy=mouse.y-p.y;
    var d2=dx*dx+dy*dy;
    if(d2>220*220)return;
    var d=Math.sqrt(d2)||1;
    var f=(1-d/220);f=f*f;
    var dir=repel?1:-1;
    p.vx+=dx/d*f*46*(mouse.boost||0.5);
    p.vy+=dy/d*f*46*(mouse.boost||0.5);
  }
  // curl-like drift
  function drift(p,dt){
    var nx=Math.sin(p.y*0.006+tGlobal*0.3+p.ph)*Math.cos(p.x*0.005+tGlobal*0.22);
    p.vx+=nx*4*dt*10;
    p.vy+=Math.cos(p.x*0.006+tGlobal*0.26+p.ph*0.5)*(-3)*dt*10;
  }

  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);
    if(!RM)tGlobal+=dt;
    last=now;
    ctx.clearRect(0,0,W,H);
    if(!RM){
      ps.forEach(function(p){drift(p,dt);fieldForce(p);p.vx*=0.985;p.vy*=0.985;p.x+=p.vx*dt;p.y+=p.vy*dt});
      // wrap with 20px margin
      ps.forEach(function(p){
        var m=20;
        if(p.x<-m)p.x=W+m;if(p.x>W+m)p.x=-m;
        if(p.y<-m)p.y=H+m;if(p.y>H+m)p.y=-m;
      });
      // ripples
      ripples.forEach(function(r){
        r.t+=dt;r.r=r.maxR*(1-Math.pow(1-Math.min(1,r.t/1.6),3));
        // push particles
        for(var i=0;i<ps.length;i++){
          var p=ps[i];
          var dx=p.x-r.x,dy=p.y-r.y;
          var d=Math.sqrt(dx*dx+dy*dy)||1;
          var w=Math.abs(d-r.r);
          if(w<28){
            var f=(1-w/28)*90*dt*(1-r.t/1.6);
            p.vx+=dx/d*f;p.vy+=dy/d*f;
          }
        }
      });
      ripples=ripples.filter(function(r){return r.t<1.6});
      // cursor halo
      if(mouse.x>-5000){
        var hg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,60);
        hg.addColorStop(0,"rgba(169,180,255,0.16)");hg.addColorStop(1,"rgba(169,180,255,0)");
        ctx.fillStyle=hg;ctx.beginPath();ctx.arc(mouse.x,mouse.y,60,0,7);ctx.fill();
      }
    }
    buildHash();
    // threads
    var nThreads=0;
    ctx.lineWidth=0.8;
    var cell=conn+16;
    Object.keys(hash).forEach(function(k){
      var arr=hash.get(k);
      for(var a=0;a<arr.length;a++){
        var i1=arr[a],p1=ps[i1];
        var cx=k.split(",")[0],cy=k.split(",")[1];
        for(var ox=-1;ox<=1;ox++)for(var oy=-1;oy<=1;oy++){
          var key2=(+cx+ox)+","+(+cy+oy);
          var arr2=hash.get(key2);
          if(!arr2)continue;
          for(var b=0;b<arr2.length;b++){
            var i2=arr2[b];
            if(i2<=i1)continue;
            var p2=ps[i2];
            var dx=p1.x-p2.x,dy=p1.y-p2.y;
            var d2=dx*dx+dy*dy;
            if(d2<conn*conn){
              var d=Math.sqrt(d2);
              var a2=Math.pow(1-d/conn,2);
              ctx.strokeStyle="rgba(169,180,255,"+(a2*0.5).toFixed(3)+")";
              ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
              nThreads++;
            }
          }
        }
      }
    });
    // particles
    ps.forEach(function(p){
      var tw=0.55+0.45*Math.sin(tGlobal*p.sp+p.ph);
      if(RM)tw=1;
      var al=0.5+0.5*tw;
      var rad=p.r*7;
      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
      var col=p.tint?"169,180,255":"255,255,255";
      g.addColorStop(0,"rgba("+col+","+(0.5*al).toFixed(3)+")");
      g.addColorStop(1,"rgba("+col+",0)");
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(p.x,p.y,rad,0,7);ctx.fill();
      ctx.fillStyle="rgba("+col+","+(0.85*al).toFixed(3)+")";
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    });
    // ripple rings
    ripples.forEach(function(r){
      var al=1-r.t/1.6;
      ctx.strokeStyle="rgba(169,180,255,"+(al*0.8).toFixed(3)+")";
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,"+(al*0.36).toFixed(3)+")";
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(r.x,r.y,r.r*0.82,0,7);ctx.stroke();
    });
    // stats
    stampEl.innerHTML="PARTICLES "+ps.length+"<br>THREADS "+nThreads+"<br>FPS "+(RM?"—":Math.round(1000/Math.max(1,now-(fpsEl||now)) ));
    fpsEl=now;
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
