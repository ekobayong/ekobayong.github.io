<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose of Cells — Generative Stained Glass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#d7b36a}
html,body{height:100%;overflow:hidden}
body{
  display:grid;grid-template-rows:auto 1fr auto;height:100vh;
  background:
    radial-gradient(70% 60% at 50% 30%,rgba(90,70,40,.25),transparent 70%),#1d1a18;
  color:#e8ddc8;font-family:Georgia,'Iowan Old Style',Palatino,serif;
}
.wall{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 90px,rgba(23,20,15,.85) 90px 92px),
    repeating-linear-gradient(90deg,transparent 0 76px,rgba(23,20,15,.85) 76px 78px),
    linear-gradient(180deg,#3a3531,#2b2724 60%,#1d1a18);
  background-size:220px 92px,220px 92px,100% 100%;
}
.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(50% 40% at 50% 42%,transparent 30%,rgba(0,0,0,.75));}
header{position:relative;z-index:5;text-align:center;padding:26px 0 10px}
header h1{font-size:clamp(24px,3vw,40px);font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
header p{font-style:italic;font-size:14px;color:rgba(232,221,200,.6);margin-top:6px}
.stage{position:relative;z-index:5;display:flex;justify-content:center;align-items:center;min-height:0}
.winwrap{position:relative;height:100%;max-height:76vh;aspect-ratio:1/1.75;max-width:640px}
canvas#win{position:absolute;inset:0;width:100%;height:100%}
canvas#floor{position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:2;
  transform:rotateX(62deg) scaleY(-1);transform-origin:50% 0;filter:blur(22px) saturate(1.2);
  opacity:.55;mix-blend-mode:screen;pointer-events:none}
footer{position:relative;z-index:5;display:flex;justify-content:center;align-items:center;gap:18px;padding:20px;flex-wrap:wrap}
.btn{
  border:1px solid rgba(232,221,200,.35);background:rgba(255,255,255,.04);color:#e8ddc8;
  font-family:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;cursor:pointer;transition:all .3s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.palgrid{display:flex;gap:10px}
.palbtn{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.palbtn:hover{transform:scale(1.25)}
.palbtn.on{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--accent)}
.legend{font-size:12px;color:rgba(232,221,200,.5)}
@media(max-width:640px){body{grid-template-rows:auto 1fr auto}.stage .winwrap{max-height:60vh}}
@media(prefers-reduced-motion:reduce){.winwrap{transition:none}}
</style>
</head>
<body>
<div class="wall"></div>
<header>
  <h1>Rose of Cells</h1>
  <p>a generative stained-glass window · Voronoi excavations of the light</p>
</header>
<main class="stage">
  <div class="winwrap"><canvas id="win"></canvas></div>
</main>
<canvas id="floor"></canvas>
<footer>
  <div class="palgrid" id="palgrid"></div>
  <button class="btn" id="regenerate">Regenerate</button>
  <span class="legend">click inside the arch to add a pane · <b>R</b> regenerates</span>
</footer>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("win"),ctx=cv.getContext("2d");
  var floor=document.getElementById("floor"),fc=floor.getContext("2d");
  var W=0,H=0,DPR=1,archW=0,archH=0;
  var sites=[],cells=[];
  var palettes={
    chartres:{name:"Chartres",cols:["#1b2f8f","#233fa8","#1a4fb5","#2b64c8","#8f1626","#a91f30","#c0392b","#d8b25c","#e8d6a2","#4b2a7a","#f1f0e8","#1d6e6b"]},
    autumn:{name:"Autumn",cols:["#a33d13","#c25a1c","#d9931c","#e8b23a","#7a2a12","#6b6a1f","#8e8a2e","#4d2b1a","#e9c98a","#b3471a","#5b3a1e","#d97c2b"]},
    emerald:{name:"Emerald",cols:["#0b4a2a","#0f6b3c","#158a4a","#1e8f7a","#2ea78c","#116d5a","#3fbf9a","#0d3c3a","#0a2f26","#c9a44b","#e6d38a","#f0ead2"]}
  };
  var pal="chartres";
  var glass=document.createElement("canvas"),gc=glass.getContext("2d");
  var lightT=0,growing=null;
  // mulberry32
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    var wrap=cv.parentElement;
    W=wrap.clientWidth;H=wrap.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;
    glass.width=W*DPR;glass.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    gc.setTransform(DPR,0,0,DPR,0,0);
    archW=W;archH=H;
    scatter();
    renderGlass();
    fitFloor();
  }
  window.addEventListener("resize",function(){resize()});
  function inArch(x,y){
    // gothic arch: straight sides to springline 42%, then arcs radius==width centered at opposite springing points
    var spring=archH*0.42;
    if(y>spring)return x>=0&&x<=archW&&y<=archH;
    // arcs: centers at (0,spring) and (archW,spring), radius archW
    var d1=Math.hypot(x-0,y-spring),d2=Math.hypot(x-archW,y-spring);
    return d1<=archW&&d2<=archW;
  }
  function scatter(){
    var rng=mulberry(Math.floor(Math.random()*1e9)||7);
    var area=archW*archH;
    var n=Math.round(26+Math.min(44,area/26000));
    var minD=Math.min(archW,archH)*0.06;
    sites=[];
    var tries=0;
    while(sites.length<n&&tries<n*40){
      tries++;
      var x=rng()*archW,y=rng()*archH;
      if(!inArch(x,y))continue;
      var ok=true;
      for(var i=0;i<sites.length;i++){
        if(Math.hypot(sites[i].x-x,sites[i].y-y)<minD){ok=false;break}
      }
      if(ok)sites.push({x:x,y:y,c:palettes[pal].cols[Math.floor(rng()*palettes[pal].cols.length)]});
    }
    // ensure some get the wall color
    computeCells();
  }
  function computeCells(){
    cells=sites.map(function(si,idx){
      // clip bounding rect by bisectors
      var poly=[[0,0],[archW,0],[archW,archH],[0,archH]];
      for(var j=0;j<sites.length;j++){
        if(j===idx)continue;
        var s2=sites[j];
        poly=clip(poly,si,s2);
      }
      return{site:si,poly:poly};
    });
  }
  function clip(poly,a,b){
    // keep points closer to a than b (left of bisector)
    var out=[];
    var n=poly.length;
    for(var i=0;i<n;i++){
      var cur=poly[i],nxt=poly[(i+1)%n];
      var cIn=side(a,b,cur),nIn=side(a,b,nxt);
      if(cIn)out.push(cur);
      if(cIn!==nIn){
        var p=intersect(a,b,cur,nxt);
        if(p)out.push(p);
      }
    }
    return out;
  }
  function side(a,b,p){
    var dx=b.x-a.x,dy=b.y-a.y;
    // (b-a) x (p-a); positive => left (closer to a? we want points on a's side)
    return (b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x)<=0;
  }
  function intersect(a,b,p1,p2){
    var dx=b.x-a.x,dy=b.y-a.y;
    var px=p2.x-p1.x,py=p2.y-p1.y;
    var den=dx*py-dy*px;
    if(Math.abs(den)<1e-9)return null;
    var t=((p1.x-a.x)*dy-(p1.y-a.y)*dx)/den;
    return{x:p1.x+t*px,y:p1.y+t*py};
  }
  function drawPanePath(g,poly){
    if(poly.length<3)return;
    g.beginPath();
    g.moveTo(poly[0].x,poly[0].y);
    for(var i=1;i<poly.length;i++)g.lineTo(poly[i].x,poly[i].y);
    g.closePath();
  }
  function renderGlass(){
    var rng=mulberry(Math.floor(Math.random()*1e9)||11);
    gc.clearRect(0,0,archW,archH);
    gc.save();
    // clip to arch
    gc.beginPath();
    gc.moveTo(0,archH);gc.lineTo(0,archH*0.42);
    var spring=archH*0.42;
    gc.arc(0,spring,archW,Math.PI/2,0,true);
    gc.arc(archW,spring,archW,Math.PI,Math.PI/2,false);
    gc.lineTo(archW,archH);gc.closePath();
    gc.clip();
    // dark fill
    gc.fillStyle="#0d0b22";gc.fillRect(0,0,archW,archH);
    cells.forEach(function(c){
      if(c.poly.length<3)return;
      // centroid
      var cx2=0,cy2=0;
      c.poly.forEach(function(p){cx2+=p.x;cy2+=p.y});
      cx2/=c.poly.length;cy2/=c.poly.length;
      var g=gc.createRadialGradient(cx2-c.poly.length*2,cy2-c.poly.length*3,2,cx2,cy2,Math.max(archW,archH)*0.5);
      var base=c.site.c;
      g.addColorStop(0,lighten(base,0.32));
      g.addColorStop(0.7,base);
      g.addColorStop(1,darken(base,0.55));
      gc.fillStyle=g;
      drawPanePath(gc,c.poly);gc.fill();
      // grain streaks
      gc.save();drawPanePath(gc,c.poly);gc.clip();
      gc.globalAlpha=0.09;
      gc.strokeStyle="#fff";gc.lineWidth=1;
      var streaks=3+Math.floor(c.poly.length/3);
      for(var s=0;s<streaks;s++){
        var y0=c.site.y-polyH(c),yy=c.site.y+rng()*polyH(c);
        gc.beginPath();gc.moveTo(Math.max(0,c.site.x-rng()*80),y0);gc.lineTo(Math.min(archW,c.site.x+rng()*80),yy);gc.stroke();
      }
      gc.restore();gc.globalAlpha=1;
    });
    // lead lines
    gc.lineJoin="round";gc.lineWidth=6;
    gc.strokeStyle="#17130f";
    cells.forEach(function(c){if(c.poly.length>=3){drawPanePath(gc,c.poly);gc.stroke()}});
    // pale highlight
    gc.lineWidth=1.2;gc.strokeStyle="rgba(255,255,255,.22)";
    cells.forEach(function(c){if(c.poly.length>=3){drawPanePath(gc,c.poly);gc.stroke()}});
    // outer frame
    gc.lineWidth=8;gc.strokeStyle="#17130f";
    gc.stroke();
    gc.lineWidth=1.4;gc.strokeStyle="rgba(255,255,255,.3)";
    gc.stroke();
    gc.restore();
  }
  function polyH(c){var y2=0;c.poly.forEach(function(p){if(p.y>y2)y2=p.y});return y2}
  function lighten(hex,t){return shade(hex,t,1)}
  function darken(hex,t){return shade(hex,-t,1)}
  function shade(hex,t,over){
    var n=parseInt(hex.slice(1),16);
    var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*t*(over||1));g=Math.round(g+(255-g)*t*(over||1));b=Math.round(b+(255-b)*t*(over||1));
    return "rgb("+r+","+g+","+b+")";
  }
  // main loop with light sweep + floor reflection
  function loop(now){
    lightT=(lightT+ (RM?0:0.016))%(9);
    // floor copy
    fitFloor();
    requestAnimationFrame(loop);
  }
  function fitFloor(){
    var dpr=Math.min(2,devicePixelRatio||1);
    floor.width=Math.floor(window.innerWidth*dpr);
    floor.height=Math.floor(window.innerHeight*0.26*dpr);
    fc.setTransform(dpr,0,0,dpr,0,0);
    fc.globalAlpha=1;
    fc.clearRect(0,0,window.innerWidth,window.innerHeight*0.26);
    // draw glass scaled down + skewed
    var gw=window.innerWidth*1.6;
    fc.save();
    fc.translate(window.innerWidth*0.5,window.innerHeight*0.26*0.5);
    fc.scale(1,-1);
    fc.globalAlpha=0.55;
    fc.drawImage(glass,-gw/2,-window.innerHeight*0.3,gw,gw/1.75*1.5);
    fc.restore();
  }
  // composite main
  function renderMain(){
    ctx.clearRect(0,0,W,H);
    // out of arch: dark wall
    ctx.fillStyle="#191613";ctx.fillRect(0,0,W,H);
    // glass with light sweep
    ctx.drawImage(glass,0,0,W,H);
    // warm light sweep
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0,H);ctx.lineTo(0,H*0.42);
    ctx.arc(0,H*0.42,archW,Math.PI/2,0,true);
    ctx.arc(archW,H*0.42,archW,Math.PI,Math.PI/2,false);
    ctx.lineTo(archW,H);ctx.closePath();
    ctx.clip();
    var sweepX=(lightT/9)*W*1.6-W*0.3;
    var lg=ctx.createLinearGradient(sweepX-80,0,sweepX+80,H);
    lg.addColorStop(0,"rgba(255,250,235,0)");
    lg.addColorStop(.5,"rgba(255,250,235,"+(RM?0.05:0.26)+")");
    lg.addColorStop(1,"rgba(255,250,235,0)");
    ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="soft-light";
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // click adds site
  cv.addEventListener("pointerdown",function(e){
    var r=cv.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*archW,y=(e.clientY-r.top)/r.height*archH;
    if(!inArch(x,y))return;
    var col=palettes[pal].cols[Math.floor(Math.random()*palettes[pal].cols.length)];
    var site={x:x,y:y,c:col};
    var oldSites=sites.slice();
    sites.push(site);
    computeCells();
    // snapshot old glass
    var snap=document.createElement("canvas");
    snap.width=glass.width;snap.height=glass.height;
    snap.getContext("2d").drawImage(glass,0,0);
    renderGlass();
    // animate new pane growing from centroid
    var newCell=cells[cells.length-1];
    var cx2=0,cy2=0;
    newCell.poly.forEach(function(p){cx2+=p.x;cy2+=p.y});
    cx2/=newCell.poly.length;cy2/=newCell.poly.length;
    // draw new pane scaled from centroid
    var t0=performance.now();
    function grow(now){
      var t=Math.min(1,(now-t0)/620);
      t=1-Math.pow(1-t,3);
      gc.clearRect(0,0,archW,archH);
      gc.drawImage(snap,0,0);
      gc.save();
      gc.translate(cx2,cy2);gc.scale(0.04+0.96*t,0.04+0.96*t);gc.translate(-cx2,-cy2);
      drawPane(gc,newCell);
      gc.restore();
      if(t<1&&!RM)requestAnimationFrame(grow);else{renderGlass()}
    }
    if(RM)renderGlass();else requestAnimationFrame(grow);
  });
  function drawPane(g,c){
    if(c.poly.length<3)return;
    var cx2=0,cy2=0;c.poly.forEach(function(p){cx2+=p.x;cy2+=p.y});cx2/=c.poly.length;cy2/=c.poly.length;
    var grad=gc.createRadialGradient(cx2,cy2,2,cx2,cy2,archW*0.6);
    grad.addColorStop(0,lighten(c.site.c,.32));grad.addColorStop(.7,c.site.c);grad.addColorStop(1,darken(c.site.c,.55));
    drawPanePath(gc,c.poly);gc.fillStyle=grad;gc.fill();
    gc.lineWidth=6;gc.strokeStyle="#17130f";drawPanePath(gc,c.poly);gc.stroke();
  }
  // palettes ui
  var palgrid=document.getElementById("palgrid");
  Object.keys(palettes).forEach(function(k){
    var b=document.createElement("button");
    b.className="palbtn"+(k==="chartres"?" on":"");
    b.style.background="linear-gradient(135deg,"+palettes[k].cols.slice(0,4).join(",")+")";
    b.dataset.p=k;
    b.addEventListener("click",function(){
      document.querySelectorAll(".palbtn").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
      pal=k;
      // recolor existing panes without geometry change
      var rng=mulberry(Math.floor(Math.random()*1e9)||3);
      cells.forEach(function(c){c.site.c=palettes[pal].cols[Math.floor(rng()*palettes[pal].cols.length)]});
      renderGlass();
    });
    palgrid.appendChild(b);
  });
  document.getElementById("regenerate").addEventListener("click",scatter);
  window.addEventListener("keydown",function(e){if(e.key==="r"||e.key==="R")scatter()});
  resize();
  requestAnimationFrame(loop);
  setInterval(renderMain,50);
})();
</script>
</body>
</html>
