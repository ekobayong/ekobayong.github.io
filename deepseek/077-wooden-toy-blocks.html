<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wooden Alphabet Blocks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(180deg,#fff6e6,#fbf3e4 55%,#f2dfc4);
  min-height:100vh;overflow:hidden;color:#4a3323;
  font-family:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Hiragino Maru Gothic ProN','Helvetica Neue',system-ui,sans-serif;
  display:flex;flex-direction:column;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(115deg,rgba(255,236,200,.5),transparent 34%),linear-gradient(-120deg,transparent 66%,rgba(255,240,210,.35));mix-blend-mode:screen}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(90% 60% at 70% 0%,rgba(255,160,120,.18),transparent 60%)}
/* header */
header{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:22px 28px;flex-wrap:wrap}
.title{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:.01em}
.title i{display:inline-block;animation:wiggle 2.6s ease-in-out infinite}
.title i:nth-child(1){color:#e85c4e;animation-delay:0s}.title i:nth-child(2){color:#f6cf4a;animation-delay:.2s}
.title i:nth-child(3){color:#4a86d6;animation-delay:.4s}.title i:nth-child(4){color:#63ad70;animation-delay:.6s}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) scale(1.1)}60%{transform:rotate(8deg)}}
.spellrow{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.spellrow input{border:3px solid #4a3323;background:#fff8e8;color:#4a3323;font-family:inherit;font-weight:700;
  font-size:15px;padding:11px 16px;border-radius:10px;outline:none;width:190px;text-transform:uppercase}
.spellrow input:focus{box-shadow:0 0 0 3px rgba(74,51,35,.2)}
.hbtn{
  background:#fff8e8;border:3px solid #4a3323;color:#4a3323;font-family:inherit;font-weight:800;font-size:13px;
  padding:10px 16px;border-radius:10px;cursor:pointer;position:relative;
  box-shadow:4px 4px 0 #4a3323;transition:all .12s;white-space:nowrap;
}
.hbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #4a3323}
.hbtn.coral{background:#e85c4e;color:#fff}
.hbtn.teal{background:#4a86d6;color:#fff}
/* playfield */
.play{position:relative;z-index:3;flex:1;overflow:hidden}
.rug{
  position:absolute;left:0;right:0;bottom:78px;height:150px;
  background:linear-gradient(180deg,#d9a98a,#c48a6a);
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.05) 22px 24px);
  border-top:3px dashed rgba(255,255,255,.7);border-bottom:3px dashed rgba(255,255,255,.7);
}
.desk{
  position:absolute;left:0;right:0;bottom:0;height:84px;
  background:linear-gradient(180deg,#c88b52 0 12px,#a8703f 12px,#7a4b26);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.07) 9px 10px),
  linear-gradient(180deg,#c88b52 0 12px,#a8703f 12px,#7a4b26);
  box-shadow:inset 0 3px 6px rgba(255,255,255,.3)}
#blocks{position:absolute;inset:0;z-index:4}
/* block */
.block{position:absolute;width:90px;height:90px;transform-style:preserve-3d;cursor:grab;will-change:transform;transition:transform .1s linear}
.block.drag{cursor:grabbing;z-index:50}
.block .f{position:absolute;width:90px;height:90px;background:linear-gradient(135deg,#ecc48d,#d9a86c);
  background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(200,160,100,.14) 7px 8px);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),inset 2px 2px 5px rgba(255,255,255,.25);border-radius:4px}
.block .faces .front{display:grid;place-items:center}
.block .faces .front .paint{
  width:64px;height:64px;border-radius:8px;display:grid;place-items:center;position:relative;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  clip-path:polygon(0 0,100% 0,100% 84%,86% 100%,0 100%);
}
.block .faces .front .paint::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.14);right:7px;top:9px}
.block .faces .front .paint::before{content:"";position:absolute;width:26px;height:14px;background:rgba(0,0,0,.07);left:9px;bottom:8px;border-radius:40%}
.block .face{position:absolute;width:90px;height:90px;background:linear-gradient(135deg,#e9c189,#d3a468);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.block .ltr{font-size:52px;font-weight:900;color:#fff8e8;text-shadow:0 3px 0 rgba(120,60,20,.35);letter-spacing:.02em}
@media(max-width:680px){.block{width:60px;height:60px;transform:scale(.66)}.spellrow input{width:120px}}
@media(prefers-reduced-motion:reduce){.title i{animation:none}}
</style>
</head>
<body>
<header>
  <div class="title">Wooden<span>&nbsp;</span><i>Alphabet</i> <i>Blocks</i></div>
  <div class="spellrow">
    <input id="spellIn" placeholder="spell a word" maxlength="12" autocomplete="off">
    <button class="hbtn coral" id="spellBtn">Spell it</button>
    <button class="hbtn" id="shakeBtn">Shake table <kbd style="background:#4a3323;color:#fff8e8;border-radius:5px;padding:2px 6px;font-size:11px">space</kbd></button>
    <button class="hbtn" id="addBtn">+ Block</button>
    <button class="hbtn teal" id="tidyBtn">Tidy up</button>
  </div>
</header>

<div class="play" id="play">
  <div class="rug"></div>
  <div class="desk"></div>
  <div id="blocks"></div>
</div>
<div class="toast" id="toast" style="position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#4a3323;color:#fff8e8;
  font-weight:700;font-size:14px;padding:12px 24px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none">ok</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var play=document.getElementById("play"),blocksEl=document.getElementById("blocks");
  var palette=[["#e85c4e","#c33b30"],["#4a86d6","#2a5fa8"],["#f6cf4a","#e0ad1a"],["#63ad70","#3f8a4d"]];
  var blocks=[];
  var DESK_H=84,INIT_H=200;
  function rand(n){return Math.random()*n}
  function newBlock(letter,x,y){
    return{x:x||rand(play.clientWidth-90),y:y||rand(play.clientHeight-INIT_H-120)+80,
      vx:(rand(2)-1)*180,vy:0,w:90,h:90,rot:rand(60)-30,
      vr:(rand(2)-1)*140,letter:letter||"A",col:palette[Math.floor(rand(palette.length))]};
  }
  function buildBlockDOM(bl){
    var d=document.createElement("div");
    d.className="block";
    var ci=blocks.indexOf(bl);
    d.dataset.i=ci;
    var c1=bl.col[0],c2=bl.col[1];
    d.innerHTML='<div class="faces" style="transform-style:preserve-3d;position:absolute;inset:0;transform:rotateX(14deg) rotateY('+bl.rot+'deg)">'+
      '<div class="face" style="position:absolute;inset:0;transform:translateZ(18px)"></div>'+
      '<div class="face" style="position:absolute;inset:0;transform:rotateY(90deg) translateZ(18px);width:36px;left:-18px"></div>'+
      '<div class="face" style="position:absolute;inset:0;transform:rotateY(-90deg) translateZ(18px);width:36px;right:-18px;left:auto"></div>'+
      '<div class="face" style="position:absolute;inset:0;transform:translateZ(-18px);filter:brightness(.82)"></div>'+
      '<div class="face" style="position:absolute;inset:0;transform:rotateX(90deg) translateZ(18px);height:36px;top:-18px;filter:brightness(1.1)"></div>'+
      '<div class="face" style="position:absolute;inset:0;transform:rotateX(-90deg) translateZ(18px);height:36px;bottom:-18px;left:0;filter:brightness(.9)"></div>'+
      '<div class="face front" style="backface-visibility:hidden"><div class="paint" style="--c1:'+c1+';--c2:'+c2+'"><span class="ltr">'+bl.letter+'</span></div></div>'+
      '</div>';
    d.style.left=bl.x+"px";d.style.top=bl.y+"px";
    // soft drop shadow
    d.style.filter="drop-shadow(4px 6px 4px rgba(90,60,30,.28))";
    return d;
  }
  var doms=[];
  function addBlock(letter,x,y){
    var bl=newBlock(letter,x,y);
    blocks.push(bl);
    var d=buildBlockDOM(bl);
    blocksEl.appendChild(d);
    doms.push(d);
    return bl;
  }
  function spawnWord(w){
    var xs=Math.max(60,play.clientWidth/2-w.length*70/2);
    for(var i=0;i<w.length;i++){
      var bl=addBlock(w[i],xs+i*66,-60-i*44);
      bl.landing=true;
    }
    toast(w+" — in the air!");
  }
  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg;t.style.opacity=1;
    clearTimeout(t._tm);t._tm=setTimeout(function(){t.style.opacity=0},1500);
  }
  // physics
  var G=2200,rest=0.32,f=0.935;
  function step(dt){
    var groundY=play.clientHeight-DESK_H-90;
    for(var i=0;i<blocks.length;i++){
      var b=blocks[i];
      if(b.held)continue;
      b.vy+=G*dt;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.rot+=b.vr*dt;
      // walls
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)*rest}
      if(b.x>play.clientWidth-90){b.x=play.clientWidth-90;b.vx=-Math.abs(b.vx)*rest}
      // floor
      var g2=groundY;
      if(b.y>g2){
        b.y=g2;b.vy=-Math.abs(b.vy)*rest;b.vx*=f;b.vr*=0.8;
        if(Math.abs(b.vy)<40){b.vy=0}
      }
      if(b.y<60&&b.vy<0&&b.spawnBounce===undefined){
        b.spawnBounce=true;
      }
      // block-block AABB
      for(var j=0;j<blocks.length;j++){
        if(i===j)continue;
        var o=blocks[j];
        if(o.held)continue;
        var ox=b.x<b.x?0:0;
        if(b.x<o.x+90&&b.x+90>o.x&&b.y<o.y+90&&b.y+90>o.y){
          // separate along smaller overlap
          var overlapX=Math.min(b.x+90-o.x,o.x+90-b.x);
          var overlapY=Math.min(b.y+90-o.y,o.y+90-b.y);
          if(overlapX<overlapY){
            var dir=b.x<o.x?-1:1;
            b.vx=dir*Math.abs(b.vx)*0.4+(rand(2)-1)*20;
            b.x+=dir*overlapX;
            if(dir<0&&b.x<o.x-90)b.x=o.x-90;
            if(dir>0&&b.x>o.x+90)b.x=Math.min(play.clientWidth-90,o.x+90);
          }else{
            var dir2=b.y<o.y?-1:1;
            b.y+=dir2*overlapY;
            if(dir2<0)b.vy=Math.max(b.vy,0);
            else b.vy=Math.min(b.vy,0);
          }
        }
      }
    }
    syncDOM();
  }
  function syncDOM(){
    for(var i=0;i<blocks.length;i++){
      var d=doms[i];
      if(!d)continue;
      d.style.left=blocks[i].x+"px";
      d.style.top=blocks[i].y+"px";
      // tilt: restore upright spring
      var targetRot=0;
      blocks[i].rot+=(targetRot-blocks[i].rot)*0.05;
      var faces=d.querySelector(".faces");
      if(faces)faces.style.transform="rotateX(14deg) rotateY("+blocks[i].rot+"deg)";
    }
  }
  // pointer
  var held=null,dragOff={x:0,y:0};
  blocksEl.addEventListener("pointerdown",function(e){
    var t=e.target.closest(".block");
    if(!t)return;
    var i=+t.dataset.i;
    var b=blocks[i];
    var r=t.getBoundingClientRect();
    var pr=play.getBoundingClientRect();
    held=b;b.held=true;b.dragX=0;b.dragY=0;
    b.x=e.clientX-pr.left-45;b.y=e.clientY-pr.top-45;
    t.classList.add("drag");
    blocksEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  blocksEl.addEventListener("pointermove",function(e){
    if(!held)return;
    var pr=play.getBoundingClientRect();
    var px=e.clientX-pr.left-45,py=e.clientY-pr.top-45;
    held.dragX=px-held.x;held.dragY=py-held.y;
    held.x=px;held.y=py;
  });
  window.addEventListener("pointerup",function(){
    if(held){
      held.vx=held.dragX*6;held.vy=held.dragY*6;
      held.vx=Math.max(-600,Math.min(600,held.vx));
      held.vy=Math.max(-750,Math.min(550,held.vy));
      held.held=false;
      var d=doms[blocks.indexOf(held)];
      if(d)d.classList.remove("drag");
      held=null;
    }
  });
  // controls
  var spellIn=document.getElementById("spellIn");
  function doSpell(){
    var w=spellIn.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,12);
    if(!w){toast("type a word first");return}
    spellIn.value="";
    spawnWord(w);
  }
  document.getElementById("spellBtn").addEventListener("click",doSpell);
  spellIn.addEventListener("keydown",function(e){
    if(e.key==="Enter")doSpell();
  });
  var shaking=false;
  function shake(){
    if(shaking)return;
    shaking=true;
    play.animate([{transform:"translateX(0)"},{transform:"translateX(-7px)"},{transform:"translateX(6px)"},{transform:"translateX(-4px)"},{transform:"translateX(0)"}],
      {duration:RM?0:420,easing:"ease-in-out"});
    blocks.forEach(function(b){
      if(b.held)return;
      b.vy=-200-rand(300);
      b.vx=(rand(2)-1)*380;
      b.vr=(rand(2)-1)*300;
    });
    toast("the table says: hold on");
    setTimeout(function(){shaking=false},RM?0:500);
  }
  document.getElementById("shakeBtn").addEventListener("click",shake);
  window.addEventListener("keydown",function(e){
    if(e.code==="Space"){e.preventDefault();shake()}
  });
  document.getElementById("addBtn").addEventListener("click",function(){
    var letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    addBlock(letters[Math.floor(rand(26))],rand(play.clientWidth-90),-120);
    toast("+ one block");
  });
  document.getElementById("tidyBtn").addEventListener("click",function(){
    blocks.forEach(function(b){
      var tm=doms[blocks.indexOf(b)];
      if(tm){tm.style.transition="opacity .6s";tm.style.opacity=0}
    });
    setTimeout(function(){
      blocks=[];doms.forEach(function(d){d.remove()});doms=[];toast("all tidy");
    },RM?0:600);
  });
  // gravity loop
  var seedLetters="STACK";
  seedLetters.split("").forEach(function(ch,i){
    addBlock(ch, 120+i*64+rand(10), 200-Math.min(0,i*8)+rand(20));
  });
  var last=performance.now();
  function loop(now){
    var dt=Math.min(0.033,(now-last)/1000);last=now;
    step(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
