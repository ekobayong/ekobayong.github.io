<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley of Paper — A Cut-Paper Dusk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sky1:#3b2a5c;--sky2:#c9698a;--sky3:#f7b26a;
  --sun:#ffd28a;--cloud:#f7d5c4;
  --s1:#8b6a9c;--s2:#6a4f83;--s3:#4f3a6b;--s4:#3a2a54;--s5:#2b1f44;--s6:#1c1533;--s7:#130f26;
  --stars:0;
  --sun-y:0px;--moon-y:0px;--win:rgba(255,200,110,0.15);
  --mx:0px;--my:0px;
}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));
  font-family:ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  transition:background .6s ease;
  cursor:default;
}
.scene{position:fixed;inset:-6%;overflow:hidden}
.scene svg{position:absolute;inset:-6%;width:112%;height:112%;transform:translate(var(--mx),var(--my))}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity .6s;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.paper{filter:drop-shadow(0 10px 8px rgba(20,10,40,.35))}
.paper.near{filter:drop-shadow(0 18px 14px rgba(20,10,40,.45))}
/* UI */
.label{
  position:fixed;top:26px;left:26px;z-index:20;background:#f6ead6;color:#3b2a2a;
  padding:18px 24px 16px;border-radius:6px;transform:rotate(-1.2deg);
  box-shadow:0 12px 30px rgba(10,5,20,.4);transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  max-width:min(86vw,430px);
}
.label:hover{transform:rotate(0) translateY(-2px)}
.label::before{content:"";position:absolute;top:-10px;left:14px;right:14px;height:22px;background:rgba(246,234,214,.45);transform:rotate(-2deg)}
.label h1{font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:700;line-height:1.1}
.label p{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(59,42,42,.65);margin-top:6px}
.panel{
  position:fixed;bottom:22px;right:22px;z-index:20;background:#f6ead6;color:#3b2a2a;
  border-radius:6px;padding:18px 20px 16px;transform:rotate(.8deg);
  box-shadow:0 12px 30px rgba(10,5,20,.4);width:min(340px,88vw);
}
.panel h4{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(59,42,42,.6);margin-bottom:10px;display:flex;justify-content:space-between}
.clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
.slider{--p:55%;width:100%;appearance:none;-webkit-appearance:none;height:10px;border-radius:99px;outline:none;
  background:linear-gradient(90deg,#ffd28a 0%,#e8897a 30%,#b47aa0 55%,#7d6ba8 75%,#2c2f5e 100%);margin:6px 0 10px;border:1px solid rgba(59,42,42,.25)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#f6ead6;border:2.5px solid #3b2a2a;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 12px rgba(10,5,20,.35)}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#f6ead6;border:2.5px solid #3b2a2a;cursor:pointer}
.slider:hover::-webkit-slider-thumb{transform:scale(1.2)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(59,42,42,.55)}
.hint{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(59,42,42,.45);margin-top:9px}
.tiltpill{display:none}
body.touched .tiltpill{display:block;position:fixed;bottom:110px;left:16px;z-index:25;background:#f6ead6;color:#3b2a2a;border:none;padding:12px 18px;border-radius:99px;font-family:inherit;font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(10,5,20,.4)}
@media(max-width:640px){
  .panel{left:0;right:0;bottom:0;width:auto;transform:none;border-radius:10px 10px 0 0}
  .label p{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
  .star{animation:none}
  .label,.panel{transition:none}
}
</style>
</head>
<body class="scene-body">
<div class="scene" id="scene">
  <div class="stars" id="stars"></div>
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <g id="pine">
        <path d="M0 0 L14 -46 L28 0 Z" fill="#241b33"/>
        <rect x="11" y="0" width="6" height="10" fill="#3a2a10"/>
      </g>
      <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <!-- sun -->
    <g id="sunG" transform="translate(0,var(--sun-y))">
      <circle cx="330" cy="210" r="70" fill="var(--sun)" filter="brightness(1.1)"/>
      <circle cx="330" cy="210" r="150" fill="var(--sun)" opacity=".28" filter="blur(22px)"/>
    </g>
    <!-- moon -->
    <g id="moonG" transform="translate(0,var(--moon-y))" opacity="0">
      <circle cx="1180" cy="170" r="46" fill="#e8dfc8"/>
      <circle cx="1168" cy="160" r="40" fill="none" stroke="#d8cfb4" stroke-width="2"/>
      <circle cx="1192" cy="182" r="9" fill="#d0c8ac" opacity=".7"/>
      <circle cx="1170" cy="188" r="6" fill="#d0c8ac" opacity=".6"/>
    </g>
    <!-- clouds -->
    <g id="clouds" fill="var(--cloud)" filter="url(#soft)">
      <path class="cl" d="M200 300 C260 258 330 258 360 296 C410 284 470 300 468 336 C440 352 200 352 176 334 C160 318 170 306 200 300 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;180 0;180 0;0 0;0 0" dur="170s" repeatCount="indefinite"/>
      </path>
      <path class="cl" d="M820 240 C880 200 950 200 980 236 C1030 224 1090 240 1088 276 C1060 292 820 292 796 274 C780 258 790 246 820 240 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-160 0;-160 0;0 0" dur="140s" repeatCount="indefinite"/>
      </path>
      <path class="cl" d="M1330 330 C1380 300 1450 300 1476 328 C1510 320 1560 334 1558 362 C1536 374 1330 374 1312 358 C1300 346 1306 338 1330 330 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-120 0;-120 0;0 0;0 0" dur="190s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- far mountains -->
    <path class="paper" d="M0 560 L160 430 L320 545 L430 415 L560 540 L700 400 L830 545 L950 420 L1090 550 L1230 410 L1370 545 L1480 440 L1600 545 L1600 900 L0 900 Z" fill="var(--s1)"/>
    <!-- mid mountains -->
    <path class="paper" d="M0 620 L200 470 L380 610 L560 450 L760 615 L950 470 L1140 610 L1330 455 L1480 600 L1600 490 L1600 900 L0 900 Z" fill="var(--s2)"/>
    <!-- rolling hills with pines -->
    <path class="paper" d="M0 660 C200 590 380 680 560 640 C760 590 940 680 1140 645 C1320 615 1460 660 1600 630 L1600 900 L0 900 Z" fill="var(--s3)"/>
    <g transform="translate(120,620)"><use href="#pine" transform="scale(1.1)"/></g>
    <g transform="translate(300,640)"><use href="#pine"/></g>
    <g transform="translate(880,625)"><use href="#pine" transform="scale(1.3)"/></g>
    <g transform="translate(1060,645)"><use href="#pine"/></g>
    <!-- nearer hills with swaying pines -->
    <path class="paper" d="M0 700 C220 640 420 720 640 690 C860 655 1080 725 1280 690 C1420 668 1520 700 1600 680 L1600 900 L0 900 Z" fill="var(--s4)"/>
    <g class="sway" transform="translate(420,690)">
      <use href="#pine" transform="scale(1.7)"/>
      <animateTransform attributeName="transform" type="rotate" values="-0.8 14 0;0.8 14 0;-0.8 14 0" dur="6s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g class="sway" transform="translate(1140,690)">
      <use href="#pine" transform="scale(1.5)"/>
      <animateTransform attributeName="transform" type="rotate" values="-0.8 14 0;0.8 14 0;-0.8 14 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </g>
    <!-- front ridge with cabin -->
    <path class="paper near" d="M0 750 C180 700 360 760 560 740 C760 715 960 765 1160 740 C1340 720 1500 745 1600 730 L1600 900 L0 900 Z" fill="var(--s5)"/>
    <g transform="translate(620,655)">
      <rect x="0" y="60" width="120" height="70" fill="#2c2040"/>
      <path d="M-12 60 L60 8 L132 60 Z" fill="#372a50"/>
      <rect x="96" y="18" width="14" height="34" fill="#2c2040"/>
      <rect x="18" y="84" width="26" height="26" fill="var(--win)"/>
      <rect x="70" y="84" width="26" height="26" fill="var(--win)"/>
      <rect x="44" y="92" width="26" height="38" fill="#241b33" rx="2"/>
    </g>
    <g transform="translate(880,720)"><use href="#pine" transform="scale(2)"/></g>
    <g transform="translate(180,738)"><use href="#pine" transform="scale(1.8)"/></g>
    <!-- foreground ground + deer -->
    <path class="paper near" d="M0 800 C200 760 400 800 600 790 C800 778 1000 802 1200 790 C1380 780 1500 796 1600 784 L1600 900 L0 900 Z" fill="var(--s6)"/>
    <path class="paper near" d="M0 840 C300 808 700 830 1100 815 C1330 806 1480 822 1600 812 L1600 900 L0 900 Z" fill="var(--s7)"/>
    <g transform="translate(820,745)" class="deer">
      <ellipse cx="0" cy="34" rx="34" ry="16" fill="#0f0c1c"/>
      <ellipse cx="-26" cy="10" rx="8" ry="16" fill="#0f0c1c" transform="rotate(18 -26 10)"/>
      <circle cx="-26" cy="-8" r="7" fill="#0f0c1c"/>
      <path d="M-30 -14 l-8 -10 M-30 -12 l4 -12 M-24 -14 l10 -12 M-22 -12 l16 -8" stroke="#0f0c1c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-6 40 l-2 12 M10 40 l2 12 M10 40 l6 -3 l6 14 M-6 40 l-4 -4 l-6 12" stroke="#0f0c1c" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="38" rx="5" ry="3" fill="#0f0c1c"/>
    </g>
    <g transform="translate(1520,805)" class="deer2"><use href="#pine" transform="translate(-30,0) scale(2.3)"/></g>
    <g transform="translate(40,800)" class="deer3"><use href="#pine" transform="scale(2.2)"/></g>
  </svg>
</div>
<button class="tiltpill" id="tiltBtn" style="display:none">Enable tilt parallax</button>

<div class="label" id="label">
  <h1>Valley of Paper</h1>
  <p>A cut-paper dusk · move to look around</p>
</div>

<div class="panel">
  <h4><span>Time of day</span><span class="clock" id="clock">20:04</span></h4>
  <input type="range" class="slider" id="timeSlider" min="0" max="1000" value="380" aria-label="Time of day">
  <div class="ticks"><span>Golden dusk</span><span>Twilight</span><span>Blue night</span></div>
  <p class="hint">move to look around · drag to pan</p>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root=document.documentElement;
  var slider=document.getElementById("timeSlider");
  var clock=document.getElementById("clock");
  // dusk/night colour pairs
  var D={
    sky1:["#3b2a5c","#050a1e"],sky2:["#c9698a","#0f1c44"],sky3:["#f7b26a","#24356a"],
    sun:["#ffd28a","#ff9a5a"],cloud:["#f7d5c4","#3a4a7a"],
    s1:["#8b6a9c","#2b3a6b"],s2:["#6a4f83","#1f2c55"],s3:["#4f3a6b","#182243"],
    s4:["#3a2a54","#111935"],s5:["#2b1f44","#0c122a"],s6:["#1c1533","#080c1f"],s7:["#130f26","#050815"]
  };
  function lerpHex(a,b,t){
    var pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
    var ar=(pa>>16)&255,ag=(pa>>8)&255,ab=pa&255;
    var br=(pb>>16)&255,bg=(pb>>8)&255,bb=pb&255;
    var r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);
    return "#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }
  function smooth(t){return t*t*(3-2*t)}
  function apply(v){
    var t=smooth(Math.min(1,Math.max(0,v/1000)));
    Object.keys(D).forEach(function(k){
      root.style.setProperty("--"+k,lerpHex(D[k][0],D[k][1],t));
    });
    // stars fade in 35-85%
    var st=Math.max(0,Math.min(1,(v-350)/500));
    root.style.setProperty("--stars",st);
    // sun descends 620px, moon rises 700px
    root.style.setProperty("--sun-y",(-t*620)+"px");
    root.style.setProperty("--moon-y",(t*700)+"px");
    // moon opacity
    document.getElementById("moonG").setAttribute("opacity",Math.max(0,t*1.15-0.15));
    // window glow warms
    root.style.setProperty("--win","rgba(255,160,70,"+(0.15+t*0.85)+")");
    // clock 18:40 -> 23:59
    var mins=1120+v*0.319;
    var h=Math.floor(mins/60),m=Math.floor(mins%60);
    clock.textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  }
  slider.addEventListener("input",function(){apply(+this.value)});
  apply(380);

  // stars
  var starsEl=document.getElementById("stars");
  for(var i=0;i<140;i++){
    var s=document.createElement("div");
    s.className="star";
    s.style.left=(Math.random()*100)+"%";
    s.style.top=(Math.random()*45)+"%";
    s.style.animationDelay=(-Math.random()*3)+"s";
    s.style.animationDuration=(2+Math.random()*4)+"s";
    s.style.opacity=0.4+Math.random()*0.6;
    s.style.width=s.style.height=(1+Math.random()*2.2)+"px";
    starsEl.appendChild(s);
  }

  // parallax (pointer)
  var targetX=0,targetY=0,mx=0,my=0;
  var fine=matchMedia("(pointer:fine)").matches;
  function loop(){
    mx+=(targetX-mx)*0.06;my+=(targetY-my)*0.06;
    root.style.setProperty("--mx",(mx*0.4)+"px");
    root.style.setProperty("--my",(my*0.4*0.6)+"px");
    if(Math.abs(targetX-mx)>0.3||Math.abs(targetY-my)>0.3||!RM)requestAnimationFrame(loop);
  }
  if(fine&&!RM){
    window.addEventListener("pointermove",function(e){
      targetX=(e.clientX/window.innerWidth-0.5)*2*40;
      targetY=(e.clientY/window.innerHeight-0.5)*2*24;
    });
    requestAnimationFrame(loop);
  }
  // tilt / touch drag
  var isTouch=matchMedia("(pointer:coarse)").matches;
  if(isTouch&&typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
    var btn=document.getElementById("tiltBtn");btn.style.display="block";
    btn.addEventListener("click",function(){
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r==="granted"){
          window.addEventListener("deviceorientation",function(e){
            var g=(e.gamma||0)/45,be=((e.beta||0)-45)/45;
            targetX=Math.max(-1,Math.min(1,g))*40;
            targetY=Math.max(-1,Math.min(1,-be))*24;
          });
          btn.style.display="none";
        }
      });
    });
  }else if(isTouch&&"DeviceOrientationEvent" in window){
    window.addEventListener("deviceorientation",function(e){
      targetX=Math.max(-1,Math.min(1,(e.gamma||0)/45))*40;
      targetY=Math.max(-1,Math.min(1,((e.beta||0)-45)/45))*24;
    });
  }
  // drag pan fallback
  var dragging=false,px=0,py=0;
  document.getElementById("scene").addEventListener("pointerdown",function(e){
    if(e.target.closest(".label,.panel"))return;
    dragging=true;px=e.clientX;py=e.clientY;
  });
  window.addEventListener("pointermove",function(e){
    if(dragging&&isTouch){
      targetX+=(e.clientX-px)*0.6;targetY+=(e.clientY-py)*0.4;
      px=e.clientX;py=e.clientY;
      if(targetX>40)targetX=40;if(targetX<-40)targetX=-40;
      if(targetY>24)targetY=24;if(targetY<-24)targetY=-24;
    }
  });
  window.addEventListener("pointerup",function(){dragging=false});
})();
</script>
</body>
</html>
