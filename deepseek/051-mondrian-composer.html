<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composer — A De Stijl Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(180deg,#cfc8bb,#d9d3c7 40%,#c8c1b3 80%,#6b6358 100%);
  min-height:100vh;color:#17160f;font-family:Georgia,'Iowan Old Style',Palatino,serif;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;mix-blend-mode:multiply;opacity:.5;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.02) 0 2px,transparent 2px 6px)}
.spot{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);width:90vw;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(255,248,230,.75),transparent);}
.floor{position:fixed;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#6b6358,#5a5248);z-index:0;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:70px 24px 80px;text-align:center}
.kicker{font-family:ui-sans-serif,system-ui;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:rgba(23,22,15,.6);margin-bottom:12px}
h1{font-size:clamp(30px,4.4vw,52px);font-weight:400}
h1 i{font-style:italic}
/* easel */
.easel{
  position:relative;margin:44px auto 0;width:min(92vw,720px);aspect-ratio:1;transform:rotate(var(--tilt,0deg));
  transition:transform .8s ease;
}
.frame2{position:absolute;inset:-16px;border-radius:6px;
  background:linear-gradient(135deg,#2b2b2b,#0d0d0d 40%,#202020 70%,#050505);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.15),0 40px 80px rgba(0,0,0,.55)}
.frame2::after{content:"";position:absolute;inset:0;border-radius:6px;
  background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 30%)}
.painting{
  position:absolute;inset:0;display:grid;gap:10px;background:#1a1a1a;
  transition:grid-template-columns 1100ms cubic-bezier(.65,0,.25,1),grid-template-rows 1100ms cubic-bezier(.65,0,.25,1);
}
.cell{
  background:#f6f3ec;border:none;cursor:pointer;position:relative;min-width:0;min-height:0;
  transition:background 380ms,opacity .5s,transform .5s;
  animation:reveal .6s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay:var(--d,0ms);
}
@keyframes reveal{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.cell.red{background:#d7301f}.cell.blue{background:#1e4d9b}.cell.yellow{background:#f2c40f}.cell.black{background:#161616}
.cell.paint::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(0,0,0,.12))}
.cell.b-show{background:#f3f0e8;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.015) 0 2px,transparent 2px 4px)}
.cell:hover{transform:scale(.985)}
/* plate */
.plate{
  width:min(92vw,520px);margin:44px auto 0;background:linear-gradient(180deg,#faf7f0,#f3efe6);
  border:1px solid #c9c2b4;padding:22px 26px;text-align:left;position:relative;
  box-shadow:0 24px 50px rgba(0,0,0,.28);transition:opacity .3s;
}
.plate::before,.plate::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#b9b2a4,#6a6455);box-shadow:inset 0 1px 2px rgba(255,255,255,.5)}
.plate::before{top:9px;left:9px}.plate::after{top:9px;right:9px}
.plate .artist{font-family:ui-sans-serif,system-ui;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#6a6455}
.plate h2{font-family:Georgia,'Iowan Old Style',serif;font-style:italic;font-weight:400;font-size:clamp(18px,2.4vw,26px);margin:6px 0}
.plate .facts{display:flex;gap:18px;font-family:ui-monospace,monospace;font-size:10.5px;color:#6a6455;margin-top:6px;letter-spacing:.08em}
/* controls */
.controls{display:flex;gap:14px;justify-content:center;margin-top:40px;flex-wrap:wrap;align-items:center}
.cbtn{
  font-family:ui-sans-serif,system-ui;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  border:2px solid #17160f;color:#17160f;background:none;padding:12px 24px;cursor:pointer;
  box-shadow:4px 4px 0 rgba(23,22,15,.4);transition:all .15s linear;
}
.cbtn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(23,22,15,.4)}
.cbtn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(23,22,15,.4)}
.cbtn[aria-pressed="true"]{background:#17160f;color:#faf7f0}
.depth{display:flex;align-items:center;gap:10px;font-family:ui-sans-serif,system-ui;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.depth input{appearance:none;-webkit-appearance:none;width:110px;height:3px;background:#17160f;outline:none}
.depth input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:#d7301f;border:2px solid #17160f;cursor:pointer}
.depth b{font-family:ui-monospace,monospace;color:#17160f}
.hint{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(23,22,15,.5);margin-top:26px}
@media(prefers-reduced-motion:reduce){.painting,.cell,.easel{transition:none}.cell{animation:none}}
</style>
</head>
<body>
<div class="spot"></div>
<div class="floor"></div>
<div class="wrap">
  <p class="kicker">Staatliches Bauhaus · De Stijl · 1917–1931</p>
  <h1>The <i>Composer</i></h1>

  <div class="easel" id="easel">
    <div class="frame2"></div>
    <div class="painting" id="painting"></div>
  </div>

  <div class="plate" id="plate">
    <div class="artist">Piet Anonymous (b. 1872) · oil on canvas</div>
    <h2 id="plTitle">Composition No. IV with Red, Blue and Yellow</h2>
    <div class="facts"><span id="plYear">1924</span><span>Oil on canvas</span><span>80 × 80 cm</span></div>
  </div>

  <div class="controls">
    <button class="cbtn" id="newBtn">New composition</button>
    <button class="cbtn" id="animateBtn" aria-pressed="false">Animate</button>
    <div class="depth">Depth <input type="range" id="depth" min="2" max="7" value="5"><b id="depthV">5</b></div>
  </div>
  <div class="hint">N — new · A — animate · click a cell to cycle its colour</div>
</div>

<script>
(function(){
  "use strict";
  var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var painting=document.getElementById("painting");
  var N=16;
  var tracks={cols:[],rows:[]};
  var leaves=[],depth=5,breathing=false,composerCount=1;
  function rnd(){return Math.random()}
  function mulberry(a){a=a||3;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function randomTracks(){
    var cols=[],rows=[];
    for(var i=0;i<N;i++){
      var r=rnd();
      var v=r<0.8?(0.8+rnd()*0.5):(r<0.9?(0.45+rnd()*0.25):(1.5+rnd()*0.7));
      cols.push(v);rows.push(v);
    }
    return{cols:cols,rows:rows};
  }
  function placeLeaves(depth2){
    // recursive subdivision
    var leaves2=[];
    function split(x,y,w,h,dep){
      if(dep<=0||w<=1&&h<=1){
        leaves2.push({x:x,y:y,w:w,h:h});
        return;
      }
      var longSide=w/(w+h);
      var vertical=rnd()<longSide;
      if(vertical&&w>1){
        var p=(Math.random()<0.5?0.382:0.618)+ (rnd()-0.5)*0.3;
        p=Math.max(0.15,Math.min(0.85,p));
        var cut=Math.max(1,Math.round(w*p));
        split(x,y,cut,h,dep-1);
        split(x+cut,y,w-cut,h,dep-1);
      }else if(h>1){
        var p2=(Math.random()<0.5?0.382:0.618)+(rnd()-0.5)*0.3;
        p2=Math.max(0.15,Math.min(0.85,p2));
        var cut2=Math.max(1,Math.round(h*p2));
        split(x,y,w,cut2,dep-1);
        split(x,y+cut2,w,h-cut2,dep-1);
      }else{
        leaves2.push({x:x,y:y,w:w,h:h});
      }
    }
    split(0,0,N,N,depth2);
    return leaves2;
  }
  function paint(){
    var t=rnd();
    tracks=randomTracks();
    leaves=placeLeaves(depth);
    var gridCss=[];for(var i=0;i<N;i++)gridCss.push(tracks.cols[i]+"fr");
    var gridRss=[];for(var j=0;j<N;j++)gridRss.push(tracks.rows[j]+"fr");
    painting.style.gridTemplateColumns=gridCss.join(" ");
    painting.style.gridTemplateRows=gridRss.join(" ");
    painting.innerHTML="";
    var colors=[];
    var colorCount=0;
    leaves.forEach(function(l,li){
      var cell=document.createElement("button");
      cell.className="cell";
      cell.dataset.li=li;
      cell.style.gridColumn=(l.x+1)+" / span "+l.w;
      cell.style.gridRow=(l.y+1)+" / span "+l.h;
      cell.style.setProperty("--d",(li*28)+"ms");
      // about 16-28% painted
      var painted=li===0||rnd()<0.22;
      var col=null;
      if(painted){
        var r=rnd();
        if(r<0.28)col="red";
        else if(r<0.55)col="blue";
        else if(r<0.8)col="yellow";
        else if(r<0.92)col="black";
      }
      if(col){
        colors.push(col);
        cell.classList.add(col,"paint");
      }else{
        cell.classList.add("b-show");
      }
      cell.addEventListener("click",function(){
        var cur=this.className.match(/red|blue|yellow|black/);
        var order=["b-show","red","blue","yellow","black"];
        var idx=0;
        if(cur)idx=order.indexOf(cur[0]);
        this.className="cell "+(idx>=4?"b-show":order[idx+1])+(idx<4?"paint":"");
        if(idx<4&&idx+1!==0)colors.push(order[idx+1]);
        updatePlate();
      });
      painting.appendChild(cell);
    });
    updatePlate();
    document.getElementById("easel").style.setProperty("--tilt",((rnd()-0.5)*1.2)+"deg");
  }
  function updatePlate(){
    var hasR=!!document.querySelector(".cell.red"),hasB=!!document.querySelector(".cell.blue"),hasY=!!document.querySelector(".cell.yellow");
    var parts=[];
    if(hasR)parts.push("Red");if(hasB)parts.push("Blue");if(hasY)parts.push("Yellow");
    var n=Math.floor(1+rnd()*50);
    composerCount=n;
    document.getElementById("plTitle").textContent="Composition No. "+roman(composerCount)+" with "+(parts.join(", ")||"Plane")+", "+(hasR&&hasY?"":"").trim()+"";
    var base="Composition No. IV with Red, Blue and Yellow";
    if(parts.length===0)document.getElementById("plTitle").textContent="Tableau with Light";
    else if(parts.length===1)document.getElementById("plTitle").textContent="Tableau with "+parts[0];
    else document.getElementById("plTitle").textContent="Composition No. "+roman(composerCount)+" with "+parts.join(", ")+" and "+parts[parts.length-1];
    document.getElementById("plYear").textContent=1919+Math.floor(rnd()*24);
    // fade plate
    var p=document.getElementById("plate");
    p.style.opacity=0;
    setTimeout(function(){p.style.opacity=1},200);
  }
  function roman(n){
    var map={1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII",9:"IX",10:"X",11:"XI",12:"XII",13:"XIII",14:"XIV",15:"XV",16:"XVI",17:"XVII",18:"XVIII",19:"XIX",20:"XX",21:"XXI",22:"XXII",23:"XXIII",24:"XXIV",25:"XXV",26:"XXVI",27:"XXVII",28:"XXVIII",29:"XXIX",30:"XXX"};
    return map[n]||String(n);
  }
  // breathing
  var baseTracks=null,phase=0;
  function breath(){
    if(!breathing)return;
    phase+=0.01;
    var cols=baseTracks.cols.map(function(v,i){
      return v*(1+Math.sin(phase*2+i*1.7)*0.08+Math.sin(phase*5+i)*0.03);
    });
    var rows=baseTracks.rows.map(function(v,i){
      return v*(1+Math.sin(phase*1.9+i*2.3)*0.08+Math.sin(phase*4.7+i*1.3)*0.03);
    });
    painting.style.transition="none";
    painting.style.gridTemplateColumns=cols.map(function(v){return v+"fr"}).join(" ");
    painting.style.gridTemplateRows=rows.map(function(v){return v+"fr"}).join(" ");
    requestAnimationFrame(breath);
  }
  document.getElementById("newBtn").addEventListener("click",function(){
    if(breathing){toggleBreath(false)}
    paint();
  });
  function toggleBreath(on){
    breathing=on;
    document.getElementById("animateBtn").setAttribute("aria-pressed",on?"true":"false");
    if(on){
      baseTracks={cols:painting.style.gridTemplateColumns.replace(/fr/g,"").split(" ").map(function(x){return parseFloat(x)||1}),
        rows:painting.style.gridTemplateRows.replace(/fr/g,"").split(" ").map(function(x){return parseFloat(x)||1})};
      phase=0;
      requestAnimationFrame(breath);
    }else{
      painting.style.transition="grid-template-columns 1100ms cubic-bezier(.65,0,.25,1),grid-template-rows 1100ms cubic-bezier(.65,0,.25,1)";
      painting.style.gridTemplateColumns=tracks.cols.map(function(v){return v+"fr"}).join(" ");
      painting.style.gridTemplateRows=tracks.rows.map(function(v){return v+"fr"}).join(" ");
    }
  }
  document.getElementById("animateBtn").addEventListener("click",function(){
    if(RM){return}
    toggleBreath(!breathing);
  });
  var depthEl=document.getElementById("depth");
  depthEl.addEventListener("input",function(){
    depth=+this.value;
    document.getElementById("depthV").textContent=depth;
    paint();
  });
  window.addEventListener("keydown",function(e){
    if(e.key==="n"||e.key==="N")document.getElementById("newBtn").click();
    if(e.key==="a"||e.key==="A")document.getElementById("animateBtn").click();
  });
  paint();
})();
</script>
</body>
</html>
