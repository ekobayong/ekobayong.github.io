<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valley of Paper — A Cut-Paper Dark Dusk</title>
<style>
  :root{
    --sky1:#3b2a5c; --sky2:#c9698a; --sky3:#f7b26a;
    --sun:#ffd28a; --cloud:#f7d5c4; --moon:#f0e9f6;
    --b1:#a98bc0; --b2:#8b6a9c; --c1:#6a4f83; --d1:#4f3a6b; --e1:#3a2a54; --f1:#2b1f44; --gh:#1d1633;
    --stars:0; --sunY:0px; --moonY:-26px; --win:rgba(255,199,108,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--sky1)}
  body{overflow:hidden}
  .scene{position:fixed;inset:0;overflow:hidden;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 76%);
    transition:background .7s}
  svg.v{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:auto;height:100%;overflow:visible}

  .dp1{filter:drop-shadow(0 4px 3px rgba(14,8,28,.35))}
  .dp2{filter:drop-shadow(0 7px 6px rgba(10,5,22,.42))}
  .dp3{filter:drop-shadow(0 10px 9px rgba(8,4,18,.5))}
  .sh{transition:transform .85s cubic-bezier(.25,.9,.3,1);will-change:transform}
  #stars>*{animation:twi 2.6s ease-in-out infinite alternate}
  @keyframes twi{from{opacity:.18}to{opacity:1}}
  .winlit{transition:fill .5s}

  .ui{--paper:#f8eddc;--ink:#3c2a2a;--dim:#7a5640;
    font-family:ui-rounded,'SF Pro Rounded','Hiragino Maru Gothic ProN','Arial Rounded MT Bold',Segoe UI,system-ui,-apple-system}
  .lbl{position:fixed;top:22px;left:20px;z-index:40;background:var(--paper);color:var(--ink);border-radius:8px;
    padding:11px 20px 13px;box-shadow:0 18px 44px rgba(14,7,26,.55);transform:rotate(-1.2deg);
    transition:transform .4s cubic-bezier(.34,1.5,.6,1);animation:lrise .9s cubic-bezier(.22,1,.38,1) both}
  .lbl::before{content:"";position:absolute;top:-9px;left:7%;right:7%;height:21px;background:rgba(185,158,104,.4);transform:rotate(1.3deg)}
  .lbl h1{font-weight:900;font-size:clamp(1.4rem,3.4vw,2.35rem);line-height:1;letter-spacing:.01em}
  .lbl .s{font-family:ui-sans-serif,system-ui;font-weight:800;font-size:.6rem;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-top:6px}
  .lbl:hover{transform:rotate(-.3deg) translateY(-2px)}
  @keyframes lrise{from{opacity:0;transform:translateY(20px) rotate(-2.3deg)}to{opacity:1}}
  .pnl{position:fixed;right:20px;bottom:16px;z-index:40;background:var(--paper);color:var(--ink);border-radius:7px;
    width:min(268px,92vw);padding:13px 17px 9px;transform:rotate(.8deg);box-shadow:0 18px 48px rgba(14,7,26,.6);
    animation:prise 1s cubic-bezier(.22,1,.38,1) .1s both}
  @keyframes prise{from{opacity:0;transform:translateY(22px) rotate(1.7deg)}to{opacity:1}}
  html.night .ui{--paper:#e9dcc4;--ink:#221a1c;--dim:#5c463a}
  .rw{display:flex;justify-content:space-between;align-items:baseline}
  .rw b{font-family:ui-sans-serif,system-ui;font-weight:800;font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  .rw .clk{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:.84rem}
  .swr{position:relative;height:11px;border-radius:99px;margin:13px 0 8px;
    background:linear-gradient(90deg,#ffeab1,#ff9d76 18%,#cd6d94 45%,#96529c 68%,#1c2d5c 87%,#070e2b)}
  .swr input{position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;opacity:0}
  .swr .th{position:absolute;top:-4px;left:8px;width:19px;height:19px;border-radius:50%;background:var(--paper);border:3px solid #3c2a2a;transition:left .05s,background .5s;pointer-events:none}
  .tkl{display:flex;justify-content:space-between}
  .tkl i{font-style:normal;font-family:ui-sans-serif,system-ui;font-weight:700;color:var(--dim);text-transform:uppercase;font-size:.46rem;letter-spacing:.05em}
  .no{margin-top:8px;font-family:ui-sans-serif,system-ui;text-align:center;font-weight:700;color:var(--dim);font-size:.56rem;text-transform:uppercase;letter-spacing:.05em}
  .ut{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);z-index:60;display:none;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,system-ui;font-weight:700;font-size:.74rem;padding:11px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(10,5,20,.5);cursor:pointer}
  body.coarse.hasgyro .ut{display:block}
  @media (max-width:640px){.pnl{left:12px;right:12px;bottom:12px;width:auto}.lbl{left:12px;top:12px}}
  @media (prefers-reduced-motion:reduce){#stars>*{animation:none}.sh{transition:none}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <svg class="v" id="v" viewBox="0 0 900 600" preserveAspectRatio="xMidYMax slice">
    <defs>
      <radialGradient id="sg"><stop offset="0" stop-color="#fffae8" stop-opacity=".95"/><stop offset=".32" stop-color="var(--sun)"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <mask id="mkm"><circle cx="180" cy="130" r="52" fill="#fff"/><circle cx="208" cy="142" r="48" fill="#000"/></mask>
      <symbol id="ps" viewBox="0 0 60 150"><path d="M30 4 L44 40 L35 41 L52 90 L43 91 L60 148 L0 148 L17 91 L8 90 L25 41 L16 40 Z"/></symbol>
    </defs>

    <!-- stars -->
    <g id="stars" style="opacity:var(--stars,0)"></g>

    <!-- sun : sinks -->
    <g style="transform:translateY(var(--sunY,0px))">
      <circle cx="660" cy="250" r="230" fill="url(#sg)"/>
      <circle cx="660" cy="250" r="50" fill="var(--sun)"/>
    </g>
    <!-- moon : crescent rises -->
    <g style="transform:translateY(var(--moonY,0px))">
      <circle cx="180" cy="130" r="50" fill="var(--moon)" mask="url(#mkm)"/>
    </g>

    <!-- clouds x3 (paper blobs) drift via wrapper inline transform replaced each fn -->
    <g id="cloudbank">
      <path class="cld" fill="var(--cloud)" opacity=".98" d="M500 320C528 300 600 304 640 330C672 304 736 312 762 344C782 370 748 390 706 386C640 398 552 396 512 380C486 356 478 334 500 320Z"/>
      <path class="cld" fill="var(--cloud)" opacity=".9" d="M150 250C182 228 244 236 252 268C280 232 348 230 372 266C396 234 466 240 472 274C482 302 458 322 412 312C380 322 286 320 244 312C202 300 132 290 132 262C128 244 136 226 150 250Z"/>
      <path class="cld" fill="var(--cloud)" opacity=".85" d="M400 120C420 100 484 106 500 128C528 96 600 98 628 126C656 96 724 104 748 132C760 156 736 170 694 166C656 186 574 180 524 168C480 162 384 156 384 138C382 126 390 118 400 120Z"/>
    </g>

    <!-- sheet 1 far sunlit alpine -->
    <g class="sh dp1" data-d="6"><path fill="var(--b1)" d="M0 150L110 60 200 140 300 20 420 150 540 60 660 150 780 70 900 150 900 600 0 600Z"/></g>
    <!-- sheet 2 -->
    <g class="sh dp1" data-d="10"><path fill="var(--b2)" d="M-2 220L110 140 240 220 380 120 520 230 670 150 800 240 902 200 902 600-2 600Z"/></g>
    <!-- sheet 3 + pine line -->
    <g class="sh dp2" data-d="16" fill="var(--c1)">
      <path d="M0 300c120-20 240 10 360-10 120-20 260 40 380 10 110-28 200 2 300 20l10 280H0Z"/>
      <use href="#ps" x="140"  y="-40"/>
      <use href="#ps" x="210"/>
      <use href="#ps" x="260" y="-60"/>
      <use href="#ps" x="340"/>
      <use href="#ps" x="470" y="-50"/>
      <use href="#ps" x="620" y="10"/>
      <use href="#ps" x="700" y="-60"/>
    </g>

    <!-- sheet 4 nearer forest hill -->
    <g class="sh dp2" data-d="24" fill="var(--d1)">
      <path d="M0 400c180-34 380-6 560-26 160-18 320 46 480 30l-40 196H0Z"/>
    </g>

    <!-- sheet 5 near hill with larger pines + cabin -->
    <g class="sh dp3" data-d="40" fill="var(--e1)">
      <path d="M0 470c240-34 460-6 700-30 120-16 220 16 320 10l-20 150H0Z"/>
      <!-- two big pines -->
      <g transform="translate(120 280) scale(2)"><use href="#ps"/></g>
      <g transform="translate(690 300) scale(2.2)"><use href="#ps"/></g>
    </g>

    <!-- cabin (fits on sheet5 / taken from foreground) -->
    <g class="sh dp3" data-d="50">
      <g fill="var(--f1)">
        <!-- chimney + roof -->
        <path d="M560 300h26v26h-26z"/>
        <path d="M520 700c14-20 110-20 130 4l-20 176H520Z"/>
      </g>
      <rect x="586" y="592" width="72" height="70" fill="var(--f1)"/>
      <rect class="winlit" x="598" y="610" width="15" height="15" fill="var(--win)"/>
      <rect class="winlit" x="630" y="610" width="15" height="15" fill="var(--win)"/>
    </g>

    <!-- foreground ground strip with deer -->
    <g class="sh dp3" data-d="64" fill="var(--gh)">
      <path d="M0 560c270-34 560-20 900 0v-40H0Z"/>
    </g>
  </svg>
</div>

<button class="ut" id="tiltBtn" type="button">Enable tilt parallax</button>
<div class="ui lbl"><h1>Valley of Paper</h1><div class="s">a cut-paper dusk · move to look</div></div>
<div class="ui pnl">
  <div class="rw"><b>Time of day</b><span class="clk" id="clk">18:40</span></div>
  <div class="swr"><div class="th" id="thumb"></div><input type="range" id="tod" min="0" max="1000" step="1" value="0"></div>
  <div class="tkl"><i>Golden dusk</i><i>Twilight</i><i>Blue night</i></div>
  <div class="no">slide &amp; drag the dusk · near sheets glide farthest</div>
</div>

<script>
(function(){
  'use strict';
  var reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // ---- stars placed here (deterministic seed) ----
  var svg=document.getElementById('v');
  var starBox=document.getElementById('stars');
  var seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  (function(){
    var frag=document.createDocumentFragment(); var i,x,y,r,c,del;
    var ns='http://www.w3.org/2000/svg';
    for(i=0;i<140;i++){
      x=Math.round(40+rnd()*820); y=Math.round(4+rnd()*220); r=(0.5+rnd()*1.1).toFixed(2);
      c=document.createElementNS(ns,'circle'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
      c.setAttribute('fill','#fff'); c.style.animationDelay=(rnd()*3)+'s'; c.style.animationDuration=(1.6+rnd()*2)+'s';
      frag.appendChild(c);
    }
    starBox.appendChild(frag);
  })();

  // ---- palettes : dusk & night for each CSS var ----
  // We'll interpolate many vars between a dusk and a night hex.
  function hx(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
  function css(rgb){return 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')'}
  function mix(a,b,t){t=t*t*(3-2*t);return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}
  var D={sky:['#3b2a5c','#c9698a','#f7b26a'],sun:'#ffd28a',cloud:'#f7d5c4',moon:'#f0e9f6',
    b1:'#a98bc0',b2:'#8b6a9c',c1:'#6a4f83',d1:'#4f3a6b',e1:'#3a2a54',f1:'#2b1f44',gh:'#1d1633'};
  var N={sky:['#050a1e','#0f1c44','#24356a'],sun:'#ff9a5a',cloud:'#3a4a7a',moon:'#e6ecff',
    b1:'#394a7a',b2:'#2b3a6b',c1:'#22305c',d1:'#1a2548',e1:'#111a36',f1:'#0b1126',gh:'#060a1c'};
  var vars=['sun','cloud','moon','b1','b2','c1','d1','e1','f1','gh'];
  var root=document.documentElement;

  function apply(v){ // v 0..1 dusk(0)->night(1)
    var i;
    for(i=0;i<3;i++) root.style.setProperty('--sky'+(i+1),css(mix(hx(D.sky[i]),hx(N.sky[i]),v)));
    for(i=0;i<vars.length;i++) root.style.setProperty('--'+vars[i],css(mix(hx(D[vars[i]]),hx(N[vars[i]]),v)));
    // transition band
    var s=Math.max(0,Math.min(1,(v-0.35)/0.5)); // stars fade in 35%..85% of slider
    root.style.setProperty('--stars',s.toFixed(3));
    // sun & moon vertical motion (same as far dusk slider)
    root.style.setProperty('--sunY',(-60+Math.round(520*v))+'px');   // sinks
    root.style.setProperty('--moonY',(-400+Math.round(430*v))+'px'); // rises up (negative = up)
    // cabin windows warm up as scene darkens
    var a=v*1; root.style.setProperty('--win','rgba(255,199,108,'+(0.13+0.7*v).toFixed(2)+')');
    // night tweaks UI (could do in main)
    document.documentElement.classList.toggle('night', v>0.62);
  }

  // slider maps value 0..1000 -> night fraction 0..1
  var slider=document.getElementById('tod'), thumb=document.getElementById('thumb');
  var clockEl=document.getElementById('clk'); var dragY=null;
  function fmtClock(){ // 18:40 -> 23:59 mapped from value
    var v=slider.value/1000, mins=(18*60+40)+Math.round(v*( (23*60+59)-(18*60+40) ));
    var h=Math.floor(mins/60),m=mins%60; return pad(h)+':'+pad(m);
  }
  function pad(n){return (n<10?'0':'')+n}
  function refresh(){
    apply(slider.value/1000);
    clockEl.textContent=fmtClock();
    // thumb percent
    var pct=(slider.value/1000)*100;
    thumb.style.left='calc('+pct+'% - 9px)'; // approx via track width
  }
  slider.addEventListener('input',refresh); refresh();

  // initially "dusk" starting at value 0 style above.

  // ---- parallax: pointer offset + per-sheet depth ----
  var sheets=[].slice.call(svg.querySelectorAll('.sh'));
  var mx=0,my=0,cx=0,cy=0, allow=!reduced;
  function pmove(e){ mx=(e.clientX/innerWidth-0.5)*2; my=(e.clientY/innerHeight-0.5)*2; }
  function orient(gamma,beta){ // device tilt for coarse: gamma left-right beta up-down centred ~0 on hold neutral
    mx=Math.max(-1,Math.min(1,gamma/24)); my=Math.max(-1,Math.min(1,(beta-45)/24)); }
  document.addEventListener('pointermove',pmove);
  if(coarse() && window.DeviceOrientationEvent){
    var tiltBtn=document.getElementById('tiltBtn');
    if(typeof DeviceOrientationEvent!=='undefined' && 'requestPermission' in DeviceOrientationEvent){
      document.body.classList.add('hasgyro');
      tiltBtn.addEventListener('click',function(){ DeviceOrientationEvent.requestPermission().then(function(res){ if(res==='granted') window.addEventListener('deviceorientation',function(ev){orient(ev.gamma||0,ev.beta||0)}); }); });
    } else {
      window.addEventListener('deviceorientation',function(ev){ if(ev)orient(ev.gamma||0,ev.beta||0); });
    }
  }
  function coarse(){return matchMedia('(pointer:coarse)').matches || matchMedia('(hover:none)').matches}

  if(allow){
    (function anim(){ requestAnimationFrame(anim);
      cx+=(mx-cx)*0.06; cy+=(my-cy)*0.06;
      sheets.forEach(function(s){
        var d=+s.getAttribute('data-d'); if(!d)return;
        var x=cx*0.3*d, y=cy*0.18*d;  // px offsets per depth unit
        s.style.transform='translate('+(cx*d*2.4).toFixed(2)+'px,'+(cy*d*1.4).toFixed(2)+'px)';
      });
    })();
  }
})();
</script>
</body>
</html>
