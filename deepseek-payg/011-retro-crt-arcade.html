<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON DRIFT — Attract Mode 1987</title>
<style>
  :root{
    --bg0:#050507; --bg1:#1b1b22;
    --bezel:#2a2a2e; --bezelD:#141416; --bezelX:#0b0b0d;
    --amber:#ffb347; --green:#39ff6a; --greenD:#1f8a3c;
    --cyan:#2bd8ff; --mag:#ff3cac; --yellow:#fff35c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(120% 90% at 50% 115%,#1b1b22 0%,#101015 40%,#050507 75%);
    font-family:'Courier New',ui-monospace,Menlo,monospace;color:var(--green);display:flex;align-items:center;justify-content:center;padding:16px}
  .room{display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px}

  /* bezel */
  .cab{position:relative;width:100%;background:linear-gradient(180deg,#2a2a2e,#141416 30%,#0b0b0d);
    border-radius:10px;padding:26px 30px 30px;box-shadow:0 60px 120px -20px rgba(0,0,0,.9),0 30px 50px rgba(0,0,0,.6),0 4px 0 #3b3b40, inset 0 1px 0 rgba(255,255,255,.06)}
  .cab::after{content:"";position:absolute;inset:8px;border-radius:6px;pointer-events:none;
    background:linear-gradient(140deg,rgba(255,255,255,.05),transparent 24%);}
  .lamp{position:absolute;top:12px;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 18px 3px rgba(255,179,71,.8),0 0 40px 10px rgba(255,179,71,.3);animation:pulseA 2s ease-in-out infinite}
  .lamp.l{left:16px}.lamp.r{right:16px;animation-delay:1s}
  @keyframes pulseA{50%{opacity:.5;box-shadow:0 0 8px 1px rgba(255,179,71,.5)}}
  .badge{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.28);font-family:ui-sans-serif,system-ui,sans-serif}

  /* screen */
  .crt{position:relative;background:#020603;border-radius:14px/9px;overflow:hidden;aspect-ratio:5/4;
    box-shadow:inset 0 0 60px rgba(0,0,0,.9), inset 0 0 12px rgba(0,0,0,.8);margin-top:4px}
  .glass{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;
    animation:flick 6s steps(1) infinite;pointer-events:none}
  /* CRT overlays */
  .ov{position:absolute;inset:0;pointer-events:none}
  .scan{background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.28) 2px 3px);}
  .grille{background:repeating-linear-gradient(90deg,rgba(255,0,0,.06) 0 1px,rgba(0,255,0,.06) 1px 2px,rgba(0,0,255,.09) 2px 3px);opacity:.8}
  .roll{height:14%;background:linear-gradient(180deg,transparent,rgba(140,255,170,.06),transparent);top:-15%;animation:rollv 7s linear infinite}
  @keyframes rollv{to{transform:translateY(800%)}}
  @keyframes flick{0%,100%{opacity:1}3%{opacity:.96}6%{opacity:1}79%{opacity:1}81%{opacity:.93}84%{opacity:1}}
  .sheen{background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.05) 47%,transparent 53%)}
  .vig{background:radial-gradient(120% 130% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}

  /* content (pointer events enabled normally but overlays are none) */
  .cinner{position:relative;z-index:4;height:100%;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden}
  .cinner *{pointer-events:auto}

  /* logo - pixel bitmap drawn via box-shadow per row, we render 3 wrapper rows with box-shadow glyphs simplified */
  .logohead{text-align:center;margin-bottom:4px;flex:none}
  .logo{font-weight:bold;letter-spacing:.04em;font-size:clamp(1.6rem,6vw,2.6rem);color:var(--cyan);
    text-shadow:0 0 8px rgba(43,216,255,.7);animation:huerot 12s linear infinite;white-space:nowrap}
  @keyframes huerot{to{filter:hue-rotate(360deg)}}
  .tagline{color:var(--cyan);font-size:.62rem;letter-spacing:.16em;text-shadow:0 0 6px rgba(43,216,255,.5);margin-bottom:6px}

  /* attract two-column */
  .attract{flex:1;display:flex;gap:12px;min-height:0}
  .col{flex:1;border:1px solid rgba(31,138,60,.4);padding:8px;display:flex;flex-direction:column;min-width:0;background:rgba(0,0,0,.2)}
  .col .cap{font-size:.55rem;letter-spacing:.14em;color:var(--greenD);margin-bottom:6px;text-align:center}
  .menu{list-style:none;display:flex;flex-direction:column;gap:2px;justify-content:center}
  .menu li{padding:7px 8px;font-size:.72rem;color:var(--greenD);cursor:pointer;display:flex;align-items:center;gap:6px;letter-spacing:.03em}
  .menu li.sel{color:var(--green);background:rgba(57,255,106,.08);transform:translateX(6px);text-shadow:0 0 6px rgba(57,255,106,.6)}
  .menu li .tri{visibility:hidden;color:var(--mag);text-shadow:0 0 6px rgba(255,60,172,.7);animation:blink .6s steps(1) infinite}
  .menu li.sel .tri{visibility:visible}
  @keyframes blink{50%{opacity:0}}
  .menu li.flash{background:var(--green);color:#02110a;text-shadow:none;animation:flashok 2 steps(2) }
  @keyframes flashok{50%{background:transparent;color:var(--green)}}

  .scorebox{display:flex;flex-direction:column;font-size:.6rem}
  .page label{color:var(--mag);letter-spacing:.08em;display:block;text-align:center;font-size:.52rem;margin-bottom:4px}
  .srow{display:grid;grid-template-columns:1fr 2fr 1.4fr;gap:4px;padding:3px 4px;animation:slidein .3s steps(4) both}
  @keyframes slidein{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
  .srow b{color:var(--amber);font-weight:normal;text-shadow:0 0 5px rgba(255,179,71,.4)}
  .srow span{color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 5px rgba(43,216,255,.4);text-align:right}

  .foot{flex:none;display:flex;justify-content:space-between;align-items:baseline;font-size:.6rem;margin-top:8px;color:var(--greenD)}
  .foot .coin{color:var(--yellow);text-shadow:0 0 6px rgba(255,243,92,.6);animation:blink 1s steps(1) infinite}
  .foot .cred{color:var(--amber);font-variant-numeric:tabular-nums}
  .foot .copy{font-size:.48rem;color:var(--greenD);opacity:.6}

  /* game */
  .game{display:none;flex:1;flex-direction:column;min-height:0;position:relative}
  .game canvas{flex:1;width:100%;min-height:0;background:transparent;display:block}
  .toastwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .toast{color:var(--mag);font-size:clamp(1rem,4vw,1.6rem);letter-spacing:.12em;text-shadow:0 0 12px rgba(255,60,172,.8);opacity:0;transition:opacity .1s}
  .toast.on{opacity:1}
  .htop{display:flex;justify-content:space-between;font-size:.6rem;padding-bottom:4px;color:var(--greenD)}
  .htop .lives{color:var(--green);letter-spacing:.2em}
  .htop .scr{color:var(--cyan);font-variant-numeric:tabular-nums}

  @media (max-width:640px){.col{min-width:0}.menu li{font-size:.6rem}.scorebox{font-size:.52rem}.srow{font-size:.6rem}}
  @media (prefers-reduced-motion:reduce){ *,*::before{animation:none!important} .roll{display:none} }
</style>
</head>
<body>
  <div class="room">
    <div class="cab">
      <div class="lamp l"></div><div class="lamp r"></div>
      <div class="crt">
        <div class="ov scan"></div><div class="ov grille"></div><div class="ov roll"></div><div class="ov sheen"></div><div class="ov vig"></div>

        <div class="cinner">

          <!-- ATTRACT MODE -->
          <div class="attract" id="attract">
            <div class="logohead">
              <div class="logo" id="logo">NEON DRIFT</div>
              <div class="tagline" id="tagline">// ATTRACT MODE — 1987 //</div>
            </div>
            <div class="col">
              <div class="menu" id="menu">
                <li data-a="1P START — PADDLE"><span class="tri">▶</span>1P START — PADDLE</li>
                <li data-a="VIEW RANKINGS"><span class="tri">▶</span>VIEW RANKINGS</li>
                <li data-a="SHUFFLE TABLE"><span class="tri">▶</span>SHUFFLE TABLE</li>
                <li data-a="CREDITS"><span class="tri">▶</span>CREDITS</li>
              </div>
            </div>
            <div class="col">
              <div class="cap">TODAY'S HI-SCORES</div>
              <div class="scorebox" id="scorebox">
                <label id="ranklabel">— RANK 1–5 —</label>
                <div id="srows"></div>
              </div>
            </div>
          </div>

          <!-- GAME -->
          <div class="game" id="game">
            <div class="htop"><span class="lives" id="lives"></span><span class="scr">SCORE <b id="score">0000000</b></span></div>
            <div id="gamecvs"><canvas id="paddle"></canvas></div>
            <div class="toastwrap"><div class="toast" id="toast"></div></div>
          </div>

          <div class="foot">
            <span class="coin" id="coinBtn" style="cursor:pointer;user-select:none">● INSERT COIN</span>
            <span class="cred" id="cred">CREDIT 0</span>
            <span class="copy">© 1987 Voltage Works</span>
          </div>
        </div>
      </div>
      <div class="badge">Voltage Works · Model VW-25 · Made in Osaka</div>
    </div>
  </div>

<script>
  (function(){
    var reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    var $=function(s){return document.querySelector(s)};
    var items=[].slice.call(document.querySelectorAll('#menu li'));
    var credits=0, pageIdx=0, onAttract=true;
    var green='#39ff6a';

    /* ---------- attract scoreboard ---------- */
    var pages=[
      [['AAA',1200000],['KOA',980500],['ZIG',721000],['MTX',640200],['BOB',510050]],
      [['LAI',450000],['DOK',390000],['SUS',241900],['RKI',198000],['ANA',120400]],
      [['TEN',90000],['ONE',5040],['RAN',1000],[' ? ',0],[' ? ',0]]
    ];
    function zfill(n,w){n=String(n);while(n.length<w)n='0'+n;return n}
    function renderPage(){
      $('#ranklabel').textContent='— RANK '+(pageIdx*5+1)+'–'+(pageIdx*5+5)+' —';
      var html=''; pages[pageIdx].forEach(function(r,i){
        html+='<div class="srow"><b>'+zfill(i+1+pageIdx*5,2)+'</b><b style="text-align:center">'+r[0]+'</b><span>'+zfill(r[1],7)+'</span></div>';
      });
      $('#srows').innerHTML=html;
    }
    renderPage();
    setInterval(function(){ if(onAttract&&!reduced){pageIdx=(pageIdx+1)%pages.length;renderPage();} },4000);

    /* ---------- menu - toasts & credit ---------- */
    var toastTimer=null;
    function showToast(t){
      var el=$('#toast'); el.textContent=t||''; el.classList.add('on');
      clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('on')},950);
    }
    function addCredit(){ credits++; $('#cred').textContent='CREDIT '+credits; showToast('CREDIT '+credits); }
    $('#coinBtn').addEventListener('click',addCredit);
    document.addEventListener('keydown',function(e){ if((e.key==='c'||e.key==='C')&&!GAME_ON){ addCredit(); } });

    function selectMenu(i){ items.forEach(function(li,x){li.classList.toggle('sel',x===i)}); }
    selectMenu(0);
    items.forEach(function(li,x){
      li.addEventListener('mouseenter',function(){ selectMenu(x); });
      li.addEventListener('click',function(){ activate(x); });
    });
    function activate(x){
      var li=items[x]; li.classList.add('flash'); setTimeout(function(){li.classList.remove('flash')},220);
      if(x===3){ showToast('VOLTAGE WORKS 1987'); return; }
      if(x===2){ shuffleScores(); return; }
      if(x===1){ showToast('VIEW RANKINGS — PRESS 1P'); return; }
      if(credits<=0){ showToast('INSERT COIN'); return; }
      credits--; $('#cred').textContent='CREDIT '+credits; startGame();
    }
    function shuffleScores(){
      pages[0].sort(function(){return Math.random()-.5}); renderPage(); showToast('SHUFFLED');
    }

    /* ---------- paddle game ---------- */
    var GAME_ON=false, canvas=$('#paddle'), ctx=canvas.getContext('2d');
    var W=0,H=0,dpr=1, score=0, lives_=3, state='ready';
    var ball={},paddle={w:60,h:12,x:0,y:0},bricks=[],trail=[],keys={};
    $('#coinBtn');
    function resize(){
      var box=$('#gamecvs'); W=box.clientWidth||360; H=box.clientHeight||260;
      dpr=Math.min(2,devicePixelRatio||1);
      canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function resetSprite(){
      paddle={w:60,h:12,x:W/2,y:0};
      resetBall();
    }
    function resetBall(){ ball={x:W/2,y:H*0.72,r:5,vx:(Math.random()<.5?-1:1)*2.4,vy:-2.8}; trail=[]; }
    function buildBricks(){
      bricks=[]; var cols=8,cw=Math.floor((W-16)/cols), rows=3, colors=['#ff3cac','#2bd8ff','#fff35c'];
      for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)
        bricks.push({x:8+c*cw,y:14+r*20,w:cw-3,h:14,alive:true,color:colors[r%3]});
    }
    function updateHud(){
      $('#score').textContent=zfill(Math.round(score),7);
      $('#lives').textContent=''; for(var i=0;i<lives_;i++)$('#lives').textContent+='◆';
    }
    function startGame(){
      GAME_ON=true; onAttract=false; score=0; lives_=3; state='ready';
      $('#attract').style.display='none'; $('#game').style.display='flex';
      resize(); resetSprite(); buildBricks(); updateHud(); showToast('READY');
    }
    function gameOver(){
      state='over'; GAME_ON=false; onAttract=true; showToast('GAME OVER');
      setTimeout(function(){ $('#game').style.display='none'; $('#attract').style.display=''; },1800);
    }
    function pointer(e){
      if(!GAME_ON||!canvas)return; var r=canvas.getBoundingClientRect(); var x=(e.touches?e.touches[0].clientX:e.clientX)-(r.left);
      paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,x));
      if(state==='ready'){ball.x=paddle.x;}
      if(state==='ready'){ball.y=H-26;}
    }
    canvas.addEventListener('mousemove',pointer);
    canvas.addEventListener('touchmove',function(e){e.preventDefault();pointer(e)},{passive:false});
    document.addEventListener('keydown',function(e){
      if(!GAME_ON)return;
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){keys.left=true;e.preventDefault();}
      if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){keys.right=true;e.preventDefault();}
      if((e.key===' '||e.key==='Enter')&&state==='ready')state='play';
      if(e.key===' '){e.preventDefault(); }
      // allow arrows to also act via movement by setting .x
    });
    document.addEventListener('keyup',function(e){ if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false; if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false; });

    var last=performance.now();
    function frame(now){
      var dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
      if(GAME_ON){
        if(W===0)resize();
        if(keys.left)paddle.x=Math.max(paddle.w/2,paddle.x-260*dt);
        if(keys.right)paddle.x=Math.min(W-paddle.w/2,paddle.x+260*dt);

        if(state==='ready'){ ball.x=paddle.x; ball.y=H-26; }
        else if(state==='play'){
          ball.x+=ball.vx*60*dt; ball.y+=ball.vy*60*dt;
          trail.push({x:ball.x,y:ball.y}); if(trail.length>10)trail.shift();
          if(ball.x<ball.r){ball.x=ball.r;ball.vx=-ball.vx;}
          if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-ball.vx;}
          if(ball.y<ball.r){ball.y=ball.r;ball.vy=-ball.vy;}

          // paddle collision
          var py=H-24;
          if(ball.vy>0&&ball.y+ball.r>=py&&ball.y+ball.r<=py+16&&ball.x>paddle.x-paddle.w/2&&ball.x<paddle.x+paddle.w/2){
            ball.y=py-ball.r; // paddleH
            var rel=(ball.x-paddle.x)/(paddle.w/2);
            ball.vx=rel*4.2; ball.vy=-Math.abs(ball.vy)*1.05; if(Math.abs(ball.vy)>5)ball.vy=Math.sign(ball.vy)*5;
            score+=5; updateHud();
          }
          // bricks
          var any=false; var hit=false;
          for(var i=0;i<bricks.length;i++){var b=bricks[i]; if(!b.alive)continue; any=true;
            if(!hit&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){
              b.alive=false; ball.vy=-ball.vy; ball.vx*=1.03; ball.vy*=1.03; score+=25; hit=true; updateHud();
            }
          }
          if(!any){ // cleared
            showToast('STAGE CLEAR'); buildBricks(); state='play'; resetBall();
          }
          if(ball.y>H+12){
            lives_--; updateHud();
            if(lives_<=0){ gameOver(); frame=null; requestAnimationFrame(frame); return; }
            state='ready'; resetBall(); showToast('MISS');
          }
          // trail fade
          for(var t=0;t<trail.length;t++){trail[t].a=(t+1)/trail.length;}
        }
        draw();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function draw(){
      ctx.clearRect(0,0,W,H);
      // grid
      ctx.strokeStyle='rgba(57,255,106,.07)'; ctx.lineWidth=1;
      for(var x=0;x<=W;x+=18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(var y=0;y<=H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      for(var i=0;i<bricks.length;i++){var b=bricks[i]; if(!b.alive)continue;
        ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(b.x,b.y,b.w,2.5); }
      for(var t=0;t<trail.length;t++){ var tr=trail[t];
        ctx.fillStyle='rgba(57,255,106,'+(trail[t].a*0.10).toFixed(3)+')'; ctx.beginPath(); ctx.arc(tr.x,tr.y,4,0,7); ctx.fill(); }
      // ball
      ctx.fillStyle='#fff35c'; ctx.shadowColor='#fff35c'; ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill(); ctx.shadowBlur=0;
      // paddle
      var py=H-24; ctx.fillStyle=green; ctx.shadowColor=green; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.rect(paddle.x-paddle.w/2,py,paddle.w,paddle.h); ctx.fill(); ctx.shadowBlur=0;
      // lives drawn in hud DOM
    }
    window.addEventListener('resize',function(){ if(GAME_ON)resize(); });
    // Prevent default touch scrolling on canvas
    canvas.style.touchAction='none';
  })();
</script>__SCRIPT_BODY__

</body>
</html>
